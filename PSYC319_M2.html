itory control showed deficits long after adoption, but rule acquisition and planning were spared: another example of differential plasticity.","n":[["k","Spared: rule acquisition + planning."],["x","Persisting deficits: attention, working memory, inhibition."]],"v":"plast","vp":"f"},{"id":"s3q64","s":3,"t":"R","q":"What does Norwegian research on internationally adopted children show about language?","a":"Everyday language comes quickly; abstract school language is harder","d":["Abstract school language comes more easily than everyday language","No new language is acquired until adolescence","Language recovers fully in every context within months","Children rarely learn the adoptive country’s language well"],"e":"Early-adopted children acquire contextual, everyday language rapidly, but have more difficulty with the abstract language typical of school (Dalen, 2005).","n":[["k","Everyday language: fast. Abstract school language: harder."]],"v":"plast","vp":"f"},{"id":"s3q65","s":3,"t":"R","q":"According to Brodzinsky et al. (2022), how does attachment show differential plasticity?","a":"Attachment behaviours normalize; inner representations change more slowly","d":["Representations change quickly, but behaviours never normalize","Neither attachment behaviours nor representations change","Attachment recovers only in children adopted after age 4","Behaviours and representations recover at exactly the same rate"],"e":"Children adopted later can form secure attachments behaviourally, but representations of self and others change more slowly and can keep improving into adulthood.","n":[["k","Behaviour normalizes first; inner representations lag."]],"v":"plast","vp":"f"},{"id":"s3q66","s":3,"t":"R","q":"Which brain measure DOES recover after placement in a supportive family, according to Brodzinsky et al. (2022)?","a":"White matter volume and tract integrity","d":["Total gray matter volume across the cortex","Cortical thickness in frontal regions","Overall brain volume, including gray matter","Hippocampal volume measured in adolescence"],"e":"Gray matter volume and cortical thickness don’t appear to improve, but white matter volume and tract integrity do recover. Recovery may largely mean using surviving circuits more effectively.","n":[["k","White matter recovers; gray matter doesn’t."],["m","White = wiring insulation → can be re-wrapped"]],"v":"plast","vp":"f"},{"id":"s3q67","s":3,"t":"R","q":"Which genes have been proposed as “plasticity genes”?","a":"DRD4 7-repeat, serotonin transporter short allele, BDNF","d":["BRCA1, APOE4, and the HLA-B27 immune gene variant","FOXP2, MECP2, and FMR1 language and development genes","Genes on the Y chromosome plus mitochondrial DNA","Genes that control eye colour, height, and blood type"],"e":"Variants in dopamine (DRD4 7-repeat), serotonin (transporter short allele), and neurotrophic (BDNF Val66Met) systems have been proposed as plasticity genes, linked to impairment in adversity and possibly greater responsiveness to improved conditions.","n":[["k","Plasticity genes: DRD4-7R, 5-HTT short, BDNF Val66Met."]],"v":"ds","vp":"f"},{"id":"s3q68","s":3,"t":"LR","q":"How does differential susceptibility differ from diathesis–stress?","a":"Sensitive individuals do worse in adversity AND better in supportive conditions","d":["Vulnerable individuals do worse in adversity but gain nothing from support","Everyone responds equally to adversity and to support","Sensitive individuals do better in adversity and worse with support","Only individuals with no genetic risk benefit from support"],"e":"Diathesis–stress: some are more vulnerable to bad environments. Differential susceptibility: some are more sensitive to environments overall, worse under adversity but better under support (“for better and for worse”).","n":[["k","Differential susceptibility = for better AND for worse."],["x","Diathesis–stress = only for worse."],["c","Bülow (sensitivity); Obradović & Bush (Exam 1)"]],"v":"ds","vp":"f"},{"id":"s3q69","s":3,"t":"R","q":"What did a study of BDNF Val66Met in previously institutionalized children find (Gunnar et al., 2019)?","a":"MET carriers did best if adopted early and worst if adopted late","d":["MET carriers did worse than others at every age of adoption","MET carriers were unaffected by the age at which they were adopted","MET carriers did better only when they were adopted later","The gene predicted who was adopted but not later outcomes"],"e":"Children with one or more MET alleles were more sensitive to age at adoption, an example consistent with differential susceptibility.","n":[["k","MET carriers: more sensitive to timing (better early, worse late)."]],"v":"ds","vp":"f"},{"id":"s3q70","s":3,"t":"R","q":"Which post-adoption family quality predicts better developmental outcomes, according to Brodzinsky et al. (2022)?","a":["Stability in the caregiving environment","Warm, sensitive parent–child relationships","A parent’s secure state of mind regarding attachment","Encouraging age-expected behaviour"],"d":["Delaying any discussion of adoption","Strict, low-warmth discipline to build structure","Frequent caregiver changes to build flexibility","Minimizing the child’s contact with peers"],"e":"Stability, encouraging age-expected behaviours, parental secure state of mind regarding attachment, and warm, sensitive parent–child relationships predict better outcomes across domains.","n":[["k","Recovery context: stable, warm, sensitive, secure-minded parents."]]},{"id":"s3q71","s":3,"t":"R","q":"According to Brodzinsky et al. (2022), what does puberty offer children who experienced early adversity?","a":"A reopened window in which the stress system can be recalibrated","d":["A period when attachment patterns become permanently fixed","A time when earlier gains in IQ stop altogether","A second period of growth stunting and slowed height","A window that closes off all remaining plasticity"],"e":"Pubertal development reopens a window for the stress response to recalibrate when the environment is much more supportive than it was in infancy.","n":[["k","Puberty = second window for stress-system recalibration."]]},{"id":"s3q72","s":3,"t":"R","q":"What kind of evidence supports a CAUSAL role of sensitive parenting in recovery?","a":"Randomized trials boosting sensitive parenting raised security and reduced problems","d":["Correlations between adoptive parents’ income and children’s IQ scores","Retrospective reports from adult adoptees about their parents’ sensitivity","Cross-sectional comparisons of adopted and non-adopted teenagers","Detailed case studies of a handful of individual adoptive families"],"e":"Randomized interventions designed to increase sensitive parenting in adoptive parents increased secure attachment and reduced behaviour problems, which is causal evidence.","n":[["k","RCTs → sensitive parenting causally aids recovery."],["c","Exam 1: experiments allow causal claims"]]},{"id":"s3q73","s":3,"t":"R","q":"Compared with low-risk community parents, adoptive parents are…","a":"more likely to have secure states of mind about attachment","d":["less likely to have secure states of mind about attachment","equally likely to have insecure states of mind about attachment","more likely to show an authoritarian parenting style","less sensitive in their parenting than community parents"],"e":"Adoptive parents are more likely than low-risk community parents to have secure states of mind, which may explain why so many adopted children can form secure relationships with them.","n":[["k","Adoptive parents: often secure states of mind → help children attach."]]},{"id":"s3q74","s":3,"t":"R","q":"According to Brodzinsky et al. (2022), what do families adopting previously maltreated children often need?","a":"Ongoing, specialized support beyond good-enough parenting","d":["Only the ordinary, good-enough parenting any child needs","Less contact with professionals so the family can bond","Stricter discipline than other families typically use","Nothing beyond what birth families of similar children need"],"e":"Parenting children with significant behavioural, neurological, and emotional problems likely requires more than good-enough parenting. Support programs help, but many families lack access to adoption-competent professionals.","n":[["k","Maltreated children → families need specialized, ongoing support."],["x","Many families can’t access it."]]},{"id":"s3q75","s":3,"t":"R","q":"In Brodzinsky et al.’s (2022) ecological model, professionals and agency practices that affect the child mainly through the parents belong to the…","a":"exosystem","d":["microsystem","macrosystem","mesosystem","chronosystem"],"e":"Macrosystem = society/culture. Exosystem = community and professional interventions affecting the child indirectly via parents. Microsystem = family, peers, school. Mesosystem = interplay among microsystems. Chronosystem = change over time.","n":[["k","Exosystem = indirect influences via parents (professionals, agencies)."],["m","EXO = EXternal to the child, reaching them through others"]],"v":"adoptEco","vp":"f"},{"id":"s3q76","s":3,"t":"R","q":"A society viewing adoption as “second best” to having biological children belongs to which ecological level?","a":"Macrosystem","d":["Microsystem","Exosystem","Mesosystem","Chronosystem"],"e":"Broad societal and cultural attitudes toward adoption are part of the macrosystem.","n":[["k","Society and culture = macrosystem."]],"v":"adoptEco","vp":"f"},{"id":"s3q77","s":3,"t":"R","q":"An adopted teen’s parents and teachers talk often and agree on how to support his questions about adoption. Which ecological level is this?","a":"Mesosystem","d":["Microsystem","Exosystem","Macrosystem","Chronosystem"],"e":"The mesosystem is the interplay among microsystems, such as family and school working together.","n":[["k","Connections between settings = mesosystem."]],"v":"adoptEco","vp":"f"},{"id":"s3q78","s":3,"t":"R","q":"Which past adoption practice do Brodzinsky et al. (2022) describe as potentially traumatic?","a":"Advising parents not to tell children they were adopted","d":["Encouraging ongoing contact with the birth family","Preparing adoptive parents carefully before placement","Offering supports to families after the adoption","Placing biological siblings together in the same family"],"e":"An earlier practice counselled parents not to share adoption information. Finding out about adoptive status at older ages or in unsupportive ways can be disruptive and potentially traumatic (Baden et al., 2019).","n":[["k","Secrecy → late or unsupportive discovery → potential trauma."]]},{"id":"s3q79","s":3,"t":"R","q":"Which adoptive parenting approach is linked to healthier family dynamics and adjustment?","a":"Open, sensitive adoption communication that attends to the child’s views","d":["Avoiding the topic of adoption so the child feels ordinary","Discussing adoption only when the child is in a crisis","Sharing birth family information only after the child turns 18","Treating the adoptive family exactly like a birth family"],"e":"Parents who are open in adoption communication, share information sensitively, attend to the child’s point of view, and support search interests foster healthier dynamics and adjustment.","n":[["k","Open, sensitive adoption communication = better adjustment."]]},{"id":"s3q80","s":3,"t":"R","q":"Which adoptive parenting belief is linked to better support of children’s curiosity and adjustment?","a":"Acknowledging that adoptive and birth parenting differ","d":["Insisting that adoption makes no difference to family life","Believing the child’s past is best forgotten entirely","Expecting the child to resemble the rest of the family","Viewing adoption as a private matter never to be discussed"],"e":"Parents who readily acknowledge inherent differences in adoptive parenting are better prepared to support curiosity about origins and to share information openly and empathically, which predicts better adolescent adjustment.","n":[["k","Acknowledging difference > denying difference."],["c","Similar to colorblind vs. cultural socialization"]]},{"id":"s3q81","s":3,"t":"R","q":"What matters more for adoptees’ adjustment when it comes to birth family contact?","a":"Their satisfaction with the contact, more than its amount","d":["The total amount of contact, more than satisfaction","Having no contact at all","Contact only through social media","Contact only with the birth mother"],"e":"Contact helps adoptees understand their past and integrate adoption into identity, but satisfaction matters more than extent. Contact can also pose risks if it involves people who were abusive or unsupportive.","n":[["k","Satisfaction > amount of contact."],["x","Contact can be risky if it involves former abusers."]]},{"id":"s3q82","s":3,"t":"R","q":"When do adopted children typically begin to feel ambivalence or distress about being adopted?","a":"In the elementary years, as they grasp adoption-related loss","d":["In infancy, at the moment they are placed with the family","In the preschool years, right when they’re first told","Only once they reach adulthood and form their own families","Never; distress comes only from earlier maltreatment"],"e":"Preschoolers, usually told during this period, show little comprehension and often positive views. Ambivalence and some distress emerge in the elementary years as children become sensitized to loss.","n":[["k","Preschool: positive, little comprehension. Elementary: sense of loss emerges."]],"v":"adoptDev","vp":"f"},{"id":"s3q83","s":3,"t":"R","q":"How do preschoolers typically view being adopted, according to Brodzinsky et al. (2022)?","a":"Quite positively, with little comprehension of what it means","d":["With deep grief over losing their birth parents","With anger directed at their adoptive parents","With full understanding of what relinquishment means","With no awareness, since most aren’t told until later"],"e":"Children are typically told in the preschool years and begin to learn their story, but understand little and often view adoption positively.","n":[["k","Preschoolers: positive view, low understanding."]],"v":"adoptDev","vp":"f"},{"id":"s3q84","s":3,"t":"R","q":"What did French (2013) mean by “birth privilege”?","a":"Societal views favouring families formed by birth over adoption","d":["Legal rights that birth parents keep after the adoption","The social advantages of being the first-born child","Priority in adoption for children born in the same country","Birth parents’ right to choose the adoptive family"],"e":"“Birth privilege” describes hurtful societal views that prioritize families formed through procreation, contributing to a sense of stigma and of being “lesser than.”","n":[["k","Birth privilege = adoption seen as “second best.”"],["c","Lecture: stigma as a risk factor"]]},{"id":"s3q85","s":3,"t":"R","q":"What is “ambiguous loss” in the context of adoption?","a":"Birth family is physically absent yet psychologically present","d":["Grief that other people fail to recognize or validate","Losing a birth parent through death during childhood","Not knowing for certain whether one was adopted","Losing one’s adoptive parents later in adulthood"],"e":"Ambiguous loss (Boss, 1999): birth family is physically absent yet psychologically present, which makes loss hard to resolve. Unrecognized grief is “disenfranchised grief.”","n":[["k","Ambiguous loss = absent body, present mind."],["x","Disenfranchised grief = grief not validated by others."]],"v":"loss","vp":"f"},{"id":"s3q86","s":3,"t":"R","q":"When an adoptee says she misses her birth family, relatives reply, “But your life here is so much better!” Her grief going unacknowledged illustrates…","a":"disenfranchised grief","d":["ambiguous loss","birth privilege","the primal wound","developmental trauma disorder"],"e":"Disenfranchised grief (Doka, 2002) occurs when others fail to understand, validate, and support a person’s feelings of loss. Lisa (adopted from China at 2) described exactly this.","n":[["k","Grief others don’t validate = disenfranchised grief."]],"v":"loss","vp":"f"},{"id":"s3q87","s":3,"t":"R","q":"According to Brodzinsky et al. (2022), how can a VOLUNTARY placement appraisal complicate an adoptee’s self-view?","a":"They may question whether they had any value to their birth parents","d":["They may question whether they come from people with value","They may come to believe the adoption never happened","They may assume their adoptive parents removed them","They feel only relief, with no complicated emotions"],"e":"If viewed as voluntary, adoptees may wonder if they had value to their birth parents. If viewed as an involuntary removal by child welfare, they may wonder if they come from people of value.","n":[["k","Voluntary → “Did I matter to them?” Involuntary → “Do they have value?”"]],"v":"loss","vp":"f"},{"id":"s3q88","s":3,"t":"R","q":"Kelli, adopted from Korea at 2, felt she never belonged because she differed from her family in race, temperament, and school ability. This illustrates how…","a":"visible and genetic differences can undermine a sense of belonging","d":["early placement in a new family creates a lasting primal wound","kinship adoption reliably prevents later identity problems","colorblind parenting resolves differences between family members","adoption at age 2 guarantees an insecure attachment later on"],"e":"Differences in physical or racial features, temperament, abilities, and personality based on non-shared genetics can make adoptees feel they don’t fit in, compromising emotional security and identity.","n":[["k","Feeling different from family → harder belonging and identity."]]},{"id":"s3q89","s":3,"t":"R","q":"In Brodzinsky et al.’s (2022) view, what makes a person more likely to experience adoption as traumatic?","a":"Appraising it as severe and central to the self, combined with attachment anxiety","d":["Being adopted in the first few months of life, before attachments form","Having any contact at all with members of the birth family","Being told about the adoption during the preschool years","Being adopted by relatives rather than by an unrelated family"],"e":"The impact of events is mediated by appraisals of severity and centrality to the self, plus current attachment anxiety. The more severe, central, and anxious, the more likely adoption is appraised as traumatic.","n":[["k","Trauma appraisal = severity + centrality + attachment anxiety."]],"v":"appraisal","vp":"f"},{"id":"s3q90","s":3,"t":"R","q":"Which contextual factor makes negative adoption appraisals more likely, according to Brodzinsky et al. (2022)?","a":["Messages of “birth privilege” and microaggressions","Lack of empathy and support from key people","Barriers to exploring adoption issues","Insecure internal working models of attachment"],"d":["Open, sensitive communication about adoption","Satisfying contact with birth family","Cultural socialization from adoptive parents","Access to adoption-competent therapy"],"e":"Negative appraisals are more likely with birth-privilege messages, lack of empathy and support, lack of specialized therapy, microaggressions, barriers to exploration, and insecure internal working models.","n":[["k","Risk: birth privilege, no empathy, microaggressions, barriers, insecure working models."]],"v":"appraisal","vp":"f"},{"id":"s3q91","s":3,"t":"R","q":"How do most adopted adults feel about their adoption experience, according to Brodzinsky et al. (2022)?","a":"Mostly positive about adoption, with good life satisfaction","d":["Most describe their adoption as a lifelong trauma","Most report feeling nothing at all about being adopted","Most say they regret having been adopted","Most cut off contact with their adoptive families as adults"],"e":"With supportive family and community contexts, most adults attribute positive feelings to their adoption experience and report generally positive life satisfaction (ter Meulen et al., 2019).","n":[["k","Most adult adoptees: positive feelings and satisfaction."],["x","A minority find it destabilizing; don’t dismiss them."]]},{"id":"s3q92","s":3,"t":"R","q":"What is Brodzinsky et al.’s (2022) overall conclusion about adoption and trauma?","a":"Adoption isn’t inherently traumatic, but pre-placement adversity is common and some struggle","d":["Adoption is inherently traumatic for every adopted person, whatever the circumstances","Adoption has no meaningful link to trauma or adversity at any point in life","Pre-placement adversity is rare, so most adoptees start from a typical baseline","Recovery after adoption is complete and happens evenly across every domain"],"e":"Trauma is common in adopted children’s lives, mostly before placement. Adoption done within a rights and ethics perspective can be protective, recovery is real but uneven, and for some the lived experience is difficult.","n":[["k","Not inherently traumatic; often protective; recovery uneven; some struggle."]]},{"id":"s3q93","s":3,"t":"R","q":"In BEIP, what supported recovery in height, weight, and brain electrical activity, according to Brodzinsky et al. (2022)?","a":"Stability in the caregiving environment after placement","d":["Frequent moves between foster homes to find a good fit","Remaining in institutional care until the child was older","Higher income among the families who fostered children","Starting school early to provide structured stimulation"],"e":"Stability in caregiving after removal from institutional care supported recovery in many domains, including height and weight and brain electrical activity.","n":[["k","Stability fuels recovery."],["c","Lecture: placement instability is a foster care risk"]]},{"id":"s3q94","s":3,"t":"LR","q":"Which factors shape the lived experience of adoption, according to the lecture goal drawn from Brodzinsky et al. (2022)?","a":"Factors related to the child, the family, and broader systems","d":["Only the child’s age at the time of adoption","Only the adoptive family’s income and resources","Only genetic factors inherited from the birth parents","Only whether the adoption was international or domestic"],"e":"Lecture’s added goal: discuss the lived experience of adoption, considering how it’s shaped by child factors (development, appraisals), family factors (communication, parenting), and broader systems (society, professionals, policy).","n":[["k","Lived experience = child + family + broader systems."]],"v":"adoptEco","vp":"f"}];

  store.q[id] = s; save();

  if(S && S.gain){ if(after>before){ if(after===1) S.gain.l++; else S.gain.m++; } S.streak = correct ? S.streak+1 : 0; S.best = Math.max(S.best||0, S.streak); }

}

var SND = {on:true, ctx:null, out:null};

function actx(){
  if(!SND.on) return null;
  try{
    if(!SND.ctx){ var C = window.AudioContext || window.webkitAudioContext; if(!C) return null; SND.ctx = new C(); SND.out = SND.ctx.createGain(); SND.out.gain.value = 0.22; SND.out.connect(SND.ctx.destination); }
    if(SND.ctx.state === "suspended") SND.ctx.resume();
  }catch(e){ return null; }
  return SND.ctx;
}
function tone(f, t0, dur, type, vol, f2){
  var c = actx(); if(!c) return;
  var t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.012); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(SND.out); o.start(t); o.stop(t+dur+0.05);
}

/* ---------- constellations ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
var LAYOUT = {}, CW = 320, CH = 120;
function layout(sec){
  if(LAYOUT[sec]) return LAYOUT[sec];
  var n = BYSEC[sec].length, pad = 9, rnd = mulberry32(sec*7919+31);
  var pts = [], minD = Math.sqrt((CW*CH)/n)*0.64, tries = 0;
  while(pts.length<n){
    var x = pad+rnd()*(CW-2*pad), y = pad+rnd()*(CH-2*pad), ok = true;
    for(var i=0;i<pts.length;i++){ var dx = pts[i].x-x, dy = pts[i].y-y; if(dx*dx+dy*dy<minD*minD){ ok = false; break; } }
    if(ok) pts.push({x:x, y:y});
    if(++tries>3000){ minD *= 0.92; tries = 0; }
  }
  pts.sort(function(a,b){ return a.x-b.x; });
  var path = [pts.shift()];
  while(pts.length){
    var l = path[path.length-1], bi = 0, bd = 1e9;
    for(var j=0;j<pts.length;j++){ var d = (pts[j].x-l.x)*(pts[j].x-l.x)+(pts[j].y-l.y)*(pts[j].y-l.y); if(d<bd){ bd = d; bi = j; } }
    path.push(pts.splice(bi,1)[0]);
  }
  LAYOUT[sec] = {pts:path, maxLink:minD*2.6};
  return LAYOUT[sec];
}
function skySVG(sec, hi, ignite){
  var ids = BYSEC[sec], L = layout(sec), pts = L.pts, lines = "", stars = "";
  for(var i=1;i<pts.length;i++){
    var a = pts[i-1], b = pts[i];
    if(Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y))>L.maxLink) continue;
    var t = Math.min(tier(ids[i-1]), tier(ids[i]));
    lines += '<line class="l'+t+'" x1="'+a.x.toFixed(1)+'" y1="'+a.y.toFixed(1)+'" x2="'+b.x.toFixed(1)+'" y2="'+b.y.toFixed(1)+'" stroke-width="0.8"/>';
  }
  ids.forEach(function(id, i){
    var p = pts[i], t = tier(id), cx = p.x.toFixed(1), cy = p.y.toFixed(1), ig = id===ignite ? ' class="ignite"' : "";
    if(t===2) stars += '<g'+ig+'><circle class="halo" cx="'+cx+'" cy="'+cy+'" r="5.8"/><circle class="s2" cx="'+cx+'" cy="'+cy+'" r="2.7"/></g>';
    else if(t===1) stars += '<g'+ig+'><circle class="s1" cx="'+cx+'" cy="'+cy+'" r="2.4"/></g>';
    else stars += '<circle class="s0" cx="'+cx+'" cy="'+cy+'" r="1.6"/>';
    if(id===hi) stars += '<circle class="ring" cx="'+cx+'" cy="'+cy+'" r="7"/>';
  });
  return '<svg viewBox="0 0 '+CW+' '+CH+'" style="--sc:'+SEC[sec].hex+'" aria-hidden="true" focusable="false">'+lines+stars+'</svg>';
}

var DW = 340;
function SV(h, body, lab){

}
function T(x, y, str, o){

  var y0 = o.top ? y : y - (ls.length-1)*lh/2;

    (o.w?' font-weight="'+o.w+'"':'')+(o.it?' font-style="italic"':'')+(o.d!=null?' style="--d:'+o.d+'ms"':'')+'>';
  ls.forEach(function(l,i){ h += '<tspan x="'+x+'"'+(i?' dy="'+lh.toFixed(1)+'"':'')+'>'+esc(l)+'</tspan>'; });
  return h + '</text>';
}
function B(x, y, w, h, label, o){

  return '<g class="pi" style="--d:'+(o.d||0)+'ms"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(o.r==null?8:o.r)+'" class="'+(o.c||'bx')+'"/>'+

function DOT(x, y, r, cls, d){ return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" class="pi '+cls+'" style="--d:'+(d||0)+'ms"/>'; }
function PERSON(x, y, s, cls, d){

function bars(c){

/* ---------- question instances ---------- */
function makeInstance(q){
  var correct = Array.isArray(q.a) ? pick(q.a) : q.a;
  var ds = shuffle(q.d.slice()).slice(0,4);
  var opts = [{t:correct, c:true}].concat(ds.map(function(t){ return {t:t, c:false}; }));
  return {id:q.id, opts:shuffle(opts), chosen:null, done:false};
}

/* ---------- sessions ---------- */
var S = null, screen = "home";
function startStudy(mode, sec, fig){
  var pool;
  if(mode==="section") pool = BYSEC[sec].slice();
  else if(mode==="review") pool = BYSEC[sec].filter(function(id){ return tier(id)===2; });
  else if(mode==="missed") pool = ALL.filter(function(id){ var s = st(id); return s.w>0 && s.k<2; });
  else if(mode==="diagram") pool = QS.filter(function(q){ return q.v && q.v.split(":")[0]===fig; }).map(function(q){ return q.id; });
  else pool = ALL.slice();
  var order = {}; shuffle(pool.slice()).forEach(function(id, i){ order[id] = i; });   /* fresh random order every session */
  S = {mode:mode, sec:sec, fig:fig, pool:pool, step:0, due:{}, order:order, seen:{}, cleared:{}, last:null, cur:null, gain:{l:0,m:0}, streak:0, best:0};
  nextQuestion();
}
function isDone(id){ return (S.mode==="review"||S.mode==="diagram") ? !!S.cleared[id] : tier(id)===2; }
function priority(id){ if(S.seen[id] && st(id).k===0) return 0; if(st(id).k>=1) return 1; return 2; }
function pickNext(){
  var active = S.pool.filter(function(id){ return !isDone(id); });
  if(!active.length) return null;
  var cands = active.filter(function(id){ return id!==S.last; });
  var dueNow = cands.filter(function(id){ return (S.due[id]||0)<=S.step; });
  if(dueNow.length){
    dueNow.sort(function(a,b){ return priority(a)-priority(b) || (S.due[a]||0)-(S.due[b]||0) || S.order[a]-S.order[b]; });
    return dueNow[0];
  }
  var filler = S.pool.filter(function(id){ return isDone(id) && id!==S.last; });
  if(filler.length && S.mode!=="diagram") return pick(filler);
  if(!cands.length) cands = active;
  cands.sort(function(a,b){ return (S.due[a]||0)-(S.due[b]||0); });
  return cands[0];
}
function nextQuestion(){
  var id = pickNext();
  if(id===null){ renderDone(); return; }
  S.cur = makeInstance(QMAP[id]);
  renderQuiz();
}
function startExam(feedback){
  var core = shuffle(QS.filter(function(q){ return q.t!=="R"; })).slice(0,20);
  var read = shuffle(QS.filter(function(q){ return q.t==="R"; })).slice(0,5);
  var chosen = core.concat(read), list = [];
  SECTIONS.forEach(function(s){ shuffle(chosen.filter(function(q){ return q.s===s.id; })).forEach(function(q){ list.push(q); }); });
  S = {mode:"exam", feedback:feedback, list:list.map(makeInstance), idx:0, gain:{l:0,m:0}, streak:0, best:0};
  S.cur = S.list[0];
  renderQuiz();
}

/* ---------- answering ---------- */
function choose(i){
  var c = S.cur; if(!c || c.done) return;
  if(S.mode==="exam" && !S.feedback){
    c.chosen = i; sfx.pick();
    each(".opt", function(b, j){ b.classList.toggle("sel", j===i); b.setAttribute("aria-pressed", j===i ? "true" : "false"); });
    var nb = document.getElementById("next"); if(nb) nb.disabled = false;
    return;
  }
  c.chosen = i; c.done = true;
  var correct = c.opts[i].c, res = record(c.id, correct);
  c.correct = correct; c.res = res;
  if(S.mode!=="exam"){
    S.step++; S.seen[c.id] = true; S.last = c.id;
    if(correct){
      S.due[c.id] = S.step + (res.after===2 ? 1e6 : 6 + Math.floor(Math.random()*5));
      if((S.mode==="review" && res.after===2) || S.mode==="diagram") S.cleared[c.id] = true;
    } else {
      S.due[c.id] = S.step + 3 + Math.floor(Math.random()*3);
      S.cleared[c.id] = false;
    }
  }
  showAnswer();
}
function tierMessage(res, correct){
  if(correct){
    if(res.before===0 && res.after===1) return icon("star","fill c-lit")+"Star lit. Get it right once more later to master it.";
    if(res.before===1 && res.after===2) return icon("star","fill c-mas")+"Mastered!";
    return "Still mastered.";
  }
  if(res.before>0) return "Star went dark. It’ll be back soon.";
  return "It’ll be back in a few questions.";
}
function statsHTML(){
  var h = "";
  if(!(S.mode==="exam" && !S.feedback)){
    if(S.streak>0) h += '<span class="pill'+(S.streak>=3?' hot':'')+'" id="streak" title="Correct in a row">'+icon("flame")+S.streak+'</span>';
    if(S.gain.l) h += '<span class="pill l1" title="Stars lit this session">'+icon("star","fill")+'+'+S.gain.l+'</span>';
    if(S.gain.m) h += '<span class="pill l2" title="Stars mastered this session">'+icon("star","fill")+'+'+S.gain.m+'</span>';
  }
  return h + sndBtn();
}
function showAnswer(){
  var c = S.cur, q = QMAP[c.id], chosenBtn = null, okBtn = null;
  each(".opt", function(b, j){
    b.disabled = true;
    if(c.opts[j].c){ b.classList.add("ok"); okBtn = b; }
    else if(j===c.chosen) b.classList.add("bad");
    else b.classList.add("dim");
    if(j===c.chosen) chosenBtn = b;
  });
  /* sound + motion */
  if(c.correct){
    sfx.correct(); okBtn.classList.add("glow");
    var r = okBtn.getBoundingClientRect(); burst(r.left+24, r.top+r.height/2, {n:12});
    if(c.res.after===2 && c.res.before===1){ sfx.master(); setTimeout(rain, 120); toast("Mastered ✦"); }
    else if(c.res.after===1 && c.res.before===0) sfx.lit();
    if(S.streak>0 && S.streak%5===0){ setTimeout(sfx.streak, 380); toast(S.streak+" in a row!"); }
  } else {
    sfx.wrong(); if(chosenBtn){ chosenBtn.classList.add("shake"); }
  }
  var fb = document.getElementById("fb");
  fb.className = "fb " + (c.correct ? "good" : "bad");
  var streakNote = (c.correct && S.streak>=3) ? ' <small>'+icon("flame","c-lit")+S.streak+' in a row</small>' : '';
  fb.innerHTML = '<p class="verdict">'+icon(c.correct?"check":"xmark")+(c.correct?"Correct":"Not quite")+
    '<small>'+tierMessage(c.res, c.correct)+'</small>'+streakNote+'</p>'+notesHTML(q);
  fb.hidden = false;
  var mini = document.getElementById("mini");
  if(mini) mini.innerHTML = skySVG(q.s, c.id, c.res.after>c.res.before ? c.id : null);
  var stats = document.getElementById("stats");
  if(stats){ stats.innerHTML = statsHTML(); bindSnd(); var sk = document.getElementById("streak"); if(sk && c.correct) sk.classList.add("pop"); }
  var qb = document.getElementById("qbar"); if(qb) qb.innerHTML = progressHTML();
  var wh = document.getElementById("wherep"); if(wh) wh.textContent = progressText();
  var nb = document.getElementById("next");
  nb.hidden = false; nb.disabled = false;
  try{ nb.focus({preventScroll:true}); }catch(e){}
}
function advance(){
  sfx.tap();
  if(S.mode==="exam"){
    var c = S.cur;
    if(!c.done){
      if(c.chosen===null) return;
      c.done = true; c.correct = c.opts[c.chosen].c; c.res = record(c.id, c.correct);
    }
    S.idx++;
    if(S.idx>=S.list.length){ renderResults(); return; }
    S.cur = S.list[S.idx]; renderQuiz(); return;
  }
  nextQuestion();
}

  if(q.t==="L") return '<span class="tag">'+icon("lecture")+'Lecture</span>';

function tierTag(id){ var t = tier(id); return '<span class="tag"><span class="dot t'+t+'"></span>'+["New","Lit","Mastered"][t]+'</span>'; }
function progressHTML(){
  if(S.mode==="exam") return '<div class="bar"><span class="b2" style="width:'+(100*S.idx/S.list.length)+'%"></span></div>';
  var ids = (S.mode==="section"||S.mode==="review") ? BYSEC[S.sec] : ((S.mode==="missed"||S.mode==="diagram") ? S.pool : ALL);

function progressText(){
  if(S.mode==="exam") return (S.idx+1)+" / "+S.list.length;

  if(S.mode==="review"||S.mode==="diagram"){ var d = S.pool.filter(function(id){ return S.cleared[id]; }).length; return d+" / "+S.pool.length+" done"; }
  var ids = S.mode==="section" ? BYSEC[S.sec] : ALL, c = counts(ids);

  BEIP_G.forEach(function(g, i){ h += '<button class="chip c-'+g[2]+(LAB.beip.g===i?' on':'')+'" data-g="'+i+'">'+g[0]+'</button>'; });
  h += '</div><div class="card">'+DG.smyke.f(LAB.beip.g)+'</div><div class="card"><ul class="notes">'+
    noteRow("k", BEIP_G[LAB.beip.g][1])+noteRow("m", "Timing matters: earlier placement, better recovery. Quality of foster parenting matters too.")+
    noteRow("c", "Language too: placed by about 15 months → typical language at 8; after 25 months → deficits.")+'</ul></div>';
  el.innerHTML = h;
  each(".chip[data-g]", function(b){ b.addEventListener("click", function(){ LAB.beip.g = +b.getAttribute("data-g"); sfx.tap(); labBeip(el); }); });
}

/* ---- E. Diagram deck ---- */
function labDeck(el){
  var h = '<div class="chips"><button class="chip c-mas'+(LAB.deck===0?' on':'')+'" data-d="0">All</button>';
  SECTIONS.forEach(function(s){ h += '<button class="chip c-'+s.col+(LAB.deck===s.id?' on':'')+'" data-d="'+s.id+'">'+s.short+'</button>'; });
  h += '</div><div class="deck">';
  Object.keys(DG).forEach(function(k){
    var d = DG[k]; if(LAB.deck && d.s!==LAB.deck) return;
    var n = QS.filter(function(q){ return q.v && q.v.split(':')[0]===k; }).length;
    h += '<figure class="card dcard sec'+d.s+'" data-k="'+k+'"><div class="dfig">'+d.f(k==='uuu'?'2':(k==='grid'?'':''))+'</div><figcaption>'+esc(d.cap)+'</figcaption>'+
      '<div class="dact"><button class="secondary sm" data-replay="'+k+'">'+icon("redo")+'Replay</button>'+(n?'<button class="primary sm" data-quiz="'+k+'">'+icon("star","fill")+'Quiz me ('+n+')</button>':'')+'</div></figure>';
  });
  el.innerHTML = h + '</div>';
  each(".chip[data-d]", function(b){ b.addEventListener("click", function(){ LAB.deck = +b.getAttribute("data-d"); sfx.tap(); labDeck(el); }); });
  each("[data-replay]", function(b){ b.addEventListener("click", function(){ var k = b.getAttribute("data-replay"), box = b.closest(".dcard").querySelector(".dfig"); box.innerHTML = DG[k].f(k==='uuu'?'2':''); sfx.tick(); }); });
  each("[data-quiz]", function(b){ b.addEventListener("click", function(){ sfx.tap(); startStudy("diagram", null, b.getAttribute("data-quiz")); }); });
}


/* ---------- keyboard ---------- */
document.addEventListener("keydown", function(e){
  if(screen!=="quiz" || e.ctrlKey || e.metaKey || e.altKey) return;
  var k = e.key.toLowerCase(), idx = "abcde".indexOf(k);
  if(idx<0) idx = "12345".indexOf(k);
  if(idx>=0 && k.length===1){ if(S.cur && !S.cur.done){ e.preventDefault(); choose(idx); } return; }
  if(k==="enter"){
    var tid = e.target && e.target.id;
    if(tid==="next" || tid==="back" || tid==="sndbtn") return;
    if(e.target && e.target.tagName==="SUMMARY") return;
    var nb = document.getElementById("next");
    if(nb && !nb.hidden && !nb.disabled){ e.preventDefault(); advance(); }
  }
});

renderHome();
})();
</script>
