<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Group 16 Word Display</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-screen stage. A single Start button, then one centered word at a time.
   One fixed black-on-white look on purpose, so every participant sees exactly the same screen. */
:root {
  --paper: #ffffff;
  --ink: #000000;
  --font: Arial, "Helvetica Neue", Helvetica, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
html { background: var(--paper); box-sizing: border-box; }
body {
  box-sizing: border-box;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}
body.running { cursor: none; }

.stage {
  height: 100%;
  display: grid;
  place-items: center;
}

.start {
  font: 700 clamp(40px, 7vw, 88px)/1 var(--font);
  letter-spacing: 0.02em;
  color: var(--paper);
  background: var(--ink);
  border: 4px solid var(--ink);
  border-radius: 6px;
  padding: 0.55em 1.7em;
  cursor: pointer;
}
.start:hover { background: var(--paper); color: var(--ink); }
.start:focus-visible { outline: 4px solid var(--ink); outline-offset: 10px; }
.start:active { transform: translateY(2px); }

.word {
  margin: 0;
  font: 400 min(22vw, 40vh)/1 var(--font);
  white-space: nowrap;
  color: var(--ink);
}

@media (prefers-reduced-motion: reduce) {
  .start:active { transform: none; }
}
</style>

<main class="stage">
  <button id="start" class="start" type="button">Start</button>
  <p id="word" class="word" hidden></p>
</main>

<script>
// The 18 study words. Same words for everyone; the order is shuffled on every run.
const WORDS = [
  "sting", "trash", "chaos", "rumor", "smoke", "delay", "drain", "alley", "ghost",
  "dress", "hotel", "space", "plant", "candy", "dream", "music", "puppy", "prize"
];
const WORD_MS = 2000;     // each word stays on screen for 2 seconds
const LEAD_IN_MS = 1000;  // short blank pause after Start, so the screen settles before word 1

const startBtn = document.getElementById("start");
const wordEl = document.getElementById("word");
let running = false;
let timer = null;
let inFullscreen = false;

// Unbiased random whole number from 0 to n - 1.
function randomInt(n) {
  if (window.crypto && crypto.getRandomValues) {
    const buf = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / n) * n;
    let x;
    do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
    return x % n;
  }
  return Math.floor(Math.random() * n);
}

// Fisher–Yates shuffle: every order is equally likely.
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = randomInt(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function enterFullscreen() {
  const el = document.documentElement;
  const request = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!request) return;
  try {
    const result = request.call(el);
    if (result && result.catch) result.catch(() => {});
  } catch (e) { /* fullscreen is optional */ }
}

function exitFullscreen() {
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  if (!exit || !(document.fullscreenElement || document.webkitFullscreenElement)) return;
  try {
    const result = exit.call(document);
    if (result && result.catch) result.catch(() => {});
  } catch (e) { /* ignore */ }
}

function run() {
  if (running) return;
  running = true;
  const order = shuffle(WORDS);

  startBtn.hidden = true;
  wordEl.textContent = "";
  wordEl.hidden = false;
  document.body.classList.add("running");
  enterFullscreen();

  // Each word is timed against one start point, so small delays never add up.
  const t0 = performance.now() + LEAD_IN_MS;
  function show(k) {
    if (!running) return;
    if (k === order.length) { stop(); return; }
    wordEl.textContent = order[k];
    const next = t0 + (k + 1) * WORD_MS;
    timer = setTimeout(() => show(k + 1), Math.max(0, next - performance.now()));
  }
  timer = setTimeout(() => show(0), LEAD_IN_MS);
}

function stop() {
  running = false;
  clearTimeout(timer);
  wordEl.textContent = "";
  wordEl.hidden = true;
  document.body.classList.remove("running");
  exitFullscreen();
  startBtn.hidden = false;
  startBtn.focus();
}

startBtn.addEventListener("click", run);

// Esc stops a run early and returns to the Start button.
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && running) stop();
});
function onFullscreenChange() {
  const fs = document.fullscreenElement || document.webkitFullscreenElement;
  if (fs) { inFullscreen = true; return; }
  if (inFullscreen && running) stop();
  inFullscreen = false;
}
document.addEventListener("fullscreenchange", onFullscreenChange);
document.addEventListener("webkitfullscreenchange", onFullscreenChange);
</script>

</body></html>
