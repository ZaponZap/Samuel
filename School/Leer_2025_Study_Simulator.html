<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leer 2025 Study Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Night-at-school pixel world. Lamp-gold = interactive. Blue = what schools SAY. Coral = what schools DO. */
  --night:#171b35; --night-2:#21274a; --night-3:#2c3360; --line:#3d4680;
  --ink:#efe7d6; --muted:#a9a9c8;
  --paper:#f4ecda; --paper-ink:#2a2440; --paper-line:#c9bda2;
  --lamp:#ffc35c; --say:#8ab8ff; --do:#ff8f6b; --good:#7fd69a;
  --display:"Silkscreen", "Courier New", monospace;
  --talk:"Pixelify Sans", "Atkinson Hyperlegible", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 40px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.brand{font-family:var(--display);font-size:13px;letter-spacing:.04em;color:var(--lamp);cursor:pointer;background:none;border:0;padding:0}
.pips{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.pip{font-family:var(--display);font-size:10px;border:2px solid var(--line);background:var(--night-2);color:var(--muted);padding:3px 6px;cursor:pointer;min-width:28px}
.pip.on{border-color:var(--lamp);color:var(--night);background:var(--lamp)}
.pip.seen{color:var(--ink)}
.chtitle{font-family:var(--display);font-size:20px;margin:2px 0 8px;text-wrap:balance}
.chtitle small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em}

/* stage */
.stage{position:relative;height:230px;overflow:hidden;border:3px solid var(--line);background:linear-gradient(#0f1330 0%,#232a5a 70%,#2f3870 100%)}
.stage .stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 20%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 33% 12%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 58% 28%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 72% 8%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 88% 30%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 45% 40%,#fff4 50%,transparent 51%)}
.stage .ground{position:absolute;left:0;right:0;bottom:0;height:26px;background:#dfe6f3;border-top:3px solid #fff}
.stage .ground::after{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:#c3cde3}
.stage .sp{position:absolute;bottom:20px}
.stage .lbl{position:absolute;font-family:var(--display);font-size:9px;color:var(--night);background:var(--paper);padding:1px 4px;transform:translateX(-50%);white-space:nowrap;bottom:6px}
.char{transition:transform .25s}
.char.hop{animation:hop .5s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
.sign{position:absolute;font-family:var(--display);font-size:10px;background:var(--paper);color:var(--paper-ink);border:2px solid var(--paper-ink);padding:3px 6px}

/* dialogue */
.dlg{display:flex;gap:12px;align-items:flex-start;background:var(--paper);color:var(--paper-ink);border:3px solid var(--paper-ink);box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--line);margin:10px 0 0;position:relative;padding:10px 12px;cursor:pointer;min-height:84px}
.dlg .face{flex:0 0 auto;width:52px;height:52px;overflow:hidden;background:#e6dcc4;border:2px solid var(--paper-ink)}
.dlg .face img{width:64px;height:80px;margin:-2px 0 0 -6px}
.dlg .who{font-family:var(--display);font-size:11px;letter-spacing:.06em;color:#6b4fb5}
.dlg .txt{font-family:var(--talk);font-size:18px;line-height:1.35;min-height:48px}
.dlg .txt b{color:#b4421f}
.dlg .more{position:absolute;right:10px;bottom:6px;font-size:12px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* panel */
.panel{margin-top:16px;display:grid;gap:12px}
.card{background:var(--night-2);border:2px solid var(--line);padding:12px 14px}
.card h3{font-family:var(--display);font-size:13px;margin:0 0 6px;letter-spacing:.04em;color:var(--lamp);font-weight:400}
.card p{margin:4px 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--display);font-size:12px;letter-spacing:.04em;background:var(--night-3);border:2px solid var(--line);padding:8px 12px;cursor:pointer;box-shadow:0 3px 0 #0b0e22}
.btn:hover{border-color:var(--lamp)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0e22}
.btn.primary{background:var(--lamp);color:var(--night);border-color:var(--lamp)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.opt{text-align:left;background:var(--night-3);border:2px solid var(--line);padding:9px 12px;cursor:pointer;font-family:var(--body);font-size:15px}
.opt:hover{border-color:var(--lamp)}
.opt.pick{border-color:var(--lamp);background:#3b3a52}
.opt.right{border-color:var(--good);background:#21412f}
.opt.wrong{border-color:var(--do);background:#4a2a2a}
.chip{display:inline-block;font-size:13px;border:2px solid var(--line);padding:3px 8px;background:var(--night-3);cursor:pointer}
.chip.on{border-color:var(--lamp)}
.tag{display:inline-block;font-family:var(--display);font-size:10px;padding:2px 6px;border:2px solid currentColor;letter-spacing:.04em}
.say{color:var(--say)} .do{color:var(--do)} .good{color:var(--good)} .lamp{color:var(--lamp)}
.big{font-family:var(--display);font-size:32px;line-height:1.1}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.nav .hint{font-size:13px;color:var(--muted);text-align:center;flex:1}
.flip{min-height:96px;text-align:left;cursor:pointer;background:var(--night-3);border:2px dashed var(--line);padding:10px 12px;font-family:var(--body);font-size:15px}
.flip .f{font-family:var(--display);font-size:13px;color:var(--lamp)}
.flip.open{border-style:solid;border-color:var(--lamp);background:var(--night-2)}
.scale5{display:flex;gap:6px;flex-wrap:wrap}
.scale5 button{min-width:44px;padding:6px 8px;background:var(--night-3);border:2px solid var(--line);cursor:pointer;font-family:var(--display);font-size:12px}
.scale5 button.pick{background:var(--lamp);color:var(--night);border-color:var(--lamp)}
.item{display:grid;gap:6px;padding:8px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.meter{position:relative;height:22px;background:var(--night-3);border:2px solid var(--line)}
.meter .zero{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.meter .bar{position:absolute;top:2px;bottom:2px;transition:all .35s}
.cells{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;max-width:280px}
.cells i{display:block;aspect-ratio:1;background:var(--night-3)}
.cells i.f{background:var(--do)}
.cells i.g{background:var(--say)}
.waffle{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;max-width:420px}
.waffle i{display:block;aspect-ratio:1;background:var(--night-3);transition:background .2s}
.waffle i.on{background:var(--say)}
table.rc{border-collapse:collapse;width:100%;font-size:15px}
table.rc td,table.rc th{padding:7px 6px;border-bottom:1px dashed var(--line);text-align:left;vertical-align:top}
table.rc th{font-family:var(--display);font-size:11px;font-weight:400;color:var(--muted)}
.tok{width:38px;height:38px;border:2px solid #0006;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--lamp)}
.hall{position:relative;height:190px;border:3px solid var(--line);background:linear-gradient(#3a3f6b 0 62%,#555a86 62% 64%,#8a8fb2 64%);overflow:hidden}
.hall .st{position:absolute;bottom:52px;width:20%;text-align:center}
.hall .door{margin:0 auto;width:92px;height:96px;background:var(--paper);color:var(--paper-ink);border:3px solid var(--paper-ink);font-family:var(--display);font-size:9px;display:flex;align-items:center;justify-content:center;padding:4px;line-height:1.3}
.hall .door.poster{background:var(--say);height:78px}
.hall .door.hidden{filter:brightness(.35)}
.hall .walker{position:absolute;bottom:14px;transition:left .8s steps(8)}
.title{text-align:center;padding:10px 0 0}
.title h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,6vw,52px);line-height:1.02;margin:6px 0;text-wrap:balance}
.title h1 .s{color:var(--say)} .title h1 .d{color:var(--do)}
.title .cite{font-size:15px;color:var(--muted)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:18px;text-align:left}
.chgrid button{background:var(--night-2);border:2px solid var(--line);padding:8px 10px;cursor:pointer;text-align:left}
.chgrid button:hover{border-color:var(--lamp)}
.chgrid b{font-family:var(--display);font-weight:400;font-size:11px;color:var(--lamp);display:block}
.avatars{display:flex;gap:12px;flex-wrap:wrap}
.avatars button{background:var(--night-3);border:2px solid var(--line);padding:8px;cursor:pointer;display:grid;justify-items:center;gap:4px;font-family:var(--display);font-size:11px}
.avatars button.pick{border-color:var(--lamp)}
canvas{max-width:100%;display:block}
.sb td:first-child{white-space:nowrap}
@media (max-width:560px){
  .stage{height:190px}
  .dlg .txt{font-size:16px}
  .big{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function flipCards(p, cards, onAll){
  const open = new Set();
  p.innerHTML = `<div class="grid3">${cards.map((c,i)=>`<button class="flip" data-i="${i}"><div class="f">${c[0]}</div><div class="b muted small">Tap to reveal</div></button>`).join('')}</div>`;
  p.querySelectorAll('.flip').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; open.add(i); b.classList.add('open'); b.querySelector('.b').className='b'; b.querySelector('.b').innerHTML=cards[i][1]; if(open.size===cards.length) onAll(); });
}

function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}

function drawStage(){
  const c=CH[st.ch], el=$('#stage'); if(!el) return; const sc=c.scene;
  const showAv = !!st.avatar;
  let props='', chars='';
  if(sc==='school'){
    props = `<div class="sp" style="left:50%;transform:translateX(-50%);bottom:18px">${img(S.school,1.3,108,140)}</div>
     <div class="sp" style="left:30%;bottom:18px">${img(S.pine,1.6,32,56)}</div><div class="sp" style="left:64%;bottom:18px">${img(S.pine_s,1.6,22,36)}</div>`;
  } else if(sc==='lab'){
    props = `<div class="sp" style="left:50%;transform:translateX(-50%);bottom:18px">${img(S.house5,1.5,116,86)}</div><div class="sign" style="left:50%;top:14px;transform:translateX(-50%)">RESEARCH LAB</div>`;
    const ras=['Kay','Grace','Daka','Lyre','Sable'];
    chars += ras.map((r,i)=>`<div class="sp char" style="left:${30+i*8.5}%;bottom:14px;z-index:2">${img(S[r],1.6)}</div>`).join('');
  } else if(sc==='class'){
    props = `<div class="sp" style="left:8%;bottom:18px;opacity:.9">${img(S.school,1,108,140)}</div><div class="sign" style="left:50%;top:18px;transform:translateX(-50%)">SURVEY IN PROGRESS</div>`;
  }
  chars = `<div class="sp char" style="left:${sc==='class'?'34%':'4%'};z-index:3">${img(spinSrc(),3,32,40).replace('<img','<img id="spinSprite"')}</div>` + chars;
  if(showAv) chars += `<div class="sp char" style="right:${sc==='class'?'30%':'5%'};z-index:3">${img(av(mood),3).replace('<img','<img id="avatarSprite"')}</div>`;
  el.innerHTML = `<div class="stars"></div><div class="sp" style="right:8%;top:12px;bottom:auto">${img(S.moon,1.1,40,40)}</div>${props}<div class="ground"></div>${chars}`;
}
function blinkLoop(){ clearInterval(blinkT); blinkT=setInterval(()=>{ const e=$('#spinSprite'); if(e && (spinPose==='idle'||spinPose==='e')){ e.src=spinSrc(true); setTimeout(()=>{ if($('#spinSprite')) $('#spinSprite').src=spinSrc(); },140);} const a=$('#avatarSprite'); if(a && mood==='base' && S[(st.avatar||'Kain')+'_b']){ a.src=S[(st.avatar||'Kain')+'_b']; setTimeout(()=>{ if($('#avatarSprite')&&mood==='base') $('#avatarSprite').src=av('base'); },140);} }, 3200); }

/* ---------- render ---------- */
let typeT=null, typing=false, fullHTML='';
function md(t){ return t.replace(/\*(.+?)\*/g,'<b>$1</b>'); }
function typeText(el, text){
  clearInterval(typeT); fullHTML=md(text); const plain=text.replace(/\*/g,'');
  if(RM){ el.innerHTML=fullHTML; typing=false; return; }
  let i=0; typing=true; el.textContent='';
  typeT=setInterval(()=>{ i+=2; el.textContent=plain.slice(0,i); if(i>=plain.length){ clearInterval(typeT); el.innerHTML=fullHTML; typing=false; setSpin(curPose()); } },18);
}
function curPose(){ const b=CH[st.ch].beats?.[st.beat]; return b?.pose || 'e'; }

function render(){
  const app=$('#app'); clearInterval(typeT);
  if(st.ch===0){ renderTitle(app); return; }
  const c=CH[st.ch], b=c.beats[st.beat]; st.seen[st.ch]=1;
  mood = b.mood || 'base'; spinPose = b.pose || 'e';
  app.innerHTML = `<div class="top"><button class="brand" id="home">LEER 2025 · SIM</button><div class="pips">${CH.slice(1).map((x,i)=>`<button class="pip ${i+1===st.ch?'on':''} ${st.seen[i+1]?'seen':''}" data-c="${i+1}" title="${x.t}">${i+1}</button>`).join('')}</div></div>
   <h2 class="chtitle"><small>CHAPTER ${st.ch} · ${c.k.toUpperCase()} · ${st.beat+1}/${c.beats.length}</small>${c.t}</h2>
   <div class="stage" id="stage"></div>
   <div class="dlg" id="dlg"><div class="face"><img class="px" src="${b.who==='ra'?S.Kay:S.sp_e}" alt=""></div><div><div class="who">${b.who==='ra'?'KAY · LEAD RA':'DR. SPINZLE · EXPERIMENTER'}</div><div class="txt" id="txt"></div></div><span class="more">▼</span></div>
   <div class="panel" id="panel"></div>
   <div class="nav"><button class="btn" id="back">◀ Back</button><span class="hint" id="hint"></span><button class="btn primary" id="next">Next ▶</button></div>`;
  drawStage(); typeText($('#txt'), b.text);
  $('#dlg').onclick=()=>{ if(typing){ clearInterval(typeT); $('#txt').innerHTML=fullHTML; typing=false; } };
  const panel=$('#panel'); if(b.w && W[b.w]) W[b.w](panel); else st.done[key()]=true;
  $('#back').onclick=()=>go(-1); $('#next').onclick=()=>go(1); $('#home').onclick=()=>{st.ch=0;render();};
  app.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{ st.ch=+x.dataset.c; st.beat=0; render(); window.scrollTo(0,0); });
  updNav(); blinkLoop();
}
function updNav(){ const n=$('#next'), h=$('#hint'); if(!n) return; const d=!!st.done[key()]; n.disabled=!d; const last = st.ch===CH.length-1 && st.beat===CH[st.ch].beats.length-1;
  n.textContent = last ? 'Finish ▶' : (st.beat===CH[st.ch].beats.length-1 ? 'Next chapter ▶' : 'Next ▶'); h.textContent = d? '' : 'Finish the activity to continue'; }
function go(dir){
  const c=CH[st.ch];
  if(dir>0){ if(st.beat<c.beats.length-1) st.beat++; else if(st.ch<CH.length-1){ st.ch++; st.beat=0; } else { st.ch=0; } }
  else { if(st.beat>0) st.beat--; else if(st.ch>1){ st.ch--; st.beat=CH[st.ch].beats.length-1; } else st.ch=0; }
  render(); const s=$('#stage'); if(s) s.scrollIntoView({block:'start',behavior:RM?'auto':'smooth'});
}
function renderTitle(app){
  app.innerHTML = `<div class="title">
   <div class="stage" style="height:200px"><div class="stars"></div><div class="sp" style="right:8%;top:12px;bottom:auto">${img(S.moon,1.1,40,40)}</div>
    <div class="sp" style="left:50%;transform:translateX(-50%);bottom:18px">${img(S.school,1.15,108,140)}</div><div class="ground"></div>
    <div class="sp char" style="left:14%">${img(S.sp_wr,3)}</div>
    <div class="sp char" style="right:22%">${img(S.Kain,2.4)}</div><div class="sp char" style="right:12%">${img(S.Kaimachi,2.4)}</div><div class="sp char" style="right:2%">${img(S.Apollos,2.4)}</div>
    <div class="sign" style="left:50%;top:14px;transform:translateX(-50%)">PROJECT RAISE · NC · 2014–15</div></div>
   <h1><span class="s">It's not what you say,</span><br><span class="d">it's what you do</span></h1>
   <p class="cite">A playable replication of Leer, Gaither & Gassman-Pines (2025), <i>Journal of Research on Adolescence</i></p>
   <p>You're the participant. Dr. Spinzle runs the study.</p>
   <button class="btn primary" id="start" style="font-size:15px;padding:12px 20px">${Object.keys(st.seen).length?'Continue':'Start the study'} ▶</button>
   <div class="chgrid">${CH.slice(1).map((c,i)=>`<button data-c="${i+1}"><b>${i+1} · ${c.k}</b>${c.t}</button>`).join('')}</div></div>`;
  $('#start').onclick=()=>{ if(!st.seen[1]){st.ch=1;st.beat=0;} else { st.ch = Math.max(1, Math.max(...Object.keys(st.seen).map(Number))); st.beat=0; } render(); };
  app.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{ st.ch=+x.dataset.c; st.beat=0; render(); });
}

function start(data){ if(data && data.ch!=null) st=Object.assign(st,data); render(); }
window.claude?.hot?.snapshot?.(()=>snap());
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
