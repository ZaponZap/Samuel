<script>
/* ============ EXAM SIMULATION · CONTENT ============
   Every definition below is quoted or closely paraphrased from the course textbook
   (Cozby, Mar & Rawn, Methods in Behavioural Research, 4th Cdn ed.) or the lecture slides.
   Scenarios are new, built to apply those definitions. Memory hooks are study aids, not textbook claims.
   Markup: {g:…} highlights the key idea, {r:…} flags the trap, {b:…} bold. */
window.EXAM = (function () {
  var C = [];

  /* ---------------------------------------------------------------- 1. FOUR GOALS */
  C.push({ id: 'goals', title: 'The four goals of research', ch: 'Ch. 1 & 5 · Lecture 2', icon: 'ladder',
    blurb: 'Description, prediction, finding causes, explanation. They sound alike until you ask what each one is trying to find out.',
    guide: [
      { n: 'Description', ask: 'What is it? What does it look like, when and how often does it happen, and for whom?',
        def: 'The primary goal: to describe behaviour and events. "Before we can predict or properly understand something, we first need to understand what that phenomenon is, what it looks like, when and how often it occurs, and for whom."',
        signs: 'How many, how common, what percentage, prevalence, careful observation and recording.',
        ex: 'About 5% of Canadians have major depressive disorder in a 12-month span, about 11% in their lifetime, and women are almost twice as likely to have it (Knoll & MacLennan, 2017).' },
      { n: 'Prediction', ask: 'When will it happen? Who is most likely to show it?',
        def: 'To be able to predict when that behaviour will occur or not occur. "If two events have been observed to be consistently related, it becomes possible to make predictions about when an event might occur and anticipate it."',
        signs: 'Predicts, is related to, at risk, forecasting with a test or survey. Nothing is manipulated, and the cause doesn’t matter.',
        ex: 'Doctors who reported less empathy and perspective-taking were at higher risk of burnout (Lamothe et al., 2014).' },
      { n: 'Determining causes', ask: 'What makes it happen? If I change X, does Y change?',
        def: 'To determine the causes of phenomena. "The experimental method is what we use in science to help us to identify cause-and-effect relationships." Needs covariation, temporal precedence, and ruling out alternative explanations.',
        signs: 'Manipulated, randomly assigned, experimental vs control condition, "causes".',
        ex: 'Students randomly assigned to multitask on a laptop scored 55% on a test versus 66% for those who didn’t (Sana et al., 2013).' },
      { n: 'Explanation', ask: 'Why does it happen? Through what process?',
        def: 'To explain why the events and behaviours occur. "Such research often involves testing theories that are developed to explain particular relationships. Experiments and mediation analyses can both help us to explain behaviour."',
        signs: 'Why, because of, the process, a mediating variable, testing a theory.',
        ex: 'Why do more empathic doctors burn out less? Because empathy reminds them of their purpose, or because they diagnose patients more successfully? Testing those possibilities is explanation.' }
    ],
    hook: { t: 'Climb the ladder: WHAT → WHEN → WHAT MAKES IT → WHY',
      p: 'Description answers {b:what} (and how often, for whom). Prediction answers {b:when / who} without caring about cause. Determining causes answers {b:what makes it happen} by manipulating it. Explanation answers {b:why}: the process behind a cause. The textbook says description is foundational and should come first, before anything else.' },
    traps: [
      '{r:Prediction is not cause.} "High school grades do not cause university grades, although they are related." A good predictor can work without being a cause.',
      '{r:Comparing groups can still be description.} Reporting that a disorder is more common in women than men describes prevalence "for whom." No one is predicting an individual’s future or testing a cause.',
      '{r:Causes vs explanation.} Knowing multitasking lowers test scores (cause) doesn’t say {g:why} it does. Asking about the process (attention? memory encoding?) is explanation.'
    ],
    t: ['Description', 'Prediction', 'Determining causes', 'Explanation'],
    items: [
      { q: 'A survey of 2,000 Canadian teens finds that 38% check their phone within five minutes of waking up.', a: 'Description', e: 'It reports {g:how common} a behaviour is. No relationship, cause or "why" is being tested.' },
      { q: 'Advisors notice that students who miss the first two weeks of class are much more likely to drop the course, so they use early attendance to flag students for support.', a: 'Prediction', e: 'Two events are consistently related, so one is used to {g:anticipate} the other. Nobody claims missing class causes dropping.' },
      { q: 'Volunteers are randomly assigned to sleep either 4 or 8 hours. The next morning, the 4-hour group makes more errors in a driving simulator.', a: 'Determining causes', e: 'Sleep is {g:manipulated} with {g:random assignment}, then errors are measured. That’s the experimental method, the tool for finding causes.' },
      { q: 'Researchers already know exercise improves mood. They now test whether it does so by increasing feelings of competence, measuring competence as a mediating variable.', a: 'Explanation', e: 'The question is {g:why/how} exercise improves mood. Mediation analyses are one of the tools the textbook names for explanation.' },
      { q: 'A forensic psychologist uses a risk questionnaire to estimate which offenders are likely to commit another crime after release, without asking why they reoffend.', a: 'Prediction', e: 'The textbook’s own example of prediction: tests that improve decisions "without being concerned about causes."' },
      { q: 'Jean Piaget carefully observed his own children and recorded in detail how their ways of thinking changed as they grew.', a: 'Description', e: 'The textbook’s example of descriptive research. His careful descriptions later led to theory and experiments.' },
      { q: 'Two theories offer different accounts of why reminders make old memories easier to change. A lab designs a study whose result only one of the two theories can account for.', a: 'Explanation', e: 'Testing theories that account for {g:why} something happens serves the explanation goal.' },
      { q: 'An observer records how often, and at what times of day, toddlers have tantrums at daycare.', a: 'Description', e: 'What it looks like, {g:when and how often} it occurs: classic description.' },
      { q: 'High school grades are strongly related to university grades, so an admissions office uses them to choose which applicants to accept.', a: 'Prediction', e: 'The relationship lets them anticipate future grades. The textbook warns that high school grades {r:don’t cause} university grades; that doesn’t stop them from predicting.' },
      { q: 'To see whether a nearby flickering laptop hurts learning, students are randomly seated behind classmates (confederates) who either are or aren’t multitasking during a lecture.', a: 'Determining causes', e: 'A manipulated variable, random assignment and a measured outcome. Sana et al. (2013) used this design to show a causal effect.' },
      { q: 'More empathic doctors burn out less. A follow-up study asks whether that’s because empathy reminds them of the good they do, or because perspective-taking makes them better at diagnosing patients.', a: 'Explanation', e: 'The link is already known; the study asks {g:why} it occurs. The textbook uses this exact case to introduce explanation.' },
      { q: 'A national survey finds that about 11% of Canadians experience major depressive disorder in their lifetime, and that women are almost twice as likely as men to experience it.', a: 'Description', e: 'Prevalence, and {g:for whom} it’s more common. Even with a women-vs-men comparison, the goal is to describe.' }
    ] });

  /* ---------------------------------------------------------------- 2. PROGRAM EVALUATION */
  C.push({ id: 'progeval', title: 'Program evaluation’s five questions', ch: 'Ch. 1 & 12', icon: 'clip',
    blurb: 'Five questions an evaluation can ask, in order: needs assessment, program theory, process evaluation, outcome evaluation and efficiency assessment.',
    guide: [
      { n: 'Needs assessment', ask: 'Are there problems that need to be addressed in a target population?',
        def: 'Asking whether there are problems that need to be addressed in a target population. Data may come from surveys, interviews and existing archival data.',
        signs: 'Before any program exists. What do people need most?', ex: 'What services do homeless people need most? Do repeat juvenile offenders have particular personal and family problems an intervention could address?' },
      { n: 'Program theory', ask: 'How will the problems be addressed? Will the proposed program actually address the needs appropriately?',
        def: 'The program "must be based on valid assumptions about the causes of the problems and a convincing rationale for the best way to address these problems." Researchers, providers and prospective clients may collaborate on it.',
        signs: 'Checking the plan’s logic: will it reach the target population as intended? Are its goals appropriate?', ex: 'Before launch, a team checks whether a tutoring program’s rationale fits why students are struggling, and whether those students will actually be able to use it.' },
      { n: 'Process evaluation', ask: 'Is the program doing what it’s supposed to do: reaching its target population and delivering the planned services? (Also called program monitoring.)',
        def: 'While the program is underway, monitoring whether it is reaching the target population, attracting enough clients, and whether staff are providing the planned services.',
        signs: 'Program is running. Enrolment, delivery, training, location.', ex: 'Staff weren’t adequately trained, or services are offered somewhere hard to find. Catching this avoids wrongly concluding a program "doesn’t work."' },
      { n: 'Outcome evaluation', ask: 'Are the intended outcomes of the program being realized? (Also called impact assessment.)',
        def: 'Did the program produce the positive outcome it was designed for? Ideally a true experiment; otherwise quasi-experimental or single case designs.',
        signs: 'Results: literacy up? Job skills gained? Compared with what people would be like without it.', ex: 'Did children in a healthy-choices program actually change their diet and activity?' },
      { n: 'Efficiency assessment', ask: 'Is the cost of the program worth the outcomes?',
        def: 'Once a program is shown to work, deciding whether its benefits are worth its cost, and whether the resources could be put to better use.',
        signs: 'Money, cost per benefit, a cheaper alternative.', ex: 'The program works, but is there a less costly way to get the same result?' }
    ],
    hook: { t: 'Need → Plan → Running → Results → Worth it?', p: 'The textbook draws the five questions as a {b:sequence}: find the need, check the plan’s logic, monitor it running, measure results, then weigh cost.' },
    traps: ['{r:Process vs outcome:} process asks whether the program is {g:delivered} as planned; outcome asks whether it {g:works}. A program can fail an outcome evaluation only because it was never run properly, and that’s exactly what process evaluation catches.', 'Program evaluation as a whole is a major area of {g:applied} research (Ch. 1).'],
    t: ['Needs assessment', 'Program theory', 'Process evaluation', 'Outcome evaluation', 'Efficiency assessment'],
    items: [
      { q: 'Before designing anything, a city surveys shelters and interviews unhoused residents to find out which services they need most.', a: 'Needs assessment', e: 'No program exists yet. The question is what {g:problems need addressing} in this population.' },
      { q: 'Researchers, service providers and future clients meet to check whether a planned tutoring program’s rationale actually matches why the students are struggling, and whether those students will be able to access it.', a: 'Program theory', e: 'Evaluating the {g:rationale and assumptions} of the plan before it runs.' },
      { q: 'Six months into a literacy program, evaluators check whether it is reaching the intended families, whether enough people are enrolling, and whether staff are running the planned sessions.', a: 'Process evaluation', e: 'Monitoring {g:delivery} while the program is underway: reach, enrolment, services provided.' },
      { q: 'Evaluators compare employment rates of people who finished a job-skills program with those of similar people who didn’t take it.', a: 'Outcome evaluation', e: 'Are the {g:intended outcomes} (jobs) being achieved? That’s impact assessment.' },
      { q: 'A program is shown to reduce reoffending. The government now asks whether the benefits justify the program’s cost, or whether the money could do more elsewhere.', a: 'Efficiency assessment', e: 'Benefits versus {g:cost}, after effectiveness is established.' },
      { q: 'An evaluation team discovers that a counselling program’s staff were never properly trained and its office is in a building clients can’t find.', a: 'Process evaluation', e: 'Implementation problems. The textbook says this research avoids concluding a program is ineffective "when really it is not being implemented properly."' },
      { q: 'Interviews with repeat juvenile offenders and their families identify personal and family problems that an intervention could target.', a: 'Needs assessment', e: 'The textbook’s own needs-assessment example.' },
      { q: 'A school board asks whether students who went through a healthy-eating program actually made healthier food choices afterward.', a: 'Outcome evaluation', e: 'Measuring whether the {g:intended outcome} happened.' }
    ] });

  /* ---------------------------------------------------------------- 3. CONFOUND / THIRD / MEDIATOR / MODERATOR */
  C.push({ id: 'cv', title: 'Confound, third variable, mediator or moderator?', ch: 'Ch. 5 & 13', icon: 'link',
    blurb: 'Four "other variables" that students mix up constantly. Each one plays a different role in a relationship.',
    guide: [
      { n: 'Confounding variable', ask: 'Is something tangled up with my variable so I can’t tell which one did it?',
        def: 'Variables that are not of interest, but are uncontrolled and impossible to separate from the variable of interest, and that can also explain the pattern of results. They prevent us from knowing what is responsible for an effect or association.',
        signs: 'Rides along with the IV or the measured variable: one condition also gets a break, more socializing, a different time of day.', ex: 'Exercise group also gets an hour away from their routine; the no-exercise group doesn’t. Was it the exercise or the break?' },
      { n: 'Third variable', ask: 'Could something unmeasured be causing both of the things I measured?',
        def: 'The third-variable problem: the possibility that a third, unmeasured, variable is responsible for the observed association between two other variables.',
        signs: 'A correlation between A and B, plus a C that drives both.', ex: 'Income could let people afford exercise and also make them happier, producing an exercise–happiness correlation.' },
      { n: 'Mediating variable', ask: 'Is this the step in the middle, the "how" between cause and effect?',
        def: 'A psychological process that occurs between an event and a behavioural response. It helps explain the relationship between two other variables.',
        signs: 'A → M → B. "Because it increases…", "which in turn leads to…".', ex: 'Inattentive children show less concern for peers, which in turn relates to more peer problems (Andrade & Tannock, 2013).' },
      { n: 'Moderator variable', ask: 'Does the effect depend on something, getting stronger, weaker or disappearing?',
        def: 'A third variable that influences the relationship between an independent variable and a dependent variable. In a factorial design, the effect of moderator variables is revealed as interactions.',
        signs: '"Only when…", "but not for…", "stronger for…". It changes the A → B link itself.', ex: 'People eat more when a companion overindulges, only when that companion is unsociable (when the companion is sociable, how much they eat makes no difference).' }
    ],
    hook: { t: 'Stowaway, puppeteer, middle step, dimmer switch',
      p: 'A {b:confound} is a stowaway riding along with your variable. A {b:third variable} is a puppeteer pulling both strings. A {b:mediator} is the middle step (A → M → B). A {b:moderator} is a dimmer switch that changes how strongly A affects B.' },
    traps: ['The textbook’s own line: {g:"third variables cause the apparent relationship between two other variables, whereas confounding variables are intertwined with another variable in your study so that you cannot tell which is at work."}', '{r:Mediator vs moderator:} a mediator explains {g:how} A affects B; a moderator changes {g:whether or how much} A affects B.'],
    t: ['Confounding variable', 'Third variable', 'Mediating variable', 'Moderator variable'],
    items: [
      { q: 'People who drink more alcohol have lower grades. Poor decision-making skills might lead people both to drink more and to get lower grades.', a: 'Third variable', e: 'Decision-making would {g:cause both} measured variables, creating the correlation. That is the textbook’s third-variable example.' },
      { q: 'In the same alcohol-and-grades study, heavier drinkers also spend much more time socializing, and the study has no way to separate drinking from socializing. Socializing doesn’t cause the drinking; the two just come together.', a: 'Confounding variable', e: 'Socializing is {g:intertwined} with drinking, so you can’t tell which is at work. It doesn’t cause the drinking, which is why the textbook calls it a confound, not a third variable.' },
      { q: 'Inattention in children is linked to peer problems, partly because inattentive children show less concern for their peers, which in turn leads to peer problems.', a: 'Mediating variable', e: 'Prosocial concern is the {g:process in the middle} that helps explain how inattention relates to peer problems.' },
      { q: 'Watching a companion eat a lot makes people eat more, but only when the companion is unsociable.', a: 'Moderator variable', e: '"Only when" means sociability {g:changes the relationship} itself. Revealed as an interaction in a factorial design.' },
      { q: 'In an exercise experiment, the exercise group spends an hour away from their daily routine at a class. The control group just continues their normal day.', a: 'Confounding variable', e: 'Having a {g:break from routine} differs between conditions along with exercise, so either could explain any change in happiness.' },
      { q: 'Exercise and happiness are positively correlated in a survey. Higher income could give people the time and money to exercise and also make them happier.', a: 'Third variable', e: 'Income is an unmeasured variable that could {g:produce both}, creating the association.' },
      { q: 'Students who listen to soft music during an exam score higher, and the effect works through lower test anxiety.', a: 'Mediating variable', e: 'Test anxiety is the {g:step between} music and exam score: music → less anxiety → higher scores.' },
      { q: 'Telling a lie (versus the truth) barely changes head movements for non-psychopathic inmates, but greatly increases head movements for psychopathic inmates.', a: 'Moderator variable', e: 'Psychopathy {g:changes the effect} of lying on head movements. In the textbook’s IV × PV example this shows up as an interaction.' },
      { q: 'A researcher uses academic average to measure intelligence, but academic average also reflects motivation and conscientiousness, which also predict the outcome being studied.', a: 'Confounding variable', e: 'An imprecise {g:operationalization} lets other variables ride along with intelligence: the textbook’s example of a confound built into a measure.' }
    ] });

  /* ---------------------------------------------------------------- 4. THEORY / HYPOTHESIS / PREDICTION */
  C.push({ id: 'thp', title: 'Theory, hypothesis or prediction?', ch: 'Ch. 2 & 5 · Lecture 2', icon: 'bulb',
    blurb: 'Three levels of claim, from the broadest framework down to what you expect in one specific study.',
    guide: [
      { n: 'Theory', ask: 'Does it organize and explain many findings, and generate new hypotheses?',
        def: 'A framework that organizes and explains various findings related to a particular phenomenon, and in doing so generates new, testable hypotheses about that phenomenon.',
        signs: 'Big, organized, explains many past observations. Two functions: organize/explain past observations, and generate new knowledge.', ex: 'Fuzzy trace theory: verbatim memory is relatively accurate; gist memory is relatively inaccurate.' },
      { n: 'Research hypothesis', ask: 'Is it a testable statement about conceptual variables, which may or may not be true?',
        def: 'A statement about a phenomenon that may or may not be true, is informed by past research or derived from a broader theory, and requires further evidence to support or refute it.',
        signs: 'General, conceptual terms ("cognitive tasks", "aggression"). Not tied to one study’s procedures.', ex: '"A crowded environment results in worse performance on cognitive tasks compared to an uncrowded environment."' },
      { n: 'Prediction', ask: 'Does it say exactly what will happen in this particular study, with its measures and conditions?',
        def: 'A statement that makes a specific assertion about what is believed will occur. Predictions are tied to the methods of a particular study and are often in the future tense.',
        signs: 'Operational details: the specific task, groups, measure. "Participants in the X condition will…".', ex: '"Participants in the uncrowded condition will perform better on a delayed recall task than participants in the crowded condition."' }
    ],
    hook: { t: 'Map → route → next turn', p: 'A {b:theory} is the whole map. A {b:hypothesis} is one route you think exists ("crowding hurts thinking"). A {b:prediction} is the next turn you’ll actually see in {b:this} study ("the crowded group will recall fewer words"). From the lecture: predictions get riskier from non-directional (some relationship), to directional (which way), to point (exactly how much). The riskier the prediction, the more you gain if it holds.' },
    traps: ['{r:Specific ≠ prediction automatically.} Ask whether it names the study’s {g:operationalizations}. "Schizophrenia is caused by a virus" is a hypothesis; "people with the diagnosis will have more herpes simplex antibodies in a 50 cc blood draw" is a prediction.', 'If results match the prediction, the hypothesis is {g:supported, not proven}.'],
    t: ['Theory', 'Research hypothesis', 'Prediction'],
    items: [
      { q: 'There are separate memory systems for working with information in the moment and for storing it for later, an idea that accounts for different memory deficits after damage to different brain areas.', a: 'Theory', e: 'It {g:organizes and explains} many observations (the working memory / long-term memory theory).' },
      { q: 'A crowded environment results in worse performance on cognitive tasks compared to an uncrowded environment.', a: 'Research hypothesis', e: 'General, conceptual ("cognitive tasks"), not tied to one study. The textbook’s hypothesis example.' },
      { q: 'Participants in the uncrowded condition will perform better on a delayed recall task than participants in the crowded condition.', a: 'Prediction', e: 'Names the specific task ({g:delayed recall}) and conditions, in future tense: the textbook’s prediction example.' },
      { q: 'Schizophrenia is caused by a virus.', a: 'Research hypothesis', e: 'A testable claim in conceptual terms. No specific measure or study is named (lecture example).' },
      { q: 'People with a schizophrenia diagnosis will have more herpes simplex antibodies in a 50 cc blood draw than people without the diagnosis.', a: 'Prediction', e: 'Specific groups and an exact measure: what this study {g:will} find if the hypothesis is right.' },
      { q: 'Verbatim memory is relatively accurate, while gist memory is relatively inaccurate, and this framework organizes many findings about false memories.', a: 'Theory', e: 'Fuzzy trace theory, a framework that organizes findings and generates hypotheses (lecture).' },
      { q: 'Time pressure increases the use of gist memory and interferes with verbatim memory.', a: 'Research hypothesis', e: 'Derived from fuzzy trace theory, stated in conceptual terms (lecture).' },
      { q: 'After studying the list "hot, snow, warm, winter, ice, wet, frigid, chilly…", participants will falsely remember seeing the word "cold."', a: 'Prediction', e: 'A specific assertion about what will occur with {g:this word list} in this study (lecture).' }
    ] });

  /* ---------------------------------------------------------------- 5. RELIABILITY */
  C.push({ id: 'rel', title: 'Three kinds of reliability', ch: 'Ch. 6', icon: 'bulls',
    blurb: 'Consistency across time, across items, or across raters. Find which one the evidence shows.',
    guide: [
      { n: 'Test-retest reliability', ask: 'Same people, same measure, two occasions: do the scores match?',
        def: 'A form of reliability assessed by administering the same measure on two different occasions, and then calculating the correlation between the two different scores obtained.',
        signs: 'Two time points, correlation between Time 1 and Time 2.', ex: 'An intelligence test given twice, two weeks apart, yields highly correlated scores.' },
      { n: 'Internal consistency reliability', ask: 'Do the items within one scale all measure the same thing?',
        def: 'A form of reliability assessing the degree to which the items in a scale are consistent in measuring the same construct or variable. Assessed with split-half reliability, Cronbach’s alpha, or coefficient omega.',
        signs: 'One occasion, many items: split-half correlation, Cronbach’s alpha, omega.', ex: 'Split-half: correlate scores on one half of a scale with scores on the other half.' },
      { n: 'Inter-rater reliability', ask: 'Do two or more observers agree?',
        def: 'An indicator of reliability that examines the degree to which two or more raters agree, having the same or similar judgments for a set of stimuli.',
        signs: 'Coders, judges, observers rating the same things.', ex: 'Two observers independently code the same playground videos for aggression.' }
    ],
    hook: { t: 'Again? Inside? Agree?', p: '{b:Test-retest:} same result {b:again} later? {b:Internal consistency:} do the items {b:inside} the scale hang together? {b:Inter-rater:} do the raters {b:agree}? Remember: reliability is consistency, not accuracy. A bathroom scale used as a "Fear of Heights Measuring Machine" is highly reliable and not valid at all.' },
    traps: ['{r:Reliability ≠ validity.} A measure can be highly reliable and still not measure what it’s supposed to.', 'All measures have some {g:measurement error}: score = true score + error. Reliability is about keeping that error small.'],
    t: ['Test-retest reliability', 'Internal consistency reliability', 'Inter-rater reliability'],
    items: [
      { q: 'The same anxiety questionnaire is given to the same students in September and again in October. The two sets of scores correlate at .85.', a: 'Test-retest reliability', e: 'Same measure, {g:two occasions}, correlation between them.' },
      { q: 'On a 20-item self-esteem scale, people’s scores on the odd-numbered items correlate strongly with their scores on the even-numbered items.', a: 'Internal consistency reliability', e: '{g:Split-half} reliability, one way of assessing internal consistency.' },
      { q: 'A 10-item scale of procrastination has a Cronbach’s alpha of .88.', a: 'Internal consistency reliability', e: 'Cronbach’s alpha averages the correlation of {g:each item with every other item}.' },
      { q: 'Two observers independently code the same playground videos for acts of aggression and agree on 92% of incidents.', a: 'Inter-rater reliability', e: 'Two {g:raters}, same stimuli, high agreement.' },
      { q: 'A reaction-time task gives each participant nearly the same average score when they redo it one week later.', a: 'Test-retest reliability', e: 'Consistency {g:across time} for the same people.' },
      { q: 'Three judges each score the same 40 children’s drawings for creativity, and their scores are highly similar.', a: 'Inter-rater reliability', e: 'Agreement {g:among judges} rating the same set of stimuli.' }
    ] });

  /* ---------------------------------------------------------------- 6. VALIDITY */
  C.push({ id: 'val', title: 'Six kinds of validity evidence', ch: 'Ch. 6', icon: 'target',
    blurb: 'All six build the case for construct validity, each with a different kind of evidence. Most mix-ups are concurrent vs predictive and convergent vs discriminant.',
    guide: [
      { n: 'Face validity', ask: 'Does the measure look, on the face of it, like it measures the variable?',
        def: 'The degree to which a measure appears to measure the intended variable. A subjective judgment, and not sufficient on its own.',
        signs: 'Looks right, seems obvious, appears to measure.', ex: 'The PCL-R asks about low empathy, pathological lying, impulsivity and charm, which all look like psychopathy.' },
      { n: 'Content validity', ask: 'Does it cover every aspect of the construct, and nothing extra?',
        def: 'Evaluated by comparing the content of the measure to the theoretical definition of the construct, ensuring that all aspects of the construct are measured and no extraneous elements are also measured.',
        signs: 'All aspects, the full definition, nothing extraneous.', ex: 'A psychopathy measure must cover interpersonal callousness, unemotionality, impulsivity and antisocial behaviour, and nothing more.' },
      { n: 'Predictive validity', ask: 'Does it predict a theoretically relevant FUTURE behaviour or criterion?',
        def: 'Examining if a measure can predict a theoretically relevant future behaviour or criterion; also known as criterion validity.',
        signs: 'Measured now, criterion later.', ex: 'PCL-R scores predicted which offenders were convicted again over the next ten years.' },
      { n: 'Concurrent validity', ask: 'Does it relate to a criterion measured AT THE SAME TIME?',
        def: 'Examines whether the measure can predict a criterion measured at the same time, rather than a future criterion. One common method: test whether groups of people differ on the measure in expected ways.',
        signs: 'Same time, known groups differ (e.g., plagiarizers vs non-plagiarizers).', ex: 'Students who plagiarized scored higher on a psychopathy scale than students who didn’t.' },
      { n: 'Convergent validity', ask: 'Is it related to other measures of the SAME or SIMILAR constructs?',
        def: 'The extent to which scores on the measure are related to other measures of the same or similar constructs.',
        signs: 'Correlates with a similar measure.', ex: 'The PCL correlated positively with antisocial personality disorder.' },
      { n: 'Discriminant validity', ask: 'Is it UNrelated to measures of conceptually unrelated constructs?',
        def: 'Scores on a measure are not related to scores on conceptually unrelated measures; also known as divergent validity.',
        signs: 'Weak or no correlation with something it shouldn’t relate to.', ex: 'The PCL showed weak or null correlations with schizophrenia, so it isn’t just measuring "mental illness" in general.' }
    ],
    hook: { t: 'Three pairs', p: '{b:Look at it:} face (looks right) vs content (covers it all, nothing extra). {b:Behaviour, by time:} predictive (future) vs concurrent (same time). {b:Other measures:} convergent (similar → related) vs discriminant (unrelated → unrelated). All six are evidence for the umbrella: {b:construct validity}.' },
    traps: ['{r:Concurrent vs predictive} is only about {g:when} the criterion is measured.', '{r:Face validity alone isn’t enough:} magazine quizzes look reasonable but tell you little, while REM sleep is a valid indicator of dreaming without obvious face validity.'],
    t: ['Face validity', 'Content validity', 'Predictive validity', 'Concurrent validity', 'Convergent validity', 'Discriminant validity'],
    items: [
      { q: 'A new psychopathy checklist asks about pathological lying, low empathy and impulsive behaviour, items that obviously seem related to psychopathy.', a: 'Face validity', e: 'It {g:appears}, on the surface, to measure the construct.' },
      { q: 'Experts confirm that a new psychopathy measure includes items on all four aspects of the construct, and no items about anything else.', a: 'Content validity', e: 'Content compared with the {g:full theoretical definition}: all aspects, nothing extraneous.' },
      { q: 'Psychopathy scores taken from offenders before release predict which of them are convicted of another offence over the following ten years.', a: 'Predictive validity', e: 'A theoretically relevant {g:future} criterion (the textbook’s Wormith et al. example).' },
      { q: 'University students who plagiarized score higher on a self-report psychopathy scale than students who did not, with both measured during the same term.', a: 'Concurrent validity', e: 'Groups that {g:currently} differ score differently: the textbook’s known-groups method for concurrent validity.' },
      { q: 'Scores on a new psychopathy measure correlate positively with scores on a measure of antisocial personality disorder, a related construct.', a: 'Convergent validity', e: 'Related to a measure of a {g:similar construct}.' },
      { q: 'A psychopathy measure shows only weak or null correlations with measures of schizophrenia.', a: 'Discriminant validity', e: 'Unrelated to a {g:conceptually unrelated} construct, showing it isn’t measuring mental illness in general.' },
      { q: 'An academic motivation questionnaire completed at the start of term predicts students’ final grades at the end of term.', a: 'Predictive validity', e: 'The textbook’s own example: future grades are the {g:criterion}.' },
      { q: 'A new shyness scale correlates strongly with an established, widely used shyness scale.', a: 'Convergent validity', e: 'Two measures of the {g:same construct} converge.' },
      { q: 'People who score high versus low on a psychopathy measure divide $20 differently between themselves and another participant in the same session.', a: 'Concurrent validity', e: 'Behaviour measured {g:at the same time} differs as expected for high and low scorers (textbook ultimatum-game example).' },
      { q: 'Scores on a new test-anxiety scale are unrelated to scores on a test of musical taste.', a: 'Discriminant validity', e: 'No relationship with a {g:conceptually unrelated} measure, as it should be.' }
    ] });

  /* ---------------------------------------------------------------- 7. SCALES */
  C.push({ id: 'scales', title: 'Scales of measurement', ch: 'Ch. 6', icon: 'ruler',
    blurb: 'Nominal, ordinal, interval and ratio. The scale decides which comparisons and statistics make sense.',
    guide: [
      { n: 'Nominal', ask: 'Are the values just different categories, with no order or amount?',
        def: 'A scale of measurement with two or more categories that have no numerical properties (e.g., no "less than" or "greater than"); also known as categorical variables.',
        signs: 'Names, labels, types.', ex: 'Nationality: the values differ, but not in amount.' },
      { n: 'Ordinal', ask: 'Can you rank them, but not say how far apart they are?',
        def: 'A scale of measurement in which the measurement categories form a rank order along a continuum. We don’t know the distance between levels.',
        signs: 'First/second/third, high/medium/low.', ex: 'Olympic medals; birth order; high, medium and low socio-economic status.' },
      { n: 'Interval', ask: 'Are the steps equal, but zero is just an arbitrary point?',
        def: 'A scale of measurement in which the intervals between numbers on the scale are all equal in size. Zero does not mean absence, so ratios can’t be formed.',
        signs: 'Equal steps; "twice as much" is not allowed.', ex: 'Celsius temperature (20°C is not twice as warm as 10°C); Wechsler IQ scores.' },
      { n: 'Ratio', ask: 'Is there a meaningful zero, so "twice as much" makes sense?',
        def: 'A numeric scale of measurement, with equal intervals, in which there is a meaningful zero point, indicating total absence of the variable being measured (e.g., weight, duration, reaction time). Ratios can be formed.',
        signs: 'Real zero; time, weight, counts, length, Kelvin.', ex: 'A person who weighs 100 kg weighs twice as much as one who weighs 50 kg.' }
    ],
    hook: { t: 'NOIR', p: '{b:N}ame (categories) → {b:O}rder (ranks) → {b:I}nterval (equal steps) → {b:R}atio (real zero). Each level keeps everything below it and adds one property. Quick test: if "twice as much" makes sense, it’s ratio.' },
    traps: ['Rating scales (e.g., 1–7) are {r:actually ordinal}, but the textbook notes they behave as interval scales when averaged across many items or participants.', 'Interval zero is arbitrary: 0°C equals 32°F.'],
    t: ['Nominal', 'Ordinal', 'Interval', 'Ratio'],
    items: [
      { q: 'Participants indicate which country they were born in.', a: 'Nominal', e: 'Categories that {g:differ but not in amount}.' },
      { q: 'Runners are recorded as finishing first, second or third.', a: 'Ordinal', e: 'A {g:rank order}, with no information about how far apart they finished.' },
      { q: 'A thermometer records the room temperature in degrees Celsius.', a: 'Interval', e: 'Equal steps, but 0°C isn’t an absence of temperature, so no ratios.' },
      { q: 'Reaction time is recorded in milliseconds.', a: 'Ratio', e: 'A meaningful zero, so 600 ms really is {g:twice} 300 ms.' },
      { q: 'Families are classified as high, medium or low socio-economic status.', a: 'Ordinal', e: 'Ordered categories with unknown distances between them (textbook example).' },
      { q: 'Full-scale scores on the Wechsler intelligence test.', a: 'Interval', e: 'The textbook: equal differences between scores, but {g:no absolute zero} meaning "no intelligence."' },
      { q: 'The number of words a participant recalls from a list of 30.', a: 'Ratio', e: 'Zero means none recalled; 20 words is twice 10.' },
      { q: 'Participants are categorized by their clinical diagnosis (e.g., depression, anxiety disorder, no diagnosis).', a: 'Nominal', e: 'Labels with no numerical properties.' }
    ] });

  /* ---------------------------------------------------------------- 8. THREATS */
  C.push({ id: 'threats', title: 'Threats to internal validity', ch: 'Ch. 10 & 12', icon: 'storm',
    blurb: 'Seven ways something other than the manipulation can explain a change. Learn the one question that identifies each.',
    guide: [
      { n: 'History', ask: 'Did an outside event happen between the pretest and posttest?',
        def: 'Threats to internal validity, in which outside events not part of the manipulation influence the dependent variable, providing an alternative explanation for the results.',
        signs: 'News, disasters, a celebrity death, a policy change during the study.', ex: 'A famous person dies of lung cancer during a smoking program.' },
      { n: 'Maturation', ask: 'Would people have changed naturally with time anyway?',
        def: 'Threats to internal validity, in which any naturally occurring change within individuals that occurs over time could provide an alternative explanation for the results.',
        signs: 'Fatigue, boredom, hunger, growing up, recovering.', ex: 'Children become more coordinated and analytical over a school year regardless of any program.' },
      { n: 'Testing', ask: 'Did simply taking the pretest change people?',
        def: 'Threats to internal validity in which simply taking a pretest changes behaviour, without any effect of the independent variable.',
        signs: 'Pretest makes behaviour salient, sensitizes people, or gives practice.', ex: 'Keeping a pretest diary of every cigarette makes people notice how much they smoke, and they cut down.' },
      { n: 'Instrument decay', ask: 'Did the measuring tool, or the person using it, change over time?',
        def: 'A threat to internal validity in which the characteristics of the measurement instrument change over time, providing an alternative explanation for the results observed.',
        signs: 'Failing batteries, buggy software, observers who get tired, more skilled, or change their standards.', ex: 'Smokers stop recording every cigarette by the end of the study, so fewer get counted.' },
      { n: 'Regression toward the mean', ask: 'Were people picked because their scores were extreme?',
        def: 'A statistical phenomenon in which extreme scores on a variable tend to be closer to the mean when a measurement is repeated; this change can be mistakenly attributed to some manipulation or intervention.',
        signs: '"The lowest scorers", "the heaviest smokers", "the top performers" are selected, then retested.', ex: 'Athletes’ performance often drops after they appear on a magazine cover (the "cover jinx").' },
      { n: 'Selective attrition', ask: 'Did different kinds of people drop out of different conditions?',
        def: 'The loss of participants by way of individuals choosing to drop out of an experiment. A threat when dropout results in a difference between conditions on some participant characteristic, causing a confound.',
        signs: 'Dropouts, especially when they differ by condition.', ex: 'The heaviest smokers drop out of the treatment group, so it looks like a group of lighter smokers at the posttest.' },
      { n: 'Selection differences', ask: 'Were the groups formed in some way other than random assignment?',
        def: 'Differences in the type of participants who make up each group in a between-subjects design. When groups are formed by anything other than random assignment, pre-existing differences are an alternative explanation.',
        signs: 'Volunteers vs non-volunteers, existing classes, people who chose their condition.', ex: 'People who choose to pay for an exercise class may also have more money than those who don’t.' }
    ],
    hook: { t: 'Where did the alternative explanation come from?', p: 'From the {b:world} (history), from {b:inside the person} (maturation), from the {b:pretest} (testing), from the {b:ruler} (instrument decay), from {b:picking extremes} (regression), from {b:who left} (attrition), or from {b:who ended up in which group} (selection).' },
    traps: ['{r:Maturation vs history:} maturation comes from inside the person and would happen to anyone over time; history is an outside {g:event}.', '{r:Testing vs instrument decay:} testing means the {g:people} changed because of the pretest; instrument decay means the {g:measuring} changed.'],
    t: ['History', 'Maturation', 'Testing', 'Instrument decay', 'Regression toward the mean', 'Selective attrition', 'Selection differences'],
    items: [
      { q: 'Between the pretest and posttest of a stop-smoking program, a famous actor dies of lung cancer and it’s all over the news.', a: 'History', e: 'An {g:outside event}, not part of the program, could explain reduced smoking.' },
      { q: 'A year-long reading program for Grade 1 students shows big gains, but six-year-olds’ reading improves over a school year anyway.', a: 'Maturation', e: 'Natural {g:development over time} could explain the gains.' },
      { q: 'For the pretest, smokers keep a diary of every cigarette. Just keeping the diary makes them notice how much they smoke, and they cut back before any treatment.', a: 'Testing', e: 'Taking the {g:pretest itself} changed behaviour (the textbook’s example).' },
      { q: 'Observers rating classroom disruptions become stricter and more fatigued as the semester goes on.', a: 'Instrument decay', e: 'The human {g:measuring instrument} changed over time.' },
      { q: 'Only the 20 students with the very worst midterm scores are put into a tutoring program. Their final exam scores are noticeably higher.', a: 'Regression toward the mean', e: 'People chosen for {g:extreme} scores tend to score closer to the mean when measured again, tutoring or not.' },
      { q: 'In a smoking-treatment experiment, the heaviest smokers in the treatment group drop out, while almost no one leaves the control group.', a: 'Selective attrition', e: 'Dropout {g:differs by condition}, so the groups are no longer equivalent at the posttest.' },
      { q: 'Employees who volunteered for a stress workshop are later compared with employees who didn’t sign up.', a: 'Selection differences', e: 'The groups {g:sorted themselves}; volunteers may differ in many ways before the workshop.' },
      { q: 'An athlete has a record-breaking season and is featured on a magazine cover. The next season, their performance drops.', a: 'Regression toward the mean', e: 'Chosen for {g:exceptionally high} performance, likely to be lower on the next measurement (the textbook’s cover-jinx example).' },
      { q: 'Right after the pretest of a well-being program for recently immigrated families, a natural disaster devastates the region several families came from.', a: 'History', e: 'The textbook’s tsunami example: an {g:outside event} affects the posttest.' },
      { q: 'A reaction-time program’s timer slowly loses battery power over the session, recording slower times near the end.', a: 'Instrument decay', e: 'The instrument {g:literally deteriorates}.' },
      { q: 'Participants in a 3-hour testing session become tired and hungry, and their scores fall in the final hour.', a: 'Maturation', e: 'The textbook includes short-term states like {g:fatigue and hunger} as maturation.' }
    ] });

  /* ---------------------------------------------------------------- 9. QUASI DESIGNS */
  C.push({ id: 'quasi', title: 'Quasi-experimental designs', ch: 'Ch. 12', icon: 'series',
    blurb: 'Six designs, roughly from weakest to strongest. You can identify each by counting the groups and the measurements.',
    guide: [
      { n: 'One-group posttest-only', ask: 'One group, measured once, after?', def: 'A quasi-experimental design that has no control group and no pretest comparison; a very poor design in terms of internal validity.', signs: 'No comparison of any kind.', ex: 'Sit next to strangers and time how long until they leave, with nothing to compare it to.' },
      { n: 'One-group pretest-posttest', ask: 'One group, measured before and after?', def: 'A quasi-experimental design in which the effect of an independent variable is inferred from the pretest-posttest difference in a single group.', signs: 'Before → treatment → after, no other group.', ex: 'Measure smoking, give relaxation training, measure smoking again.' },
      { n: 'Non-equivalent control group', ask: 'Two existing groups, measured once, after?', def: 'A quasi-experimental design in which the groups of participants in the different conditions are not equivalent (e.g., studying naturally occurring groups), and there is no pretest.', signs: 'A comparison group that wasn’t randomly assigned; posttest only.', ex: 'One class gets a new method, another class doesn’t; both are tested at the end.' },
      { n: 'Non-equivalent control group pretest-posttest', ask: 'Two existing groups, measured before and after?', def: 'A quasi-experimental design in which non-equivalent groups are used, but a pretest allows assessment of equivalency and pretest-posttest changes. One of the most useful quasi-experimental designs.', signs: 'Existing groups + a pretest for both.', ex: 'Both classes take a pretest at the start of term and a posttest at the end.' },
      { n: 'Interrupted time series', ask: 'One group, many measurements before and after?', def: 'A quasi-experimental design in which a treatment is investigated by examining a series of measurements made over an extended time period, both before and after the treatment is introduced.', signs: 'Years or months of data around a change; often archival.', ex: 'Ontario driver fatalities from 1990 to 1998, before and after a 1996 drunk-driving law.' },
      { n: 'Control series', ask: 'A time series, plus a comparison series?', def: 'An extension of the interrupted time series quasi-experimental design in which there is a comparison or control group.', signs: 'Same long series for a group that didn’t get the change.', ex: 'Ontario’s fatality series compared with Manitoba and New Brunswick, which passed no such law.' }
    ],
    hook: { t: 'Count groups × measurements', p: '1 group, 1 measure → {b:one-group posttest-only}. 1 group, 2 → {b:one-group pretest-posttest}. 2 groups, 1 → {b:NECG}. 2 groups, 2 → {b:NECG pretest-posttest}. 1 group, many → {b:interrupted time series}. 2+ groups, many → {b:control series}. Adding groups or measurements rules out more alternative explanations.' },
    traps: ['"Non-equivalent" means groups were {r:not randomly assigned}, so even with a pretest, a quasi-experiment cannot support causal inferences like a true experiment.', 'One-group designs can’t rule out {g:history, maturation, testing, instrument decay or regression}.'],
    t: ['One-group posttest-only', 'One-group pretest-posttest', 'Non-equivalent control group', 'Non-equivalent control group pretest-posttest', 'Interrupted time series', 'Control series'],
    items: [
      { q: 'A campus launches an anti-littering campaign. A week later, researchers count litter on the quad once.', a: 'One-group posttest-only', e: 'One group, one measurement, {g:no comparison} at all.' },
      { q: 'Smokers’ daily cigarettes are counted, they complete relaxation training, and their cigarettes are counted again.', a: 'One-group pretest-posttest', e: 'Change within {g:one group} from pretest to posttest.' },
      { q: 'One section of a course is taught with a new method and another section the usual way. Both are given the same final exam; there was no test at the start.', a: 'Non-equivalent control group', e: 'Two {g:existing groups}, posttest only.' },
      { q: 'Two sections of a course are compared on a new teaching method; both sections write a pretest in week 1 and a posttest at the end of term.', a: 'Non-equivalent control group pretest-posttest', e: 'Existing groups plus a pretest to {g:check equivalency} and measure change.' },
      { q: 'Driver fatalities in Ontario are tracked for every year from 1990 to 1998, before and after a 1996 law suspending drunk drivers’ licences.', a: 'Interrupted time series', e: 'A long {g:series of measurements} before and after one change (the textbook example).' },
      { q: 'The Ontario fatality series is compared with the same years in Manitoba and New Brunswick, which passed no similar law.', a: 'Control series', e: 'A time series {g:plus a comparison series}. Steady rates in the control provinces strengthened the conclusion.' },
      { q: 'Monthly visits to a public library are recorded for two years before and two years after it starts opening on Sundays.', a: 'Interrupted time series', e: 'One site, {g:many measurements} on both sides of the change.' },
      { q: 'Care-home residents who joined a walking group and residents who didn’t are both measured on mood before and after the 12-week program.', a: 'Non-equivalent control group pretest-posttest', e: 'Self-selected (non-equivalent) groups, with a pretest for both.' }
    ] });

  /* ---------------------------------------------------------------- 10. DEVELOPMENTAL & SINGLE CASE */
  C.push({ id: 'dev', title: 'Developmental and single case designs', ch: 'Ch. 12', icon: 'cohort',
    blurb: 'Designs for studying change with age, and for studying a single participant.',
    guide: [
      { n: 'Cross-sectional', ask: 'Different age groups, tested once?', def: 'A developmental research method in which people of different ages are studied at a single point in time; conceptually similar to a between-subjects design. Cohort effects are confounded with age.', signs: 'Fast and cheap, but age is tangled with cohort.', ex: 'Test 20-, 30-, 40- and 50-year-olds on learning new software in the same week.' },
      { n: 'Longitudinal', ask: 'The same people, followed as they age?', def: 'A developmental research method in which the same people are observed repeatedly as they grow older; conceptually similar to a within-subjects design.', signs: 'Repeated testing; slow, expensive, attrition.', ex: 'The same children are tested every year from age 5 to 15.' },
      { n: 'Sequential', ask: 'Several age groups, each followed over time?', def: 'A combination of cross-sectional and longitudinal designs to study developmental research questions.', signs: 'Multiple cohorts, each tracked longitudinally.', ex: 'Groups of 50- and 60-year-olds are each re-tested every few years.' },
      { n: 'Reversal design', ask: 'Baseline → treatment → treatment withdrawn (→ again)?', def: 'Demonstrating that observed effects fade once an intervention is withdrawn. The treatment is introduced after a baseline period, then withdrawn during a second baseline (ABA, a withdrawal design); it may be extended (ABAB).', signs: 'A–B–A or A–B–A–B.', ex: 'Stars for correct homework problems are introduced, removed, then reintroduced.' },
      { n: 'Multiple baseline', ask: 'The treatment starts at different times across people, behaviours or settings?', def: 'Observing behaviour before and after a manipulation under multiple circumstances (across different individuals, different behaviours, or different settings).', signs: 'Staggered start times.', ex: 'A smoking-reduction manipulation is introduced at a different week for each of four people.' }
    ],
    hook: { t: 'Snapshot, home movie, or both', p: '{b:Cross-sectional} is a snapshot of different ages. {b:Longitudinal} is a home movie of the same people. {b:Sequential} is several home movies started at different ages. For one person: {b:reversal} switches the treatment off and on; {b:multiple baseline} staggers the start.' },
    traps: ['ABAB beats ABA: a second reversal makes coincidence less likely, and it {g:ends with the treatment}, which is more ethical.', 'In multiple baseline, change that lines up with {g:each staggered start} rules out chance and historical events.'],
    t: ['Cross-sectional', 'Longitudinal', 'Sequential', 'Reversal design', 'Multiple baseline'],
    items: [
      { q: 'Researchers test 20-, 30-, 40- and 50-year-olds on how quickly they learn new software, all in the same month.', a: 'Cross-sectional', e: 'Different ages at {g:one point in time} (the textbook example).' },
      { q: 'The same 300 children are given a reading test every year from age 5 to age 15.', a: 'Longitudinal', e: 'The {g:same people}, observed repeatedly as they grow older.' },
      { q: 'A group of 60-year-olds and a group of 70-year-olds are each re-tested on memory every two years for a decade.', a: 'Sequential', e: 'Different age groups (cross-sectional) {g:each followed over time} (longitudinal).' },
      { q: 'After a baseline week of counting a child’s correct homework problems, the child earns stars for each correct problem. The stars are then stopped, and later reintroduced, while correct problems are counted daily.', a: 'Reversal design', e: 'Baseline → treatment → withdrawal → treatment: an {g:ABAB} reversal.' },
      { q: 'A reward program starts for one child in week 2, a second child in week 4 and a third in week 6. Each child’s behaviour improves only after their own start.', a: 'Multiple baseline', e: 'Multiple baseline {g:across individuals}, with staggered start times.' },
      { q: 'One teenager’s socializing, grooming and reading are each targeted by a reward system, introduced at a different time for each behaviour.', a: 'Multiple baseline', e: 'Multiple baseline {g:across behaviours} (the textbook example).' }
    ] });

  /* ---------------------------------------------------------------- 11. FIX THE DESIGN */
  C.push({ id: 'fix', title: 'Fix the design', ch: 'Ch. 5, 10, 11 & 12', icon: 'wrench', fix: true,
    blurb: 'Andrew’s multiple-choice questions ask how a researcher could improve a design. Match each problem to the textbook’s fix.',
    guide: [
      { n: 'Order effects → counterbalancing', ask: 'Did everyone get the conditions in the same order?', def: 'Counterbalancing: a method of controlling for order effects in a within-subjects design, by either including all possible orders of presentation for conditions or randomly determining the order for each participant. With many conditions, a Latin square uses a limited set of orders. A time interval between treatments can also help.', signs: 'Practice, fatigue or contrast effects.', ex: 'Half "listen then read", half "read then listen".' },
      { n: 'Demand characteristics → disguise', ask: 'Can participants tell what you expect?', def: 'Use deception or a cover story, disguise the dependent measure (an unobtrusive measure, or filler items in a questionnaire), or ask participants what they thought the study was about.', signs: 'Participants know the hypothesis.', ex: 'Embed the attitude item among unrelated filler items.' },
      { n: 'Experimenter bias → blind procedures', ask: 'Could the experimenter’s expectations leak in?', def: 'Single-blind: participants don’t know their condition, but the experimenter does. Double-blind: neither the experimenter nor the participant knows.', signs: 'Whoever interacts with participants or scores them knows the condition.', ex: 'Have a rater who doesn’t know conditions score the videos.' },
      { n: 'Placebo effect → placebo group', ask: 'Could expecting a treatment to work cause the improvement?', def: 'A placebo group is a control group given the expectation of improvement through treatment, in order to control for the psychological effects of receiving a treatment.', signs: 'A drug or therapy compared with nothing at all.', ex: 'Give the control group a sugar pill.' },
      { n: 'Ceiling/floor → sensitive measure', ask: 'Is everyone scoring near the top or the bottom?', def: 'A ceiling effect is the failure of a measure to detect a difference because it was too easy; a floor effect because it was too difficult. Use a measure sensitive enough to detect differences (e.g., a rating scale instead of yes/no).', signs: 'Scores bunched at the maximum or minimum.', ex: 'Lengthen the word list so recall isn’t near perfect.' },
      { n: 'Weak or unclear manipulation → strength + check', ask: 'Were the levels too similar, or did the manipulation even work?', def: 'Make the manipulation as strong as possible (levels maximally different, everything else the same), and use a manipulation check to determine whether it had its intended effect.', signs: 'No effect found; unsure if participants experienced the IV.', ex: 'Compare high vs no risk instead of high vs less risk; ask how rejected people felt.' },
      { n: 'Unequal groups → pretest or matching', ask: 'With few participants, could the groups start out different?', def: 'A pretest checks equivalency (and helps assess selective attrition). A matched pairs design matches participants on a characteristic, then randomly assigns one member of each pair to each condition.', signs: 'Small samples, dropout risk.', ex: 'Match on a memory pretest, then randomly assign within pairs.' },
      { n: 'One group, no comparison → add a comparison', ask: 'Can history, maturation or testing explain the change?', def: 'Add a comparison group (non-equivalent control group pretest-posttest), a series of measurements (interrupted time series), or both (control series). Use random assignment for a true experiment whenever possible.', signs: 'Before–after in a single group.', ex: 'Compare with a similar school that didn’t get the program.' }
    ],
    hook: { t: 'Name the problem, then the textbook fix', p: 'Most "how could the researcher improve this?" questions come down to naming the problem first ({b:order effects, demand characteristics, experimenter bias, placebo effects, ceiling/floor, weak manipulation, non-equivalent groups, no comparison}), then choosing the matching fix.' },
    traps: ['{r:Single-blind isn’t enough} when the experimenter’s expectations are the problem; you need double-blind.', 'A {r:pretest can backfire}: it may sensitize participants to the hypothesis. Disguise it among irrelevant measures, or test its effect (Solomon four-group design).'],
    items: [
      { q: 'Every participant does a memory task with music first and in silence second. Everyone scores higher in the second condition.', o: ['Counterbalance the order: half do music first, half do silence first', 'Add a placebo group that hears fake "music" made of static, for comparison', 'Use a double-blind procedure so the assistant doesn’t know which condition is which', 'Make the music much louder to strengthen the manipulation'], e: 'Condition is confounded with {g:order} (practice effects favour whatever comes second). Counterbalancing spreads order effects equally across conditions.' },
      { q: 'A within-subjects study has four conditions. Complete counterbalancing would need 24 orders, which is too many to run.', o: ['Use a Latin square, with four orders in which each condition appears in each position', 'Use a matched pairs design, pairing participants on memory before assigning orders', 'Give every participant the identical order so that the procedure stays perfectly consistent', 'Drop to a one-group pretest-posttest design'], e: 'A {g:Latin square} uses a limited set of orders (as many as there are conditions), so each condition appears first, second, third… and directly before and after each other condition once.' },
      { q: 'Participants are told the study tests "how music boosts mood," and those who hear music report better moods.', o: ['Use a cover story and put the mood item among unrelated filler items', 'Counterbalance the order of the mood questions across participants', 'Use a Latin square so every participant hears each type of music once', 'Make the music and silence conditions more similar to weaken the manipulation'], e: 'Knowing the hypothesis creates {g:demand characteristics}. A cover story, disguised measures and filler items reduce them.' },
      { q: 'In a confidence study, the same research assistant gives a pep talk (or not) and then rates each participant’s confidence from a video. The assistant knows each participant’s condition.', o: ['Have a different rater who doesn’t know the conditions do the ratings (double-blind)', 'Tell participants which condition they are in so nothing is hidden from them', 'Use a single-blind procedure in which only the participants are unaware of the condition', 'Add a pilot study after data collection'], e: 'The rater’s expectations could bias the ratings ({g:experimenter bias}). The fix is the textbook’s two-experimenter setup: one person gives the pep talk and a second rater, who doesn’t know the condition, does the ratings (a double-blind procedure).' },
      { q: 'Patients given a new anxiety pill improve compared with patients given nothing.', o: ['Add a placebo group that gets an identical-looking pill with no active drug', 'Switch to a within-subjects design where every patient tries going without any pill', 'Measure anxiety with a more sensitive scale, but keep the design exactly as it is', 'Counterbalance which day of the week each patient receives the new anxiety pill'], e: 'Merely receiving a treatment can cause improvement (a {g:placebo effect}). A placebo group controls for that expectation.' },
      { q: 'In both conditions of a memory experiment, nearly everyone recalls 19 or 20 out of 20 words, and no difference appears.', o: ['Make the task harder (e.g., a longer list or a delay) so scores can spread out', 'Make the task easier so that every participant can finish the whole list in time', 'Add filler words to the list so participants can’t guess the hypothesis being tested', 'Replace the control condition with a placebo condition that hears a fake strategy'], e: 'Scores bunched at the top is a {g:ceiling effect}: the measure is too easy to detect a difference.' },
      { q: 'With only 16 participants, a researcher worries that random assignment might leave one group with much better baseline memory than the other.', o: ['Pair people on a memory pretest, then randomly assign one of each pair to each condition', 'Let participants choose their own condition, so that they feel comfortable and stay engaged throughout', 'Use a one-group posttest-only design so there’s only one group to worry about', 'Use a single-blind procedure so participants don’t know which condition they’re in'], e: 'At {g:small sample sizes} random assignment may not equalize groups. A pretest checks equivalency; matched pairs directly balance the crucial variable.' },
      { q: 'A study compares a mildly annoying noise with no noise and finds no effect on concentration. The researcher can’t tell whether participants even felt stressed.', o: ['Use a stronger manipulation (more different levels) and add a manipulation check', 'Switch to a more sensitive concentration measure and keep the same mild noise', 'Remove the no-noise control condition so that every participant experiences the annoying noise', 'Run exactly the same study again with the same mild noise and a bigger sample'], e: 'Strengthen the manipulation ({g:levels maximally different}) and use a {g:manipulation check} to see whether it had its intended effect.' },
      { q: 'A researcher is about to run 200 participants but isn’t sure the instructions are clear or the timing works.', o: ['Run a pilot study with a small sample first to test and refine the procedures', 'Run all 200 participants and simply drop any confusing data afterward', 'Use a Latin square to fix the timing problems across the different sessions', 'Add a placebo group so that participants’ expectations about the instructions are controlled'], e: 'A {g:pilot study} is a small-scale study conducted before the actual study to test and refine procedures.' },
      { q: 'In a long smoking-treatment study, the heaviest smokers may drop out of the treatment condition.', o: ['Give a pretest so you can check whether dropouts made the conditions different', 'Switch to a posttest-only design so that fewer measurements are taken overall', 'Use a single-blind procedure so participants don’t know whether they’re in the treatment', 'Make the treatment weaker so that heavy smokers are less likely to drop out'], e: 'A pretest lets you examine whether {g:selective attrition} is a plausible alternative explanation.' },
      { q: 'A school measures bullying, runs an anti-bullying program, then measures bullying again. It wants stronger evidence that the program, not history or maturation, explains the drop.', o: ['Add a comparable school without the program, measured at the same times', 'Measure bullying only once, after the program ends, to avoid testing effects', 'Switch to a more sensitive bullying scale, but keep the single-school design', 'Remove the pretest entirely and rely on teachers’ impressions of the change'], e: 'A one-group pretest-posttest can’t rule out history or maturation. Adding a {g:comparison group} (a non-equivalent control group pretest-posttest design) helps.' },
      { q: 'A "Do you like this person? (yes/no)" item can’t detect small differences in liking between conditions.', o: ['Ask "How much do you like this person?" on a 7-point scale', 'Ask the same yes/no question twice and average the two answers together', 'Add a placebo condition in which participants meet a neutral person', 'Use a Latin square so the liking question appears in different positions'], e: 'A rating scale is more {g:sensitive}: it allows gradations of liking (the textbook’s example).' }
    ] });

  /* =========================================================== MOCK MIDTERM POOL */
  var MC = [
    { ch: 1, q: 'A health agency surveys a representative sample of first-year university students and reports that 23% meet criteria for insomnia, and that the rate is somewhat higher among women than among men. Which goal of research does this study primarily serve?',
      o: ['Description', 'Prediction', 'Determining causes', 'Explanation'], a: 0,
      e: 'It reports how common something is and {g:for whom}. The textbook’s own description example (depression prevalence, women vs men) also compares groups. Nothing is forecast, manipulated or explained.' },
    { ch: 1, q: 'Students pick their seats on the first day of class. By the end of term, students who sat at the front earned higher grades. A classmate concludes that sitting at the front causes better grades. Which causal criterion is clearly NOT established?',
      o: ['Covariation between where students sit and their grades', 'Temporal precedence of the cause', 'Ruling out alternative explanations', 'Falsifiability of the claim that seating matters'], a: 2,
      e: 'Seat choice came first (temporal precedence) and seat relates to grades (covariation). But more motivated students may {g:choose} the front: an alternative explanation that hasn’t been ruled out.' },
    { ch: 1, q: 'A lab tests the predictions of two competing theories about how reminders destabilize episodic memories, with no particular application in mind. This is best described as:',
      o: ['Applied research', 'Basic research', 'Program evaluation', 'A needs assessment'], a: 1,
      e: '{g:Basic research} attempts to answer fundamental questions about the nature of behaviour, often by testing theories. Applications might come later, but aren’t its primary purpose.' },
    { ch: 2, q: 'Two theories explain why people underestimate how long tasks take equally well. Theory A uses six variables; Theory B uses two. Which should scientists prefer?',
      o: ['Theory A, because more variables make a theory more complete', 'Theory B, because of the principle of parsimony', 'Theory B, because simpler theories are always true', 'Neither, because theories can’t be compared'], a: 1,
      e: '{g:Parsimony}: if two theories are equally effective, the simpler one is preferable. It isn’t "always true"; it’s preferred, and may be easier to falsify.' },
    { ch: 5, q: 'People who eat breakfast have higher grade averages. Which of these is a third-variable explanation for this correlation?',
      o: ['Being well organized leads people both to eat breakfast and to earn higher grades', 'Students who earn higher grades feel good about themselves and then start eating breakfast more often', 'Eating breakfast raises blood sugar, which improves students’ focus and learning in class', 'The link between breakfast and grades is stronger for students who take morning classes'], a: 0,
      e: 'A {g:third variable} causes both measured variables. The other options describe reverse direction, a mediator, and a moderator.' },
    { ch: 5, q: 'In an experiment on exercise and happiness, the exercise group spends an hour at a group boxercise class, while the control group continues their normal day at home. What is the best improvement?',
      o: ['Give the control group a comparable hour away in a group, doing a non-exercise activity', 'Add more participants to the exercise group so it has more statistical power', 'Let participants choose whichever condition they prefer, so that everyone stays motivated for the full hour', 'Measure happiness twice in the exercise group, before and after the class'], a: 0,
      e: 'Taking a break and socializing are {g:confounded} with exercise. {g:Experimental control} means only the IV differs between conditions; everything else is kept the same.' },
    { ch: 6, q: 'A researcher uses a bathroom scale as a "Fear of Heights Measuring Machine." It gives the same reading every time a person steps on it. This measure is:',

    { ch: 6, q: 'Students currently on academic probation score much higher on a new procrastination scale than students in good standing. Which kind of validity evidence is this?',

    { ch: 6, q: 'A researcher records how many seconds each participant can hold their breath and says one person held it "twice as long" as another. This statement is legitimate because breath-holding time is measured on which scale?',

    { ch: 10, q: 'A within-subjects experiment has three conditions. The researcher wants to control order effects without running all six possible orders. What should they use?',
      o: ['A Latin square design', 'A matched pairs design', 'A posttest-only design', 'A double-blind procedure'], a: 0,
      e: 'A {g:Latin square} uses as many orders as there are conditions (three here), constructed so each condition appears in each position.' },
    { ch: 10, q: 'Why might adding a pretest to a randomized experiment on attitudes toward recycling be a problem?',
      o: ['It can sensitize participants to the hypothesis, so results may not generalize to people without a pretest', 'Taking a pretest guarantees regression toward the mean in both conditions, making any difference impossible to interpret', 'Pretests can only be used in within-subjects designs, not in between-subjects experiments', 'It removes the need for random assignment, so the groups will no longer be equivalent'], a: 0,
      e: 'A pretest may act as a {g:demand characteristic}. Fixes: disguise it among irrelevant measures, or test its effect directly (Solomon four-group design).' },
    { ch: 10, q: 'A researcher has only 16 participants for a two-condition study of a memory strategy and worries the groups may differ in baseline memory ability. Which design addresses this most directly?',
      o: ['A one-group pretest-posttest design', 'A matched pairs design', 'A Latin square design', 'A single-blind procedure'], a: 1,

    { ch: 11, q: 'A study comparing "mild rejection" with "no rejection" finds no effect on mood. Which addition would best tell whether the manipulation itself failed?',

    { ch: 11, q: 'In a memory experiment, almost everyone in both conditions recalls 19 or 20 of 20 words, and no difference appears. What is the most likely problem, and the fix?',
      o: ['A floor effect; make the task easier so more participants can succeed', 'A ceiling effect; make the task harder so scores can spread out', 'Demand characteristics; use a cover story and disguise the recall test', 'Regression toward the mean; add a pretest to select participants'], a: 1,
      e: 'Scores bunched at the maximum = {g:ceiling effect}. A harder task restores variability so differences can be detected.' },
    { ch: 11, q: 'In a drug trial, the research assistant who rates patients’ symptoms knows which patients received the drug. What is the best improvement?',
      o: ['A single-blind procedure in which only the patients are unaware of their condition', 'A double-blind procedure: neither patients nor the rater knows who got the drug', 'A manipulation check after the trial to confirm the drug was taken', 'Counterbalancing so every patient gets the drug and the placebo in different orders'], a: 1,

    { ch: 11, q: 'Participants read job ads written with stereotypically masculine or feminine words and rate how appealing each job is. How is the independent variable manipulated?',

    { ch: 12, q: 'A province bans texting while driving. Which design would give the strongest evidence that the ban reduced crashes?',

    { ch: 12, q: 'A cross-sectional study finds that 70-year-olds score lower on a computer-skills test than 20-year-olds. Why can’t we conclude that ageing causes the difference?',

      { title: 'From correlation to causation', pts: 3, ch: 5,

  }
