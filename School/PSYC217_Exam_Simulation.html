    var left = remaining();
    if (left == null) return '<span class="timer off">' + icon('sand') + 'Untimed</span>';
    return '<span class="timer' + (left < 10 * 60000 ? ' low' : '') + '" id="timer" role="timer" aria-label="Time left">' + icon('sand') + fmtTime(left) + '</span>';
  }
  function renderExam() {
    var att = S.att; if (!att || att.phase !== 'taking') { go({ name: 'home' }); return; }
    var h = '<nav class="top top-tools"><button class="back" data-act="home">‹ Exam room</button><span class="top-sp"></span>' + tools() + '</nav>';
    h += '<div class="ex-bar">' + timerHTML() + '<span class="ex-pos">' + countAnswered(att) + ' / 25 answered</span><span class="sp"></span><button class="btn primary" data-act="submit">Submit</button></div>' + navGrid(att);
    if (confirmSubmit) h += submitPanel(att);
    h += '<article class="card qcard" id="qcard">' + questionHTML(att) + '</article>';
    app.innerHTML = h;
    startTimer();
  }
  function submitPanel(att) {
    var un = 25 - countAnswered(att), fl = 0; for (var n = 0; n < 25; n++) if (item(att, n).r.flag) fl++;
    return '<div class="panel" role="alertdialog" aria-label="Submit the exam?"><h3>Hand it in?</h3><p class="small-note">' + (un ? '<b>' + un + '</b> question' + (un === 1 ? ' is' : 's are') + ' unanswered. ' : 'Every question has an answer. ') + (fl ? fl + ' flagged for review. ' : '') + 'Multiple choice and fill-ins are marked automatically; then you’ll mark your short answers with the rubric.</p><div class="actions"><button class="btn primary" data-act="submit-yes">Submit for marking</button><button class="btn" data-act="submit-no">Keep working</button></div></div>';
  }
  function questionHTML(att) {
    var it = item(att, att.cur), r = it.r, h = '';
    var part = it.kind === 'mc' ? 'Part A · Multiple choice · 1 point' : it.kind === 'fib' ? 'Part B · Fill in the blank · 1 point' : 'Part C · Short answer · ' + D.sa[r.k][r.i].pts + ' points';
    h += '<div class="q-head"><span class="q-num">' + label(att.cur) + '</span><p class="q-part">' + part + '</p><span class="sp"></span><button class="flag-b" data-act="flag" aria-pressed="' + r.flag + '">' + (r.flag ? 'Flagged' : 'Flag for review') + '</button></div>';
    if (it.kind === 'mc') {
      var q = D.mc[r.i];
      h += '<h2 class="stem">' + esc(q.q) + '</h2><div class="opts" role="radiogroup" aria-label="Answer choices">' + r.ord.map(function (oi, k) {
        return '<button class="opt' + (r.sel === oi ? ' sel' : '') + '" data-act="mc" data-o="' + oi + '" role="radio" aria-checked="' + (r.sel === oi) + '"><span class="key">' + 'ABCD'[k] + '</span><span class="ot">' + esc(q.o[oi]) + '</span></button>';
      }).join('') + '</div>';
    } else if (it.kind === 'fib') {
      var f = D.fib[r.i];
      h += '<p class="small-note">Write the term that matches this definition.</p><p class="defq">' + esc(f.d) + '</p><div class="term-in"><label class="sr" for="fib-in">Term</label><input id="fib-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="60" placeholder="The term" value="' + esc(r.val) + '"></div>';
    } else {
      var s = D.sa[r.k][r.i];
      h += '<h2 class="stem">' + esc(s.title) + '</h2><p class="scen" style="font-weight:400">' + esc(s.stem) + '</p>';
      if (s.table) h += '<div class="tbl-wrap"><table class="sa-tbl"><thead><tr><th></th>' + s.table.c.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + s.table.r.map(function (rr, i) { return '<tr><th>' + esc(rr) + '</th>' + s.table.m[i].map(function (v) { return '<td>' + v + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
      h += '<p class="small-note">Bullet points or short phrases are fine, as on the real exam.</p>';
      h += s.parts.map(function (p, k) { return '<div class="sa-part"><label for="sa-' + k + '"><span class="pl">(' + 'abcd'[k] + ')</span><span>' + esc(p.q) + '</span><span class="pt">1 pt</span></label><textarea id="sa-' + k + '" data-k="' + k + '" rows="3">' + esc(r.ans[k]) + '</textarea></div>'; }).join('');
    }
    h += '<div class="ex-nav"><button class="btn" data-act="prev"' + (att.cur === 0 ? ' disabled' : '') + '>‹ Previous</button><span class="sp"></span>' + (att.cur < 24 ? '<button class="btn primary" data-act="nextq">Next ›</button>' : '<button class="btn primary" data-act="submit">Submit</button>') + '</div>';
    return h;
  }
  function refreshExamBar() {
    var att = S.att, bar = document.querySelector('.ex-bar'); if (!bar || !att) return;
    var pos = bar.querySelector('.ex-pos'); if (pos) pos.textContent = countAnswered(att) + ' / 25 answered';
    var g = document.querySelector('#app .nav-grid'); if (g) g.outerHTML = navGrid(att);
  }
  function showQ(n) {
    var att = S.att; att.cur = Math.max(0, Math.min(24, n)); persist();
    var c = document.getElementById('qcard'); if (c) c.innerHTML = questionHTML(att);
    refreshExamBar();
    var qc = document.getElementById('qcard'), bar = document.querySelector('.ex-bar'); if (qc && bar) { var off = qc.getBoundingClientRect().top - bar.getBoundingClientRect().height - 16; if (off < 0) window.scrollBy({ top: off, behavior: reduce() ? 'auto' : 'smooth' }); }
    var f = document.querySelector('#qcard .opt, #fib-in, #sa-0'); if (f && (f.id === 'fib-in' || f.id === 'sa-0')) f.focus({ preventScroll: true });
  }
  function startTimer() {
    stopTimer(); if (!S.att || !S.att.timed) return;
    timerId = setInterval(function () {
      var left = remaining(), t = document.getElementById('timer');
      if (t) { t.innerHTML = icon('sand') + fmtTime(left); t.classList.toggle('low', left < 10 * 60000); }
      if (left <= 10 * 60000 && !warned.ten && left > 0) { warned.ten = true; toast('10 minutes left'); }
      if (left <= 60000 && !warned.one && left > 0) { warned.one = true; toast('1 minute left'); }
      if (left <= 0 && !warned.end) { warned.end = true; stopTimer(); timeUp(); }
    }, 1000);
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; document.body.appendChild(d); setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 3200); }
  function timeUp() {
    play('wrong');
    var m = document.createElement('div'); m.className = 'modal'; m.id = 'timeup';
    m.innerHTML = '<div class="panel" role="alertdialog" aria-labelledby="tu-h"><h3 id="tu-h">Time’s up</h3><p class="small-note">In the real exam you’d hand it in now. ' + countAnswered(S.att) + ' of 25 answered.</p><div class="actions"><button class="btn primary" data-act="submit-yes">Submit now</button><button class="btn" data-act="untime">Keep going untimed</button></div></div>';
    document.body.appendChild(m);
    var b = m.querySelector('.btn'); if (b) b.focus();
  }
  function closeModal() { var m = document.getElementById('timeup'); if (m && m.parentNode) m.parentNode.removeChild(m); }

  /* ---------- marking ---------- */
  function autoScores(att) {
    var a = 0, b = 0;
    att.mc.forEach(function (r) { if (r.sel === D.mc[r.i].a) a++; });
    att.fib.forEach(function (r) { if (termOk(r.val, D.fib[r.i].a)) b++; });
    return { a: a, b: b };
  }
  function renderMark() {
    var att = S.att; if (!att || att.phase !== 'marking') { go({ name: 'home' }); return; }
    var sc = autoScores(att), c = 0; att.sa.forEach(function (r) { r.marks.forEach(function (m) { if (m) c++; }); });
    var h = navTop() + '<header class="sec-head"><p class="eyebrow">Mock midterm · marking</p><h1>Mark your short answers</h1><p class="bonus-note">Parts A and B are marked: <b>' + sc.a + ' / 16</b> multiple choice and <b>' + sc.b + ' / 6</b> fill-ins. Now compare each short answer with the model answer and give yourself the point only if your answer has the idea in the rubric. Be as strict as Andrew would be.</p></header>';
    att.sa.forEach(function (r, si) {
      var s = D.sa[r.k][r.i];
      h += '<section class="card"><div class="q-head"><span class="q-num">C' + (si + 1) + '</span><p class="q-part">' + esc(s.title) + ' · ' + s.pts + ' points</p></div><p class="small-note">' + esc(s.stem) + '</p>';
      if (s.table) h += '<div class="tbl-wrap"><table class="sa-tbl"><thead><tr><th></th>' + s.table.c.map(function (x) { return '<th>' + esc(x) + '</th>'; }).join('') + '</tr></thead><tbody>' + s.table.r.map(function (rr, i) { return '<tr><th>' + esc(rr) + '</th>' + s.table.m[i].map(function (v) { return '<td>' + v + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
      s.parts.forEach(function (p, k) {
        h += '<div class="mk"><p class="mk-q">(' + 'abcd'[k] + ') ' + esc(p.q) + '</p><div class="mk-grid"><div class="mk-box yours"><span class="lab">Your answer</span>' + (r.ans[k].trim() ? esc(r.ans[k]) : '<span class="blank">(left blank)</span>') + '</div><div class="mk-box model"><span class="lab lab-g">Model answer</span>' + esc(p.m) + '</div></div>' +
          '<label class="rub' + (r.marks[k] ? ' on' : '') + '"><input type="checkbox" data-act="mark" data-s="' + si + '" data-k="' + k + '"' + (r.marks[k] ? ' checked' : '') + '><span><b>Give yourself the point if:</b> ' + esc(p.r) + '</span></label></div>';
      });
      h += '</section>';
    });
    h += '<div class="panel"><p class="small-note">Short answers: <b id="sa-total">' + c + '</b> / 10</p><div class="actions"><button class="btn primary" data-act="finish">See my results</button></div></div>';
    app.innerHTML = h;
  }

  /* ---------- results ---------- */
  function renderResults() {
    var att = S.att; if (!att || att.phase !== 'done') { go({ name: 'home' }); return; }
    var sc = autoScores(att), c = 0; att.sa.forEach(function (r) { r.marks.forEach(function (m) { if (m) c++; }); });
    var total = sc.a + sc.b + c, pct = Math.round(total / 32 * 100);
    var stamp = pct >= 90 ? ['Exam ready', 1] : pct >= 75 ? ['Almost there', 1] : pct >= 60 ? ['Getting there', 0] : ['Keep growing', 0];
    var said = pct >= 90 ? 'That’s an A-range paper. Keep it warm with a clinic or two before Wednesday.' : pct >= 75 ? 'Solid. The review below shows exactly which ideas cost you points.' : pct >= 60 ? 'You’ve got the core. Work through the clinics linked below, then try a fresh mix.' : 'This is what practice is for. Start with the clinics for your weakest chapters, then retake.';
    var h = navTop() + '<header class="sec-head"><p class="eyebrow">Mock midterm · results</p><h1>Your paper</h1></header>';
    h += '<section class="card"><div class="score-hero"><p class="score-big">' + total + ' <small>/ 32</small></p><span class="stamp' + (stamp[1] ? ' good' : '') + '">' + stamp[0] + '</span><span class="x-pill">' + pct + '%</span></div>' +
      '<div class="proctor">' + spr(G, 46) + '<p class="bubble"><b class="who">Edith</b>' + esc(said) + '</p></div>' +
      '<div class="parts">' + [['Multiple choice', sc.a, 16], ['Fill in the blank', sc.b, 6], ['Short answer', c, 10]].map(function (p) { return '<div class="prow"><span>' + p[0] + '</span><div class="bar"><i class="b3" style="width:' + (p[1] / p[2] * 100) + '%"></i></div><b>' + p[1] + ' / ' + p[2] + '</b></div>'; }).join('') + '</div>';
    /* by chapter */
    var chs = {};
    att.mc.forEach(function (r) { var q = D.mc[r.i], k = q.ch; chs[k] = chs[k] || [0, 0]; chs[k][1]++; if (r.sel === q.a) chs[k][0]++; });
    att.fib.forEach(function (r) { var q = D.fib[r.i], k = q.ch; chs[k] = chs[k] || [0, 0]; chs[k][1]++; if (termOk(r.val, q.a)) chs[k][0]++; });
    h += '<p class="terms-h">By chapter (multiple choice + fill-ins)</p><div class="chap">' + Object.keys(chs).sort(function (x, y) { return x - y; }).map(function (k) { var v = chs[k]; return '<span class="' + (v[0] / v[1] < 0.6 ? 'weak' : '') + '">Ch. ' + k + ': ' + v[0] + '/' + v[1] + '</span>'; }).join('') + '</div>';
    var weak = Object.keys(chs).filter(function (k) { return chs[k][0] / chs[k][1] < 0.75; }).map(Number), sug = [];
    D.clinics.forEach(function (cl) { var m = cl.ch.match(/\d+/g) || []; if (m.some(function (x) { return weak.indexOf(+x) >= 0; })) sug.push(cl); });
    if (sug.length) h += '<p class="terms-h">Clinics for your weaker chapters</p><div class="actions">' + sug.slice(0, 5).map(function (cl) { return '<button class="btn ghost" data-act="clinic" data-id="' + cl.id + '">' + esc(cl.title) + '</button>'; }).join('') + '</div>';
    h += '<div class="actions"><button class="btn primary" data-act="start">New mock midterm (fresh mix)</button><button class="btn" data-act="home">Back to the exam room</button></div></section>';
    /* review */
    h += '<section class="card"><h2 class="cardh">Review every question</h2>';
    att.mc.forEach(function (r, n) {
      var q = D.mc[r.i], ok = r.sel === q.a;
      h += '<details class="rv"' + (ok ? '' : ' open') + '><summary><span class="mk-ic ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓' : '✗') + '</span>A' + (n + 1) + ' · ' + esc(q.q.length > 90 ? q.q.slice(0, 88) + '…' : q.q) + '</summary><div class="rv-b"><p>' + esc(q.q) + '</p>' +
        (ok ? '' : '<p><b>Your answer:</b> ' + (r.sel == null ? '<i>none</i>' : esc(q.o[r.sel])) + '</p>') + '<p><b>Correct:</b> ' + esc(q.o[q.a]) + '</p><p class="fb-p"><span class="lab lab-g">Why</span>' + md(q.e) + '</p></div></details>';
    });
    att.fib.forEach(function (r, n) {
      var q = D.fib[r.i], ok = termOk(r.val, q.a);
      h += '<details class="rv"' + (ok ? '' : ' open') + '><summary><span class="mk-ic ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓' : '✗') + '</span>B' + (n + 1) + ' · ' + esc(q.a[0]) + '</summary><div class="rv-b"><p>' + esc(q.d) + '</p><p><b>You wrote:</b> ' + (r.val.trim() ? esc(r.val) : '<i>nothing</i>') + '</p><p><b>Term:</b> ' + esc(q.a[0]) + ' (Ch. ' + q.ch + ')</p></div></details>';
    });
    att.sa.forEach(function (r, n) {
      var s = D.sa[r.k][r.i], got = r.marks.filter(Boolean).length;
      h += '<details class="rv"><summary><span class="mk-ic ' + (got === s.pts ? 'ok' : got ? 'part' : 'no') + '">' + got + '</span>C' + (n + 1) + ' · ' + esc(s.title) + ' (' + got + ' / ' + s.pts + ')</summary><div class="rv-b">' + s.parts.map(function (p, k) { return '<p><b>(' + 'abcd'[k] + ') ' + esc(p.q) + '</b><br>' + esc(p.m) + '</p>'; }).join('') + '</div></details>';
    });
    h += '</section>';
    app.innerHTML = h;
  }

  /* ---------- events ---------- */
  var saveTimer = null;
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 300); }
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    ac();
    var act = el.getAttribute('data-act'), att = S.att;
    switch (act) {
      case 'home': play('tap'); confirmSubmit = false; go({ name: 'home' }); break;
      case 'theme': { P.theme = el.getAttribute('data-v'); savePrefs(); applyTheme(); play('tap'); var tl = el.closest('.tools'); if (tl) { tl.outerHTML = tools(true); var nb = document.querySelector('[data-act="theme"][data-v="' + P.theme + '"]'); if (nb) nb.focus(); } break; }
      case 'theme-flip': { P.theme = effTheme() === 'dark' ? 'light' : 'dark'; savePrefs(); applyTheme(); play('tap'); el.outerHTML = themeBtn(); var tb = document.querySelector('[data-act="theme-flip"]'); if (tb) tb.focus(); break; }
      case 'sound': { P.sound = !P.sound; savePrefs(); if (P.sound) play('tap'); el.outerHTML = soundBtn(); var sb = document.querySelector('[data-act="sound"]'); if (sb) sb.focus(); break; }
      case 'clinic': play('tap'); game = null; go({ name: 'clinic', id: el.getAttribute('data-id') }); break;
      case 'play': { play('tap'); var c = clinicById(view.id); newGame(c); gameRefresh('.tgt-b'); var g = document.getElementById('game'); if (g && g.scrollIntoView) g.scrollIntoView({ behavior: reduce() ? 'auto' : 'smooth', block: 'start' }); break; }
      case 'pick': choose(+el.getAttribute('data-i')); break;
      case 'next': play('tap'); nextScenario(); break;
      case 'timed': S.timed = el.getAttribute('data-v') === '1'; persist(); play('tap'); render(); break;
      case 'start': play('tap'); S.att = buildAttempt(); warned = {}; confirmSubmit = false; persist(); go({ name: 'exam' }); break;
      case 'resume': play('tap'); warned = {}; go({ name: 'exam' }); if (remaining() != null && remaining() <= 0) { warned.end = true; timeUp(); } break;
      case 'abandon': play('tap'); S.att = null; persist(); render(); break;
      case 'tomark': play('tap'); go({ name: 'mark' }); break;
      case 'lastres': play('tap'); go({ name: 'results' }); break;
      case 'jump': play('tap'); confirmSubmit = false; var p = document.querySelector('.panel'); if (p) p.remove(); showQ(+el.getAttribute('data-n')); break;
      case 'prev': play('tap'); showQ(att.cur - 1); break;
      case 'nextq': play('tap'); showQ(att.cur + 1); break;
      case 'flag': { var r = item(att, att.cur).r; r.flag = !r.flag; persist(); el.setAttribute('aria-pressed', r.flag); el.textContent = r.flag ? 'Flagged' : 'Flag for review'; refreshExamBar(); play('tap'); break; }
      case 'mc': { var r2 = item(att, att.cur).r; r2.sel = +el.getAttribute('data-o'); persist(); play('tap'); document.querySelectorAll('#qcard .opt').forEach(function (o) { var on = +o.getAttribute('data-o') === r2.sel; o.classList.toggle('sel', on); o.setAttribute('aria-checked', on); }); refreshExamBar(); break; }
      case 'submit': play('tap'); confirmSubmit = true; renderExam(); window.scrollTo({ top: 0, behavior: reduce() ? 'auto' : 'smooth' }); var y = document.querySelector('[data-act="submit-yes"]'); if (y) y.focus({ preventScroll: true }); break;
      case 'submit-no': play('tap'); confirmSubmit = false; renderExam(); break;
      case 'mark': break;
      case 'finish': {
        var sc = autoScores(att), c3 = 0; att.sa.forEach(function (r) { r.marks.forEach(function (m) { if (m) c3++; }); });
        att.phase = 'done'; S.hist.push({ t: Date.now(), a: sc.a, b: sc.b, c: c3, total: sc.a + sc.b + c3 }); if (S.hist.length > 30) S.hist = S.hist.slice(-30); persist();
        play('done'); if (sc.a + sc.b + c3 >= 29) confetti(); go({ name: 'results' }); break;
      }
    }
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches && t.matches('[data-act="mark"]')) {
      var r = S.att.sa[+t.getAttribute('data-s')]; r.marks[+t.getAttribute('data-k')] = t.checked; persist(); play(t.checked ? 'right' : 'tap');
      t.closest('.rub').classList.toggle('on', t.checked);
      var c = 0; S.att.sa.forEach(function (x) { x.marks.forEach(function (m) { if (m) c++; }); }); var el = document.getElementById('sa-total'); if (el) el.textContent = c;
    }
  });
  app.addEventListener('input', function (e) {
    var t = e.target, att = S.att; if (!att || att.phase !== 'taking') return;
    if (t.id === 'fib-in') { item(att, att.cur).r.val = t.value; saveSoon(); refreshExamBar(); }
    else if (t.tagName === 'TEXTAREA' && t.hasAttribute('data-k')) { item(att, att.cur).r.ans[+t.getAttribute('data-k')] = t.value; saveSoon(); refreshExamBar(); }
  });
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('#timeup [data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'); closeModal();
    if (act === 'submit-yes') { S.att.phase = 'marking'; persist(); go({ name: 'mark' }); }
    else if (act === 'untime') { S.att.timed = false; persist(); renderExam(); }
  });
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act="submit-yes"]'); if (!el || !S.att) return;
    S.att.phase = 'marking'; confirmSubmit = false; persist(); play('done'); go({ name: 'mark' });
  });
  /* tap a sprite: eyes close */
  app.addEventListener('pointerdown', function (e) {
    var s = e.target.closest && e.target.closest('.spr'); if (!s) return;
    s.classList.add('shut'); play('blink');
    setTimeout(function () { s.classList.remove('shut'); }, 420);
  });
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = e.target && e.target.tagName;
    if (view.name === 'clinic' && game && game.opts && tag !== 'INPUT' && tag !== 'TEXTAREA') {
      if (game.sel == null) { var k = parseInt(e.key, 10); if (k >= 1 && k <= game.opts.length) { e.preventDefault(); choose(k - 1); } }
      else if (e.key === 'Enter' && !(e.target.getAttribute && e.target.getAttribute('data-act') === 'next')) { e.preventDefault(); play('tap'); nextScenario(); }
    } else if (view.name === 'exam' && S.att && tag !== 'TEXTAREA') {
      if (tag !== 'INPUT') { var it = item(S.att, S.att.cur); if (it.kind === 'mc') { var idx = 'abcd'.indexOf(e.key.toLowerCase()); if (idx >= 0) { var b = document.querySelectorAll('#qcard .opt')[idx]; if (b) { e.preventDefault(); b.click(); } } } }
      if (e.key === 'Enter' && tag === 'INPUT') { e.preventDefault(); if (S.att.cur < 24) showQ(S.att.cur + 1); }
    }
  });
  window.addEventListener('hashchange', function () { routeFromHash(); });
  function flush() { if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; persist(); } }
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(); });
  if (window.matchMedia) { var mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', function () { if (P.theme === 'auto') applyTheme(); }); }

  function routeFromHash() {
    var h = (location.hash || '').slice(1);
    if (h.indexOf('c-') === 0 && clinicById(h.slice(2))) { game = null; view = { name: 'clinic', id: h.slice(2) }; }
    else if (h === 'mock' && S.att) view = { name: S.att.phase === 'taking' ? 'exam' : S.att.phase === 'marking' ? 'mark' : 'results' };
    else view = { name: 'home' };
    render();
  }
  window.__examState = function () { return { S: S, view: view, game: game }; };
  routeFromHash();
})();

</script>
</body></html>
