<style>
/* Layout: one calm column, like a field notebook; cards sit on a sage ground, trees mark progress. */
:root {
  --bg: #EBF1E7; --paper: #F7FAF4; --surface: #FFFFFF; --ink: #1E2C23; --ink2: #44574B; --muted: #6E8174;
  --line: #D2DDCD; --line-strong: #A9BBA7; --track: #DCE6D8; --tint: #E3EEE0; --hl: #4A7A5726;
  --moss: #46775A; --moss-strong: #2F5A3E; --on-moss: #F5FAF2;
  --leaf: #2C7F4B; --leaf-bg: #D9EEDD; --leaf-ink: #1D5E36;
  --clay: #B3473E; --clay-bg: #F6DFDA; --clay-ink: #8E2F28;
  --amber: #C88838; --sap: #94C28F; --tree: #3A7A4D; --seed: #C1AF8C; --bark: #8C7457; --fog: #CFD8CC;
  --f-body: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-hand: 'Coming Soon', 'Comic Sans MS', 'Chalkboard SE', cursive;
  --r: 18px;
  --sky1: #F5F2E2; --sky2: #EDF2E7; --sun: #F7E1A6; --sun-glow: rgba(247, 215, 140, .36); --moon: 0;
  --hill-far: #DFE9D9; --tree-far: #D1DFCA; --hill-near: #D6E4CF; --tree-near: #C3D7BA; --star-op: 0;
  --cloud: rgba(255, 255, 255, .8); --cloud-op: 1; --bar: rgba(235, 241, 231, .86); --glow: rgba(44, 127, 75, .30); --shine: rgba(255, 255, 255, .7);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1511; --paper: #141E18; --surface: #19251E; --ink: #E0EBE2; --ink2: #B1C2B6; --muted: #7F9387;
  --line: #26352C; --line-strong: #3E5245; --track: #213027; --tint: #1D2C23; --hl: #86BE9430;
  --moss: #86BE94; --moss-strong: #A8D6B3; --on-moss: #0E1511;
  --leaf: #7BCB95; --leaf-bg: #183123; --leaf-ink: #A6E2B8;
  --clay: #EC8B7F; --clay-bg: #3B201C; --clay-ink: #F6B3AA;
  --amber: #DDA664; --sap: #6E9F73; --tree: #74C28B; --seed: #8D7F64; --bark: #8A7558; --fog: #33443A;
  --sky1: #08100C; --sky2: #0C1510; --sun: #DCE7DD; --sun-glow: rgba(170, 210, 185, .12); --moon: 1;
  --hill-far: #111C16; --tree-far: #15231B; --hill-near: #14201A; --tree-near: #1A2B21; --star-op: .8;
  --cloud: rgba(170, 200, 180, .06); --cloud-op: .6; --bar: rgba(14, 21, 17, .86); --glow: rgba(123, 203, 149, .28); --shine: rgba(255, 255, 255, .10);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1511; --paper: #141E18; --surface: #19251E; --ink: #E0EBE2; --ink2: #B1C2B6; --muted: #7F9387;
  --line: #26352C; --line-strong: #3E5245; --track: #213027; --tint: #1D2C23; --hl: #86BE9430;
  --moss: #86BE94; --moss-strong: #A8D6B3; --on-moss: #0E1511;
  --leaf: #7BCB95; --leaf-bg: #183123; --leaf-ink: #A6E2B8;
  --clay: #EC8B7F; --clay-bg: #3B201C; --clay-ink: #F6B3AA;
  --amber: #DDA664; --sap: #6E9F73; --tree: #74C28B; --seed: #8D7F64; --bark: #8A7558; --fog: #33443A;
  --sky1: #08100C; --sky2: #0C1510; --sun: #DCE7DD; --sun-glow: rgba(170, 210, 185, .12); --moon: 1;
  --hill-far: #111C16; --tree-far: #15231B; --hill-near: #14201A; --tree-near: #1A2B21; --star-op: .8;
  --cloud: rgba(170, 200, 180, .06); --cloud-op: .6; --bar: rgba(14, 21, 17, .86); --glow: rgba(123, 203, 149, .28); --shine: rgba(255, 255, 255, .10);
  color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 56px; display: flex; flex-direction: column; gap: 18px; }
#app { display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--moss); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* hero */
.hero { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
.brand { display: flex; gap: 14px; align-items: center; }
.tr.brand-tree { width: 46px; height: 56px; flex: none; }
.hero h1 { font-family: var(--f-hand); font-size: clamp(2rem, 6vw, 2.7rem); font-weight: 400; line-height: 1.05; color: var(--moss-strong); letter-spacing: .01em; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
.countdown { margin: 0; align-self: flex-start; font-family: var(--f-hand); font-size: 1rem; color: var(--ink2); background: var(--tint); padding: 3px 12px; border-radius: 999px; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.eyebrow-h, .eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; margin: 0; }
.grove-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.grove h2 { font-family: var(--f-hand); font-weight: 400; font-size: 1.5rem; color: var(--ink); }
.pct { margin: 0; color: var(--ink2); font-variant-numeric: tabular-nums; }
.pct b { font-size: 1.25rem; color: var(--moss-strong); }

/* progress bars */
.bar { display: flex; height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; width: 100%; }
.bar i { display: block; height: 100%; transition: width .5s ease; }
.bar-big { height: 18px; }
.b3 { background: var(--tree); } .b2 { background: var(--sap); } .b1 { background: var(--amber); }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .88rem; color: var(--ink2); }
.legend li { display: flex; align-items: center; gap: 6px; }
.legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
.legend .tr { width: 16px; height: 19px; }

/* trees */
.tr { width: 13px; height: 16px; display: inline-block; vertical-align: middle; }
.tr-seed { color: var(--seed); } .tr-sprout { color: var(--amber); } .tr-small { color: var(--sap); } .tr-big { color: var(--tree); }
.tg { stroke: var(--line-strong); stroke-width: 1.2; stroke-linecap: round; }
.tk { fill: var(--bark); }
.forest { display: flex; flex-wrap: wrap; gap: 1px 2px; padding: 4px 0 2px; }
.forest.big .tr { width: 22px; height: 27px; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { appearance: none; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 10px 18px; border-radius: 999px; font-weight: 600; cursor: pointer; transition: transform .12s ease, background .15s ease; }
.btn:hover:not(:disabled) { background: var(--tint); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--moss); border-color: var(--moss); color: var(--on-moss); }
.btn.primary:hover:not(:disabled) { background: var(--moss-strong); border-color: var(--moss-strong); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* sections list */
.sections { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.sec { display: grid; grid-template-columns: 44px 1fr 18px; gap: 12px; align-items: center; text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; cursor: pointer; transition: background .15s, border-color .15s; }
.sec:hover { background: var(--surface); border-color: var(--line-strong); }
.sec-n { font-family: var(--f-hand); font-size: 1.9rem; color: var(--moss); text-align: center; line-height: 1; }
.sec-b { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sec-t { font-weight: 600; font-size: 1.04rem; }
.sec-m, .sec-c { font-size: .84rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sec-go { font-size: 1.5rem; color: var(--muted); }

/* footer settings */
.foot { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; padding-top: 18px; border-top: 1px dashed var(--line-strong); }
.foot-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.foot-l { font-size: .9rem; color: var(--ink2); }
.segs { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { border: 1.5px solid var(--line-strong); background: transparent; border-radius: 999px; padding: 6px 14px; font-size: .88rem; cursor: pointer; }
.seg.on { background: var(--moss); border-color: var(--moss); color: var(--on-moss); }
.seg.danger { border-color: var(--clay); color: var(--clay); }
.seg.danger:hover { background: var(--clay); color: var(--surface); }
.warn { color: var(--clay); font-size: .9rem; }
.note { margin: 0; font-size: .82rem; color: var(--muted); }
.size { border-top: 1px solid var(--line); padding-top: 12px; }
.top-sp { flex: 1; }
.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.segs.tight { gap: 4px; flex-wrap: nowrap; }
.seg.mini { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; font-size: .84rem; }
.ti { width: 16px; height: 16px; flex: none; }
.seg.on .ic { fill: var(--on-moss); } .seg.on .ic-l { stroke: var(--on-moss); }
.icon-btn .ti { width: 19px; height: 19px; }
.terms-h { margin: 14px 0 6px; font-weight: 600; color: var(--ink2); font-size: .92rem; }
.los ul.terms { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: row; flex-wrap: wrap; gap: 6px; }
.terms li { font-size: .82rem; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--ink2); }
@media (max-width: 480px) { .seg.mini span { display: none; } .seg.mini { padding: 6px 9px; } }

/* bonus: kept visually apart from the seven graded sections */
.sec.sec-bonus { border-style: dashed; border-color: var(--amber); }
.sec-bonus .sec-n { color: var(--amber); font-size: 1.6rem; }
.bonus-flag { align-self: flex-start; font-size: .74rem; font-weight: 600; letter-spacing: .02em; color: var(--ink2); background: var(--surface); border: 1px dashed var(--amber); border-radius: 999px; padding: 1px 9px; }
.bonus-note { margin: 0; color: var(--ink2); font-size: .95rem; max-width: 60ch; }
.tag-bonus { background: transparent; border: 1px dashed var(--amber); color: var(--ink); }

/* section page */
.top { display: flex; align-items: center; gap: 12px; }
.back { border: none; background: none; padding: 6px 2px; color: var(--ink2); font-weight: 600; cursor: pointer; }
.back:hover { color: var(--moss-strong); }
.sec-head { display: flex; flex-direction: column; gap: 4px; }
.sec-head h1, .end h1 { font-family: var(--f-hand); font-weight: 400; font-size: clamp(1.7rem, 5vw, 2.2rem); color: var(--moss-strong); line-height: 1.15; }
.los summary { cursor: pointer; font-weight: 600; color: var(--ink2); }
.los ul { margin: 0; padding-left: 20px; color: var(--ink2); display: flex; flex-direction: column; gap: 4px; font-size: .95rem; }
.done-msg { margin: 0; color: var(--leaf); font-weight: 600; }

/* quiz */
.quiz-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); padding: 8px 12px; margin-top: -8px; border-radius: 0 0 16px 16px; }
.rbar { flex: 1; display: flex; gap: 3px; height: 10px; min-width: 0; }
.rbar.dense { gap: 0; border-radius: 999px; overflow: hidden; background: var(--track); }
.rs { flex: 1; min-width: 0; border-radius: 999px; background: var(--track); transition: background .35s ease; }
.rbar.dense .rs { border-radius: 0; }
.rs.t3 { background: var(--tree); } .rs.t2 { background: var(--sap); } .rs.t1 { background: var(--amber); }
.rs.now { background: var(--track); box-shadow: inset 0 0 0 2px var(--moss); animation: now-pulse 1.8s ease-in-out infinite; }
@keyframes now-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
.qbar { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.qcount { font-size: .84rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.icon-btn { border: 1.5px solid var(--line); background: var(--paper); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.ic { fill: var(--ink2); } .ic-l { fill: none; stroke: var(--ink2); stroke-width: 1.8; stroke-linecap: round; }
.qcard { padding: 22px; gap: 16px; }
.chips-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font-size: .74rem; padding: 2px 9px; border-radius: 999px; background: var(--tint); color: var(--ink2); font-weight: 600; letter-spacing: .02em; }
.tag-sec { background: transparent; border: 1px solid var(--line-strong); }
.tag-warm { background: var(--leaf-bg); color: var(--leaf-ink); }
.tag-hard { background: var(--clay-bg); color: var(--clay-ink); }
.tag-tr { font-family: var(--f-hand); font-weight: 400; background: var(--surface); border: 1px dashed var(--amber); color: var(--ink); }
.tag-type { background: transparent; color: var(--muted); }
.tag-rq { background: var(--surface); border: 1px solid var(--moss); color: var(--moss-strong); }
.tag-tree { margin-left: auto; } .tag-tree .tr { width: 18px; height: 22px; }
.stem { font-size: clamp(1.06rem, 2.6vw, 1.2rem); font-weight: 500; line-height: 1.5; color: var(--ink); }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--moss); color: var(--muted); font-family: var(--f-hand); padding: 0 .2em; letter-spacing: .04em; }
.blank.filled.ok { color: var(--leaf-ink); background: var(--leaf-bg); border-color: var(--leaf); border-radius: 4px 4px 0 0; }
.blank.filled.no { color: var(--leaf-ink); background: var(--leaf-bg); border-color: var(--leaf); }
mark { border-radius: 4px; padding: 0 .18em; }
mark.hl-g { background: var(--leaf-bg); color: var(--leaf-ink); }
mark.hl-r { background: var(--clay-bg); color: var(--clay-ink); }
.t-r { color: var(--clay); }

.opts { display: flex; flex-direction: column; gap: 9px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; line-height: 1.45; transition: border-color .12s, background .12s; }
.opt:hover { border-color: var(--line-strong); }
.opt .key { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: var(--muted); }
.opt .ot { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.opt.sel { border-color: var(--moss); background: var(--hl); }
.opt.sel .key { background: var(--moss); border-color: var(--moss); color: var(--on-moss); }
.opt.right { border-color: var(--leaf); background: var(--leaf-bg); cursor: default; }
.opt.right .key { background: var(--leaf); border-color: var(--leaf); color: var(--surface); }
.opt.right .ot { color: var(--leaf-ink); font-weight: 600; }
.opt.wrong { cursor: default; }
.opt.wrong .ot { color: var(--ink2); }
.opt.chosen { border-color: var(--clay); background: var(--clay-bg); }
.opt.chosen .key { background: var(--clay); border-color: var(--clay); color: var(--surface); }
.opt.chosen .ot { color: var(--clay-ink); font-weight: 600; }
.why { font-size: .86rem; font-weight: 400; color: var(--clay-ink); line-height: 1.45; }
.opt.wrong:not(.chosen) .why { color: var(--muted); }
.why-ok { color: var(--leaf-ink); }

.fill input { width: 100%; max-width: 360px; font: inherit; font-size: 1.1rem; padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); }
.fill input:focus { outline: none; border-color: var(--moss); box-shadow: 0 0 0 3px var(--hl); }
.small-note { margin: 0; color: var(--muted); font-size: .9rem; }

.check-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.kbd-hint { font-size: .8rem; color: var(--muted); margin-left: auto; }
@media (hover: none) { .kbd-hint { display: none; } }

/* placing chips */
.place { display: flex; flex-direction: column; gap: 12px; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border-radius: 14px; border: 1.5px dashed var(--line-strong); min-height: 52px; align-items: center; }
.pool.over, .tgt.over { background: var(--hl); }
.pool-empty { color: var(--muted); font-size: .88rem; }
.chip { border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 7px 12px; cursor: pointer; text-align: left; line-height: 1.35; font-size: .95rem; display: inline-flex; flex-direction: column; gap: 2px; max-width: 100%; }
.chip:hover:not(:disabled) { border-color: var(--moss); }
.chip.sel { border-color: var(--moss); background: var(--moss); color: var(--on-moss); box-shadow: 0 4px 12px -6px var(--moss); transform: translateY(-1px); }
.chip.ok { border-color: var(--leaf); background: var(--leaf-bg); color: var(--leaf-ink); }
.chip.no { border-color: var(--clay); background: var(--clay-bg); color: var(--clay-ink); }
.chip:disabled { cursor: default; opacity: 1; }
.belongs { font-size: .8rem; color: var(--leaf-ink); font-weight: 600; }
.targets { display: grid; gap: 10px; }
.place-sort .targets { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tgt { border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; min-height: 64px; min-width: 0; }
.place-match .tgt { display: grid; grid-template-columns: 1fr minmax(120px, 38%); align-items: center; gap: 10px; }
.tgt-l { font-size: .92rem; color: var(--ink2); line-height: 1.4; }
.place-sort .tgt-l { font-weight: 700; color: var(--ink); font-size: .95rem; }
.tgt-c { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; align-items: center; border-radius: 10px; padding: 4px; background: var(--paper); }
.drop { font-size: .8rem; color: var(--muted); padding: 0 6px; }
@media (max-width: 520px) { .place-match .tgt { grid-template-columns: 1fr; } }

.seq { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: s; }
.slot { counter-increment: s; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1.5px dashed var(--line-strong); border-radius: 12px; padding: 6px 10px; min-height: 46px; }
.slot::before { content: counter(s); font-family: var(--f-hand); color: var(--moss); width: 18px; font-size: 1.1rem; }
.slot.ok { border-style: solid; border-color: var(--leaf); } .slot.no { border-style: solid; border-color: var(--clay); }
.chip.in.ok { border-color: var(--leaf); background: var(--leaf-bg); color: var(--leaf-ink); }
.chip.in.no { border-color: var(--clay); background: var(--clay-bg); color: var(--clay-ink); }
.should { font-size: .82rem; color: var(--leaf-ink); }

.cloze { margin: 0; line-height: 2.3; font-size: 1.02rem; }
.cblank { min-width: 6.5em; border: none; border-bottom: 2px solid var(--line-strong); background: var(--tint); border-radius: 6px 6px 0 0; padding: 2px 10px; cursor: pointer; font-weight: 600; color: var(--ink); line-height: 1.5; }
.cblank.active { border-bottom-color: var(--moss); background: var(--hl); box-shadow: inset 0 -2px 0 var(--moss); }
.cblank.ok { background: var(--leaf-bg); color: var(--leaf-ink); border-bottom-color: var(--leaf); }
.cblank.no { background: var(--clay-bg); color: var(--clay-ink); border-bottom-color: var(--clay); text-decoration: line-through; }
.should-inline { font-size: .85rem; font-weight: 700; color: var(--leaf-ink); background: var(--leaf-bg); border-radius: 6px; padding: 1px 6px; margin-left: 4px; }
.bank { border-style: solid; background: var(--paper); }

.picks { display: flex; flex-direction: column; gap: 8px; }
.pk { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; cursor: pointer; line-height: 1.45; }
.pk .box { width: 20px; height: 20px; border-radius: 6px; border: 1.8px solid var(--line-strong); margin-top: 2px; position: relative; }
.pk.on .box { background: var(--moss); border-color: var(--moss); }
.pk.on .box::after { content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid var(--on-moss); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.pk .ot { display: flex; flex-direction: column; gap: 4px; }
.pk.ok { border-color: var(--leaf); background: var(--leaf-bg); } .pk.ok .ot { color: var(--leaf-ink); }
.pk.missed { border-color: var(--leaf); border-style: dashed; } .pk.missed .why { color: var(--leaf-ink); }
.pk.no { border-color: var(--clay); background: var(--clay-bg); } .pk.no .ot { color: var(--clay-ink); }
.pk.ok .box, .pk.ok.on .box { background: var(--leaf); border-color: var(--leaf); }
.pk.no .box { background: var(--clay); border-color: var(--clay); }

/* feedback */
.fb { border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.fb.ok { background: var(--leaf-bg); } .fb.no { background: var(--clay-bg); }
.fb-head { display: flex; align-items: center; gap: 14px; }
.grow { display: flex; align-items: flex-end; gap: 4px; flex: none; }
.grow .tr { width: 30px; height: 36px; }
.grow .from { opacity: .45; width: 22px; height: 27px; }
.grow .to { animation: rise .7s cubic-bezier(.2, .9, .3, 1.3) both; transform-origin: 50% 100%; }
.grow .arrow { color: var(--muted); font-size: .9rem; padding-bottom: 8px; }
@keyframes rise { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.verdict { margin: 0; font-family: var(--f-hand); font-size: 1.35rem; line-height: 1.2; }
.fb.ok .verdict { color: var(--leaf-ink); } .fb.no .verdict { color: var(--clay-ink); }
.fb-sub { margin: 2px 0 0; font-size: .86rem; color: var(--ink2); }
.fb-p { margin: 0; color: var(--ink); line-height: 1.6; background: var(--paper); border-radius: 12px; padding: 12px 14px; }
.lab { display: block; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; margin-bottom: 4px; }
.lab-g { color: var(--leaf); } .lab-r { color: var(--clay); }

/* figures */
.figwrap { display: flex; justify-content: center; }
.fig { margin: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.fig-scroll { width: 100%; overflow-x: auto; display: flex; justify-content: center; }
.fig-svg { width: 100%; height: auto; display: block; }
figcaption { font-size: .86rem; color: var(--muted); text-align: center; max-width: 60ch; }
.f-t { fill: var(--ink2); font-family: var(--f-body); }
.f-th { fill: var(--ink); font-family: var(--f-body); font-weight: 600; }
.f-tm { fill: var(--muted); font-family: var(--f-body); }
.f-ax { stroke: var(--ink2); stroke-width: 1.4; }
.f-grid { stroke: var(--line); stroke-width: 1; }
.f-l1 { stroke: var(--moss); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.f-l2 { stroke: var(--amber); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.f-l3 { stroke: var(--ink2); stroke-width: 2.2; }
.f-m0 { fill: var(--moss); } .f-m1 { fill: var(--amber); } .f-m2 { fill: var(--ink2); }
.f-b0 { fill: var(--moss); } .f-b1 { fill: var(--amber); }
.f-dot { fill: var(--moss); opacity: .78; }
.f-box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; }
.f-box-alt { fill: var(--tint); stroke: var(--moss); }
.f-box-empty { fill: none; stroke-dasharray: 4 3; }
.f-arr { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
.f-arr-faint { stroke: var(--muted); }
.f-ah { fill: var(--ink2); }
.f-cell, .f-hc { fill: transparent; stroke: transparent; }
.f-lab { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; }
.f-hline { stroke: transparent; stroke-width: 16; fill: none; }
.f-ring0 { fill: var(--surface); stroke: var(--line-strong); } .f-ring1 { fill: var(--tint); stroke: var(--line-strong); } .f-ring2 { fill: var(--leaf-bg); stroke: var(--moss); }
.f-shot { fill: var(--ink); }
.f-ph0 { fill: transparent; } .f-ph1 { fill: var(--tint); }
.f-div { stroke: var(--muted); stroke-dasharray: 4 4; }
.f-lens { fill: var(--surface); stroke: var(--ink2); stroke-width: 2; }
.f-planet { fill: var(--moss); }
.f-fog { fill: var(--fog); opacity: .72; } .f-fogdot { fill: var(--fog); }
.tbl-wrap { width: 100%; overflow-x: auto; }
.ftbl { border-collapse: separate; border-spacing: 4px; margin: 0 auto; font-variant-numeric: tabular-nums; font-size: .95rem; }
.ftbl th, .ftbl td { padding: 8px 12px; border-radius: 8px; text-align: center; }
.ftbl thead th { font-size: .82rem; color: var(--ink2); font-weight: 600; }
.ftbl tbody th { text-align: left; font-weight: 600; font-size: .88rem; color: var(--ink2); }

.ftbl .corner { font-size: .76rem; color: var(--muted); text-align: left; }

.aparef span { border-radius: 5px; padding: 2px 3px; }
.conds { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; width: 100%; }
.cond { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.cond-h { font-weight: 700; font-size: .92rem; }
.cond-f { display: flex; flex-wrap: wrap; gap: 6px; }
.feat { font-size: .88rem; border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 11px; background: var(--paper); }
.f-zone { fill: transparent; stroke: var(--line-strong); stroke-width: 1.2; stroke-dasharray: 5 4; }
.devs { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.devt { border: 1.5px solid transparent; border-radius: 14px; padding: 6px 4px; min-width: 0; }
.devt-h { margin: 0 0 2px 8px; font-weight: 700; font-size: .9rem; color: var(--ink); }

.dev-arr { color: var(--moss); font-weight: 700; }
.dev-q { color: var(--muted); font-family: var(--f-hand); }

/* hotspots */
.hot-on [data-hs] { cursor: pointer; }
.hot-on g[data-hs]:hover > .hit { stroke: var(--moss); stroke-width: 2; }
.hot-on g[data-hs]:hover > .f-cell, .hot-on g[data-hs]:hover > .f-hc, .hot-on g[data-hs]:hover > rect.f-ph0, .hot-on g[data-hs]:hover > rect.f-ph1 { fill: var(--hl); }
g.hs-sel > .hit { stroke: var(--moss); stroke-width: 2.6; fill: var(--hl); }
g.hs-right > .hit { stroke: var(--leaf); stroke-width: 3; fill: var(--leaf-bg); }
g.hs-wrong > .hit { stroke: var(--clay); stroke-width: 3; fill: var(--clay-bg); }
g.hs-sel > .hit.f-b0, g.hs-right > .hit.f-b0, g.hs-wrong > .hit.f-b0 { fill: var(--moss); }
g.hs-sel > .hit.f-b1, g.hs-right > .hit.f-b1, g.hs-wrong > .hit.f-b1 { fill: var(--amber); }
g.hs-sel > .f-hline { stroke: var(--hl); stroke-width: 16; fill: none; }
g.hs-right > .f-hline { stroke: var(--leaf-bg); stroke-width: 16; fill: none; }
g.hs-wrong > .f-hline { stroke: var(--clay-bg); stroke-width: 16; fill: none; }
.hot-on td[data-hs]:hover, .hot-on span[data-hs]:hover, .hot-on tr[data-hs]:hover > * { box-shadow: 0 0 0 2px var(--moss); }
td.hs-sel, span.hs-sel, tr.hs-sel > * { background: var(--hl) !important; box-shadow: 0 0 0 2px var(--moss); }
td.hs-right, span.hs-right, tr.hs-right > * { background: var(--leaf-bg) !important; color: var(--leaf-ink); box-shadow: 0 0 0 2px var(--leaf); }
td.hs-wrong, span.hs-wrong, tr.hs-wrong > * { background: var(--clay-bg) !important; color: var(--clay-ink); box-shadow: 0 0 0 2px var(--clay); }
.hot-on .devt[data-hs]:hover { border-color: var(--moss); }
.devt.hs-sel { border-color: var(--moss); background: var(--hl); }
.devt.hs-right { border-color: var(--leaf); background: var(--leaf-bg); }
.devt.hs-wrong { border-color: var(--clay); background: var(--clay-bg); }

/* end */
.end-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.end-stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; }
.end-stats b { font-size: 1.6rem; font-variant-numeric: tabular-nums; color: var(--moss-strong); }
.end-stats span { font-size: .84rem; color: var(--muted); }
.end-l { margin: 0; font-weight: 600; color: var(--ink2); }


/* scenery: soft sky, a slow sun (a moon at night), drifting clouds, hills with swaying trees */

.wrap { position: relative; z-index: 1; }

.sun::after { content: ""; position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; border-radius: 50%; background: var(--sky1); opacity: var(--moon); transform: translate(calc(-50% + 11px), calc(-50% - 8px)); }
@keyframes sun-drift { from { transform: translate(0, 0); } to { transform: translate(-9vw, 4vh); } }

@keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }
.cloud { position: absolute; left: -200px; width: 130px; height: 26px; border-radius: 30px; background: var(--cloud); opacity: var(--cloud-op); animation: cloud 170s linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: var(--cloud); border-radius: 50%; }
.cloud::before { width: 58px; height: 46px; left: 20px; top: -24px; }
.cloud::after { width: 42px; height: 34px; left: 62px; top: -15px; }
.cloud.c1 { top: 13vh; animation-delay: -40s; }
.cloud.c2 { top: 24vh; scale: .7; animation-duration: 230s; animation-delay: -150s; }
.cloud.c3 { top: 8vh; scale: .55; animation-duration: 260s; animation-delay: -60s; }
@keyframes cloud { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 420px)); } }
.hills { position: absolute; left: 0; bottom: 0; width: 100%; height: 190px; }
.hill-far { fill: var(--hill-far); } .hill-near { fill: var(--hill-near); }
.tf { fill: var(--tree-far); } .tn { fill: var(--tree-near); }
.sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 7s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-1.8deg); } to { transform: rotate(1.8deg); } }

/* question drawings */
.interact:empty { display: none; }
.stem-row { display: flex; align-items: flex-start; gap: 16px; }
.stem-row .stem { flex: 1; min-width: 0; }
.spot { flex: none; width: 74px; height: 74px; margin-top: -6px; }
.spot-svg { width: 100%; height: 100%; display: block; overflow: visible; animation: bob 6s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.qcard.ok .spot-svg { animation: bob 6s ease-in-out infinite, spot-glow 1.6s ease-out 1; }
@keyframes spot-glow { 0%, 100% { filter: drop-shadow(0 0 0 transparent); } 30% { filter: drop-shadow(0 0 10px var(--glow)); } }
@media (max-width: 520px) { .spot { width: 54px; height: 54px; margin-top: -2px; } .stem-row { gap: 10px; } }
.sp-bg { fill: var(--tint); }
.sp-s { fill: none; stroke: var(--moss); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.sp-sf { fill: var(--surface); stroke: var(--moss); stroke-width: 2.2; stroke-linejoin: round; }
.sp-sa { fill: none; stroke: var(--amber); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.sp-w { stroke-width: 5; } .sp-dash { stroke-dasharray: 3 4; } .sp-cap { fill: none; }
.sp-a { fill: var(--amber); } .sp-l { fill: var(--sap); } .sp-d { fill: var(--moss); }
.sp-t { font-family: var(--f-hand); font-size: 13px; fill: var(--moss-strong); }

/* motion: cards rise in, right answers glow and shine, leaves burst, wrong answers nudge */
.qcard { animation: card-in .38s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes card-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.fb { position: relative; overflow: hidden; }
.fb.ok { animation: fb-glow 1.5s ease-out 1; }
@keyframes fb-glow { 0% { box-shadow: 0 0 0 0 var(--glow); } 30% { box-shadow: 0 0 0 5px var(--glow), 0 0 30px 4px var(--glow); } 100% { box-shadow: 0 0 0 0 transparent; } }
.fb.ok::before { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%; background: linear-gradient(100deg, transparent, var(--shine), transparent); transform: skewX(-14deg); animation: shine 1.15s ease-out .12s 1 both; pointer-events: none; }
.fb.master::before { animation-duration: 1.6s; }
@keyframes shine { from { left: -60%; } to { left: 130%; } }
.fb.no { animation: nudge .42s ease 1; }
@keyframes nudge { 20% { transform: translateX(-5px); } 45% { transform: translateX(4px); } 70% { transform: translateX(-2px); } 100% { transform: none; } }
.opt.glow { animation: opt-glow 1.4s ease-out 1; }
@keyframes opt-glow { 0% { box-shadow: 0 0 0 0 var(--glow); } 30% { box-shadow: 0 0 0 4px var(--glow), 0 0 22px 2px var(--glow); } 100% { box-shadow: 0 0 0 0 transparent; } }
.grow { position: relative; }
.burst { position: absolute; left: 78%; top: 35%; width: 0; height: 0; pointer-events: none; }
.burst i { position: absolute; left: -4px; top: -6px; width: 8px; height: 12px; border-radius: 8px 0 8px 0; background: var(--sap); opacity: 0; animation: leaf 1.25s ease-out var(--dl) 1 both; }
.burst i:nth-child(3n) { background: var(--amber); } .burst i:nth-child(3n+1) { background: var(--tree); }
@keyframes leaf { 0% { opacity: 0; transform: translate(0, 0) rotate(0) scale(.4); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1); } }
.forest.big .tr { animation: rise .6s cubic-bezier(.2, .9, .3, 1.3) both; transform-origin: 50% 100%; }
.sec { transition: background .15s, border-color .15s, transform .15s, box-shadow .15s; }
.sec:hover { transform: translateY(-2px); box-shadow: 0 8px 22px -14px var(--moss); }
.opt { transition: border-color .12s, background .12s, transform .12s; }
.opt:hover:not(.right):not(.wrong) { transform: translateX(2px); }
.btn.primary { position: relative; overflow: hidden; }
.btn.primary::after { content: ""; position: absolute; top: 0; bottom: 0; left: -70%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .22), transparent); transform: skewX(-14deg); pointer-events: none; }
.btn.primary:hover:not(:disabled)::after { animation: shine .9s ease-out 1; }
.seg.mini:not(.on) { background: var(--paper); }
@media (max-width: 520px) { .card, .qcard { padding: 16px; } .opt { padding: 11px 12px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }


.xh { display: flex; gap: 14px; align-items: flex-start; width: 100%; max-width: 470px; text-align: left; font-size: .92rem; }
.xh-who { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 18px; font-size: .8rem; }

.xh-spr img { position: absolute; inset: 0; width: 100%; height: 100%; }
.xh-card { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.xh-card p { margin: 0; }
.xh-q { font-weight: 600; }
.xh-sub { font-size: .8rem; color: var(--muted); }

.g-card h3 { font-size: 1.05rem; line-height: 1.3; }

.g-def { margin: 0; font-size: .9rem; line-height: 1.55; color: var(--ink); background: var(--tint); border-radius: 10px; padding: 8px 10px; }
.g-def::before { content: "Textbook"; display: block; font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 2px; }

.hookbox { border: 2px dashed var(--amber); border-radius: 16px; padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; }

.traps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--ink2); line-height: 1.55; }
mark.hl-r { background: var(--clay-bg); color: var(--clay-ink); border-radius: 4px; padding: 0 2px; }

/* sorting game */
.game-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }

<script>
/* password gate: once the right password is entered on a device, it's remembered there */
(function () {
  var KEY = 'midterm-grove-unlocked', HASH = '40eepl';
  var gate = document.getElementById('gate'), wrap = document.querySelector('.wrap');
  function h(s) { var x = 5381; for (var i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0; return (x >>> 0).toString(36); }
  var ok = false; try { ok = localStorage.getItem(KEY) === HASH; } catch (e) { }
  if (ok) { gate.parentNode.removeChild(gate); return; }
  if (wrap) wrap.setAttribute('inert', '');
  document.documentElement.classList.add('locked');
  var form = document.getElementById('gate-form'), pw = document.getElementById('gate-pw'), err = document.getElementById('gate-err');
  setTimeout(function () { try { pw.focus({ preventScroll: true }); } catch (e) { } }, 60);
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (h(pw.value.trim().toLowerCase()) === HASH) {
      try { localStorage.setItem(KEY, HASH); } catch (x) { }
      if (wrap) wrap.removeAttribute('inert');
      document.documentElement.classList.remove('locked');
      gate.classList.add('open');
      setTimeout(function () { if (gate.parentNode) gate.parentNode.removeChild(gate); }, 450);
    } else {
      err.textContent = 'That’s not the password. Try again.';
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
      pw.select();
    }
  });
})();
</script>
