    return '<div class="rbar' + (n > 40 ? ' dense' : '') + '" role="img" aria-label="Question ' + pos + ' of ' + n + '. Answered ' + (c[1] + c[2] + c[3]) + ': ' + c[3] + ' mastered, ' + c[2] + ' correct once, ' + c[1] + ' need work.">' + segs + '</div>';
  }
  function updateTopBar() {
    var qb = document.querySelector('.qbar .rbar');
    if (qb) qb.outerHTML = roundBar();
  }
  function burst(n) {
    var h = '<span class="burst" aria-hidden="true">';
    for (var i = 0; i < n; i++) {
      var a = (-90 + (i - (n - 1) / 2) * (150 / n)) * Math.PI / 180, d = 24 + (i % 3) * 9;
      h += '<i style="--dx:' + (Math.cos(a) * d).toFixed(1) + 'px;--dy:' + (Math.sin(a) * d).toFixed(1) + 'px;--r:' + (i * 47 % 180 - 90) + 'deg;--dl:' + (i * 0.035).toFixed(3) + 's"></i>';
    }
    return h + '</span>';
  }
  function feedbackHTML() {
    var q = cur.q, ok = cur.ok, prev = cur.prev, next = cur.next, head, sub;
    if (ok) {
      if (next === 3 && prev === 3) { head = 'Still a strong tree.'; sub = 'Stays mastered.'; }
      else if (next === 3) { head = 'Mastered. A tree grows.'; sub = 'Right twice. This one is retired unless you review it.'; }
      else { head = 'Correct. A sapling sprouts.'; sub = 'Get it right once more to master it.'; }
    } else {
      head = 'Not quite.';
      sub = prev === 3 ? 'This tree goes back to a sprout. It will come around again in a later round.' : (round.mode === 'review' ? 'Back to the needs-work pile.' : 'It will come back in a later round.');
    }
    var mastered = ok && next === 3 && prev !== 3;
    var h = '<div class="fb ' + (ok ? 'ok' : 'no') + (mastered ? ' master' : '') + '" role="status" aria-live="polite"><div class="fb-head"><span class="grow">' + tree(prev, 'from') + '<span class="arrow" aria-hidden="true">→</span>' + tree(next, 'to') + (ok ? burst(mastered ? 9 : 5) : '') + '</span><div><p class="verdict">' + head + '</p><p class="fb-sub">' + sub + '</p></div></div>';
    if (!ok && cur.yourWhy) h += '<p class="fb-p"><span class="lab lab-r">Why your answer is off</span>' + md(cur.yourWhy, true) + '</p>';
    h += '<p class="fb-p"><span class="lab lab-g">' + (ok ? 'Why it’s right' : 'Why the right answer works') + '</span>' + md(q.e, true) + '</p></div>';
    h += '<div class="check-row"><button class="btn primary" id="next-btn" data-act="next">' + (round.queue.length ? 'Next question' : 'Finish round') + '</button><span class="kbd-hint">Enter for next</span></div>';
    return h;
  }

  /* ---------------- end of round ---------------- */
  function renderEnd() {
    var ids = round.seen.filter(function (id, i, a) { return a.indexOf(id) === i; });
    var total = round.right + round.wrong;
    var h = '<nav class="top top-tools"><button class="back" data-act="home">‹ Grove</button><span class="top-sp"></span>' + tools() + '</nav><section class="card end"><p class="eyebrow">Round complete</p><h1>' + (round.wrong === 0 ? 'A clean round.' : round.right >= round.wrong ? 'Good growth.' : 'Seeds planted. They’ll come up.') + '</h1>' +
      '<div class="end-stats"><div><b>' + round.right + '</b><span>correct</span></div><div><b>' + round.wrong + '</b><span>to revisit</span></div><div><b>' + round.mastered + '</b><span>newly mastered</span></div><div><b>' + (total ? Math.round(round.right / total * 100) : 0) + '%</b><span>accuracy</span></div></div>' +
      '<p class="end-l">This round’s trees</p><div class="forest big">' + ids.map(function (id, i) { return tree(tier(id)).replace('<svg ', '<svg style="animation-delay:' + (0.15 + i * 0.06).toFixed(2) + 's" '); }).join('') + '</div>';
    var scope = round.scope, left = poolFor(scope).filter(function (q) { return round.mode === 'review' ? tier(q.id) === 3 : tier(q.id) !== 3; }).length;
    h += '<div class="actions">' + (left ? '<button class="btn primary" data-act="start" data-s="' + scope + '" data-m="' + round.mode + '">Another round</button>' : '') +
      (scope === 'all' ? '' : '<button class="btn" data-act="section" data-s="' + scope + '">' + (scope === 'B' ? 'Extra Practice overview' : 'Section overview') + '</button>') + '<button class="btn" data-act="home">Back to the grove</button></div></section>';
    app.innerHTML = h;
  }

  /* ---------------- events ---------------- */
  function rerenderInteract() {
    var el = document.querySelector('.interact'); if (el) el.innerHTML = interactHTML();
    var cb = document.getElementById('check-btn'); if (cb) cb.disabled = !canCheck();
  }
  function placeChip(chipId, targetIdx) {
    if (cur.cap === 1) {
      Object.keys(cur.place).forEach(function (k) { if (cur.place[k] === targetIdx && +k !== chipId) delete cur.place[k]; });
    }
    cur.place[chipId] = targetIdx; cur.selChip = null; play('place');
  }
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act], [data-hs]');
    if (!el) return;
    ac();
    var act = el.getAttribute('data-act');
    if (!act && el.hasAttribute('data-hs')) {
      if (view.name !== 'quiz' || cur.done || cur.q.t !== 'hot') return;
      cur.sel = el.getAttribute('data-hs'); play('tap');
      document.querySelectorAll('.figwrap [data-hs]').forEach(function (x) { x.classList.toggle('hs-sel', x.getAttribute('data-hs') === cur.sel); });
      rerenderInteract(); return;
    }
    switch (act) {
      case 'home': view = { name: 'home' }; render(); break;
      case 'section': view = { name: 'section', s: sKey(el.getAttribute('data-s')) }; confirmResetB = false; render(); break;
      case 'start': play('tap'); startRound(el.getAttribute('data-s'), el.getAttribute('data-m'), el.getAttribute('data-fresh') === '1'); break;
      case 'exit': view = round.scope === 'all' ? { name: 'home' } : { name: 'section', s: sKey(round.scope) }; render(); break;
      case 'theme': P.theme = el.getAttribute('data-v'); store(PKEY, P); applyTheme(); play('tap'); render(true); refocus('[data-act="theme"][data-v="' + P.theme + '"]'); break;
      case 'sound': P.sound = !P.sound; store(PKEY, P); if (P.sound) play('tap'); el.outerHTML = soundBtn(); var sb = document.querySelector('[data-act="sound"]'); if (sb) sb.focus(); break;
      case 'theme-flip': P.theme = effTheme() === 'dark' ? 'light' : 'dark'; store(PKEY, P); applyTheme(); play('tap'); el.outerHTML = themeBtn(); var tb = document.querySelector('[data-act="theme-flip"]'); if (tb) tb.focus(); break;
      case 'size': P.size = +el.getAttribute('data-v'); store(PKEY, P); play('tap'); render(true); refocus('[data-act="size"][data-v="' + P.size + '"]'); break;
      case 'reset': confirmReset = true; play('tap'); render(true); refocus('[data-act="reset-no"]'); break;
      case 'reset-no': confirmReset = false; play('tap'); render(true); refocus('[data-act="reset"]'); break;
      case 'reset-yes': var keepB = {}; Object.keys(S.q).forEach(function (k) { if (isBonusId(k)) keepB[k] = S.q[k]; }); var keepBR = {}; Object.keys(S.r || {}).forEach(function (k) { if (isBonusId(k)) keepBR[k] = S.r[k]; }); S = { q: keepB, resetAt: Date.now(), bResetAt: S.bResetAt || 0, r: keepBR }; store(KEY, S); confirmReset = false; queueSync(); play('wrong'); render(true); window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' }); break;
      case 'reset-b': confirmResetB = true; play('tap'); render(true); refocus('[data-act="reset-b-no"]'); break;
      case 'reset-b-no': confirmResetB = false; play('tap'); render(true); refocus('[data-act="reset-b"]'); break;
      case 'reset-b-yes': var keepM = {}; Object.keys(S.q).forEach(function (k) { if (!isBonusId(k)) keepM[k] = S.q[k]; }); var keepMR = {}; Object.keys(S.r || {}).forEach(function (k) { if (!isBonusId(k)) keepMR[k] = S.r[k]; }); S = { q: keepM, resetAt: S.resetAt || 0, bResetAt: Date.now(), r: keepMR }; store(KEY, S); confirmResetB = false; queueSync(); play('wrong'); render(true); break;
      case 'opt': if (cur.done) return; cur.sel = +el.getAttribute('data-i'); play('tap'); rerenderInteract(); break;
      case 'check': check(); break;
      case 'next': play('tap'); nextQuestion(); break;
      case 'hint': cur.hint = true; var inpH = document.getElementById('fill-in'); cur.val = inpH ? inpH.value : cur.val; document.getElementById('qcard').innerHTML = questionHTML(); var i2 = document.getElementById('fill-in'); if (i2) { i2.focus(); i2.setSelectionRange(i2.value.length, i2.value.length); } break;
      case 'chip':
        if (cur.done) return;
        var cid = +el.getAttribute('data-c'), placedIn = cur.place[cid];
        if (placedIn != null && cur.selChip != null && cur.selChip !== cid) placeChip(cur.selChip, placedIn);
        else if (placedIn != null) { delete cur.place[cid]; cur.selChip = cid; play('tap'); }
        else { cur.selChip = cur.selChip === cid ? null : cid; play('tap'); }
        e.stopPropagation(); rerenderInteract(); break;
      case 'tgt':
        if (cur.done || cur.selChip == null) return;
        placeChip(cur.selChip, +el.getAttribute('data-t')); rerenderInteract(); break;
      case 'pool': break;
      case 'seq': if (cur.done) return; cur.seq.push(+el.getAttribute('data-c')); play('place'); rerenderInteract(); break;
      case 'unseq': if (cur.done) return; var u = +el.getAttribute('data-c'); cur.seq = cur.seq.filter(function (x) { return x !== u; }); play('tap'); rerenderInteract(); break;
      case 'blank':
        if (cur.done) return; var b = +el.getAttribute('data-b');
        if (cur.fill[b] != null) { cur.fill[b] = null; play('tap'); }
        cur.active = b; rerenderInteract(); break;
      case 'word':
        if (cur.done) return; var w = +el.getAttribute('data-c'), slot = cur.fill[cur.active] == null ? cur.active : cur.fill.indexOf(null);
        if (slot < 0) return;
        cur.fill[slot] = w; play('place');
        var nextEmpty = cur.fill.indexOf(null); cur.active = nextEmpty < 0 ? slot : nextEmpty;
        rerenderInteract(); break;
      case 'pick': if (cur.done) return; var pc = +el.getAttribute('data-c'); cur.picked[pc] = !cur.picked[pc]; play('tap'); rerenderInteract(); break;
      case 'lab': play('tap'); view = { name: 'lab' }; render(); break;
      case 'summon': summon(el.getAttribute('data-k')); break;
      default: if (act && act.indexOf('lab-') === 0 && LABV) LABV.click(act, el, e);
    }
  });
  /* every sprite in the app closes its eyes while you press on it */
  app.addEventListener('pointerdown', function (e) {
    var sp = e.target.closest && e.target.closest('.x-spr, .spot-spr, .xh-spr, .lab-sec-ic');
    if (!sp) return;
    sp.classList.add('shut'); play('blink');
    var open = function () { sp.classList.remove('shut'); window.removeEventListener('pointerup', open); window.removeEventListener('pointercancel', open); };
    window.addEventListener('pointerup', function () { setTimeout(open, 180); }, { once: true });
    window.addEventListener('pointercancel', open, { once: true });
  });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'fill-in' && cur && !cur.done) { cur.val = e.target.value; var cb = document.getElementById('check-btn'); if (cb) cb.disabled = !canCheck(); }
  });
  /* drag and drop for match/sort on devices with a mouse */
  app.addEventListener('dragstart', function (e) {
    var el = e.target.closest && e.target.closest('.chip[data-act="chip"]');
    if (!el || !cur || cur.done) return;
    cur.drag = +el.getAttribute('data-c');
    try { e.dataTransfer.setData('text/plain', String(cur.drag)); e.dataTransfer.effectAllowed = 'move'; } catch (err) { }
  });
  app.addEventListener('dragover', function (e) {
    var t = e.target.closest && e.target.closest('.tgt, .pool');
    if (t && cur && cur.drag != null) { e.preventDefault(); t.classList.add('over'); }
  });
  app.addEventListener('dragleave', function (e) { var t = e.target.closest && e.target.closest('.tgt, .pool'); if (t) t.classList.remove('over'); });
  app.addEventListener('drop', function (e) {
    var t = e.target.closest && e.target.closest('.tgt, .pool');
    if (!t || !cur || cur.drag == null || cur.done) return;
    e.preventDefault();
    if (t.classList.contains('tgt')) placeChip(cur.drag, +t.getAttribute('data-t'));
    else { delete cur.place[cur.drag]; cur.selChip = null; }
    cur.drag = null; rerenderInteract();
  });
  app.addEventListener('dragend', function () { if (cur) cur.drag = null; });

  document.addEventListener('keydown', function (e) {
    if (view.name !== 'quiz' || !cur) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
    var act = e.target && e.target.getAttribute ? e.target.getAttribute('data-act') : null;
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('tgt')) { e.preventDefault(); e.target.click(); return; }
    if (e.key === 'Enter') {
      if (act === 'check' || act === 'next' || act === 'exit' || act === 'sound' || act === 'hint' || act === 'theme-flip') return;
      e.preventDefault();
      if (cur.done) { play('tap'); nextQuestion(); } else check();
      return;
    }
    if (typing || cur.done) return;
    if (cur.q.t === 'mc') {
      var k = e.key.toLowerCase(), idx = '12345'.indexOf(k);
      if (idx < 0) idx = 'abcde'.indexOf(k);
      if (idx >= 0 && idx < cur.opts.length) { cur.sel = idx; play('tap'); rerenderInteract(); }
    }
  });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', function () { if (P.theme === 'auto') applyTheme(); });
  }

  render();
  setTimeout(initSync, 0);
})();

</script>
