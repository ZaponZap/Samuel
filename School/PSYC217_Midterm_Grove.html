[`Social skills interventions only work for one person at a time`,`The pooled data showed they help broadly.`],
[`Meta-analysis turns single case studies into true experiments`,`Pooling doesn't add random assignment.`],
[`Single case studies can't be combined with each other because each one is completely unique`,`They were combined successfully.`]],
e:`{g:Meta-analysis} (Wang et al., 2013) pooled many tiny studies and found social skills interventions {g:can effectively help} people with ASD.`});

Q({k:`Single case designs`, q:`When is a single-case design especially useful?`,
c:`With one client or a rare condition, where group studies aren't practical`,
x:[[`When you need to generalize the results to a whole population immediately`,`One case doesn't generalize on its own.`],
[`When random assignment of thousands of people is possible`,`Then a group experiment would be better.`],
[`When the DV can only be measured once`,`Single-case designs need repeated measurement.`],
[`When you want to avoid measuring a baseline`,`The baseline is essential.`]],
e:`Single-case designs shine in {g:clinical and applied behaviour} settings and for {g:rare} cases. Multiple baselines then help generalize.`});

Q({k:`Single case designs`, q:`What's the main purpose of a multiple baseline design?`,
c:`To generalize a single-case finding by replicating it in new cases`,
x:[[`To compare one person's pretest score with their own posttest score`,`That's a one-group pretest-posttest design.`],
[`To remove the need for any baseline measurement`,`It uses several baselines.`],
[`To randomly assign people to conditions`,`It replicates; it doesn't randomly assign.`],
[`To measure inter-rater reliability`,`That's a measurement idea.`]],
e:`One case could be a coincidence. Showing the change {g:each time} the treatment starts, across people, behaviours or situations, builds a much stronger case.`});

Q({t:`match`, k:`Single case designs`, q:`Multiple baseline designs generalize single-case results. Match each type to its menthol example.`,
p:[[`Across participants`,`Does menthol cause pain for other people with mystery stomach aches?`],
[`Across behaviours`,`Does menthol relate to other kinds of pain too?`],
[`Across situations`,`Does menthol cause it both with and without a sore throat?`],
[`Across operational definitions`,`Does it happen with menthol cough drops and menthol toothpaste?`]],
e:`{g:Multiple baseline} = replicate across {g:people}, {g:behaviours}, {g:situations} or {g:operationalizations of the IV/DV} to show the effect isn't a fluke.`});

Q({t:`hot`, k:`Design a special experiment`, q:`Your dog wrecks the curtains while you're at work, and you wonder if playing music helps. You track daily damage across four phases. Click the phase that replicates the music's effect and lets the study end with the treatment on.`,
fig:{k:`ts`, ph:[[`No music`,[7,8,7,8]],[`Music`,[3,2,2,1]],[`No music`,[6,7,8,7]],[`Music`,[2,2,1,1]]], brk:true, y:`Things destroyed`, x:`Workdays`},
a:`ph3`,
why:{ph0:`That's the baseline, before any music.`, ph1:`That's the first time the music is tried, not the replication.`, ph2:`That's the withdrawal phase, which shows the reversal.`},
e:`An {g:ABAB reversal}: baseline (no music), treatment (music), withdrawal, then music again. The final B {g:replicates} the drop and leaves your curtains (and dog) better off.`});

/* =========================================================
   DEVELOPMENTAL DESIGNS (LO7)
   ========================================================= */
Q({t:`match`, k:`Developmental designs`, lv:`warm`, q:`Each developmental method resembles a design you already know. Match them.`,
p:[[`Cross-sectional method`,`Like a between-subjects design: different people at each age`],
[`Longitudinal method`,`Like a within-subjects design: the same people at every age`],
[`Sequential method`,`A blend: several age groups, each followed over time`]],
e:`In developmental research the key variable is {g:age}, and age can't be randomly assigned. Cross-sectional ≈ {g:between}; longitudinal ≈ {g:within}; sequential = {g:hybrid}.`});

Q({t:`hot`, k:`Developmental designs`, q:`Three developmental designs, using the textbook's 2020–2030 example. Click the sequential design.`,
fig:{k:`dev`, ty:`all`, order:[`long`,`seq`,`cross`]},
a:`seq`,
why:{long:`One cohort followed over time is longitudinal.`, cross:`Several cohorts tested once is cross-sectional.`},
e:`The {g:sequential method} starts cross-sectional ({g:55- vs 65-year-olds} in 2020) and then follows {g:each group} over time (2025, 2030).`});

Q({t:`hot`, k:`Developmental designs`, rq:`12.10`, q:`In which of these designs are cohort effects confounded with age? Click it.`,
fig:{k:`dev`, ty:`all`, order:[`seq`,`cross`,`long`]},
a:`cross`,
why:{long:`One cohort followed over time: everyone shares the same era, so cohort can't explain age changes.`, seq:`The sequential design can separate the two by following each cohort over time.`},
e:`In the {g:cross-sectional} design, each age group is also a different {r:cohort} (born 1955, 1960, 1965). Any difference could be {r:age} or {r:growing up in a different era}. You can't separate them.`});

Q({t:`hot`, k:`Developmental designs`, q:`This cross-sectional study tested three cohorts in 2020. To make it sequential, you'll follow the 1965 cohort. Click the cell where you'd test them next.`,
fig:{k:`dev`, ty:`cross`, cells:true},
a:`c01`,
why:{c00:`That's the 2020 test you already did.`, c02:`That comes later; the next test is five years after the first.`, c10:`That's the 1960 cohort's existing 2020 test.`, c11:`That's the 1960 cohort, not the 1965 cohort.`, c12:`That's the 1960 cohort in 2030.`, c20:`That's the 1955 cohort's existing 2020 test.`, c21:`That's the 1955 cohort, not the 1965 cohort.`, c22:`That's the 1955 cohort in 2030.`},
e:`Next up: the {g:1965 cohort in 2025}, now 60. Sequential = cross-sectional now, plus {g:at least one more test} of the same people later. Cross-sectional data is ready to analyze while the longitudinal data comes in.`});

Q({k:`Developmental designs`, lv:`warm`, q:`What is a {k:cohort}?`,
c:`People born around the same time who lived through the same societal events`,
x:[[`Any group of participants who happen to be tested together in the same session`,`Testing together doesn't make a cohort.`],
[`A group of people who share the same diagnosis`,`That's a clinical group.`],
[`People who all drop out of a longitudinal study at around the same point in time`,`That's attrition.`],
[`A sample chosen randomly from the whole population`,`That's a random sample.`]],
e:`A {g:cohort} shares an era: the same {g:events}, {g:technology}, {g:music}, {g:schools}, {g:child-rearing practices} and demographic trends (like divorce rates and family size).`});

Q({k:`Developmental designs`, q:`A cross-sectional study finds 50-year-olds learn new software worse than 20-, 30- and 40-year-olds. Why can't you conclude that software learning ability declines with age?`,
c:`Older cohorts may have had less exposure to computers while growing up`,
x:[[`The 50-year-olds were tested on a different day than the three younger groups`,`Testing day isn't the core issue.`],
[`Software learning can't be measured in a reliable way`,`It can be measured.`],
[`Older people are much more likely to drop out partway through a single test session`,`Attrition is a longitudinal problem.`],
[`The study followed the same people for 30 years`,`That would be longitudinal, which avoids this problem.`]],
e:`{r:Cohort effects}. Today's 20-year-olds probably won't struggle as much at 60, because they grew up with computers. In a cross-sectional study, {r:cohort is confounded with age}.`});

Q({k:`Developmental designs`, q:`When are cohort effects most likely to be a problem?`,
c:`When the age groups span a very wide range, like teens through retirees`,
x:[[`When the age groups are very close together, like 15-year-olds vs 17-year-olds`,`Close ages share similar life experiences.`],
[`When the same people are followed and retested for many years as they age`,`That's longitudinal, which avoids cohort confusion.`],
[`When the study uses only self-report measures`,`Measure type isn't the issue.`],
[`When the sample is very large`,`Size doesn't create cohort effects.`]],
e:`Adolescents and retired adults grew up in {r:very different worlds}. Mid-teens vs early twenties? Much more similar.`});

Q({k:`Developmental designs`, q:`Why is the cross-sectional method far more common than the longitudinal method?`,
c:`It's cheaper and gives results right away`,
x:[[`It avoids cohort effects, unlike the longitudinal method`,`It's the one that suffers from cohort effects.`],
[`It measures change within the same people directly`,`That's the longitudinal method.`],
[`It never loses participants to attrition`,`True, but cost and speed are the main reasons given.`],
[`It allows age to be randomly assigned`,`Age can never be randomly assigned.`]],
e:`Studying people from age 20 to 50 longitudinally takes {g:30 years}; a cross-sectional study gets comparable data {g:quickly} and {g:cheaply}.`});

Q({t:`fill`, k:`Developmental designs`, q:`To study the same group of people from age 20 to age 50 with a longitudinal design, you'd need ___ years.`,
a:[`30`,`thirty`],
e:`{g:30 years}. That's the big cost of longitudinal research, and why cross-sectional designs are more common.`});

Q({k:`Developmental designs`, q:`What are the major limitations of the longitudinal method?`,
c:`It's difficult and expensive, and many people drop out over the years`,
x:[[`It confounds cohort effects with age at every single time point it measures`,`That's the cross-sectional method's problem.`],
[`It can only compare different people of different ages at a single moment`,`It follows the same people over time.`],
[`It can't show how the same person changes as they grow older`,`That's exactly what it can show.`],
[`It only works with children, never with adults`,`It's used across the lifespan.`]],
e:`People {r:move, die or lose interest}: high {r:attrition}. Researchers travel to participants and even search social networking sites to stay in touch. Don't start one without {g:resources, patience and energy}.`});

Q({k:`Developmental designs`, q:`To account for attrition in a longitudinal study, what should researchers do when analyzing the data?`,
c:`Compare the scores of people who dropped out with those who stayed`,
x:[[`Simply drop everyone who missed any session and analyze the rest as normal`,`That hides the problem instead of checking it.`],
[`Replace the dropouts with brand-new participants who are the same age`,`New people are a different cohort and history.`],
[`Ignore attrition because it only affects cross-sectional studies`,`Attrition is a longitudinal problem.`],
[`Treat the dropouts as a control group for those who stayed`,`They didn't experience a different condition.`]],
e:`If stayers look {r:quite different} from leavers, the final sample may be unusual in some unidentified way, which limits what the results mean.`});

Q({k:`Developmental designs`, q:`Instead of following kids from age 5 to 13, a researcher studies 13-year-olds and asks them (or their parents) about their home life at age 5. What is this approach, and its main problem?`,
c:`A retrospective approach; people may not remember the past accurately`,
x:[[`A sequential approach; it takes even longer than a longitudinal study`,`It's quicker, not longer.`],
[`A longitudinal approach; participants drop out over the years`,`Nobody is followed over time.`],
[`A cross-sectional approach; cohort effects are confounded with age`,`Only one age group is studied.`],
[`An interrupted time series; history effects aren't controlled`,`There's no series of measurements.`]],
e:`The {g:retrospective approach} asks about the past. Its weak spot is {r:memory}. For linking age-5 home life to age-13 achievement, a {g:longitudinal} study gives the best evidence.`});

Q({k:`Developmental designs`, q:`What's the only way to conclusively study changes that happen as people grow older?`,
c:`A longitudinal design that follows the same people as they age`,
x:[[`A cross-sectional design with a very large and diverse sample of ages`,`A large sample doesn't remove cohort effects.`],
[`A retrospective approach using detailed interviews about the past`,`Memories can be inaccurate.`],
[`A single case design with a reversal phase`,`You can't reverse aging.`],
[`An IV × PV design with age as the IV`,`Age is a participant variable, not a manipulated IV.`]],
e:`Only {g:longitudinal} data shows the {g:same people} changing, so cohort can't explain the change.`});

Q({k:`Developmental designs`, q:`Lewis Terman began following more than 1,500 California schoolchildren with IQs of at least 135 in 1921. Which finding came out of this longitudinal study?`,
c:`Conscientiousness in childhood predicted living longer`,
x:[[`Highly intelligent kids grew up socially and emotionally poorly adjusted`,`The "Termites" were quite well-adjusted.`],
[`Day care had positive effects on kids over eight years`,`That's a Swedish study (Broberg et al., 1997).`],
[`Positive emotion in autobiographies predicted longevity`,`That's the Nun Study.`],
[`Sleeping more than average in childhood predicted longer life for everyone`,`Sleeping more or less than average predicted earlier death, only for males.`]],
e:`The "{g:Termites}" disputed stereotypes of high intelligence (they were well-adjusted). Archived data later showed {g:conscientiousness} predicted {g:longevity} (Friedman et al., 1995), and childhood sleep deviation predicted earlier death for males (Duggan et al., 2014).`});

Q({k:`Developmental designs`, q:`In the Nun Study, 678 women (average age 83) shared archived records, including autobiographies written in 1930. How was positive emotion operationalized?`,
c:`A coding system rated the positive emotional content of the autobiographies`,
x:[[`The nuns filled out a self-report mood questionnaire every single day for a year`,`The data came from archived writing.`],
[`Researchers measured stress hormones in blood samples the nuns gave each year`,`No physiological measure is described.`],
[`Researchers asked the nuns how happy they had felt back in 1930`,`That would be retrospective self-report.`],
[`Observers rated the nuns' smiles in old photographs`,`The autobiographies were coded.`]],
e:`Archival data (the {g:1930 autobiographies}) + a {g:coding system} for positive emotion. Finding: more positive emotion expressed → {g:longer life} (Donner et al., 2001).`});

Q({k:`Developmental designs`, q:`A sequential study first compares 55- and 65-year-olds, then tests everyone again five years later. What are its advantages?`,
c:`It takes fewer years than longitudinal, with cross-sectional data ready early`,
x:[[`It completely eliminates attrition, since each person is only ever tested once`,`People are tested more than once, so attrition is possible.`],
[`It allows age to be randomly assigned to participants`,`Age can't be assigned.`],
[`It's cheaper and faster to run than a one-time cross-sectional study`,`It costs more than a one-time study.`],
[`It turns age into a manipulated independent variable`,`Age is still a participant variable.`]],
e:`{g:Sequential} = cross-sectional {g:+} longitudinal. Analyze the age-group comparison right away while the longitudinal data is still being collected, and finish sooner than a full longitudinal study.`});

Q({t:`sort`, k:`Developmental designs`, rq:`12.10`, q:`Sort each feature into the developmental method it describes.`,
b:[`Longitudinal`,`Cross-sectional`,`Sequential`],
i:[[`The same people are tested repeatedly as they age`,0],[`High risk of attrition over many years`,0],[`The only way to conclusively study change with age`,0],[`Different age groups are tested at a single point in time`,1],[`Cheap and gives immediate results`,1],[`Cohort effects are confounded with age`,1],[`Several age groups, each tested again later`,2],[`Cross-sectional results are ready while longitudinal data is collected`,2]],
e:`{g:Longitudinal}: real change, but slow, costly, attrition. {g:Cross-sectional}: fast and cheap, but {r:cohort effects}. {g:Sequential}: a hybrid that gets some of both.`});

Q({k:`Developmental designs`, q:`A researcher compares memory in 20-, 40- and 60-year-olds all tested this year. Differences could reflect growing up in different eras, not age itself. What's this design and its weakness?`,
c:`Cross-sectional; cohort effects can be confused with age effects`,
x:[[`Longitudinal; participants drop out over the years of repeated testing`,`That's the longitudinal weakness, and this tests everyone once.`],
[`Sequential; it's too expensive to run`,`It isn't sequential.`],
[`Single-case; it can't generalize`,`It has many participants.`],
[`Interrupted time series; history effects`,`There's no repeated series.`]],
e:`{g:Cross-sectional} = different age groups at {g:one time}. Fast and cheap, but {r:cohort effects} (shared experiences of a generation) can masquerade as age differences.`});

Q({k:`Developmental designs`, q:`What's the main trade-off of a longitudinal design (following the same people for years)?`,
c:`No cohort confusion, but it's slow, costly, and people drop out`,
x:[[`It's fast and cheap to run, but cohort effects are a serious problem`,`That describes cross-sectional designs.`],
[`It uses random assignment, but can't measure change`,`It measures change directly and doesn't randomly assign age.`],
[`It needs only one measurement, but many people`,`It needs many measurements.`],
[`It has no attrition, but limited sample sizes`,`Attrition is its classic problem.`]],
e:`{g:Longitudinal}: the same people measured repeatedly, so you see real change, but it takes time and money, and {r:attrition (mortality)} can bias who's left. A {g:sequential} design combines both approaches.`});

Q({k:`Developmental designs`, q:`Dr. Cardenas finds political attitudes are most conservative among 60-year-olds and least conservative among 20-year-olds, all tested at once. Can she conclude that people become more conservative as they age?`,
c:`No; it's cross-sectional, so generational differences could explain it`,
x:[[`Yes; the age groups were far apart, which makes the age effect clearer`,`A wide age range actually makes cohort effects worse.`],
[`Yes; age is the independent variable, so it caused the attitude differences`,`Age isn't manipulated, so no causal claim.`],
[`No; it's longitudinal, so attrition distorted who was left`,`Everyone was tested once, so it's cross-sectional.`],
[`No; political attitudes can't be measured with any validity`,`They can be measured.`]],
e:`Each age group grew up in a different {r:political era}. To separate aging from cohort, follow people over time with a {g:longitudinal} or {g:sequential} design.`});

Q({k:`Developmental designs`, q:`Allen and colleagues (2014) measured adolescents at 13, 14 and 15, then again at 23, to see what happens to "cool" kids with early pseudomature behaviour. How does this improve on earlier cross-sectional findings that such behaviour goes with popularity?`,
c:`It follows the same teens into adulthood to see later outcomes`,
x:[[`It compares different teens of different ages at one single moment in time`,`That's what cross-sectional studies already did.`],
[`It randomly assigns some teens to act pseudomature`,`That would be unethical and wasn't done.`],
[`It studies one teen in depth with a reversal phase`,`It's a group study.`],
[`It removes attrition entirely by testing everyone only one time`,`Teens were tested several times.`]],
e:`A {g:longitudinal} design shows what happens to the {g:same people} ten years later, which a snapshot can't. The trade-off: it's slower, and attrition is possible.`});

/* =========================================================
   DESIGN A SPECIAL EXPERIMENT (Deepen questions)
   ========================================================= */
Q({t:`cloze`, k:`Design a special experiment`, q:`Schools add a supplemental 20-minute silent reading period. Advocates say it increases pleasure reading outside school. Build a non-equivalent control group pretest-posttest design.`,
txt:`Compare a school that adds the supplemental reading period (the [[treatment]] group) with a similar school that doesn't (the [[control]] group). Students aren't [[randomly]] assigned, so measure pleasure reading at [[pretest]] in both schools to check they start out similar, then measure it again at [[posttest]]. The DV could be books checked out of the public library.`,
d:[`placebo`,`maturation`,`confederate`],
e:`IV = supplemental period (yes vs no). DV = {g:pleasure reading outside school} (e.g., library checkouts, reading logs). The pretest checks the key variable; other school differences may remain.`});

Q({k:`Design a special experiment`, q:`For the supplemental silent reading study, which DV best matches the advocates' claim?`,
c:`How much students read for pleasure outside the required reading periods`,
x:[[`How many minutes students spend reading during the supplemental period itself`,`That just measures the program itself.`],
[`Students' scores on a standardized spelling test`,`That isn't the claim.`],
[`Teachers' ratings of how much they like the program`,`Teacher liking isn't pleasure reading.`],
[`How quietly students sit during reading time`,`That's not the claimed outcome.`]],
e:`Operationalize the {g:claim}: "increases {g:pleasure reading outside} the required period." Library checkouts or home reading logs fit.`});

Q({k:`Design a special experiment`, lv:`hard`, q:`Could the silent reading question be tested with a true experiment instead?`,
c:`Possibly, if schools or classes were randomly assigned to get the period`,
x:[[`No, because reading for pleasure outside school can never be measured well`,`It can be measured, e.g., library checkouts.`],
[`No, because true experiments can't happen in schools`,`Schools can host randomized studies.`],
[`Yes, by comparing schools that have already chosen to add the reading period`,`That's still non-equivalent groups.`],
[`Yes, by testing just one student before and after`,`That's a single case design.`]],
e:`Randomly assigning {g:whole schools or classes} would make it a true experiment. In practice, schools usually adopt policies {r:by choice}, which is why a quasi design is often the realistic option.`});

/* =========================================================
   STUDY TERMS (Ch. 12)
   ========================================================= */
Q({t:`match`, k:`Study terms · Ch. 12`, q:`Drag each design to its definition.`,
p:[[`Quasi-experimental designs`,`Have many features of an experiment but, out of necessity, lack some (so no causal inference)`],
[`One-group posttest-only design`,`No control group and no pretest; very poor internal validity`],
[`One-group pretest-posttest design`,`The IV's effect is inferred from the before-after difference in one group`],
[`Non-equivalent control group design`,`Groups aren't equivalent (e.g., naturally occurring groups) and there's no pretest`],
[`Non-equivalent control group pretest-posttest design`,`Non-equivalent groups, but a pretest checks equivalency and shows change`]],
e:`The ladder: posttest-only → add a {g:pretest} → add a {g:comparison group} → add both. None of them use {r:random assignment}.`});

Q({t:`match`, k:`Study terms · Ch. 12`, q:`Drag each term to its definition.`,
p:[[`Interrupted time series design`,`A series of measurements over an extended period, before and after a treatment`],
[`Control series design`,`An interrupted time series with a comparison or control group added`],
[`Single case experimental design`,`The IV's effect is assessed using data from a single participant`],
[`Baseline`,`A control period where behaviour is measured before the manipulation`],
[`Reversal design`,`Treatment is introduced after a baseline, then withdrawn to see the effect fade`],
[`Multiple baseline design`,`Behaviour observed before and after a manipulation across people, behaviours or settings`]],
e:`Time series designs follow {g:groups} over many time points; single case designs follow {g:one person} through baseline and treatment phases.`});

Q({t:`match`, k:`Study terms · Ch. 12`, q:`Drag each threat to its definition.`,
p:[[`History effects`,`Outside events, not part of the manipulation, influence the DV`],
[`Maturation effects`,`Naturally occurring change within individuals over time`],
[`Testing effects`,`Simply taking a pretest changes behaviour, with no effect of the IV`],
[`Instrument decay`,`The measurement instrument's characteristics change over time`],
[`Regression toward the mean`,`Extreme scores tend to be closer to the mean when measured again`]],
e:`All five can masquerade as a treatment effect. A good {g:control group} experiences them too, so they can't explain a difference between groups.`});

Q({t:`match`, k:`Study terms · Ch. 12`, q:`Drag each developmental term to its definition.`,
p:[[`Longitudinal method`,`The same people are observed repeatedly as they grow older`],
[`Cross-sectional method`,`People of different ages are studied at a single point in time`],
[`Sequential method`,`A combination of cross-sectional and longitudinal designs`],
[`Cohort effects`,`Era differences between age groups, confounded with age in cross-sectional studies`]],
e:`Longitudinal ≈ {g:within-subjects}; cross-sectional ≈ {g:between-subjects}; sequential = both. {r:Cohort effects} are the cross-sectional method's big weakness.`});

Q({t:`fill`, k:`Study terms · Ch. 12`, q:`A quasi-experimental design with no control group and no pretest is the one-group ___ design.`,
a:[`posttest-only`,`posttest only`],
e:`The {g:one-group posttest-only design}: the weakest of them all, because there's {r:nothing to compare} the result with.`});

Q({t:`fill`, k:`Study terms · Ch. 12`, q:`An interrupted time series design with a comparison group added is called a ___ design.`,
a:[`control series`],
e:`{g:Control series design}: like the Ontario drunk-driving law compared with Manitoba and New Brunswick.`});

Q({t:`fill`, k:`Study terms · Ch. 12`, q:`Group differences caused by people being born in different eras, rather than by age itself, are called ___ effects.`,
a:[`cohort`],
e:`{g:Cohort effects} are confounded with age in a {g:cross-sectional} study. They're a special type of selection effect.`});

S(7);

Q({t:`fill`, k:`True score`, lv:`warm`, q:`Any measurement is an estimate: estimate = true score + ___.`,
a:[`measurement error`,`error`],
e:`{g:Measurement error} = anything in the score that isn't the person's actual level of the construct. We can never fully remove it; we try to minimize it.`});

Q({k:`True score`, q:`Why can no psychological measure ever be perfectly reliable?`,
c:`People aren't perfectly consistent, so some measurement error always remains`,
x:[[`Psychologists don't use numbers, so consistency can't be calculated`,`They use numbers constantly.`],
[`Every psychological measure is invalid, so its reliability doesn't really matter`,`Many measures are quite valid.`],
[`True scores change every second, so nothing can be measured twice`,`Stable traits exist; the issue is error in measuring them.`],
[`Reliability can only be judged by experts, never calculated`,`Reliability is calculated, not judged by authority.`]],
e:`Humans are {g:stochastic} (a bit random). So measures only {g:estimate} the latent construct, and the goal is to keep {g:measurement error} small.`});

Q({k:`True score`, q:`Someone's true extraversion is 7.5/10. Which of these is NOT a source of measurement error?`,
c:`Their actual level of extraversion`,
x:[[`Wavering between choosing 7 or 8`,`Rounding indecision adds error.`],
[`Accidentally flipping the scale and picking 2`,`A careless response adds error.`],
[`Rating lower after hanging out with very outgoing friends`,`Comparing to others shifts the score away from the true value.`],
[`Misreading "extroverted" as "extraordinary"`,`Misunderstanding the item adds error.`]],
e:`The person's {g:actual level} is the {g:true score}. Everything else (rounding, careless flips, comparisons, misreading, picking the middle when bored) is {r:measurement error}.`});

Q({k:`True score`, q:`A person with a true IQ of 100 has to guess on 4 items. All right: 115. All wrong: 85. Two of each: 100. What does this show?`,
c:`Guessing adds measurement error that can push scores either way`,
x:[[`The person's true IQ changes each time they take the test`,`The true score is fixed at 100.`],
[`IQ tests have no validity because guessing is allowed`,`This is about error, not validity.`],
[`Guessing always raises IQ scores above the true score`,`It can raise or lower them.`],
[`The test has perfect reliability, since the average of the scores is still 100`,`The score bounces around, so it isn't perfect.`]],
e:`Same {g:true score}, different {r:observed scores}. Error can come from a stressful day, too much or too little coffee, or lucky and unlucky guesses.`});

Q({t:`hot`, k:`Reliability vs validity`, q:`Each target shows 5 measurements of the same person. The bullseye is their true score. Click the measure that's reliable but NOT valid.`,
fig:{k:`target`}, a:`rnv`,
why:{rv:`Tight and on target: reliable and valid.`, unr:`Scattered shots aren't reliable.`, uu:`Scattered and off target: neither reliable nor valid.`},
e:`{g:Tightly clustered} = consistent = {g:reliable}. {r:Off the bullseye} = not measuring the true value = not valid. Consistency alone doesn't mean you're hitting the right target.`});

Q({t:`hot`, k:`Reliability vs validity`, q:`Click the target that shows a measure that's both reliable and valid.`,
fig:{k:`target`}, a:`rv`,
why:{rnv:`Consistent, but consistently off target.`, unr:`On average near the centre, but too scattered to be reliable.`, uu:`Scattered and off target.`},
e:`Measurement goals: (1) {g:be consistent} (reliable) and (2) {g:hit the target} (valid). Only the tight cluster on the bullseye does both.`});

Q({k:`Reliability vs validity`, q:`A bathroom scale is used as a "Fear of Heights Measuring Machine." It gives the same number every time. What's the verdict?`,
c:`Highly reliable but not valid for fear of heights`,
x:[[`Valid but not reliable`,`It's very consistent, so reliable.`],
[`Both reliable and valid, since it gives the same reading every time`,`Consistency doesn't mean it measures the right thing.`],
[`Neither reliable nor valid`,`It is reliable; it just measures weight.`],
[`Valid, since it has a name that fits`,`Naming a measure doesn't make it valid.`]],
e:`{g:Reliability} = consistency. {g:Validity} = measuring what it claims to. The scale is consistent but measures {r:weight}, not fear. Reliability is {g:necessary but not sufficient} for validity.`});

Q({t:`hot`, k:`Reliability`, q:`One person took two different tests every week for a year. Their true score is 100. Click the more reliable test.`,
fig:{k:`hist`, ty:`two`, labels:[`Test A`,`Test B`]}, a:`narrow`,
why:{wide:`Test A's scores spread from about 85 to 115: lots of measurement error.`},
e:`Both average 100, but {g:Test B} stays within about 97–103. A {g:narrower spread} means less measurement error and more consistency. You'd prefer it, especially since studies usually measure each person only once.`});

Q({t:`match`, k:`Reliability types`, q:`Match each type of reliability to how it's assessed.`,
p:[[`Test-retest`,`Give the same measure twice and correlate Time 1 with Time 2`],
[`Internal consistency`,`Check whether the items in a scale correlate with each other`],
[`Inter-rater`,`Check whether different observers agree on their ratings`],
[`Alternate forms`,`Give two versions of the test on separate occasions`]],
e:`Test-retest = consistency {g:over time}. Internal consistency = consistency {g:across items}. Inter-rater = consistency {g:across raters}. Alternate forms avoid people remembering their first answers.`});

Q({t:`sort`, k:`Reliability types`, q:`Sort each statistic or procedure under the reliability it assesses.`,
b:[`Internal consistency`,`Test-retest`,`Inter-rater`],
i:[[`Cronbach's alpha`,0],[`Split-half correlation`,0],[`Coefficient omega`,0],[`Item-total correlations`,0],[`Correlating scores taken a week apart`,1],[`Alternate forms on two occasions`,1],[`Cohen's kappa`,2]],
e:`{g:Alpha, omega, split-half, item-total} → internal consistency. {g:Time 1 vs Time 2} → test-retest. {g:Kappa} → inter-rater.`});

Q({k:`Reliability types`, lv:`warm`, q:`What's a commonly used starting benchmark for a good reliability correlation?`,
c:`About r = .80`,
x:[[`About r = .20`,`Far too low for reliability.`],
[`About r = .50`,`Usually considered too low for reliability.`],
[`Exactly r = 1.00`,`No real measure is perfectly reliable.`],
[`About r = −.80`,`A negative reliability would mean scores flip, not that they're consistent.`]],
e:`{g:r ≈ .80} is a good starting point for internal consistency and test-retest (assuming little time between tests and a stable construct). No strict cut-off exists.`});

Q({k:`Reliability types`, q:`A mood questionnaire shows low test-retest reliability over three weeks. What's the best interpretation?`,
c:`Expected: mood really changes, so test-retest isn't the right check`,
x:[[`The questionnaire must be invalid as a measure of mood`,`Low test-retest doesn't prove invalidity here.`],
[`Mood is a stable trait, so the scale must be broken`,`Mood is a state that changes.`],
[`The items don't correlate with each other on either day`,`That would be internal consistency.`],
[`The raters who score the questionnaire must disagree with each other`,`That would be inter-rater reliability.`]],
e:`Test-retest depends on {g:time between tests} and {g:how stable the construct is} (IQ vs attitudes or mood). For a changeable state, high test-retest isn't expected.`});

Q({k:`Reliability types`, q:`Raven's matrices test-retest: 2 days r = .97, 4 weeks r = .87, 79 years r = .54. What does this show?`,
c:`Test-retest reliability drops as the time between tests grows`,
x:[[`The test becomes invalid after two days and can't be trusted after that`,`Reliability stays high at 2 days and 4 weeks.`],
[`Internal consistency decreases with age`,`These are test-retest values.`],
[`Raters disagree more over time`,`Raven's is scored objectively.`],
[`Intelligence can't be measured reliably`,`.97 and .87 are excellent.`]],
e:`{g:Time between measurements} moderates test-retest reliability. Over 79 years, people genuinely change, so the correlation drops to .54.`});

Q({k:`Reliability types`, q:`Why is inter-rater reliability "not applicable" for Raven's matrices?`,
c:`Answers are scored objectively, so no human judgment is involved`,
x:[[`Because Raven's has very low internal consistency across its items`,`Its internal consistency is high.`],
[`Because it's only given once`,`It can be given repeatedly.`],
[`Because it measures something invisible`,`Many measured constructs are latent.`],
[`Because only one rater is legally allowed`,`There's no such rule.`]],
e:`Inter-rater reliability matters when {g:observers judge} behaviour (like attachment in the Strange Situation). Objective scoring has no rater judgment to disagree about.`});

Q({k:`Reliability types`, q:`Observers coding infants' attachment behaviour often disagree. Which steps would raise their reliability?`,
c:`Give concrete coding rules, discuss disagreements, and practise with feedback`,
x:[[`Add more items to the questionnaire the parents fill out`,`That raises internal consistency, not rater agreement.`],
[`Test the same infants again a week later and compare the two sets of scores`,`That checks test-retest reliability.`],
[`Use only one observer from now on, so that nobody can ever disagree on codes`,`Then you can't measure agreement at all.`],
[`Tell the observers the hypothesis so they know what to look for`,`That risks experimenter bias.`]],
e:`Inter-rater reliability (kappa) is often {r:lower than desirable}. Fix it with {g:concrete, observable guidelines}, {g:dialogue between observers}, and {g:practice with feedback}.`});

Q({k:`Reliability types`, q:`Raven's odd-numbered items correlate .93–.96 with its even-numbered items. What is this?`,
c:`Split-half reliability, a form of internal consistency`,
x:[[`Test-retest reliability across two sessions`,`Both halves come from one sitting.`],
[`Inter-rater reliability between two independent scorers`,`No raters are compared.`],
[`Convergent validity with a related measure`,`That compares different measures of a construct.`],
[`Predictive validity for future behaviour`,`That predicts future behaviour.`]],
e:`{g:Split-half}: divide the items into two halves (here odd vs even) and correlate them. If all items measure one construct, the halves should agree.`});

Q({k:`Reliability types`, q:`An IQ test includes "What artist won best album of the year?" Why might this item hurt internal consistency?`,
c:`It taps pop-culture knowledge, so it won't correlate with the other items`,
x:[[`It's too easy, which causes a floor effect across the test`,`A floor effect means too hard.`],
[`It can't be scored consistently by two different raters`,`It's easy to score.`],
[`It makes the test too long to give a second time`,`Length isn't the problem.`],
[`It improves construct validity but lowers the test's overall face validity`,`It probably hurts both.`]],
e:`Items should all measure {g:the same construct}. An item measuring something else won't correlate with the rest, lowering alpha. Item-total correlations help find and drop such items.`});

Q({k:`Reliability types`, lv:`hard`, q:`What does Cronbach's alpha depend on?`,
c:`The average inter-item correlation and the number of items`,
x:[[`The correlation between two raters' scores`,`That's inter-rater reliability.`],
[`The correlation between two testing occasions`,`That's test-retest.`],
[`How well the scores predict future behaviour of the people`,`That's predictive validity.`],
[`The sample size alone`,`Sample size isn't what alpha is built from.`]],
e:`Alpha is based on the {g:average inter-item correlation} and the {g:number of items}. More good items generally means higher reliability. Coefficient {g:omega} is a newer, superior alternative.`});

Q({k:`True score`, q:`One test labels you either introverted or extraverted; another scores extraversion from 0 to 100. Why might the first give unstable results?`,
c:`It doesn't let people express their true level, so borderline scores flip`,
x:[[`Dichotomous scores are always more valid than continuous scores for personality`,`They throw away information.`],
[`Continuous scores contain no measurement error at all`,`All scores contain error.`],
[`The two tests actually measure unrelated personality constructs`,`Both measure extraversion.`],
[`Only the 0–100 test is a self-report measure of extraversion`,`Both are self-reports.`]],
e:`If a measure can't capture the {g:nature of the true value} (a continuum), estimates seem to {r:fluctuate} even when the person is stable. A middle-ish person may land on either side.`});

Q({t:`match`, k:`Construct validity`, q:`Match each type of validity evidence to its meaning.`,
p:[[`Face validity`,`The measure looks like it measures the construct`],
[`Content validity`,`It covers all parts of the construct and nothing extra`],
[`Predictive validity`,`Scores predict a relevant behaviour in the future`],
[`Concurrent validity`,`Scores relate to a relevant behaviour or group difference now`],
[`Convergent validity`,`It correlates with other measures of the same construct`],
[`Discriminant validity`,`It doesn't correlate with unrelated constructs`]],
e:`All six build an argument for {g:construct validity}: does the measure capture the construct it's meant to? Predictive is also called {g:criterion} validity; discriminant is also called {g:divergent}.`});

Q({t:`sort`, k:`Construct validity`, q:`Psychopathy Checklist (PCL-R) evidence. Sort each finding under the validity it supports.`,
b:[`Predictive`,`Concurrent`,`Convergent`,`Discriminant`],
i:[[`Scores predicted reconviction over the next 10 years`,0],[`Scores predicted longer future sentences`,0],[`Students who plagiarized scored higher on a related scale`,1],[`High scorers kept all the money in a sharing game`,1],[`Scores correlated with antisocial personality disorder`,2],[`Scores were unrelated to schizophrenia`,3]],
e:`Future behaviour = {g:predictive}. Behaviour or group differences measured {g:now} = {g:concurrent}. Related construct = {g:convergent}. Unrelated construct = {g:discriminant}.`});

Q({k:`Construct validity`, q:`Raven's matrices correlate r = .85 with the Wechsler IQ test. This is evidence of:`,
c:`Convergent validity`,
x:[[`Discriminant validity`,`Discriminant is about NOT correlating with unrelated constructs.`],
[`Test-retest reliability`,`That compares one test at two times.`],
[`Predictive validity`,`That predicts future behaviour.`],
[`Face validity`,`That's about appearance.`]],
e:`Two operationalizations of the same construct (intelligence) {g:converge}. Raven's also predicts job performance (r = .3–.5, {g:predictive}) and doesn't relate to favourite colour (r = .05, {g:discriminant}).`});

Q({k:`Construct validity`, q:`IQ scores correlate r = .05 with favourite colour. What does this support?`,
c:`Discriminant validity`,
x:[[`Convergent validity`,`Convergent needs a strong correlation with a related measure.`],
[`Internal consistency`,`That's about items agreeing.`],
[`Concurrent validity`,`That's about relating to a relevant current criterion.`],
[`Content validity`,`That's about covering the whole construct.`]],
e:`A near-zero correlation with an {g:unrelated} construct shows the measure isn't capturing something irrelevant: {g:discriminant (divergent) validity}.`});

Q({k:`Construct validity`, q:`Why isn't face validity enough to establish construct validity?`,
c:`Looking valid isn't proof; bad tests can look fine and good ones look odd`,
x:[[`Face validity is the strongest evidence of all, so no other kind is ever needed`,`It's the weakest, most subjective form.`],
[`Face validity only applies to physiological measures`,`It applies to any measure.`],
[`Face validity is a type of reliability`,`It's a type of validity.`],
[`Face validity requires a correlation of .80`,`It's a judgment, not a correlation.`]],
e:`Magazine quizzes have face validity but tell you little. {g:REM sleep} is a valid indicator of dreaming even though it doesn't obviously look like one. Face validity is {r:subjective}; expert judges help a little.`});

Q({k:`Construct validity`, q:`A psychopathy measure includes callousness and unemotionality but no items on impulsivity or rule-breaking. Which validity is weak?`,
c:`Content validity`,
x:[[`Face validity`,`The items it has may look relevant.`],
[`Predictive validity`,`We don't know about future prediction here.`],
[`Discriminant validity`,`That's about unrelated constructs.`],
[`Inter-rater reliability`,`That's about raters, not coverage.`]],
e:`{g:Content validity} = the measure covers {g:all aspects} of the construct {g:and nothing more}. Missing impulsivity and antisocial behaviour leaves gaps.`});

Q({k:`Construct validity`, lv:`hard`, q:`A psychopathy scale validated with prison inmates is used to study undergraduates. What's the concern?`,
c:`Construct validity must be re-established for each new population or purpose`,
x:[[`Validity transfers automatically to every population once a scale is published`,`It doesn't transfer automatically.`],
[`Undergraduates can't complete self-report scales`,`They complete them all the time.`],
[`It turns the scale into a measure of reliability`,`Reliability and validity are separate properties.`],
[`Psychopathy doesn't exist outside prisons`,`It exists in everyday contexts.`]],
e:`A measure may be valid {g:in one population or context} and not another. Construct validity is built from many sources and {g:reconsidered whenever the measure is used for a new purpose}.`});

Q({k:`Construct validity`, q:`Researchers made an empathy scale for picking peer supporters. They gave it twice, three months apart, and checked whether it predicted scores on a "Reading the Mind in the Eyes" task. What did they examine?`,
c:`Test-retest reliability, and convergent or concurrent validity`,
x:[[`Inter-rater reliability, and face validity`,`No raters were compared.`],
[`Internal consistency, and discriminant validity against unrelated measures`,`Two time points means test-retest; the Eyes task is a related measure.`],
[`Split-half reliability, and content validity`,`Not what was described.`],
[`Alternate forms, and predictive validity only`,`The same scale was given twice.`]],
e:`Same measure at two time points = {g:test-retest}. Relating it to another empathy measure (the Eyes task) = {g:convergent/concurrent} validity.`});

Q({k:`Reactivity`, lv:`warm`, q:`Some people's blood pressure rises as soon as the doctor puts on the cuff. This is an example of:`,
c:`Participant reactivity`,
x:[[`Inter-rater reliability`,`That's about observers agreeing.`],
[`A floor effect`,`That's about a test being too hard.`],
[`Regression toward the mean`,`That's about extreme scores drifting.`],
[`Discriminant validity`,`That's about unrelated constructs.`]],
e:`{g:Reactivity}: the act of measuring {g:changes} what's measured. Then you learn how people act when watched, not how they really are.`});

Q({k:`Reactivity`, q:`How does participant reactivity relate to validity?`,
c:`If awareness of the measure changes the construct, the measure can't be valid`,
x:[[`Reactive measures are always more reliable than non-reactive ones`,`Reactivity isn't about consistency.`],
[`Reactivity only affects physiological measures like blood pressure readings`,`It affects self-reports and observations too.`],
[`Reactive measures tend to have the strongest face validity of any measure`,`Face validity is unrelated.`],
[`Reactivity is a type of convergent validity evidence`,`It's a threat to validity, not a type.`]],
e:`If people change because they {g:know} they're being measured, the score no longer reflects the {g:real} construct. Reactivity undermines validity.`});

Q({k:`Reactivity`, q:`To measure which gallery paintings are most popular without asking anyone, a researcher checks how often floor tiles in front of each one are replaced. This is:`,
c:`An unobtrusive (non-reactive) measure`,
x:[[`A self-report measure`,`Nobody is asked anything.`],
[`A staged manipulation of art preferences`,`Nothing is manipulated.`],
[`A test-retest procedure`,`It's not repeated testing of people.`],
[`A manipulation check`,`No IV is being checked.`]],
e:`{g:Unobtrusive measures} record behaviour indirectly so people don't react. Others: accuracy of bank clocks and post office speed as measures of a city's {g:pace of life}. They still need to be valid.`});

Q({t:`pick`, k:`Reactivity`, q:`Select every way to reduce participant reactivity.`,
i:[[`Let people get used to the observer or camera first`,1],[`Use unobtrusive measures people don't notice`,1],[`Observe from a concealed position, when ethical`,1],[`Tell participants exactly which behaviour you're coding`,0,`That invites people to change that behaviour.`],[`Stand right next to them and take visible notes`,0,`That increases reactivity.`]],
e:`Reduce reactivity by {g:habituation}, {g:unobtrusive measures} and {g:concealed observation} (within ethical limits). It's the same family of problems as demand characteristics.`});

Q({tr:1, k:`Measurement problems`, lv:`hard`, q:`200 people complete a Big Five inventory and self-report how many days a week they use heroin. The average is .002 days, and heroin use correlates with nothing. What's the primary limitation?`,
c:`Reported use barely varies (a floor effect), so nothing can correlate with it`,
x:[[`The Big Five inventory has poor face validity`,`It's a well-validated measure.`],
[`200 people is far too many for a correlation`,`Larger samples help correlations.`],
[`Heroin use is a ratio variable, which can't be correlated`,`Ratio variables are ideal for correlations.`],
[`The study should have used random assignment to levels of heroin use instead`,`That would be wildly unethical.`]],
e:`With almost everyone at {g:zero}, there's {g:no variability} for personality to relate to. It's likely a mix of a sample with very few users and a {r:reactive} self-report (people won't admit heroin use). Null results here say little.`});

Q({t:`match`, k:`Scales`, q:`Match each scale of measurement to its defining feature.`,
p:[[`Nominal`,`Categories with no order or numeric meaning`],
[`Ordinal`,`Rank order, but gaps between ranks aren't equal or known`],
[`Interval`,`Equal gaps between values, but no true zero`],
[`Ratio`,`Equal gaps and a true zero, so "twice as much" makes sense`]],
e:`Each step adds a property: categories → {g:order} → {g:equal intervals} → {g:true zero}.`});

Q({t:`sort`, k:`Scales`, q:`Sort each variable by its scale of measurement (set 1).`,
b:[`Nominal`,`Ordinal`,`Interval`,`Ratio`],
i:[[`Wall colours in two offices`,0],[`Brand ranked third in a consumer magazine`,1],[`Today's temperatures in °C across 8 cities`,2],[`Birthweights of babies born last week`,3],[`Gold, silver and bronze medals`,1],[`An intelligence test score`,2],[`Reaction time in milliseconds`,3]],
e:`Colours = {g:nominal}. Rankings and medals = {g:ordinal}. °C and IQ = {g:interval} (no true zero). Weight and time = {g:ratio}.`});

Q({t:`sort`, k:`Scales`, q:`Sort each variable by its scale of measurement (set 2).`,
b:[`Nominal`,`Ordinal`,`Interval`,`Ratio`],
i:[[`Type of programming on each radio station`,0],[`Ethnic group categories in a neighbourhood`,0],[`Canadiens ranked #1, Flames #2 in a poll`,1],[`Birth order: first-born, second-born...`,1],[`Hours you studied each day this week`,3],[`Number of votes each candidate received`,3],[`Amount tipped after each meal`,3]],
e:`Counts, amounts of money and time all have a {g:true zero} → {g:ratio}. Poll rankings and birth order → {g:ordinal}. Category labels → {g:nominal}.`});

Q({t:`hot`, k:`Scales`, q:`Click the lowest scale on which you can say one score is "twice as much" as another.`,
fig:{k:`scales`}, a:`rat`,
why:{int:`Interval has equal gaps but no true zero, so ratios don't work (20 °C isn't twice 10 °C).`, ord:`Ordinal only tells you order.`, nom:`Nominal categories have no amounts.`},
e:`Only {g:ratio} scales have a {g:true zero} (zero = none of the variable), so ratios like "twice as fast" make sense.`});

Q({k:`Scales`, q:`Why isn't 20 °C twice as warm as 10 °C?`,
c:`Celsius has no true zero, so ratios don't work`,
x:[[`Celsius is an ordinal scale`,`It has equal intervals, so it's interval.`],
[`The intervals between degrees aren't equal`,`They are equal.`],
[`Temperature is a nominal variable`,`It has real numeric meaning.`],
[`Only Fahrenheit allows ratios`,`Fahrenheit has no true zero either.`]],
e:`0 °C isn't "no temperature." In Fahrenheit the same values are {r:68 °F vs 50 °F}, clearly not double. {g:Kelvin} has a true zero, so it's ratio.`});

Q({k:`Scales`, lv:`hard`, q:`A 1–7 agreement scale is technically which scale, and how is it usually treated?`,
c:`Ordinal, but it behaves like interval when averaged over many responses`,
x:[[`Ratio, since the scale starts at 1 and counts upward evenly`,`Starting at 1 isn't a true zero.`],
[`Nominal, since each point on the scale has a word label`,`Labels don't remove the order.`],
[`Interval with a true zero located at the scale's midpoint`,`A midpoint isn't a true zero.`],
[`Ratio, since a rating of 6 is twice as much as a rating of 3`,`You can't say someone is twice as extraverted.`]],
e:`Rating scales are {g:ordinal} in nature but {g:behave like interval} when averaged. You still can't say a 6 is "twice as extraverted" as a 3: there's no true zero.`});

Q({k:`Scales`, q:`Why does it matter which scale of measurement a variable uses?`,
c:`It decides which statistics fit and what conclusions you can draw`,
x:[[`It decides whether the study needs approval from an ethics board`,`All human research needs ethics approval.`],
[`It decides whether the study is an experiment`,`Scale type doesn't decide the design.`],
[`It decides whether participants are randomly assigned`,`That's a design choice.`],
[`It only matters for physiological measures`,`It matters for every measure.`]],
e:`The scale determines the {g:statistics} you can use and the {g:conclusions} you can draw. "Attractive / not attractive" (nominal) can't tell you {r:how} attractive; a rating scale can.`});

Q({t:`fill`, k:`Reliability`, lv:`warm`, q:`The consistency or stability of a measure is called its ___.`,
a:[`reliability`],
e:`{g:Reliability} = consistency. A reliable measure gives about the same result each time it measures the same (stable) thing.`});

Q({t:`fill`, k:`Construct validity`, q:`When a measure does NOT correlate with measures of unrelated constructs, it shows ___ validity.`,
a:[`discriminant`,`divergent`],
e:`{g:Discriminant} (or {g:divergent}) validity: the measure discriminates its construct from unrelated ones. The psychopathy checklist's weak link with schizophrenia showed it wasn't just measuring "mental illness" in general.`});

Q({k:`Reliability`, q:`The Pearson correlation coefficient (r) ranges from:`,
c:`−1.00 to +1.00`,
x:[[`0 to 100`,`That's a percentage, not r.`],
[`0 to +1.00 only`,`r can be negative.`],
[`−10 to +10`,`r never goes beyond ±1.`],
[`1 to 7`,`That's a rating scale.`]],
e:`{g:r} runs from {g:−1 to +1}. Closer to ±1 = stronger; 0 = no linear relationship. As reliability coefficients, they're usually positive.`});

Q({k:`Reliability`, q:`Why do researchers usually prefer existing, published measures over making their own?`,
c:`They have reliability and validity evidence and allow comparison with past work`,
x:[[`New measures are against research ethics rules at most universities in Canada`,`You can create new measures.`],
[`Published measures have no measurement error once they're printed`,`All measures have some error.`],
[`Existing measures never need to be validated again for new uses`,`Validity must be reconsidered for new uses.`],
[`Only published measures can be given as self-report questionnaires`,`New measures can be self-reports too.`]],
e:`Existing measures should have {g:reliability and validity data}, save a lot of work, and let you {g:compare} with prior research. Find them in sources like the Mental Measurements Yearbook or PsycINFO.`});

Q({t:`cloze`, k:`Reliability vs validity`, q:`Build the explanation comparing reliability and validity.`,
txt:`Reliability asks whether a measure is [[consistent]]; validity asks whether it measures what it's [[supposed]] to. A bathroom scale used to measure fear of heights is [[reliable]] but not [[valid]]. That's why reliability is necessary but not [[sufficient]] for validity.`,
d:[`accurate`,`random`,`construct`],
e:`Picture the targets: consistent shots (reliable) can still miss the bullseye (not valid).`});

Q({t:`pick`, k:`Construct validity`, q:`You're building a case for a new anxiety scale's construct validity. Select every piece of evidence that counts as VALIDITY evidence.`,
i:[[`It correlates strongly with an established anxiety scale`,1],
[`It doesn't correlate with a vocabulary test`,1],
[`Scores predict who seeks anxiety treatment next year`,1],
[`People diagnosed with anxiety score higher than people without`,1],
[`It gives nearly the same score when retaken a week later`,0,`That's test-retest reliability.`],
[`Its items have a high Cronbach's alpha`,0,`That's internal consistency, a type of reliability.`]],
e:`Convergent, discriminant, predictive and concurrent evidence build {g:construct validity}. Consistency evidence (test-retest, alpha) is {r:reliability}, a separate property.`});

Q({k:`Reliability vs validity`, lv:`hard`, q:`A new intelligence test has excellent Cronbach's alpha but correlates only .05 with established IQ tests. What's the best conclusion?`,
c:`It's internally consistent but has poor convergent validity`,
x:[[`It's a valid IQ test, because high alpha shows it measures intelligence`,`High alpha shows consistency, not that it measures intelligence.`],
[`It has poor reliability and good validity`,`Its reliability is good.`],
[`It has strong discriminant validity, so it's fine`,`It should correlate with other IQ tests; failing to is a problem.`],
[`It needs a higher inter-rater reliability`,`Raters aren't involved.`]],
e:`The items agree with each other ({g:reliable}), but the test doesn't {r:converge} with other measures of intelligence. It's consistently measuring {r:something else}.`});

/* Study Terms (every term from each chapter's list) and Review Questions (every chapter's list),
   placed in the section that covers that chapter. */

/* =========================== CH. 1 → SECTION 1 =========================== */
S(1);
Q({t:`match`, k:`Study terms · Ch. 1`, q:`Drag each term to its definition.`,
p:[[`Empiricism`,`Answering questions through systematic observation and data`],
[`Scientific skepticism`,`Not accepting a claim until it's backed by good evidence`],
[`Authority`,`Believing something because an expert or trusted source said so`],
[`Intuition`,`Believing something because it feels right from personal experience`],
[`Pseudoscience`,`Claims dressed up as science but not based on sound evidence or methods`],
[`Peer review`,`Other experts evaluate a study before it can be published`]],
e:`Science swaps {r:authority} and {r:intuition} for {g:empiricism} and {g:skepticism}. {g:Peer review} is skepticism built into the system.`});

Q({t:`match`, k:`Study terms · Ch. 1`, q:`Drag each term to its definition.`,
p:[[`Falsifiable`,`An idea that evidence could prove wrong`],
[`Empirical question`,`A question that can be answered by observing and measuring`],
[`Replicate`,`Repeat a study to see whether the finding holds up`],
[`Goals of scientific research`,`Describe, predict, determine causes of, and explain behaviour`],
[`Program evaluation`,`Research on whether programs meant to help people actually work`]],
e:`A good scientific claim is {g:falsifiable} and asks an {g:empirical question}; good findings {g:replicate}.`});

Q({t:`match`, k:`Study terms · Ch. 1`, q:`Drag each term to its definition.`,
p:[[`Temporal precedence`,`The cause has to come before the effect`],
[`Covariation of cause and effect`,`When the cause is present the effect shows up; when it's absent, it doesn't`],
[`Ruling out alternative explanations`,`No other variable could account for the relationship`],
[`Basic research`,`Research that answers fundamental questions about behaviour`],
[`Applied research`,`Research that tackles a practical problem in the real world`]],
e:`The first three are the {g:three criteria for a causal claim}. Basic vs applied is about the research {g:goal}, not its quality.`});

Q({t:`pick`, k:`Why research methods matter`, rq:`1.1`, q:`What are some benefits of learning about research methods? Select all that apply.`,
i:[[`Judging claims in news stories and online`,1],
[`Careers that rely on evidence-based practice, like clinical work`,1],
[`Being an informed citizen when policies are debated`,1],
[`Evaluating whether programs actually work`,1],
[`Understanding research used in legal settings`,1],
[`Guaranteeing your intuitions about people are correct`,0,`Methods help you test intuitions, not confirm them.`],
[`Skipping peer review because you can judge studies yourself`,0,`Peer review still matters.`]],
e:`Research literacy helps in {g:everyday life}, {g:careers}, {g:citizenship}, {g:law} and {g:program evaluation}.`});

Q({t:`cloze`, k:`Ways of knowing`, rq:`1.2`, q:`Why is scientific skepticism useful, and how does science differ from other ways of knowing? Build the explanation.`,
txt:`Instead of accepting ideas from [[intuition]] or [[authority]], the scientific approach relies on [[empiricism]]: answering questions with systematic observation. Scientific [[skepticism]] means a claim isn't accepted until it's backed by evidence, which helps us catch our own biases. It's built into science through [[peer review]].`,
d:[`pseudoscience`,`parsimony`,`anecdotes`],
e:`Skepticism is a {g:bias-catcher}. Intuition and authority feel convincing but can be wrong; evidence that others can check is how science corrects itself.`});

Q({t:`match`, k:`Four goals`, rq:`1.3`, q:`Match each goal of scientific research to an example.`,
p:[[`Description`,`Reporting how often teens text while driving`],
[`Prediction`,`Using high school grades to forecast first-year GPA`],
[`Determining causes`,`An experiment shows sleep loss causes more memory errors`],
[`Explanation`,`A theory of why sleep loss hurts memory, like poorer consolidation`]],
e:`Describe {g:what} happens → predict {g:when} → find {g:causes} → {g:explain why}. Explanation is the deepest goal.`});

Q({t:`sort`, k:`Types of research`, rq:`1.4`, q:`Sort each study as basic or applied research.`,
b:[`Basic research`,`Applied research`],
i:[[`How does working memory capacity limit attention?`,0],[`Does a new app reduce texting while driving?`,1],[`What brain processes underlie face recognition?`,0],[`Does a school breakfast program raise test scores?`,1],[`How do people form first impressions?`,0],[`Which hospital sign design reduces wrong turns?`,1]],
e:`{g:Basic} = understanding fundamentals. {g:Applied} = solving a practical problem. Program evaluation is a kind of applied research.`});

Q({k:`Types of research`, rq:`1.4`, q:`What's the difference between quantitative and qualitative research?`,
c:`Quantitative uses numbers and statistics; qualitative uses people's own words and themes`,
x:[[`Quantitative studies are always experiments, while qualitative studies are always surveys`,`Either can use many methods.`],
[`Quantitative research is basic science, while qualitative research is always applied`,`That's a different dimension.`],
[`Quantitative research is run in labs, while qualitative research always happens in the field`,`Setting isn't the difference.`],
[`Quantitative data is objective and true, while qualitative data is just opinion`,`Both are legitimate kinds of data.`]],
e:`{g:Quantitative} = numerical data and statistics. {g:Qualitative} = rich descriptions, interviews and themes in participants' own words.`});

/* =========================== CH. 2 & 5 → SECTION 2 =========================== */
S(2);
Q({t:`match`, k:`Study terms · Ch. 2`, rq:`2.3`, q:`Drag each section of a research article to what it contains.`,
p:[[`Abstract`,`A brief summary of the whole study, at the very beginning`],
[`Introduction`,`The problem being investigated, past research and the hypotheses`],
[`Method`,`Exactly how the study was done, in enough detail to replicate it`],
[`Results`,`The findings, usually from statistical analysis`],
[`Discussion`,`What the results mean: hypotheses, limitations, future research`]],
e:`Think of an hourglass: broad {g:introduction} → narrow {g:method} and {g:results} → broad {g:discussion}, with the {g:abstract} on top.`});

Q({t:`match`, k:`Study terms · Ch. 2`, q:`Drag each term to its definition.`,
p:[[`References`,`A list of all sources cited, with everything needed to find them`],
[`Citations`,`Names and dates in the text that credit another publication's ideas`],
[`Literature review`,`A words-only (narrative) summary of past research on a topic`],
[`PsycINFO`,`The American Psychological Association's database of psychology research`],
[`Web of Science`,`A database that lets you find later articles that cited a given article`]],
e:`{g:Citations} in the text point to full entries in the {g:References}. A literature review summarizes in words; a {g:meta-analysis} uses statistics.`});

Q({t:`match`, k:`Study terms · Ch. 2`, q:`Drag each term to its definition.`,
p:[[`Theory`,`A framework that organizes past observations and guides new research`],
[`Parsimony`,`Preferring the simpler explanation with fewer assumptions`],
[`Research hypothesis`,`A general statement about how concepts are related`],
[`Prediction`,`A specific expected outcome, tied to one study's methods`],
[`Generalization`,`Whether a sample's finding tells us about the wider population, and which ones`]],
e:`Theory → {g:hypothesis} (general, conceptual) → {g:prediction} (specific, operational). {g:Parsimony} is the "simpler is better" rule for theories.`});

Q({t:`match`, k:`Research ideas`, rq:`2.1`, q:`Match each source of research ideas to an example.`,
p:[[`Questioning common assumptions`,`Do opposites really attract?`],
[`Observation of the world`,`Noticing people seem to walk faster in big cities`],
[`Practical problems`,`How can a hospital cut patients' wait-time stress?`],
[`Theories`,`A theory predicts something new, so you test it`],
[`Past research`,`Following up on a limitation noted in a published study`]],
e:`Five sources: {g:common assumptions}, {g:observation}, {g:practical problems}, {g:theories} and {g:past research}.`});

Q({k:`Theories`, rq:`2.2`, q:`What are the two major functions of a theory?`,
c:`Organize and explain past observations, and generate new predictions to test`,
x:[[`Prove a hypothesis correct and close off any future research on the topic`,`Science supports ideas; it doesn't prove them for good.`],
[`Describe one specific finding and give an exact number for the effect size`,`Theories are broader frameworks.`],
[`Replace the need for any data and settle debates through logical argument`,`Theories must be tested with data.`],
[`List every variable in a study and define how each one will be measured`,`That's operationalization.`]],
e:`A theory is like a map: it {g:organizes what we already know} and {g:points to where to look next} (new hypotheses and predictions).`});

Q({t:`match`, k:`Finding past research`, rq:`2.4`, q:`Match each search tool to its pros and cons.`,
p:[[`PsycINFO`,`Psychology-focused and precise; search by keyword, author or subject`],
[`Web of Science`,`Lets you trace which later articles cited a key article`],
[`Google Scholar`,`Free and broad, but mixes in non-peer-reviewed sources`],
[`Wikipedia`,`Handy starting point for terms, but not a scholarly source to cite`]],
e:`Use {g:PsycINFO} for focused psych searches, {g:Web of Science} to move forward in time through citations, and treat {r:Google Scholar} and {r:Wikipedia} with more caution.`});

Q({t:`cloze`, k:`Hypotheses & predictions`, rq:`2.5`, q:`What is a research hypothesis, how does it differ from a prediction, and how does it relate to theory? Build the explanation.`,
txt:`A [[theory]] organizes past findings and suggests a [[hypothesis]]: a general statement about how concepts are related, like "crowding hurts thinking." A study then turns it into a specific [[prediction]] tied to its methods, like "people in the uncrowded room will recall more words." If the results match, the hypothesis is [[supported]], not proven.`,
d:[`proven`,`parsimony`,`citation`],
e:`Hypothesis = {g:general and conceptual}. Prediction = {g:specific and operational}, often in future tense. Results can only {g:support} a hypothesis.`});

Q({t:`match`, k:`Study terms · Ch. 5`, q:`Drag each term to its definition.`,
p:[[`Variable`,`Any event, situation, behaviour or characteristic that varies`],
[`Operationalization`,`The specific way a variable is measured or manipulated in a study`],
[`Situational variable`,`A feature of the situation or environment, like room temperature`],
[`Response variable`,`A person's response or behaviour, like reaction time`],
[`Participant variable`,`A characteristic of the individual, like age or personality`]],
e:`Variables come in kinds: {g:situational}, {g:response} and {g:participant}. Each one needs an {g:operationalization} before you can study it.`});

Q({t:`match`, k:`Study terms · Ch. 5`, rq:`5.4`, q:`Drag each term to its definition.`,
p:[[`Positive linear relationship`,`Higher values of one variable go with higher values of the other`],
[`Negative linear relationship`,`Higher values of one variable go with lower values of the other`],
[`Curvilinear relationship`,`The direction of the relationship changes partway, like an inverted U`],
[`Mediating variable`,`Explains the process by which one variable affects another`],
[`Third-variable problem`,`An unmeasured variable could be causing both variables to relate`]],
e:`Picture the lines: {g:positive} goes up, {g:negative} goes down, {g:curvilinear} bends. A {g:mediator} sits {g:between} two variables; a {r:third variable} sits {r:behind} both.`});

Q({t:`match`, k:`Study terms · Ch. 5`, rq:`5.6`, q:`Drag each term to its definition.`,
p:[[`Experimental method`,`Manipulate one variable, measure another, and control everything else`],
[`Non-experimental method`,`Variables are observed or measured as they naturally occur`],
[`Independent variable`,`The variable that's manipulated: the presumed cause`],
[`Dependent variable`,`The variable that's measured: the presumed effect`],
[`Field experiment`,`An experiment run in a natural, real-world setting`]],
e:`IV = what you {g:change}; DV = what you {g:measure}. A {g:field experiment} keeps the manipulation but moves out of the lab.`});

Q({t:`match`, k:`Study terms · Ch. 5`, q:`Drag each term to its definition.`,
p:[[`Experimental control`,`Keeping all extraneous variables constant across conditions`],
[`Random assignment`,`Every participant has an equal chance of landing in each condition`],
[`Confounding variables`,`Uncontrolled variables that vary with the IV, offering other explanations`],
[`Internal validity`,`Confidence that the IV, not something else, caused the DV change`]],
e:`{g:Control} + {g:random assignment} → no {r:confounds} → high {g:internal validity}.`});

Q({t:`sort`, k:`Experimental vs non-experimental`, rq:`5.1`, q:`What are the major differences between the two methods? Sort each feature.`,
b:[`Experimental method`,`Non-experimental method`],
i:[[`A variable is manipulated by the researcher`,0],[`Extraneous variables are held constant`,0],[`Participants are randomly assigned`,0],[`Variables are measured as they naturally occur`,1],[`The direction of cause can be ambiguous`,1],[`Third variables can't be ruled out`,1]],
e:`Experiments {g:manipulate and control}, which supports causal claims. Non-experiments {g:observe}, so {r:direction} and {r:third variables} stay open questions.`});

Q({t:`pick`, k:`Operationalization`, rq:`5.2`, q:`Which of these are operationalizations of the variable "stress"? Select all that apply.`,
i:[[`Cortisol level in a saliva sample`,1],[`Score on a perceived stress questionnaire`,1],[`Number of daily hassles reported this week`,1],[`Heart rate during a timed math task`,1],[`Feeling under a lot of pressure`,0,`That's the conceptual idea, not a specific measure.`],[`Being a stressed-out person in general`,0,`Still conceptual; it doesn't say how you'd measure it.`]],
e:`An {g:operationalization} says exactly {g:how} you'll measure or manipulate the concept. One concept can have many operationalizations.`});

Q({k:`Confounds`, rq:`5.3`, q:`To study crowding, a researcher puts people in a room with either 2 or 10 people. How does this operationalization create a confound, and how could you fix it?`,
c:`Crowding is tangled with group size; keep 10 people and vary how close they sit`,
x:[[`There's no confound, since group size is just how crowding is defined in this study`,`Number of people (and distraction) is an extra variable that varies with the IV.`],
[`Room temperature is confounded; fix it by testing everyone in the same building`,`Temperature isn't described as varying.`],
[`The DV is confounded; fix it by giving everyone two different memory tests`,`The problem is in how the IV was operationalized.`],
[`Age is confounded; fix it by only testing people of the same age in each room`,`Random assignment handles participant age.`]],
e:`A poor {g:operationalization} can bring a {r:confound} along with it. Hold the number of people constant (10 in every room) and vary {g:seating density} instead.`});

Q({t:`pick`, k:`Interpreting correlations`, rq:`5.5`, q:`Students who sit at the front of class tend to get higher grades. Which cause-and-effect explanations are possible from this non-experimental result? Select all that apply.`,
i:[[`Sitting at the front causes better grades (e.g., less distraction)`,1],[`Doing well in school causes students to choose front seats`,1],[`A third variable like motivation causes both front seats and good grades`,1],[`Front seats must cause higher grades, since the correlation is positive`,0,`Correlation alone can't tell you the direction.`]],
e:`Correlations leave {r:direction of cause} and {r:third variables} open. That's why "correlation isn't causation."`});

Q({t:`sort`, k:`IVs and DVs`, rq:`5.6`, q:`Sort each variable from these three experiments as the IV or the DV.`,
b:[`Independent variable`,`Dependent variable`],
i:[[`Watching a cartoon alone or with others`,0],[`How funny the cartoon was rated`,1],[`Studying in silence or with the TV on`,0],[`Score on a comprehension test`,1],[`Teachers told the parents finished university or not`,0],[`Teachers' rating of the child's academic potential`,1]],
e:`IV = the {g:condition the researcher sets up}. DV = the {g:outcome measured} afterward.`});

Q({t:`cloze`, k:`Causal claims`, rq:`5.7`, q:`How do experimental control and random assignment influence causal claims? Build the explanation.`,
txt:`[[Experimental control]] keeps extraneous variables constant, so they can't change along with the IV. [[Random assignment]] spreads participants' differences evenly across conditions. Together they rule out [[confounding]] variables, which is what allows a [[causal]] claim.`,
d:[`Random sampling`,`correlational`,`external`],
e:`Control handles the {g:situation}; random assignment handles the {g:people}. Rule out the alternatives and the IV is the best remaining explanation.`});

Q({t:`match`, k:`Causal claims`, rq:`5.8`, q:`How does an experiment achieve each criterion for inferring causation?`,
p:[[`Temporal precedence`,`The IV is manipulated before the DV is measured`],
[`Covariation of cause and effect`,`The DV differs between the conditions`],
[`Ruling out alternative explanations`,`Experimental control and random assignment`]],
e:`Experiments can meet {g:all three}. Non-experimental methods usually show only {g:covariation}; time order and alternatives often stay unclear.`});

Q({k:`Causal claims`, rq:`5.8`, q:`Which criterion for inferring causation can non-experimental methods usually achieve?`,
c:`Covariation of cause and effect`,
x:[[`Ruling out every alternative explanation`,`Third variables usually remain.`],
[`Temporal precedence, in every single study`,`Time order is often unclear in non-experiments.`],
[`All three, as long as the sample is large`,`Sample size doesn't fix design limits.`],
[`None of them, under any circumstances`,`They do show covariation.`]],
e:`A correlation {g:is} covariation. But without manipulation, time order and {r:third variables} limit causal claims.`});

Q({t:`sort`, k:`Experimental vs non-experimental`, rq:`5.9`, q:`Sort each point as an advantage of the experimental method or of the non-experimental method.`,
b:[`Advantage of experiments`,`Advantage of non-experiments`],
i:[[`Supports cause-and-effect conclusions`,0],[`High internal validity through control`,0],[`Can study variables that can't be manipulated, like age`,1],[`Avoids manipulations that would be unethical`,1],[`Can study behaviour in natural settings`,1]],
e:`Each method covers the other's blind spots, which is why researchers use {g:multiple methods}.`});

/* =========================== CH. 10 & 11 → SECTION 3 =========================== */
S(3);
Q({t:`match`, k:`Study terms · Ch. 10`, q:`Drag each design to its definition.`,
p:[[`Between-subjects design`,`Each participant experiences only one condition`],
[`Within-subjects design`,`Each participant experiences every condition`],
[`Matched pairs design`,`Pair people with similar scores, then randomly split each pair`],
[`Posttest-only design`,`Participants are measured once, after the manipulation`],
[`Pretest-posttest design`,`Participants are measured before and after the manipulation`]],
e:`Between vs within is about {g:who gets which condition}; posttest-only vs pretest-posttest is about {g:when you measure}.`});

Q({t:`match`, k:`Study terms · Ch. 10`, q:`Drag each order effect to its definition.`,
p:[[`Order effect`,`The order of conditions affects the DV in a within-subjects design`],
[`Practice effect`,`Performance improves over the study just from experience with the task`],
[`Fatigue effect`,`Performance worsens over the study from tiredness or boredom`],
[`Contrast effect`,`An earlier condition changes how people respond to a later one`]],
e:`Practice and fatigue are {g:time-related}; contrast is a {g:carryover} (theft seems milder right after reading about murder).`});

Q({t:`match`, k:`Study terms · Ch. 10`, q:`Drag each term to its definition.`,
p:[[`Counterbalancing`,`Using all possible orders, or a random order for each person`],
[`Latin square design`,`A limited set of orders where each condition appears once in each position`],
[`Selection differences`,`Pre-existing group differences that are confounded with the IV`],
[`Selective attrition`,`Dropout that happens more in one condition, so the groups end up different`]],
e:`{g:Counterbalancing} and the {g:Latin square} handle order effects. {r:Selection differences} and {r:selective attrition} are what random assignment and pretests guard against.`});

Q({k:`Confounds`, rq:`10.1`, q:`What is a confounding variable?`,
c:`An uncontrolled variable that changes along with the IV, offering another explanation`,
x:[[`The variable the researcher deliberately manipulates to see what happens`,`That's the independent variable.`],
[`A second dependent variable that's measured alongside the main one`,`Extra DVs aren't confounds.`],
[`Any variable that's measured on a nominal or ordinal scale`,`Scale type has nothing to do with it.`],
[`A participant who drops out before the study is finished`,`That's attrition.`]],
e:`A confound is an {r:"accidental IV"}: it varies with the real IV, so you can't tell which one caused the change in the DV.`});

Q({t:`cloze`, k:`Internal validity`, rq:`10.2`, q:`What is internal validity, and how does a researcher achieve it? Build the explanation.`,
txt:`Internal validity is confidence that only the [[independent variable]] could have caused the results. Researchers achieve it by designing the study so that [[confounds]] are controlled or eliminated: using [[random assignment]] (or within-subjects designs) so groups are equivalent, and keeping everything else [[constant]].`,
d:[`dependent variable`,`random sampling`,`generalizable`],
e:`High internal validity = {g:no competing explanations}. Any threat to it is an {r:alternative explanation} you didn't rule out.`});

Q({t:`match`, k:`Basic designs`, rq:`10.3`, q:`How does each design make sure the conditions differ only in the IV?`,
p:[[`Between-subjects`,`Random assignment spreads participant differences evenly across groups`],
[`Matched pairs`,`People are matched on a key variable, then randomly split between conditions`],
[`Within-subjects`,`The same people are in every condition, so they're identical by design`]],
e:`All three fight {r:selection differences}. Within-subjects removes them completely, but adds {r:order effects} to manage.`});

Q({t:`sort`, k:`Pretests`, rq:`10.4`, q:`Adding a pretest to a between-subjects design: sort each point as an advantage or a disadvantage.`,
b:[`Advantage of a pretest`,`Disadvantage of a pretest`],
