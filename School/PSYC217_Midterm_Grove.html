<title>Midterm Grove</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233B7A4E'/%3E%3Crect x='29.5' y='33' width='5' height='19' rx='2.5' fill='%23E9F3E6'/%3E%3Ccircle cx='32' cy='25' r='14' fill='%23E9F3E6'/%3E%3Ccircle cx='22.5' cy='33' r='8' fill='%23E9F3E6'/%3E%3Ccircle cx='41.5' cy='33' r='8' fill='%23E9F3E6'/%3E%3C/svg%3E">

<style>
/* Layout: one calm column, like a field notebook; cards sit on a sage ground, trees mark progress. */
:root {
  --bg: #EBF1E7; --paper: #F7FAF4; --surface: #FFFFFF; --ink: #1E2C23; --ink2: #44574B; --muted: #6E8174;
  --line: #D2DDCD; --line-strong: #A9BBA7; --track: #DCE6D8; --tint: #E3EEE0; --hl: #4A7A5726;
  --moss: #46775A; --moss-strong: #2F5A3E; --on-moss: #F5FAF2;
  --leaf: #2C7F4B; --leaf-bg: #D9EEDD; --leaf-ink: #1D5E36;
  --clay: #B3473E; --clay-bg: #F6DFDA; --clay-ink: #8E2F28;
  --amber: #C88838; --sap: #94C28F; --tree: #3A7A4D; --seed: #C1AF8C; --bark: #8C7457; --fog: #CFD8CC;
  --f-body: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-hand: 'Coming Soon', 'Comic Sans MS', 'Chalkboard SE', cursive;
  --r: 18px;
  --sky1: #F5F2E2; --sky2: #EDF2E7; --sun: #F7E1A6; --sun-glow: rgba(247, 215, 140, .36); --moon: 0;
  --hill-far: #DFE9D9; --tree-far: #D1DFCA; --hill-near: #D6E4CF; --tree-near: #C3D7BA; --star-op: 0;
  --cloud: rgba(255, 255, 255, .8); --cloud-op: 1; --bar: rgba(235, 241, 231, .86); --glow: rgba(44, 127, 75, .30); --shine: rgba(255, 255, 255, .7);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1511; --paper: #141E18; --surface: #19251E; --ink: #E0EBE2; --ink2: #B1C2B6; --muted: #7F9387;
  --line: #26352C; --line-strong: #3E5245; --track: #213027; --tint: #1D2C23; --hl: #86BE9430;
  --moss: #86BE94; --moss-strong: #A8D6B3; --on-moss: #0E1511;
  --leaf: #7BCB95; --leaf-bg: #183123; --leaf-ink: #A6E2B8;
  --clay: #EC8B7F; --clay-bg: #3B201C; --clay-ink: #F6B3AA;
  --amber: #DDA664; --sap: #6E9F73; --tree: #74C28B; --seed: #8D7F64; --bark: #8A7558; --fog: #33443A;
  --sky1: #08100C; --sky2: #0C1510; --sun: #DCE7DD; --sun-glow: rgba(170, 210, 185, .12); --moon: 1;
  --hill-far: #111C16; --tree-far: #15231B; --hill-near: #14201A; --tree-near: #1A2B21; --star-op: .8;
  --cloud: rgba(170, 200, 180, .06); --cloud-op: .6; --bar: rgba(14, 21, 17, .86); --glow: rgba(123, 203, 149, .28); --shine: rgba(255, 255, 255, .10);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1511; --paper: #141E18; --surface: #19251E; --ink: #E0EBE2; --ink2: #B1C2B6; --muted: #7F9387;
  --line: #26352C; --line-strong: #3E5245; --track: #213027; --tint: #1D2C23; --hl: #86BE9430;
  --moss: #86BE94; --moss-strong: #A8D6B3; --on-moss: #0E1511;
  --leaf: #7BCB95; --leaf-bg: #183123; --leaf-ink: #A6E2B8;
  --clay: #EC8B7F; --clay-bg: #3B201C; --clay-ink: #F6B3AA;
  --amber: #DDA664; --sap: #6E9F73; --tree: #74C28B; --seed: #8D7F64; --bark: #8A7558; --fog: #33443A;
  --sky1: #08100C; --sky2: #0C1510; --sun: #DCE7DD; --sun-glow: rgba(170, 210, 185, .12); --moon: 1;
  --hill-far: #111C16; --tree-far: #15231B; --hill-near: #14201A; --tree-near: #1A2B21; --star-op: .8;
  --cloud: rgba(170, 200, 180, .06); --cloud-op: .6; --bar: rgba(14, 21, 17, .86); --glow: rgba(123, 203, 149, .28); --shine: rgba(255, 255, 255, .10);
  color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 56px; display: flex; flex-direction: column; gap: 18px; }
#app { display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--moss); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* hero */
.hero { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
.brand { display: flex; gap: 14px; align-items: center; }
.tr.brand-tree { width: 46px; height: 56px; flex: none; }
.hero h1 { font-family: var(--f-hand); font-size: clamp(2rem, 6vw, 2.7rem); font-weight: 400; line-height: 1.05; color: var(--moss-strong); letter-spacing: .01em; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
.countdown { margin: 0; align-self: flex-start; font-family: var(--f-hand); font-size: 1rem; color: var(--ink2); background: var(--tint); padding: 3px 12px; border-radius: 999px; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.eyebrow-h, .eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; margin: 0; }
.grove-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.grove h2 { font-family: var(--f-hand); font-weight: 400; font-size: 1.5rem; color: var(--ink); }
.pct { margin: 0; color: var(--ink2); font-variant-numeric: tabular-nums; }
.pct b { font-size: 1.25rem; color: var(--moss-strong); }

/* progress bars */
.bar { display: flex; height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; width: 100%; }
.bar i { display: block; height: 100%; transition: width .5s ease; }
.bar-big { height: 18px; }
.b3 { background: var(--tree); } .b2 { background: var(--sap); } .b1 { background: var(--amber); }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .88rem; color: var(--ink2); }
.legend li { display: flex; align-items: center; gap: 6px; }
.legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
.legend .tr { width: 16px; height: 19px; }

/* trees */
.tr { width: 13px; height: 16px; display: inline-block; vertical-align: middle; }
.tr-seed { color: var(--seed); } .tr-sprout { color: var(--amber); } .tr-small { color: var(--sap); } .tr-big { color: var(--tree); }
.tg { stroke: var(--line-strong); stroke-width: 1.2; stroke-linecap: round; }
.tk { fill: var(--bark); }
.forest { display: flex; flex-wrap: wrap; gap: 1px 2px; padding: 4px 0 2px; }
.forest.big .tr { width: 22px; height: 27px; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { appearance: none; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 10px 18px; border-radius: 999px; font-weight: 600; cursor: pointer; transition: transform .12s ease, background .15s ease; }
.btn:hover:not(:disabled) { background: var(--tint); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--moss); border-color: var(--moss); color: var(--on-moss); }
.btn.primary:hover:not(:disabled) { background: var(--moss-strong); border-color: var(--moss-strong); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* sections list */
.sections { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.sec { display: grid; grid-template-columns: 44px 1fr 18px; gap: 12px; align-items: center; text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; cursor: pointer; transition: background .15s, border-color .15s; }
.sec:hover { background: var(--surface); border-color: var(--line-strong); }
.sec-n { font-family: var(--f-hand); font-size: 1.9rem; color: var(--moss); text-align: center; line-height: 1; }
.sec-b { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sec-t { font-weight: 600; font-size: 1.04rem; }
.sec-m, .sec-c { font-size: .84rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sec-go { font-size: 1.5rem; color: var(--muted); }

/* footer settings */
.foot { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; padding-top: 18px; border-top: 1px dashed var(--line-strong); }
.foot-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.foot-l { font-size: .9rem; color: var(--ink2); }
.segs { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { border: 1.5px solid var(--line-strong); background: transparent; border-radius: 999px; padding: 6px 14px; font-size: .88rem; cursor: pointer; }
.seg.on { background: var(--moss); border-color: var(--moss); color: var(--on-moss); }
.seg.danger { border-color: var(--clay); color: var(--clay); }
.seg.danger:hover { background: var(--clay); color: var(--surface); }
.warn { color: var(--clay); font-size: .9rem; }
.note { margin: 0; font-size: .82rem; color: var(--muted); }
.size { border-top: 1px solid var(--line); padding-top: 12px; }
.top-sp { flex: 1; }
.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.segs.tight { gap: 4px; flex-wrap: nowrap; }
.seg.mini { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; font-size: .84rem; }
.ti { width: 16px; height: 16px; flex: none; }
.seg.on .ic { fill: var(--on-moss); } .seg.on .ic-l { stroke: var(--on-moss); }
.icon-btn .ti { width: 19px; height: 19px; }
.terms-h { margin: 14px 0 6px; font-weight: 600; color: var(--ink2); font-size: .92rem; }
.los ul.terms { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: row; flex-wrap: wrap; gap: 6px; }
.terms li { font-size: .82rem; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--ink2); }
@media (max-width: 480px) { .seg.mini span { display: none; } .seg.mini { padding: 6px 9px; } }

/* section page */
.top { display: flex; align-items: center; gap: 12px; }
.back { border: none; background: none; padding: 6px 2px; color: var(--ink2); font-weight: 600; cursor: pointer; }
.back:hover { color: var(--moss-strong); }
.sec-head { display: flex; flex-direction: column; gap: 4px; }
.sec-head h1, .end h1 { font-family: var(--f-hand); font-weight: 400; font-size: clamp(1.7rem, 5vw, 2.2rem); color: var(--moss-strong); line-height: 1.15; }
.los summary { cursor: pointer; font-weight: 600; color: var(--ink2); }
.los ul { margin: 0; padding-left: 20px; color: var(--ink2); display: flex; flex-direction: column; gap: 4px; font-size: .95rem; }
.done-msg { margin: 0; color: var(--leaf); font-weight: 600; }

/* quiz */
.quiz-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); padding: 8px 10px; margin: -8px -10px 0; border-radius: 0 0 16px 16px; }
.qbar { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.qcount { font-size: .84rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.icon-btn { border: 1.5px solid var(--line); background: var(--paper); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.ic { fill: var(--ink2); } .ic-l { fill: none; stroke: var(--ink2); stroke-width: 1.8; stroke-linecap: round; }
.qcard { padding: 22px; gap: 16px; }
.chips-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font-size: .74rem; padding: 2px 9px; border-radius: 999px; background: var(--tint); color: var(--ink2); font-weight: 600; letter-spacing: .02em; }
.tag-sec { background: transparent; border: 1px solid var(--line-strong); }
.tag-warm { background: var(--leaf-bg); color: var(--leaf-ink); }
.tag-hard { background: var(--clay-bg); color: var(--clay-ink); }
.tag-tr { font-family: var(--f-hand); font-weight: 400; background: var(--surface); border: 1px dashed var(--amber); color: var(--ink); }
.tag-type { background: transparent; color: var(--muted); }
.tag-rq { background: var(--surface); border: 1px solid var(--moss); color: var(--moss-strong); }
.tag-tree { margin-left: auto; } .tag-tree .tr { width: 18px; height: 22px; }
.stem { font-size: clamp(1.06rem, 2.6vw, 1.2rem); font-weight: 500; line-height: 1.5; color: var(--ink); }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--moss); color: var(--muted); font-family: var(--f-hand); padding: 0 .2em; letter-spacing: .04em; }
.blank.filled.ok { color: var(--leaf-ink); background: var(--leaf-bg); border-color: var(--leaf); border-radius: 4px 4px 0 0; }
.blank.filled.no { color: var(--leaf-ink); background: var(--leaf-bg); border-color: var(--leaf); }
mark { border-radius: 4px; padding: 0 .18em; }
mark.hl-g { background: var(--leaf-bg); color: var(--leaf-ink); }
mark.hl-r { background: var(--clay-bg); color: var(--clay-ink); }
.t-r { color: var(--clay); }

.opts { display: flex; flex-direction: column; gap: 9px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; line-height: 1.45; transition: border-color .12s, background .12s; }
.opt:hover { border-color: var(--line-strong); }
.opt .key { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: var(--muted); }
.opt .ot { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.opt.sel { border-color: var(--moss); background: var(--hl); }
.opt.sel .key { background: var(--moss); border-color: var(--moss); color: var(--on-moss); }
.opt.right { border-color: var(--leaf); background: var(--leaf-bg); cursor: default; }
.opt.right .key { background: var(--leaf); border-color: var(--leaf); color: var(--surface); }
.opt.right .ot { color: var(--leaf-ink); font-weight: 600; }
.opt.wrong { cursor: default; }
.opt.wrong .ot { color: var(--ink2); }
.opt.chosen { border-color: var(--clay); background: var(--clay-bg); }
.opt.chosen .key { background: var(--clay); border-color: var(--clay); color: var(--surface); }
.opt.chosen .ot { color: var(--clay-ink); font-weight: 600; }
.why { font-size: .86rem; font-weight: 400; color: var(--clay-ink); line-height: 1.45; }
.opt.wrong:not(.chosen) .why { color: var(--muted); }
.why-ok { color: var(--leaf-ink); }

.fill input { width: 100%; max-width: 360px; font: inherit; font-size: 1.1rem; padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); }
.fill input:focus { outline: none; border-color: var(--moss); box-shadow: 0 0 0 3px var(--hl); }
.small-note { margin: 0; color: var(--muted); font-size: .9rem; }

.check-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.kbd-hint { font-size: .8rem; color: var(--muted); margin-left: auto; }
@media (hover: none) { .kbd-hint { display: none; } }

/* placing chips */
.place { display: flex; flex-direction: column; gap: 12px; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border-radius: 14px; border: 1.5px dashed var(--line-strong); min-height: 52px; align-items: center; }
.pool.over, .tgt.over { background: var(--hl); }
.pool-empty { color: var(--muted); font-size: .88rem; }
.chip { border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 7px 12px; cursor: pointer; text-align: left; line-height: 1.35; font-size: .95rem; display: inline-flex; flex-direction: column; gap: 2px; max-width: 100%; }
.chip:hover:not(:disabled) { border-color: var(--moss); }
.chip.sel { border-color: var(--moss); background: var(--moss); color: var(--on-moss); box-shadow: 0 4px 12px -6px var(--moss); transform: translateY(-1px); }
.chip.ok { border-color: var(--leaf); background: var(--leaf-bg); color: var(--leaf-ink); }
.chip.no { border-color: var(--clay); background: var(--clay-bg); color: var(--clay-ink); }
.chip:disabled { cursor: default; opacity: 1; }
.belongs { font-size: .8rem; color: var(--leaf-ink); font-weight: 600; }
.targets { display: grid; gap: 10px; }
.place-sort .targets { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tgt { border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; min-height: 64px; min-width: 0; }
.place-match .tgt { display: grid; grid-template-columns: 1fr minmax(120px, 38%); align-items: center; gap: 10px; }
.tgt-l { font-size: .92rem; color: var(--ink2); line-height: 1.4; }
.place-sort .tgt-l { font-weight: 700; color: var(--ink); font-size: .95rem; }
.tgt-c { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; align-items: center; border-radius: 10px; padding: 4px; background: var(--paper); }
.drop { font-size: .8rem; color: var(--muted); padding: 0 6px; }
@media (max-width: 520px) { .place-match .tgt { grid-template-columns: 1fr; } }

.seq { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: s; }
.slot { counter-increment: s; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1.5px dashed var(--line-strong); border-radius: 12px; padding: 6px 10px; min-height: 46px; }
.slot::before { content: counter(s); font-family: var(--f-hand); color: var(--moss); width: 18px; font-size: 1.1rem; }
.slot.ok { border-style: solid; border-color: var(--leaf); } .slot.no { border-style: solid; border-color: var(--clay); }
.chip.in.ok { border-color: var(--leaf); background: var(--leaf-bg); color: var(--leaf-ink); }
.chip.in.no { border-color: var(--clay); background: var(--clay-bg); color: var(--clay-ink); }
.should { font-size: .82rem; color: var(--leaf-ink); }

.cloze { margin: 0; line-height: 2.3; font-size: 1.02rem; }
.cblank { min-width: 6.5em; border: none; border-bottom: 2px solid var(--line-strong); background: var(--tint); border-radius: 6px 6px 0 0; padding: 2px 10px; cursor: pointer; font-weight: 600; color: var(--ink); line-height: 1.5; }
.cblank.active { border-bottom-color: var(--moss); background: var(--hl); box-shadow: inset 0 -2px 0 var(--moss); }
.cblank.ok { background: var(--leaf-bg); color: var(--leaf-ink); border-bottom-color: var(--leaf); }
.cblank.no { background: var(--clay-bg); color: var(--clay-ink); border-bottom-color: var(--clay); text-decoration: line-through; }
.should-inline { font-size: .85rem; font-weight: 700; color: var(--leaf-ink); background: var(--leaf-bg); border-radius: 6px; padding: 1px 6px; margin-left: 4px; }
.bank { border-style: solid; background: var(--paper); }

.picks { display: flex; flex-direction: column; gap: 8px; }
.pk { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; cursor: pointer; line-height: 1.45; }
.pk .box { width: 20px; height: 20px; border-radius: 6px; border: 1.8px solid var(--line-strong); margin-top: 2px; position: relative; }
.pk.on .box { background: var(--moss); border-color: var(--moss); }
