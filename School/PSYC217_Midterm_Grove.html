e:`Earlier measures can carry over to later ones (like order effects). So: {g:most important first}, or {g:counterbalance/randomize}. And always {g:report all measures}, even mixed results.`});

Q({k:`Demand characteristics`, lv:`warm`, q:`Any feature of a study that hints at its purpose and changes how participants behave is a:`,
c:`Demand characteristic`,
x:[[`Manipulation check`,`That measures whether the IV worked.`],
[`Placebo effect`,`That's about expecting a treatment to work.`],
[`Confederate`,`That's a person working for the researcher.`],
[`Floor effect`,`That's about a measure being too hard.`]],
e:`{g:Demand characteristics} cue participants about how they're "supposed" to act. People who liked the experimenter were especially likely to confirm a hypothesis they'd been told.`});

Q({tr:1, k:`Demand characteristics`, q:`While piloting, you suspect participants are catching on to your hypothesis. How could you check, and how could you prevent it?`,
c:`Check with a funnelled debriefing; prevent with deception, filler tasks or items`,
x:[[`Check with a manipulation check; prevent it by telling everyone the hypothesis up front`,`Telling them the hypothesis makes it worse.`],
[`Check with Cronbach's alpha; prevent with a larger sample`,`Alpha measures internal consistency, not awareness.`],
[`Check with a pretest; prevent by switching to a within design`,`Within designs reveal more about the hypothesis, not less.`],
[`Check by asking the experimenter; prevent with a ceiling effect`,`A ceiling effect is a problem, not a fix.`]],
e:`Awareness can produce {g:demand} or {g:reactance}. Check with a {g:funnelled debriefing}/interview. Prevent with {g:deception/cover stories}, {g:filler tasks or filler questions}, unobtrusive measures, between-subjects designs or blinding.`});

Q({t:`pick`, k:`Demand characteristics`, q:`Select every strategy that reduces demand characteristics.`,
i:[[`A cover story that disguises the real purpose`,1],
[`Filler items mixed in with the real questions`,1],
[`A between-subjects design, so people see only one condition`,1],
[`Unobtrusive measures participants don't notice`,1],
[`Telling participants exactly what you expect to find`,0,`That's the definition of creating demand.`],
[`Showing every participant every condition`,0,`Seeing all conditions makes the hypothesis easier to guess.`]],
e:`Hide or disguise the hypothesis: {g:deception}, {g:filler}, {g:between designs}, {g:unobtrusive measures}, {g:placebos} and {g:blinding}. You can also ask participants afterward what they thought the study was about.`});

Q({tr:1, t:`fill`, k:`Placebo`, q:`A ___ effect occurs when people expect a treatment to be effective and improve because of that expectation.`,
a:[`placebo`,`expectation`,`expectancy`],
e:`{g:Placebo} (expectation) effects show up at the doctor's office, in therapy and self-help, and in any treatment where people expect change. A placebo group gets the expectation without the active ingredient.`});

Q({k:`Placebo`, q:`In a drug trial, how should a placebo group be used to tell whether the drug really works?`,
c:`If the drug group improves more than the placebo group, the drug works beyond expectation`,
x:[[`If the placebo group improves at all, the drug can't be doing anything`,`Some placebo improvement is expected.`],
[`If both groups improve equally, the drug is working as intended`,`Equal improvement means it's likely just a placebo effect.`],
[`The placebo group should be told that it got a sugar pill, so that the comparison stays fair`,`Then it wouldn't control expectations.`],
[`Placebo groups are only needed in drug studies, not other kinds of treatment`,`Talk therapy and other treatments need them too.`]],
e:`The {g:placebo group} has the same expectations, minus the active ingredient. Drug > placebo = a real effect. Drug = placebo = probably expectation.`});

Q({t:`hot`, k:`Placebo`, q:`In this balanced placebo design for nicotine inhalers, click the group that tests the power of expectation alone.`,
fig:{k:`tbl`, hs:true, rl:`Actually given`, cl:`Told they got`, r:[`Nicotine`,`No nicotine`], c:[`Told nicotine`,`Told no nicotine`], m:[[`Group 1`,`Group 3`],[`Group 4`,`Group 2`]]},
a:`c10`,
why:{c00:`Group 1 has both the drug and the expectation, so you can't separate them.`, c01:`Group 3 has the drug but no expectation; it tests the drug alone.`, c11:`Group 2 has neither.`},
e:`{g:Group 4}: no nicotine but {g:told nicotine}. People who believed they inhaled nicotine (Groups 1 and 4) reported similar intentions to cut back. Belief mattered more than the drug.`});

Q({k:`Placebo`, q:`Why do some studies use a wait-list control group?`,
c:`So control participants still get the helpful treatment after the study ends`,
x:[[`So the control group can choose its own condition later on`,`That would be self-selection.`],
[`To make sure the control participants drop out before the posttest`,`The aim is to keep and later help them.`],
[`To create a ceiling effect in the control group's anxiety scores`,`That's not its purpose.`],
[`So the experimenters always know exactly which participants are in which group`,`That's not the purpose either.`]],
e:`If the treatment works, withholding it raises {g:ethical} concerns. A {g:wait-list} gives controls the treatment afterward. It also controls for expecting relief soon.`});

Q({k:`Placebo`, lv:`hard`, q:`Two meta-analyses on antidepressants found what about placebo effects?`,
c:`Little advantage over placebo for mild or moderate depression, but a clear one for severe`,
x:[[`Antidepressants work equally well at every level of depression severity`,`The benefit depended on severity.`],
[`Placebos work better than antidepressants for people with severe depression, but not mild`,`Medication beat placebo for severe depression.`],
[`Antidepressants show no advantage over placebo at any level of severity`,`They showed an effect for severe depression.`],
[`Placebo effects only appear in talk therapy, never in drug studies`,`They appear in drug studies too.`]],
e:`Placebo effects are a serious concern. Medication beat placebo mainly for {g:severe} depression; for {r:mild/moderate}, not by much.`});

Q({k:`Experimenter bias`, q:`Clever Hans the horse seemed to solve math problems by tapping. What was really happening?`,
c:`Questioners unknowingly gave tiny head and eye cues when to stop`,
x:[[`Hans could count, but only small numbers`,`He couldn't count; he read cues.`],
[`The owner was secretly signalling the answers to Hans in order to make a profit`,`The owner made no profit and wasn't consciously cheating.`],
[`Hans memorized the answers to common questions during long practice sessions`,`Answers changed with questions; he followed cues.`],
[`Observers were bribed to report correct answers`,`No bribery; the cues were unintentional.`]],
e:`{g:Experimenter expectancy}: as Hans neared the right number, questioners {g:unconsciously} moved their heads or eyes, and Hans stopped. If a horse can pick that up, humans can too.`});

Q({k:`Experimenter bias`, q:`Students trained rats labelled "bright" or "dull," though the rats were randomly labelled from the same strain. The "bright" rats performed better. Why?`,
c:`The students' expectations changed how they treated or recorded the rats`,
x:[[`The "bright" rats really were genetically smarter than the "dull" ones`,`They came from the same strain.`],
[`Random assignment failed because the groups of rats were far too small`,`The label, not the assignment, drove the result.`],
[`The "dull" rats suffered a fatigue effect`,`Fatigue wasn't the issue.`],
[`It was a placebo effect in the rats`,`The rats didn't know their labels; the experimenters did.`]],
e:`Experimenter bias can work through {g:treating participants differently} and through {g:recording behaviour differently}. Same lesson in humans: walking-speed expectations and ADHD diagnoses (boy vs girl) both shifted with expectations.`});

Q({t:`match`, k:`Experimenter bias`, q:`Match each control procedure to what it does.`,
p:[[`Single-blind`,`Participants don't know their condition, but the experimenter does`],
[`Double-blind`,`Neither the participant nor the experimenter knows the condition`],
[`Automated procedure`,`Software delivers the IV and records responses`]],
e:`{g:Double-blind} usually needs two experimenters: one gives the IV, another (unaware) measures the DV. Automation and well-trained, hypothesis-blind experimenters also limit expectancy effects.`});

Q({k:`Experimenter bias`, q:`Therapists read the same case description, but the patient was presented as a boy or a girl. The "boy" was more often misdiagnosed with ADHD. What does this show?`,
c:`Expectations can bias how behaviour is interpreted and recorded`,
x:[[`Boys truly show more ADHD symptoms in written case files than girls do`,`The case files were identical.`],
[`Therapists can't diagnose from written cases`,`They made diagnoses; the bias was the issue.`],
[`This is a practice effect in diagnosis`,`Each therapist saw one version.`],
[`Gender is a confound that can't be manipulated`,`Gender was manipulated in the description here.`]],
e:`Even with a {g:straightforward manipulation} (a mailed case study), {g:expectations} shaped judgments. This is why blind coders and clear criteria matter.`});

Q({k:`Pilot studies`, q:`What is a pilot study mainly for?`,
c:`Debugging: catching logistics problems, ceiling or floor effects, and weak manipulations`,
x:[[`Checking whether the hypothesis is correct and the effect works before running the real study`,`A pilot isn't for checking whether the hypothesis "works."`],
[`Deciding whether the data are "right" or "wrong" before the analysis`,`That's specifically NOT what pilots are for.`],
[`Replacing the need for ethics approval when the planned sample is small`,`Pilots need ethics approval too.`],
[`Getting publishable results faster by using fewer participants`,`It tests procedures; it's not a shortcut to results.`]],
e:`Pilots are for {g:debugging}: logistics, useful data, {g:ceiling/floor}, {g:manipulation checks}, whether instructions make sense. NOT for checking if the hypothesis is correct. Pilots go in the ethics application.`});

Q({t:`pick`, k:`Ethics approval`, q:`Select everything you should finish BEFORE applying for ethics approval.`,
i:[[`Operationalize the IV and all measures`,1],[`Write the informed consent form`,1],[`Plan the debriefing`,1],[`Decide how many participants and who's included`,1],[`Prepare recruitment materials`,1],[`Collect data from your main sample`,0,`You can't collect data before approval.`],[`Analyze the results`,0,`Analysis comes after data collection.`]],
e:`Before the Research Ethics Board: {g:operationalizations}, {g:procedure and materials}, {g:consent form}, {g:debriefing plan}, {g:who and how many}, {g:recruitment}, {g:confidentiality}, risks and benefits.`});

Q({k:`Debriefing`, q:`What is a funnelled debriefing?`,
c:`Questions that start broad and narrow toward the deception, to probe for suspicion`,
x:[[`Telling participants the full hypothesis before the study starts, to avoid suspicion`,`Debriefing happens at the end.`],
[`Pouring all participants into one condition`,`That's not a debriefing technique.`],
[`A written form that lists the study's references`,`It's a set of probing questions.`],
[`Asking just one yes-or-no question about whether they noticed any deception`,`It's a sequence of questions, broad to specific.`]],
e:`Like a funnel: {g:broad} ("What did you think this was about?") to {g:specific} (the key deception). It tells you whether participants were suspicious and changed their behaviour.`});

Q({k:`Debriefing`, q:`Which is NOT a goal of debriefing after a deception study?`,
c:`Convincing participants the deception never happened`,
x:[[`Explaining why the deception was necessary`,`That's a core goal.`],
[`Reassuring them that being fooled doesn't reflect poorly on them`,`That's a core goal.`],
[`Repairing any negative mood and offering support resources`,`That's a core goal.`],
[`Asking them not to discuss the study with future participants`,`That's a common request.`]],
e:`Debriefing {g:explains} the deception, {g:reassures}, {g:apologizes}, {g:repairs mood}, offers resources if needed, and often asks for {g:confidentiality}. Participants should leave feeling as good or better than when they arrived.`});

Q({k:`Sample size`, q:`How does the size of an effect relate to the sample you need?`,
c:`Smaller effects need much larger samples (r = .8 needs ~11; r = .2 needs ~266)`,
x:[[`Smaller effects need smaller samples, since subtle effects are easier to see in data`,`Smaller effects are harder to see.`],
[`Sample size doesn't depend on effect size`,`It depends heavily on effect size.`],
[`Larger effects need larger samples to be confirmed`,`Large effects need fewer people.`],
[`Every study needs exactly 100 participants`,`There's no fixed number.`]],
e:`{g:Statistical power}: tiny effects get lost in noise unless you have {g:lots of data}. Larger samples also give better estimates and more representative results.`});

Q({tr:1, k:`Generalizing`, q:`A downtown Vancouver company posts a flyer asking for volunteers to test a product meant for farms. Testers mostly call it "fun" and "great." What's the concern?`,
c:`Low external validity: city volunteers may judge it very differently than farmers`,
x:[[`Low internal validity, since nothing at all was manipulated during the product test`,`The issue is who was sampled, not causal inference.`],
[`A floor effect, since the ratings were all clustered at the low end`,`The ratings were positive.`],
[`Experimenter bias, since the company itself ran the product test`,`Possible, but the main concern is the sample.`],
[`A contrast effect, since testers compared it with an earlier product`,`Only one product was rated.`]],
e:`{g:External validity / generalizability} is likely low, especially for the people the product is marketed to. Farmers may have different priorities and evaluate the product differently.`});

Q({k:`Researcher commitments`, lv:`warm`, q:`Which of these is an implicit commitment researchers make to participants?`,
c:`Being on time, and following through on promised credit or results`,
x:[[`Guaranteeing that the study's hypothesis will be supported by the data`,`No one can promise that.`],
[`Letting each participant choose which condition they would like to be in`,`That would create self-selection.`],
[`Sharing other participants' data with them`,`That would break confidentiality.`],
[`Skipping the debriefing to save time`,`Debriefing is part of the obligation.`]],
e:`Participants value {g:punctuality}. Follow through on {g:credit} and {g:promised summaries}. Small details, but they maintain trust between participants and science.`});

Q({t:`cloze`, k:`Three designs`, q:`Build the explanation of how a within-subjects design controls participant variables.`,
txt:`In a within-subjects design, the [[same]] people experience every condition, so each person serves as their own [[control]]. Individual differences are removed from error, which makes the design more [[sensitive]] and means it needs [[fewer]] participants. The trade-off is [[order]] effects, which researchers handle with [[counterbalancing]].`,
d:[`different`,`placebo`,`random`,`more`],
e:`Within = {g:powerful and efficient}, but watch {r:practice, fatigue, contrast and carryover} effects.`});

Q({t:`cloze`, k:`Confounds`, q:`Build the explanation of a confound and how experiments defeat it.`,
txt:`A confound is like an [[accidental]] IV: it [[covaries]] with the independent variable and could also [[cause]] changes in the dependent variable. Confounds threaten [[internal]] validity. Researchers fight them with experimental [[control]], keeping everything but the IV the same, and with [[random]] assignment to equalize participant variables.`,
d:[`external`,`mediates`,`placebo`],
e:`Two rules for a confound (covaries with IV + affects DV). Two main weapons: {g:experimental control} and {g:random assignment} (or matching).`});

Q({t:`pick`, k:`Confounds`, q:`You need to explain in writing why the caffeine-runner study can't conclude caffeine made runners faster. Select the points that belong in a strong answer.`,
i:[[`The control group got no pill, so expectations differed between groups`,1],
[`A placebo pill for controls would equate expectations`,1],
[`The pretest races showing equal groups were a strength`,1],
[`The DV (race time) was measured in a nominal way`,0,`Race time is a precise ratio measure.`],
[`Caffeine can't be given as a pill`,0,`It can, as in this study.`],
[`Two conditions can never show a causal effect`,0,`Two conditions are fine if everything else is controlled.`]],
e:`A strong answer names the {g:confound} (expectation), the {g:fix} (placebo), and gives credit where due (the {g:pretest races}).`});

S(4);

Q({k:`Comparison groups`, q:`Why might "comparison group" be a more useful term than "control group"?`,
c:`Not every study needs a no-treatment control, and the comparison limits the conclusion`,
x:[[`Control groups are unethical in every psychology study, so a new term is needed`,`They're often fine; they just aren't the only option.`],
[`Comparison groups don't need random assignment, which makes them much simpler to run`,`They still need random assignment.`],
[`Control groups can only be used in within-subjects designs, not between`,`Controls work in between designs too.`],
[`The two terms mean exactly the same thing, so the choice is just style`,`"Control" implies absence of treatment; comparisons can be other treatments.`]],
e:`"Control" usually means {g:absence} of the treatment. A {g:comparison} can be another treatment. Crucially, {g:what you compare against constrains what you can conclude}, especially in a two-group design.`});

Q({t:`match`, k:`Comparison groups`, q:`A new CBT + mindfulness therapy for anxiety beats each comparison group. Match each comparison to the conclusion it allows.`,
p:[[`No-treatment control`,`The therapy reduces anxiety compared to doing nothing`],
[`Wait-list control`,`It works beyond simply expecting relief soon`],
[`Sham therapy (placebo)`,`It works beyond meeting a caring therapist`],
[`Treatment as usual`,`It works better than the clinic's current practice`],
[`CBT without mindfulness`,`Mindfulness is an important ingredient`]],
e:`Each comparison {g:rules out a different alternative explanation}. Stronger comparisons (sham, treatment as usual, dismantling) let you make more specific claims.`});

Q({k:`Comparison groups`, q:`You want to know whether the mindfulness part of a CBT + mindfulness program matters. Which comparison group should you use?`,
c:`CBT without the mindfulness part`,
x:[[`A wait-list control`,`That shows the program beats expecting help, not which ingredient matters.`],
[`No treatment at all`,`That can't isolate the mindfulness component.`],
[`A sham therapy with no real techniques`,`That controls for therapist contact, not for mindfulness specifically.`],
[`Treatment as usual at the clinic`,`That compares to current practice, not to the same program minus mindfulness.`]],
e:`To test one {g:ingredient}, compare the full program to the {g:same program minus that ingredient}. Everything else matches, so any difference is due to mindfulness.`});

Q({k:`Comparison groups`, lv:`hard`, q:`The therapy beats a sham therapy. What alternative explanation does this rule out that a no-treatment control would not?`,
c:`The benefit of meeting with a therapist and feeling someone cares`,
x:[[`The benefit of simply waiting while time passes and symptoms fade on their own`,`A no-treatment control already handles passing time.`],
[`Differences in anxiety between groups at the start`,`Random assignment handles starting differences.`],
[`The benefit of the clinic's usual therapy`,`That needs a treatment-as-usual comparison.`],
[`The effect of the mindfulness component alone`,`That needs a CBT-without-mindfulness comparison.`]],
e:`A {g:sham therapy} gives the same contact and attention without the real techniques, so beating it means the therapy works {g:beyond the known positive effect of meeting with a therapist}.`});

Q({k:`More than two levels`, q:`People read a happy or sad story, and the happy story is remembered better. What's the problem with this two-level design?`,
c:`You can't tell whether happiness helped memory or sadness hurt it`,
x:[[`Memory can't be measured with a recall test`,`Recall is a fine measure.`],
[`The two stories differ in mood, which creates a confound in the design`,`Mood is the IV; that's intended.`],
[`Two levels can't ever show a difference`,`They showed a difference; the problem is interpreting it.`],
[`It needs a within-subjects design to work`,`That doesn't solve the interpretation problem.`]],
e:`With only two levels, the {g:direction of the effect is ambiguous}. Add a {g:neutral} condition as a baseline to see which side moved.`});

Q({k:`More than two levels`, q:`With a neutral condition added, recall accuracy looks like this. What's the best interpretation?`,
fig:{k:`bars1`, labels:[`Happy`,`Neutral`,`Sad`], vals:[4.2,2.1,2.0], max:5, y:`Recall accuracy`, xl:`Mood`},
c:`Happiness improved memory; sadness didn't hurt it`,
x:[[`Sadness reduced memory; happiness didn't help it`,`Sad ≈ neutral, so sadness didn't change memory.`],
[`Both happiness and sadness changed memory in opposite ways`,`Only happy differs from neutral.`],
[`Mood had no effect on memory`,`Happy is clearly higher than the others.`],
[`Neutral mood hurt memory compared to both`,`Neutral and sad are about the same.`]],
e:`Compare each mood to the {g:neutral baseline}. Happy is higher than neutral; sad ≈ neutral. So {g:happiness helped}. That's why a third level helps explain causal relationships.`});

Q({k:`More than two levels`, q:`A different result. What does this pattern tell you?`,
fig:{k:`bars1`, labels:[`Happy`,`Neutral`,`Sad`], vals:[4.1,4.0,1.9], max:5, y:`Recall accuracy`, xl:`Mood`},
c:`Sadness reduced memory; happiness didn't improve it`,
x:[[`Happiness improved memory; sadness didn't hurt it`,`Happy ≈ neutral here.`],
[`Both happy and sad moods changed memory by the same amount`,`Only sad differs from neutral.`],
[`Mood had no effect on memory`,`Sad is clearly lower.`],
[`Neutral mood is the best for memory`,`Neutral ties with happy.`]],
e:`Happy ≈ neutral, sad < neutral → {g:sadness hurt memory}. With only happy vs sad, this result would look identical to the previous one. The neutral level is what tells them apart.`});

Q({k:`More than two levels`, q:`Productivity rises with the first few cups of coffee, then falls. What's the minimum number of IV levels needed to detect this?`,
fig:{k:`ix`, x:[`0`,`1`,`2`,`3`,`4`,`5`,`6`,`7`,`8`], m:[[2,4,6,7.4,8,7.4,5.6,3.6,2]], max:9, y:`Productivity`, xl:`Cups of coffee`},
c:`Three`,
x:[[`Two`,`Two points always make a straight line; they can't show a rise then a fall.`],
[`One`,`One level gives no comparison at all.`],
[`Four`,`Four would work, but three is the minimum.`],
[`Nine`,`More levels give a clearer picture, but three is the minimum.`]],
e:`A {g:curvilinear} (inverted-U) relationship needs at least {g:three levels}: low, middle, high. Two levels can only draw a straight line.`});

Q({k:`More than two levels`, lv:`hard`, q:`The true relationship is an inverted U. If you only tested Level 1 and Level 3, what would you wrongly conclude?`,
fig:{k:`ix`, x:[`Level 1`,`Level 2`,`Level 3`], m:[[2,8,2]], max:10, y:`DV`},
c:`That the IV has no effect on the DV`,
x:[[`That the IV has a strong positive effect`,`Levels 1 and 3 are equal, so no slope.`],
[`That the IV has a strong negative effect`,`Levels 1 and 3 are equal.`],
[`That the relationship is curvilinear`,`With two points you can't see a curve.`],
[`That there's a ceiling effect`,`Nothing suggests scores hit a maximum.`]],
e:`Level 1 and Level 3 have the {g:same} DV value, so it looks like {r:no relationship}. Testing 1 vs 2 would suggest a positive effect. Only all three levels reveal the {g:inverted U}.`});

Q({k:`More than two levels`, q:`Comparing only $0 vs $40 rewards, performance looks like a straight line. Adding $10, $20 and $30 shows this. What did the extra levels reveal?`,
fig:{k:`ix`, x:[`$0`,`$10`,`$20`,`$30`,`$40`], l:[`Assumed from 2 levels`,`Found with 5 levels`], m:[[50,61,72,83,94],[50,80,89,92,94]], min:40, max:100, y:`Percent correct`},
c:`A positive non-linear relationship that levels off around $20`,
x:[[`A negative relationship between reward and performance`,`Performance rises with reward.`],
[`No relationship between reward and performance`,`Performance clearly increases.`],
[`An inverted-U relationship that peaks around $20 and then falls back`,`It levels off; it doesn't fall back down.`],
[`A perfectly linear relationship, as expected`,`The five-level line bends.`]],
e:`Reward helps a lot up to about $20, then adds little: a {g:positive non-linear} function. Useful for deciding how much to pay. With only two levels, you'd have {r:missed} this.`});

Q({k:`More than two levels`, q:`Stressed participants explore a VR nature scene, a VR city, or VR geometric shapes. Why include the shapes condition?`,
c:`To rule out that any VR experience, rather than realistic scenes, reduces stress`,
x:[[`To turn the study into a within-subjects design with three conditions`,`Adding a condition doesn't change the design type.`],
[`To create a ceiling effect on stress so differences are easier to see`,`That would be a problem, not a goal.`],
[`To serve as the dependent variable that measures stress reduction`,`It's a level of the IV.`],
[`To increase the number of participants in the study without adding any extra cost`,`It's about interpretation, not sample size.`]],
e:`A third level can be an extra {g:control}. If nature and city both reduced stress, the shapes condition would tell you whether VR exposure alone does it. (Nature reduced stress most.)`});

Q({k:`More than two levels`, q:`Fear in a persuasive message increases attitude change up to a moderate level, then more fear reduces attitude change. This is:`,
c:`A curvilinear (inverted-U) relationship`,
x:[[`A positive linear relationship throughout`,`It stops increasing and turns down.`],
[`A negative linear relationship`,`It increases first.`],
[`No relationship`,`Attitude change clearly varies with fear.`],
[`An interaction between fear and attitude`,`There's only one IV here.`]],
e:`Moderate fear works best: an {g:inverted U}. Detecting it requires at least {g:three} fear levels.`});

Q({t:`fill`, k:`Factorial designs`, lv:`warm`, q:`An experiment with more than one independent variable, each with at least two levels, is a ___ design.`,
a:[`factorial`],
e:`{g:Factorial designs} have two or more IVs (also called {g:factors}). They're efficient and closer to real life, where many influences interact.`});

Q({k:`Factorial designs`, q:`A study is described as a "2 × 3 factorial design." What does that tell you?`,
c:`Two IVs: one with 2 levels and one with 3, for 6 conditions`,
x:[[`Two DVs and three IVs, for a total of 5 conditions`,`The numbers are levels of IVs, not counts of DVs.`],
[`One IV with 2 levels, each measured 3 separate times`,`Each number is a separate IV.`],
[`Three IVs with 2 levels each, for a total of 8 conditions`,`That would be 2 × 2 × 2.`],
[`Two groups of 3 participants each, for 6 participants total`,`The numbers aren't sample sizes.`]],
e:`Each number = {g:one IV}; its value = {g:how many levels}. Multiply to get conditions: 2 × 3 = {g:6}.`});

Q({t:`fill`, k:`Factorial designs`, q:`A design has SOA (3 levels) × prime type (3) × target type (2) × backward mask (2). How many conditions does that create? Type a number: ___`,
a:[`36`,`thirty six`,`thirty-six`],
e:`3 × 3 × 2 × 2 = {g:36} conditions (plus a continuous motivation variable in the original study). Factorial designs grow fast.`});

Q({k:`Factorial designs`, q:`How many IVs and conditions are in a 2 × 2 × 2 design?`,
c:`3 IVs and 8 conditions`,
x:[[`2 IVs and 6 conditions`,`Count the numbers: three, each with 2 levels.`],
[`3 IVs and 6 conditions`,`2 × 2 × 2 = 8, not 6.`],
[`2 IVs and 8 conditions`,`There are three numbers, so three IVs.`],
[`6 IVs and 8 conditions`,`The count of IVs is how many numbers there are.`]],
e:`Three numbers = {g:3 IVs}. Multiply: 2 × 2 × 2 = {g:8} conditions.`});

Q({k:`Hermans study`, q:`Participants watched trailers with a confederate who was sociable or unsociable and ate a little or a lot of M&Ms. Then researchers counted participants' M&Ms. Identify the design.`,
c:`2 × 2 between-subjects: sociability × confederate intake; DV is M&Ms eaten`,
x:[[`2 × 2 within-subjects: everyone met all four kinds of confederate in turn`,`Each participant was randomly assigned to one combination.`],
[`One IV with four levels; the DV is how much the confederate chose to eat`,`There are two IVs, and the confederate's intake is manipulated.`],
[`2 × 2 IV × PV: sociability is a participant variable`,`Sociability was the confederate's manipulated behaviour.`],
[`2 × 2 between-subjects: sociability × intake; DV is movie trailer ratings`,`The DV of interest was candy eaten.`]],
e:`Two manipulated IVs ({g:confederate sociability}, {g:confederate food intake}), each with two levels, = four groups. Different people in each group = {g:between-subjects}.`});

Q({t:`hot`, k:`Marginal means`, q:`Mean M&Ms eaten. Click the marginal mean for the high-intake confederate conditions, averaging over sociability.`,
fig:{k:`tbl`, hs:true, marg:true, rl:`Confederate intake`, cl:`Sociability`, r:[`Low`,`High`], c:[`Sociable`,`Unsociable`], m:[[6.58,2.14],[5.68,10.63]]},
a:`mr1`,
why:{mr0:`That's the low-intake row mean (4.36).`, mc0:`That's the sociable column mean.`, mc1:`That's the unsociable column mean.`, c10:`That's one cell (sociable + high intake), not a marginal mean.`, c11:`That's one cell (unsociable + high intake), not a marginal mean.`, c00:`That's a single cell.`, c01:`That's a single cell.`},
e:`A {g:marginal mean} averages one IV's level across the other IV: (5.68 + 10.63) / 2 = {g:8.16}. Compare it with low intake (4.36) to see the main effect of confederate intake.`});

Q({k:`Main effects`, q:`What is a {k:main effect}?`,
c:`The overall effect of one IV on the DV, averaging across the other IV's levels`,
x:[[`The effect of one IV at only one particular level of the other IV`,`That's a simple main effect.`],
[`When one IV's effect on the DV depends on which level of the other IV it's at`,`That's an interaction.`],
[`The largest difference between any two cells`,`Main effects use marginal means, not single cells.`],
[`The effect the researcher predicted in the hypothesis`,`Main effects exist whether predicted or not.`]],
e:`A {g:main effect} "pretends the other IV doesn't exist" by comparing {g:marginal means}. A 2-IV design has two possible main effects.`});

Q({k:`Main effects`, q:`Using the M&M table, which IV shows the larger main effect?`,
fig:{k:`tbl`, marg:true, rl:`Confederate intake`, cl:`Sociability`, r:[`Low`,`High`], c:[`Sociable`,`Unsociable`], m:[[6.58,2.14],[5.68,10.63]]},
c:`Confederate intake: 4.36 vs 8.16`,
x:[[`Confederate sociability: 6.13 vs 6.39`,`That gap is tiny compared with intake's.`],
[`Neither IV, since the cells cancel out`,`The intake marginal means clearly differ.`],
[`Both IVs equally`,`The differences are very different sizes.`],
[`It can't be judged without a graph`,`Marginal means in a table are actually easiest.`]],
e:`Compare marginal means. Intake: {g:4.36 vs 8.16} (big). Sociability: {r:6.13 vs 6.39} (slight). People ate considerably more when the confederate ate a lot.`});

Q({k:`Interactions`, q:`What is an {k:interaction}?`,
c:`When the effect of one IV on the DV depends on the level of the other IV`,
x:[[`When both IVs have main effects of exactly the same size on the DV`,`Two main effects can exist with no interaction.`],
[`When an IV changes along with a confound`,`That's a confound, not an interaction.`],
[`When a third variable explains exactly how and why an IV affects a DV`,`That's mediation.`],
[`When each participant experiences every possible combination of the IVs`,`That's a within-subjects factorial, not an interaction.`]],
e:`Interaction = "{g:it depends}." The effect of IV1 {g:changes} across levels of IV2. Interactions only exist in factorial designs.`});

Q({k:`Interactions`, q:`Which statement correctly describes the M&M interaction?`,
fig:{k:`ix`, bar:true, vals:true, x:[`Sociable`,`Unsociable`], l:[`Low intake`,`High intake`], m:[[6.58,2.14],[5.68,10.63]], max:12, y:`M&Ms eaten`, xl:`Confederate sociability`},
c:`People copied a big-eating confederate only when the confederate was unsociable`,
x:[[`People copied a big-eating confederate only when the confederate was sociable`,`With a sociable confederate, intake barely mattered (6.58 vs 5.68).`],
[`People always ate more with a big-eating confederate, by the same amount`,`Same-size effects would mean no interaction.`],
[`Sociability had a large main effect on eating`,`Sociability's marginal means are nearly equal.`],
[`Neither variable affected how much people ate`,`Unsociable + high intake produced the most eating.`]],
e:`Unsociable confederate: {g:2.14 → 10.63} (strong modelling). Sociable: {r:6.58 → 5.68} (little effect, even slightly reversed). The intake effect {g:depends on} sociability.`});

Q({t:`hot`, k:`Interactions`, q:`In the M&M results, click the bar for the condition where participants ate the most.`,
fig:{k:`ix`, bar:true, x:[`Sociable`,`Unsociable`], l:[`Low intake`,`High intake`], m:[[6.58,2.14],[5.68,10.63]], max:12, y:`M&Ms eaten`, xl:`Confederate sociability`},
a:`p11`,
why:{p01:`Sociable + high intake was 5.68, lower than the sociable + low cell.`, p00:`Sociable + low intake was 6.58.`, p10:`Unsociable + low intake was the lowest, 2.14.`},
e:`{g:Unsociable + high intake} = 10.63 M&Ms. That one cell drives the interaction. The researchers had expected modelling mainly with the sociable confederate.`});

Q({k:`Interactions`, q:`"I'll go to the movie if I don't have an exam, and only if my favourite actor is in it." In research terms this is:`,
c:`An interaction between exam and actor`,
x:[[`A main effect of the actor only`,`The actor only matters when there's no exam.`],
[`A main effect of the exam only`,`The actor also matters, but only sometimes.`],
[`Two separate, independent main effects`,`One variable's effect depends on the other.`],
[`A mediator between exam and actor`,`Nothing here explains a process.`]],
e:`Whenever you say "{g:it depends}," you're describing an {g:interaction}. With an exam, the actor doesn't matter at all; without one, it matters a lot.`});

Q({k:`Moderators`, q:`In a factorial design, interactions show the presence of a:`,
c:`Moderator variable`,
x:[[`Mediating variable`,`Mediators explain how; interactions show when or for whom.`],
[`Third variable`,`Third variables cause two other variables.`],
[`Confounding variable`,`Confounds travel with the IV by accident.`],
[`Dependent variable`,`The DV is the outcome in both main effects and interactions.`]],
e:`A {g:moderator} changes the strength or direction of a relationship. Sociability {g:moderated} the intake → eating relationship. Moderators can be situational or participant variables.`});

Q({k:`Moderators`, q:`When there's an interaction, what happens to the main effects?`,
c:`They must be qualified: each depends on the other variable`,
x:[[`They disappear completely and can't be reported anymore`,`You still report them; you just interpret them with care.`],
[`They become mediators`,`Main effects don't turn into mediators.`],
[`They must both be statistically significant to be reported`,`An interaction can occur with or without main effects.`],
[`They prove the hypothesis was correct`,`Nothing is proven.`]],
e:`"{g:Qualified}" = conditional. "People eat more with a big-eating companion" must become "...{g:only when that companion is unsociable}."`});

Q({k:`Racial bias study`, q:`Researchers ask whether time lets people control racial bias. In the original study, how was "time" operationalized?`,
c:`Stimulus onset asynchrony: the gap between the prime face and the target`,
x:[[`How long participants had to complete the whole study from start to finish`,`Time was manipulated within each trial.`],
[`Self-reported motivation to control prejudice`,`That's the second IV, a participant variable.`],
[`The percentage of threat judgments made`,`That's the DV.`],
[`Participants' reaction times on each trial`,`Reaction time wasn't the operationalization of the IV.`]],
e:`IV = {g:SOA} (time between prime and target): 150 ms vs 325 ms. DV = racial bias, operationalized as the {g:percentage difference in "threat" judgments} after Black vs White primes.`});

Q({k:`Racial bias study`, lv:`hard`, q:`A theory made a point prediction: people need 400 ms to control bias, so differences below 400 ms shouldn't matter. Bias dropped from 150 ms to 325 ms. Critics then said the threshold is really 300 ms. How did researchers respond?`,
c:`They added a 200 ms level, and bias still declined steadily below 300 ms`,
x:[[`They dropped the 150 ms condition and retested with 325 ms only`,`They added a level; they didn't remove one.`],
[`They switched to a correlational design that measured time instead of manipulating it`,`Time stayed manipulated.`],
[`They accepted the 300 ms threshold and stopped testing the theory`,`The new data argued against any threshold.`],
[`They removed the time IV and studied motivation as the only factor`,`Motivation was added later, alongside time.`]],
e:`A {g:point prediction} is risky, and here it was falsified. Adding a {g:third level} (150, 200, 325 ms) tested the new threshold claim. A steady decline means no threshold. More levels = more precise tests.`});

Q({t:`sort`, k:`Racial bias study`, q:`Sort each feature to the variable it describes in the racial bias study.`,
b:[`SOA (time)`,`Motivation to control prejudice`],
i:[[`Manipulated by the researcher`,0],[`Within-subjects`,0],[`Categorical with exactly 2 levels`,0],[`Self-reported participant variable`,1],[`Between-subjects`,1],[`Continuous, scored 17–48`,1]],
e:`Time = manipulated, {g:within}, categorical. Motivation = measured {g:participant variable}, {g:between}, continuous. Together: an {g:IV × PV} and a {g:mixed} design.`});

Q({k:`Racial bias study`, q:`The racial bias study crossed a manipulated within-subjects IV (SOA) with a measured between-subjects participant variable (motivation). What two labels describe this design?`,
c:`IV × PV design, and a mixed design`,
x:[[`True experiment, and a between-subjects design`,`A PV means it isn't fully a true experiment, and one factor is within.`],
[`Quasi-experiment, and a within-subjects design`,`One factor is between-subjects.`],
[`Single-case design, and an ABA reversal`,`It has many participants and two factors.`],
[`Matched pairs, and a Solomon four-group design`,`Neither fits.`]],
e:`{g:IV × PV}: one manipulated IV, one participant variable. {g:Mixed}: one within factor, one between factor.`});

Q({k:`Racial bias study`, q:`Results looked like this. What's the right interpretation?`,
fig:{k:`ix`, x:[`150 ms`,`325 ms`], l:[`High motivation`,`Low motivation`], m:[[0.3,0.1],[0.31,0.3]], max:0.4, y:`Racial bias`, xl:`Time between prime and target (SOA)`},
c:`Time reduces bias for highly motivated people, but not for less motivated people`,
x:[[`Time reduces bias equally for everyone, regardless of their motivation`,`The lines aren't parallel; only one slopes down.`],
[`Motivation causes people to have less bias, which shows a clear causal effect here`,`Motivation is measured, not manipulated, so no causal claim.`],
[`Time has no effect on bias at all, for either group of participants`,`Bias drops for the high-motivation group.`],
[`Low motivation makes bias increase steadily as time goes on`,`The low-motivation line is flat.`]],
e:`{g:Interaction}: motivation {g:moderates} the time → bias relationship (negative for high motivation, none for low). Careful: motivation is a {r:participant variable}, so we can't say it {r:causes} less bias.`});

Q({k:`Factorial designs`, q:`Why are factorial designs considered efficient?`,
c:`One study tests each IV's main effect and their interaction at once`,
x:[[`They need fewer conditions than a simple two-group experiment`,`They need more conditions.`],
[`They never need random assignment, even for between factors`,`Between factors still need random assignment.`],
[`They remove all order effects, even in within-subjects factors`,`Within factors still have order effects.`],
[`They always use participant variables, which are cheaper to measure`,`Many factorial designs use only manipulated IVs.`]],
e:`A 2 × 2 tests {g:two main effects} ("Does time reduce bias?" "Does motivation?") plus {g:one interaction} ("Does time's effect depend on motivation?").`});

Q({t:`match`, k:`2 × 2 cells`, q:`Alcohol (vs placebo) × photo of a Black or White man; DV = positivity of evaluation. Match each research question to what it tests.`,
p:[[`Does positivity depend on drink condition, overall?`,`Main effect of IV 1`],
[`Does positivity depend on the race in the photo, overall?`,`Main effect of IV 2`],
[`Does alcohol's effect depend on the race in the photo?`,`Interaction`]],
e:`Every 2 × 2 asks three questions: {g:main effect A}, {g:main effect B}, {g:A × B interaction}.`});

Q({k:`2 × 2 cells`, q:`In the alcohol × race study, this pattern appears. What does it show?`,
fig:{k:`ix`, x:[`Placebo`,`Alcohol`], l:[`Black men`,`White men`], m:[[5.6,3.4],[5.6,5.6]], min:1, max:7, y:`Positivity (1–7)`, xl:`Drink condition`},
c:`An interaction: alcohol lowered positivity only for Black men`,
x:[[`Only a main effect of drink, equal in size for both races`,`White-man ratings stayed the same, so the drink effect isn't equal.`],
[`No effects of either variable`,`One line drops clearly.`],
[`Only a main effect of race, with no effect of the drink at all`,`Ratings differ only in the alcohol condition.`],
[`Alcohol raised positivity for both races`,`Nothing rose.`]],
e:`Non-parallel lines = {g:interaction}. Alcohol's effect {g:depends on} the race shown. (There are also main effects in the marginal means, but the interaction qualifies them.)`});

Q({k:`Factorial designs`, q:`Why is adding more and more IVs to one study often a bad idea?`,
c:`It gets needlessly complex, needs huge samples, and some cells may not make sense`,
x:[[`Factorial designs can only include two IVs, so a third breaks the design`,`They can include many; it's just costly.`],
[`More IVs always reduce internal validity by adding brand new confounds to the study`,`Not necessarily; the cost is complexity.`],
[`More IVs make interactions impossible to detect or interpret`,`They create more possible interactions.`],
[`More IVs remove the need for a DV, so outcomes go unmeasured`,`You always need a DV.`]],
e:`2 × 2 × 2 = 8 groups; add another two-level IV → 16; another → 32. Between-subjects, that's {r:enormous} samples. Analyses also get complicated.`});

Q({k:`Factorial designs`, q:`Why do factorial designs bring experiments closer to real life?`,
c:`Real behaviour has many causes acting together`,
x:[[`Real life only ever has one cause per behaviour`,`Most behaviours have many causes.`],
[`Factorial designs avoid labs entirely`,`They're often run in labs.`],
[`Factorial designs don't need control`,`They need as much control as any experiment.`],
[`Real life never involves interactions between variables`,`Real life is full of "it depends."`]],
e:`Think of everything shaping your mood right now. Real phenomena have {g:many causes that interact}, and factorial designs can capture some of that.`});

Q({k:`Moderators`, lv:`hard`, q:`You want to add a participant variable (PV) to your study. What's a good justification?`,
c:`You expect the PV to have its own effect, or to change how the IV works`,
x:[[`The PV can be randomly assigned like the IV`,`PVs can't be randomly assigned.`],
[`Adding a PV lets you make causal claims about that participant variable`,`You can't make causal claims about PVs.`],
[`It turns the IV × PV study into a true experiment with random assignment`,`Adding a PV makes it an IV × PV design, not a true experiment.`],
[`It removes the need for a control condition`,`It doesn't replace controls.`]],
e:`Justify a PV by predicting a {g:unique effect} (a main effect) or an {g:interaction} with the IV. Remember: PVs are measured, so {r:no causal claims} about them.`});

Q({t:`cloze`, k:`Factorial designs`, q:`Build the explanation of what a 2 × 2 factorial design tells you.`,
txt:`A 2 × 2 factorial design has [[two]] IVs and four conditions. It tests [[two]] main effects and [[one]] interaction. A main effect is the overall effect of one IV, found by comparing [[marginal]] means. An interaction means the effect of one IV [[depends]] on the level of the other, which reveals a [[moderator]].`,
d:[`three`,`cell`,`mediator`,`causes`],
e:`2 × 2 → {g:2 main effects + 1 interaction}. Main effects use marginal means; interactions reveal moderators.`});

Q({t:`pick`, k:`More than two levels`, q:`Select every good reason to use more than two levels of an IV.`,
i:[[`To compare more than two groups, like an extra control condition`,1],
[`To detect a curvilinear relationship such as an inverted U`,1],
[`To tell whether one level helped or another hurt (e.g., adding neutral)`,1],
[`To turn the IV into a participant variable`,0,`Levels don't change whether a variable is manipulated.`],
[`To avoid needing a dependent variable`,0,`Every experiment needs a DV.`]],
e:`More levels: {g:more comparisons}, {g:non-linear shapes}, and clearer {g:causal interpretation}.`});

S(5);

// Sentencing study: A = type of offence (x-axis), B = defendant age (lines), DV = months of jail sentence.
var SENT = function (m) { return {k:`ix`, x:[`Alcohol`,`Marijuana`], l:[`Age 20`,`Age 50`], m:m, max:10, y:`Months of sentence`, xl:`Type of offence (A)`}; };
// Ad recall study: A = mood video (x-axis), B = ad content (lines), DV = ads recalled out of 8.
var ADS = function (m) { return {k:`ix`, x:[`Happy video`,`Sad video`], l:[`Humorous ads`,`Serious ads`], m:m, max:8, y:`Ads recalled (of 8)`, xl:`Mood induction (A)`}; };
var EFF = function (a, b, ab) { return [[`Main effect of A (the x-axis variable)`, a], [`Main effect of B (the two lines)`, b], [`A × B interaction`, ab], [`No effects at all`, !a && !b && !ab]]; };

Q({t:`pick`, k:`Reading graphs`, q:`Sentencing study (offence × defendant age). Select every effect this graph shows.`, fig:SENT([[1,9],[1,9]]), i:EFF(1,0,0),
e:`Both lines rise identically (they overlap; the dashed one sits on top). Average for Alcohol = 1, Marijuana = 9 → {g:main effect of A}. Each line averages 5 → {r:no main effect of B}. Lines are parallel → {r:no interaction}.`});

Q({t:`pick`, k:`Reading graphs`, q:`Ad recall study (mood × ad content). Select every effect this graph shows.`, fig:ADS([[4,4],[4,4]]), i:EFF(0,0,0),
e:`Every cell is the same. All marginal means equal, lines flat and on top of each other → {g:no effects at all}.`});

Q({t:`pick`, k:`Reading graphs`, q:`Sentencing study. Select every effect this graph shows.`, fig:SENT([[1,5],[5,9]]), i:EFF(1,1,0),
e:`A: Alcohol averages 3, Marijuana 7 → {g:main effect of A}. B: Age 20 line averages 3, Age 50 averages 7 → {g:main effect of B}. Lines are parallel → {r:no interaction}.`});

Q({t:`pick`, k:`Reading graphs`, q:`Ad recall study. Select every effect this graph shows.`, fig:ADS([[1,1],[7,7]]), i:EFF(0,1,0),
e:`Both lines are flat, so A's levels average the same (4 and 4) → {r:no main effect of A}. Serious ads (7) beat humorous (1) → {g:main effect of B}. Parallel → {r:no interaction}.`});

Q({t:`pick`, k:`Reading graphs`, q:`Sentencing study. Select every effect this graph shows.`, fig:SENT([[1,9],[5,5]]), i:EFF(1,0,1),
e:`A: Alcohol averages (1+5)/2 = 3, Marijuana (9+5)/2 = 7 → {g:main effect of A}. B: each line averages 5 → {r:no main effect of B}. Lines aren't parallel → {g:interaction}: offence type matters for 20-year-olds but not for 50-year-olds.`});

Q({t:`pick`, k:`Reading graphs`, q:`Ad recall study. Select every effect this graph shows.`, fig:ADS([[1,7],[1,1]]), i:EFF(1,1,1),
e:`A: Happy averages 1, Sad averages 4 → {g:A}. B: Humorous averages 4, Serious 1 → {g:B}. Not parallel → {g:interaction}. One cell (Sad + humorous) does all the work.`});

Q({t:`pick`, k:`Reading graphs`, q:`Sentencing study. Select every effect this graph shows.`, fig:SENT([[1,9],[9,1]]), i:EFF(0,0,1),
e:`The lines cross in an X. Every marginal mean is 5, so {r:no main effects}. But the effect of offence {g:reverses} by age: a pure {g:crossover interaction}. Main effects can hide a strong interaction.`});

Q({t:`pick`, k:`Reading graphs`, q:`Ad recall study. Select every effect this graph shows.`, fig:ADS([[4,7],[4,1]]), i:EFF(0,1,1),
e:`A: Happy averages 4, Sad averages 4 → {r:no main effect of A}. B: Humorous averages 5.5, Serious 2.5 → {g:main effect of B}. Lines fan apart → {g:interaction}: mood has opposite effects on the two ad types.`});

Q({k:`Reading graphs`, q:`What's the quickest way to spot an interaction on a line graph?`,
c:`Check whether the lines are parallel; if they're not, there's an interaction`,
x:[[`Check whether either line slopes upward from left to right`,`A sloping line can come with or without an interaction.`],
[`Check whether the two lines touch or overlap with each other anywhere on the graph`,`Overlapping parallel lines still mean no interaction.`],
[`Check whether the highest point sits above the midpoint of the axis`,`Height alone says nothing about interaction.`],
[`Check whether the y-axis starts at zero instead of a higher value`,`Axis starting points don't create interactions.`]],
e:`{g:Non-parallel lines = interaction}. For main effects, the {g:marginal means in a table} are easiest: average the two points above each x-axis label (A), and average each line (B).`});

Q({t:`hot`, k:`Reading graphs`, q:`In this ad recall graph, click the single cell (point) that creates the interaction.`, fig:ADS([[1,7],[1,1]]), a:`p01`,
why:{p00:`Happy + humorous sits at 1, the same as two other cells.`, p10:`Happy + serious sits at 1, like most cells.`, p11:`Sad + serious sits at 1 too.`},
e:`Three cells sit at 1; only {g:sad video + humorous ads} jumps to 7. That one cell makes the lines diverge (an interaction) and also creates both main effects.`});

Q({k:`Reading graphs`, q:`In the sentencing graph with lines crossing in an X (Age 20: 1 → 9; Age 50: 9 → 1), why are there no main effects?`,
c:`Every marginal mean is 5, so averaging hides the opposite effects`,
x:[[`Because the lines cross, the main effects are always significant and large`,`Crossing lines often cancel out the main effects.`],
[`Because the sample size is too small to see them`,`This is about the pattern of means, not sample size.`],
[`Because main effects only exist in 2 × 3 designs`,`Main effects exist in any factorial design.`],
[`Because interactions and main effects can't coexist`,`They can coexist; they just don't here.`]],
e:`A main effect averages across the other IV. Here the effects {g:cancel out} (5 = 5). That's why you must look at {g:cell means}, not just marginal means, whenever there's an interaction.`});

Q({k:`Reading graphs`, q:`When should results be shown as a line graph rather than a bar graph?`,
c:`When the x-axis variable is quantitative, with increasing amounts`,
x:[[`When the x-axis variable is nominal, like different types of therapy`,`Nominal categories usually get bar graphs.`],
[`Whenever the results show an interaction between the two IVs`,`Interactions can be shown with either.`],
[`Whenever the design has exactly two independent variables`,`The choice depends on the x-axis variable's type.`],
[`When the dependent variable is categorical rather than numeric`,`DVs plotted this way are usually quantitative.`]],
e:`{g:Line graph} → x-axis is {g:quantitative/continuous} (anxiety low → high, ms of time). {g:Bar graph} → x-axis is {g:nominal} categories (therapy type A vs B).`});

Q({tr:1, k:`Moderators`, q:`Is there a moderating variable in this figure?`,
fig:{k:`ix`, x:[`Condition 1`,`Condition 2`], l:[`Group A`,`Group B`], m:[[2,6],[4,8]], max:10, y:`Outcome`},
c:`No: the lines are parallel, so there's no interaction`,
x:[[`Yes: Group B is always higher than Group A in both conditions`,`That's a main effect of group, not moderation.`],
[`Yes: both lines slope upward`,`Equal slopes mean the effect doesn't depend on group.`],
[`Yes: there are two groups, so one must moderate`,`Having two groups doesn't create moderation.`],
[`It can't be told without the marginal means`,`Parallel lines are enough to say no interaction.`]],
e:`"Is there a moderator?" is another way of asking "{g:Is there an interaction?}" Parallel lines → {r:no interaction} → no moderator, even though both main effects are present.`});

Q({tr:1, k:`Moderators`, q:`Is there a moderating variable in this figure?`,
fig:{k:`ix`, x:[`Condition 1`,`Condition 2`], l:[`Group A`,`Group B`], m:[[2,8],[4,4]], max:10, y:`Outcome`},
c:`Yes: there's an interaction, so each variable moderates the other`,
x:[[`No: one line is completely flat, so nothing is really happening`,`A flat line next to a sloped one is exactly an interaction.`],
[`No: moderators only show up as main effects`,`Moderators show up as interactions.`],
[`Yes, but only the x-axis variable can be the moderator`,`Technically each variable moderates the other.`],
[`No: the two lines never actually cross, so there's no interaction`,`Lines don't need to cross; they just need to be non-parallel.`]],
e:`Non-parallel = {g:interaction} = moderation. Technically there are {g:two} moderating variables: each one moderates the effect of the other.`});

Q({k:`Simple main effects`, q:`What is a {k:simple main effect}?`,
c:`The effect of one IV at one specific level of the other IV`,
x:[[`The overall effect of one IV, averaged across the other`,`That's a main effect.`],
[`The effect of a participant variable on the DV`,`PVs can have main effects too; that's not the definition.`],
[`An effect so small it isn't worth reporting`,`"Simple" here means "at one level," not small.`],
[`The interaction of three or more IVs`,`That's a higher-order interaction.`]],
e:`Main effect = {r:average across} the other IV. Simple main effect = {g:within each level} of the other IV. You use simple main effects to {g:break down a significant interaction}.`});

Q({k:`Simple main effects`, q:`For the M&M study, what do the simple main effects of confederate intake show?`,
fig:{k:`tbl`, rl:`Confederate intake`, cl:`Sociability`, r:[`Low`,`High`], c:[`Sociable`,`Unsociable`], m:[[6.58,2.14],[5.68,10.63]]},
c:`Intake matters when the confederate is unsociable (2.14 vs 10.63), not when sociable`,
x:[[`Intake matters when the confederate is sociable (6.58 vs 5.68), not when unsociable`,`6.58 vs 5.68 is the small, non-significant difference.`],
[`Intake matters equally at both levels of sociability`,`The two differences are very different sizes.`],
[`Sociability matters at both levels of intake equally`,`That's a different set of simple effects, and it's not equal either.`],
[`There are no simple main effects without main effects`,`Simple effects can exist regardless of main effects.`]],
e:`Simple main effect of intake within {g:unsociable}: 2.14 → 10.63 (significant). Within {r:sociable}: 6.58 → 5.68 (not significant). You pick which set of simple effects to test based on your {g:predictions}.`});

Q({k:`Simple main effects`, lv:`hard`, q:`After finding a significant interaction, should you analyze BOTH sets of simple main effects (intake within sociability AND sociability within intake)?`,
c:`No: they overlap, so choose the one that matches your predictions`,
x:[[`Yes: always test both and report whichever is significant`,`That cherry-picks results.`],
[`Yes: you need both sets before any interaction can be reported at all`,`One set breaks down the interaction.`],
[`No: simple main effects are only for 2 × 3 designs`,`They apply to any factorial with an interaction.`],
[`No: you analyze only the main effects instead`,`A significant interaction must be decomposed.`]],
e:`The analyses {g:overlap}, so choose {g:one} based on the predictions you made when designing the study. The key rule: a significant interaction must be broken down with simple main effects.`});

Q({k:`IV × PV`, q:`Prison inmates (psychopathic or not) told a true story and a lie while researchers counted head movements. Results look like this. What's the right summary?`,
fig:{k:`ix`, bar:true, x:[`Non-psychopathic`,`Psychopathic`], l:[`Truth`,`Lie`], m:[[4,3.6],[4.5,10.2]], max:12, y:`Head movements / 100 s`},
c:`Lying increased head movements mainly for psychopathic inmates`,
x:[[`Lying increased head movements by about the same amount for both groups`,`Non-psychopathic inmates barely changed.`],
[`Psychopathy causes people to move their heads more`,`Psychopathy is a participant variable; no causal claim.`],
[`Non-psychopathic inmates moved more when lying`,`Their truth and lie bars are almost equal.`],
[`Story type had no effect on head movements`,`There's a main effect of story overall.`]],
e:`Main effect of story (lies → more movement overall), {g:qualified by an interaction}: only {g:psychopathic} inmates moved much more when lying. So head movements aren't a great lie cue, unless the person is a psychopath.`});

Q({k:`IV × PV`, q:`In the psychopathy study, which variable is the participant variable, and what kind of design is it?`,
c:`Psychopathy diagnosis; a mixed design (diagnosis between, story within)`,
x:[[`Story type; a between-subjects design with diagnosis as the DV`,`Story type was manipulated, and everyone told both stories.`],
[`Head movements; a within-subjects design`,`Head movements are the DV.`],
[`Psychopathy diagnosis; a completely within-subjects design for both IVs`,`Nobody can be in both diagnosis groups.`],
[`Story type; a matched-pairs design`,`Neither fits.`]],
e:`Diagnosis is brought in ({g:PV}, necessarily {g:between}). Everyone told a truth and a lie ({g:within}). Between + within = {g:mixed factorial}.`});

Q({k:`IV × PV`, q:`Why is an IV × PV design not a true experiment?`,
c:`The participant variable is measured, not manipulated or randomly assigned`,
x:[[`It has more than one independent variable, so it can't be an experiment`,`Factorial experiments have several IVs and can be true experiments.`],
[`It can't include a dependent variable alongside a participant variable`,`It includes a DV.`],
[`It always uses a within-subjects design for the participant variable`,`It can be between, within or mixed.`],
[`It's always run in the field, where experimental control is impossible`,`It can be run anywhere.`]],
e:`You can't randomly assign age, personality or a diagnosis. So you can make causal claims about the {g:manipulated IV}, but {r:never} about the PV. It's still great for learning how different people respond to the same manipulation.`});

Q({t:`hot`, k:`Assignment`, q:`You want 10 observations per cell in a 2 × 2 design. Click the design that needs exactly 20 people in total.`,
fig:{k:`cells`}, a:`mixed`,
why:{between:`Four different groups of 10 = 40 people.`, within:`The same 10 people do all four cells = 10 people.`},
e:`{g:Mixed}: A is between (10 people at A1, another 10 at A2) and B is within (each person does B1 and B2). 10 + 10 = {g:20}. Between = 40; within = 10.`});

Q({t:`fill`, k:`Assignment`, q:`A 3 × 3 design needs 15 participants in each condition. If it's completely between-subjects, how many different participants do you need? ___`,
a:[`135`],
e:`9 conditions × 15 people each = {g:135}. Completely within-subjects would need only {g:15}. Mixed (a 3-level between factor) would need 3 × 15 = {g:45}.`});

Q({t:`fill`, k:`Assignment`, q:`Same 3 × 3 design, 15 per condition, but now completely within-subjects. How many participants? ___`,
a:[`15`,`fifteen`],
e:`Everyone does all nine conditions, so {g:15} people give 15 observations per cell. That efficiency is a big reason to use within designs, if order effects can be handled.`});

Q({k:`Assignment`, q:`A 3 × 3 mixed design (first IV between-subjects, second within-subjects) needs 15 per condition. How many participants?`,
c:`45`,
x:[[`135`,`That's the completely between-subjects total.`],
[`15`,`That's the completely within-subjects total.`],
[`30`,`That would be a between factor with only two levels.`],
[`9`,`9 is the number of conditions, not people.`]],
e:`Three groups for the between factor × 15 each = {g:45}. Each of those people experiences all three levels of the within factor.`});

Q({k:`2 × 3 designs`, q:`Performance by task difficulty and anxiety. Which effects are present?`,
fig:{k:`tbl`, marg:true, rl:`Task difficulty`, cl:`Anxiety level`, r:[`Easy`,`Hard`], c:[`Low`,`Moderate`,`High`], m:[[4,7,10],[7,4,1]]},
c:`A main effect of difficulty and an interaction, but no main effect of anxiety`,
x:[[`A main effect of anxiety and an interaction, but no main effect of difficulty`,`Anxiety's marginal means are all 5.5.`],
[`Main effects of both, with no interaction`,`Anxiety helps on easy tasks and hurts on hard ones, so there is an interaction.`],
[`Only an interaction, with no main effects`,`Easy (7.0) beats hard (4.0), a main effect.`],
[`No effects, since the averages are equal`,`Only anxiety's averages are equal.`]],
e:`Difficulty: {g:7.0 vs 4.0}. Anxiety: {r:5.5, 5.5, 5.5} (no main effect). But anxiety {g:raises} performance on easy tasks (4 → 7 → 10) and {g:lowers} it on hard tasks (7 → 4 → 1): an {g:interaction}.`});

Q({t:`hot`, k:`2 × 3 designs`, q:`Click any marginal mean that shows there's NO main effect of anxiety.`,
fig:{k:`tbl`, hs:true, marg:true, rl:`Task difficulty`, cl:`Anxiety level`, r:[`Easy`,`Hard`], c:[`Low`,`Moderate`,`High`], m:[[4,7,10],[7,4,1]]},
a:[`mc0`,`mc1`,`mc2`],
why:{mr0:`That's a row mean (difficulty), which does differ.`, mr1:`That's a row mean (difficulty).`},
e:`The {g:column means} (5.5, 5.5, 5.5) belong to anxiety. All equal → {g:no main effect of anxiety}. The row means (7.0 vs 4.0) show the difficulty main effect.`});

Q({k:`2 × 3 designs`, q:`Here's the same anxiety × difficulty data as a line graph. Why is a line graph appropriate here?`,
fig:{k:`ix`, x:[`Low`,`Moderate`,`High`], l:[`Easy task`,`Hard task`], m:[[4,7,10],[7,4,1]], max:12, y:`Performance`, xl:`Anxiety level`},
c:`Anxiety on the x-axis is quantitative: increasing amounts`,
x:[[`Task difficulty is nominal, so it has to go on the x-axis instead`,`Difficulty is shown as the lines here.`],
[`Line graphs are required whenever there are three levels`,`Number of levels isn't the rule.`],
[`Bar graphs can't show interactions`,`They can.`],
[`The DV is nominal`,`Performance is quantitative.`]],
e:`Use a {g:line graph} when the x-axis IV has {g:increasing amounts} (low → moderate → high). The crossing lines make the interaction obvious.`});

Q({k:`Complex designs`, q:`A 2 × 2 × 2 study crosses instruction method (online vs face-to-face), class size (30 vs 80) and year (first vs fourth). Which is the participant variable?`,
c:`Year of university`,
x:[[`Instruction method`,`Method is manipulated.`],
[`Class size`,`Class size is manipulated.`],
[`Test performance`,`That's the DV.`],
[`None; all three are manipulated`,`You can't randomly assign someone's year of study.`]],
e:`{g:Year} is brought in by participants. The other two are manipulated. You can think of it as two 2 × 2 designs, one for first-years and one for fourth-years.`});

Q({k:`Complex designs`, q:`How many possible main effects and interactions are in a 2 × 2 × 2 design?`,
c:`3 main effects; 4 interactions (three two-way, one three-way)`,
x:[[`3 main effects; 3 interactions (three two-way, no three-way)`,`You're missing the three-way interaction.`],
[`2 main effects; 1 interaction (one two-way, no three-way)`,`That's a 2 × 2.`],
[`8 main effects; 8 interactions (one for each condition)`,`8 is the number of conditions.`],
[`3 main effects; 1 interaction (one three-way, no two-way)`,`There are three two-way interactions plus a three-way.`]],
e:`One main effect per IV = {g:3}. Interactions: A×B, A×C, B×C ({g:three two-way}) + A×B×C ({g:one three-way}) = {g:4}.`});

Q({k:`Complex designs`, lv:`hard`, q:`What does a three-way interaction mean?`,
c:`The way two IVs interact changes depending on the level of the third IV`,
x:[[`All three IVs have main effects that are about the same size`,`Main effects and interactions are separate.`],
[`Each IV interacts with exactly one of the other two IVs`,`That describes two-way interactions.`],
[`The three IVs are each measured three separate times in a within design`,`That's about repeated measures, not interactions.`],
[`One IV mediates the relationship between the other two IVs`,`Mediation is a different idea.`]],
e:`A {g:three-way interaction}: the A × B pattern {g:differs} across levels of C. These are complicated and less common than two-way interactions.`});

Q({k:`Counting`, q:`Participants read a story in 12- or 14-point font, in Calibri, Times New Roman or Arial, then take a memory test. Count the IVs, conditions, main effects and interactions.`,
c:`2 IVs, 6 conditions, 2 main effects, 1 interaction`,
x:[[`2 IVs, 5 conditions, 2 main effects, 1 interaction`,`Multiply, don't add: 2 × 3 = 6.`],
[`3 IVs, 6 conditions, 3 main effects, 3 interactions`,`Font size and font style are the only IVs.`],
[`2 IVs, 6 conditions, 2 main effects, 2 interactions`,`Two IVs give only one interaction.`],
[`1 IV, 6 conditions, 1 main effect, 0 interactions`,`Size and style are separate IVs.`]],
e:`Font size (2) × font style (3) = {g:2 IVs}, {g:6 conditions}, {g:2 main effects}, {g:1 interaction}.`});

Q({k:`Counting`, q:`Jurors read about a crime by an attractive or unattractive woman or man, described as overweight or average weight. Count the IVs, conditions, main effects and interactions.`,
c:`3 IVs, 8 conditions, 3 main effects, 4 interactions`,
x:[[`3 IVs, 6 conditions, 3 main effects, 3 interactions`,`2 × 2 × 2 = 8, and there's also a three-way interaction.`],
[`2 IVs, 4 conditions, 2 main effects, 1 interaction`,`Gender, attractiveness and weight are three IVs.`],
[`3 IVs, 8 conditions, 3 main effects, 1 interaction`,`Three two-way interactions plus one three-way.`],
[`4 IVs, 16 conditions, 4 main effects, 11 interactions`,`There are only three IVs.`]],
e:`Gender × attractiveness × weight = {g:3 IVs}, {g:8 conditions}, {g:3 main effects}, {g:4 interactions} (3 two-way + 1 three-way).`});

Q({k:`Counting`, lv:`warm`, q:`What two pieces of information do you need to find the number of conditions in a factorial design?`,
c:`The number of IVs and the number of levels of each`,
x:[[`The number of participants and the number of DVs`,`Neither tells you how many cells there are.`],
[`The number of DVs and the number of levels of each`,`DVs don't create conditions.`],
[`The sample size and the effect size`,`Those relate to power, not conditions.`],
[`Whether it's between or within, and the sample size`,`Design type affects people needed, not conditions.`]],
e:`Multiply the {g:levels of each IV}: a 2 × 3 has 6 cells; a 3 × 3 has 9; a 2 × 2 × 3 has 12.`});

Q({k:`Hand gesture study`, q:`While reading about an ambiguous man, participants extended their middle finger or index finger, then rated his aggressive traits and unrelated traits. Which describes the design?`,
c:`2 × 2 mixed: finger is between-subjects, trait type is within-subjects`,
x:[[`2 × 2 between: finger and trait type each assigned to different people`,`Everyone rated both trait types.`],
[`2 × 2 within: everyone did both finger gestures`,`Each person did one gesture.`],
[`One IV with four levels`,`Finger and trait type are two separate factors.`],
[`IV × PV: finger is a participant variable`,`Finger gesture was manipulated.`]],
e:`Finger gesture = manipulated, {g:between}. Trait type (aggressive vs unrelated) = rated by everyone, {g:within}. That's a {g:2 × 2 mixed design} with four conditions.`});

Q({k:`Hand gesture study`, q:`Mean ratings: middle finger, aggressive 8.41; middle finger, unrelated 6.61; index finger, aggressive 6.74; index finger, unrelated 6.38. What's the best description?`,
fig:{k:`ix`, x:[`Middle finger`,`Index finger`], l:[`Aggressive traits`,`Unrelated traits`], m:[[8.41,6.74],[6.61,6.38]], min:5, max:9, y:`Trait rating`, vals:true},
c:`An interaction: the middle finger raised aggressive ratings specifically`,
x:[[`No interaction: the middle finger raised all of the trait ratings equally`,`Unrelated traits barely moved (6.61 vs 6.38).`],
[`Only a main effect of trait type`,`Finger matters too, but mainly for aggressive traits.`],
[`The index finger raised aggressive ratings the most`,`Middle finger + aggressive (8.41) is highest.`],
[`No effects; all ratings are around 6–8`,`The 8.41 cell clearly stands out.`]],
e:`The finger effect is big for {g:aggressive traits} (8.41 vs 6.74) and tiny for {r:unrelated traits} (6.61 vs 6.38). Non-parallel → {g:interaction}. The gesture {g:primed hostility} specifically.`});

Q({k:`Interpreting results`, q:`Participants waited 20 minutes either thinking or checking the news, in either an empty lit room or a dark tent, then rated enjoyment. Results look like this. What's the takeaway?`,
fig:{k:`ix`, x:[`Think`,`News`], l:[`Empty room`,`Dark tent`], m:[[2.8,6.4],[5.6,6.7]], min:1, max:9, y:`Enjoyment`, xl:`Waiting activity`},
c:`The dark tent made thinking much more enjoyable but barely changed the news`,
x:[[`The tent made both activities more enjoyable by about the same amount`,`The gap is big for thinking and small for news.`],
[`Thinking was always more enjoyable than checking the news, in both settings`,`Thinking was lower in both settings.`],
[`Setting had no effect on enjoyment`,`The tent clearly helped thinking.`],
[`The news was more enjoyable in the empty room`,`News was about the same in both settings.`]],
e:`Lines aren't parallel → {g:interaction}. The setting {g:moderates} how enjoyable thinking is; news stays enjoyable either way.`});

Q({t:`match`, k:`Mediator vs moderator`, q:`Match each term to its description.`,
p:[[`Mediator`,`Explains how or why: the IV changes it, and it changes the DV`],
[`Moderator`,`Changes when or for whom: shows up as an interaction`],
[`Third variable`,`Causes both of two correlated variables`],
[`Confound`,`Travels with the IV by accident and could explain the DV`]],
e:`{g:Mediator} = process (IV → M → DV), linked to the {g:explanation} goal. {g:Moderator} = "it depends" (interaction). Don't mix them up.`});

Q({t:`hot`, k:`Mediator vs moderator`, q:`This diagram shows a moderator. Click it.`,
fig:{k:`causal`, ty:`mod`, a:`Time (SOA)`, b:`Racial bias`, c:`Motivation`}, a:`c`,
why:{a:`Time is the IV whose effect gets moderated.`, b:`Racial bias is the DV.`},
e:`A {g:moderator} points at the {g:arrow} between IV and DV, changing the relationship's strength or direction. Motivation changed whether time reduced bias.`});

Q({t:`hot`, k:`Mediator vs moderator`, q:`This diagram shows a mediator. Click it.`,
fig:{k:`causal`, ty:`med`, a:`Soft music`, b:`Exam score`, c:`Test anxiety`}, a:`c`,
why:{a:`Soft music is the IV.`, b:`Exam score is the DV.`},
e:`A {g:mediator} sits {g:between}: music lowers test anxiety, and lower anxiety raises scores. It's the "how" of the effect.`});

Q({k:`Mediator vs moderator`, lv:`hard`, q:`High motivation: more time → less bias. Low motivation: time has no effect. What role does motivation play?`,
c:`Moderator: it changes the relationship between time and bias`,
x:[[`Mediator: time changes people's motivation, which then changes their bias`,`Time didn't change motivation; motivation changed time's effect.`],
[`Confound: it varies with time by accident`,`It's measured on purpose as a second variable.`],
[`Third variable: it causes both time and bias`,`Time is manipulated, so nothing else causes it.`],
[`Dependent variable: it's the outcome being measured`,`Bias is the DV.`]],
e:`Motivation changed {g:whether} time mattered: a {g:moderator}, revealed by the interaction. For a mediator, time would have to change motivation, which would then change bias.`});

Q({t:`cloze`, k:`Reading graphs`, q:`Build the explanation of how to read a 2 × 2 line graph.`,
txt:`First, check whether the lines are [[parallel]]. If they aren't, there's an [[interaction]]. Next, for the x-axis factor, average the two points above each x-axis level and compare. For the line factor, average each [[line]] and compare. Comparing these [[marginal]] means tells you about the main effects. If there's an interaction, break it down with simple main [[effects]].`,
d:[`crossing`,`mediator`,`cell`],
e:`Lines first (interaction), then {g:marginal means} (main effects), then {g:simple main effects} to explain any interaction.`});

Q({t:`pick`, k:`IV × PV`, q:`You need to write up the psychopathy head-movement results. Select every point a strong answer includes.`,
i:[[`There was a main effect of story: more head movements when lying overall`,1],
[`The main effect was qualified by an interaction with diagnosis`,1],
[`Only psychopathic inmates moved their heads much more when lying`,1],
[`We can't claim psychopathy causes head movements, since it's a PV`,1],
[`Psychopathy was randomly assigned, so causal claims are fine`,0,`Diagnosis can't be randomly assigned.`],
[`Head movements are a reliable lie cue for everyone`,0,`For non-psychopathic inmates, head movements barely changed.`]],
e:`Main effect → qualified by interaction → describe the simple pattern → note the {g:PV limits causal claims}. That's the shape of a strong written answer.`});

S(6);

/* =========================================================
   WHY SPECIAL DESIGNS
   ========================================================= */
Q({k:`Why special designs`, lv:`warm`, q:`When does a study count as a {k:true experiment}?`,
c:`The IV is manipulated, people are randomly assigned, and other variables are held constant`,
x:[[`The study measures two variables carefully and finds a strong correlation between them`,`That's a correlational (non-experimental) study.`],
[`The study takes place in a laboratory, so the setting and the procedure are tightly controlled`,`A lab setting alone isn't enough; you need manipulation and random assignment.`],
[`The study has a large sample, so its results are statistically reliable`,`Sample size doesn't make a design experimental.`],
[`The study compares groups that already differ in some way, such as two schools or two provinces`,`Comparing existing groups is a quasi-experiment.`]],
e:`True experiment = {g:manipulated IV} + {g:random assignment} + {g:everything else held constant}, with no threats to internal validity. That combo is what earns a {g:causal} claim.`});

Q({t:`match`, k:`Why special designs`, lv:`warm`, q:`Three families of special designs. Match each one to the situation it was built for.`,
p:[[`Single case experimental design`,`Only one appropriate participant is available`],
[`Quasi-experimental design`,`Random assignment isn't possible (e.g., cultural background)`],
[`Developmental design`,`You want to study how people change with age`]],
e:`Each one bends the basic experiment to fit real life. The more a design departs from a true experiment, the less it can support {r:causal claims}, but often it's the {g:only design possible}.`});

Q({k:`Why special designs`, lv:`hard`, q:`Why might there be more real-world situations that call for quasi-experiments than for true experiments?`,
c:`True experiments mostly happen in controlled labs, and most of life isn't a lab`,
x:[[`Quasi-experiments give stronger causal evidence, so researchers prefer to use them whenever possible`,`They give weaker causal evidence.`],
[`True experiments are banned outside of universities by ethics boards`,`They aren't banned; they're just often impractical or unethical.`],
[`Quasi-experiments don't need any dependent variable to be measured`,`They still measure outcomes.`],
[`Random assignment only works with very small samples, which real-world studies rarely have`,`Random assignment works with any sample size.`]],
e:`Labs are rare compared to schools, workplaces and whole communities. Out there you often {r:can't randomly assign}, so quasi designs are frequently the {g:best available tool}.`});

/* =========================================================
   PROGRAM EVALUATION (LO1)
   ========================================================= */
Q({k:`Program evaluation`, lv:`warm`, q:`What is {k:program evaluation} research?`,
c:`Research on programs meant to have a positive effect on a group of people`,
x:[[`Research that builds new theories about basic mental processes in the lab`,`That's basic research.`],
[`A statistical method that combines the results of many past studies`,`That's meta-analysis.`],
[`A review of a research article done by experts before it is published`,`That's peer review.`],
[`A way of checking that a measure gives the same score twice`,`That's test-retest reliability.`]],
e:`{g:Program evaluation} studies programs run in schools, workplaces or communities to see if they help. It's {g:applied research}, and it often has to use {g:quasi-experimental} designs.`});

Q({k:`Program evaluation`, q:`The "At My Best" program teaches primary school kids healthy diet and activity choices. It started in 39 schools in 2008 and is now in over 1,000 schools across Canada. What's worrying about that?`,
c:`It spread widely before any published research showed whether it works`,
x:[[`It's delivered by classroom teachers instead of trained research psychologists`,`Teachers delivering it isn't the concern.`],
[`It was piloted in too many schools for a fair evaluation`,`39 schools is a reasonable pilot.`],
[`It targets children, who can't legally take part in research`,`Children can take part with consent from parents.`],
[`It focuses on obesity, which can't be measured in any reliable or valid way in children`,`Health outcomes can be measured.`]],
e:`Without published evidence on {g:short-term and long-term impacts}, schools are adopting it on faith. That's exactly what {g:outcome evaluation} is for.`});

Q({k:`Program evaluation`, q:`Donald Campbell (1969) urged a "culture of evaluation," where every program is tested. What was the first focus of evaluation research?`,
c:`Outcome evaluation: did the program produce the result it was designed for?`,
x:[[`Needs assessment: which problems most need to be fixed in a particular target population?`,`That's now the first step in the sequence, but it wasn't the original focus.`],
[`Efficiency assessment: was the cost of the program worth the result?`,`That came later, once effects are shown.`],
[`Process evaluation: was the program run the way it was planned?`,`That broadened the field later.`],
[`Program theory assessment: is the program's logic about the causes of the problem sound?`,`That was added as the field broadened.`]],
e:`It started with {g:outcome evaluation}. Over time the field broadened into {g:five} kinds of questions (Rossi et al., 2004).`});

Q({t:`order`, k:`Program evaluation`, rq:`12.4`, q:`Put the five types of program evaluation in the order they usually happen.`,
i:[`Needs assessment`,`Program theory assessment`,`Process evaluation`,`Outcome evaluation`,`Efficiency assessment`],
e:`Think of building a bridge: {g:Is a bridge needed?} → {g:Will this design work?} → {g:Is it being built as planned?} → {g:Does it carry traffic?} → {g:Was it worth the money?} Which questions get emphasis depends on the evaluation's purpose.`});

Q({t:`match`, k:`Program evaluation`, rq:`12.4`, q:`Match each type of program evaluation to the question it answers.`,
