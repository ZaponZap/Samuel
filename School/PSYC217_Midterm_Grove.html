<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Midterm Grove</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233B7A4E'/%3E%3Crect x='29.5' y='33' width='5' height='19' rx='2.5' fill='%23E9F3E6'/%3E%3Ccircle cx='32' cy='25' r='14' fill='%23E9F3E6'/%3E%3Ccircle cx='22.5' cy='33' r='8' fill='%23E9F3E6'/%3E%3Ccircle cx='41.5' cy='33' r='8' fill='%23E9F3E6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Coming+Soon&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column, like a field notebook; cards sit on a sage ground, trees mark progress. */
:root {
  --bg: #EBF1E7; --paper: #F7FAF4; --surface: #FFFFFF; --ink: #1E2C23; --ink2: #44574B; --muted: #6E8174;
  --line: #D2DDCD; --line-strong: #A9BBA7; --track: #DCE6D8; --tint: #E3EEE0; --hl: #4A7A5726;
  --moss: #46775A; --moss-strong: #2F5A3E; --on-moss: #F5FAF2;
  --leaf: #2C7F4B; --leaf-bg: #D9EEDD; --leaf-ink: #1D5E36;
  --clay: #B3473E; --clay-bg: #F6DFDA; --clay-ink: #8E2F28;
  --amber: #C88838; --sap: #94C28F; --tree: #3A7A4D; --seed: #C1AF8C; --bark: #8C7457; --fog: #CFD8CC;
  --f-body: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-hand: 'Coming Soon', 'Comic Sans MS', 'Chalkboard SE', cursive;
  --r: 18px;
  --sky1: #F5F2E2; --sky2: #EDF2E7; --sun: #F7E1A6; --sun-glow: rgba(247, 215, 140, .36); --moon: 0;
  --hill-far: #DFE9D9; --tree-far: #D1DFCA; --hill-near: #D6E4CF; --tree-near: #C3D7BA; --star-op: 0;
  --cloud: rgba(255, 255, 255, .8); --cloud-op: 1; --bar: rgba(235, 241, 231, .86); --glow: rgba(44, 127, 75, .30); --shine: rgba(255, 255, 255, .7);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1511; --paper: #141E18; --surface: #19251E; --ink: #E0EBE2; --ink2: #B1C2B6; --muted: #7F9387;
  --line: #26352C; --line-strong: #3E5245; --track: #213027; --tint: #1D2C23; --hl: #86BE9430;
  --moss: #86BE94; --moss-strong: #A8D6B3; --on-moss: #0E1511;
  --leaf: #7BCB95; --leaf-bg: #183123; --leaf-ink: #A6E2B8;
  --clay: #EC8B7F; --clay-bg: #3B201C; --clay-ink: #F6B3AA;
  --amber: #DDA664; --sap: #6E9F73; --tree: #74C28B; --seed: #8D7F64; --bark: #8A7558; --fog: #33443A;
  --sky1: #08100C; --sky2: #0C1510; --sun: #DCE7DD; --sun-glow: rgba(170, 210, 185, .12); --moon: 1;
  --hill-far: #111C16; --tree-far: #15231B; --hill-near: #14201A; --tree-near: #1A2B21; --star-op: .8;
  --cloud: rgba(170, 200, 180, .06); --cloud-op: .6; --bar: rgba(14, 21, 17, .86); --glow: rgba(123, 203, 149, .28); --shine: rgba(255, 255, 255, .10);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1511; --paper: #141E18; --surface: #19251E; --ink: #E0EBE2; --ink2: #B1C2B6; --muted: #7F9387;
  --line: #26352C; --line-strong: #3E5245; --track: #213027; --tint: #1D2C23; --hl: #86BE9430;
  --moss: #86BE94; --moss-strong: #A8D6B3; --on-moss: #0E1511;
  --leaf: #7BCB95; --leaf-bg: #183123; --leaf-ink: #A6E2B8;
  --clay: #EC8B7F; --clay-bg: #3B201C; --clay-ink: #F6B3AA;
  --amber: #DDA664; --sap: #6E9F73; --tree: #74C28B; --seed: #8D7F64; --bark: #8A7558; --fog: #33443A;
  --sky1: #08100C; --sky2: #0C1510; --sun: #DCE7DD; --sun-glow: rgba(170, 210, 185, .12); --moon: 1;
  --hill-far: #111C16; --tree-far: #15231B; --hill-near: #14201A; --tree-near: #1A2B21; --star-op: .8;
  --cloud: rgba(170, 200, 180, .06); --cloud-op: .6; --bar: rgba(14, 21, 17, .86); --glow: rgba(123, 203, 149, .28); --shine: rgba(255, 255, 255, .10);
  color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 56px; display: flex; flex-direction: column; gap: 18px; }
#app { display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--moss); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* hero */
.hero { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
.brand { display: flex; gap: 14px; align-items: center; }
.tr.brand-tree { width: 46px; height: 56px; flex: none; }
.hero h1 { font-family: var(--f-hand); font-size: clamp(2rem, 6vw, 2.7rem); font-weight: 400; line-height: 1.05; color: var(--moss-strong); letter-spacing: .01em; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
.countdown { margin: 0; align-self: flex-start; font-family: var(--f-hand); font-size: 1rem; color: var(--ink2); background: var(--tint); padding: 3px 12px; border-radius: 999px; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.eyebrow-h, .eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; margin: 0; }
.grove-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.grove h2 { font-family: var(--f-hand); font-weight: 400; font-size: 1.5rem; color: var(--ink); }
.pct { margin: 0; color: var(--ink2); font-variant-numeric: tabular-nums; }
.pct b { font-size: 1.25rem; color: var(--moss-strong); }

/* progress bars */
.bar { display: flex; height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; width: 100%; }
.bar i { display: block; height: 100%; transition: width .5s ease; }
.bar-big { height: 18px; }
.b3 { background: var(--tree); } .b2 { background: var(--sap); } .b1 { background: var(--amber); }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .88rem; color: var(--ink2); }
.legend li { display: flex; align-items: center; gap: 6px; }
.legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
.legend .tr { width: 16px; height: 19px; }

/* trees */
.tr { width: 13px; height: 16px; display: inline-block; vertical-align: middle; }
.tr-seed { color: var(--seed); } .tr-sprout { color: var(--amber); } .tr-small { color: var(--sap); } .tr-big { color: var(--tree); }
.tg { stroke: var(--line-strong); stroke-width: 1.2; stroke-linecap: round; }
.tk { fill: var(--bark); }
.forest { display: flex; flex-wrap: wrap; gap: 1px 2px; padding: 4px 0 2px; }
.forest.big .tr { width: 22px; height: 27px; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { appearance: none; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 10px 18px; border-radius: 999px; font-weight: 600; cursor: pointer; transition: transform .12s ease, background .15s ease; }
.btn:hover:not(:disabled) { background: var(--tint); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--moss); border-color: var(--moss); color: var(--on-moss); }
.btn.primary:hover:not(:disabled) { background: var(--moss-strong); border-color: var(--moss-strong); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* sections list */
.sections { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.sec { display: grid; grid-template-columns: 44px 1fr 18px; gap: 12px; align-items: center; text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; cursor: pointer; transition: background .15s, border-color .15s; }
.sec:hover { background: var(--surface); border-color: var(--line-strong); }
.sec-n { font-family: var(--f-hand); font-size: 1.9rem; color: var(--moss); text-align: center; line-height: 1; }
.sec-b { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sec-t { font-weight: 600; font-size: 1.04rem; }
.sec-m, .sec-c { font-size: .84rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sec-go { font-size: 1.5rem; color: var(--muted); }

/* footer settings */
.foot { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; padding-top: 18px; border-top: 1px dashed var(--line-strong); }
.foot-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.foot-l { font-size: .9rem; color: var(--ink2); }
.segs { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { border: 1.5px solid var(--line-strong); background: transparent; border-radius: 999px; padding: 6px 14px; font-size: .88rem; cursor: pointer; }
.seg.on { background: var(--moss); border-color: var(--moss); color: var(--on-moss); }
.seg.danger { border-color: var(--clay); color: var(--clay); }
.seg.danger:hover { background: var(--clay); color: var(--surface); }
.warn { color: var(--clay); font-size: .9rem; }
.note { margin: 0; font-size: .82rem; color: var(--muted); }
.size { border-top: 1px solid var(--line); padding-top: 12px; }
.top-sp { flex: 1; }
.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.segs.tight { gap: 4px; flex-wrap: nowrap; }
.seg.mini { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; font-size: .84rem; }
.ti { width: 16px; height: 16px; flex: none; }
.seg.on .ic { fill: var(--on-moss); } .seg.on .ic-l { stroke: var(--on-moss); }
.icon-btn .ti { width: 19px; height: 19px; }
.terms-h { margin: 14px 0 6px; font-weight: 600; color: var(--ink2); font-size: .92rem; }
.los ul.terms { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: row; flex-wrap: wrap; gap: 6px; }
.terms li { font-size: .82rem; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--ink2); }
@media (max-width: 480px) { .seg.mini span { display: none; } .seg.mini { padding: 6px 9px; } }

/* bonus: kept visually apart from the seven graded sections */
.sec.sec-bonus { border-style: dashed; border-color: var(--amber); }
.sec-bonus .sec-n { color: var(--amber); font-size: 1.6rem; }
.bonus-flag { align-self: flex-start; font-size: .74rem; font-weight: 600; letter-spacing: .02em; color: var(--ink2); background: var(--surface); border: 1px dashed var(--amber); border-radius: 999px; padding: 1px 9px; }
.bonus-note { margin: 0; color: var(--ink2); font-size: .95rem; max-width: 60ch; }
.tag-bonus { background: transparent; border: 1px dashed var(--amber); color: var(--ink); }

/* section page */
.top { display: flex; align-items: center; gap: 12px; }
.back { border: none; background: none; padding: 6px 2px; color: var(--ink2); font-weight: 600; cursor: pointer; }
.back:hover { color: var(--moss-strong); }
.sec-head { display: flex; flex-direction: column; gap: 4px; }
.sec-head h1, .end h1 { font-family: var(--f-hand); font-weight: 400; font-size: clamp(1.7rem, 5vw, 2.2rem); color: var(--moss-strong); line-height: 1.15; }
.los summary { cursor: pointer; font-weight: 600; color: var(--ink2); }
.los ul { margin: 0; padding-left: 20px; color: var(--ink2); display: flex; flex-direction: column; gap: 4px; font-size: .95rem; }
.done-msg { margin: 0; color: var(--leaf); font-weight: 600; }

/* quiz */
.quiz-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); padding: 8px 12px; margin-top: -8px; border-radius: 0 0 16px 16px; }
.rbar { flex: 1; display: flex; gap: 3px; height: 10px; min-width: 0; }
.rbar.dense { gap: 0; border-radius: 999px; overflow: hidden; background: var(--track); }
.rs { flex: 1; min-width: 0; border-radius: 999px; background: var(--track); transition: background .35s ease; }
.rbar.dense .rs { border-radius: 0; }
.rs.t3 { background: var(--tree); } .rs.t2 { background: var(--sap); } .rs.t1 { background: var(--amber); }
.rs.now { background: var(--track); box-shadow: inset 0 0 0 2px var(--moss); animation: now-pulse 1.8s ease-in-out infinite; }
@keyframes now-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
.qbar { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.qcount { font-size: .84rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.icon-btn { border: 1.5px solid var(--line); background: var(--paper); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.ic { fill: var(--ink2); } .ic-l { fill: none; stroke: var(--ink2); stroke-width: 1.8; stroke-linecap: round; }
.qcard { padding: 22px; gap: 16px; }
.chips-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font-size: .74rem; padding: 2px 9px; border-radius: 999px; background: var(--tint); color: var(--ink2); font-weight: 600; letter-spacing: .02em; }
.tag-sec { background: transparent; border: 1px solid var(--line-strong); }
.tag-warm { background: var(--leaf-bg); color: var(--leaf-ink); }
.tag-hard { background: var(--clay-bg); color: var(--clay-ink); }
.tag-tr { font-family: var(--f-hand); font-weight: 400; background: var(--surface); border: 1px dashed var(--amber); color: var(--ink); }
.tag-type { background: transparent; color: var(--muted); }
.tag-rq { background: var(--surface); border: 1px solid var(--moss); color: var(--moss-strong); }
.tag-tree { margin-left: auto; } .tag-tree .tr { width: 18px; height: 22px; }
.stem { font-size: clamp(1.06rem, 2.6vw, 1.2rem); font-weight: 500; line-height: 1.5; color: var(--ink); }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--moss); color: var(--muted); font-family: var(--f-hand); padding: 0 .2em; letter-spacing: .04em; }
.blank.filled.ok { color: var(--leaf-ink); background: var(--leaf-bg); border-color: var(--leaf); border-radius: 4px 4px 0 0; }
.blank.filled.no { color: var(--leaf-ink); background: var(--leaf-bg); border-color: var(--leaf); }
mark { border-radius: 4px; padding: 0 .18em; }
mark.hl-g { background: var(--leaf-bg); color: var(--leaf-ink); }
mark.hl-r { background: var(--clay-bg); color: var(--clay-ink); }
.t-r { color: var(--clay); }

.opts { display: flex; flex-direction: column; gap: 9px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; line-height: 1.45; transition: border-color .12s, background .12s; }
.opt:hover { border-color: var(--line-strong); }
.opt .key { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: var(--muted); }
.opt .ot { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.opt.sel { border-color: var(--moss); background: var(--hl); }
.opt.sel .key { background: var(--moss); border-color: var(--moss); color: var(--on-moss); }
.opt.right { border-color: var(--leaf); background: var(--leaf-bg); cursor: default; }
.opt.right .key { background: var(--leaf); border-color: var(--leaf); color: var(--surface); }
.opt.right .ot { color: var(--leaf-ink); font-weight: 600; }
.opt.wrong { cursor: default; }
.opt.wrong .ot { color: var(--ink2); }
.opt.chosen { border-color: var(--clay); background: var(--clay-bg); }
.opt.chosen .key { background: var(--clay); border-color: var(--clay); color: var(--surface); }
.opt.chosen .ot { color: var(--clay-ink); font-weight: 600; }
.why { font-size: .86rem; font-weight: 400; color: var(--clay-ink); line-height: 1.45; }
.opt.wrong:not(.chosen) .why { color: var(--muted); }
.why-ok { color: var(--leaf-ink); }

.fill input { width: 100%; max-width: 360px; font: inherit; font-size: 1.1rem; padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); }
.fill input:focus { outline: none; border-color: var(--moss); box-shadow: 0 0 0 3px var(--hl); }
.small-note { margin: 0; color: var(--muted); font-size: .9rem; }

.check-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.kbd-hint { font-size: .8rem; color: var(--muted); margin-left: auto; }
@media (hover: none) { .kbd-hint { display: none; } }

/* placing chips */
.place { display: flex; flex-direction: column; gap: 12px; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border-radius: 14px; border: 1.5px dashed var(--line-strong); min-height: 52px; align-items: center; }
.pool.over, .tgt.over { background: var(--hl); }
.pool-empty { color: var(--muted); font-size: .88rem; }
.chip { border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 7px 12px; cursor: pointer; text-align: left; line-height: 1.35; font-size: .95rem; display: inline-flex; flex-direction: column; gap: 2px; max-width: 100%; }
.chip:hover:not(:disabled) { border-color: var(--moss); }
.chip.sel { border-color: var(--moss); background: var(--moss); color: var(--on-moss); box-shadow: 0 4px 12px -6px var(--moss); transform: translateY(-1px); }
.chip.ok { border-color: var(--leaf); background: var(--leaf-bg); color: var(--leaf-ink); }
.chip.no { border-color: var(--clay); background: var(--clay-bg); color: var(--clay-ink); }
.chip:disabled { cursor: default; opacity: 1; }
.belongs { font-size: .8rem; color: var(--leaf-ink); font-weight: 600; }
.targets { display: grid; gap: 10px; }
.place-sort .targets { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tgt { border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; min-height: 64px; min-width: 0; }
.place-match .tgt { display: grid; grid-template-columns: 1fr minmax(120px, 38%); align-items: center; gap: 10px; }
.tgt-l { font-size: .92rem; color: var(--ink2); line-height: 1.4; }
.place-sort .tgt-l { font-weight: 700; color: var(--ink); font-size: .95rem; }
.tgt-c { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; align-items: center; border-radius: 10px; padding: 4px; background: var(--paper); }
.drop { font-size: .8rem; color: var(--muted); padding: 0 6px; }
@media (max-width: 520px) { .place-match .tgt { grid-template-columns: 1fr; } }

.seq { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: s; }
.slot { counter-increment: s; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1.5px dashed var(--line-strong); border-radius: 12px; padding: 6px 10px; min-height: 46px; }
.slot::before { content: counter(s); font-family: var(--f-hand); color: var(--moss); width: 18px; font-size: 1.1rem; }
.slot.ok { border-style: solid; border-color: var(--leaf); } .slot.no { border-style: solid; border-color: var(--clay); }
.chip.in.ok { border-color: var(--leaf); background: var(--leaf-bg); color: var(--leaf-ink); }
.chip.in.no { border-color: var(--clay); background: var(--clay-bg); color: var(--clay-ink); }
.should { font-size: .82rem; color: var(--leaf-ink); }

.cloze { margin: 0; line-height: 2.3; font-size: 1.02rem; }
.cblank { min-width: 6.5em; border: none; border-bottom: 2px solid var(--line-strong); background: var(--tint); border-radius: 6px 6px 0 0; padding: 2px 10px; cursor: pointer; font-weight: 600; color: var(--ink); line-height: 1.5; }
.cblank.active { border-bottom-color: var(--moss); background: var(--hl); box-shadow: inset 0 -2px 0 var(--moss); }
.cblank.ok { background: var(--leaf-bg); color: var(--leaf-ink); border-bottom-color: var(--leaf); }
.cblank.no { background: var(--clay-bg); color: var(--clay-ink); border-bottom-color: var(--clay); text-decoration: line-through; }
.should-inline { font-size: .85rem; font-weight: 700; color: var(--leaf-ink); background: var(--leaf-bg); border-radius: 6px; padding: 1px 6px; margin-left: 4px; }
.bank { border-style: solid; background: var(--paper); }

.picks { display: flex; flex-direction: column; gap: 8px; }
.pk { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; cursor: pointer; line-height: 1.45; }
.pk .box { width: 20px; height: 20px; border-radius: 6px; border: 1.8px solid var(--line-strong); margin-top: 2px; position: relative; }
.pk.on .box { background: var(--moss); border-color: var(--moss); }
.pk.on .box::after { content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid var(--on-moss); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.pk .ot { display: flex; flex-direction: column; gap: 4px; }
.pk.ok { border-color: var(--leaf); background: var(--leaf-bg); } .pk.ok .ot { color: var(--leaf-ink); }
.pk.missed { border-color: var(--leaf); border-style: dashed; } .pk.missed .why { color: var(--leaf-ink); }
.pk.no { border-color: var(--clay); background: var(--clay-bg); } .pk.no .ot { color: var(--clay-ink); }
.pk.ok .box, .pk.ok.on .box { background: var(--leaf); border-color: var(--leaf); }
.pk.no .box { background: var(--clay); border-color: var(--clay); }

/* feedback */
.fb { border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.fb.ok { background: var(--leaf-bg); } .fb.no { background: var(--clay-bg); }
.fb-head { display: flex; align-items: center; gap: 14px; }
.grow { display: flex; align-items: flex-end; gap: 4px; flex: none; }
.grow .tr { width: 30px; height: 36px; }
.grow .from { opacity: .45; width: 22px; height: 27px; }
.grow .to { animation: rise .7s cubic-bezier(.2, .9, .3, 1.3) both; transform-origin: 50% 100%; }
.grow .arrow { color: var(--muted); font-size: .9rem; padding-bottom: 8px; }
@keyframes rise { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.verdict { margin: 0; font-family: var(--f-hand); font-size: 1.35rem; line-height: 1.2; }
.fb.ok .verdict { color: var(--leaf-ink); } .fb.no .verdict { color: var(--clay-ink); }
.fb-sub { margin: 2px 0 0; font-size: .86rem; color: var(--ink2); }
.fb-p { margin: 0; color: var(--ink); line-height: 1.6; background: var(--paper); border-radius: 12px; padding: 12px 14px; }
.lab { display: block; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; margin-bottom: 4px; }
.lab-g { color: var(--leaf); } .lab-r { color: var(--clay); }

/* figures */
.figwrap { display: flex; justify-content: center; }
.fig { margin: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.fig-scroll { width: 100%; overflow-x: auto; display: flex; justify-content: center; }
.fig-svg { width: 100%; height: auto; display: block; }
figcaption { font-size: .86rem; color: var(--muted); text-align: center; max-width: 60ch; }
.f-t { fill: var(--ink2); font-family: var(--f-body); }
.f-th { fill: var(--ink); font-family: var(--f-body); font-weight: 600; }
.f-tm { fill: var(--muted); font-family: var(--f-body); }
.f-ax { stroke: var(--ink2); stroke-width: 1.4; }
.f-grid { stroke: var(--line); stroke-width: 1; }
.f-l1 { stroke: var(--moss); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.f-l2 { stroke: var(--amber); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.f-l3 { stroke: var(--ink2); stroke-width: 2.2; }
.f-m0 { fill: var(--moss); } .f-m1 { fill: var(--amber); } .f-m2 { fill: var(--ink2); }
.f-b0 { fill: var(--moss); } .f-b1 { fill: var(--amber); }
.f-dot { fill: var(--moss); opacity: .78; }
.f-box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; }
.f-box-alt { fill: var(--tint); stroke: var(--moss); }
.f-box-empty { fill: none; stroke-dasharray: 4 3; }
.f-arr { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
.f-arr-faint { stroke: var(--muted); }
.f-ah { fill: var(--ink2); }
.f-cell, .f-hc { fill: transparent; stroke: transparent; }
.f-lab { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; }
.f-hline { stroke: transparent; stroke-width: 16; fill: none; }
.f-ring0 { fill: var(--surface); stroke: var(--line-strong); } .f-ring1 { fill: var(--tint); stroke: var(--line-strong); } .f-ring2 { fill: var(--leaf-bg); stroke: var(--moss); }
.f-shot { fill: var(--ink); }
.f-ph0 { fill: transparent; } .f-ph1 { fill: var(--tint); }
.f-div { stroke: var(--muted); stroke-dasharray: 4 4; }
.f-lens { fill: var(--surface); stroke: var(--ink2); stroke-width: 2; }
.f-planet { fill: var(--moss); }
.f-fog { fill: var(--fog); opacity: .72; } .f-fogdot { fill: var(--fog); }
.tbl-wrap { width: 100%; overflow-x: auto; }
.ftbl { border-collapse: separate; border-spacing: 4px; margin: 0 auto; font-variant-numeric: tabular-nums; font-size: .95rem; }
.ftbl th, .ftbl td { padding: 8px 12px; border-radius: 8px; text-align: center; }
.ftbl thead th { font-size: .82rem; color: var(--ink2); font-weight: 600; }
.ftbl tbody th { text-align: left; font-weight: 600; font-size: .88rem; color: var(--ink2); }

.ftbl .corner { font-size: .76rem; color: var(--muted); text-align: left; }

.aparef span { border-radius: 5px; padding: 2px 3px; }
.conds { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; width: 100%; }
.cond { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.cond-h { font-weight: 700; font-size: .92rem; }
.cond-f { display: flex; flex-wrap: wrap; gap: 6px; }
.feat { font-size: .88rem; border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 11px; background: var(--paper); }
.f-zone { fill: transparent; stroke: var(--line-strong); stroke-width: 1.2; stroke-dasharray: 5 4; }
.devs { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.devt { border: 1.5px solid transparent; border-radius: 14px; padding: 6px 4px; min-width: 0; }
.devt-h { margin: 0 0 2px 8px; font-weight: 700; font-size: .9rem; color: var(--ink); }

.dev-arr { color: var(--moss); font-weight: 700; }
.dev-q { color: var(--muted); font-family: var(--f-hand); }

/* hotspots */
.hot-on [data-hs] { cursor: pointer; }
.hot-on g[data-hs]:hover > .hit { stroke: var(--moss); stroke-width: 2; }
.hot-on g[data-hs]:hover > .f-cell, .hot-on g[data-hs]:hover > .f-hc, .hot-on g[data-hs]:hover > rect.f-ph0, .hot-on g[data-hs]:hover > rect.f-ph1 { fill: var(--hl); }
g.hs-sel > .hit { stroke: var(--moss); stroke-width: 2.6; fill: var(--hl); }
g.hs-right > .hit { stroke: var(--leaf); stroke-width: 3; fill: var(--leaf-bg); }
g.hs-wrong > .hit { stroke: var(--clay); stroke-width: 3; fill: var(--clay-bg); }
g.hs-sel > .hit.f-b0, g.hs-right > .hit.f-b0, g.hs-wrong > .hit.f-b0 { fill: var(--moss); }
g.hs-sel > .hit.f-b1, g.hs-right > .hit.f-b1, g.hs-wrong > .hit.f-b1 { fill: var(--amber); }
g.hs-sel > .f-hline { stroke: var(--hl); stroke-width: 16; fill: none; }
g.hs-right > .f-hline { stroke: var(--leaf-bg); stroke-width: 16; fill: none; }
g.hs-wrong > .f-hline { stroke: var(--clay-bg); stroke-width: 16; fill: none; }
.hot-on td[data-hs]:hover, .hot-on span[data-hs]:hover, .hot-on tr[data-hs]:hover > * { box-shadow: 0 0 0 2px var(--moss); }
td.hs-sel, span.hs-sel, tr.hs-sel > * { background: var(--hl) !important; box-shadow: 0 0 0 2px var(--moss); }
td.hs-right, span.hs-right, tr.hs-right > * { background: var(--leaf-bg) !important; color: var(--leaf-ink); box-shadow: 0 0 0 2px var(--leaf); }
td.hs-wrong, span.hs-wrong, tr.hs-wrong > * { background: var(--clay-bg) !important; color: var(--clay-ink); box-shadow: 0 0 0 2px var(--clay); }
.hot-on .devt[data-hs]:hover { border-color: var(--moss); }
.devt.hs-sel { border-color: var(--moss); background: var(--hl); }
.devt.hs-right { border-color: var(--leaf); background: var(--leaf-bg); }
.devt.hs-wrong { border-color: var(--clay); background: var(--clay-bg); }

/* end */
.end-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.end-stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; }
.end-stats b { font-size: 1.6rem; font-variant-numeric: tabular-nums; color: var(--moss-strong); }
.end-stats span { font-size: .84rem; color: var(--muted); }
.end-l { margin: 0; font-weight: 600; color: var(--ink2); }


/* scenery: soft sky, a slow sun (a moon at night), drifting clouds, hills with swaying trees */

.wrap { position: relative; z-index: 1; }

.sun::after { content: ""; position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; border-radius: 50%; background: var(--sky1); opacity: var(--moon); transform: translate(calc(-50% + 11px), calc(-50% - 8px)); }
@keyframes sun-drift { from { transform: translate(0, 0); } to { transform: translate(-9vw, 4vh); } }

@keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }
.cloud { position: absolute; left: -200px; width: 130px; height: 26px; border-radius: 30px; background: var(--cloud); opacity: var(--cloud-op); animation: cloud 170s linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: var(--cloud); border-radius: 50%; }
.cloud::before { width: 58px; height: 46px; left: 20px; top: -24px; }
.cloud::after { width: 42px; height: 34px; left: 62px; top: -15px; }
.cloud.c1 { top: 13vh; animation-delay: -40s; }
.cloud.c2 { top: 24vh; scale: .7; animation-duration: 230s; animation-delay: -150s; }
.cloud.c3 { top: 8vh; scale: .55; animation-duration: 260s; animation-delay: -60s; }
@keyframes cloud { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 420px)); } }
.hills { position: absolute; left: 0; bottom: 0; width: 100%; height: 190px; }
.hill-far { fill: var(--hill-far); } .hill-near { fill: var(--hill-near); }
.tf { fill: var(--tree-far); } .tn { fill: var(--tree-near); }
.sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 7s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-1.8deg); } to { transform: rotate(1.8deg); } }

/* question drawings */
.interact:empty { display: none; }
.stem-row { display: flex; align-items: flex-start; gap: 16px; }
.stem-row .stem { flex: 1; min-width: 0; }
.spot { flex: none; width: 74px; height: 74px; margin-top: -6px; }
.spot-svg { width: 100%; height: 100%; display: block; overflow: visible; animation: bob 6s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.qcard.ok .spot-svg { animation: bob 6s ease-in-out infinite, spot-glow 1.6s ease-out 1; }
@keyframes spot-glow { 0%, 100% { filter: drop-shadow(0 0 0 transparent); } 30% { filter: drop-shadow(0 0 10px var(--glow)); } }
@media (max-width: 520px) { .spot { width: 54px; height: 54px; margin-top: -2px; } .stem-row { gap: 10px; } }
.sp-bg { fill: var(--tint); }
.sp-s { fill: none; stroke: var(--moss); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.sp-sf { fill: var(--surface); stroke: var(--moss); stroke-width: 2.2; stroke-linejoin: round; }
.sp-sa { fill: none; stroke: var(--amber); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.sp-w { stroke-width: 5; } .sp-dash { stroke-dasharray: 3 4; } .sp-cap { fill: none; }
.sp-a { fill: var(--amber); } .sp-l { fill: var(--sap); } .sp-d { fill: var(--moss); }
.sp-t { font-family: var(--f-hand); font-size: 13px; fill: var(--moss-strong); }

/* motion: cards rise in, right answers glow and shine, leaves burst, wrong answers nudge */
.qcard { animation: card-in .38s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes card-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.fb { position: relative; overflow: hidden; }
.fb.ok { animation: fb-glow 1.5s ease-out 1; }
@keyframes fb-glow { 0% { box-shadow: 0 0 0 0 var(--glow); } 30% { box-shadow: 0 0 0 5px var(--glow), 0 0 30px 4px var(--glow); } 100% { box-shadow: 0 0 0 0 transparent; } }
.fb.ok::before { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%; background: linear-gradient(100deg, transparent, var(--shine), transparent); transform: skewX(-14deg); animation: shine 1.15s ease-out .12s 1 both; pointer-events: none; }
.fb.master::before { animation-duration: 1.6s; }
@keyframes shine { from { left: -60%; } to { left: 130%; } }
.fb.no { animation: nudge .42s ease 1; }
@keyframes nudge { 20% { transform: translateX(-5px); } 45% { transform: translateX(4px); } 70% { transform: translateX(-2px); } 100% { transform: none; } }
.opt.glow { animation: opt-glow 1.4s ease-out 1; }
@keyframes opt-glow { 0% { box-shadow: 0 0 0 0 var(--glow); } 30% { box-shadow: 0 0 0 4px var(--glow), 0 0 22px 2px var(--glow); } 100% { box-shadow: 0 0 0 0 transparent; } }
.grow { position: relative; }
.burst { position: absolute; left: 78%; top: 35%; width: 0; height: 0; pointer-events: none; }
.burst i { position: absolute; left: -4px; top: -6px; width: 8px; height: 12px; border-radius: 8px 0 8px 0; background: var(--sap); opacity: 0; animation: leaf 1.25s ease-out var(--dl) 1 both; }
.burst i:nth-child(3n) { background: var(--amber); } .burst i:nth-child(3n+1) { background: var(--tree); }
@keyframes leaf { 0% { opacity: 0; transform: translate(0, 0) rotate(0) scale(.4); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1); } }
.forest.big .tr { animation: rise .6s cubic-bezier(.2, .9, .3, 1.3) both; transform-origin: 50% 100%; }
.sec { transition: background .15s, border-color .15s, transform .15s, box-shadow .15s; }
.sec:hover { transform: translateY(-2px); box-shadow: 0 8px 22px -14px var(--moss); }
.opt { transition: border-color .12s, background .12s, transform .12s; }
.opt:hover:not(.right):not(.wrong) { transform: translateX(2px); }
.btn.primary { position: relative; overflow: hidden; }
.btn.primary::after { content: ""; position: absolute; top: 0; bottom: 0; left: -70%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .22), transparent); transform: skewX(-14deg); pointer-events: none; }
.btn.primary:hover:not(:disabled)::after { animation: shine .9s ease-out 1; }
.seg.mini:not(.on) { background: var(--paper); }
@media (max-width: 520px) { .card, .qcard { padding: 16px; } .opt { padding: 11px 12px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }


.xh { display: flex; gap: 14px; align-items: flex-start; width: 100%; max-width: 470px; text-align: left; font-size: .92rem; }
.xh-who { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 18px; font-size: .8rem; }

.xh-spr img { position: absolute; inset: 0; width: 100%; height: 100%; }
.xh-card { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.xh-card p { margin: 0; }
.xh-q { font-weight: 600; }
.xh-sub { font-size: .8rem; color: var(--muted); }

  function h(s) { var x = 5381; for (var i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0; return (x >>> 0).toString(36); }
  var ok = false; try { ok = localStorage.getItem(KEY) === HASH; } catch (e) { }
  if (ok) { gate.parentNode.removeChild(gate); return; }

  });
})();

Q({k:`Ways of knowing`, lv:`warm`, q:`Trusting your doctor's advice simply because they're the expert is which way of knowing?`,
c:`Authority`,
x:[[`Intuition`,`Intuition is trusting your own gut or folk wisdom, not someone else's expertise.`],
[`Empiricism`,`Empiricism means checking claims against systematic observations, not trusting a person.`],
[`Scientific skepticism`,`Skepticism is the opposite move: not accepting a claim until you've seen the evidence.`],
[`Universalism`,`Universalism is a norm of science about agreed-upon methods, not a way of knowing.`]],
e:`{g:Authority} = trusting someone we think knows better (parents, doctors, news, government). It's fast, cheap and honestly necessary. The catch: who do you trust, and when? Science doesn't throw authority out. It just won't accept a claim on authority alone.`});

Q({k:`Ways of knowing`, q:`Your friend says, "Love finds you once you stop looking. It happened to my cousin." What's the main problem with this belief?`,
c:`It's intuition from an anecdote: we notice the hits and never notice the misses`,
x:[[`It's an appeal to authority, since the cousin is treated as a dating expert`,`Nobody is treated as an expert here. It's one story plus a gut feeling, which is intuition.`],
[`It can't be tested, so it isn't a claim about the world at all`,`It actually could be tested. The problem is the evidence behind it, not testability.`],
[`It's empiricism, because it's based on an event that really happened to someone`,`One unsystematic story isn't empiricism. Empiricism needs structured, systematic observation.`],
[`It's pseudoscience only because nobody gathered a large enough sample`,`Sample size isn't the core issue. The belief rests on noticing coincidences, a cognitive bias.`]],
e:`This is {g:intuition} built on an {g:anecdote}. The bias behind it is {g:illusory correlation}: when "stopped looking" is followed by "found love," it grabs our attention, but all the times people stopped looking and stayed single never register. So we see a causal link that may not exist.`});

Q({t:`fill`, k:`Ways of knowing`, q:`When two events happen close together and we wrongly conclude one caused the other (because we never notice the non-events), that bias is called an ___.`,
a:[`illusory correlation`],
e:`{g:Illusory correlation}: we notice coincidences that confirm our belief and ignore the times nothing happened. It's extra likely when we already want the causal story to be true. Science fights it with systematic procedures instead of memorable stories.`});

Q({k:`Ways of knowing`, q:`Which pair correctly matches a disadvantage to the way of knowing it belongs to?`,
c:`Intuition: we highlight confirming evidence and discount disconfirming evidence`,
x:[[`Authority: it's slow and expensive because you have to check everything yourself`,`Authority is the fast, cheap option. Its problem is knowing who and when to trust.`],
[`Science: it accepts claims once enough experts agree that they feel right`,`Science explicitly refuses to accept claims because experts agree or because they feel right.`],
[`Intuition: it requires deferring to people who may have conflicts of interest`,`Deferring to other people is authority. Intuition is your own gut feeling.`],
[`Authority: it relies too heavily on systematic observation of the world`,`Systematic observation is empiricism, the strength of science, not a flaw of authority.`]],
e:`Intuition feels right and is fast, but it's {g:biased}: we {g:highlight confirming evidence} and {g:discount disconfirming evidence}, and it's unclear when to trust it. Authority's disadvantage is different: {r:who} to trust and {r:when}.`});

Q({t:`fill`, k:`Scientific method`, lv:`warm`, q:`Skepticism + ___ = the scientific method.`,
a:[`empiricism`],
e:`{g:Empiricism} = gaining knowledge through structured, systematic observation of the world. Pair it with skepticism (don't accept a claim without evidence) and you get science: every claim is subject to a test against reality.`});

Q({k:`Scientific method`, q:`What makes an observation {k:empirical} in the scientific sense?`,
c:`It comes from structured, systematic observation of the world`,
x:[[`It comes from a respected expert who has studied the topic`,`That's authority. Empiricism is about the observation, not who says it.`],
[`It matches what most people already believe about behaviour`,`Popular belief is folk wisdom (intuition). Empirical data can contradict it.`],
[`It has been published in a peer-reviewed scientific journal`,`Publication is a separate step. An observation is empirical before it's ever published.`],
[`It was strongly felt and personally experienced by the observer`,`A strong personal experience is anecdote and intuition, not systematic observation.`]],
e:`{g:Empiricism} is the core of the scientific method: knowledge from {g:systematic, structured observation}. One vivid experience isn't enough; you need careful data collected in a planned way.`});

Q({t:`order`, k:`Cycle of science`, q:`Put the cycle of science in order, starting from where a scientist begins.`,
i:[`Idea or theory`,`Design a test`,`Collect data`,`Interpret data`,`Refine the idea`],
e:`Science is a loop: {g:idea/theory → design a test → collect data → interpret data → refine}, then back to the (now better) idea. The "refine" step is where you change, keep or toss the idea based on the pattern you found.`});

Q({t:`hot`, k:`Cycle of science`, q:`In the cycle of science, click the step where you decide to change, keep or throw out your original idea.`,
fig:{k:`cycle`}, a:`refine`,
why:{interpret:`Interpreting is where you figure out what the pattern means. The decision to update the idea comes right after, in Refine.`, idea:`This is the starting point, before any test has happened.`, design:`Designing comes before you have any data to update your idea with.`, collect:`Collecting data gives you the raw material, but you haven't judged it yet.`},
e:`{g:Refine} is where the data talks back: "What pattern would lead you to refine, change or discard your idea?" Then the loop starts again with a better idea.`});

Q({t:`match`, k:`Norms of science`, q:`Match each norm of science to what it means.`,
p:[[`Universalism`,`Everyone evaluates methods and data by the same agreed-upon standards`],
[`Communality`,`Methods and data are shared openly with other scientists`],
[`Disinterestedness`,`The motive is an honest quest for truth, not fame or personal gain`],
[`Organized skepticism`,`Experts critique all new work, even work that supports their own ideas`]],
e:`Four norms (Merton): {g:universalism} (shared standards, judged objectively), {g:communality} (openness, sharing), {g:disinterestedness} (truth over ego), {g:organized skepticism} (expert critique, most clearly peer review).`});

Q({k:`Norms of science`, q:`A lab posts its data, materials and analysis code on the Open Science Framework so others can check or replicate the work. Which norm is this?`,
c:`Communality`,
x:[[`Universalism`,`Universalism is about using agreed standards to evaluate work, not about sharing it.`],
[`Disinterestedness`,`Disinterestedness is about motive (truth vs fame), not about openness.`],
[`Organized skepticism`,`Skepticism is the critique others do. Sharing is what makes that critique possible, and that's communality.`],
[`Empiricism`,`Empiricism is a way of knowing, not one of the four norms.`]],
e:`{g:Communality} = methods and results shared openly. It's what makes {g:replication} and {g:meta-analysis} possible. Journals increasingly require it.`});

Q({k:`Norms of science`, q:`Which norm of science is most directly tied to {k:peer review}?`,
c:`Organized skepticism`,
x:[[`Communality`,`Sharing work comes first, but the expert critique itself is organized skepticism.`],
[`Universalism`,`Reviewers use shared standards, but the act of critique is organized skepticism.`],
[`Disinterestedness`,`That's about the researcher's motives, not the review process.`],
[`Falsifiability`,`Falsifiability is a property of a good idea, not a norm of the scientific community.`]],
e:`{g:Organized skepticism}: research is expected to be critiqued by experts before and after publication. Peer review is the classic example, though it's far from perfect, so you still read published work critically.`});

Q({k:`Norms of science`, q:`A researcher rushes out a flashy result mainly to land a promotion and get media attention. Which norm is being violated?`,
c:`Disinterestedness`,
x:[[`Communality`,`Nothing here is about hiding data or methods.`],
[`Universalism`,`Universalism is about evaluating work by shared standards, not about motive.`],
[`Organized skepticism`,`Skepticism is about critique of work. The problem here is the researcher's motive.`],
[`Temporal precedence`,`That's a criterion for causal claims, not a norm of science.`]],
e:`{g:Disinterestedness}: scientists should be motivated by an {g:honest quest for truth}, not fame, ego or personal gain. Pressures to publish and to look important are exactly what pull people away from this ideal.`});

Q({k:`Norms of science`, lv:`hard`, q:`Two labs reach opposite conclusions about the same effect. Other scientists can judge both studies objectively because they all rely on the field's accepted methods. Which norm makes that possible?`,
c:`Universalism`,
x:[[`Communality`,`Sharing helps, but the shared yardstick for judging is universalism.`],
[`Disinterestedness`,`Motive doesn't decide which study is better. Shared standards do.`],
[`Organized skepticism`,`Critique happens, but the agreed standards it uses come from universalism.`],
[`Parsimony`,`Parsimony prefers simpler theories; it's not about evaluating conflicting studies.`]],
e:`{g:Universalism}: observations are systematic and evaluated objectively using the {g:accepted methods} of the discipline, so disagreements can be settled by evidence, not by who's more famous.`});

Q({tr:1, k:`Skepticism`, q:`Why is skepticism such an important part of the scientific process?`,
c:`It helps catch and correct our biases, most visibly through peer review`,
x:[[`It guarantees that published findings are true and won't need revision`,`Nothing guarantees truth. Skepticism keeps findings open to revision.`],
[`It lets scientists reject any claim that disagrees with their own theory`,`Real skepticism applies to your own ideas too, including evidence that supports them.`],
[`It replaces the need to collect data when an idea seems implausible`,`Skepticism asks for data. It never replaces data.`],
[`It means trusting only senior experts when evaluating new evidence`,`That's authority, the thing skepticism refuses to rely on.`]],
e:`Skepticism means not accepting claims (including your own) without evidence. It helps us {g:correct more of our biases}. We meet it in many ways, most prototypically in {g:peer review}, but also when others try to replicate our work.`});

Q({k:`Falsifiability`, q:`Which of these ideas is {k:falsifiable}?`,
c:`People who believe in a god donate to charity more often than people who don't`,
x:[[`People have an invisible aura that changes colour as their physical health changes`,`An invisible aura can't be measured, so no data could ever show it's false.`],
[`A god exists and quietly guides events in ways we can't detect`,`If it's undetectable by definition, no observation could disprove it.`],
[`Everything that happens to you happens for a hidden reason`,`Any outcome can be explained after the fact, so nothing could count against it.`],
[`Your star sign shapes your fate in ways that can't be measured`,`"Can't be measured" means no possible data could prove it wrong.`]],
e:`{g:Falsifiable} = some possible data could show it's false. You can measure belief and donations, so that hypothesis can be tested (and possibly falsified). Whether a god exists isn't falsifiable. That doesn't make it uninteresting; it just isn't an {r:empirical question}.`});

Q({t:`pick`, k:`Pseudoscience`, q:`Select every warning sign of pseudoscience.`,
i:[[`The claims can't be falsified; no evidence could prove them wrong`,1],
[`Support comes mostly from testimonials, anecdotes or "so-called" experts`,1],
[`Contradictory evidence is ignored`,1],
[`Lots of scientific-sounding terms dress up the claim`,1],
[`The claims are never revised when new data arrives`,1],
[`It offers a simple fix to your problems in exchange for money`,1],
[`It cites peer-reviewed studies that directly test the main claim`,0,`Citing real, relevant peer-reviewed tests is what science does.`],
[`Its methods are described in enough detail for others to replicate`,0,`Replicable methods are a hallmark of good science, not pseudoscience.`]],
e:`Pseudoscience {g:borrows the look of science} without its methods: {g:unfalsifiable}, {g:anecdotal}, {g:ignores contradictions}, {g:never revised}, {g:jargon}, {g:vague}, and often {g:sells a simple solution}.`});

Q({k:`Pseudoscience`, lv:`hard`, q:`A sleep-learning website cites real research showing that sleep helps you consolidate memories of things you learned while awake. Why is that still a red flag?`,
c:`The research is real but doesn't test their claim that you can learn new material asleep`,
x:[[`Sleep research is never peer-reviewed, so none of it can be trusted as real evidence`,`Sleep research is peer-reviewed. The issue is that it's not about their claim.`],
[`The website quotes several real studies instead of relying only on personal testimonials`,`Quoting studies is fine. The problem is the studies don't support the central claim.`],
[`Memory consolidation during sleep has been proven to be false`,`It hasn't been proven false. It's real, just not what they're selling.`],
[`Websites can't legally cite scientific papers without permission`,`Legality isn't the issue. The issue is borrowed credibility.`]],
e:`Relevant-sounding research is used to {r:borrow credibility}. Sleep helps consolidate {g:waking} learning, but there's {g:no evidence} that listening to recordings asleep produces long-term learning. Be extra skeptical when you're being sold something you wish were true.`});

Q({k:`Empirical questions`, lv:`warm`, q:`Which of these is an {k:empirical question}?`,
c:`Do people who sleep eight hours remember more words than people who sleep four?`,
x:[[`Is it morally wrong to lie to someone in order to protect their feelings from harm?`,`That's a values question. Data can't settle what's morally right.`],
[`What is the true meaning of a happy life?`,`"True meaning" isn't something you can observe and measure.`],
[`Should everyone value kindness more than success?`,`"Should" questions are about values, not systematic observation.`],
[`Does an undetectable spirit watch over each person and quietly shape what they do?`,`Undetectable means it can't be observed, so it isn't empirical.`]],
e:`An {g:empirical question} can be answered through {g:systematic observation}. Sleep and word recall can both be measured. Moral "should" questions and undetectable things can't be settled with data.`});

Q({t:`fill`, k:`Replication`, lv:`warm`, q:`To repeat a study to see whether its results can be duplicated is to ___ it.`,
a:[`replicate`,`replicate it`,`repeat`],
e:`To {g:replicate} = repeat a study to see if you get the same results. Replications help rule out chance, false positives or fraud, and they depend on {g:communality} (open methods).`});

Q({k:`Replication`, q:`What does a {k:meta-analysis} do, and which norm does it depend on?`,
c:`Combines results of many past studies into an overall effect; relies on communality`,
x:[[`Summarizes past studies in words only; relies on disinterestedness`,`Summarizing in words is a literature review. Meta-analysis is statistical.`],
[`Runs one huge study to replace earlier ones; relies on universalism`,`A meta-analysis doesn't collect new data. It pools existing studies.`],
[`Repeats one earlier study exactly to check whether it holds up; relies on organized skepticism`,`Repeating one study is a replication, not a meta-analysis.`],
[`Reviews a single paper before publication; relies on peer review`,`That's peer review, not meta-analysis.`]],
e:`A {g:meta-analysis} statistically {g:combines results from many studies} to see the bigger picture. No single study is perfect, so pooling helps. It only works if researchers share their results openly ({g:communality}).`});

Q({k:`Why methods matter`, q:`After a wrongful murder conviction in Manitoba, an inquiry used psychological research to change how police run photo lineups. What did the research show?`,
c:`False identifications are less likely when photos are shown one at a time`,
x:[[`False identifications drop when all photos are shown side by side at once`,`It's the reverse. Simultaneous lineups lead to more false IDs.`],
[`Witnesses are more accurate when a lawyer chooses the photos`,`That wasn't the finding. The key variable was sequential vs simultaneous.`],
[`Colour photos produce fewer false identifications than black and white`,`Photo colour wasn't the variable studied here.`],
[`Hypnosis helps witnesses recall faces more accurately`,`Memories retrieved through hypnosis are a separate legal issue, not this finding.`]],
e:`Research showed {g:sequential} lineups (one photo at a time) produce fewer false identifications than {r:simultaneous} ones. Police are now required to present photos sequentially. This is one way research methods matter beyond the lab: legal practice.`});

Q({k:`Why methods matter`, q:`Which is NOT one of the reasons for learning research methods?`,
c:`It lets you prove which theories are correct once and for all`,
x:[[`It makes you a more informed consumer of news, health care and products`,`This is a real reason: you can judge claims like "this one trick cures insomnia."`],
[`It gives you an edge in careers that use or evaluate research`,`This is a real reason: clinicians, businesses and educators all rely on research.`],
[`It helps you judge research behind public policy as a citizen`,`This is a real reason: legislators often cite research to justify policy.`],
[`It helps you evaluate programs in your community`,`This is a real reason: program evaluation checks whether programs meet their goals.`]],
e:`Methods help you be an {g:informed consumer}, get a {g:career edge}, be an {g:engaged citizen}, understand {g:legal decisions} and {g:evaluate programs}. Science never {r:proves} theories once and for all; it gathers evidence that supports or doesn't support them.`});

Q({t:`match`, k:`Four goals`, q:`Match each goal of research to the question it answers.`,
p:[[`Description`,`What is it, how often does it happen, and for whom?`],
[`Prediction`,`When will it happen, and who is most at risk?`],
[`Finding causes`,`Does changing X actually change Y?`],
[`Explanation`,`Why does it happen, through what process?`]],
e:`Four goals: {g:describe} (what/how often), {g:predict} (when/who), {g:find causes} (does X cause Y), {g:explain} (why, often through mediators). Description comes first and is foundational.`});

Q({t:`sort`, k:`Four goals`, q:`Sort each study into the goal it mainly serves.`,
b:[`Description`,`Prediction`,`Finding causes`,`Explanation`],
i:[[`Estimating how many Canadians have major depression in a 12-month span`,0],
[`Tracking whether anxiety rises in places where isolation rules start`,1],
[`Randomly assigning people to multitask on a laptop or not, then testing them`,2],
[`Testing whether loneliness is the reason isolation raises anxiety`,3],
[`Checking whether doctors low in empathy are more likely to burn out`,1],
[`Comparing how common depression is among women versus men`,0]],
e:`Prevalence = {g:description}. "Does X go with Y / who's at risk" = {g:prediction}. Random assignment + manipulation = {g:finding causes}. "What's the process/why" = {g:explanation}.`});

Q({tr:1, k:`Four goals`, q:`Which of the four goals of psychological research is most closely related to the term {k:mediation}?`,
c:`Explanation of behaviour`,
x:[[`Description`,`Description says what happens and how often, not why.`],
[`Predicting when behaviour occurs`,`Prediction says when or for whom something happens, not the process behind it.`],
[`Finding causes`,`Finding causes shows that X affects Y. A mediator goes further and explains how.`],
[`Replication`,`Replication isn't one of the four goals.`]],
e:`A mediator is the process {g:between} cause and effect (IV → mediator → DV), so studying it answers "{g:why}?" That's the {g:explanation} goal.`});

Q({tr:1, t:`fill`, k:`Four goals`, q:`The four goals of research are describing behaviour, predicting behaviour, finding causes, and ___ behaviour.`,
a:[`explaining`,`explanation`,`explain`,`understanding`],
e:`Describe, predict, find causes, {g:explain}. Explaining (understanding why) often involves testing theories and mediators.`});

Q({k:`Four goals`, q:`Which goal should come first in any scientific investigation?`,
c:`Description, because you need to know what a thing is before asking why`,
x:[[`Finding causes, because causal answers are the most useful kind for changing behaviour`,`Causes matter, but you can't study causes of something you haven't described.`],
[`Prediction, because it's the easiest goal to achieve`,`Prediction builds on description; it doesn't replace it.`],
[`Explanation, because theories should guide everything else`,`Explaining before describing is exactly the trap the textbook warns about.`],
[`Any goal works first, as long as the study is experimental`,`The order matters, and description doesn't need an experiment at all.`]],
e:`{g:Description} is foundational: what is the phenomenon, when and how often does it happen, and for whom? Only then do prediction, causes and explanation make sense.`});

Q({k:`Four goals`, lv:`hard`, q:`High school grades predict university grades really well. Why doesn't that mean high school grades cause university grades?`,
c:`Shared causes like motivation and study habits could drive both`,
x:[[`Because university grades come first in time`,`High school grades clearly come first. Temporal order isn't the problem.`],
[`Because the two variables don't actually covary across students`,`They do covary. That's why the prediction works.`],
[`Because accurate prediction is only possible in true experiments`,`Prediction works fine without experiments. It's causation that needs more.`],
[`Because grades are qualitative, not quantitative`,`Grades are numbers, and that's not the issue anyway.`]],
e:`Accurate {g:prediction} isn't {g:causation}. Motivation, healthy study habits and reading ability likely cause {g:both}. To find causes, you need to rule out alternative explanations, usually with an experiment.`});

Q({t:`match`, k:`Causal criteria`, q:`Laptop multitasking study: match each causal criterion to the evidence that met it.`,
p:[[`Covariation`,`Multitaskers averaged 55% on the test; non-multitaskers averaged 66%`],
[`Temporal precedence`,`The multitasking happened during the lesson, before the test`],
[`Ruling out alternatives`,`Random assignment made the groups equal in prior knowledge`]],
e:`Three criteria: {g:covariation} (cause present → effect present), {g:temporal precedence} (cause before effect), {g:ruling out alternative explanations} (nothing else could explain it). Random assignment handles the third.`});

Q({k:`Causal criteria`, q:`"When the cause is present, the effect occurs; when it's absent, the effect doesn't." Which criterion is this?`,
c:`Covariation of cause and effect`,
x:[[`Temporal precedence`,`That's about order in time, cause before effect.`],
[`Ruling out alternative explanations`,`That's about eliminating other possible causes.`],
[`Falsifiability`,`That's about whether an idea can be shown false.`],
[`Replication`,`That's about repeating a study.`]],
e:`{g:Covariation}: a change in one variable goes along with a change in the other. It's necessary for causation but nowhere near enough on its own.`});

Q({t:`sort`, k:`Basic vs applied`, q:`Sort each project as basic or applied research.`,
b:[`Basic research`,`Applied research`],
i:[[`Testing two competing theories of how episodic memory works`,0],
[`Using virtual reality exposure to treat fear of thunderstorms`,1],
[`Studying how reinforcement affects bar-pressing in pigeons`,0],
[`Evaluating whether a syringe-exchange program reduces needle reuse`,1],
[`Studying how the visual system perceives depth`,0],
[`Using graphic warning labels to reduce smoking`,1]],
e:`{g:Basic} = fundamental questions and theory testing, not aimed at an immediate use. {g:Applied} = practical problems and solutions. Program evaluation is a kind of applied research.`});

Q({k:`Basic vs applied`, q:`Skinner's 1930s research on pigeons pressing bars later shaped therapy, education and workplace practices. What point does this make?`,
c:`Basic research can't predict its own applications, so it deserves support`,
x:[[`All research should have obvious practical uses from the very start to deserve funding`,`This example argues the opposite: useful applications appeared years later.`],
[`Animal research never generalizes to human behaviour`,`Here it generalized very well.`],
[`Applied research is more valuable than basic research`,`The point is that the two feed each other; neither is simply better.`],
[`Basic research is only useful once a company funds it`,`Funding source isn't the point; unpredictability of benefits is.`]],
e:`We {g:can't predict} the eventual uses of {g:basic research}. Skinner had no idea his pigeon work would matter so much. Basic and applied research work in {g:synergy}: applied work borrows basic theories, and applied findings inspire new basic questions.`});

Q({k:`Program evaluation`, q:`Researchers team up with a Vancouver syringe-exchange program to see whether it reduces needle reuse. This is best described as:`,
c:`Program evaluation, a type of applied research`,
x:[[`Basic research, because it tests a theory of addiction`,`The goal is to judge whether a real program works, which is applied.`],
[`A meta-analysis, because it combines many programs`,`It looks at one program's data, not a pooled set of studies.`],
[`Pseudoscience, because it uses survey data`,`Surveys are a legitimate method; nothing here is pseudoscientific.`],
[`Qualitative research, because it involves drug users`,`Who the participants are doesn't decide the data type.`]],
e:`{g:Program evaluation} checks whether a social program (in health, education, justice, government) is having its {g:intended effect}. If not, alternatives should be tried. It's a growing career area within applied research.`});

Q({k:`Approaches`, q:`A researcher interviews people about the last three social media posts they "liked" and analyzes what they say. This is:`,
c:`Qualitative research`,
x:[[`Quantitative research`,`Quantitative means data in numbers, like 1–7 rating scales.`],
[`A field experiment`,`Nothing is manipulated, so it isn't an experiment.`],
[`Program evaluation`,`No program is being evaluated.`],
[`Basic correlational research`,`Correlational research examines associations between measured numeric variables.`]],
e:`Data that aren't numbers (interviews, pictures, open-ended responses) = {g:qualitative}. Numbers of any kind, including self-report scales, = {r:quantitative}. Neither is better; they have different strengths.`});

Q({k:`Approaches`, q:`Researchers survey nearly 600 young adults about their reasons for drinking and their personality traits, then look for associations. What kind of study is this?`,
c:`Quantitative correlational research`,
x:[[`A true experiment with two conditions`,`Nothing was manipulated, so it isn't an experiment.`],
[`Qualitative interview research`,`The survey responses are numeric ratings, so it's quantitative.`],
[`A narrative literature review`,`New data were collected; it isn't a summary of past studies.`],
[`Applied program evaluation`,`No program is being tested.`]],
e:`Simply {g:measuring and looking for associations} = {g:correlational}. Manipulating something and observing its effect = {r:experiment}. Personality did predict drinking motives (e.g., low emotional stability + low extraversion → drinking to cope).`});

Q({k:`Approaches`, lv:`warm`, q:`Interviewing people as they leave a pet store, out in the real world, is an example of:`,
c:`Field research`,
x:[[`Lab research`,`Lab research happens in a controlled setting like a laboratory.`],
[`An experiment`,`Interviewing isn't manipulating anything.`],
[`A meta-analysis`,`A meta-analysis combines past studies; it doesn't interview anyone.`],
[`Basic research`,`Basic vs applied is a different dimension from where data are collected.`]],
e:`{g:Field research} happens in the real world; {r:lab research} happens in a controlled environment. You can do field or lab research, quantitative or qualitative, basic or applied. These dimensions are independent.`});

Q({k:`Skepticism`, q:`A drug company funds a study showing its own drug works. What's the most scientific response?`,
c:`Be extra skeptical and look closely at the methods, given the conflict of interest`,
x:[[`Reject the findings outright, since company-funded research is always wrong and biased`,`Skepticism isn't automatic rejection. You evaluate the evidence.`],
[`Accept the findings, since drug companies have the most expertise`,`That's accepting a claim on authority.`],
[`Accept the findings if the paper passed peer review`,`Peer review is imperfect quality control, not a stamp of truth.`],
[`Ignore funding, since motives never affect research`,`Motives can affect research; that's why disinterestedness is an ideal.`]],
e:`True skepticism applies to {g:scientists} too. Conflicts of interest are a reason to {g:evaluate the methods closely}, not a reason to dismiss automatically. We often don't know a study's agenda, so it's best to scrutinize all research.`});

Q({t:`fill`, k:`Peer review`, lv:`warm`, q:`The process where other experts judge a study's scientific merit before it's published is called ___.`,
a:[`peer review`,`peer reviewing`],
e:`{g:Peer review} is quality control by other scientists. It's the classic example of organized skepticism, but it's far from perfect, so published work still deserves a critical eye.`});

Q({k:`Falsifiability`, lv:`hard`, q:`Why are falsifiable ideas useful even when the data show they're false?`,
c:`Being wrong points scientists toward new and better ideas`,
x:[[`They aren't useful; a falsified idea is a wasted study`,`A clear "no" is information. It pushes theory forward.`],
[`Falsified ideas can be republished as true with more data`,`Data that falsify an idea don't flip into support with more of the same.`],
[`They prove the opposite idea must be correct`,`Ruling one idea out doesn't prove any single alternative.`],
[`They show the researcher's methods were flawed`,`A falsified hypothesis can come from a perfectly good study.`]],
e:`Science only tackles {g:empirical, falsifiable} questions. When one is proven false, that result {g:spurs new and better ideas}. That's progress, not failure.`});

Q({t:`cloze`, k:`Scientific method`, q:`Build the explanation of what makes science different from other ways of knowing.`,
txt:`Unlike relying on [[intuition]] or [[authority]], the scientific method combines [[skepticism]], refusing to accept a claim without evidence, with [[empiricism]], gaining knowledge through systematic observation. Good scientific ideas are [[falsifiable]]: some possible data could show they're wrong.`,
d:[`universalism`,`provable`,`replication`],
e:`Science doesn't reject intuition and authority as sources of ideas. It just won't accept them as {g:evidence}. Every claim gets tested against reality.`});

Q({k:`Skepticism`, lv:`hard`, q:`Stories like the 10,000-hour rule or the classic bystander account of Kitty Genovese have been critiqued, yet many people still believe the original versions. What does this show?`,
c:`Science is slow to correct itself; original accounts often stay more popular`,
x:[[`Once a finding is published, it can never be revised`,`Findings can be revised. The point is that corrections spread slowly.`],
[`Critiques of famous findings are usually wrong`,`Critiques can be right. That's why you need methods skills to judge them.`],
[`Popular findings stay popular because they're the best supported by the evidence`,`Popularity and evidence aren't the same thing.`],
[`Psychology findings can't be tested again after they're famous`,`They can be re-examined; that's exactly what happened.`]],
e:`Science is {g:slow to correct its own errors}; the original, compelling story often outlives the re-examination. Things you "know" from psychology may have been debunked, which is one more reason to build your own methods expertise.`});

S(2);

Q({t:`match`, k:`Sources of ideas`, q:`Match each source of research ideas to an example.`,
p:[[`Questioning common assumptions`,`Testing whether "opposites attract" is actually true`],
[`Observation of the world`,`A former server who starts studying what makes people tip more`],
[`Practical problems`,`Surveying cyclists to pick the best route for a new bike path`],
[`Theories`,`Deriving a hypothesis from a model of working vs long-term memory`],
[`Past research`,`Redesigning a study to rule out a confound in earlier work`]],
e:`Five sources: {g:common assumptions} (folk wisdom), {g:observation} (including jobs and serendipity), {g:practical problems}, {g:theories} and {g:past research}.`});

Q({k:`Sources of ideas`, q:`Pavlov discovered classical conditioning while he was actually studying digestion in dogs. This shows which source of ideas?`,
c:`Observation of the world, helped along by serendipity`,
x:[[`Questioning a common assumption about dogs`,`He wasn't testing folk wisdom; he noticed something unexpected.`],
[`A practical problem he was hired to solve`,`He was doing basic digestion research, not solving an applied problem.`],
[`Deriving a hypothesis from an existing theory of digestion`,`The idea came from noticing salivation, not from a theory.`],
[`Replicating a past study in a new population`,`There was no earlier conditioning study to replicate.`]],
e:`{g:Serendipity} = a fortunate accident. A student noticed dogs drooling before food arrived. Accidental discoveries aren't purely luck; they happen when you watch the world with a {g:curious, inquisitive eye}.`});

Q({k:`Sources of ideas`, q:`A researcher finds that a similarity-attraction effect replicates in North America, then tests whether it holds in Japan (it doesn't). Which source of ideas is this?`,
c:`Past research, extended to a new culture`,
x:[[`Practical problems in Japanese dating apps`,`No practical problem is being solved.`],
[`Serendipity during an unrelated study`,`This was a deliberate extension, not an accident.`],
[`A brand new theory with no prior evidence`,`It builds directly on decades of earlier findings.`],
[`Observation of the researcher's own friends`,`It starts from published findings, not personal observation.`]],
e:`{g:Past research} can be applied to a {g:different population, culture, setting or method}. Studies like this add important qualifications: an effect found in one culture may not hold everywhere.`});

Q({k:`Sources of ideas`, lv:`hard`, q:`In facilitated communication, a helper holds a child's hand while the child types. Follow-up research showed the "right" answers appeared only when the helper could see the same picture. What alternative explanation had the original studies failed to rule out?`,
c:`The facilitator, not the child, was unknowingly guiding the typing`,
x:[[`The children were too tired to type during the test sessions`,`Fatigue wouldn't explain why answers matched what the facilitator saw.`],
[`The keyboards were confusing for children with autism`,`Keyboard design can't explain answers tracking the facilitator's picture.`],
[`The children understood the pictures but couldn't read the written questions`,`When pictures differed, kids typed what the facilitator saw, not what they saw.`],
[`The pictures shown were too difficult to identify`,`Accuracy depended on whether the helper saw the picture, not on difficulty.`]],
e:`When child and facilitator saw {g:different} pictures, the typed answer matched the {g:facilitator's} picture. The facilitator was controlling the communication. A great example of {g:past research} fueling new studies and of why skepticism matters.`});

Q({k:`Theory`, q:`What are the two functions of a scientific theory?`,
c:`Organize and explain past findings, and generate new testable hypotheses`,
x:[[`Prove a phenomenon is true once and for all, and replace the need for more data`,`Theories are never proven; they're supported or revised as data come in.`],
[`Describe a single study's results, and summarize its abstract`,`A theory organizes many findings, not one study.`],
[`State an untested hunch, and avoid being falsified`,`An untested hunch is closer to an idea; good theories are falsifiable.`],
[`Set the operational definitions, and pick the sample size`,`Those are design decisions for a specific study.`]],
e:`Theories (1) {g:organize and explain} lots of past observations (Darwin, working vs long-term memory) and (2) {g:generate new hypotheses} that point us where to look next. When new data don't fit, the theory gets modified or replaced.`});

Q({t:`fill`, k:`Theory`, q:`If two theories explain a phenomenon equally well, the principle of ___ says to prefer the simpler one.`,
a:[`parsimony`],
e:`{g:Parsimony}: fewer variables, same explanatory power, so simpler wins. Simpler theories also tend to apply to more situations, which makes them easier to falsify.`});

Q({k:`Theory`, q:`Asking whether people saw "the" broken headlight (vs "a" broken headlight) made them more likely to report seeing one. What did findings like this do to theories of long-term memory?`,
c:`Forced a revision: memories are reconstructed, not stored as fixed copies`,
x:[[`Proved that long-term memory is a permanent, fixed storehouse of exact copies`,`It showed the opposite: memories are easily reshaped.`],
[`Showed that wording only affects short-term memory`,`The effect was on remembering a filmed event, i.e., long-term memory.`],
[`Ended the need for any theory of memory at all`,`Theories got more complex, not discarded entirely.`],
[`Confirmed that memory theories can't be falsified`,`The data did challenge the theory; that's falsification at work.`]],
e:`Theories get {g:modified} when new research shows their limits. Long-term memory was first described as a permanent store; work like Loftus's showed memories are {g:reconstructed}, requiring a more complex theory.`});

Q({t:`order`, k:`Idea to prediction`, q:`Order these from most general and abstract to most specific and practical.`,
i:[`Idea: false memories seem common`,`Theory: fuzzy trace theory (verbatim vs gist memory)`,`Hypothesis: time pressure increases reliance on gist memory`,`Prediction: participants will falsely recall "cold" from this word list`],
e:`{g:Idea → theory → hypothesis → prediction}. Each step gets more specific. The hypothesis uses {g:conceptual} variables; the prediction is stated with the study's {g:operational} details.`});

Q({t:`match`, k:`Idea to prediction`, q:`Match each term to its meaning.`,
p:[[`Idea`,`Unorganized thoughts or principles about behaviour`],
[`Theory`,`An organized set of principles explaining how behaviour operates`],
[`Hypothesis`,`A general statement of a relationship between conceptual variables`],
[`Prediction`,`A specific claim about what will happen in this particular study`],
[`Model`,`A metaphor for understanding experience, like "child as sponge"`]],
e:`A {g:model} in this sense is a metaphor: the child as a sponge or little scientist, or the iceberg for Id/Ego/Superego.`});

Q({tr:1, k:`Hypothesis vs prediction`, q:`What is the difference between a hypothesis and a prediction?`,
c:`A hypothesis relates concepts; a prediction states the result in this exact study's measures`,
x:[[`A hypothesis is tested once; a prediction is tested many times`,`The difference is abstraction level, not how often each is tested.`],
[`A hypothesis is a guess; a prediction is a proven conclusion`,`Neither is proven. A prediction is just more specific.`],
[`A hypothesis uses operational definitions, while a prediction uses only conceptual ones`,`It's the other way around.`],
[`A hypothesis appears in the Discussion section; a prediction appears in the Results section`,`Both usually appear in the Introduction.`]],
e:`{g:Hypothesis} = relationship between {g:concepts} (conceptual variables). {g:Prediction} = relationship between the {g:specific operational definitions}, stated within the context of the exact study (often in future tense: "participants will...").`});

Q({k:`Hypothesis vs prediction`, q:`"People diagnosed with schizophrenia will have more herpes simplex antibodies in a 50 cc blood draw than people without the diagnosis." Is this a hypothesis or a prediction?`,
c:`A prediction, because it names the exact measure for this study`,
x:[[`A hypothesis, because it describes a relationship between variables`,`Both describe relationships. This one is operational and specific.`],
[`A theory, because it explains why schizophrenia happens`,`It doesn't explain anything; it predicts a specific result.`],
[`An idea, because it hasn't been tested yet`,`Untested doesn't make it an idea. It's already very specific.`],
[`A hypothesis, because it's written in the future tense`,`Future tense is actually typical of predictions.`]],
e:`"Schizophrenia is caused by a virus" is the {r:hypothesis} (conceptual). Specifying {g:antibodies in 50 cc of blood} makes it a {g:prediction} tied to this study's operational definitions.`});

Q({t:`sort`, k:`Hypothesis vs prediction`, q:`Sort each statement as a hypothesis or a prediction.`,
b:[`Hypothesis`,`Prediction`],
i:[[`Crowded environments impair cognitive performance`,0],
[`Participants in the uncrowded room will recall more words on the delayed recall task`,1],
[`Hunger increases aggression`,0],
[`Kids who skipped lunch will hit the inflatable clown more times`,1],
[`Time pressure increases reliance on gist memory`,0],
[`Participants under a 2-second limit will falsely recall "cold" more often`,1]],
e:`Hypotheses use {g:conceptual} terms (crowding, hunger, gist memory). Predictions name the {g:operational} details: the specific task, measure and conditions.`});

Q({k:`Idea to prediction`, q:`Participants study the list: hot, snow, warm, winter, ice, wet, frigid, chilly, heat, weather, freeze, air, shiver, arctic, frost. Fuzzy trace theory predicts a false memory for which word, and why?`,
c:`"Cold," because it fits the gist of the list even though it never appeared`,
x:[[`"Chilly," because it appeared in the middle of the list, where memory is weakest`,`"Chilly" was on the list, so remembering it is accurate, not false.`],
[`"Hot," because it was the first word people saw`,`"Hot" was on the list. A false memory is for a word that wasn't.`],
[`"Summer," because it's the opposite of the list's theme`,`Opposites don't match the gist; "cold" does.`],
[`"Frost," because it was the last word on the list`,`"Frost" was on the list, so it's a true memory.`]],
e:`Fuzzy trace theory: {g:verbatim} memory is relatively accurate; {g:gist} memory is relatively inaccurate. "{g:Cold}" matches the gist of the list, so people falsely "remember" it.`});
