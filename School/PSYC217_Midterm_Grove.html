<style>
:root { --bg: #EBF1E7; --paper: #F7FAF4; --surface: #FFFFFF; --ink: #1E2C23; --ink2: #44574B; --muted: #6E8174; --line: #D2DDCD; --line-strong: #A9BBA7;
  --moss: #46775A; --moss-strong: #2F5A3E; --on-moss: #F5FAF2; --clay: #B3473E; --tree: #3A7A4D; --bark: #8C7457; color-scheme: light; }
:root[data-theme="dark"] { --bg: #0E1511; --paper: #141E18; --surface: #19251E; --ink: #E0EBE2; --ink2: #B1C2B6; --muted: #7F9387; --line: #26352C; --line-strong: #3E5245;
  --moss: #86BE94; --moss-strong: #A8D6B3; --on-moss: #0E1511; --clay: #EC8B7F; --tree: #74C28B; --bark: #8A7558; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 1.5;
  display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { width: 100%; max-width: 380px; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; display: flex; flex-direction: column; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 42px; height: 50px; flex: none; color: var(--tree); }
h1 { margin: 0; font-family: 'Coming Soon', 'Comic Sans MS', 'Chalkboard SE', cursive; font-weight: 400; font-size: 2rem; line-height: 1.1; color: var(--moss-strong); }
p { margin: 0; color: var(--ink2); }
form { display: flex; flex-direction: column; gap: 10px; }
label { font-size: .9rem; font-weight: 600; color: var(--ink2); }
input { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 12px; padding: 11px 14px; width: 100%; }
input:focus-visible, button:focus-visible { outline: 2.5px solid var(--moss); outline-offset: 2px; }
button { font: inherit; font-weight: 600; cursor: pointer; border: none; border-radius: 999px; padding: 11px 18px; background: var(--moss); color: var(--on-moss); }
button:hover { background: var(--moss-strong); }
button:disabled { opacity: .6; cursor: wait; }
.err { min-height: 1.4em; font-size: .9rem; color: var(--clay); }
.wait { font-family: 'Coming Soon', 'Comic Sans MS', cursive; color: var(--muted); }
.shake { animation: shake .32s ease; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
[hidden] { display: none !important; }
</style>
