Q({t:`fill`, k:`Idea to prediction`, q:`In fuzzy trace theory, verbatim memory is relatively accurate, while ___ memory (the general meaning) is relatively inaccurate.`,
a:[`gist`],
e:`{g:Gist} = the general meaning or theme. It's why people falsely remember "cold" from a list of cold-related words.`});

Q({t:`match`, k:`Types of prediction`, q:`Match each type of prediction to an example.`,
p:[[`Nondirectional`,`There is a relationship between viral load and schizophrenia`],
[`Directional`,`As viral load increases, schizophrenia risk increases`],
[`Point`,`Each 1 mg/cc increase in viral load doubles schizophrenia risk`]],
e:`{g:Nondirectional} (any relationship), {g:directional} (which way), {g:point} (exactly how much). More precise = riskier = more impressive if correct.`});

Q({k:`Types of prediction`, q:`Which prediction is the riskiest, but earns the most if it turns out correct?`,
c:`A point prediction, stating exactly how much one variable changes with another`,
x:[[`A nondirectional prediction, which says only that some kind of relationship exists`,`This is the lowest risk: only falsified if there's no relationship.`],
[`A directional prediction, saying which way the relationship goes`,`Riskier than nondirectional, but less risky than a point prediction.`],
[`A null prediction, saying no relationship will be found`,`Not one of the three types discussed, and not the riskiest.`],
[`A hypothesis, because it's broader than any prediction`,`Broader means less risky, not more.`]],
e:`A {g:point prediction} is very easy to falsify (it has to be exactly right), so when it holds up, you gain a lot. "When you risk more, you get more."`});

Q({k:`Types of prediction`, lv:`hard`, q:`A directional prediction says "as viral load increases, schizophrenia increases." Which results would falsify it?`,
c:`Finding no relationship, or finding a negative relationship`,
x:[[`Only finding no relationship at all`,`That alone falsifies a nondirectional prediction. A directional one also fails if the sign is wrong.`],
[`Only finding a relationship that isn't perfectly straight-line linear`,`A positive but curved relationship would still fit "as one increases, so does the other."`],
[`Finding a positive relationship of any size`,`That would support the prediction.`],
[`Finding that risk doesn't exactly double`,`That would falsify a point prediction, not a directional one.`]],
e:`Directional = falsified if {g:no relationship} {g:or} the relationship goes the {g:opposite} way (negative). Nondirectional is only falsified by no relationship.`});

Q({t:`hot`, k:`Article structure`, q:`Click the section where you'd find how many people took part and exactly what they did.`,
fig:{k:`article`}, a:`method`,
why:{results:`Results reports findings and statistics, not the procedure.`, intro:`The introduction explains the problem and hypotheses, not the procedure.`, abs:`The abstract is too brief; full details are in the Method.`, disc:`The discussion interprets results; it doesn't detail the procedure.`, refs:`References list cited works.`},
e:`The {g:Method} gives every detail needed to {g:replicate} the study: participants (how many, who, how recruited, any excluded), materials, measures, design and procedure.`});

Q({t:`hot`, k:`Article structure`, q:`Click the section where authors discuss limitations, alternative explanations and future directions.`,
fig:{k:`article`}, a:`disc`,
why:{results:`Results stay brief and objective, with little interpretation.`, intro:`The introduction sets up the question; limitations come after the data.`, method:`The method describes what was done, not what it means.`, abs:`The abstract rarely includes much from the discussion.`, refs:`References only list sources.`},
e:`The {g:Discussion} starts by recapping results, then widens: do results support the hypotheses, why or why not, {g:limitations}, comparisons with past research, {g:future directions} and applications. That's why it's drawn widening at the bottom of the hourglass.`});

Q({t:`match`, k:`Article structure`, q:`Match each article section to what it contains.`,
p:[[`Abstract`,`A brief summary of the whole study, often about 120 words`],
[`Introduction`,`The problem, past research, a gap, and the hypotheses`],
[`Method`,`Participants and procedure, detailed enough to replicate`],
[`Results`,`The findings and statistics, with little interpretation`],
[`Discussion`,`What results mean, limitations, and future directions`],
[`References`,`Full details of every source cited`]],
e:`The hourglass: intro starts {g:broad} and narrows to the study; method and results are {g:narrow}; discussion widens back out.`});

Q({k:`Article structure`, q:`Why shouldn't you rely on the abstract alone to understand a study?`,
c:`It's a very short summary, so it can give a mistaken impression`,
x:[[`Abstracts are written by editors, not by the study's authors`,`Authors write their own abstracts.`],
[`Abstracts usually contradict what the article's results section actually reports`,`They summarize results; they don't usually contradict them.`],
[`Abstracts contain only the references, not the findings`,`Abstracts include the hypothesis, procedure and broad results.`],
[`Abstracts are not peer reviewed along with the article`,`They're part of the reviewed article.`]],
e:`Use the abstract to decide {g:if} an article is relevant. Then read the whole thing. Being skeptical means not trusting a 120-word summary to tell the whole story.`});

Q({tr:1, k:`Literature`, q:`What is a meta-analysis, and how does it differ from a literature review?`,
c:`A meta-analysis pools results statistically; a literature review summarizes in words`,
x:[[`A meta-analysis summarizes in words; a literature review uses statistics`,`That's flipped.`],
[`A meta-analysis is one large new study, while a literature review is a much smaller one`,`Neither collects new data; both summarize past research.`],
[`A meta-analysis is peer reviewed; a literature review is not`,`Both can be peer-reviewed articles.`],
[`They're the same thing published in different journals`,`They differ in method: quantitative vs narrative.`]],
e:`{g:Meta-analysis} includes a {g:quantitative} component (re-analyzing past data statistically). A {r:literature review} is limited to a {r:narrative} summary.`});

Q({t:`match`, k:`Finding articles`, q:`Match each search tool to its best use.`,
p:[[`PsycINFO`,`Psychology database with advanced limits, like peer-reviewed only or age group`],
[`Web of Science`,`Cited reference search: find every later article citing a key paper`],
[`Google Scholar`,`Broad scholarly search with a "Cited by" link, but no peer-review filter`],
[`Wikipedia`,`A starting point for terminology and references; not a citable source`]],
e:`{g:PsycINFO} = APA's database, precise filters. {g:Web of Science} = cited reference searches across disciplines. {g:Google Scholar} = broad, includes books and dissertations, can't filter peer review. {g:Wikipedia} = starting point only.`});

Q({k:`Finding articles`, q:`You found the article that introduced a self-esteem scale. You want every later article that used or mentioned that scale. What's the best strategy?`,
c:`Do a cited reference search on that article`,
x:[[`Search Wikipedia for the scale's name`,`Wikipedia might list a few references, but not every citing article.`],
[`Read only the abstract of the original article`,`The abstract can't tell you about later articles.`],
[`Look at the original article's reference list`,`The reference list shows older work it cited, not newer work citing it.`],
[`Do a general internet search for "self-esteem"`,`Too broad, and not limited to scholarly work.`]],
e:`A {g:cited reference search} (Web of Science, or Google Scholar's "Cited by") finds articles that cite a key paper, like a scale's original publication. The reference list goes {r:backward} in time; cited-by goes {g:forward}.`});

Q({k:`Finding articles`, lv:`hard`, q:`Which statement about journals is true?`,
c:`All peer-reviewed journals are scholarly, but not all scholarly publications are peer reviewed`,
x:[[`All scholarly publications are peer reviewed, but not all peer-reviewed journals are scholarly`,`That's flipped.`],
[`Every article in a peer-reviewed journal is high quality and error free`,`Peer review is imperfect. Read critically anyway.`],
[`Most papers submitted to a journal end up being published there`,`Most submissions are rejected.`],
[`A journal published only online can't be peer reviewed`,`Online-only journals can be peer reviewed.`]],
e:`{g:Peer-reviewed ⊂ scholarly}. And peer review isn't a guarantee: published articles still deserve a critical eye. Watch out for {r:predatory journals} too, which can trick readers and be used manipulatively.`});

Q({k:`Finding articles`, q:`Which website feature should make you MOST skeptical?`,
c:`It's run by one person with a clear agenda and gives no credible references`,
x:[[`It's hosted by a major university or a well-known, established research organization`,`That's a sign of credibility, not a red flag.`],
[`It names the authors and lists their contact details`,`That lets you verify credentials, which is good.`],
[`It links to peer-reviewed articles you can check yourself`,`Checkable references are a good sign.`],
[`The information was updated recently`,`Current information is a plus.`]],
e:`Check: {g:credible references}? {g:Reputable sponsor}? {g:Named, checkable authors}? {g:Current}? Links to {g:legitimate organizations}? A single individual with a clear bias and no references deserves extra skepticism.`});

Q({t:`hot`, k:`APA references`, q:`In this APA reference, click the journal volume number.`,
fig:{k:`ref`}, a:`vol`,
why:{pages:`585–589 are the page numbers.`, year:`1974 is the publication year.`, jour:`That's the journal's name.`, title:`That's the article title.`, auth:`Those are the authors.`},
e:`APA journal reference: {g:Authors. (Year). Title. Journal, Volume, Pages.} Here the volume is {g:13}. References are listed alphabetically by first author's last name.`});

Q({k:`Variables`, q:`In a study where every participant is a 19-year-old woman, which of these is NOT a variable in that study?`,
c:`Gender`,
x:[[`Hours slept last night`,`Sleep differs between participants, so it varies.`],
[`Memory test score`,`Scores differ, so it's a variable.`],
[`Reaction time`,`Reaction times differ across people.`],
[`Self-reported stress`,`Stress levels differ across people.`]],
e:`A {g:variable} must take on {g:more than one value}. If everyone is a woman, gender is held {r:constant} here, so it isn't a variable in this study (even though it can be in others).`});

Q({t:`fill`, k:`Variables`, q:`A definition of a variable in terms of the exact techniques used to measure or manipulate it is an ___ definition.`,
a:[`operational`,`operationalization`],
e:`{g:Operational definition} = "How did you measure/manipulate it?" {r:Conceptual definition} = "What is it?" Example: schizophrenia (concept) vs number of DSM symptoms (operational).`});

Q({t:`sort`, k:`Variables`, q:`Sort each definition as conceptual or operational.`,
b:[`Conceptual`,`Operational`],
i:[[`Aggression: behaviour intended to harm another person`,0],
[`Aggression: number of times a child punches an inflatable clown`,1],
[`Schizophrenia: number of DSM symptoms present`,1],
[`Virus exposure: antibodies found in 50 cc of blood`,1],
[`Stress: feeling overwhelmed by demands you can't meet`,0],
[`Hunger: hours since the participant last ate`,1]],
e:`Conceptual = the meaning (what is it?). Operational = the {g:procedure}: a count, a score, a lab measure. There's never one perfect operationalization, so researchers argue for theirs.`});

Q({k:`Variables`, q:`Theories and hypotheses use ___ definitions of variables, while predictions use ___ definitions.`,
c:`conceptual; operational`,
x:[[`operational; conceptual`,`Flipped. Predictions are the specific, operational ones.`],
[`nominal; quantitative`,`Those are kinds of variable levels, not kinds of definitions.`],
[`independent; dependent`,`Those describe roles in an experiment, not definitions.`],
[`causal; correlational`,`Those describe methods, not definitions.`]],
e:`Hypothesis → prediction = {g:general → specific}, {g:conceptual → operational}. "Schizophrenia is related to virus exposure" (conceptual) → "DSM symptom count will correlate with antibodies in 50 cc of blood" (operational).`});

Q({t:`sort`, k:`Variables`, q:`Sort each variable as nominal (categories) or quantitative (amounts).`,
b:[`Nominal`,`Quantitative`],
i:[[`Alive or dead`,0],[`Distraction vs no distraction`,0],[`Kilos of dog treats given`,1],[`Words recalled, 0–15`,1],[`Country of birth`,0],[`GPA from 0.0 to 4.0`,1],[`Room temperature in °C`,1]],
e:`{g:Nominal} = groups with no numeric properties. {g:Quantitative} = real amounts. Same concept can be either: room temperature as hot/warm/cold vs in degrees.`});

Q({t:`match`, k:`Variable types`, q:`Match each kind of variable to an example.`,
p:[[`Situational variable`,`How many people are in the room while you write a test`],
[`Response variable`,`How quickly a participant presses a key after a tone`],
[`Participant variable`,`A participant's level of trait extraversion`]],
e:`{g:Situational} = feature of the environment (can be manipulated). {g:Response} = the participant's reaction (measured). {g:Participant} = something people bring with them (can't be randomly assigned).`});

Q({t:`sort`, k:`Variable types`, q:`Sort each into situational, response or participant variable.`,
b:[`Situational`,`Response`,`Participant`],
i:[[`Credibility of the person trying to persuade you`,0],[`Length of a passage being read`,0],[`Emotional reaction to a film clip`,1],[`Score on a cognitive task`,1],[`Cultural background`,2],[`Age`,2]],
e:`Situational variables can be {g:manipulated}; response variables are {g:measured} in any design; participant variables are {g:pre-existing} and can only be measured or used to group people.`});

Q({t:`hot`, k:`Relationships`, q:`Teachers' efficacy beliefs rise with their first years of experience, then fall with further years. Click the graph that shows this.`,
fig:{k:`rel4`}, a:`curv`,
why:{pos:`This keeps rising; efficacy beliefs eventually fall.`, neg:`This falls the whole time; beliefs rise first.`, none:`A flat line means no relationship.`},
e:`Rising then falling = {g:curvilinear}, specifically an {g:inverted U}. The direction changes at least once.`});

Q({k:`Relationships`, lv:`hard`, q:`"Reducing the number of hours of sleep is associated with a decrease in attention in class." What relationship is this?`,
c:`Positive: less sleep goes with less attention`,
x:[[`Negative: "reducing" and "decrease" signal a negative link`,`Both variables move the same way (down with down), which is positive.`],
[`Curvilinear: the effect changes direction`,`Nothing here says the direction changes.`],
[`No relationship: the variables move independently`,`They move together.`],
[`Mediated: attention explains the sleep effect`,`No third variable is named.`]],
e:`Don't get tricked by negative-sounding words. Ask: do they move in the {g:same direction}? Less sleep → less attention = same direction = {g:positive}.`});

Q({k:`Relationships`, q:`"As people gain experience speaking in public, their anxiety decreases." What relationship is this?`,
c:`Negative linear`,
x:[[`Positive linear`,`Positive means both go up together. Here one goes up while the other goes down.`],
[`Curvilinear`,`The direction doesn't change partway.`],
[`No relationship`,`Anxiety clearly changes with experience.`],
[`Inverted U`,`An inverted U rises then falls; this only falls.`]],
e:`One {g:up}, the other {g:down} = {g:negative}. Like caffeine and that night's sleep, or advisor satisfaction and depression.`});

Q({t:`sort`, k:`Relationships`, q:`Sort each example by the type of relationship it describes.`,
b:[`Positive`,`Negative`,`Curvilinear`],
i:[[`More calories eaten goes with higher body weight`,0],[`More partying goes with lower grades`,1],[`Basketball performance rises with arousal to a moderate level, then drops`,2],[`More education goes with higher income`,0],[`The more exercise a puppy gets, the less it chews things`,1],[`Liking a song rises with each listen, then falls after too many`,2]],
e:`Same direction = {g:positive}. Opposite directions = {g:negative}. Direction changes = {g:curvilinear} (the "beer-fun curve" works the same way).`});

Q({k:`Relationships`, lv:`warm`, q:`Across all phases of the moon, the number of car accidents stays about the same. On a graph this is:`,
c:`A flat horizontal line: no relationship`,
x:[[`A line rising left to right: positive`,`Accidents don't increase with moon phase.`],
[`A line falling left to right: negative`,`Accidents don't decrease with moon phase.`],
[`An upside-down U: curvilinear`,`There's no peak in the middle.`],
[`A steep line: a strong relationship`,`Steepness would mean change; here nothing changes.`]],
e:`{g:No relationship} = flat line. Changes in one variable aren't associated with changes in the other, despite the popular belief about full moons.`});

Q({k:`Relationships`, q:`You know a heavy smoker who lived to 95 without cancer. What does this tell you about the link between smoking and cancer?`,
c:`Nothing much: correlations describe group trends, and individuals vary`,
x:[[`It disproves the link, since a single exception breaks any real group pattern`,`One exception doesn't invalidate a group trend.`],
[`It shows the correlation must be curvilinear`,`One person can't reveal the shape of a relationship.`],
[`It proves smoking prevents cancer for some people`,`One case can't prove anything causal.`],
[`It means the correlation coefficient is exactly zero`,`The group trend is unaffected by one case.`]],
e:`Relationships are almost never perfect. Correlations capture the {g:overall trend} across many people, so individuals can deviate. That's also why group data can't predict any one person exactly, like stereotypes.`});

Q({k:`Relationships`, lv:`hard`, q:`When is the relationship between narcissism and constant Facebook use strongest?`,
c:`90% of high narcissists and 10% of low narcissists use it constantly`,
x:[[`60% of high narcissists and 40% of low narcissists use it constantly`,`That gap is smaller, so there's more noise and a weaker relationship.`],
[`50% of high narcissists and 50% of low narcissists use it constantly`,`Equal rates mean no relationship.`],
[`55% of high narcissists and 45% of low narcissists use it constantly`,`Tiny gap, weak relationship.`],
[`40% of high narcissists and 60% of low narcissists use it constantly`,`That's a weak negative relationship.`]],
e:`Relationships are stronger when there's {g:less error variability} (less noise, clearer signal). A 90/10 split is far less uncertain than 60/40. Adding predictors (like low self-esteem) can reduce uncertainty further.`});

Q({t:`hot`, k:`Mediation`, q:`Inattentive kids have more peer problems, partly because inattention lowers prosocial concern and raises behaviour problems. Click one of the mediators.`,
fig:{k:`causal`, ty:`med2`, a:`Inattention`, b:`Peer problems`, m1:`Prosocial concern`, m2:`Behaviour problems`}, a:[`m1`,`m2`],
why:{a:`Inattention is the starting variable, not the process in between.`, b:`Peer problems is the outcome.`},
e:`A {g:mediator} sits {g:between} two variables and explains how/why they're related. Here both {g:prosocial concern} and {g:behaviour problems} mediate the inattention → peer problems link. That suggests an intervention: train concern for peers.`});

Q({k:`Mediation`, q:`Which best defines a {k:mediating variable}?`,
c:`A process the first variable changes, which in turn changes the outcome`,
x:[[`A variable that changes the strength of a relationship at different levels`,`That describes a moderator.`],
[`An unmeasured variable that causes both of two related variables`,`That's a third variable.`],
[`A variable that changes along with the IV and could explain the result`,`That's a confound.`],
[`The variable an experimenter manipulates to see its effect`,`That's the independent variable.`]],
e:`{g:Mediator}: IV → {g:mediator} → DV. It's the psychological process that explains {g:how or why}. Contrast with {r:moderator} (when/for whom), {r:third variable}, {r:confound}.`});

Q({k:`Methods`, lv:`warm`, q:`In a non-experimental (correlational) study, how are the variables handled?`,
c:`All of them are measured; none are manipulated`,
x:[[`One is manipulated and the other is measured`,`That's the experimental method.`],
[`All of them are manipulated by the researcher`,`Nothing is manipulated in a non-experiment.`],
[`They're randomly assigned to participants`,`Random assignment is part of experiments.`],
[`They're held constant across conditions`,`Holding things constant is experimental control.`]],
e:`Non-experimental method = {g:measure} the variables and see if they {g:covary}. Experimental method = {r:manipulate} one, control others, measure the outcome.`});

Q({k:`Methods`, q:`Which is an advantage of the non-experimental method?`,
c:`It captures natural behaviour and works for variables you can't manipulate`,
x:[[`It allows strong cause-and-effect conclusions about the variables it measures`,`That's the experiment's big advantage, not this one.`],
[`It gives researchers high control over all the extra variables that could interfere`,`Non-experiments have little control.`],
[`It can detect tiny effects lasting milliseconds`,`That's a strength of controlled experiments.`],
[`It removes the third-variable problem`,`Third variables are exactly its weakness.`]],
e:`Non-experimental strengths: {g:natural behaviour} (no interference, e.g., littering), {g:unmanipulable variables} (height, sex), and it's {g:great for prediction} because it mirrors the real world. Weakness: {r:no causal inference}.`});

Q({k:`Methods`, q:`Which is a disadvantage of the experimental method?`,
c:`Lab settings can be artificial, which can make real-world predictions poor`,
x:[[`It can't support any cause-and-effect conclusions about the variables`,`Causal inference is its main strength.`],
[`It gives the researcher too little control over extraneous variables`,`It gives the most control.`],
[`It can't detect small or brief effects, like differences in milliseconds`,`It's good at detecting those.`],
[`It always requires deceiving participants about the study's purpose`,`Many experiments use no deception.`]],
e:`Experiments: {g:causal inference}, {g:high control}, can catch {g:small/brief effects}. But they can be {r:unrealistic}, give {r:poor predictions} of everyday life, and some variables {r:can't be manipulated}.`});

Q({t:`hot`, k:`Third variables`, q:`Exercise and happiness are positively correlated. Click the variable that creates the third-variable problem.`,
fig:{k:`causal`, ty:`third`, a:`Exercise`, b:`Happiness`, c:`Wealth`}, a:`c`,
why:{a:`Exercise is one of the two correlated variables.`, b:`Happiness is one of the two correlated variables.`},
e:`{g:Wealth} could cause both more exercise (gym, free time) and more happiness, making them look causally linked even if they aren't. Third variables are why correlation alone can never prove cause.`});

Q({k:`Third variables`, q:`Researchers find exercise and happiness are correlated. Someone asks, "Maybe happy people are just more likely to exercise?" Which problem is this?`,
c:`The direction-of-cause problem`,
x:[[`The third-variable problem`,`That would involve an outside variable causing both.`],
[`A confound in the operational definition`,`Nothing here is about how variables were measured.`],
[`A ceiling effect`,`That's about a measure being too easy.`],
[`A lack of covariation`,`They do covary; that's the premise.`]],
e:`{g:Direction of cause}: does A → B, or B → A? Both could even be true. Knowing {g:temporal precedence} helps, and experiments can settle it for some questions.`});

Q({k:`Third variables`, lv:`hard`, q:`Weekly drinking correlates with lower grades. Poor decision-making might cause both; time spent socializing is tangled up with drinking in how it was measured. Which is the third variable and which is the confound?`,
c:`Decision-making is the third variable; socializing is the confound`,
x:[[`Socializing is the third variable; decision-making is the confound`,`Flipped. Socializing doesn't cause drinking; it's intertwined with it.`],
[`Both are third variables, since both relate to grades`,`Only one causes both drinking and grades.`],
[`Both are confounds, since neither was manipulated`,`Decision-making causes both variables, which makes it a third variable.`],
[`Neither; they're both mediators of drinking's effect`,`A mediator would be caused by drinking and then affect grades.`]],
e:`{g:Third variable} = {g:causes both} variables (decision-making → drinking, decision-making → grades). {g:Confound} = {g:intertwined} with a variable so you can't tell which is at work (socializing travels with drinking but doesn't cause it).`});

Q({k:`Third variables`, q:`Correlations can reflect A causing B, B causing A, or a third variable C. How do these possibilities relate?`,
c:`They aren't mutually exclusive; all three could be true at once`,
x:[[`Only one can be true for any given correlation`,`They can co-exist.`],
[`If A causes B, then B can't also cause A`,`Reciprocal causation is possible.`],
[`A third variable rules out any direct causal link between the two variables`,`A direct link might still exist alongside it.`],
[`They only apply to experiments, not correlations`,`These are problems of non-experimental designs.`]],
e:`The possibilities are {g:not mutually exclusive}. Exercise might boost happiness, happiness might boost exercise, and income might boost both, all at once.`});

Q({k:`Confounds`, lv:`hard`, q:`To test whether thinking about fast food makes people impatient, participants see either fast-food logos or same-sized plain squares flash on screen. What's the potential confound?`,
c:`Logos differ from squares in more than fast food, like colour and familiar brands`,
x:[[`The squares and logos were the same size, which made them too similar`,`Equal size is good control.`],
[`Impatience was measured after the images instead of before them`,`Measuring after the manipulation is correct.`],
[`Participants did an unrelated task while the images flashed on screen`,`That's part of the cover; it's the same in both conditions.`],
[`Only one independent variable was manipulated, so nothing else was held under control`,`One IV is fine for a simple experiment.`]],
e:`A confound sneaks in through the {g:operationalization}: logos are {g:colourful, meaningful, familiar} images; squares aren't. Any of those differences, not "fast food" itself, could explain the result. A better control: other logos or images matched on those features.`});

Q({k:`Confounds`, q:`A researcher operationalizes intelligence as academic average, then finds it predicts career success. Why might that conclusion be confounded?`,
c:`Grades also reflect motivation, conscientiousness and income`,
x:[[`Academic average is a nominal variable, so it can't predict any outcome`,`It's quantitative.`],
[`Career success can't be measured`,`It can be operationalized.`],
[`Intelligence can't be related to success`,`It might well be. The question is what grades capture.`],
[`The sample is too large for a real effect to show up in the data`,`Large samples help detect effects.`]],
e:`If the operationalization captures {g:more than the intended variable} ({g:conscientiousness}, {g:motivation}, {g:socioeconomic status}), you can't tell which one drove the result. Researchers try to measure suspected confounds and rule them out statistically.`});

Q({t:`match`, k:`Variable roles`, q:`Soft music study: students are randomly assigned to soft music (over headphones) or no music during an exam. Anxiety is measured mid-exam; scores later. Match each study variable to its role.`,
p:[[`Music condition`,`Independent variable`],
[`Exam score`,`Dependent variable`],
[`Test anxiety`,`Mediating variable`],
[`Major (music vs non-music)`,`Participant variable`],
[`Wearing headphones`,`Confounding variable`]],
e:`Music is manipulated ({g:IV}); exam score is the outcome ({g:DV}); anxiety is the process music works through ({g:mediator}); major is brought in ({g:participant variable}); headphones only in the music group = {g:confound}.`});

Q({k:`Causality`, q:`How does an experiment build in temporal precedence?`,
c:`The IV is manipulated first, and the DV is measured afterward`,
x:[[`Both variables are measured at the same time, so order is equal`,`Measuring at the same time is why many correlational studies lack temporal order.`],
[`The DV is measured first, then the IV`,`That's backward.`],
[`Participants report which came first`,`Self-report of order isn't how experiments establish it.`],
[`Random assignment sets the order in which the two variables occur`,`Random assignment equates groups; the manipulate-then-measure sequence sets the order.`]],
e:`Manipulate the {g:IV first}, then measure the {g:DV}. That ordering is one reason experiments can support causal claims while many correlational designs can't.`});

Q({k:`Causality`, q:`Reading the textbook is required to do well on an exam, but reading alone doesn't guarantee a high grade. Reading is:`,
c:`Necessary but not sufficient`,
x:[[`Sufficient but not necessary`,`Sufficient would mean reading always produces a high grade.`],
[`Both necessary and sufficient`,`It doesn't guarantee a high grade, so not sufficient.`],
[`Neither necessary nor sufficient`,`It's required here, so it's necessary.`],
[`A third variable`,`Reading is the proposed cause, not an outside variable.`]],
e:`{g:Necessary} = must be present for the effect. {g:Sufficient} = always produces the effect. Most psychological outcomes have many causes, so "necessary and sufficient" causes are rare; researchers think in terms of causal networks.`});

Q({k:`Methods`, q:`What's the trade-off of running an experiment in the field rather than the lab?`,
c:`More natural setting, but less control over extraneous variables`,
x:[[`More control over variables, but participants know they're being studied`,`Field experiments usually mean less control.`],
[`Causal conclusions become impossible`,`Field experiments still manipulate and randomize when possible.`],
[`It turns the study into a correlational design`,`The IV is still manipulated.`],
[`It always produces opposite results from lab studies`,`Lab and field results usually agree, though small lab effects sometimes flip.`]],
e:`{g:Field experiment} = manipulate the IV in a {g:natural setting}. Gain realism and generalizability; lose some {r:control}. Lab and field results tend to agree, though small lab effects are more likely to flip in the field.`});

Q({k:`Methods`, lv:`hard`, q:`Non-experimental studies found women taking hormone replacement therapy had less heart disease, but a randomized experiment found more. What best explains the difference?`,
c:`Women who chose hormones likely differed in other ways, like health and income`,
x:[[`The experiment had too much experimental control`,`Control is what made the experiment trustworthy.`],
[`Hormones affect heart disease only in experiments`,`The biology doesn't change; the comparison groups did.`],
[`Random assignment in the experiment created new selection differences between women`,`Random assignment removes them.`],
[`Non-experimental studies can't measure heart disease accurately in older women`,`They measured it; the problem was who ended up in each group.`]],
e:`In the correlational studies, women {g:self-selected} into hormone use, so {g:third variables} (health, wealth, health habits) could explain lower heart disease. Random assignment equalized those, revealing the true effect.`});

Q({k:`Multiple methods`, q:`One researcher randomly assigned kids to music, drama or no lessons (IQ rose most with music), then separately correlated years of childhood lessons with adult IQ while controlling for family income. Why combine both?`,
c:`Each method covers the other's weakness: causation vs long-term duration`,
x:[[`The experiment was flawed, so the correlational study simply replaced it`,`The experiment was solid; the correlation added what it couldn't test.`],
[`Correlational designs prove causation when samples are large`,`They never prove causation alone.`],
[`Combining methods removes the need for random assignment`,`The experiment still needed random assignment.`],
[`Journals require two methods in every article`,`There's no such rule.`]],
e:`The {g:experiment} showed music lessons {g:cause} an IQ boost. Years of lessons can't easily be randomly assigned, so a {g:correlational} study tested duration and long-term links. Different methods pointing to one conclusion = more confidence.`});

Q({k:`Methods`, q:`Why might a researcher study physical punishment and child outcomes with a non-experimental design?`,
c:`Randomly assigning parents to use physical punishment would be unethical`,
x:[[`Non-experiments give stronger causal evidence for parenting questions`,`They give weaker causal evidence.`],
[`Child outcomes can only ever be measured with parent self-reports`,`They can be measured many ways.`],
[`Experiments aren't allowed to include children as participants`,`Experiments can include children.`],
[`Physical punishment has no levels that could be compared in a study`,`Punishment vs none are clear levels.`]],
e:`Some variables {g:could} be manipulated but it would be {g:unethical or impractical}. Non-experimental methods are crucial there. When groups are formed from real-world differences, it's a {g:quasi-experimental} design and can't support causal claims.`});

Q({t:`cloze`, k:`Third variables`, q:`Build the explanation of why a correlation can't show cause.`,
txt:`Even if exercise and happiness [[covary]], we can't conclude exercise causes happiness. The [[direction]] of cause could run the other way, and a [[third]] variable such as income could cause both. Only an [[experiment]], with a manipulated IV and [[random]] assignment, can rule these out.`,
d:[`mediator`,`survey`,`ceiling`],
e:`Covariation is necessary but not enough. {g:Direction of cause} and {g:third variables} are the two big limits of non-experimental designs.`});

Q({k:`Methods`, lv:`hard`, q:`What's the difference between the "correlational method" and the correlation statistic?`,
c:`The method means nothing is manipulated; the statistic can be used in any design`,
x:[[`They mean the same thing: both describe studies where variables covary`,`One is a design, the other is a calculation.`],
[`The statistic is only allowed in correlational studies, never experiments`,`It can be calculated in experiments too.`],
[`The method requires random assignment; the statistic doesn't need it`,`Correlational methods don't randomly assign.`],
[`The statistic proves causation, while the correlational method can only show prediction`,`No statistic turns correlation into causation.`]],
e:`{g:Correlational method} = a design where variables are observed, not manipulated. The {g:correlation statistic} (r) is a number you can compute in experiments or non-experiments.`});

Q({k:`Relationships`, lv:`warm`, q:`What's a {k:construct}?`,
c:`An abstract variable or idea, like happiness or social anxiety`,
x:[[`A variable that's always manipulated by the researcher in experiments`,`Constructs can be measured or manipulated.`],
[`The physical setting where a study is run`,`That's the research setting.`],
[`A statistic that measures relationship strength`,`That's a correlation coefficient.`],
[`The list of sources in a research article`,`That's the references section.`]],
e:`A {g:construct} is an abstract variable or phenomenon ({g:happiness, impulsivity, generosity}). Questionnaires and tasks are operationalizations of constructs.`});

S(3);

Q({t:`sort`, k:`IV and DV`, lv:`warm`, q:`Sort each piece of these experiments as the IV or the DV.`,
b:[`Independent variable`,`Dependent variable`],
i:[[`Watching a cartoon alone vs with others`,0],[`How funny people rate the cartoon`,1],[`Studying in silence vs with the TV on`,0],[`Score on a comprehension test`,1],[`Teachers told the parents finished university vs high school`,0],[`Teachers' rating of the child's potential`,1],[`Stress-management training vs no training`,0],[`Number of sick days over two months`,1]],
e:`{g:IV} = the "cause," the thing the researcher {g:manipulates}. {g:DV} = the "effect," what's {g:measured}; it "depends" on the IV.`});

Q({k:`IV and DV`, lv:`warm`, q:`"Does listening to relaxing music increase test performance?" Which is the dependent variable?`,
c:`Test performance`,
x:[[`Relaxing music vs no music`,`That's what's manipulated: the IV.`],
[`The headphones participants wear`,`Headphones are part of the setup, not the outcome.`],
[`Random assignment to conditions`,`That's a procedure, not a variable being measured.`],
[`The number of participants in the study`,`Sample size isn't a variable in the study.`]],
e:`The {g:DV} is the outcome you {g:measure}: test performance. Other names: outcome, response, measured variable. The IV goes by manipulated or situational variable.`});

Q({t:`pick`, k:`Confounds`, q:`A confound is like an "accidental IV." Select every condition a variable must meet to count as a confound.`,
i:[[`It covaries (changes) along with the levels of the IV`,1],
[`It can cause changes in the DV`,1],
[`It's the variable named in the hypothesis`,0,`That's the intended IV, not a confound.`],
[`It's held exactly equal across all conditions`,0,`If it's equal across conditions, it can't explain a difference between them.`],
[`It's the outcome the researcher measures`,0,`That's the DV.`]],
e:`Two rules: a confound must {g:covary with the IV} and must {g:cause change in the DV}. Miss either rule and it can't explain your results.`});

Q({t:`hot`, k:`Confounds`, q:`Relaxing music study. Click the feature that's a confound.`,
fig:{k:`conds`, c:[[`Relaxing music group`,[[`Hears relaxing music`,`iv`],[`Wears headphones`,`hp`],[`Same test`,`test`],[`Randomly assigned`,`ra`]]],[`Control group`,[[`Hears no music`,`iv`],[`No headphones`,`hp`],[`Same test`,`test`],[`Randomly assigned`,`ra`]]]]},
a:`hp`,
why:{iv:`That's the intended IV, the thing being tested.`, test:`The test is identical across groups, so it can't explain a difference.`, ra:`Random assignment is the fix for participant confounds, not a confound.`},
e:`{g:Headphones} vary with the IV (only the music group wears them) and could affect performance (they block {g:ambient noise}). Fix with {g:experimental control}: everyone wears headphones, so only the music differs.`});

Q({k:`Confounds`, q:`Everyone wears headphones, but participants choose whether to listen to music. 85% of the music group like relaxing music vs 25% of the controls. What kind of confound is this?`,
c:`A participant variable confound: music preference`,
x:[[`A situational confound: the headphones`,`Everyone wears headphones now, so that's controlled.`],
[`An order effect from the test`,`Each person only experiences one condition.`],
[`A ceiling effect on the test`,`Nothing suggests the test was too easy.`],
[`A demand characteristic created by revealing the hypothesis`,`The problem is who ended up in each group.`]],
e:`Letting people choose sorts them by a {g:pre-existing individual difference} (liking music), which covaries with the IV and could affect the DV. Fix: {g:random assignment}, or a {g:matched pairs} design on music preference.`});

Q({k:`Confounds`, q:`300 people commit to drinking either Coke or Pepsi daily for a week. Coke drinkers react 140 ms faster on an attention task. What's the main problem?`,
c:`People chose their drink, so drink preference is confounded with condition`,
x:[[`One week is too short a time for soda to affect attention at all`,`Duration isn't the core issue; who chose what is.`],
[`The flanker task can't measure visual attention in a valid way`,`It's a standard attention measure.`],
[`300 participants is too many for random assignment to balance the groups properly`,`More participants help random assignment.`],
[`Reaction time is a nominal variable, so the groups can't be compared`,`Reaction time is a ratio variable.`]],
e:`Self-selection sorts people by {g:drink preference}, which (1) correlates with the IV (drink condition) and (2) might relate to the DV. That's a {g:confound}. Randomly assign the drink instead.`});

Q({k:`Confounds`, lv:`hard`, q:`200 runners race twice (no differences between groups), then the caffeine group gets a 100 mg pill before two more races while the control group gets nothing. The caffeine group is 3.85 s faster. What's the biggest flaw?`,
c:`Controls got no pill, so expectations differ; they needed a placebo`,
x:[[`The first two races wasted time and should be dropped from the analysis`,`Those races acted as a pretest showing the groups started equal. That's good.`],
[`Running time can't be measured precisely enough`,`Timing to hundredths of a second is very precise.`],
[`200 runners is too few to detect an effect`,`200 is a decent sample.`],
[`Caffeine should have been given before every race, including the first two`,`Then there'd be no baseline races.`]],
e:`Only one group took a pill, so {g:expecting a boost} travels with the IV. A {g:placebo} pill for the control group would equate expectations, leaving caffeine as the only difference. (The pretest races were actually a smart touch.)`});

Q({k:`Confounds`, q:`50 kids take a reading test, complete 3 weeks of the "SuperSmarty" program, then retest 10 points higher. Why can't we credit the program?`,
c:`With no control group, normal growth, practice or regular school could explain it`,
x:[[`50 children is far too few to draw any conclusion about a program`,`Sample size isn't the main issue; missing comparison is.`],
[`Reading comprehension can't be tested twice using the same kind of exam with children`,`It can, though practice effects are a concern.`],
[`The program lasted too long to tell which week produced the change`,`Length isn't the problem.`],
[`The kids should only have been tested once, after finishing the program`,`A single test would tell us even less.`]],
e:`With {g:no comparison group}, the gain could come from {g:maturation}, {g:practice on the pretest}, or regular instruction. A randomly assigned control group would experience all of these too, isolating the program's effect.`});

Q({tr:1, k:`Confounds`, q:`Product testers pick which of two tractors to ride. Left-tractor riders rate it high in uniqueness and low in functionality; right-tractor riders rate theirs moderate on both. Which tractor is more functional?`,
c:`We can't tell: people chose their tractor, so the groups differ systematically`,
x:[[`The right tractor, because riders rated it as more functional than the left one`,`Different people rated each tractor, and they chose them.`],
[`The left tractor, because uniqueness signals quality`,`Uniqueness ratings don't tell us about function.`],
[`Both are equal, since the averages cancel out`,`Ratings from different self-selected groups can't be compared fairly.`],
[`The right tractor, since moderate ratings are more reliable than extreme ones`,`Moderate isn't more reliable; the design is confounded.`]],
e:`This is an {g:internal validity} problem. Participants {g:self-selected} their groups and almost certainly differ in participant variables before the study. The design is {g:confounded}.`});

Q({t:`fill`, k:`Internal validity`, q:`"Is the cause valid?" The degree to which we can say the IV, and nothing else, caused the change in the DV is called ___ validity.`,
a:[`internal`],
e:`{g:Internal validity}: its foe is the {r:confound}; its friends are {g:experimental control}, {g:random assignment} and {g:matched pairs}.`});

Q({k:`Internal validity`, q:`In the crowding study, the crowded condition has ten people in the room and the uncrowded condition has two. How do you remove the confound?`,
c:`Test everyone in groups of ten and vary crowding through seating`,
x:[[`Test everyone alone in the room, so nobody can possibly feel crowded`,`Then there's no crowding manipulation at all.`],
[`Give the crowded group an easier test`,`That adds a new confound.`],
[`Measure feelings of crowding with a questionnaire instead of manipulating them`,`That doesn't fix the number-of-people problem.`],
[`Add more people to the crowded room`,`That makes the confound bigger.`]],
e:`Number of people varies along with crowding. Hold it {g:constant} (always ten people) and manipulate crowding by {g:seating} (spread out vs packed). Now only crowding differs.`});

Q({t:`order`, k:`Planning an experiment`, q:`Put the three steps of planning a basic between-subjects experiment in order.`,
i:[`Decide how to assign participants so groups start equivalent`,`Operationalize the IV into at least two levels`,`Operationalize the DV and measure it the same way for everyone`],
e:`(1) {g:Equivalent groups} (random assignment or matched pairs), (2) {g:operationalize the IV}, (3) {g:operationalize the DV}. Then any DV difference can be attributed to the IV, if there are no confounds.`});

Q({t:`sort`, k:`Three designs`, q:`Sort each alternative name under the design it belongs to.`,
b:[`Between-subjects`,`Matched pairs`,`Repeated measures`],
i:[[`Independent groups`,0],[`Between-groups`,0],[`Posttest-only`,0],[`Pretest-posttest`,1],[`Dependent samples`,1],[`Within-subjects`,2],[`Within-groups`,2]],
e:`Same designs, many names. {g:Between} = independent groups/posttest-only; {g:matched pairs} = pretest-posttest/dependent samples; {g:repeated measures} = within-subjects/within-groups.`});

Q({t:`hot`, k:`Three designs`, q:`In this between-subjects design, click the step that keeps participant variables from becoming confounds.`,
fig:{k:`design`, ty:`between`}, a:`r`,
why:{p:`Recruiting participants doesn't make the groups equal.`, t1:`That's a level of the IV.`, t2:`That's a level of the IV.`, m1:`Measuring happens after the groups are formed.`, m2:`Measuring happens after the groups are formed.`},
e:`{g:Random assignment} gives everyone an equal chance of each condition, so participant characteristics (income, motivation, age) end up roughly equal across groups. It works better with bigger samples.`});

Q({k:`Three designs`, q:`Why don't within-subjects designs need random assignment to conditions?`,
c:`The same people do every condition, so each serves as their own control`,
x:[[`Within designs only recruit participants who are all identical to each other`,`People still differ; the design just compares each person to themselves.`],
[`Random assignment is replaced by a placebo group`,`Placebos control expectations, not participant variables.`],
[`Within designs don't compare conditions at all`,`They compare conditions within each person.`],
[`Counterbalancing makes participants identical`,`Counterbalancing handles order, not individual differences.`]],
e:`In a {g:within-subjects} design, groups for each condition are {g:the same people}, so participant variables are completely controlled. Order is still randomized or counterbalanced, though.`});

Q({k:`Three designs`, q:`Which pair are both advantages of a within-subjects design?`,
c:`Fewer participants needed, and more sensitivity to small effects`,
x:[[`No order effects, and less chance participants guess the hypothesis`,`Order effects and hypothesis guessing are its main weaknesses.`],
[`Works for permanent changes like surgery, and needs no counterbalancing`,`Permanent changes call for between-subjects designs.`],
[`No need for a DV, and no need for an IV`,`Every experiment needs both.`],
[`Participants see only one condition, and no pretest is needed`,`Seeing only one condition describes between-subjects.`]],
e:`Repeated measures is {g:much more powerful}: roughly 16 participants vs 450+ for a between design in one classic comparison, because {g:individual differences are removed from error}.`});

Q({k:`Three designs`, lv:`hard`, q:`Memory scores (Listen vs Read silently): P1 54 vs 58, P2 68 vs 71, P3 75 vs 82. Why is a within-subjects design better at detecting this effect?`,
c:`Every person improves when reading, so individual differences don't hide the effect`,
x:[[`Within designs make everyone's memory equally good, removing differences`,`People still differ (54 vs 75); the design just separates that out.`],
[`Within designs remove all random error, so every person's difference score is identical`,`The differences (+4, +3, +7) still vary a bit.`],
[`Within designs guarantee that order effects can't influence the results`,`Order effects are its biggest threat.`],
[`Between designs can't compute averages, so the effect would be invisible`,`They can; individual differences just add noise.`]],
e:`Looking at {g:difference scores} shows {g:everyone} did better reading silently. In a between design, the big person-to-person spread (54 to 82) would mask a small effect. Within designs pull {g:individual differences} out of the error.`});

Q({k:`Three designs`, q:`Roughly how many participants per condition does a between-subjects design need for random assignment to reliably balance the groups?`,
c:`About 30 to 50 or more per condition`,
x:[[`About 3 to 5 per condition`,`Far too few; groups would easily differ by chance.`],
[`Exactly 10 per condition`,`10 is usually too few to balance participant variables.`],
[`One per condition is enough with good control`,`Random assignment needs numbers to work.`],
[`Sample size doesn't matter for random assignment`,`It matters a lot; think 2 coin tosses vs 200.`]],
e:`Random assignment only balances groups {g:with enough people}, roughly {g:30–50+ per condition} (50 is often called a bare minimum). Bigger is safer.`});

Q({t:`match`, k:`Order effects`, q:`Match each order effect to what happens.`,
p:[[`Practice effect`,`Performance improves on later tasks from getting used to them`],
[`Fatigue effect`,`Performance drops later because people get tired or bored`],
[`Contrast effect`,`A later condition is judged against an earlier one`],
[`Carryover (awareness)`,`An earlier condition reveals what's being manipulated`]],
e:`All are threats in {g:within-subjects} designs, because the order of conditions can become a confound.`});

Q({k:`Order effects`, q:`Participants read about a murder, then about a theft, and assign punishment. The thief gets a lighter sentence than when theft is shown first. What is this?`,
c:`A contrast effect`,
x:[[`A practice effect`,`Practice would improve performance, not shift judgments.`],
[`A fatigue effect`,`Tiredness doesn't explain judging theft as milder.`],
[`A ceiling effect`,`That's about a measure being too easy.`],
[`Selective attrition`,`Nobody dropped out.`]],
e:`{g:Contrast effect}: after something severe, the next thing seems milder by comparison. Here order is confounded with crime severity.`});

Q({k:`Order effects`, q:`Participants figure out what's being manipulated and act the OPPOSITE of what they think the experimenter wants. This is:`,
c:`A reactance effect`,
x:[[`A demand effect`,`Demand means acting the way they think the experimenter wants.`],
[`A placebo effect`,`That's about expecting a treatment to work.`],
[`A practice effect`,`That's improvement from repetition.`],
[`Regression toward the mean`,`That's about extreme scores becoming less extreme.`]],
e:`Manipulation awareness can lead to {r:demand} (go along with the hypothesis) or {g:reactance} (push against it). Either way, behaviour is no longer natural.`});

Q({t:`fill`, k:`Counterbalancing`, q:`Listing every possible order of the conditions and assigning participants to complete one of them is called complete ___.`,
a:[`counterbalancing`],
e:`{g:Complete counterbalancing}: all possible orders are used. It doesn't erase order effects; it {g:spreads them equally} across conditions and lets you check whether they happened.`});

Q({k:`Counterbalancing`, q:`A taste test has 4 seltzer flavours (pickle, cilantro, grapefruit, peppermint). How many orders does complete counterbalancing require?`,
c:`24 orders`,
x:[[`4 orders`,`4 is what a Latin square would use.`],
[`8 orders`,`That would be 4 × 2.`],
[`16 orders`,`That's 4 × 4, not 4!.`],
[`12 orders`,`That's 4 × 3, missing the remaining factors.`]],
e:`Possible orders = {g:n!} (n factorial). 4! = 4 × 3 × 2 × 1 = {g:24}. With 3 conditions it's 6; with 6 conditions it's {r:720}, which is why partial counterbalancing exists.`});

Q({t:`hot`, k:`Latin square`, q:`This is meant to be a Latin square for conditions A–D. Click a cell that breaks the rule that each condition appears once in each position.`,
fig:{k:`latin`, hs:true, rows:[[`A`,`B`,`D`,`C`],[`B`,`C`,`A`,`D`],[`C`,`D`,`B`,`A`],[`D`,`C`,`A`,`B`]]},
a:[`r3c1`,`r1c1`,`r3c2`,`r1c2`],
e:`Position 2 has {r:C twice} (Orders 2 and 4) and position 3 has {r:A twice} (Orders 2 and 4). In a Latin square, every condition appears {g:exactly once in each ordinal position}.`});

Q({k:`Latin square`, q:`Which pair of rules defines a Latin square?`,
c:`Each condition appears once per position, and right before and after each other once`,
x:[[`Every possible order of the conditions is used, and each person completes all of them`,`Using every order is complete counterbalancing.`],
[`Conditions are randomly ordered per person, with no repeats`,`That's randomization, not a Latin square.`],
[`The hardest condition always comes last, the easiest first`,`That builds in an order confound.`],
[`Each participant does every condition twice, once forward and once in reverse order`,`That's ABBA-style reversal, not a Latin square.`]],
e:`Latin square (partial counterbalancing): {g:each condition in each ordinal position once}, and {g:each condition precedes and follows every other once}. The number of orders = the number of conditions (6 conditions → 6 orders instead of 720).`});

Q({k:`Latin square`, q:`What's the trade-off of using a Latin square instead of complete counterbalancing?`,
c:`Far fewer orders, but only a subset of possible orders is tested`,
x:[[`It removes order effects completely, but needs more participants`,`It needs fewer orders, and no method fully removes order effects.`],
[`It allows causal claims, but only for the first condition`,`It doesn't limit causal claims that way.`],
[`It works only for between-subjects designs`,`It's a within-subjects technique.`],
[`It tests every order, but takes much longer`,`It deliberately doesn't test every order.`]],
e:`Advantage: {g:720 → 6} orders (for six conditions). Disadvantage: you only test {r:a subset} of all possible orders.`});

Q({k:`Order effects`, q:`Besides counterbalancing, what's another way to reduce order effects, and its downside?`,
c:`Leave time between conditions; but longer studies risk more dropouts`,
x:[[`Run all conditions at the same moment; but participants get confused`,`You can't run conditions simultaneously within one person.`],
[`Use only one participant in the study; but the results won't generalize`,`That doesn't address order effects.`],
[`Skip the DV in later conditions; but you lose data`,`You need the DV in every condition.`],
[`Tell participants the hypothesis; but it adds demand`,`Telling the hypothesis creates problems, it doesn't solve order effects.`]],
e:`A {g:time interval} (a rest, a filler task, or days to recover from sleep loss) reduces fatigue and carryover. But a longer commitment makes recruiting harder and can cause {r:selective attrition}.`});

Q({k:`Order effects`, lv:`hard`, q:`Hiring managers evaluate a Black and a White candidate's resumes. Evaluating one first likely changes how the second is judged. What's the takeaway?`,
c:`Order changes the psychological experience, and sometimes there's no clean fix`,
x:[[`Counterbalancing the two resumes completely eliminates the problem every time`,`It spreads the effect but can't erase changed psychology.`],
[`Order never matters when resumes are similar`,`Here order very likely matters.`],
[`A within-subjects design is always the better choice for research on bias`,`Sometimes a between design avoids the problem.`],
[`Order effects only happen with more than two conditions`,`Two conditions are enough for order effects.`]],
e:`Psychological processes differ depending on {g:which came first}. Counterbalancing (Black→White vs White→Black) helps, but "sometimes there is no obvious solution," and a between-subjects design may be wiser.`});

Q({k:`Choosing a design`, q:`Real jurors focus on one defendant; real employers compare many applicants. What does this suggest about design choice?`,
c:`Jury studies fit between-subjects; hiring studies fit within-subjects`,
x:[[`Jury studies fit within-subjects; hiring studies fit between-subjects`,`That's flipped.`],
[`Both should always use within-subjects for power`,`Matching real-world experience matters too.`],
[`Both should use matched pairs on age`,`That isn't the point of this comparison.`],
[`Neither can be studied experimentally`,`Both can be.`]],
e:`Match the design to {g:how people meet the variable in real life}. One defendant → {g:between}. Many applicants side by side → {g:within}. This is partly an external validity question.`});

Q({k:`Choosing a design`, q:`When must you use a between-subjects design instead of within-subjects?`,
c:`When a condition causes lasting change, like surgery or psychotherapy`,
x:[[`When you have very few participants available to recruit`,`Few participants favours within-subjects.`],
[`When you want the most sensitive possible test of the IV`,`Within designs are more sensitive.`],
[`When the dependent variable is a reaction time in milliseconds`,`Reaction times work fine within-subjects.`],
[`When you need counterbalancing to handle the order of the different conditions`,`Counterbalancing is a within-subjects tool.`]],
e:`If a condition produces {g:relatively permanent} changes (removing brain tissue, some therapies), people can't "go back" for the other condition. Between designs also avoid order effects and give fewer clues about the hypothesis.`});

Q({t:`pick`, k:`Matched pairs`, q:`Select every good reason to use a matched-pairs design.`,
i:[[`You can only recruit a small sample, so random assignment might fail`,1],
[`A pretest is needed anyway (e.g., fMRI/EEG participants must learn the task)`,1],
[`High dropout is expected, and you want groups to stay balanced`,1],
[`You want every participant to experience every condition`,0,`That's a within-subjects design.`],
[`You want to avoid ever measuring anything before the manipulation`,0,`Matching requires measuring something first.`]],
e:`Matched pairs: {g:small samples}, {g:fMRI/EEG pretests} for good data, {g:high expected mortality} (e.g., low-income parents and kids). Worth it when the matching variable strongly relates to the DV.`});

Q({k:`Matched pairs`, q:`How does a matched-pairs design assign participants?`,
c:`Measure a key variable, pair similar scorers, then randomly split each pair`,
x:[[`Pair similar scorers, then put both people in each pair into the same condition`,`Each pair is split across conditions.`],
[`Let each pair decide which condition they want`,`That's self-selection, a confound.`],
[`Give both people in a pair every condition`,`That's within-subjects.`],
[`Pair people with opposite scores to balance them`,`You pair similar scores, not opposite ones.`]],
e:`{g:Pretest} a variable closely tied to the DV → {g:pair} people with similar scores → {g:randomly assign} one of each pair to each condition. Also called a {g:yoked} design.`});

Q({t:`hot`, k:`Matched pairs`, q:`In this matched-pairs design, click the step that guarantees the groups are equal on the key variable.`,
fig:{k:`design`, ty:`matched`}, a:`pair`,
why:{pre:`Measuring is required, but equality comes from pairing those scores.`, r:`Splitting each pair randomly keeps it fair, but the pairing is what equates the groups on that variable.`, t1:`That's a condition.`, t2:`That's a condition.`, m1:`That's the outcome.`, m2:`That's the outcome.`},
e:`{g:Pairing similar scores} is what makes the two groups equal on the matching variable "with certainty." Random assignment then decides who in each pair gets which condition.`});

Q({tr:1, k:`Matched pairs`, q:`You randomly assign people to a procrastination treatment or a wait-list control, then a pretest shows the control group has more severe symptoms. What should you do?`,
c:`If data aren't collected yet, use matched pairs; if they are, treat it as a pilot`,
x:[[`Move the most severe people into the treatment group by hand until the groups match`,`That's not random and introduces bias.`],
[`Ignore it and carry on; random assignment always balances things out eventually`,`With a small sample, random assignment can fail.`],
[`Drop the control group and compare pre to post`,`Losing the control group weakens the design badly.`],
[`Tell participants the hypothesis so they try harder`,`That creates demand characteristics.`]],
e:`Random assignment can fail, especially with {g:small samples}. Before collecting data: switch to a {g:matched-pairs design} on symptom severity. After collecting: treat it as a {g:pilot test} to refine a future study.`});

Q({k:`Matched pairs`, q:`Pairs of workers were matched on need for control and typing speed. One member chose their own work schedule; the other had to copy that exact schedule. Who felt less tired?`,
c:`Workers who controlled their own schedule`,
x:[[`Workers told exactly what to do`,`They reported feeling more tired.`],
[`Both felt equally tired, since schedules were identical`,`Schedules matched, but control over them differed.`],
[`Workers with faster typing speed`,`Typing speed was matched, so it couldn't explain it.`],
[`Workers who skipped the matching pretest`,`Everyone was measured for matching.`]],
e:`A classic {g:yoked/matched pairs} design: the only difference within each pair is {g:having control}. Those with control felt {g:less tired}.`});

Q({t:`pick`, k:`Pretests`, q:`Select every reason a researcher might add a pretest to a between-subjects experiment.`,
i:[[`To check that groups started out equal, especially with a small sample`,1],
[`To select participants, like the highest or lowest scorers`,1],
[`To check whether dropouts made the groups unequal`,1],
[`To guarantee no demand characteristics`,0,`A pretest can actually create demand by revealing what you're studying.`],
[`To replace random assignment`,0,`A pretest is a check; it doesn't replace random assignment.`]],
e:`Pretests help with {g:small samples}, {g:selecting participants} (careful: regression toward the mean) and {g:selective attrition} checks.`});

Q({k:`Pretests`, q:`In a smoking-treatment study, the heaviest smokers in the treatment group drop out. Why does this threaten internal validity?`,
c:`Only lighter smokers remain, so treatment looks effective even if it isn't`,
x:[[`Having fewer participants always produces a ceiling effect on smoking scores`,`Dropout doesn't create a ceiling effect.`],
[`The control group gets bored waiting and starts smoking more than before`,`Nothing suggests that.`],
[`It turns the study into a within-subjects design`,`The design stays between-subjects.`],
[`Dropouts can't be counted in a pretest`,`Pretest scores are exactly how you'd check this.`]],
e:`{g:Selective attrition}: dropout that differs by condition creates a {g:confound}. Pretest scores let you compare who left vs who stayed.`});

Q({tr:1, k:`Pretests`, q:`Why might a pretest be a problem for external validity?`,
c:`It can sensitize people to the treatment, and real life rarely has pretests`,
x:[[`It always lowers posttest scores, making any treatment look weaker`,`It often raises them through practice.`],
[`It prevents random assignment, since groups are formed from pretest scores`,`You can pretest and still randomly assign.`],
[`It makes the sample size too small to generalize to the population`,`It doesn't change sample size.`],
[`It turns the IV into a participant variable that can't be manipulated`,`The IV is still manipulated.`]],
e:`A pretest can {g:sensitize} people and alter both the intervention and the posttest. "Life is a between-subjects design and doesn't usually have pretests!" So results may not generalize to people who were never pretested.`});

Q({t:`hot`, k:`Pretests`, q:`Solomon four-group design: click the group that gets the treatment without ever seeing a pretest.`,
fig:{k:`design`, ty:`solomon`}, a:`g3`,
why:{g1:`G1 gets a pretest before the treatment.`, g2:`G2 gets a pretest and no treatment.`, g4:`G4 gets neither a pretest nor the treatment.`},
e:`Comparing {g:G1} (pretest + treatment) with {g:G3} (treatment, no pretest) shows whether the {g:pretest itself} changed how people responded. That's the whole point of the Solomon four-group design.`});

Q({k:`Pretests`, q:`What does the Solomon four-group design let a researcher test?`,
c:`Whether having a pretest changes how people respond to the treatment`,
x:[[`Whether four different treatments work equally well for the same problem`,`It has one treatment, crossed with pretest vs no pretest.`],
[`Whether order effects occurred across conditions in a within-subjects design`,`It's a between design about pretests.`],
[`Whether the DV is reliable over time`,`That's test-retest reliability.`],
[`Whether participants guessed the hypothesis`,`That's what funnelled debriefing checks.`]],
e:`It crosses {g:pretest vs no pretest} with {g:treatment vs control}, directly measuring the pretest's influence. It's the fix for "pretest may change psychological experience of the IV."`});

Q({k:`Selection`, lv:`warm`, q:`If mostly high-income people end up in the experimental group and mostly low-income people in the control group, that's:`,
c:`A selection difference`,
x:[[`A demand characteristic`,`That's about cues to the hypothesis.`],
[`A practice effect`,`That's improvement from repetition.`],
[`A floor effect`,`That's a measure being too hard.`],
[`Experimenter bias`,`Nothing here is about the experimenter's expectations.`]],
e:`{g:Selection differences} = the people in each group differ systematically. Now income is confounded with the IV. Random assignment or matching prevents it.`});

Q({t:`match`, k:`Manipulations`, q:`Match each kind of manipulation to an example.`,
p:[[`Straightforward manipulation`,`Participants rate job ads worded with masculine vs feminine words`],
[`Staged manipulation`,`A confederate posing as another participant orders alcoholic or non-alcoholic drinks`]],
e:`{g:Straightforward} = present instructions or stimuli (simple, cheap, usually no deception). {g:Staged} = create an event, often with a confederate and a cover story.`});

Q({k:`Manipulations`, q:`A researcher acts as a confederate in a staged dart competition, with a scripted reaction to losing. Participants are very engaged, but nobody plays darts against a scripted stranger in real life. How would you describe its realism?`,
c:`High experimental realism, low mundane realism`,
x:[[`High mundane realism, low experimental realism`,`That's flipped.`],
[`High on both kinds of realism`,`The situation isn't much like everyday life.`],
[`Low on both kinds of realism`,`Participants found it engaging, so experimental realism is high.`],
[`Realism doesn't apply to staged manipulations`,`Realism matters most in staged manipulations.`]],
e:`{g:Experimental realism} = the study feels {g:engaging and impactful}. {g:Mundane realism} = the study {g:resembles everyday life}. A study can be gripping without being ordinary.`});

Q({t:`fill`, k:`Manipulations`, q:`Someone who appears to be another participant but actually works for the researcher is a ___.`,
a:[`confederate`,`accomplice`],
e:`A {g:confederate} helps stage a social situation or deliver the IV. Their scripted behaviour must be consistent, which takes practice.`});

Q({k:`Manipulations`, q:`What's a downside of staged manipulations compared to straightforward ones?`,
c:`They're harder to replicate and interpret, since many things happen at once`,
x:[[`They can't create psychological states like frustration or anger`,`Creating those states is exactly what they're good at.`],
[`They always have low experimental realism compared with surveys`,`They usually have high experimental realism.`],
[`They're cheaper to run but much less engaging for the participants`,`They're usually more expensive.`],
[`They never involve deception, so participants can easily guess the study's purpose`,`They often involve deception.`]],
e:`Staged manipulations involve subtle interpersonal cues that are hard to describe, making them {r:hard to replicate}, and with many moving parts it's {r:harder to know which element mattered}. They also tend to cost more.`});

Q({t:`hot`, k:`Manipulation strength`, q:`Think of manipulation strength as planet size and experimental noise as fog on the lens. Click the telescope most likely to reveal an effect.`,
fig:{k:`planet`}, a:`bc`,
why:{bf:`A strong manipulation, but noise (fog) hides it.`, sc:`A clear view, but the manipulation is tiny.`, sf:`Small and foggy: the hardest to see.`},
e:`The size of an observed effect is like a ratio of {g:manipulation strength} (planet size) to {r:noise} (fog). Strong manipulations and well-controlled studies (clear lens) make effects easiest to see. Start with {g:large planets}, then test subtler versions.`});

Q({k:`Manipulation strength`, q:`To manipulate stress, Study 1 has people prepare a speech that 5 others will critique (vs read a speech alone). Study 2 uses a cold pressor vs a warm pressor. Which is the larger "planet," and why start there?`,
c:`Study 1's speech, since a big difference makes a true effect easier to detect`,
x:[[`Study 2's pressor, since physical stress is always stronger than social stress`,`The speech contrast is described as massive; the pressor contrast as smaller.`],
[`They're identical, since both have two levels`,`Number of levels isn't strength.`],
[`Study 2, since weaker manipulations are more ethical and therefore more valid`,`Ethics matters, but it isn't what makes a planet large.`],
[`Neither; strength only matters for the DV`,`Strength is about the IV.`]],
e:`{g:Manipulation strength} = how different the IV levels are. Start {g:strong} to check whether the relationship exists at all, then follow up with subtler operational definitions.`});

Q({k:`Manipulation strength`, lv:`hard`, q:`One study compared high-risk vs no-risk social situations; another compared high-risk vs less-risk. Why might they reach different conclusions?`,
c:`Comparing high to "less" is a weaker manipulation than comparing high to "none"`,
x:[[`One study used a confederate and the other didn't use any confederate`,`Both used staged elements; strength is the key difference.`],
[`Risk can only be measured as a participant variable, not manipulated`,`Both studies manipulated risk.`],
[`The dependent variable that measured acceptance was completely different in each study`,`Both measured feelings of acceptance.`],
[`Two levels can never show an effect, so both studies needed a third level`,`Two levels can show an effect if it's big enough.`]],
e:`Comparing high to {g:low} vs high to {g:none} are different manipulation strengths, and they can lead to different conclusions.`});

Q({k:`Manipulation strength`, q:`Why not always use the strongest possible manipulation?`,
c:`The strongest version can be unethical, like pushing someone to drink heavily`,
x:[[`Strong manipulations always cause ceiling effects on the dependent variable`,`Ceiling effects are about the DV being too easy.`],
[`Strong manipulations reduce internal validity by adding new confounds`,`Strength doesn't lower internal validity.`],
[`Strong manipulations can't be operationalized in a laboratory setting`,`They can be.`],
[`Weak manipulations are easier to detect because there's less noise`,`Weak ones are harder to detect.`]],
e:`A confederate drinking ten drinks instead of two might boost the effect, but it puts participants at risk, violating {g:concern for welfare}.`});

Q({k:`Manipulation checks`, q:`What are the two main advantages of a manipulation check?`,
c:`It lets you fix a weak manipulation in piloting and interpret a null result`,
x:[[`It replaces the dependent variable and proves that the hypothesis was correct`,`It's separate from the DV and proves nothing about the hypothesis.`],
[`It removes demand characteristics and order effects from the design`,`It can actually hint at the study's purpose.`],
[`It guarantees that random assignment created equivalent groups`,`That's a pretest's job.`],
[`It measures inter-rater reliability between the experimenters`,`That's about observers agreeing.`]],
e:`A {g:manipulation check} measures whether the IV created the intended state. (1) In a {g:pilot}, a weak manipulation can be strengthened. (2) If there's {g:no effect}, it rules out "the manipulation simply failed."`});

Q({k:`Manipulation checks`, lv:`hard`, q:`Your manipulation check shows the high-anxiety group really was more anxious, but anxiety had no effect on memory. What can you conclude?`,
c:`The manipulation worked, so the null result lies elsewhere: a poor DV or no real effect`,
x:[[`The manipulation failed, so the study tells us nothing about anxiety and memory`,`The check shows it worked.`],
[`Anxiety definitely has no effect on memory, in any situation or with any measure`,`One null result can't prove no effect; the DV might be insensitive.`],
[`You should drop the manipulation check from the report`,`You report all measures.`],
[`There must be a ceiling effect on the manipulation check`,`The check worked fine.`]],
e:`With a successful check, the problem isn't the IV. It might be an {g:insensitive DV} (ceiling/floor), or there may truly be {g:no relationship}.`});

Q({t:`sort`, k:`Measures`, q:`Sort each measure as self-report, behavioural or physiological.`,
b:[`Self-report`,`Behavioural`,`Physiological`],
i:[[`"How anxious do you feel right now?" on a 1–7 scale`,0],[`A relationship satisfaction questionnaire`,0],[`Amount of ice cream eaten`,1],[`How far a person sits from someone`,1],[`Number of ideas generated per minute`,1],[`Skin conductance (sweating)`,2],[`Cortisol in a saliva sample`,2],[`Blood flow in the brain during a task (fMRI)`,2]],
e:`{g:Self-report} = asking people. {g:Behavioural} = directly observing and recording what they do (rate, reaction time, duration). {g:Physiological} = a response of the body. Using several types is best.`});

Q({t:`match`, k:`Measures`, q:`Match each physiological measure to what it records.`,
p:[[`GSR (galvanic skin response)`,`Skin conductance from sweating, an index of arousal`],
[`EMG`,`Muscle tension, including facial muscles`],
[`ECG`,`Heart rate and rhythm`],
[`EEG`,`Electrical activity of brain cells`],
[`fMRI`,`Blood flow in the brain while doing a task`]],
e:`Plain MRI captures brain {g:structure}; fMRI shows {g:activity} via blood flow. Bodily fluids also count: cortisol in saliva, genetic markers in blood.`});

Q({k:`Measures`, lv:`hard`, q:`Measuring heart rate, or covertly watching someone's behaviour, are what kind of measures?`,
c:`Indirect measures`,
x:[[`Direct measures`,`Direct measures openly ask or instruct ("Are you anxious?" "Make free throws").`],
[`Self-report measures`,`Neither involves the participant reporting anything.`],
[`Staged manipulations`,`These are measures, not manipulations.`],
[`Manipulation checks`,`These aren't checking an IV.`]],
e:`{g:Direct}: "Are you feeling anxious?" or "Make as many free throws as you can." {g:Indirect}: heart rate (physiological) or covert observation (behavioural). Different measures impose different constraints, so use {g:multiple methods}.`});

Q({k:`Sensitivity`, q:`Scores on a memory test look like this. What's the problem with this measure?`,
fig:{k:`hist`, ty:`ceil`},
c:`A ceiling effect: the task is too easy, so scores pile up at the top`,
x:[[`A floor effect: the task is too hard, so scores pile up at the bottom`,`Floor would show most people near the lowest score. Here they bunch at the top.`],
[`Good sensitivity: most people did well, so the test works`,`Doing well isn't the goal; you need spread to detect differences.`],
[`A practice effect: people improved across repeated sittings`,`This is one sitting's distribution, not change over time.`],
[`Regression toward the mean: extreme scores drifted to average`,`Scores aren't drifting to the middle; they're stuck at the max.`]],
e:`Most people bunch at the {g:highest possible score}: a {g:ceiling effect}. With little variability, the measure can't show differences between conditions, so an IV may wrongly look like it does nothing. Spot it by averages near the {g:maximum}.`});

Q({k:`Sensitivity`, q:`Now the scores look like this. What's going on?`,
fig:{k:`hist`, ty:`floor`},
c:`A floor effect: the task is so hard almost nobody can do well`,
x:[[`A ceiling effect: the task is so easy everyone does well`,`Ceiling is a pile-up at the top; this pile-up is at the bottom.`],
[`A normal spread of scores with lots of useful variability across people`,`A good spread would have most scores in the middle.`],
[`A fatigue effect from a long session`,`Nothing here shows change over a session.`],
[`Selective attrition from the easy condition`,`This shows scores, not dropouts.`]],
e:`Scores bunched near the {g:minimum} = {g:floor effect}. The DV lacks {g:sensitivity}. Ideally scores are neither too high nor too low, with a good spread.`});

Q({k:`Sensitivity`, q:`Groups aged 20, 30, 40 and 50 read a chapter of a dense physics book. All groups score equally low on comprehension, with no age difference. What's the most likely issue?`,
c:`A floor effect: the material was too hard for anyone to do well`,
x:[[`A ceiling effect: the material was too easy for every age group`,`Everyone scored low, not high.`],
[`Age truly has no effect on comprehension, so the result is final`,`Possibly, but a floor effect could hide a real difference.`],
[`A contrast effect between the different age groups in the study`,`Each person read once; nothing to contrast.`],
[`Too much manipulation strength in the age variable that was chosen`,`Age isn't manipulated; it's a participant variable.`]],
e:`Everyone near the {g:minimum} = {g:floor effect}. The DV lacks sensitivity, so a true age difference could be invisible. Pick material of moderate difficulty with good spread.`});

Q({k:`Sensitivity`, q:`Which DV is the most {k:sensitive}?`,
c:`"How much do you like this person?" on a 7-point scale`,
x:[[`"Do you like this person?" yes or no`,`A yes/no can't show how much someone likes another person.`],
[`Reaction time measured with a stopwatch to the nearest full second`,`Reaction-time effects are in milliseconds; seconds are too coarse.`],
[`A test so easy everyone gets 100%`,`That's a ceiling effect, the opposite of sensitive.`],
[`A test so hard everyone gets 0%`,`That's a floor effect.`]],
e:`{g:Sensitivity} = ability to detect differences. A graded scale captures {g:amounts}; a yes/no response hides them. Same logic: time reaction times in {g:milliseconds}.`});

Q({k:`Measures`, q:`A study uses several DVs. How should the order of measures be handled, and what must be reported?`,
c:`Put the most important first or counterbalance, and report every measure`,
x:[[`Put the most important last, and report only measures that worked`,`Reporting only what "worked" is unethical.`],
[`Order doesn't matter at all, and only the significant results go in the report`,`Order can matter, and you report everything.`],
[`Randomize order, and report only the first measure`,`You must report all measures.`],
[`Use one measure only, since multiple measures are unethical`,`Multiple measures are encouraged.`]],
