p:[[`Needs assessment`,`Are there problems that need to be addressed in a target population?`],
[`Program theory assessment`,`Will the proposed program actually address the needs appropriately?`],
[`Process evaluation`,`Is the program being implemented the way it was planned?`],
[`Outcome evaluation`,`Are the intended outcomes of the program being realized?`],
[`Efficiency assessment`,`Is the cost of the program worth the outcomes?`]],
e:`Need → theory → process → outcome → efficiency. {g:Process evaluation} is also called {g:program monitoring}; {g:outcome evaluation} is also called {g:impact assessment}.`});

Q({t:`hot`, k:`Program evaluation`, q:`The five stages are shown in order, but the names are hidden. A researcher checks whether staff got enough training and whether the program's office is easy to find. Click that stage.`,
fig:{k:`pe`, blank:true},
a:`process`,
why:{need:`Step 1 asks whether a problem exists at all.`, theory:`Step 2 checks the program's logic before it runs.`, outcome:`Step 4 asks whether the goals are being reached.`, eff:`Step 5 weighs costs against benefits.`},
e:`That's {g:process evaluation} (step 3), also called program monitoring: is the program {g:reaching the target population}, attracting enough clients, and delivering the planned services?`});

Q({t:`sort`, k:`Program evaluation`, q:`Sort each question into the type of program evaluation it belongs to.`,
b:[`Needs assessment`,`Program theory`,`Process evaluation`,`Outcome evaluation`,`Efficiency assessment`],
i:[[`What services do homeless people need most?`,0],[`Do repeat young offenders share family problems an intervention could target?`,0],[`Is the program built on valid assumptions about what causes the problem?`,1],[`Will the program actually reach the target population as intended?`,1],[`Is the program attracting enough clients?`,2],[`Are staff providing the services that were planned?`,2],[`Is literacy actually increasing among participants?`,3],[`Could these resources be put to better use elsewhere?`,4]],
e:`Need (is there a problem?) → theory (does the plan make sense?) → process (is it running right?) → outcome (is it working?) → efficiency (is it worth it?).`});

Q({k:`Program evaluation`, q:`Nunes (1998) surveyed Portuguese Canadians and found key needs in education, employment and access to social services. What type of evaluation is this?`,
c:`A needs assessment`,
x:[[`An efficiency assessment`,`Nothing about costs was weighed.`],
[`A process evaluation`,`No program was running yet.`],
[`An outcome evaluation`,`No program's results were being measured.`],
[`A program theory assessment`,`No specific program's logic was being judged.`]],
e:`A {g:needs assessment} asks whether there are problems to address in a target population. Data can come from {g:surveys, interviews and archival records} (public health, criminal justice and other agencies).`});

Q({k:`Program evaluation`, q:`Why is process evaluation so important before judging whether a program works?`,
c:`It stops you from calling a program ineffective when it just wasn't run properly`,
x:[[`It tells you whether the program's benefits are worth what it costs to run each year`,`That's efficiency assessment.`],
[`It replaces the need to measure the program's outcomes at all`,`Outcomes still need measuring.`],
[`It randomly assigns people to get the program or not`,`Process evaluation doesn't assign anyone.`],
[`It identifies which problems a community has before any program planning can begin`,`That's needs assessment.`]],
e:`If staff weren't trained or the location was hard to find, a "failed" program may never have really been {g:implemented}. Process evaluation uses questionnaires, interviews, observation and program records.`});

Q({k:`Program evaluation`, q:`Ideally, outcome evaluation would use a true experiment. Why is that often not done?`,
c:`It can be impossible or unethical to randomly leave people out of a helpful program`,
x:[[`True experiments can't measure real-world outcomes like literacy, health or job skills`,`They can; it's assignment that's the problem.`],
[`Outcome evaluation only uses archival data from government agencies`,`It can use many kinds of data.`],
[`Programs are always far too small to split into a treatment group and a control group`,`Size isn't the main barrier.`],
[`Random assignment always makes the program cost more money than it will ever save`,`That's an efficiency question, not the reason.`]],
e:`You need to know what participants would be like {g:without} the program, but placing people randomly into a no-help group can be {r:unethical}. So evaluators turn to {g:quasi-experiments} and {g:single case designs}.`});

Q({k:`Program evaluation`, q:`What does assessing program theory involve?`,
c:`Researchers, staff and future clients agree on how the program will help and be used`,
x:[[`Counting how many clients the program actually served during its first full year of running`,`That's part of process evaluation.`],
[`Comparing the program's total cost with the size of its benefits`,`That's efficiency assessment.`],
[`Testing a psychological theory in the lab long before any real program has been designed`,`That's basic research.`],
[`Measuring whether participants' outcomes improved after the program`,`That's outcome evaluation.`]],
e:`Program theory = a {g:convincing rationale}: valid assumptions about what causes the problem and how members will {g:access and use} the services. Will it reach the target population? Are its goals appropriate?`});

Q({t:`fill`, k:`Program evaluation`, q:`Bamberger and colleagues (2004) call an evaluation squeezed by limited time, budget and data options a "___ evaluation."`,
a:[`shoestring`],
e:`{g:Shoestring evaluation}: doing solid evaluation research under real-world constraints. (Program evaluation is also a real career path for social science grads.)`});

Q({t:`pick`, k:`Program evaluation`, q:`Why can applied and evaluation research be hard to run as true experiments? Select every reason the chapter gives.`,
i:[[`Researchers are sometimes invited in late, after the program is already running`,1],
[`Budget limits can rule out some kinds of data collection`,1],
[`Random assignment to a no-program group can be unethical`,1],
[`Practical difficulties in real settings like schools and workplaces`,1],
[`Applied questions can't be answered with any data at all`,0,`They can, just usually with quasi designs.`],
[`Ethics boards never approve research on programs`,0,`They do approve program research.`]],
e:`Real-world research comes with {g:late invitations}, {g:tight budgets}, {g:ethics limits} and {g:practical messiness}. It's still essential, so researchers adapt their designs.`});

Q({k:`Program evaluation`, q:`When does an efficiency assessment make sense?`,
c:`After the program has been shown to have its intended effect`,
x:[[`Before anyone has checked whether the community needs the program`,`Need comes first.`],
[`While the program's logic is still being designed on paper`,`That's program theory assessment.`],
[`Only when the program has clearly failed to reach its goals`,`If it failed, there's no benefit to weigh.`],
[`Instead of measuring outcomes, since costs are easier to count`,`You need outcomes to judge if costs are worth it.`]],
e:`Once it {g:works}, ask: are the {g:benefits worth the cost}? Could the resources be used better? Is there a better way to run it?`});

/* =========================================================
   QUASI-EXPERIMENTS: WHAT THEY ARE
   ========================================================= */
Q({t:`fill`, k:`Quasi-experiments`, lv:`warm`, q:`"Quasi" is a Latin term meaning "___."`,
a:[`as if`],
e:`Quasi-experiments look {g:as if} they're experiments: interventions, comparisons, pretests. But out of necessity they lack key features like {r:random assignment} or {r:true control conditions}.`});

Q({k:`Quasi-experiments`, lv:`warm`, q:`What does a quasi-experiment lack compared to a true experiment?`,
c:`Random assignment, a true control condition, or both`,
x:[[`A dependent variable measured after the intervention`,`Quasi-experiments still measure outcomes.`],
[`Any comparison, intervention or change at all`,`They usually involve an intervention or comparison.`],
[`Approval from a research ethics board before starting`,`They need ethics approval too.`],
[`More than one participant in each of the conditions`,`Many have huge samples (whole states, schools).`]],
e:`Quasi-experiments {g:resemble} experiments but have {r:weak internal validity} because they lack {g:random assignment} and/or {g:true control conditions}.`});

Q({k:`Quasi-experiments`, rq:`12.5`, q:`When are quasi-experiments typically used?`,
c:`When random assignment or a true control group would be unethical or impossible`,
x:[[`When researchers want the strongest possible causal evidence about a program`,`True experiments give stronger causal evidence.`],
[`When the dependent variable can't be measured in any reliable way`,`They still measure a DV.`],
[`When the sample is a single person measured over and over again`,`That's a single-case design.`],
[`When the study has no hypothesis at all and is only meant to describe behaviour`,`They often test clear hypotheses.`]],
e:`Example: a program to teach kids to read. Withholding it at random, or denying a group the program, can raise {g:ethical problems}, so researchers work with groups as they are.`});

Q({k:`Quasi-experiments`, q:`Because they lack random assignment and true controls, what can quasi-experiments tell us?`,
c:`How variables are related, much like a correlational study`,
x:[[`Exactly what caused the change, as long as the sample is large`,`A big sample doesn't fix missing random assignment.`],
[`Nothing useful, so they should never be run`,`They're often the only possible design and are very useful.`],
[`Whether a measure is reliable across repeated testing`,`That's a measurement question.`],
[`Which participants were lying on their self-reports`,`Design type doesn't detect lying.`]],
e:`They show {g:associations}, not proof of cause. Quasi-experiments aren't "bad experiments": in many situations they're an {g:absolute necessity}.`});

Q({k:`Quasi-experiments`, lv:`hard`, q:`A study is advertised as a "true experiment," but participants chose which condition to join. How should you think about it?`,
c:`It's a flawed experiment that is really quasi-experimental, so no causal claim`,
x:[[`It's still a true experiment, because the researchers did manipulate the independent variable`,`Manipulation alone isn't enough without random assignment.`],
[`It's a single case design, because each person picked their own condition`,`Single case means one participant measured over time.`],
[`It's a developmental design, because people differ in their preferences`,`Developmental designs study age.`],
[`It's fine, because letting people choose their own condition increases mundane realism`,`Realism doesn't fix selection differences.`]],
e:`Two different things: (1) quasi designs used {g:on purpose, out of necessity}, and (2) {r:flawed experiments} that claim to be true experiments but aren't. Learning quasi designs helps you catch the second kind.`});

Q({t:`sort`, k:`Experiment vs quasi`, q:`Sort each study as a true experiment or a quasi-experiment.`,
b:[`True experiment`,`Quasi-experiment`],
i:[[`Kids randomly assigned to a reading program or a waitlist`,0],[`Comparing schools that chose a program with schools that didn't`,1],[`Comparing kids of mothers who work outside the home vs those who don't`,1],[`Clients randomly assigned to therapy or sham therapy`,0],[`Comparing overdose rates in states before and after a bill`,1]],
e:`{g:Random assignment} (with a real comparison) = true experiment. Groups formed by {g:choice or real-world differences} = quasi-experiment.`});

Q({k:`Experiment vs quasi`, q:`How are quasi-experiments and true experiments alike and different?`,
c:`Both compare conditions, but quasi designs lack random assignment, so alternatives remain`,
x:[[`Both use random assignment, but quasi designs have no DV`,`Quasi designs lack random assignment and do have DVs.`],
[`They're identical except quasi designs are run in labs`,`Setting isn't the difference.`],
[`Quasi designs give stronger causal evidence than experiments because they're more realistic`,`They give weaker causal evidence.`],
[`Both lack control groups, so neither can show cause`,`True experiments have controls and can show cause.`]],
e:`Quasi-experiments {g:resemble} experiments (interventions, comparisons, pretests), but without random assignment and true controls they can't fully rule out {r:selection, history, maturation} and other threats.`});

Q({t:`hot`, k:`Comparing designs`, q:`This table compares the quasi-experimental designs. Click the cell that marks the one upgrade that turns a non-equivalent control group design into its stronger pretest-posttest version.`,
fig:{k:`tbl`, hs:true, rl:`Design`, c:[`Groups`,`Random assignment?`,`Pretest?`,`Posttest?`],
r:[`One-group posttest-only`,`One-group pretest-posttest`,`Non-equivalent control group`,`NECG pretest-posttest`,`Interrupted time series`,`Control series`],
m:[[`1`,`No`,`No`,`Yes`],[`1`,`No`,`Yes`,`Yes`],[`2+`,`No`,`No`,`Yes`],[`2+`,`No`,`Yes`,`Yes`],[`1`,`No`,`Many`,`Many`],[`2+`,`No`,`Many`,`Many`]]},
a:`c32`,
why:{c31:`Random assignment is still "No" for both versions. That's why both stay quasi.`, c30:`Both versions already have 2+ groups.`, c33:`Both versions have a posttest.`, c12:`That's the pretest in a one-group design, not the control-group design.`},
e:`Same groups, same lack of random assignment. The only change is the {g:pretest}, which lets you check whether the groups {g:started out similar} and compare {g:change scores}.`});

Q({t:`sort`, k:`Comparing designs`, q:`Which designs include a pretest (a "before" measure)? Sort them.`,
b:[`Has a pretest`,`No pretest`],
i:[[`One-group posttest-only`,1],[`One-group pretest-posttest`,0],[`Non-equivalent control group`,1],[`Non-equivalent control group pretest-posttest`,0],[`Interrupted time series`,0],[`Control series`,0]],
e:`The names give it away: "posttest-only" has none, and plain "non-equivalent control group" has none. {g:Time series} designs have {g:many} pretests and posttests.`});

Q({t:`sort`, k:`Comparing designs`, q:`How many groups or conditions does each design compare? Sort them.`,
b:[`One group`,`Two or more groups`],
i:[[`One-group pretest-posttest`,0],[`Interrupted time series`,0],[`Longitudinal method`,0],[`Non-equivalent control group`,1],[`Control series`,1],[`Cross-sectional method`,1],[`Sequential method`,1]],
e:`Interrupted time series follows {g:one} group (e.g., one province) over time; adding a comparison makes it a {g:control series}. Longitudinal follows {g:one} cohort; cross-sectional and sequential compare {g:several} age groups.`});

/* =========================================================
   ONE-GROUP DESIGNS (LO2)
   ========================================================= */
Q({k:`One-group designs`, q:`You sit next to strangers and time how long until each one leaves. The average is 9.6 seconds. Why is this hard to interpret?`,
fig:{k:`design`, ty:`ogpost`, n:{iv:`Sit next to a stranger`, dv:`Seconds until they leave`}},
c:`With no comparison, you don't know how long they'd stay if you hadn't sat down`,
x:[[`Seconds are not a valid way to measure how uncomfortable strangers feel when you sit down`,`Time is a fine behavioural measure; the design is the problem.`],
[`The strangers weren't randomly sampled from the whole population`,`Sampling isn't the core issue here.`],
[`A one-group posttest-only design always produces a ceiling effect`,`Ceiling effects aren't built into the design.`],
[`9.6 seconds is far too short a time to measure with any accuracy using a stopwatch`,`It can be measured; it just can't be compared.`]],
e:`{g:One-group posttest-only}: no control group and no pretest. Maybe they'd have left in 9.6 seconds anyway, or maybe they liked you and would've left sooner! It has {r:no internal validity}.`});

Q({k:`One-group designs`, q:`Employees take a four-hour session on emergency procedures, then score 90% on a knowledge test. What can you conclude about the session?`,
c:`Nothing yet; scores might have been just as high, or higher, without it`,
x:[[`It worked, because 90% is well above the typical passing grade for a workplace test`,`A high score alone has no comparison point.`],
[`It worked, because the test was given right after the session`,`Timing doesn't create a comparison.`],
[`It failed, because a good session would produce 100%`,`There's no basis for that standard either.`],
[`It worked for most employees, but it didn't work for the remaining 10% of them`,`The design can't attribute any score to the session.`]],
e:`Without a comparison, we can't tell if the DV would be {g:equal, lower or higher} without the program. A {g:pretest} would at least rule out {g:prior knowledge}.`});

Q({t:`pick`, k:`One-group designs`, q:`Which of these claims rest on a one-group posttest-only design? Select all that apply.`,
i:[[`"Kids earned A's after joining our after-school enrichment class!"`,1,`Maybe they were already earning A's.`],
[`"Athletes performed great after drinking our sports drink!"`,1,`Maybe they'd do even better with water.`],
[`"Staff scored 90% after our safety training!"`,1,`No comparison score exists.`],
[`"Runners were randomly given our drink or water; the drink group ran faster."`,0,`Random assignment with a comparison is a true experiment.`],
[`"Reading scores rose from September to June in our program."`,0,`That has a pretest, so it's a one-group pretest-posttest.`]],
e:`Advertisers love these. People report them because they {r:don't realize} the data is insufficient, or because they're {r:trying to mislead}. Scientists need {g:comparison data} to interpret any result.`});

Q({k:`One-group designs`, q:`4- and 5-year-olds do a reading program, then take a reading test. Researchers say, "Kids in the program learned to read!" What's wrong?`,
c:`With no pretest or comparison group, we don't know they couldn't read before`,
x:[[`The children were too young to be tested on reading in a valid way`,`Age isn't the problem.`],
[`A reading test can't validly measure comprehension in four- and five-year-old children`,`The test is fine; the design is weak.`],
[`The program was given to too many children for anyone to track`,`Sample size isn't the issue.`],
[`They should have designed the test to produce a ceiling effect`,`A ceiling effect is a problem, not a fix.`]],
e:`{g:One-group posttest only}: no baseline, no comparison. We can't say the kids {g:improved}, let alone that the program {g:caused} it.`});

Q({t:`hot`, k:`One-group designs`, q:`Relaxation training to cut smoking, run as a one-group pretest-posttest. Click the part of the design that improves on a posttest-only study.`,
fig:{k:`design`, ty:`ogpp`, n:{pre:`Smoking measure (pretest)`, iv:`Relaxation training`, post:`Smoking measure (posttest)`}},
a:`pre`,
why:{p:`The participants are in every design; they aren't the upgrade.`, iv:`The training is the IV; a posttest-only design has it too.`, post:`A posttest-only design already has the posttest.`},
e:`The {g:pretest} gives a comparison {g:within the one group}: you can calculate change from before to after. It rules out "they'd have scored that way anyway," but not history, maturation, testing and friends.`});

Q({k:`One-group designs`, q:`How exactly does adding a pretest improve a one-group design?`,
c:`It rules out that people would have shown the result without the intervention`,
x:[[`It rules out every alternative explanation, so the design becomes a true experiment`,`Many threats remain without a control group.`],
[`It creates a control group made up of the same participants at a later time`,`It's a before measure, not a control group.`],
[`It guarantees the posttest will show a larger and clearer change`,`It guarantees nothing about the result.`],
[`It removes the need to measure the outcome after the intervention`,`You still need the posttest.`]],
e:`Measuring {g:before} rules out one alternative: people's {g:prior level} (like prior knowledge in the emergency training). The other threats to internal validity are still on the table.`});

Q({k:`One-group designs`, q:`Adding a pretest gives a one-group pretest-posttest design: "Scores improved after the program!" Why still not a causal claim?`,
c:`Maturation, testing, history and other threats could explain the improvement`,
x:[[`Pretests always make posttest scores lower, which hides the program's real improvement`,`They often make posttest scores higher.`],
[`The design has too many comparison groups to know which one mattered`,`It has none.`],
[`Improvement can't be measured with only two tests of reading ability`,`It can; we just can't attribute it to the program.`],
[`The program and the pretest were identical, so nothing was manipulated`,`They're different things.`]],
e:`Better than posttest-only, but without a control group, {g:history}, {g:maturation}, {g:testing}, {g:instrument decay}, {g:regression} and {g:attrition} remain plausible.`});

Q({k:`One-group designs`, q:`You can't have employees skip emergency training, so a control group isn't possible. What can still strengthen a one-group pretest-posttest evaluation?`,
c:`Replicate the study at other times with other groups of participants`,
x:[[`Give the posttest twice in a row so the scores become twice as reliable`,`Repeating the posttest doesn't rule out threats.`],
[`Skip the pretest so that testing effects can't happen`,`That throws away your only comparison.`],
[`Tell participants the hypothesis so that they try harder on the knowledge test`,`That adds demand characteristics.`],
[`Call it a true experiment, since the training was manipulated`,`Without randomization and controls, it isn't one.`]],
e:`When no control group is possible, {g:replication} at different times with different people helps rule out some threats, like a one-time {g:history} event.`});

Q({k:`One-group designs`, lv:`warm`, q:`A police captain picks two officers from each precinct for a three-month anti-prejudice program. Prejudice is measured at the first and last meetings, and it drops. What design is this?`,
c:`A one-group pretest-posttest design`,
x:[[`A non-equivalent control group design`,`There's no comparison group of officers.`],
[`A one-group posttest-only design`,`Prejudice was measured at the first meeting too.`],
[`An interrupted time series design`,`There are only two measurements, not a long series.`],
[`A true pretest-posttest experiment`,`Nobody was randomly assigned to a control group.`]],
e:`One group, measured {g:before} and {g:after}. The drop could be real, but this design can't tell it apart from the classic threats.`});

Q({t:`pick`, k:`One-group designs`, lv:`hard`, q:`Same police program (one group, prejudice measured at the first and last meetings, three months apart). Which problems arise if you conclude the training caused the drop? Select all that apply.`,
i:[[`History: news events over those months could shift attitudes`,1],
[`Maturation: three months of experience could change officers anyway`,1],
[`Testing: filling out a prejudice measure at the first meeting can sensitize officers to the purpose`,1],
[`Regression toward the mean, if captains picked their most prejudiced officers`,1],
[`Order effects from counterbalancing the program's conditions`,0,`There's only one condition, so nothing was counterbalanced.`],
[`Cohort effects from comparing officers of different ages`,0,`No age groups are being compared.`]],
e:`With no control group, {g:history}, {g:maturation}, {g:testing} and possibly {g:regression} (and instrument decay) all compete with the program as explanations. The captain hand-picking officers also limits generalization.`});

/* =========================================================
   THREATS TO INTERNAL VALIDITY (LO3) — Table 12.2
   ========================================================= */
Q({k:`Threats to validity`, lv:`warm`, q:`When is something a threat to internal validity?`,
c:`When it offers a believable explanation for the DV change besides the IV`,
x:[[`When it makes the results harder to generalize to other people, places and times`,`That's external validity.`],
[`When it makes participants uncomfortable during the study`,`That's an ethics concern.`],
[`When it makes the measure give quite different scores on two separate occasions`,`That's low test-retest reliability.`],
[`When it makes the study more expensive than planned`,`Cost isn't a validity threat.`]],
e:`{g:Internal validity} = confidence that the {g:IV caused} the DV change. A threat is any reasonable {r:alternative explanation}. Confounds are one example; quasi designs show many others.`});

Q({t:`match`, k:`Threats to validity`, rq:`12.7`, q:`Match each threat to internal validity to its summary.`,
p:[[`History`,`An outside event (a disaster, a media story) affects most participants`],
[`Maturation`,`Natural changes in participants, short-term (fatigue) or long-term (growth)`],
[`Testing`,`Simply taking the pretest changes how people respond on the posttest`],
[`Instrument decay`,`The measuring instrument changes with repeated use`]],
e:`All four offer an {r:alternative explanation} for change between pretest and posttest. With multiple groups, if history or maturation hits groups {g:differently}, it becomes a {g:confound}.`});

Q({t:`match`, k:`Threats to validity`, rq:`12.7`, q:`Four more threats. Match each one to its summary.`,
p:[[`Regression toward the mean`,`People picked for extreme pretest scores score less extremely later`],
[`Attrition`,`Participants leave the study, possibly more from one group`],
[`Selection effects`,`Groups are formed any way other than random assignment`],
[`Cohort effects`,`Groups are formed by age, so era differences mix with age`]],
e:`{g:Cohort effects} are a special type of {g:selection effect}. {g:Attrition} can create group differences even when groups were randomly assigned at the start.`});

Q({t:`match`, k:`Threats to validity`, q:`Relaxation training to reduce smoking (one group, pretest and posttest). Match each threat to how it could fake a drop in smoking.`,
p:[[`History`,`A famous person dies of lung cancer between the two measures`],
[`Maturation`,`People get more health-conscious as they age over years of treatment`],
[`Testing`,`Keeping a smoking diary at pretest makes people notice and cut back`],
[`Instrument decay`,`By the end, people forget to write down some cigarettes`],
[`Regression toward the mean`,`Only the very heaviest smokers were chosen for the program`]],
e:`Each one could make smoking {g:look} lower without the training doing anything. That's why one-group designs can't support {r:causal claims}.`});

Q({t:`hot`, k:`Threats to validity`, q:`When does an outside event count as a history effect? Click the window on this timeline.`,
fig:{k:`tl`},
a:`z1`,
why:{z0:`Before the pretest, the event would show up in both the pretest and posttest, so it can't explain change between them.`, z2:`After the posttest, the event can't affect scores that were already collected.`},
e:`{g:History effects}: any event {g:during or after the manipulation}, {g:after the pretest} but {g:before the posttest}. In a one-group design, that event is confounded with the treatment.`});

Q({k:`Threats to validity`, q:`A program for recently immigrated children in Montreal (Rousseau et al., 2009) began just as the 2004 tsunami struck many of the families' home regions. Well-being improved moderately. How should the result be read?`,
c:`It's unclear; without the tsunami, the program might have helped even more`,
x:[[`The tsunami made the program work better, so it should be repeated after disasters`,`There's no evidence the disaster helped.`],
[`The program clearly failed, because a disaster happened during it`,`The program may still have worked.`],
[`The tsunami is a maturation effect, since it changed the children over time`,`An outside event is history, not maturation.`],
[`The improvement must be regression toward the mean`,`Nothing says kids were picked for extreme scores.`]],
e:`A {g:history} event can push results {g:either way}. Here it may have {r:masked} part of the benefit. Researchers had to interpret the data in light of it.`});

Q({k:`Threats to validity`, q:`In a two-hour session, participants get bored and hungry, so their effort drops on the final task. Which threat is this?`,
c:`Maturation`,
x:[[`History`,`No outside event happened.`],
[`Instrument decay`,`The measure didn't change.`],
[`Regression toward the mean`,`No one was chosen for extreme scores.`],
[`Attrition`,`No one left the study.`]],
e:`{g:Maturation} isn't only long-term growth. In a brief period people become {g:bored, fatigued, wiser and hungrier}; over longer periods they develop, recover from illness or change careers.`});

Q({k:`Threats to validity`, q:`Over six months, toddlers in a vocabulary program learn many new words. Why is maturation a concern?`,
c:`Toddlers learn words naturally over six months, program or not`,
x:[[`Toddlers tend to forget new words quickly after taking any test`,`That's not maturation.`],
[`The vocabulary test changed during the study`,`That would be instrument decay.`],
[`Some of the families dropped out of the program partway through`,`That would be attrition.`],
[`An outside event taught them words`,`That would be history.`]],
e:`{g:Maturation} = participants {g:change naturally over time}. With young kids and long gaps, it's a huge alternative explanation.`});

Q({k:`Threats to validity`, q:`Besides making a behaviour salient, how else can a pretest change posttest scores?`,
c:`It can reveal the study's purpose or give people practice at the skill`,
x:[[`It can replace the need for a treatment by acting as a full treatment on its own`,`It can influence scores, but it isn't the treatment.`],
[`It can make the measuring instrument wear out or break down over repeated use`,`That's instrument decay.`],
[`It can cause outside events to happen during the study`,`That's history, and pretests don't cause it.`],
[`It can make participants drop out before the posttest`,`That's attrition.`]],
e:`{g:Testing effects}: the pretest can {g:sensitize} people to the purpose or make them {g:more adept} at the task. Either way, the posttest changes without any effect of the IV.`});

Q({k:`Threats to validity`, q:`Kids take the same reading test before and after a program. They score higher after, partly because they're now familiar with the test. What threat is this?`,
c:`Testing (a practice effect from the pretest)`,
x:[[`History (an event outside the study)`,`No outside event is involved.`],
[`Maturation (natural growth over time)`,`This is about the test, not development.`],
[`Attrition (participants dropping out)`,`No dropouts are mentioned.`],
[`Instrument decay (the test changing meaning)`,`The test didn't change meaning.`]],
e:`{g:Testing}: the pretest itself influences the posttest. It's the same concern raised for pretest-posttest experiments.`});

Q({k:`Threats to validity`, lv:`hard`, q:`An observer codes playground aggression for months. She gets more skilled and starts catching subtle shoves she used to miss. Aggression seems to rise. What threat is this?`,
c:`Instrument decay`,
x:[[`Maturation`,`The children's behaviour didn't change; the observer did.`],
[`History`,`No outside event is involved.`],
[`Testing`,`Nobody took a pretest that changed their behaviour.`],
[`Selection effects`,`There's only one group.`]],
e:`When a {g:human observer} is the instrument, gaining skill, getting {g:tired} or {g:shifting standards} all count as {g:instrument decay}. So do timers losing battery power and buggy software.`});

Q({k:`Threats to validity`, q:`The "Modern" Racism Scale was built in 1986. Racism still exists, but the scale no longer captures it well. What threat is this?`,
c:`Instrument decay`,
x:[[`History`,`History is an outside event affecting scores.`],
[`Maturation`,`That's natural change in participants.`],
[`Testing effect`,`That's the pretest influencing the posttest.`],
[`Regression toward the mean`,`That's extreme scores drifting to average.`]],
e:`{g:Instrument decay}: the measure stops quantifying the same concept. Same idea if observers get tired or change their standards over a study.`});

Q({t:`hot`, k:`Threats to validity`, q:`You're an A student, but you once got a D. A study picks you for an achievement intervention because of that D. Even if the intervention does nothing, where will your next grade most likely land?`,
fig:{k:`regress`, zones:true},
a:`z3`,
why:{z1:`Lower than your worst grade ever is the least likely outcome.`, z2:`Repeating your worst grade is unlikely; it wasn't your typical work.`},
e:`{g:Regression toward the mean}: that D was mostly {r:measurement error} (stress, a bad week), not your true score. Your next grade will likely be {g:closer to your usual A's}, so the intervention would look like it worked when it didn't.`});

Q({k:`Threats to validity`, q:`Researchers pick the 10% of kids with the lowest reading scores. On retest, without any program, their average rises. What explains this?`,
c:`Regression toward the mean: extreme scores partly reflect bad luck that evens out`,
x:[[`Maturation: the children simply grew up a little bit between the first and second tests`,`Possible over long gaps, but the extreme-group selection is the key clue.`],
[`History: something happened outside the study that boosted reading`,`Nothing outside is described.`],
[`Attrition: the weakest readers dropped out before they were retested`,`Nobody dropped out.`],
[`Instrument decay: the reading test changed its meaning between sittings`,`The same test was used.`]],
e:`Extreme scores include {g:measurement error} (a bad day, unlucky guesses). On retest, luck averages out, so extreme groups drift {g:toward the mean}. It matters whenever you {g:select extreme groups}.`});

Q({k:`Threats to validity`, lv:`hard`, q:`Why is regression toward the mean ultimately a reliability problem?`,
c:`Scores include measurement error, and extreme scores hold the most of it`,
x:[[`Unreliable measures always push everyone's scores upward when they're retested`,`Extreme high scores tend to drop, extreme lows tend to rise.`],
[`Reliable measures are the ones most likely to regress on retest`,`A perfectly reliable measure wouldn't regress at all.`],
[`It only happens when the measure has low face validity`,`It's about error, not how the measure looks.`],
[`It disappears completely once a measure's Cronbach's alpha is above about .70`,`All real measures have some error, so it never fully disappears.`]],
e:`Score = {g:true score} + {g:measurement error}. Selecting people {g:far from the mean} selects lots of error, which won't repeat. And in practice {r:no measure is completely reliable}.`});

Q({k:`Threats to validity`, q:`Athletes on the cover of Sports Illustrated often slump afterward (the "cover jinx"). Besides nerves from fame, what explains it, and what comparison would test that?`,
c:`Regression; also feature slumping athletes and see if they bounce back`,
x:[[`History; feature athletes during the off-season when there are no games`,`The slump isn't caused by outside events.`],
[`Maturation; only feature athletes who are still very young`,`Aging isn't the explanation.`],
[`Testing; stop measuring performance right after the cover comes out`,`Measuring isn't what causes the slump.`],
[`Attrition; count only athletes who stay in the league afterward`,`Dropouts aren't the explanation.`]],
e:`Athletes land on the cover for {g:exceptionally high} performance, partly luck. Luck doesn't repeat, so performance drifts back. If {g:slumping} athletes on covers then {g:improved}, regression (not a curse) is driving it.`});

Q({t:`fill`, k:`Threats to validity`, q:`Extreme scorers tend to score closer to average when measured again, because part of their extreme score was measurement error. This is regression toward the ___.`,
a:[`mean`,`average`],
e:`{g:Regression toward the mean}. It's a big problem whenever you select people {g:because} they scored extremely (very high or very low).`});

Q({t:`fill`, k:`Threats to validity`, q:`Regression toward the mean is sometimes also called statistical ___.`,
a:[`regression`],
e:`{g:Statistical regression} = regression toward the mean. Extreme high scores tend to come down; extreme low scores tend to come up.`});

Q({k:`Threats to validity`, lv:`hard`, q:`In a long program, families of kids who struggle most quit before the posttest. The remaining kids score well. What's the problem?`,
c:`Attrition: those left are a different, stronger group than those who started`,
x:[[`History: an outside event made reading easier for every child in the study at once`,`Nothing outside is described.`],
[`Testing: the pretest boosted posttest scores through simple practice`,`The issue is who left.`],
[`Regression toward the mean: extreme scores drifted toward the average`,`Selection of extreme scorers isn't the issue.`],
[`Maturation: the kids grew older and naturally became better readers`,`The issue is who stayed.`]],
e:`{g:Attrition} (also called mortality): participants dropping out changes the group. Same idea as {g:selective attrition} in experiments.`});

Q({t:`match`, k:`Threats to validity`, q:`Match each threat to internal validity to its reading-program example.`,
p:[[`Maturation`,`Kids became developmentally ready to read on their own`],
[`Attrition (mortality)`,`Kids who couldn't read dropped out before the posttest`],
[`Testing`,`Taking the pretest boosted scores on the posttest`],
[`History`,`A new TV show about reading started during the program`],
[`Regression toward the mean`,`Kids chosen for very low scores scored less extreme on retest`],
[`Instrument decay`,`The measure no longer captures the same concept by the posttest`]],
e:`These are the classic alternative explanations when there's {g:no randomized control group}. A control group would experience most of them too, cancelling them out.`});

Q({k:`Threats to validity`, q:`A city launches a big literacy campaign halfway through a school's reading program. Posttest scores jump. What threat is this?`,
c:`History`,
x:[[`Maturation`,`Maturation is natural growth within participants.`],
[`Attrition`,`Nobody dropped out.`],
[`Selection differences`,`There's only one group here.`],
[`Testing`,`The pretest isn't the issue.`]],
e:`{g:History} = something {g:outside the study} happens between pretest and posttest and affects the outcome. A comparison group that experienced the same campaign would help rule it out.`});

Q({t:`pick`, k:`Threats to validity`, q:`A one-group pretest-posttest shows anxiety dropped after a 3-month mindfulness program. Select every alternative explanation that's plausible here.`,
i:[[`Maturation or natural recovery over three months`,1],
[`History: exams ended between pretest and posttest`,1],
[`Testing: filling out the anxiety scale twice changed answers`,1],
[`Regression toward the mean, if people joined when extremely anxious`,1],
[`Attrition, if the most anxious people dropped out`,1],
[`Counterbalancing errors between conditions`,0,`There's only one condition, so nothing to counterbalance.`]],
e:`Without a control group, {g:all the classic threats} remain. That's exactly why one-group designs can't support causal claims.`});

Q({k:`Threats to validity`, lv:`hard`, q:`In a randomized experiment, the DV becomes less reliable between pretest and posttest for every group. What's the danger?`,
c:`Extra measurement error could hide a real effect, so you'd wrongly find none`,
x:[[`Nothing to worry about, since the decay affects every one of the groups equally`,`Equal decay can still drown out a true effect.`],
[`It creates a history effect that only touches one of the groups in the study`,`Nothing outside happened.`],
[`It guarantees that the groups will differ at the posttest`,`It makes real differences harder to see.`],
[`It turns the experiment into a single case design`,`The design doesn't change.`]],
e:`Here {g:instrument decay} isn't an alternative explanation; it threatens the study's {g:ability to detect a true effect}. Threats can hit true experiments too, either one group (a {r:confound}) or all groups (masking).`});

Q({k:`Threats to validity`, q:`In a true experiment, a news event affects only the treatment group's participants. What does that event become?`,
c:`A confound: an alternative explanation for the group difference`,
x:[[`Nothing to worry about, because random assignment already handled it`,`Random assignment can't protect against later events hitting one group.`],
[`A testing effect, because it happened between the two measures`,`Testing is about the pretest itself.`],
[`A cohort effect, because the groups now have different experiences`,`Cohort effects are about age groups.`],
[`A maturation effect, because it happened over time`,`Maturation is internal change, not an outside event.`]],
e:`Random assignment makes groups equal {g:at the start}. A {r:history} event that hits {r:one group} afterward varies with the IV, so it's a {r:confound}.`});

Q({k:`Threats to validity`, lv:`warm`, q:`What's the best way to rule out threats like history, maturation and regression?`,
c:`A randomly assigned control group that experiences everything except the treatment`,
x:[[`A longer posttest with many more questions, so the scores become more reliable`,`A longer test doesn't rule these out.`],
[`Measuring the dependent variable only once, after treatment`,`That's the weakest design.`],
[`Picking only participants who score extremely high or extremely low on the pretest`,`That creates regression toward the mean.`],
[`Testing everyone in the same room at the same time with the same experimenter`,`That doesn't create a comparison.`]],
e:`If the {g:control group} goes through the same history, maturation and testing, those can't explain a {g:difference between the groups}. {g:Random assignment} is the best way to make the groups equivalent.`});

/* =========================================================
   CONTROL GROUPS (LO4): NECG and NECG pretest-posttest
   ========================================================= */
Q({k:`Control groups`, rq:`12.6`, q:`Why does adding a control group eliminate some problems of the one-group pretest-posttest design?`,
c:`Both groups share the same history, maturation and testing, so those cancel out`,
x:[[`The control group gets a stronger dose of the treatment than the main group does`,`The control group gets no treatment.`],
[`It guarantees that both groups will have identical scores on the pretest measure`,`Only random assignment makes that likely, and even then not guaranteed.`],
[`It removes the need for any pretest or posttest measures`,`You still need measures.`],
[`It makes the study a single case design with two cases`,`It's a group design.`]],
e:`The control group is the {g:"what would've happened anyway"} line. Threats that hit {g:both groups equally} cancel out, so a difference between groups points toward the treatment.`});

Q({t:`hot`, k:`Control groups`, q:`A non-equivalent control group design. Click the part of the design that opens the door to selection differences.`,
fig:{k:`design`, ty:`necg`, n:{t1:`Relaxation training`, t2:`No training`, m1:`Smoking measure`, m2:`Smoking measure`}},
a:`grp`,
why:{t1:`The training is the IV, which you want to differ.`, t2:`The no-training condition is the comparison, which is good to have.`, m1:`The measure is the DV.`, m2:`The measure is the DV.`},
e:`Groups that {g:already exist} (or that people {g:choose}) aren't equivalent. Pre-existing differences are {r:confounded} with the IV. There's also {r:no pretest} to check how different they are.`});

Q({k:`Control groups`, q:`A company invites all its smokers to relaxation training. Volunteers form the treatment group; those who don't sign up form the control. Why is this risky?`,
c:`Volunteers may differ, e.g., smoke more or feel more hopeful about quitting`,
x:[[`Volunteering makes the training less effective than it would be for assigned people`,`The issue is who's in each group, not how well the training works.`],
[`Non-volunteers can't be measured on smoking at all, since they didn't sign up`,`They can be measured.`],
[`Volunteers will always drop out more than the people in the control group`,`That isn't given.`],
[`It creates a ceiling effect in the smoking measure`,`Nothing suggests scores hit a maximum.`]],
e:`{g:Selection differences}: non-volunteers might smoke far less, or be less confident a program could help. Any group difference may reflect those {r:pre-existing differences}, not the training.`});

Q({k:`Control groups`, q:`Instead, all smokers in the engineering division get the training, and smokers in marketing serve as the control. Does that solve the problem?`,
c:`Not fully; the divisions may have smoked differently before the program`,
x:[[`Yes, since whole departments are assigned to conditions instead of individual people`,`Assigning whole groups still isn't random.`],
[`Yes, because both divisions work at the same company under the same smoking rules`,`Same company doesn't mean same smoking patterns.`],
[`No, because a design can't have more than one group of people`,`It can; that's the point of a control group.`],
[`No, because engineers can't take part in relaxation training`,`Anyone can take part.`]],
e:`Comparing {g:similar} groups is better than volunteers vs non-volunteers, but {r:selection differences} can still lurk. Without random assignment, groups may differ from the start.`});

Q({k:`Control groups`, q:`In a non-equivalent control group design, parents of struggling readers request the program. What's the threat?`,
c:`Selection differences: the program group has more struggling readers to start`,
x:[[`History, since parents talked to each other about the program`,`The issue is who ended up in which group.`],
[`Instrument decay, since parents changed how the test was scored`,`Parents didn't change the measure.`],
[`Maturation, since the parents grew older during the program`,`Parents aren't the participants.`],
[`A ceiling effect in the control group, since those children already read very well`,`Nothing says the control scores hit a maximum.`]],
e:`Without random assignment, {g:selection differences} are always possible, especially when people {g:choose} their condition.`});

Q({k:`Control groups`, lv:`warm`, q:`A researcher compares students in a course's morning section with students in the evening section. Which design uses naturally existing groups like these?`,
c:`A non-equivalent control group design`,
x:[[`A matched pairs design with similar students paired up`,`Nobody was matched and randomly split.`],
[`A within-subjects design where students switch sections`,`Each student is in only one section.`],
[`A single case reversal design`,`That's one participant over time.`],
[`A Latin square design for counterbalancing order`,`That's a counterbalancing tool, not a way to form groups.`]],
e:`Morning and evening students may differ (jobs, sleep habits, motivation). Those {g:selection differences} are the weak spot of the {g:non-equivalent control group} design.`});

Q({t:`hot`, k:`Control groups`, q:`A non-equivalent control group pretest-posttest design. Click a part of the design that lets you check whether the groups started out similar.`,
fig:{k:`design`, ty:`necgpp`},
a:[`pre1`,`pre2`],
why:{grp:`Existing groups are the source of the problem, not the check.`, t1:`The treatment is the IV.`, t2:`No treatment is the comparison condition.`, post1:`Posttests come after the treatment, too late to check the starting point.`, post2:`Posttests come after the treatment, too late to check the starting point.`},
e:`The {g:pretests}. They show whether the groups were the same at the start, and they let you compare {g:change from pretest to posttest} even if they weren't.`});

Q({k:`Control groups`, rq:`12.8`, q:`What makes the non-equivalent control group pretest-posttest design a quasi-experiment rather than a true experiment?`,
c:`Assignment to groups isn't random, so they may differ at the start`,
x:[[`It has no control group to compare against the people in the treatment group`,`It does have a control group.`],
[`It has no pretest, so the groups' starting levels are completely unknown`,`It does have a pretest.`],
[`It measures only one participant over a long time`,`It uses groups of many people.`],
[`It can't measure the DV more than one time`,`It measures at pretest and posttest.`]],
e:`Control group: yes. Pretest: yes. {r:Random assignment: no.} The pretest helps, but groups can still differ on variables you {r:didn't measure}.`});

Q({k:`Control groups`, q:`Even if the groups aren't equivalent, what pattern in a non-equivalent control group pretest-posttest design suggests the IV had an effect?`,
c:`The treatment group changes more from pretest to posttest than the control group`,
x:[[`Both groups show exactly the same amount of change from the pretest to the posttest`,`Equal change suggests no effect of the IV.`],
[`The control group changes more than the treatment group from pretest to posttest`,`That's the opposite of an effect.`],
[`The treatment group scores higher at the pretest`,`That's a starting difference, not an effect.`],
[`The groups have identical scores at both times`,`No change means no effect.`]],
e:`Look at {g:change scores}: if the IV works, the experimental group should show a {g:greater change} than the control group (Kenny, 1979).`});

Q({k:`Control groups`, q:`Read this graph from a non-equivalent control group pretest-posttest design. What's the best conclusion?`,
fig:{k:`ix`, x:[`Pretest`,`Posttest`], l:[`Program school`,`Comparison school`], m:[[3.5,7.5],[4,5]], max:10, y:`Pleasure reading`, vals:true},
c:`The program group improved more, but selection differences can't be ruled out`,
x:[[`The program definitely caused the improvement, since there was a comparison group`,`Without random assignment, "definitely" is too strong.`],
[`The program had no effect, since both groups improved a bit`,`The program group improved much more.`],
[`The groups were identical at pretest, so it's a true experiment`,`They weren't identical, and assignment wasn't random.`],
[`The comparison school improved more than the program school`,`It went from 4 to 5; the program school went from 3.5 to 7.5.`]],
e:`Program: 3.5 → 7.5 ({g:+4}). Comparison: 4 → 5 ({g:+1}). Consistent with an effect, but the schools weren't randomly assigned, so {r:other school differences} could still play a role.`});

Q({k:`Control groups`, lv:`hard`, q:`People recovering from mental illness were either active in consumer/survivor initiatives (CSIs) or signed up but not active. After 18 months, active members kept up work and education and gained more social support. Why isn't this causal, and how did researchers address it?`,
c:`People chose to be active; a pretest showed similar groups at the start`,
x:[[`It used random assignment, so the 18-month gap was the only problem`,`No one was randomly assigned to be active.`],
[`It had no comparison group, so they added one halfway through`,`Non-active members were the comparison group.`],
[`It had too few measures, so they switched to a single case design`,`They kept a group design.`],
[`Its outcomes were unreliable, so they dropped the social support measure`,`Social support was a key finding.`]],
e:`Engagement wasn't randomly assigned, so {r:selection differences} remain. The {g:pretest} showed the groups were similar in {g:demographics and symptom severity} at the start, which strengthens (but doesn't prove) the case.`});

Q({k:`Control groups`, q:`Why does the non-equivalent control group pretest-posttest design have the highest internal validity of the non-time-series quasi designs?`,
c:`The pretest checks the groups start out similar on the key variable`,
x:[[`It uses random assignment to conditions`,`It still lacks random assignment.`],
[`It rules out every possible confound, including all participant variables`,`Other variables may still differ.`],
[`It uses a single participant measured repeatedly`,`That's single-case.`],
[`It has no control group to worry about`,`It does have a control group.`]],
e:`Control group: yes. Random assignment: no. But a {g:pretest} shows whether the groups differ on the {g:most important variable}. Other variables may still differ, so caution remains.`});

Q({k:`Control groups`, lv:`hard`, q:`Compared with a one-group pretest-posttest, what does adding a non-equivalent comparison group help with, and what does it introduce?`,
c:`Helps with history, maturation and testing; introduces selection differences`,
x:[[`Helps with selection differences between groups; introduces new maturation effects`,`Flipped. The comparison group handles maturation; selection is the new risk.`],
[`Helps with every threat; introduces nothing new`,`Non-random groups can differ from the start.`],
[`Helps with regression; introduces history`,`A comparison group helps with history.`],
[`Helps nothing, since the groups aren't randomized`,`It does help with threats both groups share.`]],
e:`Both groups experience the same {g:passage of time, outside events and testing}, so those threats cancel out. But non-random groups can differ from the start: {r:selection differences}.`});

/* =========================================================
   TIME SERIES (LO5)
   ========================================================= */
Q({k:`Time series`, lv:`warm`, q:`What's the key upgrade in the interrupted time series and control series designs?`,
c:`Many pretests and many posttests instead of just one of each`,
x:[[`Random assignment of whole regions or provinces to the treatment condition`,`Regions aren't randomly assigned.`],
[`A single participant measured over time in several different settings`,`That's a multiple baseline design.`],
[`Different age groups tested at the same point in time`,`That's cross-sectional.`],
[`A placebo condition that controls for expectations`,`That's a feature of true experiments.`]],
e:`They extend the one-group and non-equivalent pretest-posttest designs with {g:multiple measurements} before and after. They often use {g:archival data} to study natural "manipulations" like {g:new laws}.`});

Q({k:`Time series`, q:`Ontario passed a law at the end of 1996: an immediate 90-day licence suspension for drivers over the blood alcohol limit. The simplest check compared driver deaths in 1996 with 1997. What design is that, and what did it show?`,
c:`A one-group pretest-posttest; no immediate drop in driver deaths`,
x:[[`A control series; deaths fell sharply compared with other provinces`,`Comparing just two years in one province isn't a control series.`],
[`An interrupted time series; deaths fell 14.5% right away`,`One before-after pair isn't a series.`],
[`A one-group posttest-only; deaths after the law were very low`,`There's a 1996 comparison year.`],
[`A true experiment; drivers were randomly assigned to the law`,`Nobody is randomly assigned to a law.`]],
e:`One year before vs one year after = {g:one-group pretest-posttest}, with all its {r:vulnerability} to alternative explanations. It showed {g:no immediate reduction}.`});

Q({t:`hot`, k:`Time series`, q:`Ontario driver deaths, 1990–1998, with the law at the dashed line. One year makes the interpretation tricky. Click it.`,
fig:{k:`ts`, ph:[[`Before the law`,[8.6,8.4,8.7,8.3,8.5,8.4,7.3]],[`After`,[7.3,6.6]]], xt:[`1990`,`1991`,`1992`,`1993`,`1994`,`1995`,`1996`,`1997`,`1998`], hsPts:true, y:`Drivers killed per year`, x:`Year (illustrative shape)`},
a:`pt6`,
why:{pt0:`1990 is part of the long, steady high baseline.`, pt1:`1991 fits the steady high baseline.`, pt2:`1992 fits the steady high baseline.`, pt3:`1993 fits the steady high baseline.`, pt4:`1994 fits the steady high baseline.`, pt5:`1995 fits the steady high baseline.`, pt7:`1997 is after the law, where a drop is expected.`, pt8:`1998 continues the downward trend after the law.`},
e:`{g:1996}, the year {g:before} the law, was already lower than every earlier year. Maybe people heard about the coming law and changed early, or maybe it was a {r:random fluctuation}. Still, many years of data beat a single 1996 vs 1997 comparison.`});

Q({k:`Time series`, q:`Why might 1996, the year before Ontario's law took effect, already show fewer deaths?`,
c:`People may have heard about the law early, or it was a random fluctuation`,
x:[[`The law was quietly applied a full year early to some drivers caught drinking`,`Nothing suggests that.`],
[`Instrument decay in the traffic records made 1996 look lower`,`The chapter doesn't raise this.`],
[`Maturation made every driver in Ontario noticeably safer within a single year`,`Maturation doesn't hit a whole province in one year.`],
[`It proves the law didn't cause any of the later decline`,`It complicates the story but doesn't prove that.`]],
e:`Two candidate explanations: an {g:anticipation} effect (curbing drinking and driving before the law passed) or {g:random fluctuation}. Extra years on both sides make the picture {g:less ambiguous}.`});

Q({t:`hot`, k:`Time series`, q:`Now add Manitoba and New Brunswick (combined), which passed no such law. Click the control series.`,
fig:{k:`ts`, ph:[[`Before the law`,[8.6,8.4,8.7,8.3,8.5,8.4,7.3]],[`After`,[7.3,6.6]]], ctrl:[3.7,3.6,3.8,3.6,3.7,3.6,3.7,3.8,3.6], xt:[`1990`,`1991`,`1992`,`1993`,`1994`,`1995`,`1996`,`1997`,`1998`], hsLines:true, legend:[`Ontario`,`Manitoba + New Brunswick`], y:`Drivers killed per year`, x:`Year (illustrative shape)`},
a:`ctrl`,
why:{main:`That's Ontario, the province that passed the law.`},
e:`The {g:control series} tracks comparable cases {g:without} the change. They stayed {g:relatively constant} while Ontario declined, so the researchers concluded the law had {g:some effect} (Asbridge et al., 2009).`});

Q({t:`fill`, k:`Time series`, q:`While fatality rates in the comparison provinces stayed relatively constant, Ontario's driver fatalities declined by ___ percent.`,
a:[`14.5`],
e:`{g:14.5%}. The flat comparison line makes a province-wide history event less likely to explain Ontario's drop.`});

Q({k:`Time series`, rq:`12.9`, q:`Interrupted time series vs control series: which gives stronger evidence, and why?`,
c:`Control series, because comparison cases help rule out history effects`,
x:[[`Interrupted time series, because it has more measurements than a control series`,`They can have the same number of time points.`],
[`Interrupted time series, because it uses random assignment of regions`,`Neither uses random assignment.`],
[`Control series, because it only needs one pretest and one posttest`,`Both use many measurements.`],
[`They're equally strong, since both lack random assignment`,`Lacking random assignment doesn't make them equal.`]],
e:`Interrupted time series = one group's many before/after points; its weak spot is {r:history}. A {g:control series} adds a comparison group, so if only the treated case changes, history is less plausible.`});

Q({t:`hot`, k:`Time series`, q:`Monthly overdose rates in a province. Click the period after the opioid control bill passed.`,
fig:{k:`ts`, ph:[[`Before the bill`,[7,7.4,7.2,7.6,7.3]],[`After the bill`,[5.1,4.6,4.4,4.2,4.1]]], y:`Overdoses per 100k`, x:`Months`},
a:`ph1`,
why:{ph0:`These months come before the change.`},
e:`An {g:interrupted time series} tracks many measurements {g:before and after} a change. A sharp break right at the change is more convincing than a single pre/post comparison.`});

Q({k:`Time series`, q:`What's the biggest weakness of an interrupted time series with no comparison cases?`,
c:`History: something else happening at the same time could explain the change`,
x:[[`It has too few measurements to show any kind of trend before the change happens`,`It has many measurements.`],
[`It can't measure the dependent variable more than one time`,`It measures the DV many times.`],
[`It requires random assignment of whole states to each condition`,`It doesn't use random assignment.`],
[`It can only study one person, so results never generalize`,`It often studies whole populations.`]],
e:`It's like many {g:A–B} cases over time. Its main vulnerability is {r:history}: other events at the same moment. That's what control series designs address.`});

Q({t:`hot`, k:`Time series`, q:`A province passed a bill at the dashed line; a neighbour never did. Click the line that serves as the control series.`,
fig:{k:`ts`, ph:[[`Before`,[7,7.2,7,7.3,7.1]],[`After`,[5,4.6,4.3,4.1,4]]], ctrl:[7.2,7,7.3,7.1,7.2,7,7.3,7.1,7.2,7], hsLines:true, legend:[`Province with bill`,`Province without bill`], y:`Overdoses per 100k`, x:`Months`},
a:`ctrl`,
why:{main:`That's the province that passed the bill.`},
e:`The {g:control series} tracks a comparable case {g:without} the change. It stays flat while the treated province drops, which makes history a less plausible explanation.`});

Q({k:`Time series`, q:`States pass opioid bills at different times: A-B-B-B, A-A-B-B, A-A-A-B, and one never (A-A-A-A). Why is this staggered control series design persuasive?`,
c:`If drops line up with each state's own bill date, one outside event is unlikely`,
x:[[`It guarantees that the states were randomly assigned to pass the bill when they did`,`States chose when to pass bills.`],
[`It removes the need to measure overdoses repeatedly`,`It depends on repeated measurement.`],
[`It means every state got the bill at the same time`,`The point is that timing differs.`],
[`It turns the study into a single-case design`,`It still involves many cases.`]],
e:`{g:Control series} designs test how plausible {g:history effects} are. A single event would hit everyone at once; changes that track each state's own bill timing point to the bill.`});

Q({k:`Time series`, q:`Researchers compared people's movement patterns before and after COVID stay-home recommendations were issued. This design is:`,
c:`An interrupted time series`,
x:[[`A true experiment with random assignment`,`Nobody was randomly assigned.`],
[`A single-case ABA reversal`,`It's a population-level series.`],
[`A one-group posttest only`,`There are many pre-measurements.`],
[`A matched-pairs design`,`No pairs were matched.`]],
e:`Many measurements of movement, {g:interrupted} by the recommendations. Adding regions with recommendations at different times (or not at all) would make it a {g:control series}.`});

/* =========================================================
   SINGLE CASE DESIGNS (LO6)
   ========================================================= */
Q({k:`Single case designs`, lv:`warm`, q:`What is a {k:single case experimental design}?`,
c:`A design that tests the IV's effect using data from just one participant`,
x:[[`A design that compares exactly one treatment group with exactly one control group`,`That's a basic two-group experiment.`],
[`A design that tests one variable at a single moment in time`,`Single case designs measure repeatedly over time.`],
[`A descriptive case study of one person, with no manipulation of anything at all`,`Single case designs add a manipulation to a case study.`],
[`A design that combines the results of many single studies`,`That's a meta-analysis.`]],
e:`Single case designs bring {g:experimental logic} into a case study: measure a {g:baseline}, introduce a {g:treatment}, and watch the same person's behaviour change.`});

Q({k:`Single case designs`, lv:`warm`, q:`What are the two basic steps of a single-case baseline design?`,
c:`Measure a baseline of the DV, then manipulate something and watch the DV change`,
x:[[`Randomly assign many people to two conditions, then compare their group averages`,`That's a between-subjects experiment.`],
[`Pretest a group on a key variable, then match the people into similar pairs`,`That's matched pairs.`],
[`Survey people once and correlate two variables`,`That's correlational research.`],
[`Combine many past studies, then compute an overall effect across all of them`,`That's a meta-analysis.`]],
e:`Single-case: (1) estimate a {g:baseline} level of the DV, (2) {g:manipulate} and observe changes. One person, measured repeatedly over time.`});

Q({t:`fill`, k:`Single case designs`, rq:`12.2`, q:`In a single case design, behaviour measured during a control period, before the manipulation is introduced, is called the ___.`,
a:[`baseline`],
e:`The {g:baseline} is a form of {g:control condition}: it shows what behaviour looks like without the treatment, so changes in the treatment phase have something to be compared with.`});

Q({k:`Single case designs`, q:`Where did early interest in single case designs come from, and where are they used now?`,
c:`B. F. Skinner's reinforcement research; now clinical, counselling and school settings`,
x:[[`Freud's work on dream analysis; now mostly in brain imaging and neuroscience research labs`,`They grew out of behavioural research, not psychoanalysis.`],
[`Large national surveys of many people; now mostly used in public opinion polling firms`,`Surveys use many people measured once.`],
[`Terman's study of gifted kids; now mostly in developmental research`,`That's a longitudinal study.`],
[`Program evaluation laws; now mostly in government budget reviews`,`That's not their origin.`]],
e:`Classic {g:reinforcement} research (Skinner, 1953) used single subjects. Today: {g:clinical, counselling, educational} and other applied settings.`});

Q({t:`pick`, k:`Single case designs`, q:`A woman with anorexia nervosa received 18 months of emotion-focused therapy, and her eating disorder and depression scores dropped a lot (Dolhanty & Greenberg, 2009). Which alternative explanations are possible? Select all that apply.`,
i:[[`History: good life events during those 18 months`,1],
[`Maturation or natural recovery over a long stretch of time`,1],
[`Testing: filling out the same measures repeatedly`,1],
[`Regression: she may have started therapy at her very worst point`,1],
[`Selection differences between her and a control group`,0,`There's no control group, only one person.`],
[`Counterbalancing errors between her conditions`,0,`There was one treatment, not ordered conditions.`]],
e:`Before-and-after data on one person (an {g:A–B} pattern) can't rule out these threats. That's why single case researchers use {g:reversals} and {g:multiple baselines}.`});

Q({t:`hot`, k:`Single case designs`, q:`Mary, age 4: percentage of teacher requests she complied with, across 22 sessions. Click the phase that provides the reversal evidence.`,
fig:{k:`ts`, ph:[[`Baseline`,[22,30,18,26,24,20]],[`Treatment`,[48,66,78,84,88,92,86,90,94]],[`Baseline`,[52,40,34,28,30,26,24]]], max:100, brk:true, yt:[0,25,50,75,100], ys:`%`, y:`Compliance`, x:`Sessions 1–22`},
a:`ph2`,
why:{ph0:`The first baseline shows behaviour before treatment. It's needed, but it isn't the reversal.`, ph1:`The treatment phase shows the change. The reversal is what happens when treatment stops.`},
e:`In the {g:second baseline}, treatment is withdrawn and compliance {g:drops back}. Behaviour changing when treatment starts {g:and} reversing when it stops is evidence the treatment did it.`});

Q({k:`Single case designs`, q:`A child earns stars for each correct homework problem, traded for toys or candy. Correct problems are counted daily before the stars, during the stars, and after the stars stop. What design is this, and what's the key evidence?`,
c:`ABA reversal; performance rises with stars and falls back when they stop`,
x:[[`Multiple baseline; performance rises in several children at different times`,`It's one child in one setting.`],
[`Interrupted time series; performance is tracked across a whole school`,`It's a single child.`],
[`One-group posttest-only; performance is high after the stars`,`There are baseline measures before and after.`],
[`Cross-sectional; children of different ages are compared once`,`It's one child over time.`]],
e:`{g:A} (baseline) → {g:B} (stars) → {g:A} (stars withdrawn). The {g:reversal} is the clincher: if behaviour returns to baseline when B is removed, coincidence is less likely.`});

Q({t:`fill`, k:`Single case designs`, q:`A reversal design is also called a ___ design, because the treatment is removed.`,
a:[`withdrawal`],
e:`{g:Reversal} = {g:withdrawal} design: introduce treatment after a baseline, then withdraw it during a second baseline. It can be extended by reintroducing the treatment.`});

Q({k:`Single case designs`, q:`A friend tracks his mystery stomach pain daily and suspects menthol cough drops. He goes Day 1 no menthol, Day 2 menthol, Day 3 no menthol. What design is this, and why is the third phase useful?`,
c:`ABA reversal; pain returning when menthol stops points to menthol, not coincidence`,
x:[[`Multiple baseline; it tests whether menthol causes pain across different people`,`It's one person across phases.`],
[`Interrupted time series; it tracks a whole population`,`It's a single case, not a population.`],
[`Non-equivalent control group; Day 3 is the control group`,`There's no separate group.`],
[`One-group posttest only; Day 3 is the posttest that shows menthol's lasting effect`,`There's a baseline and a reversal.`]],
e:`{g:A–B–A}: baseline, treatment, {g:withdrawal}. If the DV changes with B and {g:reverses} when B is removed, a coincidence (like a history event) is much less plausible.`});

Q({t:`hot`, k:`Single case designs`, q:`In this ABAB design tracking a child's on-task behaviour, click the phase where the treatment is withdrawn.`,
fig:{k:`ts`, ph:[[`A`,[2,3,2,3]],[`B`,[7,8,7,8]],[`A`,[3,2,3,2]],[`B`,[8,7,8,8]]], brk:true, y:`On-task behaviour`, x:`Sessions`},
a:`ph2`,
why:{ph0:`This first A is the baseline, before any treatment.`, ph1:`This is the first treatment phase.`, ph3:`This is the treatment being reintroduced.`},
e:`The {g:second A} is the reversal: treatment removed, behaviour drops back toward baseline. Researchers often add a final {g:B} so the study ends with treatment and the effect is replicated.`});

Q({k:`Single case designs`, rq:`12.1`, q:`Why do researchers frequently add a second B, making the design ABAB?`,
c:`It replicates the effect and ends the study with the helpful treatment in place`,
x:[[`It turns the single-case design into a between-subjects experiment with two groups`,`It's still one participant.`],
[`It removes the need for a baseline phase at the start of the study`,`The baseline is still needed.`],
[`It lets the researcher test a second participant in the same session`,`Testing others is a multiple baseline idea.`],
[`It creates a ceiling effect on purpose so the behaviour change is easier to see`,`That's not the goal.`]],
e:`A second B shows the effect {g:a second time} (replication within one person) and avoids ending on the no-treatment phase, which is often more ethical.`});

Q({k:`Single case designs`, q:`During an ABA study, the client also happens to get a new puppy right when treatment starts. Why does an ABAB (or ABABAB) design protect against this kind of coincidence?`,
c:`It's unlikely a happy event lines up with the treatment every single time`,
x:[[`Puppies only affect behaviour during the baseline phases`,`Coincidences can happen in any phase.`],
[`A second treatment phase removes all possible history effects completely and forever`,`It makes coincidence less likely, not impossible.`],
[`ABAB designs randomly assign the client to get a puppy`,`Nothing is randomly assigned.`],
[`Coincidences only matter when there are many participants in different groups`,`They matter most with one participant.`]],
e:`One reversal could be a {r:random fluctuation} or a lucky coincidence. Each added reversal is another chance for it to fail. What are the odds of a new puppy {g:every} time treatment begins? ABABAB tests it a {g:third} time.`});

Q({k:`Single case designs`, q:`Some treatments change behaviour right away, but many take a while to show an impact. What does that mean for planning a reversal design?`,
c:`Treatment phases may need to run long enough for a slow effect to appear`,
x:[[`Slow-acting treatments can't be studied with any kind of single case design at all`,`They can; the phases just need to be long enough.`],
[`The baseline phase should be skipped to save time for the treatment`,`The baseline is essential.`],
[`Slow effects are a sure sign that the treatment has a ceiling effect on behaviour`,`Slow onset isn't a ceiling effect.`],
[`The researcher should switch to a cross-sectional design instead`,`That's for studying age.`]],
e:`A dramatic, instant change (like in Mary's graph) is the easy case. For slower effects, a {r:short B phase} could miss a real change.`});

Q({t:`hot`, k:`Single case designs`, q:`A multiple baseline across four children. Treatment starts at a different time for each. Click the child whose data would weaken the case for the treatment.`,
fig:{k:`mb`, rows:[{t:`Kate`, d:`4 yrs`, s:4},{t:`Ben`, d:`4 yrs`, s:7, j:4},{t:`Tyler`, d:`3 yrs`, s:10},{t:`Jake`, d:`4 yrs`, s:13}], n:16, x:`Sessions`},
a:`r1`,
why:{r0:`Kate changes right when her own treatment starts. That supports the treatment.`, r2:`Tyler changes right when his own treatment starts. That supports the treatment.`, r3:`Jake changes right when his own treatment starts. That supports the treatment.`},
e:`Ben's behaviour jumped {r:before his own treatment began}, at the same time as Kate's. That hints at something else (a history event, copying Kate) rather than the treatment. The logic: change should happen {g:only when each person's treatment starts}.`});

Q({k:`Single case designs`, q:`What's the key element of a multiple baseline design across participants?`,
c:`Treatment starts at a different time for each participant`,
x:[[`Every participant starts treatment on exactly the same day`,`Then a shared event could explain the change.`],
[`Participants are randomly assigned to treatment or no treatment`,`Everyone eventually gets the treatment.`],
[`Each participant gets a different version of the treatment`,`The same manipulation is applied to each.`],
[`Participants are measured only once, after the treatment ends`,`They're measured repeatedly.`]],
e:`{g:Staggered starts}. If behaviour changes each time, {g:right when} that person's treatment begins, explanations based on {r:chance} or {r:historical events} are ruled out.`});

Q({t:`match`, k:`Single case designs`, rq:`12.3`, q:`Match each multiple baseline design to its example.`,
p:[[`Across participants`,`Four people in a smoking study start treatment at different times`],
[`Across behaviours`,`A reward system targets a child's socializing, grooming and reading, one at a time`],
[`Across situations`,`One behaviour is measured at home and at school, with treatment starting at different times`]],
e:`Same logic, three ways to stagger: across {g:people}, across {g:behaviours} of one person, or across {g:settings}. Each staggered change makes coincidence less plausible.`});

Q({k:`Single case designs`, q:`Researchers in Sherbrooke, Quebec, taught a woman with early Alzheimer's disease to find her way around her seniors' residence, applying the training in the games room, laundry room and other locations. Why did using several locations matter?`,
c:`It showed the effect generalizes beyond one setting (across situations)`,
x:[[`It turned the study into a true experiment with random assignment of locations`,`One participant can't be randomly assigned.`],
[`It let them avoid measuring a baseline in any of the rooms`,`They still measured baselines.`],
[`It made the study cross-sectional, since all the rooms were compared at one time`,`Cross-sectional designs compare age groups.`],
[`It removed the need to ever withdraw the treatment`,`They actually used an ABA design.`]],
e:`This is a multiple baseline {g:across situations} (Provencher et al., 2008). Showing it works in {g:different locations} increases confidence in its {g:efficacy}.`});

Q({t:`hot`, k:`Single case designs`, q:`One child, three target behaviours, with the reward system introduced at different times. What kind of multiple baseline is this? Click the behaviour that got the reward system last.`,
fig:{k:`mb`, rows:[{t:`Socializing`, s:4},{t:`Grooming`, s:8},{t:`Reading`, s:12}], n:16, x:`Days`},
a:`r2`,
why:{r0:`Socializing got the reward system first.`, r1:`Grooming got the reward system second.`},
e:`{g:Reading} started last. This is a multiple baseline {g:across behaviours}: each behaviour improves {g:only} once the reward system targets it, which is strong evidence the rewards work.`});

Q({k:`Single case designs`, q:`Why might a single case design skip the reversal phase?`,
c:`Withdrawing the treatment would be unethical, or the change can't be undone`,
x:[[`Reversal phases are only allowed in group experiments with a separate control group`,`Reversals are a single case tool.`],
[`Skipping the reversal makes the design a true experiment`,`It doesn't.`],
[`Reversal phases always create ceiling effects`,`That isn't a reason.`],
[`Without a reversal phase, no baseline period needs to be measured at the start`,`A baseline is still needed.`]],
e:`You wouldn't stop a treatment that reduces {r:dangerous or illegal} behaviour (e.g., {g:kleptomania}, {g:alcoholism}), and some changes are {g:irreversible} (e.g., {g:surgery}). Then you take many measures before and after: an effective treatment shows an {g:immediate change that continues}.`});

Q({k:`Single case designs`, lv:`hard`, q:`A five-minute play intervention was tried with eight children (three girls) from five schools. Compliance rose for all eight; six kept it up afterward, and the other two kept it up once the intervention was repeated. Why could researchers draw a broader conclusion?`,
c:`The effect replicated across different children at different schools`,
x:[[`Eight children is enough to represent all children everywhere`,`Eight is small; it's the replication that helps.`],
[`The children were randomly assigned to schools first`,`They weren't.`],
[`Compliance was measured only once for each child, after the intervention`,`It was measured repeatedly.`],
[`The two children who dropped back were removed from the results`,`They were kept and given the intervention again (ABABA).`]],
e:`Single case designs share case studies' {r:questionable generalizability}, but {g:replication} with other participants in other settings enhances it (Levine & Ducharme, 2013). Conclusion: the intervention can improve compliance {g:among some children}.`});

Q({t:`pick`, k:`Single case designs`, q:`What makes single case designs useful? Select all the advantages.`,
i:[[`A teacher can test a new technique in their own classroom`,1],
[`They don't require complex statistical analyses`,1],
[`A clinician or parent can help one particular person`,1],
[`You can even experiment on yourself, like testing a new diet`,1],
[`Results from many of them can be combined in a meta-analysis`,1],
[`One case automatically generalizes to the whole population`,0,`Generalizing takes replication.`],
[`They require random assignment of many participants`,0,`They use one or a few participants.`]],
e:`Single case designs are a {g:powerful alternative} when studying one or a few people is necessary or desired. New statistical techniques for them are also being developed.`});

Q({k:`Single case designs`, q:`A University of Alberta team combined 115 single case studies (343 participants in total) on social skills interventions for autism spectrum disorder. What does this show?`,
c:`Single case results can be pooled with meta-analysis to reveal overall patterns`,
x:[[`Single case designs only work well when each study has 300 or more participants in it`,`Each study had one to seven people.`],
