<style>:root{--serif:'Cinzel',Georgia,serif;--sans:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
--bg:#F5F2EA;--bg2:#ECE7DA;--panel:#FFFFFF;--panel2:#F3F0E7;--text:#0C1A3C;--muted:#5B6787;--line:#DDD7C8;--line2:#C9C1AE;
--blue:#035AFC;--blue2:#3F82FF;--blued:#0A2F8F;--bluet:#E4EDFF;--gold:#E08220;--gold2:#F2A94F;--goldt:#FCEBD5;--goldd:#A85A0C;
--good:#178F57;--goodt:#DFF4E9;--bad:#D03A32;--badt:#FCE4E1;--ol:#0C1A3C;--shadow:0 1px 2px rgba(12,26,60,.06),0 10px 30px -14px rgba(12,26,60,.22);
--mas:#035AFC;--teal:#6FA5FF;--vio:#0A2F8F;--rose:#E08220;--lit:#F2A94F;--bloom:#F7C98A;--mut:#A9B3CC;--bark:#96602A;--faint:#C9D2E6;
--sky1:#DCE8FF;--sky2:#F6F1E4;--ground:#EAD9B8;--wall:#F4F1E9;--floor:#E3D5B8}
:root[data-theme=dark]{--bg:#050A1A;--bg2:#081028;--panel:#0C1633;--panel2:#111D42;--text:#EAEFFF;--muted:#96A3CC;--line:#1F2D5C;--line2:#2D3E78;
--blue:#4D8BFF;--blue2:#7AA8FF;--blued:#A9C6FF;--bluet:#0F2256;--gold:#F29B3F;--gold2:#F7B869;--goldt:#33210C;--goldd:#F7B869;
--good:#3FCB8A;--goodt:#0C2E22;--bad:#FF6D63;--badt:#3A1513;--ol:#02060F;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px -16px rgba(0,0,0,.7);
--mas:#3F82FF;--teal:#8DB8FF;--vio:#2A4FB8;--rose:#F29B3F;--lit:#F7B869;--bloom:#F9D29C;--mut:#56628A;--bark:#B07A3C;--faint:#2D3E78;
--sky1:#0B1B4A;--sky2:#0A1230;--ground:#1A2553;--wall:#0F1A3D;--floor:#1C2752}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 var(--sans);min-height:100vh;
background-image:radial-gradient(1200px 500px at 50% -120px,color-mix(in srgb,var(--blue) 13%,transparent),transparent 70%),radial-gradient(700px 300px at 85% 0,color-mix(in srgb,var(--gold) 9%,transparent),transparent 70%);background-repeat:no-repeat}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.04em;margin:0;text-wrap:balance}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}
/* top bar */
.bar{position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--line)}
.bar-in{max-width:900px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:9px;font:600 .86rem var(--serif);letter-spacing:.16em;text-transform:uppercase;margin-right:auto;padding:4px 6px 4px 0}
.brand svg{width:26px;height:26px;flex:none}
.ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);transition:.18s}
.ib:hover{border-color:var(--blue);transform:translateY(-1px)}.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib.off{color:var(--muted);opacity:.6}.ib.on{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
/* hero */
.hero{position:relative;margin:18px 0 6px;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--sky1),var(--sky2));box-shadow:var(--shadow)}
.hero svg{display:block;width:100%;height:auto}
.hero-t{text-align:center;padding:22px 12px 0}
.hero-t .k{font:500 .68rem var(--sans);letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.hero-t h1{font-size:clamp(1.35rem,4.6vw,2.3rem);letter-spacing:.2em;margin-top:4px;color:var(--text)}
.c-body{fill:color-mix(in srgb,var(--blue) 82%,#fff)}.c-body2{fill:color-mix(in srgb,var(--blue) 62%,var(--panel))}.c-body3{fill:color-mix(in srgb,var(--blue) 40%,var(--panel))}
[data-theme=dark] .c-body{fill:#12307F}[data-theme=dark] .c-body2{fill:#0F2769}[data-theme=dark] .c-body3{fill:#0C1F55}
.c-edge{fill:none;stroke:color-mix(in srgb,var(--blue2) 80%,#fff);stroke-width:1;opacity:.75}
.c-roof{fill:var(--blued)}[data-theme=dark] .c-roof{fill:#3F82FF}
.c-win{fill:color-mix(in srgb,var(--panel) 55%,var(--blue));opacity:.55;transition:fill .6s,opacity .6s}
.c-win.on{fill:var(--gold2);opacity:1;filter:drop-shadow(0 0 3px var(--gold))}
.c-halo{fill:none;stroke:var(--gold);stroke-width:2}.c-halo2{fill:none;stroke:var(--gold2);stroke-width:1;opacity:.5}
.c-ray{stroke:var(--gold2);stroke-width:1;opacity:.35}.c-fin{fill:var(--gold)}
.c-base{fill:color-mix(in srgb,var(--blue) 22%,var(--panel))}[data-theme=dark] .c-base{fill:#0A1947}
.c-mist{fill:var(--panel);opacity:.5}[data-theme=dark] .c-mist{opacity:.08}
.halo-spin{transform-origin:400px 62px;transform-box:view-box;animation:spin 60s linear infinite}
.orb{animation:bob 7s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-5px)}}
/* generic */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 .72rem var(--sans);letter-spacing:.06em;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted);white-space:nowrap}
.chip.b{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 35%,var(--line));background:var(--bluet)}
.chip.g{color:var(--goldd);border-color:color-mix(in srgb,var(--gold) 45%,var(--line));background:var(--goldt)}
button.chip{cursor:pointer}button.chip.act{background:var(--blue);color:#fff;border-color:var(--blue)}
.sub{color:var(--muted);font-size:.92rem}.ctr{text-align:center}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px}.sec-h h2{font-size:1rem;letter-spacing:.2em;text-transform:uppercase}.sec-h .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:13px;font:600 .92rem var(--sans);letter-spacing:.02em;border:1px solid var(--line2);background:var(--panel);transition:.18s}
.btn:hover{transform:translateY(-1px);border-color:var(--blue)}
.btn.pri{background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;border-color:transparent;box-shadow:0 8px 20px -10px var(--blue)}
[data-theme=dark] .btn.pri{background:linear-gradient(180deg,#2F78FF,#035AFC)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1600;border-color:transparent;box-shadow:0 8px 20px -10px var(--gold)}
.btn.sm{padding:7px 12px;font-size:.82rem;border-radius:10px}.btn:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}
.stat b{display:block;font:600 1.5rem var(--serif);color:var(--blue)}.stat.g b{color:var(--gold)}.stat span{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
/* towers */
.towers{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tower{position:relative;text-align:left;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.tower:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--blue),var(--gold))}
.tower h3{font-size:1.02rem}.tower .u{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.wins{display:flex;flex-wrap:wrap;gap:3px}
.wn{width:9px;height:13px;border-radius:5px 5px 1.5px 1.5px;background:var(--panel2);border:1px solid var(--line2)}
.wn.l{background:var(--blue);border-color:var(--blue)}.wn.g{background:var(--gold2);border-color:var(--gold);box-shadow:0 0 6px color-mix(in srgb,var(--gold) 70%,transparent)}
.meter{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;display:flex}.meter i{display:block;height:100%;background:var(--blue);transition:width .5s}.meter i.g{background:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tiles.five{grid-template-columns:repeat(5,1fr)}.tower.wide{grid-column:1/-1}
.tile{text-align:left;padding:15px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);transition:.2s;display:flex;flex-direction:column;gap:6px;min-height:118px}
.tile:hover{transform:translateY(-3px);border-color:var(--blue)}.tile svg{width:26px;height:26px;stroke:var(--blue);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tile b{font:600 .9rem var(--serif);letter-spacing:.08em}.tile span{font-size:.8rem;color:var(--muted);line-height:1.35}
.tile.feat{grid-column:span 2;background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 92%,#000),var(--blued));color:#fff;border-color:transparent}
[data-theme=dark] .tile.feat{background:linear-gradient(135deg,#0B3FC0,#0A1E66)}
.tile.feat svg{stroke:var(--gold2)}.tile.feat span{color:rgba(255,255,255,.8)}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin:16px 0 10px}.qtop .t{font:600 .8rem var(--serif);letter-spacing:.16em;text-transform:uppercase}
.prog{flex:1;height:5px;border-radius:9px;background:var(--panel2);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .4s}
.qcard{padding:18px 18px 20px}
.scene{max-width:600px;margin:12px auto 4px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--panel2)}
.scene svg{display:block;width:100%;height:auto}
.scap{font-size:.76rem;color:var(--muted);padding:6px 12px 8px;display:flex;gap:8px;align-items:center;min-height:30px;border-top:1px solid var(--line)}
.scap b{color:var(--gold);font-weight:600;white-space:nowrap}.scap span{flex:1}
.stem{font:500 1.08rem/1.5 var(--sans);margin:14px 0 14px}
mark.hl{background:linear-gradient(180deg,transparent 62%,color-mix(in srgb,var(--gold) 45%,transparent) 62%);color:inherit;padding:0 1px}
.blank{display:inline-block;min-width:74px;border-bottom:2px solid var(--gold);text-align:center;font-weight:600;padding:0 6px;color:var(--gold)}
.blank.fill{color:var(--good);border-color:var(--good);animation:pop .4s}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);transition:.16s;line-height:1.42}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--bluet)}
.opt .l{flex:none;width:26px;height:26px;border-radius:8px 8px 3px 3px;display:grid;place-items:center;font:600 .78rem var(--serif);border:1px solid var(--line2);color:var(--muted);margin-top:-1px}
.opt.sel{border-color:var(--blue);background:var(--bluet)}.opt.sel .l{background:var(--blue);color:#fff;border-color:var(--blue)}
.opt.ok{border-color:var(--good);background:var(--goodt)}.opt.ok .l{background:var(--good);color:#fff;border-color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--badt)}.opt.no .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.72}.opt:disabled{cursor:default;color:inherit}
.rev .opt .kt{font-weight:600;color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent);border-radius:5px;padding:0 3px}
.rev .opt.ok .kt{color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
.fb{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;animation:rise .35s both}
.verdict{font:600 1rem var(--serif);letter-spacing:.08em;display:flex;align-items:center;gap:8px}.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.kbox{margin-top:10px;padding:12px 14px;border-radius:13px;background:var(--bluet);border:1px solid color-mix(in srgb,var(--blue) 28%,var(--line))}
.hbox{margin-top:8px;padding:11px 14px;border-radius:13px;background:var(--goldt);border:1px solid color-mix(in srgb,var(--gold) 38%,var(--line))}
.kbox .lb,.hbox .lb,.whys .lb{font:600 .66rem var(--sans);letter-spacing:.18em;text-transform:uppercase;display:block;margin-bottom:3px;color:var(--blue)}.hbox .lb{color:var(--goldd)}
.whys{margin-top:12px}.whys .lb{color:var(--muted)}
.why{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.93rem}.why:last-child{border:0}
.why .l{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font:600 .7rem var(--serif);color:#fff;background:var(--bad)}.why.ok .l{background:var(--good)}
.why b.o{color:var(--bad)}.why.ok b.o{color:var(--good)}
.why b.x{font-weight:600;color:var(--bad)}.why.ok b.x{color:var(--good)}
.qnav{display:flex;gap:10px;align-items:center;margin-top:16px}
.kbd{font:500 .7rem var(--sans);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
/* exam */
.exbar{display:flex;align-items:center;gap:10px;margin:14px 0 8px;flex-wrap:wrap}
.timer{font:600 1.05rem var(--serif);letter-spacing:.1em;padding:6px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel)}.timer.low{color:var(--bad);border-color:var(--bad)}
.navg{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin:10px 0}
.nb{height:38px;border-radius:9px 9px 4px 4px;border:1px solid var(--line2);background:var(--panel);font:600 .78rem var(--sans);position:relative}
.nb.a{background:var(--bluet);border-color:var(--blue);color:var(--blue)}.nb.cur{outline:2px solid var(--gold);outline-offset:1px}.nb.f:after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.nb.ok{background:var(--goodt);border-color:var(--good);color:var(--good)}.nb.no{background:var(--badt);border-color:var(--bad);color:var(--bad)}
.ring{width:150px;height:150px;margin:6px auto;position:relative;display:grid;place-items:center}.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font:600 2rem var(--serif)}.ring span{display:block;font-size:.74rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.brk{display:grid;gap:8px;margin-top:10px}.brk .r{display:grid;grid-template-columns:130px 1fr 54px;gap:10px;align-items:center;font-size:.88rem}
.rv-item{border:1px solid var(--line);border-radius:16px;margin-top:12px;background:var(--panel);overflow:hidden}
.rv-item>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}.rv-item>summary::-webkit-details-marker{display:none}
.rv-item .n{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:600 .78rem var(--sans);color:#fff;background:var(--bad)}.rv-item.ok .n{background:var(--good)}
.rv-item .in{padding:0 14px 14px}
/* lists */
.obj{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.obj:last-child{border:0}
.obj p{margin:0;font-size:.95rem}.obj .m{grid-column:1/2}
.srch{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font:inherit;outline:none}.srch:focus{border-color:var(--blue)}
.terms{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.term{padding:14px 15px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.term h4{margin:0 0 4px;font:600 .98rem var(--serif);letter-spacing:.05em;color:var(--blue)}.term p{margin:4px 0 0;font-size:.9rem}.term .e{color:var(--muted)}.term .h{color:var(--goldd)}
.term .e b,.term .h b{font:600 .62rem var(--sans);letter-spacing:.16em;text-transform:uppercase;margin-right:6px}
.flash{perspective:1200px;margin:16px auto;max-width:560px;height:300px;cursor:pointer}
.flash-in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d}.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;overflow:auto}
.face.bk{transform:rotateY(180deg);background:linear-gradient(180deg,var(--panel),var(--bluet))}
.face h3{font-size:1.5rem;color:var(--blue)}.face p{margin:8px 0 0}
.pchips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.pc{padding:9px 13px;border-radius:12px;border:1.5px solid var(--line2);background:var(--panel);font-size:.92rem;text-align:left;transition:.15s}
.pc.sel{border-color:var(--blue);background:var(--bluet)}.pc.ok{border-color:var(--good);background:var(--goodt);color:var(--good);font-weight:600}
.pc.no{border-color:var(--bad);background:var(--badt);color:var(--bad);text-decoration:line-through}.pc.miss{border-color:var(--gold);background:var(--goldt);border-style:dashed}
.read{margin-top:14px}.read h3{font-size:1.05rem;color:var(--blue)}.read .cite{font-size:.8rem;color:var(--muted);margin:4px 0 10px}
.rrow{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:.93rem}.rrow b{font:600 .7rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding-top:3px}

dy on early childhood experiences","w":"Ramsden et al., 2026","short":"Ramsden et al. (2026)"},{"i":7,"s":1,"t":"Consider how research on play might be applied into the real world; discuss challenges to application","w":"Lecture","short":"Applying play research"},{"i":8,"s":2,"t":"Consider why children go to school","w":"Lecture","short":"Why school?"},{"i":9,"s":2,"t":"Discuss teacher quality, relationships, and teacher expectations","w":"Lecture","short":"Teachers & expectations"},{"i":10,"s":2,"t":"Describe how features of academic work can impact students","w":"Lecture","short":"Academic work"},{"i":11,"s":2,"t":"Identify SEL programs; discuss why such programs may be linked with positive outcomes","w":"Lecture","short":"SEL programs"},{"i":12,"s":2,"t":"Consider how active and playful learning may be beneficial","w":"Lecture; Bustamante et al., 2022","short":"Active & playful learning"},{"i":13,"s":2,"t":"Describe the background, methods, results, implications and limitations of Bustamante et al.’s study on Fraction Ball as a playful approach to learning","w":"Bustamante et al., 2022","short":"Bustamante et al. (2022)"},{"i":14,"s":3,"t":"Contrast mastery and relative-ability achievement goals, and discuss how practices may emphasize different achievement goals","w":"Lecture","short":"Achievement goals"},{"i":15,"s":3,"t":"Explain the influence of school size, school type, school year structure, and school start times","w":"Lecture","short":"Size, type, year & start times"},{"i":16,"s":3,"t":"Define ability tracking, and analyze its effect on students","w":"Lecture","short":"Ability tracking"},{"i":17,"s":3,"t":"Discuss the impacts of the student body and school diversity","w":"Lecture","short":"School diversity"},{"i":18,"s":3,"t":"Consider how school diversity ideologies may affect students: describe the motivation, results, implications, and limitations of Leer, Gaither, & Gassman-Pines (2025)'s study","w":"Leer, Gaither, & Gassman-Pines, 2025","short":"Leer et al. (2025)"},{"i":19,"s":4,"t":"Consider the question of whether adolescents accused of crimes should be held to the same standards of blame and punishments as adults","w":"Lecture; Steinberg & Icenogle, 2019","short":"Same blame as adults?"},{"i":20,"s":4,"t":"Discuss the concept of penal proportionality, and identify the 3 factors that can mitigate criminal responsibility","w":"Lecture","short":"Penal proportionality & mitigation"},{"i":21,"s":4,"t":"Describe the development of cognitive and psychosocial skills during adolescence, and links to related neurological changes. Consider how these developments may relate to risky behaviour","w":"Lecture; Steinberg & Icenogle, 2019","short":"Cognitive, psychosocial & brain development"},{"i":22,"s":4,"t":"Debate when and how the legal system should define maturity","w":"Lecture; Steinberg & Icenogle, 2019","short":"Defining maturity"}],"Q":[{"id":"a1q001","s":1,"o":0,"t":"L","sc":"playdef","q":"Every Friday, Ms. Diaz runs ==‘fun time’==: each child ==must pick a station==, and those who finish the ==most stations win a prize==. The children laugh and race between stations. Which ==two features of play== are most clearly missing?","k":"Play = joyful · active engagement · spontaneous · voluntary · intrinsically motivated · unrelated to immediate survival. A requirement plus a prize knocks out ‘voluntary’ and ‘intrinsically motivated’.","v":"Odd one out","a":[["[[Voluntary]] and [[intrinsically motivated]]","Right. Children [[must]] pick a station, so it isn’t freely chosen, and the [[prize]] is an outside reward. Laughing shows joy, but joy alone doesn’t make it play."],["[[Joyful]] and [[active engagement]]","Wrong. They [[laugh]] and [[race]], so joy and active engagement are both present."],["[[Spontaneous]] and [[joyful]]","Half right at best. A set schedule does cut spontaneity, but they’re clearly [[joyful]], so this pair fails."],["[[Active engagement]] and [[unrelated to survival]]","Wrong. Racing is active, and stations have nothing to do with [[survival]]."],["[[Intrinsically motivated]] and [[active engagement]]","Half right. The prize does undercut intrinsic motivation, but racing between stations is [[active]]."]],"h":"Ask two questions: could the child say no? Would they do it with no reward?"},{"id":"a1q002","s":1,"o":0,"t":"L","sc":"playdef","q":"A researcher is checking whether an activity counts as ==play== using lecture’s definition. Which features should be on her checklist? ==Check every one== that belongs.","k":"Six features: joyful · active engagement · spontaneous · voluntary · intrinsically motivated · unrelated to immediate survival. (Joyful and intrinsically motivated weren’t options here.)","v":"Check all that apply","a":[["[[Spontaneous]]","Belongs. Play unfolds in the moment.",1],["[[Voluntary]]","Belongs. The child chooses it.",1],["[[Unrelated to immediate survival]]","Belongs. Play isn’t about getting food or staying safe right now.",1],["[[Active engagement]]","Belongs. The child is doing, not just watching.",1],["[[Rule-governed]]","Impostor. Games have rules, but rules aren’t part of the definition of play.",0],["[[Goal-directed]] toward a skill","Impostor. Play is done for its own sake, not to train a skill.",0],["[[Adult-supervised]]","Impostor. Supervision isn’t a feature of play. Guided play is one type, not the definition.",0]],"m":1},{"id":"a1q003","s":1,"o":0,"t":"L","sc":"stagetab","q":"At the water table, ==Ari== pours water through a funnel. ==Bea==, right beside him, ==also pours water through her own funnel==. They ==never talk or share==. Ten minutes later they ==swap funnels and chat about whose is faster==, but each still runs their own experiment. Which ==sequence== of stages did they move through?","k":"Parallel = beside, similar toys, no interaction. Associative = interact and share, no common goal. Cooperative = common goal, maybe different tasks.","v":"Sequence","a":[["[[Parallel]] → [[associative]]","Right. First: side by side with [[similar toys]], no interaction = parallel. Then they [[interact and share]] but still have [[no common goal]] = associative."],["[[Solitary]] → [[associative]]","Wrong start. Solitary means doing something [[different]] from the children nearby. Bea was doing the same thing."],["[[Parallel]] → [[cooperative]]","Wrong end. Cooperative needs a [[common goal]]. Each still runs their own experiment."],["[[Onlooker]] → [[associative]]","Wrong start. An onlooker [[watches]] others without playing. Ari was busy pouring."],["[[Associative]] → [[cooperative]]","Wrong. At first they [[never talked or shared]], so it couldn’t have been associative."]],"h":"Beside → with → together."},{"id":"a1q004","s":1,"o":0,"t":"L","sc":"stagetab","q":"Which description is the ==least common form of play== according to lecture’s table?","k":"Unoccupied play: seems random, no specific goal. Least common form.","v":"Which description","a":[["A child [[wanders]] the room, fiddling with things, no specific goal","Right. That’s [[unoccupied]] play: random behaviour without a goal. The table called it the [[least common]] form."],["A child [[watches]] others build a fort and calls out tips, but never joins","Wrong. That’s [[onlooker]] play, which wasn’t described as least common."],["A child builds [[alone]] with blocks while others play tag nearby","Wrong. That’s [[solitary]] play."],["Two children build [[their own towers]] side by side with similar blocks","Wrong. That’s [[parallel]] play."],["Two children [[share crayons]] and chat while each draws their own picture","Wrong. That’s [[associative]] play."]]},{"id":"a1q005","s":1,"o":0,"t":"L","sc":"stagetab","q":"Four-year-olds ==Jun and Maya== agree to ==build one sandcastle together==: Jun ==digs the moat== while Maya ==shapes the towers==. A third child, ==Leo==, sits nearby, ==watches, and suggests a drawbridge== but ==never touches the sand==. Which pair is correct?","k":"Cooperative: common goal, maybe different tasks. Onlooker: observes, may comment or suggest, doesn’t join.","v":"Two-part","a":[["Jun and Maya: [[cooperative]] · Leo: [[onlooker]]","Right. A [[common goal]] with [[different tasks]] is cooperative. Watching and suggesting without joining is onlooker."],["Jun and Maya: [[associative]] · Leo: [[onlooker]]","Wrong. Associative has [[no common goal]]. They’re building ONE castle."],["Jun and Maya: [[cooperative]] · Leo: [[unoccupied]]","Wrong. Unoccupied is [[random]] and goal-less. Leo is focused on their castle."],["Jun and Maya: [[parallel]] · Leo: [[solitary]]","Wrong. They interact around a shared goal, and Leo has no activity of his own."],["Jun and Maya: [[cooperative]] · Leo: [[associative]]","Wrong. Leo never [[touches the sand]] or shares materials, so he isn’t interacting in the play."]]},{"id":"a1q006","s":1,"o":0,"t":"L","sc":"stagetab","q":"Which of these stages are on the ==SOCIAL== side of lecture’s table? ==Check all== that apply.","k":"Non-social: unoccupied, solitary, onlooker. Social: parallel, associative, cooperative.","v":"Check all that apply","a":[["[[Parallel]] play","Belongs. Even without direct interaction, the table brackets it with social play.",1],["[[Associative]] play","Belongs.",1],["[[Cooperative]] play","Belongs.",1],["[[Onlooker]] play","Impostor. Watching without joining is on the non-social side.",0],["[[Solitary]] play","Impostor. Non-social.",0],["[[Unoccupied]] play","Impostor. Non-social, and the least common form.",0]],"m":1,"h":"U-S-O, then P-A-C."},{"id":"a1q007","s":1,"o":1,"t":"L","sc":"types","q":"A ==preschool teacher== sets out ==magnets and objects== because she wants children to ==discover what sticks==. She ==lets them lead==, but asks ==‘What do you notice about the spoon?’== Which ==type of play== is this?","k":"Guided play: adult sets up a learning goal, the child stays in charge of the play.","v":"Classify","a":[["[[Guided]] play","Right. An adult sets up the environment with a [[learning goal]] but the [[child leads]], with gentle prompts."],["[[Object]] play","Close, but object play is the child exploring objects on their own. The adult’s [[goal and prompts]] make it guided."],["[[Games]]","Wrong. There are no rules, turns or winners."],["[[Pretend]] play","Wrong. Nobody is acting as-if."],["[[Parallel]] play","Wrong. Parallel play is a stage of social play, not a type."]]},{"id":"a1q008","s":1,"o":1,"t":"L","sc":"types","q":"Which situation shows ==TWO types== of play from lecture’s list ==at once==?","k":"Types can overlap: rough-and-tumble outside is physical AND outdoor (and maybe risky).","v":"Find the overlap","a":[["Kids [[play-wrestle]] on the grass under the trees","Right. Play-wrestling = [[physical (rough-and-tumble)]] play, and doing it [[outside]] in an unstructured way = [[outdoor]] play."],["A child [[stacks cups]] indoors to see which fit","Only one type: [[object]] play."],["Two kids play [[checkers]] at the kitchen table","Only one type: [[games]]."],["A child [[watches]] older kids play tag","That’s onlooker play, a stage, not a type."],["A toddler [[wanders]] around the room with no goal","That’s unoccupied play, a stage, not a type."]]},{"id":"a1q009","s":1,"o":1,"t":"L","sc":"types","q":"Which of these were on lecture’s ==list of types of play==? ==Check all== that apply.","k":"Types: games · object · guided · physical (rough-and-tumble) · pretend · risky · outdoor/nature · and more. Each thought to carry its own benefits.","v":"Check all that apply","a":[["[[Games]]","Belongs.",1],["[[Object]] play","Belongs.",1],["[[Guided]] play","Belongs.",1],["[[Physical]] (rough-and-tumble) play","Belongs.",1],["[[Cooperative]] play","Impostor. That’s a stage on the development table, not a type.",0],["[[Onlooker]] play","Impostor. That’s a non-social stage.",0],["[[Digital]] play","Impostor. Not on lecture’s list.",0]],"m":1,"h":"Stages = HOW social. Types = WHAT kind."},{"id":"a1q010","s":1,"o":2,"t":"L","sc":"rulec","q":"A coach wants kids to ==choose harder drills on their own==. Based on ==Rule et al. (2024)==, which framing should she use?","k":"Rule et al. (2024): play to have fun → choose harder variations (penalty, blocks, resolution). Play may push us toward harder things.","v":"Apply a study","a":[["‘This drill is [[just for fun]].’","Right. In Rule et al., kids playing [[to have fun]] picked [[harder]] versions of the game than kids playing to win stickers."],["‘Whoever scores most [[wins a sticker]].’","Wrong. That’s the [[win stickers]] condition, which picked easier versions."],["‘Let’s see who’s [[best]] on the team.’","Wrong. A competitive, comparison framing is closer to playing to win."],["‘You [[must]] try the hard version today.’","Wrong. That removes the choice, and choice was what the study measured."],["‘You’ll get [[extra recess]] if you finish.’","Wrong. That’s another outside reward, like the stickers."]]},{"id":"a1q011","s":1,"o":2,"t":"L","sc":"benefits","q":"A school board member says: ==‘Play causes better mental health, so recess cuts will cause depression.’== What’s the ==best critique== using lecture?","k":"Benefits of play: linked with brain development · reduced stress · correlated with cognitive, social, mental health · beneficial for learning · may push us to try harder things.","v":"Critique","a":[["Play is [[correlated]] with mental health; that doesn’t show [[cause]]","Right. Lecture’s wording: play is [[correlated with]] improved cognitive skills, social skills, mental health. Correlation can’t show recess cuts cause depression."],["Play has [[no link]] at all with mental health, according to research","Wrong. Lecture did list mental health as linked with play."],["Play only affects [[physical]] health, not mental health","Wrong. Mental health was on the list."],["The link only holds for [[pretend play]], not for recess or free play","Wrong. Lecture listed these benefits for play generally."],["Play [[reduces]] stress, so it can’t affect mood","Wrong. Reduced stress is another benefit. It doesn’t rule out mental health."]],"h":"Watch the verbs: linked, correlated, may."},{"id":"a1q012","s":1,"o":2,"t":"L","sc":"benefits","q":"Which of these did lecture list as ==benefits linked with play== in general? ==Check all== that apply.","k":"Play overall: brain development · less stress · cognitive/social/mental health (correlated) · learning · may push toward harder things.","v":"Check all that apply","a":[["More advanced [[brain development]]","Belongs.",1],["Reduction in [[stress]]","Belongs.",1],["Beneficial for [[learning]]","Belongs.",1],["May push us toward trying [[harder things]]","Belongs (Rule et al., 2024).",1],["Higher [[IQ]] scores, proven causally","Impostor. Lecture never claimed a causal IQ effect.",0],["Fewer [[injuries]] over time","Impostor here. That was listed for RISKY play specifically (better risk assessment).",0]],"m":1},{"id":"a1q013","s":1,"o":2,"t":"L","sc":"declinec","q":"A parent says, ==‘Kids today play just as much as we did.’== Which lecture data ==most directly contradict== this?","k":"Decline of play: weekly play hours dropped 1981 → 1997 (biggest for ages 3–5); 1975 → 2015 outdoor play −29%, socializing out of home −14%.","v":"Use the data","a":[["Weekly play time [[fell]], and [[outdoor play]] dropped ~29% by 2015","Right. Hofferth & Sandberg (2001) and Mullan (2019) showed a [[decline]] in children’s play."],["Children in Ramsden et al. had [[high]] screen time before kindergarten","Wrong. That’s about screen time in one sample, not a change over decades."],["Play is [[correlated]] with cognitive skills and mental health","Wrong. That’s a benefit, not a trend over time."],["Pretend play is [[universal]] across cultures","Wrong. That’s about pretend play, not change over time."],["Older kids played [[less]] than younger kids did back in 1981","Wrong. An age difference in one year isn’t a change across generations."]]},{"id":"a1q014","s":1,"o":3,"t":"L","sc":"playpair","q":"==Stassie== (4) loves ==pretending to be a superhero in a cape==. ==Nate== (4) mostly ==wrestles and rolls in the dirt==. Research would ==most likely== predict that, compared to Nate, Stassie will…","k":"Pretend → self-control, emotion regulation, perseverance, perspective taking, language, cognition, social competence. Risky/outdoor → self-esteem, less anxiety, physical activity, motor skills.","v":"Predict","a":[["[[persevere]] longer on hard tasks","Right. Pretend play is associated with better [[self-control, emotion regulation and perseverance]] (think of the Batman effect)."],["have higher [[self-esteem]]","Wrong. Self-esteem was linked with [[risky]] play (Lavrysen et al.), which fits Nate’s play better."],["feel less [[anxiety]] around new risks","Wrong. Reducing fear and anxiety was a possible reason for [[risky]] play’s benefits."],["show better [[gross motor]] skills","Wrong. Gross motor skills were linked with [[outdoor]] and physical play, Nate’s style."],["earn higher [[grades]] in Grade 1","Wrong. Lecture didn’t link either style of play with better grades."]],"h":"Cape → patience. Dirt → daring."},{"id":"a1q015","s":1,"o":3,"t":"L","sc":"pretend","q":"A ==20-month-old== ==puts a shoe to her ear== and says ==‘Hi Nana!’==. Which ==two lecture ideas== does this show best?","k":"Pretend play: acting ‘as-if’; begins ~18–25 months; linked to symbolic thought (a symbol represents something other than itself); simple pretend → sociodramatic.","v":"Two-part","a":[["Pretend play has begun on time, and shows [[symbolic thought]]","Right. Pretend play begins around [[18–25 months]], and letting a shoe [[stand for]] a phone is symbolic thought."],["Pretend play has begun [[early]], and shows [[sociodramatic]] play","Wrong twice. 20 months is right on time, and one child alone isn’t sociodramatic."],["Pretend play has begun on time, and shows [[self-distancing]]","Wrong. Self-distancing is stepping back from your own view (Batman effect), not object substitution."],["[[Object]] play has begun, and shows [[perspective taking]]","Wrong. Using the shoe AS a phone is pretend, not just exploring the object."],["Pretend play has begun [[late]], and shows [[symbolic thought]]","Wrong. 20 months falls inside the 18–25 month window."]]},{"id":"a1q016","s":1,"o":3,"t":"L","sc":"witch","q":"Researchers tell kids the ==Candy Witch== swaps Halloween candy for a toy. Some kids get a ==‘visit’== (candy gone, toy left). Based on Woolley et al. and Boerger et al., which child is ==MOST likely to believe== she’s real?","k":"Candy Witch: 66% believed; most likely to believe = older children who were visited. Kids distinguish real vs. pretend, yet often believe in fantasy entities.","v":"Predict","a":[["An [[older]] child who [[was visited]]","Right. 66% believed overall, and belief was strongest among [[older]] children who were [[visited]]."],["A [[younger]] child who [[was visited]]","Wrong. The surprise was that [[older]] children believed most."],["A [[younger]] child who [[wasn’t visited]]","Wrong. Being visited was the strongest push to believe."],["An [[older]] child who [[wasn’t visited]]","Wrong. Age alone wasn’t enough. The visit mattered."],["[[No]] child: they can tell real from pretend","Wrong. Kids DO tell real from pretend, but still believed: 66% did."]],"h":"Evidence + a mind ready to reason about it = belief."},{"id":"a1q017","s":1,"o":3,"t":"L","sc":"batman","q":"Before a boring puzzle, ==Kai puts on a firefighter hat== and his teacher asks, ==‘Is the firefighter working hard?’== instead of ‘Are you working hard?’ What ==mechanism== did lecture suggest, and what ==outcome== is expected?","k":"Batman effect (White et al., 2017; Grenell et al., 2019): dress up as a character and reflect on a hard task as that character → spent more time, better emotion regulation. Possible route: self-distancing.","v":"Mechanism + outcome","a":[["[[Self-distancing]] → works [[longer]], regulates emotion better","Right. The Batman effect: thinking about the task [[as the character]] creates distance, and kids [[persevered longer]] and [[regulated their emotions]] better."],["[[Symbolic thought]] → works longer, regulates emotion better","Wrong mechanism. Symbolic thought is the basis of pretending, but the Batman effect was explained by [[self-distancing]]."],["[[Self-distancing]] → finishes [[faster]] with more errors","Wrong outcome. Kids spent [[more]] time, not less."],["[[Extrinsic reward]] → works longer to earn the firefighter hat","Wrong. The hat is a prop, not a reward for finishing."],["[[Peer influence]] → works harder to impress his classmates","Wrong. There’s no audience of peers here."]]},{"id":"a1q018","s":1,"o":3,"t":"L","sc":"culture","q":"In ==Village A==, children’s pretend play is full of ==farming and market scenes==; parents ==rarely join in==. In ==City B==, parents ==often start pretend games== and kids pretend ==much more often==. Which lecture points do these differences show?","k":"Pretend play: universal, BUT content reflects community values and traditions, amounts vary, and it’s shaped by parent attitudes and eliciting.","v":"Explain the difference","a":[["Content reflects [[community values]]; amounts track [[parent eliciting]]","Right. Content reflects the community’s values and traditions; amounts vary and are often shaped by parent attitudes and eliciting."],["Pretend play is [[not universal]]; only some cultures pretend","Wrong. Lecture said it’s seen across cultures and families and is thought to be universal."],["Village A’s children lack [[symbolic thought]], so they can’t pretend","Wrong. Farming scenes ARE pretend, so symbolic thought is clearly there."],["City B’s kids will reach [[sociodramatic]] play at a much earlier age","Not a lecture claim. Lecture didn’t link parent involvement to timing."],["Amounts of pretend are [[identical]]; only content differs","Wrong. Lecture said amounts of pretend play vary."]]},{"id":"a1q019","s":1,"o":3,"t":"L","sc":"corr","q":"A study finds that ==kids who pretend more have better perspective taking==. A blogger writes, ==‘Pretend play builds empathy.’== Which question from lecture ==best challenges== this?","k":"Lecture’s open question: is pretend play necessary to develop these skills? does it cause them? or is it just correlated?","v":"Critique","a":[["Is pretend [[necessary]], or [[causal]], or just [[correlated]]?","Right. Lecture asked exactly this. A correlation could mean a third factor (like parents who talk about feelings) drives both."],["Do children truly understand [[real vs. pretend]] at this age?","Wrong. That’s a separate question about fantasy beliefs."],["Does pretend play usually begin [[before 18 months]] of age?","Wrong. Timing isn’t the issue here."],["Is pretend play seen [[across cultures]]?","Wrong. Universality doesn’t speak to cause."],["Does pretend play become [[sociodramatic]]?","Wrong. That’s about development, not cause."]]},{"id":"a1q020","s":1,"o":3,"t":"L","sc":"pretend","q":"Which outcomes did lecture list as ==associated with pretend play==? ==Check all== that apply.","k":"Pretend play: self-control, emotion regulation, perseverance · perspective taking · language · cognitive capabilities · social competence.","v":"Check all that apply","a":[["Better [[self-control]] and emotion regulation","Belongs.",1],["Improved [[perspective taking]]","Belongs.",1],["Greater [[language]] skills","Belongs.",1],["Greater [[social competence]]","Belongs.",1],["Better [[risk assessment]]","Impostor. That was linked with RISKY play.",0],["Better [[gross motor]] skills","Impostor. That was linked with OUTDOOR play.",0],["Higher [[self-esteem]]","Impostor. That was linked with RISKY play (Lavrysen).",0]],"m":1,"h":"Pretend = the mind and the people skills. Risky/outdoor = the body and the bravery."},{"id":"a1q021","s":1,"o":3,"t":"L","sc":"sociodrama","q":"Which scene shows the ==most developed== form of pretend play described in lecture?","k":"Pretend play begins with simple pretend and develops to sociodramatic play (shared roles, shared story).","v":"Compare","a":[["Four kids run a [[pretend restaurant]]: chef, waiter, two customers","Right. Shared roles and a storyline = [[sociodramatic]] play, the endpoint of pretend development."],["A toddler [[feeds a doll]] with an empty spoon and says ‘yum’","Wrong. That’s [[simple]] pretend, where it starts."],["A child [[sorts toy food]] by colour","Wrong. Sorting is object play, not pretend."],["Two kids each [[cook alone]] at toy stoves, side by side, no shared story","Wrong. Pretending in parallel without shared roles isn’t sociodramatic yet."],["A child [[watches]] her older siblings play house from the doorway, quietly","Wrong. Watching is onlooker play, not pretending."]]},{"id":"a1q022","s":1,"o":4,"t":"LR","sc":"risk6","q":"Which activity fits ==Ramsden et al.’s definition== of risky play ==LEAST== well?","k":"Risky play: ‘thrilling and exciting forms of physical play that involve uncertainty and a risk of physical injury.’","v":"Odd one out","a":[["A [[timed spelling bee]] with high stakes","Right. It’s stressful, but risky play means [[thrilling physical play]] with [[uncertainty and a risk of physical injury]]. No physical risk here."],["Racing down a steep hill on a [[scooter]]","Fits: thrill, speed, possible injury."],["[[Whittling]] a stick with a pocketknife","Fits: play with tools."],["Balancing along a [[high wall]]","Fits: play with heights."],["[[Play-wrestling]] with a cousin","Fits: rough and tumble."]]},{"id":"a1q023","s":1,"o":4,"t":"L","sc":"risk6","q":"A daycare wants to offer ==every kind of risky play== from lecture. Which activities each match ==one of the six kinds==? ==Check all== that apply.","k":"Six kinds: heights · high speeds · tools · near elements · chance of getting lost · rough and tumble.","v":"Check all that apply","a":[["Climbing a [[tall tree]]","Belongs: play with heights.",1],["Exploring the woods [[out of sight]] of adults","Belongs: play with a chance of getting lost.",1],["Roasting marshmallows at a [[campfire]]","Belongs: play near elements (fire).",1],["Sawing wood with a real [[saw]]","Belongs: play with tools.",1],["Playing a [[scary video game]]","Impostor. It may be thrilling, but there’s no physical risk.",0],["Telling [[ghost stories]] in the dark","Impostor. Scary, but not physical risk.",0],["Eating very [[spicy food]]","Impostor. Not one of the six kinds.",0]],"m":1},{"id":"a1q024","s":1,"o":4,"t":"L","sc":"riskwhy","q":"==Omar== used to ==freeze at the top of the slide==. After weeks of ==trying a little higher each time==, he ==climbs calmly==. ==Lia’s== parents ==let her decide== how far to bike alone, and she ==loves choosing==. Which explanations fit Omar and Lia?","k":"Why risky play may help: helps reduce fear/anxiety? · satisfies need for autonomy? · positive emotions from mastery?","v":"Two-part","a":[["Omar: reduces [[fear/anxiety]] · Lia: [[autonomy]]","Right. Gradual exposure shrinking fear = reducing anxiety. Making her own choice = satisfying the need for autonomy."],["Omar: [[mastery]] · Lia: [[autonomy]]","Close. Mastery is the joy of finally succeeding. Omar’s story is about [[fear fading]]."],["Omar: reduces [[fear/anxiety]] · Lia: [[mastery]]","Wrong for Lia. Her story is about [[choosing]], not succeeding."],["Omar: [[autonomy]] · Lia: reduces [[fear/anxiety]]","Swapped."],["Omar: [[risk assessment]] · Lia: [[social competence]]","Wrong. Those are outcomes linked with risky play, not the three explanations."]],"h":"Fear shrinks, choice grows, pride shows."},{"id":"a1q025","s":1,"o":4,"t":"L","sc":"lavc","q":"In ==Lavrysen et al. (2017)==, 4–6-year-old ==classes== got a ==3-month risky play intervention== or ==class as usual==. Which result did lecture’s chart show, and what design feature ==helps support a causal claim==?","k":"Lavrysen et al. (2017): 3-month risky play intervention in 4–6-year-old classes vs. class as usual → higher self-esteem in the intervention group.","v":"Study design","a":[["[[Self-esteem]] rose; an [[intervention vs. control]] design","Right. The intervention classes gained in [[self-esteem]], and comparing them with class-as-usual controls is stronger than a correlation."],["[[Risk assessment]] rose; a [[correlational]] design with no control","Wrong twice. The chart showed self-esteem, and the design had an intervention and a comparison group."],["[[Self-esteem]] rose; a [[cross-sectional]] survey","Wrong design. It tested classes before and after an intervention."],["[[Injuries]] dropped; an [[intervention vs. control]] design","Wrong outcome. The chart was about self-esteem, not injuries."],["[[Social competence]] rose; a [[longitudinal]] survey","Wrong. The outcome was self-esteem, and it was an intervention study."]]},{"id":"a1q026","s":1,"o":4,"t":"L","sc":"risky","q":"A principal bans ==climbing trees== because ==‘it causes injuries.’== Which lecture point ==most directly challenges== her reasoning?","k":"Risky play outcomes: physical activity/abilities · social competence · better risk assessment (may reduce injuries long-term) · self-esteem, mental health.","v":"Counter-argument","a":[["Better [[risk assessment]] may [[reduce injuries]] long-term","Right. Lecture: linked to better ability to assess risk, and [[may reduce injuries long-term]]."],["Risky play is linked to more [[physical activity]] and abilities","True, but it doesn’t speak to her injury worry."],["Risky play is linked to better [[self-esteem]]","True, but it doesn’t address injuries."],["Risky play is [[correlated]] with better social competence at school","True, but beside the point here."],["Risky play reduces [[screen time]] at home","Not a lecture claim."]]},{"id":"a1q027","s":1,"o":4,"t":"R","sc":"three","q":"In ==Ramsden et al. (2026)==, ==risky play== was linked with ==lower vulnerability in four EDI domains==. Which domain was ==NOT== one of them?","k":"Risky play (aOR 0.92 overall): reduced vulnerability in physical, social, language/cognitive, and communication domains. Not emotional maturity.","v":"Odd one out","a":[["[[Emotional maturity]]","Right. Risky play reduced vulnerability in physical, social, language/cognitive and communication domains, but [[not emotional maturity]]."],["[[Physical health]] and well-being","Wrong. Risky play did reduce vulnerability here."],["[[Social competence]]","Wrong. Risky play did reduce vulnerability here."],["[[Language]] and cognitive development","Wrong. Risky play did reduce vulnerability here."],["[[Communication]] and general knowledge","Wrong. Risky play did reduce vulnerability here (the strongest, aOR 0.81)."]]},{"id":"a1q028","s":1,"o":5,"t":"L","sc":"outdoor","q":"Which situation fits ==outdoor play== but ==NOT nature play==?","k":"Outdoor play = unstructured play outside. Nature play = in a natural environment AND/OR with natural materials (water, mud, sticks, leaves, rocks).","v":"Classify","a":[["Kids invent a [[chalk game]] on a paved playground","Right. Unstructured and outside = [[outdoor]] play. But it’s not in a natural setting and uses no natural materials, so it’s [[not nature]] play."],["Kids build a dam with [[mud and sticks]] in a creek","Wrong. Natural setting and materials: that’s nature play too."],["A coach runs [[soccer drills]] on a grass field","Wrong. A coach structures it, so it isn’t unstructured outdoor play."],["Kids make leaf [[soup]] on a paved patio","Wrong. Natural materials (leaves) make it nature play."],["Kids play [[tag in a forest]] clearing","Wrong. A natural environment makes it nature play."]]},{"id":"a1q029","s":1,"o":5,"t":"L","sc":"wellsc","q":"Two children go through ==many stressful life events== this year. ==Rae’s home== is surrounded by ==green space==; ==Tom’s== has ==none nearby==. A third child, ==Ivy==, has ==few stressful events== and ==no green space==. Based on Wells & Evans (2003), who likely shows the ==least== psychological distress, and where is the green-space advantage ==biggest==?","k":"Wells & Evans (2003): distress rose with stressful life events, but less so with high nearby nature. Nature as a buffer to stress.","v":"Chart reasoning","a":[["[[Ivy]]; the advantage is biggest under [[high stress]]","Right. Low stress meant low distress for everyone. Nearby nature mattered most when stress was high (the gap widened as stress rose)."],["[[Rae]]; the advantage is biggest under [[low stress]]","Wrong. Under high stress Rae was better off than Tom, but still above Ivy; and the gap was smallest at low stress."],["[[Rae]]; the advantage is the [[same]] at every stress level","Wrong. The gap grew as stress rose."],["[[Tom]]; nature had [[no effect]] on distress","Wrong. Nearby nature buffered distress."],["[[Ivy]]; the advantage is biggest under [[low stress]]","Half right. Ivy is least distressed, but the buffer mattered MOST under high stress."]]},{"id":"a1q030","s":1,"o":5,"t":"R","sc":"three","q":"A parent reads ==Ramsden et al.== and says, ==‘So more outdoor time protects kids from vulnerability overall.’== What’s the ==accurate correction==?","k":"Ramsden: outdoor play frequency → not linked overall; reduced vulnerability in physical health & well-being and communication skills & general knowledge.","v":"Correct the claim","a":[["Outdoor play wasn’t linked [[overall]], only in [[two domains]]","Right. Not linked with overall vulnerability, but linked with lower vulnerability in [[physical health/well-being]] and [[communication/general knowledge]]."],["Outdoor play [[increased]] overall vulnerability","Wrong. It wasn’t linked overall in either direction."],["Outdoor play helped [[every]] domain except emotional maturity","Wrong. That pattern (four domains) belongs to RISKY play."],["Outdoor play helped only [[language]] and [[social]] domains","Wrong domains. It was physical health and communication/general knowledge."],["Outdoor play had [[no]] links at any level","Wrong. Two domains showed reduced vulnerability."]]},{"id":"a1q031","s":1,"o":5,"t":"R","sc":"decline","q":"According to ==Ramsden et al. (2026)==, which forces are driving childhood’s ==‘shift indoors’==? ==Check all== that apply.","k":"Ramsden intro: childhood is shifting indoors, ‘driven by rapid urbanization, heightened safety concerns, and the pervasive draw of digital screens.’ Separately, risk-averse supervision and institutional hyper-surveillance have shrunk risky play.","v":"Check all that apply","a":[["Rapid [[urbanization]]","Belongs.",1],["Heightened [[safety concerns]]","Belongs.",1],["The pervasive draw of [[digital screens]]","Belongs.",1],["[[Colder]] climate in recent decades","Impostor. Weather wasn’t named.",0],["Longer [[school days]]","Impostor. Not named as a driver.",0],["Children [[preferring]] indoor toys","Impostor. Not named.",0]],"m":1},{"id":"a1q032","s":1,"o":5,"t":"L","sc":"outdoor","q":"Which benefits did lecture link with ==outdoor/nature play==? ==Check all== that apply.","k":"Outdoor/nature: physical activity, gross motor skills · linked with pretend & dramatic play and risky play · physical health, mental health, buffer to stress.","v":"Check all that apply","a":[["[[Gross motor]] skills","Belongs.",1],["Physical [[activity]]","Belongs.",1],["Links with [[pretend & dramatic]] and [[risky]] play","Belongs.",1],["A possible [[buffer to stress]]","Belongs (Wells & Evans, 2003).",1],["Better [[perspective taking]]","Impostor. That was linked with PRETEND play.",0],["Higher [[self-esteem]] (Lavrysen)","Impostor. That was the RISKY play study.",0]],"m":1},{"id":"a1q033","s":1,"o":6,"t":"R","sc":"ramsden","q":"Which description of ==Ramsden et al.’s design== is fully accurate?","k":"Ramsden: 4,968 BC kindergarteners; CHEQ (caregiver-reported play/screens in the 6 months before K) linked to EDI (teacher-rated, kindergarten). Logistic regression with covariates.","v":"Study design","a":[["[[Longitudinal]]: [[caregivers]] reported early play; [[teachers]] later rated development","Right. CHEQ (caregiver) was linked to the later EDI (teacher). Two informants, two time points."],["[[Experimental]]: children were randomly assigned to more or less screen time","Wrong. Nobody was assigned. It’s observational."],["[[Longitudinal]]: [[teachers]] reported early play; [[parents]] later rated development","Reversed informants."],["[[Cross-sectional]]: parents reported everything at one time","Wrong. Two questionnaires at two time points, two different reporters."],["[[Longitudinal]]: [[children]] reported their own play; teachers later rated development","Wrong. Five-year-olds didn’t self-report; caregivers did."]]},{"id":"a1q034","s":1,"o":6,"t":"R","sc":"oddsdial","q":"Ramsden et al. report ==aOR = 0.92== for ==risky play== and ==aOR = 1.38== for ==screen time==. Which reading is correct?","k":"Odds ratio: 1 = no difference; below 1 = lower odds; above 1 = higher odds. Ramsden is correlational.","v":"Interpret","a":[["More risky play → [[lower]] odds of vulnerability; more screens → [[higher]] odds","Right. Below 1 = lower odds, above 1 = higher odds, after adjusting for covariates."],["More risky play → [[higher]] odds; more screens → [[lower]] odds of vulnerability","Reversed."],["Both are [[protective]], because both odds ratios are fairly close to 1","Wrong. 1.38 is above 1, which means higher odds."],["Screen time [[causes]] 38% more vulnerability in kindergarten","Wrong. Observational data show association, not cause."],["Risky play [[causes]] an 8% drop in vulnerability for every single child","Wrong. Association, not cause."]]},{"id":"a1q035","s":1,"o":6,"t":"R","sc":"displace","q":"Ramsden et al. argue the ==main harm of screen time== may be ==displacement==. Which example ==best fits== that idea?","k":"Displacement: screens replace caregiver–child and peer connection, active play, and sleep. ‘Passive digital consumption replaces active, nature-based experiences.’","v":"Apply a mechanism","a":[["Tablet time [[replaces]] park time, bedtime stories and sleep","Right. Displacement = screens [[crowd out]] active play, caregiver and peer connection, and sleep."],["A [[violent]] cartoon teaches children aggressive behaviour","Wrong. That’s about content, not displacement."],["Blue [[light]] damages the eyes","Wrong. Not the mechanism the authors discussed."],["Educational apps [[boost]] vocabulary more than picture books do","Wrong. That’s a content benefit, not displacement."],["Parents use screens to [[reward]] good behaviour at dinner time","Wrong. That’s a parenting practice, not displacement."]]},{"id":"a1q036","s":1,"o":6,"t":"R","sc":"ramsden","q":"A critic says: ==‘Kids with more screen time might already have had developmental difficulties, so parents used screens to cope.’== Which limitation does this point to?","k":"Limitations: observational (not causal) · residual confounding · caregiver report (recall, social desirability) · self-selection limits generalizability · no screen content/context or outdoor-play quality.","v":"Critique","a":[["It’s [[observational]], so [[direction]] and confounding remain open","Right. Linked data over time still aren’t an experiment. Reverse direction and residual confounding remain possible."],["The EDI outcome was [[teacher]]-rated, not parent-rated","True, but that’s about who rated the outcome, not about direction."],["The sample was [[too small]]","Wrong. Nearly 5,000 children is large."],["Screen time was only measured in [[minutes]] per day, not hours","Not the issue raised here."],["Outdoor play wasn’t linked with vulnerability [[overall]], only in two domains","That’s a result, not a limitation."]]},{"id":"a1q037","s":1,"o":6,"t":"R","sc":"ramsdag","q":"In the confounder diagram lecture showed for Ramsden et al., which factors were ==NOT measured== (unobserved confounders)? ==Check all== that apply.","k":"Adjusted covariates: sex, household income, urban/rural, marital status, siblings, place of birth. Unobserved: parental health status, access to green space.","v":"Check all that apply","a":[["[[Parental health]] status","Belongs. Listed as unobserved.",1],["Access to [[green space]]","Belongs. Listed as unobserved.",1],["[[Household income]]","Impostor. Measured and adjusted for.",0],["[[Number of siblings]]","Impostor. Measured and adjusted for.",0],["[[Urban/rural]] location","Impostor. Measured and adjusted for.",0],["Child’s [[sex]]","Impostor. Measured and adjusted for.",0]],"m":1},{"id":"a1q038","s":1,"o":6,"t":"R","sc":"ramsden","q":"Which are ==limitations== the authors acknowledged? ==Check all== that apply.","k":"Limitations: self-selection · caregiver-report bias · no screen content/context · no outdoor-play quality · residual confounding · observational.","v":"Check all that apply","a":[["Caregiver reports may carry [[recall]] or [[social desirability]] bias","Belongs.",1],["No data on screen [[content]] or context","Belongs.",1],["No data on the [[quality]] of outdoor play","Belongs.",1],["[[Self-selection]] into the CHEQ limits generalizability","Belongs.",1],["Only [[one informant]] reported everything","Impostor. Two informants: caregivers AND teachers. That’s a strength.",0],["The sample was [[too small]] to detect effects","Impostor. Nearly 5,000 children.",0]],"m":1},{"id":"a1q039","s":1,"o":6,"t":"R","sc":"three","q":"A child-care centre reads Ramsden et al. and wants to ==reduce kindergarten vulnerability==. Which plan ==best matches the authors’ implications==?","k":"Implications: limit early screen time (under 1 h/day for under-fives; 75%+ exceed it) · provide thrilling outdoor risky play · treat risk and challenge as metrics, not just minutes.","v":"Apply to policy","a":[["Limit [[screens]] and add [[thrilling]], challenging outdoor play","Right. Conclusion: limit screen time and provide thrilling outdoor [[risky]] play opportunities in the early years."],["Add more [[indoor]] structured learning time before kindergarten","Wrong. Not what the study supports."],["Add outdoor [[minutes]], but keep all play safe and [[low-risk]]","Half right. Minutes alone didn’t reduce overall vulnerability. The authors stressed [[challenge and risk]], not just time."],["Use [[educational apps]] instead of TV in the afternoons","Wrong. Screen content wasn’t measured, and screen time overall raised odds."],["Wait until [[kindergarten]] starts to change daily routines","Wrong. The point is the early years, before school entry."]]},{"id":"a1q040","s":1,"o":6,"t":"R","sc":"edi5","q":"A kindergarten child in Ramsden et al.’s study is ==vulnerable only in the emotional maturity domain==. Which early experience was linked with ==higher== odds of vulnerability ==in that domain==?","k":"Screen time: higher odds overall (aOR 1.38) and in every one of the 5 EDI domains (physical highest, 1.53).","v":"Apply the results","a":[["More [[screen time]]","Right. Screen time was linked with higher vulnerability in [[all five]] domains, including emotional maturity."],["Less [[risky play]]","Wrong. Risky play’s links covered four domains, but not emotional maturity."],["Less [[outdoor play]]","Wrong. Outdoor play only showed links in physical and communication domains."],["Living in a [[rural]] area","Wrong. Urban vs. rural made no difference."],["Being born [[outside Canada]]","Wrong. Place of birth made no difference."]]},{"id":"a1q041","s":1,"o":6,"t":"R","sc":"ramsden","q":"What ==gap== in prior research did Ramsden et al. aim to fill?","k":"Aim: examine the association of early screen time, outdoor play, and risky play with vulnerability at kindergarten entry, together, using a longitudinal design.","v":"Research question","a":[["Few had compared [[screens]], [[outdoor]] and [[risky]] play together over time","Right. Few had compared their independent contributions to vulnerability at school entry with a longitudinal design."],["No study had ever measured [[screen time]] in children before school entry","Wrong. Lots had; they cite a ‘substantial body of evidence’."],["No study had linked early play to [[adolescent]] mental health","Wrong. The study is about kindergarten."],["Prior studies had used only lab [[experiments]], never real families","Wrong. The issue was the lack of comparison across all three exposures over time."],["No one had defined [[risky play]] before","Wrong. They used an existing definition."]]},{"id":"a1q042","s":1,"o":7,"t":"L","sc":"apply","q":"A city council ==votes to reverse its ban on sledding at 45 hills==. A non-profit ==builds a nature playground==. Which ==routes to application== are these?","k":"Four routes: parent education/training · school/daycare programs/training · community initiatives (playgrounds, outdoor spaces) · laws/policy.","v":"Two-part","a":[["[[Laws/policy]] · [[community initiatives]]","Right. Reversing a ban is [[law/policy]]; a new playground is a [[community initiative]]."],["[[Community initiatives]] · [[laws/policy]]","Swapped. Reversing a ban is policy; building a playground is community."],["[[Laws/policy]] · [[school/daycare]] programs","Wrong second. A public playground isn’t a school or daycare program."],["[[Parent]] education · [[community initiatives]]","Wrong first. The council changed a rule; nobody was trained."],["[[Laws/policy]] · [[parent]] education","Wrong second. Building a playground doesn’t teach parents."]]},{"id":"a1q043","s":1,"o":7,"t":"L","sc":"barriers","q":"A researcher shows a risky play program works in ==one wealthy Vancouver neighbourhood==, and wants to ==roll it out for every child in Canada==, including ==children with autism==. Which ==challenge== is she most clearly facing?","k":"Challenges: correlational research (ethics of responsibility) · barriers in funding, access, broader systems · generalizability across populations · concerns about real-world risks.","v":"Diagnose the problem","a":[["[[Generalizability]] across populations","Right. Results from one group may not hold for others; lecture used Corbett et al. (2010) on children with autism as the example."],["Research is mostly [[correlational]]","Not the main issue here. The story is about who the results apply to."],["Barriers in [[funding]] and access","Possible later, but the story is about whether the findings carry over."],["Concerns about [[real-world risks]]","Not mentioned in the story."],["The program lacks [[community]] support","Not mentioned in the story."]]},{"id":"a1q044","s":1,"o":7,"t":"L","sc":"corbettc","q":"Lecture paired the ==generalizability== challenge with ==Corbett et al. (2010)==, which measured ==cortisol== (a stress hormone) across a play session. Why does that example fit?","k":"Corbett et al. (2010): stress responses differed by group (older children with autism highest). A reminder that findings may not generalize across populations.","v":"Why this example","a":[["Some children ([[older kids with autism]]) had the [[highest]] stress","Right. If the same play setting is stressful for some children, benefits found in one group may not [[generalize]] to everyone."],["Every group’s cortisol [[dropped]] to the same low level by the end","Wrong. Cortisol didn’t vanish, and groups differed."],["All children reacted [[identically]] to the same play session","Wrong. That would support generalizing, not question it."],["Cortisol showed that play [[causes]] better grades in every group","Wrong. Cortisol is a stress measure, and grades weren’t involved."],["Only typical children were [[studied]]","Wrong. The chart included children with autism."]]},{"id":"a1q045","s":1,"o":7,"t":"L","sc":"barriers","q":"A city wants to apply play research. Which were on lecture’s list of ==limitations and challenges== in application? ==Check all== that apply.","k":"Correlational → ethics of responsibility · funding/access/systems · generalizability · real-world risks.","v":"Check all that apply","a":[["Most research is [[correlational]] (ethics of responsibility)","Belongs.",1],["Barriers in [[funding]], access and broader systems","Belongs.",1],["[[Generalizability]] across populations","Belongs.",1],["Concerns about [[real-world risks]]","Belongs.",1],["Children [[dislike]] outdoor play","Impostor.",0],["Play [[can’t be measured]]","Impostor.",0],["Teachers [[refuse]] all training","Impostor.",0]],"m":1},{"id":"a1q046","s":1,"o":7,"t":"L","sc":"apply","q":"A province ==requires every licensed daycare== to offer daily challenging outdoor play, and funds ==training for daycare staff== to run it. Which ==TWO routes== are combined here?","k":"Brussoni et al. made tools for BOTH parents and educators. Policy (licensing) can mandate what programs do.","v":"Combination","a":[["[[Laws/policy]] and [[school/daycare]] training","Right. A licensing requirement is policy; training staff is the school/daycare route."],["[[Parent]] education and [[community]] initiatives","Wrong. No parents trained, no public spaces built."],["[[Community]] initiatives and laws/policy","Wrong. Daycare staff training isn’t a community playground."],["[[Parent]] education and laws/policy","Wrong. The training is for staff, not parents."],["[[School/daycare]] training and [[community]] initiatives","Wrong. The requirement is a policy."]]},{"id":"a2q001","s":2,"o":8,"t":"L","sc":"whyschool","q":"Lecture listed ==historical forces== behind schooling for all children. Which were on that list? ==Check all== that apply.","k":"Why school? Industrialization · national identity, assimilation · religious education · colonization. Formal schooling for all is a relatively new institution.","v":"Check all that apply","a":[["[[Industrialization]]","Belongs.",1],["[[National identity]], assimilation","Belongs.",1],["[[Religious]] education","Belongs.",1],["[[Colonization]]","Belongs.",1],["[[Agricultural]] heritage","Impostor. That explains the SUMMER BREAK, not why school exists.",0],["[[Scientific]] discovery","Impostor.",0],["Rising [[IQ]] scores","Impostor.",0]],"m":1},{"id":"a2q002","s":2,"o":8,"t":"L","sc":"whyschool","q":"A newly united country makes school ==compulsory== so that children from many regions all ==speak one language== and ==learn one shared history==. A different country builds schools mainly to ==train a reliable factory workforce==. Which reasons are these?","k":"Four forces: industrialization · national identity, assimilation · religious education · colonization.","v":"Two-part","a":[["[[National identity]]/assimilation · [[industrialization]]","Right. One language and shared loyalties = national identity and assimilation. A workforce for factories = industrialization."],["[[Colonization]] · [[industrialization]]","Wrong first. Colonization is an outside power imposing its ways on a territory it took over."],["[[National identity]]/assimilation · [[religious]] education","Wrong second. Factory training isn’t religious."],["[[Religious]] education · [[colonization]]","Wrong both."],["[[Industrialization]] · [[national identity]]/assimilation","Swapped."]]},{"id":"a2q003","s":2,"o":8,"t":"L","sc":"nested","q":"A researcher studies whether ==provincial policy on school calendars== affects learning. Another studies ==how one teacher praises effort==. In lecture’s nested model, which ==levels== are they studying?","k":"Layers (inner → outer): student → classroom → school → school organization → community, country, culture.","v":"Classify","a":[["[[School organization]] · [[classroom]]","Right. A provincial calendar policy sits above individual schools (school organization). A teacher’s praise is a classroom feature."],["[[Community/culture]] · [[student]]","Wrong. A school calendar policy is part of the school system, and teacher praise is classroom-level."],["[[School]] · [[student]]","Wrong. Province-wide policy is above one school; teacher behaviour is classroom-level."],["[[Classroom]] · [[school organization]]","Swapped."],["[[School organization]] · [[school]]","Wrong second. A teacher’s praise happens in the classroom."]]},{"id":"a2q004","s":2,"o":9,"t":"L","sc":"teacher","q":"==Mr. Jones== believes ==boys are better at math==. He ==gives boys more attention and harder questions==. At year’s end, ==boys outscore girls== on a standardized test. What is this an example of?","k":"Pygmalion effect: teachers’ expectations shape students’ actual performance. Lecture flagged the implications for biases about race, gender, SES, language.","v":"Name the concept","a":[["The [[Pygmalion]] effect","Right. A teacher’s [[expectations]] change how he teaches, and students’ performance comes to match those expectations."],["The [[TARGETS]] framework","Wrong. TARGETS is a set of classroom features shaping achievement goals, not an expectation effect."],["[[Person–environment fit]]","Wrong. That’s a rationale for ability tracking."],["[[Mastery]] achievement goals","Wrong. Mastery goals are about learning and improving, not teacher expectations."],["[[Stage–environment fit]]","Wrong. That’s about schools mismatching adolescents’ needs."]]},{"id":"a2q005","s":2,"o":9,"t":"L","sc":"pygmalion","q":"Why could Rosenthal & Jacobson (1968) conclude that ==expectations themselves== caused the gains, rather than the ‘bloomers’ simply being smarter?","k":"Rosenthal & Jacobson (1968): randomly chosen students labelled ‘bloomers’ → greater IQ gains than controls. Random assignment = causal evidence for expectations.","v":"Study design","a":[["The bloomers were chosen [[at random]]","Right. Since the label was assigned [[randomly]], the only systematic difference was what teachers were told."],["The bloomers had the [[highest]] pretest IQs","Wrong. If so, that would be a confound, not evidence."],["Teachers [[knew]] the labels were made up","Wrong. Teachers believed the labels. That’s the whole point."],["The bloomers were [[older]] than controls","Wrong. Age wasn’t how they were chosen."],["Students [[chose]] to be bloomers","Wrong. Self-selection would undermine a causal claim."]]},{"id":"a2q006","s":2,"o":9,"t":"L","sc":"pygc","q":"Lecture’s chart showed the ==% of students gaining 10, 20 and 30+ IQ points==. Which statement about it is ==accurate==?","k":"Rosenthal & Jacobson chart: % gaining ≥10 pts 79 vs 49 · ≥20 pts 47 vs 19 · ≥30 pts 21 vs 5 (bloomers vs controls).","v":"Chart","a":[["At [[every]] level, more bloomers than controls gained","Right. 10 pts: 79% vs 49%; 20 pts: 47% vs 19%; 30 pts: 21% vs 5%."],["Bloomers led only at the [[10-point]] level, not above it","Wrong. They led at 20 and 30 points as well."],["[[Controls]] gained more than bloomers at the 30-point level","Wrong. 5% vs 21% favours the bloomers."],["Most bloomers gained [[30+]] points","Wrong. Only about 21% did."],["[[No]] control students gained any IQ points","Wrong. 49% of controls gained 10+ points."]]},{"id":"a2q007","s":2,"o":9,"t":"L","sc":"teacher","q":"Which ==teacher factors== did lecture name as shaping student outcomes? ==Check all== that apply.","k":"Teachers: qualifications and quality · teacher-student relationships · teachers’ expectations for students (Pygmalion effect).","v":"Check all that apply","a":[["Teacher [[qualifications]] and quality","Belongs.",1],["Teacher-student [[relationships]]","Belongs.",1],["Teachers’ [[expectations]] for students","Belongs (Pygmalion effect).",1],["Teacher [[age]] and gender","Impostor.",0],["Teacher [[salary]]","Impostor.",0],["Teacher [[personality]] type","Impostor.",0]],"m":1},{"id":"a2q008","s":2,"o":9,"t":"L","sc":"teacher","q":"==Ms. Park== has ==top credentials== but ==rarely connects== with students. ==Mr. Ali== is ==new== but ==knows every student well== and they feel supported. Which ==teacher factors== does each mainly show strength in?","k":"Three teacher factors: qualifications/quality · relationships · expectations.","v":"Two-part","a":[["Park: [[qualifications/quality]] · Ali: [[relationships]]","Right. Credentials = qualifications and quality. Knowing and supporting students = teacher-student relationships."],["Park: [[expectations]] · Ali: [[relationships]]","Wrong first. Nothing says what Park expects of students."],["Park: [[relationships]] · Ali: [[qualifications/quality]]","Swapped."],["Park: [[qualifications/quality]] · Ali: [[expectations]]","Wrong second. Ali’s strength is connection, not expectations."],["Park: [[expectations]] · Ali: [[qualifications/quality]]","Wrong both."]]},{"id":"a2q009","s":2,"o":10,"t":"L","sc":"curriculum","q":"A Grade 7 class reads ==only stories about one kind of family==, at a level ==two grades below== where students are. Which ==two== features of good academic work are ==missing==?","k":"Academic work: what’s taught and what students are asked to learn and do. Best when interesting, meaningful, at an appropriate level, considering global-social realities and representing diverse experiences.","v":"Diagnose","a":[["[[Appropriate level]] and [[diverse experiences]]","Right. Too easy misses ‘appropriate level’; one kind of family misses ‘global-social realities, representing diverse experiences’."],["[[Interesting]] content and [[active]] participation","Not clearly. Nothing says the stories are dull or the lessons passive."],["[[Iterative]] and [[joyful]]","Not mentioned in the story."],["[[Meaningful]] and [[SEL]]","Not clearly. SEL is ‘beyond the basics’, a separate idea."],["[[Appropriate level]] and emphasizing [[mastery goals]]","Half. Mastery goals are an achievement-goals idea, not part of academic work."]]},{"id":"a2q010","s":2,"o":10,"t":"L","sc":"curriculum","q":"Two teachers cover the ==same fractions unit==. One ==lectures and assigns worksheets==; the other has students ==measure ingredients to bake bread for a class sale==. Lecture’s point that best explains why the second might work better:","k":"Academic work: not just what is taught, but how. More learning when active, meaningful, interactive, iterative, joyful.","v":"Best explanation","a":[["It’s [[not just what]] is taught, but [[how]]","Right. Same content, different method. Lecture: not just what is being taught, but how (more learning when active, meaningful…)."],["Smaller [[schools]] have better outcomes","Wrong. Same school, same class size."],["[[Teacher expectations]] shape outcomes","Nothing in the story is about expectations."],["Formal schooling is a [[new]] institution","Irrelevant here."],["[[Tracking]] fits students to their level","No tracking is described."]]},{"id":"a2q011","s":2,"o":11,"t":"L","sc":"tootle","q":"A teacher starts a ==note jar== where students write ==‘Thank you for…’== and ==‘I like that you…’== about classmates. Based on ==Collins et al. (2020)==, which set of changes is ==most likely==?","k":"Tootling (positive peer reporting): improved peer interactions, reduced aggression/disruption, more academic engagement (Collins et al., 2020).","v":"Predict","a":[["Better [[peer interactions]], less [[aggression]], more [[engagement]]","Right. Positive peer reporting (tootling) is linked with improved peer interactions, reduced aggression/disruption, and more academic engagement."],["Higher [[IQ]], better [[attendance]], and more [[homework]] completed","Wrong. Not the outcomes linked with tootling."],["More [[tattling]], more [[conflict]], and less [[trust]] among classmates","Wrong. Tootling is the positive opposite of tattling."],["Better [[motor skills]], more [[outdoor]] play","Wrong. Those are outdoor play benefits."],["Higher [[test scores]] only, with no change in how peers get along","Wrong. The social effects are central."]]},{"id":"a2q012","s":2,"o":11,"t":"L","sc":"selwhy","q":"After an SEL program, three students improve in school. ==Ana== now ==stays focused and stops herself from blurting==. ==Ben== now ==likes coming to school and gets along with classmates==. ==Cy== now ==feels he belongs and feels good about himself==. Match each to lecture’s ==three reasons==.","k":"Why SEL may boost academics: useful skills (executive function, attention) · more positive feelings about school and peers · better self-esteem, belonging.","v":"Match three","a":[["Ana: [[EF/attention]] · Ben: [[positive feelings]] · Cy: [[self-esteem/belonging]]","Right. Useful skills (executive function, attention) · more positive feelings about school and peers · better self-esteem, belonging."],["Ana: [[positive feelings]] · Ben: [[EF/attention]] · Cy: [[self-esteem/belonging]]","Wrong. Focus and impulse control are executive function skills."],["Ana: [[EF/attention]] · Ben: [[self-esteem/belonging]] · Cy: [[positive feelings]]","Swapped Ben and Cy. Liking school and peers is ‘positive feelings’; belonging + self-worth is Cy’s."],["Ana: [[self-esteem/belonging]] · Ben: [[positive feelings]] · Cy: [[EF/attention]]","Wrong. Ana’s change is about self-control."],["All three: [[EF/attention]]","Wrong. Only Ana’s change is about executive function."]]},{"id":"a2q013","s":2,"o":11,"t":"L","sc":"sel","q":"SEL programs are ==often associated with== which outcomes? ==Check all== that apply.","k":"SEL: improved prosocial/social skills, student well-being, AND improved academics. Examples: positive peer reporting (tootling), PATHS.","v":"Check all that apply","a":[["Improved [[prosocial/social]] skills","Belongs.",1],["Better student [[well-being]]","Belongs.",1],["Improved [[academics]]","Belongs. The surprise: SEL isn’t academic, but academics improve too.",1],["Better [[gross motor]] skills","Impostor. An outdoor play benefit.",0],["Fewer [[school transitions]]","Impostor. Unrelated.",0],["Earlier [[school start]] times","Impostor. Unrelated.",0]],"m":1},{"id":"a2q014","s":2,"o":11,"t":"L","sc":"schonfeldc","q":"A principal says, ==‘SEL takes time away from reading and math, so scores will drop.’== Which lecture evidence ==most directly answers== her?","k":"Schonfeld et al. (2015): SEL intervention → more students at proficiency (maths higher at Grades 4–6; reading clearly higher in Grade 4).","v":"Use evidence","a":[["[[Schonfeld]] et al. (2015): more SEL students were [[proficient]]","Right. The SEL intervention group had higher proficiency, clearly in maths at every grade."],["[[Rosenthal & Jacobson]] (1968): expectations can raise IQ scores","Wrong.
