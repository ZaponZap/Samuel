That’s about teacher expectations, not SEL."],["[[Collins]] et al. (2020): tootling reduces aggression and disruption","Related to SEL, but it doesn’t speak to test scores."],["[[Rule]] et al.: fun makes kids pick harder tasks","Wrong. That’s about play, not SEL."],["[[Bustamante]] et al. (2022): Fraction Ball boosts fraction conversions","Wrong. That’s playful math learning, not SEL."]]},{"id":"a2q015","s":2,"o":11,"t":"L","sc":"sel","q":"Which program is an ==example of SEL== as lecture used the term?","k":"SEL = going beyond the basics (reading, writing, arithmetic). Examples: positive peer reporting (tootling), PATHS.","v":"Classify","a":[["[[PATHS]], which teaches emotion and social skills","Right. Lecture’s two SEL examples: positive peer reporting and PATHS."],["[[Fraction Ball]], which teaches decimals through basketball","Wrong. That’s active, playful academic learning."],["An [[honour roll]] that celebrates the top students","Wrong. That emphasizes performance goals."],["[[Year-round]] schooling","Wrong. That’s about the school calendar."],["[[Ability tracking]] by test score","Wrong. That’s grouping by ability."]]},{"id":"a2q016","s":2,"o":12,"t":"L","sc":"pillars5","q":"Students ==design a paper bridge==, ==test it==, watch it ==collapse==, ==redesign== and test again, ==working in teams== and ==laughing== the whole way. Which feature is the ==most specific== fit for the ==redesign-and-retest cycle==?","k":"More learning when active, meaningful, interactive, iterative, joyful (Hirsh-Pasek et al., 2015).","v":"Most specific","a":[["[[Iterative]]","Right. Try, check, revise, repeat = iterative learning."],["[[Interactive]]","Present (teams), but that’s the social part, not the redesign cycle."],["[[Joyful]]","Present (laughing), but not the cycle."],["[[Meaningful]]","Possible, but the cycle itself is iteration."],["[[Embodied]]","Not one of lecture’s five, and it’s about moving the body, not revising."]]},{"id":"a2q017","s":2,"o":12,"t":"L","sc":"pillars5","q":"According to lecture (Hirsh-Pasek et al., 2015), learning is better when it is… ==Check all== that apply.","k":"Active · meaningful · interactive · iterative · joyful.","v":"Check all that apply","a":[["[[Active]]","Belongs.",1],["[[Meaningful]]","Belongs.",1],["[[Interactive]]","Belongs.",1],["[[Iterative]]","Belongs.",1],["[[Joyful]]","Belongs.",1],["[[Competitive]]","Impostor.",0],["[[Quiet]] and individual","Impostor.",0],["[[Rewarded]] with prizes","Impostor.",0]],"m":1,"h":"A-M-I-I-J."},{"id":"a2q018","s":2,"o":12,"t":"LR","sc":"fball","q":"Why did lecture describe Fraction Ball as ==embodied==?","k":"Fraction Ball: uses the number line to aid maths learning · embodied and playful.","v":"Explain the term","a":[["Students [[physically move]] along a court-sized number line","Right. The maths is experienced through the body: farther arcs = bigger values, and counters walk the number line."],["Students [[watch]] a video of basketball players doing maths","Wrong. Watching isn’t embodied."],["Students fill in [[worksheets]] in the gym after PE ends","Wrong. Worksheets aren’t embodied."],["Students compete for [[prizes]] by scoring the most baskets","Wrong. Prizes aren’t what ‘embodied’ means."],["Students learn [[alone]] at their desks","Wrong. That’s the opposite."]]},{"id":"a2q019","s":2,"o":13,"t":"R","sc":"fdesign","q":"Which statement about ==Bustamante et al.’s Efficacy Experiment== design is ==accurate==?","k":"Efficacy Experiment: 160 Grade 4–6 students at one California school; randomized within classrooms (blocked by gender) to Fraction Ball in PE vs. regular PE; pretest and posttest.","v":"Study design","a":[["Students were [[randomly assigned]]; [[controls]] did regular PE","Right. Random assignment within classrooms to Fraction Ball during PE vs. regular PE. Both kept regular maths class."],["Students [[chose]] Fraction Ball or regular PE","Wrong. Self-selection would be a confound."],["Controls got [[extra maths]] tutoring instead of regular PE","Wrong. Controls had regular PE, not extra maths."],["Whole [[schools]] were compared, with no randomization at all","Wrong. Students were randomized within classrooms."],["There was [[no pretest]], only a posttest","Wrong. It was pretest–posttest."]]},{"id":"a2q020","s":2,"o":13,"t":"R","sc":"fresult","q":"After the Efficacy Experiment, which ==pattern of results== is accurate?","k":"Results: overall ≈ +0.40 SD (moderate–large) · near transfer ↑ · conversions between fractions and decimals ↑ · far transfer, number line, addition: ns · no moderators.","v":"Results","a":[["[[Conversions]] and [[near transfer]] improved; [[far transfer]] didn’t","Right. Overall composite +0.4 SD, near transfer improved, fractions↔decimals conversions improved most. Far transfer, number line and addition: not significant."],["[[Number line]] estimation improved the most of all skills","Wrong. Number line results were not significant."],["[[Far transfer]] improved most, while conversions didn’t change","Reversed."],["[[Nothing]] improved compared with the regular-PE control group","Wrong. The overall composite rose about 0.4 SD."],["Only [[boys]] or [[older]] students improved","Wrong. No moderation by gender, grade, or prior knowledge."]]},{"id":"a2q021","s":2,"o":13,"t":"R","sc":"ghost","q":"A student says ==‘.274 is bigger than .83 because 274 is bigger than 83.’== Which idea from Bustamante et al. explains this ==error==, and how does Fraction Ball target it?","k":"Whole number bias (e.g., thinking .274 > .83). Fraction Ball: a basketball court re-lined as a number line; farther arcs = larger fractions/decimals.","v":"Two-part","a":[["[[Whole number bias]]; the court shows size by [[distance]]","Right. Treating decimals like whole numbers is whole number bias. On the court, farther arcs = larger values, so magnitude is visible."],["[[Far transfer]]; the court adds brand-new representations","Wrong. Far transfer is about applying skills to new kinds of problems."],["[[Embodied cognition]]; players chant answers","Wrong label for the error."],["[[Near transfer]]; players practise addition","Wrong. Near transfer is a type of test item, not the error."],["[[Whole number bias]]; the court uses [[pizza]] slices instead","Right error, wrong fix. Fraction Ball uses a linear number line, not circles."]]},{"id":"a2q022","s":2,"o":13,"t":"R","sc":"fresult","q":"Why did the authors think ==conversions between fractions and decimals== improved the most?","k":"Why conversions: fractions and decimals shown side by side → learning from comparison.","v":"Best explanation","a":[["Both notations sat [[side by side]], inviting [[comparison]]","Right. Learning by comparison: both notations sat next to each other on the court and scoreboard."],["Students had [[more homework]] on conversions than controls","Wrong. No extra homework was given."],["[[Teachers]] drilled conversions in regular maths class","Wrong. Both groups had the same regular maths."],["Conversions were simply the [[easiest]] items on the posttest","Not the authors’ explanation."],["Only the [[top students]] in each class were chosen to play","Wrong. Students were randomly assigned."]]},{"id":"a2q023","s":2,"o":13,"t":"R","sc":"fresult","q":"Which are ==limitations== of Bustamante et al. (2022)? ==Check all== that apply.","k":"Limitations: one school (external validity) · a supplement, not a substitute · didn’t isolate components · researcher-designed measures · no delayed posttest · no far transfer.","v":"Check all that apply","a":[["Only [[one school]], limiting external validity","Belongs.",1],["No [[delayed]] posttest to check retention","Belongs.",1],["Didn’t isolate [[which components]] worked","Belongs.",1],["No significant [[far transfer]]","Belongs.",1],["No [[random assignment]]","Impostor. Students WERE randomly assigned.",0],["No [[control group]]","Impostor. Controls did regular PE.",0],["Too [[expensive]] to scale","Impostor. They stress it’s low cost and scalable.",0]],"m":1},{"id":"a2q024","s":2,"o":13,"t":"R","sc":"fdesign","q":"Between the ==Pilot== and the ==Efficacy== experiment, the team made changes. Which ==problem== were the revisions mainly meant to fix?","k":"Pilot: only fraction → decimal conversion improved. Revisions (co-designed with teachers) aimed to broaden effects; the Efficacy Experiment then improved the overall composite.","v":"Why the change","a":[["The pilot improved only [[one skill]], fractions → decimals","Right. So they added saying the maths aloud, debriefs, the Ghost Number Line, Supercharge Points, ‘Who goes first?’ and more sessions, to broaden the effects."],["The pilot had [[no]] random assignment of any students at all","Wrong. The pilot was also randomized (one classroom didn’t fully comply)."],["Students and teachers [[disliked]] the pilot game","Wrong. Students and teachers were enthusiastic."],["The pilot made students’ overall maths scores [[drop]] below controls","Wrong. Fractions → decimals improved."],["The pilot was run with [[adults]] instead of children","Wrong. It was run with Grade 5–6 students."]]},{"id":"a2q025","s":2,"o":13,"t":"R","sc":"fball","q":"A district with ==no money for new technology== wants Fraction Ball. Which ==implication== from the authors supports this?","k":"Implications: low-cost and highly scalable · schoolyards can host play-based learning · a model of researcher–teacher co-design.","v":"Apply","a":[["[[Low-cost]] and [[scalable]]: chalk on any court","Right. Materials are free, and courts already exist."],["It [[replaces]] regular maths class, saving time","Wrong. The authors call it a supplement, not a substitute."],["It needs [[tablets]] and an app for scoring","Wrong. Scoring uses a number line on the sideline."],["It only works with [[trained coaches]] on staff","Wrong. Teachers ran it."],["It boosts [[far transfer]] most","Wrong. Far transfer wasn’t significant."]]},{"id":"a2q026","s":2,"o":13,"t":"R","sc":"fdesign","q":"Which ==research question== was Bustamante et al. NOT trying to answer?","k":"Questions: does Fraction Ball improve rational-number learning? near/far transfer? moderation by grade, gender, prior knowledge?","v":"Odd one out","a":[["Does Fraction Ball improve [[reading]] comprehension?","Right. Reading wasn’t measured. The study was about rational numbers."],["Does Fraction Ball improve [[rational number]] learning?","They asked this."],["Do effects [[transfer]] to near and far items?","They asked this."],["Does the effect depend on [[grade, gender or prior knowledge]]?","They asked this (moderators)."],["Can play-based learning work in a [[real school]] setting?","They asked this (ecological validity)."]]},{"id":"a3q001","s":3,"o":14,"t":"L","sc":"goals","q":"==Nico== studies history to ==understand why his world is the way it is==. ==Kian== studies to ==get the best grade in the class==. Research would predict:","k":"Mastery goals → engagement, persistence, effort, well-being, less cheating… but NOT necessarily better grades.","v":"Predict","a":[["Nico will be more [[engaged]] in class than Kian","Right. Nico has mastery goals, linked with more [[engagement, persistence, effort, well-being]] and less cheating."],["Nico will get better [[grades]] in history than Kian","Wrong. Mastery goals are [[not necessarily]] linked with better academic performance."],["Nico will put in [[less effort]] than Kian","Reversed. Mastery goals go with MORE effort."],["Nico will be more likely to [[cheat]] than Kian","Reversed. Mastery goals go with LESS cheating."],["Nico will report lower [[well-being]] than Kian","Reversed. Mastery goals go with better well-being."]]},{"id":"a3q002","s":3,"o":14,"t":"L","sc":"goals","q":"==Zoe== says: ==‘I just don’t want to look dumb next to everyone else.’== Which ==goal== is she showing?","k":"Performance (relative ability) goals: being superior, besting others, OR avoiding looking poorly compared to others.","v":"Classify","a":[["A [[performance]] (relative ability) goal","Right. Performance goals include [[avoiding looking poorly compared to others]], not just beating them."],["A [[mastery]] goal","Wrong. Mastery is about learning and improving, not about how you look next to others."],["No achievement goal, because she isn’t trying to [[win]]","Wrong. Avoiding looking bad is still a relative-ability goal."],["A [[mastery]] goal, because she wants to avoid mistakes","Wrong. Her focus is comparison with others."],["[[Intrinsic]] motivation for the subject","Wrong. Nothing says she enjoys the subject itself."]]},{"id":"a3q003","s":3,"o":14,"t":"L","sc":"honour","q":"A principal wants her school to ==emphasize mastery goals==. Which practices from lecture should she ==ADD==? ==Check all== that apply.","k":"Mastery: recognition for effort/improvement · recognition for different abilities · diverse course options. Performance: public honour rolls · assemblies for top grades · class rankings published.","v":"Check all that apply","a":[["Recognize [[effort and improvement]]","Belongs.",1],["Recognize [[different abilities]]","Belongs.",1],["Offer [[diverse course options]]","Belongs.",1],["Post a public [[honour roll]]","Impostor. Emphasizes performance goals.",0],["Hold [[assemblies]] for top grades","Impostor. Emphasizes performance goals.",0],["Publish [[class rankings]] on report cards","Impostor. Emphasizes performance goals.",0]],"m":1},{"id":"a3q004","s":3,"o":14,"t":"L","sc":"goals","q":"Which of these are among the ==seven TARGETS== classroom features? ==Check all== that apply.","k":"TARGETS: Task · Authority · Recognition · Grouping · Evaluation · Time · Social relations.","v":"Check all that apply","a":[["[[Task]]","Belongs.",1],["[[Authority]]","Belongs.",1],["[[Recognition]]","Belongs.",1],["[[Grouping]]","Belongs.",1],["[[Testing]]","Impostor. The E is Evaluation, not testing.",0],["[[Achievement]]","Impostor. A is Authority.",0],["[[Structure]]","Impostor. S is Social relations.",0],["[[Time]]","Belongs.",1]],"m":1,"h":"Evaluation and Social relations are the two not listed here."},{"id":"a3q005","s":3,"o":14,"t":"L","sc":"targets","q":"A teacher ==grades every test on a curve== so only a few can get an A, and gives ==one strict deadline with no chance to revise==. Which ==TARGETS features== are pushing toward ==performance== goals?","k":"TARGETS can tilt a class toward mastery or performance goals.","v":"Diagnose","a":[["[[Evaluation]] and [[Time]]","Right. Grading on a curve = [[evaluation]] by comparison. No flexibility in pacing = [[time]] pressure, which rewards the fastest, not the most improved."],["[[Task]] and [[Authority]]","Wrong. Nothing says the work is dull or that students lack choices."],["[[Grouping]] and [[Social relations]]","Wrong. No grouping or peer relations described."],["[[Recognition]] and [[Authority]]","Half. There’s no Authority issue here."],["[[Evaluation]] and [[Grouping]]","Half. Nothing about how students are grouped."]]},{"id":"a3q006","s":3,"o":14,"t":"L","sc":"goals","q":"A school ==switches to mastery-focused practices==. A parent asks, ==‘So report-card grades will go up, right?’== Best answer from lecture:","k":"Mastery goals: increased engagement, persistence, effort, well-being, less cheating. Not necessarily linked with better academic performance.","v":"Answer a claim","a":[["[[Not necessarily]]; engagement should rise, though","Right. Mastery goals: more engagement, persistence, effort, well-being, less cheating, but not necessarily better academic performance."],["[[Yes]], mastery goals always raise report-card grades","Wrong. Lecture said not necessarily."],["No, grades will [[drop]] sharply under mastery goals","Wrong. Lecture didn’t say grades fall."],["Yes, but only for the [[top]] students in each class","Not a lecture claim."],["No, mastery goals [[lower]] effort","Reversed. Mastery goals go with more effort."]]},{"id":"a3q007","s":3,"o":15,"t":"L","sc":"sizebands","q":"Based on research on ==school size==, which child is most likely to have the ==best outcomes==?","k":"School size: smaller → better outcomes. Recommended: K–8, 300–500 students; Grades 9–12, 600–1000.","v":"Apply the numbers","a":[["A [[Grade 7]] student in a school of [[450]]","Right. Grade 7 sits in the K–8 range, and 450 is inside the recommended [[300–500]]."],["A [[Grade 7]] student in a school of [[800]]","Wrong. 800 is in the HIGH school range, but too big for K–8."],["A [[Grade 10]] student in a school of [[1,800]]","Wrong. Well above 600–1000 for Grades 9–12."],["A [[Grade 10]] student in a school of [[400]]","Wrong. 400 fits K–8, but is below the 600–1000 given for high school."],["A [[Grade 2]] student in a school of [[700]]","Wrong. Too big for the K–8 range of 300–500."]],"h":"Elementary 3–5 hundred. High school 6–10 hundred."},{"id":"a3q008","s":3,"o":15,"t":"L","sc":"sizebands","q":"Which students attend a school ==inside the size range lecture recommended== for their grade? ==Check all== that apply.","k":"K–8: 300–500 · Grades 9–12: 600–1000. Smaller schools → better outcomes.","v":"Check all that apply","a":[["A [[Grade 8]] student at a school of [[500]]","Belongs. Grade 8 is in K–8, and 500 is the top of 300–500.",1],["A [[Grade 12]] student at a school of [[1,000]]","Belongs. 1,000 is the top of 600–1000.",1],["A [[Grade 3]] student at a school of [[350]]","Belongs. Inside 300–500.",1],["A [[Grade 9]] student at a school of [[450]]","Impostor. 450 fits K–8, but high school’s range is 600–1000.",0],["A [[Grade 6]] student at a school of [[650]]","Impostor. Too big for K–8.",0],["A [[Grade 11]] student at a school of [[1,500]]","Impostor. Too big for 9–12.",0]],"m":1},{"id":"a3q009","s":3,"o":15,"t":"L","sc":"millsc","q":"Parents ==win a lottery== for a private school spot. Based on lecture and ==Mills & Wolf (2017)==, what should they expect for their child’s ==achievement==?","k":"School type: traditional research favours private schools BUT is confounded with size, SES, etc. Controlling for these → no advantage. Lottery studies are mixed → often no improvement, or even decline (Mills & Wolf, 2017).","v":"Predict","a":[["[[No clear gain]], and maybe an early [[drop]]","Right. Lottery studies are mixed and often find no improvement or even decline. Mills & Wolf: scores dropped in Year 1, then recovered."],["A [[large gain]] by the end of Year 1","Wrong. Year 1 showed a drop."],["A steady gain each year, as [[older]] studies showed","Wrong. Older studies were confounded with size and SES."],["A gain only if the private school is [[larger]]","Not supported. Smaller schools are linked with better outcomes, and private schools tend to be smaller."],["The same result as [[non-lottery]] private school studies","Wrong. Non-lottery studies are confounded; lotteries are the cleaner test."]]},{"id":"a3q010","s":3,"o":15,"t":"L","sc":"private","q":"Why are ==lottery studies== a better test of private school effects than ==comparing private and public students directly==?","k":"Private school advantages in older research were confounded with school size, SES, etc. Random lotteries remove that confound.","v":"Study design","a":[["Chance decides, so groups are [[alike]]; no [[selection]] confound","Right. Families who apply are similar; the lottery decides who goes. Direct comparisons mix in SES, size, and family choices."],["Lotteries only include [[high-achieving]] students who apply early","Wrong. That would add bias, not remove it."],["Lottery schools are [[larger]], so effects are clearer","Not the reason."],["Lotteries let researchers [[pick]] the best-performing private schools","Wrong. Lottery means chance decides."],["Lotteries measure [[well-being]] instead of grades","Wrong. Achievement was the outcome."]]},{"id":"a3q011","s":3,"o":15,"t":"L","sc":"fit","q":"==Thirteen-year-old Mia== starts middle school. Her new teachers ==set all the rules== and ==post test scores by rank==. Under ==stage–environment fit==, which ==two adolescent needs== are being mismatched?","k":"Stage–environment fit: adolescents need autonomy and care about peer opinions; middle/high schools add teacher control and comparison → developmental mismatch.","v":"Explain","a":[["Need for [[autonomy]] and concern for [[peer opinions]]","Right. More teacher control clashes with the need for autonomy; more comparison clashes with sensitivity to peers’ views."],["Need for [[sleep]] and need for [[play]]","Wrong. Not the stage–environment pair lecture gave."],["Need for clear [[structure]] and need for public [[rankings]]","Wrong. These are what the school is GIVING, not what teens need."],["Need for [[mastery goals]] and need for [[smaller classes]]","Wrong. Not lecture’s pair."],["Need for [[adult approval]] and need for [[less homework]]","Wrong. Not lecture’s pair."]],"h":"They want freedom and get rules. They fear judgment and get rankings."},{"id":"a3q012","s":3,"o":15,"t":"L","sc":"transitions","q":"Lecture listed ==possible reasons for the decline at school transitions==. Which were on the list? ==Check all== that apply.","k":"Why the decline? Age itself? · Transition itself? · Changes in achievement goals · Changes in teacher beliefs · Stage–environment fit (developmental mismatch).","v":"Check all that apply","a":[["[[Age]] itself","Belongs (with a question mark).",1],["The [[transition]] itself","Belongs (with a question mark).",1],["Changes in [[achievement goals]]","Belongs.",1],["Changes in [[teacher beliefs]]","Belongs.",1],["[[Stage–environment fit]]","Belongs.",1],["A drop in [[IQ]] at puberty","Impostor.",0],["[[Larger]] class sizes in Grade 6","Impostor. Not on the list.",0]],"m":1},{"id":"a3q013","s":3,"o":15,"t":"L","sc":"bennerc","q":"Which student is ==most at risk== of a big drop in ==belonging== after the move to high school, based on lecture?","k":"Most impacted by transitions: lowest achievers, those struggling with anxiety or social skills, ethnic minorities (Benner & Graham, 2009).","v":"Who is at risk","a":[["A [[Latino]] student moving to a school with [[few]] same-ethnicity peers","Right. Benner & Graham (2009): belonging dropped for students whose new school was ethnically [[incongruent]]."],["A Latino student moving to a school with [[many]] same-ethnicity peers","Wrong. Congruent schools showed stable belonging."],["A [[high-achieving]], socially confident student with many friends","Wrong. Lowest achievers and anxious students were most impacted."],["A student who stays in a [[K–12]] school","Wrong. No transition means no transition drop."],["A student whose new high school [[starts later]] in the morning","Irrelevant to belonging after transition."]]},{"id":"a3q014","s":3,"o":15,"t":"L","sc":"barnumc","q":"A district plans ==summer programs== to reduce ==summer learning loss==. Based on lecture, which students should be ==prioritized==, and why?","k":"School year: summer break reflects agricultural heritage → decrease in academic performance/IQ over summer, possibly more for low-income families (Barnum, 2018). Year-round school?","v":"Apply","a":[["[[Low-income]] students, with fewer summer [[outings]]","Right. Loss may be larger for low-income families; Barnum (2018) showed poor kids had the fewest summer outings."],["[[High-income]] students, who lose the most IQ over summer","Wrong. Lecture’s concern was low-income families."],["Students already attending [[year-round]] schools","Wrong. They already have shorter breaks."],["[[Older]] students, since loss grows with age","Not a lecture claim."],["Students with [[mastery]] goals","Irrelevant here."]]},{"id":"a3q015","s":3,"o":15,"t":"L","sc":"summer","q":"A district switches to a ==balanced calendar==. What changes, and what problem is it meant to address?","k":"Traditional calendar: long summer (agricultural heritage). Balanced calendar: shorter breaks spread through the year.","v":"Explain","a":[["Summer is [[split]] into shorter breaks, to cut [[summer loss]]","Right. Same school year, spread out. Lecture asked ‘year-round school?’ as a fix for summer decline."],["School days get [[longer]]; aims to raise test scores","Wrong. It’s about breaks, not day length."],["School [[starts later]] each morning, to fit teen sleep cycles","Wrong. That’s the start-times topic."],["Students are [[tracked]] by ability; aims to fit levels","Wrong. That’s tracking."],["Schools get [[smaller]]; aims to improve outcomes","Wrong. That’s school size."]]},{"id":"a3q016","s":3,"o":15,"t":"L","sc":"dunsterc","q":"A high school moves its start time ==from 7:50 to 8:45 a.m.== Which ==reasoning== and ==result== match lecture?","k":"Start times: sleep cycle shifts during adolescence → developmental mismatch with early secondary start times. Dunster et al. (2018): later start → grades improved.","v":"Two-part","a":[["Teen [[sleep cycles]] shift later; grades [[rose]] (Dunster et al.)","Right. Sleep cycle shifts during adolescence; Dunster et al. (2018) found median grades rose from 77.5% to 82% after a later start."],["Teens need [[less sleep]] than children; grades stayed the same","Wrong. Teens’ sleep shifts later. Grades rose."],["Younger kids need [[later]] starts than teens; grades fell","Wrong. The mismatch is that SECONDARY schools start earlier."],["Teen sleep shifts [[earlier]]; attendance improved","Wrong direction. It shifts later."],["Later starts mean fewer [[transitions]]; belonging rose sharply","Wrong topic."]]},{"id":"a3q017","s":3,"o":15,"t":"L","sc":"rockoffc","q":"Two districts: ==District A== runs ==K–8 then 9–12==. ==District B== runs ==K–5, 6–8, 9–12==. Based on ==Rockoff & Lockwood (2010)==, what should you predict?","k":"School transitions → decreases in motivation, interest, confidence. Rockoff & Lockwood (2010): middle-school entrants scored lower than K–8 peers.","v":"Predict","a":[["District B students’ scores [[dip]] on entering [[middle school]]","Right. Middle-school entrants had lower test scores than students who stayed in K–8."],["District A students’ scores dip in [[Grade 6]], just like District B’s","Wrong. They don’t change schools in Grade 6."],["[[Both]] districts show identical scores, since the content is the same","Wrong. The extra transition matters."],["District B scores [[rise]] after the move","Wrong. They dropped."],["Only [[high]]-achievers in District B are affected by the move","Wrong. The lowest achievers are most impacted."]]},{"id":"a3q018","s":3,"o":16,"t":"L","sc":"tracks","q":"==Sam== is moved into the ==lowest maths track==. Which ==set of outcomes== did lecture link with low tracks?","k":"Ability tracking: students separated into classes by ability level. Low tracks: negative outcomes → inadequacy, instructional quality, peer groups.","v":"Predict","a":[["[[Inadequacy]], weaker [[instruction]], different [[peers]]","Right. Low tracks: negative outcomes → feelings of inadequacy, differences in instructional quality and peer groups."],["Academic [[benefits]], but some loss of self-esteem","Wrong. That’s the HIGH track pattern."],["Better [[person–environment fit]], so no harm done","Wrong. That’s a hoped-for rationale, but lecture said low tracks show negative outcomes."],["[[No]] effects in either direction","Wrong. Lecture described negative outcomes."],["Higher [[self-esteem]] from easier, less stressful work","Wrong. Lecture linked low tracks to feelings of inadequacy."]]},{"id":"a3q019","s":3,"o":16,"t":"L","sc":"tracks","q":"==Priya== was the ==top student== in her old class. After being placed in the ==gifted track==, her ==grades stay high== but she ==now feels average==. Which lecture point does this illustrate?","k":"High ability tracks: benefits academically, but may be costs for self-esteem, self-concept, well-being.","v":"Explain","a":[["Academic [[benefits]] with [[self-concept]] costs","Right. High-ability tracks benefit academically but may cost self-esteem, self-concept, well-being."],["High tracks bring no [[academic]] benefit at all","Wrong. Her grades stay high; lecture listed academic benefits."],["Low tracks cause feelings of [[inadequacy]]","Wrong track. She’s in the high track."],["A [[Pygmalion]] effect that lowered her grades","Wrong. Her grades didn’t drop."],["[[Stage–environment]] mismatch at a transition","Wrong. Nothing about a school transition."]],"h":"A big fish in a pond full of big fish."},{"id":"a3q020","s":3,"o":16,"t":"L","sc":"tracks","q":"A school board argues for tracking: ==‘Students compare themselves with classmates at their own level, so they’ll feel fine.’== Which ==rationale== from lecture is this, and what complicates it?","k":"Tracking rationales (both with question marks): maximize person–environment fit? better for social comparison?","v":"Two-part","a":[["[[Social comparison]]; yet [[high]]-track students may lose self-esteem","Right. One rationale was ‘better for social comparison?’; yet high-track students may feel worse, and low tracks have negative outcomes."],["[[Person–environment fit]]; but it makes every class much larger","Wrong rationale. Fit is about matching work to level, not comparison."],["Better for social comparison; but tracking also raises everyone’s [[IQ]]","Wrong. Lecture didn’t link tracking to IQ."],["[[Mastery goals]]; but it hurts teacher pay","Not a lecture rationale."],["[[Stage–environment fit]]; but it delays transitions","Wrong concept."]]},{"id":"a3q021","s":3,"o":16,"t":"L","sc":"tracks","q":"Which statements about ==ability tracking== match lecture? ==Check all== that apply.","k":"Tracking: separated by ability. High: academic benefits, possible costs to self-esteem/self-concept/well-being. Low: inadequacy, instructional quality, peer groups.","v":"Check all that apply","a":[["It separates students into classes by [[ability level]]","Belongs. The definition.",1],["High tracks bring academic [[benefits]]","Belongs.",1],["High tracks may cost [[self-esteem]] or well-being","Belongs.",1],["Low tracks bring differences in [[instructional quality]]","Belongs.",1],["Low tracks [[raise]] self-esteem by easing pressure","Impostor. Lecture linked low tracks with feelings of inadequacy.",0],["Tracking [[eliminates]] social comparison","Impostor. Comparison still happens, just with a different group.",0]],"m":1},{"id":"a3q022","s":3,"o":17,"t":"L","sc":"juvonenc","q":"==Jalen==, a Black student, moves from a school where he’s ==one of very few students of colour== to a ==highly diverse school==. ==Emma==, a White student, attends the same diverse school. Based on Juvonen et al. (2006), which outcomes fit each?","k":"Juvonen et al. (2006): Majority → fewer negative stereotypes about outgroups. Minority → more safety, less loneliness, higher self-worth.","v":"Two-part","a":[["Jalen: [[safer]], less lonely · Emma: fewer [[stereotypes]]","Right. Minority students: more safety, less loneliness, higher self-worth. Majority students: fewer negative stereotypes about outgroups."],["Jalen: fewer stereotypes · Emma: safer and less lonely","Swapped."],["Jalen: higher [[test scores]] · Emma: higher test scores","Wrong. Achievement wasn’t on lecture’s list."],["Jalen: [[more]] victimization · Emma: no change","Wrong. Victimization FELL as diversity rose."],["Jalen: safer · Emma: [[no]] benefit","Wrong. The majority group benefits too."]]},{"id":"a3q023","s":3,"o":17,"t":"L","sc":"juvonenc","q":"As ==school ethnic diversity increased== (Juvonen et al., 2006, as lecture presented it), which went ==DOWN==? ==Check all== that apply.","k":"More diversity: safety ↑, self-worth ↑; victimization ↓, loneliness ↓, majority-group negative stereotypes ↓.","v":"Check all that apply","a":[["Peer [[victimization]]","Belongs.",1],["[[Loneliness]]","Belongs.",1],["Feeling [[safe]] at school","Impostor. Safety went UP.",0],["[[Self-worth]] of minority students","Impostor. It went UP.",0],["[[Negative stereotypes]] held by majority students","Belongs. Fewer negative stereotypes about outgroups.",1]],"m":1},{"id":"a3q024","s":3,"o":17,"t":"LR","sc":"wordsact","q":"A principal says: ==‘Our school is diverse, so we’ve done our part.’== Lecture (Juvonen) and ==Leer et al.== together suggest what’s ==missing== from this view?","k":"Student body diversity (Juvonen) + school diversity ideology and actions (Leer): both matter.","v":"Integrate","a":[["Diversity [[ideology]], and whether the school [[acts]] on it","Right. Juvonen = actual diversity; Leer adds that what a school says about diversity, and whether it walks the talk, also shapes students."],["Diversity only matters for [[majority]] students, not minority ones","Wrong. Both groups benefit."],["Diversity [[harms]] belonging for every group of students","Wrong. Not a finding of either."],["Only [[teacher]] age matters","Not in either source."],["Diversity has [[no]] effect on any student outcome at all","Wrong. Juvonen found clear benefits."]]},{"id":"a3q025","s":3,"o":18,"t":"R","sc":"leermod","q":"==Malik==, a Black student, attends a ==majority-White, low-diversity school== whose mission statement ==explicitly values diversity==, yet nothing else changes. Based on Leer et al. (2025), what is most likely?","k":"Leer et al.: no overall main effect. Youth of Color: pro-diversity statement → more psychological distress, especially in less diverse, majority-White schools.","v":"Predict","a":[["[[More]] psychological [[distress]] than without the statement","Right. For Youth of Color, pro-diversity statements were linked with MORE distress, strongest in less diverse, majority-White schools."],["[[Higher]] reading and maths scores than at other schools","Wrong. No achievement link for Black youth."],["A stronger sense of [[belonging]] at his school","Wrong. No link with belonging."],["[[Less]] distress, since his school publicly says it values him","Wrong. That was the hypothesis. The results went the opposite way."],["[[No]] difference on any outcome","Wrong. Distress was higher."]],"h":"Words without action can feel like a broken promise."},{"id":"a3q026","s":3,"o":18,"t":"R","sc":"leerdata","q":"What was Leer et al.’s ==hypothesis==, and how did it turn out?","k":"Hypothesis: pro-diversity statements would be linked with better outcomes, especially for Youth of Color, especially in diverse and equitable schools. Result: largely the opposite.","v":"Hypothesis vs result","a":[["Expected [[better]] outcomes for Youth of Color; found the [[opposite]]","Right. They expected benefits, especially in diverse, equitable schools. Instead, statements were linked with more distress for Youth of Color."],["Expected [[worse]] outcomes for Youth of Color; results [[confirmed]] it","Wrong. They expected better outcomes."],["Expected better [[belonging]] for all; results confirmed it","Wrong. No link with belonging."],["Expected [[no]] effect at all; results confirmed it","Wrong. They predicted benefits."],["Expected better [[grades]] for all students; results confirmed it","Wrong. No overall achievement link."]]},{"id":"a3q027","s":3,"o":18,"t":"R","sc":"mission","q":"Leer et al. checked whether pro-diversity schools ==‘walked the talk’==. Which describe what they ==actually found== about those schools? ==Check all== that apply.","k":"Did they walk the talk? Barely: somewhat more diverse students, NOT more diverse teachers, only slightly smaller discipline gaps, LARGER racial gaps in gifted placement.","v":"Check all that apply","a":[["Somewhat more [[diverse students]]","Belongs.",1],["[[Not]] more diverse [[teachers]]","Belongs.",1],["[[Larger]] racial gaps in [[gifted]] placement","Belongs.",1],["Much [[smaller]] discipline gaps","Impostor. Only SLIGHTLY smaller.",0],["Much more diverse [[teaching staff]]","Impostor. Teachers were not more diverse.",0],["No gifted program at all","Impostor.",0]],"m":1},{"id":"a3q028","s":3,"o":18,"t":"R","sc":"leermod","q":"Which ==moderators== (the ‘walk the talk’ checks) did Leer et al. test? ==Check all== that apply.","k":"Four moderators: student diversity · teacher diversity · racial discipline gaps · racial gaps in Gifted & Talented placement.","v":"Check all that apply","a":[["Student body [[diversity]]","Belongs.",1],["[[Teacher]] diversity","Belongs.",1],["Racial [[discipline]] gaps","Belongs.",1],["Racial gaps in [[gifted and talented]] placement","Belongs.",1],["School [[start times]]","Impostor.",0],["[[School size]]","Impostor.",0],["Average [[family income]]","Impostor. Not one of the four moderators.",0]],"m":1},{"id":"a3q029","s":3,"o":18,"t":"R","sc":"leerdata","q":"Which outcome showed ==NO link== with pro-diversity statements for ==any== group?","k":"Belonging: no link. Distress: higher for Youth of Color (esp. majority-White schools). Achievement: no link for Black, Latinx, American Indian youth; positive for Asian youth only with more diverse teachers.","v":"Results","a":[["School [[belonging]]","Right. Belonging showed no link."],["Psychological [[distress]]","Wrong. Distress was higher for Youth of Color (and for White youth in some schools)."],["[[Achievement]] for Asian youth","Wrong. For Asian youth, a positive link appeared when teaching staff were more diverse."],["Distress for [[White]] youth","Wrong. White youth showed more distress when teachers were more diverse."],["Distress in [[majority-White]] schools","Wrong. That’s where Youth of Color’s distress was highest."]]},{"id":"a3q030","s":3,"o":18,"t":"R","sc":"mission","q":"How did Leer et al. ==measure== whether a school valued diversity, and what ==limitation== comes with that?","k":"Measure: school mission statements coded for explicitly valuing diversity (13% did). Limitations: not causal; statements capture only part; didn’t measure student awareness of inequities; 2014–15 data from one state.","v":"Measure + limitation","a":[["Coded [[mission statements]], which capture only [[part]] of it","Right. Statements were coded yes/no (13% explicitly valued diversity). A statement is only one slice of a school’s real climate."],["Surveyed [[teachers]] directly; but teachers may exaggerate","Wrong. They coded mission statements."],["Observed [[classrooms]]; too few were observed","Wrong. No classroom observation."],["Asked [[students]] directly; students guessed","Wrong. Students reported outcomes, not the measure of ideology."],["Used [[test scores]]; but scores aren’t really about diversity","Wrong. Test scores were an outcome."]]},{"id":"a3q031","s":3,"o":18,"t":"R","sc":"wordsact","q":"A school board reads Leer et al. Which plan ==best follows the authors’ implications==?","k":"Implications: statements must be paired with action (redress discipline and tracking inequities). Words without action won’t close gaps and may worsen mental health disparities.","v":"Apply","a":[["Pair the statement with [[action]] on [[discipline]] and [[tracking]] gaps","Right. Words must be matched by action, like redressing inequities in school discipline and academic tracking."],["[[Remove]] all mention of diversity","Not what they recommend. The problem was words WITHOUT action."],["Write a [[stronger]] statement, and change nothing else at school","Wrong. That’s the say–do mismatch that went with more distress."],["Adopt a [[color-evasive]] approach that downplays group differences","Wrong. Ignoring differences harms minoritized youth in prior research."],["Focus only on raising [[test scores]] for every student","Wrong. Achievement wasn’t affected by statements; the issue is distress and equity."]]},{"id":"a3q032","s":3,"o":18,"t":"R","sc":"wordsact","q":"Which ==two diversity ideologies== did Leer et al. contrast?","k":"Color-evasive (minimize differences) vs. multicultural (recognize and value differences).","v":"Name the concepts","a":[["[[Color-evasive]] vs. [[multicultural]]","Right. Color-evasive downplays group differences; multicultural recognizes and values them."],["[[Mastery]] vs. [[performance]]","Wrong. Those are achievement goals."],["[[Assimilation]] vs. [[colonization]]","Wrong. Those are historical reasons for schooling."],["[[Tracking]] vs. [[detracking]]","Wrong. That’s grouping by ability."],["[[Congruent]] vs. [[incongruent]] school settings","Wrong. That’s Benner & Graham’s school-transition idea."]]},{"id":"a3q033","s":3,"o":18,"t":"R","sc":"leerdata","q":"==Why== did the authors think a pro-diversity statement might ==backfire== for Youth of Color in majority-White schools?","k":"Interpretation: performative multiculturalism. Fits stage–environment fit (schools failing adolescents’ needs for belonging and authenticity).","v":"Best explanation","a":[["[[Performative]] multiculturalism: words without [[action]]","Right. A say–do mismatch (‘diversity dishonesty’) can signal the school isn’t sincere, and adolescents are especially sensitive to authenticity and exclusion."],["Statements made the curriculum [[harder]]","Wrong. Curriculum wasn’t changed."],["Statements [[reduced]] how many teachers of colour were hired","Wrong. They didn’t cause staffing changes."],["Students [[never]] actually read the mission statements","Possible, but that would predict no effect, not more distress."],["Statements [[lowered]] test scores","Wrong. No achievement effect for these groups."]]},{"id":"a3q034","s":3,"o":18,"t":"R","sc":"leerdata","q":"Which describes Leer et al.’s ==sample and design==?","k":"Leer et al.: Grade 5–8, North Carolina public schools, 2014–15. Survey N = 1,692; administrative N = 300,063; 690 schools. Correlational.","v":"Study design","a":[["[[Grade 5–8]] students in [[North Carolina]]; [[correlational]]","Right. Survey (Project RAISE, N = 1,692) plus administrative records (N ≈ 300,000) from 2014–15; regression, not an experiment."],["Grade 5–8 students in North Carolina; [[experimental]]","Wrong design. Schools weren’t randomly assigned statements."],["[[High school]] students in [[California]]; correlational","Wrong sample."],["[[Kindergarten]] students in [[British Columbia]]; longitudinal","That’s Ramsden et al."],["Grade 4–6 students in one [[California]] school; experimental","That’s Bustamante et al."]]},{"id":"a4q001","s":4,"o":19,"t":"L","sc":"threeareas","q":"Lecture named ==three places where children meet the legal system==. Which ones? ==Check all== that apply.","k":"Three areas: children as eyewitnesses · impact of the legal system on involved children (divorce, custody) · youth suspected of committing crimes (competence, blame, punishment). This unit: the third.","v":"Check all that apply","a":[["Children as [[eyewitnesses]]","Belongs.",1],["Children affected by [[divorce]] or [[custody]] proceedings","Belongs: the impact of the legal system on involved children.",1],["Youth [[suspected of committing crimes]]","Belongs, and it’s this unit’s focus (competence, blame, punishment).",1],["Children serving on [[juries]]","Impostor.",0],["Children as [[lawyers]] in mock trials","Impostor.",0],["Children [[voting]] on school laws","Impostor.",0]],"m":1},{"id":"a4q002","s":4,"o":19,"t":"L","sc":"threeareas","q":"A psychologist studies whether ==a 6-year-old’s memory of a robbery== is reliable in court. Another studies how a ==15-year-old’s impulse control== bears on ==how much blame== he deserves. Which ==areas== are they working in, and which one was this unit’s focus?","k":"Unit focus: youth suspected of committing crimes: competence, blame, punishment.","v":"Two-part","a":[["[[Eyewitnesses]] · [[youth accused of crimes]]; the second was the focus","Right. The first is children as eyewitnesses. The second is about youth suspected of crimes (blame, punishment), the unit’s focus."],["Eyewitnesses · youth accused of crimes; the [[first]] was the focus","Wrong focus. The unit centred on youth suspected of committing crimes."],["[[Custody]] · youth accused of crimes; the second was the focus","Wrong first area. A robbery witness isn’t a custody matter."],["Youth accused of crimes · [[eyewitnesses]]; the second was the focus","Swapped."],["Eyewitnesses · [[custody]]; the first was the focus","Wrong second area and wrong focus."]]},{"id":"a4q003","s":4,"o":19,"t":"L","sc":"rock","q":"Lecture’s ==rock-thrower== exercise changed only the thrower’s ==age== (25, 8, 12, 15, 18). What ==question== was it building toward?","k":"The question: should juveniles accused of crime be held to the same standards of blameworthiness as adults, and punished the same way? Due to their stage of development, are they less culpable?","v":"Purpose","a":[["Same [[blame]] and [[punishment]] for juveniles as for adults?","Right. ‘The question’: same standards of blameworthiness, punished in the same way?"],["Should rock-throwing be treated as a [[crime]] at all?","Wrong. The act was held constant; only age changed."],["At what age does [[IQ]] stop growing?","Wrong. Not about IQ."],["Should children ever be allowed to testify as [[eyewitnesses]]?","Wrong area."],["How much [[harm]] does one broken window really cause?","Wrong. Harm was held constant."]]},{"id":"a4q004","s":4,"o":19,"t":"LR","sc":"scales","q":"Two people commit ==the exact same robbery== with ==the same harm==: one is ==15==, one is ==30==. A judge argues the 15-year-old deserves ==less punishment==. Which reasoning ==best fits lecture and Steinberg & Icenogle==?","k":"Proportionality: punishment set by harm AND culpability. Juveniles’ stage of development may make them less culpable → mitigation.","v":"Best reasoning","a":[["Immaturity lowers [[culpability]], so [[mitigation]] fits","Right. Under proportionality, equal harm doesn’t mean equal culpability. Adolescent immaturity is a reason to lessen (mitigate) responsibility."],["The 15-year-old should be [[excused]] entirely from responsibility","Too strong. An excuse removes responsibility. Lecture’s point is lessening, not erasing."],["Teens have [[weaker]] reasoning than adults in all situations","Wrong. Cognitive skills are adult-like by mid–late adolescence; the gap is psychosocial."],["The [[harm]] caused by a teen is smaller","Wrong. The harm is stated to be equal."],["Teens are [[never]] responsible for crimes","Wrong. Lecture asked whether they’re LESS culpable, not blameless."]]},{"id":"a4q005","s":4,"o":20,"t":"L","sc":"mitig","q":"Which are the ==three factors that can mitigate== criminal responsibility, per lecture? ==Check all== that apply.","k":"Mitigating factors: impairments/deficiencies in decision making · offense in response to compelling external circumstances · act is out of character.","v":"Check all that apply","a":[["[[Impairments]] or deficiencies in decision making","Belongs.",1],["Offense in response to [[compelling external circumstances]]","Belongs.",1],["The act is [[out of character]]","Belongs.",1],["The offender is [[wealthy]] enough to pay damages","Impostor.",0],["The offender shows [[remorse]] at trial","Impostor. Not one of lecture’s three.",0],["The [[victim]] forgives the offender","Impostor.",0],["The offender has a [[clean]] record and good grades","Impostor. Not one of the three as stated.",0]],"m":1,"h":"Couldn’t think it through · pushed by outside pressure · not who they are."},{"id":"a4q006","s":4,"o":20,"t":"L","sc":"mitig","q":"Match each case to its ==mitigating factor==. ==Case A==: a man steals food after ==armed men threaten his family==. ==Case B==: a person with a ==severe intellectual disability== can’t grasp consequences. ==Case C==: a ==model citizen== commits one offence during an unusual crisis.","k":"Three mitigators: impaired decision making · compelling external circumstances · out of character.","v":"Match three","a":[["A: [[external circumstances]] · B: [[impaired decisions]] · C: [[out of character]]","Right. Threats = compelling external circumstances; disability = impairments in decision making; a one-off = out of character."],["A: impaired decisions · B: external circumstances · C: out of character","Swapped A and B."],["A: external circumstances · B: out of character · C: impaired decisions","Swapped B and C."],["A: out of character · B: impaired decisions · C: external circumstances","Swapped A and C."],["All three: [[excuse]]","Wrong. These lessen responsibility (mitigation); they don’t automatically remove it."]]},{"id":"a4q007","s":4,"o":20,"t":"L","sc":"scales","q":"A judge ==finds a teen not criminally responsible at all==. Another judge ==finds a teen responsible but cuts the sentence in half==. Which terms fit?","k":"Excuse = remove criminal responsibility. Mitigation = lessen criminal responsibility and punishment.","v":"Two-part","a":[["[[Excuse]] · [[mitigation]]","Right. Excuse removes criminal responsibility; mitigation lessens responsibility and punishment."],["[[Mitigation]] · [[excuse]]","Swapped."],["[[Mitigation]] · [[mitigation]]","Wrong. The first removes responsibility entirely."],["[[Proportionality]] · [[excuse]]","Wrong. Proportionality is the principle, not the outcome."],["[[Excuse]] · [[proportionality]]","Wrong second term."]],"h":"Excuse erases. Mitigation shrinks."},{"id":"a4q008","s":4,"o":20,"t":"L","sc":"scales","q":"Under ==penal proportionality==, which pair of cases should get ==different punishments==?","k":"Penal proportionality: severity of punishment should be determined by the harm caused AND the culpability of the person causing harm.","v":"Apply the principle","a":[["Same [[harm]]; one offender far less [[culpable]]","Right. Severity is set by harm AND culpability. Equal harm with unequal culpability → different punishment."],["Same harm; same culpability; [[different ages]] on paper only","If culpability is truly equal, proportionality says equal punishment."],["Same harm; same culpability; one offender is [[richer]]","Wealth isn’t part of proportionality."],["Same harm; same culpability; one has a [[better lawyer]]","Not part of the principle."],["Same harm; same culpability; [[different cities]]","Location isn’t part of the principle."]]},{"id":"a4q009","s":4,"o":20,"t":"LR","sc":"mitig","q":"How do ==adolescents== map onto the ==three mitigating factors==?","k":"Due to their stage of development, are juveniles less culpable? Immature decision making under arousal · peer influence · character still developing.","v":"Apply to adolescents","a":[["Immature [[self-control]], strong [[peer]] pull, [[unformed]] character","Right. Weaker impulse control (decision making), peer pressure they can’t easily escape (external circumstances), and a character still forming (act may not reflect who they’ll become)."],["Low [[IQ]], [[poverty]], prior [[record]]","Wrong. Not the developmental mapping, and teen reasoning is adult-like by mid-adolescence."],["Poor [[memory]], weak [[language]], low [[motivation]]","Wrong. Not the developmental mapping."],["Immature [[reasoning]], [[wealthy]] parents, and a stable character","Wrong. Reasoning is mostly mature, and character isn’t stable yet."],["Strong self-control, [[no]] peer influence, and a fixed character","Reversed."]]},{"id":"a4q010","s":4,"o":21,"t":"LR","sc":"coldhot","q":"==Jay (16)== calmly weighs pros and cons of a medical treatment with his doctor, ==like an adult would==. That weekend, ==with friends cheering==, he ==jumps off a roof into a pool==. Which explanation fits lecture and Steinberg & Icenogle?","k":"Cognitive capacity matures by ~16; psychosocial maturity (self-regulation, future orientation, sensation seeking, peer influence) keeps developing. Maturity gap.","v":"Explain the pattern","a":[["Adult-like [[cognition]], still-maturing [[psychosocial]] skills","Right. In calm (‘cold’) contexts teens reason like adults; with peers and arousal (‘hot’), immature self-regulation and reward sensitivity win out."],["His [[cognitive]] skills are still childlike at age 16, unlike adults’","Wrong. By mid-late adolescence cognitive skills are adult-like."],["He has [[low]] sensation seeking but high future orientation","Wrong. Sensation seeking peaks in adolescence."],["Peers make [[adults]] take more risks than teens do","Wrong. In the studies, peers raised risk-taking in adolescents, not adults."],["His [[white matter]] is shrinking","Wrong. White matter increases linearly."]],"h":"Same brain, different weather: calm vs. hot."},{"id":"a4q011","s":4,"o":21,"t":"L","sc":"dual","q":"Which ==psychosocial capacities== did lecture cover as still developing in adolescence? ==Check all== that apply.","k":"Psychosocial: self-regulation · future orientation · sensation seeking & reward sensitivity · peer influence. Cognitive (adult-like by ~16): working memory, logical reasoning, etc.","v":"Check all that apply","a":[["[[Self-regulation]] (impulse control)","Belongs.",1],["[[Future orientation]]","Belongs.",1],["[[Sensation seeking]] & reward sensitivity","Belongs.",1],["[[Peer influence]]","Belongs.",1],["[[Working memory]]","Impostor. That’s a COGNITIVE skill, adult-like by mid-adolescence.",0],["[[Logical reasoning]]","Impostor. Cognitive, not psychosocial.",0],["[[Vocabulary]] size","Impostor.",0]],"m":1},{"id":"a4q012","s":4,"o":21,"t":"L","sc":"tolc","q":"In the ==Tower of London== puzzle (Steinberg et al., 2008), ==older participants waited longer== before their first move on ==hard problems==. What does this show?","k":"Self-regulation: the ability to control impulses gets gradually better throughout adolescence (Steinberg et al., 2008: time to first move).","v":"Interpret a task","a":[["[[Self-regulation]]: they hold back to [[plan]]","Right. ‘Time to first move’ measures impulse control. Waiting longer on hard problems = planning instead of acting on impulse."],["Older people are simply [[slower]] thinkers","Wrong. The delay is strategic, and only on hard problems."],["[[Future orientation]] declines steadily across adolescence","Wrong. That’s a different capacity, and it improves."],["[[Sensation seeking]] rises with age","Wrong. It peaks in adolescence."],["[[Cognitive]] capacity peaks at 10","Wrong. Cognitive capacity rises to ~16–17."]]},{"id":"a4q013","s":4,"o":21,"t":"L","sc":"money","q":"==Lee (14)== picks ==$400 tomorrow== over ==$1,000 in a year==. ==Ana (24)== picks the ==$1,000==. Which capacity differs, and what did ==Steinberg et al. (2009)== show?","k":"Future orientation: over adolescence, teens become better able to think about long-term consequences (delay discounting; Steinberg et al., 2009).","v":"Two-part","a":[["[[Future orientation]]; younger teens accept [[less]] now","Right. Younger groups’ indifference points were lower (they’d take less now), especially at long delays."],["[[Sensation seeking]]; teens want the thrill of risk","Wrong. There’s no risk in this choice, just delay."],["[[Self-regulation]]; teens are better at waiting","Wrong. Lee didn’t wait."],["Future orientation; teens and adults [[don’t differ]] at all","Wrong. They differ."],["[[Peer influence]]; teens copy friends","Wrong. No peers involved."]]},{"id":"a4q014","s":4,"o":21,"t":"L","sc":"igt","q":"In the ==Iowa Gambling Task== (Cauffman et al., 2010), ==teens== kept playing decks with ==big wins==, but only ==18+== participants learned to ==avoid decks with big losses==. Which statement fits?","k":"Sensation seeking & reward sensitivity: peaks in adolescence; teens driven more by reward, less concerned about risk (Cauffman et al., 2010).","v":"Interpret a study","a":[["Reward [[approach]] peaks in the teens; risk [[avoidance]] matures later","Right. Most driven to approach rewards in teen years; avoidance of risk not until 18+."],["Risk avoidance peaks in the teens; reward approach matures later","Reversed."],["Teens and adults show [[identical]] patterns across the task","Wrong. That’s the point: they differ."],["Teens [[avoid]] both rewards and risks","Wrong. Teens approached rewards."],["Reward approach peaks at [[age 10]], well before adolescence begins","Wrong. It peaks in the teen years."]],"h":"The gas pedal arrives before the brakes."},{"id":"a4q015","s":4,"o":21,"t":"L","sc":"albertc","q":"In ==Albert et al. (2013)=='s driving game, which ==pattern== did lecture’s chart show?","k":"Peer influence: adolescents more oriented to and responsive to peers than children or adults (Albert et al., 2013).","v":"Chart","a":[["Only [[adolescents]] took more risks with [[peers]]","Right. Adolescents: about 46% → 59% risky decisions with peers. Young adults and adults barely changed."],["[[All]] three age groups took more risks when peers watched","Wrong. Only adolescents clearly did."],["[[Adults]] took the most risks with peers","Wrong. Adults barely moved."],["Adolescents took [[fewer]] risks with peers than when alone","Reversed."],["Peers had [[no]] effect on anyone","Wrong. Adolescents changed a lot."]]},{"id":"a4q016","s":4,"o":21,"t":"L","sc":"brain","q":"Which statement about ==brain development== in adolescence is ==accurate==?","k":"White matter (myelination) → linear increase. Grey matter (neurons/synapses) → peak in early adolescence, decrease after → gradually more efficient.","v":"Which is accurate","a":[["[[White]] matter rises [[linearly]]; [[grey]] matter peaks early, then [[declines]]","Right. More myelination every year; grey matter (neurons/synapses) peaks in early adolescence, then is pruned → gradually more efficient."],["White matter [[peaks]] early, then declines; grey matter rises linearly","Swapped."],["Both white and grey matter [[peak]] at 10","Wrong. White matter keeps rising."],["The brain stops changing at about [[age 10]], once it’s adult-sized","Wrong. That was the old belief, overturned by imaging."],["Grey matter [[grows]] steadily into the twenties, like white matter","Wrong. It peaks in early adolescence."]],"h":"White = wiring insulation (more every year). Grey = connections (peak, then prune)."},{"id":"a4q017","s":4,"o":21,"t":"L","sc":"icenoglec","q":"A lawyer argues a ==17-year-old== can’t understand ==legal proceedings== because ==‘teens can’t reason like adults.’== Which evidence ==most directly undercuts== this?","k":"Cognitive development: adult-like by mid–late adolescence (Icenogle et al., 2019). Steinberg: 16–17-year-olds perform like adults in understanding legal proceedings.","v":"Counter-argument","a":[["[[Adult-like]] cognitive capacity by about [[16–17]]","Right. In many ways cognitive skills are adult-like by mid–late adolescence."],["Sensation seeking [[peaks]] in adolescence, then declines","That’s psychosocial, and it doesn’t speak to reasoning."],["Teens take more risks with [[peers]]","True, but not about understanding proceedings."],["Grey matter [[peaks]] in early adolescence, then declines","Not direct evidence about reasoning ability."],["Teens prefer [[smaller]], sooner rewards over later ones","That’s future orientation, not reasoning."]]},{"id":"a4q018","s":4,"o":22,"t":"R","sc":"agebar","q":"Using ==Steinberg & Icenogle’s proposal==, where should the age boundary be for each? ==(1) Consenting to a medical procedure after a calm consultation==; ==(2) Being tried as an adult for a crime committed with friends in the heat of the moment==.","k":"Proposal: ‘cold’ contexts (unhurried, logical reflection) → ~16 (voting, research consent, medical decisions, competence to stand trial). ‘Hot’ contexts (arousal, peers, time pressure) → 18+, perhaps 21 (driving, alcohol, gambling, adult criminal responsibility).","v":"Apply the proposal","a":[["(1) around [[16]] · (2) [[18+]], perhaps 21","Right. ‘Cold’ decisions rely on reasoning (mature ~16). ‘Hot’ ones involve arousal, peers, time pressure (need psychosocial maturity, 18–21)."],["(1) [[18 or older]] · (2) around [[16]]","Swapped."],["Both around [[16]], the age of cognitive maturity","Wrong for (2). Hot contexts need psychosocial maturity."],["Both at [[21]], the old age of majority","Too strict for (1). Cold decisions can be made around 16."],["(1) around [[12]] · (2) around [[16]]","Too young for both."]]},{"id":"a4q019","s":4,"o":22,"t":"R","sc":"agebar","q":"Under Steinberg & Icenogle’s proposal, which decisions are ==‘cold’== (boundary around 16)? ==Check all== that apply.","k":"Cold (~16): voting, research consent, medical decisions, competence as a defendant. Hot (18–21): driving, alcohol, gambling, adult criminal responsibility.","v":"Check all that apply","a":[["[[Voting]]","Belongs.",1],["Consenting to take part in [[research]]","Belongs.",1],["Making [[medical]] decisions","Belongs.",1],["[[Competence]] to stand trial","Belongs.",1],["Buying [[alcohol]]","Impostor. Hot context → 18+, perhaps 21.",0],["[[Driving]] with friends","Impostor. Hot context.",0],["Adult [[criminal responsibility]] for impulsive acts","Impostor. Hot context.",0]],"m":1},{"id":"a4q020","s":4,"o":22,"t":"R","sc":"stats","q":"Icenogle et al. analyzed the ==same cognitive capacity data== three ways: ==ANOVA== said about 14–15, ==piecewise regression== about 15, ==polynomial regression (IROC)== about 19. What’s the ==lesson==?","k":"Three approaches: compare age-group means (ANOVA), polynomial regression (IROC), piecewise regression. They can disagree, so use several.","v":"Lesson","a":[["Different [[methods]] can give [[different]] ages of maturity","Right. Researchers are encouraged to run several analyses and look at them together."],["Polynomial regression is always the [[correct]] method to use","Wrong. No single method was declared correct."],["Cognitive capacity [[never]] matures","Wrong. Two of three methods point to ~15."],["Maturity should be set at the [[average]] of the three","Not what the authors proposed."],["ANOVA is too [[slow]] to use on large samples","Not the point. Its issue is needing large samples at each age."]]},{"id":"a4q021","s":4,"o":22,"t":"R","sc":"armor","q":"How have ==legal age boundaries== mostly been set ==historically==, according to Steinberg & Icenogle?","k":"Historically: intuitive, administrative, fairness, consequentialist. Age of majority 21 (medieval armour) → 18 around 1970; ~90% of nations use 18.","v":"Background","a":[["Mostly [[non-scientifically]]; e.g., 21 traces to [[armour]]","Right. Ages were set intuitively, administratively, or by fairness and consequences. The old age of majority, 21, traces to medieval armour."],["By careful [[brain-imaging]] research on teenagers’ development","Wrong. Neuroscience is recent in these debates."],["By [[IQ]] testing of each new generation of teenagers","Wrong."],["By making [[voting]] age always match the drinking age","Wrong. Ages of majority, license and consent often differ."],["By a [[Supreme Court]] ruling in the 1970s","Wrong. The court cases limited juvenile sentences; they didn’t set the age of majority."]]},{"id":"a4q022","s":4,"o":22,"t":"R","sc":"court","q":"Which ==U.S. Supreme Court== ruling banned the ==death penalty for anyone under 18==?","k":"Thompson (1988) <16 death penalty · Roper (2005) <18 death penalty · Graham (2010) no LWOP for non-homicide <18 · Miller (2012) no mandatory LWOP <18 · Montgomery (2016) Miller retroactive.","v":"Recall in context","a":[["[[Roper]] v. Simmons (2005)","Right."],["[[Thompson]] v. Oklahoma (1988)","Close. Thompson barred it for those under 16."],["[[Graham]] v. Florida (2010)","Wrong. Graham barred life without parole for non-homicide offences under 18."],["[[Miller]] v. Alabama (2012)","Wrong. Miller barred MANDATORY life without parole for under-18s."],["[[Montgomery]] v. Louisiana (2016)","Wrong. Montgomery made Miller retroactive."]],"h":"T-R-G-M-M."},{"id":"a4q023","s":4,"o":22,"t":"R","sc":"agebar","q":"A lawmaker says: ==‘If 16-year-olds are mature enough to vote, they must be mature enough to be sentenced as adults.’== How would Steinberg & Icenogle respond?","k":"Voting at 16 and adult criminal responsibility at 18–21 are consistent under the cold/hot distinction.","v":"Rebut a claim","a":[["Not contradictory: voting is [[cold]], most crime is [[hot]]","Right. Different contexts call on different capacities, so different boundaries are consistent."],["They’d [[agree]]: one age should fit every legal purpose","Wrong. They argue against a single boundary."],["They’d say 16-year-olds shouldn’t be allowed to [[vote]] either","Wrong. They see 16 as reasonable for cold decisions like voting."],["They’d say [[science]] alone should decide","Wrong. Science should inform, not dictate."],["They’d say [[cognitive]] maturity only arrives after age 21","Wrong. Cognitive maturity comes by ~16."]]},{"id":"a4q024","s":4,"o":22,"t":"R","sc":"agebar","q":"Steinberg & Icenogle admit ==societal needs can override science==. Which example fits?","k":"Caveats: societal needs can override (driving and jobs) · cold vs. hot isn’t always clear · individuals vary · a chronological line protects against biased judgments · science informs, not dictates.","v":"Caveat","a":[["A [[driving]] age of 21 would block teen [[employment]]","Right. Driving is hot, but setting it at 21 would keep many teens from getting to work."],["Voting at 16 fits science and [[nobody]] objects","Not an example of society overriding science."],["Brain imaging is too [[expensive]] for courts","Not their example."],["Juries prefer [[psychology]] to neuroscience","Reversed. Laypeople are more persuaded by neuroscience."],["The Supreme Court ignored [[developmental science]] for decades","Wrong. It relied more and more on it."]]},{"id":"a4q025","s":4,"o":22,"t":"R","sc":"agebar","q":"Why might a ==fixed chronological age boundary== actually ==protect== some young people, according to Steinberg & Icenogle?","k":"A chronological boundary protects against biased case-by-case decisions (juries, judges), even though any age line will misclassify some individuals.","v":"Explain","a":[["Case-by-case maturity calls can be [[biased]] (e.g., by [[race]])","Right. Judgments about whether a juvenile is ‘adult-like’ are influenced by factors like race, so a bright line guards against biased decisions."],["A fixed age makes every teenager [[mature]] at exactly the same time","Wrong. Individuals vary."],["Fixed ages are always [[scientifically]] exact","Wrong. They admit any line misclassifies some people."],["Judges [[can’t]] read psychological reports or brain scans accurately","Not their argument."],["It lets courts [[skip]] proportionality in sentencing","Wrong. Proportionality still applies."]]},{"id":"a4q026","s":4,"o":22,"t":"R","sc":"agebar","q":"Which statement about ==legal ages== is ==accurate== according to Steinberg & Icenogle?","k":"Age of majority ≠ age of license ≠ age of consent. Adolescence begins in biology and ends in culture.","v":"Which is accurate","a":[["[[Age of majority]] and [[age of license]] can differ","Right. Age of majority (full adult status) ≠ age of license for a specific activity (e.g., driving, drinking) ≠ age of consent."],["Every country sets the age of majority at [[21]]","Wrong. About 90% use 18."],["Age of majority has [[never]] changed","Wrong. It dropped from 21 to 18 around 1970."],["Adolescence is purely a [[social construction]], not biology","Wrong. ‘Begins in biology and ends in culture.’"],["Science should [[dictate]] exactly where legal lines go","Wrong. Inform, not dictate."]]},{"id":"a4q027","s":4,"o":22,"t":"L","sc":"paradox","q":"Lecture showed a person who ==committed a crime at 16==, was ==tried and punished as an adult==, and is ==now in jail but can’t buy cigarettes because he’s still a minor==. What ==problem== does this case expose?","k":"Adolescence vs. adulthood: When are you an adult? When should the legal system define maturity? The same 16-year-old can be ‘adult’ in court and a ‘minor’ at the store.","v":"What it shows","a":[["The same person is an [[adult]] in court but a [[minor]] at the store","Right. It sets up lecture’s question: when, and how, should the legal system define maturity?"],["Teens’ [[cognitive]] skills are too weak to understand court","Wrong. Cognitive skills are adult-like by mid–late adolescence."],["Smoking laws should be [[abolished]] for anyone serving time in prison","Not the point. The issue is inconsistency in where the law draws the line."],["Jails should sell [[cigarettes]] to every inmate, regardless of age","Not the point."],["Adults are [[less]] culpable than teens","Reversed."]],"n20":1},{"id":"a4q028","s":4,"o":21,"t":"L","sc":"limbic","q":"According to Lecture 20, the ==socioemotional brain system== is made up of ==which regions==, and what ==changes in adolescence==?","k":"Socioemotional system = limbic and paralimbic regions (e.g., amygdala, hippocampus, cingulate, and reward areas). Adolescence: changes in dopamine, reward activation, responses to peers.","v":"Define","a":[["[[Limbic/paralimbic]]; dopamine, reward and [[peer]] responses change","Right. Slide: socioemotional system → limbic and paralimbic regions; in adolescence, changes in dopamine responses and activity, and in neural activation to rewards and responses to peers."],["The [[prefrontal cortex]]; it [[shrinks]] in adolescence","Wrong. The prefrontal cortex is the CONTROL system, and it keeps maturing."],["Limbic regions; [[white matter]] there [[declines]]","Wrong. White matter increases linearly."],["The [[cerebellum]]; it controls [[balance]] and timing during risky play","Wrong. Not the socioemotional system."],["Limbic regions; they are [[fully mature]] by about age 10, like brain size","Wrong. They change dramatically around puberty."]],"n20":1},{"id":"a4q029","s":4,"o":21,"t":"LR","sc":"limbic","q":"Steinberg & Icenogle tie which capacities mainly to the ==prefrontal cortex== (the ==cognitive control== system)? ==Check all== that apply.","k":"Limbic (socioemotional): sensation and reward seeking, ramps up early, around puberty. Prefrontal (control): self-control, impulse regulation, thinking ahead, weighing rewards and costs, resisting peers, still maturing into the mid-twenties.","v":"Check all that apply","a":[["[[Self-control]] and regulating impulses","Belongs.",1],["[[Thinking ahead]]","Belongs.",1],["Weighing the [[rewards and costs]] of a risky act","Belongs.",1],["[[Resisting]] peer pressure","Belongs.",1],["[[Sensation seeking]]","Impostor. Driven by the limbic (socioemotional) system.",0],["[[Reward seeking]]","Impostor. Limbic system.",0]],"m":1,"n20":1},{"id":"a4q030","s":4,"o":21,"t":"L","sc":"stoplight","q":"Researchers scan brains while people play a ==stoplight driving game== (goal: ==reach the end as fast as possible==). ==Angus== (15) plays ==alone==. ==Bane== (15) plays with ==peers watching==. ==Crustin== (25) plays with ==peers watching==. Who should show the ==most prefrontal== activity, and who the ==most socioemotional== activity?","k":"Chein et al. (shown as Chien et al., 2012): LPFC ↑ with age. VS and OFC (socioemotional) ↑ only for adolescents with peers watching.","v":"Two-part","a":[["[[Crustin]]; [[Bane]]","Right. Lateral prefrontal (control) activity was highest in adults. Reward-area (VS, OFC) activity spiked only in adolescents WITH peers."],["[[Angus]]; [[Bane]]","Wrong first. Teens showed LESS prefrontal activity than adults."],["[[Crustin]]; [[Angus]]","Wrong second. Alone, teens’ reward-area activity was low; peers were the trigger."],["[[Bane]]; [[Bane]]","Wrong first. Peers didn’t boost teens’ prefrontal activity."],["[[Angus]]; [[Crustin]]","Wrong both. Teens alone had little prefrontal activity, and adults’ reward areas didn’t spike with peers."]],"h":"Peers turn up the teen reward system; age turns up the control system.","n20":1},{"id":"a4q031","s":4,"o":21,"t":"L","sc":"cheinc","q":"In lecture’s chart, the ==ventral striatum (VS)== and ==orbitofrontal cortex (OFC)== were labelled as the ==socioemotional system==. Which ==pattern== did they show?","k":"VS and OFC (reward/socioemotional) activity rose with peers only in adolescents. LPFC (control) rose with age.","v":"Chart","a":[["A big jump with [[peers]] for [[adolescents]] only","Right. Teens: VS ~0.09 alone vs ~0.37 with peers; OFC ~0 vs ~0.22. Young adults and adults barely changed (or dipped)."],["A big jump with peers for [[adults]] only, not teens","Wrong. Adults didn’t rise with peers."],["Equal jumps with peers for [[every]] age group","Wrong. Only teens showed the jump."],["Higher activity [[alone]] than with peers for teens","Reversed."],["A steady [[rise with age]], like LPFC","Wrong. That’s the LPFC pattern."]],"n20":1},{"id":"a4q032","s":4,"o":21,"t":"L","sc":"cheinc","q":"Which region in the Chein study showed ==more activity in older than younger participants== regardless of whether peers were watching?","k":"Main effect of age → LPFC (older > younger). Age × social context interaction → VS and OFC.","v":"Chart","a":[["The [[lateral prefrontal cortex]] (LPFC)","Right. The main effect of age: LPFC higher in older participants, part of the cognitive control system."],["The [[ventral striatum]] (VS), a reward region","Wrong. VS depended on age AND peers (an interaction), spiking for teens with peers."],["The [[orbitofrontal cortex]] (OFC)","Wrong. OFC also showed the age × peer interaction."],["The [[amygdala]], deep in the limbic system","Not one of the regions on the chart."],["The [[cerebellum]], at the back of the brain","Not on the chart."]],"n20":1},{"id":"a4q033","s":4,"o":21,"t":"L","sc":"stoplight","q":"In the ==stoplight game==, a yellow light appears. If you ==stop==, you lose ==3 seconds==. If you ==go== and make it, you lose ==nothing==; if you ==crash==, you lose ==6 seconds==. What counts as the ==risky decision==, and who made it ==more often with peers watching==?","k":"Stoplight task: GO at yellow = risky (0 s if it works, 6 s if you crash); STOP = safe (3 s). Peers ↑ teen risky decisions and crashes.","v":"Two-part","a":[["[[Going]] through the yellow; [[adolescents]]","Right. Running the light gambles on a payoff against a bigger penalty. Teens took more of these risks with peers (Albert et al., 2013)."],["[[Stopping]] at the yellow; adolescents","Wrong. Stopping is the safe choice."],["Going through the yellow; [[adults]]","Wrong. Adults barely changed with peers."],["Going through the yellow; [[all ages equally]]","Wrong. Only adolescents clearly rose."],["Stopping at the yellow; [[young adults]]","Wrong on both."]],"n20":1},{"id":"a4q034","s":4,"o":21,"t":"L","sc":"imbalc","q":"Lecture’s ==maturational imbalance== chart showed two brain systems from ages 9 to 24. At about what age is ==risky decision-making== predicted to be ==highest==, and why?","k":"Maturational imbalance: socioemotional (reward) system rises fast and peaks in mid-adolescence; cognitive control rises gradually (linear) into the twenties → imbalance → risky decisions?","v":"Chart reasoning","a":[["[[Mid-teens]]: widest [[gap]] between the two systems","Right. The gap between the two lines is biggest around 15–17."],["Age [[9]]: both systems are weakest","Wrong. Both start low, so there’s no imbalance yet."],["Age [[24]]: the control system is strongest by then","Wrong. By then control has overtaken the reward system."],["Age [[21]]: when the two lines cross, risk is greatest","Wrong. Crossing means the imbalance is closing."],["[[No age]]: the systems develop together","Wrong. The point is that they develop on different timetables."]],"n20":1},{"id":"a4q035","s":4,"o":21,"t":"L","sc":"imbalc","q":"A ==10-year-old== has an ==even weaker== control system than a ==16-year-old==. Why does the maturational imbalance model still predict the ==16-year-old== takes ==more== risks?","k":"Risk ∝ imbalance: strong reward drive + still-maturing control. Not just ‘weak control’.","v":"Explain","a":[["At 16 the [[reward]] system has [[surged]]; at 10 it hasn’t","Right. Risk comes from the GAP. At 10 both systems are low; by 16 reward drive has shot up while control lags."],["10-year-olds have more [[white matter]]","Wrong. White matter increases with age."],["16-year-olds have weaker [[cognitive]] skills than 10-year-olds","Wrong. Cognitive skills are near adult levels by 16."],["10-year-olds are more influenced by [[peers]] than teens are","Wrong. Peer sensitivity is highest in adolescence."],["The model actually predicts the [[10-year-old]] takes more risks","Wrong. The model predicts a mid-teen peak."]],"h":"Gas pedal floored, brakes still being built.","n20":1},{"id":"a4q036","s":4,"o":22,"t":"L","sc":"duellc","q":"In ==Duell et al. (2018)==, researchers asked people ==aged 10–30 in 11 countries== about ==antisocial risk-taking==. Which conclusion fits the chart?","k":"Duell et al. (2018): across 11 countries, antisocial risk-taking often rose in adolescence and fell in adulthood, with real cultural variation.","v":"Chart","a":[["Often a [[rise]] then [[fall]] (peak ~18–24), but it [[varies]]","Right. An inverted-U was common, but not universal: some countries (e.g., the US) showed no adolescent rise."],["Every country shows the [[identical]] inverted-U curve","Wrong. Curves differed a lot across countries."],["Risk-taking [[rises steadily]] from 10 to 30 everywhere","Wrong. Most curves fall by the late twenties."],["Risk-taking peaks at [[age 10]] everywhere","Wrong. Many peaked in late adolescence or early adulthood."],["Only [[Western]] countries show any teen peak at all","Wrong. Several non-Western countries showed clear peaks."]],"n20":1},{"id":"a4q037","s":4,"o":22,"t":"L","sc":"boundary","q":"Lecture 20 listed challenges with ==NOT using an age boundary== (assessing each person’s cognitive/psychosocial skills instead). Which were on that list? ==Check all== that apply.","k":"No age boundary (individual testing): time-consuming · infantilizing for people with intellectual and other disabilities · bias in measurement. Age boundary: which age? different circumstances?","v":"Check all that apply","a":[["Very [[time-consuming]] to evaluate each person","Belongs.",1],["[[Infantilizing]] for people with intellectual (and other) disabilities","Belongs.",1],["[[Bias]] in measurement (race, language, etc.)","Belongs.",1],["Figuring out [[which age]] is appropriate","Impostor. That’s a challenge WITH using an age boundary.",0],["Whether some [[circumstances]] call for different treatment","Impostor. Also a challenge WITH an age boundary.",0],["Teens would always [[pass]] the tests","Impostor. Not on the list.",0]],"m":1,"n20":1},{"id":"a4q038","s":4,"o":22,"t":"L","sc":"boundary","q":"A province proposes ==one age, 18, for every legal purpose==: voting, driving, drinking, and adult sentencing. Which ==challenge with using an age boundary== from Lecture 20 does this ignore?","k":"Challenges with an age boundary: figuring out which age is appropriate · are there different circumstances when juveniles should vs. shouldn’t be treated as adults?","v":"Apply","a":[["Different [[circumstances]] may need different treatment","Right. Lecture: are there different circumstances when juveniles should vs. should not be treated as adults? (Steinberg’s cold vs. hot.)"],["Testing each person individually is [[time-consuming]]","Wrong. That’s a challenge with NOT using an age line."],["Testing can be [[biased]] by race or language","Wrong. Also a challenge with individual testing."],["Testing can [[infantilize]] adults with intellectual disabilities","Wrong. Also a challenge with individual testing."],["Teens’ [[cognitive]] skills are too weak for any line","Wrong. Cognitive skills are adult-like by ~16."]],"n20":1},{"id":"a4q039","s":4,"o":22,"t":"L","sc":"boundary","q":"A court replaces age limits with a ==maturity test==. Three problems appear: (A) the test is ==only in English==, so newcomers score low; (B) the ==backlog grows to years==; (C) a ==30-year-old with an intellectual disability== is ruled ‘not an adult’. Match each to Lecture 20’s list.","k":"Individual testing: time-consuming · infantilizing for individuals with intellectual and other disabilities · bias in measurement (race, language, etc.).","v":"Match three","a":[["A: [[bias in measurement]] · B: [[time-consuming]] · C: [[infantilizing]]","Right. Language bias, the cost of evaluating everyone individually, and treating an adult with a disability like a child."],["A: [[infantilizing]] · B: time-consuming · C: bias in measurement","Swapped A and C."],["A: bias in measurement · B: [[which age]] · C: infantilizing","Wrong B. ‘Which age?’ is a problem WITH age lines; this court dropped them."],["A: time-consuming · B: bias in me
