asurement · C: infantilizing","Swapped A and B."],["A: bias · B: time-consuming · C: [[different circumstances]]","Wrong C. That’s an age-boundary challenge."]],"n20":1},{"id":"a4q040","s":4,"o":22,"t":"L","sc":"duellc","q":"Lecture asked: ==‘Teens engage in more risky behaviour. Are there some ways that this is good?’== Which answer draws ==most directly on earlier course content==?","k":"Lecture left it as an open question (and asked whether declining teen risk-taking should make us happy or worried). The play unit gives one lens: manageable risk can build skills.","v":"Connect units","a":[["Like [[risky play]], it may build [[risk assessment]] and confidence","Right. The play unit linked risky play with better risk assessment, self-esteem, and satisfying the need for autonomy. Lecture posed the question; this is one reasonable, course-based answer."],["Risk-taking raises [[IQ]] scores during the adolescent years","Not supported anywhere in the course."],["Risk-taking makes the [[prefrontal]] cortex mature faster than normal","Wrong and not a benefit."],["Risk-taking [[stops]] peer influence from mattering","Not supported."],["Risk-taking guarantees better [[grades]] throughout high school","Not supported."]],"n20":1},{"id":"a4q041","s":4,"o":21,"t":"L","sc":"imbalc","q":"Lecture 20 recapped the ==psychosocial changes== that may feed the ==maturational imbalance → risky decisions==. Which were listed? ==Check all== that apply.","k":"Changes in: self-regulation · future orientation · sensation seeking & reward sensitivity · peer influence → maturational imbalance → risky decisions?","v":"Check all that apply","a":[["[[Self-regulation]]","Belongs.",1],["[[Future orientation]]","Belongs.",1],["[[Sensation seeking]] & reward sensitivity","Belongs.",1],["[[Peer influence]]","Belongs.",1],["[[Logical reasoning]]","Impostor. Cognitive, adult-like by mid-adolescence.",0],["[[Working memory]]","Impostor. Cognitive.",0]],"m":1,"n20":1},{"id":"a4q042","s":4,"o":19,"t":"L","sc":"scales","q":"After reviewing the evidence, lecture returned to ==‘the question’== and asked where ==you== would put the legal boundary of maturity. Which answer is ==most consistent== with the evidence covered?","k":"The question + mitigating factors + development evidence → Steinberg & Icenogle: different boundaries for cold (~16) and hot (18–21) contexts.","v":"Synthesize","a":[["~[[16]] for calm decisions, [[18–21]] for heated ones","Right. Cognitive maturity ~16; psychosocial maturity (self-control under arousal, peer resistance) not until ~21. Matches Steinberg & Icenogle’s proposal."],["One boundary at [[12]], when grey matter peaks","Wrong. Grey matter peaking doesn’t mean maturity."],["One boundary at [[16]] for everything, including adult sentencing","Wrong. Hot contexts like crimes with peers call for later boundaries."],["No boundaries: [[test]] everyone individually","Possible in principle, but lecture listed serious problems: time, infantilizing, bias."],["One boundary at [[25]], when the brain finally stops changing","Not what the evidence suggests for cold decisions, and it ignores societal needs."]],"n20":1}],"T":[{"o":0,"g":"def","t":"Play","d":"Joyful, actively engaging, spontaneous, voluntary, intrinsically motivated activity that is unrelated to immediate survival.","e":"At recess, kids invent a chasing game for no reason other than that it’s fun.","h":"Nobody makes you, nobody pays you, you just want to.","sc":"playdef","x":["Intrinsic motivation"]},{"o":0,"g":"def","t":"Intrinsic motivation","d":"Doing something for its own sake, because the activity itself is rewarding.","e":"Lina keeps drawing for hours even though no one is grading or praising her.","h":"INtrinsic = the reason is INside the activity.","sc":"playdef","x":["Play"]},{"o":0,"g":"stage","t":"Non-social play","d":"Play that does not involve playing alongside or with other children (unoccupied, solitary, onlooker).","e":null,"h":"Before ‘with’, there’s ‘near’.","sc":"stages","x":["Onlooker play","Social play","Solitary play","Unoccupied play"]},{"o":0,"g":"stage","t":"Solitary play","d":"Playing alone, with no attention to what other children nearby are doing.","e":"A toddler stacks rings in the corner, ignoring the kids beside her.","h":"Solo mode.","sc":"stages","x":["Non-social play","Onlooker play","Unoccupied play"]},{"o":0,"g":"stage","t":"Onlooker play","d":"Watching other children play, perhaps talking to them, without joining in.","e":"Theo stands by the sandbox commenting on the castle but never picks up a shovel.","h":"The sports commentator: watching, talking, not playing.","sc":"stages","x":["Non-social play","Solitary play","Unoccupied play"]},{"o":0,"g":"stage","t":"Parallel play","d":"Playing beside another child with similar toys, but with no interaction.","e":"Two toddlers each push their own truck side by side without speaking.","h":"Two treadmills at the gym: same thing, same room, no teamwork.","sc":"stages","x":["Associative play","Cooperative play","Social play"]},{"o":0,"g":"stage","t":"Associative play","d":"Playing with others, sharing and chatting, but with no shared goal or assigned roles.","e":"Kids at the art table trade markers and chat while each draws a separate picture.","h":"A group chat where everyone does their own homework.","sc":"stages","x":["Cooperative play","Parallel play","Social play"]},{"o":0,"g":"stage","t":"Cooperative play","d":"Playing together toward a shared goal with coordinated roles.","e":"Four kids build one fort: two gather cushions, one holds the blanket, one is ‘guard’.","h":"An actual group project where everyone has a job.","sc":"stages","x":["Associative play","Parallel play","Social play"]},{"o":1,"g":"type","t":"Object play","d":"Exploring and using objects to see what they do.","e":"A toddler nests cups and knocks them down again and again.","h":"The THING is the star.","sc":"types"},{"o":1,"g":"type","t":"Guided play","d":"Child-led play that an adult gently supports toward a learning goal.","e":"A teacher sets out ramps and asks ‘what if it’s steeper?’ while kids explore.","h":"Kid drives, adult is the GPS.","sc":"types"},{"o":1,"g":"type","t":"Physical play","d":"Whole-body active play; lecture’s example was rough-and-tumble play.","e":"Two cousins laugh as they play-wrestle on the grass.","h":"Puppies wrestling.","sc":"types","x":["Risky play","Rough-and-tumble play"]},{"o":3,"g":"pretend","t":"Pretend play","d":"Play in which we act ‘as-if’ and engage in make-believe; begins around 18–25 months.","e":"A two-year-old ‘feeds’ her teddy with an empty spoon.","h":"Two magic words: AS-IF.","sc":"pretend","x":["Sociodramatic play","Symbolic thought"]},{"o":3,"g":"pretend","t":"Symbolic thought","d":"The ability to have a symbol represent something other than itself.","e":"A child holds a banana to his ear as a phone.","h":"Banana = phone. Stick = sword. Word ‘dog’ = dog.","sc":"pretend","x":["Pretend play","Sociodramatic play"]},{"o":3,"g":"pretend","t":"Sociodramatic play","d":"Pretend play with others, acting out roles in a shared story; what simple pretend develops into.","e":"Three kids run a pretend clinic as doctor, nurse and patient.","h":"Socio (people) + dramatic (acting).","sc":"sociodrama","x":["Pretend play","Symbolic thought"]},{"o":3,"g":"pretend","t":"Batman effect","d":"Children persevere longer and regulate emotions better when they take on a character and think about a hard task as that character.","e":"Dressed as a superhero, Omar sticks with a boring task far longer than usual.","h":"‘What would Batman do?’ Not quit.","sc":"batman","x":["Self-distancing"]},{"o":3,"g":"pretend","t":"Self-distancing","d":"Stepping back to view your own situation from the outside; the proposed mechanism of the Batman effect.","e":"A child asks herself, ‘Is Elsa working hard?’ instead of ‘Am I working hard?’","h":"It’s easier to advise a friend than yourself. Become the friend.","sc":"batman","x":["Batman effect"]},{"o":3,"g":"pretend","t":"Candy Witch finding","d":"66% of children believed a made-up ‘Candy Witch’ was real; belief was highest in OLDER children who were visited by her.","e":null,"h":"Older + ‘evidence’ (a visit) = more belief. Counterintuitive, so testable.","sc":"witch"},{"o":4,"g":"risky","t":"Risky play","d":"Thrilling and exciting forms of physical play that involve uncertainty and a risk of physical injury.","e":"A seven-year-old climbs higher in a tree than she ever has before, heart pounding.","h":"Thrill + uncertainty + could-get-hurt.","sc":"risky","x":["Physical play","Play at high speeds","Play near elements","Play with a chance of getting lost","Play with heights","Play with tools","Rough-and-tumble play"]},{"o":4,"g":"risky","t":"Play with heights","d":"Risky play involving climbing or jumping from high places.","e":"Climbing to the top of the tallest playground tower.","h":"One of lecture’s six kinds of risky play: heights, high speeds, tools, elements, getting lost, rough and tumble.","sc":"risky","x":["Play near elements","Play with a chance of getting lost","Risky play"]},{"o":4,"g":"risky","t":"Play near elements","d":"Risky play near things in the environment that could harm, like fire or deep water.","e":"Poking a campfire with a stick; playing at the edge of a pond.","h":"Elements = environment. Tools = in your hand.","sc":"risky","x":["Play with a chance of getting lost","Play with heights","Risky play"]},{"o":4,"g":"risky","t":"Play with a chance of getting lost","d":"Risky play in which children explore out of adults’ sight and could lose their way.","e":"Wandering through the woods behind the school with no adult watching.","h":"Out of sight, on your own.","sc":"risky","x":["Play near elements","Play with heights","Risky play"]},{"o":0,"g":"stage","t":"Unoccupied play","d":"Behaviour that seems random and without a specific goal; the least common form of play.","e":"A toddler wanders the room, briefly touching things, not really doing anything in particular.","h":"Not occupied with anything yet.","sc":"stages","x":["Non-social play","Onlooker play","Solitary play"]},{"o":4,"g":"risky","t":"Rough-and-tumble play","d":"Play fighting, wrestling and chasing; an example of physical play and a kind of risky play.","e":"Siblings wrestling and laughing on the living-room floor.","h":"Shows up on BOTH lists: physical play and risky play.","sc":"risky","x":["Physical play","Risky play"]},{"o":5,"g":"outdoor","t":"Outdoor play","d":"Unstructured play that takes place outside.","e":"Kids roam the backyard making up games with whatever they find.","h":"Soccer practice is outside but structured, so it doesn’t count.","sc":"outdoor","x":["Nature play"]},{"o":5,"g":"outdoor","t":"Nature play","d":"Play in a natural environment and/or with natural elements or materials (water, mud, sticks, leaves, rocks).","e":"Making ‘soup’ from mud and leaves, even on a paved patio.","h":"The ‘and/or’ matters: natural PLACE or natural STUFF.","sc":"outdoor","x":["Outdoor play"]},{"o":5,"g":"outdoor","t":"Buffer to stress","d":"Something that softens the impact of stress; nearby nature may act as one (Wells & Evans, 2003).","e":"Two kids face the same family stress; the one with green space nearby copes better.","h":"Doesn’t remove the storm, just hands you an umbrella.","sc":"greenbuffer"},{"o":5,"g":"outdoor","t":"Cognitive restoration","d":"Recovery from attentional fatigue, which natural outdoor settings promote (Ramsden et al.).","e":"After recess in a green yard, students can focus again.","h":"Nature = phone charger for your attention.","sc":"greenbuffer"},{"o":6,"g":"ramsden","t":"Developmental vulnerability","d":"Scoring as vulnerable on one or more of the EDI’s five domains at kindergarten; the outcome in Ramsden et al.","e":null,"h":"32.9% of children were vulnerable on 1+ domains.","sc":"edi5"},{"o":6,"g":"ramsden","t":"CHEQ","d":"Childhood Experiences Questionnaire: caregiver report of a child’s experiences in the six months before kindergarten.","e":null,"h":"Parents ‘CHEQ-ing in’ on home life.","sc":"ramsden"},{"o":6,"g":"ramsden","t":"EDI","d":"Early Development Instrument: teacher ratings of kindergarten children across five developmental domains.","e":null,"h":"Teachers rate; five domains: Physical, Social, Emotional, Language & cognitive, Communication.","sc":"edi5"},{"o":6,"g":"ramsden","t":"Displacement","d":"Screen time replacing time that would otherwise go to active play, connection with caregivers and peers, and sleep.","e":"An hour of tablet time after daycare means an hour not spent playing outside.","h":"A day is a pie. Bigger screen slice, smaller play slice.","sc":"displace","x":["Dose-response"]},{"o":6,"g":"ramsden","t":"Dose-response","d":"A pattern in which more of an exposure goes with more of an outcome.","e":"Each step up in daily screen time went with higher odds of vulnerability.","h":"Bigger dose, bigger effect.","sc":"three","x":["Displacement"]},{"o":6,"g":"ramsden","t":"Adjusted odds ratio","d":"A measure of association after accounting for confounders: 1 = no link, below 1 = lower odds, above 1 = higher odds.","e":null,"h":"1.0 is the middle of the seesaw. 0.92 tips safer; 1.38 tips riskier.","sc":"oddsdial"},{"o":6,"g":"ramsden","t":"Residual confounding","d":"Unmeasured factors that could still explain an association even after statistical adjustment.","e":"Parenting style might drive both screen use and vulnerability.","h":"The confounders you DIDN’T measure.","sc":"corr","x":["Confound"]},{"o":6,"g":"ramsden","t":"Social desirability bias","d":"Answering in a way that makes you look good, which distorts self- or caregiver reports.","e":"A parent under-reports their child’s daily screen time.","h":"Would you admit to 4 hours of iPad?","sc":"ramsden"},{"o":7,"g":"apply","t":"Generalizability","d":"Whether findings from one sample hold for other people, places and cultures.","e":"Results from BC kindergarteners may not apply to children elsewhere.","h":"Does it travel?","sc":"barriers","x":["External validity"]},{"o":7,"g":"apply","t":"Ethics of responsibility","d":"The concern about confidently applying or promoting findings that are only correlational.","e":"Promising parents that more pretend play WILL raise self-control.","h":"Don’t write cheques the data can’t cash.","sc":"barriers"},{"o":9,"g":"teach","t":"Pygmalion effect","d":"Teachers’ expectations for students shape students’ actual performance (a self-fulfilling prophecy).","e":"Students randomly labelled ‘bloomers’ ended up gaining more than classmates.","h":"Treat a kid like a star and they start to shine.","sc":"pygmalion"},{"o":9,"g":"teach","t":"\"Bloomers\"","d":"Students in Rosenthal & Jacobson (1968) whom teachers were told would show intellectual growth; actually chosen at random.","e":null,"h":"Random label, real results.","sc":"pygmalion"},{"o":10,"g":"work","t":"Academic work","d":"What is being taught in the classroom and what students are asked to learn and do.","e":null,"h":"Best when interesting, meaningful and at an appropriate level.","sc":"curriculum"},{"o":11,"g":"sel","t":"Social-emotional learning (SEL)","d":"Schooling that goes beyond reading, writing and arithmetic to teach social and emotional skills.","e":"A weekly class lesson on naming feelings and solving conflicts.","h":"The 3 Rs plus Relationships.","sc":"sel"},{"o":11,"g":"sel","t":"Positive peer reporting (tootling)","d":"An SEL practice in which students notice and report positive things classmates do.","e":"‘Thank you for lending me your pencil.’ ‘I like that you included me.’","h":"The opposite of tattling.","sc":"tootle"},{"o":11,"g":"sel","t":"PATHS","d":"An SEL program named in lecture as an example alongside positive peer reporting.","e":null,"h":"PATHS + tootling = lecture’s two SEL examples.","sc":"sel"},{"o":12,"g":"active","t":"Active learning","d":"Learning that engages students in doing and thinking, not just receiving.","e":"Students test paper bridges instead of copying notes about bridges.","h":"Minds-on beats sit-and-listen.","sc":"pillars5","x":["Embodied learning","Iterative learning"]},{"o":12,"g":"active","t":"Iterative learning","d":"Learning through repeated attempts with feedback.","e":"Build, test, see it fail, rebuild.","h":"Do it again, but better.","sc":"pillars5","x":["Active learning","Embodied learning"]},{"o":12,"g":"active","t":"Embodied learning","d":"Learning through bodily, physical experience of a concept.","e":"Standing farther from the basket for a bigger fraction in Fraction Ball.","h":"Your BODY does the maths.","sc":"fball","x":["Active learning","Iterative learning"]},{"o":13,"g":"fb","t":"Fraction Ball","d":"A set of games on a basketball court re-lined so shots are worth fractions and decimals, tallied on a number line.","e":null,"h":"The court is a number line you can stand on.","sc":"fball"},{"o":13,"g":"fb","t":"Rational numbers","d":"Fractions and decimals; notoriously hard for children and a gatekeeper to later maths.","e":null,"h":"‘What is .4 as a fraction?’","sc":"numline"},{"o":13,"g":"fb","t":"Whole number bias","d":"Wrongly applying whole-number rules to fractions and decimals.","e":"Thinking .274 is bigger than .83 because 274 is bigger than 83.","h":"‘More digits = bigger’ betrays you after the decimal point.","sc":"numline"},{"o":13,"g":"fb","t":"Near transfer","d":"Improvement on numbers and skills that were directly presented in the game.","e":"Placing 1/4 or .25 on a number line after playing on a court marked in fourths.","h":"Same neighbourhood as what you practised.","sc":"fresult"},{"o":13,"g":"fb","t":"Far transfer","d":"Improvement on numbers or skills that were not presented in the game.","e":"Placing 5/10 or .80 on a number line when the court never showed them.","h":"A whole different town.","sc":"fresult"},{"o":13,"g":"fb","t":"Ghost Number Line","d":"A chalk number line from 0 to 5 with no markings, added to Fraction Ball to train estimation.","e":null,"h":"The tick marks are invisible; you picture them.","sc":"ghost"},{"o":13,"g":"fb","t":"Random assignment","d":"Placing participants into conditions by chance so groups are equal at the start; allows causal claims.","e":"Half of each class drawn at random to play Fraction Ball, half to regular PE.","h":"A coin flip makes the groups twins.","sc":"fdesign"},{"o":13,"g":"fb","t":"External validity","d":"How well a study’s results apply beyond its own sample and setting.","e":"Fraction Ball was tested at one school with teachers facilitating.","h":"Internal = did it really work HERE? External = would it work ELSEWHERE?","sc":"fdesign","x":["Generalizability"]},{"o":14,"g":"goal","t":"Mastery goals","d":"Achievement goals focused on developing competence, learning, understanding and improvement.","e":"‘I want to really understand how this works.’","h":"Competing with yesterday’s you.","sc":"goals","x":["TARGETS"]},{"o":14,"g":"goal","t":"Performance (relative ability) goals","d":"Achievement goals focused on being superior, besting others, or avoiding looking poor compared with others.","e":"‘I want the top mark’ or ‘I don’t want to look dumb next to everyone.’","h":"Competing with the person beside you.","sc":"goals"},{"o":14,"g":"goal","t":"TARGETS","d":"Classroom features that shape achievement goals: Task, Authority, Recognition, Grouping, Evaluation, Time, Social relations.","e":null,"h":"Seven dials a teacher can turn toward mastery or performance.","sc":"targets","x":["Mastery goals"]},{"o":15,"g":"org","t":"Stage–environment fit","d":"The match between a person’s developmental needs and what their environment provides; poor fit harms adjustment.","e":"Teens need autonomy, but middle school adds teacher control and comparison.","h":"Right when teens want the wheel, school takes it away.","sc":"fit","x":["Developmental mismatch","Person–environment fit"]},{"o":15,"g":"org","t":"Developmental mismatch","d":"When a school environment clashes with students’ developmental stage, as in middle/high schools or early start times.","e":"A 7:50 a.m. bell for teenagers whose body clocks run late.","h":"Square peg, round hole.","sc":"fit","x":["Person–environment fit","Stage–environment fit"]},{"o":15,"g":"org","t":"School transition","d":"Moving from one school to the next; linked with dips in motivation, interest in school and confidence.","e":"Starting middle school in Grade 6.","h":"Every move costs something.","sc":"transitions"},{"o":15,"g":"org","t":"Summer learning loss","d":"The decrease in academic performance over summer break, possibly greater for low-income families.","e":null,"h":"Use it or lose it.","sc":"summer","x":["Balanced calendar"]},{"o":15,"g":"org","t":"Confound","d":"A factor tangled up with the variable of interest that could explain the result instead.","e":"Private schools are also smaller and serve higher-SES families.","h":"It’s not the school, it’s who walks in.","sc":"private","x":["Residual confounding"]},{"o":16,"g":"track","t":"Ability tracking","d":"Separating students into different classes based on ability level.","e":"A school sorts Grade 8 students into advanced, regular and basic maths.","h":"Sorting hats for maths class.","sc":"tracks"},{"o":16,"g":"track","t":"Person–environment fit","d":"The idea that people do best when the setting matches their needs; one argument for tracking.","e":null,"h":"Teach each kid at their level… in theory.","sc":"tracks","x":["Developmental mismatch","Stage–environment fit"]},{"o":17,"g":"div","t":"School ethnic diversity","d":"How mixed a school’s student body is; linked to fewer negative stereotypes (majority) and more safety, less loneliness, higher self-worth (minority).","e":null,"h":"Less ‘us vs them’, less ‘only one’.","sc":"diversity"},{"o":18,"g":"leer","t":"Diversity ideology","d":"A lay perspective on how institutions should handle diversity, e.g., color-evasive or multicultural.","e":null,"h":"Evade it or embrace it.","sc":"wordsact","x":["Color-evasiveness","Multiculturalism"]},{"o":18,"g":"leer","t":"Color-evasiveness","d":"Downplaying or ignoring racial/ethnic group differences and emphasizing individual uniqueness.","e":"‘We don’t see race here, we just see students.’","h":"Evasive = dodging the topic.","sc":"wordsact","x":["Assimilation","Diversity ideology","Multiculturalism"]},{"o":18,"g":"leer","t":"Multiculturalism","d":"Recognizing and valuing social group differences.","e":"A school celebrates students’ varied cultural backgrounds in curriculum and events.","h":"Differences are seen, named and valued.","sc":"wordsact","x":["Color-evasiveness","Diversity ideology"]},{"o":18,"g":"leer","t":"Diversity dishonesty","d":"A mismatch between what an organization says and what it does about diversity.","e":"A website says ‘we celebrate diversity’ while suspension gaps go unaddressed.","h":"A poster, not a practice.","sc":"mission"},{"o":18,"g":"leer","t":"Racialized discipline gap","d":"The excess risk of suspension or expulsion for Students of Color compared with White students.","e":null,"h":"One of Leer’s ‘walk the talk’ checks.","sc":"leermod"},{"o":18,"g":"leer","t":"Moderator","d":"A variable that changes the strength or direction of a relationship between two others.","e":"A diversity statement’s link to distress depended on how diverse the school was.","h":"‘It depends on…’ = moderator.","sc":"leermod"},{"o":18,"g":"leer","t":"Psychological distress","d":"Leer et al.’s mental health outcome: recent feelings such as hopelessness, measured with a six-item scale.","e":null,"h":"Went UP for Youth of Color in schools with pro-diversity statements.","sc":"mission"},{"o":20,"g":"law","t":"Penal proportionality","d":"The severity of punishment should be determined by the harm caused and by the culpability of the person causing it.","e":"Two people cause the same harm, but the coerced one gets a lighter sentence.","h":"Two pans: how BAD was it, how BLAMEWORTHY are you.","sc":"scales","x":["Culpability","Mitigation"]},{"o":20,"g":"law","t":"Culpability","d":"Blameworthiness: how responsible a person is for the harm they caused.","e":null,"h":"Culprit → culpable.","sc":"scales","x":["Mitigation","Penal proportionality"]},{"o":20,"g":"law","t":"Excuse","d":"Something that removes criminal responsibility entirely.","e":null,"h":"100% off.","sc":"scales","x":["Mitigating factors"]},{"o":20,"g":"law","t":"Mitigation","d":"A lessening of criminal responsibility and of punishment.","e":"A sentence is reduced because the offender acted under threat.","h":"A discount, not a free pass.","sc":"scales","x":["Culpability","Mitigating factors","Penal proportionality"]},{"o":21,"g":"psy","t":"Cognitive capacity","d":"Abilities that support reasoned, deliberate decision making (working memory, logical reasoning); adult-like by about 16.","e":null,"h":"The thinking is ready early.","sc":"coldhot","x":["Cold cognition"]},{"o":21,"g":"psy","t":"Psychosocial maturity","d":"Capacities such as self-regulation, future orientation and resistance to peers; still developing to at least 21.","e":null,"h":"The brakes come late.","sc":"coldhot","x":["Maturational imbalance (dual systems)","Maturity gap","Self-regulation"]},{"o":21,"g":"psy","t":"Self-regulation","d":"The ability to control impulses; improves gradually throughout adolescence.","e":"Pausing to plan before the first move on a puzzle.","h":"‘Hmm, wait…’ instead of grabbing.","sc":"tower","x":["Maturational imbalance (dual systems)","Maturity gap","Psychosocial maturity"]},{"o":21,"g":"psy","t":"Future orientation","d":"The ability to think about and weigh long-term consequences.","e":"Choosing $1,000 in a year over $400 tomorrow.","h":"Seeing past this weekend.","sc":"money","x":["Temporal discounting"]},{"o":21,"g":"psy","t":"Temporal discounting","d":"Valuing a reward less the longer you have to wait for it; stronger in adolescents.","e":"A teen grabs the small reward now over a larger one later.","h":"Later rewards look smaller than they are.","sc":"money","x":["Future orientation"]},{"o":21,"g":"psy","t":"Sensation seeking","d":"The drive to seek out new and exciting experiences; peaks in adolescence.","e":"A 16-year-old is drawn to the fastest, scariest ride.","h":"Peaks in the teens, then declines.","sc":"igt","x":["Reward sensitivity","Socioemotional system"]},{"o":21,"g":"psy","t":"Reward sensitivity","d":"How strongly rewards drive behaviour; adolescents are driven more by reward and less by risk.","e":null,"h":"Gas pedal floored, brakes soft.","sc":"igt","x":["Sensation seeking","Socioemotional system"]},{"o":21,"g":"brain","t":"White matter","d":"Myelinated connections in the brain; increases linearly across adolescence.","e":null,"h":"White = Wiring. More insulation every year.","sc":"brain"},{"o":21,"g":"brain","t":"Grey matter","d":"Neurons and synapses; peaks in early adolescence, then decreases (pruning).","e":null,"h":"Grey = Garden. Overgrow, then prune.","sc":"brain"},{"o":21,"g":"brain","t":"Maturational imbalance (dual systems)","d":"The reward system changes early (puberty) while the cognitive control system matures slowly into the mid-twenties.","e":null,"h":"Sports car engine, bicycle brakes.","sc":"dual","x":["Maturity gap","Psychosocial maturity","Self-regulation"]},{"o":21,"g":"brain","t":"Prefrontal cortex","d":"Brain region mainly responsible for self-control, planning and weighing costs and rewards.","e":null,"h":"The ‘let’s think about this’ part.","sc":"dual","x":["Cognitive control system","Lateral prefrontal cortex (LPFC)"]},{"o":21,"g":"brain","t":"Limbic system","d":"Brain system mainly responsible for the adolescent rise in sensation seeking and reward seeking.","e":null,"h":"The ‘let’s GO’ part.","sc":"dual","x":["Socioemotional system"]},{"o":22,"g":"age","t":"Cold cognition","d":"Decision making that allows unhurried, logical reflection without emotional arousal; mature by about 16.","e":"Deciding how to vote after reading about the candidates at home.","h":"Slow, calm, time to think.","sc":"coldhot","x":["Cognitive capacity"]},{"o":22,"g":"age","t":"Hot context","d":"A decision made under emotional arousal, time pressure or peer presence, where self-regulation is needed.","e":"Deciding whether to race a friend’s car at midnight.","h":"Fast, fired up, friends watching.","sc":"coldhot"},{"o":22,"g":"age","t":"Age of majority","d":"The age at which a person is recognized as a legal adult overall; 18 in about 90% of nations.","e":null,"h":"Historically 21, from medieval armor.","sc":"armor"},{"o":22,"g":"age","t":"Age of license","d":"The age at which a person is permitted to do something specific, such as drive or buy alcohol.","e":"Driving at 16, drinking at 21 in the U.S.","h":"A permit for ONE thing.","sc":"armor"},{"o":22,"g":"age","t":"Social redefinition","d":"A society’s process of deciding who is ready for the rights and responsibilities of adulthood.","e":null,"h":"From ‘minor’ to ‘adult’ on paper.","sc":"rock"},{"o":22,"g":"age","t":"Maturity gap","d":"The lag between cognitive maturity (about 16) and psychosocial maturity (at least 21): as much as five years.","e":null,"h":"16 + 5 = 21.","sc":"agebar","x":["Maturational imbalance (dual systems)","Psychosocial maturity","Self-regulation"]},{"o":0,"g":"stage","t":"Social play","d":"Play alongside or with other children. On lecture’s table it covers parallel, associative and cooperative play.","e":null,"h":"Beside → with → together.","sc":"stagetab","x":["Associative play","Cooperative play","Non-social play","Parallel play"]},{"o":4,"g":"risky","t":"Play at high speeds","d":"Risky play where the thrill comes from going fast.","e":"Racing a bike as fast as possible down a steep hill.","h":"One of lecture’s six kinds of risky play.","sc":"risk6","x":["Risky play"]},{"o":4,"g":"risky","t":"Play with tools","d":"Risky play that involves using tools that could cause injury.","e":"Whittling a stick with a pocketknife.","h":"One of lecture’s six kinds of risky play.","sc":"risk6","x":["Risky play"]},{"o":8,"g":"why","t":"Assimilation","d":"Using schooling to bring children into one dominant national culture and identity.","e":"A government makes school compulsory so all children learn one official language.","h":"Lecture paired it with national identity as a reason schools exist.","sc":"whyschool","x":["Color-evasiveness"]},{"o":15,"g":"org","t":"Balanced calendar","d":"A year-round school calendar that spreads the long summer break into shorter breaks across the year.","e":null,"h":"Same school days, spread out. Lecture’s answer to ‘year-round school?’","sc":"summer","x":["Summer learning loss"]},{"o":20,"g":"law","t":"Mitigating factors","d":"Features of a person or situation that lessen criminal responsibility: impaired decision making, compelling external circumstances, or an act that is out of character.","e":null,"h":"Three ways blame can shrink.","sc":"mitig","x":["Excuse","Mitigation"]},{"o":21,"g":"brain","t":"Socioemotional system","d":"The brain system for reward, emotion and social processing (limbic and paralimbic regions). In adolescence its dopamine responses, reward activation and responses to peers change.","e":"A 15-year-old’s reward areas light up when friends are watching.","h":"The gas pedal.","sc":"limbic","x":["Limbic system","Reward sensitivity","Sensation seeking"]},{"o":21,"g":"brain","t":"Cognitive control system","d":"The brain system for self-control, planning and weighing costs, centred on the prefrontal cortex. It matures gradually into the twenties.","e":"An adult holds back from running a yellow light even with friends cheering.","h":"The brakes.","sc":"imbalc","x":["Lateral prefrontal cortex (LPFC)","Prefrontal cortex"]},{"o":21,"g":"brain","t":"Ventral striatum (VS)","d":"A reward region in the socioemotional system. In Chein et al., its activity jumped for adolescents when peers watched, but not for adults.","e":null,"h":"VS = very sensitive (to rewards, for teens with peers).","sc":"cheinc","x":["Orbitofrontal cortex (OFC)"]},{"o":21,"g":"brain","t":"Orbitofrontal cortex (OFC)","d":"A region lecture grouped with the socioemotional system. In Chein et al., it rose for adolescents with peers watching.","e":null,"h":"OFC: on fire with company (for teens).","sc":"cheinc","x":["Ventral striatum (VS)"]},{"o":21,"g":"brain","t":"Lateral prefrontal cortex (LPFC)","d":"A control-system region. In Chein et al., its activity was higher in older participants, regardless of peers.","e":null,"h":"LPFC: later = more.","sc":"cheinc","x":["Cognitive control system","Prefrontal cortex"]},{"o":21,"g":"brain","t":"Dopamine","d":"A brain chemical tied to reward. Lecture: in adolescence there are changes in dopamine responses and activity in the socioemotional system.","e":null,"h":"The reward signal turns up in the teens.","sc":"limbic"},{"o":21,"g":"psy","t":"Stoplight driving task","d":"A timed driving game: at each yellow light, stop (lose 3 s) or go (lose 0 s, or 6 s if you crash). Used by Albert et al. (2013) and Chein et al. to study peer effects on teen risk-taking.","e":"Running yellow lights more often when friends are watching.","h":"Yellow light = risky choice.","sc":"stoplight"},{"o":22,"g":"age","t":"Individualized maturity assessment","d":"Judging each person’s cognitive and psychosocial skills instead of using an age line. Problems: very time-consuming, infantilizing for people with intellectual and other disabilities, and biased measurement (race, language).","e":null,"h":"Slow, infantilizing, biased.","sc":"boundary"}],"L":[],"R":[{"id":"ramsden","o":6,"short":"Ramsden, Gill & Brussoni (2026)","cite":"Associations between early childhood experiences in outdoor play, risky play and screen time, and children’s developmental health outcomes in kindergarten in British Columbia. Early Human Development.","kind":"Research article · longitudinal, correlational","one":"More chances for risky play → lower odds of being developmentally vulnerable in kindergarten. More screen time → higher odds, in every domain. Outdoor play frequency → no overall link, but helped in two domains.","rows":[["Background","Starting primary school is a high-stakes transition; how children begin often sets up later advantages and opportunity gaps. Children now play outdoors less (urbanization, safety concerns, screens) and supervision has become risk-averse."],["Question","Are early outdoor play, risky play and screen time (in the 6 months before kindergarten) associated with developmental vulnerability in kindergarten?"],["Who","4,968 children (about 51% boys, mean age about 5.5) entering kindergarten in British Columbia in 2023 and 2024; 343 schools in 23 districts."],["Method","Two linked questionnaires. CHEQ: caregivers (mostly mothers) report outdoor play frequency, chance for risky play, and daily screen time. EDI: kindergarten teachers rate each child in February across 5 domains. Outcome = vulnerable on 1+ domains. Logistic regression adjusting for sex, birthplace, income, marital status, siblings, urban/rural."],["The 5 EDI domains","Physical health & well-being · Social competence · Emotional maturity · Language & cognitive development · Communication skills & general knowledge."],["Results","32.9% vulnerable on 1+ domains. Risky play: aOR 0.92, reduced overall vulnerability (and in 4 domains: all but emotional maturity). Screen time: aOR 1.38, increased overall and in ALL 5 domains (dose-response). Outdoor play: not linked overall; reduced vulnerability in physical health & well-being and communication & general knowledge."],["Family factors (from the tables)","Boys had nearly three times the odds of girls (aOR about 2.8 in all three models; 65.6% of vulnerable children were boys). Lower income raised the odds step by step (under $20,000: about 2.6 to 2.7 times the odds of over $200,000). Single/separated/widowed/divorced households: about 1.4 to 1.5 times. One sibling vs. none: about 0.75. Urban vs. rural and birthplace: no difference. Careful: one sentence in the Results text says ‘being female’, which contradicts every table."],["Why (authors' ideas)","Risky play builds self-regulation, social negotiation and motor skill, and gives exposure to manageable fear. Outdoor benefits are domain-specific, so QUALITY (challenge, autonomy, social context) may matter more than minutes. Screens DISPLACE play, connection and sleep."],["Implications","Limit early screen time (guideline: under 1 h/day for under-fives; over 75% exceed it). Expand thrilling, challenging outdoor play. Treat risk and challenge as metrics, not just minutes per day. Build into early learning frameworks, child-care licensing and national guidelines. Give children time, space and freedom. Supports should be universal but proportionate to need."],["Strengths","Longitudinal linkage of parent-reported experiences with teacher-rated outcomes (two informants); large population sample; domain-level analysis."],["Limitations","Parental self-selection and modest CHEQ participation (44%, 36%) limit generalizability. Caregiver reports: recall or social desirability bias. No data on screen content/context or the quality of outdoor play. Residual confounding (parenting style, temperament, child care, neighbourhood). Observational, so not causal."]],"traps":["Outdoor play was NOT linked with overall vulnerability. Risky play was.","Parents reported the exposures; TEACHERS rated the outcome.","Longitudinal does not mean causal."]},{"id":"bustamante","o":13,"short":"Bustamante et al. (2022)","cite":"Fraction Ball: Playful and physically active fraction and decimal learning. Journal of Educational Psychology.","kind":"Research article · randomized experiment (pretest–posttest)","one":"Playing Fraction Ball in PE improved Grade 4–6 students’ rational-number scores compared with regular PE, especially converting between fractions and decimals.","rows":[["Background","Children (and adults) struggle with fractions and decimals, which gatekeep later maths. Children learn best in active, meaningful, engaged, socially interactive settings, so play is an ideal context."],["What is Fraction Ball?","A basketball court re-lined as a number line: arcs farther from the basket are worth larger fractions/decimals (fourths at one end, thirds at the other), with fractions and decimals shown side by side. A number-line scoreboard runs along the sideline. Roles: shooter, rebounder (calls the value), counter (walks the number line). Co-designed with teachers."],["Research ideas behind it","Number lines (linear, not circular) · whole number bias (e.g., thinking .274 > .83) · learning by comparing representations · embodied cognition · playful learning."],["Question","Does playing Fraction Ball improve rational-number learning? Does it transfer to near and far items? Does it depend on grade, gender or prior knowledge?"],["Who","One school in Santa Ana, California serving mostly low-income Latino students. Pilot: 69 students (Grades 5–6). Efficacy: 160 students (Grades 4–6)."],["Method","Students randomly assigned within classrooms to Fraction Ball during PE or regular PE (control). Both groups kept regular maths instruction. Pretest and posttest of fraction and decimal skills (timed and untimed; near- and far-transfer items). Pilot: 4 games, 4 periods. Efficacy: 6 games, 6 periods, preregistered."],["Revisions after the pilot","Students say the maths out loud; debriefing after rounds; new components (Ghost Number Line, Supercharge Points, ‘Who goes first?’); more sessions."],["Results","Pilot: only converting fractions to decimals improved. Efficacy: overall composite up about 0.4 SD (moderate to large); near transfer improved; biggest gains in converting between fractions and decimals. NOT significant: far transfer, number line estimation, fraction/decimal addition. No moderation by grade, gender or prior knowledge."],["Why conversions?","Learning from comparison: fractions and decimals appear side by side on the court and scoreboard."],["Implications","Low-cost and highly scalable (chalk or paint on any court; free materials). Schoolyards can host play-based learning. A model of researcher–teacher co-design and iterative improvement."],["Limitations","Limited external validity (one school; teachers facilitating). A supplement, not a substitute, for maths instruction. Didn’t isolate which components work. Researcher-designed measures; no delayed posttest; no significant far transfer."]],"traps":["It IS an experiment (random assignment), so causal claims are fair.","Far transfer did NOT improve significantly.","The control group did regular PE, not extra maths."]},{"id":"leer","o":18,"short":"Leer, Gaither & Gassman-Pines (2025)","cite":"It’s not what you say it’s what you do: School diversity ideologies and adolescent mental health and academic engagement. Journal of Research on Adolescence.","kind":"Research article · correlational (survey + administrative data)","one":"A school saying it values diversity is not enough. Where pro-diversity statements weren’t matched by action, they did not raise achievement and were linked with MORE psychological distress, especially for Youth of Color in majority-White schools.","rows":[["Background","Two diversity ideologies: color-evasive (downplay group differences) vs. multicultural (recognize and value them). Prior research: valuing diversity supports belonging, health and engagement; ignoring differences harms minoritized youth. Adolescents are especially sensitive (identity formation, sensitivity to exclusion, need for authenticity). Workplace research on ‘diversity dishonesty’ shows a say–do mismatch hurts."],["Questions","(1) How does explicitly valuing diversity relate to adolescents’ school belonging, mental health and achievement? (2) Does it depend on student diversity, teacher diversity, racial discipline gaps, and racial gaps in Gifted & Talented placement?"],["Hypothesis","Pro-diversity statements would be linked with better outcomes, especially for Youth of Color, and especially in schools that were diverse and equitable."],["Who","Grade 5–8 students in North Carolina public schools, 2014–15. Survey sample (Project RAISE): N = 1,692. Administrative records: N = 300,063. 690 schools."],["Method","School mission statements coded yes/no for explicitly valuing diversity (13% did). Outcomes: belonging, psychological distress, reading + maths test scores. Moderators from administrative data. Regression with school-level controls."],["Did schools walk the talk?","Barely. Pro-diversity schools had somewhat more diverse students, but NOT more diverse teachers, only slightly smaller discipline gaps, and LARGER racial gaps in gifted placement."],["Results","No overall main effect. Youth of Color: pro-diversity statement → more psychological distress, strongest in less diverse, majority-White schools. White youth: more distress when teachers were more diverse (and GT gaps low). Belonging: no link. Achievement: no link for Black, Latinx or American Indian youth; for Asian youth, positive only with a more diverse teaching staff (and small discipline gaps)."],["Interpretation","Performative multiculturalism: a mismatch between words and actions. Fits stage–environment fit theory (schools failing adolescents’ need to belong)."],["Implications","Diversity statements must be paired with action: redress inequities in discipline and academic tracking (the discussion also points to hiring diverse teachers). Words without action won’t close achievement gaps and may worsen mental health disparities."],["Limitations","Not causal (e.g., family racial-ethnic socialization could confound). Mission statements capture only part of how schools value diversity. Didn’t measure whether students were aware of inequities. Data from 2014–15 in one state."]],"traps":["The result was the OPPOSITE of the hypothesis.","No effect on school belonging.","Schools with statements did not have more diverse teachers."]},{"id":"steinberg","o":22,"short":"Steinberg & Icenogle (2019)","cite":"Using developmental science to distinguish adolescents and adults under the law. Annual Review of Developmental Psychology.","kind":"Review article · know the main concepts and themes","one":"Reasoning matures by about 16, but self-regulation under emotional arousal isn’t mature until at least 21. So the law should use different age boundaries for ‘cold’ decisions (around 16) and ‘hot’ ones (18–21).","rows":[["Premise","The age at which adult rights and responsibilities are granted should match the psychological capacities needed for good judgment in that specific context."],["Is adolescence real?","Not just a social construction: brain imaging shows distinct adolescent patterns, and juvenile rodents show similar risk taking and independence seeking. ‘Adolescence begins in biology and ends in culture.’"],["How ages were set before","Mostly non-scientific: intuitive, administrative, fairness, consequentialist. Age of majority was 21 (medieval armor), lowered to 18 around 1970. About 90% of nations use 18. Reasonable range: 16–21. Age of majority ≠ age of license ≠ age of consent."],["Supreme Court","Thompson (1988), Roper (2005), Graham (2010), Miller (2012), Montgomery (2016) progressively limited the harshest sentences for juveniles, relying more and more on developmental science."],["Cognitive","Working memory, response inhibition, cognitive flexibility, planning and logical reasoning plateau by mid-adolescence (about 15–17). 16–17-year-olds perform like adults in understanding legal proceedings and giving informed consent."],["Psychosocial","Impulse control, sensation seeking and reward sensitivity, future orientation (temporal discounting) and resistance to peers keep developing to 18 and beyond. Teens take more risks when peers are watching; adults don’t."],["Neurobiological","Maturational imbalance (dual systems): the reward system (limbic) ramps up at puberty; the control system (prefrontal cortex) and its connections keep maturing into the mid-twenties. Under emotional arousal, 18–21-year-olds look like mid-teens."],["The gap","Reasoning matures before self-regulation by as much as five years."],["Quantifying maturity","Three statistical approaches: compare age-group means (ANOVA), polynomial regression (rate of change), piecewise regression. They can give somewhat different ages."],["Proposal","‘Cold’ contexts (unhurried, calm): boundary around 16 → voting, research consent, medical decisions, competence as a defendant. ‘Hot’ contexts (arousal, time pressure, peers): 18 or older, perhaps 21 → driving, alcohol, gambling, adult criminal responsibility."],["Caveats","Societal needs can override science (driving and jobs). Cold vs. hot isn’t always clear (abortion; waiting periods help). Individuals vary (skill tests like driver exams help). A chronological boundary protects against biased case-by-case judgements. Science should inform, not dictate; scientists shouldn’t advocate."]],"traps":["Cognitive maturity ≠ psychosocial maturity.","Voting at 16 and adult sentencing at 21 are consistent, not contradictory.","Science informs the law; it doesn’t dictate it."]}],"L20":{"title":"Juveniles & the Law, Wrap-up (Nov 20)","one":"Teens reason like adults by about 16, but their [[reward system]] surges early while the [[control system]] matures slowly into the twenties. Peers turn up teen reward-brain activity. So where should the law draw the line, and should it be [[one line]] or [[several]]?","slides":[{"sl":"Slides 4–5","t":"When are you an adult?","sc":"paradox","rows":[["The questions","When are you an adult? When should the legal system define maturity?"],["The paradox","Someone commits a crime at [[16]], is tried and punished [[as an adult]], and now sits in jail unable to buy cigarettes because they’re [[still a minor]]. The law calls the same person an adult in one room and a minor in the next."],["Link to the reading","Steinberg & Icenogle: the [[age of majority]] (full adult status) is not the same as the [[age of license]] for a specific activity. Different lines already exist; the question is whether they’re drawn sensibly."]]},{"sl":"Slides 6 & 13","t":"The question, again","sc":"mitig","rows":[["The question","Should juveniles accused of crime be held to the same standards of [[blameworthiness]] as adults, and [[punished]] in the same way?"],["The follow-up","Due to their stage of development, are juveniles [[less culpable]]?"],["Three mitigating factors","Impairments/deficiencies in [[decision making]] · offense in response to [[compelling external circumstances]] · act is [[out of character]]."],["Slide 13 adds","Now that we’ve seen (some of) the evidence: where would YOU put the legal boundary of ‘maturity’?"]]},{"sl":"Slides 7–8","t":"The socioemotional brain system","sc":"limbic","rows":[["Psychosocial changes","Changes in [[self-regulation]] · [[future orientation]] · [[sensation seeking & reward sensitivity]] · [[peer influence]]."],["Socioemotional system","[[Limbic and paralimbic]] regions (the slide’s diagram: cingulate gyrus, thalamus, hypothalamus, amygdala, hippocampus; prefrontal cortex labelled separately)."],["In adolescence","Changes in [[dopamine]] responses and activity · changes in neural activation to [[rewards]] · changes in responses to [[peers]]."],["Two systems (reading)","Limbic = sensation and reward seeking, changes dramatically around [[puberty]]. Prefrontal cortex = self-control, regulating impulses, thinking ahead, weighing rewards and costs, resisting peer pressure, still maturing into the [[mid-twenties]]."]]},{"sl":"Slides 9–10","t":"The stoplight game in the scanner","sc":"stoplight","rows":[["The study","Chein et al. (the slide says ‘Chien et al., 2012’; the reading lists Chein et al., 2011). Adolescents, young adults and adults played a driving game in an fMRI scanner, [[alone]] or with [[peers watching]]."],["The task","Drive through 20 intersections as fast as possible. At a yellow light: [[STOP]] and wait 3 s, or [[GO]]: 0 s if you make it, 6 s if you crash. Going = the risky choice."],["Slide 9","Puts the [[limbic system]] diagram next to the [[stoplight task]]: the brain system on one side, the game used to test it on the other. Slide 10 then shows the results."],["Same task as Albert et al. (2013)","Behaviour: only adolescents made clearly more risky decisions and crashed more with peers watching."]]},{"sl":"Slide 10","t":"What the brain did","sc":"cheinc","rows":[["Main effect of age","[[Lateral prefrontal cortex (LPFC)]]: more activity in [[older]] participants, alone or with peers. That’s the control system."],["Age × peers","[[Ventral striatum (VS)]] and [[orbitofrontal cortex (OFC)]]: activity jumped with peers watching, but [[only in adolescents]]. Lecture labelled these the socioemotional system."],["Approximate bars","VS: teens ~0.09 alone → ~0.37 with peers; adults ~0.03 → ~−0.08. OFC: teens ~0 → ~0.22. LPFC: teens ~0.01–0.05, adults ~0.24–0.28."],["Kahoot logic","Most prefrontal activity → the [[adult]]. Most socioemotional activity → the [[teen with peers]]."]]},{"sl":"Slide 11","t":"Maturational imbalance","sc":"imbalc","rows":[["The chart","Ages 9–24. [[Socioemotional, incentive-processing]] system: rises steeply, peaks around 16–17, then declines. [[Cognitive control]] system: rises in a steady straight line. They cross around 21."],["The idea","Maturational imbalance → leads to [[risky decisions]]? The gap is widest in the mid-teens."],["Why not 10-year-olds?","At 10, control is weak but the reward system hasn’t surged yet, so the [[gap]] is small. Risk tracks the imbalance, not weak control alone."],["From the reading","Three versions of the idea (Figure 1): dual systems (Steinberg, 2008), maturational imbalance (Casey, 2015), driven dual systems (Luna & Wright, 2016). Critics call these overly simple, but reviews generally support adolescents’ higher reward sensitivity."]]},{"sl":"Slides 12 & 16","t":"Risk-taking around the world","sc":"duellc","rows":[["The study","Duell et al. (2018): people aged [[10–30]] in [[11 countries]] (China, Colombia, Cyprus, India, Italy, Jordan, Kenya, Philippines, Sweden, Thailand, US). Y-axis: % of [[antisocial risks]] endorsed, relative to age 10."],["The pattern","Many countries: a [[rise]] through adolescence, a peak in the late teens or early twenties, then a [[fall]] (an inverted U). But the shape [[varies]] by country, and some (e.g., the US) show no teen rise."],["Lecture's open questions","Teens engage in more risky behaviour: are there ways this is [[good]]? Teen risk-taking seems to be [[declining]] in recent years: should we be happy? worried?"],["A course link","The play unit: manageable risk (risky play) was linked with better risk assessment, self-esteem, autonomy and mastery. Lecture didn’t give a final answer here."]]},{"sl":"Slides 14–15","t":"Where to draw the line","sc":"boundary","rows":[["Without an age line","(measuring each person’s cognitive/psychosocial skills instead) · Very [[time-consuming]] to evaluate each person · [[Infantilizing]] for individuals with intellectual (and other) disabilities · [[Bias in measurement]] (race, language, etc.)."],["With an age line","Figuring out [[which age]] is appropriate? · Are there [[different circumstances]] when juveniles should vs. should not be treated as adults?"],["Steinberg & Icenogle's answer","Different lines for different contexts: around [[16]] for ‘cold’ decisions (voting, consent, medical choices, competence to stand trial); [[18+, perhaps 21]] for ‘hot’ ones (driving, alcohol, gambling, adult criminal responsibility). A chronological line also protects against [[biased]] case-by-case judgments."]]},{"sl":"Slides 17–18","t":"Exam #3","sc":"","rows":[["When and how","Monday, November 23 · in class · 50 minutes · closed book · 22–25 multiple choice · pen and paper. Bring a pencil or pen!"],["What it looks like","Mostly application and analysis: applying concepts and findings to new situations. About 80% lecture (or lecture + readings), about 20% readings only."]]}],"traps":["[[Cognitive]] maturity (~16) is NOT [[psychosocial]] maturity (~21).","LPFC = [[control]] system (rises with age). VS and OFC = [[socioemotional]] system (spike for teens with peers).","Peers did NOT raise adults’ risk-taking or reward-area activity. Only [[adolescents]].","Risk peaks where the [[gap]] between the systems is biggest (mid-teens), not where control is weakest (childhood).","Time-consuming, infantilizing and biased are problems with [[individual testing]], not with age lines.","Duell et al.: the inverted U is [[common]], not universal. Countries differ."]}};
