<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSYC 319 Exam 3 Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Coming+Soon&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E1B4B; --paper:#FFFDF8; --bg:#E9F1FF;
  --sun:#FFC93C; --grass:#2FB463; --berry:#FF4F8B; --sky:#3D9BFF; --night:#211A4A;
  --good:#16A35A; --bad:#E5484D; --muted:#5B5884;
  --display:"Coming Soon","Comic Sans MS","Chalkboard SE",cursive;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Times New Roman",Times,serif;
  color-scheme:light;
  /* layout: one phone-width column, sticky HUD on top, each stage is a short stack of chunky cards */
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--bg);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body[data-g="r"]{background:linear-gradient(180deg,#8FD3FF 0,#BDE7FF 260px,#D9F5D0 640px,#BFEBB0 100%) fixed}
body[data-g="s"]{background:radial-gradient(circle at 20% 0,#3B2C8A 0,var(--night) 420px,#140F33 100%) fixed}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.tnr{font-family:var(--serif);font-style:italic}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 80px}
img.spr{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;vertical-align:bottom}

/* HUD */
.hud{position:sticky;top:0;z-index:20;background:rgba(255,253,248,.92);backdrop-filter:blur(6px);border-bottom:3px solid var(--ink)}
.hud .in{max-width:560px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px}
.hud .t{flex:1;min-width:0;font-family:var(--display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:2px solid var(--ink);background:var(--paper);border-radius:10px;height:36px;min-width:36px;padding:0 8px;font:600 14px var(--body);color:var(--ink);cursor:pointer}
.coins{display:flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums;border:2px solid var(--ink);border-radius:10px;padding:4px 8px;background:#FFF3C4}
.coins.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.2)}}
.dots{max-width:560px;margin:0 auto;padding:0 16px 8px;display:flex;gap:5px;flex-wrap:wrap}
.dots button{flex:1;min-width:14px;height:10px;border-radius:6px;border:2px solid var(--ink);background:#fff;padding:0;cursor:pointer}
.dots button.done{background:var(--grass)}
.dots button.now{background:var(--sun)}

/* cards & bits */
.stage{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:16px}
.card.tight{padding:12px}
.stage-title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;color:var(--ink)}
body[data-g="s"] .stage-title{color:#fff}
.stage-title h2{font-size:28px}
.stage-title small{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.kicker{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.big{font-size:19px}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:700 17px var(--display);color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:12px 18px;cursor:pointer;transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.go{align-self:flex-end;background:var(--grass);color:#fff;text-shadow:0 2px 0 var(--ink)}
.btn.pink{background:var(--berry);color:#fff;text-shadow:0 2px 0 var(--ink)}
.btn.blue{background:var(--sky);color:#fff;text-shadow:0 2px 0 var(--ink)}
.btn.ghost{background:var(--paper)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--berry);outline-offset:2px}

.say{display:flex;gap:10px;align-items:flex-end}
.say .who{flex:0 0 auto;text-align:center}
.say .who img{height:76px}
.bub{position:relative;flex:1;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;font-size:16px}
.bub:before{content:"";position:absolute;left:-12px;bottom:14px;border:9px solid transparent;border-right-color:var(--ink)}
.bub b.nm{display:block;font-family:var(--display);font-size:14px;color:var(--berry)}

.hack{background:#FFF07A;border:3px solid var(--ink);border-radius:6px;padding:12px 14px;transform:rotate(-.8deg);box-shadow:4px 5px 0 rgba(30,27,75,.85)}
.hack:before{content:"EXAM HACK";display:block;font:700 12px var(--body);letter-spacing:.12em;color:var(--berry);margin-bottom:2px}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:600;font-size:14px;background:#fff}
.stamp{display:inline-block;font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;border:3px solid currentColor;border-radius:8px;padding:2px 8px;transform:rotate(-4deg)}
.stamp.up{color:var(--bad)} .stamp.down{color:var(--good)} .stamp.ns{color:var(--muted)}
.tiny{font-size:13px;color:var(--muted)}

/* MCQ */
.q{font-weight:600;font-size:17px;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font:500 16px var(--body);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt:hover:not(:disabled){background:#F3F0FF}
.opt.right{background:#C9F5DA;border-color:var(--good)}
.opt.wrong{background:#FFD3D6;border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{margin-top:10px;font-size:15px}
.ok{color:var(--good)} .no{color:var(--bad)}

/* sorter */
.chip{font:600 17px var(--body);background:#fff;border:3px dashed var(--ink);border-radius:14px;padding:14px;text-align:center;min-height:64px;display:flex;align-items:center;justify-content:center;gap:10px}
.chip.fly{animation:fly .35s forwards}
@keyframes fly{to{transform:translateY(30px) scale(.6);opacity:0}}
.bins{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:8px}
.bins.six{grid-template-columns:repeat(3,1fr)}
.bin{font:700 15px var(--display);background:var(--sky);color:#fff;text-shadow:0 2px 0 var(--ink);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:10px 6px;cursor:pointer;min-height:52px}
.bin:nth-child(2n){background:var(--berry)}
.bins.six .bin:nth-child(3n+1){background:var(--sky)} .bins.six .bin:nth-child(3n+2){background:var(--berry)} .bins.six .bin:nth-child(3n){background:var(--grass)}
.bin:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.bin.hint{outline:4px solid var(--sun)}
.tally{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:8px;font-size:13px}
.tally > div{background:#F4F2FF;border:2px solid var(--ink);border-radius:10px;padding:6px 8px;min-height:40px}
.tally h4{margin:0 0 4px;font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase}
.tally ul{margin:0;padding-left:16px}
.fb{min-height:22px;font-size:15px}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.flip{perspective:600px;height:130px;cursor:pointer;border:none;background:none;padding:0;font:inherit;color:inherit}
.flip .fi{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.flip .fa,.flip .fb2{position:absolute;inset:0;backface-visibility:hidden;border:3px solid var(--ink);border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-weight:600}
.flip .fa{background:var(--sky);color:#fff;font-family:var(--display);font-size:17px;text-shadow:0 2px 0 var(--ink)}
.flip .fb2{background:#fff;transform:rotateY(180deg);font-size:14px}

/* Ramsden lab */
.tabs{display:flex;gap:6px}
.tab{flex:1;font:700 14px var(--display);border:3px solid var(--ink);border-radius:12px 12px 0 0;background:#fff;padding:8px 4px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--sun)}
.tab.tried:after{content:" ✓";color:var(--good)}
input[type=range]{width:100%;accent-color:var(--berry);height:28px}
.dial-lab{font:700 18px var(--display);text-align:center;color:var(--berry)}
.meter{display:flex;align-items:baseline;gap:8px;justify-content:center}
.meter b{font:700 44px var(--display);font-variant-numeric:tabular-nums}
.class{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:#FFF1D6;border:3px solid var(--ink);border-radius:14px;padding:8px}
.kid{position:relative;aspect-ratio:1/1.1;border-radius:8px;display:flex;align-items:flex-end;justify-content:center;background:#fff;border:2px solid transparent;transition:background .2s}
.kid img{height:88%}
.kid.ok{background:#C9F5DA;border-color:var(--good)}
.kid.vul{background:#FFC2C7;border-color:var(--bad);animation:wob .4s}
.kid.vul:after{content:"!";position:absolute;top:-6px;right:-2px;background:var(--bad);color:#fff;font:700 12px var(--body);width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink)}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

.dom-grid{display:grid;grid-template-columns:1fr;gap:6px}
.dom{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;font:600 15px var(--body);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer;color:var(--ink)}
.dom.sel{background:#DCD4FF}
.dom.hit{background:#C9F5DA;border-color:var(--good)}
.dom.miss{background:#FFD3D6;border-color:var(--bad)}
.dom .res{font-variant-numeric:tabular-nums;font-size:14px}
.letter{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;background:var(--ink);color:#fff;font:700 13px var(--body);margin-right:8px;flex:0 0 auto}

.daybar{display:flex;height:46px;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.daybar div{display:flex;align-items:center;justify-content:center;font:600 12px var(--body);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.5);transition:flex .3s;overflow:hidden;white-space:nowrap}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px;text-align:center}
.tile b{display:block;font:700 26px var(--display);font-variant-numeric:tabular-nums;color:var(--berry)}
.tile span{font-size:13px;color:var(--muted)}

/* Steinberg: tower of london */
.tol{display:flex;justify-content:space-around;align-items:flex-end;height:170px;background:#F4F2FF;border:3px solid var(--ink);border-radius:14px;padding:10px 6px 0;position:relative}
.peg{position:relative;width:30%;display:flex;flex-direction:column-reverse;align-items:center;cursor:pointer;background:none;border:none;padding:0;height:100%}
.peg:before{content:"";position:absolute;bottom:0;width:10px;background:#8A6A3D;border:2px solid var(--ink);border-radius:6px 6px 0 0}
.peg[data-c="3"]:before{height:140px}.peg[data-c="2"]:before{height:100px}.peg[data-c="1"]:before{height:60px}
.peg:after{content:"";position:absolute;bottom:-3px;left:5%;right:5%;height:10px;background:#8A6A3D;border:2px solid var(--ink);border-radius:4px}
.peg.sel{filter:drop-shadow(0 0 6px var(--sun))}
.ball{position:relative;z-index:1;width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);margin-bottom:2px;box-shadow:inset -5px -5px 0 rgba(0,0,0,.18)}
.ball.R{background:#FF5A5F}.ball.G{background:#3DD17B}.ball.B{background:#4D8DFF}
.ball.lift{transform:translateY(-14px)}
.tol.mini{height:90px;transform-origin:left;pointer-events:none}
.tol.mini .ball{width:20px;height:20px;border-width:2px}
.tol.mini .peg[data-c="3"]:before{height:72px}.tol.mini .peg[data-c="2"]:before{height:50px}.tol.mini .peg[data-c="1"]:before{height:28px}

/* stoplight */
.road{position:relative;height:280px;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#3B3A4F}
.lanes{position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 30px,#FFE680 30px 60px) center/8px 100% no-repeat}
.road.moving .lanes{animation:roll .45s linear infinite}
@keyframes roll{to{background-position:center 60px}}
.road .car{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);height:96px;transition:transform .2s}
.road .car.crash{animation:crash .6s}
@keyframes crash{20%{transform:translateX(-60%) rotate(-20deg)}50%{transform:translateX(-40%) rotate(18deg)}100%{transform:translateX(-50%)}}
.road .stopline{position:absolute;top:70px;left:10%;right:10%;height:10px;background:#fff;opacity:.9}
.light{position:absolute;top:10px;right:12px;background:#111;border:3px solid var(--ink);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:5px}
.light i{width:26px;height:26px;border-radius:50%;background:#333;display:block}
.light.r .r{background:#FF3B3B;box-shadow:0 0 14px #FF3B3B}
.light.y .y{background:#FFD23B;box-shadow:0 0 14px #FFD23B}
.light.g .g{background:#3BFF7A;box-shadow:0 0 14px #3BFF7A}
.peer{position:absolute;left:8px;bottom:8px;display:flex;align-items:flex-end;gap:4px}
.peer img{height:90px}
.peer .yell{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 8px;font:700 14px var(--display);margin-bottom:60px;opacity:0;transition:opacity .2s}
.peer.cheer .yell{opacity:1}
.peer.cheer img{animation:hop .3s 2}
@keyframes hop{50%{transform:translateY(-8px)}}
.boom{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);font:700 34px var(--display);color:#FFD23B;text-shadow:0 3px 0 var(--ink);opacity:0}
.boom.on{animation:boom .7s}
@keyframes boom{0%{opacity:1;transform:translateX(-50%) scale(.5)}60%{opacity:1;transform:translateX(-50%) scale(1.3)}100%{opacity:0}}
.drive{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drive .btn{font-size:22px;padding:16px}
.road-hud{display:flex;justify-content:space-between;font:700 15px var(--body);font-variant-numeric:tabular-nums}

/* discounting */
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money button{border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:14px 8px;cursor:pointer;font:700 15px var(--body);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px}
.money button b{font:700 30px var(--display)}
.money .now{background:#FFE18A}.money .later{background:#BFE3FF}
.money button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* go-nogo */
.gng{height:200px;border:3px solid var(--ink);border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:96px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .1s;width:100%;padding:0;color:var(--ink)}
.gng.hit{background:#C9F5DA}.gng.fa{background:#FFC2C7}
.gng.hot{background:#FFF0F3;animation:pulse .9s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,79,139,.25)}}
.shape-go{width:110px;height:110px;border-radius:50%;background:var(--grass);border:4px solid var(--ink)}
.shape-no{width:100px;height:100px;background:#8B5CF6;border:4px solid var(--ink)}

/* brain lab */
canvas.chart{width:100%;height:auto;display:block;background:#fff;border:3px solid var(--ink);border-radius:14px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:16px;height:5px;border-radius:3px;display:inline-block}
.bars2{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:14px}
.bar{height:16px;background:#EEE;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .4s}
.toggle{display:flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.toggle button{flex:1;border:none;padding:10px;font:700 15px var(--display);background:#fff;cursor:pointer;color:var(--ink)}
.toggle button.on{background:var(--berry);color:#fff}
.vbars{display:flex;gap:14px;align-items:flex-end;height:150px;padding:8px 8px 0;border-bottom:3px solid var(--ink)}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font:600 13px var(--body)}
.vbars i{display:block;width:100%;border:3px solid var(--ink);border-bottom:none;border-radius:8px 8px 0 0;transition:height .45s}
.vlabels{display:flex;gap:14px;padding:4px 8px 0;font:600 13px var(--body);text-align:center}
.vlabels span{flex:1}

/* hub */
.hero{display:flex;flex-direction:column;gap:10px;padding:22px 0 6px}
.hero h1{font-size:38px}
.hero .cast{display:flex;gap:14px;align-items:flex-end}
.cast figure{margin:0;text-align:center;font:600 13px var(--body)}
.cast img{height:96px}
.cart{display:flex;gap:14px;align-items:center;text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:14px;transition:transform .08s}
.cart:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.cart.r{background:linear-gradient(135deg,#C9F5DA,#FFF3B8)}
.cart.s{background:linear-gradient(135deg,#E2D9FF,#FFD3E2)}
.cart h2{font-size:24px}
.cart .art{flex:0 0 auto;display:flex;align-items:flex-end}
.cart .art img{height:84px}
.best{font:600 13px var(--body);color:var(--muted)}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* cheat */
.cheat h3{font-size:20px;margin:10px 0 4px;color:var(--berry)}
.cheat h3:first-child{margin-top:0}
.cheat ul{margin:0;padding-left:20px}
.cheat li{margin:3px 0}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:400px){.stage-title h2{font-size:24px}.hero h1{font-size:32px}.bins.six{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body data-g="hub">
<canvas id="fx"></canvas>
<header class="hud" id="hud" hidden>
  <div class="in">
    <button class="icon-btn" id="homeBtn" aria-label="Back to arcade">◀ Arcade</button>
    <div class="t" id="hudTitle"></div>
    <div class="coins" id="coins"><img class="spr" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAcklEQVR4XmNkgIKTk/T/w9ggYJ53kRFEM4EIkKRZXCODpqkuw8ETD8EKYBqYYIzP19fADUBWxAISBekEgRmTtzBk5PrAFV4/fRliBQyAJEGKkAEjzAqYKTCT7C3kwWywS2GKYHbDJEE+AVsB8xJMAlkMANp8MCtTeE1KAAAAAElFTkSuQmCC" alt="" style="height:16px"><span id="coinN">0</span></div>
    <button class="icon-btn" id="muteBtn" aria-label="Toggle sound">🔊</button>
  </div>
  <nav class="dots" id="dots" aria-label="Stages"></nav>
</header>
<main class="wrap" id="app"></main>

<script>

let AC=null, MUTED=store.get('muted',false);
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC}
function tone(f,d=.12,type='square',v=.07,f2=null,delay=0){const a=ac();if(!a||MUTED)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d=.3,v=.15,freq=1000,ft='lowpass',delay=0,f2=null){const a=ac();if(!a||MUTED)return;const t=a.currentTime+delay;const len=Math.max(1,Math.floor(a.sampleRate*d));const b=a.createBuffer(1,len,a.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type=ft;fl.frequency.setValueAtTime(freq,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+d)}

/* ================= fx ================= */
const fx=$('#fx'),fxc=fx.getContext('2d');let parts=[];
function sizeFx(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio;fxc.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',sizeFx);sizeFx();
const COLS=['#FFC93C','#FF4F8B','#3D9BFF','#2FB463','#8B5CF6','#fff'];
function burst(el,n=18){const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/3,width:0,height:0};for(let i=0;i<n;i++)parts.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*8,vy:-Math.random()*7-2,c:COLS[i%COLS.length],l:60,s:4+Math.random()*4});if(parts.length===n)loop()}
function rain(){for(let i=0;i<120;i++)parts.push({x:Math.random()*innerWidth,y:-Math.random()*200,vx:(Math.random()-.5)*2,vy:Math.random()*3+2,c:COLS[i%COLS.length],l:160,s:5+Math.random()*5});loop()}
let looping=false;function loop(){if(looping)return;looping=true;(function f(){fxc.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;fxc.fillStyle=p.c;fxc.fillRect(p.x,p.y,p.s,p.s)});if(parts.length)requestAnimationFrame(f);else{looping=false;fxc.clearRect(0,0,innerWidth,innerHeight)}})()}

function addCoins(n){if(!cur.g)return;COINS[cur.g]+=n;store.set('coins_'+cur.g,COINS[cur.g]);$('#coinN').textContent=COINS[cur.g];const c=$('#coins');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump');SFX.coin()}

/* ================= components ================= */
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild}
function add(parent,html){const e=el(html);parent.appendChild(e);return e}
function nextBtn(parent,label='Next ▶'){const b=add(parent,`<button class="btn go">${label}</button>`);b.onclick=()=>{SFX.whoosh();next()};return b}
function reveal(e){setTimeout(()=>e.scrollIntoView({behavior:'smooth',block:'center'}),60)}

function mcq(parent,{q,opts,a,why,pts=10,onDone}){
  const w=add(parent,`<div class="card mcq"><p class="q">${q}</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><div class="why" hidden></div></div>`);
  let done=false;
  $$('.opt',w).forEach(b=>b.onclick=()=>{if(done)return;done=true;const i=+b.dataset.i,ok=i===a;const all=$$('.opt',w);b.classList.add(ok?'right':'wrong');all[a].classList.add('right');all.forEach(x=>x.disabled=true);
    if(ok){SFX.good();addCoins(pts);burst(b)}else SFX.bad();
    const y=$('.why',w);y.hidden=false;y.innerHTML=(ok?'<b class="ok">Yes!</b> ':'<b class="no">Not quite.</b> ')+why;onDone&&onDone(ok)});
  return w;
}
function quizSeq(parent,qs,done){let i=0,score=0;const box=add(parent,'<div class="stack"></div>');
  const nx=()=>{if(i>=qs.length){done&&done(score);return}const k=i;const head=add(box,`<p class="kicker">Question ${k+1} of ${qs.length}</p>`);
    const w=mcq(box,{...qs[k],onDone:ok=>{if(ok)score++;i++;if(i<qs.length){const b=add(w,'<button class="btn ghost" style="margin-top:10px">Next question ▶</button>');b.onclick=()=>{SFX.click();b.remove();nx()};}else nx()}});reveal(head)};
  nx()}

function sorter(parent,{bins,items,six,pts=5,onDone}){
  const n=bins.length;
  const w=add(parent,`<div class="card stack"><div class="kicker">Sort it · <span class="cnt">1</span>/${items.length}</div><div class="chip"></div><div class="bins ${six?'six':''}" style="--n:${n}">${bins.map((b,i)=>`<button class="bin" data-i="${i}">${b}</button>`).join('')}</div><div class="fb"></div><div class="tally" style="--n:${six?1:n}"></div></div>`);
  const tally=$('.tally',w);
  if(!six) tally.innerHTML=bins.map(b=>`<div><h4>${b}</h4><ul></ul></div>`).join('');
  else tally.innerHTML='<div><h4>Sorted</h4><ul></ul></div>';
  let i=0,score=0,lock=false;
  const chip=$('.chip',w),fb=$('.fb',w);
  const show=()=>{const it=items[i];chip.classList.remove('fly');chip.innerHTML=(it.img||'')+`<span>${it.t}</span>`;$('.cnt',w).textContent=i+1;fb.innerHTML='';$$('.bin',w).forEach(b=>b.classList.remove('hint'));lock=false};
  const log=(it)=>{const ul=six?$('ul',tally):$$('ul',tally)[it.bin];add(ul,`<li>${six?`<b>${bins[it.bin]}:</b> `:''}${it.short||it.t}</li>`)};
  $$('.bin',w).forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const it=items[i],pick=+b.dataset.i,ok=pick===it.bin;
    if(ok){score++;SFX.pop();addCoins(pts);burst(b,10);fb.innerHTML=`<b class="ok">✓</b> ${it.why||''}`;}
    else{SFX.bad();$$('.bin',w)[it.bin].classList.add('hint');fb.innerHTML=`<b class="no">✗ It's “${bins[it.bin]}.”</b> ${it.why||''}`;}
    log(it);chip.classList.add('fly');
    const go=()=>{i++;if(i<items.length)show();else{chip.innerHTML=`<span>All sorted! ${score}/${items.length} first try.</span>`;chip.classList.remove('fly');$('.bins',w).remove();SFX.levelup();onDone&&onDone(score)}};
    if(ok)setTimeout(go,it.why?1500:700);else{const c=add(fb,'<div style="margin-top:8px"><button class="btn ghost">Got it ▶</button></div>');$('button',c).onclick=()=>{SFX.click();go()}}});

{name:'Brain Lab',run(st){

    {t:'Being held to ADULT standards of criminal blame',bin:1,short:'Adult criminal responsibility',why:'Most teen crime is impulsive and peer-driven: a hot context.'}
  ],onDone(){SFX.gavel();
    add(st,`<div class="hack">Exam scenario trick: ask <b>“Is there time to deliberate, alone and calm?”</b> If yes → teens ≈ adults (16). If it’s rushed, emotional, or with peers → treat as immature (18–21).</div>`);
    quizSeq(st,[
      {q:'Where did 21 as the old age of majority come from?',opts:['The age the brain stops growing','The age young men could wear a full suit of armour (medieval Europe)','The US drinking age','The Vietnam War draft'],a:1,why:'Folk history, not science! Many countries lowered it to 18 around 1970.'},
      {q:'About what share of the world’s nations set 18 as the age of majority?',opts:['About 25%','About 50%','About 90%','100%'],a:2,why:'About 90%, which is mostly consistent with the science. The reasonable range is 16–21.'}
    ],()=>nextBtn(st,'Courtroom ▶'))}});
}},
{name:'Courtroom',run(st){
  add(st,`<div class="card stack">${say('ref','Three teen defendants, same crime. Which mitigating factor fits each case?')}<div class="row" style="justify-content:center">${S('defendant',80)}${S('gavel',70)}</div></div>`);
  const F=['Impaired decision-making','Compelling external circumstances','Act is out of character'];
  quizSeq(st,[
    {q:'Case 1: Jay (15) took the car because four friends in the back seat were yelling “GO!”',opts:F,a:1,why:'Peer pressure acts like duress, and teens can’t easily walk away from their social setting.',pts:8},
    {q:'Case 2: Sam (16) says, “I didn’t think about what would happen next. It just seemed fun in the moment.”',opts:F,a:0,why:'Weak impulse control and future orientation = impaired decision-making.',pts:8},
    {q:'Case 3: Ari (16) is a straight-A student with no record who has never done anything like this.',opts:F,a:2,why:'Teen identity is still forming. Most teens grow out of risky behaviour.',pts:8}
  ],()=>{SFX.gavel();
    add(st,`<p class="kicker" style="color:#fff">US Supreme Court cases · match the ruling</p>`);
    const RU=['No death penalty under 18','No life-without-parole under 18 for non-homicide crimes','No MANDATORY life-without-parole under 18, even for homicide','Earlier juvenile life sentences get resentencing or a parole hearing'];
    quizSeq(st,[
      {q:'<span class="tnr">Roper v. Simmons</span> (2005)',opts:RU,a:0,why:'Roper cited science and also said it’s what “any parent knows.”',pts:6},
      {q:'<span class="tnr">Graham v. Florida</span> (2010)',opts:RU,a:1,why:'It cited brain areas for behaviour control still maturing.',pts:6},
      {q:'<span class="tnr">Miller v. Alabama</span> (2012)',opts:RU,a:2,why:'It said teen brains aren’t mature in impulse control, planning ahead, and risk avoidance.',pts:6},
      {q:'<span class="tnr">Montgomery v. Louisiana</span> (2016)',opts:RU,a:3,why:'It made Miller retroactive.',pts:6}
    ],()=>{
      add(st,`<div class="card stack">${say('m','Last debate: should we use one <b>age line</b>, or <b>test each person’s maturity</b>? Sort the problems.')}</div>`);
      sorter(st,{bins:['Problem with an age line','Problem with testing each person'],items:[
        {t:'It takes a huge amount of time to evaluate everyone',bin:1,short:'Very time-consuming'},
        {t:'Which age do you even pick?',bin:0,short:'Which age?'},
        {t:'Tests can be biased by race or language',bin:1,short:'Measurement bias'},
        {t:'Some mature 16-year-olds get treated as kids, and some immature 19-year-olds as adults',bin:0,short:'Misclassifies individuals'},
        {t:'It could infantilize people with intellectual disabilities',bin:1,short:'Infantilizing'},
        {t:'Hot and cold situations may need different ages',bin:0,short:'One age doesn’t fit every context'}
      ],onDone(){add(st,`<div class="hack">The authors back <b>age lines informed by science</b>: imperfect, but better than intuition. A fixed line also <b>protects against biased judgments</b>, such as race shaping whether a teen “seems” adult-like.</div>`);nextBtn(st,'Boss round ▶')}});
    })});
}},
{name:'Boss Round',run(st){
  add(st,`<div class="card stack">${say('poka','Final boss! Apply it. Is the scene <b>hot or cold</b>?','poka_pull')}</div>`);
  quizSeq(st,[
    {q:'Maya (16) has two weeks, an info sheet, and a meeting with a researcher before deciding to join a study. Steinberg & Icenogle would say:',opts:['She’s too young: wait until 18','She can decide like an adult: it’s a cold, deliberate decision','Only her parents can decide','It depends on her peer group'],a:1,why:'Unhurried, calm decision = cold cognition, which is mature by about 16.'},
    {q:'Dev (19) drives drunk after a party with friends cheering him on. Best explanation?',opts:['He lacks logical reasoning','Under emotional and social arousal, 18–21-year-olds act more like mid-teens','His cognitive capacity is still developing','Sensation seeking peaks at 25'],a:1,why:'Cold reasoning is adult by 19, but hot self-regulation is still maturing.'},
    {q:'A teen gambles more only when told a friend is watching from another room. Which system explains it?',opts:['Weaker working memory','Peers increasing reward sensitivity (socioemotional system)','Poor understanding of the odds','Too much myelination'],a:1,why:'Peer presence boosts reward-circuit activity. Teens take more risks even when they know the odds (Smith et al., 2014).'},
    {q:'In mid-adolescence, the dual systems model predicts:',opts:['Weak reward drive + strong control','Strong reward drive + still-developing control','Both systems fully mature','Control matures before reward'],a:1,why:'Gas early, brakes late = maturational imbalance.'},
    {q:'Penal proportionality says punishment should depend on:',opts:['Age only','Harm caused + culpability','The victim’s wishes','Whether the crime was planned'],a:1,why:'Severity tracks <b>harm</b> and <b>blameworthiness</b>. Mitigating factors reduce culpability.'},
    {q:'Which finding supports treating 16-year-olds like adults for some decisions?',opts:['They run more yellow lights','They list pros and cons of risky acts as well as adults','Their sensation seeking is high','They discount the future'],a:1,why:'Cold reasoning is adult-like. The others are hot or psychosocial immaturities.'}
  ],s=>finish(st,'s',s,6));
}}
];

/* ================= finish + cheat ================= */
const CHEAT={
r:`<h3>Ramsden, Gill & Brussoni (2026)</h3><ul><li><b>RQ:</b> Are pre-K screen time, outdoor play & risky play linked to developmental vulnerability in kindergarten?</li></ul>
<h3>Methods</h3><ul><li><b>Longitudinal, correlational.</b> n = 4,968 BC kids, 2023 & 2024 cohorts, 343 schools.</li><li><b>CHEQ</b>: parents report the 6 months before K (screen time, outdoor play, risky play).</li><li><b>EDI</b>: teachers rate in February of K, 103 items, 5 domains (P-S-E-L-C). Vulnerable = low on 1+ domain (32.9%).</li><li>Multilevel logistic regression (kids in schools), 3 separate models, adjusted for sex, income, marital status, siblings, birthplace, urban/rural.</li></ul>
<h3>Findings</h3><ul><li><b>Screens ↑</b> overall aOR 1.38 [1.26–1.50], <b>all 5 domains</b>.</li><li><b>Risky play ↓</b> overall aOR 0.92 [0.87–0.98], 4 domains (not emotional maturity).</li><li><b>Outdoor play</b>: overall n.s. (0.93 [0.84–1.03]), but ↓ physical (0.83) & communication (0.77).</li><li>Also: boys ~2.8× odds; lower income ↑; single/separated/widowed/divorced ↑; 1 sibling ↓.</li></ul>
<h3>Implications</h3><ul><li>Limit screens (guideline: under 1 h/day for under-5s; over 75% exceed it). <b>Displacement</b>: screens push out active, outdoor, risky play, people time, and sleep.</li><li>Provide risky play with challenge and autonomy. Focus on <b>quality over minutes</b>. Support should be universal but proportionate to need.</li></ul>
<h3>Limitations</h3><ul><li>Low CHEQ participation (44% / 36%) → self-selection, limited generalizability.</li><li>Parent report → recall & social-desirability bias.</li><li>No screen content/co-use; no outdoor-play quality.</li><li>Residual confounding (parenting, temperament, child care, neighbourhood). Can’t claim cause.</li></ul>
<h3>Risky play types</h3><ul><li>Heights · Speed · Tools · Elements · Getting lost · Rough & tumble</li></ul>`,
s:`<h3>Steinberg & Icenogle (2019): review</h3><ul><li>Legal age lines should match the skills a decision actually needs.</li></ul>
<h3>Penal proportionality</h3><ul><li>Punishment = harm + culpability. Excuse removes responsibility; mitigation lessens it.</li><li>3 mitigators: impaired decision-making · compelling external circumstances · act out of character.</li></ul>
<h3>Cognitive (cold)</h3><ul><li>Working memory, inhibition, flexibility, logical reasoning plateau in mid-adolescence. Tower of London adult-level by 15–17. Adult-like by <b>~16</b>.</li></ul>
<h3>Psychosocial (hot)</h3><ul><li>Self-regulation not adult until <b>18+</b>; impulse control develops into the early-to-mid 20s.</li><li>Sensation seeking & reward sensitivity peak in adolescence (~14–19), then decline.</li><li>Temporal discounting: prefer small-now. Future orientation improves through late adolescence.</li><li>Peers ↑ teen risk (even unseen); adults unaffected.</li><li>18–21: adult when calm, like mid-teens when aroused (Cohen 2016).</li></ul>
<h3>Brain</h3><ul><li>Dual systems / maturational imbalance: limbic/striatal reward system surges at puberty; prefrontal control matures into mid-20s.</li><li>PFC largely mature by 16, but its <b>connections</b> (myelination) mature into the early-to-mid 20s. Grey matter peaks then prunes; white matter rises.</li></ul>
<h3>Proposal</h3><ul><li><b>Cold → 16</b>: voting, research consent, medical decisions, competence to stand trial.</li><li><b>Hot → 18 (maybe 21)</b>: driving, alcohol, casinos, adult criminal responsibility.</li><li>Cognitive maturity precedes psychosocial maturity by up to <b>5 years</b>.</li></ul>
<h3>Debate</h3><ul><li>Individual testing: time-consuming, infantilizing, measurement bias.</li><li>Age line: which age? different contexts? misclassifies some people, but guards against biased judgments.</li><li>Roper 2005 · Graham 2010 · Miller 2012 · Montgomery 2016.</li></ul>`
};
function finish(st,g,score,total){rain();SFX.levelup();store.set('best_'+g,Math.max(store.get('best_'+g,0),score));
  const d=store.get('done_'+g,[]);if(!d.includes(cur.i)){d.push(cur.i);store.set('done_'+g,d)}
  const c=add(st,`<div class="card stack" style="text-align:center"><div class="row" style="justify-content:center">${S('poka',90)}${S('woofer',90)}${S('m_cheer',90)}</div><h2>${score}/${total} on the boss!</h2><p>${score===total?'Flawless. You’re exam-ready.':'Tap any progress dot up top to replay a stage.'}</p></div>`);
  const ch=add(st,`<div class="card cheat"><p class="kicker">Cheat card · review before the exam</p>${CHEAT[g]}<div class="row" style="margin-top:12px"><button class="btn ghost" id="cp">Copy cheat card</button><button class="btn pink" id="oth">Play the other game ▶</button></div></div>`);
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(ch.innerText.replace(/Copy cheat card[\s\S]*$/,'').trim());$('#cp').textContent='Copied ✓';SFX.coin()}catch(e){$('#cp').textContent='Copy blocked: select the text instead'}};
  $('#oth').onclick=()=>{SFX.whoosh();openGame(g==='r'?'s':'r')};reveal(c)}

const GAMES={r:{title:'The Sandbox Study · Ramsden 2026',stages:R_STAGES},s:{title:'Gas Pedal Court · Steinberg 2019',stages:S_STAGES}};
