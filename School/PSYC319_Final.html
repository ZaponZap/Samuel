: learning that engages students in doing and thinking, not just receiving."],["[[PATHS]]","PATHS is something else: an SEL program named in lecture as an example alongside positive peer reporting."]],"k":"Assimilation: Using schooling to bring children into one dominant national culture and identity.","term":"Assimilation","h":"Lecture paired it with national identity as a reason schools exist."},{"id":"s5q163","s":5,"o":8,"t":"T","sc":"whyschool","q":"Which ==key term== does this example show? “A government makes school compulsory so all children learn one official language.”","a":[["[[Assimilation]]","Yes. Assimilation = using schooling to bring children into one dominant national culture and identity."],["[[Far transfer]]","Far transfer is something else: improvement on numbers or skills that were not presented in the game."],["[[External validity]]","External validity is something else: how well a study’s results apply beyond its own sample and setting."],["[[PATHS]]","PATHS is something else: an SEL program named in lecture as an example alongside positive peer reporting."],["[[Social-emotional learning (SEL)]]","Social-emotional learning (SEL) is something else: schooling that goes beyond reading, writing and arithmetic to teach social and emotional skills."]],"k":"Assimilation: Using schooling to bring children into one dominant national culture and identity.","term":"Assimilation","h":"Lecture paired it with national identity as a reason schools exist."},{"id":"s5q164","s":5,"o":15,"t":"T","sc":"summer","q":"Which ==key term== matches this definition? “A year-round school calendar that spreads the long summer break into shorter breaks across the year.”","a":[["[[Balanced calendar]]","Yes. Balanced calendar = a year-round school calendar that spreads the long summer break into shorter breaks across the year."],["[[Developmental mismatch]]","Developmental mismatch is something else: when a school environment clashes with students’ developmental stage, as in middle/high schools or early start times."],["[[School transition]]","School transition is something else: moving from one school to the next; linked with dips in motivation, interest in school and confidence."],["[[Stage–environment fit]]","Stage–environment fit is something else: the match between a person’s developmental needs and what their environment provides; poor fit harms adjustment."],["[[Diversity ideology]]","Diversity ideology is something else: a lay perspective on how institutions should handle diversity, e.g., color-evasive or multicultural."]],"k":"Balanced calendar: A year-round school calendar that spreads the long summer break into shorter breaks across the year.","term":"Balanced calendar","h":"Same school days, spread out. Lecture’s answer to ‘year-round school?’"},{"id":"s5q165","s":5,"o":20,"t":"T","sc":"mitig","q":"Which ==key term== matches this definition? “Features of a person or situation that lessen criminal responsibility: impaired decision making, compelling external circumstances, or an act that is out of character.”","a":[["[[Mitigating factors]]","Yes. Mitigating factors = features of a person or situation that lessen criminal responsibility: impaired decision making, compelling external circumstances, or an act that is out of character."],["[[Penal proportionality]]","Penal proportionality is something else: the severity of punishment should be determined by the harm caused and by the culpability of the person causing it."],["[[Sensation seeking]]","Sensation seeking is something else: the drive to seek out new and exciting experiences; peaks in adolescence."],["[[Future orientation]]","Future orientation is something else: the ability to think about and weigh long-term consequences."],["[[Reward sensitivity]]","Reward sensitivity is something else: how strongly rewards drive behaviour; adolescents are driven more by reward and less by risk."]],"k":"Mitigating factors: Features of a person or situation that lessen criminal responsibility: impaired decision making, compelling external circumstances, or an act that is out of character.","term":"Mitigating factors","h":"Three ways blame can shrink."}],"T":[{"o":0,"g":"def","t":"Play","d":"Joyful, actively engaging, spontaneous, voluntary, intrinsically motivated activity that is unrelated to immediate survival.","e":"At recess, kids invent a chasing game for no reason other than that it’s fun.","h":"Nobody makes you, nobody pays you, you just want to.","sc":"playdef","x":["Intrinsic motivation"]},{"o":0,"g":"def","t":"Intrinsic motivation","d":"Doing something for its own sake, because the activity itself is rewarding.","e":"Lina keeps drawing for hours even though no one is grading or praising her.","h":"INtrinsic = the reason is INside the activity.","sc":"playdef","x":["Play"]},{"o":0,"g":"stage","t":"Non-social play","d":"Play that does not involve playing alongside or with other children (unoccupied, solitary, onlooker).","e":null,"h":"Before ‘with’, there’s ‘near’.","sc":"stages","x":["Onlooker play","Social play","Solitary play","Unoccupied play"]},{"o":0,"g":"stage","t":"Solitary play","d":"Playing alone, with no attention to what other children nearby are doing.","e":"A toddler stacks rings in the corner, ignoring the kids beside her.","h":"Solo mode.","sc":"stages","x":["Non-social play","Onlooker play","Unoccupied play"]},{"o":0,"g":"stage","t":"Onlooker play","d":"Watching other children play, perhaps talking to them, without joining in.","e":"Theo stands by the sandbox commenting on the castle but never picks up a shovel.","h":"The sports commentator: watching, talking, not playing.","sc":"stages","x":["Non-social play","Solitary play","Unoccupied play"]},{"o":0,"g":"stage","t":"Parallel play","d":"Playing beside another child with similar toys, but with no interaction.","e":"Two toddlers each push their own truck side by side without speaking.","h":"Two treadmills at the gym: same thing, same room, no teamwork.","sc":"stages","x":["Associative play","Cooperative play","Social play"]},{"o":0,"g":"stage","t":"Associative play","d":"Playing with others, sharing and chatting, but with no shared goal or assigned roles.","e":"Kids at the art table trade markers and chat while each draws a separate picture.","h":"A group chat where everyone does their own homework.","sc":"stages","x":["Cooperative play","Parallel play","Social play"]},{"o":0,"g":"stage","t":"Cooperative play","d":"Playing together toward a shared goal with coordinated roles.","e":"Four kids build one fort: two gather cushions, one holds the blanket, one is ‘guard’.","h":"An actual group project where everyone has a job.","sc":"stages","x":["Associative play","Parallel play","Social play"]},{"o":1,"g":"type","t":"Object play","d":"Exploring and using objects to see what they do.","e":"A toddler nests cups and knocks them down again and again.","h":"The THING is the star.","sc":"types"},{"o":1,"g":"type","t":"Guided play","d":"Child-led play that an adult gently supports toward a learning goal.","e":"A teacher sets out ramps and asks ‘what if it’s steeper?’ while kids explore.","h":"Kid drives, adult is the GPS.","sc":"types"},{"o":1,"g":"type","t":"Physical play","d":"Whole-body active play; lecture’s example was rough-and-tumble play.","e":"Two cousins laugh as they play-wrestle on the grass.","h":"Puppies wrestling.","sc":"types","x":["Risky play","Rough-and-tumble play"]},{"o":3,"g":"pretend","t":"Pretend play","d":"Play in which we act ‘as-if’ and engage in make-believe; begins around 18–25 months.","e":"A two-year-old ‘feeds’ her teddy with an empty spoon.","h":"Two magic words: AS-IF.","sc":"pretend","x":["Sociodramatic play","Symbolic thought"]},{"o":3,"g":"pretend","t":"Symbolic thought","d":"The ability to have a symbol represent something other than itself.","e":"A child holds a banana to his ear as a phone.","h":"Banana = phone. Stick = sword. Word ‘dog’ = dog.","sc":"pretend","x":["Pretend play","Sociodramatic play"]},{"o":3,"g":"pretend","t":"Sociodramatic play","d":"Pretend play with others, acting out roles in a shared story; what simple pretend develops into.","e":"Three kids run a pretend clinic as doctor, nurse and patient.","h":"Socio (people) + dramatic (acting).","sc":"sociodrama","x":["Pretend play","Symbolic thought"]},{"o":3,"g":"pretend","t":"Batman effect","d":"Children persevere longer and regulate emotions better when they take on a character and think about a hard task as that character.","e":"Dressed as a superhero, Omar sticks with a boring task far longer than usual.","h":"‘What would Batman do?’ Not quit.","sc":"batman","x":["Self-distancing"]},{"o":3,"g":"pretend","t":"Self-distancing","d":"Stepping back to view your own situation from the outside; the proposed mechanism of the Batman effect.","e":"A child asks herself, ‘Is Elsa working hard?’ instead of ‘Am I working hard?’","h":"It’s easier to advise a friend than yourself. Become the friend.","sc":"batman","x":["Batman effect"]},{"o":3,"g":"pretend","t":"Candy Witch finding","d":"66% of children believed a made-up ‘Candy Witch’ was real; belief was highest in OLDER children who were visited by her.","e":null,"h":"Older + ‘evidence’ (a visit) = more belief. Counterintuitive, so testable.","sc":"witch"},{"o":4,"g":"risky","t":"Risky play","d":"Thrilling and exciting forms of physical play that involve uncertainty and a risk of physical injury.","e":"A seven-year-old climbs higher in a tree than she ever has before, heart pounding.","h":"Thrill + uncertainty + could-get-hurt.","sc":"risky","x":["Physical play","Play at high speeds","Play near elements","Play with a chance of getting lost","Play with heights","Play with tools","Rough-and-tumble play"]},{"o":4,"g":"risky","t":"Play with heights","d":"Risky play involving climbing or jumping from high places.","e":"Climbing to the top of the tallest playground tower.","h":"One of lecture’s six kinds of risky play: heights, high speeds, tools, elements, getting lost, rough and tumble.","sc":"risky","x":["Play near elements","Play with a chance of getting lost","Risky play"]},{"o":4,"g":"risky","t":"Play near elements","d":"Risky play near things in the environment that could harm, like fire or deep water.","e":"Poking a campfire with a stick; playing at the edge of a pond.","h":"Elements = environment. Tools = in your hand.","sc":"risky","x":["Play with a chance of getting lost","Play with heights","Risky play"]},{"o":4,"g":"risky","t":"Play with a chance of getting lost","d":"Risky play in which children explore out of adults’ sight and could lose their way.","e":"Wandering through the woods behind the school with no adult watching.","h":"Out of sight, on your own.","sc":"risky","x":["Play near elements","Play with heights","Risky play"]},{"o":0,"g":"stage","t":"Unoccupied play","d":"Behaviour that seems random and without a specific goal; the least common form of play.","e":"A toddler wanders the room, briefly touching things, not really doing anything in particular.","h":"Not occupied with anything yet.","sc":"stages","x":["Non-social play","Onlooker play","Solitary play"]},{"o":4,"g":"risky","t":"Rough-and-tumble play","d":"Play fighting, wrestling and chasing; an example of physical play and a kind of risky play.","e":"Siblings wrestling and laughing on the living-room floor.","h":"Shows up on BOTH lists: physical play and risky play.","sc":"risky","x":["Physical play","Risky play"]},{"o":5,"g":"outdoor","t":"Outdoor play","d":"Unstructured play that takes place outside.","e":"Kids roam the backyard making up games with whatever they find.","h":"Soccer practice is outside but structured, so it doesn’t count.","sc":"outdoor","x":["Nature play"]},{"o":5,"g":"outdoor","t":"Nature play","d":"Play in a natural environment and/or with natural elements or materials (water, mud, sticks, leaves, rocks).","e":"Making ‘soup’ from mud and leaves, even on a paved patio.","h":"The ‘and/or’ matters: natural PLACE or natural STUFF.","sc":"outdoor","x":["Outdoor play"]},{"o":5,"g":"outdoor","t":"Buffer to stress","d":"Something that softens the impact of stress; nearby nature may act as one (Wells & Evans, 2003).","e":"Two kids face the same family stress; the one with green space nearby copes better.","h":"Doesn’t remove the storm, just hands you an umbrella.","sc":"greenbuffer"},{"o":5,"g":"outdoor","t":"Cognitive restoration","d":"Recovery from attentional fatigue, which natural outdoor settings promote (Ramsden et al.).","e":"After recess in a green yard, students can focus again.","h":"Nature = phone charger for your attention.","sc":"greenbuffer"},{"o":6,"g":"ramsden","t":"Developmental vulnerability","d":"Scoring as vulnerable on one or more of the EDI’s five domains at kindergarten; the outcome in Ramsden et al.","e":null,"h":"32.9% of children were vulnerable on 1+ domains.","sc":"edi5"},{"o":6,"g":"ramsden","t":"CHEQ","d":"Childhood Experiences Questionnaire: caregiver report of a child’s experiences in the six months before kindergarten.","e":null,"h":"Parents ‘CHEQ-ing in’ on home life.","sc":"ramsden"},{"o":6,"g":"ramsden","t":"EDI","d":"Early Development Instrument: teacher ratings of kindergarten children across five developmental domains.","e":null,"h":"Teachers rate; five domains: Physical, Social, Emotional, Language & cognitive, Communication.","sc":"edi5"},{"o":6,"g":"ramsden","t":"Displacement","d":"Screen time replacing time that would otherwise go to active play, connection with caregivers and peers, and sleep.","e":"An hour of tablet time after daycare means an hour not spent playing outside.","h":"A day is a pie. Bigger screen slice, smaller play slice.","sc":"displace","x":["Dose-response"]},{"o":6,"g":"ramsden","t":"Dose-response","d":"A pattern in which more of an exposure goes with more of an outcome.","e":"Each step up in daily screen time went with higher odds of vulnerability.","h":"Bigger dose, bigger effect.","sc":"three","x":["Displacement"]},{"o":6,"g":"ramsden","t":"Adjusted odds ratio","d":"A measure of association after accounting for confounders: 1 = no link, below 1 = lower odds, above 1 = higher odds.","e":null,"h":"1.0 is the middle of the seesaw. 0.92 tips safer; 1.38 tips riskier.","sc":"oddsdial"},{"o":6,"g":"ramsden","t":"Residual confounding","d":"Unmeasured factors that could still explain an association even after statistical adjustment.","e":"Parenting style might drive both screen use and vulnerability.","h":"The confounders you DIDN’T measure.","sc":"corr","x":["Confound"]},{"o":6,"g":"ramsden","t":"Social desirability bias","d":"Answering in a way that makes you look good, which distorts self- or caregiver reports.","e":"A parent under-reports their child’s daily screen time.","h":"Would you admit to 4 hours of iPad?","sc":"ramsden"},{"o":7,"g":"apply","t":"Generalizability","d":"Whether findings from one sample hold for other people, places and cultures.","e":"Results from BC kindergarteners may not apply to children elsewhere.","h":"Does it travel?","sc":"barriers","x":["External validity"]},{"o":7,"g":"apply","t":"Ethics of responsibility","d":"The concern about confidently applying or promoting findings that are only correlational.","e":"Promising parents that more pretend play WILL raise self-control.","h":"Don’t write cheques the data can’t cash.","sc":"barriers"},{"o":9,"g":"teach","t":"Pygmalion effect","d":"Teachers’ expectations for students shape students’ actual performance (a self-fulfilling prophecy).","e":"Students randomly labelled ‘bloomers’ ended up gaining more than classmates.","h":"Treat a kid like a star and they start to shine.","sc":"pygmalion"},{"o":9,"g":"teach","t":"\"Bloomers\"","d":"Students in Rosenthal & Jacobson (1968) whom teachers were told would show intellectual growth; actually chosen at random.","e":null,"h":"Random label, real results.","sc":"pygmalion"},{"o":10,"g":"work","t":"Academic work","d":"What is being taught in the classroom and what students are asked to learn and do.","e":null,"h":"Best when interesting, meaningful and at an appropriate level.","sc":"curriculum"},{"o":11,"g":"sel","t":"Social-emotional learning (SEL)","d":"Schooling that goes beyond reading, writing and arithmetic to teach social and emotional skills.","e":"A weekly class lesson on naming feelings and solving conflicts.","h":"The 3 Rs plus Relationships.","sc":"sel"},{"o":11,"g":"sel","t":"Positive peer reporting (tootling)","d":"An SEL practice in which students notice and report positive things classmates do.","e":"‘Thank you for lending me your pencil.’ ‘I like that you included me.’","h":"The opposite of tattling.","sc":"tootle"},{"o":11,"g":"sel","t":"PATHS","d":"An SEL program named in lecture as an example alongside positive peer reporting.","e":null,"h":"PATHS + tootling = lecture’s two SEL examples.","sc":"sel"},{"o":12,"g":"active","t":"Active learning","d":"Learning that engages students in doing and thinking, not just receiving.","e":"Students test paper bridges instead of copying notes about bridges.","h":"Minds-on beats sit-and-listen.","sc":"pillars5","x":["Embodied learning","Iterative learning"]},{"o":12,"g":"active","t":"Iterative learning","d":"Learning through repeated attempts with feedback.","e":"Build, test, see it fail, rebuild.","h":"Do it again, but better.","sc":"pillars5","x":["Active learning","Embodied learning"]},{"o":12,"g":"active","t":"Embodied learning","d":"Learning through bodily, physical experience of a concept.","e":"Standing farther from the basket for a bigger fraction in Fraction Ball.","h":"Your BODY does the maths.","sc":"fball","x":["Active learning","Iterative learning"]},{"o":13,"g":"fb","t":"Fraction Ball","d":"A set of games on a basketball court re-lined so shots are worth fractions and decimals, tallied on a number line.","e":null,"h":"The court is a number line you can stand on.","sc":"fball"},{"o":13,"g":"fb","t":"Rational numbers","d":"Fractions and decimals; notoriously hard for children and a gatekeeper to later maths.","e":null,"h":"‘What is .4 as a fraction?’","sc":"numline"},{"o":13,"g":"fb","t":"Whole number bias","d":"Wrongly applying whole-number rules to fractions and decimals.","e":"Thinking .274 is bigger than .83 because 274 is bigger than 83.","h":"‘More digits = bigger’ betrays you after the decimal point.","sc":"numline"},{"o":13,"g":"fb","t":"Near transfer","d":"Improvement on numbers and skills that were directly presented in the game.","e":"Placing 1/4 or .25 on a number line after playing on a court marked in fourths.","h":"Same neighbourhood as what you practised.","sc":"fresult"},{"o":13,"g":"fb","t":"Far transfer","d":"Improvement on numbers or skills that were not presented in the game.","e":"Placing 5/10 or .80 on a number line when the court never showed them.","h":"A whole different town.","sc":"fresult"},{"o":13,"g":"fb","t":"Ghost Number Line","d":"A chalk number line from 0 to 5 with no markings, added to Fraction Ball to train estimation.","e":null,"h":"The tick marks are invisible; you picture them.","sc":"ghost"},{"o":13,"g":"fb","t":"Random assignment","d":"Placing participants into conditions by chance so groups are equal at the start; allows causal claims.","e":"Half of each class drawn at random to play Fraction Ball, half to regular PE.","h":"A coin flip makes the groups twins.","sc":"fdesign"},{"o":13,"g":"fb","t":"External validity","d":"How well a study’s results apply beyond its own sample and setting.","e":"Fraction Ball was tested at one school with teachers facilitating.","h":"Internal = did it really work HERE? External = would it work ELSEWHERE?","sc":"fdesign","x":["Generalizability"]},{"o":14,"g":"goal","t":"Mastery goals","d":"Achievement goals focused on developing competence, learning, understanding and improvement.","e":"‘I want to really understand how this works.’","h":"Competing with yesterday’s you.","sc":"goals","x":["TARGETS"]},{"o":14,"g":"goal","t":"Performance (relative ability) goals","d":"Achievement goals focused on being superior, besting others, or avoiding looking poor compared with others.","e":"‘I want the top mark’ or ‘I don’t want to look dumb next to everyone.’","h":"Competing with the person beside you.","sc":"goals"},{"o":14,"g":"goal","t":"TARGETS","d":"Classroom features that shape achievement goals: Task, Authority, Recognition, Grouping, Evaluation, Time, Social relations.","e":null,"h":"Seven dials a teacher can turn toward mastery or performance.","sc":"targets","x":["Mastery goals"]},{"o":15,"g":"org","t":"Stage–environment fit","d":"The match between a person’s developmental needs and what their environment provides; poor fit harms adjustment.","e":"Teens need autonomy, but middle school adds teacher control and comparison.","h":"Right when teens want the wheel, school takes it away.","sc":"fit","x":["Developmental mismatch","Person–environment fit"]},{"o":15,"g":"org","t":"Developmental mismatch","d":"When a school environment clashes with students’ developmental stage, as in middle/high schools or early start times.","e":"A 7:50 a.m. bell for teenagers whose body clocks run late.","h":"Square peg, round hole.","sc":"fit","x":["Person–environment fit","Stage–environment fit"]},{"o":15,"g":"org","t":"School transition","d":"Moving from one school to the next; linked with dips in motivation, interest in school and confidence.","e":"Starting middle school in Grade 6.","h":"Every move costs something.","sc":"transitions"},{"o":15,"g":"org","t":"Summer learning loss","d":"The decrease in academic performance over summer break, possibly greater for low-income families.","e":null,"h":"Use it or lose it.","sc":"summer","x":["Balanced calendar"]},{"o":15,"g":"org","t":"Confound","d":"A factor tangled up with the variable of interest that could explain the result instead.","e":"Private schools are also smaller and serve higher-SES families.","h":"It’s not the school, it’s who walks in.","sc":"private","x":["Residual confounding"]},{"o":16,"g":"track","t":"Ability tracking","d":"Separating students into different classes based on ability level.","e":"A school sorts Grade 8 students into advanced, regular and basic maths.","h":"Sorting hats for maths class.","sc":"tracks"},{"o":16,"g":"track","t":"Person–environment fit","d":"The idea that people do best when the setting matches their needs; one argument for tracking.","e":null,"h":"Teach each kid at their level… in theory.","sc":"tracks","x":["Developmental mismatch","Stage–environment fit"]},{"o":17,"g":"div","t":"School ethnic diversity","d":"How mixed a school’s student body is; linked to fewer negative stereotypes (majority) and more safety, less loneliness, higher self-worth (minority).","e":null,"h":"Less ‘us vs them’, less ‘only one’.","sc":"diversity"},{"o":18,"g":"leer","t":"Diversity ideology","d":"A lay perspective on how institutions should handle diversity, e.g., color-evasive or multicultural.","e":null,"h":"Evade it or embrace it.","sc":"wordsact","x":["Color-evasiveness","Multiculturalism"]},{"o":18,"g":"leer","t":"Color-evasiveness","d":"Downplaying or ignoring racial/ethnic group differences and emphasizing individual uniqueness.","e":"‘We don’t see race here, we just see students.’","h":"Evasive = dodging the topic.","sc":"wordsact","x":["Assimilation","Diversity ideology","Multiculturalism"]},{"o":18,"g":"leer","t":"Multiculturalism","d":"Recognizing and valuing social group differences.","e":"A school celebrates students’ varied cultural backgrounds in curriculum and events.","h":"Differences are seen, named and valued.","sc":"wordsact","x":["Color-evasiveness","Diversity ideology"]},{"o":18,"g":"leer","t":"Diversity dishonesty","d":"A mismatch between what an organization says and what it does about diversity.","e":"A website says ‘we celebrate diversity’ while suspension gaps go unaddressed.","h":"A poster, not a practice.","sc":"mission"},{"o":18,"g":"leer","t":"Racialized discipline gap","d":"The excess risk of suspension or expulsion for Students of Color compared with White students.","e":null,"h":"One of Leer’s ‘walk the talk’ checks.","sc":"leermod"},{"o":18,"g":"leer","t":"Moderator","d":"A variable that changes the strength or direction of a relationship between two others.","e":"A diversity statement’s link to distress depended on how diverse the school was.","h":"‘It depends on…’ = moderator.","sc":"leermod"},{"o":18,"g":"leer","t":"Psychological distress","d":"Leer et al.’s mental health outcome: recent feelings such as hopelessness, measured with a six-item scale.","e":null,"h":"Went UP for Youth of Color in schools with pro-diversity statements.","sc":"mission"},{"o":20,"g":"law","t":"Penal proportionality","d":"The severity of punishment should be determined by the harm caused and by the culpability of the person causing it.","e":"Two people cause the same harm, but the coerced one gets a lighter sentence.","h":"Two pans: how BAD was it, how BLAMEWORTHY are you.","sc":"scales","x":["Culpability","Mitigation"]},{"o":20,"g":"law","t":"Culpability","d":"Blameworthiness: how responsible a person is for the harm they caused.","e":null,"h":"Culprit → culpable.","sc":"scales","x":["Mitigation","Penal proportionality"]},{"o":20,"g":"law","t":"Excuse","d":"Something that removes criminal responsibility entirely.","e":null,"h":"100% off.","sc":"scales","x":["Mitigating factors"]},{"o":20,"g":"law","t":"Mitigation","d":"A lessening of criminal responsibility and of punishment.","e":"A sentence is reduced because the offender acted under threat.","h":"A discount, not a free pass.","sc":"scales","x":["Culpability","Mitigating factors","Penal proportionality"]},{"o":21,"g":"psy","t":"Cognitive capacity","d":"Abilities that support reasoned, deliberate decision making (working memory, logical reasoning); adult-like by about 16.","e":null,"h":"The thinking is ready early.","sc":"coldhot","x":["Cold cognition"]},{"o":21,"g":"psy","t":"Psychosocial maturity","d":"Capacities such as self-regulation, future orientation and resistance to peers; still developing to at least 21.","e":null,"h":"The brakes come late.","sc":"coldhot","x":["Maturational imbalance (dual systems)","Maturity gap","Self-regulation"]},{"o":21,"g":"psy","t":"Self-regulation","d":"The ability to control impulses; improves gradually throughout adolescence.","e":"Pausing to plan before the first move on a puzzle.","h":"‘Hmm, wait…’ instead of grabbing.","sc":"tower","x":["Maturational imbalance (dual systems)","Maturity gap","Psychosocial maturity"]},{"o":21,"g":"psy","t":"Future orientation","d":"The ability to think about and weigh long-term consequences.","e":"Choosing $1,000 in a year over $400 tomorrow.","h":"Seeing past this weekend.","sc":"money","x":["Temporal discounting"]},{"o":21,"g":"psy","t":"Temporal discounting","d":"Valuing a reward less the longer you have to wait for it; stronger in adolescents.","e":"A teen grabs the small reward now over a larger one later.","h":"Later rewards look smaller than they are.","sc":"money","x":["Future orientation"]},{"o":21,"g":"psy","t":"Sensation seeking","d":"The drive to seek out new and exciting experiences; peaks in adolescence.","e":"A 16-year-old is drawn to the fastest, scariest ride.","h":"Peaks in the teens, then declines.","sc":"igt","x":["Reward sensitivity"]},{"o":21,"g":"psy","t":"Reward sensitivity","d":"How strongly rewards drive behaviour; adolescents are driven more by reward and less by risk.","e":null,"h":"Gas pedal floored, brakes soft.","sc":"igt","x":["Sensation seeking"]},{"o":21,"g":"brain","t":"White matter","d":"Myelinated connections in the brain; increases linearly across adolescence.","e":null,"h":"White = Wiring. More insulation every year.","sc":"brain"},{"o":21,"g":"brain","t":"Grey matter","d":"Neurons and synapses; peaks in early adolescence, then decreases (pruning).","e":null,"h":"Grey = Garden. Overgrow, then prune.","sc":"brain"},{"o":21,"g":"brain","t":"Maturational imbalance (dual systems)","d":"The reward system changes early (puberty) while the cognitive control system matures slowly into the mid-twenties.","e":null,"h":"Sports car engine, bicycle brakes.","sc":"dual","x":["Maturity gap","Psychosocial maturity","Self-regulation"]},{"o":21,"g":"brain","t":"Prefrontal cortex","d":"Brain region mainly responsible for self-control, planning and weighing costs and rewards.","e":null,"h":"The ‘let’s think about this’ part.","sc":"dual"},{"o":21,"g":"brain","t":"Limbic system","d":"Brain system mainly responsible for the adolescent rise in sensation seeking and reward seeking.","e":null,"h":"The ‘let’s GO’ part.","sc":"dual"},{"o":22,"g":"age","t":"Cold cognition","d":"Decision making that allows unhurried, logical reflection without emotional arousal; mature by about 16.","e":"Deciding how to vote after reading about the candidates at home.","h":"Slow, calm, time to think.","sc":"coldhot","x":["Cognitive capacity"]},{"o":22,"g":"age","t":"Hot context","d":"A decision made under emotional arousal, time pressure or peer presence, where self-regulation is needed.","e":"Deciding whether to race a friend’s car at midnight.","h":"Fast, fired up, friends watching.","sc":"coldhot"},{"o":22,"g":"age","t":"Age of majority","d":"The age at which a person is recognized as a legal adult overall; 18 in about 90% of nations.","e":null,"h":"Historically 21, from medieval armor.","sc":"armor"},{"o":22,"g":"age","t":"Age of license","d":"The age at which a person is permitted to do something specific, such as drive or buy alcohol.","e":"Driving at 16, drinking at 21 in the U.S.","h":"A permit for ONE thing.","sc":"armor"},{"o":22,"g":"age","t":"Social redefinition","d":"A society’s process of deciding who is ready for the rights and responsibilities of adulthood.","e":null,"h":"From ‘minor’ to ‘adult’ on paper.","sc":"rock"},{"o":22,"g":"age","t":"Maturity gap","d":"The lag between cognitive maturity (about 16) and psychosocial maturity (at least 21): as much as five years.","e":null,"h":"16 + 5 = 21.","sc":"agebar","x":["Maturational imbalance (dual systems)","Psychosocial maturity","Self-regulation"]},{"o":0,"g":"stage","t":"Social play","d":"Play alongside or with other children. On lecture’s table it covers parallel, associative and cooperative play.","e":null,"h":"Beside → with → together.","sc":"stagetab","x":["Associative play","Cooperative play","Non-social play","Parallel play"]},{"o":4,"g":"risky","t":"Play at high speeds","d":"Risky play where the thrill comes from going fast.","e":"Racing a bike as fast as possible down a steep hill.","h":"One of lecture’s six kinds of risky play.","sc":"risk6","x":["Risky play"]},{"o":4,"g":"risky","t":"Play with tools","d":"Risky play that involves using tools that could cause injury.","e":"Whittling a stick with a pocketknife.","h":"One of lecture’s six kinds of risky play.","sc":"risk6","x":["Risky play"]},{"o":8,"g":"why","t":"Assimilation","d":"Using schooling to bring children into one dominant national culture and identity.","e":"A government makes school compulsory so all children learn one official language.","h":"Lecture paired it with national identity as a reason schools exist.","sc":"whyschool","x":["Color-evasiveness"]},{"o":15,"g":"org","t":"Balanced calendar","d":"A year-round school calendar that spreads the long summer break into shorter breaks across the year.","e":null,"h":"Same school days, spread out. Lecture’s answer to ‘year-round school?’","sc":"summer","x":["Summer learning loss"]},{"o":20,"g":"law","t":"Mitigating factors","d":"Features of a person or situation that lessen criminal responsibility: impaired decision making, compelling external circumstances, or an act that is out of character.","e":null,"h":"Three ways blame can shrink.","sc":"mitig","x":["Excuse","Mitigation"]}],"L":[{"o":0,"t":"The 6 features of play","items":["Joyful","Active engagement","Spontaneous","Voluntary","Intrinsically motivated","Unrelated to immediate survival"],"decoys":["Adult-directed","Externally rewarded","Goal-oriented","Competitive"],"h":"Nobody makes you, nobody pays you, you just want to."},{"o":0,"t":"Stages of play: the NON-SOCIAL side","items":["Unoccupied play","Solitary play","Onlooker play"],"decoys":["Parallel play","Associative play","Cooperative play","Guided play"],"h":"U-S-O, then P-A-C."},{"o":0,"t":"Stages of play: the SOCIAL side","items":["Parallel play","Associative play","Cooperative play"],"decoys":["Solitary play","Onlooker play","Unoccupied play","Pretend play"],"h":"Beside → with → together."},{"o":1,"t":"Types of play named in lecture","items":["Games","Object play","Guided play","Physical (rough-and-tumble) play","Pretend play","Risky play","Outdoor/nature play"],"decoys":["Parallel play","Onlooker play","Passive play","Digital play"],"h":"Stages = HOW social. Types = WHAT kind."},{"o":2,"t":"Benefits linked with play","items":["More advanced brain development","Reduction in stress","Improved cognitive skills","Improved social skills","Better mental health","Beneficial for learning","May push us to try harder things"],"decoys":["Proven to raise IQ","Earlier puberty","Less need for sleep","Higher class rank"],"h":"‘Linked with’, ‘correlated with’: careful wording."},{"o":3,"t":"How pretend play differs across cultures","items":["Content reflects community values and traditions","Amounts of pretend play vary","Shaped by parent attitudes and eliciting"],"decoys":["Absent in some cultures","Begins at very different ages","Depends on owning toys"],"h":"Same game, different skins."},{"o":3,"t":"Outcomes associated with pretend play","items":["Self-control, emotion regulation, perseverance","Perspective taking","Language skills","Cognitive capabilities","Social competence"],"decoys":["Gross motor skills","Risk assessment","Higher grades in maths","Fewer injuries"],"h":"Practising being someone else."},{"o":4,"t":"The 6 kinds of risky play","items":["Play with heights","Play at high speeds","Play with tools","Play near elements (fire rt time","Teacher salary","Parent income"],"h":"Who’s here + how are they treated."},{"o":18,"t":"Leer et al.: limitations","items":["Not causal (possible confounds)","Mission statements capture only part of how schools value diversity","Didn’t measure whether students noticed inequities","Data from 2014–15, one state"],"decoys":["Sample too small","Self-report ideology measure only","No achievement data","Only one school"],"h":"A statement is a proxy."},{"o":19,"t":"3 areas where children meet the legal system","items":["Children as eyewitnesses","Impact of legal proceedings on children (divorce, custody)","Youth suspected of crimes (competence, blame, punishment)"],"decoys":["Children as jurors","School attendance law","Adoption research"],"h":"Witness, affected, accused."},{"o":20,"t":"The 3 factors that can mitigate criminal responsibility","items":["Impairments / deficiencies in decision making","Offence in response to compelling external circumstances","Act is out-of-character"],"decoys":["Young age alone","Low harm caused","Showing remorse","Low family income"],"h":"D-E-C: Decision, External, Character."},{"o":21,"t":"The 4 psychosocial capacities from lecture","items":["Self-regulation (impulse control)","Future orientation","Sensation seeking & reward sensitivity","Peer influence"],"decoys":["Working memory","Logical reasoning","Vocabulary","Symbolic thought"],"h":"Self-control, Future, Sensation, Peers."},{"o":21,"t":"Brain changes in adolescence","items":["White matter (myelination): linear increase","Grey matter (neurons/synapses): peaks early, then decreases","Result: gradually more efficient"],"decoys":["White matter decreases","Grey matter rises until 25","Brain doubles in size","No change after 10"],"h":"White = Wiring. Grey = Garden."},{"o":22,"t":"‘Cold’ contexts: a boundary around 16 is reasonable","items":["Voting","Informed consent for research","Autonomous medical decisions","Serving as a competent defendant"],"decoys":["Driving","Buying alcohol","Gambling","Adult criminal responsibility"],"h":"Slow, calm, time to think."},{"o":22,"t":"‘Hot’ contexts: 18 or older (perhaps 21)","items":["Driving","Consuming alcohol","Gambling","Adult standards of criminal responsibility"],"decoys":["Voting","Research consent","Medical decisions","Competence to stand trial"],"h":"Fast, fired up, friends watching."},{"o":22,"t":"Non-scientific ways legal ages have been set","items":["Intuitive (tradition, common sense)","Administrative (one simple age)","Fairness (consistency across purposes)","Consequentialist (likely societal outcomes)"],"decoys":["Cognitive evidence","Neurobiological evidence","Psychosocial evidence","Random choice"],"h":"I-A-F-C."},{"o":22,"t":"3 statistical ways to quantify maturity","items":["Comparing age-group means (ANOVA)","Polynomial regression (with rate of change)","Piecewise (change-point) regression"],"decoys":["Random assignment","Odds ratios","Brain scans","Interviews"],"h":"Groups, curves, breakpoints."},{"o":19,"t":"Supreme Court cases, in order","items":["Thompson (1988): no death penalty under 16","Roper (2005): no death penalty under 18","Graham (2010): no life without parole for non-homicide under 18","Miller (2012): no mandatory life without parole under 18","Montgomery (2016): Miller applies retroactively"],"decoys":["Roper (2005): no life sentences under 21","Graham (2010): death penalty allowed at 17","Miller (2012): juveniles can never be tried as adults"],"h":"T-R-G-M-M."},{"o":0,"t":"All six play categories, in the table’s order","items":["1. Unoccupied","2. Solitary","3. Onlooker","4. Parallel","5. Associative","6. Cooperative"],"decoys":["Guided","Pretend","Sociodramatic","Risky"],"h":"U-S-O, then P-A-C."},{"o":3,"t":"Lecture’s three open questions about pretend play’s benefits","items":["Is pretend play necessary to develop these skills?","Does it cause these skills?","Or is it just correlated with these skills?"],"decoys":["Is it universal?","Is it declining?","Is it safe?"],"h":"Necessary? Causal? Or just correlated?"},{"o":11,"t":"What tootling (positive peer reporting) is linked with","items":["Improved peer interactions","Reduced aggression/disruption","More academic engagement"],"decoys":["Higher IQ scores","Fewer absences","Better handwriting","Higher class rank"],"h":"Kinder classmates, calmer room, more learning."},{"o":15,"t":"Private vs. public school: the research story","items":["Traditional research shows benefits for private school","But confounded with school size, SES, etc.","Newer research controlling for these suggests no advantage","Lottery studies are mixed: often no improvement, or even decline"],"decoys":["Private schools always raise achievement","Lottery winners gain two grade levels","Public schools are always larger and better"],"h":"Looks better → confounds → no advantage → lotteries mixed."},{"o":16,"t":"Two possible arguments FOR ability tracking","items":["Maximize person–environment fit?","Better for social comparison?"],"decoys":["Raises self-esteem in low tracks","Improves instructional quality for all","Reduces school transitions","Increases ethnic diversity"],"h":"Both had question marks on the slide."},{"o":16,"t":"Effects of HIGH ability tracks","items":["Benefits academically","Possible costs for self-esteem","Possible costs for self-concept","Possible costs for well-being"],"decoys":["Feelings of inadequacy","Lower instructional quality","Weaker peer groups"],"h":"Good for grades, maybe not for how you see yourself."},{"o":19,"t":"Issues for youth suspected of committing crimes","items":["Competence","Blame","Punishment"],"decoys":["Custody","Suggestibility","Testimony","Visitation"],"h":"Can they? Are they to blame? What happens to them?"},{"o":20,"t":"Penal proportionality: what sets the severity of punishment","items":["The harm caused","The culpability of the person causing harm"],"decoys":["The offender’s age alone","Public opinion","The cost of prison","The victim’s wishes"],"h":"How bad + how much to blame."},{"o":21,"t":"Cauffman et al. (2010): two separate trends","items":["Most driven to approach rewards in the teen years","Avoidance of risk not until 18+"],"decoys":["Reward drive keeps rising to age 30","Risk avoidance is adult-like by age 12","Both peak in childhood"],"h":"The gas pedal arrives before the brakes."}],"R":[{"id":"ramsden","o":6,"short":"Ramsden, Gill & Brussoni (2026)","cite":"Associations between early childhood experiences in outdoor play, risky play and screen time, and children’s developmental health outcomes in kindergarten in British Columbia. Early Human Development.","kind":"Research article · longitudinal, correlational","one":"More chances for risky play → lower odds of being developmentally vulnerable in kindergarten. More screen time → higher odds, in every domain. Outdoor play frequency → no overall link, but helped in two domains.","rows":[["Background","Starting primary school is a high-stakes transition; how children begin often sets up later advantages and opportunity gaps. Children now play outdoors less (urbanization, safety concerns, screens) and supervision has become risk-averse."],["Question","Are early outdoor play, risky play and screen time (in the 6 months before kindergarten) associated with developmental vulnerability in kindergarten?"],["Who","4,968 children (about 51% boys, mean age about 5.5) entering kindergarten in British Columbia in 2023 and 2024; 343 schools in 23 districts."],["Method","Two linked questionnaires. CHEQ: caregivers (mostly mothers) report outdoor play frequency, chance for risky play, and daily screen time. EDI: kindergarten teachers rate each child in February across 5 domains. Outcome = vulnerable on 1+ domains. Logistic regression adjusting for sex, birthplace, income, marital status, siblings, urban/rural."],["The 5 EDI domains","Physical health & well-being · Social competence · Emotional maturity · Language & cognitive development · Communication skills & general knowledge."],["Results","32.9% vulnerable on 1+ domains. Risky play: aOR 0.92, reduced overall vulnerability (and in 4 domains: all but emotional maturity). Screen time: aOR 1.38, increased overall and in ALL 5 domains (dose-response). Outdoor play: not linked overall; reduced vulnerability in physical health & well-being and communication & general knowledge."],["Family factors (from the tables)","Boys had nearly three times the odds of girls (aOR about 2.8 in all three models; 65.6% of vulnerable children were boys). Lower income raised the odds step by step (under $20,000: about 2.6 to 2.7 times the odds of over $200,000). Single/separated/widowed/divorced households: about 1.4 to 1.5 times. One sibling vs. none: about 0.75. Urban vs. rural and birthplace: no difference. Careful: one sentence in the Results text says ‘being female’, which contradicts every table."],["Why (authors' ideas)","Risky play builds self-regulation, social negotiation and motor skill, and gives exposure to manageable fear. Outdoor benefits are domain-specific, so QUALITY (challenge, autonomy, social context) may matter more than minutes. Screens DISPLACE play, connection and sleep."],["Implications","Limit early screen time (guideline: under 1 h/day for under-fives; over 75% exceed it). Expand thrilling, challenging outdoor play. Treat risk and challenge as metrics, not just minutes per day. Build into early learning frameworks, child-care licensing and national guidelines. Give children time, space and freedom. Supports should be universal but proportionate to need."],["Strengths","Longitudinal linkage of parent-reported experiences with teacher-rated outcomes (two informants); large population sample; domain-level analysis."],["Limitations","Parental self-selection and modest CHEQ participation (44%, 36%) limit generalizability. Caregiver reports: recall or social desirability bias. No data on screen content/context or the quality of outdoor play. Residual confounding (parenting style, temperament, child care, neighbourhood). Observational, so not causal."]],"traps":["Outdoor play was NOT linked with overall vulnerability. Risky play was.","Parents reported the exposures; TEACHERS rated the outcome.","Longitudinal does not mean causal."]},{"id":"bustamante","o":13,"short":"Bustamante et al. (2022)","cite":"Fraction Ball: Playful and physically active fraction and decimal learning. Journal of Educational Psychology.","kind":"Research article · randomized experiment (pretest–posttest)","one":"Playing Fraction Ball in PE improved Grade 4–6 students’ rational-number scores compared with regular PE, especially converting between fractions and decimals.","rows":[["Background","Children (and adults) struggle with fractions and decimals, which gatekeep later maths. Children learn best in active, meaningful, engaged, socially interactive settings, so play is an ideal context."],["What is Fraction Ball?","A basketball court re-lined as a number line: arcs farther from the basket are worth larger fractions/decimals (fourths at one end, thirds at the other), with fractions and decimals shown side by side. A number-line scoreboard runs along the sideline. Roles: shooter, rebounder (calls the value), counter (walks the number line). Co-designed with teachers."],["Research ideas behind it","Number lines (linear, not circular) · whole number bias (e.g., thinking .274 > .83) · learning by comparing representations · embodied cognition · playful learning."],["Question","Does playing Fraction Ball improve rational-number learning? Does it transfer to near and far items? Does it depend on grade, gender or prior knowledge?"],["Who","One school in Santa Ana, California serving mostly low-income Latino students. Pilot: 69 students (Grades 5–6). Efficacy: 160 students (Grades 4–6)."],["Method","Students randomly assigned within classrooms to Fraction Ball during PE or regular PE (control). Both groups kept regular maths instruction. Pretest and posttest of fraction and decimal skills (timed and untimed; near- and far-transfer items). Pilot: 4 games, 4 periods. Efficacy: 6 games, 6 periods, preregistered."],["Revisions after the pilot","Students say the maths out loud; debriefing after rounds; new components (Ghost Number Line, Supercharge Points, ‘Who goes first?’); more sessions."],["Results","Pilot: only converting fractions to decimals improved. Efficacy: overall composite up about 0.4 SD (moderate to large); near transfer improved; biggest gains in converting between fractions and decimals. NOT significant: far transfer, number line estimation, fraction/decimal addition. No moderation by grade, gender or prior knowledge."],["Why conversions?","Learning from comparison: fractions and decimals appear side by side on the court and scoreboard."],["Implications","Low-cost and highly scalable (chalk or paint on any court; free materials). Schoolyards can host play-based learning. A model of researcher–teacher co-design and iterative improvement."],["Limitations","Limited external validity (one school; teachers facilitating). A supplement, not a substitute, for maths instruction. Didn’t isolate which components work. Researcher-designed measures; no delayed posttest; no significant far transfer."]],"traps":["It IS an experiment (random assignment), so causal claims are fair.","Far transfer did NOT improve significantly.","The control group did regular PE, not extra maths."]},{"id":"leer","o":18,"short":"Leer, Gaither & Gassman-Pines (2025)","cite":"It’s not what you say it’s what you do: School diversity ideologies and adolescent mental health and academic engagement. Journal of Research on Adolescence.","kind":"Research article · correlational (survey + administrative data)","one":"A school saying it values diversity is not enough. Where pro-diversity statements weren’t matched by action, they did not raise achievement and were linked with MORE psychological distress, especially for Youth of Color in majority-White schools.","rows":[["Background","Two diversity ideologies: color-evasive (downplay group differences) vs. multicultural (recognize and value them). Prior research: valuing diversity supports belonging, health and engagement; ignoring differences harms minoritized youth. Adolescents are especially sensitive (identity formation, sensitivity to exclusion, need for authenticity). Workplace research on ‘diversity dishonesty’ shows a say–do mismatch hurts."],["Questions","(1) How does explicitly valuing diversity relate to adolescents’ school belonging, mental health and achievement? (2) Does it depend on student diversity, teacher diversity, racial discipline gaps, and racial gaps in Gifted & Talented placement?"],["Hypothesis","Pro-diversity statements would be linked with better outcomes, especially for Youth of Color, and especially in schools that were diverse and equitable."],["Who","Grade 5–8 students in North Carolina public schools, 2014–15. Survey sample (Project RAISE): N = 1,692. Administrative records: N = 300,063. 690 schools."],["Method","School mission statements coded yes/no for explicitly valuing diversity (13% did). Outcomes: belonging, psychological distress, reading + maths test scores. Moderators from administrative data. Regression with school-level controls."],["Did schools walk the talk?","Barely. Pro-diversity schools had somewhat more diverse students, but NOT more diverse teachers, only slightly smaller discipline gaps, and LARGER racial gaps in gifted placement."],["Results","No overall main effect. Youth of Color: pro-diversity statement → more psychological distress, strongest in less diverse, majority-White schools. White youth: more distress when teachers were more diverse (and GT gaps low). Belonging: no link. Achievement: no link for Black, Latinx or American Indian youth; for Asian youth, positive only with a more diverse teaching staff (and small discipline gaps)."],["Interpretation","Performative multiculturalism: a mismatch between words and actions. Fits stage–environment fit theory (schools failing adolescents’ need to belong)."],["Implications","Diversity statements must be paired with action: redress inequities in discipline and academic tracking (the discussion also points to hiring diverse teachers). Words without action won’t close achievement gaps and may worsen mental health disparities."],["Limitations","Not causal (e.g., family racial-ethnic socialization could confound). Mission statements capture only part of how schools value diversity. Didn’t measure whether students were aware of inequities. Data from 2014–15 in one state."]],"traps":["The result was the OPPOSITE of the hypothesis.","No effect on school belonging.","Schools with statements did not have more diverse teachers."]},{"id":"steinberg","o":22,"short":"Steinberg & Icenogle (2019)","cite":"Using developmental science to distinguish adolescents and adults under the law. Annual Review of Developmental Psychology.","kind":"Review article · know the main concepts and themes","one":"Reasoning matures by about 16, but self-regulation under emotional arousal isn’t mature until at least 21. So the law should use different age boundaries for ‘cold’ decisions (around 16) and ‘hot’ ones (18–21).","rows":[["Premise","The age at which adult rights and responsibilities are granted should match the psychological capacities needed for good judgment in that specific context."],["Is adolescence real?","Not just a social construction: brain imaging shows distinct adolescent patterns, and juvenile rodents show similar risk taking and independence seeking. ‘Adolescence begins in biology and ends in culture.’"],["How ages were set before","Mostly non-scientific: intuitive, administrative, fairness, consequentialist. Age of majority was 21 (medieval armor), lowered to 18 around 1970. About 90% of nations use 18. Reasonable range: 16–21. Age of majority ≠ age of license ≠ age of consent."],["Supreme Court","Thompson (1988), Roper (2005), Graham (2010), Miller (2012), Montgomery (2016) progressively limited the harshest sentences for juveniles, relying more and more on developmental science."],["Cognitive","Working memory, response inhibition, cognitive flexibility, planning and logical reasoning plateau by mid-adolescence (about 15–17). 16–17-year-olds perform like adults in understanding legal proceedings and giving informed consent."],["Psychosocial","Impulse control, sensation seeking and reward sensitivity, future orientation (temporal discounting) and resistance to peers keep developing to 18 and beyond. Teens take more risks when peers are watching; adults don’t."],["Neurobiological","Maturational imbalance (dual systems): the reward system (limbic) ramps up at puberty; the control system (prefrontal cortex) and its connections keep maturing into the mid-twenties. Under emotional arousal, 18–21-year-olds look like mid-teens."],["The gap","Reasoning matures before self-regulation by as much as five years."],["Quantifying maturity","Three statistical approaches: compare age-group means (ANOVA), polynomial regression (rate of change), piecewise regression. They can give somewhat different ages."],["Proposal","‘Cold’ contexts (unhurried, calm): boundary around 16 → voting, research consent, medical decisions, competence as a defendant. ‘Hot’ contexts (arousal, time pressure, peers): 18 or older, perhaps 21 → driving, alcohol, gambling, adult criminal responsibility."],["Caveats","Societal needs can override science (driving and jobs). Cold vs. hot isn’t always clear (abortion; waiting periods help). Individuals vary (skill tests like driver exams help). A chronological boundary protects against biased case-by-case judgements. Science should inform, not dictate; scientists shouldn’t advocate."]],"traps":["Cognitive maturity ≠ psychosocial maturity.","Voting at 16 and adult sentencing at 21 are consistent, not contradictory.","Science informs the law; it doesn’t dictate it."]}]};

/* ---------- Tower Climb: a definition is thrown, name the term before it lands ---------- */
var G = null, GS = {u:0, p:1}, GFH = 70, PACE = [['Calm',16],['Steady',11],['Swift',7]];
function gStop(){ if(G){ G.live = false; G.tok = -1; if(G.raf) cancelAnimationFrame(G.raf); } }
function gPool(u){ var r = []; D.T.forEach(function(t, i){ if(!u || D.O[t.o].s===u) r.push(i); }); return r; }
function gTower(N){
  var W = 150, H = (N+5)*GFH+36, s = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'"><rect x="-600" y="'+(H-36)+'" width="2600" height="36" class="g-ground"/><rect x="-26" y="'+(H-42)+'" width="'+(W+52)+'" height="8" rx="3" class="g-step"/>';
  for(var k=0;k<=N;k++){ var yb = H-36-k*GFH;
    s += '<rect x="10" y="'+(yb-GFH)+'" width="'+(W-20)+'" height="'+GFH+'" class="'+(k%2?'g-b1':'g-b2')+'"/><path id="gw'+k+'" class="g-win" d="M'+(W/2-11)+' '+(yb-16)+' v-24 a11 11 0 0 1 22 0 v24z"/><rect x="4" y="'+(yb-5)+'" width="'+(W-8)+'" height="5" rx="2" class="g-led"/><rect x="'+(W-14)+'" y="'+(yb-6)+'" width="60" height="7" rx="3.5" class="g-ledge"/>';
    if(k && k%5===0) s += '<text x="22" y="'+(yb-46)+'" class="g-num">'+k+'</text>'; }
  var ty = H-36-(N+1)*GFH; s += '<path d="M-4 '+ty+' L'+(W/2)+' '+(ty-118)+' L'+(W+4)+' '+ty+'Z" class="g-roof"/><circle cx="'+(W/2)+'" cy="'+(ty-140)+'" r="36" class="g-halo"/><circle cx="'+(W/2)+'" cy="'+(ty-122)+'" r="4.5" class="g-fin"/>';
  return s+'</svg>';
}
function gSky(N, rate, far){
  var H = 460+N*GFH*rate, s = '<svg width="1000" height="'+H+'" viewBox="0 0 1000 '+H+'">', r = function(a, b){ return a+Math.random()*(b-a); };
  if(far){ [[330,120,34],[420,210,44],[520,150,36],[610,300,52],[720,180,38],[820,260,46],[930,140,34]].forEach(function(t){ var h = t[1]+N*GFH*rate*r(0.2,0.9); s += '<path class="g-sil" d="M'+(t[0]-t[2]/2)+' '+H+' V'+(H-h)+' L'+t[0]+' '+(H-h-t[2]*1.4)+' L'+(t[0]+t[2]/2)+' '+(H-h)+' V'+H+'Z"/>'; });

  return r; });
