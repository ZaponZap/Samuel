one by ~10 (adult size). New view (since late 1990s imaging): internal anatomy and connectivity keep maturing past 20."},{"id":"s4q039","s":4,"o":21,"t":"R","sc":"brain","q":"Why have scholars increasingly used ==neuroscience== (not just psychology) when arguing about adolescents and the law?","a":[["Laypeople find [[neuroscience]] more [[persuasive]] than psychology","Yes. That’s one reason Steinberg & Icenogle give, on top of the findings being consistent with behavioural evidence."],["Psychological studies of adolescents have been [[discredited]]","They’re consistent with the neuroscience."],["Courts are [[not allowed]] to consider psychological evidence","Courts have cited psychology."],["Brain scans can [[determine]] an individual’s exact maturity","They can’t; findings are about group patterns."],["Neuroscience is [[cheaper]] and faster than behavioural research","Not the reason."]],"k":"Brain evidence tends to persuade laypeople more than psychology does, and it lines up with the behavioural findings."},{"id":"s4q040","s":4,"o":22,"t":"R","sc":"agebar","q":"What is the ==central proposal== of Steinberg & Icenogle (2019)?","a":[["Use [[different ages]] for calm vs. emotionally [[arousing]] decisions","Yes: around 16 for contexts allowing unhurried, logical reflection; 18 or older (perhaps 21) for contexts that don’t."],["Use a [[single]] age of 18 for every legal purpose","They argue one age doesn’t fit all contexts."],["Raise [[every]] legal age to 25, when the brain is mature","Not proposed; they see 16–21 as the reasonable range."],["Replace age limits with [[individual]] maturity tests for everyone","They keep age boundaries (which also protect against biased judgements)."],["Let each [[judge]] decide maturity case by case","They note judgments can be biased, e.g., by race."]],"k":"Proposal: two kinds of contexts → two boundaries. ‘Cold’ ≈ 16. ‘Hot’ ≈ 18–21.","h":"One age can’t fit both ‘filling out a ballot at home’ and ‘in a car with your friends at midnight’."},{"id":"s4q041","s":4,"o":22,"t":"R","sc":"agebar","q":"According to Steinberg & Icenogle (2019), for which activity would an age boundary around ==16== be reasonable?","a":[["[[Voting]] in political elections","Yes. Voting allows unhurried deliberation (‘cold cognition’), which is mature by 16. Same for research consent, medical decisions, and competence as a defendant."],["[[Purchasing]] alcohol","A ‘hot’ context: 18–21."],["[[Gambling]] in a casino","A ‘hot’ context: 18–21."],["[[Driving]] a car","Scientifically a ‘hot’ context (they say 18+), even though most U.S. states allow it at 16."],["Being held to [[adult standards]] of criminal responsibility","A ‘hot’ context: 18–21."]],"k":"Cold contexts (≈16): voting · informed consent for research · medical decisions · serving as a competent defendant.","h":"Could you do it slowly, calmly, with time to think and an adult to consult? → 16."},{"id":"s4q042","s":4,"o":22,"t":"R","sc":"agebar","q":"For which set of activities do Steinberg & Icenogle (2019) recommend a boundary of ==18 or older== (perhaps 21)?","a":[["[[Driving]], [[drinking]], and [[criminal responsibility]]","Yes. These happen under time pressure, strong emotion, with peers present and adults absent."],["[[Voting]], [[research consent]], and [[medical]] decisions","Those are ‘cold’ contexts: around 16."],["[[Schooling]], [[employment]], and [[marriage]]","Not the examples used."],["[[Testifying]], [[jury duty]], and [[custody]] decisions","Not the examples used."],["[[All]] legal activities, without exception","They distinguish two kinds of contexts."]],"k":"Hot contexts (18–21): driving · alcohol · gambling · criminal responsibility.","h":"Is it usually done fast, fired up, with friends around and no adults? → 18–21."},{"id":"s4q043","s":4,"o":22,"t":"R","sc":"agebar","q":"By how much does the maturation of reasoning ==precede== the maturation of self-regulation, according to Steinberg & Icenogle (2019)?","a":[["By as much as [[five years]]","Yes. Cognitive capacity is mature by about 16; psychosocial maturity not until at least 21."],["By about [[six months]]","Far too little."],["By about [[one year]]","Too little."],["By at least [[ten years]]","Too much."],["They mature at the [[same time]]","The whole argument rests on the gap."]],"k":"Reason before regulation, by up to 5 years (≈16 vs ≈21).","h":"16 + 5 = 21."},{"id":"s4q044","s":4,"o":22,"t":"R","sc":"armor","q":"What is the difference between the ==age of majority== and an ==age of license==?","a":[["Majority = [[legal adulthood]]; license = one [[specific]] act","Yes. E.g., U.S. majority at 18, but license to drive at 16 and to buy alcohol at 21. (Age of consent = presumed competent to make autonomous decisions.)"],["Majority = allowed to [[drive]]; license = allowed to [[vote]]","Not the distinction."],["Majority = set by [[science]]; license = set by [[tradition]]","Neither was mainly set by science."],["Majority = for [[criminal]] law; license = for [[civil]] law","Not the distinction."],["They are [[identical]] in every country","They differ."]],"k":"Age of majority (adult status, typically 18) ≠ age of license (permission for one activity) ≠ age of consent (competence to decide)."},{"id":"s4q045","s":4,"o":22,"t":"R","sc":"armor","q":"Where is the ==traditional age of majority of 21== thought to come from?","a":[["The age men could wear full [[armor]] in medieval times","Yes. Most historians trace it to when young men were strong enough for full armor in battle."],["The age the [[brain]] was shown to finish developing","Brain science came centuries later."],["The age set by the first U.S. [[Supreme Court]]","Not its origin."],["The age when [[schooling]] ended in the Industrial Revolution","Not its origin."],["The age of [[marriage]] in ancient Rome","Not its origin."]],"k":"21 came from armor, not science. Britain lowered it to 18 in 1970, and many countries followed.","h":"Fitting for this castle: you were an adult when you could carry the armor."},{"id":"s4q046","s":4,"o":22,"t":"R","sc":"agebar","q":"What do Steinberg & Icenogle (2019) say about ==where most countries== draw the age of majority?","a":[["About [[90%]] use [[18]], which fits the science fairly well","Yes. They find it noteworthy that so many very different countries converged on 18."],["Most nations use [[21]], following the medieval tradition","21 was the older standard."],["Most nations use [[16]], following cognitive development","16 is their proposal for ‘cold’ contexts, not the global norm."],["Nations vary [[widely]], from 12 to 30, with no pattern","The ‘reasonable range’ is roughly 16–21."],["Most nations have [[no]] age of majority at all","Nearly all do."]],"k":"18 is the worldwide default. Any ‘arbitrariness’ sits within a reasonable range: 16 to 21."},{"id":"s4q047","s":4,"o":22,"t":"R","sc":"agebar","q":"Legal age boundaries have mostly been set on ==non-scientific== grounds. Which set matches Steinberg & Icenogle’s (2019) list?","a":[["[[Intuitive]], [[administrative]], [[fairness]], [[consequentialist]] ones","Yes: tradition/common sense; simplicity of one age; consistency across purposes; likely societal outcomes."],["[[Cognitive]], [[psychosocial]], and [[neurobiological]] considerations","Those are the SCIENTIFIC bases they propose."],["[[Religious]], [[military]], [[agricultural]], and [[colonial]] considerations","Not the list."],["[[Excuse]], [[mitigation]], and [[proportionality]] considerations","Those are criminal-law concepts."],["[[Random]] choices with no reasoning behind them","They had reasons, just not scientific ones."]],"k":"Non-scientific bases: intuitive · administrative · fairness · consequentialist.","h":"Example: voting age dropped to 18 during the Vietnam War to match the draft age. That’s a fairness argument, not science."},{"id":"s4q048","s":4,"o":22,"t":"R","sc":"agebar","q":"The U.S. voting age was lowered to 18 during the Vietnam War to match the age of military service. Which kind of reasoning is that?","a":[["[[Fairness]]: treat different purposes alike","Yes. ‘Old enough to fight, old enough to vote.’"],["[[Developmental science]]: reasoning matures by 18","Science wasn’t the basis."],["[[Administrative]]: one age is simpler to manage","Close, but the argument was about what’s fair across rights and duties."],["[[Consequentialist]]: it would reduce crime","That was the logic for lowering the transfer age in the 1980s."],["[[Intuitive]]: tradition says 18 is adulthood","Tradition had been 21."]],"k":"Fairness/consistency reasoning. (Consequentialist example: lowering the age for adult-court transfer in the 1980s to deter crime.)"},{"id":"s4q049","s":4,"o":22,"t":"R","sc":"agebar","q":"Steinberg & Icenogle (2019) admit that science alone can’t set legal ages. Which example shows a ==societal consideration== overriding the science?","a":[["A driving age of 21 fits science but blocks teen [[employment]]","Yes. That’s their example of a pressing societal need that may justify a boundary inconsistent with the science."],["A voting age of 16 would make ballots too [[complicated]]","Not their example."],["A drinking age of 21 was set because [[brain scans]] required it","It was raised over drunk-driving fatalities."],["A death penalty at 16 saves the justice system [[money]]","Not their example."],["A school-leaving age of 18 follows from [[grey matter]] peaks","Not their example."]],"k":"Science informs; society decides. Driving at 21 = scientifically sensible, practically costly."},{"id":"s4q050","s":4,"o":22,"t":"R","sc":"agebar","q":"Why do Steinberg & Icenogle (2019) still favour a ==chronological age boundary== for criminal sanctions instead of judging each juvenile’s maturity individually?","a":[["Individual judgements can be [[biased]], e.g., by [[race]]","Yes. A fixed age boundary offers some protection against biased decisions by judges or juries."],["Individual judgements are always more [[lenient]] than age rules","Not the reason."],["All people of the same age are equally [[mature]]","They acknowledge big individual variability."],["Maturity [[cannot]] be studied scientifically at all","Their whole article studies it."],["Age rules are required by the [[Constitution]]","Not the reason given."]],"k":"Bright-line ages misclassify some individuals, but they guard against bias."},{"id":"s4q051","s":4,"o":22,"t":"R","sc":"agebar","q":"Any age-based rule will misclassify some people (a mature 16-year-old, an immature 19-year-old). How do Steinberg & Icenogle (2019) suggest handling this ==individual variability== in some cases?","a":[["Add [[skill-based]] requirements such as [[exams]]","Yes. Using science to place the boundary minimizes, but doesn’t eliminate, the problem."],["Abolish age limits and test [[everyone]] at every age","Not suggested."],["Let [[parents]] decide when their child is an adult","Not suggested."],["Use [[brain scans]] to certify each person’s maturity","Not suggested."],["Ignore the problem, since it [[rarely]] happens","They take it seriously."]],"k":"Age line + skill test where possible."},{"id":"s4q052","s":4,"o":22,"t":"R","sc":"coldhot","q":"The line between ‘cold’ and ‘hot’ contexts isn’t always clear. Which example and solution do Steinberg & Icenogle (2019) give?","a":[["A teen weighing [[abortion]] may be emotional; a [[waiting period]] helps","Yes. Policies like a waiting period between consultation and procedure can turn a potentially impulsive decision into a deliberate one."],["A teen [[voting]] may be emotional; peers should be [[banned]] from polling places","Not their example."],["A teen [[driving]] may be calm; so the driving age should be [[12]]","Not their example."],["A teen in [[court]] may be bored; trials should be made [[shorter]]","Not their example."],["A teen buying [[alcohol]] is calm; so the age should be [[16]]","Not their example."]],"k":"You can sometimes ‘cool down’ a hot context with policy (e.g., waiting periods)."},{"id":"s4q053","s":4,"o":22,"t":"R","sc":"stats","q":"Steinberg & Icenogle (2019) describe three statistical ways to ==quantify maturity==. Which set is correct?","a":[["[[Group means]], [[polynomial]] and [[piecewise]] regression","Yes: ANOVA across age groups; polynomial age trends (with instantaneous rate of change); piecewise (‘change-point’) regression."],["[[Brain scans]], [[IQ tests]], and [[interviews]]","Those are measures, not the statistical approaches."],["[[Odds ratios]], [[confidence intervals]], and exact [[p-values]]","Those are general statistics (and Ramsden’s tools)."],["[[Random assignment]], [[pretests]], and [[posttests]]","Those are experimental design features."],["[[Mean]], [[median]], and [[mode]]","Not the approaches."]],"k":"Three approaches: (1) ANOVA (youngest age not different from adults), (2) polynomial regression + IROC (where the curve flattens), (3) piecewise regression (where the slope changes)."},{"id":"s4q054","s":4,"o":22,"t":"R","sc":"stats","q":"When the three statistical approaches were applied to ==cognitive capacity== (Icenogle et al., 2019), what happened?","a":[["They differed: two said about [[15]], one said [[19]]","Yes. Different methods can lead to different conclusions, so researchers should use several and look at them together."],["All three agreed [[exactly]] on age 18","They didn’t agree exactly."],["All three showed cognition still [[rising]] at age 30","Cognitive capacity plateaued in adolescence."],["None could [[detect]] any change with age","Change was detected."],["They showed cognition matures [[after]] self-regulation","Cognition matures first."]],"k":"Method matters: ANOVA and piecewise → ~15; polynomial/IROC → 19."},{"id":"s4q055","s":4,"o":22,"t":"R","sc":"armor","q":"Why is the U.S. ==drinking age 21== when the age of majority is 18?","a":[["It was raised after concern about teen [[drunk-driving]]","Yes. Rights can be withheld past 18 to protect well-being. (The driving age was lowered to 16 in the 1920s so teens could get to jobs.)"],["Research showed the [[brain]] finishes maturing at exactly 21","Not the historical reason."],["It has [[always]] been 21 and was never changed","Many states lowered it to 18 in the 1970s, then raised it."],["The Supreme Court [[ruled]] it unconstitutional below 21","Congress pressured states; it wasn’t a Court ruling."],["It matches the [[voting]] age set during the Vietnam War","The voting age is 18."]],"k":"Departures from the age of majority happen when lawmakers think it’s in the interest of adolescents, society, or both."},{"id":"s4q056","s":4,"o":22,"t":"R","sc":"rock","q":"Steinberg & Icenogle (2019) say every society must decide who is ready for the rights and responsibilities of adulthood. What is this process called?","a":[["[[Social redefinition]]","Yes."],["[[Penal proportionality]]","That’s about fitting punishment to harm and culpability."],["[[Maturational imbalance]]","That’s the dual systems brain account."],["[[Stage–environment fit]]","That’s a schooling theory."],["[[Temporal discounting]]","That’s preferring sooner rewards."]],"k":"Social redefinition = society re-labelling someone from minor to adult."},{"id":"s4q057","s":4,"o":22,"t":"LR","sc":"agebar","q":"A lawmaker says: ‘If 16-year-olds are mature enough to vote, they’re mature enough to be sentenced as adults.’ How would Steinberg & Icenogle (2019) respond?","a":[["Disagree, since voting is [[cold]] but crime is usually [[hot]]","Yes. Different decisions draw on different capacities that mature on different timetables, so different ages make sense."],["Agree, since maturity is a [[single]] trait reached at one age","Their core argument is that it is NOT a single trait."],["Disagree, since 16-year-olds [[cannot]] reason logically","They can; that’s why voting at 16 is defensible."],["Agree, since [[fairness]] requires one age for all purposes","That’s a non-scientific ‘fairness’ argument they contrast with their approach."],["Disagree, since the voting age should be [[21]] as well","They suggest 16 is reasonable for voting."]],"k":"Not a contradiction: ‘cold’ capacities and ‘hot’ capacities mature years apart.","h":"The APA was once accused of a ‘flip-flop’ for exactly this. The two-context answer resolves it."},{"id":"s1q095","s":1,"o":0,"t":"L","sc":"stages","q":"Across childhood, play develops from non-social play toward ____ play.","a":[["[[social]]","Yes. Lecture: play moves from non-social (alone, watching) to social (with others)."],["[[object]]","Object play is a TYPE of play, not the direction play develops in."],["[[guided]]","Guided play is a type defined by adult support."],["[[risky]]","Risky play is a type, not the developmental direction."],["[[outdoor]]","Outdoor play is about where play happens."]],"k":"Development of play: non-social → social.","h":"Think of a toddler playing alone, then beside others, then WITH others.","b":1},{"id":"s1q096","s":1,"o":0,"t":"L","sc":"playdef","q":"A child who plays simply because the activity itself is rewarding is ____ motivated.","a":[["[[intrinsically]]","Yes. The reward is INside the activity."],["[[extrinsically]]","Extrinsic = driven by outside rewards like money or stickers. That’s the opposite."],["[[academically]]","Play isn’t done to hit learning targets."],["[[biologically]]","Play is defined as unrelated to immediate survival."],["[[competitively]]","Winning is an outside goal, not the activity for its own sake."]],"k":"Play is intrinsically motivated: done for its own sake.","h":"INtrinsic = the reason is INside the activity.","b":1},{"id":"s1q097","s":1,"o":3,"t":"L","sc":"pretend","q":"According to lecture, pretend play typically begins at around ____.","a":[["[[18–25 months]]","Yes. That’s when acting ‘as-if’ first shows up."],["[[6–9 months]]","Too early. Babies explore objects but don’t pretend yet."],["[[10–14 months]]","Still a bit early."],["[[36–40 months]]","Too late. Pretend is well under way by three."],["[[48–60 months]]","Far too late. By then children do complex sociodramatic play."]],"k":"Pretend play begins around 18–25 months.","h":"Roughly a year and a half to two.","b":1},{"id":"s1q098","s":1,"o":3,"t":"L","sc":"witch","q":"In the Candy Witch study, about ____ of children believed she was real.","a":[["[[66%]]","Yes. Two thirds, and belief was highest in OLDER children who got a ‘visit’."],["[[16%]]","Far too low. Most children believed."],["[[36%]]","Too low. It was a clear majority."],["[[86%]]","Too high. A third did not believe."],["[[96%]]","Too high. Belief was common, not near-universal."]],"k":"Candy Witch: 66% believed. Belief was most likely in older children who were visited.","h":"Two out of three kids bought it.","b":1},{"id":"s1q099","s":1,"o":3,"t":"L","sc":"batman","q":"Asking ‘Is Batman working hard?’ instead of ‘Am I working hard?’ is an example of self-____.","a":[["[[distancing]]","Yes. Stepping outside yourself helped children persevere (the ‘Batman effect’)."],["[[disclosure]]","Self-disclosure is sharing personal information."],["[[awareness]]","Close in sound, but the technique is about stepping AWAY from the self."],["[[monitoring]]","Not the term used for taking an outside perspective."],["[[expression]]","Not the term. The key move is distance from ‘I’."]],"k":"Self-distancing = viewing yourself from the outside. Linked with more perseverance (White et al., 2017).","h":"Zoom out from ‘me’ and the boring task gets easier.","b":1},{"id":"s1q100","s":1,"o":4,"t":"L","sc":"riskwhy","q":"One reason risky play matters is that it satisfies children’s need for ____.","a":[["[[autonomy]]","Yes. Children get to make their own choices and test their own limits."],["[[approval]]","Risky play isn’t about pleasing adults."],["[[attachment]]","Attachment is about caregiver bonds, not the reason given."],["[[structure]]","Risky play is defined by uncertainty, not structure."],["[[routine]]","Uncertainty is the point. Routine is the opposite."]],"k":"Why risky play matters: reduces fear/anxiety, meets the need for autonomy, positive emotions from mastery.","h":"Three reasons: Fear down, Freedom (autonomy), Feeling of mastery.","b":1},{"id":"s1q101","s":1,"o":5,"t":"L","sc":"wellsc","q":"Wells & Evans (2003) found that nearby nature acted as a ____ against stress.","a":[["[[buffer]]","Yes. Stressful life events hurt less for children with more nature nearby."],["[[trigger]]","A trigger would set stress off. Nature softened it."],["[[marker]]","A marker just signals something. Nature changed the impact."],["[[source]]","Nature wasn’t the cause of the stress."],["[[mirror]]","Not the idea. Nature cushioned stress."]],"k":"Nature as a buffer: it softens the impact of stress.","h":"Like bubble wrap around a package. The bumps still happen; they do less damage.","b":1},{"id":"s1q102","s":1,"o":6,"t":"R","sc":"ramsden","q":"In Ramsden et al. (2026), teachers rated each child on the EDI across ____ developmental domains.","a":[["[[five]]","Yes: physical health, social competence, emotional maturity, language & cognitive, communication & general knowledge."],["[[three]]","Too few. There are five."],["[[four]]","Risky play helped in four of them, but the EDI has five."],["[[six]]","One too many."],["[[seven]]","Too many. That’s the TARGETS count, not the EDI."]],"k":"EDI = 5 domains. ‘Vulnerable’ = low on one or more.","h":"One hand, five fingers, five domains.","b":1},{"id":"s1q103","s":1,"o":6,"t":"R","sc":"three","q":"In Ramsden et al. (2026), more opportunity for risky play was linked with ____ odds of vulnerability.","a":[["[[lower]]","Yes (aOR about 0.92). Risky play was linked with reduced vulnerability overall and in four domains."],["[[higher]]","That was screen time."],["[[unchanged]]","That describes outdoor play frequency overall, not risky play."],["[[doubled]]","Nothing doubled. Risky play was protective."],["[[unmeasured]]","It was measured, with one caregiver question."]],"k":"Risky play ↓ vulnerability. Screen time ↑ vulnerability. Outdoor play: no overall link.","h":"Risk down, screens up, outdoors mixed.","b":1},{"id":"s1q104","s":1,"o":7,"t":"L","sc":"corr","q":"Because most play research is ____, we can’t say play CAUSES the benefits.","a":[["[[correlational]]","Yes. Play and good outcomes go together, but something else could explain both."],["[[experimental]]","Experiments are what WOULD allow causal claims."],["[[longitudinal]]","Following children over time helps, but still doesn’t prove cause."],["[[qualitative]]","The issue is design, not whether data are numbers or words."],["[[theoretical]]","There is real data. The limit is that it is correlational."]],"k":"Correlation ≠ causation. That’s the main challenge in applying play research.","h":"Ice cream sales and sunburns rise together. Neither causes the other.","b":1},{"id":"s2q056","s":2,"o":8,"t":"L","sc":"whyschool","q":"Using schools to make children adopt the dominant national culture is called ____.","a":[["[[assimilation]]","Yes. Lecture pairs it with building national identity."],["[[accommodation]]","That would be the school adapting to the child."],["[[socialization]]","Too general. The lecture term for absorbing children into one culture is assimilation."],["[[integration]]","Integration keeps differences alongside each other."],["[[acculturation]]","A broader term for cultural change. Lecture’s word is assimilation."]],"k":"Why school? Industrialization, national identity/assimilation, religious education, colonization.","h":"Assimilate = make SIMILAR.","b":1},{"id":"s2q057","s":2,"o":9,"t":"L","sc":"pygmalion","q":"In Rosenthal & Jacobson (1968), randomly chosen students labelled as about to grow were the ____.","a":[["[[bloomers]]","Yes. They were ordinary students, yet they gained more because teachers expected more."],["[[climbers]]","Not the label used."],["[[starters]]","Not the label used."],["[[boosters]]","Not the label used."],["[[sprinters]]","Not the label used."]],"k":"Pygmalion effect: teacher expectations can become reality.","h":"Tell a gardener a seed is special and it gets more water.","b":1},{"id":"s2q058","s":2,"o":11,"t":"L","sc":"tootle","q":"A classroom program in which students report each other’s POSITIVE behaviour is called ____.","a":[["[[tootling]]","Yes (Collins et al., 2020). It’s the opposite of tattling."],["[[tattling]]","Tattling reports the NEGATIVE."],["[[tracking]]","Tracking sorts students by ability."],["[[tutoring]]","Tutoring is academic help."],["[[tallying]]","Counting isn’t the name of the program."]],"k":"Tootling = reporting classmates’ positive behaviour.","h":"‘Tooting’ someone else’s horn.","b":1},{"id":"s2q059","s":2,"o":11,"t":"L","sc":"sel","q":"SEL stands for social and ____ learning.","a":[["[[emotional]]","Yes. Skills like managing feelings, empathy and getting along."],["[[ethical]]","Not what the E stands for."],["[[engaged]]","Engagement can improve, but that’s not the name."],["[[embodied]]","Embodied learning is the Fraction Ball idea."],["[[experiential]]","Not what the E stands for."]],"k":"SEL = social and emotional learning (e.g., PATHS, tootling).","b":1},{"id":"s2q060","s":2,"o":12,"t":"L","sc":"pillars5","q":"Learning by trying an idea, seeing what happens, and revising it is ____ learning.","a":[["[[iterative]]","Yes. One of the features from Hirsh-Pasek et al. (2015)."],["[[interactive]]","Also on the list, but it means learning WITH others."],["[[imitative]]","Copying isn’t testing and revising."],["[[incidental]]","Incidental = picked up by accident."],["[[intuitive]]","Not one of the features."]],"k":"More learning when it is active, meaningful, interactive, iterative and joyful.","h":"Iterate = loop. Try, check, tweak, repeat.","b":1},{"id":"s2q061","s":2,"o":13,"t":"R","sc":"ghost","q":"Thinking 1/8 is bigger than 1/4 because 8 is bigger than 4 shows ____ number bias.","a":[["[[whole]]","Yes. Whole-number rules get wrongly applied to fractions and decimals."],["[[ordinal]]","Not the term used in Bustamante et al."],["[[linear]]","Linear refers to the number-line layout, which HELPS."],["[[decimal]]","The bias comes from whole numbers, not decimals."],["[[mixed]]","Mixed numbers are a type of number, not the bias."]],"k":"Whole number bias: treating parts of a fraction or decimal like separate whole numbers.","h":"Bigger number on the bottom means SMALLER slices.","b":1},{"id":"s3q059","s":3,"o":14,"t":"L","sc":"goals","q":"A student who studies to understand the material and improve has a ____ goal orientation.","a":[["[[mastery]]","Yes. The focus is competence, learning and improvement."],["[[performance]]","Performance (relative ability) goals are about outdoing others."],["[[comparison]]","Comparing with others is the relative-ability side."],["[[avoidance]]","Avoiding looking bad belongs with relative-ability goals."],["[[extrinsic]]","Not one of the two goal orientations from lecture."]],"k":"Mastery = get better. Relative ability (performance) = look better than others.","h":"Mastery: race against yesterday’s you.","b":1},{"id":"s3q060","s":3,"o":14,"t":"L","sc":"targets","q":"In the TARGETS framework, the letter E stands for ____.","a":[["[[Evaluation]]","Yes: Task, Authority, Recognition, Grouping, Evaluation, Time, Social relations."],["[[Effort]]","Effort matters for mastery, but it isn’t the E."],["[[Engagement]]","An outcome of mastery goals, not the E."],["[[Expectations]]","That’s the teacher section (Pygmalion)."],["[[Environment]]","Close idea, wrong word."]],"k":"TARGETS: Task, Authority, Recognition, Grouping, Evaluation, Time, Social relations.","b":1},{"id":"s3q061","s":3,"o":15,"t":"L","sc":"fit","q":"When middle schools add control just as teens need more independence, that’s a problem of stage–environment ____.","a":[["[[fit]]","Yes. The environment doesn’t match the developmental stage."],["[[lag]]","Not the term."],["[[gap]]","Sounds right, but the term is fit."],["[[bias]]","Not the term."],["[[load]]","Not the term."]],"k":"Stage–environment fit: students do best when school matches their developmental needs.","h":"A size-6 shoe on a growing foot.","b":1},{"id":"s3q062","s":3,"o":15,"t":"L","sc":"size","q":"Lecture suggests an ideal size of 300–500 students for K–8 schools and ____ for Grades 9–12.","a":[["[[600–1000]]","Yes. Smaller is generally better, with high schools a bit larger."],["[[100–300]]","Smaller than the elementary range, which isn’t the guideline."],["[[300–500]]","That’s the K–8 range."],["[[1200–1500]]","Too large."],["[[1500–2000]]","Too large. Big schools mean less involvement."]],"k":"School size: smaller is better. K–8: 300–500. 9–12: 600–1000.","b":1},{"id":"s3q063","s":3,"o":15,"t":"L","sc":"summer","q":"Year-round schooling is proposed as a fix for summer ____ loss.","a":[["[[learning]]","Yes. Performance drops over summer, possibly more for low-income families."],["[[friendship]]","Not the concern lecture raised."],["[[attention]]","Not the term."],["[[motivation]]","Motivation drops are tied to school transitions."],["[[attendance]]","Attendance is a start-time outcome."]],"k":"Summer learning loss: the long break comes from our agricultural heritage.","b":1},{"id":"s3q064","s":3,"o":16,"t":"L","sc":"tracks","q":"Separating students into different classes by ability level is called ability ____.","a":[["[[tracking]]","Yes. Good for high-track students academically; negative for low-track students."],["[[tootling]]","That’s reporting positive peer behaviour."],["[[targeting]]","Not the term (though TARGETS includes Grouping)."],["[[transfer]]","Transfer is from the Fraction Ball reading."],["[[tiering]]","Not the term used in lecture."]],"k":"Ability tracking = different classes by ability level.","h":"Train tracks: once you’re on one line, it’s hard to switch.","b":1},{"id":"s3q065","s":3,"o":17,"t":"L","sc":"diversity","q":"In more ethnically diverse schools, minority students reported decreased ____ (Juvonen et al., 2006).","a":[["[[loneliness]]","Yes. They also felt safer and had higher self-worth."],["[[self-worth]]","Self-worth went UP."],["[[safety]]","Feelings of safety went UP."],["[[belonging]]","Not a decrease reported."],["[[motivation]]","Not the finding."]],"k":"Diversity: majority students hold fewer negative stereotypes; minority students feel safer, less lonely, higher self-worth.","b":1},{"id":"s3q066","s":3,"o":17,"t":"L","sc":"diversity","q":"A principal says, ‘Diversity only helps minority students.’ Which lecture finding ==contradicts== this?","a":[["Majority students hold fewer negative [[stereotypes]]","Yes. Majority students benefit too (Juvonen et al., 2006)."],["Minority students report higher [[self-worth]]","True, but that’s a minority-student benefit, so it doesn’t contradict him."],["Minority students feel [[safer]] at school","True, but again a minority-student benefit."],["Majority students earn higher [[test scores]]","Not a finding from lecture."],["Majority students feel [[less lonely]] at school","Decreased loneliness was reported for minority students."]],"k":"Diversity benefits BOTH groups: majority (fewer negative stereotypes) and minority (safety, less loneliness, self-worth)."},{"id":"s3q067","s":3,"o":17,"t":"L","sc":"diversity","q":"Which outcome was ==NOT== one of the benefits of school diversity listed in lecture (Juvonen et al., 2006)?","a":[["Higher [[achievement]] test scores","Right, this wasn’t listed. The benefits were social and emotional."],["Fewer negative [[stereotypes]]","Listed (for majority students)."],["Increased feelings of [[safety]]","Listed (for minority students)."],["Decreased [[loneliness]] at school","Listed (for minority students)."],["Higher feelings of [[self-worth]]","Listed (for minority students)."]],"k":"Juvonen’s benefits are social-emotional: stereotypes, safety, loneliness, self-worth. Not grades."},{"id":"s3q068","s":3,"o":18,"t":"R","sc":"mission","q":"Downplaying group differences and stressing that everyone is the same reflects a color-____ ideology.","a":[["[[evasive]]","Yes. Leer et al. contrast it with multiculturalism (valuing differences)."],["[[conscious]]","Color-conscious would mean attending to race."],["[[inclusive]]","Not the term. Evasive ideologies avoid the topic."],["[[affirming]]","Affirming differences is closer to multiculturalism."],["[[adaptive]]","Not a term in the reading."]],"k":"Color-evasive = downplay differences. Multicultural/pro-diversity = recognize and value them.","b":1},{"id":"s3q069","s":3,"o":18,"t":"R","sc":"wordsact","q":"Leer et al. (2025): when an organization’s words about diversity don’t match its actions, that’s diversity ____.","a":[["[[dishonesty]]","Yes. And it may explain why statements were linked with MORE distress."],["[[fatigue]]","Not the term used."],["[[evasion]]","Evasiveness is the ideology of downplaying race, a different idea."],["[[resistance]]","Not the term used."],["[[dilution]]","Not the term used."]],"k":"Diversity dishonesty = saying you value diversity without doing it.","h":"A ‘Fresh Bread’ sign on a shop with stale loaves.","b":1},{"id":"s4q058","s":4,"o":20,"t":"L","sc":"scales","q":"The idea that punishment should match both the harm caused and the offender’s blameworthiness is penal ____.","a":[["[[proportionality]]","Yes. Severity depends on harm AND culpability."],["[[mitigation]]","Mitigation is the lessening of responsibility, one piece of the bigger principle."],["[[culpability]]","Culpability is the blameworthiness part only."],["[[rehabilitation]]","That’s a goal of sentencing, not this principle."],["[[responsibility]]","Too general. The principle’s name is proportionality."]],"k":"Penal proportionality: punishment ∝ harm + culpability.","h":"Two pans on a scale: what was done, and how blameworthy the person is.","b":1},{"id":"s4q059","s":4,"o":20,"t":"L","sc":"scales","q":"The complete removal of criminal responsibility is called ____.","a":[["[[excuse]]","Yes. Excuse = not responsible at all. Mitigation = less responsible."],["[[mitigation]]","Mitigation only LESSENS responsibility."],["[[pardon]]","A pardon forgives after conviction. Not lecture’s term."],["[[waiver]]","Not the term."],["[[appeal]]","An appeal asks a higher court to review."]],"k":"Excuse removes responsibility. Mitigation reduces it. The argument for juveniles is mitigation.","h":"Excuse = off the hook. Mitigation = a lighter hook.","b":1},{"id":"s4q060","s":4,"o":21,"t":"L","sc":"money","q":"Choosing $1000 in a year over $400 today shows strong future ____.","a":[["[[orientation]]","Yes. Thinking ahead and weighing later consequences keeps developing through adolescence."],["[[inhibition]]","Response inhibition is a basic cognitive skill."],["[[sensation]]","Sensation seeking is about thrills, not waiting."],["[[reasoning]]","Logical reasoning matures earlier. This task taps a psychosocial skill."],["[[regulation]]","Related, but the lecture term for thinking ahead is future orientation."]],"k":"Future orientation: weighing long-term over short-term. A psychosocial skill that matures late.","b":1},{"id":"s4q061","s":4,"o":21,"t":"L","sc":"brain","q":"Across adolescence, white matter volume shows a ____ increase.","a":[["[[linear]]","Yes. It rises steadily (more myelin, faster connections)."],["[[sudden]]","No single jump. It’s steady."],["[[brief]]","It continues for years."],["[[reversed]]","It goes up, not down."],["[[curved]]","The inverted-U pattern belongs to grey matter."]],"k":"White matter: linear increase. Grey matter: peaks in early adolescence, then decreases.","h":"White = wiring. The wiring keeps getting better insulated.","b":1},{"id":"s4q062","s":4,"o":21,"t":"L","sc":"brain","q":"Grey matter volume peaks in ____ and then decreases, making the brain more efficient.","a":[["[[early adolescence]]","Yes. Pruning unused connections follows."],["[[late adolescence]]","Too late. By then it has been declining for years."],["[[early childhood]]","Too early."],["[[the mid-twenties]]","That’s when prefrontal connections finish maturing, not the grey matter peak."],["[[middle childhood]]","A little early. The peak is in early adolescence."]],"k":"Grey matter: up, peak in early adolescence, then down (pruning = efficiency).","h":"Pruning a rose bush: fewer branches, stronger plant.","b":1},{"id":"s4q063","s":4,"o":21,"t":"L","sc":"dual","q":"The drive for novel, thrilling experiences that peaks in adolescence is ____ seeking.","a":[["[[sensation]]","Yes. It rises at puberty and peaks in adolescence."],["[[attention]]","Not the term."],["[[approval]]","Peers matter, but this term is about thrills."],["[[identity]]","Identity exploration is a different concept."],["[[status]]","Not the term."]],"k":"Sensation seeking peaks in adolescence, before self-regulation has matured.","h":"Gas pedal fully down, brakes still being installed.","b":1},{"id":"s4q064","s":4,"o":22,"t":"R","sc":"coldhot","q":"Steinberg & Icenogle (2019): decisions made calmly, with time and without peers, rely on ____ cognition.","a":[["[[cold]]","Yes. Cold cognition is adult-like by about 16."],["[[hot]]","Hot = emotionally aroused, rushed, peers present."],["[[slow]]","Not the term used."],["[[deep]]","Not the term used."],["[[core]]","Not the term used."]],"k":"Cold cognition (calm, unhurried) is mature by about 16. In hot contexts (aroused, rushed, peers present), self-regulation isn’t mature until 18 or later.","h":"Cold = cool head. Hot = heat of the moment.","b":1},{"id":"s4q065","s":4,"o":22,"t":"R","sc":"agebar","q":"The legal age at which a person becomes an adult for most purposes is the age of ____.","a":[["[[majority]]","Yes. Usually 18. It’s different from an age of license."],["[[license]]","An age of license permits one specific activity (e.g., driving)."],["[[consent]]","Consent ages apply to specific decisions."],["[[maturity]]","Maturity is the developmental idea. The legal term is majority."],["[[liability]]","Not the term."]],"k":"Age of majority = legal adulthood overall. Age of license = permission for one activity.","b":1},{"id":"s1q105","s":1,"o":6,"t":"R","sc":"ramsden","q":"According to the ==tables== in Ramsden et al. (2026), which children had higher odds of being vulnerable in kindergarten?","a":[["[[Boys]], at nearly three times the odds of girls","Yes. In all three models, male has an adjusted odds ratio of about 2.8 with female as the reference group (2.83, 2.87, 2.78)."],["[[Girls]], at nearly three times the odds of boys","Careful. One sentence in the Results says ‘being female’, but every table shows the reverse: boys had the higher odds."],["[[Neither]]: sex was unrelated to vulnerability","Sex was one of the strongest factors in the tables."],["[[Boys]], but only in the screen-time model","The gap shows up in all three models, not just one."],["[[Girls]], but only for emotional maturity","The tables report overall vulnerability, and boys had the higher odds."]],"k":"Tables 2–4: boys had about 2.8 times the odds of vulnerability (female = reference). Heads-up: the Results text says ‘being female’, which contradicts the tables. Go with the data.","h":"aOR above 1 = higher odds. 2.8 is way above 1."},{"id":"s1q106","s":1,"o":6,"t":"R","sc":"ramsden","q":"In Ramsden et al. (2026), 1,635 children were vulnerable on one or more EDI domains. About what share of them were ==boys==?","a":[["About [[two thirds]] (65.6%)","Yes: 1,072 boys and 563 girls. The whole sample was almost an even split (51.1% boys), so boys were over-represented."],["About [[one third]] (34.4%)","That’s the share who were girls."],["About [[half]] (51.1%)","That’s the share of boys in the whole sample, not among vulnerable children."],["About [[one fifth]] (20%)","Far too low."],["About [[nine tenths]] (90%)","Too high. It was about two thirds."]],"k":"Table 1: of the vulnerable children, 65.6% were boys and 34.4% were girls."},{"id":"s1q107","s":1,"o":6,"t":"R","sc":"ramsden","q":"In Ramsden et al.’s tables, how did household ==income== relate to the odds of vulnerability?","a":[["Odds rose [[step by step]] as income fell","Yes. Compared with over $200,000: under $20,000 was about 2.6 to 2.7 times the odds, then 2.4, 2.2, 1.8 and 1.4 as income rose. $150,000 to $200,000 was no different."],["Odds were [[highest]] in the richest families","The richest group was the reference, with the lowest odds."],["Only the [[poorest]] group differed from the rest","Several income bands differed, in a graded pattern."],["Income was [[unrelated]] once play was added","Income stayed significant in all three models."],["Odds [[fell]] as income fell, then levelled off","Reversed. Lower income went with higher odds."]],"k":"Income gradient: the lower the income band, the higher the odds of vulnerability (significant below about $150,000).","h":"A staircase: each step down in income is a step up in odds."},{"id":"s1q108","s":1,"o":6,"t":"R","sc":"ramsden","q":"In Ramsden et al. (2026), how did children with ==one sibling== compare with only children?","a":[["[[Lower]] odds of vulnerability (aOR about 0.75)","Yes. One sibling vs. none was linked with reduced odds in all three models. Two or three-plus siblings were not significantly different."],["[[Higher]] odds of vulnerability (aOR about 1.75)","Reversed. The odds ratio was below 1."],["[[The same]] odds as only children in every model","There was a significant difference for one sibling."],["[[Lower]] odds, but only for children in rural areas","Urban vs. rural made no difference, and the sibling finding wasn’t limited by location."],["[[Higher]] odds, but only with three or more siblings","Three or more siblings wasn’t significantly different from none."]],"k":"One sibling (vs. none): aOR about 0.75, so lower odds. Urban/rural and place of birth: no difference."},{"id":"s1q109","s":1,"o":0,"t":"L","sc":"stages","q":"According to lecture’s table of play categories, which is the ==least common== form of play?","a":[["[[Unoccupied]] play","Yes. Behaviour seems random and without a specific goal, and the slide calls it the least common form."],["[[Solitary]] play","Solitary play is playing by yourself, not doing what those around you are doing."],["[[Onlooker]] play","Onlookers watch, comment and even suggest, but don’t join."],["[[Parallel]] play","Parallel play is playing alongside with similar toys, without acting with each other."],["[[Cooperative]] play","Cooperative play is working toward a common goal, often with different tasks."]],"k":"Unoccupied (random, no goal; least common) · Solitary · Onlooker = non-social. Parallel · Associative · Cooperative = social."},{"id":"s1q110","s":1,"o":0,"t":"L","sc":"stages","q":"Four children share crayons and chat while each draws their own picture. Nobody is working on a shared drawing. Which category from lecture’s table fits?","a":[["[[Associative]] play","Yes. They interact and share toys, but are not working toward a common goal."],["[[Cooperative]] play","Cooperative play needs a common goal, like one mural they plan together."],["[[Parallel]] play","In parallel play children play alongside each other but don’t directly interact."],["[[Onlooker]] play","An onlooker watches and comments without joining in."],["[[Solitary]] play","They are interacting, so it isn’t solitary."]],"k":"Associative = interacting and sharing, NO common goal. Cooperative = a common goal.","h":"Associates share the office. Co-operators share the project."},{"id":"s1q111","s":1,"o":2,"t":"L","sc":"rulec","q":"In the Rule et al. (2024) chart from lecture, children chose game variations on a scale from easier to harder. What pattern did the bars show?","a":[["The [[play-for-fun]] group picked harder versions","Yes. The ‘Fun’ bars were higher (harder) than the ‘Win’ bars for every variation, significantly so for three of the four."],["The [[win-stickers]] group picked harder versions","Reversed. Children playing to win chose easier versions."],["[[Both]] groups picked the easiest versions","The fun group chose harder ones."],["[[Both]] groups picked the hardest versions","The win group leaned easier."],["The groups [[differed]] on only one variation","The fun group was higher on all four, significantly on three."]],"k":"Rule et al. (2024): play to have fun → pick harder variations. Play to win stickers → pick easier ones.","h":"With a prize on the line you play it safe. Just for fun, you go for the hard shot."},{"id":"s1q112","s":1,"o":5,"t":"L","sc":"wellsc","q":"In the Wells & Evans (2003) chart, psychological distress rose as stressful life events went from low to high. How did children with ==high nearby nature== compare?","a":[["Lower distress, and the [[gap grew]] as stress rose","Yes: 6.31 vs. 7.22 at low stress, but 9.42 vs. 13.23 at high stress. That widening gap is what ‘buffer’ means."],["Lower distress, by the [[same amount]] at every level","The gap was small at low stress and large at high stress."],["Higher distress, but [[only]] when stress was high","High-nature children had LOWER distress at every level."],["The [[same]] distress once stress became high","The difference was biggest at high stress."],["Lower distress [[only]] when stress was low","The benefit was largest when stress was high."]],"k":"A buffer matters most when things are hardest: nature’s advantage grew from about 1 point (low stress) to almost 4 points (high stress).","h":"An umbrella makes little difference in drizzle and a big one in a downpour."},{"id":"s1q113","s":1,"o":7,"t":"L","sc":"declinec","q":"Lecture’s chart (Hofferth & Sandberg, 2001) compared weekly hours of play in 1981 and 1997. For which group did play time ==not== drop?","a":[["Children aged [[9–12]]","Yes. Their hours rose slightly (about 7.4 to 8.9). The drop was in younger children and overall."],["Children aged [[3–5]]","This group dropped the most: about 26 hours to about 17."],["Children aged [[6–8]]","Their play fell from about 15 hours to about 11."],["Children of [[all ages]] combined","Overall play fell from about 14.5 to about 12 hours."],["[[Every]] group dropped equally","The size of the change differed by age, and one group didn’t drop."]],"k":"1981 → 1997: play fell for 3–5s (26 → 17 h/week), 6–8s (15 → 11) and overall (14.5 → 12). 9–12s rose slightly."},{"id":"s1q114","s":1,"o":7,"t":"L","sc":"declinec","q":"The second chart on lecture’s ‘decline of play’ slide (Mullan, 2019) tracked change from 1975 to 2015. What did it show?","a":[["[[Outdoor play]] fell by about 29%","Yes, and socializing outside the home fell by about 14%."],["[[Outdoor play]] rose by about 29%","Reversed. Both lines went down."],["[[Screen time]] fell by about 14%","Screen time wasn’t one of the two lines."],["[[Pretend play]] fell by about 40%","The lines were outdoor play and socializing out of the home."],["[[Homework]] rose by about 29%","Not what the chart tracked."]],"k":"1975 → 2015: outdoor play down about 29%, socializing out of the home down about 14%."},{"id":"s2q062","s":2,"o":11,"t":"L","sc":"schonfeldc","q":"In lecture’s chart from Schonfeld et al. (2015), where was the SEL group’s advantage in ==reading proficiency== clearest?","a":[["In [[Grade 4]], about 63% vs. 54%","Yes. By Grades 5 and 6 the two groups’ reading bars were about level."],["In [[Grade 6]], about 90% vs. 68%","Grade 6 reading was about 68% in both groups."],["In [[Grade 5]], about 85% vs. 61%","Grade 5 reading was about 61% in both groups."],["In [[every]] grade, by about 20 points","The gap was about 9 points in Grade 4 and close to zero after."],["In [[no]] grade; reading never differed","Grade 4 showed a clear gap."]],"k":"Schonfeld et al. (2015), % at proficiency: reading 54 → 63 in Grade 4 with SEL; maths 82 → 88 in Grade 4. The SEL bars were equal or higher throughout."},{"id":"s3q070","s":3,"o":15,"t":"L","sc":"rockoffc","q":"Lecture’s chart from Rockoff & Lockwood (2010) compared students who moved to a middle school with students who stayed in K–8 schools. What did it show?","a":[["Scores [[dropped]] once they entered middle school","Yes. Maths and English scores fell relative to K–8 students at the point of the move (Grade 6 or Grade 7) and stayed lower."],["Scores [[rose]] in the year they entered middle school","Reversed. The lines fall at the transition."],["Scores dropped only in [[English]], not in maths","Both subjects showed the drop."],["Scores dropped [[before]] the move, then recovered","Scores were level or rising before the move and fell after it."],["Scores were the [[same]] in both kinds of school","Middle-school students ended up lower."]],"k":"‘After they enter middle schools, students have lower test scores than students continuing in K–8 schools.’ The drop lines up with the move itself.","h":"The dip follows the move, whichever grade the move happens in."},{"id":"s3q071","s":3,"o":15,"t":"L","sc":"bennerc","q":"Lecture’s chart from Benner & Graham (2009) tracked Black and Latino students’ sense of belonging from spring of Grade 8 to fall of Grade 9. Whose belonging ==dropped==?","a":[["Students whose new school was ethnically [[incongruent]]","Yes. Belonging fell for students who moved to a high school with fewer peers of their own ethnicity. For ‘congruent’ moves the line stayed flat."],["Students whose new school was ethnically [[congruent]]","That line stayed flat across the transition."],["[[All]] students, by about the same amount in each school","Only the incongruent group dropped."],["[[Black]] students only, in every kind of school","Both Black and Latino students showed the same pattern."],["[[No]] students; belonging rose after the move","Belonging did not rise for either group."]],"k":"School transitions hit some students harder: lowest achievers, those with anxiety or social-skill struggles, and ethnic minority students, especially when the new school has fewer same-ethnicity peers."},{"id":"s3q072","s":3,"o":17,"t":"L","sc":"juvonenc","q":"Lecture’s chart from Juvonen et al. (2006) plotted three Grade 6 outcomes against school diversity. As diversity ==increased==, what happened?","a":[["Safety [[rose]]; victimization and loneliness [[fell]]","Yes. The same pattern appeared in fall and in spring of Grade 6."],["Safety [[fell]]; victimization and loneliness [[rose]]","Reversed."],["Safety, victimization and loneliness all [[rose]]","Only feelings of safety went up."],["Safety, victimization and loneliness all [[fell]]","Feelings of safety went up."],["All three stayed [[flat]] across schools","All three lines sloped with diversity."]],"k":"More diverse schools: students felt safer, less victimized by peers, and less lonely."},{"id":"s4q066","s":4,"o":21,"t":"L","sc":"albertc","q":"Lecture’s chart from Albert et al. (2013) showed risky decisions in a driving game for adolescents, young adults and adults, alone or with peers. What did it show?","a":[["Only [[adolescents]] took more risks with peers","Yes: about 46% risky decisions alone vs. 59% with peers, and more crashes. Young adults and adults barely changed."],["[[All three]] groups took more risks with peers","Young adults and adults didn’t show the jump."],["Only [[adults]] took clearly more risks with peers","Adults barely changed."],["Adolescents took [[fewer]] risks with peers watching","They took more."],["[[No]] group changed when peers were present","Adolescents did."]],"k":"Peer presence raises risk taking in adolescents (46% → 59% risky decisions; crashes up), not in young adults or adults."},{"id":"s4q067","s":4,"o":21,"t":"L","sc":"tolc","q":"In lecture’s chart from Steinberg et al. (2008), which pattern appeared for ‘time to first move’ on the ==hardest== puzzles?","a":[["[[Older]] groups waited longer before moving","Yes. On 6- and 7-move problems the oldest groups paused about 11 to 13 seconds, while 10–11-year-olds stayed near 5 seconds whatever the difficulty."],["[[Younger]] groups waited longer before moving","Reversed. The youngest moved fastest."],["[[All]] ages waited about the same time","The lines spread apart as problems got harder."],["[[Older]] groups moved sooner on hard puzzles","They slowed down to plan."],["[[Nobody]] slowed down as puzzles got harder","Older groups slowed down a lot."]],"k":"Self-regulation improves gradually: with age, people pause to plan when the problem is hard instead of jumping in."},{"id":"s4q068","s":4,"o":21,"t":"L","sc":"icenoglec","q":"In lecture’s chart from Icenogle et al. (2019), about when does ==cognitive capacity== level off?","a":[["At about [[16–17]]","Yes. The line climbs steeply from 10–11 and is flat from about 16–17 through 26–30."],["At about [[10–11]]","That’s where the line starts, at its lowest."],["At about [[12–13]]","Still climbing steeply here."],["At about [[22–25]]","It had already been flat for years by then."],["It never levels off before [[30]]","It plateaus in adolescence."]],"k":"‘In many ways, our cognitive skills are adult-like by mid–late adolescence.’"},{"id":"s4q069","s":4,"o":21,"t":"L","sc":"brain","q":"On lecture’s brain development slide, which finding belongs to ==Giedd et al. (1999)==?","a":[["Frontal [[grey matter]] peaks at about 11–12","Yes. The inverted-U curve. Grey matter = neurons/synapses."],["[[White matter]] measures rise steadily from 6 to 20","That’s the other chart on the slide (Barnea-Goraly et al., 2005)."],["Brain [[size]] keeps growing until the mid-twenties","Overall size is adult-like by about 10."],["The [[limbic system]] matures later than the cortex","The reward system changes early, around puberty."],["Frontal [[grey matter]] rises steadily to age 22","It peaks in early adolescence, then decreases."]],"k":"White matter (myelination): linear increase. Grey matter (neurons/synapses): peaks in early adolescence, decreases after. Result: a gradually more efficient brain."},{"id":"s3q073","s":3,"o":15,"t":"L","sc":"summer","q":"Lecture’s ‘school year’ slide compared a traditional calendar with a ==balanced calendar==. What is the main difference?","a":[["The summer break is [[spread out]] over the year","Yes. About 30 days in summer instead of 60, with longer breaks in fall, winter and spring."],["Students attend many [[more days]] in total","The idea is redistributing days off, not adding school days."],["The winter break is [[removed]] entirely","Breaks are kept and spread more evenly."],["School runs on [[weekends]] instead of in summer","Not how a balanced calendar works."],["Each grade starts in a [[different]] month","Not the difference shown."]],"k":"Year-round (balanced) calendar: shorter summer break, more frequent breaks. Proposed because of summer learning loss."},{"id":"s2q063","s":2,"o":9,"t":"L","sc":"pygc","q":"Lecture’s chart from Rosenthal & Jacobson (1968) showed the percentage of first and second graders who gained IQ points. What did it show?","a":[["More [[bloomers]] than controls gained at every level","Yes. Gained 10+ points: 79% vs. 49%. 20+ points: 47% vs. 19%. 30+ points: 21% vs. 5%."],["More [[controls]] than bloomers gained at every level","Reversed. The experimental (‘bloomer’) bars were taller each time."],["The groups [[matched]] except at 30 IQ points","They differed at 10, 20 and 30 points."],["Only the [[bloomers]] gained any IQ points at all","Many control students gained too (49% gained 10+), just fewer."],["[[Neither]] group gained more than 10 IQ points","Some students in both groups gained 20 or 30 points."]],"k":"Pygmalion data: ‘bloomers’ (experimental group) were more likely to gain 10, 20 and 30 IQ points than the control group, in Grades 1 and 2.","h":"Same kids, different label, different growth."},{"id":"s1q115","s":1,"o":7,"t":"L","sc":"corbettc","q":"Beside the limitations of play research, lecture showed Corbett et al. (2010): cortisol (a stress hormone) measured across a session for four groups of children. Which group’s cortisol was ==highest== by the later samples?","a":[["[[Older]] children with autism","Yes. Their line stayed highest (about 1.5 to 1.65) while the other groups’ cortisol fell. A reminder to ask whether findings hold across populations."],["[[Younger]] children with autism","Their line was the lowest on the chart."],["[[Older]] typically developing children","Their cortisol dropped by the last sample."],["[[Younger]] typically developing children","They started highest but fell steadily."],["[[All four]] groups ended at the same level","The lines ended well apart."]],"k":"Corbett et al. (2010): older children with autism showed the highest cortisol. Shown with the limitations list: correlational evidence, barriers, generalizability across populations, real-world risks."},{"id":"s1q116","s":1,"o":7,"t":"L","sc":"apply","q":"Lecture’s community-initiatives slide used a word cloud from Vlaar et al. (2019) about neighbourhoods. Which features stood out ==largest==?","a":[["[[Crime-free]], walkable places to go, good neighbour relationships","Yes. Those were the biggest phrases, alongside traffic safety and social safety."],["[[Private]] yards, tall fences, and security cameras","Not on the slide. The features were about shared, connected spaces."],["[[Indoor]] play centres, tutoring, and organised leagues","Not on the slide."],["[[Larger]] schools, later start times, and bus routes","Those are schooling topics."],["[[Screen-free]] homes, earlier bedtimes, and chore charts","Not on the slide."]],"k":"Community route: playgrounds and outdoor spaces, plus neighbourhoods that are crime-free, walkable, traffic-safe, socially safe and neighbourly."},{"id":"s1q117","s":1,"o":7,"t":"L","sc":"apply","q":"Lecture showed a news story: Toronto city council voted to reverse a ban on tobogganing at 45 hills, replacing ‘no tobogganing’ signs with ones warning of risks. Which route to application is this?","a":[["[[Laws/policy]]","Yes. That was the box highlighted on the slide: a rule about children’s risky play was changed."],["[[Parent education]], training","The example on that route was the OutsidePlay parent tool."],["[[School/daycare]] programs, training","The example there was a ‘Bring your class outside’ tool for educators."],["[[Community initiatives]]","The examples there were playgrounds and neighbourhood features."],["[[Generalizability]] testing","That’s a limitation of the research, not a route."]],"k":"Four routes with lecture’s examples: parent training (OutsidePlay parent tool) · school/daycare training (educator tool) · community (playgrounds, walkable safe neighbourhoods) · laws/policy (Toronto reversing its toboggan ban)."},{"id":"s1q118","s":1,"o":4,"t":"L","sc":"risky","q":"In lecture’s iClicker examples of risky play, one read: ‘Lighting as many candles as possible when my parents weren’t paying attention.’ Which of the six kinds fits best?","a":[["Play near [[elements]]","Fire is one of the elements. (The slide asks the question without printing the answer; this is the best fit.)"],["Play with [[heights]]","Nothing is being climbed."],["Play at [[high speeds]]","Nothing fast is happening."],["[[Rough and tumble]] play","Nobody is play-fighting."],["Play with a chance of [[getting lost]]","The child is at home, just unsupervised."]],"k":"Six kinds: heights · high speeds · tools · elements (fire, water) · chance of getting lost · rough and tumble."},{"id":"s1q119","s":1,"o":6,"t":"LR","sc":"ramsden","q":"Lecture’s bar chart for Ramsden et al. (2026) compared the average scores of vulnerable and not-vulnerable children on the three exposures. What did it show?","a":[["Vulnerable children: less play, [[more screen time]]","Yes. Outdoor play 4.27 vs. 4.39, chance for risky play 4.58 vs. 4.82, screen time 3.79 vs. 3.51."],["Vulnerable children: more play, [[less screen time]]","Reversed."],["Vulnerable children: [[more]] of all three exposures","Only screen time was higher."],["Vulnerable children: [[less]] of all three exposures","Screen time was higher, not lower."],["The two groups had [[equal]] averages on all three","All three differed."]],"k":"Table 1 means (1–5 or 1–6 scales): not vulnerable vs. vulnerable. Outdoor play 4.39 vs. 4.27 · risky play 4.82 vs. 4.58 · screen time 3.51 vs. 3.79."},{"id":"s3q074","s":3,"o":15,"t":"L","sc":"millsc","q":"Lecture’s chart from Mills & Wolf (2017) followed students who won a lottery scholarship to attend private school. What happened to their achievement?","a":[["It [[dropped]] sharply in Year 1, then recovered","Yes. Maths fell from about the 52nd to the 25th percentile in Year 1, and was back near the start (45th) by Year 3. No gain."],["It [[rose]] sharply in Year 1, then kept rising","Reversed. The first year showed a significant drop."],["It stayed [[flat]] across all three years","There was a clear Year 1 dip."],["It [[dropped]] in Year 1 and kept falling after","Scores climbed back in Years 2 and 3."],["It [[rose]] in maths but fell in English","Both subjects dipped in Year 1, maths more."]],"k":"Lottery studies of private school: ‘mixed → often find no improvement, or even decline’. Here: a Year 1 drop (maths 52 → 25, English 51 → 40), recovering to about the starting point by Year 3.","h":"A lottery is random assignment done by luck, so family differences can’t explain the result."},{"id":"s3q075","s":3,"o":15,"t":"L","sc":"barnumc","q":"Beside ‘more so for low-income families?’, lecture showed charts from Barnum (2018) on what kindergarteners did over the summer. What did they show?","a":[["[[Poor]] children had the fewest enrichment outings","Yes. Visited a museum, gallery or historical site: 32% (poor), 44% (near-poor), 63% (nonpoor). Play or concert: 15%, 19%, 33%."],["[[Nonpoor]] children had the fewest enrichment outings","Reversed. Nonpoor children had the most."],["All income groups had [[equal]] summer outings","The bars rose with income."],["[[Near-poor]] children had the most outings","They were in the middle."],["[[Poor]] children attended more plays and concerts","They attended the fewest (15%)."]],"k":"One reason summer loss may hit low-income families harder: fewer enriching summer experiences (museum visits 32% vs. 63%; plays or concerts 15% vs. 33%)."},{"id":"s4q070","s":4,"o":21,"t":"L","sc":"money","q":"Lecture’s chart from Steinberg et al. (2009) plotted, for each age group, the amount of money now that felt as good as $1,000 later. At the longest delays, how did the ==youngest== groups differ?","a":[["They settled for [[less money]] now","Yes. With a year’s delay the 12–15-year-olds’ lines ended lowest (about $340), the older groups higher (about $430 to $450). Younger teens discount the future more."],["They held out for [[more money]] now","Reversed. Their lines were lowest."],["They chose the [[same amounts]] as adults","The lines separated at long delays."],["They [[refused]] to pick an immediate amount","Every group has a line on the chart."],["They discounted [[less]] than the oldest group","They discounted more."]],"k":"Future orientation improves over adolescence: the lower the amount you’d accept now, the more you are discounting the future.","h":"Lecture asked it two ways: $400 tomorrow or $1,000 in a week? In a year?"},{"id":"s1q120","s":1,"o":0,"t":"L","sc":"playdef","q":"A coach tells the whole class they ==must== join the relay race or lose recess. The kids run and even laugh. Which feature of play is missing?","a":[["It isn’t [[voluntary]]","Yes. Play is freely chosen. If you’d be punished for sitting out, it’s a requirement, even if it turns out fun."],["It isn’t [[joyful]]","They’re laughing, so joy is there. The problem is that they had no choice."],["It isn’t [[active engagement]]","Running a relay is about as active as it gets."],["It isn’t [[unrelated to survival]]","A relay race has nothing to do with staying alive, so this feature is fine."],["It isn’t [[rule-free]]","Being rule-free is not one of the six features. Plenty of play has rules."]],"k":"Voluntary = the child chooses it. Forced fun isn’t play.","h":"If you can’t say no, it’s not play."},{"id":"s1q121","s":1,"o":0,"t":"L","sc":"playdef","q":"Tia chose to join a dance club and loves it. But every step is fixed in advance and rehearsed the same way each time. Which feature of play is ==least== present?","a":[["[[Spontaneous]]","Yes. Spontaneous means it unfolds in the moment. A fully scripted routine leaves no room for that."],["[[Voluntary]]","She chose to join, so it’s voluntary."],["[[Joyful]]","She loves it, so joy is present."],["[[Active engagement]]","Dancing is active, body and mind."],["[[Intrinsically motivated]]","She does it because she loves it, which is intrinsic."]],"k":"Spontaneous = arising in the moment, not scripted ahead of time.","h":"Play is improv, not a script."},{"id":"s1q122","s":1,"o":0,"t":"L","sc":"playdef","q":"Omar picks a cartoon he loves and sits watching it for an hour, laughing. Going by lecture’s six features, why is this ==not== a clear case of play?","a":[["There’s no [[active engagement]]","Yes. He chose it and enjoys it, but he’s taking it in passively. Play involves ACTIVE engagement."],["It isn’t [[voluntary]]","He picked the cartoon himself."],["It isn’t [[joyful]]","He’s laughing, so it’s joyful."],["It’s tied to [[immediate survival]]","Watching a cartoon has nothing to do with survival."],["It’s [[extrinsically]] motivated","Nobody is rewarding him. He watches because he likes it."]],"k":"Active engagement: the child is doing, not just receiving.","h":"Watching the game isn’t playing the game."},{"id":"s1q123","s":1,"o":0,"t":"L","sc":"playdef","q":"Which of these is ==NOT== one of lecture’s six features of play?","a":[["[[Rule-governed]]","Right, this one isn’t on the slide. Some play has rules (games), but rules aren’t part of the definition."],["[[Spontaneous]]","On the slide."],["[[Active engagement]]","On the slide."],["[[Joyful]]","On the slide."],["[[Voluntary]]","On the slide."]],"k":"The six: joyful · active engagement · spontaneous · voluntary · intrinsically motivated · unrelated to immediate survival."},{"id":"s1q124","s":1,"o":0,"t":"L","sc":"stagetab","q":"Lena works on a puzzle by herself in the corner. The kids near her are playing tag. She doesn’t interact with them and isn’t doing anything like what they’re doing. Which category is this?","a":[["[[Solitary]] play","Yes. Lecture’s table: children play by themselves, do not interact, and are NOT doing similar activities as the children around them."],["[[Parallel]] play","Parallel needs similar toys or activities side by side. A puzzle next to a game of tag isn’t similar."],["[[Onlooker]] play","An onlooker watches the others play. Lena is busy with her own thing."],["[[Unoccupied]] play","Unoccupied looks random with no goal. Lena has a clear goal: finish the puzzle."],["[[Associative]] play","Associative involves interacting and sharing. She isn’t interacting at all."]],"k":"Solitary = alone, no interaction, and not doing what nearby kids do.","h":"Solitary = solo AND different. Parallel = solo but same."},{"id":"s1q125","s":1,"o":0,"t":"L","sc":"stagetab","q":"Sam stands at the edge of the sandbox watching three kids build. He calls out ‘put the bucket there!’ but never steps in. Which category is this?","a":[["[[Onlooker]] play","Yes. Onlookers observe, may comment and even make suggestions, but will not directly join the play."],["[[Associative]] play","Associative kids actually interact and share toys inside the play. Sam stays outside it."],["[[Unoccupied]] play","Unoccupied is random behaviour without a goal. Sam is clearly focused on the others."],["[[Solitary]] play","Solitary kids play alone with their own activity. Sam has no activity of his own."],["[[Cooperative]] play","Cooperative means working together on a common goal. He isn’t in the group."]],"k":"Onlooker = watches, may comment or suggest, doesn’t join.","h":"A sports fan yelling advice from the stands."},{"id":"s1q126","s":1,"o":0,"t":"L","sc":"stagetab","q":"A toddler wanders around the room, touches a toy for a second, looks at the ceiling, waves an arm. The behaviour seems random, with no specific goal. Which category is this?","a":[["[[Unoccupied]] play","Yes. Lecture’s table: behaviour seems more random and without a specific goal. It’s also the least common form."],["[[Solitary]] play","Solitary play has a real activity the child is focused on, just alone."],["[[Onlooker]] play","An onlooker is watching other children play, on purpose."],["[[Parallel]] play","Parallel means playing beside others with similar toys."],["[[Associative]] play","Associative means interacting and sharing toys. This toddler is alone and aimless."]],"k":"Unoccupied = random, no specific goal. Least common form."},{"id":"s1q127","s":1,"o":0,"t":"L","sc":"stagetab","q":"On lecture’s table, ==parallel play== sits on which side of the non-social / social split?","a":[["The [[social]] side, with associative and cooperative","Yes. The slide’s bracket for social play covers parallel, associative and cooperative, even though parallel players don’t directly act with each other."],["The [[non-social]] side, with solitary and onlooker play","Tempting, since they don’t interact. But the slide’s non-social bracket only covers unoccupied, solitary and onlooker."],["[[Neither]] side: it was shown as the bridge","The slide drew two brackets, and parallel was inside the social one."],["The [[non-social]] side, with unoccupied play","Unoccupied is non-social, but parallel isn’t grouped with it."],["[[Both]] sides, depending on the child’s age","The table placed it once, under social play."]],"k":"Non-social: unoccupied, solitary, onlooker. Social: parallel, associative, cooperative.","h":"Three and three. Parallel is the first step onto the social side."},{"id":"s1q128","s":1,"o":0,"t":"L","sc":"stagetab","q":"Which order matches lecture’s table of play categories from ==top to bottom==?","a":[["Unoccupied, solitary, onlooker, parallel, associative, cooperative","Yes. Three non-social ones first, then three social ones."],["Solitary, unoccupied, onlooker, parallel, cooperative, associative","Two swaps here: unoccupied comes first, and associative comes before cooperative."],["Unoccupied, onlooker, solitary, associative, parallel, cooperative","Solitary comes before onlooker, and parallel before associative."],["Onlooker, solitary, unoccupied, parallel, associative, cooperative","The social half is right, but the non-social half is backwards."],["Unoccupied, solitary, parallel, onlooker, associative, cooperative","Onlooker belongs with the non-social three, before parallel."]],"k":"U-S-O then P-A-C: Unoccupied, Solitary, Onlooker, Parallel, Associative, Cooperative.","h":"U-S-O, P-A-C."},{"id":"s1q129","s":1,"o":0,"t":"L","sc":"stagetab","q":"What is the ==one thing== that turns associative play into cooperative play?","a":[["Working toward a [[common goal]]","Yes. In both, kids interact. Associative: no common goal. Cooperative: a common goal, often with different tasks."],["Starting to [[share toys]]","Sharing toys already happens in associative play."],["Starting to [[talk]] to each other","They already interact in associative play."],["Using [[similar toys]] side by side","That describes parallel play, one step earlier."],["Having an [[adult]] organize the play","Adult support is about guided play, which is a type, not a stage."]],"k":"Associative = interact + share, NO common goal. Cooperative = interact FOR a common goal.","h":"Associative: chatting while each draws their own picture. Cooperative: painting one mural together."},{"id":"s1q130","s":1,"o":0,"t":"L","sc":"stagetab","q":"Solitary play and parallel play both involve no direct interaction. What separates them in lecture’s table?","a":[["Parallel players use [[similar toys]] side by side","Yes. Solitary: not engaging in similar activities as those around them. Parallel: alongside each other with similar toys."],["In parallel play, children [[share]] their toys","Sharing shows up in associative play."],["In solitary play, children [[watch]] the others","Watching is onlooker play."],["In parallel play, children work toward a [[common goal]]","A common goal is cooperative play."],["In solitary play, behaviour is [[random]]","Random, goal-less behaviour is unoccupied play."]],"k":"Solitary = alone and doing something different. Parallel = side by side doing something similar."},{"id":"s1q131","s":1,"o":1,"t":"L","sc":"playdef","q":"Which of these was ==NOT== on lecture’s list of types of play?","a":[["[[Onlooker]] play","Right. Onlooker play is a category from the development-of-play table (how social), not one of the listed types."],["[[Games]]","On the list."],["[[Object]] play","On the list."],["[[Outdoor]] / nature play","On the list."],["[[Guided]] play","On the list."]],"k":"Types: games, object, guided, physical (rough-and-tumble), pretend, risky, outdoor/nature... and more.","h":"Stages tell you HOW social. Types tell you WHAT kind."},{"id":"s1q132","s":1,"o":1,"t":"L","sc":"types","q":"Lecture’s list of types of play ended with ==‘And more!’== What does that tell you?","a":[["The list is [[not complete]]","Yes. Seven types were named, but lecture flagged that there are others."],["The types are ranked by [[importance]]","Nothing on the slide ranked them."],["Only these seven [[have benefits]]","The slide said each type is thought to carry its own benefits, and didn’t limit it to seven."],["The types happen [[in this order]]","That’s the stages table. Types aren’t a sequence."],["More types appear [[only in adults]]","Nothing like that was said."]],"k":"Seven named types ‘and more’, each thought to carry its own benefits."},{"id":"s1q133","s":1,"o":1,"t":"L","sc":"types","q":"On lecture’s list, physical play was written as ‘Physical play (____ play)’.","a":[["[[rough-and-tumble]]","Yes. Rough-and-tumble was the example given for physical play."],["[[risky/adventurous]]","Risky play was its own item on the list."],["[[outdoor]]","Outdoor/nature play was its own item."],["[[object]]","Object play was its own item."],["[[parallel]]","Parallel play is a stage, not a type."]],"k":"Physical play (rough-and-tumble play).","b":1},{"id":"s1q134","s":1,"o":1,"t":"L","sc":"types","q":"Which pairing correctly sorts a ==stage== from a ==type==?","a":[["Parallel play is a stage; pretend play is a type","Yes. Parallel comes from the development table (how social). Pretend is on the list of types (what kind)."],["Pretend play is a stage; parallel play is a type","Reversed."],["Guided play is a stage; cooperative play is a type","Reversed. Guided is a type, cooperative is a stage."],["Risky play is a stage; object play is a type","Both are types."],["Solitary play is a stage; onlooker play is a type","Both are stages."]],"k":"Stages (table): unoccupied → cooperative. Types (list): games, object, guided, physical, pretend, risky, outdoor/nature."},{"id":"s1q135","s":1,"o":1,"t":"L","sc":"types","q":"Four friends sit around a board with dice, taking turns and following the rules on the box. Which type from lecture’s list fits best?","a":[["[[Games]]","Yes. A board game with turns and rules is the clearest example of games."],["[[Guided]] play","Guided play has an adult supporting toward a learning goal. No adult here."],["[[Pretend]] play","Nobody is acting as-if or making believe."],["[[Physical]] play","They’re sitting at a table, not tumbling around."],["[[Risky]] play","There’s no thrill or chance of physical injury."]],"k":"Games were the first type on lecture’s list."},{"id":"s1q136","s":1,"o":2,"t":"L","sc":"benefits","q":"Lecture’s slide said play is ==correlated with improved== which three things?","a":[["Cognitive skills, social skills, mental health","Yes, exactly those three, and the word used was ‘correlated’."],["Cognitive skills, motor skills, school grades","Motor skills and grades weren’t in this bullet."],["Social skills, language skills, self-control","Language and self-control belong to the pretend play slide."],["Mental health, physical health, sleep quality","Physical health and sleep weren’t in this bullet."],["Brain development, attention span, mental health","Brain development was a separate bullet, and attention span wasn’t listed."]],"k":"Play: correlated with improved cognitive skills, social skills, mental health."},{"id":"s1q137","s":1,"o":2,"t":"L","sc":"benefits","q":"According to lecture, play is ____ with improved cognitive skills, social skills and mental health.","a":[["[[correlated]]","Yes. The slide’s wording is careful: ‘linked with’, ‘correlated with’. Not ‘causes’."],["[[required]]","Nothing says these skills can’t develop without play."],["[[unrelated]]","The slide reported a positive association."],["[[shown to cause]]","Too strong. Most of this research is correlational."],["[[inversely linked]]","That would mean more play, worse skills. The link is positive."]],"k":"Watch the verbs: linked with, correlated with, MAY push us.","h":"Going together isn’t the same as one causing the other.","b":1},{"id":"s1q138","s":1,"o":2,"t":"L","sc":"benefits","q":"Which of these was ==NOT== on lecture’s ‘benefits of play’ slide?","a":[["Stronger [[immune]] function","Right, that wasn’t listed."],["More advanced [[brain]] development","Listed (first bullet)."],["Reduction in [[stress]]","Listed."],["Beneficial for [[learning]]","Listed."],["May push us toward [[harder]] things","Listed, with a question mark and the Rule et al. (2024) study."]],"k":"Five bullets: brain development · less stress · cognitive/social/mental health · learning · may push us to try harder things."},{"id":"s1q139","s":1,"o":2,"t":"L","sc":"rulec","q":"In Rule et al. (2024), what were the ==two conditions==?","a":[["Play to win [[stickers]] vs. play to have [[fun]]","Yes. Same game, two framings: win stickers, or just have fun."],["Play [[alone]] vs. play with a [[partner]]","The study varied the reason for playing, not who you played with."],["Play [[indoors]] vs. play [[outdoors]]","Location wasn’t the manipulation."],["Play with [[rules]] vs. play with [[no rules]] at all","Both groups played the same game."],["Play [[before]] vs. [[after]] a hard test","There was no test."]],"k":"Rule et al. (2024): play to win stickers vs. play to have fun; then pick variations that make the game easier or harder."},{"id":"s1q140","s":1,"o":2,"t":"L","sc":"rulec","q":"In Rule et al. (2024), what did the researchers ==measure==?","a":[["Whether they picked [[easier or harder]] versions","Yes. Children chose variations that made the game easier or harder, and the fun group leaned harder."],["How many [[stickers]] each child won","Stickers were the reward in one condition, not the outcome."],["How [[long]] children kept playing","Play time wasn’t the measure shown."],["How much children said they [[enjoyed]] the game afterwards","Enjoyment ratings weren’t what the chart showed."],["How well children [[scored]] in the game","The chart was about the difficulty they chose, not their scores."]],"k":"Outcome = the difficulty children chose for themselves.","h":"When it’s for fun, the hard version is the fun version."},{"id":"s1q141","s":1,"o":2,"t":"L","sc":"rulec","q":"Lecture’s Rule et al. (2024) chart showed four kinds of game variation. On which one was there ==no significant difference== between the groups?","a":[["[[Distance]]","Yes. On the chart, the fun group chose significantly harder options for penalty, blocks and resolution, but not distance."],["[[Penalty]]","This one was significant."],["[[Blocks]]","This one was significant."],["[[Resolution]]","This one was significant."],["[[None]]: all four differed","Three of the four were significant."]],"k":"Fun > win on penalty, blocks, resolution. Distance: no significant difference."},{"id":"s1q142","s":1,"o":2,"t":"L","sc":"declinec","q":"In lecture’s chart from Hofferth & Sandberg (2001), which age group lost the ==most== weekly play time between 1981 and 1997?","a":[["Ages [[3–5]], from about 26 to 17 hours","Yes. The youngest group had the biggest drop (26 → 17.3 hours a week)."],["Ages [[6–8]], from about 15 to 11 hours","They did drop (15 → 11.2), but less than the youngest group."],["Ages [[9–12
