rability at school entry."],["Does a [[risky play program]] in kindergarten raise [[reading]] scores?","There was no program or intervention; it was an observational study."],["Do [[teachers’ expectations]] shape children’s [[kindergarten]] adjustment?","That’s the Pygmalion idea from the schooling unit."],["Does [[screen time]] in adolescence predict [[risky behaviour]] later?","The children were about 5 years old, entering kindergarten."],["Do [[parents and teachers]] agree when rating the [[same child]]?","Parents and teachers reported on different things (exposures vs. outcomes)."]],"k":"Ramsden: are outdoor play, risky play and screen time (before K) associated with developmental vulnerability in kindergarten?","h":"Three exposures in, one outcome out: OUTDOOR, RISKY, SCREEN → VULNERABLE or not."},{"id":"s1q061","s":1,"o":6,"t":"LR","sc":"ramsden","q":"Why did lecture say the ==transition into primary school== matters so much?","a":[["A child’s [[start to school]] often sets up later [[gaps]]","Yes: beginning school is a difficult challenge, and how children start often sets up future advantages and opportunity gaps."],["Kindergarten is the [[only time]] play can affect [[development]]","Nothing says play only matters then."],["Children’s [[attachment style]] is fixed during the [[first week]]","Not part of this study or lecture."],["Teachers [[stop adjusting]] expectations after [[kindergarten]]","Not claimed."],["Most children are [[vulnerable]] in all [[five domains]] at entry","About a third were vulnerable on one or more domains, not most on all five."]],"k":"School entry is a high-stakes transition: early vulnerability can snowball into opportunity gaps.","h":"Ramsden calls it a ‘high-stakes stress test’. Start behind, and it’s hard to catch up."},{"id":"s1q062","s":1,"o":6,"t":"R","sc":"ramsden","q":"Which best describes the ==design== of Ramsden et al. (2026)?","a":[["A [[longitudinal]], observational study [[linking]] two questionnaires","Yes. Parent-reported experiences (CHEQ) were linked to later teacher-rated outcomes (EDI). No one was assigned to anything."],["A [[randomized]] trial assigning children to more or less [[screen time]]","Nobody was randomly assigned. That would be an experiment."],["A [[cross-sectional]] survey given to teachers at [[one time point]]","There were two tools at two time points from two informants."],["A [[case study]] following six children through [[kindergarten]]","The sample was nearly 5,000 children."],["A [[twin study]] separating genetic from [[environmental]] effects","No twins involved."]],"k":"Design: longitudinal + correlational. CHEQ (parents, start of K) linked to EDI (teachers, February of K).","h":"Longitudinal = exposure measured first, outcome later. Still NOT an experiment, so no causal proof."},{"id":"s1q063","s":1,"o":6,"t":"R","sc":"ramsden","q":"Who took part in Ramsden et al. (2026)?","a":[["About [[5,000]] kindergarteners in [[British Columbia]]","Yes: n = 4,968 children entering K in BC in 2023 and 2024 (mean age about 5.5)."],["About [[500]] preschoolers attending daycare in [[Ontario]]","Wrong size and province."],["About [[5,000]] Grade 4–6 students in [[California]]","That’s closer to Fraction Ball’s grades and location."],["About [[300,000]] middle-school students in [[North Carolina]]","That’s Leer et al.’s administrative sample."],["About [[160]] kindergarteners from one [[Vancouver]] school","Far too small; children came from 343 schools in 23 districts."]],"k":"Sample: 4,968 kindergarten children in BC (2023 and 2024 cohorts), 343 schools, 23 districts."},{"id":"s1q064","s":1,"o":6,"t":"R","sc":"ramsden","q":"In Ramsden et al. (2026), who reported on children’s ==outdoor play, risky play and screen time==, and about what period?","a":[["[[Caregivers]], about the [[six months]] before entry","Yes. The CHEQ is caregiver-reported (mostly mothers) and covers the six months before K."],["[[Teachers]], about the [[first six months]] of kindergarten","Teachers completed the EDI (outcomes), not the exposure questions."],["[[Children]] themselves, about a [[typical week]] at home","Five-year-olds didn’t self-report."],["[[Researchers]], by observing play for [[one week]]","There was no direct observation."],["[[Daycare staff]], about the [[year]] before kindergarten","The CHEQ was completed by parents/caregivers."]],"k":"CHEQ (Childhood Experiences Questionnaire) = caregiver report of the 6 months before kindergarten.","h":"CHEQ = parents ‘CHEQ-ing’ in on what home life was like."},{"id":"s1q065","s":1,"o":6,"t":"R","sc":"edi5","q":"In Ramsden et al. (2026), how was ==developmental vulnerability== measured?","a":[["[[Teachers]] filled in the [[EDI]] for each kindergartener","Yes. The EDI is teacher-rated, covers five domains, and was done in February of the K year."],["[[Parents]] completed a [[screen-time diary]] for six months","Parents reported exposures on the CHEQ, not the outcome."],["[[Children]] sat a standardized [[reading and maths]] test","No direct testing of children."],["[[Doctors]] recorded [[physical health]] at a check-up","No medical exams were used."],["[[Researchers]] coded [[videotaped]] classroom behaviour","No video coding."]],"k":"EDI (Early Development Instrument) = teacher report across 5 domains. ‘Vulnerable’ = vulnerable on 1 or more domains.","h":"Different people rated the ‘cause’ and the ‘effect’ (parents vs. teachers). That’s a strength."},{"id":"s1q066","s":1,"o":6,"t":"R","sc":"edi5","q":"Which is ==NOT== one of the five EDI domains used in Ramsden et al. (2026)?","a":[["[[Executive function and attention]]","Right, this is NOT a domain. The five: physical health & well-being, social competence, emotional maturity, language & cognitive development, communication skills & general knowledge."],["[[Physical health and well-being]]","This IS one of the five domains."],["[[Social competence]]","This IS one of the five domains."],["[[Emotional maturity]]","This IS one of the five domains."],["[[Communication skills and general knowledge]]","This IS one of the five domains."]],"k":"EDI’s 5 domains: Physical · Social · Emotional · Language & cognitive · Communication & general knowledge.","h":"P-S-E-L-C: ‘Please See Every Little Child.’"},{"id":"s1q067","s":1,"o":6,"t":"R","sc":"edi5","q":"What share of children in Ramsden et al. (2026) were ==vulnerable on one or more== EDI domains?","a":[["About [[one third]] (32.9%)","Yes: 1,635 of 4,968 children."],["About [[one in ten]] (10%)","Too low."],["About [[one in five]] (20%)","Too low."],["About [[half]] (50%)","Too high. 50.3% was the CHEQ–EDI linkage rate."],["About [[two thirds]] (66%)","Too high. (66% is the Candy Witch number!)"]],"k":"32.9% of children were vulnerable on 1+ domains."},{"id":"s1q068","s":1,"o":6,"t":"LR","sc":"three","q":"What did Ramsden et al. (2026) find for ==risky play==?","a":[["More chances for risky play → [[reduced]] overall vulnerability","Yes (aOR 0.92). More opportunities for risky play went with lower odds of being vulnerable."],["More chances for risky play → [[increased]] overall vulnerability","That was screen time’s pattern, not risky play’s."],["Risky play was [[not linked]] with overall vulnerability","That describes outdoor play frequency."],["Risky play [[reduced]] vulnerability in emotional maturity only","Emotional maturity was actually the one domain NOT significant for risky play."],["Risky play [[increased]] physical vulnerability through injuries","It was linked with REDUCED physical health vulnerability."]],"k":"Risky play → reduced overall vulnerability (aOR 0.92).","h":"RISKY = the surprising hero. SCREENS = the villain. OUTDOOR = helps, but only in two domains."},{"id":"s1q069","s":1,"o":6,"t":"LR","sc":"three","q":"What did Ramsden et al. (2026) find for ==screen time==?","a":[["More screen time → [[more]] vulnerability in [[all five]] domains","Yes (aOR 1.38 overall), with higher vulnerability in every single EDI domain."],["More screen time → [[increased]] vulnerability in language [[only]]","It was all five domains, not just language."],["More screen time → [[reduced]] vulnerability in communication","Screen time never reduced vulnerability."],["Screen time was [[unrelated]] once income was controlled","The association held after adjusting for income and other confounders."],["Screen time mattered [[only]] when above four hours a day","No such threshold; the pattern was dose-response."]],"k":"Screen time → increased vulnerability overall (aOR 1.38) and across ALL five domains.","h":"Screens were the only exposure that hit every domain. A clean sweep, in the bad way."},{"id":"s1q070","s":1,"o":6,"t":"LR","sc":"three","q":"What did Ramsden et al. (2026) find for ==outdoor play frequency==?","a":[["[[Not linked]] overall; less vulnerability in [[two domains]]","Yes: no overall link, but lower vulnerability in physical health & well-being and in communication skills & general knowledge."],["[[Reduced]] vulnerability overall and in [[all five]] domains","Outdoor play wasn’t linked with overall vulnerability."],["[[Increased]] vulnerability overall because of more [[injuries]]","It never increased vulnerability."],["[[Not linked]] with vulnerability in [[any]] domain at all","It was linked in two specific domains."],["[[Reduced]] vulnerability in emotional maturity [[only]]","The two domains were physical health/well-being and communication/general knowledge."]],"k":"Outdoor play: no overall link. Domain-specific: physical health & well-being + communication skills & general knowledge.","h":"Outdoor play helps the BODY and the TALKING (physical + communication)."},{"id":"s1q071","s":1,"o":6,"t":"R","sc":"oddsdial","q":"Ramsden et al. report an adjusted odds ratio (aOR) of ==0.92== for risky play and ==1.38== for screen time. How should these be read?","a":[["Below 1 means [[lower]] odds of vulnerability; above 1 means [[higher]] odds","Yes. 0.92 → lower odds with more risky play; 1.38 → higher odds with more screen time."],["Below 1 means [[higher]] odds of vulnerability; above 1 means [[lower]] odds","Reversed. An odds ratio of 1 is ‘no difference’; under 1 is protective."],["Both mean [[higher]] odds, with screen time being [[stronger]]","0.92 is below 1, so it signals lower odds."],["0.92 means [[92%]] of risky players were [[not vulnerable]]","An odds ratio isn’t a percentage of children."],["1.38 means screen time [[causes]] 38% of all [[vulnerability]]","Odds ratios describe association, and this study can’t show causation."]],"k":"Odds ratio: 1 = no association. <1 = lower odds (protective direction). >1 = higher odds (risk direction).","h":"Think of 1.0 as the centre line of a seesaw. 0.92 tips toward ‘safer’, 1.38 tips toward ‘riskier’."},{"id":"s1q072","s":1,"o":6,"t":"LR","sc":"three","q":"Three children start kindergarten. Ari had lots of chances for risky play. Bo played outdoors daily but with few chances for risk. Cy had the most daily screen time. Based on Ramsden et al. (2026), which prediction about ==overall== vulnerability is best supported?","a":[["[[Ari]] lower odds, [[Cy]] higher odds, [[Bo]] no clear overall difference","Yes. Risky play → reduced overall, screen time → increased overall, outdoor frequency → not linked overall."],["[[Bo]] lower odds, [[Ari]] higher odds, [[Cy]] no clear overall difference","Outdoor frequency alone wasn’t linked overall, and risky play was protective."],["[[Ari and Bo]] lower odds, [[Cy]] no clear overall difference","Screen time WAS clearly linked (increased), and outdoor frequency wasn’t linked overall."],["[[All three]] equal odds once family income is considered","The associations held after adjusting for income."],["[[Cy]] lower odds, since screens build early [[language]] skills","Screen time was linked with MORE vulnerability in language and every other domain."]],"k":"Overall vulnerability: risky ↓ · screen ↑ · outdoor frequency –."},{"id":"s1q073","s":1,"o":6,"t":"R","sc":"three","q":"Ramsden et al. (2026) found outdoor play’s benefits were ==domain-specific==. What do the authors conclude from that?","a":[["The [[quality]] of play may matter more than the [[hours]]","Yes. Features like challenge, autonomy and social context may matter more than duration, so prioritize quality over time-based metrics."],["Outdoor play should be [[replaced]] by structured [[lessons]]","They argue for richer play, not less play."],["Children need at least [[three hours]] outside each [[day]]","They argue AGAINST focusing only on minutes per day."],["Outdoor play is [[harmful]] for emotional [[maturity]]","No harm was found; it just wasn’t linked in that domain."],["[[Parents]] cannot report outdoor play [[accurately]]","Recall bias is a limitation, but it isn’t the conclusion drawn from this finding."]],"k":"Quality > quantity: challenge, autonomy and social context may matter more than minutes outside.","h":"It’s not HOW LONG you were outside, it’s WHAT you did out there."},{"id":"s1q074","s":1,"o":6,"t":"R","sc":"displace","q":"What do Ramsden et al. (2026) mean by the ==displacement== effect of screen time?","a":[["Screens [[replace]] time for active play, connection, [[sleep]]","Yes. The harm may come less from content and more from what screens push out: caregiver/peer connection, active play, and sleep."],["Screen content [[teaches]] behaviours that [[replace]] good manners","Displacement is about TIME being taken, not content."],["Children [[move]] from TV to tablets as they [[get older]]","Not what displacement means."],["Parents [[shift]] their own attention from children to [[phones]]","That’s parental technoference; the article’s point is the child’s time being displaced."],["Outdoor play [[pushes out]] time for early [[reading]]","Reversed: screens displace play, not the other way around."]],"k":"Displacement: every hour on a screen is an hour NOT spent playing, connecting or sleeping.","h":"A day is a pie. A bigger screen slice means a smaller play slice."},{"id":"s1q075","s":1,"o":6,"t":"R","sc":"displace","q":"What is the Canadian guideline for daily screen time for children ==under five==, per Ramsden et al. (2026)?","a":[["Less than [[1 hour]] per day","Yes (Canadian 24-Hour Movement Guidelines), and over 75% of children regularly exceed it."],["Less than [[15 minutes]] per day","Too strict."],["Less than [[2 hours]] per day","Too lenient for under-fives."],["Less than [[3 hours]] per day","Too lenient."],["[[No]] screen time at all","The guideline is a limit, not a ban."]],"k":"Guideline: under 1 hour/day for under-fives. Over 75% exceed it."},{"id":"s1q076","s":1,"o":6,"t":"R","sc":"three","q":"Screen time showed a ____-response association with vulnerability across all five domains.","a":[["[[dose]]","Yes. Dose-response: the more screen time, the higher the odds of vulnerability."],["[[stress]]","A stress response is a body reaction, not a statistical pattern."],["[[delayed]]","Not the term used."],["[[null]]","A null association means no link, the opposite of what was found."],["[[threshold]]","A threshold would mean harm only past a cut-off. The article describes dose-response."]],"k":"Dose-response = more exposure, more effect.","h":"Like medicine doses: a bigger dose of screens went with bigger odds of vulnerability.","b":1},{"id":"s1q077","s":1,"o":6,"t":"R","sc":"ramsden","q":"Which is a ==limitation== that Ramsden et al. (2026) acknowledge?","a":[["Exposures were [[caregiver-reported]], so [[recall bias]] is possible","Yes. Parents may misremember or make their child’s play and screen habits sound better."],["Outcomes were [[parent-reported]], so teachers’ views were [[missing]]","Reversed. Outcomes were TEACHER-reported (EDI)."],["The sample was [[too small]] to analyse separate [[domains]]","With nearly 5,000 children, domain-specific analyses were a strength."],["Children were [[randomly assigned]], so results lack [[realism]]","There was no random assignment."],["Only [[one cohort]] was studied, in a single [[school]]","Two cohorts (2023, 2024) from 343 schools."]],"k":"Limitations: self-selection/modest participation (44%, 36%) · caregiver report bias · no info on screen content or play quality · residual confounding.","h":"Would YOU tell a survey your kid watches 4 hours of iPad? That’s social desirability bias."},{"id":"s1q078","s":1,"o":6,"t":"R","sc":"ramsden","q":"CHEQ participation in Ramsden et al. (2026) was about 44% in 2023 and 36% in 2024. Why is this a problem?","a":[["Parents [[self-selected]], limiting [[generalizing]] to BC","Yes. Families who chose to respond may differ from those who didn’t, so findings may not represent the whole province."],["Teachers [[refused]] to rate children whose parents [[took part]]","EDI participation was high (over 80%)."],["It means over half the children were [[vulnerable]] at [[entry]]","Participation rate has nothing to do with vulnerability rate (32.9%)."],["It shows the questionnaire was [[too long]] for [[children]]","Parents, not children, filled it in."],["It proves the results were due to [[chance]] alone","Low participation affects generalizability, not statistical chance."]],"k":"Self-selection + modest participation → weaker generalizability."},{"id":"s1q079","s":1,"o":6,"t":"R","sc":"corr","q":"Why can’t Ramsden et al. (2026) conclude that screen time ==causes== developmental vulnerability?","a":[["It is [[observational]], so [[residual confounding]] remains","Yes. Things like parenting style, child temperament or child care could drive both screen use and vulnerability."],["The study had [[no outcome]] measure taken after the [[exposures]]","It did: EDI came after the CHEQ period."],["The study [[did not adjust]] for family [[income]] at all","Income was one of the confounders adjusted for."],["The association [[vanished]] in every [[sensitivity]] analysis","The findings were consistent across sensitivity analyses."],["The sample included children from [[only one]] [[income]] level","Incomes ranged widely."]],"k":"Longitudinal ≠ causal. Without random assignment, unmeasured confounders (parenting style, temperament…) may explain the link.","h":"Maybe stressed, time-poor families use more screens AND have more vulnerable kids. The screen might just be a marker."},{"id":"s1q080","s":1,"o":6,"t":"R","sc":"ramsden","q":"Which is a ==strength== of Ramsden et al. (2026)?","a":[["It linked [[parent-reported]] play to [[teacher-rated]] outcomes","Yes. Different informants for exposure and outcome, in a longitudinal design, at population scale."],["It [[randomly assigned]] families to different levels of [[outdoor play]]","No random assignment happened."],["It [[directly observed]] every child’s play for six [[months]]","Play was parent-reported with single questions."],["It measured the [[content]] children watched on each [[screen]]","Screen content and context were NOT captured (a limitation)."],["It included [[every]] kindergarten child in the [[province]]","Only about half had linked data, from 23 of 60 districts."]],"k":"Strength: longitudinal linkage of two tools from two informants, large population sample, domain-level analysis."},{"id":"s1q081","s":1,"o":6,"t":"R","sc":"three","q":"For which EDI domain was risky play ==NOT== significantly linked with reduced vulnerability in Ramsden et al. (2026)?","a":[["[[Emotional maturity]]","Right. Risky play was linked with reduced vulnerability in physical health, social competence, language & cognitive, and communication, but not emotional maturity."],["[[Physical health and well-being]]","Risky play WAS linked here (aOR 0.92)."],["[[Social competence]]","Risky play WAS linked here (aOR 0.91)."],["[[Language and cognitive development]]","Risky play WAS linked here (aOR 0.89)."],["[[Communication skills and general knowledge]]","Risky play WAS linked here, most strongly (aOR 0.81)."]],"k":"Risky play: 4 of 5 domains (all except emotional maturity). Screen time: 5 of 5. Outdoor play: 2 of 5.","h":"4 – 5 – 2. Risky 4, Screens 5, Outdoor 2."},{"id":"s1q082","s":1,"o":6,"t":"R","sc":"ramsden","q":"How was ==chance for risky play== measured in Ramsden et al. (2026)?","a":[["One parent question about [[taking risks outside]]","Yes: ‘how often did this child have the chance to take risks when playing outside (e.g., climb as high as they like, play wrestle, ride a bike really fast)?’"],["A [[risk-taking task]] children completed on a [[computer]]","No tasks; it was a questionnaire item."],["[[Injury records]] collected from family [[doctors]]","Injuries weren’t the measure."],["Teacher ratings of [[rough play]] in the [[classroom]]","Teachers rated outcomes, not exposures."],["[[GPS trackers]] measuring how far children [[roamed]]","No trackers."]],"k":"Risky play = one caregiver item about CHANCES to take risks outside (opportunity, not amount).","h":"Notice it’s ‘chance for’ risky play: did the kid get the opportunity?"},{"id":"s1q083","s":1,"o":6,"t":"R","sc":"ramsden","q":"Which family factors were linked with ==higher== vulnerability across Ramsden et al.’s models?","a":[["[[Lower]] income and [[single-parent]] households","Yes. Lower income and single/separated/widowed/divorced households were consistently linked with higher vulnerability (having one sibling vs. none was linked with lower)."],["[[Higher]] household income and having [[one sibling]]","Both of these were linked with LOWER vulnerability."],["[[Rural]] residence and being born [[outside Canada]]","Neither was significantly linked."],["[[Married]] parents and [[urban]] residence","Married was the reference group, and urban/rural didn’t matter."],["[[Two or more]] siblings and [[common-law]] parents","Neither was significantly different from the reference."]],"k":"Covariates: lower income ↑ · single-parent household ↑ · one sibling (vs none) ↓ · urban/rural and birthplace: no difference.","h":"That’s why the authors say solutions should be ‘universal but proportionate to need’."},{"id":"s1q084","s":1,"o":6,"t":"R","sc":"apply","q":"Which ==policy implication== do Ramsden et al. (2026) draw?","a":[["Measure [[risk and challenge]], not only [[minutes per day]]","Yes. They want outdoor play guidance to move beyond time-based targets toward risky-play-supportive spaces and practices."],["Schools should [[ban]] screens and [[extend]] recess to two hours","They suggest limiting early screen exposure, but no bans or fixed recess lengths."],["Parents should [[supervise]] outdoor play more [[closely]]","They call for more child autonomy, not closer supervision."],["Outdoor time should be [[increased]] regardless of its [[quality]]","They explicitly say to go beyond generic ‘more outdoor time’."],["Risky play should [[wait]] until children are in [[Grade 1]]","The focus is on the early years, before school entry."]],"k":"Implications: limit early screens + expand challenging outdoor play; quality, nature-rich playscapes; risk and challenge as metrics; build into frameworks, licensing and guidelines.","h":"Screens down, thrills up. And stop counting only minutes."},{"id":"s1q085","s":1,"o":6,"t":"R","sc":"ramsden","q":"What do Ramsden et al. (2026) say is needed to transform outdoor play practice?","a":[["Prioritizing [[time, space and freedom]] for children","Yes: ‘Transforming outdoor play practice requires prioritizing time, space, and freedom for children.’"],["Prioritizing [[rules, fences and supervision]] for children","That’s the risk-averse approach they want to move away from."],["Prioritizing [[apps, tablets and tracking]] for parents","The article wants less screen displacement, not more tech."],["Prioritizing [[tests, targets and rankings]] for schools","Not their recommendation."],["Prioritizing [[lessons, coaches and leagues]] for families","Structured sport isn’t the focus; unstructured, challenging play is."]],"k":"Time, space and freedom."},{"id":"s1q086","s":1,"o":7,"t":"L","sc":"apply","q":"Lecture listed four routes for ==bringing play research into the real world==. Which set is correct?","a":[["[[Parents]], [[school/daycare]], [[community]], and [[laws/policy]]","Yes: parent education/training; school/daycare programs and training; community initiatives (playgrounds, outdoor spaces); laws/policy."],["[[Medication]], [[therapy]], [[testing]], and [[early tracking]]","Not lecture’s routes."],["[[Rewards]], [[rankings]], [[honour rolls]], and [[assemblies]]","Those are performance-goal practices from the schooling unit."],["[[Screen apps]], [[video lessons]], [[online games]], and [[tablets]]","Screens were linked with more vulnerability, not offered as a route."],["[[Longer]] school days, [[more]] homework, [[earlier]] start, [[summer]] school","None of these were proposed."]],"k":"Applying play research: (1) parent education/training, (2) school/daycare programs/training, (3) community initiatives, (4) laws/policy.","h":"Zoom out step by step: HOME → SCHOOL → NEIGHBOURHOOD → GOVERNMENT."},{"id":"s1q087","s":1,"o":7,"t":"L","sc":"apply","q":"A city converts an empty lot into an adventure playground with loose logs, hills and water pumps. Which route to application is this?","a":[["A [[community initiative]]","Yes: ‘Community initiatives → playgrounds, outdoor spaces.’"],["[[Parent education]] and training","That would be teaching parents, e.g., a workshop on reframing risk."],["A [[school/daycare]] program","That would happen inside a school or child-care setting."],["A [[law or policy]] change","That would be a regulation or guideline, like child-care licensing rules."],["A [[research]] limitation","Building a playground is an application, not a limitation."]],"k":"Community initiatives = playgrounds and outdoor spaces."},{"id":"s1q088","s":1,"o":7,"t":"LR","sc":"apply","q":"A province rewrites its child-care licensing regulations so every centre must offer challenging outdoor play. Which route to application is this?","a":[["[[Laws/policy]] change","Yes. Ramsden et al. specifically suggest building these principles into early learning frameworks, child-care licensing regulations and national guidelines."],["[[Parent education]]","Parents aren’t the target here; regulations are."],["A [[community initiative]]","It affects centres through regulation, not a neighbourhood project."],["[[School/daycare]] training","Staff training might follow, but the action described is a regulation."],["[[Generalizability]] testing","That’s a research concern, not a route to application."]],"k":"Policy examples from Ramsden: early learning frameworks, child-care licensing, Canadian 24-Hour Movement Guidelines."},{"id":"s1q089","s":1,"o":7,"t":"L","sc":"apply","q":"Lecture cited Brussoni and colleagues (2021, 2022), who tested tools that help adults rethink risk in children’s play. Which route to application does that represent?","a":[["[[Education and training]] of adults","Yes. Changing adults’ attitudes toward risky play is the education/training route."],["[[Laws and policy]] at the provincial level","No legislation was involved."],["[[Community]] playground construction","Nothing was built."],["[[Ability tracking]] in schools","That’s a schooling concept."],["[[Screen-time]] limits for children","The tools were about adults’ views of risk in play."]],"k":"Parent/educator training example: risk-reframing tools (Brussoni et al.).","h":"If the barrier is ‘Get down from there!’, the fix is helping the adult rethink it."},{"id":"s1q090","s":1,"o":7,"t":"L","sc":"barriers","q":"Which set lists the ==limitations and challenges== lecture raised about applying play research?","a":[["[[Correlational]] data, [[barriers]], [[generalizability]], real [[risks]]","Yes: most research is correlational (ethics of responsibility), barriers in funding/access/broader systems, generalizability across populations, and concerns about real-world risks."],["Mostly [[experimental]], too many [[programs]], children [[dislike]] play","Most of it is correlational, and children certainly don’t dislike play."],["Mostly [[outdated]], limited to [[boys]], focused on [[infants]] only","Not the concerns raised."],["Too [[expensive]] to study, [[illegal]] in schools, opposed by [[teachers]]","Funding is a barrier to application, but the rest isn’t from lecture."],["[[Proven]] harmful, [[rejected]] by reviewers, never [[replicated]]","Play research shows benefits, not proven harm."]],"k":"Challenges: (1) correlational → ethics of responsibility, (2) barriers in funding, access, broader systems, (3) generalizability across populations, (4) real-world risks.","h":"C-B-G-R: ‘Can’t Be Generalized Recklessly.’"},{"id":"s1q091","s":1,"o":7,"t":"L","sc":"barriers","q":"Lecture noted most research on play’s benefits is correlational and raised the ‘ethics of responsibility in application’. What is the concern?","a":[["We may [[promise]] benefits research [[can’t guarantee]]","Yes. If play only correlates with good outcomes, telling families and schools ‘do this and your kids will improve’ may be overstepping."],["We may [[harm]] children by letting them play at [[recess]]","That’s not the ethical worry here."],["We may [[run out]] of research funding for [[play studies]]","Funding is a separate barrier."],["We may [[bore]] children with too many [[guided]] activities","Not the concern raised."],["We may [[offend]] cultures in which pretend play is [[rare]]","Generalizability is its own bullet; this one is about acting on correlational evidence."]],"k":"Ethics of responsibility: how confidently should we act on, and advertise, correlational findings?"},{"id":"s1q092","s":1,"o":7,"t":"L","sc":"barriers","q":"A low-income neighbourhood has no safe green space and its schools can’t afford new play equipment. Which challenge to applying play research does this show?","a":[["[[Barriers]] in funding, access and broader systems","Yes. Even if play helps, not every family or school can access it."],["[[Correlational]] evidence and ethics of responsibility","That’s about the strength of evidence, not access."],["[[Generalizability]] across populations","That’s about whether findings hold for different groups."],["[[Real-world risks]] such as injuries","Nothing about injuries here."],["[[Whole number bias]] in understanding fractions","That’s from the Fraction Ball reading."]],"k":"Access isn’t equal: Ramsden says opportunities for quality play are ‘socially structured’."},{"id":"s1q093","s":1,"o":7,"t":"L","sc":"barriers","q":"A study finds risky play benefits children in one Canadian province. A critic asks whether the same would hold for children in very different cultures or living conditions. Which challenge is the critic raising?","a":[["[[Generalizability]] across populations","Yes. Findings from one group may not apply to others."],["[[Ethics]] of acting on correlational findings","That’s about cause vs. correlation."],["[[Barriers]] in funding and access","That’s about who can get play opportunities."],["[[Real-world risks]] from adventurous play","That’s about injuries and safety."],["[[Displacement]] of play by screen time","That’s a mechanism from Ramsden et al., not this critique."]],"k":"Generalizability = does it hold for other people, places, cultures?"},{"id":"s1q094","s":1,"o":7,"t":"L","sc":"barriers","q":"A principal refuses to allow tree climbing at recess, saying ‘if a child breaks an arm, the school is responsible.’ Which challenge to applying play research does this reflect?","a":[["Concerns about [[real-world risks]]","Yes. Even with research on benefits, worries about actual injuries (and liability) make application hard."],["Lack of [[generalizability]]","The principal isn’t questioning whether findings apply to her students."],["[[Correlational]] research designs","She isn’t critiquing the evidence; she’s worried about injuries."],["[[Barriers]] in funding","Trees are free. The issue is safety, not money."],["[[Cultural differences]] in pretend play","Not relevant here."]],"k":"Real-world risk is the everyday barrier: adults fear injuries, even though risky play may reduce them long-term.","h":"This is the ‘risk-averse supervision’ Ramsden describes."},{"id":"s2q001","s":2,"o":8,"t":"L","sc":"whyschool","q":"What did lecture point out about ==formal schooling for all== children?","a":[["It is a [[relatively new]] institution in history","Yes: ‘Formal schooling for all is a relatively new institution!’"],["It has existed in [[every society]] throughout history","It hasn’t. Universal schooling is recent."],["It began mainly to give children [[time to play]]","Not one of the reasons given."],["It was designed around adolescents’ [[sleep cycles]]","If only! Early start times actually clash with teen sleep."],["It first appeared to provide [[childcare]] for parents","Not one of lecture’s four historical forces."]],"k":"Formal schooling for everyone is historically recent.","h":"For most of human history, most kids never set foot in a school."},{"id":"s2q002","s":2,"o":8,"t":"L","sc":"whyschool","q":"Which set lists the historical forces lecture gave for ==why children go to school==?","a":[["[[Industrialization]], [[national identity]], [[religion]], [[colonization]]","Yes, these were the four on the slide."],["[[Play]], [[friendship]], [[childcare]], and physical [[fitness]]","Nice outcomes of school, but not the historical forces from lecture."],["[[Agriculture]], long [[summer]] breaks, [[harvest]] time, and family [[farms]]","Agriculture explains the school YEAR calendar, not why schooling exists."],["[[Mastery]] goals, [[performance]] goals, ability [[tracking]], and [[testing]]","These are features of schools, not reasons they were created."],["[[Science]], [[technology]], [[engineering]], and [[maths]]","STEM is curriculum, not a historical driver from lecture."]],"k":"Why school? Industrialization · national identity/assimilation · religious education · colonization.","h":"I-N-R-C: ‘It’s Not Really Choice.’ School wasn’t invented because kids asked for it."},{"id":"s2q003","s":2,"o":8,"t":"L","sc":"whyschool","q":"A new government makes school compulsory so that all children learn one official language and a shared set of loyalties. Which historical purpose of schooling is this?","a":[["[[National identity]] and assimilation","Yes. Schooling as a tool to build a common identity (and absorb minority groups into it)."],["[[Industrialization]] and factory work","That would be about preparing workers for factories and keeping children out of the labour force."],["[[Religious]] education and values","That would be about teaching a faith."],["[[Mastery]] goal orientation","That’s a motivation concept, not a historical purpose."],["[[Stage–environment]] fit","That’s about matching schools to adolescents’ needs."]],"k":"National identity/assimilation: schools as a way to make ‘one people’."},{"id":"s2q004","s":2,"o":8,"t":"L","sc":"nested","q":"Lecture organized influences on schooling as nested levels. Which order goes from the ==innermost to the outermost== level?","a":[["[[Student]] → classroom → school → school organization → [[culture]]","Yes, that’s the nested model from the slides."],["[[Community]] → school organization → school → classroom → [[student]]","That’s the reverse order (outermost first)."],["[[Student]] → school → classroom → culture → [[school organization]]","Classroom sits inside school, and culture is the outermost ring."],["[[Classroom]] → student → school organization → school → [[country]]","The student is at the centre, and school comes before school organization."],["[[Student]] → family → peers → media → [[government]]","That’s a general ecological model, not lecture’s schooling levels."]],"k":"Levels: student → classroom → school → school organization → community/country/culture.","h":"Like castle walls: the student in the keep, then ring after ring outward."},{"id":"s2q005","s":2,"o":8,"t":"L","sc":"nested","q":"In lecture’s nested model, ==teachers’ expectations== and the ==academic work== students are given belong to which level?","a":[["The [[classroom]]","Yes. Teachers and academic work were the classroom-level features."],["The [[student]]","The student is the centre; teachers and tasks surround the student."],["The [[school organization]]","That level covers things like school size, grade structure and start times."],["The [[community, country and culture]]","That’s the outermost level: broad values and systems."],["The [[family]]","Family wasn’t one of the levels in this schooling model."]],"k":"Classroom level: teachers (quality, relationships, expectations) + academic work."},{"id":"s2q006","s":2,"o":9,"t":"L","sc":"teacher","q":"Which three ==teacher factors== did lecture highlight as shaping student outcomes?","a":[["[[Quality]], [[relationships]], and [[expectations]]","Yes, those were the three bullets under ‘Teachers’."],["[[Age]], [[gender]], and years until [[retirement]]","Not the factors lecture named."],["[[Salary]], [[class size]], and number of [[prep periods]]","Not on the slide."],["[[Strictness]], [[homework]] load, and [[grading]] speed","Not on the slide."],["[[Popularity]], [[humour]], and social media [[presence]]","Not on the slide."]],"k":"Teachers matter through: (1) qualifications and quality, (2) teacher–student relationships, (3) expectations for students.","h":"Q-R-E: Quality, Relationships, Expectations."},{"id":"s2q007","s":2,"o":9,"t":"L","sc":"pygmalion","q":"What is the ==Pygmalion effect==?","a":[["Teachers’ [[expectations]] for students shape how students actually [[perform]]","Yes. Expect more, and students tend to rise; expect less, and they tend to sink."],["Students’ [[expectations]] for teachers shape how teachers actually [[teach]]","Reversed direction."],["Students [[perform better]] when [[observed]] by researchers","That’s more like a Hawthorne effect."],["Students [[choose easier]] tasks when a [[prize]] is offered","That’s the Rule et al. play finding."],["Teachers [[rate]] students higher when they [[like]] them","That’s a halo effect in ratings; Pygmalion is about real changes in performance."]],"k":"Pygmalion effect = a self-fulfilling prophecy: teacher expectations → student outcomes.","h":"Treat a kid like a star and they start to shine. Treat them like a problem and… yeah."},{"id":"s2q008","s":2,"o":9,"t":"L","sc":"pygmalion","q":"In Rosenthal & Jacobson (1968), what were teachers told about the students labelled ==\"bloomers\"==?","a":[["That they would soon show [[intellectual growth]]","Yes. Teachers were led to expect these students would ‘bloom’."],["That they had [[learning disabilities]] needing support","The label raised expectations, not lowered them."],["That they were [[randomly chosen]] for the study","That was the truth, but teachers were NOT told it."],["That they came from [[wealthier]] families","Nothing about family background was said."],["That they would be [[tested]] more often than others","The manipulation was the expectation of growth."]],"k":"Rosenthal & Jacobson (1968): teachers told some students were ‘bloomers’ (expected to blossom intellectually)."},{"id":"s2q009","s":2,"o":9,"t":"L","sc":"pygmalion","q":"In reality, how were the \"bloomers\" in Rosenthal & Jacobson (1968) ==chosen==?","a":[["By [[random]] selection","Yes. They were no different from classmates; only the teachers’ expectations differed. That’s what makes it an experiment."],["By highest [[IQ scores]]","If so, later gains could just reflect real ability."],["By [[teacher nomination]]","Then the teachers’ prior opinions would be a confound."],["By [[parents’]] education","Not how they were chosen."],["By [[classroom behaviour]]","Not how they were chosen."]],"k":"Bloomers were picked at random → experimental group vs control group → expectations were the only difference.","h":"Random label, real results. The ONLY thing that changed was what was in the teacher’s head."},{"id":"s2q010","s":2,"o":9,"t":"L","sc":"pygmalion","q":"What was the key ==result== of Rosenthal & Jacobson (1968)?","a":[["The [[\"bloomers\"]] showed greater [[gains]] than controls","Yes. Students whom teachers expected to bloom really did gain more."],["The [[control]] students showed greater [[gains]] than bloomers","It went the other way."],["[[Both]] groups gained equally, so expectations [[didn’t matter]]","Expectations did matter; that’s the Pygmalion effect."],["The bloomers were [[liked]] more but performed the [[same]]","Their measured performance changed, not just liking."],["The bloomers gained only when [[parents]] were told too","Only teachers were given the expectation."]],"k":"Result: randomly labelled ‘bloomers’ showed larger gains → expectations can become reality."},{"id":"s2q011","s":2,"o":9,"t":"L","sc":"pygmalion","q":"Lecture said the Pygmalion effect has implications for ==biases==. What is the worry?","a":[["Expectations biased by [[race, gender or SES]] shape outcomes","Yes. If teachers expect less from some groups, those lower expectations can become real performance gaps."],["Students could [[fake]] being bloomers to get better [[grades]]","Not the implication raised."],["Teachers could become [[too friendly]] with certain [[students]]","Not the concern."],["Parents could [[demand]] that their child be called a [[bloomer]]","Not from lecture."],["Schools could [[rank]] teachers by how many students [[bloom]]","Not from lecture."]],"k":"If expectations move outcomes, then BIASED expectations (race, gender, SES, language…) can create unfair gaps.","h":"This is the dark side of Pygmalion: low expectations are a self-fulfilling prophecy too."},{"id":"s2q012","s":2,"o":9,"t":"L","sc":"pygmalion","q":"Mr. Ito assumes that Sami, who is still learning English, ‘isn’t a strong student.’ He calls on Sami less and gives him easier work. By June, Sami’s grades have dropped. Which concept explains this best?","a":[["The [[Pygmalion effect]]","Yes. A teacher’s (biased) low expectation changed how he taught, which changed the student’s performance."],["[[Ability tracking]]","Tracking is formally separating students into different classes by ability."],["[[Performance goals]]","That’s about a student’s motivation to outdo others."],["[[Stage–environment fit]]","That’s about mismatch between adolescents’ needs and school environments."],["[[Self-distancing]]","That’s the Batman effect mechanism from the play unit."]],"k":"Low expectations → less challenge and attention → lower achievement. Pygmalion in reverse."},{"id":"s2q013","s":2,"o":9,"t":"L","sc":"pygmalion","q":"Why can Rosenthal & Jacobson (1968) support a ==causal== claim about teacher expectations?","a":[["Students were [[randomly assigned]] the label","Yes. Random assignment means the groups were equal at the start, so differences come from the expectation."],["Teachers [[chose]] which students they believed in","That would make it correlational and confounded."],["The study followed students for [[many years]]","Length alone doesn’t give causality."],["The sample included [[thousands]] of schools","Size alone doesn’t give causality."],["Students [[reported]] how they felt about teachers","Self-reports don’t establish cause."]],"k":"Random assignment = experiment = causal inference."},{"id":"s2q014","s":2,"o":9,"t":"L","sc":"teacher","q":"The ____ effect describes how teachers’ expectations can shape students’ actual performance.","a":[["[[Pygmalion]]","Yes, named after the sculptor whose belief brought his statue to life."],["[[Batman]]","That’s children persevering more when pretending to be a character."],["[[Displacement]]","That’s screen time pushing out play."],["[[Buffering]]","That’s nature softening the impact of stress."],["[[Tracking]]","That’s sorting students into classes by ability."]],"k":"Pygmalion effect = expectation effect.","b":1},{"id":"s2q015","s":2,"o":10,"t":"L","sc":"curriculum","q":"How did lecture define ==academic work==?","a":[["[[What is taught]] and what students [[learn and do]]","Yes: ‘What is being taught in the classroom, what the student is being asked to learn and do.’"],["The [[number of hours]] students spend on [[homework]]","It’s about the content and tasks, not hours."],["The [[grades]] a student earns across [[subjects]]","Grades are an outcome, not the work itself."],["The [[job]] teachers do when [[planning]] lessons","It’s about students’ tasks."],["The [[rules]] for behaviour inside the [[classroom]]","That’s classroom management, not academic work."]],"k":"Academic work = the curriculum and tasks: what’s taught, what students are asked to learn and do."},{"id":"s2q016","s":2,"o":10,"t":"L","sc":"curriculum","q":"According to lecture, students benefit when the curriculum is…","a":[["[[interesting]], [[meaningful]], at the [[right level]]","Yes, those three."],["[[difficult]], [[fast-paced]], and focused on [[ranking]]","Appropriate level, not maximum difficulty; and ranking is performance-goal territory."],["[[easy]], [[repetitive]], and the [[same]] for everyone","Too easy isn’t ‘appropriate’, and one-size-fits-all isn’t the point."],["[[traditional]], [[basic]], and limited to the [[three Rs]]","Lecture talked about going BEYOND the basics."],["[[test-based]], [[timed]], and [[competitive]]","Not what lecture recommended."]],"k":"Good academic work: interesting · meaningful · appropriate level (+ considers global-social realities and represents diverse experiences).","h":"The Goldilocks rule: not too easy, not too hard, and actually worth caring about."},{"id":"s2q017","s":2,"o":10,"t":"L","sc":"curriculum","q":"Beyond being interesting and well-pitched, what else did lecture say academic work should consider?","a":[["[[Global-social realities]] and representing [[diverse experiences]]","Yes: ‘Consideration of global-social realities, representing diverse experiences.’"],["Students’ [[class rank]] and public [[recognition]] of top grades","Those are performance-goal practices."],["Parents’ [[preferences]] for more [[homework]]","Not mentioned."],["Teachers’ [[seniority]] and years of [[service]]","Not about academic work."],["The [[agricultural]] calendar and [[summer]] break","That’s about the school year, not curriculum content."]],"k":"Curriculum should connect to the real world and represent diverse experiences.","h":"This links to Leer et al.: curricula that try to be ‘race neutral’ tend to centre White narratives."},{"id":"s2q018","s":2,"o":10,"t":"L","sc":"curriculum","q":"A Grade 5 class is given worksheets far below their level, on topics unrelated to their lives. Which lecture principle about academic work is being ignored?","a":[["Work should be [[meaningful]] and at an [[appropriate level]]","Yes. Too-easy, irrelevant tasks fail both."],["Work should emphasize [[relative ability]] among students","That’s performance-goal language, not a recommendation."],["Work should be completed [[individually]] and in [[silence]]","Lecture favoured active, interactive learning."],["Work should avoid [[social-emotional]] topics","Lecture supported going beyond the basics to SEL."],["Work should be [[identical]] across all classrooms","Not a principle from lecture."]],"k":"Interesting, meaningful, appropriate level."},{"id":"s2q019","s":2,"o":10,"t":"L","sc":"pillars5","q":"Lecture said academic work is ‘not just ==what== is being taught, but…’","a":[["[[how]] it is taught","Yes. That led into active and playful learning."],["[[when]] it is taught","Timing matters for start times, but this slide said ‘how’."],["[[who]] is teaching it","Teachers matter, but the phrase was ‘but how’."],["[[where]] it is taught","Not the phrase."],["[[how much]] is taught","Not the phrase."]],"k":"Not just what, but HOW → active, meaningful, interactive, iterative, joyful."},{"id":"s2q020","s":2,"o":11,"t":"L","sc":"sel","q":"What is ==social-emotional learning (SEL)== as described in lecture?","a":[["Going [[beyond the basics]] of reading and maths","Yes. SEL extends academic work to social and emotional skills."],["Teaching the [[three Rs]] through group [[projects]]","SEL goes beyond the three Rs rather than re-teaching them."],["Grouping students by [[ability]] for social [[fit]]","That’s tracking."],["Rewarding the [[top students]] at school [[assemblies]]","That’s a performance-goal practice."],["Letting children [[choose]] whether to attend [[class]]","Not SEL."]],"k":"SEL = social-emotional learning: curriculum beyond the 3 Rs.","h":"Reading, wRiting, aRithmetic… plus Relationships and feelings."},{"id":"s2q021","s":2,"o":11,"t":"L","sc":"tootle","q":"Which two examples of ==SEL programs== did lecture give?","a":[["[[Positive peer reporting]] (tootling) and [[PATHS]]","Yes, those were the two examples."],["[[Fraction Ball]] and the [[Ghost Number Line]]","Those are playful maths learning, not SEL."],["[[Ability tracking]] and [[Gifted and Talented]] classes","Those sort students by ability."],["[[Honour rolls]] and class [[rankings]]","Those emphasize performance goals."],["[[The CHEQ]] and [[the EDI]]","Those are questionnaires from Ramsden et al."]],"k":"SEL examples: positive peer reporting (tootling) + PATHS."},{"id":"s2q022","s":2,"o":11,"t":"L","sc":"tootle","q":"In ==positive peer reporting (tootling)==, what do students do?","a":[["Report the [[positive]] things [[classmates]] do or say","Yes. ‘Thank you for…’, ‘I like that you…’, ‘You did a good job of…’"],["Report classmates’ [[misbehaviour]] privately to the [[teacher]]","That’s tattling. Tootling is the opposite."],["[[Grade]] each other’s assignments using a [[rubric]]","That’s peer assessment."],["[[Compete]] to earn the most [[praise]] from the teacher","It isn’t a competition."],["[[Tutor]] a younger student in reading once a [[week]]","That’s peer tutoring."]],"k":"Tootling = telling on someone for doing something GOOD.","h":"Tattling: ‘He took my pencil!’ Tootling: ‘He lent me his pencil!’"},{"id":"s2q023","s":2,"o":11,"t":"L","sc":"tootle","q":"Research on positive peer reporting (Collins et al., 2020) shows links with…","a":[["Better [[peer interactions]] and less [[aggression]]","Yes: improved peer interactions, reduced aggression/disruption, and more academic engagement."],["Higher [[IQ]], faster [[reading]], and better [[handwriting]]","Not the outcomes cited."],["More [[competition]], more [[ranking]], and higher [[stress]]","Opposite spirit."],["Less [[sleep]], more [[screen time]], and lower [[fitness]]","Unrelated."],["Better [[attendance]] only, with no [[social]] changes","Social changes were the headline."]],"k":"Tootling → better peer interactions, less aggression/disruption, more academic engagement."},{"id":"s2q024","s":2,"o":11,"t":"L","sc":"sel","q":"SEL programs are often associated with improvements in which outcomes?","a":[["[[Social skills]], [[well-being]], AND [[academics]]","Yes: improved prosocial/social skills, student well-being, AND improved academics."],["[[Social skills]] and [[well-being]], but [[lower]] academics","The surprise is that academics improve too."],["[[Academics]] only, with [[no]] social benefits","Social and emotional benefits are central."],["[[Well-being]] only, with [[no]] change in behaviour","Prosocial behaviour improves as well."],["[[Popularity]] and [[competitiveness]] among peers","Not SEL outcomes."]],"k":"SEL → prosocial/social skills ↑, well-being ↑, AND academics ↑.","h":"The ‘AND’ is the testable part: time spent on feelings didn’t cost grades, it helped them."},{"id":"s2q025","s":2,"o":11,"t":"L","sc":"schonfeldc","q":"Lecture showed data from Schonfeld et al. (2015) on an SEL program. What did the chart show?","a":[["More [[intervention]] students reached [[proficiency]]","Yes. The chart compared % at proficiency (reading and maths) for control vs intervention, and the SEL group did better."],["More [[control]] students reached academic [[proficiency]]","The SEL (intervention) group came out ahead."],["[[No difference]] in academics, but better [[behaviour]]","The whole point of the slide was the academic benefit."],["Better [[maths]] but worse [[reading]] in the SEL group","Both reading and maths were shown as benefiting."],["Gains in [[Grade 4]] that reversed by [[Grade 6]]","The chart didn’t show a reversal."]],"k":"Schonfeld et al. (2015): SEL intervention → higher % proficient in reading and maths (Grades 4–6)."},{"id":"s2q026","s":2,"o":11,"t":"L","sc":"selwhy","q":"Lecture gave three reasons SEL might ==boost academics==. Which set is correct?","a":[["[[Executive function]] skills; [[positive feelings]]; [[belonging]]","Yes: (1) useful skills: executive function, attention; (2) more positive feelings about school and peers; (3) better self-esteem, belonging."],["More [[homework]] time; stricter [[discipline]]; longer school [[days]]","SEL doesn’t work by adding workload or strictness."],["Higher [[teacher pay]]; smaller [[classes]]; newer [[textbooks]]","Not the reasons given."],["More [[competition]]; public [[rankings]]; rewards for top [[grades]]","Those are performance-goal practices."],["Earlier [[start times]]; more [[tests]]; less [[recess]]","None of these."]],"k":"Why SEL helps grades: (1) executive function & attention, (2) positive feelings about school and peers, (3) self-esteem & belonging.","h":"You can’t learn fractions while you’re melting down, hating school, or feeling like you don’t belong."},{"id":"s2q027","s":2,"o":11,"t":"L","sc":"selwhy","q":"After a year of an SEL program, students in one class are better at staying focused and stopping themselves from blurting out. Which of lecture’s explanations for SEL’s academic benefits does this show?","a":[["Useful skills: [[executive function and attention]]","Yes. Focus and impulse control are executive function skills that carry straight over into learning."],["More positive [[feelings about school]] and peers","That would be students liking school and classmates more."],["Better [[self-esteem and belonging]]","That would be students feeling good about themselves and that they fit in."],["Higher teacher [[expectations]] (Pygmalion)","Not one of the three SEL explanations."],["A shift to [[performance goals]]","SEL isn’t about outdoing others."]],"k":"Skill route: SEL trains executive function and attention, which academics need."},{"id":"s2q028","s":2,"o":12,"t":"LR","sc":"pillars5","q":"According to lecture (Hirsh-Pasek et al., 2015), there is more learning when it is…","a":[["[[active]], [[meaningful]], [[interactive]], [[iterative]], and [[joyful]]","Yes, those five."],["[[passive]], [[repetitive]], [[individual]], [[timed]], and [[graded]]","Nearly the opposite of the list."],["[[fast]], [[competitive]], [[ranked]], [[rewarded]], and [[public]]","That’s performance-goal language."],["[[quiet]], [[orderly]], [[teacher-led]], [[scripted]], and [[silent]]","Not the five principles."],["[[digital]], [[self-paced]], [[solitary]], [[brief]], and [[automated]]","Not the five principles."]],"k":"More learning when: Active · Meaningful · Interactive · Iterative · Joyful.","h":"A-M-I-I-J → ‘AM I Into Joy?’ If yes, you’re learning."},{"id":"s2q029","s":2,"o":12,"t":"L","sc":"pillars5","q":"Students in a science class design a paper bridge, test it, see it collapse, redesign it and test again. Which principle of effective learning does the ==test–fail–redesign== cycle show most directly?","a":[["[[Iterative]]","Yes. Iterative = trying, getting feedback, and trying again."],["[[Joyful]]","It may be fun, but the repeating cycle is what the question highlights."],["[[Meaningful]]","Meaningful is about connecting to things students care about or already know."],["[[Passive]]","Passive isn’t one of the principles; it’s the opposite of active."],["[[Interactive]]","Interactive is about learning with others. The stem stresses the repeated cycle."]],"k":"Iterative = repeated attempts with feedback.","h":"Iterate = do it again, but better."},{"id":"s2q030","s":2,"o":12,"t":"L","sc":"pillars5","q":"A teacher reads slides aloud for 50 minutes while students sit silently and copy notes. Which principle of effective learning is most clearly ==missing==?","a":[["[[Active]] engagement","Yes. Students are passive recipients here."],["[[Appropriate]] grade level","We don’t know the level; the problem described is passivity."],["[[Structural]] quality","That’s a childcare quality term from last exam."],["[[Relative]] ability","That’s a kind of achievement goal."],["[[Teacher]] qualifications","Nothing in the stem is about credentials."]],"k":"Active (minds-on, often hands-on) beats passive listening."},{"id":"s2q031","s":2,"o":12,"t":"R","sc":"pillars5","q":"Why do Bustamante et al. (2022) call play ‘an ==ideal context== to foster learning’?","a":[["Children learn well when [[active, engaged]] and [[interacting]]","Yes. Play naturally has those ingredients (citing Hirsh-Pasek et al., 2015)."],["Children learn well when [[rewards]] are given for correct [[answers]]","Not the argument made."],["Children learn well when lessons are [[short]] and [[scripted]]","Not the argument made."],["Children learn well only when they are [[outdoors]] in [[nature]]","The schoolyard was the setting, but the argument is about active, engaged learning."],["Children learn well when [[competition]] is removed [[entirely]]","Fraction Ball actually had teams competing."]],"k":"Play is active, meaningful, engaging and social: exactly the conditions under which children learn best."},{"id":"s2q032","s":2,"o":12,"t":"R","sc":"fball","q":"Per Bustamante et al. (2022), playful learning may be especially motivating for which children?","a":[["Those with [[attention or behaviour]] problems in class","Yes: ‘play increases children’s motivation… particularly for children with attention or behavior problems who often struggle with more traditional classroom settings.’"],["Those who are already the [[strongest]] students in [[maths]]","Teachers worried about this, but the data showed no such moderation."],["Those who [[dislike]] physical activity and [[sports]]","Not what the article says."],["Those in [[Gifted and Talented]] programs","Not mentioned."],["Those who have [[never]] played basketball","Not mentioned."]],"k":"Play boosts motivation, particularly for kids who struggle in sit-still classrooms."},{"id":"s2q033","s":2,"o":12,"t":"L","sc":"fball","q":"How did lecture describe ==Fraction Ball== as an approach to learning?","a":[["[[Embodied]] and [[playful]], using a [[number line]] for maths","Yes: ‘Uses the number line to aid in math learning; embodied and playful.’"],["[[Digital]] and [[adaptive]], using an [[app]] to drill fraction facts","It’s a physical court game, not an app."],["[[Competitive]] and [[ranked]], using [[class standings]] to motivate","Not how lecture framed it."],["[[Scripted]] and [[seated]], using [[worksheets]] to practise","It’s physically active."],["[[Musical]] and [[rhythmic]], using [[songs]] to memorize decimals","No music involved."]],"k":"Fraction Ball: play-based, embodied (whole body), built on the number line.","h":"Embodied = your BODY does the maths. Farther from the basket = bigger number."},{"id":"s2q034","s":2,"o":13,"t":"LR","sc":"fball","q":"What ==problem== motivated Bustamante et al. (2022)?","a":[["Children often [[struggle]] to learn [[fractions and decimals]]","Yes. Rational numbers are notoriously hard and act as a gatekeeper to later maths like algebra."],["Children are getting [[less]] physical activity in [[PE]]","PE was the setting, not the problem being solved."],["Children show [[declining]] motivation after school [[transitions]]","That’s a schooling-organization topic."],["Children with [[dyslexia]] struggle to decode [[words]]","That was last exam’s Peters et al. study."],["Children spend [[too much]] time on [[screens]]","That’s Ramsden et al."]],"k":"Problem: fractions and decimals (rational numbers) are hard, and they gatekeep later maths.","h":"Remember lecture’s ‘What is .4 as a fraction?’ Even adults stall on that."},{"id":"s2q035","s":2,"o":13,"t":"LR","sc":"fball","q":"What is ==Fraction Ball==?","a":[["A [[court]] re-lined so shots are worth [[fractions or decimals]]","Yes. The court’s lines are modified to support rational number learning: arcs mark fraction/decimal point values."],["A [[card game]] in which players match fractions to [[decimals]]","It’s played on a basketball court."],["A [[tablet app]] that turns fraction drills into a [[video game]]","It’s physical, not digital."],["A [[soccer]] drill where goals are counted on a [[number line]]","Basketball, not soccer."],["A [[classroom]] chant for memorizing fraction [[rules]]","Not a chant; it’s a set of court games."]],"k":"Fraction Ball = modified basketball court + games where shot values are fractions/decimals, tallied on a number line."},{"id":"s2q036","s":2,"o":13,"t":"LR","sc":"fdesign","q":"What kind of ==research design== did Bustamante et al. (2022) use?","a":[["An [[experiment]] with [[random assignment]] to game or PE","Yes. Random assignment within classrooms, with pretest and posttest: ‘gold standard’."],["A [[correlational]] survey of how often students [[play basketball]]","Students were assigned to conditions, not surveyed."],["A [[longitudinal]] study tracking maths from Grade 4 to [[Grade 12]]","The intervention lasted weeks, not years."],["A [[case study]] of one teacher’s [[classroom]]","Many classrooms and 160 students in the main experiment."],["A [[natural experiment]] comparing two different [[schools]]","Randomization happened within classrooms at one school."]],"k":"Design: randomized experiment (pretest → Fraction Ball or usual PE → posttest). Strong internal validity.","h":"Random assignment is why THIS reading can say ‘caused’, unlike Ramsden or Leer."},{"id":"s2q037","s":2,"o":13,"t":"R","sc":"fdesign","q":"Who took part in the ==Efficacy Experiment== of Bustamante et al. (2022)?","a":[["[[160]] students in [[Grades 4–6]] at one California school","Yes: 160 fourth–sixth graders at one school in Santa Ana, California."],["[[69]] students in [[Grades 5–6]] at a private academy","69 fifth–sixth graders was the PILOT, and the school served low-income families."],["[[4,968]] kindergarteners across [[British Columbia]]","That’s Ramsden et al."],["[[1,692]] middle schoolers across [[North Carolina]]","That’s Leer et al.’s survey sample."],["[[160]] students in [[Grades 9–12]] from several districts","They were Grades 4–6 at one school."]],"k":"Pilot: 69 students (Grades 5–6). Efficacy: 160 students (Grades 4–6). Predominantly low-income Latino school in California."},{"id":"s2q038","s":2,"o":13,"t":"R","sc":"fdesign","q":"What did the ==control group== do in Bustamante et al. (2022)?","a":[["Kept attending their [[regular PE]] class as usual","Yes. And both groups kept getting their normal maths instruction."],["Did extra fraction [[worksheets]] in the classroom","No extra maths for controls."],["Played Fraction Ball [[without]] the number line","That would be a clever comparison, but it’s a suggestion for future research."],["Used a fraction [[app]] for the same number of minutes","No app condition."],["Received [[no]] maths instruction during the study","Both groups received regular maths instruction."]],"k":"Control = business as usual (normal PE). Both groups still got regular maths lessons.","h":"That’s why Fraction Ball is a SUPPLEMENT to maths class, not a replacement."},{"id":"s2q039","s":2,"o":13,"t":"R","sc":"fresult","q":"In the ==Pilot Experiment== (four games over four PE periods), what improved?","a":[["Only [[converting fractions to decimals]]","Yes. That was the one significant effect; the overall composite barely moved."],["The [[overall]] rational-number composite score","That improved in the Efficacy Experiment, not the pilot."],["[[Number line]] estimation from 0 to 5","No significant effect."],["Fraction [[addition]] under time pressure","No significant effect."],["[[Nothing]] at all, so the game was abandoned","One skill improved, and that promise justified refining the game."]],"k":"Pilot (4 sessions): only fraction → decimal conversion improved."},{"id":"s2q040","s":2,"o":13,"t":"LR","sc":"fresult","q":"What was the main finding of the ==Efficacy Experiment== in Bustamante et al. (2022)?","a":[["Fraction Ball improved [[overall]] scores, especially [[conversions]]","Yes: about 0.4 SD on the composite, with the biggest gains in converting between fractions and decimals."],["Fraction Ball improved [[PE fitness]] but not [[maths]] scores","Maths improved; fitness wasn’t the outcome."],["Fraction Ball improved maths [[only for boys]] who liked basketball","No moderation by gender was found."],["Fraction Ball improved [[far-transfer]] items more than near-transfer","It was the reverse: near-transfer improved, far-transfer didn’t significantly."],["Fraction Ball produced [[no]] differences from the control group","There were significant, moderate-to-large effects."]],"k":"Efficacy (6 sessions): overall composite ↑ (~0.4 SD), near-transfer ↑, conversions between fractions and decimals ↑↑.","h":"Lecture’s summary: improved vs pretest AND vs control, ‘particularly in converting fractions to decimals’."},{"id":"s2q041","s":2,"o":13,"t":"R","sc":"fresult","q":"On which skills did Fraction Ball ==NOT== produce significant gains?","a":[["[[Far-transfer]] items, [[number line]] and [[addition]] tasks","Right. These moved in a positive direction at best, but weren’t significant in either experiment."],["Converting [[fractions to decimals]] in timed and untimed tests","These showed the strongest gains."],["Converting [[decimals to fractions]] in the untimed test","This improved significantly in the Efficacy Experiment."],["[[Near-transfer]] items tied to content on the court","These improved significantly."],["The [[overall]] composite score at posttest","This improved significantly in the Efficacy Experiment."]],"k":"No significant effect: far transfer, number line estimation, fraction/decimal addition.","h":"The court taught what was ON the court. Stuff that wasn’t painted on it didn’t budge much."},{"id":"s2q042","s":2,"o":13,"t":"R","sc":"fresult","q":"What is the difference between ==near-transfer== and ==far-transfer== items in Bustamante et al. (2022)?","a":[["Near = [[shown in the game]]; far = [[not shown]] in it","Yes. E.g., 1/4 or .25 on a number line is near; 5/10 or .80 is far."],["Near = [[timed]] questions; far = [[untimed]] questions","Timing was a separate distinction."],["Near = [[fractions]]; far = [[decimals]]","Both notations appear in both."],["Near = tested [[right away]]; far = tested [[months later]]","There was no delayed posttest (a limitation)."],["Near = [[easy]] items; far = [[hard]] items","It’s about overlap with game content, not difficulty."]],"k":"Near transfer = close to what was practised. Far transfer = new numbers or skills not on the court.","h":"Near = same neighbourhood as the game. Far = a whole different town."},{"id":"s2q043","s":2,"o":13,"t":"R","sc":"fresult","q":"Teachers worried Fraction Ball would mostly help older students, boys, and kids already strong in maths. What did the data show?","a":[["No [[moderation]] by grade, gender, or prior knowledge","Right. Effects were mostly consistent across subgroups."],["Only [[boys]] benefited, confirming the teachers’ worry","No gender moderation was found."],["Only students with [[high]] pretest scores benefited","No moderation by prior knowledge."],["Only [[sixth]] graders benefited from the games","If anything, effects were slightly (non-significantly) smaller for 4th and 6th graders."],["[[Girls]] benefited significantly more than boys","No significant difference by gender."]],"k":"No moderators: Fraction Ball helped across grade, gender and prior knowledge.","h":"Moderator = ‘does it work better for some people?’ Here: nope, pretty even."},{"id":"s2q044","s":2,"o":13,"t":"R","sc":"fball","q":"Which mechanism do Bustamante et al. (2022) suggest best explains the big gains in ==converting== between fractions and decimals?","a":[["Learning from [[comparison]]: formats shown [[side by side]]","Yes. The court and scoreboard present equivalent fractions and decimals together, inviting compare-and-contrast."],["Learning from [[rewards]]: teams earned prizes for [[winning]]","Not the mechanism proposed."],["Learning from [[fitness]]: exercise improved [[attention]] in class","Not the mechanism proposed."],["Learning from [[repetition]]: students memorized [[worksheets]]","There were no worksheets."],["Learning from [[observation]]: students watched [[videos]] of games","No videos."]],"k":"Comparing and contrasting two notations for the SAME magnitude (¼ and .25) highlights that they’re equivalent.","h":"Seeing ¼ and .25 painted on the same arc every single shot… eventually it clicks that they’re twins."},{"id":"s2q045","s":2,"o":13,"t":"R","sc":"fball","q":"On the Fraction Ball court, how are ==shot values== arranged?","a":[["Arcs [[farther]] from the basket are worth [[larger]] fractions/decimals","Yes. The distance from under the basket to the 3-point arc is a ‘0 to 1’ zone, so magnitude grows with distance."],["Arcs [[closer]] to the basket are worth [[larger]] fractions/decimals","Reversed. Like a number line, values increase as you move away."],["All arcs are worth [[one point]], but named with different [[fractions]]","Each arc has its own value."],["Values are assigned [[at random]] before each [[game]]","The layout is deliberately linear."],["Values depend on the [[shooter’s grade]], not where they [[stand]]","Position on the court sets the value."]],"k":"Linear layout: distance from the basket = size of the number. One end in fourths (¼, ½, ¾), the other in thirds (⅓, ⅔).","h":"The court IS a number line you can stand on."},{"id":"s2q046","s":2,"o":13,"t":"R","sc":"fball","q":"Which three ==roles== do children rotate through in Fraction Ball?","a":[["[[Shooter]], [[rebounder]], and [[counter]]","Yes. The shooter shoots, the rebounder calls out the shot’s value, and the counter moves along the number line to tally the score."],["[[Captain]], [[referee]], and [[timekeeper]]","Not the roles."],["[[Passer]], [[defender]], and [[goalie]]","Not the roles."],["[[Teacher]], [[student]], and [[observer]]","Not the roles."],["[[Scorer]], [[coach]], and [[announcer]]","Not the roles."]],"k":"Roles: shooter · rebounder (calls the value) · counter (walks the number-line scoreboard)."},{"id":"s2q047","s":2,"o":13,"t":"R","sc":"ghost","q":"Between the Pilot and Efficacy experiments, the researchers revised Fraction Ball. Which change was made?","a":[["Students had to [[say the maths aloud]] on the number line","Yes (e.g., ‘one fourth plus three fourths equals one whole’). They also added debriefs and new components like the Ghost Number Line."],["Students were given [[prizes]] for each basket they scored","No prizes were added."],["The number line was [[removed]] so the game moved faster","The number line stayed; a Ghost Number Line was ADDED."],["The control group was [[switched]] to a classroom maths game","Controls still did regular PE."],["Sessions were [[shortened]] from six periods to four","Dosage went UP: from four sessions to six."]],"k":"Revisions: (1) state the problem aloud, (2) debriefing after rounds, (3) new components (Ghost Number Line, Supercharge Points, ‘Who goes first?’) + more sessions.","h":"Teachers noticed kids silently walking the line. Talking makes thinking visible."},{"id":"s2q048","s":2,"o":13,"t":"R","sc":"ghost","q":"What is the ==Ghost Number Line== in Fraction Ball?","a":[["A chalk line from [[0 to 5]] with [[no marks]] between","Yes. Students must estimate where their score falls without hash marks, and the most ACCURATE team wins."],["A number line that [[disappears]] when a team [[misses]]","Not how it works."],["A scoreboard only the [[teacher]] is allowed to [[see]]","Students use it themselves."],["A line showing [[negative]] numbers below [[zero]]","It runs from 0 to 5."],["A [[digital]] projection of the court’s [[arcs]]","It’s drawn in chalk."]],"k":"Ghost Number Line: 0 —— 5, no ticks. Added to target number line estimation.","h":"‘Ghost’ because the tick marks are invisible. You have to picture them."},{"id":"s2q049","s":2,"o":13,"t":"R","sc":"numline","q":"Bustamante et al. (2022) describe ==whole number bias==. Which error shows it?","a":[["Thinking [[.274]] is larger than [[.83]] because 274 > 83","Yes. Kids over-apply whole-number rules to fractions and decimals. Most 5th and 6th graders made this choice."],["Thinking [[1/2]] equals [[.5]] because both are ‘half’","That’s correct, not an error."],["Thinking [[3/4]] is larger than [[1/4]] because 3 is larger than 1","That’s correct reasoning for same denominators."],["Thinking fractions [[can’t]] be placed on a number [[line]]","That’s a different misconception."],["Thinking decimals are [[always]] smaller than [[one]]","Not the whole number bias example."]],"k":"Whole number bias = treating parts of fractions/decimals like whole numbers (e.g., .274 > .83, or a/8 > a/5).","h":"‘More digits = bigger’ works for 274 vs 83. It betrays you for .274 vs .83."},{"id":"s2q050","s":2,"o":13,"t":"R","sc":"numline","q":"Why does Fraction Ball use a ==linear== number line rather than, say, a circular layout?","a":[["[[Linear]] number games help; [[circular]] ones did not","Yes. Prior work (Siegler & Ramani) found linear board games improved numerical understanding but circular ones didn’t."],["A circular layout would not [[fit]] on a basketball [[court]]","The reason given is about learning, not space."],["Linear layouts are [[cheaper]] to paint than circular ones","Cost isn’t the reason."],["Children [[prefer]] straight lines to curved [[lines]]","Preference isn’t the reason."],["Circular layouts cause [[whole number bias]]","Not claimed."]],"k":"The mental number line is foundational (integrated theory of numerical development). Linearity seems to be the key ingredient."},{"id":"s2q051","s":2,"o":13,"t":"R","sc":"fdesign","q":"Which is a ==limitation== Bustamante et al. (2022) acknowledge?","a":[["Results may not [[generalize]] to other [[populations]]","Yes: one school, one age range, with teachers facilitating. External validity is limited."],["Students were [[not randomly]] assigned in the main experiment","They were randomized within classrooms."],["There was [[no control]] group for comparison","There was a business-as-usual PE control."],["There was [[no pretest]], so groups may have differed","There was a pretest, and groups didn’t differ."],["The sample included [[only girls]]","Both boys and girls took part."]],"k":"Limitations: limited external validity · a supplement, not a substitute for maths instruction · components not isolated · no delayed posttest · no far transfer."},{"id":"s2q052","s":2,"o":13,"t":"R","sc":"fdesign","q":"Why do the authors say Fraction Ball should be viewed as a ==supplement==, not a substitute, for maths instruction?","a":[["Both groups still received [[regular maths]] class","Yes. Fraction Ball replaced PE, not maths, so the study can’t say it works INSTEAD of maths class."],["The games [[lowered]] scores on fraction addition","The timed-addition effect was slightly negative but not significant; that’s not the reason given."],["Teachers [[refused]] to use it during maths time","Teachers were enthusiastic partners."],["Students [[disliked]] the games after the first week","Students were enthusiastic and asked to play again."],["The court can only be used in [[summer]] months","Not mentioned."]],"k":"It was tested on TOP of normal maths, so that’s all we can claim."},{"id":"s2q053","s":2,"o":13,"t":"R","sc":"fball","q":"Which feature of Fraction Ball do the authors stress for ==real-world use==?","a":[["It is [[low-cost]] and [[scalable]], needing only chalk or paint","Yes, and the materials are freely available."],["It requires [[specialized]] equipment and trained [[coaches]]","It needs an ordinary court and chalk or paint."],["It works only with [[small groups]] of two or three students","Sessions ran with 16 students."],["It must be run by [[researchers]], not classroom teachers","Teachers ran the sessions."],["It needs a [[tablet]] for every participating student","No devices needed."]],"k":"Low-cost, scalable, free materials; could even work in public parks."},{"id":"s2q054","s":2,"o":13,"t":"R","sc":"fdesign","q":"How were teachers involved in Bustamante et al. (2022)?","a":[["As [[co-designers]] of the court, script and [[revisions]]","Yes. Teachers co-designed the court and games and their feedback drove the iterative improvements."],["As [[blind raters]] who did not know the study’s [[purpose]]","They were active partners."],["As the [[control group]] who played against the students","Not their role."],["They were [[excluded]] so results reflected the game alone","Teachers ran the sessions."],["As [[observers]] who recorded fidelity with stopwatches","Research assistants did the fidelity observations."]],"k":"A model of researcher–educator partnership and iterative design (pilot → feedback → improved version)."},{"id":"s2q055","s":2,"o":13,"t":"LR","sc":"fball","q":"In lecture’s in-class version of Fraction Ball, the goal was to ‘get to 3.75 points WITHOUT going over.’ Which skill does that rule most directly exercise?","a":[["[[Adding]] fractions and decimals for a running [[total]]","Yes. To hit an exact target you must keep adding shot values and think about what’s still needed."],["[[Memorizing]] multiplication tables under time [[pressure]]","No multiplication involved."],["[[Estimating]] the height of the basket in [[metres]]","Not the skill."],["[[Ranking]] classmates by how many baskets they [[score]]","The game isn’t about ranking people."],["[[Reading]] word problems aloud to a [[partner]]","Not the skill."]],"k":"Racing to an exact number (without overshooting) forces fraction/decimal arithmetic in your head.","h":"It’s like blackjack, but with quarters and thirds."},{"id":"s3q001","s":3,"o":14,"t":"L","sc":"goals","q":"What is the focus of ==mastery goals==?","a":[["Developing [[competence]], understanding and [[improvement]]","Yes, that’s lecture’s definition."],["Being [[superior]] to classmates and [[besting]] others","That’s performance (relative ability) goals."],["Avoiding looking [[poor]] compared with other [[students]]","That’s the avoidance side of performance goals."],["Earning [[rewards]] and public [[recognition]] for top marks","That’s performance-oriented."],["Finishing work as [[fast]] as possible to gain free [[time]]","Not an achievement goal from lecture."]],"k":"Mastery goals: ‘I want to actually GET this.’ Focus = competence, learning, understanding, improvement.","h":"Mastery = competing with yesterday’s you."},{"id":"s3q002","s":3,"o":14,"t":"L","sc":"goals","q":"What is the focus of ==performance (relative ability) goals==?","a":[["Being [[superior]] or not looking [[poor by comparison]]","Yes. It’s all about how you stack up against others."],["Building [[understanding]] and improving on your own [[past work]]","That’s mastery goals."],["Performing [[tasks]] well for their own [[enjoyment]]","That’s closer to intrinsic motivation/mastery."],["Meeting the [[minimum]] needed to pass the [[course]]","Not the definition."],["Helping [[classmates]] understand difficult [[material]]","Not the definition."]],"k":"Performance goals = relative ability goals: looking better than (or not worse than) others.","h":"Performance = competing with the person beside you."},{"id":"s3q003","s":3,"o":14,"t":"L","sc":"goals","q":"Three students explain why they study. Ava: ‘I want to really understand how this works.’ Ben: ‘I want the top mark in the class.’ Cam: ‘I just don’t want to look dumb next to everyone.’ Who holds ==performance goals==?","a":[["[[Ben and Cam]]","Yes. Wanting to beat others (Ben) AND wanting to avoid looking worse than others (Cam) are both performance goals."],["[[Ben]] only","Cam’s goal is also about comparison with others, so it’s a performance goal too."],["[[Ava]] only","Ava wants understanding, which is a mastery goal."],["[[Ava
