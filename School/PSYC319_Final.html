]], from about 9 to 7 hours","Reversed. This group went slightly up (7.4 → 8.9)."],["[[All groups]] dropped by the same amount","The drops were very different by age."],["Ages [[9–12]], from about 15 to 11 hours","Those numbers belong to ages 6–8."]],"k":"Weekly play hours 1981 → 1997: ages 3–5: 26 → 17.3 · 6–8: 15 → 11.2 · 9–12: 7.4 → 8.9 · all: 14.5 → 12.2."},{"id":"s1q143","s":1,"o":2,"t":"L","sc":"declinec","q":"Lecture’s second ‘decline of play’ chart (Mullan, 2019) compared 1975 with 2015. Besides outdoor play, what else had fallen?","a":[["[[Socializing]] out of home, by about 14%","Yes. Outdoor play fell about 29% and socializing out of the home about 14%."],["[[Screen]] time, by about 14%","Screens didn’t fall over those decades."],["[[Homework]] time, by about 29%","Homework wasn’t the second bar."],["[[Sleep]], by about 14%","Sleep wasn’t on the chart."],["[[Reading]] for pleasure at home, by about 29%","Reading wasn’t on the chart."]],"k":"1975 → 2015: outdoor play about −29%, socializing outside the home about −14%."},{"id":"s1q144","s":1,"o":3,"t":"L","sc":"pretend","q":"Lecture said young children can and do tell real from pretend. What do they understand about real vs. imagined things?","a":[["Their [[behaviour and sensory properties]]","Yes. The slide’s sub-bullet: they understand behaviour and sensory properties (a real cookie can be seen, touched and eaten; an imagined one can’t)."],["Their [[names and spellings]]","Not what the slide said."],["Their [[moral and legal status]]","Not what the slide said."],["Their [[cost and value]]","Not what the slide said."],["Their [[cultural and historical background]]","Not what the slide said."]],"k":"Young children distinguish real from pretend: they understand behaviour and sensory properties. BUT they often still believe in fantasy entities."},{"id":"s1q145","s":1,"o":3,"t":"L","sc":"culture","q":"Pretend play is ‘thought to be universal’. Does that mean children everywhere pretend the ==same amount==?","a":[["No. It’s seen across cultures, but [[amounts vary]]","Yes. Universal = it shows up everywhere. The slide then listed cultural differences, including that amounts of pretend play vary."],["Yes. Universal means [[equal amounts]] in every culture","Universal means it’s seen across cultures and families, not that it’s identical."],["No. It’s only seen in [[wealthy]] countries","Lecture said it’s seen across cultures."],["Yes, once you control for [[family size]]","Nothing like that was said."],["No. It’s [[absent]] where parents discourage it","Parent attitudes shape it, but lecture didn’t say it disappears."]],"k":"Universal, BUT: content reflects community values and traditions · amounts vary · shaped by parent attitudes and eliciting."},{"id":"s1q146","s":1,"o":3,"t":"L","sc":"pretend","q":"Which of these was ==NOT== on lecture’s list of things associated with pretend play?","a":[["Better [[gross motor]] skills","Right. Gross motor skills were on the outdoor play slide, not the pretend play one."],["Improved [[perspective taking]]","On the pretend play list."],["Greater [[language]] skills","On the pretend play list."],["Better [[perseverance]]","On the list, alongside self-control and emotion regulation."],["Greater [[social competence]]","On the pretend play list."]],"k":"Pretend play is associated with: self-control, emotion regulation, perseverance · perspective taking · language · cognitive capabilities · social competence."},{"id":"s1q147","s":1,"o":3,"t":"L","sc":"batman","q":"In the Batman effect studies, what exactly were the children asked to do?","a":[["Dress as a character and [[reflect on a hard task as them]]","Yes. They got props, became the character, and thought about the task from that character’s view."],["Watch a short superhero [[video]] right before starting the hard task","They didn’t just watch. They took on the character themselves."],["Earn a superhero [[costume]] by finishing the task","The costume wasn’t a reward. It came first."],["Teach the task to a [[younger child]] in costume","There was no teaching step."],["Pick which [[classmate]] would play the hero","Each child took on the character."]],"k":"Batman effect: props + think about the hard task AS the character → more perseverance, better emotion regulation (White et al., 2017; Grenell et al., 2019).","h":"Step out of your own shoes and into Batman’s."},{"id":"s1q148","s":1,"o":3,"t":"L","sc":"sociodrama","q":"Lecture said pretend play ‘begins with simple pretend’. Which is the best example of ==simple pretend==?","a":[["A toddler lifts an empty cup and ‘drinks’","Yes. One child, one as-if action. That’s simple pretend, where it all starts."],["Three kids act out a restaurant with a chef and waiter","Shared roles and a storyline make this sociodramatic play, the later form."],["A child stacks blocks to see how tall they go","That’s exploring objects, with no make-believe."],["Two kids race each other across the field","Physical play, with no as-if element."],["A child follows the rules of a card game","That’s a game, not pretending."]],"k":"Simple pretend (one as-if act) → sociodramatic play (shared roles and stories)."},{"id":"s1q149","s":1,"o":3,"t":"L","sc":"corr","q":"Beside the pretend play outcomes, lecture posed three questions. Which set is correct?","a":[["Is it necessary? Does it cause them? Or just correlated?","Yes. ‘Is pretend play necessary to develop these skills? Does it cause these skills? Or is it just correlated with these skills?’"],["Is it universal? Is it learned from parents? Or is it innate?","Universality came up on the culture slide, not here."],["Is it safe? Is it supervised? Or is it risky?","Those are risky play concerns."],["Is it social? Is it solitary? Or is it parallel?","Those are stages of play."],["Is it declining? Is it rising? Or is it stable?","The decline of play was a different slide."]],"k":"Open questions: necessary? causal? or just correlated? The slide says ‘associations with…’ for a reason."},{"id":"s1q150","s":1,"o":4,"t":"L","sc":"risk6","q":"Nine-year-old Bo rides his bike as fast as he can down a steep hill. Which of lecture’s six kinds of risky play is this?","a":[["Play at [[high speeds]]","Yes. The thrill here comes from going fast."],["Play with [[heights]]","He’s on a hill, but he isn’t climbing up high. The risk is the speed."],["[[Rough and tumble]] play","That’s wrestling and play fighting with someone."],["Play near [[elements]]","Elements means things like fire or water."],["Play with a chance of [[getting lost]]","He knows exactly where he is."]],"k":"Six kinds: heights · high speeds · tools · near elements · chance of getting lost · rough and tumble."},{"id":"s1q151","s":1,"o":4,"t":"L","sc":"risk6","q":"Eight-year-old Mira whittles a stick with a pocketknife, then hammers nails into a board. Which kind of risky play is this?","a":[["Play with [[tools]]","Yes. Knives, hammers and saws are the classic examples."],["Play near [[elements]]","Elements are things like fire and water, not tools."],["Play with [[heights]]","Nothing here is high up."],["Play at [[high speeds]]","Nothing here is fast."],["[[Rough and tumble]] play","There’s no play fighting."]],"k":"Play with tools: knives, hammers, saws and the like."},{"id":"s1q152","s":1,"o":4,"t":"L","sc":"risk6","q":"One of lecture’s iClicker examples read: ‘my brother and i were playing WWE and he smacked me down the bed and i broke a tooth.’ Which kind of risky play fits best?","a":[["[[Rough and tumble]] play","Best fit: play wrestling is the textbook case. (The slide asked the question without printing the answer.)"],["Play with [[heights]]","Falling off a bed is a short drop, but the activity itself was play wrestling."],["Play at [[high speeds]]","Speed wasn’t the thrill here."],["Play with [[tools]]","No tools involved."],["Play with a chance of [[getting lost]]","They were in the bedroom the whole time."]],"k":"Play fighting and wrestling = rough and tumble play.","h":"WWE in the bedroom is rough and tumble, tooth or no tooth."},{"id":"s1q153","s":1,"o":4,"t":"L","sc":"risk6","q":"Which of these is ==NOT== one of the six kinds of risky play shown in lecture?","a":[["Play with [[animals]]","Right, that wasn’t one of the six."],["Play with [[tools]]","One of the six."],["Play near [[elements]]","One of the six."],["[[Rough and tumble]] play","One of the six."],["Play with a chance of [[getting lost]]","One of the six."]],"k":"Six kinds: heights · high speeds · tools · near elements · chance of getting lost · rough and tumble."},{"id":"s1q154","s":1,"o":4,"t":"L","sc":"risk6","q":"Lecture’s six kinds of risky play: with heights, at high speeds, with tools, near elements, rough and tumble, and play with a chance of ____.","a":[["[[getting lost]]","Yes. For example, exploring where no adult can see you."],["[[getting dirty]]","Mud is nature play material, not a risky play category."],["[[getting caught]]","Not one of the six."],["[[losing the game]]","Losing a game isn’t a physical risk."],["[[breaking rules]]","Not one of the six."]],"k":"Play with a chance of getting lost.","b":1},{"id":"s1q155","s":1,"o":4,"t":"L","sc":"types","q":"Rough-and-tumble play showed up ==twice== in the play lectures. Where?","a":[["As the example of physical play, and as a kind of risky play","Yes. ‘Physical play (rough-and-tumble play)' on the types list, and ‘rough and tumble play’ among the six kinds of risky play."],["As a stage in the play table, and as a kind of nature play","It isn’t a stage, and it isn’t nature play."],["As a form of pretend play, and as a game","Lecture didn’t file it under either."],["As a kind of guided play, and as a form of outdoor/nature play","Lecture didn’t file it under either."],["As a non-social stage, and as a social stage","The stages table doesn’t include it."]],"k":"Rough and tumble: the example of physical play AND one of the six kinds of risky play."},{"id":"s1q156","s":1,"o":4,"t":"L","sc":"riskwhy","q":"Max’s parents let him decide for himself how high to climb. He’s proud that it was his own call. Which of lecture’s three explanations for risky play’s benefits is this?","a":[["It satisfies the need for [[autonomy]]","Yes. Risky play lets kids make their own decisions about their own bodies."],["It reduces [[fear and anxiety]]","That one is about nerves fading with exposure. This story is about choosing for himself."],["It brings positive emotions from [[mastery]]","Mastery is the joy of finally managing something hard. Here the focus is on having the choice."],["It builds [[symbolic thought]]","That belongs to pretend play."],["It buffers [[stressful life events]]","That’s the nature finding from Wells & Evans."]],"k":"Three possible reasons: helps reduce fear/anxiety · satisfies need for autonomy · positive emotions from mastery."},{"id":"s1q157","s":1,"o":4,"t":"L","sc":"riskwhy","q":"After weeks of trying, Ivy finally makes it all the way across the monkey bars and beams with pride. Which of lecture’s three explanations does this show?","a":[["Positive emotions from [[mastery]]","Yes. The good feeling comes from conquering something that was hard."],["Satisfying the need for [[autonomy]]","Autonomy is about making your own choices. This story is about succeeding."],["Helping to reduce [[fear and anxiety]]","Nothing says she was afraid. The point is the pride of doing it."],["Better [[social competence]]","That’s an outcome linked with risky play, not one of the three explanations."],["More [[physical activity]]","Also an outcome, not one of the three explanations."]],"k":"Mastery: ‘I did the hard thing’ feels great.","h":"Fear shrinks, choice grows, pride shows."},{"id":"s1q158","s":1,"o":4,"t":"L","sc":"risky","q":"Which of these was ==NOT== on lecture’s slide of outcomes linked with risky play?","a":[["Higher [[academic achievement]]","Right, grades weren’t on the slide."],["More [[physical activity]] and abilities","On the slide (correlated)."],["Better [[social competence]]","On the slide (correlated)."],["Better ability to [[assess risk]]","On the slide, and it may reduce injuries long-term."],["Better [[self-esteem]] and mental health","On the slide, with the Lavrysen et al. (2017) chart."]],"k":"Risky play: more physical activity/abilities · better social competence · better risk assessment (may reduce injuries long-term) · better self-esteem, mental health."},{"id":"s1q159","s":1,"o":4,"t":"L","sc":"risky","q":"Lecture’s heading for this topic was ‘risky/____ play’.","a":[["[[adventurous]]","Yes. The slides were titled risky/adventurous play."],["[[dangerous]]","Lecture’s framing is thrill and challenge, not danger for its own sake."],["[[unsupervised]]","Risky play doesn’t have to be unsupervised."],["[[reckless]]","Not the term used."],["[[extreme]]","Not the term used."]],"k":"Risky play = adventurous play.","b":1},{"id":"s1q160","s":1,"o":5,"t":"L","sc":"outdoor","q":"Which situation best fits lecture’s definition of ==outdoor play==?","a":[["Kids making up their own games in the yard","Yes. Outdoor play = UNSTRUCTURED play that takes place outside."],["A coached soccer practice on the field","It’s outside, but a coach is structuring it."],["A gym class doing laps around the track","Outside, but required and structured."],["A class filling in a worksheet on a nature walk","Outside, but it’s a structured lesson."],["A child reading her homework on the porch","Outside, but it isn’t play."]],"k":"Outdoor play = unstructured play that takes place outside. Both parts matter.","h":"Outside + nobody running the show."},{"id":"s1q161","s":1,"o":5,"t":"L","sc":"outdoor","q":"A child plays with plastic toy cars in a forest clearing. By lecture’s definition, is this ==nature play==?","a":[["Yes, because it occurs in a [[natural environment]]","Right. The definition says and/or: a natural environment, OR natural materials, OR both."],["No, because the toys are [[not natural]] materials at all","The definition is and/or. The natural setting alone is enough."],["No, because nature play needs [[water or mud]]","Those were examples of natural materials, not requirements."],["Yes, but only if an [[adult]] is guiding it","No adult is needed."],["No, because it isn’t [[risky]] enough","Risk isn’t part of the definition."]],"k":"Nature play: occurs in a natural environment AND/OR involves natural elements or materials (water, mud, sticks, leaves, rocks).","h":"Nature place OR nature stuff. Either one counts."},{"id":"s1q162","s":1,"o":5,"t":"L","sc":"outdoor","q":"Lecture linked outdoor/nature play with physical activity and ____ motor skills.","a":[["[[gross]]","Yes. Gross motor = big movements like running, climbing, jumping."],["[[fine]]","Fine motor is small hand movements. The slide said gross motor."],["[[oral]]","Not what the slide said."],["[[visual]]","Not what the slide said."],["[[reflex]]","Not what the slide said."]],"k":"Outdoor/nature play: physical activity, gross motor skills.","b":1},{"id":"s1q163","s":1,"o":5,"t":"L","sc":"outdoor","q":"Lecture said outdoor/nature play is ‘also linked with other forms of play’. Which ones?","a":[["Pretend & dramatic play, and risky play","Yes. Being outside invites make-believe and adventurous play."],["Guided play, object play and games with rules","Not the ones named on the slide."],["Object play and onlooker play","Not the ones named on the slide."],["Solitary play and parallel play","Those are stages, and weren’t named here."],["Digital play and board games","Not the ones named on the slide."]],"k":"Outdoor/nature play is linked with pretend & dramatic play and risky play."},{"id":"s1q164","s":1,"o":5,"t":"L","sc":"greenbuffer","q":"Under ‘benefits of being outside, having access to nature’, which three did lecture list?","a":[["Physical health, mental health, buffer to stress","Yes. The last one had a question mark and the Wells & Evans (2003) chart beside it."],["Physical health, higher IQ, better grades","IQ and grades weren’t listed."],["Mental health, language skills, self-control","Language and self-control are from the pretend play slide."],["Buffer to stress, perspective taking, more creativity","Only the first is from this slide."],["Physical health, social status, more friends","Only the first is from this slide."]],"k":"Access to nature: physical health · mental health · buffer to stress? (Wells & Evans, 2003)."},{"id":"s1q165","s":1,"o":6,"t":"LR","sc":"ramsden","q":"When lecture introduced Ramsden et al. (2026), why did it say the ==start of primary school== matters so much?","a":[["How children begin often sets up later advantages and gaps","Yes. The slide: beginning primary school is a difficult challenge, and how children begin often sets up future advantages and opportunity gaps."],["Children’s play drops to zero once school begins","Not claimed."],["Kindergarten is when screen use first begins","Not claimed. The study asked about screen time before kindergarten."],["Teachers form fixed expectations in the first week","That’s the Pygmalion idea from a different unit."],["Most developmental delays can’t be detected before school begins","Not claimed."]],"k":"Why school entry: it’s a hard transition, and how kids start often sets up later advantages and gaps. So: do early play and media experiences relate to vulnerability then?"},{"id":"s1q166","s":1,"o":7,"t":"L","sc":"apply","q":"A health unit runs evening workshops that help mums and dads rethink their fears about children climbing and exploring. Which route to application is this?","a":[["[[Parent]] education and training","Yes. It works by changing what parents know and do."],["[[School/daycare]] programs and training","The workshops target parents, not educators."],["[[Community]] initiatives","Community initiatives build things like playgrounds and outdoor spaces."],["[[Laws/policy]]","No rule or regulation is being changed."],["[[Clinical]] treatment","Not one of lecture’s four routes."]],"k":"Four routes: parent education/training · school/daycare programs/training · community initiatives (playgrounds, outdoor spaces) · laws/policy."},{"id":"s1q167","s":1,"o":7,"t":"L","sc":"apply","q":"A daycare trains its staff to plan time outdoors and to allow more challenging play. Which route to application is this?","a":[["[[School/daycare]] programs and training","Yes. The change runs through educators and their programs."],["[[Parent]] education and training","Parents aren’t the ones being trained here."],["[[Community]] initiatives such as new playgrounds","That would be something like building a new neighbourhood playground."],["[[Laws/policy]]","A daycare’s own training isn’t a law or regulation."],["[[Media]] campaigns","Not one of lecture’s four routes."]],"k":"School/daycare route: programs and training for educators."},{"id":"s1q168","s":1,"o":7,"t":"L","sc":"barriers","q":"Which of these was ==NOT== one of lecture’s four routes for bringing play research into the real world?","a":[["[[Testing]] children’s play skills","Right, assessment wasn’t one of the routes."],["[[Parent]] education, training","One of the four."],["[[School/daycare]] programs, training","One of the four."],["[[Community]] initiatives","One of the four (playgrounds, outdoor spaces)."],["[[Laws/policy]]","One of the four."]],"k":"Parents · schools/daycares · community · laws/policy.","h":"From the kitchen table to city hall: home, school, neighbourhood, law."},{"id":"s1q169","s":1,"o":7,"t":"L","sc":"apply","q":"When lecture showed Brussoni’s tools (2021, 2022), which ==two== routes were highlighted on the slide?","a":[["Parent education/training and school/daycare programs","Yes. The slide showed a tool for parents and a ‘bring your class outside’ tool for educators, with those two routes highlighted."],["Community initiatives and laws/policy","Those were illustrated on other slides (a playground photo, the Toronto toboggan story)."],["Parent education/training and laws/policy","Only the first is right."],["School/daycare programs/training and community initiatives","Only the first is right."],["All four routes at once","Two were highlighted, not four."]],"k":"Brussoni et al. (2021; 2022): online tools for parents and for educators."},{"id":"s1q170","s":1,"o":7,"t":"L","sc":"barriers","q":"Which of these was ==NOT== on lecture’s list of limitations and challenges in applying play research?","a":[["Play [[can’t be measured]] reliably","Right, measurement wasn’t one of the four points."],["Most research is [[correlational]]","Listed, with ‘ethics of responsibility in application?’"],["Barriers in [[funding and access]]","Listed, along with broader systems."],["[[Generalizability]] across populations","Listed, beside the Corbett et al. (2010) chart."],["Concerns about [[real-world risks]]","Listed."]],"k":"Four challenges: correlational research (ethics of responsibility) · barriers in funding, access, broader systems · generalizability across populations · real-world risks."},{"id":"s2q064","s":2,"o":8,"t":"L","sc":"whyschool","q":"Factories spread, parents start working away from home, and employers want workers who can read and keep to a schedule. Which of lecture’s historical reasons for schooling is this?","a":[["[[Industrialization]]","Yes. Mass schooling grew alongside factory economies."],["[[Religious]] education","That’s about teaching faith and scripture."],["[[Colonization]]","That’s about a colonizing power imposing its ways."],["[[National identity]], assimilation","That’s about building one shared culture and loyalty."],["[[Agricultural]] heritage","That’s the reason for the summer break, not for schooling itself."]],"k":"Why school? Industrialization · national identity/assimilation · religious education · colonization."},{"id":"s2q065","s":2,"o":8,"t":"L","sc":"whyschool","q":"A church opens village schools so that every child can read scripture. Which of lecture’s historical reasons for schooling is this?","a":[["[[Religious]] education","Yes. Many early schools existed to pass on faith."],["[[Industrialization]]","Nothing here is about factories or the workforce."],["[[Scientific]] progress","Not one of lecture’s four."],["[[Child labour]] laws","Not one of lecture’s four."],["[[Parental]] demand for childcare","Not one of lecture’s four."]],"k":"Religious education was one of the four historical forces."},{"id":"s2q066","s":2,"o":8,"t":"L","sc":"whyschool","q":"An empire takes over a territory and builds schools there to replace local ways of life with its own. Which of lecture’s historical reasons for schooling is this?","a":[["[[Colonization]]","Yes. Schools have been used as a tool of colonial control."],["[[Industrialization]]","Nothing here is about factory work."],["[[Religious]] education","The story is about a colonizing power, not about teaching a faith."],["[[Scientific]] progress","Not one of lecture’s four."],["[[Economic]] competition","Not one of lecture’s four."]],"k":"Colonization was one of the four historical forces."},{"id":"s2q067","s":2,"o":8,"t":"L","sc":"whyschool","q":"Lecture noted that formal schooling for all is a relatively ____ institution.","a":[["[[new]]","Yes. School for every child is recent in human history."],["[[ancient]]","The opposite. Universal schooling is recent."],["[[rare]]","It’s now widespread. The point was how recent it is."],["[[informal]]","It’s formal schooling that lecture was describing."],["[[stable]]","The point was about how recent it is."]],"k":"Formal schooling for all is a relatively new institution.","b":1},{"id":"s2q068","s":2,"o":8,"t":"L","sc":"nested","q":"In lecture’s goals, school size, school type, year structure, start times and tracking were all features of which levels?","a":[["[[Schools and school organizations]]","Yes. These are decisions made above the classroom."],["[[Classrooms]]","Classroom features were teachers, academic work, SEL, and active/playful learning."],["[[Students]]","These aren’t traits of individual students."],["The [[community, country and culture]] layer","That’s the outermost layer, beyond the school system’s own structure."],["[[Families]]","Family wasn’t one of the layers in this model."]],"k":"Classroom: teachers, academic work, SEL, active learning. Classroom + school: achievement goals. School + school organization: size, type, year, start times, tracking."},{"id":"s2q069","s":2,"o":8,"t":"L","sc":"nested","q":"Which topics did lecture file under ==features of classrooms==?","a":[["Teachers, academic work, SEL, active and playful learning","Yes. Those were the classroom-level goals."],["School size, school type, school year, start times","Those were school and school-organization features."],["Ability tracking, school transitions, student body","Those sit at the school and organization levels."],["Industrialization, colonization, religion, national identity","Those are historical reasons for schooling."],["Funding, laws, national curriculum, culture","Lecture didn’t list these as classroom features."]],"k":"Layers: student → classroom → school → school organization → community, country, culture."},{"id":"s2q070","s":2,"o":9,"t":"L","sc":"teacher","q":"Ms. Okafor greets every student by name, knows what they care about, and students say they feel supported, so they work harder for her. Which of lecture’s three teacher factors is this?","a":[["Teacher-student [[relationships]]","Yes. The bond between teacher and student is the active ingredient here."],["Teacher [[qualifications]] and quality","That’s about training and skill, not the bond."],["Teachers’ [[expectations]] for students","Expectations are what the teacher believes a student can do."],["Teacher [[workload]]","Not one of lecture’s three."],["Teacher [[experience]] in years","Not one of lecture’s three."]],"k":"Three teacher factors: qualifications and quality · teacher-student relationships · expectations (Pygmalion effect)."},{"id":"s2q071","s":2,"o":9,"t":"L","sc":"pygc","q":"In lecture’s chart from Rosenthal & Jacobson (1968), what share of students gained ==20 or more IQ points==?","a":[["47% of bloomers vs. 19% of controls","Yes. The full chart: 10 points: 79 vs. 49 · 20 points: 47 vs. 19 · 30 points: 21 vs. 5."],["79% of bloomers vs. 49% of controls","Those are the numbers for 10 points."],["21% of bloomers vs. 5% of controls","Those are the numbers for 30 points."],["19% of bloomers vs. 47% of controls","Reversed. The bloomers were higher."],["47% of bloomers vs. 47% of controls","The groups were not equal at any level."]],"k":"% with IQ gains (bloomers vs. controls): 10 pts 79/49 · 20 pts 47/19 · 30 pts 21/5."},{"id":"s2q072","s":2,"o":9,"t":"L","sc":"pygmalion","q":"In the Pygmalion study as shown in lecture, what was the ==outcome measure==?","a":[["Gains on an [[IQ test]]","Yes. The slide showed an IQ test, and the chart’s title was ‘percentage of students with IQ gains in first and second grade’."],["[[Report card]] grades","Not the measure shown."],["Teacher [[ratings]] of behaviour","Not the measure shown."],["[[Attendance]] across the year","Not the measure shown."],["Peer [[popularity]] ratings","Not the measure shown."]],"k":"Rosenthal & Jacobson (1968): experimental group (‘bloomers’) vs. control group, compared on IQ gains."},{"id":"s2q073","s":2,"o":10,"t":"L","sc":"curriculum","q":"A Grade 3 class is handed material several years above their level. Most of the children give up. Which lecture principle about academic work is being ignored?","a":[["Work should be at an [[appropriate level]]","Yes. Lecture: benefits when curriculum is interesting, meaningful, AND at an appropriate level. Too hard misses just like too easy."],["Work should represent [[diverse experiences]]","That’s about whose lives show up in the curriculum, not difficulty."],["Work should go [[beyond the basics]]","That’s the bridge to SEL, not about difficulty."],["Work should be [[graded publicly]]","Lecture never recommended that."],["Work should be [[the same for all]]","Lecture never said that."]],"k":"Appropriate level cuts both ways: not too easy, not too hard.","h":"Goldilocks work: not too hard, not too easy."},{"id":"s2q074","s":2,"o":10,"t":"L","sc":"curriculum","q":"A teacher adds stories from many cultures and family types, and ties lessons to what’s happening in the world. Which lecture point about academic work is this?","a":[["Global-social realities and [[diverse experiences]]","Yes, that’s the third bullet on the slide."],["Keeping work at an [[appropriate level]]","That’s about difficulty."],["Going [[beyond the basics]] with social-emotional learning","SEL is about social and emotional skills, not whose stories are told."],["Emphasizing [[performance goals]] through public comparison","That’s about competing and comparing."],["Using [[ability tracking]]","That’s separating students by ability level."]],"k":"Academic work: consideration of global-social realities, representing diverse experiences."},{"id":"s2q075","s":2,"o":10,"t":"L","sc":"curriculum","q":"When lecture said SEL means ‘going beyond the basics’, what were ==the basics==?","a":[["Reading, writing, arithmetic","Yes. The slide listed exactly those three."],["Reading, science, history","Science and history weren’t in the bracket."],["Attendance, behaviour, homework","Those aren’t subjects."],["Memorizing, testing, grading","Those are practices, not the basics lecture named."],["Language, music, physical education","Not what the slide listed."]],"k":"The basics = reading, writing, arithmetic. SEL goes beyond them.","h":"The three Rs."},{"id":"s2q076","s":2,"o":10,"t":"L","sc":"curriculum","q":"Lecture said there are benefits when curriculum is interesting, meaningful, and at an ____ level.","a":[["[[appropriate]]","Yes. Matched to where students actually are."],["[[advanced]]","Not always. It should fit the students."],["[[identical]]","Lecture didn’t say everyone needs the same level."],["[[introductory]]","Too easy is also a mismatch."],["[[accelerated]]","Faster isn’t the point. Fit is."]],"k":"Interesting · meaningful · at an appropriate level.","b":1},{"id":"s2q077","s":2,"o":10,"t":"L","sc":"curriculum","q":"Which of these was ==NOT== something lecture listed about beneficial academic work?","a":[["It is [[identical]] for every student","Right. Lecture said ‘appropriate level’, which is the opposite of one-size-fits-all."],["It is [[interesting]]","Listed."],["It is [[meaningful]]","Listed."],["It is at an [[appropriate level]]","Listed."],["It represents [[diverse experiences]] and realities","Listed."]],"k":"Academic work = what is taught + what students are asked to learn and do. Best when interesting, meaningful, appropriate level, and representing diverse experiences."},{"id":"s2q078","s":2,"o":11,"t":"L","sc":"tootle","q":"Which of these would count as a ==tootle==?","a":[["‘Thank you for helping me find my pencil.’","Yes. Tootling = reporting something POSITIVE a classmate did. The slide’s starters: ‘Thank you for…’, ‘I like that you…’, ‘You did a good job of…’"],["‘Jo pushed me in the line at recess.’","That’s tattling, the opposite: reporting something negative."],["‘I got the highest mark on the quiz.’","That’s about yourself and about ranking."],["‘Can you please stop tapping your desk?’","That’s a request, not a positive report."],["‘I think my answer is much better than yours.’","That’s a comparison, not a positive report."]],"k":"Positive peer reporting (tootling): noticing and naming the good things peers do or say.","h":"Tattling’s kinder twin."},{"id":"s2q079","s":2,"o":11,"t":"L","sc":"tootle","q":"Research on tootling (Collins et al., 2020) shows links with improved peer interactions, reduced aggression/disruption, and…","a":[["more [[academic engagement]]","Yes, that’s the third outcome on the slide."],["higher [[IQ]] scores","Not on the slide."],["fewer [[absences]]","Not on the slide."],["better [[physical health]]","Not on the slide."],["stronger [[mastery goal]] orientations","Not on the slide."]],"k":"Tootling: improved peer interactions · reduced aggression/disruption · more academic engagement."},{"id":"s2q080","s":2,"o":11,"t":"L","sc":"selwhy","q":"After an SEL program, students say they like coming to school and get along better with classmates, so they join in more during lessons. Which of lecture’s three reasons for the academic benefits is this?","a":[["More [[positive feelings]] about school and peers","Yes. Liking school and classmates makes it easier to engage."],["Useful skills: [[executive function]] and attention","That one is about focus and self-control skills."],["Better [[self-esteem]], belonging","That one is about how students feel about themselves and whether they fit in."],["Higher [[teacher expectations]]","That’s the Pygmalion effect, not one of the three SEL reasons."],["More [[performance goals]]","Not one of the three reasons."]],"k":"Why SEL helps academics: useful skills (executive function, attention) · more positive feelings about school and peers · better self-esteem, belonging."},{"id":"s2q081","s":2,"o":11,"t":"L","sc":"selwhy","q":"After an SEL program, Nia feels she fits in at school and feels better about herself, so she’s willing to try hard problems. Which of lecture’s three reasons is this?","a":[["Better [[self-esteem]], belonging","Yes. Feeling you belong and feeling good about yourself frees you up to learn."],["Useful skills: [[executive function]], attention","That one is about focus and self-control skills."],["More [[positive feelings]] about school and peers","Close, but that one is about liking school and classmates. This story is about how she sees herself."],["Better [[symbolic thought]]","That’s from pretend play."],["Less [[summer learning loss]]","That’s from the school year slide."]],"k":"Three reasons: skills · feelings about school and peers · self-esteem and belonging.","h":"Skills, feelings, belonging."},{"id":"s2q082","s":2,"o":11,"t":"L","sc":"schonfeldc","q":"In lecture’s Schonfeld et al. (2015) chart, in which subject was the SEL group ahead of the control group at ==all three grades==?","a":[["[[Maths]]","Yes. Maths proficiency was higher at Grades 4, 5 and 6 (about 88 vs. 82, 87.5 vs. 85.5, 90 vs. 87.5)."],["[[Reading]]","Reading was clearly ahead only in Grade 4 (about 63 vs. 54.5). Grades 5 and 6 were about even."],["[[Both]] reading and maths","Reading was about even at Grades 5 and 6."],["[[Neither]] subject","Maths was ahead at every grade."],["[[Writing]]","Writing wasn’t on the chart."]],"k":"Schonfeld et al. (2015), % at proficiency: maths higher with SEL at all three grades; reading clearly higher in Grade 4 only."},{"id":"s2q083","s":2,"o":12,"t":"L","sc":"pillars5","q":"Students learn about area by measuring their own schoolyard for a garden they will actually plant. Which of the five features of effective learning stands out?","a":[["[[Meaningful]]","Yes. The learning connects to something real that matters to them."],["[[Iterative]]","Iterative is try, check, revise, repeat. Nothing here is about repeated attempts."],["[[Interactive]]","Interactive is about back-and-forth with other people."],["[[Competitive]]","Not one of the five."],["[[Standardized]]","Not one of the five."]],"k":"More learning when active, meaningful, interactive, iterative, and joyful (Hirsh-Pasek et al., 2015)."},{"id":"s2q084","s":2,"o":12,"t":"L","sc":"pillars5","q":"In a history lesson, students debate, question each other, and build on each other’s ideas with the teacher. Which of the five features stands out?","a":[["[[Interactive]]","Yes. Learning through back-and-forth with others."],["[[Iterative]]","Iterative is revising your own attempt over several tries."],["[[Joyful]]","Maybe they enjoy it, but the story is about the exchange between people."],["[[Self-directed]]","Not one of the five, and the story is about exchange with others."],["[[Sequential]]","Not one of the five."]],"k":"Interactive = social back-and-forth."},{"id":"s2q085","s":2,"o":12,"t":"L","sc":"pillars5","q":"A class laughs its way through a maths relay game and asks to play again tomorrow. Which of the five features stands out?","a":[["[[Joyful]]","Yes. Enjoyment is one of the five features, just like in the definition of play."],["[[Iterative]]","Nothing here is about revising and retrying."],["[[Meaningful]]","Nothing ties it to their real lives."],["[[Rewarded]]","Not one of the five."],["[[Rigorous]]","Not one of the five."]],"k":"Five features: active · meaningful · interactive · iterative · joyful.","h":"A-M-I-I-J: Active, Meaningful, Interactive, Iterative, Joyful."},{"id":"s2q086","s":2,"o":12,"t":"LR","sc":"fball","q":"According to lecture’s summary of Bustamante et al. (2022), where did students ==particularly== improve?","a":[["Converting [[fractions to decimals]]","Yes. Lecture: improved performance after the intervention (vs. pretest and control), particularly in converting fractions to decimals."],["[[Number line]] estimation","In the article, number line results were not significant."],["Timed [[addition]] of fractions and decimals","In the article, timed addition showed no gain."],["[[Far-transfer]] problems","In the article, far transfer was not significant."],["[[Multiplying]] fractions","Not a focus of the study."]],"k":"Lecture’s summary: Grades 4–6 · randomly assigned to Fraction Ball or control · improved vs. pretest and control · particularly fractions → decimals."},{"id":"s2q087","s":2,"o":12,"t":"L","sc":"fball","q":"Lecture’s Fraction Ball slide had a chart comparing the control mean and treatment mean on which ==two measures==?","a":[["The [[posttest]] and [[teacher ratings]]","Yes. Those were the two labels on the chart’s axis. The slide’s take-home: improved performance compared to pretest and to the control group."],["The [[pretest]] and the [[posttest]]","Pretest wasn’t one of the two axis labels."],["[[Reading]] and [[maths]] proficiency scores","That’s the Schonfeld SEL chart."],["[[Timed]] and [[untimed]] tests","That split is in the article’s figure, not on this slide’s chart."],["[[Grade 4]] and [[Grade 6]]","The chart didn’t split by grade."]],"k":"Lecture’s chart: control vs. treatment means on the posttest and on teacher ratings."},{"id":"s2q088","s":2,"o":12,"t":"L","sc":"fball","q":"According to lecture’s summary, how were students placed in Fraction Ball or the control group?","a":[["They were [[randomly assigned]]","Yes. Random assignment is what lets the study say Fraction Ball caused the gains."],["They [[volunteered]] for the group they wanted","Self-selection would be a confound."],["Teachers picked the [[weakest]] students","That would bias the comparison."],["Whole [[schools]] were matched and compared","Students were randomly assigned."],["Students were split by [[pretest score]]","That would build in a difference from the start."]],"k":"Fraction Ball: Grades 4–6, randomly assigned to Fraction Ball or control.","h":"A coin flip, not a choice, decides who plays."},{"id":"s3q076","s":3,"o":14,"t":"L","sc":"targets","q":"A teacher sorts the class into ‘bluebirds’ (strong readers) and ‘robins’ (weak readers) for the whole year. Which TARGETS feature is this about?","a":[["[[Grouping]]","Yes. How students are grouped is one of the classroom features that can tilt a class toward mastery or performance goals."],["[[Time]]","Time is about pacing and deadlines."],["[[Authority]]","Authority is about who gets to make decisions."],["[[Recognition]]","Recognition is about what gets praised or rewarded."],["[[Task]]","Task is about the design of the work itself."]],"k":"TARGETS: Task · Authority · Recognition · Grouping · Evaluation · Time · Social relations."},{"id":"s3q077","s":3,"o":14,"t":"L","sc":"targets","q":"A teacher lets students help set class rules and choose their own project topics. Which TARGETS feature is this about?","a":[["[[Authority]]","Yes. Authority is about who holds decision-making power in the classroom."],["[[Evaluation]]","Evaluation is about how work is assessed."],["[[Grouping]]","Grouping is about how students are sorted."],["[[Time]]","Time is about pacing and deadlines."],["[[Recognition]]","Recognition is about what gets praised or rewarded."]],"k":"A = Authority: who decides."},{"id":"s3q078","s":3,"o":14,"t":"L","sc":"targets","q":"A teacher lets students take the time they need on an assignment and redo it until they understand. Which TARGETS feature is this about?","a":[["[[Time]]","Yes. Flexible pacing puts the focus on understanding rather than on who finishes first."],["[[Task]]","Task is about the design of the work itself."],["[[Authority]]","Authority is about who makes decisions."],["[[Social relations]]","That’s about how students relate to each other."],["[[Grouping]]","Grouping is about how students are sorted."]],"k":"The second T = Time."},{"id":"s3q079","s":3,"o":14,"t":"L","sc":"targets","q":"In TARGETS, the letter A stands for ____.","a":[["[[Authority]]","Yes. Task, Authority, Recognition, Grouping, Evaluation, Time, Social relations."],["[[Ability]]","Not one of the seven."],["[[Achievement]]","Not one of the seven."],["[[Assessment]]","Assessment is covered by E for Evaluation."],["[[Attention]]","Not one of the seven."]],"k":"A = Authority.","b":1},{"id":"s3q080","s":3,"o":14,"t":"L","sc":"targets","q":"In TARGETS, the final letter S stands for ____.","a":[["[[Social relations]]","Yes. The last of the seven."],["[[Scores]]","Not one of the seven."],["[[Standards]]","Not one of the seven."],["[[Student self-esteem]]","Not one of the seven."],["[[Structure]]","Not one of the seven."]],"k":"S = Social relations.","b":1},{"id":"s3q081","s":3,"o":14,"t":"L","sc":"honour","q":"Which school practice did lecture list as emphasizing ==mastery== goals?","a":[["Offering [[diverse course options]]","Yes. Along with recognition for effort/improvement and recognition for different abilities."],["Publishing [[class rankings]] on report cards","That emphasizes performance goals."],["Posting a public [[honour roll]]","That emphasizes performance goals."],["Holding [[assemblies]] for top grades","That emphasizes performance goals."],["Grading every test on a [[curve]]","Not on the slide, and curving is all about comparison."]],"k":"Mastery: recognition for effort/improvement · recognition for different abilities · diverse course options. Performance: public honour rolls · assemblies for top grades · class rankings published."},{"id":"s3q082","s":3,"o":14,"t":"L","sc":"honour","q":"A school prints every student’s ==class rank== on report cards and publishes the list. According to lecture, what does this emphasize?","a":[["[[Performance]] goals","Yes. Rankings make school about beating others."],["[[Mastery]] goals","Mastery practices recognize effort, improvement and different abilities."],["[[Stage–environment]] fit","Rankings add comparison, which is a mismatch for adolescents, not a fit."],["[[Intrinsic]] motivation","Rankings are an external comparison."],["[[Person–environment]] fit","That was a rationale for tracking, not for rankings."]],"k":"Class rankings on report cards, published = performance goals."},{"id":"s3q083","s":3,"o":15,"t":"L","sc":"transitions","q":"Among lecture’s possible reasons for the decline at school transitions, which two were phrased as ==‘changes in…’==?","a":[["Changes in achievement goals and in teacher beliefs","Yes. The list: age itself? transition itself? changes in achievement goals, changes in teacher beliefs, stage–environment fit."],["Changes in school size and in start times","Those are separate school features, not on this list."],["Changes in friendships and in family income","Not on this list."],["Changes in sleep cycles and in grey matter","Sleep was the start-times slide. Grey matter is from the juvenile justice unit."],["Changes in curriculum difficulty and in lesson length","Not on this list."]],"k":"Why the decline? Age itself · transition itself · changes in achievement goals · changes in teacher beliefs · stage–environment fit."},{"id":"s3q084","s":3,"o":15,"t":"L","sc":"transitions","q":"Adolescents have a growing ==concern for peer opinions==. According to lecture, which change in middle/high schools clashes with that?","a":[["An increase in practices that emphasize [[comparison]]","Yes. Just when teens care most about how they look to peers, schools rank and compare them more."],["A greater emphasis on [[teacher control]] and classroom rules","That clashes with the other need: autonomy."],["A move to [[later start times]]","Later starts would fit teens better, and aren’t part of this mismatch."],["A wider range of [[course options]]","That’s a mastery-emphasizing practice."],["A switch to [[smaller]] schools","Smaller schools are linked with better outcomes."]],"k":"Mismatch pairs: need for autonomy ↔ more teacher control. Concern for peer opinions ↔ more comparison.","h":"They want freedom and get rules. They fear judgment and get rankings."},{"id":"s3q085","s":3,"o":15,"t":"L","sc":"private","q":"Traditional research shows benefits for private school. According to lecture, which ==confounds== make that hard to interpret?","a":[["[[School size]] and [[SES]]","Yes. Private schools tend to be smaller and serve wealthier families, so the ‘private school advantage’ may really be those."],["[[Start times]] and [[calendar]]","Not the confounds lecture named."],["[[Uniforms]] and [[discipline]]","Not the confounds lecture named."],["[[Class length]] and [[homework]]","Not the confounds lecture named."],["[[Location]] and [[language]]","Not the confounds lecture named."]],"k":"Private school benefits are confounded with school size, SES, etc. Controlling for these suggests no advantage; lottery studies are mixed (no improvement, or even decline)."},{"id":"s3q086","s":3,"o":15,"t":"L","sc":"millsc","q":"In lecture’s Mills & Wolf (2017) chart, which subject fell ==furthest== in the first year after students won a private school lottery?","a":[["[[Maths]], from about the 52nd to the 25th percentile","Yes. English language arts also fell (51st → 40th), but maths fell much further. Both recovered by Year 3."],["[[English]], from about the 51st to the 25th percentile","English fell to about the 40th percentile, not the 25th."],["[[Both]] fell equally, to the 40th percentile","Maths fell further than English."],["[[Neither]]: both rose in the first year","Both dropped in Year 1."],["[[Science]], from about the 52nd to the 36th percentile","Science wasn’t on the chart."]],"k":"Mills & Wolf (2017): maths 52 → 25 → 36 → 45; English 51 → 40 → 48 → 53. A drop, then recovery. No clear gain."},{"id":"s3q087","s":3,"o":15,"t":"L","sc":"summer","q":"According to lecture, what decreases over summer break?","a":[["Academic performance and [[IQ]]","Yes. The slide said ‘decrease in academic performance/IQ over summer break’, maybe more so for low-income families."],["Academic performance, but [[not IQ]]","The slide included IQ."],["[[Motivation]] and attendance","Not what this slide said."],["[[Belonging]] and self-esteem","Belonging was the Benner & Graham transitions finding."],["[[Sleep]] quality and physical health","Not what this slide said."]],"k":"Summer break: decrease in academic performance/IQ. More so for low-income families?"},{"id":"s3q088","s":3,"o":15,"t":"L","sc":"barnumc","q":"In lecture’s Barnum (2018) chart, about what share of ==poor vs. nonpoor== kindergarteners visited a museum, gallery or historical site over the summer?","a":[["About 32% vs. 63%","Yes. Poor 32%, near-poor 44%, nonpoor 63%."],["About 15% vs. 33%","Those are the numbers for attending a play or concert."],["About 63% vs. 32%","Reversed. Nonpoor children had more outings."],["About 44% vs. 44%","44% was the near-poor group."],["About 5% vs. 21%","Those are Pygmalion numbers (30-point IQ gains)."]],"k":"Barnum (2018), summer outings: museum/gallery/historical site 32% · 44% · 63%; play or concert 15% · 19% · 33% (poor · near-poor · nonpoor)."},{"id":"s3q089","s":3,"o":15,"t":"L","sc":"transitions","q":"According to lecture, school transitions are linked with decreases in motivation, interest in school, and ____.","a":[["[[confidence]]","Yes. ‘Decreases in motivation, interest in school, confidence, etc.’"],["[[curiosity]]","Not the word on the slide."],["[[friendships]]","Not the word on the slide."],["[[attendance]]","Not the word on the slide."],["[[autonomy]]","Autonomy is what adolescents need more of, in the stage–environment fit idea."]],"k":"Transitions → decreases in motivation, interest in school, confidence.","b":1},{"id":"s3q090","s":3,"o":16,"t":"L","sc":"tracks","q":"A principal argues: ‘Advanced students get harder work and struggling students get more support, so every class matches its students.’ Which of lecture’s possible rationales for tracking is this?","a":[["Maximizing [[person–environment fit]]","Yes. The idea is that each student lands in a class that fits their level."],["Better for [[social comparison]]","That’s the other rationale: being compared with similar-ability classmates."],["Emphasizing [[mastery goals]]","Not one of the two rationales on the slide."],["Reducing [[school transitions]]","Tracking doesn’t change transitions."],["Increasing [[ethnic diversity]] within classes","Not a rationale for tracking."]],"k":"Two possible rationales (both with question marks): maximize person–environment fit? better for social comparison?"},{"id":"s3q091","s":3,"o":16,"t":"L","sc":"tracks","q":"Besides person–environment fit, what was lecture’s ==other== possible rationale for ability tracking?","a":[["It may be better for [[social comparison]]","Yes. In a tracked class you’re compared with peers at a similar level. The slide put a question mark on it."],["It may be better for [[summer learning]] loss","Not a rationale on the slide."],["It may be better for [[teacher pay]]","Not a rationale on the slide."],["It may be better for [[school size]]","Not a rationale on the slide."],["It may be better for [[sleep cycles]]","That’s the start-times topic."]],"k":"Tracking rationales: person–environment fit? social comparison?"},{"id":"s3q092","s":3,"o":16,"t":"L","sc":"tracks","q":"Ravi was top of his old class. In the high-ability track his grades stay strong, but he now feels average and his confidence dips. How does this fit lecture?","a":[["High tracks help academically but may cost [[self-concept]]","Yes. High ability tracks: benefits academically, but possible costs for self-esteem, self-concept, well-being."],["High tracks harm [[academics]] but help self-esteem","Reversed."],["High tracks have [[no downsides]] for anyone","Lecture listed possible costs."],["Only [[low tracks]] affect how students feel about themselves","High tracks may also carry costs for self-esteem and well-being."],["Tracking only matters for [[ethnic minorities]]","Not what the slide said."]],"k":"High tracks: academic benefits, BUT possible costs for self-esteem, self-concept, well-being.","h":"A big fish moved to a pond full of big fish."},{"id":"s3q093","s":3,"o":16,"t":"L","sc":"tracks","q":"According to lecture, low-ability tracks bring differences in instructional quality and ____ groups.","a":[["[[peer]]","Yes. Low tracks → feelings of inadequacy, plus differences in instructional quality and peer groups."],["[[age]]","Tracking is by ability, not age."],["[[income]]","Not the word on the slide."],["[[control]]","Not the word on the slide."],["[[focus]]","Not the word on the slide."]],"k":"Low tracks: negative outcomes → feelings of inadequacy → differences in instructional quality, peer groups.","b":1},{"id":"s3q094","s":3,"o":16,"t":"L","sc":"tracks","q":"Which summary of ability tracking matches lecture ==overall==?","a":[["High tracks gain academically, at a possible cost; low tracks lose","Yes. That’s the whole slide: academic benefits up top (but self-esteem costs), negative outcomes at the bottom."],["Every track gains, and low tracks gain the most","Low tracks showed negative outcomes."],["No track is affected, academically or emotionally","Both ends were affected."],["Low tracks gain academically; high tracks do worse","Reversed."],["High tracks gain in every way, while low tracks are left unaffected","High tracks may have costs, and low tracks are harmed."]],"k":"Tracking = students separated into different classes based on ability level. Mixed for the top, negative for the bottom."},{"id":"s3q095","s":3,"o":17,"t":"L","sc":"diversity","q":"Jack belongs to the ==majority== ethnic group and attends a highly diverse school. According to lecture, what is the likely benefit for him?","a":[["Fewer negative [[stereotypes]] of outgroups","Yes. That was the benefit listed for the majority group."],["Increased feelings of [[safety]] at school","That was listed for ethnic minority groups."],["Decreased [[loneliness]]","That was listed for ethnic minority groups."],["Higher [[self-worth]]","That was listed for ethnic minority groups."],["Higher [[test scores]] in reading and maths","Achievement wasn’t on the slide."]],"k":"Diversity. Majority group: fewer negative stereotypes about outgroups. Minority groups: more safety, less loneliness, higher self-worth."},{"id":"s3q096","s":3,"o":17,"t":"L","sc":"diversity","q":"For ethnic minority students, lecture linked school diversity with increased safety, decreased loneliness, and higher self-____.","a":[["[[worth]]","Yes. Higher self-worth."],["[[control]]","Self-control is from the pretend play slide."],["[[regulation]]","Self-regulation is from the adolescence unit."],["[[distancing]]","Self-distancing is the Batman effect."],["[[reliance]]","Not the word on the slide."]],"k":"Minority groups: increased feelings of safety, decreased loneliness, higher self-worth (Juvonen et al., 2006).","b":1},{"id":"s3q097","s":3,"o":17,"t":"L","sc":"juvonenc","q":"In lecture’s Juvonen et al. (2006) chart, which outcome went ==up== as school diversity increased?","a":[["Feeling [[safe]] at school","Yes. School safety rose, while peer victimization and loneliness fell."],["Peer [[victimization]]","That went down."],["[[Loneliness]]","That went down."],["[[All three]] outcomes rose","Only safety rose."],["[[None]]: all three fell","Safety rose."]],"k":"As diversity rises: safety ↑, victimization ↓, loneliness ↓ (Grade 6, fall and spring)."},{"id":"s4q071","s":4,"o":19,"t":"L","sc":"court","q":"Which of these was ==NOT== one of lecture’s three areas where children meet the legal system?","a":[["Children serving as [[jurors]]","Right. Children don’t sit on juries, and it wasn’t one of the three."],["Children as [[eyewitnesses]]","One of the three."],["Children in [[custody]] decisions","Part of the second area: the impact of the legal system on involved children."],["Children in [[divorce]] proceedings","Part of the second area."],["Youth [[suspected of crimes]]","The third area, and this unit’s focus."]],"k":"Three areas: children as eyewitnesses · impact of the legal system on involved children (divorce proceedings, custody) · youth suspected of committing crimes."},{"id":"s4q072","s":4,"o":19,"t":"L","sc":"threeareas","q":"For ==youth suspected of committing crimes==, which three issues did lecture’s slide name?","a":[["Competence, blame, punishment","Yes. Are they competent, how much are they to blame, and how should they be punished?"],["Arrest, trial, appeal","Those are stages of a case, not the three issues named."],["Motive, means, opportunity","That’s detective talk, not the slide."],["Memory, suggestibility, stress","Those fit children as eyewitnesses."],["Custody, support, access","Those fit divorce proceedings."]],"k":"Youth suspected of crimes: competence, blame, punishment."},{"id":"s4q073","s":4,"o":19,"t":"L","sc":"rock","q":"‘The question’ asks whether juveniles accused of crime should be held to the same standards of ____ as adults, and punished in the same way.","a":[["[[blameworthiness]]","Yes. Two parts: same blame? same punishment?"],["[[intelligence]]","The question is about blame, not IQ."],["[[criminal procedure]]","Not the word on the slide."],["[[education]]","Not the word on the slide."],["[[privacy]]","Not the word on the slide."]],"k":"The question: same standards of blameworthiness as adults? Punished in the same way?","b":1},{"id":"s4q074","s":4,"o":19,"t":"L","sc":"rock","q":"After introducing the three mitigating factors, lecture added a second line to ‘the question’. What was it?","a":[["Due to their stage of development, are juveniles less [[culpable]]?","Yes. That’s the bridge: if adolescence itself brings the mitigating factors, teens are less blameworthy."],["Due to their stage of development, are juveniles less [[intelligent]]?","Lecture said cognitive skills are adult-like by mid-to-late adolescence."],["Due to their home lives, are juveniles less [[supervised]]?","Not the question asked."],["Due to their brain size, are juveniles less [[dangerous]]?","Not the question asked."],["Due to their age, are juveniles more [[punishable]]?","Not the question asked."]],"k":"Follow-up: due to their stage of development, are juveniles less culpable?"},{"id":"s4q075","s":4,"o":20,"t":"L","sc":"mitig","q":"A person with a severe cognitive impairment commits an offence without grasping what would follow. Which mitigating factor applies?","a":[["[[Impairments]] in decision making","Yes. A reduced capacity to reason and choose lowers culpability."],["Compelling [[external circumstances]]","That’s about outside pressure, like a threat."],["The act is [[out of character]]","That’s about a one-off that doesn’t reflect who the person is."],["The [[harm caused]] was small","Harm is the other half of proportionality, not a mitigating factor about the person."],["The offender’s [[young age]]","Lecture asked for factors BEYOND age."]],"k":"Three mitigators: impairments/deficiencies in decision making · compelling external circumstances · act is out of character."},{"id":"s4q076","s":4,"o":20,"t":"L","sc":"scales","q":"Under penal proportionality, the severity of punishment should be determined by which ==two things==?","a":[["The [[harm]] caused and the person’s [[culpability]]","Yes. How bad was the outcome, and how blameworthy is the person who caused it?"],["The [[harm]] caused and the person’s [[age]]","Age isn’t one of the two. Age may matter through culpability."],["The person’s [[culpability]] and their prior [[record]]","Prior record isn’t in the definition."],["The [[victim’s]] wishes and the [[harm]] caused","The victim’s wishes aren’t in the definition."],["The [[cost]] of prison and public [[opinion]]","Neither is in the definition."]],"k":"Penal proportionality: severity of punishment is set by the harm caused AND the culpability of the person causing it.","h":"Two weights on the scale: how bad, and how much to blame."},{"id":"s4q077","s":4,"o":20,"t":"L","sc":"scales","q":"A judge finds a 15-year-old responsible for an offence but gives a lighter sentence than an adult would get. In lecture’s terms, this is…","a":[["[[mitigation]]","Yes. Responsibility and punishment are lessened, not removed."],["[[excuse]]","An excuse would remove criminal responsibility altogether."],["[[acquittal]]","He was found responsible."],["[[deterrence]]","That’s a purpose of punishment, not a term from the slide."],["[[retribution]]","That’s a purpose of punishment, not a term from the slide."]],"k":"Excuse = removes criminal responsibility. Mitigation = lessens responsibility and punishment.","h":"Excuse erases. Mitigation shrinks."},{"id":"s4q078","s":4,"o":21,"t":"L","sc":"brain","q":"On lecture’s brain slide, which finding went with ==Barnea-Goraly et al. (2005)==?","a":[["[[White matter]] increases steadily with age","Yes. Their chart showed white matter organization rising in a straight line through childhood and adolescence."],["[[Grey matter]] peaks in early adolescence","That’s Giedd et al. (1999)."],["[[Sensation seeking]] peaks in adolescence","That’s the Cauffman et al. (2010) slide."],["[[Peers]] raise risk taking in adolescents","That’s Albert et al. (2013)."],["[[Cognitive capacity]] levels off by about 16–17","That’s Icenogle et al. (2019)."]],"k":"White matter (myelination) → linear increase (Barnea-Goraly et al., 2005). Grey matter (neurons/synapses) → peak in early adolescence, then decrease (Giedd et al., 1999)."},{"id":"s4q079","s":4,"o":21,"t":"L","sc":"brain","q":"On lecture’s slide, white matter was glossed as ____ and grey matter as neurons/synapses.","a":[["[[myelination]]","Yes. Myelin is the insulation that speeds up signals."],["[[synaptic pruning]]","Pruning is what happens to grey matter (synapses) after its peak."],["[[dopamine]]","Not on this slide."],["[[cortisol]]","That’s the stress hormone from the Corbett chart."],["[[the cortex]]","Not how the slide glossed it."]],"k":"White matter = myelination. Grey matter = neurons/synapses.","h":"White = wiring insulation. Grey = the connections themselves.","b":1},{"id":"s4q080","s":4,"o":21,"t":"L","sc":"money","q":"Lecture first asked ‘$400 tomorrow or $1,000 in ==1 week==?’ and then changed it to ‘$1,000 in ==1 year==?’ What does changing the delay show?","a":[["The longer the wait, the more tempting the money now","Yes. That pull is what future orientation tasks measure, and teens get better at resisting it over adolescence."],["The longer the wait, the more people choose to wait","Reversed. Longer delays make waiting harder."],["The delay makes no real difference to what people choose","The class’s choices shift when the wait gets longer."],["Only the dollar amounts matter, not the timing","Timing is the whole point of the task."],["Adults and teens always choose the same option","Lecture showed age differences (Steinberg et al., 2009)."]],"k":"Future orientation: over adolescence, teens become better able to think about long-term consequences."},{"id":"s4q081","s":4,"o":21,"t":"L","sc":"igt","q":"What kind of task did Cauffman et al. (2010) use in the study lecture showed?","a":[["A [[gambling card task]] with several decks","Yes. A modified Iowa Gambling Task: some decks pay off over time, others lose, and you learn which to play and which to avoid."],["A [[driving game]] played alone or with friends","That’s Albert et al. (2013)."],["A [[peg puzzle]] timed to the first move","That’s the Tower of London in Steinberg et al. (2008)."],["A [[choice]] between money now and later","That’s delay discounting in Steinberg et al. (2009)."],["An [[IQ test]] given at two time points","That’s the Pygmalion study."]],"k":"Cauffman et al. (2010): most driven to approach rewards in the teen years, but avoidance of risk not until 18+."},{"id":"s4q082","s":4,"o":21,"t":"L","sc":"igt","q":"Fourteen-year-old Rin keeps picking the deck with the big wins even though it also has big losses. Which lecture point does this show?","a":[["Teens are driven more by [[reward]], less concerned about risk","Yes. Sensation seeking and reward sensitivity: the wins loom large and the losses don’t bite as hard."],["Teens have weaker [[cognitive skills]] than adults","Lecture said cognitive skills are adult-like by mid-to-late adolescence."],["Teens are more responsive to [[peers]] than adults","True, but there are no peers in this story."],["Teens have less [[grey matter]] than children","Not what this shows."],["Teens are unable to think about [[long-term]] consequences at all","Too strong. Future orientation improves gradually, and this story is about reward pull."]],"k":"Sensation seeking peaks in adolescence. Teens: driven more by reward, less concerned about risk."},{"id":"s4q083","s":4,"o":21,"t":"L","sc":"albertc","q":"In lecture’s Albert et al. (2013) chart, about how much did ==adolescents’== risky decisions rise when peers were watching?","a":[["From about 46% to about 59%","Yes. Young adults (about 50% → 48.5%) and adults (about 46% → 50%) barely moved."],["From about 46% to about 50%","That’s the adults."],["From about 50% to about 48%","That’s the young adults, who didn’t rise at all."],["From about 19% to about 47%","Those are Pygmalion numbers."],["From about 59% to about 46%","Reversed. Risk went up with peers."]],"k":"Albert et al. (2013): only adolescents took clearly more risks with peers watching."},{"id":"s4q084","s":4,"o":21,"t":"L","sc":"tower","q":"Lecture defined self-regulation as the ability to control ____.","a":[["[[impulses]]","Yes. And it becomes gradually better throughout adolescence."],["[[peers]]","Self-regulation is about yourself."],["[[rewards]]","Not the word on the slide."],["[[attention]]","Not the word on the slide."],["[[language]]","Not the word on the slide."]],"k":"Self-regulation: ability to control impulses becomes gradually better throughout adolescence (Steinberg et al., 2008).","b":1},{"id":"s4q085","s":4,"o":21,"t":"L","sc":"dual","q":"The objective asks how these developments ‘may relate to risky behaviour’. Which summary fits lecture best?","a":[["Reward drive and peer pull are high while self-control still matures","Yes. Sensation seeking peaks, peers matter most, and impulse control and future orientation are still improving."],["Reasoning ability stays childlike until people reach their early twenties","Lecture said cognitive skills are adult-like by mid-to-late adolescence."],["Grey matter keeps growing, which overloads the brain","Grey matter peaks in early adolescence, then decreases."],["Teens don’t know which behaviours are risky","The issue isn’t knowledge. It’s what drives choices in the moment."],["White matter declines, which slows thinking down","White matter increases linearly."]],"k":"Adult-like thinking + high reward drive + strong peer pull + still-maturing self-control = more risky behaviour.","h":"Strong gas pedal, brakes still being installed."},{"id":"s5q001","s":5,"o":0,"t":"T","sc":"playdef","q":"Which ==key term== matches this definition? “Joyful, actively engaging, spontaneous, voluntary, intrinsically motivated activity that is unrelated to immediate survival.”","a":[["[[Play]]","Yes. Play = joyful, actively engaging, spontaneous, voluntary, intrinsically motivated activity that is unrelated to immediate survival."],["[[Adjusted odds ratio]]","Adjusted odds ratio is something else: a measure of association after accounting for confounders: 1 = no link, below 1 = lower odds, above 1 = higher odds."],["[[Social desirability bias]]","Social desirability bias is something else: answering in a way that makes you look good, which distorts self- or caregiver reports."],["[[Batman effect]]","Batman effect is something else: children persevere longer and regulate emotions better when they take on a character and think about a hard task as that character."],["[[Cognitive restoration]]","Cognitive restoration is something else: recovery from attentional fatigue, which natural outdoor settings promote (Ramsden et al.)."]],"k":"Play: Joyful, actively engaging, spontaneous, voluntary, intrinsically motivated activity that is unrelated to immediate survival.","term":"Play","h":"Nobody makes you, nobody pays you, you just want to."},{"id":"s5q002","s":5,"o":0,"t":"T","sc":"playdef","q":"Which ==key term== does this example show? “At recess, kids invent a chasing game for no reason other than that it’s fun.”","a":[["[[Play]]","Yes. Play = joyful, actively engaging, spontaneous, voluntary, intrinsically motivated activity that is unrelated to immediate survival."],["[[Residual confounding]]","Residual confounding is something else: unmeasured factors that could still explain an association even after statistical adjustment."],["[[Adjusted odds ratio]]","Adjusted odds ratio is something else: a measure of association after accounting for confounders: 1 = no link, below 1 = lower odds, above 1 = higher odds."],["[[Cognitive restoration]]","Cognitive restoration is something else: recovery from attentional fatigue, which natural outdoor settings promote (Ramsden et al.)."],["[[EDI]]","EDI is something else: early Development Instrument: teacher ratings of kindergarten children across five developmental domains."]],"k":"Play: Joyful, actively engaging, spontaneous, voluntary, intrinsically motivated activity that is unrelated to immediate survival.","term":"Play","h":"Nobody makes you, nobody pays you, you just want to."},{"id":"s5q003","s":5,"o":0,"t":"T","sc":"playdef","q":"Which ==key term== matches this definition? “Doing something for its own sake, because the activity itself is rewarding.”","a":[["[[Intrinsic motivation]]","Yes. Intrinsic motivation = doing something for its own sake, because the activity itself is rewarding."],["[[Adjusted odds ratio]]","Adjusted odds ratio is something else: a measure of association after accounting for confounders: 1 = no link, below 1 = lower odds, above 1 = higher odds."],["[[Candy Witch finding]]","Candy Witch finding is something else: 66% of children believed a made-up ‘Candy Witch’ was real; belief was highest in OLDER children who were visited by her."],["[[EDI]]","EDI is something else: early Development Instrument: teacher ratings of kindergarten children across five developmental domains."],["[[Developmental vulnerability]]","Developmental vulnerability is something else: scoring as vulnerable on one or more of the EDI’s five domains at kindergarten; the outcome in Ramsden et al."]],"k":"Intrinsic motivation: Doing something for its own sake, because the activity itself is rewarding.","term":"Intrinsic motivation","h":"INtrinsic = the reason is INside the activity."},{"id":"s5q004","s":5,"o":0,"t":"T","sc":"playdef","q":"Which ==key term== does this example show? “Lina keeps drawing for hours even though no one is grading or praising her.”","a":[["[[Intrinsic motivation]]","Yes. Intrinsic motivation = doing something for its own sake, because the activity itself is rewarding."],["[[Sociodramatic play]]","Sociodramatic play is something else: pretend play with others, acting out roles in a shared story; what simple pretend develops into."],["[[Ethics of responsibility]]","Ethics of re
