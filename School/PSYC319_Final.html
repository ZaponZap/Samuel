<style>:root{--serif:'Cinzel',Georgia,serif;--sans:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
--bg:#F5F2EA;--bg2:#ECE7DA;--panel:#FFFFFF;--panel2:#F3F0E7;--text:#0C1A3C;--muted:#5B6787;--line:#DDD7C8;--line2:#C9C1AE;
--blue:#035AFC;--blue2:#3F82FF;--blued:#0A2F8F;--bluet:#E4EDFF;--gold:#E08220;--gold2:#F2A94F;--goldt:#FCEBD5;--goldd:#A85A0C;
--good:#178F57;--goodt:#DFF4E9;--bad:#D03A32;--badt:#FCE4E1;--ol:#0C1A3C;--shadow:0 1px 2px rgba(12,26,60,.06),0 10px 30px -14px rgba(12,26,60,.22);
--mas:#035AFC;--teal:#6FA5FF;--vio:#0A2F8F;--rose:#E08220;--lit:#F2A94F;--bloom:#F7C98A;--mut:#A9B3CC;--bark:#96602A;--faint:#C9D2E6;
--sky1:#DCE8FF;--sky2:#F6F1E4;--ground:#EAD9B8;--wall:#F4F1E9;--floor:#E3D5B8}
:root[data-theme=dark]{--bg:#050A1A;--bg2:#081028;--panel:#0C1633;--panel2:#111D42;--text:#EAEFFF;--muted:#96A3CC;--line:#1F2D5C;--line2:#2D3E78;
--blue:#4D8BFF;--blue2:#7AA8FF;--blued:#A9C6FF;--bluet:#0F2256;--gold:#F29B3F;--gold2:#F7B869;--goldt:#33210C;--goldd:#F7B869;
--good:#3FCB8A;--goodt:#0C2E22;--bad:#FF6D63;--badt:#3A1513;--ol:#02060F;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px -16px rgba(0,0,0,.7);
--mas:#3F82FF;--teal:#8DB8FF;--vio:#2A4FB8;--rose:#F29B3F;--lit:#F7B869;--bloom:#F9D29C;--mut:#56628A;--bark:#B07A3C;--faint:#2D3E78;
--sky1:#0B1B4A;--sky2:#0A1230;--ground:#1A2553;--wall:#0F1A3D;--floor:#1C2752}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 var(--sans);min-height:100vh;
background-image:radial-gradient(1200px 500px at 50% -120px,color-mix(in srgb,var(--blue) 13%,transparent),transparent 70%),radial-gradient(700px 300px at 85% 0,color-mix(in srgb,var(--gold) 9%,transparent),transparent 70%);background-repeat:no-repeat}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.04em;margin:0;text-wrap:balance}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}
/* top bar */
.bar{position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--line)}
.bar-in{max-width:900px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:9px;font:600 .86rem var(--serif);letter-spacing:.16em;text-transform:uppercase;margin-right:auto;padding:4px 6px 4px 0}
.brand svg{width:26px;height:26px;flex:none}
.ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);transition:.18s}
.ib:hover{border-color:var(--blue);transform:translateY(-1px)}.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib.off{color:var(--muted);opacity:.6}.ib.on{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
/* hero */
.hero{position:relative;margin:18px 0 6px;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--sky1),var(--sky2));box-shadow:var(--shadow)}
.hero svg{display:block;width:100%;height:auto}
.hero-t{text-align:center;padding:22px 12px 0}
.hero-t .k{font:500 .68rem var(--sans);letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.hero-t h1{font-size:clamp(1.35rem,4.6vw,2.3rem);letter-spacing:.2em;margin-top:4px;color:var(--text)}
.c-body{fill:color-mix(in srgb,var(--blue) 82%,#fff)}.c-body2{fill:color-mix(in srgb,var(--blue) 62%,var(--panel))}.c-body3{fill:color-mix(in srgb,var(--blue) 40%,var(--panel))}
[data-theme=dark] .c-body{fill:#12307F}[data-theme=dark] .c-body2{fill:#0F2769}[data-theme=dark] .c-body3{fill:#0C1F55}
.c-edge{fill:none;stroke:color-mix(in srgb,var(--blue2) 80%,#fff);stroke-width:1;opacity:.75}
.c-roof{fill:var(--blued)}[data-theme=dark] .c-roof{fill:#3F82FF}
.c-win{fill:color-mix(in srgb,var(--panel) 55%,var(--blue));opacity:.55;transition:fill .6s,opacity .6s}
.c-win.on{fill:var(--gold2);opacity:1;filter:drop-shadow(0 0 3px var(--gold))}
.c-halo{fill:none;stroke:var(--gold);stroke-width:2}.c-halo2{fill:none;stroke:var(--gold2);stroke-width:1;opacity:.5}
.c-ray{stroke:var(--gold2);stroke-width:1;opacity:.35}.c-fin{fill:var(--gold)}
.c-base{fill:color-mix(in srgb,var(--blue) 22%,var(--panel))}[data-theme=dark] .c-base{fill:#0A1947}
.c-mist{fill:var(--panel);opacity:.5}[data-theme=dark] .c-mist{opacity:.08}
.halo-spin{transform-origin:400px 62px;transform-box:view-box;animation:spin 60s linear infinite}
.orb{animation:bob 7s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-5px)}}
/* generic */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 .72rem var(--sans);letter-spacing:.06em;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted);white-space:nowrap}
.chip.b{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 35%,var(--line));background:var(--bluet)}
.chip.g{color:var(--goldd);border-color:color-mix(in srgb,var(--gold) 45%,var(--line));background:var(--goldt)}
button.chip{cursor:pointer}button.chip.act{background:var(--blue);color:#fff;border-color:var(--blue)}
.sub{color:var(--muted);font-size:.92rem}.ctr{text-align:center}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px}.sec-h h2{font-size:1rem;letter-spacing:.2em;text-transform:uppercase}.sec-h .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:13px;font:600 .92rem var(--sans);letter-spacing:.02em;border:1px solid var(--line2);background:var(--panel);transition:.18s}
.btn:hover{transform:translateY(-1px);border-color:var(--blue)}
.btn.pri{background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;border-color:transparent;box-shadow:0 8px 20px -10px var(--blue)}
[data-theme=dark] .btn.pri{background:linear-gradient(180deg,#2F78FF,#035AFC)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1600;border-color:transparent;box-shadow:0 8px 20px -10px var(--gold)}
.btn.sm{padding:7px 12px;font-size:.82rem;border-radius:10px}.btn:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}
.stat b{display:block;font:600 1.5rem var(--serif);color:var(--blue)}.stat.g b{color:var(--gold)}.stat span{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
/* towers */
.towers{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tower{position:relative;text-align:left;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.tower:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--blue),var(--gold))}
.tower h3{font-size:1.02rem}.tower .u{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.wins{display:flex;flex-wrap:wrap;gap:3px}
.wn{width:9px;height:13px;border-radius:5px 5px 1.5px 1.5px;background:var(--panel2);border:1px solid var(--line2)}
.wn.l{background:var(--blue);border-color:var(--blue)}.wn.g{background:var(--gold2);border-color:var(--gold);box-shadow:0 0 6px color-mix(in srgb,var(--gold) 70%,transparent)}
.meter{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;display:flex}.meter i{display:block;height:100%;background:var(--blue);transition:width .5s}.meter i.g{background:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tiles.five{grid-template-columns:repeat(5,1fr)}.tower.wide{grid-column:1/-1}
.tile{text-align:left;padding:15px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);transition:.2s;display:flex;flex-direction:column;gap:6px;min-height:118px}
.tile:hover{transform:translateY(-3px);border-color:var(--blue)}.tile svg{width:26px;height:26px;stroke:var(--blue);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tile b{font:600 .9rem var(--serif);letter-spacing:.08em}.tile span{font-size:.8rem;color:var(--muted);line-height:1.35}
.tile.feat{grid-column:span 2;background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 92%,#000),var(--blued));color:#fff;border-color:transparent}
[data-theme=dark] .tile.feat{background:linear-gradient(135deg,#0B3FC0,#0A1E66)}
.tile.feat svg{stroke:var(--gold2)}.tile.feat span{color:rgba(255,255,255,.8)}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin:16px 0 10px}.qtop .t{font:600 .8rem var(--serif);letter-spacing:.16em;text-transform:uppercase}
.prog{flex:1;height:5px;border-radius:9px;background:var(--panel2);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .4s}
.qcard{padding:18px 18px 20px}
.scene{max-width:600px;margin:12px auto 4px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--panel2)}
.scene svg{display:block;width:100%;height:auto}
.scap{font-size:.76rem;color:var(--muted);padding:6px 12px 8px;display:flex;gap:8px;align-items:center;min-height:30px;border-top:1px solid var(--line)}
.scap b{color:var(--gold);font-weight:600;white-space:nowrap}.scap span{flex:1}
.stem{font:500 1.08rem/1.5 var(--sans);margin:14px 0 14px}
mark.hl{background:linear-gradient(180deg,transparent 62%,color-mix(in srgb,var(--gold) 45%,transparent) 62%);color:inherit;padding:0 1px}
.blank{display:inline-block;min-width:74px;border-bottom:2px solid var(--gold);text-align:center;font-weight:600;padding:0 6px;color:var(--gold)}
.blank.fill{color:var(--good);border-color:var(--good);animation:pop .4s}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);transition:.16s;line-height:1.42}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--bluet)}
.opt .l{flex:none;width:26px;height:26px;border-radius:8px 8px 3px 3px;display:grid;place-items:center;font:600 .78rem var(--serif);border:1px solid var(--line2);color:var(--muted);margin-top:-1px}
.opt.sel{border-color:var(--blue);background:var(--bluet)}.opt.sel .l{background:var(--blue);color:#fff;border-color:var(--blue)}
.opt.ok{border-color:var(--good);background:var(--goodt)}.opt.ok .l{background:var(--good);color:#fff;border-color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--badt)}.opt.no .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.72}.opt:disabled{cursor:default;color:inherit}
.rev .opt .kt{font-weight:600;color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent);border-radius:5px;padding:0 3px}
.rev .opt.ok .kt{color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
.fb{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;animation:rise .35s both}
.verdict{font:600 1rem var(--serif);letter-spacing:.08em;display:flex;align-items:center;gap:8px}.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.kbox{margin-top:10px;padding:12px 14px;border-radius:13px;background:var(--bluet);border:1px solid color-mix(in srgb,var(--blue) 28%,var(--line))}
.hbox{margin-top:8px;padding:11px 14px;border-radius:13px;background:var(--goldt);border:1px solid color-mix(in srgb,var(--gold) 38%,var(--line))}
.kbox .lb,.hbox .lb,.whys .lb{font:600 .66rem var(--sans);letter-spacing:.18em;text-transform:uppercase;display:block;margin-bottom:3px;color:var(--blue)}.hbox .lb{color:var(--goldd)}
.whys{margin-top:12px}.whys .lb{color:var(--muted)}
.why{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.93rem}.why:last-child{border:0}
.why .l{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font:600 .7rem var(--serif);color:#fff;background:var(--bad)}.why.ok .l{background:var(--good)}
.why b.o{color:var(--bad)}.why.ok b.o{color:var(--good)}
.why b.x{font-weight:600;color:var(--bad)}.why.ok b.x{color:var(--good)}
.qnav{display:flex;gap:10px;align-items:center;margin-top:16px}
.kbd{font:500 .7rem var(--sans);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
/* exam */
.exbar{display:flex;align-items:center;gap:10px;margin:14px 0 8px;flex-wrap:wrap}
.timer{font:600 1.05rem var(--serif);letter-spacing:.1em;padding:6px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel)}.timer.low{color:var(--bad);border-color:var(--bad)}
.navg{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin:10px 0}
.nb{height:38px;border-radius:9px 9px 4px 4px;border:1px solid var(--line2);background:var(--panel);font:600 .78rem var(--sans);position:relative}
.nb.a{background:var(--bluet);border-color:var(--blue);color:var(--blue)}.nb.cur{outline:2px solid var(--gold);outline-offset:1px}.nb.f:after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.nb.ok{background:var(--goodt);border-color:var(--good);color:var(--good)}.nb.no{background:var(--badt);border-color:var(--bad);color:var(--bad)}
.ring{width:150px;height:150px;margin:6px auto;position:relative;display:grid;place-items:center}.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font:600 2rem var(--serif)}.ring span{display:block;font-size:.74rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.brk{display:grid;gap:8px;margin-top:10px}.brk .r{display:grid;grid-template-columns:130px 1fr 54px;gap:10px;align-items:center;font-size:.88rem}
.rv-item{border:1px solid var(--line);border-radius:16px;margin-top:12px;background:var(--panel);overflow:hidden}
.rv-item>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}.rv-item>summary::-webkit-details-marker{display:none}
.rv-item .n{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:600 .78rem var(--sans);color:#fff;background:var(--bad)}.rv-item.ok .n{background:var(--good)}
.rv-item .in{padding:0 14px 14px}
/* lists */
.obj{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.obj:last-child{border:0}
.obj p{margin:0;font-size:.95rem}.obj .m{grid-column:1/2}
.srch{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font:inherit;outline:none}.srch:focus{border-color:var(--blue)}
.terms{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.term{padding:14px 15px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.term h4{margin:0 0 4px;font:600 .98rem var(--serif);letter-spacing:.05em;color:var(--blue)}.term p{margin:4px 0 0;font-size:.9rem}.term .e{color:var(--muted)}.term .h{color:var(--goldd)}
.term .e b,.term .h b{font:600 .62rem var(--sans);letter-spacing:.16em;text-transform:uppercase;margin-right:6px}
.flash{perspective:1200px;margin:16px auto;max-width:560px;height:300px;cursor:pointer}
.flash-in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d}.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;overflow:auto}
.face.bk{transform:rotateY(180deg);background:linear-gradient(180deg,var(--panel),var(--bluet))}
.face h3{font-size:1.5rem;color:var(--blue)}.face p{margin:8px 0 0}
.pchips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.pc{padding:9px 13px;border-radius:12px;border:1.5px solid var(--line2);background:var(--panel);font-size:.92rem;text-align:left;transition:.15s}
.pc.sel{border-color:var(--blue);background:var(--bluet)}.pc.ok{border-color:var(--good);background:var(--goodt);color:var(--good);font-weight:600}
.pc.no{border-color:var(--bad);background:var(--badt);color:var(--bad);text-decoration:line-through}.pc.miss{border-color:var(--gold);background:var(--goldt);border-style:dashed}
.read{margin-top:14px}.read h3{font-size:1.05rem;color:var(--blue)}.read .cite{font-size:.8rem;color:var(--muted);margin:4px 0 10px}
.rrow{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:.93rem}.rrow b{font:600 .7rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding-top:3px}

<script>'use strict';
var D = {"S":[{"id":1,"unit":"Play","name":"Tower of Play","blurb":"What play is, its types and benefits, pretend, risky and outdoor play, Ramsden et al. (2026), and applying it all."},{"id":2,"unit":"Schooling, Part 1","name":"Hall of Lessons","blurb":"Why school exists, teachers and expectations, academic work, SEL, playful learning, and Fraction Ball."},{"id":3,"unit":"Schooling, Part 2","name":"The Great Academy","blurb":"Achievement goals, school size, type, calendar and start times, tracking, diversity, and Leer et al. (2025)."},{"id":4,"unit":"Juveniles & the Law","name":"Court of Justice","blurb":"Blame and punishment, penal proportionality, the adolescent mind and brain, and where the law draws its lines."},{"id":5,"unit":"Key Terms","name":"The Codex Spire","blurb":"Every key term, tested by definition and by example."}],"O":[{"i":0,"s":1,"t":"Define play; identify stages in the development of play","w":"Lecture","short":"Defining play & stages"},{"i":1,"s":1,"t":"Identify different types of play","w":"Lecture","short":"Types of play"},{"i":2,"s":1,"t":"Discuss benefits that have been linked with play","w":"Lecture","short":"Benefits of play"},{"i":3,"s":1,"t":"Define pretend play, discuss the development of pretend play and the links to child outcomes","w":"Lecture","short":"Pretend play"},{"i":4,"s":1,"t":"Define risky play, identify types of risky play, and discuss the links to child outcomes","w":"Lecture; Ramsden et al., 2026","short":"Risky play"},{"i":5,"s":1,"t":"Define outdoor play, discuss the links to child outcome","w":"Lecture; Ramsden et al., 2026","short":"Outdoor play"},{"i":6,"s":1,"t":"Explore whether play and screentime are associated with vulnerability in children’s entry into school; describe the background, methods, results, implications and limitations of Ramsden et al.’s study on early childhood experiences","w":"Ramsden et al., 2026","short":"Ramsden et al. (2026)"},{"i":7,"s":1,"t":"Consider how research on play might be applied into the real world; discuss challenges to application","w":"Lecture","short":"Applying play research"},{"i":8,"s":2,"t":"Consider why children go to school","w":"Lecture","short":"Why school?"},{"i":9,"s":2,"t":"Discuss teacher quality, relationships, and teacher expectations","w":"Lecture","short":"Teachers & expectations"},{"i":10,"s":2,"t":"Describe how features of academic work can impact students","w":"Lecture","short":"Academic work"},{"i":11,"s":2,"t":"Identify SEL programs; discuss why such programs may be linked with positive outcomes","w":"Lecture","short":"SEL programs"},{"i":12,"s":2,"t":"Consider how active and playful learning may be beneficial","w":"Lecture; Bustamante et al., 2022","short":"Active & playful learning"},{"i":13,"s":2,"t":"Describe the background, methods, results, implications and limitations of Bustamante et al.’s study on Fraction Ball as a playful approach to learning","w":"Bustamante et al., 2022","short":"Bustamante et al. (2022)"},{"i":14,"s":3,"t":"Contrast mastery and relative-ability achievement goals, and discuss how practices may emphasize different achievement goals","w":"Lecture","short":"Achievement goals"},{"i":15,"s":3,"t":"Explain the influence of school size, school type, school year structure, and school start times","w":"Lecture","short":"Size, type, year & start times"},{"i":16,"s":3,"t":"Define ability tracking, and analyze its effect on students","w":"Lecture","short":"Ability tracking"},{"i":17,"s":3,"t":"Discuss the impacts of the student body and school diversity","w":"Lecture","short":"School diversity"},{"i":18,"s":3,"t":"Consider how school diversity ideologies may affect students: describe the motivation, results, implications, and limitations of Leer, Gaither, & Gassman-Pines (2025)'s study","w":"Leer, Gaither, & Gassman-Pines, 2025","short":"Leer et al. (2025)"},{"i":19,"s":4,"t":"Consider the question of whether adolescents accused of crimes should be held to the same standards of blame and punishments as adults","w":"Lecture; Steinberg & Icenogle, 2019","short":"Same blame as adults?"},{"i":20,"s":4,"t":"Discuss the concept of penal proportionality, and identify the 3 factors that can mitigate criminal responsibility","w":"Lecture","short":"Penal proportionality & mitigation"},{"i":21,"s":4,"t":"Describe the development of cognitive and psychosocial skills during adolescence, and links to related neurological changes. Consider how these developments may relate to risky behaviour","w":"Lecture; Steinberg & Icenogle, 2019","short":"Cognitive, psychosocial & brain development"},{"i":22,"s":4,"t":"Debate when and how the legal system should define maturity","w":"Lecture; Steinberg & Icenogle, 2019","short":"Defining maturity"}],"Q":[{"id":"s1q001","s":1,"o":0,"t":"L","sc":"playdef","q":"Which set matches how lecture ==defined play==?","a":[["[[Joyful]], [[voluntary]], [[intrinsically motivated]], unrelated to survival","These are straight off the slide: joyful, active engagement, spontaneous, voluntary, intrinsically motivated, unrelated to immediate survival."],["[[Structured]], [[adult-led]], goal-directed, tied to clear learning outcomes","That describes a lesson. Play is spontaneous and voluntary, so an adult running it toward outcomes misses the point."],["Joyful, [[required]], [[externally rewarded]], essential for staying alive","Three of these flip the definition: play is voluntary, intrinsically motivated, and UNrelated to immediate survival."],["[[Competitive]], rule-bound, [[rewarded]], practised to build a future skill","Games can be competitive, but lecture’s definition has nothing about competing, rewards, or training for later."],["Calm, [[quiet]], [[passive]], scheduled at regular times during the day","Play involves ACTIVE engagement and is spontaneous. Passive and scheduled is the opposite."]],"k":"Play = joyful · active engagement · spontaneous · voluntary · intrinsically motivated · unrelated to immediate survival.","h":"Think of recess. Nobody makes you, nobody pays you, you don’t need it to survive this minute... you just WANT to. That’s play."},{"id":"s1q002","s":1,"o":0,"t":"L","sc":"playdef","q":"Leo freely chooses to build a block tower every recess, but only because his dad pays him $1 per tower. Which ==feature of play== is most clearly missing?","a":[["It isn’t [[intrinsically motivated]]","Right. He’s doing it for the dollar (an outside reward), so the motivation isn’t coming from the activity itself."],["It isn’t [[voluntary]]","He freely chooses to do it, so it IS voluntary. The problem is WHY he chooses it."],["It isn’t [[active engagement]]","Building a tower is hands-on and active. Engagement isn’t the issue here."],["It isn’t [[unrelated to survival]]","Stacking blocks has nothing to do with staying alive, so this feature is still met."],["It isn’t [[spontaneous]]","Nothing says it’s scheduled or forced. The giveaway detail is the $1 payment."]],"k":"Intrinsically motivated = you do it for its own sake. The activity IS the reward.","h":"Intrinsic = INside. If the reason lives outside the activity (money, stickers, grades), it’s extrinsic."},{"id":"s1q003","s":1,"o":0,"t":"L","sc":"playdef","q":"Play is described as ____ to immediate survival.","a":[["[[unrelated]]","Yes. Play isn’t about food, shelter or safety right now, which is part of what makes it play."],["[[essential]]","Play has lots of benefits, but the definition says it is NOT tied to surviving in the moment."],["[[secondary]]","Close in spirit, but lecture’s wording is ‘unrelated to immediate survival’, not ‘secondary’."],["[[opposed]]","Play doesn’t work against survival. It just isn’t serving it in the moment."],["[[dedicated]]","That would make play a survival behaviour, which is the opposite of the definition."]],"k":"Unrelated to immediate survival: play isn’t done to meet an urgent need.","h":"A lion cub wrestling its sibling isn’t hunting. It’s not eating, hiding or fleeing. That ‘pointless right now’ quality = play.","b":1},{"id":"s1q004","s":1,"o":0,"t":"L","sc":"playdef","q":"What does it mean to say play is ==intrinsically motivated==?","a":[["The child plays because the [[activity itself]] is rewarding","Exactly. No prize needed; the doing is the reward."],["The child plays because an [[adult]] has set it up for them","That’s about who organizes it. Intrinsic motivation is about the reason coming from inside the child."],["The child plays to earn [[praise or prizes]] afterwards","That’s extrinsic motivation: the reward sits outside the activity."],["The child plays to [[practise skills]] needed for school","Skill-building may happen, but that’s a side effect, not why the child is doing it."],["The child plays because [[other children]] expect them to","Doing it for social pressure is still an outside reason, so it isn’t intrinsic."]],"k":"Intrinsic motivation = doing something for its own sake.","h":"You re-watch your comfort show because you like it, not because someone’s grading you. Same idea."},{"id":"s1q005","s":1,"o":0,"t":"L","sc":"stages","q":"Lecture’s slide on the ==development of play== showed play moving in which general direction?","a":[["From [[non-social]] play toward [[social]] play","Yes. The slide’s two labels were ‘non-social play’ and ‘social play’: kids start out playing alone and move toward playing with others."],["From [[social]] play toward [[non-social]] play","Reversed. Babies and toddlers start with non-social play; playing WITH others comes later."],["From [[pretend]] play toward [[physical]] play","Those are types of play, not the developmental direction lecture showed."],["From [[risky]] play toward [[guided]] play","These are types of play too. The stage slide was about how social the play is."],["From [[outdoor]] play toward [[indoor]] play","That’s the worrying trend over generations, not the developmental sequence within a child."]],"k":"Development of play: non-social play → social play.","h":"First you play NEAR the world, then WITH the world. Alone → alongside → together."},{"id":"s1q006","s":1,"o":0,"t":"L","sc":"stages","q":"Two-year-old Ana pushes her own truck next to Ben, who pushes his own truck. They use similar toys side by side but never interact. In the classic stages of play, this is…","a":[["[[parallel]] play","Yes: playing beside another child, with similar toys, but not WITH them. Like two parallel lines that never meet."],["[[solitary]] play","Solitary play is playing alone with no attention to others nearby. Ana is clearly playing alongside Ben."],["[[onlooker]] play","An onlooker watches others play without playing themselves. Ana is busy with her own truck."],["[[associative]] play","Associative play involves real interaction, like sharing toys or chatting. These two never interact."],["[[cooperative]] play","Cooperative play has a shared goal and roles. There’s no shared anything here."]],"k":"Parallel play = side by side, similar activity, no interaction. It’s the bridge from non-social to social play.","h":"Two people on treadmills at the gym. Same activity, same room, zero teamwork. Parallel."},{"id":"s1q007","s":1,"o":0,"t":"L","sc":"stages","q":"Four preschoolers are at the sand table. They chat, pass each other shovels and comment on each other’s castles, but everyone builds their own thing with no shared plan. This is…","a":[["[[associative]] play","Right: they interact and share materials, but there’s no common goal or organized roles."],["[[cooperative]] play","Cooperative play needs a shared goal (‘let’s build ONE castle, you dig, I stack’). Here everyone does their own thing."],["[[parallel]] play","In parallel play kids don’t interact. These kids are chatting and trading shovels."],["[[onlooker]] play","Onlookers only watch. All four are actively building."],["[[solitary]] play","Solitary play is alone and unaware of others. This group is clearly social."]],"k":"Associative play = interacting and sharing, but no shared goal. Cooperative adds the shared goal and roles.","h":"Associative = a group chat where everyone’s doing their own homework. Cooperative = an actual group project."},{"id":"s1q008","s":1,"o":0,"t":"L","sc":"stages","q":"Which child is showing ==cooperative play==?","a":[["Kids who agree to build one fort and [[split up the jobs]]","Yes. A shared goal plus organized roles is what makes play cooperative."],["A child who [[watches]] a tag game and comments from the side","That’s onlooker play: interested, maybe talking, but not joining in."],["Two kids drawing at one table who [[never speak]] or share","Side by side with no interaction is parallel play."],["Kids who [[trade crayons]] while each drawing a separate picture","They interact and share, but with no common goal, so that’s associative play."],["A toddler [[alone]] in the corner stacking rings by herself","Playing alone is solitary play."]],"k":"Cooperative play = shared goal + coordinated roles. It’s the most social stage.","h":"If the play would fall apart when one kid leaves (because they had a job), it’s cooperative."},{"id":"s1q009","s":1,"o":0,"t":"L","sc":"stages","q":"Which three belong to the ==non-social== side of the classic play stages?","a":[["[[Unoccupied]], [[solitary]] and [[onlooker]] play","Right. In all three the child is not yet playing alongside or with other children."],["[[Parallel]], [[associative]] and [[cooperative]] play","These are the social side: beside others, then with others, then with a shared goal."],["[[Solitary]], [[parallel]] and [[cooperative]] play","This mixes both sides. Parallel and cooperative involve other children."],["[[Onlooker]], [[associative]] and [[pretend]] play","Associative is social, and pretend play is a TYPE of play, not a stage."],["[[Unoccupied]], [[guided]] and [[parallel]] play","Guided play is a type of play, and parallel play sits on the social side."]],"k":"Non-social: unoccupied → solitary → onlooker. Social: parallel → associative → cooperative.","h":"U-S-O then P-A-C. ‘U SO PAC-ked with friends by the end.’"},{"id":"s1q010","s":1,"o":1,"t":"L","sc":"types","q":"Which of these was on lecture’s list of ==types of play==?","a":[["[[Guided]] play","Yes. The list: games, object play, guided play, physical (rough-and-tumble) play, pretend play, risky play, outdoor/nature play."],["[[Parallel]] play","Trap! Parallel play is a STAGE in the development of play, not one of the listed types."],["[[Onlooker]] play","Also a stage (watching others play), not a type from the list."],["[[Digital]] play","Screens came up as something that may displace play, not as one of lecture’s play types."],["[[Passive]] play","Play was defined as ACTIVE engagement, and ‘passive play’ wasn’t on the list."]],"k":"Types of play (lecture): games · object · guided · physical (rough-and-tumble) · pretend · risky · outdoor/nature. And more!","h":"Stages = HOW social the play is. Types = WHAT kind of play it is. Don’t mix the two lists."},{"id":"s1q011","s":1,"o":1,"t":"L","sc":"types","q":"In lecture’s list of play types, ==rough-and-tumble play== was given as the example of…","a":[["[[physical]] play","Yes: the slide read ‘Physical play (rough-and-tumble play)'."],["[[object]] play","Object play is about exploring and using things, like blocks or cups."],["[[guided]] play","Guided play involves an adult supporting child-led play toward a goal."],["[[pretend]] play","Pretend play is acting ‘as-if’. Play wrestling isn’t make-believe by itself."],["[[games]]","Games are play with rules, like board games or tag."]],"k":"Physical play’s example in lecture = rough-and-tumble. (Rough-and-tumble also shows up as a kind of risky play.)","h":"Rough-and-tumble = puppies wrestling. Bodies, not objects or stories."},{"id":"s1q012","s":1,"o":1,"t":"L","sc":"types","q":"A toddler spends ten minutes stacking cups, knocking them over, and testing which ones fit inside each other. Which type of play is this?","a":[["[[Object]] play","Right: exploring and manipulating things to see what they do."],["[[Pretend]] play","Nothing is standing in for something else and there’s no ‘as-if’, so it isn’t pretend."],["[[Guided]] play","No adult is steering toward a learning goal here; the toddler is exploring alone."],["[[Risky]] play","Stacking cups has no thrill, uncertainty or chance of injury."],["[[Physical]] play","Physical play means whole-body activity like running or rough-and-tumble."]],"k":"Object play = exploring and using objects.","h":"If the star of the show is the THING (cups, blocks, a box), it’s object play."},{"id":"s1q013","s":1,"o":1,"t":"L","sc":"types","q":"A teacher sets out ramps and marbles with a goal in mind (learning about speed), then lets children explore freely while asking questions like ‘what happens if it’s steeper?’. This is best described as…","a":[["[[guided]] play","Yes: the child leads the play, and an adult gently supports it toward a learning goal."],["[[object]] play","Objects are involved, but the defining feature here is the adult’s supportive role and learning goal."],["[[risky]] play","Rolling marbles down ramps doesn’t involve thrill or risk of injury."],["[[pretend]] play","Nobody is acting ‘as-if’ or using symbols for something else."],["[[games]]","There are no set rules or winners here, just supported exploration."]],"k":"Guided play = child-led play + adult support toward a learning goal. (Fraction Ball is a playful-learning cousin of this idea.)","h":"Free play = kid drives alone. Direct instruction = adult drives. Guided play = kid drives, adult is the GPS."},{"id":"s1q014","s":1,"o":1,"t":"L","sc":"types","q":"After listing the many types of play, what did lecture say about them?","a":[["Each type is thought to carry [[its own benefits]]","Yes, that was the callout on the slide: ‘Each thought to carry its own benefits!’"],["Only [[pretend play]] has solid evidence of benefits","Lecture covered benefits for pretend, risky AND outdoor play, among others."],["All types lead to the [[same benefits]] in the same way","The point was the opposite: different types are thought to bring different benefits."],["Types matter [[less than the amount]] of play overall","Ramsden et al. actually suggest the quality and kind of play can matter more than sheer amount."],["Children should master [[one type]] before the next","Types aren’t a sequence to complete. Kids mix them constantly."]],"k":"Many types of play, each thought to carry its own benefits.","h":"Like food groups: each one feeds something different."},{"id":"s1q015","s":1,"o":2,"t":"L","sc":"benefits","q":"Which statement matches the ==benefits linked with play== in lecture?","a":[["Linked with [[brain development]] and reduced [[stress]]","Yes. Lecture listed more advanced brain development, reduced stress, improved cognitive skills, social skills and mental health, and benefits for learning."],["Proven to [[cause]] higher [[IQ]] in randomized trials","Most play research is correlational, and lecture never claimed play is proven to cause IQ gains."],["Linked with [[social]] gains but [[worse]] academic learning","Lecture said play is beneficial FOR learning, not harmful to it."],["Helpful for [[toddlers]] but [[unrelated]] to mental health","Play was correlated with better mental health, and benefits weren’t limited to toddlers."],["Linked with [[physical]] benefits only, not [[cognitive]] ones","Play was correlated with improved cognitive skills too."]],"k":"Play is linked with: brain development · less stress · better cognitive skills, social skills, mental health · learning · maybe trying harder things.","h":"Notice the careful words: ‘linked with’, ‘correlated with’. That wording matters on this exam."},{"id":"s1q016","s":1,"o":2,"t":"L","sc":"rulec","q":"In Rule et al. (2024), children played a game either ==to win stickers== or just ==to have fun==, and could pick versions that made the game easier or harder. What does this study suggest?","a":[["Playing for [[fun]] may push us to choose [[harder]] challenges","Yes. That’s lecture’s point: play ‘may push us towards trying harder things’. When the goal is fun, harder versions are more appealing."],["Playing for [[stickers]] pushed children to choose [[harder]] versions","When there’s a prize to win, the smart move is the EASY version. The harder choices came with playing for fun."],["Children picked the [[easiest]] version in [[both]] conditions","The goal changed their choices, which is the whole finding."],["Children played [[longer]] only when [[rewards]] were offered","The study was about difficulty choices, and the playful goal is what encouraged challenge."],["The [[reason]] for playing made [[no difference]] to choices","It did make a difference: fun vs. winning led to different difficulty choices."]],"k":"Rule et al. (2024): play to win → pick easy. Play for fun → more willing to pick hard. Play may push us toward trying harder things.","h":"If you’re playing Mario Kart for money you pick the easy track. If you’re playing for fun you go ‘Rainbow Road, let’s GO.’"},{"id":"s1q017","s":1,"o":2,"t":"L","sc":"rulec","q":"Two siblings get the same ring-toss game. Maya is told ‘just have fun with it.’ Noor is told ‘every ring you land earns a prize.’ Based on Rule et al. (2024), who is more likely to step back and throw from farther away?","a":[["[[Maya]], because playing for fun makes harder versions appealing","Right. With no prize at stake, making it harder is part of the fun."],["[[Noor]], because prizes make children want a bigger challenge","A prize makes kids want to WIN, so they tend to make the game easier, not harder."],["[[Both]] equally, because difficulty choices depend on age only","The study showed the goal (fun vs. winning) changes difficulty choices."],["[[Neither]], because children avoid harder versions of games","Children do pick harder versions, especially when playing for fun."],["[[Noor]], because rewards increase intrinsic motivation to try","Prizes are extrinsic motivation, and they pull kids toward the easy, safe option."]],"k":"Fun goal → harder choices. Winning goal → easier choices.","h":"Prize on the line = play it safe. Nothing on the line = ‘bet I can do it from WAY back here.’"},{"id":"s1q018","s":1,"o":2,"t":"L","sc":"benefits","q":"Play has been linked with more advanced ____ development.","a":[["[[brain]]","Yes: ‘Linked with more advanced brain development’ was the first benefit on the slide."],["[[moral]]","Moral development wasn’t one of the listed links."],["[[pubertal]]","Play wasn’t linked with the timing of puberty."],["[[prenatal]]","Prenatal development happens before birth, so play can’t affect it."],["[[motor]]","Tempting, since outdoor play is tied to gross motor skills, but this general-benefits slide said ‘brain development’."]],"k":"First general benefit of play in lecture: more advanced brain development.","b":1},{"id":"s1q019","s":1,"o":2,"t":"LR","sc":"declinec","q":"Lecture showed time-use data (Hofferth & Sandberg, 2001; Mullan, 2019) and asked ‘why do you think…?’. What trend were these data showing?","a":[["A [[decline]] in children’s play over recent decades","Yes. The slide asked ‘Why do you think we have seen a decline of play in youth?’"],["A steady [[rise]] in children’s outdoor play since the 1970s","It’s the opposite. Ramsden et al. also note today’s children spend significantly less time outdoors than previous generations."],["A [[stable]] amount of play but a drop in homework time","The concern was play going down, not staying the same."],["A [[decline]] in screen time as outdoor play increased","Screens have gone up, and they’re one reason play has been squeezed out."],["A [[rise]] in risky play as supervision became looser","Supervision has become MORE risk-averse, shrinking chances for risky play."]],"k":"Children’s play (especially outdoor play) has declined across generations.","h":"Ask your parents how far from home they roamed at age 8. Then ask an 8-year-old now."},{"id":"s1q020","s":1,"o":2,"t":"R","sc":"decline","q":"According to Ramsden et al. (2026), which forces are driving childhood’s ‘shift indoors’?","a":[["Rapid [[urbanization]], [[safety concerns]], and use of [[screens]]","Yes. Those three are named as the drivers of children spending significantly less time outdoors than previous generations."],["Longer [[school days]], more [[homework]], and earlier [[bedtimes]]","Plausible-sounding, but these aren’t the drivers the article names."],["Colder [[climates]], fewer [[siblings]], and smaller [[families]]","Number of siblings was a covariate in the study, not a cause of the indoor shift."],["Stricter [[licensing]], lower [[incomes]], and less [[childcare]]","The article talks about licensing as a place to ADD play principles, not as the cause."],["More [[sports]], more [[lessons]], and busier [[parents]]","Structured activities aren’t what the article points to."]],"k":"Ramsden: the shift indoors is driven by urbanization, safety concerns and digital screens.","h":"City + scared + screens = kids inside."},{"id":"s1q021","s":1,"o":3,"t":"L","sc":"pretend","q":"How did lecture define ==pretend play==?","a":[["Play in which we act [[as-if]] and engage in [[make-believe]]","Yes: ‘In which we act as-if, engage in make-believe.’"],["Play in which we follow [[fixed rules]] to reach a [[winner]]","That describes games with rules."],["Play in which we [[explore objects]] to learn their [[properties]]","That’s object play."],["Play in which an [[adult guides]] us toward a [[learning goal]]","That’s guided play."],["Play in which we seek [[thrills]] despite a risk of [[injury]]","That’s risky play."]],"k":"Pretend play = acting ‘as-if’, make-believe.","h":"The two magic words: AS-IF. As if the couch is lava. As if I’m a doctor."},{"id":"s1q022","s":1,"o":3,"t":"L","sc":"pretend","q":"Around what age does ==pretend play== begin?","a":[["Around [[18–25 months]]","Yes, that’s the age range from lecture."],["Around [[6–9 months]]","Too early. Babies this age explore objects but don’t yet pretend."],["Around [[10–14 months]]","Still a bit early for acting ‘as-if’."],["Around [[3–4 years]]","By then pretend play is well underway and getting more social."],["Around [[5–6 years]]","Far too late. Kindergarteners are already doing elaborate sociodramatic play."]],"k":"Pretend play begins around 18–25 months.","h":"About a year and a half to two years old: right when words (also symbols!) take off."},{"id":"s1q023","s":1,"o":3,"t":"L","sc":"pretend","q":"Pretend play is linked to ==symbolic thought==. What is symbolic thought?","a":[["The ability to let a [[symbol]] stand for [[something else]]","Yes, that’s the definition from lecture."],["The ability to [[tell apart]] what is real from what is [[imagined]]","Kids can do this too, but that’s the real-vs-pretend distinction, not symbolic thought."],["The ability to [[take the perspective]] of another [[person]]","Perspective taking is a benefit associated with pretend play, not the definition of symbolic thought."],["The ability to [[delay a reward]] in favour of a [[later one]]","That’s delay of gratification (future orientation), from the juvenile justice unit."],["The ability to [[step back]] from one’s own [[feelings]]","That’s self-distancing, the idea behind the Batman effect."]],"k":"Symbolic thought = one thing stands for another thing.","h":"A banana is a phone. A stick is a sword. The word ‘dog’ is a dog. All symbols."},{"id":"s1q024","s":1,"o":3,"t":"L","sc":"pretend","q":"Two-year-old Kai holds a banana to his ear and says ‘Hello, Grandma?’. This behaviour most directly shows…","a":[["[[symbolic thought]]: the banana stands for a phone","Right. One thing (banana) represents something other than itself (phone)."],["[[sociodramatic play]]: he is acting out a shared story","Sociodramatic play involves acting out roles and stories with others. Kai is doing simple pretend alone."],["[[self-distancing]]: he is stepping outside himself","Self-distancing is about viewing your own situation from the outside, like in the Batman effect."],["[[fantasy belief]]: he thinks the banana is a real phone","Young children CAN tell real from pretend. Kai knows it’s a banana."],["[[object play]]: he is exploring what a banana can do","In object play the object is itself. Here the banana is standing in for something else."]],"k":"Using one object as if it were another = symbolic thought in action = simple pretend."},{"id":"s1q025","s":1,"o":3,"t":"L","sc":"sociodrama","q":"According to lecture, pretend play begins with simple pretend and develops into…","a":[["[[sociodramatic]] play","Yes: ‘Begins with simple pretend, develops to sociodramatic play’ (acting out roles and stories with others)."],["[[parallel]] play","Parallel play is a stage of social play in general, not where pretend play is headed."],["[[rough-and-tumble]] play","Rough-and-tumble is physical play (like play-wrestling). It isn’t a more advanced form of pretend."],["[[outdoor/nature]] play","Outdoor/nature play is defined by WHERE it happens, not by how pretend develops."],["[[solitary]] play","Pretend play becomes MORE social over time, not solitary."]],"k":"Pretend play: simple pretend → sociodramatic play.","h":"Socio (with people) + dramatic (acting). From ‘banana phone’ to ‘you be the customer, I’m the chef.’"},{"id":"s1q026","s":1,"o":3,"t":"L","sc":"sociodrama","q":"Which scene is the best example of ==sociodramatic play==?","a":[["Three kids play hospital as [[doctor, nurse and patient]]","Yes. Multiple children taking on roles in a shared make-believe story."],["A toddler pretends to [[drink]] from an empty toy cup alone","That’s simple pretend: one child, one ‘as-if’ action."],["Two kids race to [[finish]] the same puzzle before the timer","That’s a game with rules and a winner."],["A child [[lines up]] toy animals from smallest to largest","That’s object play: sorting and exploring objects."],["A child [[watches]] others play house but never joins in","That’s onlooker play."]],"k":"Sociodramatic play = pretend + social: shared story, assigned roles."},{"id":"s1q027","s":1,"o":3,"t":"L","sc":"culture","q":"What did lecture say about ==pretend play across cultures==?","a":[["It is thought to be [[universal]], with some [[differences]]","Yes. Universal, but with cultural differences in content, amount and parental encouragement."],["It appears mainly in [[Western]] families that [[buy toys]] for it","Pretend play is seen across cultures and families, not just Western ones."],["It looks [[identical]] everywhere in both [[content]] and amount","There are cultural differences: content reflects local values and amounts vary."],["It is [[absent]] in communities where parents [[don’t join in]]","It still occurs. Parent attitudes shape how much, but don’t switch it off."],["It emerges at very [[different ages]] depending on [[schooling]]","Lecture’s differences were about content, amount and parent eliciting, not age of onset."]],"k":"Pretend play: universal, BUT content reflects community values and traditions, amounts vary, and parents’ attitudes and eliciting shape it.","h":"Same game everywhere (pretending), different skins (what you pretend about)."},{"id":"s1q028","s":1,"o":3,"t":"L","sc":"culture","q":"In one community, children’s pretend play is full of cooking and market-selling scenes. In another, it is full of superhero battles. Which lecture point does this illustrate?","a":[["Pretend play often reflects a community’s [[values]]","Yes. What kids pretend ABOUT mirrors what their community does and values."],["Pretend play is [[not universal]] across human communities","Both communities ARE pretending, which supports universality."],["Pretend play depends on having [[commercial toys]] at home","Neither example requires toys, and lecture didn’t tie pretend to toys."],["Children cannot [[tell apart]] real life from pretend play","Children do distinguish real from pretend. This is about content, not confusion."],["The [[amount]] of pretend play is fixed by biology","Lecture said amounts vary and are shaped by parent attitudes and eliciting."]],"k":"Cultural differences in pretend: (1) content reflects values/traditions, (2) amounts vary, (3) shaped by parent attitudes and eliciting."},{"id":"s1q029","s":1,"o":3,"t":"L","sc":"culture","q":"Which factor did lecture say often seems to ==shape how much== children pretend?","a":[["[[Parent attitudes]] and how much parents [[elicit]] it","Yes: ‘Often seems shaped by parent attitudes and eliciting.’"],["The child’s [[birth order]] and number of [[siblings]]","Not mentioned for pretend play."],["The family’s [[income]] and number of [[toys]] at home","Lecture didn’t link pretend amounts to income or toys."],["The child’s [[IQ]] and early [[reading]] ability","Not what lecture pointed to."],["The [[school curriculum]] and class [[size]]","Pretend play starts around 18–25 months, long before school."]],"k":"Amounts of pretend play vary and seem shaped by parents’ attitudes and eliciting (inviting, prompting, joining).","h":"Eliciting = drawing it out. A parent who says ‘ooh, is that a rocket?’ gets more rockets."},{"id":"s1q030","s":1,"o":3,"t":"L","sc":"witch","q":"Can young children tell what is ==real from what is pretend==?","a":[["Yes, though they often still [[believe in fantasy entities]]","Right. Kids distinguish real from pretend/imagined (they get the behaviour and sensory properties), BUT often express belief in fantasy figures."],["No, they [[confuse]] the two until around age seven","Lecture said young children can and do distinguish real from pretend."],["Yes, and they [[reject]] fantasy figures by age three","Belief in fantasy entities is common well past three."],["No, which is why pretend play [[frightens]] most toddlers","Toddlers know pretend is pretend; that’s what makes it play."],["Only when an [[adult]] reminds them that it is pretend","They manage this on their own."]],"k":"Kids DO distinguish real vs pretend (behaviour and sensory properties)… but still often believe in fantasy entities.","h":"A kid knows the pretend cookie can’t be eaten. The same kid leaves real cookies for Santa."},{"id":"s1q031","s":1,"o":3,"t":"L","sc":"witch","q":"In the ‘Candy Witch’ studies (Woolley et al., 2004; Boerger et al., 2009), children heard about a witch who swaps Halloween candy for a toy. What was found?","a":[["About [[66%]] believed, most often [[older]] children she [[visited]]","Yes. 66% believed the Candy Witch was real, and belief was highest among OLDER children who were actually ‘visited’ (got the swap)."],["About [[10%]] believed, most often the [[youngest]] children","Belief was much more common, and it was older visited children who believed most."],["About [[66%]] believed, most often [[younger]] children [[not visited]]","Right number, wrong kids: older + visited were the most likely believers."],["About [[90%]] believed, with [[no difference]] by age or visit","It was 66%, and both age and being visited mattered."],["About [[33%]] believed, and only if [[parents]] also believed","The figure was 66%, and the key factors were age and being visited."]],"k":"Candy Witch: 66% believed she was real. Most likely to believe = OLDER children who were VISITED.","h":"It’s counterintuitive (older = more belief!), so it’s very testable. Older kids can weigh evidence, and a toy showing up overnight IS evidence."},{"id":"s1q032","s":1,"o":3,"t":"L","sc":"witch","q":"Why is it striking that ==older, visited== children were the most likely to believe in the Candy Witch?","a":[["We’d expect belief in fantasy figures to [[fade with age]]","Exactly. Older children are better thinkers, yet with ‘evidence’ (a visit) they believed MORE."],["We’d expect [[visited]] children to feel tricked and [[doubt]] it","Getting the candy-for-toy swap acted as evidence FOR the witch."],["It shows older children [[cannot separate]] real from pretend","They can. Belief in a fantasy entity isn’t the same as confusing pretend with reality."],["It shows belief depends only on [[parents’ honesty]]","The finding was about the child’s age and experience of a visit."],["It shows [[pretend play]] declines sharply after preschool","The study was about belief in a fantasy being, not amount of pretend play."]],"k":"Children can tell real from pretend AND still believe in fantasy entities, especially when evidence seems to support them."},{"id":"s1q033","s":1,"o":3,"t":"L","sc":"batman","q":"Which list matches the outcomes ==associated with pretend play== in lecture?","a":[["[[Self-control]], [[perspective taking]], [[language]], social competence","Yes: better self-control/emotion regulation/perseverance, improved perspective taking, greater language skills, cognitive capabilities, and social competence."],["[[Physical fitness]], [[risk assessment]], gross motor skill, fewer injuries","Those are tied to risky and outdoor play."],["[[Higher IQ]], [[earlier reading]], better grades, faster maths","Lecture’s list was broader skills, and never claimed pretend play raises IQ or grades."],["[[Less screen time]], [[better sleep]], lower stress, more exercise","These weren’t the pretend-play associations."],["[[Obedience]], [[rule following]], quietness, sitting still","Self-control is on the list, but obedience and quietness are not."]],"k":"Pretend play is associated with: self-control/emotion regulation/perseverance · perspective taking · language · cognitive capabilities · social competence.","h":"Playing ‘someone else’ is practice at BEING someone else: their words, their view, their feelings."},{"id":"s1q034","s":1,"o":3,"t":"L","sc":"batman","q":"In the ==Batman effect== studies (White et al., 2017; Grenell et al., 2019), what happened when children dressed up as a character and thought about a hard task as that character?","a":[["They [[persevered longer]] and [[regulated emotions]] better","Yes. Taking on the character helped them stick with it and manage their feelings."],["They [[quit sooner]] because the costume was distracting","The costume helped rather than distracted."],["They [[believed]] they really were the character","The benefit wasn’t confusion about who they were; it came from stepping back from themselves."],["They [[scored higher]] on language and vocabulary tests","The outcomes were perseverance and emotion regulation, not vocabulary."],["They [[worked faster]] but made many more mistakes","Speed and errors weren’t the finding."]],"k":"Batman effect: pretending to be a hard-working character → more perseverance + better emotion regulation.","h":"‘What would Batman do?’ Batman wouldn’t quit a boring task to go play iPad."},{"id":"s1q035","s":1,"o":3,"t":"L","sc":"batman","q":"Lecture suggested the Batman effect might work through which process?","a":[["[[Self-distancing]]: stepping back from your own view","Yes. ‘Benefits through self-distancing?’ Seeing the situation as someone else creates distance from your own frustration."],["[[Symbolic thought]]: letting one object stand for another","That’s what makes pretend possible, but it isn’t the mechanism proposed for the Batman effect."],["[[Rough-and-tumble]]: burning off energy before the task","Nothing physical was involved."],["[[Pygmalion effect]]: adults expecting more from the child","That’s about teacher expectations, from the schooling unit."],["[[Stage–environment fit]]: matching task to the child’s age","That’s a schooling concept about adolescents and school settings."]],"k":"Self-distancing = looking at your situation from the outside (as a character, or in third person).","h":"It’s easier to give your friend advice than yourself. Batman-mode makes YOU the friend."},{"id":"s1q036","s":1,"o":3,"t":"L","sc":"corr","q":"Pretend play is associated with self-control, language and social competence. What caution did lecture raise about these links?","a":[["It is unclear if it is [[necessary]], [[causal]], or [[correlated]]","Yes. The slide asked: is it necessary to develop these skills? Does it cause them? Or is it just correlated?"],["The links are [[proven causal]], but only in boys","Lecture questioned causality altogether and didn’t single out boys."],["The links [[disappear]] once children start school","That wasn’t the caution raised."],["The links hold only for [[sociodramatic]], not simple, pretend","Lecture didn’t split the evidence that way."],["The links were found only in [[one culture]]","Generalizability is a fair general worry, but the pretend-play slide’s caution was about cause vs. correlation."]],"k":"Associations ≠ proof. Pretend play may be necessary, may be causal, or may just travel with these skills.","h":"Kids with big vocabularies might just pretend more. Which way does the arrow point? We can’t tell from a correlation."},{"id":"s1q037","s":1,"o":3,"t":"L","sc":"corr","q":"A blog claims: ‘Kids who pretend more have better self-control, so schools must add daily pretend time to FIX self-control problems.’ What’s the best critique based on lecture?","a":[["The evidence is [[correlational]], so cause is not shown","Right. Maybe self-controlled kids pretend more, or a third factor drives both."],["Pretend play is [[unrelated]] to self-control in any study","There IS an association. The problem is jumping from association to cause."],["Self-control [[cannot change]] after the preschool years","Nothing in lecture says that; psychosocial skills keep developing through adolescence."],["Pretend play has been [[shown to harm]] academic learning","Lecture said play is beneficial for learning."],["Only [[risky play]] has any link with self-regulation","Pretend play is associated with self-control too."]],"k":"Correlation ≠ causation: the ‘ethics of responsibility’ question when applying play research."},{"id":"s1q038","s":1,"o":3,"t":"L","sc":"adultplay","q":"Lecture cited Smith & Lillard (2012) while asking ‘Why do we stop playing as we get older? Do we actually stop?’. What is the takeaway?","a":[["Play, including pretend, [[continues later]] than assumed","Yes. The point of the slide was to question the idea that play simply ends in early childhood."],["Pretend play [[ends abruptly]] when formal schooling begins","The slide was challenging exactly this kind of assumption."],["Adults who play show [[poorer]] self-control than non-players","Nothing like that was presented."],["Play in teens and adults has [[no benefits]] of any kind","Lecture asked whether benefits might hold for teens and adults too; it didn’t rule them out."],["Only [[risky play]] continues past middle childhood","The question was about play in general, with pretend play as the example."]],"k":"Do we actually stop playing? Probably not as early, or as completely, as we think.","h":"Halloween costumes, D&D, video games, improv… adults are still out here playing pretend."},{"id":"s1q039","s":1,"o":3,"t":"L","sc":"pretend","q":"The ability to have a symbol represent something other than itself is called ____ thought.","a":[["[[symbolic]]","Yes. Pretend play is linked to symbolic thought."],["[[abstract]]","Related idea, but lecture’s term was symbolic thought."],["[[magical]]","Magical thinking is believing wishes cause events. Different concept."],["[[divergent]]","Divergent thinking is coming up with many ideas (creativity)."],["[[concrete]]","Concrete thinking is the opposite: tied to the literal here-and-now."]],"k":"Symbolic thought underlies pretend play (and language).","b":1},{"id":"s1q040","s":1,"o":4,"t":"LR","sc":"risky","q":"Which definition of ==risky play== matches Ramsden et al. (2026)?","a":[["[[Thrilling]] physical play with [[uncertainty]] and risk of [[injury]]","Yes: ‘thrilling and exciting forms of physical play that involve uncertainty and a risk of physical injury’ (Sandseter)."],["[[Unsupervised]] play in settings that adults have judged [[unsafe]]","Risky play isn’t defined by lack of supervision or by being hazardous."],["[[Competitive]] play where losing carries a [[social cost]]","Risky play is about physical thrill and uncertainty, not social stakes."],["[[Rule-breaking]] play that tests the limits set by [[parents]]","It’s not about defiance."],["[[Outdoor]] play of any kind lasting more than an [[hour]]","Outdoor play and risky play overlap but are measured and defined separately."]],"k":"Risky play = thrilling, exciting physical play involving uncertainty and a risk of physical injury.","h":"Three ingredients: THRILL + UNCERTAINTY + could-get-hurt. The ‘scary-funny’ feeling."},{"id":"s1q041","s":1,"o":4,"t":"L","sc":"risky","q":"Seven-year-old Dev climbs to the very top of a tall tree and looks out over the park. Which ==type of risky play== is this?","a":[["Play with [[heights]]","Yes. Climbing high is the classic example of play with heights."],["Play at [[high speeds]]","Speed would be racing downhill on a bike or sled."],["Play with [[tools]]","That would involve things like knives, saws or hammers."],["Play near [[elements]]","That means things like fire or deep water."],["Play with a chance of [[getting lost]]","That’s exploring out of adults’ sight. Dev is visible at the top of a tree."]],"k":"Lecture’s six kinds of risky play: with heights · at high speeds · with tools · near elements · with a chance of getting lost · rough and tumble.","h":"Heights, Speed, Tools, Elements, Rough-and-tumble, Lost. ‘He Sped To Every Rowdy Location.’"},{"id":"s1q042","s":1,"o":4,"t":"L","sc":"risky","q":"Which activity is an example of ==play near elements==?","a":[["Playing close to a [[campfire]] or deep [[water]]","Yes. Fire and water are the ‘elements’ you could fall into or get hurt by."],["Whittling a stick with a [[pocket knife]]","That’s play with TOOLS."],["Racing a [[bike]] down a steep hill","That’s play at high SPEEDS."],["[[Play-wrestling]] with a friend on the grass","That’s rough-and-tumble play."],["Wandering alone through the [[woods]] out of sight","That’s play with a chance of getting lost."]],"k":"Elements = fire, water: things in the environment. Tools = things in your hand."},{"id":"s1q043","s":1,"o":4,"t":"L","sc":"risky","q":"A group of 8-year-olds explore a ravine behind the school with no adult able to see them. Which type of risky play is this?","a":[["Chance of [[getting lost]]","Yes: exploring on their own, out of adults’ sight."],["Play with [[tools]]","No tools are involved."],["[[Rough-and-tumble]] play","Nobody is wrestling or play-fighting."],["Play at [[high speeds]]","Nothing fast is happening."],["Play near [[elements]]","Possible if there were a river or cliff, but the key detail given is being unseen and on their own."]],"k":"A chance of getting lost = exploring on your own, away from adult eyes."},{"id":"s1q044","s":1,"o":4,"t":"L","sc":"riskwhy","q":"Which outcomes did lecture link with ==risky/adventurous play==?","a":[["More [[physical activity]], [[risk assessment]] and self-esteem","Yes: physical activity and abilities, social competence, better ability to assess risk, and better self-esteem and mental health."],["More [[injuries]] long-term, but higher grades in [[maths]]","Risky play may actually REDUCE injuries long-term, and grades weren’t on the list."],["Better [[language]], perspective taking and [[symbolic]] thought","Those belong to pretend play."],["More [[anxiety]] in childhood, but more caution as [[adults]]","Risky play is linked with better mental health and may reduce fear and anxiety."],["Better [[reading]] and fraction skills by [[Grade 4]]","That’s mixing in Fraction Ball."]],"k":"Risky play is linked with: physical activity/abilities · social competence · ability to assess risk (may reduce injuries long-term) · self-esteem and mental health.","h":"You only learn where your limits are by getting near them."},{"id":"s1q045","s":1,"o":4,"t":"L","sc":"riskwhy","q":"Counterintuitively, lecture said risky play may do what to injuries in the ==long term==?","a":[["[[Reduce]] them, because children learn to [[assess risk]]","Yes. Risky play is linked to better ability to assess risk, which may mean fewer injuries down the road."],["[[Increase]] them, because children grow [[overconfident]]","That’s the intuitive fear, but lecture said the opposite may be true."],["[[Not affect]] them, because injuries are down to [[chance]]","Lecture suggested a real link through risk assessment."],["[[Reduce]] them, because adults [[supervise]] more closely","The mechanism is the child’s own judgement, not tighter supervision."],["[[Increase]] them in childhood, then [[eliminate]] them later","Too strong. The claim was ‘may reduce injuries long-term’."]],"k":"Risky play → better risk assessment → may REDUCE injuries long-term.","h":"The kid who’s fallen off the low branch knows not to trust the thin high one."},{"id":"s1q046","s":1,"o":4,"t":"L","sc":"lavc","q":"In Lavrysen et al. (2017), classes of 4–6-year-olds either had class as usual or a 3-month risky play intervention. Lecture showed a chart from this study. What did it show?","a":[["Risky play classes gained in [[self-esteem]]","Yes. The chart on the slide is self-esteem: it rose in the risky-play classes (4-year-olds and 6-year-olds) and not in the control classes."],["Risky play [[raises]] injury rates within three months","The study supported benefits, not harm."],["Risky play [[improves]] reading scores in kindergarten","Reading wasn’t the outcome."],["Risky play [[matters only]] for children older than six","The classes were 4–6-year-olds."],["Risky play [[reduces]] time spent in pretend play","Not the finding."]],"k":"Lavrysen et al. (2017): 4–6-year-old classes, class as usual vs. a 3-month risky play intervention → self-esteem went up in the risky-play classes, not in the control classes.","h":"Note the design: there’s an intervention group and a class-as-usual group. That’s stronger than a plain correlation."},{"id":"s1q047","s":1,"o":4,"t":"L","sc":"riskwhy","q":"Lecture offered three possible reasons ==why risky play has benefits==. Which set is correct?","a":[["Reduces [[fear/anxiety]], meets need for [[autonomy]], joy of [[mastery]]","Yes, those were the three bubbles on the slide."],["Builds [[obedience]], increases adult [[supervision]], teaches fixed [[rules]]","Risky play is about the child’s own choices, not obedience or supervision."],["Raises [[IQ]], improves [[memory]], speeds up [[reading]]","Not the reasons given."],["Burns [[energy]], improves [[sleep]], lowers [[screen time]]","Plausible side effects, but not lecture’s three explanations."],["Creates [[competition]], rewards [[winners]], ranks [[peers]]","That’s performance-goal language from the schooling unit."]],"k":"Why risky play helps: (1) reduces fear/anxiety, (2) satisfies the need for autonomy, (3) positive emotions from mastery.","h":"FAM: Fear down, Autonomy met, Mastery joy."},{"id":"s1q048","s":1,"o":4,"t":"L","sc":"riskwhy","q":"Zoe is nervous on the climbing wall. Over weeks she climbs a little higher each time, and her nervousness fades. Which of lecture’s explanations for the benefits of risky play fits best?","a":[["It helps [[reduce fear and anxiety]]","Yes. Facing manageable fear bit by bit makes it shrink (Ramsden: ‘early exposure to manageable fear’)."],["It satisfies the need for [[autonomy]]","Autonomy is about choosing for yourself. The detail here is fear fading."],["It creates positive emotions from [[mastery]]","Mastery would be the pride of reaching the top. The stem focuses on fear going down."],["It improves [[symbolic thought]]","That’s a pretend-play concept."],["It provides [[cognitive restoration]]","That’s a benefit of natural outdoor settings (recovering from attentional fatigue)."]],"k":"Risky play may work like gentle exposure: manageable fear, faced repeatedly, shrinks."},{"id":"s1q049","s":1,"o":4,"t":"R","sc":"risky","q":"How do Ramsden et al. (2026) characterize risky play activities like climbing to heights or rough-and-tumble?","a":[["As [[training grounds]] for resilience, not as [[hazards]]","Yes: ‘Rather than being inherently hazardous, these activities… are theorized as essential training grounds for resilience and risk-assessment.’"],["As [[hazards]] that should be removed from early childhood [[settings]]","The article argues for MORE risky play opportunities."],["As [[harmless]] fun with no real [[developmental]] role","They’re described as developmentally important."],["As useful only when an adult [[directs]] each [[activity]]","The article stresses child autonomy and child-led play."],["As [[beneficial]] for motor skills but harmful for [[mental health]]","Risky play is linked to reduced internalizing symptoms like anxiety."]],"k":"Ramsden: risky play = essential training ground for resilience and risk-assessment."},{"id":"s1q050","s":1,"o":4,"t":"R","sc":"risky","q":"According to Ramsden et al. (2026), what trend has ==shrunk== children’s opportunities for risky play?","a":[["[[Risk-averse]] supervision and [[hyper-surveillance]]","Yes. That’s the article’s wording for why adventure, autonomy, challenge and risk have contracted."],["A [[shortage]] of playground equipment in [[rural]] areas","Not the trend the article names."],["Children’s [[declining interest]] in physical [[challenge]]","The limiter is adult practices, not children’s interest."],["New [[national laws]] banning climbing in [[schools]]","No such laws are described."],["[[Longer]] kindergarten days leaving less [[free time]]","Not mentioned."]],"k":"Risk-averse supervision + institutional hyper-surveillance → fewer chances for adventure, autonomy, challenge and risk.","h":"‘Get down from there!’ ×1000 = no more climbing."},{"id":"s1q051","s":1,"o":4,"t":"LR","sc":"risky","q":"Risky play involves uncertainty and a risk of physical ____.","a":[["[[injury]]","Yes. That ‘could get hurt’ element is part of the definition."],["[[failure]]","Uncertainty is there, but the definition specifically names physical injury."],["[[punishment]]","Risky play isn’t about getting in trouble."],["[[exhaustion]]","Being tired isn’t the risk in the definition."],["[[exclusion]]","That’s a social risk, not the physical one in the definition."]],"k":"Risky play: thrilling + uncertain + risk of physical injury.","b":1},{"id":"s1q052","s":1,"o":5,"t":"L","sc":"outdoor","q":"How did lecture define ==outdoor play==?","a":[["[[Unstructured]] play that takes place [[outside]]","Yes: ‘Unstructured play that takes place outside!’"],["[[Organized]] sports that take place [[outside]]","Organized sport is structured. Outdoor play is unstructured."],["[[Adult-led]] lessons held in a [[natural]] setting","Outdoor play is unstructured, not a lesson."],["Any [[physical]] activity lasting over an [[hour]]","There’s no time threshold in the definition."],["[[Risky]] play that involves natural [[materials]]","Outdoor play is linked with risky play, but they aren’t the same thing."]],"k":"Outdoor play = unstructured play that takes place outside.","h":"Soccer practice is outside but it isn’t ‘outdoor play’. Messing around in the yard is."},{"id":"s1q053","s":1,"o":5,"t":"L","sc":"outdoor","q":"Which best defines ==nature play==?","a":[["Play in a [[natural setting]] or with [[natural materials]]","Yes: ‘occurs in a natural environment, and/or involves play with natural elements or materials (water, mud, sticks, leaves, rocks…)'."],["Play that happens [[outdoors]] on any kind of [[surface]]","That’s just outdoor play. Nature play needs a natural setting and/or natural materials."],["Play about [[animals]] or plants using [[toys]] indoors","Plastic animal toys indoors aren’t natural elements."],["Play in [[wilderness]] areas far away from [[buildings]]","It doesn’t have to be wilderness. Mud and sticks in a schoolyard count."],["Play led by an [[adult]] to teach about the [[environment]]","Nature play is play, not an environmental lesson."]],"k":"Nature play = in a natural environment AND/OR with natural elements (water, mud, sticks, leaves, rocks).","h":"The ‘and/or’ matters: a forest counts, and so does a mud kitchen on a concrete patio."},{"id":"s1q054","s":1,"o":5,"t":"L","sc":"outdoor","q":"Kids at an urban daycare make ‘soup’ from mud, leaves and pebbles in buckets on a paved patio. Does this count as ==nature play==?","a":[["Yes, because it uses [[natural materials]]","Right. The definition is ‘natural environment AND/OR natural elements or materials’. Mud, leaves and pebbles qualify."],["No, because a paved patio is not a [[natural environment]]","The setting doesn’t have to be natural if the materials are (that’s the ‘and/or’)."],["No, because making soup is [[pretend play]] instead","It can be both! Outdoor/nature play is linked with pretend and dramatic play."],["Yes, but only if an [[adult]] set up the activity","Adult set-up isn’t part of the definition."],["No, because nature play requires [[risk of injury]]","That’s risky play. Nature play has no injury requirement."]],"k":"Natural materials alone are enough for nature play."},{"id":"s1q055","s":1,"o":5,"t":"L","sc":"greenbuffer","q":"Which benefits did lecture link with ==outdoor/nature play==?","a":[["[[Physical activity]], motor skills, and [[other forms of play]]","Yes: physical activity, gross motor skills, and being linked with pretend/dramatic play and risky play, plus physical and mental health benefits of being in nature."],["[[Fraction]] knowledge, number line skills, and [[maths]] confidence","That’s Fraction Ball."],["[[Vocabulary]] growth, earlier reading, and [[symbolic]] thought","Those are closer to pretend play and language research."],["[[Obedience]], rule-following, and sitting still in [[class]]","Not benefits lecture listed."],["[[Less]] pretend play, since outdoor time [[replaces]] it","The opposite: outdoor play is linked WITH pretend and dramatic play."]],"k":"Outdoor/nature play: physical activity + gross motor · linked with pretend, dramatic and risky play · access to nature → physical health, mental health, buffer to stress?","h":"Outside is like a gateway: once you’re out there, the pretending and the climbing just happen."},{"id":"s1q056","s":1,"o":5,"t":"L","sc":"wellsc","q":"Wells & Evans (2003) studied children with more vs. less nature near their homes. Lecture cited this for which idea?","a":[["Access to nature may act as a [[buffer to stress]]","Yes. Under ‘benefits of being outside, having access to nature’, lecture listed ‘Buffer to stress?’ with this citation."],["Access to nature [[raises]] children’s standardized test scores","Not the point of this citation."],["Access to nature [[increases]] injuries from risky play","Not what the study was about."],["Access to nature matters [[only]] for children in big cities","The study was actually about rural children."],["Access to nature [[replaces]] the need for parental warmth","Nothing like this was claimed."]],"k":"Wells & Evans (2003): nearby nature buffers the impact of life stress on children.","h":"Same bad day, but one kid has trees out the window. The trees take the edge off."},{"id":"s1q057","s":1,"o":5,"t":"L","sc":"greenbuffer","q":"Two children face the same stressful family events. Amir’s home is surrounded by trees and green space; Bea’s has none nearby. Based on the work lecture cited, what would we predict?","a":[["[[Amir]] shows less distress, since nature may [[buffer]] stress","Right. That’s the buffering idea from Wells & Evans (2003)."],["[[Bea]] shows less distress, since she spends more time [[indoors]]","Indoor time isn’t protective here; nearby nature is."],["They show [[equal]] distress, since stress effects are [[universal]]","A buffer means the same stressor hits less hard for one child."],["[[Amir]] shows more distress, since nature involves more [[risk]]","Nature was linked with better mental health, not worse."],["[[Bea]] shows more distress only if she has no [[siblings]]","Siblings aren’t part of this finding."]],"k":"Buffer = it doesn’t remove the stress, it softens the impact."},{"id":"s1q058","s":1,"o":5,"t":"R","sc":"greenbuffer","q":"Ramsden et al. (2026) say outdoor natural environments promote ==cognitive restoration==. What does that mean?","a":[["Children [[recover]] from built-up attentional [[fatigue]]","Yes: natural settings let attention recharge after focused indoor work."],["Children [[relearn]] school material they had [[forgotten]]","It’s about attention recovering, not re-teaching content."],["Children [[rebuild]] muscle strength lost through [[sitting]]","That’s physical, not cognitive."],["Children [[replace]] screen habits with reading [[habits]]","Not what the term means."],["Children [[recall]] early memories more [[vividly]]","Not the idea."]],"k":"Cognitive restoration = nature lets tired attention recover. Greenness is also tied to working memory and attention.","h":"Like plugging your brain’s battery in. Indoor focus drains it, green space recharges it."},{"id":"s1q059","s":1,"o":5,"t":"R","sc":"outdoor","q":"Per Ramsden et al. (2026), which is a reason natural settings benefit development ==beyond exercise==?","a":[["They reduce exposure to traffic [[air pollution]]","Yes. The article notes natural settings offer richer motor practice while reducing harmful exposures like traffic-related air pollution."],["They guarantee [[adult supervision]] at all times","The article pushes for autonomy, not constant supervision."],["They remove all [[uncertainty]] from children’s play","Uncertainty is part of what makes outdoor risky play valuable."],["They provide more [[structured lessons]] than classrooms","Outdoor play is unstructured."],["They ensure [[equal access]] for every family already","Access is NOT equal; the article calls for equitable access."]],"k":"Natural settings: cognitive restoration, stress mitigation, richer motor practice, less air pollution."},{"id":"s1q060","s":1,"o":6,"t":"LR","sc":"ramsden","q":"What was the ==main research question== of Ramsden, Gill & Brussoni (2026)?","a":[["Do early [[play and screen time]] relate to [[vulnerability]] at school entry?","Yes. They asked how these three early experiences relate to developmental vulne
