and Cam]]","Ava is mastery. Cam is performance."],["[[All three]]","Ava’s goal is about learning itself, not comparison."]],"k":"Performance goals have two faces: besting others AND avoiding looking poor compared to others.","h":"Trap alert: ‘I don’t want to look dumb’ sounds modest, but it’s still about comparison = performance."},{"id":"s3q004","s":3,"o":14,"t":"L","sc":"goals","q":"In lecture, ==\"relative ability goals\"== is another name for…","a":[["[[performance]] goals","Yes: ‘Performance goals (relative ability goals)'."],["[[mastery]] goals","Mastery is about your own learning, not ability relative to others."],["[[SEL]] goals","SEL is social-emotional learning, not an achievement goal."],["[[tracking]] goals","Tracking is sorting classes by ability."],["[[intrinsic]] goals","Not the term used."]],"k":"Relative ability = ability compared to others = performance goals. (The exam guide uses ‘relative-ability’.)"},{"id":"s3q005","s":3,"o":14,"t":"L","sc":"targets","q":"Lecture said students’ achievement goals can be ==influenced== by what?","a":[["[[Classroom and school]] policies and practices","Yes: goals ‘can be influenced by classroom and school policies’."],["Only the student’s [[inborn]] personality","Goals aren’t fixed traits; settings shape them."],["Only [[parents’]] attitudes at home","Lecture focused on classroom and school practices."],["The student’s [[sleep]] cycle and [[start]] times","That’s a separate topic."],["[[Nothing]]; goals stay stable across settings","They shift with the environment."]],"k":"Goals aren’t just in the kid. Classrooms and schools push students toward mastery or performance."},{"id":"s3q006","s":3,"o":14,"t":"L","sc":"targets","q":"Lecture used the acronym ==TARGETS== for classroom features that shape goals. What do the letters stand for?","a":[["[[Task]], [[Authority]], [[Recognition]], [[Grouping]], [[Evaluation]], [[Time]], [[Social]]","Yes, that’s TARGETS."],["[[Teaching]], [[Attendance]], [[Ranking]], [[Grading]], [[Effort]], [[Testing]], [[Standards]]","Right first letters, wrong words."],["[[Task]], [[Ability]], [[Rewards]], [[Goals]], [[Exams]], [[Tracking]], [[Size]]","Several of these aren’t in the acronym."],["[[Trust]], [[Autonomy]], [[Respect]], [[Growth]], [[Empathy]], [[Teamwork]], [[Support]]","Sounds nice, but not the acronym."],["[[Time]], [[Assessment]], [[Reading]], [[Grouping]], [[Engagement]], [[Tasks]], [[Standards]]","Not the acronym."]],"k":"TARGETS = Task · Authority · Recognition · Grouping · Evaluation · Time · Social relations.","h":"Each letter is a dial a teacher can turn toward mastery or toward performance."},{"id":"s3q007","s":3,"o":14,"t":"L","sc":"targets","q":"A teacher always posts the top three test scores on the wall and praises only the highest scorers. In TARGETS terms, which features are pushing the class toward ==performance goals==?","a":[["[[Recognition]] and [[Evaluation]]","Yes. Who gets recognized (top scorers) and how evaluation is done (public, comparative) both emphasize relative ability."],["[[Task]] and [[Time]]","Those are about what the work is and how much time/pacing students get."],["[[Authority]] and [[Time]]","Authority is about who makes decisions; time is about pacing."],["[[Grouping]] and [[Task]]","Nothing in the stem is about how students are grouped or the tasks themselves."],["[[Social relations]] and [[Task]]","The stem is about public praise and posted scores."]],"k":"Public, comparative recognition and evaluation → performance goals. Private, improvement-based → mastery goals."},{"id":"s3q008","s":3,"o":14,"t":"L","sc":"honour","q":"Which school practices did lecture say ==emphasize performance goals==?","a":[["Public [[honour rolls]] and assemblies for [[top grades]]","Yes, those three."],["Recognition for [[effort]], [[improvement]], and different [[abilities]]","Those emphasize mastery goals."],["[[Diverse]] course options and recognition for many kinds of [[ability]]","Those emphasize mastery goals."],["[[Later]] start times and smaller school [[size]]","Those aren’t about achievement goals."],["[[Tootling]] and [[PATHS]] lessons","Those are SEL programs."]],"k":"Performance-emphasizing: public honour rolls · assemblies recognizing top grades · class rankings on report cards, published.","h":"Anything that screams ‘here’s who’s on top’ = performance."},{"id":"s3q009","s":3,"o":14,"t":"L","sc":"honour","q":"A principal wants her school to emphasize ==mastery goals==. Which change fits lecture best?","a":[["Recognize [[effort and improvement]], not just top marks","Yes: recognition for effort/improvement, recognition for different abilities, diverse course options."],["Publish [[class rankings]] on every report card","That emphasizes performance goals."],["Hold monthly [[assemblies]] for students with the top [[grades]]","That emphasizes performance goals."],["Post a public [[honour roll]] at the school entrance","That emphasizes performance goals."],["Sort students into [[ability tracks]] from Grade 6","Tracking isn’t a mastery practice and has its own costs."]],"k":"Mastery-emphasizing: recognition for effort/improvement · recognition for different abilities · diverse course options.","h":"‘Most improved’ award = mastery. ‘Top of the class’ award = performance."},{"id":"s3q010","s":3,"o":14,"t":"L","sc":"goals","q":"What outcomes did lecture link with ==mastery goals==?","a":[["More [[engagement]], persistence, well-being; less [[cheating]]","Yes: increased engagement, persistence, effort, well-being, less cheating…"],["Clearly [[higher grades]] and test scores than performance goals","Careful! Lecture said mastery goals are NOT necessarily linked with better academic performance."],["More [[cheating]], since students care about [[learning]] at any cost","Mastery goes with LESS cheating."],["Lower [[well-being]], since students never feel [[finished]]","Mastery goes with better well-being."],["More [[competition]] and comparison among [[classmates]]","That’s performance goals."]],"k":"Mastery goals → engagement, persistence, effort, well-being ↑, cheating ↓. BUT not necessarily better academic performance.","h":"If you want to understand it, cheating is pointless. If you just want to beat people, cheating ‘works’."},{"id":"s3q011","s":3,"o":14,"t":"L","sc":"goals","q":"A classmate says, ‘Mastery goals are better because students with mastery goals always get higher grades.’ What’s wrong with this?","a":[["Mastery goals are [[not necessarily]] tied to better [[grades]]","Right. They’re linked with engagement, persistence, effort, well-being and less cheating, but not reliably higher grades."],["Mastery goals are linked with [[lower]] effort and [[persistence]]","They’re linked with MORE effort and persistence."],["Mastery goals [[cannot]] be influenced by teachers or schools","They can be influenced by classroom and school policies."],["Mastery goals are the [[same]] as relative ability goals","Relative ability goals are performance goals."],["Mastery goals only [[exist]] in elementary school","Not claimed."]],"k":"Exam trap: mastery ≠ automatically better grades."},{"id":"s3q012","s":3,"o":15,"t":"L","sc":"size","q":"What did lecture say about ==school size==?","a":[["[[Smaller]] schools are linked with better outcomes","Yes: ‘Smaller schools → better outcomes.’"],["[[Larger]] schools are linked with better outcomes","The opposite."],["School size is [[unrelated]] to student outcomes","Lecture said it matters."],["Size matters only in [[private]] schools","Not claimed."],["[[Medium]] schools do worst; tiny and huge do best","Not the pattern described."]],"k":"Smaller schools → better outcomes.","h":"Small school = you’re a name. Giant school = you’re a student number."},{"id":"s3q013","s":3,"o":15,"t":"L","sc":"size","q":"Which enrolment ranges did lecture give as ==recommended== school sizes?","a":[["K–8: [[300–500]] students; Grades 9–12: [[600–1000]] students","Yes."],["K–8: [[600–1000]] students; Grades 9–12: [[300–500]] students","Reversed: high schools can be somewhat bigger than K–8 schools."],["K–8: [[100–200]] students; Grades 9–12: [[200–300]] students","Too small."],["K–8: [[1000–1500]] students; Grades 9–12: [[2000+]] students","Far too large."],["K–8: [[500–1000]] students; Grades 9–12: [[1500–2000]] students","Too large for both."]],"k":"K–8: 300–500. High school (9–12): 600–1000.","h":"3-5 for the little ones, 6-10 for the big ones."},{"id":"s3q014","s":3,"o":15,"t":"L","sc":"private","q":"What does research say about ==private vs public== schools, according to lecture?","a":[["After [[controlling for confounds]], private shows [[no advantage]]","Yes. Traditional studies showed benefits, but those were confounded with school size, SES, etc. Newer research that controls for these suggests no advantage."],["Private schools show clear advantages even after [[controlling]] for [[SES]]","Newer controlled research suggests no advantage."],["Public schools clearly [[outperform]] private in [[all]] studies","Not claimed; results are ‘no advantage’ or mixed."],["School type has [[never]] been studied with random [[lotteries]]","Lottery studies exist (e.g., Mills & Wolf, 2017)."],["Private schools help [[only]] students from high-income [[families]]","Not what lecture said."]],"k":"Private-school ‘advantage’ is confounded (smaller size, higher SES…). Control for those → no advantage.","h":"It’s not the school, it’s who walks IN to the school."},{"id":"s3q015","s":3,"o":15,"t":"L","sc":"private","q":"Why are ==random lottery== studies (e.g., Mills & Wolf, 2017) so useful for studying private schools, and what do they find?","a":[["Lotteries remove [[selection]] confounds; results are [[mixed]] at best","Yes. Random chance decides who switches, so families’ SES and motivation are balanced. Findings: mixed, often no improvement, or even a decline."],["Lotteries [[pick]] the most motivated families; results show big [[gains]]","A lottery does the opposite of picking, and gains weren’t reliably found."],["Lotteries [[measure]] school size directly; results favour [[large]] schools","Lotteries are about who attends, not size."],["Lotteries [[exclude]] low-income students; results can’t be [[trusted]]","Not the point of lottery designs."],["Lotteries show private schools [[double]] test scores within a [[year]]","Nothing like that was found."]],"k":"Lottery = natural random assignment. Private school switchers: mixed results, often no improvement, sometimes decline.","h":"A lottery is basically nature running the experiment for you."},{"id":"s3q016","s":3,"o":15,"t":"L","sc":"transitions","q":"What are ==school transitions== linked with, according to lecture?","a":[["[[Decreases]] in motivation, interest and [[confidence]]","Yes (e.g., Rockoff & Lockwood, 2010)."],["[[Increases]] in motivation as students meet new [[friends]]","The pattern is a decline."],["[[No change]] in motivation, but better [[attendance]]","Not what was found."],["[[Decreases]] in sleep, but [[higher]] grades overall","Not the finding."],["[[Increases]] in mastery goals and [[autonomy]]","Achievement goals tend to shift toward performance, and autonomy often drops."]],"k":"Each school transition → dips in motivation, interest and confidence.","h":"New building, new teachers, new social ladder. Every move costs something."},{"id":"s3q017","s":3,"o":15,"t":"L","sc":"transitions","q":"District A runs K–5 elementary → 6–8 middle → 9–12 high school. District B runs K–8 → 9–12. Based on lecture, which prediction fits best?","a":[["District [[A]] students face [[more]] transition-related declines","Yes. Two transitions instead of one means more of the dips linked with switching schools."],["District [[B]] students face [[more]] transition-related declines","District B has fewer transitions."],["Both face [[identical]] declines, since [[age]] is all that matters","‘Age itself’ is one hypothesis, but research (Rockoff & Lockwood) points to the transition mattering."],["District [[A]] students gain [[confidence]] from more fresh starts","Transitions are linked with declines in confidence."],["[[Neither]] shows declines until Grade 12","Declines appear around transitions."]],"k":"More transitions = more dips. (The slide contrasted elementary → middle → high with elementary → high.)"},{"id":"s3q018","s":3,"o":15,"t":"L","sc":"fit","q":"Lecture listed possible reasons for the ==decline at school transitions==. Which set is correct?","a":[["Age, the move itself, [[goal]] shifts, and [[stage–environment fit]]","Yes, those were the candidates on the slide."],["[[Summer]] learning loss, private school [[lotteries]], and class size","Those are other topics."],["[[Later]] start times, more [[SEL]] lessons, and smaller schools","Those would likely HELP, not explain the decline."],["[[Pygmalion]] effects, [[tootling]], and Fraction Ball","Unrelated mix."],["[[Puberty]] alone, since school structure plays no real role","‘Age itself’ was only one of several possibilities."]],"k":"Why the decline? Age itself? Transition itself? Changes in achievement goals · changes in teacher beliefs · stage–environment fit (‘developmental mismatch’)."},{"id":"s3q019","s":3,"o":15,"t":"L","sc":"fit","q":"What is ==stage–environment fit==, and why are middle/high schools called a \"developmental mismatch\"?","a":[["Adolescents need [[autonomy]], yet these schools add [[teacher control]]","Yes. Teens need autonomy and are highly concerned with peer opinions, but middle/high schools emphasize teacher control and practices that stress comparison."],["Adolescents need [[more sleep]], yet these schools offer shorter [[lunch]] breaks","Sleep mismatch is real (start times), but it isn’t how lecture defined this mismatch."],["Adolescents need [[structure]], yet these schools give them too much [[freedom]]","Reversed: they get LESS autonomy just when they need more."],["Adolescents need [[play]], yet these schools [[remove]] all recess","Not the mismatch described."],["Adolescents need [[smaller]] classes, yet these schools are too [[small]]","Not the mismatch described."]],"k":"Stage (adolescent): need for autonomy + concern for peer opinions. Environment (middle/high school): more teacher control + more comparison. They don’t fit.","h":"Right when teens want the steering wheel, school takes it away… and then ranks them in front of their friends."},{"id":"s3q020","s":3,"o":15,"t":"L","sc":"fit","q":"Which students are ==most affected== by school transitions, per lecture?","a":[["[[Low achievers]], [[anxious]] students, and ethnic [[minorities]]","Yes (individual differences; Benner & Graham, 2009)."],["[[Highest achievers]] and the most socially [[popular]] students","They tend to be less affected."],["Students from the [[largest]] elementary schools","Not what lecture said."],["Students who [[repeat]] a grade just before the transition","Not mentioned."],["[[All students equally]], regardless of background","Lecture stressed individual differences."]],"k":"Hit hardest: lowest achievers · students struggling with anxiety or social skills · ethnic minorities."},{"id":"s3q021","s":3,"o":15,"t":"L","sc":"summer","q":"Why does the traditional school year have a long ==summer break==?","a":[["It reflects our [[agricultural heritage]]","Yes. Children were once needed for farm work in summer."],["It was designed around adolescents’ [[sleep]] needs","Not the origin."],["It was shown to [[improve]] learning in experiments","It’s actually linked with drops in performance."],["It allows time for teacher [[training]] programs","Not the historical reason."],["It began with [[industrialization]] and factory shifts","Factories don’t close for summer; farms needed the hands."]],"k":"Summer break = leftover from farming life.","h":"Our school calendar is basically a 150-year-old harvest schedule."},{"id":"s3q022","s":3,"o":15,"t":"L","sc":"summer","q":"What happens over summer break, according to lecture?","a":[["Performance [[decreases]], maybe more for [[low-income]] kids","Yes, with a question mark on ‘more so for low-income families?’. Year-round school was raised as a possibility."],["Academic performance [[increases]] because students finally [[rest]]","Lecture described a decrease."],["Performance [[drops]] only for high-income students who [[travel]]","If anything, the worry is about low-income families."],["Performance stays [[flat]], but motivation rises by [[fall]]","A decrease was described."],["IQ rises but [[reading]] falls, cancelling each other [[out]]","Not what lecture said."]],"k":"Summer → decrease in academic performance/IQ; more so for low-income families? Possible fix: year-round school?","h":"Use it or lose it. And not everyone gets the same summer (camps and trips vs. nothing)."},{"id":"s3q023","s":3,"o":15,"t":"L","sc":"sleep","q":"Why might ==early school start times== be a problem for teenagers?","a":[["The [[sleep cycle shifts]] later during adolescence","Yes. Teens’ body clocks shift, creating a developmental mismatch with early secondary-school schedules."],["Teenagers need [[less sleep]] than younger children do","The issue is timing: their sleep shifts later."],["Teenagers [[choose]] to stay up and could simply sleep [[earlier]]","The shift is biological, not just a choice."],["Early starts [[reduce]] time for after-school [[sports]]","Not the reason given."],["Early starts make [[teachers]] less effective in class","Lecture focused on students’ sleep."]],"k":"Adolescent sleep cycle shifts later → early high-school starts = developmental mismatch.","h":"A teen at 8 a.m. is like an adult at 5 a.m. The lights are on but nobody’s home."},{"id":"s3q024","s":3,"o":15,"t":"L","sc":"sleep","q":"Lecture asked whether there’s a ‘developmental mismatch with elementary vs secondary schools’ in start times. What’s the mismatch?","a":[["[[Secondary]] schools start early, though [[teens]] sleep later","Yes. The students whose body clocks run latest are often the ones asked to show up earliest."],["[[Elementary]] schools start late, though young children wake [[late]]","Young children tend to wake early; that’s not the mismatch."],["[[Both]] start too late for children’s natural sleep [[cycles]]","The concern is about starting too EARLY for teens."],["[[Secondary]] students sleep longer than elementary [[students]]","They often get less sleep on school days."],["[[Elementary]] students have a later sleep cycle than [[teens]]","Reversed."]],"k":"The age group with the latest body clock often gets the earliest bell."},{"id":"s3q025","s":3,"o":15,"t":"L","sc":"dunsterc","q":"What happened when schools ==moved their start time later== (Dunster et al., 2018)?","a":[["Second-semester [[grades]] rose, from 77.5% to [[82%]]","Yes. That’s the chart on the slide: median second-semester grades were 77.5% in 2016 and 82% in 2017, after the later start."],["Students slept [[less]] because they stayed up even [[later]]","That’s the common worry, but the study supported improvement."],["Grades [[dropped]] because the day ended too [[late]]","Not the finding."],["There was [[no change]] in any outcome measured","Improvements were found."],["Only [[elementary]] students benefited from the change","The focus was secondary students."]],"k":"Dunster et al. (2018): after the school start time moved later, second-semester grades rose (77.5% → 82%). Teen sleep runs late, so a later bell fits better."},{"id":"s3q026","s":3,"o":15,"t":"L","sc":"summer","q":"The traditional school year with summer break reflects our ____ heritage.","a":[["[[agricultural]]","Yes."],["[[industrial]]","Industrialization helped create schooling, but the summer break comes from farming."],["[[religious]]","Religious education is a reason for schooling, not for summer break."],["[[colonial]]","Colonization is a reason for schooling, not for the calendar."],["[[military]]","Not mentioned."]],"k":"Summer break ← agricultural heritage.","b":1},{"id":"s3q027","s":3,"o":16,"t":"L","sc":"tracks","q":"What is ==ability tracking==?","a":[["Separating students into [[classes]] by [[ability level]]","Yes, that’s lecture’s definition."],["Following each student’s [[grades]] over time in a [[database]]","That’s record keeping."],["Letting students [[choose]] courses based on their [[interests]]","That’s course choice, not sorting by ability."],["Giving [[extra recognition]] to students who [[improve]] most","That’s a mastery-oriented practice."],["Grouping students of [[mixed]] ability so they help each [[other]]","That’s the opposite: heterogeneous grouping."]],"k":"Ability tracking = sorting students into separate classes by ability level.","h":"Like sorting hats, but for maths class."},{"id":"s3q028","s":3,"o":16,"t":"L","sc":"tracks","q":"Which two ==arguments for== tracking did lecture raise (with question marks)?","a":[["It may give better [[person–environment fit]] for all","Yes: ‘Maximize person-environment fit?’ and ‘Better for social comparison?’"],["It may reduce [[teacher workload]] and lower school [[costs]]","Not the arguments raised."],["It may increase [[diversity]] and reduce [[stereotypes]]","Tracking tends to separate students, not mix them."],["It may improve [[sleep]] and reduce [[transitions]]","Unrelated."],["It may promote [[mastery goals]] across the whole [[school]]","Not an argument lecture raised."]],"k":"Pro-tracking logic: teach each student at their level (fit), and let them compare with similar peers."},{"id":"s3q029","s":3,"o":16,"t":"L","sc":"tracks","q":"What are the effects of being in a ==high-ability track==?","a":[["[[Academic]] benefits, but possible costs for [[self-esteem]]","Yes: benefits academically, but may be costs for self-esteem, self-concept, well-being."],["[[Academic]] costs, but gains in [[self-esteem]] and well-being","Reversed."],["Benefits in [[every]] area, with no known [[costs]]","Lecture flagged possible costs."],["[[No]] academic effect, but much higher [[popularity]]","Not what lecture said."],["Costs in [[every]] area, especially [[academics]]","High tracks do benefit academically."]],"k":"High track: academics ↑, but self-esteem/self-concept/well-being may ↓.","h":"Big fish in a small pond becomes a small fish in a big pond: suddenly everyone around you is brilliant."},{"id":"s3q030","s":3,"o":16,"t":"L","sc":"tracks","q":"What are the effects of being in a ==low-ability track==?","a":[["[[Negative]] outcomes: [[inadequacy]], weaker teaching","Yes: negative outcomes → feelings of inadequacy; differences in instructional quality and peer groups."],["[[Positive]] outcomes: more [[confidence]] from easier work","Lecture described negative outcomes."],["[[Mixed]] outcomes: better [[grades]] but worse behaviour","Not what lecture said."],["[[No]] measurable effects compared with mixed [[classes]]","Negative effects were described."],["[[Positive]] academic effects but costs for [[self-esteem]]","That’s the HIGH track pattern."]],"k":"Low track: negative outcomes. Why? Feelings of inadequacy + lower instructional quality + different peer groups.","h":"Two hits: you FEEL labelled, and you GET less (weaker teaching, less-engaged peers)."},{"id":"s3q031","s":3,"o":16,"t":"L","sc":"tracks","q":"Dani is moved into the lowest maths track. Over the year she starts saying ‘I’m just bad at maths’, her class covers less material, and her classmates rarely do homework. Which lecture points does this illustrate?","a":[["Feelings of [[inadequacy]] plus weaker [[instruction and peers]]","Yes, all three mechanisms lecture gave for low-track harm."],["[[Person–environment fit]] working as tracking [[intends]]","The intended benefit clearly isn’t happening here."],["The [[Pygmalion effect]] in Rosenthal & Jacobson’s [[bloomers]]","Related in spirit (low expectations), but the question describes lecture’s low-track mechanisms."],["[[Academic benefits]] with a cost to [[self-concept]]","That’s the high-track pattern."],["A shift toward [[mastery goals]] in a supportive [[class]]","Nothing here suggests mastery orientation."]],"k":"Low-track harm = self-view + teaching + peers."},{"id":"s3q032","s":3,"o":16,"t":"LR","sc":"tracks","q":"Leer et al. (2025) examined racial gaps in ==Gifted and Talented (GT)== placement. How does this connect to lecture’s discussion of tracking?","a":[["GT is [[academic tracking]] and can be [[racially unequal]]","Yes. Leer et al. treat racialized GT gaps as a sign of how schools actually act on diversity."],["GT is a [[social-emotional]] program, like [[PATHS]]","GT is an academic placement, not SEL."],["GT placement is [[random]], like a school [[lottery]]","It involves referral and screening, which can be biased."],["GT classes are a [[mastery-goal]] practice from [[TARGETS]]","Not how either source frames it."],["GT is unrelated to tracking because it is [[voluntary]]","It separates students by assessed ability, which is tracking."]],"k":"Tracking isn’t neutral: who ends up in the top track can reflect bias (teachers refer Students of Color less often)."},{"id":"s3q033","s":3,"o":17,"t":"L","sc":"diversity","q":"According to lecture (Juvonen et al., 2006), how does ==school ethnic diversity== relate to student outcomes?","a":[["[[Majority]]: fewer stereotypes; [[minority]]: safer, less lonely","Yes. Majority group → fewer negative stereotypes about outgroups. Ethnic minority groups → increased feelings of safety, decreased loneliness, higher self-worth."],["[[Majority]] students feel less safe; [[minority]] students show no change","Not what was found."],["[[All]] students show lower self-worth as diversity [[increases]]","Minority students showed HIGHER self-worth."],["[[Minority]] students feel lonelier; [[majority]] students benefit most","Minority students felt LESS lonely."],["Diversity is [[unrelated]] to any social or emotional [[outcome]]","Benefits were found for both groups."]],"k":"Diversity benefits: majority → fewer negative outgroup stereotypes. Minority → safer, less lonely, higher self-worth.","h":"More mix = less ‘us vs them’ for the majority, and less ‘only one’ for the minority."},{"id":"s3q034","s":3,"o":17,"t":"L","sc":"diversity","q":"Maria, a Latina student, moves from a school where she is one of very few students of colour to a highly diverse school. Based on Juvonen et al. (2006), what would we predict?","a":[["She feels [[safer]], [[less lonely]], and has higher [[self-worth]]","Yes, those are the three benefits for ethnic minority students."],["She feels [[less safe]] because there are more [[groups]]","Diversity was linked with feeling safer."],["She holds [[fewer stereotypes]], but feels [[lonelier]]","Fewer stereotypes was the majority-group benefit, and loneliness decreased."],["Her [[grades]] rise, but her [[self-worth]] falls","Self-worth was higher, and grades weren’t the finding."],["[[Nothing]] changes, since diversity affects only majority students","Minority students benefited."]],"k":"For ethnic minority students, more diverse schools → more safety, less loneliness, more self-worth."},{"id":"s3q035","s":3,"o":17,"t":"LR","sc":"wordsact","q":"Lecture’s diversity slide (Juvonen) is about how diverse a school actually IS. Leer et al. (2025) add a second question. What is it?","a":[["How schools [[say]] they value diversity vs. what they [[do]]","Yes. Leer et al. study diversity IDEOLOGIES (statements) and how they play out depending on real school practices."],["How [[many]] languages are taught in a school’s [[curriculum]]","Not the focus."],["How school [[size]] changes the benefits of [[diversity]]","Size wasn’t the question."],["How [[parents]] of different groups choose between [[schools]]","Not the focus."],["How [[tracking]] improves person–environment [[fit]]","Not the focus."]],"k":"Juvonen: actual diversity. Leer: stated diversity values vs. what the school does."},{"id":"s3q036","s":3,"o":18,"t":"R","sc":"wordsact","q":"In Leer et al. (2025), what is a ==color-evasive== diversity ideology?","a":[["[[Downplaying]] group differences; stressing [[individuals]]","Yes. It assumes the way to reduce discrimination is to ignore race/ethnicity (‘I don’t see race, I just see people’)."],["[[Recognizing]] and valuing social group [[differences]]","That’s multiculturalism."],["[[Separating]] students into classes by racial [[background]]","That’s segregation, not an ideology from the article."],["[[Teaching]] the history of racism in every [[subject]]","That would be the opposite of evading race."],["[[Hiring]] teachers from as many backgrounds as [[possible]]","That’s a practice, not this ideology."]],"k":"Color-evasive = ‘let’s not talk about race; we’re all just individuals.’","h":"Evasive = dodging. The school dodges the topic of race."},{"id":"s3q037","s":3,"o":18,"t":"R","sc":"wordsact","q":"In Leer et al. (2025), what is a ==multicultural== diversity ideology?","a":[["[[Recognizing]] and [[valuing]] social group differences","Yes, e.g., through rhetoric, policies or activities that celebrate minoritized identities."],["[[Ignoring]] group differences to treat everyone the [[same]]","That’s color-evasiveness."],["[[Ranking]] cultural groups by academic [[achievement]]","Not an ideology from the article."],["[[Requiring]] students to adopt the majority [[culture]]","That’s assimilation."],["[[Avoiding]] any discussion of culture at [[school]]","That’s color-evasive."]],"k":"Multiculturalism = differences are seen, named and valued."},{"id":"s3q038","s":3,"o":18,"t":"R","sc":"wordsact","q":"Why do Leer et al. (2025) say \"color-==evasiveness==\" instead of \"color-blindness\"?","a":[["To not treat [[blindness]] as a problem; evading is a [[choice]]","Yes. It avoids ableist framing and makes clear that downplaying race is a decision, not an inability."],["Because color-blindness refers only to [[individuals]], never [[institutions]]","Not the reason given."],["Because evasiveness is the [[legal]] term used in [[schools]]","Not the reason given."],["Because color-blindness means [[valuing]] group [[differences]]","It means the opposite."],["Because the two terms describe [[opposite]] ideologies","Color-evasiveness stems from color-blindness; they aren’t opposites."]],"k":"‘Evasive’ = a choice to avoid, and it doesn’t use disability as a metaphor for something bad."},{"id":"s3q039","s":3,"o":18,"t":"LR","sc":"wordsact","q":"What had ==previous research== shown about schools valuing diversity?","a":[["Valuing diversity [[supports]] youth; ignoring it [[harms]] them","Yes. That’s why the authors expected pro-diversity statements to help."],["Valuing diversity [[harms]] belonging for all students","Prior work found benefits."],["Ignoring differences [[improves]] achievement for minoritized youth","Prior work linked it to LOWER belonging and achievement."],["Diversity ideology has [[no]] measurable link to any outcome","Many prior studies found links."],["Valuing diversity helps [[only]] in elementary school","Not what prior research showed."]],"k":"Prior research: multicultural (valuing) → good; color-evasive (ignoring) → bad for minoritized youth.","h":"That’s what makes this study’s results surprising."},{"id":"s3q040","s":3,"o":18,"t":"R","sc":"leerdata","q":"How did Leer et al. (2025) measure each school’s ==diversity ideology==?","a":[["By coding if its [[mission statement]] [[valued diversity]]","Yes. Mission/vision/values statements were coded 1 (values diversity) or 0 (doesn’t)."],["By [[surveying]] students about how inclusive the school [[felt]]","They wanted an objective setting-level measure, not self-report."],["By [[observing]] classroom lessons for multicultural [[content]]","No classroom observation."],["By [[interviewing]] principals about their diversity [[beliefs]]","No interviews."],["By [[counting]] the number of languages spoken at [[school]]","Not the measure."]],"k":"Ideology = mission statement coded yes/no for explicitly valuing diversity (an observable proxy)."},{"id":"s3q041","s":3,"o":18,"t":"R","sc":"leerdata","q":"Who was studied in Leer et al. (2025)?","a":[["[[Grade 5–8]] students in [[North Carolina]]","Yes: a survey sample (N = 1,692, Project RAISE) plus administrative records (N = 300,063) from 690 schools, 2014–2015."],["[[Kindergarten]] children across [[British Columbia]]","That’s Ramsden et al."],["[[Grade 4–6]] students at one [[California]] school","That’s Bustamante et al."],["[[High school]] seniors across the [[United States]]","They were young adolescents (mean age about 12)."],["[[College]] students at two [[universities]]","Some prior studies used college samples; this one didn’t."]],"k":"Leer: early adolescents (Grades 5–8), North Carolina, two linked datasets (survey + administrative)."},{"id":"s3q042","s":3,"o":18,"t":"R","sc":"leerdata","q":"Which three ==student outcomes== did Leer et al. (2025) examine?","a":[["[[Belonging]], [[mental health]], and [[achievement]]","Yes."],["[[Attendance]], [[suspensions]], and graduation [[rates]]","Discipline gaps were a moderator, not an outcome."],["[[Friendships]], [[bullying]], and teacher [[ratings]]","Not the outcomes."],["[[IQ]], [[executive function]], and reading [[fluency]]","Not the outcomes."],["[[Self-esteem]], [[identity]], and career [[goals]]","Not the outcomes."]],"k":"Outcomes: belonging · psychological distress · achievement (reading + maths test scores).","h":"B-M-A: Belonging, Mental health, Achievement."},{"id":"s3q043","s":3,"o":18,"t":"R","sc":"leermod","q":"Which school characteristics did Leer et al. (2025) test as ==moderators== (signs of whether schools ‘walk the talk’)?","a":[["[[Student]] and [[teacher]] diversity; [[discipline]] and [[gifted]] gaps","Yes, those four."],["School [[size]], [[start time]], number of [[transitions]], summer length","Those are lecture’s school-organization features."],["[[Funding]], [[class size]], teacher [[salary]], building age","Not the moderators."],["[[SEL]] programs, [[tootling]], [[PATHS]], honour rolls","Not the moderators."],["[[Parent]] income, [[sibling]] number, [[marital]] status, urban/rural","Those were Ramsden et al.’s confounders."]],"k":"Moderators: student racial/ethnic diversity · teacher diversity · racialized discipline gaps · racialized Gifted & Talented gaps.","h":"Two ‘who’s here’ checks (students, teachers) + two ‘how are they treated’ checks (discipline, gifted)."},{"id":"s3q044","s":3,"o":18,"t":"R","sc":"leerdata","q":"What share of schools in Leer et al. (2025) ==explicitly valued diversity== in their mission statements?","a":[["About [[13%]]","Yes: 93 of 690 schools."],["About [[34%]]","That’s the estimated share of U.S. school DISTRICTS mentioning DEI in 2022."],["About [[50%]]","Too high."],["About [[75%]]","Too high."],["About [[87%]]","That’s the share that did NOT."]],"k":"Only 13% of schools had pro-diversity mission statements (2014–15)."},{"id":"s3q045","s":3,"o":18,"t":"R","sc":"wordsact","q":"Did schools with pro-diversity mission statements actually ==act== on those values, according to Leer et al. (2025)?","a":[["Barely: slightly more diverse [[students]], but no other gains","Right. No more diverse teaching staff, discipline gaps only slightly smaller, and racial gaps in GT were actually LARGER."],["Yes: they had far more diverse [[teachers]] and [[no]] discipline gaps","Teachers weren’t more diverse and gaps remained."],["Yes: they had [[eliminated]] racial gaps in [[gifted]] placement","GT gaps were larger in these schools."],["No: they had [[less]] diverse student bodies than other [[schools]]","Their student bodies were somewhat MORE diverse."],["It was [[impossible]] to tell from the available [[data]]","The administrative data allowed exactly this check."]],"k":"Words without deeds: even in ‘pro-diversity’ schools, Youth of Color were more than twice as likely to be suspended/expelled and less than half as likely to be in gifted education.","h":"A poster that says ‘We celebrate diversity!’ hanging over the detention room."},{"id":"s3q046","s":3,"o":18,"t":"R","sc":"mission","q":"What was the key finding for ==Youth of Color== in Leer et al. (2025)?","a":[["Pro-diversity statements were linked with [[more]] psychological [[distress]]","Yes, unexpectedly. In the average school (mostly White students and teachers, with racial gaps), a pro-diversity statement went with higher distress."],["Pro-diversity statements were linked with [[higher]] school [[belonging]]","There was no link with belonging."],["Pro-diversity statements were linked with [[lower]] psychological [[distress]]","That’s what was hypothesized, but the opposite was found."],["Pro-diversity statements [[raised]] test scores for Black and Latinx [[youth]]","No achievement link was found for these groups."],["Pro-diversity statements had [[no]] link with any outcome in any [[analysis]]","With moderators included, distress was higher for Youth of Color."]],"k":"Youth of Color + pro-diversity statement → MORE distress (when words and actions don’t match).","h":"Being told ‘we value you’ while watching kids who look like you get suspended more… that hurts MORE than silence."},{"id":"s3q047","s":3,"o":18,"t":"R","sc":"mission","q":"For Youth of Color in Leer et al. (2025), in which schools was the link between pro-diversity statements and distress ==strongest==?","a":[["[[Less diverse]], majority-[[White]] schools","Yes. The association grew as schools became less diverse and was only significant at lower diversity, i.e., majority-White schools."],["The [[most diverse]] schools with no racial [[majority]]","The link was not significant at high diversity."],["Schools with the most [[teachers of colour]]","Teacher diversity mattered for White youth’s distress and Asian youth’s achievement."],["Schools with the [[smallest]] gifted-placement [[gaps]]","Not the moderator for this finding."],["[[Rural]] schools, regardless of who [[attended]]","Location wasn’t the key moderator."]],"k":"The words-vs-reality gap is most glaring where Youth of Color have few same-race peers."},{"id":"s3q048","s":3,"o":18,"t":"R","sc":"mission","q":"What did Leer et al. (2025) find for ==White youth==?","a":[["Pro-diversity statements → [[more distress]] with diverse [[teachers]]","Yes (and when gifted-placement gaps were low). The authors suggest some White youth may feel a threat to majority status or feel excluded from diversity messages."],["Pro-diversity statements linked with [[less distress]] in [[every]] context","Not found."],["Pro-diversity statements [[raised]] achievement in diverse [[schools]]","No achievement effect for White youth."],["Pro-diversity statements [[increased]] belonging in all [[schools]]","No belonging effects."],["[[No]] association in any context, so only Youth of Color were affected","White youth’s distress also varied with context."]],"k":"It wasn’t only Youth of Color: White youth showed more distress with pro-diversity statements + more diverse teachers (and low GT gaps)."},{"id":"s3q049","s":3,"o":18,"t":"R","sc":"mission","q":"What did the large administrative dataset in Leer et al. (2025) show about ==achievement==?","a":[["No link for [[Black or Latinx]] youth; mixed for [[Asian]] youth","Yes. For Asian youth, statements were positively related to achievement only with a more diverse (less White) teaching staff."],["Pro-diversity statements [[raised]] achievement for [[every]] group","No such main effect."],["Pro-diversity statements [[lowered]] achievement for [[White]] youth","No main effect or moderation for White youth’s achievement."],["Achievement rose for [[Black]] youth only in majority-[[White]] schools","No achievement effects for Black youth."],["Achievement was [[not examined]] in the administrative data","It was the focus of that dataset."]],"k":"Statements did nothing for the achievement of the very students schools likely have in mind when they say ‘we support diversity’."},{"id":"s3q050","s":3,"o":18,"t":"R","sc":"mission","q":"What did Leer et al. (2025) ==hypothesize==, and how did the results compare?","a":[["They expected [[benefits]] but found [[more distress]]","Yes. Based on prior work they expected positive effects; instead statements were linked with more distress."],["They expected [[harm]] and found exactly that","They expected benefits."],["They expected [[no effect]] and found benefits","They expected benefits and didn’t find them."],["They expected benefits for [[White]] youth only, and found them","They expected benefits especially for racially minoritized youth."],["They made [[no]] predictions before analysing the data","They stated hypotheses."]],"k":"Expected: pro-diversity statement → better outcomes (esp. for minoritized youth, esp. in diverse, equitable schools). Found: more distress."},{"id":"s3q051","s":3,"o":18,"t":"LR","sc":"wordsact","q":"The title of Leer et al. (2025) is ‘It’s not what you say, it’s what you do.’ What is the ==main message==?","a":[["Stated support must be [[matched by action]] or may [[backfire]]","Yes. Communicating support without fixing inequities in discipline and tracking won’t close gaps and may worsen mental health disparities."],["Schools should [[stop]] making any statements about [[diversity]]","The message is to pair words with action, not to go silent."],["Color-evasive ideologies are [[better]] for student [[mental health]]","The study doesn’t conclude that."],["Diversity statements [[improve]] achievement but not [[belonging]]","Neither was found in general."],["Only [[teachers’]] words matter; school documents are [[irrelevant]]","The study was about school-level statements and practices."]],"k":"Words + matching actions = good. Words alone = performative, possibly harmful.","h":"Actions > announcements."},{"id":"s3q052","s":3,"o":18,"t":"R","sc":"wordsact","q":"Which concept from workplace research did Leer et al. (2025) extend to schools?","a":[["[[Diversity dishonesty]]: [[saying]] one thing, doing another","Yes. When people see that mismatch, their sense of fit and expected performance drop."],["[[Glass ceiling]]: barriers to promotion for qualified [[employees]]","Not the concept used."],["[[Burnout]]: exhaustion from long-term workplace [[stress]]","Not the concept used."],["[[Halo effect]]: one good trait colouring every other [[judgement]]","Not the concept used."],["[[Groupthink]]: pressure to agree within a close [[team]]","Not the concept used."]],"k":"Diversity dishonesty / performative multiculturalism: saying you value diversity without acting on it."},{"id":"s3q053","s":3,"o":18,"t":"R","sc":"fit","q":"Leer et al. (2025) use ==stage–environment fit== theory. How does it apply?","a":[["Adolescents need to [[belong]]; empty statements [[fail]] that need","Yes. How schools handle diversity shapes whether the environment meets adolescents’ needs, especially for racially minoritized youth."],["Adolescents need [[sleep]]; early start times [[fail]] that need","True in lecture, but not Leer et al.’s use of the theory."],["Adolescents need [[competition]]; diverse schools [[reduce]] it","Not the argument."],["Adolescents need [[structure]]; multicultural schools are too [[loose]]","Not the argument."],["Adolescents need [[less]] peer contact; diverse schools add [[more]]","Not the argument."]],"k":"Same theory as school transitions: when the environment doesn’t fit developmental needs (here, belonging), adjustment suffers.","h":"This theory shows up in BOTH lecture (transitions) and the reading. Double testable."},{"id":"s3q054","s":3,"o":18,"t":"R","sc":"mission","q":"Why might ==adolescents== be especially sensitive to a school’s diversity messages, per Leer et al. (2025)?","a":[["They are forming [[identity]] and alert to [[exclusion]]","Yes: heightened brain plasticity and sensitivity to social exclusion, identity formation, more complex thinking about race, and a need for authenticity."],["They spend [[less]] time at school than younger [[children]]","They spend MORE time in school than almost any other setting."],["They [[cannot yet]] think about abstract ideas like [[race]]","Early adolescence is when this thinking becomes more complex."],["They [[rarely]] notice how peers are [[disciplined]]","Research suggests they do notice."],["They care [[only]] about what parents think of [[school]]","Peers and school context matter a great deal."]],"k":"Adolescence = identity formation + sensitivity to exclusion + radar for fakeness.","h":"Teens can smell ‘fake’ from a mile away."},{"id":"s3q055","s":3,"o":18,"t":"R","sc":"leerdata","q":"Which is a ==limitation== of Leer et al. (2025)?","a":[["Findings are [[not causal]]; confounds are [[possible]]","Yes. It’s observational. E.g., families who choose diversity-emphasizing schools may differ in ways that affect outcomes."],["The sample was [[too small]] to examine racial/ethnic [[subgroups]]","The administrative sample had over 300,000 students."],["Mission statements were [[randomly assigned]], limiting [[realism]]","Nothing was randomly assigned."],["Only [[self-reports]] of school ideology were [[used]]","A strength was using an objective measure instead of self-report."],["It studied [[one school]], so no comparisons were [[possible]]","690 schools were included."]],"k":"Limitations: not causal · mission statements capture only one slice of how schools value diversity · didn’t measure whether students noticed inequities · data from 2014–15 in one state."},{"id":"s3q056","s":3,"o":18,"t":"R","sc":"leerdata","q":"Another limitation Leer et al. (2025) note is about ==mission statements== themselves. What is it?","a":[["Mission statements may [[miss]] what schools actually [[do]]","Yes, e.g., classroom conversations about race or discussions of inequality."],["Mission statements were [[too long]] to be coded [[reliably]]","They were short (about 64 words) and coding reliability was very high."],["Mission statements were written by [[students]], not [[staff]]","Not the case."],["Mission statements were [[identical]] across all [[schools]]","They varied; only 13% valued diversity."],["Mission statements could not be [[found]] for any [[school]]","They were found for 720 schools."]],"k":"A mission statement is a proxy, not the whole picture."},{"id":"s3q057","s":3,"o":18,"t":"LR","sc":"wordsact","q":"A middle school adds ‘We celebrate diversity!’ to its website. Nothing else changes: the staff is almost all White, and students of colour are suspended at twice the rate of White students. Based on Leer et al. (2025), what is the most likely result?","a":[["No achievement gains, and possibly [[more distress]] for some","Yes. Statements without action don’t reduce gaps and may worsen mental health disparities."],["[[Higher]] belonging and [[lower]] distress for students of colour","That was the hope, not the finding."],["[[Higher]] test scores for Black and Latinx students","No achievement link was found for these groups."],["[[Fewer]] suspensions, because the statement changes teacher [[behaviour]]","A statement alone doesn’t change practice."],["[[No effect]] on anyone, since students ignore school [[websites]]","The data suggest students are affected by the mismatch."]],"k":"Statement + no action = performative. Expect no benefit, possible harm."},{"id":"s3q058","s":3,"o":18,"t":"LR","sc":"wordsact","q":"What should schools do, according to the ==implications== of Leer et al. (2025)?","a":[["Pair statements with [[action]] on discipline and [[tracking]]","Yes: ‘diversity statements need to be paired with behaviors’, i.e., redress systemic inequities in school discipline and academic tracking. (The discussion also points to hiring diverse teachers.)"],["Remove diversity statements to avoid [[upsetting]] any [[group]]","Not the recommendation."],["Adopt a [[color-evasive]] approach to protect mental [[health]]","Not the recommendation."],["Focus on the [[wording]] of statements, since length [[matters]]","Word count was just a control variable."],["Place more students of colour in [[lower tracks]] for better [[fit]]","That would worsen inequity."]],"k":"Link words and symbols to action."},{"id":"s4q001","s":4,"o":19,"t":"L","sc":"threeareas","q":"Lecture named three places where children meet the legal system. Which did this unit ==focus== on?","a":[["[[Youth suspected of crimes]]: competence, blame and punishment","Yes. The other two areas (children as eyewitnesses; impact of legal proceedings like divorce and custody) were named but not the focus."],["Children as [[eyewitnesses]] and the accuracy of their memory","Named as an area, but not this unit’s focus."],["The impact of [[divorce and custody]] proceedings on children","Named as an area, but not this unit’s focus."],["Children’s rights to [[education]] under the law","Not one of the three areas."],["[[Adoption]] law and foster care placements","That was last exam’s unit."]],"k":"Three areas: (1) children as eyewitnesses, (2) impact of the legal system on involved children (divorce, custody), (3) youth suspected of committing crimes: competence, blame, punishment ← our focus."},{"id":"s4q002","s":4,"o":19,"t":"LR","sc":"rock","q":"What is ==\"the question\"== at the centre of the juvenile justice unit?","a":[["Should juveniles get the [[same blame]] and punishment as adults?","Yes. That’s the question lecture and Steinberg & Icenogle ask."],["Should juveniles be allowed to [[testify]] against adults in court?","That’s an eyewitness question."],["Should juveniles who commit crimes be [[excused]] from all responsibility?","The debate is about LESS responsibility (mitigation), not none."],["Should [[parents]] be punished for crimes their children commit?","Not the question."],["Should the age of [[schooling]] be raised to prevent youth crime?","Not the question."]],"k":"The question: same blameworthiness and same punishment as adults? And: due to their stage of development, are juveniles less culpable?"},{"id":"s4q003","s":4,"o":19,"t":"L","sc":"rock","q":"Lecture asked you to imagine someone throws a rock, then changed the thrower’s age: 25, 8, 12, 15, 18. What was the point?","a":[["[[Blame]] shifts with age, but [[where]] to draw the line is hard","Yes. Most people blame the 25-year-old fully and the 8-year-old very little. The in-between ages are where it gets tricky."],["Rock throwing is [[more harmful]] when done by younger children","Harm was held constant; only age changed."],["Adults and children should [[always]] be punished identically","The exercise shows most people don’t think so."],["Only people over [[25]] can form criminal intent","Not claimed."],["Age is [[irrelevant]] to how blameworthy someone is","The exercise shows the opposite intuition."]],"k":"Same act, same harm, different age → different blame. The hard part is the middle (12? 15? 18?).","h":"Same rock. Same broken window. But you’d treat an 8-year-old and a 25-year-old differently, right?"},{"id":"s4q004","s":4,"o":19,"t":"R","sc":"mice","q":"Some argue adolescence is just a ==social construction==. What evidence do Steinberg & Icenogle (2019) use against that view?","a":[["Adolescent [[brain development]] and similar [[rodent]] behaviour","Yes. Neuroscience shows normative adolescent brain patterns, and juvenile mice also show exploration, risk taking and independence seeking."],["Laws in [[every country]] set the age of majority at exactly 21","Most set it at 18, and laws are social conventions anyway."],["Adolescents [[report]] feeling different from adults in surveys","Self-reports wouldn’t counter the social-construction argument."],["The [[Industrial Revolution]] separated teens from the labour force","That’s actually part of the social-construction argument."],["Teenagers [[look]] physically different from adults","Not the evidence used."]],"k":"Adolescence is real biology: brain imaging + adolescent rodents acting ‘eerily similar’ to human teens.","h":"Teenage mice take more risks too… and nobody’s oppressing teenage mice."},{"id":"s4q005","s":4,"o":19,"t":"R","sc":"court","q":"In ==Roper v. Simmons (2005)==, what did the U.S. Supreme Court decide?","a":[["The [[death penalty]] is unconstitutional for those under [[18]]","Yes."],["[[Life without parole]] is unconstitutional for all adults under [[25]]","Not this case, and not that age."],["Juveniles may [[never]] be tried in adult criminal [[court]]","Not what the Court decided."],["The death penalty is allowed at [[16]] but not at [[15]]","That was the earlier Thompson v. Oklahoma (1988) line."],["States [[must]] sentence juvenile murderers to life without [[parole]]","Miller v. Alabama (2012) said states may NOT mandate that."]],"k":"Roper (2005): no death penalty under 18. Graham (2010): no life without parole for non-homicide under 18. Miller (2012): no MANDATORY life without parole under 18.","h":"R-G-M in order: Roper (death) → Graham (life, non-homicide) → Miller (mandatory life)."},{"id":"s4q006","s":4,"o":19,"t":"R","sc":"court","q":"Which Supreme Court case ruled that states may not ==mandate== life without parole for those under 18, even for homicide?","a":[["[[Miller v. Alabama]] (2012)","Yes."],["[[Roper v. Simmons]] (2005)","Roper banned the death penalty under 18."],["[[Graham v. Florida]] (2010)","Graham banned life without parole for NON-homicide crimes under 18."],["[[Thompson v. Oklahoma]] (1988)","Thompson banned the death penalty under 16."],["[[Montgomery v. Louisiana]] (2016)","Montgomery made Miller retroactive (resentencing or parole hearings)."]],"k":"Miller (2012): no mandatory life-without-parole for under-18s. Montgomery (2016) applied it to people sentenced earlier."},{"id":"s4q007","s":4,"o":19,"t":"R","sc":"court","q":"Across the Supreme Court cases from 1988 to 2016, what trend do Steinberg & Icenogle (2019) note?","a":[["The Court now relies [[more]] on [[developmental science]]","Yes. Thompson (1988) appealed to ‘standards of decency’; later cases cited psychology and brain science."],["The Court has become [[harsher]] toward juvenile offenders","The rulings progressively limited harsh sentences."],["The Court has [[stopped]] citing research in its opinions","The opposite."],["The Court has [[lowered]] the age for the death penalty","It raised the minimum (16, then 18)."],["The Court relies [[only]] on what ‘any parent knows’","Roper mentioned that phrase alongside scientific studies."]],"k":"Over time: more science in the Court’s reasoning (psychology, then brain science)."},{"id":"s4q008","s":4,"o":19,"t":"R","sc":"court","q":"What role do Steinberg & Icenogle (2019) think developmental scientists should play in legal policy?","a":[["[[Inform]] decisions with science, without [[advocating]] policy","Yes. Laws informed (not dictated) by science are preferable, and scientists should keep the line between science and advocacy."],["[[Dictate]] the exact age boundaries that lawmakers must [[adopt]]","Science ‘informs, not dictates’."],["[[Stay out]] of legal debates because findings are too [[nuanced]]","They acknowledge that hesitancy but argue against it."],["[[Campaign]] for whichever policy matches their personal [[values]]","They explicitly warn against that."],["[[Replace]] judges in deciding individual juvenile [[cases]]","Not suggested."]],"k":"Science should inform the law. Not dictate it, and not turn into advocacy.","h":"Scientists are the GPS, not the driver."},{"id":"s4q009","s":4,"o":20,"t":"L","sc":"scales","q":"What is ==penal proportionality==?","a":[["Punishment should fit both [[harm caused]] and offender [[culpability]]","Yes. Both harm and blameworthiness count."],["Punishment severity should depend [[only]] on the [[harm caused]]","Culpability matters too."],["Punishment should be [[identical]] for everyone who commits the same [[crime]]","Proportionality allows different punishment when culpability differs."],["Punishment should be [[proportional]] to the offender’s [[age]] alone","Age may affect culpability, but the principle is harm + culpability."],["Punishment should [[increase]] with each repeat [[offence]]","Not the definition."]],"k":"Penal proportionality: severity of punishment = f(harm caused, culpability of the person).","h":"Two-pan scale: one pan is HOW BAD was it, the other is HOW BLAMEWORTHY are you."},{"id":"s4q010","s":4,"o":20,"t":"L","sc":"scales","q":"What is the difference between an ==excuse== and ==mitigation==?","a":[["Excuse [[removes]] responsibility; mitigation [[lessens]] it","Yes. Excuse = not responsible. Mitigation = less responsible, less punishment."],["Excuse [[lessens]] responsibility; mitigation [[removes]] it","Reversed."],["Excuse applies to [[adults]]; mitigation applies to [[juveniles]]","Both can apply to anyone."],["Excuse concerns [[harm]]; mitigation concerns [[punishment]] type","Both concern responsibility."],["They are two [[words]] for the same legal [[idea]]","They differ in degree: all vs. some."]],"k":"Excuse = responsibility removed. Mitigation = responsibility (and punishment) reduced.","h":"Excuse = 100% off. Mitigation = a discount."},{"id":"s4q011","s":4,"o":20,"t":"L","sc":"mitig","q":"Which are the ==three factors that can mitigate== criminal responsibility?","a":[["Impaired [[decisions]], [[external pressure]], [[out of character]]","Yes, these three."],["[[Young age]], low [[income]], and no prior [[record]]","Lecture asked for factors BEYOND age, and these aren’t the three."],["[[Remorse]], [[confession]], and paying the victim [[back]]","Not the three."],["Low [[harm]], few [[witnesses]], and weak [[evidence]]","Those don’t concern culpability."],["[[Peer]] presence, [[sensation]] seeking, and [[brain]] immaturity","These are reasons adolescents may MEET the three factors, not the factors themselves."]],"k":"Three mitigators: (1) impairments/deficiencies in decision making, (2) offence in response to compelling external circumstances, (3) act is out-of-character.","h":"D-E-C: Decision-making impaired, External pressure, out-of-Character."},{"id":"s4q012","s":4,"o":20,"t":"L","sc":"mitig","q":"A man robs a store only because someone threatened to hurt his family if he refused. Which mitigating factor applies?","a":[["Compelling [[external circumstances]]","Yes. He acted under extreme outside pressure (duress)."],["[[Impairment]] in decision-making capacity","Nothing suggests his reasoning ability was impaired."],["The act is [[out of character]]","Maybe, but the key detail given is the threat."],["[[Excuse]] through lack of harm","Harm occurred; this is about culpability."],["[[Penal]] disproportionality","Not a mitigating factor."]],"k":"External circumstances = coercion, duress, provocation: the situation pushed them."},{"id":"s4q013","s":4,"o":20,"t":"L","sc":"mitig","q":"A model citizen with no history of trouble commits a single offence during an unusual crisis and never offends again. Which mitigating factor fits best?","a":[["The act is [[out of character]]","Yes. The offence doesn’t reflect who the person generally is."],["[[Impaired]] decision making","Nothing indicates a deficiency in reasoning."],["Compelling [[external]] circumstances","A ‘crisis’ hints at this, but the stem stresses the clean record and one-off nature."],["Lack of [[proportionality]]","Not a mitigating factor."],["[[Excuse]] by reason of age","Age isn’t mentioned."]],"k":"Out-of-character = the act isn’t the product of a settled bad character.","h":"For teens this matters a lot: their character is still under construction."},{"id":"s4q014","s":4,"o":20,"t":"L","sc":"mitig","q":"Lecture asked: ‘Due to their stage of development, are juveniles less culpable?’ How do adolescents map onto the three mitigating factors?","a":[["Weak [[self-control]], [[peer]] sway, unformed [[character]]","Yes. Decision making is still developing (impulse control, future orientation), they’re more responsive to external pressure (peers), and their acts are less a sign of fixed character."],["Lower [[IQ]], less [[schooling]], and smaller [[body]] size","Cognitive ability is adult-like by mid-adolescence; that’s not the argument."],["Less [[harm]] caused, fewer [[victims]], and smaller [[crimes]]","Mitigation is about culpability, not harm."],["No [[understanding]] of right and wrong before age 18","Teens can reason well in calm conditions."],["Full [[adult]] capacity, so no mitigation applies","Lecture’s evidence points the other way."]],"k":"Adolescence ↔ all three mitigators: decision-making immaturity (psychosocial), susceptibility to external pressure (peers), unformed character.","h":"This is the bridge between the law part and the brain part of the unit."},{"id":"s4q015","s":4,"o":20,"t":"L","sc":"scales","q":"Two people commit the same crime and cause the same harm. Under penal proportionality, can they fairly receive ==different== punishments?","a":[["Yes, if their [[culpability]] differs","Right. Same harm, different blameworthiness → different punishment."],["No, because the [[harm]] is identical","Harm is only one of the two inputs."],["Yes, but only if one is under [[12]]","Culpability can differ for many reasons, not just being a young child."],["No, because fairness means [[equal]] sentences","Proportionality defines fairness as matching punishment to harm AND culpability."],["Yes, but only if one [[confesses]] first","Confession isn’t the principle here."]],"k":"Proportionality ≠ identical sentences. It means punishment fits harm AND culpability."},{"id":"s4q016","s":4,"o":20,"t":"L","sc":"scales","q":"The lessening of criminal responsibility (and punishment) is called ____.","a":[["[[mitigation]]","Yes."],["[[excuse]]","Excuse REMOVES responsibility entirely."],["[[proportionality]]","That’s the broader principle."],["[[culpability]]","That’s blameworthiness itself."],["[[majority]]","Age of majority is when someone becomes a legal adult."]],"k":"Mitigation = lessening. Excuse = removing.","b":1},{"id":"s4q017","s":4,"o":21,"t":"LR","sc":"coldhot","q":"What did lecture (Icenogle et al., 2019) say about ==cognitive skills== in adolescence?","a":[["In many ways they are [[adult-like]] by [[mid-to-late]] adolescence","Yes. Reasoning-type abilities reach adult levels around age 16."],["They remain [[childlike]] until the [[mid-twenties]]","That’s closer to psychosocial maturity, not cognitive capacity."],["They [[decline]] during adolescence, then recover in [[adulthood]]","No decline was described."],["They mature [[later]] than self-regulation and impulse [[control]]","Reversed: cognitive first, psychosocial later."],["They are fully mature by the [[end of childhood]], around ten","Too early."]],"k":"Cognitive capacity (logical reasoning, etc.) ≈ adult-like by mid–late adolescence (around 16).","h":"A 16-year-old can THINK like an adult… in a calm room."},{"id":"s4q018","s":4,"o":21,"t":"LR","sc":"coldhot","q":"How does ==psychosocial== development compare with cognitive development in adolescence?","a":[["Psychosocial skills keep developing after cognition [[matures]]","Yes. Self-regulation, future orientation and resistance to peers lag behind reasoning, into the late teens and twenties."],["Psychosocial skills mature [[first]], several years before [[reasoning]]","Reversed."],["Both mature at the [[same time]], around age [[sixteen]]","They follow different timetables."],["Psychosocial skills are [[fixed]] by the end of [[childhood]]","They keep developing."],["Neither changes after [[puberty]] begins","Both change during adolescence."]],"k":"Cognitive: mature by ~16. Psychosocial: still maturing through adolescence, to at least 21. The gap between them is the ‘maturity gap’.","h":"Brain’s accelerator and logic are ready early. The brakes come years later."},{"id":"s4q019","s":4,"o":21,"t":"L","sc":"coldhot","q":"Lecture noted that cognitive skills are ==influenced by== psychosocial skills. Why does that matter?","a":[["Good reasoning can be [[undermined]] by weak self-control","Yes. A teen may know the smart choice but fail to act on it when impulsive, excited or with friends."],["Psychosocial skills make reasoning [[unnecessary]] for decisions","Both are needed."],["Reasoning ability [[determines]] how sensation seeking a teen is","Not the claim."],["It means teens [[cannot]] reason logically in any situation","They can, especially in calm conditions."],["It means IQ tests are [[invalid]] for adolescents","Not the claim."]],"k":"Knowing better ≠ doing better. Reasoning works through (and is limited by) self-regulation."},{"id":"s4q020","s":4,"o":21,"t":"L","sc":"tower","q":"Which four ==psychosocial== capacities did lecture cover?","a":[["[[Self-regulation]], [[future orientation]], [[sensation seeking]], [[peers]]","Yes, those four."],["[[Working memory]], [[logical reasoning]], [[vocabulary]], processing speed","Those are cognitive capacities."],["[[Attachment]], [[temperament]], [[empathy]], moral reasoning","Not this lecture’s list."],["[[Symbolic thought]], [[self-distancing]], [[pretend]], perspective taking","That’s the play unit."],["[[Mastery goals]], [[belonging]], [[self-esteem]], engagement","That’s the schooling unit."]],"k":"Psychosocial: (1) self-regulation, (2) future orientation, (3) sensation seeking & reward sensitivity, (4) peer influence.","h":"S-F-S-P: Self-control, Future, Sensation, Peers."},{"id":"s4q021","s":4,"o":21,"t":"L","sc":"tower","q":"What did lecture say about ==self-regulation== (impulse control) across adolescence?","a":[["It becomes [[gradually better]] throughout adolescence","Yes: ‘Ability to control impulses becomes gradually better throughout adolescence.’"],["It [[peaks]] in early adolescence and then [[declines]]","That’s the grey matter (and roughly sensation seeking) pattern, not impulse control."],["It is [[adult-like]] by about age [[twelve]]","Far too early."],["It gets [[worse]] every year until age [[eighteen]]","It improves."],["It does [[not change]] between ages ten and thirty","It improves gradually."]],"k":"Impulse control: a slow, steady climb through adolescence (into the twenties, per Steinberg)."},{"id":"s4q022","s":4,"o":21,"t":"L","sc":"tolc","q":"Lecture showed data from a puzzle task (Steinberg et al., 2008) measuring ‘time to first move’. Why is that a measure of ==impulse control==?","a":[["[[Waiting]] before moving shows [[planning]], not impulse","Yes. Jumping straight in = impulsive. Pausing to think = self-regulated. Older participants wait longer."],["[[Faster]] first moves show stronger [[working memory]]","Speed here signals impulsivity, not better memory."],["The first move reveals a person’s [[sensation]] seeking","It’s about holding back, not thrill seeking."],["[[Slower]] moves show the puzzle was too [[difficult]]","The interpretation is planning, not difficulty."],["It measures how much [[peers]] influence choices","No peers were involved in this measure."]],"k":"Time to first move: longer pause = more planning = better impulse control. It increases with age.","h":"The kid who grabs the first piece instantly vs. the one who goes ‘hmm, wait…’."},{"id":"s4q023","s":4,"o":21,"t":"L","sc":"money","q":"‘Would you take $400 tomorrow or $1,000 in a year?’ Which psychosocial capacity does this question measure?","a":[["[[Future orientation]]","Yes. Choosing the bigger, later reward shows weighing long-term consequences (temporal/delay discounting)."],["[[Peer influence]]","No peers involved."],["[[Sensation seeking]]","It’s about valuing the future, not chasing thrills."],["[[Logical reasoning]]","Both options are easy to understand; the difference is how much the future is valued."],["[[Penal proportionality]]","That’s a legal principle."]],"k":"Future orientation: over adolescence, teens become better able to think about long-term consequences.","h":"Adolescents ‘discount’ the future: later rewards feel smaller than they really are."},{"id":"s4q024","s":4,"o":21,"t":"LR","sc":"money","q":"Compared with adults, how do adolescents tend to respond on ==delay-of-reward== choices?","a":[["They more often prefer [[smaller, immediate]] rewards over larger, delayed ones","Yes (temporal discounting). Future orientation improves over adolescence."],["They more often prefer [[larger, delayed]] rewards over smaller, immediate ones","That’s the more mature pattern."],["They choose [[at random]] because they don’t understand the options","They understand; they just weigh ‘now’ more heavily."],["They [[refuse]] both rewards when a peer is watching","Not the finding."],["They respond [[exactly]] like adults by age thirteen","Future orientation keeps developing."]],"k":"Teens overvalue NOW relative to LATER. Steinberg: this short-sightedness even shows up in plea decisions."},{"id":"s4q025","s":4,"o":21,"t":"L","sc":"brain","q":"What happens to ==white matter== across adolescence?","a":[["It shows a [[linear increase]] (more myelination)","Yes: ‘White matter (myelination) → linear increase.’"],["It [[peaks]] in early adolescence, then [[decreases]]","That’s grey matter."],["It [[decreases]] steadily as unused connections are [[pruned]]","Pruning is about grey matter."],["It stays [[constant]] after age ten","It keeps increasing."],["It increases only in the [[limbic]] system","The slide described a general linear increase."]],"k":"White matter (myelin = insulation on connections) → steady, linear increase.","h":"White = Wiring. More insulation every year = faster, more reliable signals."},{"id":"s4q026","s":4,"o":21,"t":"L","sc":"brain","q":"What happens to ==grey matter== across adolescence?","a":[["It [[peaks]] in early adolescence, then [[declines]]","Yes: ‘Grey matter (neurons/synapses) → peak in early adolescence, decrease after.’"],["It shows a [[linear increase]] into the twenties","That’s white matter."],["It [[decreases]] from birth until adulthood","It rises first, then falls."],["It [[doubles]] at puberty and stays at that level","It decreases after its peak."],["It does [[not change]] after early childhood","It changes through adolescence."]],"k":"Grey matter (neurons/synapses) → inverted U: peak in early adolescence, then pruning.","h":"Grey = Garden. Overgrow first, then prune back the branches you don’t use."},{"id":"s4q027","s":4,"o":21,"t":"L","sc":"brain","q":"White matter increases while grey matter is pruned after early adolescence. What is the ==overall result==?","a":[["The brain gradually becomes more [[efficient]]","Yes: '→ Gradually becoming more efficient.’ Fewer, stronger, better-insulated connections."],["The brain gradually becomes [[larger]] in total volume","Size isn’t the story (it’s near adult size by about 10)."],["The brain gradually [[loses]] the ability to learn","Pruning is refinement, not loss of ability."],["The brain becomes [[less connected]] between regions","Connectivity actually strengthens."],["The brain [[stops]] changing once grey matter peaks","Change continues into the twenties."]],"k":"More myelin + pruned synapses = a more efficient brain.","h":"From a tangle of dirt paths to a few paved highways."},{"id":"s4q028","s":4,"o":21,"t":"L","sc":"igt","q":"What did lecture say about ==sensation seeking== in adolescence?","a":[["It [[peaks]] in adolescence","Yes: ‘Sensation seeking peaks in adolescence.’"],["It increases [[steadily]] until old age","It declines after adolescence."],["It is [[highest]] in early childhood","The peak is in adolescence."],["It is [[absent]] until adulthood","It’s strongest in the teen years."],["It stays [[flat]] from ages ten to thirty","It rises and then falls."]],"k":"Sensation seeking: an inverted U that peaks in adolescence."},{"id":"s4q029","s":4,"o":21,"t":"L","sc":"igt","q":"Lecture (Cauffman et al., 2010) described two separate trends in how teens respond to ==rewards and risks==. Which is correct?","a":[["[[Reward approach]] peaks in the teens; [[risk avoidance]] matures at 18+","Yes: ‘Most driven to approach rewards in teen years, but avoidance of risk not until 18+.’"],["[[Reward approach]] peaks in adulthood; [[risk avoidance]] peaks in the teens","Reversed."],["[[Both]] reward approach and risk avoidance peak at age twelve","They follow different timelines."],["Teens are [[more concerned]] about risk than adults are","Teens are driven more by reward and less concerned about risk."],["Reward approach and risk avoidance [[never change]] with age","Both change."]],"k":"Teens: gas pedal (reward approach) floored. Brake (risk avoidance) not fully installed until 18+.","h":"Teens driven more by reward, less concerned about risk."},{"id":"s4q030","s":4,"o":21,"t":"LR","sc":"peers","q":"What did lecture say about ==peer influence== in adolescence?","a":[["Adolescents are [[more responsive]] to peers than other ages","Yes (Albert et al., 2013)."],["Adolescents are [[less responsive]] to peers than adults are","The opposite."],["Peer influence is [[strongest]] in middle childhood","It’s strongest in adolescence."],["Peers affect teens only through [[direct pressure]] and dares","Steinberg notes just being observed by peers increases risk taking."],["Peer influence [[disappears]] by age fourteen","Susceptibility is high in the early-to-mid teens and declines later."]],"k":"Adolescents: more oriented to and responsive to peers than kids or adults."},{"id":"s4q031","s":4,"o":21,"t":"R","sc":"peers","q":"In studies of risk taking with peers present (e.g., Chein et al., 2011), what is found?","a":[["[[Adolescents]] take more risks when watched; [[adults]] don’t","Yes. The effect appears even when peers are in another room and can’t talk to the participant."],["[[Adults]] take more risks when observed; [[adolescents]] don’t change","Reversed."],["[[Both]] groups take fewer risks when peers are watching","Adolescents take MORE."],["[[Neither]] group changes behaviour when peers are present","Adolescents do change."],["Adolescents take more risks only when peers [[dare]] them aloud","Mere observation is enough."]],"k":"Mere presence of peers → more adolescent risk taking. Adults: no change.","h":"A teen driving alone stops at the yellow light. Same teen with friends in the car: ‘I can make it.’"},{"id":"s4q032","s":4,"o":21,"t":"R","sc":"dual","q":"What is the ==maturational imbalance (dual systems)== account of adolescent risk taking?","a":[["The [[reward]] system ramps up early, while the [[cognitive control]] system matures slowly","Yes. The socioemotional/reward system (limbic) changes around puberty; the control system (prefrontal cortex) keeps maturing into the mid-twenties."],["The [[control]] system matures early, while the [[reward]] system matures in the twenties","Reversed."],["[[Both]] systems mature together in early adolescence","The imbalance comes from different timetables."],["Adolescents [[lack]] a reward system until late adolescence","It’s highly active in adolescence."],["Risk taking reflects [[low intelligence]] during the teen years","Cognitive capacity is adult-like by mid-adolescence."]],"k":"Dual systems: early-revving reward system + slowly maturing control system = a window of heightened risk taking in mid/late adolescence.","h":"A sports car engine (reward) with bicycle brakes (control)."},{"id":"s4q033","s":4,"o":21,"t":"R","sc":"dual","q":"In the dual systems account, which brain areas are mainly tied to ==each system==?","a":[["Reward/sensation seeking: [[limbic system]]; self-control: [[prefrontal cortex]]","Yes."],["Reward/sensation seeking: [[prefrontal cortex]]; self-control: [[limbic system]]","Reversed."],["Reward/sensation seeking: [[cerebellum]]; self-control: [[brainstem]]","Not the regions named."],["Reward/sensation seeking: [[occipital]] lobe; self-control: [[temporal]] lobe","Not the regions named."],["Both systems sit in the [[prefrontal cortex]]","They’re localized differently."]],"k":"Reward → limbic system (striatum). Control → prefrontal cortex.","h":"Limbic = ‘let’s GO’. Prefrontal = ‘let’s think about this’."},{"id":"s4q034","s":4,"o":21,"t":"R","sc":"dual","q":"Steinberg & Icenogle (2019) note the prefrontal cortex itself is largely developed by 16. So why does self-regulation keep improving into the twenties?","a":[["Prefrontal [[connections]] are still maturing ([[myelination]])","Yes. Top-down connectivity keeps strengthening into the early or mid-twenties."],["The brain is still growing in [[overall size]] until age 25","Size is adult-like by about 10."],["[[Grey matter]] keeps increasing through the twenties","Grey matter declines after early adolescence."],["The [[limbic system]] shrinks until it stops working","Not the explanation."],["[[Hormones]] stop being produced after age 21","Not the explanation."]],"k":"It’s about wiring between regions, not just the regions themselves.","h":"The control tower is built by 16. The phone lines to the rest of the airport take until the mid-20s."},{"id":"s4q035","s":4,"o":21,"t":"R","sc":"coldhot","q":"Studies (e.g., Cohen et al., 2016) compared 18–21-year-olds’ impulse control in neutral vs. ==emotionally arousing== conditions. What was found?","a":[["When [[calm]] they performed like adults; when [[aroused]], like teens","Yes. Under emotional arousal, 18–21-year-olds’ behaviour and brain activity looked like younger teenagers’."],["When [[aroused]] they performed like adults; when [[calm]], like teens","Reversed."],["They performed like [[adults]] in both conditions","Arousal made a big difference."],["They performed like [[mid-teens]] in both conditions","When calm, they matched adults."],["Emotional arousal [[improved]] their impulse control","It impaired it."]],"k":"18–21-year-olds: adult-like when cool, teen-like when emotions run hot.","h":"This is the evidence behind ‘maybe 21, not 18’ for hot-context laws."},{"id":"s4q036","s":4,"o":21,"t":"R","sc":"coldhot","q":"According to Steinberg & Icenogle (2019), which abilities ==plateau by mid-adolescence==?","a":[["[[Working memory]] and [[logical reasoning]]","Yes. Basic cognitive functions and higher-order reasoning level off around 15–17."],["[[Impulse control]] in emotionally arousing situations","That keeps developing into the twenties."],["[[Resistance]] to peer influence","Still developing."],["[[Future orientation]] and planning ahead","Still developing through late adolescence."],["[[Risk avoidance]] and reward regulation","Not mature until later."]],"k":"Cold cognitive capacities plateau early. Hot, self-regulatory capacities keep developing."},{"id":"s4q037","s":4,"o":21,"t":"LR","sc":"coldhot","q":"Sixteen-year-old Jay calmly talks with his doctor about a medical treatment and weighs the options sensibly. That weekend, with friends cheering him on, he drives far over the speed limit. Which idea explains BOTH behaviours?","a":[["Jay reasons like an [[adult]] when calm but not when [[aroused]]","Yes. Cold context → mature decision. Hot context (peers, excitement, time pressure) → immature decision."],["Jay has [[low]] cognitive ability that varies from day to [[day]]","His reasoning ability is fine."],["Jay’s [[grey matter]] has not yet reached its peak","Grey matter peaks in early adolescence."],["Teens [[cannot]] understand risks until they turn eighteen","He understands them; acting on that under arousal is the hard part."],["Medical choices are [[easier]] than driving choices for everyone","The difference is the context (calm vs. aroused), not the topic."]],"k":"Same teen, two contexts: ‘cold’ (unhurried, calm) vs ‘hot’ (emotional, peers, rushed).","h":"He KNOWS speeding is dumb. Knowing isn’t the problem."},{"id":"s4q038","s":4,"o":21,"t":"R","sc":"brain","q":"For most of the 20th century, when did scientists believe ==brain maturation ended==, and why?","a":[["At about [[10]], when the brain reaches adult [[size]]","Yes. Looking only at size and volume missed the internal changes that brain imaging later revealed."],["At [[birth]], because all neurons are already [[present]]","Not the belief described."],["At [[puberty]], because hormones [[finish]] brain growth","Not the belief described."],["At [[25]], because the prefrontal cortex is [[complete]]","That’s closer to the modern view."],["At [[18]], because that is the legal age of [[majority]]","Not the belief described."]],"k":"Old view: brain d
