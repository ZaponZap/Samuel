s closer, higher-quality relationships and social capital. Rich-get-richer: benefits go to already-social teens. Social compensation: shy teens benefit most.","n":[["k","==Stimulation== = online → closer relationships for all."],["m","Stimulate the whole garden."]],"v":"socialHyp","vp":"f"},{"id":"s5q057","s":5,"t":"L","q":"Sasha is outgoing and popular; her social media use deepens her already-large friend network. Which hypothesis does this support?","a":"Rich-get-richer (social enhancement)","d":["Social compensation (online makes up for offline)","Stimulation (online deepens all ties)","Displacement (online replaces offline time)","Goldilocks (moderate use is best)","Video deficit (screens teach less)"],"e":"==Rich-get-richer (social enhancement)==: benefits of social media go mostly to ==highly social adolescents== who already have strong social skills and networks.","n":[["k","Already social → gains more = ==rich-get-richer==."]],"v":"socialHyp","vp":"f"},{"id":"s5q058","s":5,"t":"L","q":"Eli is anxious talking face-to-face, but online he opens up and makes close friends. Which hypothesis does this support?","a":"The social compensation hypothesis","d":["The rich-get-richer hypothesis","The stimulation hypothesis","The social enhancement hypothesis","The displacement hypothesis","The contingency hypothesis"],"e":"==Social compensation==: adolescents ==uncomfortable interacting face-to-face== may gain benefits online, making up for offline difficulties.","n":[["k","Shy offline, thrives online = ==social compensation==."],["x","Social enhancement = rich-get-richer (the opposite group)."]],"v":"socialHyp","vp":"f"},{"id":"s5q059","s":5,"t":"L","q":"Which of the three social media hypotheses (stimulation, rich-get-richer, social compensation) did lecture say is true?","a":"It depends on type of use, platform, social ties, and gender","d":["Only the stimulation hypothesis has strong, consistent support","Only the social compensation hypothesis has been supported in teens","Only the rich-get-richer hypothesis has support","None; social media shows no social benefits at all","All three hold equally for every adolescent"],"e":"Lecture: which is true “==seems to depend on type of use, type of social media, type of social ties (strong, weak), gender of individual==.”","n":[["k","Answer = ==it depends== (use, platform, ties, gender)."]],"v":"socialHyp","vp":"f"},{"id":"s5q060","s":5,"t":"L","q":"Lecture defined “social capital” in the context of social media as…","a":"resources available through one’s relationships","d":["the number of followers someone has across platforms","the money someone earns from posting content online","the total time spent socializing online each day","the ability to resist peer pressure online","a teen’s popularity rank at school"],"e":"==Social capital== = the ==resources available as a result of relationships== (support, information, opportunities). Social media has been argued to boost social connection and social capital.","n":[["k","Social capital = ==resources from relationships==."],["x","Not just follower counts."]]},{"id":"s5q061","s":5,"t":"L","q":"Which visual attention skills did lecture link to action video game play?","a":"Object tracking, peripheral attention, and mental rotation","d":["Phonological awareness, vocabulary size, and grammar skills","Long-term memory, reading speed, and spelling accuracy","Emotion regulation, empathy, and theory of mind","Fine motor control, handwriting, and balance","Sustained reading attention, math fluency, and planning"],"e":"Action video games have been linked to benefits in ==object tracking==, ==peripheral attention==, and ==mental rotation==, in both adults and children.","n":[["k","AVG → ==tracking · periphery · rotation==."],["m","Track it, spot it at the edge, spin it."]],"v":"avg","vp":"f"},{"id":"s5q062","s":5,"t":"L","q":"What makes a game an “action video game” in the research lecture described?","a":"Fast pace, many unpredictable targets, and rapid responses","d":["Violent content, weapons, or combat of any kind in the game","Being played on a home console rather than on a mobile phone","Slow, turn-based strategy with lots of planning","Built-in educational goals and quiz questions","Being played for more than an hour each day"],"e":"AVGs are ==fast-paced==, with ==many unpredictable, rapidly moving stimuli== requiring ==rapid responses== and switching between focused and distributed attention. Violence isn’t required: Fruit Ninja counts.","n":[["k","AVG = speed + unpredictability + many targets."],["x","Violence isn’t the defining feature (Fruit Ninja is an AVG)."]],"v":"avg","vp":"f"},{"id":"s5q063","s":5,"t":"L","q":"Noor’s parents buy her a console with fast-paced games full of moving targets. Compared with before, what would research most likely predict a few months later?","a":"Better visual attention and tracking, but a possible dip at school","d":["Better school performance and better visual attention, through practice","Better school performance, but no change in visual attention skills","No change in visual attention, but better reading scores","Worse visual attention and worse school performance overall","More secure attachment with her parents through shared play"],"e":"Action games are linked to ==better visual attention/object tracking==. Getting a first game system was linked to ==lower reading and writing== in Weis & Cerankosky (2010), likely through displacement.","n":[["k","AVG: attention ↑ · new system: school ↓ (displacement)."],["c","Twin of practice Q7 (Kayden): Both 2 and 3."]],"v":"avg","vp":"f"},{"id":"s5q064","s":5,"t":"L","q":"Which real-world applications of action video game research did lecture mention?","a":"Surgeon and flight-control training, vision rehab, dyslexia support","d":["Treatment for insecure attachment and parenting stress in families","Replacing reading instruction in elementary school classrooms","Preventing cyberbullying among middle-school students","Improving sleep in children diagnosed with ADHD","Teaching vocabulary to infants under 18 months"],"e":"Lecture listed ==job training (surgeons, flight control)==, ==rehabilitation for vision problems==, and ==support for individuals with dyslexia==.","n":[["k","Surgeons · pilots/flight control · vision rehab · dyslexia."]],"v":"avg","vp":"f"},{"id":"s5q065","s":5,"t":"L","q":"A parent says, “Video games boost attention, so I’ll let my child play whatever he wants.” What is the best response based on lecture?","a":"Attention benefits are specific to action games, which may also carry risks","d":["That’s right; all kinds of video games improve visual attention equally, whatever the genre","That’s right; video games also reliably improve academic performance at school","That’s wrong; research shows video games never affect attention","That’s wrong; video games only improve attention in adults, not kids","That’s right, as long as the games he chooses contain violence"],"e":"The attention benefits come from ==action video games==, not any game. Lecture also asked whether the same AVG can ==carry benefits and risks at the same time== and whether benefits ==persist==. Getting a game system can lower school performance (Weis & Cerankosky).","n":[["k","Only ==action== games → attention gains."],["x","Free choice of any game isn’t supported (practice Q9)."]]},{"id":"s5q066","s":5,"t":"L","q":"Which open question about action video games did lecture raise?","a":["Which games “count” as useful action video games?","Can the same game carry benefits and risks at the same time?","Do the benefits persist over time?"],"d":["Do action video games affect any cognitive skills at all?","Can children ever learn from screens?","Do adults show any benefits from action games?","Are video games played by children at all?","Do action games improve vocabulary in infants?"],"e":"Lecture asked: ==which video games “count” as useful AVGs==? Can the ==same AVG carry benefits and risks== at once? Do the ==benefits persist== over time?","n":[["k","Open: what counts · benefits + risks together · persistence."]]},{"id":"s5q067","s":5,"t":"L","q":"How did lecture define dyslexia?","a":"A learning disorder involving difficulty decoding letter–sound links","d":["A visual impairment that makes printed letters appear reversed or mirrored","A general intellectual disability that affects all areas of learning","An attention disorder marked by hyperactivity and impulsivity","A language disorder affecting spoken vocabulary only","A motor disorder mainly affecting handwriting speed"],"e":"==Dyslexia== is a learning disorder characterized by difficulties in ==reading and decoding letter–sound correspondences==, with challenges in ==phonological processing== (sounds of language) and in ==visual attention==.","n":[["k","Dyslexia = reading/decoding difficulty · phonological + ==visual attention== challenges."],["x","Not low intelligence (Peters required normal IQ)."]]},{"id":"s5q068","s":5,"t":"L","q":"Why might action video games be a plausible intervention for dyslexia?","a":"Dyslexia involves visual attention challenges, which action games train","d":["Action games directly teach phonics and letter–sound rules through play","Action games increase reading time by displaying lots of on-screen text","Dyslexia is caused by too little early screen exposure","Action games build vocabulary through spoken narration","Children with dyslexia usually prefer games to reading"],"e":"Besides phonological difficulties, dyslexia involves ==visual attention challenges==. AVGs train dynamic visual attention ==without teaching reading directly==, so reading gains would point to attention’s role in reading.","n":[["k","Dyslexia’s ==visual attention== side → AVG target."],["x","AVGs don’t teach phonics."]],"v":"peters","vp":"f"},{"id":"s5q069","s":5,"t":"LR","q":"What was the design of Peters et al. (2021)?","a":"Children with dyslexia were randomized to control, Fruit Ninja by mouse, or Fruit Ninja by eye-tracker","d":["Children with and without dyslexia played Fruit Ninja for 5 hours, and their reading gains were then compared","Children with dyslexia chose whether to play action games or puzzle games for 5 hours of training","Children with dyslexia were randomized to Call of Duty or Fruit Ninja for 12 hours","Teachers rated reading before and after children received intensive phonics training","Children with dyslexia played Fruit Ninja at home, with no comparison group"],"e":"Children with dyslexia (8–13 years) were ==randomly assigned== to a ==control== (no additional training), ==AVG-R== (Fruit Ninja with a computer mouse), or ==AVG+== (Fruit Ninja via ==eye-tracker==), for ==5 hours (10 × 30-minute sessions)==.","n":[["k","3 groups: control · AVG-R (mouse) · AVG+ (eyes)."],["n","8–13 y · 5 h = 10 × 30 min."]],"v":"peters","vp":"q","rd":"Peters et al. (2021)"},{"id":"s5q070","s":5,"t":"LR","q":"How much action video game training did children receive in Peters et al. (2021)?","a":"5 hours: ten 30-minute sessions","d":["12 hours spread over 2 weeks","1 hour in a single long session","20 hours spread over 2 months","30 minutes a day for 6 months","5 hours a day for 2 weeks"],"e":"Training was ==5 hours total (10 × 30-minute sessions)== over 2 weeks, shorter than the ~12 hours used in most earlier AVG–dyslexia studies.","n":[["n","==5 h = 10 × 30 min== (most prior studies: 12 h)."]],"v":"peters","vp":"f","rd":"Peters et al. (2021)"},{"id":"s5q071","s":5,"t":"LR","q":"What did Peters et al. (2021) find?","a":"Both game groups improved more in reading than controls; mouse ≈ eye-tracker","d":["Only the eye-tracker group improved in reading; the mouse group did not change","Neither game group improved more in reading than the treatment-as-usual group","The comparison group improved most because of school phonics","Both game groups improved in math but not in reading skills","The mouse group improved, but the eye-tracker group got worse"],"e":"==AVG training increased reading skills== (accuracy, rate, comprehension) and rapid naming versus the comparison group. ==No significant difference between AVG-R (mouse) and AVG+ (eye-tracker)==.","n":[["k","AVG → reading ↑; mouse ≈ eyes."],["x","Adding eye-control did NOT add benefit."]],"v":"petersRes","vp":"f","rd":"Peters et al. (2021)"},{"id":"s5q072","s":5,"t":"LR","q":"Why is Peters et al. (2021) considered stronger evidence of causation than most media research?","a":"Children were randomly assigned and tested before and after","d":["It used a large national sample of over 10,000 children","It relied on parents’ detailed reports of children’s gaming","It followed the same children for more than 10 years","It compared children who chose to play with those who didn’t","It measured reading progress with teacher ratings only"],"e":"Peters et al. ran a ==randomized controlled trial== (registered clinical trial): children were ==randomly allocated== to groups and tested ==before (T1) and after (T2)== training. Random assignment rules out many selection explanations.","n":[["k","==RCT== + pre/post → stronger causal claim."],["c","Contrast: most media research is correlational (Munzer)."]],"rd":"Peters et al. (2021)"},{"id":"s5q073","s":5,"t":"R","q":"How many children took part in Peters et al. (2021), and how were they split?","a":"64 children: 23 AVG+, 22 AVG-R, and 19 comparison","d":["236 children: half played games, half didn’t","64 children: 32 games, 32 comparison","120 children: 40 per group","45 children: 23 AVG+ and 22 AVG-R, with no comparison","19 children, all of whom played Fruit Ninja"],"e":"==64 dyslexic children== (Grades 3–6, ages ~8–13) from Melbourne schools: ==23 AVG+==, ==22 AVG-R==, ==19 treatment-as-usual comparison==.","n":[["n","N = ==64== (23 / 22 / 19)."],["x","236 is Bernier’s sample."]],"rd":"Peters et al. (2021)"},{"id":"s5q074","s":5,"t":"R","q":"What did the comparison group in Peters et al. (2021) receive?","a":"Their school’s usual phonics-based reading support only","d":["A non-action puzzle game for the same 5 hours of training","One-on-one phonics tutoring delivered by the research team","Fruit Ninja played on a tablet at home instead","No reading instruction of any kind during the study","An eye-movement training program with no game"],"e":"The comparison group got ==treatment as usual==: school-based phonics programs like Jolly Phonics and Reading Eggs, which the AVG groups also received. They did NOT get a placebo game, which leaves room for motivation or novelty explanations.","n":[["k","Comparison = school phonics as usual (no placebo game)."],["x","Not a non-action game control."]],"rd":"Peters et al. (2021)"},{"id":"s5q075","s":5,"t":"R","q":"Which reading outcome did Peters et al. (2021) claim to show improving after AVG training for the first time?","a":"Text reading comprehension","d":["Reading rate and fluency","Spelling accuracy in dictation","Phonological awareness","Expressive vocabulary size","Handwriting speed"],"e":"Earlier reviews found AVGs improve reading ==rate and fluency==. Peters et al. claim to be the first to show greater improvement in ==text reading accuracy and comprehension== than the comparison group.","n":[["k","New: ==comprehension== (and accuracy) ↑ after AVG."],["n","Rate/fluency gains were already known."]],"rd":"Peters et al. (2021)"},{"id":"s5q076","s":5,"t":"R","q":"In Peters et al. (2021), which children showed the greatest gains in reading accuracy?","a":"Those whose low-contrast temporal processing improved most","d":["Those who already had the fastest temporal processing at baseline","Those with the highest nonverbal IQ scores at the start of the study","Those in the comparison group who got extra phonics","Those who also practised Fruit Ninja at home","Those who made the most fixations during rapid naming"],"e":"Children whose ==low-contrast flicker fusion (magnocellular-temporal processing) improved most== showed the greatest ==reading accuracy== gains. Children with ==lower baseline== flicker thresholds improved most, suggesting AVGs may help a slower-temporal-processing subgroup. (Lecture said you can skip the fancy eye details.)","n":[["k","Bigger temporal-processing gains ↔ bigger accuracy gains."],["n","Lower baseline → more improvement."]],"rd":"Peters et al. (2021)"},{"id":"s5q077","s":5,"t":"R","q":"Why do Peters et al. (2021) think the eye-tracker version (AVG+) didn’t outperform the mouse version?","a":"Eye control likely made play more effortful and fatiguing","d":["The eye-tracker broke down during most training sessions","Children in AVG+ completed far fewer training sessions","Eye movements are irrelevant to visual attention","AVG+ children were older and already better readers","Children in the mouse group secretly practised at home"],"e":"AVG+ children ==scored consistently lower in the game==, suggesting eye control made play ==harder and more cognitively fatiguing==. Game difficulty should match ability to sustain engagement. Practically, AVG-R needs no special equipment.","n":[["k","Harder ≠ better: AVG+ likely ==more fatiguing==."],["c","Practical win: a regular mouse works."]],"rd":"Peters et al. (2021)"},{"id":"s5q078","s":5,"t":"R","q":"Did Peters et al. (2021) find that eye movements during rapid naming improved specifically because of AVG training?","a":"No; fixations fell in all groups and durations didn’t change","d":["Yes; only AVG groups showed shorter fixation durations","Yes; AVG+ children made far fewer regressions than others","No; eye movements actually got worse in the AVG groups","They could not tell, because eye movements weren’t recorded","Yes; the comparison group made more fixations after training"],"e":"There were ==no significant group-by-time effects== on eye movements: ==fixation durations didn’t change==, and fixation and regression counts dropped for everyone over time. So better rapid naming probably wasn’t due to more efficient eye movements.","n":[["k","Eye movements ≠ the mechanism (no group differences)."]],"rd":"Peters et al. (2021)"},{"id":"s5q079","s":5,"t":"R","q":"About how much did reading comprehension improve, in age-equivalent terms, for the AVG groups in Peters et al. (2021)?","a":"About 18–20 months, vs a slight decline for comparison","d":["About 1 month, the same as the comparison group","About 3 months, versus 2 months for the comparison group","About 5 years in both of the action game groups","No change in either action game group at all","About 6 months, and only in the eye-tracker group"],"e":"Comprehension rose by about ==17.8 months (AVG+)== and ==19.9 months (AVG-R)==, versus about ==−1.5 months== for comparison. All reading and rapid-naming gains were at least ~6 months for the AVG groups.","n":[["n","Comprehension ≈ +18–20 mo (AVG) vs −1.5 mo (control)."]],"v":"petersRes","vp":"q","rd":"Peters et al. (2021)"},{"id":"s5q080","s":5,"t":"R","q":"Which game did Peters et al. (2021) use, and why was it a notable choice?","a":"Fruit Ninja: simple and non-violent, yet still an action game","d":["Call of Duty: a violent shooter with complex timed missions","Rayman Raving Rabbids: the same game used in earlier studies","Minecraft: a slow-paced building game with no time pressure","Tetris: a puzzle game that trains mental rotation directly","A custom reading game the researchers designed themselves"],"e":"==Fruit Ninja== is ==simple and non-violent== but requires slicing fast, unpredictable fruit, switching attention, and avoiding bombs, meeting AVG criteria. Most earlier studies used Rayman Raving Rabbids for ~12 hours.","n":[["k","Fruit Ninja = ==non-violent AVG==."],["x","Rayman Raving Rabbids = earlier studies."]],"rd":"Peters et al. (2021)"},{"id":"s5q081","s":5,"t":"R","q":"Which limitation or future direction do Peters et al. (2021) raise?","a":["Long-term follow-up is needed to see if gains last","AVGs should be compared directly with phonics-based interventions","The role of motivation and engagement in AVG effects needs study"],"d":["Their sample was too large to detect any differences between the groups","They had no comparison group at all, so effects can’t be interpreted","They found AVGs harmful for reading accuracy","Their participants had intellectual disabilities","They studied only adults with dyslexia"],"e":"Future research should examine ==dynamic attention mechanisms==, ==long-term follow-up==, ==direct comparison with phonics interventions==, and the role of ==motivational engagement==. Lecture echoed this: do benefits persist?","n":[["k","Needs: ==follow-up== · vs phonics · motivation’s role."],["c","Lecture: “Do the benefits persist over time?”"]],"rd":"Peters et al. (2021)"},{"id":"s5q082","s":5,"t":"R","q":"Which participant requirement did Peters et al. (2021) use?","a":"Reading ≥ 1 SD below norms with normal nonverbal IQ","d":["Below-average IQ along with a diagnosis of ADHD","No prior experience playing any kind of video game","Reading above age norms but with slow handwriting","Age 3–5 with a family history of dyslexia","A formal diagnosis of both autism and dyslexia"],"e":"Children needed a history of reading difficulty and/or diagnosis plus current reading ==≥ 1 SD below norms==, ==normal nonverbal IQ== (≥ 85), normal or corrected vision and hearing, and English as primary language. Other disorders were excluded. All participants already played video games.","n":[["k","Dyslexia ≠ low IQ: normal IQ required."],["n","≥ 1 SD below in reading."]],"rd":"Peters et al. (2021)"},{"id":"s5q083","s":5,"t":"LR","q":"Based on lecture and Peters et al. (2021), should action video games be recommended as an intervention for children with dyslexia?","a":"Promising, but persistence and comparisons with phonics still need testing","d":["Yes, they work well enough to replace phonics instruction in schools for children with dyslexia","No, the trial showed reading got worse in children who played the action games","No, the benefit only appeared with specialized eye-tracking equipment","Yes, and any video game should work equally well for dyslexia","No, because dyslexia is purely phonological, not attentional"],"e":"A ==randomized trial== found ==reading gains after just 5 hours== of a non-violent AVG, without special equipment. But persistence, which games count, possible risks, and ==head-to-head comparisons with phonics== remain open.","n":[["k","Promising, not proven: ==persistence== and phonics comparisons needed."],["x","It supplements, not replaces, phonics."]],"rd":"Peters et al. (2021)"},{"id":"s5q084","s":5,"t":"L","q":"Which advice to parents is BEST supported by lecture research?","a":"For toddlers’ word learning, pick video chat over pre-recorded videos","d":["Give infants under 18 months more educational TV to build vocabulary","Let children choose any video game to improve visual attention","Choose silent, music-only media to improve cognitive outcomes","Have children play more action games to strengthen attachment","Keep the TV on in the background so children hear more words"],"e":"==Contingent video chat== supports toddler word learning (Roseberry et al., 2014), unlike non-contingent video. Infants don’t learn from educational TV, attention benefits are specific to action games, and background TV reduces interaction.","n":[["k","Interactive/contingent > passive for young children’s learning."],["c","Twin of practice Q9: “interactive features.”"]]},{"id":"s5q085","s":5,"t":"L","q":"A researcher finds that preschoolers who watch more TV have smaller vocabularies. Which alternative explanation fits lecture and the AAP (2026) systems view?","a":"Less-supported families may rely on TV more and have less time to talk","d":["Watching TV directly damages the brain’s developing language areas over time","Children with large vocabularies are banned from watching TV by their preschools","Vocabulary tests are biased against children who watch TV","TV time is always measured by teachers rather than parents","There can be no alternative explanation for this correlation"],"e":"The link is ==correlational==. A ==third variable== like low family support (long work hours, no childcare, poverty) could raise TV use and reduce language-rich interaction. Munzer et al. place media inside these ==broader systems==.","n":[["k","Third variables: family stress and supports."],["c","Same logic as childcare and family-structure research."]]},{"id":"s5q086","s":5,"t":"L","q":"Which statement best summarizes lecture’s view of media and child development?","a":"Effects depend on content, context, and type of use, with risks and benefits","d":["All screen time is harmful to development and should be eliminated wherever possible","Media has no measurable effects on children’s development once SES is controlled","Only the total number of hours on screens really matters","Media effects are essentially the same for every child","Media is beneficial as long as children choose it themselves"],"e":"Across topics: ==content matters== (educational vs not), ==type of use matters== (absorption vs active mediation; contingent vs non-contingent), ==positives exist== (learning, well-being in moderation, AVG attention), and media sits within ==digital ecosystems and broader systems==.","n":[["k","Not “how much” but ==what, how, with whom, within which system==."]]},{"id":"s5q087","s":5,"t":"R","q":"Which description of high- vs low-quality content matches the AAP (2026) statement?","a":"High: learning goals, social-emotional modelling, free play. Low: dark patterns and ads","d":["High: frequent rewards, fast pacing, and lots of action. Low: slow, calm, and quiet shows","High: any app labelled “educational” in the app store. Low: apps without that label","High: content without spoken words. Low: content with lots of dialogue","High: user-generated videos. Low: professionally produced shows","High: many interactive buttons. Low: few interactive elements"],"e":"Higher-quality experiences ==model social-emotional skills==, include ==tailored learning goals== (math, reading), contain ==free play==, and promote critical thinking. Lower-quality content has ==dark design patterns== (frequent rewards), embedded ==ads==, ==excessive interactive elements==, or scary/violent content (“SCREEN OUT”).","n":[["k","Quality = learning goals + social-emotional modelling + free play."],["x","“Educational” labels and lots of buttons ≠ quality."]],"rd":"Munzer et al. (2026)"},{"id":"s6q001","s":6,"t":"L","q":"Which of the following has been found regarding the effects of child care on children’s attachment to their parents?","a":"None of the above","d":["When tested at 5 months, infants in centre-based child care are less likely to be securely attached to their parents as compared to infants in in-home child care","When tested at 14 months, infants in centre-based child care are less likely to be securely attached to their parents as compared to infants in in-home child care","When tested at 24 months, infants in centre-based child care are more likely to be securely attached to their parents as compared to infants who do not attend any childcare","All of the above"],"e":"The NICHD study (and Bernier et al., 2024) found ==no overall effect of childcare on attachment==, in either direction and at any age tested. Every specific claim of a difference is wrong, so the answer is ==None of the above==.","n":[["k","Childcare → attachment: ==no overall link==."],["x","Trap: a “more secure” claim is just as unsupported as a “less secure” one."],["c","Only moderated effects: poor care × poor parenting (NICHD); childcare protective with less ideal parenting (Bernier)."]],"v":"nichd","vp":"f","opts":["When tested at 5 months, infants in centre-based child care are less likely to be securely attached to their parents as compared to infants in in-home child care","When tested at 14 months, infants in centre-based child care are less likely to be securely attached to their parents as compared to infants in in-home child care","When tested at 24 months, infants in centre-based child care are more likely to be securely attached to their parents as compared to infants who do not attend any childcare","All of the above","None of the above"],"ai":4,"po":["NICHD showed similar attachment distributions across care types: no centre-care disadvantage.","Same NICHD pattern at 14 months: no overall impact of childcare on attachment.","Childcare doesn’t raise security on average either; Bernier found no main effect at 15 or 25 months.","None of the three statements is supported, so “all” can’t be right.","Correct: the research shows NO overall difference in either direction."],"fixed":true,"src":"Canvas Q1"},{"id":"s6q002","s":6,"t":"L","q":"Natalie is 18 months old and tested in the Strange Situation. When her mother leaves the room, Natalie continues to play with the toys and doesn’t get upset. When her mother returns, Natalie turns her back to her mother and refuses to acknowledge her. Based on this behaviour, which of the following is most likely to be true about Natalie’s mother’s parenting behaviour?","a":"When Natalie wants to be soothed by her mother, her mother tells her to stop being such a crybaby","d":["Natalie’s mother is likely to have used physical abuse in the past","When Natalie cries, her mother almost always comes quickly and tries to calm her down","At times when Natalie is upset, her mother is very responsive, but at other times, she is distracted and ignores Natalie","When Natalie is angry, her mother explains to her why she can’t always have what she wants"],"e":"Little distress at separation and ==ignoring/avoiding the parent at reunion== = ==insecure-avoidant== attachment, which is linked to ==unavailable, rejecting== parenting. Telling a child seeking comfort to “stop being such a crybaby” rejects their bids, teaching them to hide distress.","n":[["k","Avoidant ↔ ==rejecting / unavailable== parenting."],["m","Rejected cries → child stops showing need."],["x","Inconsistent = resistant; abuse = disorganized."]],"v":"reunion","vp":"f","opts":["Natalie’s mother is likely to have used physical abuse in the past","When Natalie cries, her mother almost always comes quickly and tries to calm her down","When Natalie wants to be soothed by her mother, her mother tells her to stop being such a crybaby","At times when Natalie is upset, her mother is very responsive, but at other times, she is distracted and ignores Natalie","When Natalie is angry, her mother explains to her why she can’t always have what she wants"],"ai":2,"po":["Abuse/maltreatment is linked to DISORGANIZED attachment (freezing, contradictory behaviour), not calm avoidance.","Reliable, quick comfort is sensitive responsiveness, linked to SECURE attachment.","Correct: rejecting the child’s bids for comfort is linked to AVOIDANT attachment.","Inconsistent responsiveness is linked to RESISTANT (ambivalent) attachment.","Explaining reasons is authoritative-style reasoning, which fits warm, responsive parenting rather than avoidance."],"fixed":false,"src":"Canvas Q2"},{"id":"s6q003","s":6,"t":"L","q":"Four 15-month-old children are being taught a new word. Tyler is taught the word by his mother, face-to-face across the dinner table. Connor is taught the word by watching a scene on TV. Manuel is taught the word over Zoom. If the children are all tested soon after they are taught the new word, which of the following is most likely true about their learning?","a":"Tyler and Manuel will be more likely to learn the word versus Connor","d":["Tyler will be more likely to learn the word versus Connor and Manuel","Connor will be more likely to learn the word versus Tyler and Manuel","Tyler and Connor will be more likely to learn the word versus Manuel","Connor and Manuel will be more likely to learn the word versus Tyler"],"e":"Infants and toddlers have trouble learning from screens (DeLoache et al., 2010), ==but not with interactive video chat==: Roseberry et al. (2014) found learning from ==live interaction== and ==contingent video chat==, not from ==non-contingent video==.","n":[["k","Live ≈ video chat > TV."],["m","Does the screen talk back? Zoom yes, TV no."]],"v":"roseberry","vp":"f","opts":["Tyler will be more likely to learn the word versus Connor and Manuel","Connor will be more likely to learn the word versus Tyler and Manuel","Tyler and Connor will be more likely to learn the word versus Manuel","Tyler and Manuel will be more likely to learn the word versus Connor","Connor and Manuel will be more likely to learn the word versus Tyler"],"ai":3,"po":["Video chat (Zoom) works about as well as live interaction, so Tyler shouldn’t beat Manuel.","TV is the weakest condition: infants struggle to learn from non-contingent screens.","Backwards for Connor and Manuel: Zoom is contingent, TV isn’t.","Correct: live and contingent video chat both support learning; pre-recorded TV doesn’t.","Face-to-face teaching is the gold standard; Tyler shouldn’t do worst."],"fixed":true,"src":"Canvas Q3"},{"id":"s6q004","s":6,"t":"L","q":"Recently, researchers have been interested in the associations between media use and parent–child attachments. Based on this research, in which of the following situations would we be LEAST likely to expect a secure attachment relationship?","a":"Child Joey and dad Jesse. Jesse feels as though he can’t ever be away from his phone—he is always attentive to it due to work, even when he is spending time with Joey.","d":["Child Chloe and mom Amy. Amy does not allow Chloe to consume any screen time.","Child Sara and mom Julie. Sara is allowed to watch as much TV as she wants, and often consumes at least 2–3 hours a day.","Child Kimora and mom Brooklyn. Brooklyn spends a lot of time on her phone, and keeps the TV on most of the day even when Kimora is at home.","Child Adriana and dad Matteo. Matteo never watches TV with Adriana, because he thinks she should have some independence in her leisure time."],"e":"Linder et al. (2021): the ==amount== of parents’ or children’s media use was ==not related== to attachment. What mattered was ==type of use==: ==parent media absorption== (−) vs ==active mediation== (+). Jesse is absorbed in his phone even while with Joey.","n":[["k","Type > amount: ==absorption== is the risk."],["x","Kimora’s case is a lure (amount + background TV)."]],"v":"linder","vp":"f","opts":["Child Chloe and mom Amy. Amy does not allow Chloe to consume any screen time.","Child Sara and mom Julie. Sara is allowed to watch as much TV as she wants, and often consumes at least 2–3 hours a day.","Child Kimora and mom Brooklyn. Brooklyn spends a lot of time on her phone, and keeps the TV on most of the day even when Kimora is at home.","Child Joey and dad Jesse. Jesse feels as though he can’t ever be away from his phone—he is always attentive to it due to work, even when he is spending time with Joey.","Child Adriana and dad Matteo. Matteo never watches TV with Adriana, because he thinks she should have some independence in her leisure time."],"ai":3,"po":["Amount of child screen time (even zero) wasn’t related to attachment in Linder et al. (2021).","Lots of child TV time is about AMOUNT, which wasn’t related to attachment.","Tempting (background TV reduces interaction), but this describes amount of parent use; Linder found amount itself wasn’t linked to attachment.","Correct: parent media ABSORPTION during time together is the type of use linked to less secure attachment.","Not co-viewing isn’t the same as absorption; this dad isn’t distracted from his child."],"fixed":false,"src":"Canvas Q4"},{"id":"s6q005","s":6,"t":"L","q":"Rasia and Raj are both 4 years old from similar family backgrounds, where they each experience high quality parenting. Rasia attends a daycare where the care providers are very responsive, and give her a lot of individualized attention. Raj attends a daycare where the care providers typically talk amongst themselves and don’t pay much attention to the children. Without knowing any other information about the children, research would likely suggest that if we compared Rasia and Raj:","a":"1. Rasia will have better cognitive skills","d":["2. Rasia will have more behavioural problems","3. Rasia will be more likely to have a secure attachment to her parents","Both 1 and 2","Both 1 and 3"],"e":"Rasia gets high ==process quality== (responsive, individualized); Raj gets low process quality. Quality predicts ==cognitive skills== and ==behaviour problems== (low quality → more), but childcare shows ==no overall link to attachment==, and NICHD’s risk needed poor care ==plus== poor parenting.","n":[["k","Quality → cognition ↑, behaviour problems ↓."],["x","Attachment ≠ care quality when parenting is good."]],"v":"ccEffects","vp":"f","opts":["1. Rasia will have better cognitive skills","2. Rasia will have more behavioural problems","3. Rasia will be more likely to have a secure attachment to her parents","Both 1 and 2","Both 1 and 3"],"ai":0,"po":["Correct: high process quality is linked to better cognitive and language skills.","Backwards: LOW-quality care is linked to more behaviour problems, so Raj is at more risk.","Childcare has no overall link to attachment, and both children have high-quality parenting (no dual risk).","Includes statement 2, which is backwards.","Includes statement 3, which isn’t supported."],"fixed":true,"src":"Canvas Q5"},{"id":"s6q006","s":6,"t":"LR","q":"According to Brodzinsky et al.’s article on adoption, the lived experience of adoption, and whether an adopted individual is likely to see their adoption as a risk factor or as a protective intervention, is likely to depend on all of the following EXCEPT:","a":"Neural encoding of adoption separation trauma","d":["The time period in which they were adopted","The quality of parenting provided by their adoptive parents","Differences between the adopted individual and members of their adopted family (physical appearance, temperament, intellect, etc.)","The level of acceptance towards adoption, within the culture where the individual was adopted"],"e":"Brodzinsky et al. (2022) say the lived experience of adoption is shaped by ==child==, ==family==, and ==broader system== factors: era, parenting, perceived differences, and culture. They ==reject the “primal wound” idea== that separation is neurally encoded as trauma for all adoptees.","n":[["k","Adoption experience = child × family × systems."],["x","“Neural encoding of separation trauma” = the primal-wound claim they reject."]],"v":"adoptEco","vp":"f","rd":"","opts":["The time period in which they were adopted","The quality of parenting provided by their adoptive parents","Neural encoding of adoption separation trauma","Differences between the adopted individual and members of their adopted family (physical appearance, temperament, intellect, etc.)","The level of acceptance towards adoption, within the culture where the individual was adopted"],"ai":2,"po":["Historical era matters (e.g., past secrecy practices), part of the macrosystem/chronosystem.","Adoptive parenting quality strongly shapes adjustment (family level).","Correct (the EXCEPT): Brodzinsky et al. reject the claim that infant–birth mother separation leaves a universal, neurally encoded “primal wound.”","Perceived differences from the family (like Kelli’s story) shape appraisals of belonging.","Cultural acceptance vs stigma (adoption as “second best”) shapes appraisals."],"fixed":false,"src":"Canvas Q6"},{"id":"s6q007","s":6,"t":"L","q":"Kayden’s mother has recently bought him his first video game system! To go with the system, she has bought a bunch of video games that are fast-paced, with timed missions and many different components that must be attended to when playing (such as Call of Duty and Grand Theft Auto). If we were to compare Kayden prior to getting his first video game system vs a few months after getting the system, research would predict which of the following:","a":"Both 2 and 3","d":["1. Kayden will experience gains in his school/academic performance","2. Kayden will experience decreases in his school/academic performance","3. Kayden will show improvements in visual attention and object tracking","Both 1 and 3"],"e":"Weis & Cerankosky (2010): boys who got a game system ==immediately== had ==lower reading and writing== scores 4 months later. Action games (fast, many targets) are linked to ==better visual attention and object tracking==. Both 2 and 3.","n":[["k","New system → school ↓ · Action games → attention ↑."],["m","Same game, two effects: costs AND benefits."]],"v":"weis","vp":"f","opts":["1. Kayden will experience gains in his school/academic performance","2. Kayden will experience decreases in his school/academic performance","3. Kayden will show improvements in visual attention and object tracking","Both 1 and 3","Both 2 and 3"],"ai":4,"po":["Backwards: getting a first system lowered reading and writing (Weis & Cerankosky, 2010).","True, but incomplete: statement 3 is also supported.","True, but incomplete: statement 2 is also supported.","Includes statement 1, which is backwards.","Correct: academic dip (displacement) AND action-game attention gains."],"fixed":true,"src":"Canvas Q7"},{"id":"s6q008","s":6,"t":"L","q":"Uli and Xavier are biological siblings, and were both placed into an orphanage when they were infants. At 6 months, Uli was adopted while Xavier continued to be raised in the orphanage. In his new adopted family, Uli has a brother, Yates. Yates is the biological child of Uli’s adoptive parents. Research would predict that:","a":"A and B","d":["A) Xavier is likely to have more adjustment difficulties than would Uli","B) Uli is likely to have more adjustment difficulties than would Yates","C) Yates is likely to have more adjustment difficulties than would Uli","A and C"],"e":"The ==comparison group== decides the story. Versus the sibling ==left in the orphanage==, adoption is ==protective== (Uli < Xavier in difficulties). Versus a ==never-adopted== child, adoptees show ==more risk== on average (Uli > Yates).","n":[["k","vs left behind → better · vs never adopted → more risk."],["c","Oct 16: risk factor OR protective intervention depending on comparison."]],"v":"compare","vp":"f","opts":["A) Xavier is likely to have more adjustment difficulties than would Uli","B) Uli is likely to have more adjustment difficulties than would Yates","C) Yates is likely to have more adjustment difficulties than would Uli","A and B","A and C"],"ai":3,"po":["A is true, but B is also true.","B is true, but A is also true.","Backwards: adoptees show more risk than never-adopted peers on average.","Correct: compared with children left behind, adoption protects (A); compared with non-adopted peers, adoptees show more risk (B).","Includes C, which is backwards."],"fixed":true,"src":"Canvas Q8"},{"id":"s6q009","s":6,"t":"L","q":"Which of the following pieces of advice to parents regarding their child’s media use would best be supported by research?","a":"To improve cognitive development, for parents to select children’s media that includes interactive features","d":["In order to promote language development, for parents to allow more educational TV in children under 1.5–2 years of age","In order to promote secure attachment, for children to play more action (vs non-action) video games","In order to boost visual attention skills, for parents to allow children their choice in any type of video games","In order to improve cognitive outcomes, for parents to select children’s media that does not use language (silent or music-only)"],"e":"The best-supported advice is ==interactive features==: contingent, responsive media (e.g., video chat) supports young children’s learning where passive video doesn’t (Roseberry et al., 2014). The AAP adds that quality matters: interactive doesn’t mean flashy, gamified, or ad-filled.","n":[["k","Interactive/contingent > passive."],["x","“Any game” ≠ action game · educational TV ≠ infant learning."]],"v":"roseberry","vp":"f","opts":["In order to promote language development, for parents to allow more educational TV in children under 1.5–2 years of age","In order to promote secure attachment, for children to play more action (vs non-action) video games","In order to boost visual attention skills, for parents to allow children their choice in any type of video games","To improve cognitive development, for parents to select children’s media that includes interactive features","In order to improve cognitive outcomes, for parents to select children’s media that does not use language (silent or music-only)"],"ai":3,"po":["Infants under ~18 months–3 years struggle to learn from screens (video deficit).","Action games are linked to visual attention, not attachment.","Attention benefits are specific to ACTION games, not any game.","Correct: interactive, contingent media (like video chat) supports learning better than passive viewing.","No research supports silent media for cognition; language input matters."],"fixed":false,"src":"Canvas Q9"},{"id":"s6q010","s":6,"t":"LR","q":"A group of researchers have been measuring attachment in children. When the below children were toddlers, the researchers assessed the families in the Strange Situation. Child 1: secure attachment to their mother, but insecure attachment to their father. Child 2: secure attachment to their father, but insecure attachment to their mother. Child 3: insecure attachment to both their mother and father. Based on research by Kochanska and Kim on attachment and child outcomes, we would most likely expect that when the children have reached middle childhood:","a":"C) Child 3 will be more likely to experience internalizing problems than will Child 1","d":["A) Child 1 will be more likely to experience internalizing problems than will Child 2, but will be less likely to experience externalizing problems","B) Child 1 will be more likely to experience externalizing problems than will Child 2, but will be less likely to experience internalizing problems","Both A and C","Both B and C"],"e":"Kochanska & Kim (2013): children ==insecure with both parents== had the ==most behaviour problems== (most robustly in their own reports). ==Security with either parent offset the risk==, and neither mother nor father was primary, so Child 1 and Child 2 shouldn’t differ.","n":[["k","Double-insecure = highest risk; ==one secure parent is protective==."],["x","Mother vs father security: no difference."]],"v":"kkGroups","vp":"f","rd":"","opts":["A) Child 1 will be more likely to experience internalizing problems than will Child 2, but will be less likely to experience externalizing problems","B) Child 1 will be more likely to experience externalizing problems than will Child 2, but will be less likely to experience internalizing problems","C) Child 3 will be more likely to experience internalizing problems than will Child 1","Both A and C","Both B and C"],"ai":2,"po":["Kochanska & Kim found NO difference between secure-with-mother-only and secure-with-father-only children.","Same problem: neither parent was “primary”; the two mixed groups didn’t differ.","Correct: double-insecure children reported the most problems; security with either parent offset the risk.","Includes A, which isn’t supported.","Includes B, which isn’t supported."],"fixed":true,"src":"Canvas Q10"},{"id":"s6q011","s":6,"t":"LR","q":"Research findings most strongly and consistently support which of the following policies being put into place across the world?","a":"Parenting intervention programs that promote high levels of parental autonomy granting for all","d":["Recommendations to parents not to disclose a child’s adopted status to the child","Policies that prioritize custody for mothers vs fathers, given the specific importance of mother–child attachment","Policies that prioritize custody for fathers vs mothers, given the specific importance of father–child attachment","Parenting intervention programs that promote high levels of parental control for all"],"e":"Bülow et al. (2022) found ==warmth and autonomy support== benefit adolescents ==universally (though not uniformly)==. That cross-cultural consistency makes ==autonomy-granting programs== the best-supported “for all” policy. Control’s effects vary by culture.","n":[["k","“Across the world” → pick the ==universal== finding: autonomy support."],["x","Control isn’t universal; mother/father custody claims lack support."]],"v":"uuu:2","vp":"f","rd":"","opts":["Recommendations to parents not to disclose a child’s adopted status to the child","Policies that prioritize custody for mothers vs fathers, given the specific importance of mother–child attachment","Policies that prioritize custody for fathers vs mothers, given the specific importance of father–child attachment","Parenting intervention programs that promote high levels of parental control for all","Parenting intervention programs that promote high levels of parental autonomy granting for all"],"ai":4,"po":["Research supports openness: communicative openness about adoption is linked to better adjustment.","Kochanska & Kim: neither parent was primary; security with either parent was protective.","Same: no evidence that father–child attachment is uniquely more important.","Control’s links vary across cultures, and very high control is linked to less positive outcomes.","Correct: autonomy support links to positive outcomes look universal across cultures (Bülow et al., 2022)."],"fixed":false,"src":"Oct 26 class"},{"id":"s6q012","s":6,"t":"L","q":"Researchers, policy makers, and parents have often worried about the link between childcare and attachment. Based upon past research, which of the below factors seems to matter most in determining whether childcare is associated with attachment security vs insecurity?","a":"Quality of parenting behaviours at home","d":["The age at which a child begins childcare","Whether a child attends a childcare centre or another form of childcare","The number of hours per week a child attends childcare","The socioeconomic background of the child’s family"],"e":"Both key studies show the childcare–attachment link ==depends on parenting at home==: NICHD found risk only when poor care met ==insensitive mothering==; Bernier et al. found childcare ==protective== for children of ==less sensitive or less autonomy-supportive mothers==.","n":[["k","Childcare × attachment hinges on ==parenting at home==."],["c","Parenting effects ≫ childcare effects."]],"v":"bernier","vp":"f","opts":["The age at which a child begins childcare","Whether a child attends a childcare centre or another form of childcare","The number of hours per week a child attends childcare","The socioeconomic background of the child’s family","Quality of parenting behaviours at home"],"ai":4,"po":["Age of entry is tied more to behaviour-problem risk than to attachment.","Type of care showed no overall attachment differences (NICHD).","Hours per week weren’t linked to attachment in Bernier et al. (any threshold).","SES matters more for cognitive benefits than for attachment.","Correct: NICHD (poor care × insensitive mothers) and Bernier (childcare protective with less sensitive mothers) both point to parenting."],"fixed":false,"src":"Oct 26 class"},{"id":"s6q013","s":6,"t":"L","q":"Amanda, Aaron, Faith, and Homer are all 5-year-old children who spent the first few years of their lives in similar adverse environments, in homes with suspected history of maltreatment. Amanda was adopted out of this environment at age 1, while Aaron was adopted at age 3. Faith was removed and placed into foster care at age 3. Homer remained in his home. Based on just this information, research would predict…","a":"Both A and B","d":["Amanda would likely have better outcomes than would Aaron","Aaron would likely have better outcomes than would Homer","Faith would likely have better outcomes than would Homer","A, B, and C"],"e":"==Earlier adoption== is linked to better outcomes (A), and ==adoption vs remaining in adversity== shows improvement (B). But for ==foster care from home==, studies ==often find no difference== versus children who stay, because foster care brings its own trauma (C fails).","n":[["k","Adopt early > late · adopt > stay · FC from home ≈ stay."],["x","Don’t extend BEIP’s foster-care gains to home removals."]],"v":"mennen","vp":"f","opts":["Amanda would likely have better outcomes than would Aaron","Aaron would likely have better outcomes than would Homer","Faith would likely have better outcomes than would Homer","Both A and B","A, B, and C"],"ai":3,"po":["True (earlier adoption tends to be better), but B is also true.","True (adoption improves on staying in adversity), but A is also true.","Not supported: foster care from home often shows NO difference vs staying (Mennen et al., 2010).","Correct: earlier adoption beats later (A), and adoption beats remaining in adversity (B).","Includes C, which isn’t supported for foster care removed from home."],"fixed":true,"src":"Oct 26 class"},{"id":"s6q014","s":6,"t":"L","q":"Austin and Blake are both 4 years old. Austin has never attended childcare, and has always been cared for by his parents. Blake has attended a childcare centre full time since he was 9 months old. Research would most likely predict that compared to Austin, Blake will…","a":"Be more likely to have strong cognitive skills","d":["Be less likely to have secure attachment","Be less likely to be highly aggressive","Both A and B","Both B and C"],"e":"Attachment: ==no overall link==. Behaviour: ==more risk== with centre care, high hours, and an early start, so Blake is NOT less aggressive. Cognition: ==more benefits== for centre-based care. Only C.","n":[["k","Centre since 9 mo: attachment ≈ · aggression risk ↑ · cognition ↑."],["x","B is the classic reversal trap."]],"v":"ccEffects","vp":"f","opts":["Be less likely to have secure attachment","Be less likely to be highly aggressive","Be more likely to have strong cognitive skills","Both A and B","Both B and C"],"ai":2,"po":["No overall link between childcare and attachment.","Backwards: centre care full-time from before age 1 is linked to MORE behaviour problems.","Correct: centre-based care is linked to cognitive benefits.","Both A and B are unsupported.","Includes B, which is backwards."],"fixed":true,"src":"Oct 21 class"}];

function figHTML(spec){
  if(!spec) return "";
  var parts = spec.split(":"), d = DG[parts[0]]; if(!d) return "";
  return '<figure class="fig">'+d.f(parts[1])+'<figcaption>'+esc(d.cap)+'</figcaption></figure>';
}
function notesHTML(q, inst){
  var h = '';
  if(q.v && q.vp!=="q") h += figHTML(q.v);
  h += '<ul class="notes">';
  q.n.forEach(function(n){ var d = NOTE[n[0]]; h += '<li class="note '+n[0]+'"><span class="nic">'+icon(d[0])+'</span><span><span class="lab">'+d[1]+'</span><span class="tx">'+hl(n[1])+'</span></span></li>'; });
  h += '</ul>';
  if(q.po){
    var mine = inst && inst.chosen!=null ? inst.opts[inst.chosen].t : null;
    h += '<p class="po-h" style="margin-top:12px">Why each option</p><ul class="po">';
    q.opts.forEach(function(o, i){ var ok = i===q.ai; h += '<li class="'+(ok?'ok':'no')+(o===mine?' me':'')+'">'+icon(ok?"ok":"no")+'<span><b>'+esc(clip(o, 150))+'</b><br>'+hl(q.po[i])+'</span></li>'; });
    h += '</ul>';
  }
  return h + '<details class="why"><summary>'+icon("chev")+'Full explanation</summary><p>'+hl(q.e)+'</p></details>';
}

/* ---------- question instances ---------- */
function makeInstance(q){
  var opts;
  if(q.opts){
    opts = q.opts.map(function(t, i){ return {t:t, c:i===q.ai}; });
    if(!q.fixed) opts = shuffle(opts);
  } else {
    var correct = Array.isArray(q.a) ? pick(q.a) : q.a;
    var ds = shuffle(q.d.slice()).slice(0,4);
    opts = shuffle([{t:correct, c:true}].concat(ds.map(function(t){ return {t:t, c:false}; })));
  }
  return {id:q.id, opts:opts, chosen:null, done:false};
}

/* ---------- sessions ---------- */
var S = null, screen = "home";
function startStudy(mode, sec, arg){
  var pool, review = false;
  if(mode==="section"){ pool = BYSEC[sec].slice(); review = counts(pool).m===pool.length; }
  else if(mode==="missed") pool = ALL.filter(function(id){ var s = st(id); return s.w>0 && s.k<2; });
  else if(mode==="diagram"){ pool = QS.filter(function(q){ return q.v && q.v.split(":")[0]===arg; }).map(function(q){ return q.id; }); review = true; }
  else if(mode==="obj"){ pool = OBJS[arg].ids.slice(); review = counts(pool).m===pool.length; }
  else pool = ALLC.slice();
  var order = {}, seq;
  if(mode==="mixed"){   /* exam-weighted: ~4 lecture questions for every reading-only one, like the guide's 80/20 */
    var lec = shuffle(pool.filter(function(id){ return QMAP[id].t!=="R"; })), rd = shuffle(pool.filter(function(id){ return QMAP[id].t==="R"; }));
    seq = []; while(lec.length || rd.length){ for(var j=0;j<4 && lec.length;j++) seq.push(lec.shift()); if(rd.length) seq.push(rd.shift()); }
  } else seq = shuffle(pool.slice());
  seq.forEach(function(id, i){ order[id] = i; });
  S = {mode:mode, sec:sec, arg:arg, review:review, pool:pool, step:0, due:{}, order:order, seen:{}, cleared:{}, last:null, cur:null, gain:{l:0,m:0}, streak:0, best:0};
  nextQuestion();
}
function isDone(id){ return S.review ? !!S.cleared[id] : tier(id)===2; }
function priority(id){ if(S.seen[id] && st(id).k===0) return 0; if(st(id).k>=1) return 1; return 2; }
function pickNext(){
  var active = S.pool.filter(function(id){ return !isDone(id); });
  if(!active.length) return null;
  var cands = active.filter(function(id){ return id!==S.last; });
  var dueNow = cands.filter(function(id){ return (S.due[id]||0)<=S.step; });
  if(dueNow.length){ dueNow.sort(function(a,b){ return priority(a)-priority(b) || (S.due[a]||0)-(S.due[b]||0) || S.order[a]-S.order[b]; }); return dueNow[0]; }
  var filler = S.pool.filter(function(id){ return isDone(id) && id!==S.last; });
  if(filler.length && !S.review) return pick(filler);
  if(!cands.length) cands = active;
  cands.sort(function(a,b){ return (S.due[a]||0)-(S.due[b]||0); });
  return cands[0];
}
function nextQuestion(){ var id = pickNext(); if(id===null){ renderDone(); return; } S.cur = makeInstance(QMAP[id]); renderQuiz(); }
var QUOTA = {1:[4,1], 2:[3,1], 3:[4,1], 4:[4,1], 5:[5,1]};
function startExam(feedback, kind){
  var list = [];
  if(kind==="canvas"){
    list = shuffle(QS.filter(function(q){ return q.src && q.src.indexOf("Canvas")===0; }));
  } else {
    CONTENT.forEach(function(s){
      var inS = QS.filter(function(q){ return q.s===s; });
      var core = shuffle(inS.filter(function(q){ return q.t!=="R"; })).slice(0, QUOTA[s][0]);
      var read = shuffle(inS.filter(function(q){ return q.t==="R"; })).slice(0, QUOTA[s][1]);
      core.concat(read).forEach(function(q){ list.push(q); });
    });
    list = shuffle(list);   /* shuffled across units, like everywhere else */
  }
  S = {mode:"exam", kind:kind||"sim", feedback:feedback, list:list.map(makeInstance), idx:0, gain:{l:0,m:0}, streak:0, best:0};
  S.cur = S.list[0];
  renderQuiz();
}

/* ---------- answering ---------- */
function choose(i){
  var c = S.cur; if(!c || c.done) return;
  if(S.mode==="exam" && !S.feedback){
    c.chosen = i; sfx.pick();
    each(".opt", function(b, j){ b.classList.toggle("sel", j===i); b.setAttribute("aria-pressed", j===i ? "true" : "false"); });
    var nb = document.getElementById("next"); if(nb) nb.disabled = false;
    return;
  }
  c.chosen = i; c.done = true;
  var correct = c.opts[i].c, res = record(c.id, correct);
  c.correct = correct; c.res = res;
  if(S.mode!=="exam"){
    S.step++; S.seen[c.id] = true; S.last = c.id;
    if(correct){ S.due[c.id] = S.step + (res.after===2 ? 1e6 : 6 + Math.floor(Math.random()*5)); if(S.review) S.cleared[c.id] = true; }
    else { S.due[c.id] = S.step + 3 + Math.floor(Math.random()*3); S.cleared[c.id] = false; }
  }
  showAnswer();
}
function tierMessage(res, correct){
  if(correct){
    if(res.before===0 && res.after===1) return icon("sprout","c-sprout")+"Sprouted! Get it right once more later to bloom.";
    if(res.before===1 && res.after===2) return icon("flower","fill c-bloom")+"In full bloom!";
    return "Still blooming.";
  }
  if(res.before>0) return "Back to a seed. It’ll return soon.";
  return "It’ll come back in a few questions.";
}
function statsHTML(){
  var h = "";
  if(!(S.mode==="exam" && !S.feedback)){
    if(S.streak>0) h += '<span class="pill'+(S.streak>=3?' hot':'')+'" id="streak" title="Correct in a row">'+icon("flame")+S.streak+'</span>';
    if(S.gain.l) h += '<span class="pill l1" title="Sprouted this session">'+icon("sprout")+'+'+S.gain.l+'</span>';
    if(S.gain.m) h += '<span class="pill l2" title="Bloomed this session">'+icon("flower","fill")+'+'+S.gain.m+'</span>';
  }
  return h + toolsHTML();
}
function showAnswer(){
  var c = S.cur, q = QMAP[c.id], chosenBtn = null, okBtn = null;
  each(".opt", function(b, j){
    b.disabled = true;
    if(c.opts[j].c){ b.classList.add("ok"); okBtn = b; }
    else if(j===c.chosen) b.classList.add("bad");
    else b.classList.add("dim");
    if(j===c.chosen) chosenBtn = b;
  });
  if(c.correct){
    sfx.correct(); okBtn.classList.add("glow");
    var r = okBtn.getBoundingClientRect(); burst(r.left+24, r.top+r.height/2, {n:13});
    if(c.res.after===2 && c.res.before===1){ sfx.master(); setTimeout(function(){ rain(30); }, 120); toast("In bloom ✿"); }
    else if(c.res.after===1 && c.res.before===0) sfx.lit();
    if(S.streak>0 && S.streak%5===0){ setTimeout(sfx.streak, 400); toast(S.streak+" in a row! ❦"); }
  } else { sfx.wrong(); if(chosenBtn) chosenBtn.classList.add("shake"); }
  var fb = document.getElementById("fb");
  fb.className = "fb " + (c.correct ? "good" : "bad");
  var streakNote = (c.correct && S.streak>=3) ? ' <small>'+icon("flame","c-acc")+S.streak+' in a row</small>' : '';
  fb.innerHTML = '<p class="verdict">'+icon(c.correct?"check":"xmark")+(c.correct?pick(["Correct","Yes!","Nailed it","Exactly"]):"Not quite")+
    '<small>'+tierMessage(c.res, c.correct)+'</small>'+streakNote+'</p>'+notesHTML(q, c);
  fb.hidden = false;
  var mini = document.getElementById("mini"); if(mini) mini.innerHTML = groveSVG(q.s, c.id, c.res.after>c.res.before ? c.id : null);
  var stats = document.getElementById("stats");
  if(stats){ stats.innerHTML = statsHTML(); bindTools(); var sk = document.getElementById("streak"); if(sk && c.correct) sk.classList.add("pop"); }
  var qb = document.getElementById("qbar"); if(qb) qb.innerHTML = progressHTML();
  var wh = document.getElementById("wherep"); if(wh) wh.textContent = progressText();
  var nb = document.getElementById("next"); nb.hidden = false; nb.disabled = false;
  try{ nb.focus({preventScroll:true}); }catch(e){}
}
function advance(){
  sfx.tap();
  if(S.mode==="exam"){
    var c = S.cur;
    if(!c.done){ if(c.chosen===null) return; c.done = true; c.correct = c.opts[c.chosen].c; c.res = record(c.id, c.correct); }
    S.idx++;
    if(S.idx>=S.list.length){ renderResults(); return; }
    S.cur = S.list[S.idx]; renderQuiz(); return;
  }
  nextQuestion();
}

/* ---------- rendering ---------- */
function srcTag(q){
  if(q.src) return '<span class="tag src">'+icon("exam")+esc(q.src)+'</span>';
  if(q.t==="L") return '<span class="tag">'+icon("lecture")+'Lecture</span>';
  if(q.t==="LR") return '<span class="tag">'+icon("lecture")+'Lecture + reading</span>';
  return '<span class="tag read">'+icon("book")+esc(q.rd||SEC[q.s].reading)+' only</span>';
}
function tierTag(id){ var t = tier(id); return '<span class="tag"><span class="dot t'+t+'"></span>'+["Seed","Sprout","Bloom"][t]+'</span>'; }
function sessionIds(){ return (S.mode==="section") ? BYSEC[S.sec] : ((S.mode==="missed"||S.mode==="diagram"||S.mode==="obj") ? S.pool : ALLC); }
function progressHTML(){
  if(S.mode==="exam") return '<div class="bar"><span class="b1" style="width:'+(100*S.idx/S.list.length)+'%"></span></div>';
  return barHTML(counts(sessionIds()));
}
function progressText(){
  if(S.mode==="exam") return (S.idx+1)+" / "+S.list.length;
  if(S.review){ var d = S.pool.filter(function(id){ return S.cleared[id]; }).length; return d+" / "+S.pool.length+" done"; }
  if(S.mode==="missed"){ var left = S.pool.filter(function(id){ return !isDone(id); }).length; return left+" left"; }
  var c = counts(sessionIds()); return c.m+" / "+c.n+" bloomed";
}
function whereLabel(){
  if(S.mode==="exam") return S.kind==="canvas" ? "Canvas practice quiz" : "Exam simulation";
  if(S.mode==="mixed") return "Mixed practice";
  if(S.mode==="missed") return "Missed questions";
  if(S.mode==="diagram") return "Diagram drill";
  if(S.mode==="obj") return "Objective: "+OBJS[S.arg].text;
  return SEC[S.sec].name + (S.review ? " (review)" : "");
}

function labUni(el){

  modes.forEach(function(m){ h += '<button class="chip c-'+(m[0]==="universal"?"good":"vio")+(LAB.uni.mode===m[0]?' on':'')+'" data-m="'+m[0]+'">'+m[1]+'</button>'; });
  h += '</div><div class="card" id="unisvg"></div><div class="card sliders"><label class="sl"><span class="sl-l"><span class="dot2 f-lit"></span>Highlighted teen’s environmental sensitivity<b id="sv-s"></b></span><input type="range" min="0" max="100" id="sl-s" value="'+LAB.uni.sens+'" class="rng r-lit"'+(LAB.uni.mode==="universal"?'':' disabled')+'></label></div><div class="card" id="uniout"></div>';
  el.innerHTML = h;
  each(".chip[data-m]", function(b){ b.addEventListener("click", function(){ LAB.uni.mode = b.getAttribute("data-m"); sfx.tap(); labUni(el); }); });
  var r = document.getElementById("sl-s"); r.addEventListener("input", function(){ LAB.uni.sens = +r.value; uniUpdate(); }); r.addEventListener("change", function(){ sfx.tick(); });
  uniUpdate(true);
}
function uniUpdate(anim){
  var mode = LAB.uni.mode, rnd = mulberry32(7), h = '';
  h += '<path d="M24 140 L24 10 M24 140 L330 140" class="ax2"/>'+T(176, 154, "parenting that day (warmth, autonomy support) →", {s:8.6, c:'tf'})+T(12, 76, "well-being", {s:8.6, c:'tf'}).replace('<text ','<text transform="rotate(-90 12 76)" ');
  for(var i=0;i<12;i++){
    var s = mode==="uniform" ? 0.55 : (mode==="universal" ? 0.12 + rnd()*0.8 : (rnd()-0.5)*1.8);
    var y0 = 76 + s*48 + (i-5.5)*2.2, y1 = 76 - s*48 + (i-5.5)*2.2, cls = s>0.06 ? 's-good' : (s<-0.06 ? 's-bad' : 's-mut');
    h += '<path d="M40 '+y0.toFixed(1)+' L316 '+y1.toFixed(1)+'" class="ln thin '+cls+(anim?' dr':'')+'" pathLength="1" style="--d:'+(i*50)+'ms"/>';
  }
  var hs = mode==="universal" ? 0.08 + LAB.uni.sens/100*0.95 : (mode==="uniform" ? 0.55 : -0.75);
  h += '<path d="M40 '+(76+hs*50).toFixed(1)+' L316 '+(76-hs*50).toFixed(1)+'" class="ln thick s-lit"/>';
  document.getElementById("unisvg").innerHTML = SV(160, h, "Family lines");
  document.getElementById("sv-s").textContent = mode==="universal" ? LAB.uni.sens : "—";
  var txt = {
    uniform:[["x","Uniform: every teen benefits by exactly the same amount. Bülow et al. rejected this: strength varied across families."]],
    universal:[["k","Universal without uniformity: all lines slope up (same direction), but steepness differs. This is what Bülow et al. found."],["n","Positive in 91–98% of families; significant opposite effects: 1 of 636."],["c","More environmentally sensitive teens show steeper lines. Drag the slider."]],
    unique:[["x","Unique (relativistic): the same parenting helps some teens and harms others. Almost no families showed this."]]}[mode];
  document.getElementById("uniout").innerHTML = '<ul class="notes">'+txt.map(function(t){ return noteRow(t[0], t[1]); }).join('')+'</ul>';
}

function sortGame(el, cfg){
  var st = cfg.state;
  if(!st.items || !st.items.length){ st.items = shuffle(cfg.items.slice()); st.score = 0; st.n = 0; }
  el.innerHTML = '<div class="card sorter" id="sortbox"></div>' + (cfg.extra||'');
  function draw(fbHtml){
    var box = document.getElementById("sortbox"); if(!box) return;
    var it = st.items[0];
    var h = '<div class="where"><span>'+esc(cfg.title)+'</span><span>'+st.score+' / '+st.n+' correct</span></div>';
    if(it){
      h += '<div class="sortcard">'+esc(it[0])+'</div><div class="bins">';
      cfg.bins.forEach(function(b, i){ h += '<button class="bin" data-b="'+i+'" style="--bc:var(--'+b[1]+')">'+b[0]+'</button>'; });
      h += '</div>';
    } else {
      h += '<div class="sortcard">'+icon("flower","fill c-bloom")+' Sorted all '+st.n+'! Score '+st.score+' / '+st.n+'</div><div class="ctrl"><button class="primary" id="sagain">'+icon("shuffle")+'Shuffle and sort again</button></div>';
    }
    box.innerHTML = h + (fbHtml||'');
    Array.prototype.forEach.call(box.querySelectorAll(".bin"), function(b){ b.addEventListener("click", function(){
      var it = st.items.shift(), pickd = +b.getAttribute("data-b"), ok = pickd===it[1]; st.n++; if(ok) st.score++;
      var r = b.getBoundingClientRect();
      if(ok){ sfx.correct(); burst(r.left+r.width/2, r.top+r.height/2, {n:10}); } else { sfx.wrong(); }
      draw('<ul class="notes" style="margin-top:4px">'+noteRow(ok?"k":"x", (ok?"Yes! ":"Not quite. ")+"“"+it[0]+"” → "+cfg.bins[it[1]][0]+": "+it[2])+'</ul>');
      if(!st.items.length){ sfx.done(); rain(24); }
    }); });
    var ag = document.getElementById("sagain"); if(ag) ag.addEventListener("click", function(){ st.items = null; sfx.tap(); sortGame(el, cfg); });
  }
  draw();
}

    else if(o.qual==="low"){ att += 15; notes.push(["x","NICHD “dual risk”: poor-quality care + insensitive parenting carried attachment risk."]); }
    else { att -= 12; notes.push(["k","Bernier et al. (2024): decent-quality care looked protective when sensitivity was lower."]); }

    '<svg id="mot" class="dg" viewBox="0 0 340 220" role="img" aria-label="Object tracking game"><rect x="2" y="2" width="336" height="216" rx="14" class="room"/><g id="motg"></g><text id="motmsg" x="170" y="112" text-anchor="middle" dominant-baseline="middle" font-size="13" class="tx" font-weight="700"></text></svg>'+
    '<div class="ctrl" style="margin-top:8px"><button class="primary" id="motgo">'+icon("play")+'Start round</button></div></div>'+
    '<div class="card"><ul class="notes">'+noteRow("k","Watch the glowing targets, then keep tracking them as everything moves. Tap the targets when the dots stop.")+
    noteRow("c","Object tracking is one of the visual attention skills linked to action video game play (Green, Li & Bavelier, 2010), alongside peripheral attention and mental rotation.")+
    noteRow("x","Action games specifically, not “any game.” And benefits may come with costs (e.g., lower reading/writing after a new game system).")+'</ul></div>';
  el.innerHTML = h;
  document.getElementById("motgo").addEventListener("click", motStart);
  motDraw();
}
function motStart(){
  stopMOT(); sfx.tap();
  var n = 8 + MOT.lvl, k = MOT.lvl + 2, sp = 1.1 + MOT.lvl*0.35, dots = [];
  for(var i=0;i<n;i++){ var a = Math.random()*Math.PI*2; dots.push({x:30+Math.random()*280, y:30+Math.random()*160, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, t:i<k, picked:false}); }
  MOT.dots = dots; MOT.picks = []; MOT.phase = "show"; MOT.k = k; motMsg("Remember the glowing ones");
  motDraw(); sfx.lit();
  setTimeout(function(){ if(MOT.phase!=="show") return; MOT.phase = "move"; motMsg(""); MOT.t0 = performance.now(); motLoop(); }, 2000);
}
function motMsg(t){ var m = document.getElementById("motmsg"); if(m) m.textContent = t; }
function motLoop(){
  if(!document.getElementById("mot")){ stopMOT(); return; }
  var dur = 5200, el = performance.now()-MOT.t0;
  MOT.dots.forEach(function(d){
    d.x += d.vx; d.y += d.vy;
    if(d.x<14||d.x>326){ d.vx *= -1; d.x = Math.max(14, Math.min(326, d.x)); }
    if(d.y<14||d.y>206){ d.vy *= -1; d.y = Math.max(14, Math.min(206, d.y)); }
    if(Math.random()<0.02){ var a = Math.atan2(d.vy, d.vx)+(Math.random()-.5)*1.2, s = Math.hypot(d.vx, d.vy); d.vx = Math.cos(a)*s; d.vy = Math.sin(a)*s; }
  });
  motDraw();
  if(el<dur) MOT.raf = requestAnimationFrame(motLoop);
  else { MOT.phase = "pick"; MOT.raf = null; motMsg(""); sfx.tick(); motDraw(); }
}
function motDraw(){
  var g = document.getElementById("motg"); if(!g) return;
  var h = '';
  MOT.dots.forEach(function(d, i){
    var cls = 'f-mut';
    if(MOT.phase==="show" && d.t) cls = 'f-lit';
    if(MOT.phase==="pick" && d.picked) cls = 'f-mas';
    if(MOT.phase==="done") cls = d.t ? (d.picked ? 'f-good' : 'f-lit') : (d.picked ? 'f-bad' : 'f-mut');
    h += '<circle data-i="'+i+'" cx="'+d.x.toFixed(1)+'" cy="'+d.y.toFixed(1)+'" r="11" class="'+cls+'"'+(MOT.phase==="show"&&d.t?' style="filter:drop-shadow(0 0 6px var(--lit))"':'')+'/>';
  });
  g.innerHTML = h;
  if(MOT.phase==="pick") Array.prototype.forEach.call(g.querySelectorAll("circle"), function(c){ c.addEventListener("click", function(){ motPick(+c.getAttribute("data-i")); }); });
}
function motPick(i){
  var d = MOT.dots[i]; if(d.picked || MOT.phase!=="pick") return;
  d.picked = true; MOT.picks.push(i); sfx.pick(); motDraw();
  if(MOT.picks.length>=MOT.k){
    MOT.phase = "done"; var hit = MOT.picks.filter(function(j){ return MOT.dots[j].t; }).length; MOT.rounds++;
    if(hit===MOT.k){ MOT.score++; sfx.master(); motMsg("All "+hit+" tracked!"); var r = document.getElementById("mot").getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, {n:16}); if(MOT.lvl<5) MOT.lvl++; }
    else { sfx.wrong(); motMsg(hit+" of "+MOT.k+" tracked"); if(MOT.lvl>1 && hit<MOT.k-1) MOT.lvl--; }
    motDraw();
    setTimeout(function(){ var el = document.getElementById("labbody"); if(el && LAB.tab==="mot"){ var keep = MOT.phase; labMOT(el); MOT.phase = keep; motDraw(); } }, 1400);
  }
}

/* ---- K. Goldilocks ---- */
var GOLD = {h:2};
function goldParts(){
  var x = function(h){ return 36 + h/8*290; }, y = function(h){ var t = h/8; return 96 - 140*t*(1-t)*1.1 + (t>0.6?(t-0.6)*60:0); };
  var hx = x(GOLD.h), hy = y(GOLD.h), path = '';
  for(var i=0;i<=40;i++){ var hh = i/5; path += (i?'L':'M')+x(hh).toFixed(1)+' '+y(hh).toFixed(1)+' '; }
  var svg = '<path d="M30 130 L30 14 M30 130 L330 130" class="ax2"/>'+T(180, 144, "hours of screen time per day →", {s:8.8, c:'tf'})+T(16, 72, "well-being", {s:8.8, c:'tf'}).replace('<text ', '<text transform="rotate(-90 16 72)" ')+
    '<rect x="'+x(1)+'" y="14" width="'+(x(3.4)-x(1))+'" height="116" rx="8" class="zone"/>'+T((x(1)+x(3.4))/2, 22, "Goldilocks zone", {s:8.6, w:700, c:'tgood'})+
    '<path d="'+path+'" class="ln s-good"/><circle cx="'+hx.toFixed(1)+'" cy="'+hy.toFixed(1)+'" r="8" class="f-lit" style="filter:drop-shadow(0 0 6px var(--lit))"/>';
  var zone = GOLD.h<1 ? ["c","Very little use: not the peak in Przybylski & Weinstein’s data."] : (GOLD.h<=3.4 ? ["k","Moderate use: linked to the best well-being (the “Goldilocks” pattern)."] : ["x","Heavier use: a small decline in well-being, on average."]);
  return {svg:SV(150, svg, "Goldilocks curve"), note:noteRow(zone[0], zone[1])};
}
function labGold(el){
  var p = goldParts();
  el.innerHTML = '<div class="card"><div id="goldsvg">'+p.svg+'</div><label class="sl" style="margin-top:6px"><span class="sl-l"><span class="dot2 f-lit"></span>Daily screen time<b id="goldv">'+GOLD.h.toFixed(1)+' h</b></span><input type="range" min="0" max="8" step="0.1" id="gold" value="'+GOLD.h+'" class="rng r-lit"></label></div>'+
    '<div class="card"><ul class="notes"><span id="goldnote">'+p.note+'</span>'+noteRow("n","Schematic shape only. Effects are small and correlational; teens differ a lot (Munzer et al., 2026).")+noteRow("c","AAP 2026: content quality and protecting sleep, play, and activity matter more than a single number.")+'</ul></div>';
  var r = document.getElementById("gold");
  r.addEventListener("input", function(){ GOLD.h = +r.value; var q = goldParts(); document.getElementById("goldsvg").innerHTML = q.svg; document.getElementById("goldnote").innerHTML = q.note; document.getElementById("goldv").textContent = GOLD.h.toFixed(1)+' h'; });
  r.addEventListener("change", function(){ sfx.tick(); });
}


/* ---------- keyboard ---------- */
document.addEventListener("keydown", function(e){
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  var k = e.key.toLowerCase();
  if(screen==="flash"){
    if(e.target && e.target.id==="flip") return;
    if(k===" "){ e.preventDefault(); fcFlip(); } else if(k==="1"&&FC.cur){ fcNext(false); } else if(k==="2"&&FC.cur){ fcNext(true); }
    return;
  }
  if(screen!=="quiz") return;
  var idx = "abcde".indexOf(k);
  if(idx<0) idx = "12345".indexOf(k);
  if(idx>=0 && k.length===1){ if(S.cur && !S.cur.done){ e.preventDefault(); choose(idx); } return; }
  if(k==="enter"){
    var tid = e.target && e.target.id;
    if(tid==="next" || tid==="back" || tid==="sndbtn" || tid==="thbtn" || tid==="ambbtn") return;
    if(e.target && e.target.tagName==="SUMMARY") return;
    var nb = document.getElementById("next");
    if(nb && !nb.hidden && !nb.disabled){ e.preventDefault(); advance(); }
  }
});

renderHome();
})();
