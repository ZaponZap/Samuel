mother–father families)","d":["It included too few mothers compared with the number of fathers","It used too many informants to interpret the results clearly","It measured attachment too late, when children were about 3","It relied only on teachers’ reports of behaviour problems"],"e":"Lecture flagged that the study “leaves out a lot of family structures”: only two-parent mother–father families were included, so single-parent, same-sex, and other families weren’t represented.","n":[["k","Critique: only two-parent mother–father families."],["c","Family structure (Oct 9 lecture)"]],"v":"kkTime","vp":"f","rd":"Kochanska & Kim (2013)"},{"id":"s1q068","s":1,"t":"R","q":"In Kochanska & Kim (2013), was a child’s security with the mother related to security with the father?","a":"No; the two were unrelated","d":["Yes; security with one parent meant security with both","Yes, but only among girls","Yes; father security depended on mother security","Only for disorganized infants"],"e":"==Attachment== organization with the mother was unrelated to organization with the father. Attachment is relationship-specific, which is exactly why measuring both parents matters.","n":[["k","==Attachment== is relationship-specific: mom and dad bonds were independent."],["c","Attachment = a SPECIFIC bond"]],"rd":"Kochanska & Kim (2013)"},{"id":"s1q069","s":1,"t":"R","q":"Why do Kochanska & Kim (2013) suggest newer studies find fathers’ attachment matters as much as mothers’?","a":"Fathers have become much more involved in early caregiving","d":["Mothers now spend far less time with infants than in the past","Fathers are now the primary caregivers in most families","The Strange Situation was redesigned for use with fathers","Fathers are now tested before mothers in studies"],"e":"Fathers’ involvement in early child rearing has grown dramatically. Pleck (2010) found fathers’ engagement time in 2000 was 94% higher than in 1965. Older studies favouring mothers may reflect cohort effects.","n":[["k","Fathers more involved now → father ==attachment== matters more."],["n","Fathers’ engagement time +94% (1965 → 2000)"],["c","Cohort effects (Exam 1 methods)"]],"rd":"Kochanska & Kim (2013)"},{"id":"s1q070","s":1,"t":"R","q":"About how was Kochanska & Kim’s (2013) sample split by attachment configuration?","a":"40 secure with both, 42 mixed, 18 insecure with both","d":["18 secure with both, 42 mixed, 40 insecure with both","50 secure with both, 40 mixed, 10 insecure with both","About 33 children in each of the three groups","60 secure with both, 30 mixed, 10 insecure with both"],"e":"Of 100 children with both assessments: 40 double-==secure==, 42 mixed (26 insecure with mother/secure with father; 16 the reverse), and 18 ==double-insecure==.","n":[["k","==Double-insecure== was the smallest group (18), yet it showed the biggest effect."],["n","40 / 42 / 18"]],"v":"kkGroups","vp":"f","rd":"Kochanska & Kim (2013)"},{"id":"s1q071","s":1,"t":"R","q":"What mechanism did Kochanska & Kim (2013) suggest for why even one secure relationship may protect a child?","a":"It may support emotion regulation that buffers against problems","d":["It raises the child’s IQ, which in turn prevents behaviour problems","It reduces the time the child spends with problematic peers at school","It ensures both parents agree on how to discipline","It stops the child’s temperament from being expressed"],"e":"They proposed that even one ==secure== relationship may support emotion regulation that buffers against developing behaviour problems, while highly ==resistant== strategies with both parents may signal later regulation difficulties.","n":[["k","One ==secure== bond → emotion regulation support → fewer problems."],["c","Lecture: attachment as a physiological stress buffer"]],"rd":"Kochanska & Kim (2013)"},{"id":"s1q072","s":1,"t":"LR","q":"Based on Kochanska & Kim (2013), which applied implication is most reasonable?","a":"A secure bond with at least one caregiver may offset risk","d":["Attachment interventions should target mothers only","Children need two secure attachments to avoid behaviour problems","Fathers’ attachment doesn’t need to be assessed","Attachment interventions are pointless after 15 months"],"e":"Because security with one parent offset the risk of insecurity with the other, supporting at least one ==secure== caregiver relationship looks valuable. Neither parent was primary, so focusing only on mothers isn’t supported.","n":[["k","One ==secure== caregiver relationship = protective."],["x","Neither parent is primary, so don’t ignore fathers."]],"rd":"Kochanska & Kim (2013)"},{"id":"s2q001","s":2,"t":"L","q":"Which of these did lecture list as a broader context or structure that shapes parenting?","a":["Economic conditions","Workplace","Community resources","Historical influences","Governmental policies","Culture"],"d":["The child’s temperament","The child’s genetic makeup","The infant’s attachment classification","The child’s birth order"],"e":"Lecture placed the family inside broader contexts and structures: culture, economic conditions, workplace, community resources, historical influences, and governmental policies.","n":[["k","Broader contexts: culture, economy, workplace, community resources, history, government policy."],["x","Child traits (temperament, genes) aren’t “broader contexts.”"]],"v":"contexts","vp":"f"},{"id":"s2q002","s":2,"t":"L","q":"Lecture’s “broader contexts and structures” view of parenting is based on which model?","a":"Bronfenbrenner’s ecological systems model","d":["Bowlby’s internal working model of relationships","Self-Determination Theory’s basic psychological needs","Ainsworth’s Strange Situation classification system","The diathesis–stress model of vulnerability"],"e":"Lecture showed Bronfenbrenner’s ecological systems model (microsystem to chronosystem) to frame how broader contexts shape parenting. Brodzinsky et al. use the same model for ==adoption==.","n":[["k","Contexts around the family = Bronfenbrenner’s ecological systems model."],["c","Brodzinsky et al.’s ecology of adoption"]],"v":"contexts","vp":"f"},{"id":"s2q003","s":2,"t":"L","q":"A province introduces paid parental leave, and parents report more time and energy for warm, responsive care. Which broader context from lecture does this show?","a":"Governmental policies","d":["Historical influences","Culture","Community resources","The child’s temperament"],"e":"Paid leave is a governmental policy, one of the broader structures lecture listed as shaping parenting (with culture, economy, workplace, community resources, and history).","n":[["k","Laws and benefits = governmental policies."],["x","Libraries and parks = community resources."]],"v":"contexts","vp":"f"},{"id":"s2q004","s":2,"t":"L","q":"Which set correctly lists the three dimensions of parenting from lecture?","a":"Warmth, autonomy support, and control/demandingness","d":["Warmth, discipline, and consistency of routines","Sensitivity, responsiveness, and physical affection","Authoritative, authoritarian, and permissive styles","Relatedness, competence, and autonomy needs"],"e":"The three dimensions are ==warmth== and support, autonomy granting/support, and ==control== and demandingness. Authoritative etc. are styles, and relatedness/competence/autonomy are SDT’s needs.","n":[["k","3 dimensions: ==warmth==, autonomy support, control."],["x","Relatedness/competence/autonomy = SDT needs, not parenting dimensions."],["m","W-A-C: Warmth, Autonomy, Control"]],"v":"items","vp":"f"},{"id":"s2q005","s":2,"t":"L","q":"“My parent always knows where I am after school” is an example item for which parenting dimension?","a":"Control and demandingness","d":["Warmth and support","Autonomy granting/support","Psychological control","Responsiveness"],"e":"Monitoring where the child is reflects ==control== and demandingness. Lecture’s other control item: “My parent always tells me how to behave.”","n":[["k","Monitoring and telling how to behave = ==control==/demandingness."]],"v":"items","vp":"f"},{"id":"s2q006","s":2,"t":"L","q":"“My parent allows me input into family rules” is an example item for which parenting dimension?","a":"Autonomy granting/support","d":["Warmth and support","Control and demandingness","Permissiveness","Responsiveness"],"e":"Allowing input into rules reflects ==autonomy support==. Lecture’s other autonomy item: “My parent encourages me to express my opinions.” Note: input into rules still means there are rules.","n":[["k","Input and voice = ==autonomy support==."],["x","Having input into rules ≠ having no rules (permissive)."]],"v":"items","vp":"f"},{"id":"s2q007","s":2,"t":"L","q":"“My parent makes me feel wanted and needed” is an example item for which parenting dimension?","a":"Warmth and support","d":["Autonomy granting/support","Control and demandingness","Relatedness satisfaction","Secure base"],"e":"Feeling wanted and needed reflects ==warmth== and support. Lecture’s other warmth item: “My parent says nice things about me.”","n":[["k","Affection and feeling valued = ==warmth==/support."]],"v":"items","vp":"f"},{"id":"s2q008","s":2,"t":"L","q":"“My parent encourages me to express my opinions” is an example item for which parenting dimension?","a":"Autonomy granting/support","d":["Warmth and support","Control and demandingness","Permissiveness","Authoritarian parenting"],"e":"Encouraging the child to voice opinions reflects autonomy granting/support.","n":[["k","Voice and opinions = ==autonomy support==."]],"v":"items","vp":"f"},{"id":"s2q009","s":2,"t":"L","q":"“My parent always tells me how to behave” is an example item for which parenting dimension?","a":"Control and demandingness","d":["Autonomy granting/support","Warmth and support","Uninvolved parenting","Responsiveness"],"e":"Directing behaviour reflects ==control== and demandingness.","n":[["k","Directing behaviour = ==control==/demandingness."]],"v":"items","vp":"f"},{"id":"s2q010","s":2,"t":"L","q":"Which parenting style combines high warmth with high control?","a":"Authoritative","d":["Authoritarian","Permissive/indulgent","Uninvolved/neglectful","Secure"],"e":"==Authoritative== = high ==warmth== + high control. Authoritarian = low warmth + high control. Permissive/indulgent = high warmth + low control. Uninvolved/neglectful = low warmth + low control.","n":[["k","==Authoritative== = warm + firm."],["m","AuthoriTATIVE = TALKS (warm). AuthoriTARIAN = TYRANT (cold)."]],"v":"grid:auth","vp":"f"},{"id":"s2q011","s":2,"t":"L","q":"Which parenting style combines low warmth with high control?","a":"Authoritarian","d":["Authoritative","Permissive/indulgent","Uninvolved/neglectful","Avoidant"],"e":"==Authoritarian== = high ==control== without warmth. Don’t mix it up with authoritative, which pairs high control with high warmth.","n":[["k","==Authoritarian== = strict, cold."],["x","Authoritative = strict and warm."]],"v":"grid:authn","vp":"f"},{"id":"s2q012","s":2,"t":"L","q":"Which parenting style combines high warmth with low control?","a":"Permissive/indulgent","d":["Authoritative","Authoritarian","Uninvolved/neglectful","Autonomy-supportive"],"e":"==Permissive==/indulgent parents are warm but set few limits or demands.","n":[["k","==Permissive== = warm, few limits."],["x","Not the same as autonomy support."]],"v":"grid:perm","vp":"f"},{"id":"s2q013","s":2,"t":"L","q":"Which parenting style combines low warmth with low control?","a":"Uninvolved/neglectful","d":["Permissive/indulgent","Authoritarian","Authoritative","Disorganized/chaotic"],"e":"==Uninvolved==/neglectful parents provide little ==warmth== and little control or monitoring.","n":[["k","==Uninvolved== = low warmth + low control."]],"v":"grid:unin","vp":"f"},{"id":"s2q014","s":2,"t":"L","q":"Dana’s parents rarely set rules, rarely check where she is, and rarely show affection. Which parenting style is this?","a":"Uninvolved/neglectful","d":["Permissive/indulgent","Authoritarian/strict","Authoritative","Autonomy-supportive"],"e":"Low ==warmth== plus low ==control== = uninvolved/neglectful. Permissive parents also have few rules but are warm.","n":[["k","No rules + no ==warmth== = uninvolved."],["x","No rules + warmth = permissive."]],"v":"grid:unin","vp":"f"},{"id":"s2q015","s":2,"t":"L","q":"Sam’s parents are affectionate and supportive but set few limits and rarely enforce rules. Which parenting style is this?","a":"Permissive/indulgent","d":["Authoritative","Uninvolved/neglectful","Authoritarian","Autonomy-supportive"],"e":"High ==warmth== plus low ==control== = permissive/indulgent.","n":[["k","Warm + few rules = ==permissive==."]],"v":"grid:perm","vp":"f"},{"id":"s2q016","s":2,"t":"L","q":"Jin’s parents set strict rules, expect obedience without explanation, and show little warmth. Which parenting style is this?","a":"Authoritarian","d":["Authoritative","Permissive/indulgent","Uninvolved/neglectful","Psychologically controlling but warm"],"e":"High ==control== plus low ==warmth== = authoritarian.","n":[["k","Strict + cold = ==authoritarian==."]],"v":"grid:authn","vp":"f"},{"id":"s2q017","s":2,"t":"L","q":"Ava’s parents are warm, set clear limits, and explain the reasons behind rules. Which parenting style is this?","a":"Authoritative","d":["Authoritarian","Permissive/indulgent","Uninvolved/neglectful","Indulgent-controlling"],"e":"High ==warmth== plus high ==control== = authoritative.","n":[["k","Warm + clear limits = ==authoritative==."]],"v":"grid:auth","vp":"f"},{"id":"s2q018","s":2,"t":"L","q":"In lecture’s 2×2 grid of parenting styles, which two dimensions form the axes?","a":"Warmth & support, and control","d":["Warmth and autonomy support","Control and autonomy support","Responsiveness and consistency","Sensitivity and attachment security"],"e":"The four styles come from crossing ==warmth== & support with ==control==. Autonomy support is the third dimension but isn’t an axis of the 2×2 grid.","n":[["k","Grid axes = ==warmth== × control."],["x","Autonomy support isn’t an axis of the grid."]],"v":"grid","vp":"f"},{"id":"s2q019","s":2,"t":"L","q":"How is the amount of parental warmth related to child outcomes, according to lecture?","a":"Greater amounts are associated with more positive outcomes","d":["Moderate amounts are associated with the most positive outcomes","Low amounts build independence and better outcomes","Warmth is unrelated to outcomes once control is considered","Very high amounts predict worse outcomes in adolescence"],"e":"==Warmth==: more → better. ==Autonomy support==: more → better. Control: moderate amounts → best.","n":[["k","==Warmth==: more is better."],["x","Control is the one where moderate is best."]],"v":"dose","vp":"f"},{"id":"s2q020","s":2,"t":"L","q":"How is the amount of parental control and demandingness related to child outcomes, according to lecture?","a":"Moderate amounts are associated with the most positive outcomes","d":["Greater amounts are associated with more positive outcomes at every age","Lower amounts are always associated with better outcomes for teens","Control is unrelated to child outcomes once warmth is controlled","Very high or very low amounts are equally ideal"],"e":"==Control== follows an inverted U: moderate amounts are linked to the best outcomes, while very low or very high control is linked to worse outcomes.","n":[["k","==Control==: moderate is best (inverted U)."],["m","Goldilocks control: not too little, not too much"]],"v":"dose","vp":"f"},{"id":"s2q021","s":2,"t":"L","q":"How is the amount of autonomy granting/support related to child outcomes, according to lecture?","a":"Greater amounts are associated with more positive outcomes","d":["Moderate amounts are associated with the most positive outcomes","Greater amounts are associated with more behaviour problems","Autonomy support matters only in early childhood","Autonomy support is unrelated to outcomes"],"e":"Like ==warmth==, more ==autonomy support== is associated with more positive outcomes. Only control showed the “moderate is best” pattern.","n":[["k","==Autonomy support==: more is better (like warmth)."]],"v":"dose","vp":"f"},{"id":"s2q022","s":2,"t":"L","q":"Which curve shape describes the link between parental control and child outcomes?","a":"An inverted U: outcomes are best at moderate levels","d":["A steadily rising line: more control is always better","A steadily falling line: less control is always better","A flat line: control is unrelated to outcomes","A U shape: outcomes are best at very low or very high levels"],"e":"Moderate ==control== is associated with the most positive outcomes, which forms an inverted U. ==Warmth== and autonomy support are steadily rising lines.","n":[["k","==Control== = inverted U. Warmth and autonomy = rising lines."]],"v":"dose","vp":"f"},{"id":"s2q023","s":2,"t":"L","q":"Parents A monitor their teen moderately. Parents B track every message and dictate every decision. Parents C never ask where their teen is. Based on lecture, whose teen is likely to have the most positive outcomes?","a":"Parents A’s teen, since moderate control is linked to the best outcomes","d":["Parents B’s teen, because more control is always better for teenagers","Parents C’s teen, because more freedom means more autonomy and independence","Parents A’s and B’s teens equally","Parents C’s teen, because control harms teens in every culture"],"e":"==Control== follows the “moderate is best” pattern. Note that never asking where a teen is reflects low control, not ==autonomy support== (autonomy support is about voice and input).","n":[["k","Moderate ==control== wins."],["x","No monitoring ≠ autonomy support."]],"v":"dose","vp":"f"},{"id":"s2q024","s":2,"t":"L","q":"Which statement best distinguishes autonomy support from permissive parenting?","a":"Autonomy support values the child’s input; it doesn’t mean having few rules","d":["Autonomy support and permissive parenting are two names for the same thing","Autonomy support means letting the child make every decision alone","Permissive parenting is high in control, while autonomy support is low","Autonomy support means low warmth combined with high control"],"e":"==Autonomy support== (e.g., input into rules, encouraging opinions) is a separate dimension from ==control==. A parent can have clear rules and still be highly autonomy-supportive.","n":[["k","==Autonomy support== = voice and initiative. Permissive = few limits."],["x","You can have firm rules AND high autonomy support."]]},{"id":"s2q025","s":2,"t":"L","q":"Which parenting dimension shows the most variation across cultures in its links to child outcomes?","a":"Control and demandingness","d":["Warmth and support","Autonomy granting/support","All three vary equally","None; all three links are universal"],"e":"Evidence suggests similar links between ==warmth== and ==autonomy support== and youth outcomes across cultures, but variation in the links between control and outcomes.","n":[["k","==Warmth== and autonomy: similar across cultures. Control: varies."]],"v":"cultDims","vp":"f"},{"id":"s2q026","s":2,"t":"L","q":"Which statement about parenting dimensions and culture fits lecture?","a":"Warmth and autonomy support show similar links across cultures","d":["Warmth predicts positive outcomes only in individualist cultures","Control predicts poor outcomes in every culture","Autonomy support harms children in collectivist cultures","No parenting dimension generalizes across cultures"],"e":"==Warmth== and ==autonomy support== appear broadly similar in their links to outcomes across cultures, while the effects of control vary.","n":[["k","==Warmth== + autonomy support ≈ universal ingredients."],["c","Bülow et al.: universality without uniformity"]],"v":"cultDims","vp":"f"},{"id":"s2q027","s":2,"t":"L","q":"A program in another country tells parents that firm rules always harm children, citing North American studies. Based on lecture, why is this advice questionable?","a":"The links between control and outcomes vary across cultures","d":["Warmth turns out to be harmful outside North America","Control is beneficial in every culture, at every level","Autonomy support has no effect outside the West","Parenting has little effect once children are adolescents"],"e":"==Control== is the dimension whose links to outcomes vary across cultures (and lecture said moderate control is generally best), so a blanket “firm rules harm children” claim doesn’t generalize.","n":[["k","==Control== effects depend on culture."],["c","Scheidecker et al.: overstated claims in parenting programs"]],"v":"cultDims","vp":"f"},{"id":"s2q028","s":2,"t":"L","q":"The commentary shown in lecture (Scheidecker et al., BMJ Global Health) argued that…","a":"global parenting programs rest on Euro-American research, creating Western bias","d":["parenting programs are under-funded in Western countries compared with elsewhere","parenting research has now proven one universally best parenting style","parenting interventions should focus only on fathers rather than mothers","parenting has no measurable effect on child development anywhere"],"e":"Titled “How overstated scientific claims undermine ethical principles in parenting interventions,” it argued that constructs and standards in these programs are overwhelmingly based on Euro-American research, producing a Western bias when applied in LMICs.","n":[["k","Overstated claims + Euro-American research → Western bias in global parenting programs."],["c","Attachment application: don’t treat Western norms as essential"]]},{"id":"s2q029","s":2,"t":"L","q":"Which question is most important when deciding whether to apply parenting research to a new community?","a":"Do the findings fit that community’s culture and context?","d":["Was the original study’s sample as large as it could possibly be?","Is this program the cheapest option available to the community?","Do parents in the community already know about the research?","Was the study published within the last five years?"],"e":"Lecture asked when it is (and isn’t) appropriate to apply parenting research. Because some links (especially ==control==) vary across cultures, generalizability to the community is the key question.","n":[["k","Apply only where the findings generalize."],["c","Exam 1: difficulty generalizing across populations"]]},{"id":"s2q030","s":2,"t":"LR","q":"What central question did Bülow et al. (2022) test?","a":"Whether warmth and autonomy support benefit well-being in (nearly) every family","d":["Whether authoritative parenting beats authoritarian parenting across cultures","Whether teens’ moods predict how their parents behave the next year","Whether parental control harms teens more than low warmth does","Whether mothers and fathers parent their teens differently"],"e":"They asked whether the associations between parental ==warmth==/==autonomy support== and teen well-being are universal: present in each family, not just on average.","n":[["k","Question: are ==warmth== and autonomy support good for EVERY family, not just the average?"]],"v":"uuu","vp":"f","rd":"Bülow et al. (2022)"},{"id":"s2q031","s":2,"t":"LR","q":"Which best describes the design of Bülow et al. (2022)?","a":"Daily diaries from parent–teen pairs for 100 consecutive days","d":["Yearly surveys of the same teens and parents over 10 years","A single lab visit coding observed parent–teen conflict discussions","Cross-sectional surveys of parents in 20 different countries","Weekly interviews with teens over 100 weeks"],"e":"Parent–teen dyads completed daily reports of parental ==warmth==, ==autonomy support==, and teen positive and negative affect for 100 consecutive days (14,546 daily reports in total).","n":[["k","100 daily diaries per family."],["n","About 5× longer than a typical diary study (18 days)"]],"v":"diary","vp":"f","rd":"Bülow et al. (2022)"},{"id":"s2q032","s":2,"t":"R","q":"Who participated in Bülow et al. (2022)?","a":"159 Dutch parent–teen pairs (teens about 13 years old)","d":["1,590 families recruited from 15 different countries","159 American mother–infant pairs followed from birth","59 Dutch adolescents who took part without their parents","15,900 Dutch high school students surveyed once"],"e":"159 Dutch dyads: teens averaged 13.31 years (62% girls), and 79% of participating parents were mothers.","n":[["k","159 Dutch parent–teen dyads."],["n","Teen age ≈ 13; 79% mothers"]],"v":"diary","vp":"f","rd":"Bülow et al. (2022)"},{"id":"s2q033","s":2,"t":"LR","q":"In what percentage of families were the effects of parental warmth and autonomy support in the expected (positive) direction?","a":"91–98% of families","d":["About 50% of families","About 60–70% of families","100%, with identical strength in every family","Fewer than 30% of families"],"e":"Positive effects of ==warmth== and ==autonomy support== on well-being appeared in 91–98% of families. Strength varied, but direction was nearly universal.","n":[["k","91–98% of families: expected direction."],["x","Same direction ≠ same strength."]],"v":"bulowPct","vp":"f","rd":"Bülow et al. (2022)"},{"id":"s2q034","s":2,"t":"R","q":"In how many families did need-supportive parenting relate to well-being in a SIGNIFICANT unexpected (harmful) direction?","a":"Fewer than 1% (just 1 of 636 effects)","d":["About 2–9% of the participating families","About 10% of the participating families","About 25% of the participating families","About half of the participating families"],"e":"Only 1 of 636 family-specific effects (0.2%) was significant in the unexpected direction. (Some families’ point estimates leaned the other way, about 2–9%, but they weren’t significant.)","n":[["k","Significant opposite effects: 1 of 636 (0.2%)."],["x","2–9% = non-significant point estimates, not real reversals."],["n","279 supporting vs. 1 contradicting"]],"v":"bulowPct","vp":"f","rd":"Bülow et al. (2022)"},{"id":"s2q035","s":2,"t":"LR","q":"What does “universality without uniformity” mean in Bülow et al. (2022)?","a":"Same direction in nearly all families, but different strength","d":["Effects are identical in strength in every single family","Effects are unique: helpful for some teens, harmful for others","Effects appear on average but not within individual families","Effects are universal across cultures but absent within them"],"e":"SDT’s middle position: ==warmth== and ==autonomy support== benefit essentially every teen (universal direction), but how much they help differs (not uniform).","n":[["k","==Universal== direction, non-uniform strength."],["m","Everyone’s plant grows with water, just at different speeds"]],"v":"uuu:2","vp":"f","rd":"Bülow et al. (2022)"},{"id":"s2q036","s":2,"t":"R","q":"Bülow et al. (2022) described a “simplistic” reading of SDT. What does it claim?","a":"Every teen benefits from need support to exactly the same degree","d":["No parenting behaviour is inherently helpful or harmful for adolescents","Effects are unique to each teen, depending entirely on moderators","Need-supportive parenting helps only highly sensitive teens","Parenting matters for young children but not adolescents"],"e":"The ==uniform== view: since the needs are ==universal== and innate, all teens should benefit equally. The data rejected this; effects differed in strength.","n":[["k","==Uniform== view = same benefit for everyone (rejected)."]],"v":"uuu:1","vp":"f","rd":"Bülow et al. (2022)"},{"id":"s2q037","s":2,"t":"R","q":"Which view did Bülow et al. (2022) describe as the “extreme relativistic” perspective?","a":"No parenting dimension is inherently adaptive; effects are unique","d":["All teens benefit identically from warmth and autonomy support","Warmth helps everyone, but its strength differs between families","Only parental control has universal effects on teens","Parenting effects are universal across but not within cultures"],"e":"The unique (relativistic) view says the same practice could help one teen and harm another. The near-absence of opposite effects contradicted this.","n":[["k","Unique view = could help some, harm others (not supported)."]],"v":"uuu:3","vp":"f","rd":"Bülow et al. (2022)"},{"id":"s2q038","s":2,"t":"R","q":"Each line in these panels shows one family’s link between parenting and well-being. Which panel depicts “universality without uniformity”?","a":"Panel 2: every line slopes up, with different steepness","d":["Panel 1: every line is identical and runs exactly parallel","Panel 3: some lines slope up while others slope down","None of the panels; the pattern is a flat line","Panel 1 and Panel 3 together"],"e":"==Universal without uniformity== = all positive (==universal== direction) but varying slopes (non-uniform strength). Panel 1 is uniform; Panel 3 is unique/relativistic.","n":[["k","All up, different slopes = universality without uniformity."]],"v":"uuu:blind","vp":"q","rd":"Bülow et al. (2022)"},{"id":"s2q039","s":2,"t":"LR","q":"Which three basic psychological needs does Self-Determination Theory propose?","a":"Relatedness, autonomy, and competence","d":["Warmth, autonomy, and control","Safety, belonging, and esteem","Secure base, safe haven, and proximity","Attachment, identity, and achievement"],"e":"SDT proposes three ==universal== needs: relatedness (feeling connected), autonomy (volition and authenticity), and competence (feeling capable). ==Warmth==, autonomy support, and control are parenting dimensions.","n":[["k","SDT needs: relatedness, autonomy, competence."],["x","Warmth/autonomy/control = parenting dimensions."],["m","“ARC”: Autonomy, Relatedness, Competence"]],"v":"sdt","vp":"f","rd":"Bülow et al. (2022)"},{"id":"s2q040","s":2,"t":"R","q":"According to Bülow et al. (2022), parental warmth mainly satisfies which psychological need?","a":"Relatedness","d":["Autonomy","Competence","Self-esteem","Safety"],"e":"==Warmth== (affectionate, ==responsive== interaction) mainly fosters relatedness. Autonomy support (recognizing the teen’s perspective, encouraging initiative) mainly fosters autonomy.","n":[["k","==Warmth== → relatedness. Autonomy support → autonomy."]],"v":"sdt","vp":"f","rd":"Bülow et al. (2022)"},{"id":"s2q041","s":2,"t":"R","q":"According to Bülow et al. (2022), autonomy support mainly satisfies which psychological need?","a":"Autonomy","d":["Relatedness","Competence","Belonging","Safety"],"e":"==Autonomy support== (recognizing the teen’s perspective and encouraging initiative) primarily fosters the need for autonomy: feeling volition and authenticity.","n":[["k","==Autonomy support== → autonomy need (volition, authenticity)."]],"v":"sdt","vp":"f","rd":"Bülow et al. (2022)"},{"id":"s2q042","s":2,"t":"R","q":"Whose reports of parenting were more strongly tied to teens’ daily well-being in Bülow et al. (2022)?","a":"The teens’ own reports","d":["The parents’ own reports","Both were equally strong","Teachers’ reports","Trained observers’ ratings"],"e":"Child-reported parenting was more strongly related to well-being than parent-reported parenting, as hypothesized, because teens’ reports capture their own perception and appraisal. Parent reports still showed ==universal== (weaker) effects.","n":[["k","Teen perception of parenting > parent report."],["x","Parent reports still mattered, just less strongly."]],"rd":"Bülow et al. (2022)"},{"id":"s2q043","s":2,"t":"LR","q":"Which adolescent characteristic best explained who benefited most from need-supportive parenting in Bülow et al. (2022)?","a":"Higher overall environmental sensitivity","d":["Older age","Being female","Higher conscientiousness","Higher average levels of parental warmth"],"e":"Across all four models, teens higher in ==environmental sensitivity== showed stronger links between parenting and well-being. Demographics and most personality traits mostly didn’t explain differences.","n":[["k","More environmentally ==sensitive== teens → stronger parenting effects."],["c","Differential susceptibility; Obradović & Bush (Exam 1)"]],"rd":"Bülow et al. (2022)"},{"id":"s2q044","s":2,"t":"LR","q":"Bülow et al.’s (2022) finding about environmental sensitivity most closely resembles which broader idea?","a":"Some individuals respond more strongly to their environments","d":["Parenting effects are identical for every child in every family","Teens’ personality traits fully determine their daily well-being","Highly sensitive teens are harmed by warm parenting","Only the parent’s view of their parenting matters"],"e":"Like ==differential susceptibility== (Brodzinsky et al.’s plasticity genes; Obradović & Bush on Exam 1), some individuals are more strongly shaped by their environment, here benefiting more from ==need-supportive== parenting.","n":[["k","Sensitivity = bigger response to the environment."],["c","Plasticity genes (Brodzinsky et al.)"]],"v":"ds","vp":"f","rd":"Bülow et al. (2022)"},{"id":"s2q045","s":2,"t":"R","q":"Need-supportive parenting was more strongly linked to which teen outcome in Bülow et al. (2022)?","a":"Positive affect (the “bright pathway”)","d":["Negative affect (the “dark pathway”)","Academic grades and school effort","Parents’ own daily well-being","Long-term life satisfaction"],"e":"Effects were stronger for positive affect, consistent with SDT’s dual pathways: ==need-supportive== contexts drive positive outcomes (bright pathway); need-thwarting contexts drive negative ones (dark pathway).","n":[["k","Need support → positive affect (bright). Need thwarting → negative (dark)."],["x","Need-thwarting behaviours weren’t measured."]],"rd":"Bülow et al. (2022)"},{"id":"s2q046","s":2,"t":"R","q":"Which limitation did Bülow et al. (2022) acknowledge?","a":["Daily effects can’t show long-term benefits","The sample needs more cultural and economic diversity","Psychological control wasn’t measured"],"d":["There were too few daily reports per family","Only parents reported on parenting","Teens were too young to rate their mood","The study used a single cross-sectional survey"],"e":"Limitations: limited power for very small effects, generalizability (more diverse age, SES, culture), no measure of the need-satisfaction pathway or need-thwarting parenting, and daily effects that may not mean long-term benefits.","n":[["k","Limits: daily ≠ long-term; Dutch sample; no psychological ==control== measure."]],"rd":"Bülow et al. (2022)"},{"id":"s2q047","s":2,"t":"R","q":"Bülow et al. (2022) warn of the “galloping horse fallacy.” What does it refer to?","a":"Daily effects may not add up to long-term outcomes","d":["An average effect may not apply to each individual","Teens may exaggerate parents’ warmth on good days","Large samples always produce significant effects","Parents’ reports always lag behind teens’ reports"],"e":"All teens may enjoy days when parents are warm and autonomy-supportive, but that doesn’t guarantee they become happier adults. Whether ==universal== short-term effects become long-term benefits is an open question.","n":[["k","Galloping horse fallacy = daily ≠ long-term."],["x","“Average ≠ every individual” = one-size-fits-all fallacy."]],"rd":"Bülow et al. (2022)"},{"id":"s2q048","s":2,"t":"R","q":"Why did Bülow et al. (2022) argue that comparing average effects across cultures can’t settle whether parenting effects are universal?","a":"A group average doesn’t show that every family in it benefits","d":["Cross-cultural studies always use too few participants","Parenting is measured identically in every culture","Averages always exaggerate how strong parenting effects are","Cultures don’t actually differ in their average parenting"],"e":"This is the “one size fits all” fallacy: a positive average could hide families with null or opposite effects. Only family-specific (N = 1) estimates can show universality.","n":[["k","One-size-fits-all fallacy: average ≠ each family."],["k","Solution: study each family intensively (N = 1)."]],"rd":"Bülow et al. (2022)"},{"id":"s2q049","s":2,"t":"R","q":"What practical implication for parenting advice did Bülow et al. (2022) draw?","a":"Promote warmth and autonomy support widely, tailored to each child","d":["Halt parenting programs until effects are identical for all","Give each family completely different advice, as effects are unique","Focus parenting programs mainly on psychological control","Target interventions only at highly sensitive teens"],"e":"Interventions should be “as ==universal== as possible, but as tailored as needed”: everyone should benefit somewhat, but need support should match each child’s characteristics.","n":[["k","As ==universal== as possible, as tailored as needed."]],"rd":"Bülow et al. (2022)"},{"id":"s2q050","s":2,"t":"R","q":"In Bülow et al. (2022), the daily item “My mother/father took my point of view into account” measured…","a":"autonomy support","d":["parental warmth","parental control","positive affect","relatedness satisfaction"],"e":"==Autonomy support== items: “My mother/father allowed me to make my own plans” and “...took my point of view into account.” ==Warmth== items: “The relationship was enjoyable” and “...showed me that she/he cares for me.”","n":[["k","Own plans and point of view = ==autonomy support==. Enjoyable relationship and caring = warmth."]],"rd":"Bülow et al. (2022)"},{"id":"s2q051","s":2,"t":"LR","q":"Which is a STRENGTH of Bülow et al.’s (2022) design?","a":"100 daily reports per family allowed family-specific estimates","d":["Parents were randomly assigned to warm or cold parenting conditions","A nationally representative sample drawn from many cultures","Follow-up of the teens continued well into adulthood","Parent–teen interactions were coded by trained observers"],"e":"The intensive design made it possible to estimate a separate parenting–well-being link for each family. It was also preregistered and used both teen and parent reports. It was not experimental, cross-cultural, or long-term.","n":[["k","Strength: 100 days → one estimate per family."],["x","Not experimental, not cross-cultural, not long-term."]],"v":"diary","vp":"f","rd":"Bülow et al. (2022)"},{"id":"s2q052","s":2,"t":"R","q":"What did Bülow et al. (2022) find for the AVERAGE family on a day-to-day basis?","a":"More warmth or autonomy support than usual → better mood that day","d":["More warmth than usual → teens felt worse the following day","Day-to-day changes in parenting were unrelated to teens’ daily moods","Only autonomy support, not warmth, related to teens’ daily mood","Teens’ moods changed only on weekends, not weekdays"],"e":"Within the average family, warmer or more autonomy-supportive days went with higher positive and lower negative affect. Between families, teens who reported more need support overall also felt better overall.","n":[["k","Better parenting days = better mood days (within families)."]],"rd":"Bülow et al. (2022)"},{"id":"s2q053","s":2,"t":"R","q":"Which parenting behaviour do Bülow et al. (2022) describe as potentially need-thwarting and in need of future study?","a":"Psychological control","d":["Autonomy support","Parental warmth","Monitoring after school","Providing choices"],"e":"They didn’t measure need-frustrating behaviours like psychological ==control==, so whether universality also holds for potentially harmful practices remains open.","n":[["k","Psychological ==control== = need-thwarting (not measured)."]],"rd":"Bülow et al. (2022)"},{"id":"s2q054","s":2,"t":"R","q":"Bülow et al. (2022) use a gardening metaphor for SDT. In it, what are parents?","a":"Gardeners supplying nutrients (need support) so teens flourish","d":["The soil, a fixed base that can never change or be improved","The weather, an outside force beyond anyone’s control","The fence that keeps the garden from growing wild and untidy","The seeds, which set the plant’s fate from the start"],"e":"SDT describes the three needs as nutrients like soil, water, and sunshine. Parents are gardeners providing them.","n":[["k","Needs = nutrients; parents = gardeners."]],"rd":"Bülow et al. (2022)"},{"id":"s2q055","s":2,"t":"L","q":"Which of these was listed in lecture as a type of family structure?","a":["Multigenerational and skip-generation households","Stepparents and blended families","Same-sex parents","Adoptive and foster families"],"d":["Authoritative and authoritarian families","Secure and insecure families","Universal and unique families","Nuclear-only families"],"e":"Lecture’s list: divorced parents, single parents, stepparents and blended families, multigenerational and skip-generation households, same-sex parents, adoptive families, foster families, and more.","n":[["k","Many structures: divorced, single, blended, multi/skip-generation, same-sex, adoptive, foster."]],"v":"famTypes","vp":"f"},{"id":"s2q056","s":2,"t":"L","q":"A “skip-generation” household is one in which…","a":"grandparents raise grandchildren without the parents present","d":["three generations all live together in a single shared home","children move back and forth between their two parents’ homes","a stepparent and stepsiblings join an existing family","older siblings raise their younger siblings on their own"],"e":"Skip-generation households skip the middle (parent) generation: grandparents raise grandchildren. Multigenerational households include three or more generations living together.","n":[["k","Skip-generation = grandparents + grandchildren, no parents."],["x","Multigenerational = 3+ generations together."]],"v":"famTypes","vp":"f"},{"id":"s2q057","s":2,"t":"L","q":"What does research say about children in divorced or single-parent households?","a":"Most are well-adjusted, though their risk of problems is higher","d":["Most of them show significant adjustment problems in adolescence","They show no greater risk of problems than other children do","Problems appear only when the father is absent from the home","They are better adjusted than other children on average"],"e":"Most children in “non-traditional” households are well-adjusted, but as a group they are more likely to have adjustment problems.","n":[["k","Most are fine; risk is somewhat higher."],["x","Higher risk ≠ most have problems."]],"v":"structure","vp":"f"},{"id":"s2q058","s":2,"t":"L","q":"Which is one reason lecture gave for higher adjustment risk in divorced or single-parent households?","a":["Parent conflict","Economic difficulties or changes","Disruptions to routines and living situations","Absence of, or a difficult relationship with, a parent"],"d":["Single parents are inherently less loving","Children of divorce inherit more difficult temperaments","Children in these families attend daycare","Two-parent families have stricter rules"],"e":"Reasons: parent conflict, economic difficulties/changes, disruptions, and absence of or difficult relationships with a parent. These create stress that can lead to less ==sensitive== and warm parenting.","n":[["k","Conflict, money, disruption, absence → stress → less ==sensitive== parenting."]],"v":"structure","vp":"f"},{"id":"s2q059","s":2,"t":"L","q":"Through what pathway does lecture suggest family-structure stresses affect children?","a":"Stress → less sensitive, warm parenting → more risk","d":["Family type directly sets the child’s attachment style","Stress → more autonomy granting → behaviour problems","Family structure changes the child’s genes over time","Stress affects only the parents, never the children"],"e":"Lecture’s pathway: parent conflict, economic difficulties, disruptions, and absence → stress → less ==sensitive== and warm parenting → adjustment problems.","n":[["k","Structure → stress → parenting quality → child outcomes."]],"v":"structure","vp":"f"},{"id":"s2q060","s":2,"t":"L","q":"What was lecture’s key takeaway about family structure?","a":"Parenting quality matters more than family structure itself","d":["Two-parent families are always best for children’s development","Family structure fixes the child’s attachment security for life","Single parents can’t provide enough warmth","Stepfamilies always have the worst outcomes"],"e":"Lecture: “Parenting quality is important!!!” Structure matters mainly through how it affects stress and the quality of parenting.","n":[["k","Parenting QUALITY > family structure."]],"v":"structure","vp":"f"},{"id":"s2q061","s":2,"t":"L","q":"What does research show about the adjustment of children raised by same-sex parents?","a":"No difference in child adjustment","d":["More adjustment problems in adolescence","Better adjustment in every measured area","More problems only in gender development","Differences that disappear only after age 18"],"e":"Lecture: same-sex parents → no difference in child adjustment, consistent with the idea that parenting quality, not structure, is what matters.","n":[["k","Same-sex parents: no difference in adjustment."],["c","Parenting quality matters most"]],"v":"famTypes","vp":"f"},{"id":"s2q062","s":2,"t":"L","q":"Two children’s parents divorce. One family keeps conflict low, income stable, and parenting warm; the other faces ongoing conflict and money problems. What does lecture predict?","a":"The second child faces more risk, since stress can undermine parenting","d":["Both face equal risk, since the divorce itself is the main risk factor","The first child is at greater risk, because having fewer disruptions is harmful","Neither faces any risk, since most children adjust well","Risk depends only on which parent has custody"],"e":"Risk comes through the stresses (conflict, economic difficulty, disruption) and their effect on parenting quality, not through the structure label itself.","n":[["k","Same structure, different stress = different risk."]],"v":"structure","vp":"f"},{"id":"s2q063","s":2,"t":"L","q":"Why can’t correlational studies alone show that divorce itself causes adjustment problems?","a":"Divorce comes bundled with conflict, money changes, and disruption","d":["Divorce is too rare to study in samples that are large enough","Children of divorce can’t ethically be surveyed about their families","Adjustment problems can’t be measured reliably in children","Divorce can be randomly assigned, but researchers rarely do so"],"e":"Family structure can’t be ==randomly assigned==, and it co-occurs with many stresses (conflict, money, disruptions). Those factors, rather than structure per se, may explain the differences.","n":[["k","Structure is confounded with stress."],["c","Exam 1: correlation ≠ causation; can’t randomize"]],"v":"structure","vp":"f"},{"id":"s3q001","s":3,"t":"L","q":"How did lecture define adoption?","a":"A permanent, legal placement with relatives or an unrelated family","d":["A temporary placement while birth parents regain the ability to care","A placement in which the child stays legally in government care","A permanent placement that must be with an unrelated family","An informal living arrangement with relatives, with no legal change"],"e":"==Adoption== is a permanent, legal placement of a child within a family of relatives (==kinship== adoption) or within an unrelated family (non-kinship adoption). Lecture stressed there’s no “standard” adoption.","n":[["k","==Adoption== = permanent + legal."],["n","Kinship = relatives. Non-kinship = unrelated family."],["x","Temporary + government custody = foster care."]],"v":"kinship","vp":"f"},{"id":"s3q002","s":3,"t":"L","q":"A grandmother legally and permanently adopts her grandson. This is…","a":"a kinship adoption","d":["a non-kinship adoption","foster care","a skip-generation foster placement","an institutional placement"],"e":"A permanent legal placement with relatives is a ==kinship== ==adoption==. With an unrelated family, it’s non-kinship adoption.","n":[["k","Relatives + permanent + legal = ==kinship== adoption."]],"v":"kinship","vp":"f"},{"id":"s3q003","s":3,"t":"L","q":"How did lecture define foster care?","a":"A temporary out-of-home placement for children whose parents can’t care for them","d":["A permanent, legal placement of a child with an unrelated adoptive family chosen by the courts","A permanent placement with relatives after parental rights have been legally ended","Placement in an orphanage or other large group institution for children","An informal arrangement in which family friends babysit for a while"],"e":"==Foster care== is a (temporary) long- or short-term out-of-home placement for children whose parents are unable to care for them. The goal is typically reunification, and the child is legally in government care.","n":[["k","==Foster care== = temporary + out-of-home + government custody."],["x","Adoption = permanent."]],"v":"kinship","vp":"f"},{"id":"s3q004","s":3,"t":"L","q":"What is typically the goal of foster care?","a":"Reuniting the child with the birth parents","d":["Finding a permanent adoptive family as fast as possible","Keeping the child in care until age 18","Transferring legal custody to the foster parents","Moving the child into institutional care"],"e":"The usual goal of ==foster care== is reunification with birth parents. That temporary, reunification-focused goal is part of what distinguishes it from ==adoption==.","n":[["k","==Foster care== goal = reunification."]],"v":"fcTri","vp":"f"},{"id":"s3q005","s":3,"t":"L","q":"Who is legally responsible for a child in foster care?","a":"The government","d":["The foster parents","The birth parents","A court-appointed relative","The child’s school"],"e":"A child in ==foster care== is legally in the care of the government. Caseworkers coordinate between the birth family and the foster family.","n":[["k","Foster child = legally in government care."]],"v":"fcTri","vp":"f"},{"id":"s3q006","s":3,"t":"L","q":"Lecture’s foster care diagram places the child among which three parties?","a":"Birth/first family, foster family, and government caseworkers","d":["Birth family, adoptive family, and the child’s school and teachers","Foster family, the child’s school, and the child’s closest peers","Birth mother, birth father, and the family courts","Adoptive family, therapists, and the child’s teachers at school"],"e":"The triangle connects the birth/first family, the foster family, and government/caseworkers, with the child in the middle.","n":[["k","Triangle: birth family ↔ foster family ↔ government/caseworkers."]],"v":"fcTri","vp":"f"},{"id":"s3q007","s":3,"t":"L","q":"Which of these is NOT one of the reasons for foster care placement listed in lecture?","a":["The child is struggling academically","The family has moved to a new city"],"d":["Maltreatment, such as neglect or abuse","Parents unable to provide care because of substance abuse or illness","Homelessness","Parental incarceration","Parental abandonment","Failure to manage the child’s behaviour (e.g., truancy, running away)"],"e":"Reasons: maltreatment (neglect, abuse); failure to manage the child’s behaviour (juvenile offenses, truancy, running away); parents unable to provide caregiving (substance abuse, psychological/physical illness); homelessness; parental incarceration; parental abandonment.","n":[["k","6 reasons: maltreatment, unmanageable behaviour, parents unable to care, homelessness, incarceration, abandonment."]],"v":"fcWhy","vp":"f"},{"id":"s3q008","s":3,"t":"L","q":"A teen repeatedly runs away and skips school, and her parents can’t manage it. Which category of reason for foster care is this?","a":"Failure to manage the child’s behaviour","d":["Maltreatment or neglect by parents","Parents unable to provide caregiving","Parental abandonment of the child","Family homelessness or housing loss"],"e":"Juvenile offenses, truancy, and running away fall under “failure to manage child’s behaviour.”","n":[["k","Truancy, running away, offenses = failure to manage behaviour."]],"v":"fcWhy","vp":"f"},{"id":"s3q009","s":3,"t":"L","q":"A parent’s severe substance use means they can’t care for their child. Which category of reason for foster care is this?","a":"Parents unable to provide caregiving","d":["Maltreatment","Failure to manage the child’s behaviour","Parental abandonment","Parental incarceration"],"e":"Lecture grouped substance abuse and psychological or physical illness under “parents unable to provide caregiving.”","n":[["k","Substance use or illness = parents unable to provide care."]],"v":"fcWhy","vp":"f"},{"id":"s3q010","s":3,"t":"L","q":"According to the 2016 Census figure in lecture, about what share of children under 14 in foster care in Canada are Indigenous?","a":"About 52%","d":["About 8%","About 25%","About 75%","About 15%"],"e":"52.2% of children under 14 in ==foster care== are Indigenous (Census 2016), a dramatic overrepresentation relative to their share of the child population.","n":[["k","52.2% of children in ==foster care== under 14 are Indigenous."],["m","“More than half”"]],"v":"indig","vp":"f"},{"id":"s3q011","s":3,"t":"L","q":"Which historical factors did lecture connect to Indigenous overrepresentation in foster care?","a":"Residential schools, the Sixties Scoop, and bias in placement","d":["High birth rates, rural living, and fewer adoptive families","Parental choice, frequent school transfers, and housing costs","Immigration policy, language barriers, and private adoption","Natural disasters, wars, and the rise of international adoption"],"e":"Lecture traced the overrepresentation to residential schools (1870s–1980s), the Sixties Scoop (1960s–1980s), and ongoing bias in placement into ==foster care==.","n":[["k","Residential schools → Sixties Scoop → bias in placement."],["c","ACEs critique: structural and intergenerational factors (Exam 1)"]],"v":"indig","vp":"f"},{"id":"s3q012","s":3,"t":"L","q":"Lecture dated the Sixties Scoop as…","a":"the 1960s–1980s","d":["the 1870s–1980s","the 1960s only","the 1940s–1960s","the 1980s–2000s"],"e":"The Sixties Scoop ran from the 1960s to the 1980s. Residential schools operated from the 1870s to the 1980s.","n":[["k","Sixties Scoop = 1960s–1980s."],["x","Residential schools = 1870s–1980s."]],"v":"indig","vp":"f"},{"id":"s3q013","s":3,"t":"L","q":"Lecture dated the residential school system in Canada as…","a":"the 1870s–1980s","d":["the 1960s–1980s","the 1900s–1950s","the 1870s–1920s","the 1940s–2000s"],"e":"Residential schools: 1870s–1980s. The Sixties Scoop overlapped with their final decades (1960s–1980s).","n":[["k","Residential schools = 1870s–1980s."]],"v":"indig","vp":"f"},{"id":"s3q014","s":3,"t":"L","q":"According to lecture, which group shows the most elevated risk for problems in school, mental health, and behaviour?","a":"Youth in foster care","d":["Children adopted as newborns","Children in kinship adoptions","Children raised by same-sex parents","No group; risks are equal"],"e":"Children who have experienced ==adoption== and/or ==foster care== are at greater risk for school problems, learning disabilities, externalizing problems, mental health issues, substance abuse, and insecure attachment, particularly youth in foster care.","n":[["k","Highest risk: ==foster care==."],["n","Risks: school, learning disabilities, externalizing, mental health, substance use, insecure attachment"]],"v":"tw","vp":"f"},{"id":"s3q015","s":3,"t":"L","q":"Overall, what does this chart from Turney & Wildeman (2016) show?","a":"Children placed in foster care had higher rates on every outcome shown","d":["Foster care children had lower rates of obesity but higher rates of ADHD","The two groups were similar except on depression","Children not placed in foster care had more learning disabilities","Foster care children had higher rates only of behaviour problems"],"e":"Children placed in ==foster care== had higher rates of every outcome: learning disability, ADHD, depression, anxiety, behavioural problems, developmental delay, obesity, and speech problems.","n":[["k","==Foster care== group higher on all 8 outcomes."],["x","Correlational: children enter care after adversity."]],"v":"tw","vp":"q"},{"id":"s3q016","s":3,"t":"L","q":"In this Turney & Wildeman (2016) chart, which outcome had the highest rate in BOTH groups?","a":"Obesity","d":["ADD/ADHD","Behavioural problems","Learning disability","Depression"],"e":"Obesity was the most common outcome in both groups (about 24% vs. about 16%). The biggest relative gaps were for depression and behavioural problems.","n":[["k","Highest in both groups: obesity."]],"v":"tw","vp":"q"},{"id":"s3q017","s":3,"t":"L","q":"In this Turney & Wildeman (2016) chart, which outcome showed the SMALLEST gap between the two groups?","a":"Developmental delay","d":["Depression","ADD/ADHD","Behavioural problems","Anxiety"],"e":"Developmental delay differed by only a few percentage points (about 7% vs. 4%). Depression, ADHD, and behavioural problems showed much larger gaps.","n":[["k","Smallest gap: developmental delay."]],"v":"tw","vp":"q"},{"id":"s3q018","s":3,"t":"L","q":"Which is one of the reasons lecture gave for higher risk among adopted and fostered children?","a":["Exposure to adverse environments","How the child conceptualizes loss and separation","Stigma","Challenges in identity development","Challenges in cultural connection","Genetic predispositions"],"d":["Adoptive parents are less warm than birth parents","Adopted children attend lower-quality schools","Adoption lowers IQ","Foster parents are paid to provide care"],"e":"Lecture’s list: exposure to adverse environments, conceptualization of loss and separation, stigma, challenges in identity development, challenges in cultural connection, and genetic predispositions. For ==foster care==, also instability in placements.","n":[["k","Why risk? Adversity, loss, stigma, identity, culture, genes (+ placement instability in ==foster care==)."]],"v":"riskWhy","vp":"f"},{"id":"s3q019","s":3,"t":"L","q":"Which risk factor did lecture single out as specific to foster care?","a":"Instability in placements","d":["Genetic predispositions","Stigma","Challenges in identity development","Exposure to adverse environments"],"e":"Instability in placements (moving between homes) was listed specifically for ==foster care==. The others applied to both ==adoption== and foster care.","n":[["k","Foster-care-specific risk: placement instability."],["c","Brodzinsky et al.: losing many attachments → attachment-disordered behaviour"]],"v":"riskWhy","vp":"f"},{"id":"s3q020","s":3,"t":"L","q":"Why can’t we conclude from these comparisons that foster care itself causes children’s problems?","a":"Children entering care have often already faced adversity (a confound)","d":["Foster care children are always tested by different researchers than comparison children","Foster care can be randomly assigned in Canada, so the data are already experimental","Rates of problems are too low to compare between groups","Children in care are too young to measure reliably"],"e":"Children usually enter ==foster care== because of maltreatment, neglect, or other adversity, so pre-placement adversity is confounded with placement.","n":[["k","Pre-placement adversity confounds ==foster care== comparisons."],["c","Exam 1: third variables"]],"v":"tw","vp":"f"},{"id":"s3q021","s":3,"t":"L","q":"Do children adopted at younger ages experience better outcomes?","a":"Yes; later adoption is linked to more antisocial behaviour and negative emotion","d":["No; children adopted at older ages show fewer behaviour problems overall in later childhood","No; once pre-adoption adversity is controlled, age at adoption makes no measurable difference","Only for language skills; behaviour and emotion are unaffected by age","Only for children adopted internationally, not for domestic adoptions"],"e":"Sharma, McGue & Benson (1996): antisocial behaviour and negative emotionality rose with age at ==adoption== (0–1, 2–5, 5–10, >10). This was lecture’s iClicker prediction question.","n":[["k","Younger at ==adoption== → better outcomes."],["c","BEIP: timing matters"]],"v":"ageAdopt","vp":"f"},{"id":"s3q022","s":3,"t":"L","q":"In this chart from Sharma, McGue & Benson (1996), how did negative emotionality change with age at adoption?","a":"It rose with age at adoption, highest when adopted after age 5","d":["It decreased with age at adoption, lowest for the oldest children","It stayed flat across all ages at adoption","It peaked for children adopted at 2–5, then dropped","It was highest for children adopted in the first year"],"e":"Negative emotionality rose from the 0–1 group (lowest) to the 5–10 and >10 groups (highest). Antisocial behaviour showed a similar but smaller rise.","n":[["k","Later ==adoption== → more negative emotionality."]],"v":"ageAdopt","vp":"q"},{"id":"s3q023","s":3,"t":"LR","q":"In cross-racial or international adoptions, which parenting approach is linked to more positive outcomes?","a":"Cultural socialization and preparing the child for bias","d":["A “colorblind” approach that downplays race","Avoiding discussion of the child’s origins until adulthood","Fully assimilating the child into the parents’ culture","Limiting the child’s contact with their cultural community"],"e":"More positive outcomes when parents provide ==cultural socialization== and preparation for bias; less positive when parents take a “==colorblind==” approach. Brodzinsky et al. note colorblind attitudes can jeopardize racial self-esteem and identity.","n":[["k","==Cultural socialization== + preparation for bias = better."],["x","“Colorblind” = worse outcomes."]],"v":"csoc","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q024","s":3,"t":"LR","q":"According to Brodzinsky et al. (2022), what can happen when transracial adoptive parents take a “colorblind” approach?","a":"Racial self-esteem, identity, and coping with bias can suffer","d":["The child adjusts better because race never becomes an issue","The child bonds more securely with the adoptive parents","The child avoids experiencing microaggressions entirely","The child’s school performance rises above peers’"],"e":"Downplaying race, ethnicity, and culture can jeopardize racial self-esteem and identity and weaken the child’s ability to cope with bias, discrimination, and microaggressions.","n":[["k","==Colorblind== → harms racial self-esteem and coping with bias."]],"v":"csoc","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q025","s":3,"t":"L","q":"Which situations have adoption and foster care often been seen as helping children escape?","a":"Institutional care, maltreatment, neglect, and poverty","d":["Parental divorce, remarriage, and conflict between siblings at home","Parental unemployment, frequent moving, and repeated school changes","Peer rejection, bullying, and academic failure","Chronic illness, disability, and hospitalization"],"e":"==Adoption== and ==foster care== have often been viewed as a way to “help” children out of adverse environments: institutional care/orphanages, maltreatment, neglect, and poverty.","n":[["k","Protective view: escape institutions, maltreatment, neglect, poverty."]],"v":"vdd","vp":"f"},{"id":"s3q026","s":3,"t":"L","q":"What does this chart from van den Dries et al. (2009) suggest?","a":"Adoptees are far less disorganized than institutionalized children, yet above the norm","d":["Adopted children are just as disorganized as children who are still living in institutions","Adoption eliminates disorganized attachment entirely, matching normative samples exactly","Normative samples show the most disorganized attachment of all groups","Institutional care shows no meaningful link to disorganized attachment"],"e":"==Disorganized attachment==: about 73% in institutions, 31% in adopted children, and 15% in normative samples. ==Adoption== is protective but recovery isn’t complete.","n":[["k","==Disorganized==: institution 73% → adopted 31% → norm 15%."],["k","==Adoption== = protective, not a full reset."]],"v":"vdd","vp":"q"},{"id":"s3q027","s":3,"t":"L","q":"About what share of institutionalized children showed disorganized attachment in van den Dries et al. (2009)?","a":"About 73%","d":["About 31%","About 15%","About 50%","About 90%"],"e":"Institution 73%, adopted 31%, normative 15%. Compare the 5% ==disorganized== rate in middle-class North American infants from the ==attachment== lecture.","n":[["k","73 / 31 / 15."],["c","Disorganized ↔ maltreatment and deprivation"]],"v":"vdd","vp":"f"},{"id":"s3q028","s":3,"t":"L","q":"What did the Bucharest Early Intervention Project (BEIP) investigate?","a":"Effects of institutional care, and whether foster care can reduce them","d":["Whether adoption by relatives leads to better outcomes than adoption by strangers","Whether parenting classes reduce maltreatment and neglect in at-risk birth families","Whether institutions build language better than foster care","Whether international adoption harms cultural identity"],"e":"==BEIP== investigated the effects of ==institutional care== and whether placement into high-quality foster care could ameliorate them.","n":[["k","==BEIP== = institution effects + can foster care fix them?"]],"v":"beip","vp":"f"},{"id":"s3q029","s":3,"t":"L","q":"Where and when did the BEIP begin?","a":"Romania, 2000–2001","d":["Russia, in the 1990s","Romania, in 1989","Bulgaria, in 2010","Ukraine, 2000–2001"],"e":"==BEIP== began in Romania in 2000–2001, when ==institutional care== for children had become prevalent and standards were poor.","n":[["k","==BEIP== = Romania, 2000–2001."]],"v":"beip","vp":"f"},{"id":"s3q030","s":3,"t":"L","q":"Which best describes the BEIP design?","a":"Institutionalized children randomized to foster care or care as usual, vs. a never-institutionalized group","d":["Families chose foster care or institutional care for their child, and their outcomes were then compared over time","A cross-sectional comparison of adults who had been adopted as children with adults who had never been adopted","Foster parents were randomly assigned to receive extra training or no training at all","A longitudinal study following only children who stayed with their birth families throughout"],"e":"==BEIP== was a randomized controlled trial: institutionalized children were ==randomly assigned== to high-quality foster care or care as usual (staying in institutions). A community sample of never-institutionalized children served as a comparison.","n":[["k","RCT: ==foster care== vs. care as usual + never-institutionalized comparison."]],"v":"beip","vp":"f"},{"id":"s3q031","s":3,"t":"L","q":"What was the role of the never-institutionalized community sample in BEIP?","a":"A benchmark of typical development for both institutionalized groups","d":["It served as the control group in the study’s random assignment","It received the high-quality foster care intervention itself","It supplied the families who went on to become foster parents","It replaced institutionalized children who dropped out of the study"],"e":"The randomization was between ==foster care== and care as usual. The community sample wasn’t randomized; it showed what typical development looks like for comparison.","n":[["k","Community group = benchmark, not randomized."],["x","Control group = care as usual."]],"v":"beip","vp":"f"},{"id":"s3q032","s":3,"t":"L","q":"Based on this chart (Smyke et al., 2010), which group’s rate of secure attachment at 42 months was closest to never-institutionalized children’s?","a":"Children placed in foster care before 24 months","d":["Children placed in foster care after 24 months","Children who remained in care as usual","None; all foster groups stayed far below","Care as usual and late foster care, equally"],"e":"Children placed before 24 months (about 69% ==secure==) matched never-institutionalized children (about 65%). Placed after 24 months: about 29%. Care as usual: about 17%.","n":[["k","==Foster care== before 24 months ≈ never institutionalized."],["k","Timing matters."]],"v":"smyke","vp":"q"},{"id":"s3q033","s":3,"t":"L","q":"About what share of BEIP children in care as usual were securely attached at 42 months?","a":"Under 20%","d":["About 30%","About 50%","About 65%","About 70%"],"e":"Care as usual: about 17% ==secure==. ==Foster care== after 24 months: about 29%. Foster care before 24 months: about 69%. Never institutionalized: about 65%.","n":[["k","Care as usual ≈ 17% ==secure==."],["n","17 / 29 / 69 / 65"]],"v":"smyke","vp":"f"},{"id":"s3q034","s":3,"t":"L","q":"Besides timing of placement, what else did lecture say matters for BEIP children’s outcomes?","a":"The quality of foster parenting","d":["The child’s sex","The number of siblings","The foster family’s income alone","Whether the child was told about the study"],"e":"==BEIP==: ==foster care== improved outcomes compared with institutional care, but timing matters, as does the quality of foster parenting.","n":[["k","==BEIP==: placement helps; earlier is better; quality matters."]],"v":"smyke","vp":"f"},{"id":"s3q035","s":3,"t":"L","q":"What did BEIP EEG data at age 8, shown in lecture, suggest?","a":"Children placed before 24 months looked more like never-institutionalized peers","d":["All foster care groups looked the same as the children who remained in care as usual","Children placed after 24 months showed the most typical brain activity of any group studied","Care as usual showed more brain activity than any other group did","EEG differences had disappeared in every group by the age of 8"],"e":"The ==EEG== maps showed care as usual and late placement with reduced activity, while children placed in ==foster care== before 24 months looked more like never-institutionalized children.","n":[["k","Early placement → brain activity closer to typical."]],"v":"smyke","vp":"f"},{"id":"s3q036","s":3,"t":"L","q":"Why is the BEIP’s design ethically debated?","a":"Some children were randomly kept in institutional care, suspected to be harmful","d":["Children were removed from loving birth families just so the study could be run","Researchers gave the children experimental medications without any form of consent","Foster parents weren’t paid anything for caring for the children","Children were adopted internationally without their families’ consent"],"e":"Lecture asked how we feel about randomly assigning children to ==foster care== vs. ==institutional care== as usual. The concern is withholding a likely beneficial intervention from the control group.","n":[["k","Ethical issue: ==control== group stayed in institutions."],["c","Exam 1: withholding treatment from a control group"]],"v":"beip","vp":"f"},{"id":"s3q037","s":3,"t":"L","q":"Based on lecture, which policy idea is best supported by adoption and foster care research?","a":["Place children in stable, high-quality families as early as possible","Prepare and support adoptive and foster parents, including on culture","Keep placement changes for foster children to a minimum"],"d":["Keep young children in institutions until they are older and sturdier","Discourage adoptive parents from talking about race or origins","Move foster children often so they don’t get too attached","Wait until adulthood to tell children that they were adopted"],"e":"Research points to earlier placement, placement stability, high-quality caregiving, and ==cultural socialization==. The distractors contradict ==BEIP==, Sharma et al., the colorblind findings, and Brodzinsky et al.","n":[["k","Policy: early, stable, high-quality, culturally supportive placements."]]},{"id":"s3q038","s":3,"t":"L","q":"A province wants to reduce Indigenous overrepresentation in foster care. Which approach best addresses the issues raised in lecture?","a":"Address bias in placement decisions and support cultural connection","d":["Increase international adoption of Indigenous children by families abroad","Place children with families who take a colorblind approach to race and culture","Speed up how quickly children are removed into care","Focus only on children’s individual behaviour problems"],"e":"Lecture named bias in placement into ==foster care==, plus the legacies of residential schools and the Sixties Scoop, as drivers of overrepresentation, and listed challenges in cultural connection as a risk.","n":[["k","Target bias in placement + protect cultural connection."]],"v":"indig","vp":"f"},{"id":"s3q039","s":3,"t":"R","q":"How do Brodzinsky et al. (2022) define trauma, following SAMHSA?","a":"Experiences felt as harmful or life-threatening, with lasting adverse effects","d":["Any event that causes a short-term spike in stress hormones, even without lasting effects","Only a single life-threatening event that leads to a PTSD diagnosis right away","Any separation of a child from a biological parent, at any age","Any experience a person later remembers as unpleasant or upsetting"],"e":"SAMHSA: “an event, series of events, or set of circumstances” experienced as physically or psychologically harmful or life-threatening, with lasting adverse effects on functioning and well-being. Effects may be immediate or delayed.","n":[["k","Trauma = harmful experience + LASTING adverse effects."],["x","Effects can be delayed, not just immediate."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q040","s":3,"t":"R","q":"According to Brodzinsky et al. (2022), what is the status of Developmental Trauma Disorder?","a":"It has been proposed for the DSM but not yet accepted","d":["It is now an official DSM-5 diagnosis","It has been rejected by researchers as invalid","It applies only to adults who were adopted as teens","It replaced PTSD as a diagnosis in the DSM"],"e":"Developmental Trauma Disorder, focused on cumulative interpersonal trauma disrupting emotional, relational, and self-systems, has been proposed but not yet accepted into the DSM.","n":[["k","Developmental Trauma Disorder = proposed, not accepted."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q041","s":3,"t":"LR","q":"Brodzinsky et al. (2022) describe two historical themes linking adoption and adversity. Which pair is correct?","a":"Adoption as a chance to recover, and adoption as a risk factor","d":["Adoption as a legal contract, and adoption as an emotional bond","Adoption as kinship care, and adoption as international care","Adoption as a cure for poverty, and adoption as a cause of it","Adoption as a short-term placement, and as a permanent one"],"e":"One theme sees ==adoption== as a societal intervention giving children permanency and a chance to recover. The other sees it as a developmental risk factor. Lecture framed this as “risk factor or protective intervention?”","n":[["k","Two themes: protective intervention vs. risk factor."],["c","Lecture: “Risk factor? Protective intervention?”"]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q042","s":3,"t":"LR","q":"Why do Brodzinsky et al. (2022) insist there is no singular “adoption experience”?","a":"Children differ in pathway, age, pre-placement history, and family","d":["All adoptees experience adoption as traumatic, just in different ways","Adoption laws are identical across countries, so experiences vary by person","Adopted children are too young at placement to have any experiences","Adoption research has never compared different groups of adoptees"],"e":"Children enter families through different pathways, at different ages, with different pre-placement experiences, into different types of families, making ==adoption== a heterogeneous experience. Lecture: “no standard adoption.”","n":[["k","==Adoption== is heterogeneous: pathway, age, history, family."],["c","Lecture: “Lots of variability”"]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q043","s":3,"t":"R","q":"According to Brodzinsky et al. (2022), how do the adversities of children adopted from institutions typically differ from those of children adopted from foster care?","a":"Institutions mean neglect and deprivation; foster care often adds threat","d":["Institutions mainly mean physical abuse; foster care mainly means neglect","Both groups mainly experience physical abuse before adoption, rather than neglect","Institutions mainly mean threat; foster care means only deprivation","Neither group usually experiences adversity before adoption"],"e":"Children from institutions are believed to have mainly experienced neglect and ==deprivation==. Children from ==foster care== frequently experienced neglect combined with threatening life circumstances.","n":[["k","Institutions = ==deprivation==. Foster care = deprivation + threat."],["c","Deprivation → brain growth; threat → amygdala"]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q044","s":3,"t":"R","q":"What did studies find for children adopted from deprived institutions within the first few months of life?","a":"No differences from children raised by their birth families","d":["Lasting deficits in language and IQ compared with peers","Higher rates of disorganized attachment in toddlerhood","Reduced gray matter volume that appears in adolescence","Better outcomes than children raised by their birth families"],"e":"Across cognitive, social, emotional, and physiological measures, children adopted in the first few months showed no differences from birth-family children. Mammals have evolved to cope with early caregiving shifts.","n":[["k","Adopted in the first few months → no detectable differences."],["x","They may still work through what adoption means later."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q045","s":3,"t":"R","q":"What is Brodzinsky et al.’s (2022) view of the claim that infant–birth mother separation creates a “primal wound”?","a":"No evidence shows placement in the first months is traumatic","d":["Separation is encoded as trauma in the infant’s brain","The primal wound explains most adoptees’ adult difficulties","The primal wound appears only in international adoptions","The primal wound can be prevented through open adoption"],"e":"They reject the “primal wound” idea (Verrier, 1993). Separating an older baby or child after attachments form would usually be disruptive, but very early placement isn’t shown to be traumatic.","n":[["k","No evidence for a “primal wound” from early placement."],["x","Separation AFTER attachments form can be disruptive."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q046","s":3,"t":"R","q":"In BEIP, what predicted school-age language outcomes, according to Brodzinsky et al. (2022)?","a":"Placed by ~15 months → typical language; after 25 months → lasting deficits","d":["Language recovered fully by age 8, no matter when children were placed in families","Children placed after 25 months had the strongest language skills of any group at age 8","Language was unaffected by institutional care in the first place","Only children who were never placed in families eventually caught up"],"e":"Children placed in families during rapid language learning (by about 15 months) scored like community controls at age 8. Those placed beyond 25 months continued to show deficits.","n":[["k","Language: placed by ~15 mo ≈ typical; after 25 mo → deficits."]],"v":"lang","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q047","s":3,"t":"R","q":"What did Stovall & Dozier (2000) find about forming a secure attachment soon after placement?","a":"It fell as age at placement rose from 5 to 28 months","d":["It increased steadily as age at placement rose","It was about the same at every age of placement","It dropped to zero for children placed after 12 months","It depended only on the age of the foster parent"],"e":"For children moved from their families into ==foster care==, the chance of organizing a ==secure attachment== in the first months after placement dropped with age from 5 to 28 months.","n":[["k","Older at placement → harder to quickly form ==secure attachment==."]],"v":"lang","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q048","s":3,"t":"R","q":"According to Brodzinsky et al. (2022), which child is more likely to show attachment-disordered behaviour after adoption?","a":"One abused by caregivers, or who formed and lost many attachments","d":["One raised in an institution who never formed any attachment","One adopted in the first few months of life, before attachments form","One whose adoptive parents have secure states of mind","One adopted by relatives in a kinship adoption arrangement"],"e":"Institution-raised children who never attached usually form discriminating, mostly ==secure== attachments rapidly once given the chance. Children abu
