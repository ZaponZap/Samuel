sed by caregivers or who repeatedly formed and lost attachments are more at risk of ==attachment==-disordered behaviour.","n":[["k","Lost or abusive attachments → more risk than never having attached."],["x","Never-attached children often attach securely quickly."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q049","s":3,"t":"R","q":"In an English study of children adopted from foster care, what besides pre-adoption adversity predicted problems?","a":"Distress at separation from foster parents","d":["The adoptive parents’ household income","The number of siblings in the adoptive home","The age of the adoptive parents at placement","Whether the child changed schools after adoption"],"e":"Outcomes largely reflected pre-==adoption== adversity, but distress at separation from foster parents also predicted problems, arguing for careful planning of that transition.","n":[["k","Plan the foster → adoptive transition carefully."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q050","s":3,"t":"R","q":"Which is NOT one of the executive function skills Brodzinsky et al. (2022) describe?","a":["Long-term semantic memory","Processing speed"],"d":["Inhibitory control","Working memory","Executive attention","Cognitive flexibility"],"e":"EF skills: inhibitory ==control==, working memory, executive attention, and cognitive flexibility. They support top-down regulation and are strongly affected by early ==deprivation== and abuse.","n":[["k","EF: inhibitory ==control==, working memory, executive attention, cognitive flexibility."],["c","Exam 1: EF and culture"]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q051","s":3,"t":"R","q":"Why do Brodzinsky et al. (2022) describe EF deficits as “transdiagnostic”?","a":"They signal risk for many different forms of psychopathology","d":["They appear in only one specific psychiatric disorder, so they help diagnosis","They must be diagnosed separately by several different clinicians","They disappear once any formal diagnosis is made","They are measured in the same way across countries"],"e":"EF deficits are transdiagnostic indicators of risk, linked to many forms of psychopathology, and a key step in a developmental cascade.","n":[["k","Transdiagnostic = cuts across many disorders."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q052","s":3,"t":"R","q":"Which sequence matches the developmental cascade Brodzinsky et al. (2022) describe?","a":"EF deficits → peer problems → school problems → adolescent struggles → mood disorders","d":["Mood disorders → school problems → peer problems → EF deficits → adolescent struggles","Peer problems → EF deficits → mood disorders → school problems → adolescent struggles","School problems → mood disorders → EF deficits → peer problems → adolescent struggles","EF deficits → mood disorders → peer problems → school problems → adolescent struggles"],"e":"Early neurocognitive (EF) deficits reflecting pre-==adoption== conditions → problems with peers and relationships → academic problems → difficulty with adolescent and emerging-adult tasks → affective disorders.","n":[["k","Cascade: brain skills → peers → school → adolescent tasks → mood disorders."],["m","“Skills beget skills”"]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q053","s":3,"t":"R","q":"In BEIP, what happened to reduced cortical thickness after children were removed from institutional care?","a":"The reductions weren’t mitigated by placement in families","d":["Cortical thickness fully recovered within about a year","Cortical thickness grew beyond typical levels after placement","Only children placed after 24 months showed recovery","Cortical thickness was never reduced in the first place"],"e":"Widespread reductions in cortical thickness weren’t mitigated by placement. Brain wiring, though, improved for children removed from institutions, while still differing from never-institutionalized children.","n":[["k","Cortical thickness: not recovered. Wiring: improved."]],"v":"plast","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q054","s":3,"t":"R","q":"What surprising timing pattern did one study find for hippocampus and amygdala volume reductions in children adopted from institutions?","a":"They didn’t emerge until adolescence, years after adoption","d":["They appeared at adoption, then disappeared by about age 5","They were present only during infancy, before adoption occurred","They appeared for the first time in early adulthood","They never appeared in any study of adoptees"],"e":"Some brain effects take time: reductions in hippocampal and amygdala volumes emerged by adolescence, predicted by stress-physiology dysregulation many years earlier.","n":[["k","Some brain effects show up late (adolescence)."],["c","Trauma effects can be delayed"]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q055","s":3,"t":"R","q":"Compared with deprivation, abuse and threat most strongly affect…","a":"the amygdala and threat-processing circuits","d":["overall brain growth and gray matter volume","the visual cortex and reading circuits","motor areas controlling movement","the cerebellum and balance"],"e":"==Deprivation== profoundly affects brain growth; abuse and ==threat== affect regions like the amygdala that process and trigger defensive responses, with more vigilance and reactivity to threat.","n":[["k","==Threat== → amygdala. Deprivation → brain growth."]],"v":"plast","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q056","s":3,"t":"R","q":"According to Brodzinsky et al. (2022), how do prospective and retrospective studies of childhood adversity differ?","a":"Prospective measures track biology more; retrospective reports track psychopathology more","d":["Retrospective self-reports track biological changes more closely than prospective measures do","Both kinds of study produce essentially identical findings about adversity and its long-term effects","Prospective studies can’t detect any brain effects of early adversity","Retrospective studies overestimate the neurobiological effects of adversity"],"e":"Prospective studies with objective measures correlate more with biological alterations; adults’ retrospective self-reports correlate more with psychopathology. So retrospective studies likely underestimate neurobiological impacts.","n":[["k","Retrospective self-report studies likely UNDERestimate brain effects."],["c","Exam 1: research design trade-offs"]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q057","s":3,"t":"R","q":"What do Brodzinsky et al. (2022) conclude about sensitive periods for recovery after early adversity?","a":"No single sensitive period: skills differ, and plasticity remains","d":["Recovery is impossible once one critical period ends at 6 months","All domains share one sensitive period that ends at age 2","Sensitive periods don’t exist, so recovery is equal at any age","Only language has a sensitive period; other skills don’t"],"e":"There are cascades of different ==sensitive== periods across and within domains. Later skills can sometimes compensate for earlier ones, and residual plasticity allows change after infancy, sometimes with specialized intervention.","n":[["k","Many ==sensitive== periods, not one. Residual plasticity remains."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q058","s":3,"t":"R","q":"What is “differential plasticity,” as described by Brodzinsky et al. (2022)?","a":"Some domains or skills recover faster and more completely than others","d":["Some children are genetically more sensitive to their environment than others","Boys and girls recover from early adversity at systematically different rates","Recovery happens only in children adopted before 6 months","The brain recovers but behaviour does not"],"e":"Recovery is asynchronous: some domains (and some facets within domains) rebound faster and more completely. Genetic sensitivity is a separate idea (plasticity genes / ==differential susceptibility==).","n":[["k","==Differential PLASTICITY== = uneven recovery across domains."],["x","Differential SUSCEPTIBILITY = individuals differ in sensitivity."]],"v":"plast","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q059","s":3,"t":"R","q":"Which physical recovery pattern do Brodzinsky et al. (2022) describe?","a":"Height rebounds quickly; head size lags until early adolescence","d":["Head size rebounds quickly, while height never fully catches up to peers","Neither height nor head size recovers after placement","Height and head size recover together within just a few months of placement","Weight recovers quickly, but height lags into adulthood"],"e":"After placement, linear growth rebounds and is soon in typical ranges. Head size lags but is in normal ranges by early adolescence.","n":[["k","Height: fast rebound. Head size: lags, normal by early adolescence."]],"v":"plast","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q060","s":3,"t":"R","q":"According to Brodzinsky et al. (2022), what is growth stunting?","a":"Height-for-age below the 5th percentile","d":["Weight below the 50th percentile","Head size below the 25th percentile","Any growth that falls below the average","Height that stops increasing entirely for a year"],"e":"Early adversity shifts resources away from growth (stress hormones act on the growth hormone system). When extreme, below the 5th percentile in height-for-age, it is called growth stunting.","n":[["k","Stunting = below the 5th percentile height-for-age."]],"v":"plast","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q061","s":3,"t":"R","q":"Why do Brodzinsky et al. (2022) say iron stores should be monitored during catch-up growth?","a":"Rapid growth can deplete iron, hindering cognitive recovery","d":["Iron levels predict which children will eventually be adopted","Too much iron in the diet causes growth stunting","Iron is needed for infants to form attachments","Iron stores reveal the child’s true age at adoption"],"e":"Rapid catch-up growth challenges iron stores that are often already compromised by ==deprivation==. Depleted iron can impair recovery of IQ and executive functions.","n":[["k","Catch-up growth → iron depletion → cognitive recovery at risk."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q062","s":3,"t":"R","q":"What paradox about IQ and school do Brodzinsky et al. (2022) describe?","a":"IQ rebounds into the normal range, yet school performance often lags","d":["School grades rebound quickly, yet IQ scores stay well below the average range","Both IQ and school grades stay low long after adoption","IQ drops after adoption while school grades rise steadily over the years","IQ and school grades both rise well above non-adopted peers"],"e":"Adopted children’s IQs typically rebound (about 104 on average) within a year or so, up to 20 points above peers left in institutions. But school performance often lags, with more learning difficulties, likely due to EF deficits and emotional/behavioural problems.","n":[["k","IQ recovers; school performance lags."],["n","Average IQ ≈ 104; up to 20 points above peers left behind"]],"v":"plast","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q063","s":3,"t":"R","q":"Which EF skills were found to be spared in post-institutionalized children (e.g., Pollak et al., 2010)?","a":"Rule acquisition and planning","d":["Attention regulation and inhibitory control","Working memory and inhibitory control","Attention regulation and working memory","Cognitive flexibility and attention regulation"],"e":"Attention regulation, working memory, and inhibitory ==control== showed deficits long after ==adoption==, but rule acquisition and planning were spared: another example of differential plasticity.","n":[["k","Spared: rule acquisition + planning."],["x","Persisting deficits: attention, working memory, inhibition."]],"v":"plast","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q064","s":3,"t":"R","q":"What does Norwegian research on internationally adopted children show about language?","a":"Everyday language comes quickly; abstract school language is harder","d":["Abstract school language comes more easily than everyday language","No new language is acquired until adolescence","Language recovers fully in every context within months","Children rarely learn the adoptive country’s language well"],"e":"Early-adopted children acquire contextual, everyday language rapidly, but have more difficulty with the abstract language typical of school (Dalen, 2005).","n":[["k","Everyday language: fast. Abstract school language: harder."]],"v":"plast","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q065","s":3,"t":"R","q":"According to Brodzinsky et al. (2022), how does attachment show differential plasticity?","a":"Attachment behaviours normalize; inner representations change more slowly","d":["Representations change quickly, but attachment behaviours never fully normalize","Neither attachment behaviours nor inner representations change after placement","Attachment recovers only in children adopted after age 4","Behaviours and representations recover at exactly the same rate"],"e":"Children adopted later can form ==secure== attachments behaviourally, but representations of self and others change more slowly and can keep improving into adulthood.","n":[["k","Behaviour normalizes first; inner representations lag."]],"v":"plast","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q066","s":3,"t":"R","q":"Which brain measure DOES recover after placement in a supportive family, according to Brodzinsky et al. (2022)?","a":"White matter volume and tract integrity","d":["Total gray matter volume across the cortex","Cortical thickness in frontal regions","Overall brain volume, including gray matter","Hippocampal volume measured in adolescence"],"e":"Gray matter volume and cortical thickness don’t appear to improve, but white matter volume and tract integrity do recover. Recovery may largely mean using surviving circuits more effectively.","n":[["k","White matter recovers; gray matter doesn’t."],["m","White = wiring insulation → can be re-wrapped"]],"v":"plast","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q067","s":3,"t":"R","q":"Which genes have been proposed as “plasticity genes”?","a":"DRD4 7-repeat, serotonin transporter short allele, BDNF","d":["BRCA1, APOE4, and the HLA-B27 immune gene variant","FOXP2, MECP2, and FMR1 language and development genes","Genes on the Y chromosome plus mitochondrial DNA","Genes that control eye colour, height, and blood type"],"e":"Variants in dopamine (DRD4 7-repeat), serotonin (transporter short allele), and neurotrophic (BDNF Val66Met) systems have been proposed as plasticity genes, linked to impairment in adversity and possibly greater responsiveness to improved conditions.","n":[["k","Plasticity genes: DRD4-7R, 5-HTT short, BDNF Val66Met."]],"v":"ds","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q068","s":3,"t":"LR","q":"How does differential susceptibility differ from diathesis–stress?","a":"Sensitive individuals do worse in adversity AND better in supportive conditions","d":["Vulnerable individuals do worse in adversity but gain nothing extra from supportive conditions","Everyone responds equally to adversity and to support","Sensitive individuals do better in adversity and worse in supportive, positive conditions","Only individuals with no genetic risk benefit from support"],"e":"Diathesis–stress: some are more vulnerable to bad environments. ==Differential susceptibility==: some are more ==sensitive== to environments overall, worse under adversity but better under support (“for better and for worse”).","n":[["k","==Differential susceptibility== = for better AND for worse."],["x","Diathesis–stress = only for worse."],["c","Bülow (sensitivity); Obradović & Bush (Exam 1)"]],"v":"ds","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q069","s":3,"t":"R","q":"What did a study of BDNF Val66Met in previously institutionalized children find (Gunnar et al., 2019)?","a":"MET carriers did best if adopted early and worst if adopted late","d":["MET carriers did worse than others at every age of adoption","MET carriers were unaffected by the age at which they were adopted","MET carriers did better only when they were adopted later","The gene predicted who was adopted but not later outcomes"],"e":"Children with one or more MET alleles were more ==sensitive== to age at ==adoption==, an example consistent with differential susceptibility.","n":[["k","MET carriers: more ==sensitive== to timing (better early, worse late)."]],"v":"ds","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q070","s":3,"t":"R","q":"Which post-adoption family quality predicts better developmental outcomes, according to Brodzinsky et al. (2022)?","a":["Stability in the caregiving environment","Warm, sensitive parent–child relationships","A parent’s secure state of mind regarding attachment","Encouraging age-expected behaviour"],"d":["Delaying any discussion of adoption","Strict, low-warmth discipline to build structure","Frequent caregiver changes to build flexibility","Minimizing the child’s contact with peers"],"e":"Stability, encouraging age-expected behaviours, parental ==secure== state of mind regarding ==attachment==, and warm, sensitive parent–child relationships predict better outcomes across domains.","n":[["k","Recovery context: stable, warm, ==sensitive==, secure-minded parents."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q071","s":3,"t":"R","q":"According to Brodzinsky et al. (2022), what does puberty offer children who experienced early adversity?","a":"A reopened window in which the stress system can be recalibrated","d":["A period when early attachment patterns become permanently fixed","A time when earlier gains in IQ stop altogether","A second period of growth stunting and slowed height gain","A window that closes off all remaining plasticity"],"e":"Pubertal development reopens a window for the stress response to recalibrate when the environment is much more supportive than it was in infancy.","n":[["k","Puberty = second window for stress-system recalibration."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q072","s":3,"t":"R","q":"What kind of evidence supports a CAUSAL role of sensitive parenting in recovery?","a":"Randomized trials boosting sensitive parenting raised security and reduced problems","d":["Correlations between adoptive parents’ income and their children’s later IQ scores","Retrospective reports from adult adoptees about how sensitive their parents had been","Cross-sectional comparisons of adopted and non-adopted teenagers","Detailed case studies of a handful of individual adoptive families"],"e":"Randomized interventions designed to increase ==sensitive== parenting in adoptive parents increased ==secure attachment== and reduced behaviour problems, which is causal evidence.","n":[["k","RCTs → ==sensitive== parenting causally aids recovery."],["c","Exam 1: experiments allow causal claims"]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q073","s":3,"t":"R","q":"Compared with low-risk community parents, adoptive parents are…","a":"more likely to have secure states of mind about attachment","d":["less likely to have secure states of mind about attachment","equally likely to have insecure states of mind about attachment","more likely to show an authoritarian parenting style","less sensitive in their parenting than community parents"],"e":"Adoptive parents are more likely than low-risk community parents to have ==secure== states of mind, which may explain why so many adopted children can form secure relationships with them.","n":[["k","Adoptive parents: often ==secure== states of mind → help children attach."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q074","s":3,"t":"R","q":"According to Brodzinsky et al. (2022), what do families adopting previously maltreated children often need?","a":"Ongoing, specialized support beyond good-enough parenting","d":["Only the ordinary, good-enough parenting any child needs","Less contact with professionals so the family can bond","Stricter discipline than other families typically use","Nothing beyond what birth families of similar children need"],"e":"Parenting children with significant behavioural, neurological, and emotional problems likely requires more than good-enough parenting. Support programs help, but many families lack access to ==adoption==-competent professionals.","n":[["k","Maltreated children → families need specialized, ongoing support."],["x","Many families can’t access it."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q075","s":3,"t":"R","q":"In Brodzinsky et al.’s (2022) ecological model, professionals and agency practices that affect the child mainly through the parents belong to the…","a":"exosystem","d":["microsystem","macrosystem","mesosystem","chronosystem"],"e":"Macrosystem = society/culture. Exosystem = community and professional interventions affecting the child indirectly via parents. Microsystem = family, peers, school. Mesosystem = interplay among microsystems. Chronosystem = change over time.","n":[["k","Exosystem = indirect influences via parents (professionals, agencies)."],["m","EXO = EXternal to the child, reaching them through others"]],"v":"adoptEco","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q076","s":3,"t":"R","q":"A society viewing adoption as “second best” to having biological children belongs to which ecological level?","a":"Macrosystem","d":["Microsystem","Exosystem","Mesosystem","Chronosystem"],"e":"Broad societal and cultural attitudes toward ==adoption== are part of the macrosystem.","n":[["k","Society and culture = macrosystem."]],"v":"adoptEco","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q077","s":3,"t":"R","q":"An adopted teen’s parents and teachers talk often and agree on how to support his questions about adoption. Which ecological level is this?","a":"Mesosystem","d":["Microsystem","Exosystem","Macrosystem","Chronosystem"],"e":"The mesosystem is the interplay among microsystems, such as family and school working together.","n":[["k","Connections between settings = mesosystem."]],"v":"adoptEco","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q078","s":3,"t":"R","q":"Which past adoption practice do Brodzinsky et al. (2022) describe as potentially traumatic?","a":"Advising parents not to tell children they were adopted","d":["Encouraging ongoing contact with the birth family","Preparing adoptive parents carefully before placement","Offering supports to families after the adoption","Placing biological siblings together in the same family"],"e":"An earlier practice counselled parents not to share ==adoption== information. Finding out about adoptive status at older ages or in unsupportive ways can be disruptive and potentially traumatic (Baden et al., 2019).","n":[["k","Secrecy → late or unsupportive discovery → potential trauma."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q079","s":3,"t":"R","q":"Which adoptive parenting approach is linked to healthier family dynamics and adjustment?","a":"Open, sensitive adoption communication that attends to the child’s views","d":["Avoiding the topic of adoption so the child can feel ordinary and fit in","Discussing adoption only when the child is in crisis and asks for it","Sharing birth family information only after the child turns 18","Treating the adoptive family exactly like a birth family"],"e":"Parents who are open in ==adoption== communication, share information sensitively, attend to the child’s point of view, and support search interests foster healthier dynamics and adjustment.","n":[["k","Open, ==sensitive== adoption communication = better adjustment."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q080","s":3,"t":"R","q":"Which adoptive parenting belief is linked to better support of children’s curiosity and adjustment?","a":"Acknowledging that adoptive and birth parenting differ","d":["Insisting that adoption makes no difference to family life","Believing the child’s past is best forgotten entirely","Expecting the child to resemble the rest of the family","Viewing adoption as a private matter never to be discussed"],"e":"Parents who readily acknowledge inherent differences in adoptive parenting are better prepared to support curiosity about origins and to share information openly and empathically, which predicts better adolescent adjustment.","n":[["k","Acknowledging difference > denying difference."],["c","Similar to colorblind vs. cultural socialization"]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q081","s":3,"t":"R","q":"What matters more for adoptees’ adjustment when it comes to birth family contact?","a":"Their satisfaction with the contact, more than its amount","d":["The total amount of contact, more than their satisfaction with it","Having no contact at all with any birth relatives","Contact that happens only through social media","Contact only with the birth mother, not other relatives"],"e":"Contact helps adoptees understand their past and integrate ==adoption== into identity, but satisfaction matters more than extent. Contact can also pose risks if it involves people who were abusive or unsupportive.","n":[["k","Satisfaction > amount of contact."],["x","Contact can be risky if it involves former abusers."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q082","s":3,"t":"R","q":"When do adopted children typically begin to feel ambivalence or distress about being adopted?","a":"In the elementary years, as they grasp adoption-related loss","d":["In infancy, at the moment they are placed with the family","In the preschool years, right when they’re first told","Only once they reach adulthood and form their own families","Never; distress comes only from earlier maltreatment"],"e":"Preschoolers, usually told during this period, show little comprehension and often positive views. Ambivalence and some distress emerge in the elementary years as children become sensitized to loss.","n":[["k","Preschool: positive, little comprehension. Elementary: sense of loss emerges."]],"v":"adoptDev","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q083","s":3,"t":"R","q":"How do preschoolers typically view being adopted, according to Brodzinsky et al. (2022)?","a":"Quite positively, with little comprehension of what it means","d":["With deep grief over losing their birth parents","With anger directed mostly at their adoptive parents","With full understanding of what relinquishment by birth parents means","With no awareness, since most children aren’t told until later"],"e":"Children are typically told in the preschool years and begin to learn their story, but understand little and often view ==adoption== positively.","n":[["k","Preschoolers: positive view, low understanding."]],"v":"adoptDev","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q084","s":3,"t":"R","q":"What did French (2013) mean by “birth privilege”?","a":"Societal views favouring families formed by birth over adoption","d":["Legal rights that birth parents keep after the adoption is finalized","The social advantages of being the first-born child","Priority in adoption for children born in the same country as the family","Birth parents’ right to choose the adoptive family"],"e":"“==Birth privilege==” describes hurtful societal views that prioritize families formed through procreation, contributing to a sense of stigma and of being “lesser than.”","n":[["k","==Birth privilege== = adoption seen as “second best.”"],["c","Lecture: stigma as a risk factor"]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q085","s":3,"t":"R","q":"What is “ambiguous loss” in the context of adoption?","a":"Birth family is physically absent yet psychologically present","d":["Grief that other people fail to recognize or validate as real","Losing a birth parent through death during childhood","Not knowing for certain whether one was adopted as a baby","Losing one’s adoptive parents later in adulthood"],"e":"==Ambiguous loss== (Boss, 1999): birth family is physically absent yet psychologically present, which makes loss hard to resolve. Unrecognized grief is “disenfranchised grief.”","n":[["k","==Ambiguous loss== = absent body, present mind."],["x","Disenfranchised grief = grief not validated by others."]],"v":"loss","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q086","s":3,"t":"R","q":"When an adoptee says she misses her birth family, relatives reply, “But your life here is so much better!” Her grief going unacknowledged illustrates…","a":"disenfranchised grief","d":["ambiguous loss","birth privilege","the primal wound","developmental trauma disorder"],"e":"Disenfranchised grief (Doka, 2002) occurs when others fail to understand, validate, and support a person’s feelings of loss. Lisa (adopted from China at 2) described exactly this.","n":[["k","Grief others don’t validate = disenfranchised grief."]],"v":"loss","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q087","s":3,"t":"R","q":"According to Brodzinsky et al. (2022), how can a VOLUNTARY placement appraisal complicate an adoptee’s self-view?","a":"They may question whether they had any value to their birth parents","d":["They may question whether they come from people of value","They may come to believe that the adoption never really happened","They may assume their adoptive parents removed them","They may feel only relief, with no complicated or mixed emotions at all"],"e":"If viewed as voluntary, adoptees may wonder if they had value to their birth parents. If viewed as an involuntary removal by child welfare, they may wonder if they come from people of value.","n":[["k","Voluntary → “Did I matter to them?” Involuntary → “Do they have value?”"]],"v":"loss","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q088","s":3,"t":"R","q":"Kelli, adopted from Korea at 2, felt she never belonged because she differed from her family in race, temperament, and school ability. This illustrates how…","a":"visible and genetic differences can undermine a sense of belonging","d":["early placement in a new family creates a lasting primal wound","kinship adoption reliably prevents later identity problems","colorblind parenting resolves differences between family members","adoption at age 2 guarantees an insecure attachment later on"],"e":"Differences in physical or racial features, temperament, abilities, and personality based on non-shared genetics can make adoptees feel they don’t fit in, compromising emotional security and identity.","n":[["k","Feeling different from family → harder belonging and identity."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q089","s":3,"t":"R","q":"In Brodzinsky et al.’s (2022) view, what makes a person more likely to experience adoption as traumatic?","a":"Appraising it as severe and central to the self, combined with attachment anxiety","d":["Being adopted in the first few months of life, before attachments have had time to form","Having any contact at all with members of the birth family during childhood","Being told about the adoption during the preschool years","Being adopted by relatives rather than by an unrelated family"],"e":"The impact of events is mediated by appraisals of severity and centrality to the self, plus current ==attachment== anxiety. The more severe, central, and anxious, the more likely ==adoption== is appraised as traumatic.","n":[["k","Trauma appraisal = severity + centrality + ==attachment== anxiety."]],"v":"appraisal","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q090","s":3,"t":"R","q":"Which contextual factor makes negative adoption appraisals more likely, according to Brodzinsky et al. (2022)?","a":["Messages of “birth privilege” and microaggressions","Lack of empathy and support from key people","Barriers to exploring adoption issues","Insecure internal working models of attachment"],"d":["Open, sensitive communication about adoption","Satisfying contact with birth family","Cultural socialization from adoptive parents","Access to adoption-competent therapy"],"e":"Negative appraisals are more likely with birth-privilege messages, lack of empathy and support, lack of specialized therapy, microaggressions, barriers to exploration, and insecure internal working models.","n":[["k","Risk: ==birth privilege==, no empathy, microaggressions, barriers, insecure working models."]],"v":"appraisal","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q091","s":3,"t":"R","q":"How do most adopted adults feel about their adoption experience, according to Brodzinsky et al. (2022)?","a":"Mostly positive about adoption, with good life satisfaction","d":["Most describe their adoption as a lifelong trauma","Most report feeling nothing at all about being adopted","Most say they regret having been adopted","Most cut off contact with their adoptive families as adults"],"e":"With supportive family and community contexts, most adults attribute positive feelings to their ==adoption== experience and report generally positive life satisfaction (ter Meulen et al., 2019).","n":[["k","Most adult adoptees: positive feelings and satisfaction."],["x","A minority find it destabilizing; don’t dismiss them."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q092","s":3,"t":"R","q":"What is Brodzinsky et al.’s (2022) overall conclusion about adoption and trauma?","a":"Adoption isn’t inherently traumatic, but pre-placement adversity is common and some struggle","d":["Adoption is inherently traumatic for every adopted person, whatever the circumstances of placement","Adoption has no meaningful link to trauma or adversity at any point in an adopted person’s life","Pre-placement adversity is rare, so most adoptees start from a typical baseline","Recovery after adoption is complete and happens evenly across every domain"],"e":"Trauma is common in adopted children’s lives, mostly before placement. ==Adoption== done within a rights and ethics perspective can be protective, recovery is real but uneven, and for some the lived experience is difficult.","n":[["k","Not inherently traumatic; often protective; recovery uneven; some struggle."]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q093","s":3,"t":"R","q":"In BEIP, what supported recovery in height, weight, and brain electrical activity, according to Brodzinsky et al. (2022)?","a":"Stability in the caregiving environment after placement","d":["Frequent moves between foster homes to find a good fit","Remaining in institutional care until the child was older","Higher income among the families who fostered children","Starting school early to provide structured stimulation"],"e":"Stability in caregiving after removal from ==institutional care== supported recovery in many domains, including height and weight and brain electrical activity.","n":[["k","Stability fuels recovery."],["c","Lecture: placement instability is a foster care risk"]],"rd":"Brodzinsky et al. (2022)"},{"id":"s3q094","s":3,"t":"LR","q":"Which factors shape the lived experience of adoption, according to the lecture goal drawn from Brodzinsky et al. (2022)?","a":"Factors related to the child, the family, and broader systems","d":["Only the child’s age at the time of placement and adoption","Only the adoptive family’s income, education, and resources","Only genetic factors inherited from the birth parents","Only whether the adoption was international or domestic"],"e":"Lecture’s added goal: discuss the lived experience of ==adoption==, considering how it’s shaped by child factors (development, appraisals), family factors (communication, parenting), and broader systems (society, professionals, policy).","n":[["k","Lived experience = child + family + broader systems."]],"v":"adoptEco","vp":"f","rd":"Brodzinsky et al. (2022)"},{"id":"s3q095","s":3,"t":"L","q":"Lecture asked whether adoption and foster care are risk factors or protective interventions. What was the answer?","a":"It depends on the comparison: more risk than never-adopted youth, but better than youth left in adversity","d":["They are risk factors in every comparison, because separation from birth family is always traumatic","They are protective in every comparison, because adoptive and foster homes offer more resources","It depends on the child’s age: they act as risk factors before age 2 but as protection afterward","It depends on the type of adoption: domestic adoption protects, while international adoption adds risk","Neither; once pre-placement adversity is controlled, outcomes match never-adopted youth"],"e":"Compared with ==youth who never experienced adoption or foster care==, we see ==greater risk==. Compared with ==youth who stayed in adverse environments of origin==, we see ==improvement==. And on average there are ==lots of individual differences==.","n":[["k","Risk or protection? → ==depends on the comparison group==."],["m","Look left (never adopted) = risk. Look back (left behind) = rescue."],["x","These are averages; individual differences are huge."]],"v":"compare","vp":"q"},{"id":"s3q096","s":3,"t":"L","q":"Study 1 compares adopted teens with their non-adopted classmates and finds more mental health problems. Study 2 compares adopted teens with siblings who stayed in an orphanage and finds fewer problems. Which conclusion is correct?","a":"Both can be right, because the two studies use different comparison groups","d":["Study 1 must be wrong, because adoption has been shown to be protective","Study 2 must be wrong, because adoption has been shown to be a risk factor","The studies conflict, so adoption must have no real effect on mental health","Study 1 shows that adoption itself causes later mental health problems","Study 2 shows that orphanage care is better than growing up in an adoptive home"],"e":"Lecture’s key point: whether adoption looks like a ==risk factor== or a ==protective intervention== ==depends on the comparison group==. Against non-adopted peers, adoptees show more risk; against children left in adversity, they show improvement.","n":[["k","Same adoptees, different comparison → different story."],["x","Study 1 can’t show causation: adoptees also carry pre-adoption adversity."]],"v":"compare","vp":"f"},{"id":"s3q097","s":3,"t":"L","q":"According to lecture, what did the BEIP show about foster care as a protective intervention?","a":"Foster care beat institutional care, but timing and foster-parenting quality mattered","d":["Foster care children did no better than those who stayed in institutional care","Foster care helped mainly children who were placed after their fourth birthday","Foster care helped only when the foster parents were relatives of the child","Foster care children matched never-institutionalized children regardless of timing","Foster care improved children’s physical growth but not their attachment security"],"e":"In BEIP, children randomly assigned to ==high-quality foster care improved== relative to care as usual. But ==timing matters== (earlier is better) and so does the ==quality of foster parenting==. Lecture added some evidence for ==even more improvement with adoption==.","n":[["k","==BEIP==: foster care > institution, if early + high quality."],["c","Some evidence: adoption → even more improvement."]],"v":"beip","vp":"f"},{"id":"s3q098","s":3,"t":"L","q":"After BEIP, lecture said, “But these are extremes…” What did that mean?","a":"Institutional deprivation is extreme; removal from adverse homes may look different","d":["BEIP’s effect sizes were too extreme to be believable without independent replication","BEIP only studied children with extreme disabilities and complex medical needs","Foster care in BEIP was extremely low in quality compared with typical Canadian care","BEIP compared only the very youngest and the very oldest children in institutions","Institutional care is now the most common form of placement for children in Canada"],"e":"Moving from ==severe institutional deprivation== to high-quality foster care is an ==extreme contrast==. Most foster care involves children ==removed from adverse home environments==, where the comparison is much more complicated.","n":[["k","Institution → family = extreme contrast; home removal is murkier."]],"v":"mennen","vp":"f"},{"id":"s3q099","s":3,"t":"L","q":"Mennen, Brensilver, and Trickett (2010) studied children involved in the child welfare system for maltreatment. Which groups did they compare?","a":"Maltreated children who stayed home, went to kinship care, or went to non-kin foster care, plus a comparison group","d":["Institutionalized children, children placed in high-quality foster care, and a never-institutionalized community group","Domestic adoptees, international adoptees, and a comparison group of their non-adopted classmates at school","Children in centre care, children in home daycare, and children in exclusive parental care","Children adopted before 24 months, children adopted after 24 months, and children who were never adopted","Foster children placed together with siblings, foster children placed alone, and children who stayed home"],"e":"Mennen et al. (2010) compared maltreated children who ==stayed with their biological family==, were placed in ==kinship foster care==, or in ==non-kinship foster care==, plus a ==comparison group with no known maltreatment==, using caregiver reports of internalizing, externalizing, and global impairment.","n":[["k","Groups: bio home · ==kinship== FC · non-kin FC · no-maltreatment comparison."],["x","Institutional groups = BEIP, not Mennen."]],"v":"mennen","vp":"q"},{"id":"s3q100","s":3,"t":"L","q":"Compared with maltreated children who remain at home, what did lecture say children placed into foster care from home often show?","a":"No difference in outcomes","d":["Much better outcomes, like BEIP children","Much worse outcomes on every measure","Better internalizing but worse externalizing outcomes","Better outcomes only in non-kinship care","Worse outcomes only in kinship care"],"e":"When children are removed from homes with suspected maltreatment, it’s ==“much more complicated”==: studies ==often observe no differences in outcomes== compared with children who remain in the home.","n":[["k","Removed from home → often ==no difference== vs staying."],["x","Don’t generalize BEIP’s big gains to home removals."]],"v":"mennen","vp":"f"},{"id":"s3q101","s":3,"t":"L","q":"Why might foster care from home show no advantage over staying in a home with suspected maltreatment?","a":"Foster care’s own traumas (separation, instability, lost culture) can offset escaping maltreatment","d":["Maltreatment has little lasting effect on development, so removing children changes very little","Foster parents are always less sensitive than biological parents, so the care children receive is worse","Children in foster care are older on average, so their problems are more entrenched by placement","Foster care placements usually last over 10 years, which delays recovery","Children who stay home receive more support services than children in foster care"],"e":"Lecture weighed the ==trauma of foster care== (==separation, instability, cultural deprivation, trauma in foster care==) against the ==trauma of (potential) maltreatment==. The two can balance out.","n":[["k","FC trauma ⚖ maltreatment trauma."],["m","Separation · Instability · Culture lost · Trauma in care = “SICT.”"]],"v":"mennen","vp":"f"},{"id":"s3q102","s":3,"t":"L","q":"Which was NOT listed in lecture as a possible trauma of foster care?","a":"Higher family income","d":["Separation from family","Placement instability","Cultural deprivation","Trauma experienced within foster care"],"e":"Lecture listed ==separation==, ==instability==, ==cultural deprivation==, and ==trauma in foster care==. Income isn’t a trauma.","n":[["k","FC traumas: separation · instability · cultural ==deprivation== · trauma in FC."]]},{"id":"s3q103","s":3,"t":"L","q":"Lecture warned that groups in studies like Mennen et al. (2010) “may not be equivalent in other ways.” What does this mean?","a":"Children who are removed may differ from those who stay, so placement alone can’t explain outcomes","d":["Groups were randomly assigned, so any outcome difference must have been caused by foster care itself","The groups differed only in how many siblings each child had living in the household at the time","Caregiver reports were identical across placement types, so no comparison between groups was possible","All children in the study were the same age and gender, which limits generalization","Placement decisions in child welfare are made by lottery, so groups are equivalent"],"e":"Unlike BEIP, child-welfare placements aren’t random. Children removed may have experienced ==more severe maltreatment== or have different needs, so groups aren’t equivalent: a ==selection== problem.","n":[["k","No random assignment → ==selection effects==."],["c","BEIP was randomized; Mennen was not."]]},{"id":"s3q104","s":3,"t":"L","q":"Jules was adopted at 1 from a home with suspected maltreatment; Kira was adopted at 4 from a similar home; Lio was placed in foster care at 4; Mo stayed home. Which prediction is LEAST supported by research?","a":"Lio will have better outcomes than Mo","d":["Jules will have better outcomes than Kira","Kira will have better outcomes than Mo","Jules will have better outcomes than Mo","Outcomes will vary a lot between individual children"],"e":"Earlier adoption tends to be better (Jules > Kira), and adoption tends to improve on staying in adversity (Kira, Jules > Mo). But foster care from home often shows ==no difference== from staying home, so “Lio > Mo” is least supported.","n":[["k","==Adoption== earlier > later; adoption > left behind; FC from home ≈ staying."],["c","Twin of the Oct 26 practice Q (Amanda, Aaron, Faith, Homer)."]]},{"id":"s3q105","s":3,"t":"L","q":"Given lecture’s research on foster care from adverse homes, which policy direction is most consistent with the evidence?","a":"Help families keep children safely home when possible; if not, favour stable, culturally connected placements","d":["Remove every child with any report of maltreatment and place them in non-kin foster care as quickly as possible","Keep children in institutional care until a fully screened adoptive home becomes available for them","Move children between foster homes regularly so they don’t become over-attached to temporary caregivers","Avoid kinship placements, because relatives are likely to share the family’s risk factors and history","End foster care entirely, since studies show it provides no benefit to any children"],"e":"Because foster care’s own traumas (==separation, instability, cultural deprivation==) can offset its benefits, policy should ==support families== where safely possible and ==minimize instability and cultural loss== when placement is needed. Earlier lectures also stressed kinship care and Indigenous-led approaches.","n":[["k","Target the traumas of FC: ==stability · connection · culture==."],["x","Institutional care is the worst option in BEIP."]]},{"id":"s3q106","s":3,"t":"L","q":"Why do researchers say adoption and foster care findings describe outcomes “on average”?","a":"Individual differences are large: many adoptees and foster youth do well while others struggle","d":["Every adopted child tends to have nearly the same outcome, so averages describe them all accurately","Averages are used only for international adoptions, where birth and placement records are incomplete","Individual outcomes can’t be measured in adoption research because of strict privacy laws","Foster care outcomes are always worse than average, so averages hide that pattern","Only small samples have been studied, so averages are the only possible summary"],"e":"Lecture stressed “==on average — lots of individual difference!==” Pre-placement adversity, timing, parenting quality, and context all shape how each child fares (see Brodzinsky et al.).","n":[["k","Group averages hide ==individual differences==."],["c","Brodzinsky: no singular “adoption experience.”"]]},{"id":"s4q001","s":4,"t":"L","q":"Lecture listed three main types of childcare arrangements. Which set matches?","a":"In-home care, home/family care centres, and childcare centres","d":["Parental care, relative care, and preschool or kindergarten education","Licensed care, unlicensed care, and government-subsidized care","Infant care, toddler care, and before- and after-school care","Nanny care, foster care, and centre-based care","Full-time care, part-time care, and drop-in care"],"e":"Lecture grouped childcare into three types: ==in-home care== (a nanny or relative in the child’s home), ==home/family care centres== (care in a provider’s home), and ==childcare centres==. Foster care is a child-welfare placement, not a childcare arrangement.","n":[["k","3 types: ==in-home== → ==family/home centre== → ==childcare centre==."],["m","Where does care happen? Your home → their home → a centre."],["x","Foster care is a welfare placement, not childcare."]],"v":"ccTypes","vp":"f"},{"id":"s4q002","s":4,"t":"L","q":"Aiko’s grandmother comes to Aiko’s apartment every weekday to care for her while her parents work. Which type of childcare is this?","a":"In-home care","d":["Home/family care centre","Childcare centre","Kinship foster care","Exclusive parental care","Informal family daycare"],"e":"Care provided in the child’s own home by a nanny or relative is ==in-home care==. A home/family care centre is run in the provider’s home, usually with several children.","n":[["k","Child’s own home + nanny/relative = ==in-home care==."],["x","Kinship foster care is a child-welfare placement, not daily childcare."],["c","Bernier et al. counted nanny/relative care as childcare too."]]},{"id":"s4q003","s":4,"t":"L","q":"Mateo attends a program run out of a licensed provider’s house, where she cares for five children of mixed ages. This arrangement is best described as…","a":"a home/family care centre","d":["in-home care","a childcare centre","a nanny-share","a kinship placement","an early learning classroom"],"e":"A ==home/family care centre== is care offered in the provider’s own home, often to a small mixed-age group. In-home care happens in the child’s home; a childcare centre is a dedicated facility.","n":[["k","Provider’s home + a small group = ==family care centre==."],["m","Whose home? Child’s = in-home. Provider’s = family centre."]],"v":"ccTypes","vp":"f"},{"id":"s4q004","s":4,"t":"L","q":"According to the Statistics Canada (2019) data shown in lecture, how common is childcare for young children in Canada?","a":"Most children aged 0–5 (about 6 in 10) were in some form of childcare","d":["Fewer than 1 in 5 children aged 0–5 were in any form of regular childcare","About 1 in 3 children aged 0–5 were in some form of childcare arrangement","Nearly all children aged 0–5 (over 95%) attended licensed childcare centres","Childcare was rare before age 4, when most children start kindergarten","About half of children used care, almost all of it provided by relatives"],"e":"Statistics Canada (2019) reported that roughly ==60% of Canadian children aged 0–5== were in some form of childcare. That is why childcare effects matter for so many families and for policy.","n":[["k","~==6 in 10== Canadian kids aged 0–5 are in childcare."],["c","So effects, even small ones, matter at population scale."]]},{"id":"s4q005","s":4,"t":"L","q":"Dana would prefer a highly rated centre, but it costs more than half her monthly income, so she uses an unlicensed neighbour instead. Which factor in childcare decisions does this best illustrate?","a":"Economic circumstances","d":["Cultural goals of childcare","Views of childcare as a public responsibility","Childcare as a child welfare system","Characteristics of the child","Cultural views of childcare as early education"],"e":"Lecture stressed that childcare decisions are often driven by ==economic circumstances==. When affordable high-quality care is scarce, families make non-optimal arrangements.","n":[["k","Cost limits choice → ==economic circumstances==."],["c","Policy: demand for affordable high-quality care exceeds supply."]],"v":"ccDecide","vp":"f"},{"id":"s4q006","s":4,"t":"L","q":"In Country A, childcare is free, run by the government, and seen as something society owes all families. In Country B, families must find and pay for care themselves. These countries differ mainly in their…","a":"conception of childcare as a public vs private responsibility","d":["cultural goals for what childcare should teach young children","view of childcare as early education versus as child welfare","economic circumstances within individual families’ budgets","structural quality standards for centres and family homes","process quality of the caregiver–child interactions in care"],"e":"Lecture named cultural contexts that shape childcare, including whether childcare is a ==public or private responsibility==. Country A treats it as a public good; Country B treats it as a private family matter.","n":[["k","Who is responsible? Society = ==public==. Each family = ==private==."],["x","Different from education-vs-welfare framing (what childcare is FOR)."]],"v":"ccDecide","vp":"f"},{"id":"s4q007","s":4,"t":"L","q":"In one country, childcare is run by the Ministry of Education and framed as early learning for all children. In another, it is run by social services and offered mainly to families in need. Lecture would describe this as a difference in…","a":"framing of childcare as early education versus child welfare","d":["framing of childcare as a public versus a private responsibility","economic circumstances that limit which families can pay for care","process-based versus structure-based approaches to measuring quality","cultural goal of building secure attachment with nonparental caregivers","family-level versus individual-level decisions about childcare use"],"e":"Lecture contrasted childcare framed as an ==early education system== (for everyone’s learning) with childcare framed as a ==child welfare system== (support for families in need). Both countries here provide care publicly, so the difference is purpose, not responsibility.","n":[["k","Education system (learning for all) vs ==welfare system== (help for those in need)."],["x","Both are public here, so it isn’t public vs private."]],"v":"ccDecide","vp":"f"},{"id":"s4q008","s":4,"t":"L","q":"Lecture said cultural ideas about childcare operate at two levels. Which pair is correct?","a":"Within families and within societies/governments","d":["Within centres and within home daycares","Within mothers and within fathers","Within early infancy and within preschool","Within cities and within rural areas","Within process quality and within structural quality"],"e":"Cultural “goals” and conceptions of childcare work ==within families== (what parents want care to do) and ==within societies/governments== (what systems they fund and how).","n":[["k","Culture shapes childcare ==within families== AND ==within societies/governments==."]],"v":"ccDecide","vp":"f"},{"id":"s4q009","s":4,"t":"L","q":"A family chooses a relative’s care over a centre because they want their toddler to learn the family’s heritage language and values. This decision mainly reflects…","a":"cultural goals of childcare","d":["economic circumstances","structural quality","childcare as a public responsibility","the number of childcare arrangements","childcare as a child welfare system"],"e":"Wanting care to pass on language and values is about the ==cultural goals== a family holds for childcare, one of the cultural factors named in lecture.","n":[["k","What should care achieve? → ==cultural goals==."],["x","Not about cost, so not economic circumstances."]]},{"id":"s4q010","s":4,"t":"L","q":"Lecture split childcare quality into two kinds. What is process quality?","a":"The quality of interactions between a child and a care provider","d":["Features of the setting that indirectly affect the child, like ratios","How efficiently a centre runs its daily schedule","The steps parents follow when choosing a childcare","How well a centre meets licensing paperwork","The training and credentials of the care providers"],"e":"==Process quality== focuses on the child’s actual experiences with caregivers: sensitive and responsive caregiving, individual attention, scaffolding, and age-appropriate activities. ==Structural quality== covers setting features (ratios, group size, training, turnover) thought to affect the child indirectly.","n":[["k","==Process== = what happens between caregiver and child."],["x","Ratios, training, group size, turnover = ==structural==."],["m","Process = the play-by-play. Structure = the stage."]],"v":"quality","vp":"f"},{"id":"s4q011","s":4,"t":"L","q":"Which of these is an indicator of STRUCTURAL quality?","a":["Caregiver–child ratio","Staff turnover","Group size","Caregiver training and experience"],"d":["Scaffolding of children’s learning","Sensitive, responsive caregiving","Individual attention to each child","Age-appropriate activities and organization","Warm, responsive talk during play"],"e":"Lecture listed ==structural quality== as caregiver training/experience, group size, caregiver–child ratios/crowding, and staff turnover. Interaction features (responsiveness, scaffolding, individual attention, age-appropriate activities) are ==process quality==.","n":[["k","Structural = ==training · group size · ratios · turnover==."],["m","Count it or certify it? Structural. Watch it happen? Process."]],"v":"quality","vp":"f"},{"id":"s4q012","s":4,"t":"L","q":"Which of these is an indicator of PROCESS quality?","a":["Scaffolding children’s learning","Individual attention to each child","Sensitive and responsive caregiving"],"d":["Small group sizes","Low staff turnover","Caregivers with early childhood degrees","Few children per caregiver","Spacious, uncrowded rooms","Strict licensing inspections"],"e":"==Process quality== is about the child–caregiver interactions themselves: sensitive responsive care, individual attention, scaffolding, and age-appropriate activities and organization.","n":[["k","Process = ==responsive · individual attention · scaffolding · age-appropriate==."],["x","Degrees, ratios, turnover, group size are structural."]],"v":"quality","vp":"f"},{"id":"s4q013","s":4,"t":"L","q":"Why did lecture describe structural quality as affecting children “indirectly”?","a":"It sets conditions that make good caregiver–child interactions more or less likely","d":["Its features affect parents first, who then pass the effects along to their children at home","Its effects only appear years later, once children have reached school age","It is measured through parent report rather than by directly observing children in care","Its links with child outcomes disappear once family SES is statistically controlled","Children are rarely aware of how much training their caregivers have received"],"e":"Ratios, group size, training, and turnover don’t touch the child directly. They set the conditions: a caregiver with fewer children and more training can give more ==sensitive, individual attention== (process quality).","n":[["k","Structure → enables → ==process== → child."],["m","Structure is the soil; process is what grows."]],"v":"quality","vp":"f"},{"id":"s4q014","s":4,"t":"L","q":"Before enrolling her son, Priya checks the centre’s licence, the ratio of staff to children, and the staff’s diplomas. Based on lecture, what is she missing?","a":"Watching how caregivers actually respond to the children","d":["Checking how many children are placed in each group","Asking how long staff usually stay at the centre","Comparing the centre’s fees with other nearby centres","Asking whether the centre meets provincial regulations","Reviewing how many years of experience caregivers have"],"e":"Priya is assessing only ==structural quality==. Group size, turnover, and experience are also structural. To judge ==process quality==, she needs to observe the caregiver–child interactions: responsiveness, individual attention, and scaffolding.","n":[["k","Licence + ratio + diplomas = structural only."],["x","Group size, turnover, experience are ALSO structural."],["c","Process quality needs observation."]]},{"id":"s4q015","s":4,"t":"L","q":"A centre has a great ratio and well-trained staff, but caregivers spend most of the day chatting with each other and rarely respond to the children. How would lecture classify this centre?","a":"High structural quality but low process quality","d":["High process quality but low structural quality","High quality overall, because structural features matter most","Low quality overall, because ratios are only part of structure","Medium structural quality and medium process quality","Impossible to classify without measuring child outcomes"],"e":"Ratios and training are ==structural== and look good here. But the child’s actual experience, the caregiver–child interaction, is poor, so ==process quality== is low. Structure makes good process possible but doesn’t guarantee it.","n":[["k","Good structure ≠ guaranteed good process."],["c","Practice exam: Raj’s caregivers “talk amongst themselves” = low process quality."]],"v":"quality","vp":"f"},{"id":"s4q016","s":4,"t":"L","q":"A centre loses half its staff every year, so toddlers keep meeting new caregivers. Which quality indicator is this, and why might it matter?","a":"Staff turnover (structural); it disrupts stable caregiver–child relationships","d":["Staff turnover (process); it is a direct measure of caregiver responsiveness","Group size (structural); new caregivers mean more children per group","Caregiver training (structural); new staff always have less training","Scaffolding (process); new staff can’t scaffold children’s learning","Crowding (structural); turnover means rooms become overcrowded"],"e":"==Staff turnover== is a structural feature. It matters indirectly because constant change makes it harder for caregivers to know each child and respond sensitively, which is process quality.","n":[["k","Turnover = ==structural==, but it undermines stable, sensitive relationships."]],"v":"quality","vp":"f"},{"id":"s4q017","s":4,"t":"L","q":"Lecture listed many factors to consider when asking how childcare affects children. Which was NOT on the list?","a":"The parents’ own childcare history","d":["Quality of care","Type of care","Age of the child","Length of time in care","Number of different childcare arrangements","Family background/SES","Characteristics of the child"],"e":"Lecture’s list: ==quality of care, type of care, age of child, length of time in care, number of childcare arrangements, family background/SES, and characteristics of the child==. Parents’ own childcare history wasn’t on it.","n":[["k","Quality · type · age · time · # arrangements · SES · child traits."],["m","“Q-TAT-N-SC”: Quality, Type, Age, Time, Number, SES, Child."]]},{"id":"s4q018","s":4,"t":"L","q":"Lecture attached three caveats to childcare-effects research. Which set is correct?","a":"All correlational, mostly North American, and much smaller effects than parenting","d":["Mostly experimental, mostly European, and larger effects than those linked to parenting","All correlational, mostly European, and effects about equal in size to parenting effects","Mostly experimental, mostly North American, and effects too small to measure reliably","Mostly qualitative, global in scope, and rarely measuring any child outcomes","All longitudinal, mostly North American, and larger than SES effects"],"e":"Lecture flagged: ==all correlational==, ==mostly within North America==, and ==much smaller relationships than outcomes linked to parenting==.","n":[["k","Correlational · North American · smaller than parenting."],["c","Same caution as family structure research: selection matters."]],"v":"ccEffects","vp":"f"},{"id":"s4q019","s":4,"t":"L","q":"A news headline reads: “Daycare makes kids aggressive!” Based on lecture, what is the strongest critique?","a":"It’s correlational: families using more care may differ in ways that explain the link","d":["Childcare research has found no link at all between childcare and later behaviour problems","Aggression in childcare studies is only ever measured through parents’ own reports","Childcare effects on behaviour disappear entirely by the time children turn 2 years old","Most childcare studies only include high-SES families living in Western Europe","Randomized experiments have shown that childcare actually reduces aggression in children"],"e":"Families can’t be randomly assigned to childcare, so ==all childcare research is correlational==. Families who use earlier, longer, or centre-based care may differ in income, stress, or parenting. Lecture also noted the links are mixed and much smaller than parenting effects.","n":[["k","No random assignment → ==correlation ≠ causation==."],["x","There IS some link with behaviour problems, so “no link at all” is wrong."]]},{"id":"s4q020","s":4,"t":"L","q":"Compared with the links between parenting and child outcomes, lecture said the links between childcare and child outcomes are…","a":"much smaller","d":["about the same size","much larger","larger for attachment but smaller for cognition","impossible to compare because they use different outcomes","larger in Canada than in the US"],"e":"Lecture stressed that childcare–outcome relationships are ==much smaller than outcomes linked to parenting==. What happens at home matters more.","n":[["k","Parenting effects ≫ childcare effects."],["c","Bernier: parenting moderates childcare–attachment links."]]},{"id":"s4q021","s":4,"t":"L","q":"What did the large US-based NICHD study conclude about childcare and infant–mother attachment?","a":"No overall effect, though poor care plus poor parenting might add risk","d":["Childcare overall increased insecure attachment, especially for infants in centre care","Childcare overall increased secure attachment, especially for infants in centre care","No overall effect, and no combination of care and parenting quality showed any risk","More than 20 hours a week of care reliably led to avoidant attachment by 15 months","Home-based care increased disorganized attachment compared with centre-based care"],"e":"The ==NICHD ECCRN (1997)== found ==no overall impact== of childcare on attachment. But there was some suggestion that ==poor-quality childcare paired with poor-quality parenting== (insensitive mothering) carried risk: a “dual risk.”","n":[["k","NICHD: no main effect on attachment."],["x","Risk only hinted when poor care + poor parenting combine."],["m","Dual risk = bad + bad."]],"v":"nichd","vp":"f"},{"id":"s4q022","s":4,"t":"L","q":"Look at this schematic of the NICHD attachment results by type of care. What is the main takeaway?","a":"Attachment classifications look broadly similar across all four types of care","d":["Centre care has far fewer secure children than exclusive mother care does","Mother care has the highest rate of disorganized attachment of any care type","In-home care with a nanny has a clearly higher rate of secure attachment","Family care centres show the highest rate of insecure-avoidant attachment","Secure attachment drops steadily from mother care through to centre care"],"e":"Across care types, the distributions of secure, avoidant, resistant, and disorganized attachment were broadly similar. That is the visual basis for “==no overall impact of childcare on attachment==.”","n":[["k","Same-looking bars across care types = ==no overall effect==."]],"v":"nichd","vp":"q"},{"id":"s4q023","s":4,"t":"L","q":"Which infant does the NICHD research suggest is MOST at risk for insecure attachment?","a":"Ezra: long hours in low-quality care, with an often insensitive mother","d":["Lia: long hours in high-quality care, with a very sensitive and responsive mother","Noor: long hours in low-quality care, with a very sensitive and responsive mother","Sami: no childcare at all, with a sensitive mother at home","Theo: part-time high-quality care, with a mother who is often insensitive","June: full-time centre care of good quality, with a warm, involved father at home"],"e":"NICHD found no overall childcare effect, but ==poor-quality care plus poor-quality (insensitive) parenting== carried some risk. Ezra has both risks at once.","n":[["k","==Dual risk==: low-quality care × insensitive parenting."],["x","Low-quality care with a sensitive mother wasn’t the risky combo."]],"v":"dualRisk","vp":"f"},{"id":"s4q024","s":4,"t":"LR","q":"Where and in what policy context did Bernier et al. (2024) study childcare and mother–child attachment?","a":"Quebec, where childcare is government-subsidized and low-cost","d":["Across the US, at the original NICHD study’s network sites","Ontario, where most families pay full private childcare fees","Norway, where all centres are publicly run by municipalities","Israel, where many infants were in low-quality centre care","Australia, where government-regulated care is widely used"],"e":"Bernier et al. (2024) studied families in ==Quebec==, which has a ==low-cost, government-subsidized universal childcare== program. That context differs sharply from the US setting of the NICHD study.","n":[["k","Bernier = ==Quebec==, subsidized universal childcare."],["c","NICHD = US, 1990s. Bernier asks: does the answer change in a new context?"]],"v":"bernierDesign","vp":"f","rd":"Bernier et al. (2024)"},{"id":"s4q025","s":4,"t":"LR","q":"Which two aspects of maternal behaviour did Bernier et al. (2024) test as moderators of childcare–attachment links?","a":"Maternal sensitivity and maternal autonomy support","d":["Maternal warmth and maternal behavioural control","Maternal depression and maternal parenting stress","Maternal education and total family income","Maternal attachment style and maternal temperament","Maternal work hours and maternal job satisfaction"],"e":"Bernier et al. examined ==maternal sensitivity== (appropriate responses to infant cues) and ==maternal autonomy support== (guidance matched to the child’s needs that encourages choice and self-initiation). Both are linked to secure attachment.","n":[["k","Moderators = ==sensitivity== + ==autonomy support==."],["c","Autonomy support = the 3rd parenting dimension from Oct 7."]],"v":"bernierDesign","vp":"f","rd":"Bernier et al. (2024)"},{"id":"s4q026","s":4,"t":"LR","q":"What was Bernier et al.’s (2024) MAIN-EFFECT finding?","a":"No overall effect of childcare participation on mother–child attachment","d":["Childcare overall predicted less secure attachment at 25 months","Childcare overall predicted more secure attachment at both ages","Only more than 20 hours a week predicted insecure attachment","Childcare predicted secure attachment for boys but not girls","Childcare predicted lower maternal sensitivity, which lowered security"],"e":"Across every way they measured childcare (any vs none, 20-hour threshold, hours per week) and both ages, there was ==no main effect of childcare on attachment security==, replicating NICHD in a different context.","n":[["k","Bernier main effect = ==none==."],["c","Matches NICHD 1997."]],"v":"bernier","vp":"f","rd":"Bernier et al. (2024)"},{"id":"s4q027","s":4,"t":"LR","q":"In Bernier et al. (2024), which children had the LEAST secure attachment to their mothers?","a":"Children of less sensitive or less autonomy-supportive mothers who did NOT attend childcare","d":["Children of less sensitive mothers who attended childcare full-time from early infancy","Children of highly sensitive mothers who stayed home with them instead of using childcare","Children of highly autonomy-supportive mothers who attended childcare for long hours","Children who started childcare before 12 months, regardless of their mothers’ parenting","Children in childcare more than 20 hours a week, regardless of their mothers’ parenting"],"e":"The interaction showed that among children of ==less sensitive or less autonomy-supportive mothers==, those ==not attending childcare== were less securely attached. Attending childcare brought their security up to the level of their peers.","n":[["k","Lowest security = less-ideal parenting + ==NO childcare==."],["m","Childcare acted like a safety net."],["x","Opposite of the feared “childcare harms attachment.”"]],"v":"bernier","vp":"q","rd":"Bernier et al. (2024)"},{"id":"s4q028","s":4,"t":"LR","q":"Bernier et al.’s (2024) interaction suggests childcare may be…","a":"protective for attachment when parenting at home is less ideal","d":["harmful for attachment when parenting at home is less than ideal","harmful for every child, but only beyond 20 hours of care per week","protective for attachment only when mothers are highly sensitive","irrelevant to attachment for every group of children in the study","protective only for children who are cared for by relatives at home"],"e":"Children with less sensitive or less autonomy-supportive mothers were more securely attached if they attended childcare. Lecture framed this as ==childcare as protective for attachment with less ideal parenting==.","n":[["k","Childcare = possible ==protective factor== for at-risk dyads."],["c","Compare NICHD’s dual risk: poor care + poor parenting."]],"v":"bernier","vp":"f","rd":"Bernier et al. (2024)"},{"id":"s4q029","s":4,"t":"LR","q":"Lecture raised a key question about generalizing Bernier et al.’s (2024) protective effect. What was it?","a":"Quebec care is generally good quality; would the effect hold for lower-quality care?","d":["Quebec families are mostly low income; would it also hold for wealthier families?","The study used the Strange Situation; would it hold with home-based observation measures?","Only fathers were studied; would the same protective effect hold for mothers as well?","All children were in centres; would it hold for nanny or relative care too?","The study was a true experiment; would it hold in correlational designs?"],"e":"Lecture noted that ==in the Quebec system, childcare quality is generally good==. The protective effect might not appear, or could reverse, in ==lower-quality care==. Bernier et al. say the same in their discussion.","n":[["k","Good-quality context → can’t assume the same for ==low-quality care==."],["x","Bernier used the Attachment Q-Sort, not the Strange Situation."]],"rd":"Bernier et al. (2024)"},{"id":"s4q030","s":4,"t":"L","q":"Overall, what does lecture conclude about childcare and parent–child attachment?","a":"There is no overall link, though effects may depend on parenting at home","d":["Childcare reliably weakens attachment, especially in centres","Childcare reliably strengthens attachment for all children","Childcare only harms attachment when it starts before 12 months","The link depends mainly on the type of care, not on parenting","Attachment is harmed when children spend more than 10 hours a week in care"],"e":"Lecture’s summary: on attachment, ==no overall link==. NICHD hinted at risk with poor care plus poor parenting; Bernier found childcare protective when parenting was less ideal. Either way, ==parenting at home== shapes the link.","n":[["k","Attachment: ==no overall link==; parenting moderates."],["c","Practice Q: “quality of parenting at home” matters most."]],"v":"ccEffects","vp":"f"},{"id":"s4q031","s":4,"t":"L","q":"Lecture summarized research on childcare and behaviour problems. Which pattern did it describe?","a":"Mixed, but more problems with low-quality and centre care, especially long hours and early starts","d":["Clear and consistent evidence that any amount of childcare causes later behaviour problems in children","Fewer behaviour problems in centre-based care than in home-based care, because of daily peer practice","More behaviour problems only among children who first start childcare after their third birthday","No link with the quality of care, but a strong and consistent link with family SES","More behaviour problems in in-home care, because children have fewer peers to learn from"],"e":"Results are ==mixed==, but problems are linked to ==low-quality care== and ==centre-based care==, particularly with ==high hours== and an ==early start (< 1 year)==.","n":[["k","Behaviour risk ↑ with ==low quality · centre-based · many hours · start < 1 yr==."],["m","Centre + early + long = watch behaviour."]],"v":"ccEffects","vp":"f"},{"id":"s4q032","s":4,"t":"L","q":"Which child does lecture’s research summary suggest is at GREATEST risk for behaviour problems?","a":"Kai: full-time in a low-quality centre since 7 months","d":["Ivy: part-time in a high-quality home daycare since age 3","Owen: cared for by his grandmother at home since 7 months","Rosa: part-time in a high-quality centre since age 2","Ben: no childcare; at home with a parent","Lea: full-time with a nanny at home since age 2"],"e":"The risk factors stack up for Kai: ==centre-based==, ==high hours==, ==early start (< 1 year)==, and ==low quality==.","n":[["k","Stacked risks: centre + full-time + < 1 yr + low quality."]]},{"id":"s4q033","s":4,"t":"L","q":"Two 4-year-olds attend the same high-quality centre for the same hours. Mila started at 8 months; Ana started at 3 years. Based on lecture, which prediction about behaviour problems is most consistent with the research?","a":"Mila may show somewhat more behaviour problems, because starting before 1 year adds risk","d":["Ana may show more behaviour problems, because starting later makes the transition harder","They should be identical, because only quality predicts behaviour problems","Mila should show fewer problems, because early care builds social skills","Neither will show behaviour problems, because the centre is high quality","Ana should show more problems, because she has spent less time with peers"],"e":"Lecture noted more behaviour problems with centre-based care, ==particularly when childcare begins early (< 1 year)==. High quality lowers risk but the early-start link was still flagged. Remember these links are small and correlational.","n":[["k","Starting centre care < 1 year → more behaviour-problem risk."],["x","Small, correlational effects, not destiny."]]},{"id":"s4q034","s":4,"t":"L","q":"Lecture summarized research on childcare and cognitive/language skills. Which pattern fits?","a":"Mixed, but gains for high-quality care, some for centre care, and more for low-SES kids","d":["Consistent harm to language skills for children who attend centre-based care full-time","Advantages only for high-SES families who use home-based or relative care arrangements","No link at all between cognitive outcomes and quality, type of care, or family SES","Advantages only for children who spend more than 40 hours a week in childcare settings","Advantages mainly for children cared for by relatives, because of shared home language"],"e":"Cognitive and language findings are ==mixed==, but advantages appear especially for ==high-quality care==, with some evidence of more advantage for ==centre-based care== and for children from ==low-SES backgrounds==.","n":[["k","Cognition ↑ with ==high quality · centre-based · low-SES families==."],["x","Centre care: more behaviour risk BUT more cognitive benefit."]],"v":"ccEffects","vp":"f"},{"id":"s4q035","s":4,"t":"L","q":"Geoffroy et al. (2010), shown in lecture, measured school readiness, vocabulary, reading, and math at ages 6–7. What was the key message for families of different SES?","a":"Benefits were bigger for children from low-SES families, narrowing the gap","d":["Benefits were biggest for children from high-SES families, widening the gap","Childcare lowered low-SES children’s reading scores but not their math scores","Childcare had identical effects for children from every SES group","Only children cared for by relatives showed any cognitive benefits","Cognitive benefits of childcare had fully disappeared by ages 6–7"],"e":"In Geoffroy et al. (2010), children from ==low-SES families== who attended childcare did better on school readiness and achievement than low-SES peers who didn’t, ==narrowing the gap== with higher-SES children. Lecture summarized this as “more benefits for children from low SES backgrounds.”","n":[["k","Childcare helps low-SES kids most → ==closes the gap==."],["m","Compensation: care adds what
