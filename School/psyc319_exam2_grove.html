:root{--serif:"Fraunces","Iowan Old Style",Georgia,serif; --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--text);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;
  background:radial-gradient(1100px 500px at 90% -12%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 62%),radial-gradient(900px 600px at -12% 28%,color-mix(in srgb,var(--teal) 10%,transparent),transparent 62%),radial-gradient(800px 500px at 55% 112%,color-mix(in srgb,var(--lit) 9%,transparent),transparent 60%),var(--pattern) repeat,var(--bg);
  background-size:auto,auto,auto,300px 300px,auto;transition:background-color .4s,color .4s}
.wrap{max-width:720px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(44px,env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.125em}
.i.fill{fill:currentColor;stroke:none}
.c-sprout{color:var(--sprout)}.c-bloom{color:var(--bloom)}.c-good{color:var(--good)}.c-bad{color:var(--bad)}.c-acc{color:var(--accent)}
mark{background:var(--hlbg);color:var(--hltx);text-shadow:var(--hlglow);border-radius:3px;padding:0 .12em;font-weight:600;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.t0{background:color-mix(in srgb,var(--faint) 60%,transparent)}.dot.t1{background:var(--sprout)}.dot.t2{background:var(--bloom);box-shadow:0 0 0 3px color-mix(in srgb,var(--bloom) 25%,transparent)}
.dot2{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;margin-right:6px;vertical-align:-1px}
.bar{height:6px;border-radius:6px;background:var(--tint2);overflow:hidden;display:flex}
.bar span{display:block;height:100%;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar .b2{background:linear-gradient(90deg,var(--bloom),color-mix(in srgb,var(--bloom) 70%,var(--lit)))}.bar .b1{background:linear-gradient(90deg,var(--sprout),color-mix(in srgb,var(--sprout) 70%,var(--teal)))}
.muted{color:var(--muted)} .fine{color:var(--faint);font-size:.76rem;margin:10px 2px 0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.enter>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:50ms}.enter>*:nth-child(3){animation-delay:100ms}.enter>*:nth-child(4){animation-delay:150ms}.enter>*:nth-child(5){animation-delay:200ms}.enter>*:nth-child(n+6){animation-delay:250ms}

/* ---------- Header art ---------- */
.art{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:14px}
.art svg{display:block;width:100%;height:auto}
.art .sun,.art .birds{display:none}[data-theme="light"] .art .sun,[data-theme="light"] .art .birds{display:inline}[data-theme="light"] .art .moon,[data-theme="light"] .art .ffl{display:none}
@keyframes blink{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(6px,-5px)}100%{transform:translate(0,0)}}
.ffl circle{fill:#F4F1A8;filter:drop-shadow(0 0 3px #F4F1A8);animation:blink 3s ease-in-out infinite,drift 7s ease-in-out infinite;transform-box:fill-box}
@keyframes glide{from{transform:translateX(-60px)}to{transform:translateX(760px)}}
.birds g{animation:glide 26s linear infinite}
.birds path{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.art .tree{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
.art .ray{stroke:var(--lit);stroke-width:2;stroke-linecap:round;opacity:.5}
.toolbar{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.hero{padding:2px 2px 0}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:999px;padding:3px 10px}
.hero h1{font:500 clamp(2rem,6.6vw,2.9rem)/1.02 var(--serif);margin:10px 0 8px;letter-spacing:-.01em}
.hero h1 em,.glowtx{font-style:italic;font-weight:600;background:linear-gradient(95deg,var(--sprout),var(--accent) 35%,var(--teal) 65%,var(--bloom));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px var(--glow))}
.lede{color:var(--muted);margin:0 0 12px;font-size:.94rem}
.examchip{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;list-style:none;padding:0;margin:0 0 12px;color:var(--muted);font-size:.82rem}
.legend li{display:flex;align-items:center;gap:7px}
.total{display:flex;align-items:center;gap:12px;font-size:.84rem;color:var(--muted)}
.total .bar{flex:1}.total b{color:var(--text);font-weight:700}

/* ---------- Groves ---------- */
.unit-h{display:flex;align-items:center;gap:8px;margin:20px 2px 8px;font:600 .78rem/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.unit-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.groves{display:grid;gap:10px}
.grove{position:relative;display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px 10px 10px;cursor:pointer;overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s;box-shadow:var(--shadow)}
.grove::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(var(--sc),color-mix(in srgb,var(--sc) 40%,transparent))}
.grove:hover{border-color:var(--sc);transform:translateY(-2px);box-shadow:0 14px 30px -18px color-mix(in srgb,var(--sc) 60%,transparent)}
.grove>svg{width:100%;height:auto;display:block}
.grove h2{font:600 1.03rem/1.25 var(--sans);margin:0 0 3px}
.grove .sub{margin:0;color:var(--muted);font-size:.78rem;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.grove .sub span{display:inline-flex;align-items:center;gap:5px}
.grove .cnt{display:flex;align-items:center;gap:12px;margin:8px 0 6px;font-size:.8rem;color:var(--muted)}
.grove .cnt span{display:inline-flex;align-items:center;gap:5px}
@media (max-width:540px){.grove{grid-template-columns:1fr;gap:4px;padding:8px 12px 12px}.grove>svg{max-height:86px}}
.bud{fill:var(--sc);fill-opacity:.5}.leaf{fill:var(--sprout)}.pet{fill:var(--sc)}.ctr{fill:var(--lit)}
.canopy{fill:var(--sc);fill-opacity:.07}.trunk{stroke:var(--bark);stroke-width:5;stroke-linecap:round;fill:none}.trunk2{stroke:var(--bark);stroke-width:2.6;stroke-linecap:round;fill:none}
.soil{fill:var(--ground)}
.ring{fill:none;stroke:var(--text);stroke-width:1.3}
@keyframes grow{0%{transform:scale(.2) rotate(-30deg);opacity:.2}60%{transform:scale(1.8) rotate(8deg);opacity:1}100%{transform:scale(1)}}
.grow{transform-box:fill-box;transform-origin:center;animation:grow .9s cubic-bezier(.2,.7,.3,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.pop{animation:pop .45s ease-out}

/* ---------- Modes ---------- */
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.mode{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;transition:border-color .2s,transform .2s;box-shadow:var(--shadow)}
.mode .mi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.15rem;flex:none;color:var(--mc);background:color-mix(in srgb,var(--mc) 15%,transparent);border:1px solid color-mix(in srgb,var(--mc) 30%,transparent)}
.mode strong{display:block;font-weight:600;font-size:.93rem}
.mode span.d{display:block;color:var(--muted);font-size:.78rem;line-height:1.3}
.mode:hover:not(:disabled){border-color:var(--mc);transform:translateY(-2px)}
.mode:disabled{opacity:.45;cursor:default}
@media (max-width:540px){.modes{grid-template-columns:1fr}}
.foot{margin-top:24px;color:var(--faint);font-size:.76rem;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.76rem}
.linkbtn.warn{color:var(--bad)}

/* ---------- Quiz ---------- */
.top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--tint);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.82rem}
.back:hover{border-color:var(--accent)}
.stats{margin-left:auto;display:flex;gap:6px;font-size:.8rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:999px;padding:4px 10px;color:var(--muted);background:var(--tint);font-size:.8rem}
.pill.hot{color:var(--lit);border-color:color-mix(in srgb,var(--lit) 50%,transparent);background:color-mix(in srgb,var(--lit) 10%,transparent)}
.pill.l1{color:var(--sprout)}.pill.l2{color:var(--bloom)}.pill.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.tb{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);cursor:pointer;color:var(--muted);font-size:1rem;transition:color .2s,border-color .2s,transform .2s}
.tb:hover{transform:rotate(-8deg)}
.tb.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.where{font-size:.8rem;color:var(--muted);margin:10px 0 2px;display:flex;justify-content:space-between;gap:10px}
.where span:last-child{white-space:nowrap}
.mini svg{width:100%;height:auto;max-height:84px;display:block}
.qbar{margin:6px 0 16px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 14px;box-shadow:var(--shadow)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;color:var(--muted);background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.tag.read{color:var(--vio);border-color:color-mix(in srgb,var(--vio) 45%,transparent)}
.tag.sec{color:var(--sc);border-color:color-mix(in srgb,var(--sc) 45%,transparent)}
.tag.fig{color:var(--lit);border-color:color-mix(in srgb,var(--lit) 45%,transparent)}
.tag.src{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.stem{font:500 1.06rem/1.48 var(--sans);margin:0 0 14px}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opts li{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.opts li:nth-child(2){animation-delay:45ms}.opts li:nth-child(3){animation-delay:90ms}.opts li:nth-child(4){animation-delay:135ms}.opts li:nth-child(5){animation-delay:180ms}
.opt{position:relative;width:100%;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:13px;padding:10px 12px;cursor:pointer;font-size:.94rem;line-height:1.42;min-height:46px;transition:border-color .15s,background-color .2s,opacity .2s,transform .15s}
.opt:hover:not([disabled]){border-color:var(--accent);transform:translateX(3px)}
.key{width:24px;height:24px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;font-size:.74rem;font-weight:700;color:var(--muted);background:var(--tint)}
.opt.sel{border-color:var(--mas);background:color-mix(in srgb,var(--mas) 12%,var(--panel2))}
.opt.sel .key{background:var(--mas);border-color:var(--mas);color:var(--ink)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel2))}
.opt.ok .key{background:var(--good);border-color:var(--good);color:var(--ink)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--panel2))}
.opt.bad .key{background:var(--bad);border-color:var(--bad);color:var(--ink)}
.opt.dim{opacity:.45}
.opt[disabled]{cursor:default}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.shake{animation:shake .45s ease}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
.opt.ok.glow{animation:glow .9s ease-out}
.fig .dg{max-width:480px;margin:0 auto}.fig{margin:0 0 14px;background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:10px 10px 6px}
.fig figcaption{font-size:.74rem;color:var(--faint);margin-top:4px;text-align:center}
.fb{margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:12px 14px;animation:rise .38s cubic-bezier(.2,.8,.2,1)}
.fb.good{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}.fb.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.fb .fig{background:var(--tint)}
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px;font-weight:700;font-size:1rem}
.verdict .i{font-size:1.25rem}
.fb.good .verdict>.i{color:var(--good)}.fb.bad .verdict>.i{color:var(--bad)}
.verdict small{font-weight:500;color:var(--muted);font-size:.8rem;display:inline-flex;align-items:center;gap:5px}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.note{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;animation:rise .38s both}
.note:nth-child(2){animation-delay:70ms}.note:nth-child(3){animation-delay:140ms}.note:nth-child(4){animation-delay:210ms}
.nic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.92rem}
.note.k .nic{background:color-mix(in srgb,var(--lit) 16%,transparent);color:var(--lit)}
.note.x .nic{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.note.c .nic{background:color-mix(in srgb,var(--mas) 16%,transparent);color:var(--mas)}
.note.m .nic{background:color-mix(in srgb,var(--vio) 17%,transparent);color:var(--vio)}
.note.n .nic{background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal)}
.note .lab{display:block;font-size:.7rem;color:var(--faint);line-height:1.2;margin-top:1px}
.note .tx{display:block;font-size:.9rem;line-height:1.42}
.po{margin:12px 0 0;padding:10px 0 0;border-top:1px dashed var(--line2);list-style:none;display:grid;gap:7px}
.po-h{font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:0}
.po li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:.85rem;line-height:1.4;padding:6px 8px;border-radius:10px;background:var(--tint)}
.po li.ok{background:color-mix(in srgb,var(--good) 12%,transparent)}.po li.me{outline:1px solid var(--mas)}
.po li .i{margin-top:2px}.po li.ok .i{color:var(--good)}.po li.no .i{color:var(--bad)}
.po li b{font-weight:600}
details.why{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.why summary{cursor:pointer;font-size:.8rem;color:var(--muted);list-style:none;display:inline-flex;align-items:center;gap:5px}
details.why summary::-webkit-details-marker{display:none}
details.why[open] summary .i{transform:rotate(180deg)}
details.why p{margin:6px 0 0;font-size:.87rem;color:var(--muted);line-height:1.5}
.actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.primary{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onacc);border:0;border-radius:999px;padding:9px 20px;font-weight:700;cursor:pointer;font-size:.92rem;box-shadow:0 8px 20px -10px var(--glow);transition:transform .15s,filter .15s}
.primary:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06)}
.primary:disabled{opacity:.35;cursor:default}
.secondary{display:inline-flex;align-items:center;gap:6px;background:var(--tint);border:1px solid var(--line2);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:.9rem}
.secondary:hover{border-color:var(--accent)}
.sm{padding:6px 12px;font-size:.8rem}
.hint{color:var(--faint);font-size:.74rem;margin-top:16px}
@media (hover:none){.hint{display:none}}
@media (max-width:480px){.qcard{padding:13px 12px 12px}.fig{padding:6px 4px 4px;margin-left:-4px;margin-right:-4px}.fb{padding:11px}.card{padding:10px}.stem{font-size:1.02rem}}

/* ---------- Screens ---------- */
.screen h1,.lab-h{font:500 clamp(1.8rem,6vw,2.4rem)/1.1 var(--serif);margin:10px 0 8px}
.big{font-size:2.6rem;margin:8px 0 0;color:var(--bloom)}
.toggle{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px;padding:0;border:0}
.toggle legend{color:var(--muted);font-size:.84rem;margin-bottom:6px;padding:0}
.toggle button{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line2);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.86rem}
.toggle button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.score{font:500 clamp(3rem,13vw,4.6rem)/1 var(--serif);margin:6px 0 2px}
.score small{font-size:.4em;color:var(--muted)}
.breakdown{list-style:none;padding:0;margin:14px 0 6px;display:grid;gap:9px}
.breakdown li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.86rem}
.breakdown li .bar{grid-column:1 / -1}
.breakdown li span:nth-child(2){color:var(--muted)}
.review-h{font:600 .95rem/1.3 var(--sans);margin:22px 0 6px}
details.rv{border-bottom:1px solid var(--line);padding:10px 0}
details.rv>summary{cursor:pointer;display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;list-style:none;font-size:.9rem}
details.rv>summary::-webkit-details-marker{display:none}
details.rv.good>summary .i{color:var(--good)}details.rv.miss>summary .i{color:var(--bad)}
details.rv .body{padding:8px 0 2px 28px;font-size:.86rem}
details.rv .ans{margin:0 0 8px;display:grid;gap:4px}
details.rv .ans span{color:var(--muted)}

/* ---------- Objectives ---------- */
.objs{display:grid;gap:8px}
.obj{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.obj p{margin:0;font-size:.9rem;line-height:1.38}
.obj .src{font-size:.74rem;color:var(--faint);display:flex;gap:6px;align-items:center;margin-top:3px}
.obj .bar{grid-column:1 / -1}
.obj .n{font-size:.76rem;color:var(--muted);white-space:nowrap}

/* ---------- Flashcards ---------- */
.flip{perspective:1200px;margin:6px 0 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip-in{position:relative;min-height:230px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.8,.3,1)}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px 20px;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face .term{font:600 clamp(1.5rem,6vw,2.1rem)/1.15 var(--serif)}
.face .def{font-size:1.02rem;line-height:1.5;max-width:520px}
.face .hook{margin-top:12px;font-size:.86rem;color:var(--vio);display:inline-flex;gap:6px;align-items:center}
.face .tap{position:absolute;bottom:10px;font-size:.72rem;color:var(--faint)}
.face .corner{position:absolute;top:12px;left:14px}
.face svg.deco{position:absolute;right:-18px;bottom:-18px;width:110px;opacity:.16}
.fcbar{display:flex;gap:8px;justify-content:center}

/* ---------- Match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{display:grid;gap:8px;align-content:start}
.mtile{background:var(--card);border:1px solid var(--line2);border-radius:13px;padding:10px 11px;text-align:left;font-size:.86rem;line-height:1.35;cursor:pointer;min-height:54px;transition:all .2s;box-shadow:var(--shadow)}
.mtile.study{font-weight:600}
.mtile:hover{border-color:var(--accent)}
.mtile.sel{border-color:var(--mas);background:color-mix(in srgb,var(--mas) 14%,var(--panel))}
.mtile.done{opacity:0;transform:scale(.9);pointer-events:none}
.mtile.okk{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--panel))}
.mtime{font:600 1.6rem/1 var(--serif);color:var(--accent)}

/* ---------- Lab ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:4px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--tint);border:1px solid var(--line2);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:.84rem;color:var(--muted)}
.tab.on{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent)}
.labbody{display:grid;gap:10px;animation:rise .38s both}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:12px;box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--tint);border-radius:999px;padding:6px 12px;font-size:.82rem;cursor:pointer;color:var(--muted);transition:all .15s}
.chip.on{color:var(--ink);font-weight:700}
.chip.c-good.on{background:var(--good);border-color:var(--good)}.chip.c-vio.on{background:var(--vio);border-color:var(--vio)}.chip.c-lit.on{background:var(--lit);border-color:var(--lit)}.chip.c-bad.on{background:var(--bad);border-color:var(--bad)}.chip.c-mas.on{background:var(--mas);border-color:var(--mas)}.chip.c-rose.on{background:var(--rose);border-color:var(--rose)}.chip.c-teal.on{background:var(--teal);border-color:var(--teal)}.chip.c-mut.on{background:var(--mut);border-color:var(--mut)}.chip.c-acc.on{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.scene svg{display:block}
.epbar{display:flex;gap:6px;justify-content:center;margin-top:8px}
.ep{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--tint);cursor:pointer;font-size:.8rem;font-weight:700;color:var(--muted)}
.ep.done{border-color:color-mix(in srgb,var(--lit) 55%,transparent);color:var(--lit)}
.ep.on{background:var(--lit);border-color:var(--lit);color:var(--ink);transform:scale(1.1)}
.eptitle{margin:0 0 4px;font-weight:700;font-size:.92rem;color:var(--lit)}
.eptext{margin:0 0 6px;font-size:.95rem;min-height:2.8em}
.epmood{margin:0;font-size:.82rem;color:var(--muted)}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mini2{display:flex;gap:10px;align-items:flex-start;font-size:.86rem}
.actor{transition:transform .8s cubic-bezier(.45,.05,.2,1),opacity .45s}
.mixdot{transition:transform .25s ease-out}
.sliders{display:grid;gap:12px}
.sl{display:grid;gap:6px;font-size:.86rem}
.sl-l{display:flex;align-items:center}
.sl-l b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
.rng{width:100%;accent-color:var(--accent);height:24px}
.rng.r-good{accent-color:var(--good)}.rng.r-lit{accent-color:var(--lit)}.rng.r-teal{accent-color:var(--teal)}.rng.r-mas{accent-color:var(--mas)}
.rng:disabled{opacity:.35}
.mixstyle{font:500 1.5rem/1.1 var(--serif);margin:2px 0 10px}
.t-good{color:var(--good)}.t-lit{color:var(--lit)}.t-bad{color:var(--bad)}.t-mut{color:var(--muted)}.t-teal{color:var(--teal)}.t-vio{color:var(--vio)}.t-mas{color:var(--mas)}
.deck{display:grid;gap:10px}
.dcard{margin:0}
.dcard .dg{max-width:480px;margin:0 auto}.dcard figcaption{font-size:.8rem;color:var(--muted);margin:6px 2px 8px}
.dact{display:flex;gap:8px;flex-wrap:wrap}
.sorter{display:grid;gap:10px}
.sortcard{font:600 1.05rem/1.35 var(--sans);text-align:center;padding:18px 14px;border-radius:16px;border:1px dashed var(--line2);background:var(--panel2);min-height:76px;display:grid;place-items:center}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bin{border-radius:14px;padding:12px;border:1px solid var(--bc);background:color-mix(in srgb,var(--bc) 12%,transparent);cursor:pointer;font-weight:700;text-align:center;color:var(--text);transition:transform .15s}
.bin:hover{transform:translateY(-2px)}
.gauges{display:grid;gap:10px}
.gauge{display:grid;grid-template-columns:120px 1fr 42px;gap:10px;align-items:center;font-size:.86rem}
.gauge .bar{height:10px}
.gauge .bar span{background:var(--gc)}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem}
.seg>span{min-width:110px;color:var(--muted)}
#mot{touch-action:manipulation;cursor:crosshair}
#mot circle{transition:fill .2s}

/* ---------- SVG diagram styling ---------- */
.dg{width:100%;height:auto;display:block;overflow:visible}
.dg text{font-family:var(--sans)}
.tx{fill:var(--text)}.tm{fill:var(--muted)}.tf{fill:var(--faint)}.tv{fill:var(--text);font-weight:700}.tdark{fill:var(--ink)}
.tlit{fill:var(--lit)}.tgood{fill:var(--good)}.tbad{fill:var(--bad)}.tvio{fill:var(--vio)}.tteal{fill:var(--teal)}
.dg .t-good{fill:var(--good)}.dg .t-teal{fill:var(--teal)}.dg .t-lit{fill:var(--lit)}.dg .t-rose{fill:var(--rose)}
.bx{fill:var(--tint);stroke:var(--line2);stroke-width:1}
.dash{stroke-dasharray:4 3}
.b-rose{fill:color-mix(in srgb,var(--rose) 18%,transparent);stroke:var(--rose)}.b-vio{fill:color-mix(in srgb,var(--vio) 18%,transparent);stroke:var(--vio)}.b-teal{fill:color-mix(in srgb,var(--teal) 17%,transparent);stroke:var(--teal)}
.b-lit{fill:color-mix(in srgb,var(--lit) 17%,transparent);stroke:var(--lit)}.b-mas{fill:color-mix(in srgb,var(--mas) 16%,transparent);stroke:var(--mas)}.b-good{fill:color-mix(in srgb,var(--good) 16%,transparent);stroke:var(--good)}
.b-bad{fill:color-mix(in srgb,var(--bad) 17%,transparent);stroke:var(--bad)}.b-mut{fill:color-mix(in srgb,var(--mut) 20%,transparent);stroke:var(--mut)}
.f-rose{fill:var(--rose)}.f-vio{fill:var(--vio)}.f-teal{fill:var(--teal)}.f-lit{fill:var(--lit)}.f-mas{fill:var(--mas)}.f-good{fill:var(--good)}.f-bad{fill:var(--bad)}.f-mut{fill:var(--mut)}.f-text{fill:var(--text)}
.s-rose{stroke:var(--rose)}.s-vio{stroke:var(--vio)}.s-teal{stroke:var(--teal)}.s-lit{stroke:var(--lit)}.s-mas{stroke:var(--mas)}.s-good{stroke:var(--good)}.s-bad{stroke:var(--bad)}.s-mut{stroke:var(--mut)}
.cut{fill:var(--panel)}
.ahd{fill:var(--muted)}
.ar{fill:none;stroke:var(--muted);stroke-width:1.3}
.ax2{fill:none;stroke:var(--faint);stroke-width:1.2}
.axis{stroke:var(--faint);stroke-width:1}
.grid{stroke:var(--tint2);stroke-width:1}
.dash2{stroke:var(--lit);stroke-opacity:.7;stroke-dasharray:3 3}
.ln{fill:none;stroke-width:2.6;stroke-linecap:round}
.ln.thin{stroke-width:1.8}.ln.thick{stroke-width:3.6}
.pie{fill:none;stroke-width:26}
.track{fill:var(--tint2)}
.zone{fill:color-mix(in srgb,var(--good) 14%,transparent)}
.eco1{fill:var(--tint);stroke:var(--line2)}.eco2{fill:color-mix(in srgb,var(--rose) 14%,transparent);stroke:var(--rose)}
.eco{stroke-width:1.2}
.ghost{fill:none;stroke:var(--vio);stroke-width:1.4;stroke-dasharray:3 2.5}
.dim{opacity:.28}.dimg{opacity:.3}
.room{fill:var(--tint);stroke:var(--line2)}.door{fill:color-mix(in srgb,var(--vio) 14%,transparent);stroke:var(--vio)}.chair{fill:var(--line2)}
.halo2{opacity:.32;transition:fill .4s}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx .85s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.pi{transform-box:fill-box;transform-origin:center;animation:pi .55s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:var(--d,0ms)}
.fi{animation:fi .55s ease both;animation-delay:var(--d,0ms)}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s cubic-bezier(.4,.1,.2,1) forwards;animation-delay:var(--d,0ms)}
@keyframes gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pi{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes dr{to{stroke-dashoffset:0}}

/* ---------- Particles ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.pt{position:absolute;left:0;top:0;font-size:14px;line-height:1;will-change:transform,opacity;animation:pt var(--t,900ms) cubic-bezier(.15,.7,.3,1) forwards}
@keyframes pt{0%{transform:translate(var(--x0),var(--y0)) scale(.6) rotate(0);opacity:1}100%{transform:translate(var(--x1),var(--y1)) scale(var(--s,1)) rotate(var(--r,0deg));opacity:0}}
.fall{position:absolute;left:0;top:-30px;will-change:transform;animation:fall var(--t,4s) linear forwards}
.fall>span{display:inline-block;animation:swing 1.6s ease-in-out infinite alternate}
@keyframes fall{0%{transform:translate(var(--x0),-30px);opacity:0}8%{opacity:1}100%{transform:translate(var(--x1),105vh);opacity:.9}}
@keyframes swing{from{transform:translateX(-14px) rotate(-25deg)}to{transform:translateX(14px) rotate(25deg)}}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:60;pointer-events:none;font:600 1.5rem/1 var(--serif);font-style:italic;color:var(--bloom);text-shadow:0 0 22px color-mix(in srgb,var(--bloom) 60%,transparent);animation:toast 1.5s ease forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-16px) scale(1)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.dr{stroke-dashoffset:0}}
</style>

<script>
(function(){
"use strict";
var QS = [{"id":"s1q001","s":1,"t":"L","q":"How did lecture define attachment?","a":"A specific, enduring, emotional bond between two people","d":["Any positive social interaction between an infant and an adult","A learned preference for whoever provides food and warmth","A temperament trait that shapes how sociable a child is","A brief emotional reaction triggered by separation from a caregiver","An infant’s ability to tell familiar faces from strangers"],"e":"==Attachment== is a specific, enduring, emotional bond between two people. Infants’ first social relationships are attachments, which initially form over the first 2 years.","n":[["k","==Attachment== = specific + enduring + emotional bond between two people."],["m","S-E-E: Specific, Enduring, Emotional"],["x","A brief reaction or general sociability isn’t an attachment."]],"v":"feat4","vp":"f"},{"id":"s1q002","s":1,"t":"L","q":"According to lecture, over what period do infants’ first attachments initially form?","a":"Over the first 2 years","d":["Within the first 2 weeks after birth","Between ages 3 and 5","Only after the infant begins walking","In the first 6 months, after which they are fixed"],"e":"Infants’ first social relationships (attachments) initially form over the first 2 years. Lecture also stressed that attachments can be reworked at any age, so nothing is “fixed” after infancy.","n":[["k","First attachments form over the first 2 years."],["x","Formed early ≠ fixed forever; they can be reworked at any age."]]},{"id":"s1q003","s":1,"t":"L","q":"Why did John Bowlby argue that attachments form between infants and caregivers?","a":"Because attachment offered an evolutionary advantage","d":["Because caregivers become linked with food through learning","Because infants are born preferring their biological mother","Because caregivers explicitly teach infants how to attach","Because infants imitate the bonds they see between adults"],"e":"Bowlby argued ==attachment== evolved because staying close to a protective caregiver helped infants survive. He also proposed that interactions with caregivers build an ==internal working model== of relationships.","n":[["k","Bowlby: ==attachment== = evolutionary advantage (staying close to a protector)."],["x","Not a learned food association."],["c","Bowlby → internal working model"]]},{"id":"s1q004","s":1,"t":"L","q":"An infant whose cries are reliably answered comes to expect, “The world is safe. Others will help me.” Bowlby called this kind of expectation a(n)…","a":"internal working model","d":["secure base script","attachment style classification","safe haven response","temperament profile","proximity schema"],"e":"Through repeated interactions, infants build an ==internal working model==: a mental template of what relationships are like and whether others will respond. ==Sensitive==, responsive caregiving builds a model of others as trustworthy.","n":[["k","==Internal working model== = mental template of relationships built from caregiver interactions."],["c","One reason attachment predicts later outcomes"],["m","A “map” of relationships the child carries forward"]],"v":"iwm","vp":"f"},{"id":"s1q005","s":1,"t":"L","q":"In lecture, which quality of caregiver interactions most shapes the infant’s internal working model?","a":"Sensitive, responsive caregiving","d":["The total number of hours the caregiver spends at home","The number of different caregivers the infant has","How strictly the caregiver enforces daily routines","How early the infant is weaned from breastfeeding"],"e":"Lecture linked the quality of interactions to ==sensitive==, ==responsive== caregiving. It’s the quality of responding to the infant’s signals, not the quantity of time or strictness, that matters.","n":[["k","Quality of care = sensitivity + responsiveness → ==secure== internal working model."],["x","Quantity of time and strict routines aren’t the key quality."]],"v":"iwm","vp":"f"},{"id":"s1q006","s":1,"t":"L","q":"Who developed the Strange Situation procedure?","a":"Mary Ainsworth","d":["John Bowlby","Grazyna Kochanska","Harry Harlow","Diana Baumrind"],"e":"Mary Ainsworth developed the ==Strange Situation==. John Bowlby proposed ==attachment== theory (evolutionary advantage, internal working models).","n":[["k","==Strange Situation== = Mary Ainsworth."],["x","Bowlby = theory (evolution, internal working models)."],["m","Ainsworth → Assessment; Bowlby → Bond theory"]],"v":"ss","vp":"f"},{"id":"s1q007","s":1,"t":"L","q":"What is the Strange Situation designed to do?","a":"Heighten activation of attachment so its behaviours can be seen","d":["Measure temperament by exposing infants to a series of unusual new toys","Test how quickly infants learn to trust unfamiliar adults in a new room","Assess parents’ sensitivity during free play at home","Measure calm at separation as a sign of independence"],"e":"The procedure uses mild stressors (an unfamiliar room, a stranger, brief separations) to heighten activation of the ==attachment== system, so behaviours like ==secure==-base use and comfort seeking become visible.","n":[["k","==Strange Situation== = mild stress → attachment system activated → behaviours observable."],["x","Calm separation is not scored as “independence” = good."]],"v":"ss","vp":"f"},{"id":"s1q008","s":1,"t":"L","q":"Which set of behaviours does the Strange Situation measure, according to lecture?","a":"Secure-base use, fear of separation, and safe-haven use","d":["Smiling at strangers, imitation of adults, and joint attention","Speed of exploration, early words, and toy preferences","Crying time, heart rate, and cortisol during free play","Obedience to the parent, turn-taking, and sharing"],"e":"Lecture: the ==Strange Situation== measures ==attachment== behaviours: using the parent as a secure base, fear of separation, and using the parent as a safe haven.","n":[["k","Measures: ==secure base== + fear of separation + safe haven."],["c","The 4 features of an attachment bond"]],"v":"feat4","vp":"f"},{"id":"s1q009","s":1,"t":"L","q":"Which of these is NOT one of the 4 main features of an attachment bond shown in lecture?","a":["Sociability with strangers","Imitating the caregiver"],"d":["Secure base for exploring","Safe haven for comfort","Proximity maintenance","Separation distress"],"e":"The 4 main features of the ==attachment== bond: ==secure base==, safe haven, proximity maintenance, and separation distress.","n":[["k","4 features: ==secure base==, safe haven, proximity maintenance, separation distress."],["m","“Base, Haven, Near, Fear”"]],"v":"feat4","vp":"f"},{"id":"s1q010","s":1,"t":"L","q":"A toddler wanders off to explore new toys, glancing back at her father now and then before venturing further. She is using her father as a…","a":"secure base","d":["safe haven","source of separation distress","internal working model","stranger substitute"],"e":"A ==secure base== is a launch pad for exploration: the child explores while checking back with the caregiver. A ==safe haven== is where the child retreats for comfort when distressed.","n":[["k","==Secure base== = launch pad for exploring."],["x","Safe haven = retreat for comfort when upset."],["m","Base → go out. Haven → come back."]],"v":"feat4","vp":"f"},{"id":"s1q011","s":1,"t":"L","q":"A toddler trips, starts crying, and runs straight to his mother to be held. This illustrates using the parent as a…","a":"safe haven","d":["secure base","source of proximity maintenance","internal working model","stranger substitute"],"e":"Retreating to the caregiver for comfort when distressed is the ==safe haven== function. Exploring outward while checking in is the ==secure base== function.","n":[["k","==Safe haven== = comfort when distressed."],["x","Secure base = exploring outward from the parent."]],"v":"feat4","vp":"f"},{"id":"s1q012","s":1,"t":"L","q":"In a busy park, a toddler keeps adjusting where he walks so he stays close to his grandmother. Which feature of attachment is this?","a":"Proximity maintenance","d":["Separation distress","Secure base","Safe haven","Disorganized attachment"],"e":"==Proximity maintenance== means wanting to stay near the ==attachment== figure. Separation distress is the upset that happens when the figure leaves.","n":[["k","==Proximity maintenance== = staying near the attachment figure."],["x","Separation distress = upset when they leave."]],"v":"feat4","vp":"f"},{"id":"s1q013","s":1,"t":"L","q":"In the Strange Situation shown in lecture, what happens right after the parent leaves the infant alone with the stranger?","a":"The parent returns and the stranger leaves","d":["The stranger leaves the infant completely alone","The stranger returns while the infant is alone","The parent leaves again with the stranger present","The parent and infant enter the room together"],"e":"Episodes: 1 parent and infant enter; 2 stranger joins; 3 parent leaves (infant with stranger); 4 parent returns, stranger leaves; 5 parent leaves (infant alone); 6 stranger returns; 7 parent returns, stranger leaves.","n":[["k","Pattern: separation → reunion, twice. The second separation is harder (alone first)."],["n","1 enter · 2 stranger in · 3 parent out · 4 reunion · 5 alone · 6 stranger back · 7 reunion"]],"v":"ss:4","vp":"f"},{"id":"s1q014","s":1,"t":"L","q":"In the 7-episode Strange Situation shown in lecture, in which episode is the infant left completely alone?","a":"Episode 5","d":["Episode 3","Episode 4","Episode 6","Episode 2"],"e":"In episode 5 the parent leaves and the infant is alone. Episode 3 is the first separation (infant left with the stranger). In episode 6 the stranger returns.","n":[["k","Episode 5 = infant alone (the peak stress point)."],["x","Episode 3 = left with the stranger, not alone."]],"v":"ss:5","vp":"f"},{"id":"s1q015","s":1,"t":"L","q":"How many separation–reunion cycles with the parent does the 7-episode Strange Situation include?","a":"Two","d":["One","Three","Four","None; only the stranger leaves"],"e":"The parent leaves twice (episodes 3 and 5) and returns twice (episodes 4 and 7). Reunions are especially informative for classifying ==attachment==.","n":[["k","Two separations, two reunions."],["c","Reunion behaviour is what best separates the styles"]],"v":"ss:7","vp":"f"},{"id":"s1q016","s":1,"t":"L","q":"Which description matches SECURE attachment in the Strange Situation?","a":"Uses parent as a secure base, cries or searches at separation, is comforted on return","d":["Explores freely, shows little distress at separation, and avoids the parent on return","Stays very close to the parent, is very distressed by separation, then acts ambivalent on return","Shows contradictory behaviours that don’t fit any consistent classification pattern","Shows no distress at separation and greets the stranger as warmly as the parent"],"e":"==Secure==: secure-base exploration, crying or searching when the parent leaves, and being comforted and re-engaging when the parent returns.","n":[["k","==Secure== = explores, misses parent, comforted at reunion, back to play."],["x","Crying at separation is normal for secure infants."]],"v":"reunion","vp":"f"},{"id":"s1q017","s":1,"t":"L","q":"Which description matches INSECURE-RESISTANT (ambivalent) attachment?","a":"Clings, is very distressed by the stranger and separation, then acts ambivalent on reunion","d":["Uses the parent as a secure base to explore and is quickly comforted when the parent returns","Shows little distress when the parent leaves and actively ignores or avoids the parent on return","Shows contradictory behaviour patterns that don’t fit any single classification","Explores far from the parent and seeks comfort mainly from the stranger instead"],"e":"==Resistant==/ambivalent: clingy, very distressed by the stranger and the parent leaving, but ambivalent on reunion (seeking contact while resisting it).","n":[["k","==Resistant== = clingy + very distressed + ambivalent at reunion."],["m","Resistant = “come here… go away!”"]],"v":"reunion","vp":"f"},{"id":"s1q018","s":1,"t":"L","q":"Which description matches INSECURE-AVOIDANT attachment?","a":"Little distress when the parent leaves; ignores or avoids the parent on return","d":["Very distressed when the parent leaves, and ambivalent about contact on reunion","Cries when the parent leaves, then is comforted and returns to play on reunion","Shows contradictory, confused behaviour that fits no consistent pattern","Distressed only by the stranger, and greets the parent warmly on reunion"],"e":"==Avoidant==: little distress at separation and active ignoring or avoidance of the parent on reunion.","n":[["k","==Avoidant== = little distress + ignores parent at reunion."],["x","Looking “independent” ≠ secure."]],"v":"reunion","vp":"f"},{"id":"s1q019","s":1,"t":"L","q":"Which description matches DISORGANIZED attachment?","a":"Doesn’t fit any classification, showing contradictory behaviour patterns","d":["Very distressed at separation and ambivalent about contact on reunion with the parent","Calm at separation and actively ignores or avoids the parent when they return to the room","Explores confidently and is easily comforted after separation","Clings to the stranger instead of the parent throughout"],"e":"==Disorganized== infants don’t fit the other classifications and show contradictory patterns (e.g., approaching while looking away, freezing). This pattern is common among abused or maltreated infants.","n":[["k","==Disorganized== = contradictory, no consistent strategy."],["c","Common among maltreated infants"]],"v":"reunion","vp":"f"},{"id":"s1q020","s":1,"t":"L","q":"Harris explores the toys when he and his parent enter. When his parent leaves, he keeps playing. When the parent returns, he keeps playing and doesn’t look up. How would researchers most likely classify Harris?","a":"Insecure-avoidant","d":["Secure, because he explored confidently on his own","Insecure-resistant/ambivalent","Disorganized","Secure, because he wasn’t upset by the separation"],"e":"No distress at separation plus ignoring the parent on reunion is the ==avoidant== pattern. Calm, “independent” play is a trap: ==secure== infants typically react to separation and greet or seek the parent on return.","n":[["k","No distress + ignores parent at reunion = ==avoidant==."],["x","Independence-looking calm is not security."],["c","The lecture iClicker question"]]},{"id":"s1q021","s":1,"t":"L","q":"Based only on Harris’s avoidant pattern, what would most likely be predicted about his parent?","a":"They often dismiss Harris’s calls for attention","d":["They respond to Harris only occasionally and unpredictably","They are sometimes overly responsive and sometimes non-responsive","They are typically responsive and kind to Harris","They are frightening or abusive toward Harris"],"e":"==Avoidant== ==attachment== is linked to unavailable, rejecting, or intrusive parenting, like dismissing the child’s bids. Inconsistent parenting fits resistant; maltreatment fits disorganized; responsive fits secure.","n":[["k","==Avoidant== ↔ unavailable, rejecting, intrusive parenting."],["x","Inconsistent (sometimes yes, sometimes no) ↔ resistant."]],"v":"reunion","vp":"f"},{"id":"s1q022","s":1,"t":"L","q":"Which parenting condition did lecture associate with INSECURE-RESISTANT attachment?","a":"Inconsistent or unresponsive parenting","d":["Unavailable, rejecting, or intrusive parenting","Sensitive, responsive, affectionate parenting","Abusive or maltreating parenting","Strict but warm, highly structured parenting"],"e":"==Resistant== ↔ inconsistent or unresponsive. ==Avoidant== ↔ unavailable, rejecting, or intrusive. Secure ↔ sensitive, responsive, affectionate. Disorganized ↔ common among abused/maltreated infants.","n":[["k","==Resistant== ↔ inconsistent/unresponsive care."],["m","Inconsistent care → the child amps up demands (clingy, resistant)"]],"v":"reunion","vp":"f"},{"id":"s1q023","s":1,"t":"L","q":"Which parenting condition did lecture associate with INSECURE-AVOIDANT attachment?","a":"Unavailable, rejecting, or intrusive parenting","d":["Inconsistent or unresponsive parenting","Sensitive, responsive, affectionate parenting","Abuse or maltreatment","Warm parenting with very few rules"],"e":"==Avoidant== ==attachment== is linked with unavailable, rejecting, or intrusive parenting. When bids for comfort are rejected, the infant learns to minimize them.","n":[["k","==Avoidant== ↔ unavailable, rejecting, intrusive."],["m","Bids get rejected → the child stops bidding"]],"v":"reunion","vp":"f"},{"id":"s1q024","s":1,"t":"L","q":"Which attachment classification did lecture describe as common among abused or maltreated infants?","a":"Disorganized","d":["Insecure-avoidant","Insecure-resistant","Secure","None; maltreatment isn’t linked to attachment"],"e":"==Disorganized attachment== is common among abused or maltreated infants: the caregiver is both a source of comfort and a source of fear, leaving no organized strategy.","n":[["k","==Disorganized== ↔ common with abuse/maltreatment."],["m","Comfort and fear from the same person → no strategy works"]],"v":"reunion","vp":"f"},{"id":"s1q025","s":1,"t":"L","q":"Which parenting condition did lecture associate with SECURE attachment?","a":"Sensitive, responsive, affectionate parenting","d":["Inconsistent but very affectionate parenting","Intrusive, highly stimulating parenting","Strict, consistent, low-affection parenting","Parenting by many rotating caregivers"],"e":"==Secure attachment== is associated with ==sensitive==, responsive, affectionate parenting.","n":[["k","==Secure== ↔ sensitive, responsive, affectionate."],["x","Intrusive “stimulating” care is linked to avoidant, not secure."]],"v":"reunion","vp":"f"},{"id":"s1q026","s":1,"t":"L","q":"A father constantly pushes toys in his infant’s face even when she turns away. Which classification has lecture linked to this kind of intrusive parenting?","a":"Insecure-avoidant","d":["Insecure-resistant","Disorganized","Secure, since he is highly engaged","No classification; intrusiveness isn’t linked to attachment"],"e":"Lecture grouped intrusive parenting with unavailable and rejecting parenting as associated with ==avoidant== ==attachment==. Being highly engaged is not the same as being sensitive and responsive.","n":[["k","Intrusive (ignores the infant’s signals) ↔ ==avoidant==."],["x","Lots of engagement ≠ sensitivity."]],"v":"reunion","vp":"f"},{"id":"s1q027","s":1,"t":"L","q":"Mia’s mother sometimes rushes to soothe her and other times ignores her cries. In the Strange Situation, Mia clings, is extremely upset when her mother leaves, and on return reaches for her while also pushing her away. Mia is most likely…","a":"insecure-resistant/ambivalent","d":["insecure-avoidant","disorganized","secure, with strong separation distress","secure, since she seeks contact"],"e":"Inconsistent care plus clinginess, high distress, and seeking-yet-resisting contact at reunion is the ==resistant==/ambivalent pattern.","n":[["k","Seek + resist at reunion = ==resistant==/ambivalent."],["x","Disorganized = contradictory with no strategy (e.g., freezing), not simply ambivalent."]]},{"id":"s1q028","s":1,"t":"L","q":"On reunion, Leo walks toward his father, suddenly freezes with a dazed expression, then backs away while looking at the wall. Leo is most likely…","a":"disorganized","d":["insecure-avoidant","insecure-resistant/ambivalent","secure","secure but temperamentally shy"],"e":"Contradictory behaviour that fits no consistent strategy (approaching then freezing or backing away) is ==disorganized attachment==.","n":[["k","Freezing, dazed, approach-then-avoid = ==disorganized==."],["x","Avoidant = consistently ignores; resistant = consistently clingy and angry."]]},{"id":"s1q029","s":1,"t":"L","q":"A student claims, “If a baby cries when the parent leaves, the baby is insecurely attached.” Why is this wrong?","a":"Secure infants often cry at separation; the reunion is more telling","d":["Crying at separation happens only in infants with disorganized attachment","Crying at separation is the hallmark of insecure-avoidant attachment in infants","Secure infants never show any distress at separation","Crying reflects temperament only, not attachment at all"],"e":"Lecture’s description of ==secure attachment== includes crying or searching when the parent leaves. The key difference is what happens at reunion: ==secure== infants are comforted and re-engage.","n":[["k","==Separation distress== is normal for secure infants."],["k","Reunion behaviour separates the styles."]]},{"id":"s1q030","s":1,"t":"L","q":"Two infants both explore happily at the start of the Strange Situation. Which moment best tells a secure infant apart from an avoidant one?","a":"The reunion: secure infants seek comfort; avoidant infants avoid the parent","d":["Entering the room: secure infants explore while avoidant infants stay put","The stranger’s entry: avoidant infants cry harder than secure infants","Being alone: avoidant infants cry hardest of all the groups","No moment does; the two styles behave the same throughout"],"e":"Both may explore early on. The reunion distinguishes them: ==secure== infants seek and are comforted by the parent, while ==avoidant== infants actively ignore or avoid the parent.","n":[["k","Reunion = the most telling moment."],["x","Exploration alone can’t separate secure from avoidant."]],"v":"ss:7","vp":"f"},{"id":"s1q031","s":1,"t":"L","q":"About what percentage of middle-class North American infants are classified as securely attached?","a":"About 65%","d":["About 50%","About 80%","About 35%","About 90%"],"e":"Distribution shown in lecture: ==secure== about 65%, ==insecure-avoidant== about 20%, insecure-resistant about 10%, disorganized about 5%.","n":[["k","==Secure== ≈ 65%."],["n","Avoidant 20% · Resistant 10% · Disorganized 5%"],["m","65 / 20 / 10 / 5 (adds to 100)"]],"v":"pie","vp":"f"},{"id":"s1q032","s":1,"t":"L","q":"Among middle-class North American infants, which insecure classification is most common?","a":"Insecure-avoidant, at about 20%","d":["Insecure-resistant, at about 20%","Disorganized, at about 10%","Insecure-resistant, at about 10%","Disorganized, at about 20%"],"e":"==Avoidant== (about 20%) is the most common insecure type in this sample, followed by ==resistant== (about 10%) and disorganized (about 5%).","n":[["k","==Avoidant== (20%) > resistant (10%) > disorganized (5%)."]],"v":"pie","vp":"f"},{"id":"s1q033","s":1,"t":"L","q":"Using this distribution, about how many of 100 typical middle-class North American infants would be classified as insecure of any type (including disorganized)?","a":"About 35","d":["About 20","About 25","About 30","About 65"],"e":"==Insecure-avoidant== (20) + ==insecure-resistant== (10) + disorganized (5) = 35. The remaining 65 are secure.","n":[["k","100 − 65 ==secure== = 35 not secure."],["n","20 + 10 + 5 = 35"]],"v":"pie","vp":"q"},{"id":"s1q034","s":1,"t":"L","q":"Compared with insecure attachment, secure attachment in infancy has been associated with…","a":"better peer relationships, stress coping, and teacher ratings","d":["higher IQ scores, earlier walking, and larger early vocabularies","fewer childhood illnesses, better sleep, and earlier toilet training","more independence from parents and fewer close friends","higher grades, but more anxiety in close relationships"],"e":"Lecture: ==secure== (vs. insecure) ==attachment== in infancy is associated with better peer relationships, coping with stress, and more favourable teacher ratings.","n":[["k","==Secure== → peers, stress coping, teacher ratings."],["m","“Friends, Feelings, Teachers”"]]},{"id":"s1q035","s":1,"t":"L","q":"Which outcomes did lecture associate with DISORGANIZED attachment in infancy?","a":"Antisocial behaviour and higher high school drop-out rates","d":["Anxiety and withdrawal, but higher school achievement overall","Better coping with stress and more friendships in childhood","Lower IQ, but no social, emotional, or behavioural effects","Shyness and fewer friendships, but no effects on schooling"],"e":"Lecture linked ==disorganized attachment== in infancy to antisocial behaviour and higher high school drop-out rates.","n":[["k","==Disorganized== → antisocial behaviour + school drop-out."],["c","Kochanska & Kim: disorganization with father → externalizing"]]},{"id":"s1q036","s":1,"t":"L","q":"What limitation of classic attachment-outcome research did lecture highlight?","a":"It focused on mothers, though children form multiple attachments","d":["It measured attachment only in adolescence, never in infancy or toddlerhood","It relied only on fathers and largely ignored mothers’ caregiving","It studied only children raised in institutional care settings","It assumed infants could attach to only one person"],"e":"Outcome research has focused primarily on the mother, but many or most children form attachments with multiple caregivers. That gap motivated studies like Kochanska & Kim (2013).","n":[["k","Classic research = mother-focused; children have multiple attachments."],["c","Kochanska & Kim measured both parents"]]},{"id":"s1q037","s":1,"t":"L","q":"Lecture offered three explanations for why infant attachment predicts later outcomes. Which is one of them?","a":["Internal working models of relationships","Physiological effects that buffer stress","Third variables such as temperament"],"d":["Attachment style is fixed by genes at birth","Infants later remember the Strange Situation itself","Secure infants get more years of formal schooling","Attachment security directly raises IQ"],"e":"Three possible explanations: (1) internal working models of relationships, (2) physiological effects that buffer stress, (3) third variables such as temperament. Lecture added that ==attachment== and internal working models can be reworked at any age.","n":[["k","Why long-term effects? ==Internal working model==, stress buffer, third variables (temperament)."],["m","“Map, Buffer, Third wheel”"]],"v":"mech","vp":"f"},{"id":"s1q038","s":1,"t":"L","q":"A researcher argues that easygoing babies both elicit more responsive care and later get along well with peers, so the attachment–peer link may be partly spurious. This is the…","a":"third-variable (temperament) explanation","d":["internal working model explanation","physiological stress-buffer explanation","secure base explanation","cultural-norms explanation"],"e":"If temperament drives both ==attachment== and later outcomes, it’s a third variable that could create the link. This is one of lecture’s three explanations for long-term effects.","n":[["k","Temperament driving both = third variable."],["c","Correlation ≠ causation (Exam 1 methods)"]],"v":"mech","vp":"f"},{"id":"s1q039","s":1,"t":"L","q":"A securely attached child shows smaller stress-hormone spikes during a hard school transition. Which explanation for attachment’s long-term effects does this support?","a":"Physiological effects: security buffers stress","d":["Third variables, such as an easygoing temperament","Internal working models of relationships","Proximity maintenance with the caregiver","The safe-haven effect on exploration"],"e":"One proposed mechanism is physiological: ==secure== relationships buffer the body’s stress response, which can benefit later functioning.","n":[["k","Smaller stress responses = physiological buffer."],["c","Toxic vs. tolerable stress (Exam 1): relationships buffer stress"]],"v":"mech","vp":"f"},{"id":"s1q040","s":1,"t":"L","q":"What did lecture stress about attachment relationships and internal working models?","a":"They can be reworked at any age","d":["They are fixed once the first 2 years end","They can change only before school entry","They can change only through formal therapy","They change only if the primary caregiver changes"],"e":"Lecture emphasized that ==attachment== relationships and internal working models can be reworked at any age, so infant attachment predicts but doesn’t determine later outcomes.","n":[["k","Reworkable at any age → predictive, not deterministic."],["c","Adoption research: later attachments can be secure"]],"v":"mech","vp":"f"},{"id":"s1q041","s":1,"t":"L","q":"What does cross-cultural attachment research suggest about secure attachment?","a":"Secure attachment is the most common classification across cultures","d":["Avoidant attachment is the most common pattern in most non-Western cultures","Infants in some cultures don’t form attachments to caregivers at all","Rates of security range from about 20% to 90% across cultures","Responsiveness predicts security only in Western cultures"],"e":"The percentage of ==secure attachment== is similar across cultures, infants in all cultures form attachments, secure attachment is the norm, and parent responsiveness seems linked with security across cultures.","n":[["k","==Secure== = the norm everywhere; % secure is similar across cultures."],["x","What differs is the mix of insecure types."]],"v":"culture","vp":"f"},{"id":"s1q042","s":1,"t":"L","q":"What DOES appear to differ across cultures in attachment research?","a":"The distribution of insecure attachment types","d":["Whether infants form attachments at all","Whether secure attachment is the most common type","Whether responsiveness relates to security","The number of attachment figures an infant can have"],"e":"==Secure== rates and the link with responsiveness are similar across cultures, but the distribution of insecure types (e.g., ==avoidant== vs. resistant) differs.","n":[["k","Same: % ==secure==, responsiveness link. Different: which insecure type is common."]],"v":"culture","vp":"f"},{"id":"s1q043","s":1,"t":"L","q":"In this cross-cultural chart, which sample shows the highest rate of insecure-avoidant attachment?","a":"Western Europe","d":["Israel","Japan","United States","China"],"e":"Western Europe shows the most ==avoidant== ==attachment== (about 28%), with the U.S. next (about 21%). Israel shows very little avoidance (about 3%) but the most resistance.","n":[["k","Most ==avoidant==: W. Europe. Most resistant: Israel (Japan close)."],["x","Secure stays around 65–70% everywhere."]],"v":"culture","vp":"q"},{"id":"s1q044","s":1,"t":"L","q":"In this cross-cultural chart, which sample shows the highest rate of insecure-resistant attachment?","a":"Israel","d":["Western Europe","United States","Africa","China"],"e":"Israel shows the most ==resistant== ==attachment== (about 22%), with Japan close behind (about 19%). Western Europe shows the least resistance (about 6%) but the most avoidance.","n":[["k","Israel and Japan: more ==resistant==. W. Europe and U.S.: more avoidant."]],"v":"culture","vp":"q"},{"id":"s1q045","s":1,"t":"L","q":"Which is one explanation lecture offered for cultural differences in insecure attachment types?","a":["Cultural differences in parenting practices","Differences in how attachment behaviours are expressed and interpreted"],"d":["Infants in some cultures lack an attachment system","The Strange Situation was never used outside the U.S.","Responsiveness matters only in individualist cultures","Secure attachment is rare outside Western countries"],"e":"Lecture’s two explanations: cultural differences in parenting, and differences in how ==attachment== behaviours are expressed and interpreted across cultures.","n":[["k","Why differences? Parenting practices differ; behaviour is expressed and read differently."]],"v":"culture","vp":"f"},{"id":"s1q046","s":1,"t":"L","q":"In a community where infants are almost never left with unfamiliar adults, many infants become extremely distressed in the Strange Situation and get classified as resistant. Which concern from lecture does this best illustrate?","a":"Attachment behaviours may be expressed and read differently by culture","d":["These infants are less attached to their parents than Western infants","Parents in this community must be less responsive than other parents","The procedure is too mild to activate attachment in these infants","Resistant attachment is genetically more common in this community"],"e":"If separation is unusual in a culture, the ==Strange Situation== may be far more stressful there, so the same behaviour may mean something different. This is lecture’s point about expression and interpretation.","n":[["k","Same procedure ≠ same meaning everywhere."],["c","Cultural bias in EF tests (Exam 1)"]]},{"id":"s1q047","s":1,"t":"L","q":"What did lecture conclude about parent responsiveness and attachment across cultures?","a":"Across cultures, responsiveness seems linked with secure attachment","d":["Responsiveness predicts security only in middle-class Western samples","Responsiveness predicts avoidance in collectivist cultures","Responsiveness is unrelated to security in most cultures","Responsiveness matters for fathers but not for mothers"],"e":"One of the cross-cultural similarities: parent responsiveness seems linked with ==secure attachment== across cultures.","n":[["k","Responsiveness → security appears across cultures."]],"v":"culture","vp":"f"},{"id":"s1q048","s":1,"t":"L","q":"Which is an application of attachment research mentioned in lecture?","a":["Interventions and education for parents","Protecting attachment relationships in custody and separation decisions"],"d":["Screening infants’ attachment style before daycare entry","Requiring one primary caregiver for every infant","Using attachment scores to assign school placements","Discouraging multiple caregivers in early childhood"],"e":"Applications: interventions and education for parents, and the importance of ensuring and maintaining ==attachment== relationships (custody, separation). Lecture also cautioned against applying Western norms as “essential.”","n":[["k","Applications: parent interventions; protect ==attachment== relationships (custody, separation)."],["x","Not a reason to restrict children to one caregiver."]]},{"id":"s1q049","s":1,"t":"L","q":"A program tells families worldwide that infants must sleep alone and be cared for mainly by one parent in order to attach securely. Which caution from lecture does this ignore?","a":"Western caregiving norms aren’t essential for attachment","d":["Attachment research can’t inform any kind of intervention","Only fathers’ caregiving matters for secure attachment","Attachment is unrelated to the quality of caregiving","Secure attachment is harmful in collectivist cultures"],"e":"Lecture cautioned that we must not apply Western norms of caregiving as “essential” for ==attachment==. Infants in all cultures form attachments under many caregiving arrangements.","n":[["k","Don’t treat Western caregiving norms as required for ==attachment==."],["c","Scheidecker et al.: Western bias in parenting programs"]]},{"id":"s1q050","s":1,"t":"L","q":"In lecture’s model, how do parenting, attachment, and outcomes connect?","a":"Sensitive, responsive parenting shapes attachment, which predicts outcomes","d":["Attachment style shapes parenting quality, which then predicts later outcomes","Outcomes shape attachment, which then changes parenting quality over time","Parenting predicts outcomes directly, with no role for attachment","Temperament fully determines both attachment and outcomes"],"e":"Lecture’s diagram: quality of parenting (sensitivity, responsiveness) → ==attachment== (specific, enduring, emotional bond) → predicts outcomes.","n":[["k","Parenting quality → ==attachment== → outcomes."],["x","Temperament is a possible third variable, not the whole story."]],"v":"iwm","vp":"f"},{"id":"s1q051","s":1,"t":"LR","q":"In Kochanska & Kim (2013), how was attachment measured at 15 months?","a":"With the Strange Situation, run separately with the mother and with the father","d":["With the Strange Situation with the mother only, plus questionnaires completed by fathers","With home observations of both parents playing together with the child","With children’s self-reports of security with each parent","With story-completion narratives using mother and father dolls"],"e":"Each child completed the ==Strange Situation== twice at 15 months: once with the mother and once with the father, in separate sessions (order randomized).","n":[["k","15 months: ==Strange Situation== with mom AND dad, separately."],["x","Earlier studies often used child self-reports or story dolls."]],"v":"kkTime","vp":"f","rd":"Kochanska & Kim (2013)"},{"id":"s1q052","s":1,"t":"LR","q":"In Kochanska & Kim (2013), what was measured when children were about 6½ years old?","a":"Teachers’ reports of behaviour problems","d":["Children’s self-reports of behaviour problems","A repeat of the Strange Situation with both parents","Mothers’ and fathers’ ratings of behaviour problems","Children’s IQ and school grades"],"e":"Timeline: 15 months = ==Strange Situation== with mother and father; 6½ years = teacher reports; 8 years = self-reports and parent reports of externalizing and internalizing problems.","n":[["k","15 mo → ==attachment==. 6½ yr → teachers. 8 yr → child + parents."],["m","Infant → Teacher → Self"]],"v":"kkTime","vp":"f","rd":"Kochanska & Kim (2013)"},{"id":"s1q053","s":1,"t":"LR","q":"In Kochanska & Kim (2013), what was measured at age 8?","a":"Children’s self-reports and parents’ reports of problems","d":["Teachers’ reports of externalizing and internalizing problems","A second Strange Situation with each of the parents","Children’s friendships, as rated by their peers","Cortisol responses during a stressful lab task"],"e":"At age 8, children reported their own problems (Dominic-R interview) and mothers and fathers rated behaviour problems. Teachers reported at 6½.","n":[["k","Age 8 = child self-report + parent reports."],["x","Teachers = age 6½."]],"v":"kkTime","vp":"f","rd":"Kochanska & Kim (2013)"},{"id":"s1q054","s":1,"t":"LR","q":"What was the main finding of Kochanska & Kim (2013)?","a":"Children insecure with both parents had more behaviour problems later","d":["Children insecure with the mother had more problems, whatever their father bond","Children secure with both parents had far fewer problems than all other children","Security with the father mattered for boys but not for girls","Attachment at 15 months didn’t predict any later behaviour problems"],"e":"“==Double-insecure==” children reported more problems at 8 and were rated higher in externalizing by teachers. Security with one parent offset the risk, and double security added no extra benefit.","n":[["k","==Double-insecure== = highest risk."],["k","One ==secure attachment== offsets it."]],"v":"kkGroups","vp":"f","rd":"Kochanska & Kim (2013)"},{"id":"s1q055","s":1,"t":"LR","q":"In Kochanska & Kim (2013), what about children who were secure with one parent but insecure with the other?","a":"The secure relationship appeared to offset the risk","d":["Their risk fell about halfway between the double-secure and double-insecure groups","Their risk depended on whether the secure parent was the mother","Their risk was as high as that of double-insecure children","Their risk was significantly lower than that of double-secure children"],"e":"The mixed group looked like the double-==secure== group, not the ==double-insecure== group. Security with at least one parent appeared protective. (The mixed group’s mean was slightly lower than double-secure, but not significantly.)","n":[["k","==Secure== with one parent ≈ secure with both."],["x","Not halfway, and not dependent on which parent."]],"v":"kkGraph","vp":"f","rd":"Kochanska & Kim (2013)"},{"id":"s1q056","s":1,"t":"LR","q":"According to Kochanska & Kim (2013), which parent’s attachment security mattered more for later behaviour problems?","a":"Neither; the patterns for mothers and fathers were parallel","d":["The mother’s, as earlier studies had found","The father’s, especially for teacher reports","The mother’s for internalizing, the father’s for externalizing","It depended on the child’s gender"],"e":"Neither parent was “primary.” Graphing mother security with father as moderator, or the reverse, produced fully parallel patterns.","n":[["k","Neither parent more important."],["c","Lecture: “Neither parent more important”"]],"v":"kkGraph","vp":"f","rd":"Kochanska & Kim (2013)"},{"id":"s1q057","s":1,"t":"R","q":"Did being secure with BOTH parents add benefits beyond being secure with one, according to Kochanska & Kim (2013)?","a":"No; double security conferred no additional benefit","d":["Yes; double-secure children had by far the fewest problems","Yes, but only on teachers’ reports","Yes, but only for girls","This couldn’t be tested in their sample"],"e":"Having a ==secure attachment== with two parents didn’t add a protective effect beyond security with one. The big effect was the elevated risk of being insecure with both.","n":[["k","One ==secure== bond is enough to offset risk in this study."],["x","Two secure bonds weren’t better than one."]],"v":"kkGroups","vp":"f","rd":"Kochanska & Kim (2013)"},{"id":"s1q058","s":1,"t":"LR","q":"In this graph from Kochanska & Kim (2013), which combination of attachments at 15 months predicted the most self-reported behaviour problems at age 8?","a":"Insecure with both the mother and the father","d":["Insecure with the mother, secure with the father","Secure with the mother, insecure with the father","Secure with both the mother and the father","No combination differed from the others"],"e":"Only the ==double-insecure== point is high (about 36). The other three combinations cluster around 20–23.","n":[["k","Only ==double-insecure== stands out."],["m","One secure line “rescues” the other"]],"v":"kkGraph","vp":"q","rd":"Kochanska & Kim (2013)"},{"id":"s1q059","s":1,"t":"LR","q":"In this graph, what happens to self-reported problems for a child who is insecure with the mother but secure with the father?","a":"They’re about as low as for children secure with both parents","d":["They’re about as high as for children insecure with both parents","They fall exactly halfway between the double-insecure and double-secure children","They’re higher than for any other group of children","They can’t be read from this graph"],"e":"Insecure-with-mother but ==secure==-with-father children sit near 20, close to double-secure children (about 23), far below ==double-insecure== children (about 36).","n":[["k","Father security buffers mother insecurity (and vice versa)."]],"v":"kkGraph","vp":"q","rd":"Kochanska & Kim (2013)"},{"id":"s1q060","s":1,"t":"R","q":"Kochanska & Kim (2013) described the effect of double insecurity as “multiplicative.” What does that mean?","a":"Risk depended on the combination (an interaction), not a simple sum","d":["Each insecure attachment independently doubled the child’s overall risk","Risk multiplied with each additional year of the child’s age in the study","Problems multiplied across all four of the study’s informants","Insecurity with one parent caused insecurity with the other"],"e":"The security-with-mother × security-with-father interaction was significant: problems spiked only when both were insecure, rather than each insecure bond adding a fixed amount.","n":[["k","Multiplicative = interaction: only the both-insecure combination spikes."],["x","Additive would mean each insecure bond adds equally."]],"v":"kkGraph","vp":"f","rd":"Kochanska & Kim (2013)"},{"id":"s1q061","s":1,"t":"R","q":"Which informants agreed with each other about children’s behaviour problems in Kochanska & Kim (2013)?","a":"Mothers agreed with fathers, and teachers agreed with children","d":["All four informants agreed with one another strongly","Parents agreed with teachers, but children agreed with no one","Mothers agreed with children, and fathers with teachers","No informants agreed with any other informant"],"e":"Parents agreed with each other but not with teachers or children. Surprisingly, teachers’ ratings (at 6½) and children’s self-reports (at 8) did correspond.","n":[["k","Mom ↔ dad agreed; teacher ↔ child agreed."],["c","Why multiple informants matter"]],"rd":"Kochanska & Kim (2013)"},{"id":"s1q062","s":1,"t":"R","q":"Which outcome measure showed the strongest links with early attachment in Kochanska & Kim (2013)?","a":"Children’s own self-reports at age 8","d":["Mothers’ ratings at age 8","Fathers’ ratings at age 8","Teachers’ internalizing ratings at 6½","Observers’ ratings of peer play"],"e":"The strongest findings were for children’s self-reported total problems, supporting the value of asking children about their inner experiences alongside adult ratings.","n":[["k","Strongest effects: child self-reports."],["x","Parents’ ratings showed no significant attachment effects."]],"rd":"Kochanska & Kim (2013)"},{"id":"s1q063","s":1,"t":"R","q":"What was the Dominic-R in Kochanska & Kim (2013)?","a":"A vignette-based clinical interview given to children","d":["A DSM-based symptom checklist completed by parents","A classroom behaviour checklist completed by teachers","A coding system for Strange Situation reunions","A physiological measure of children’s stress"],"e":"The Dominic-R is a roughly 30-minute computerized interview for 6- to 11-year-olds. Children say whether vignettes describing problems are like them. Parents and teachers used the CSI-4 checklist.","n":[["k","Dominic-R = children’s own interview (vignettes)."],["x","Parents and teachers used the CSI-4 checklist."]],"rd":"Kochanska & Kim (2013)"},{"id":"s1q064","s":1,"t":"R","q":"Which continuous attachment dimension showed a “dual risk” pattern in Kochanska & Kim (2013)?","a":"High resistance toward both parents → teacher-rated externalizing","d":["High avoidance toward both parents → child-reported internalizing problems","High proximity seeking with both parents → fewer problems","Disorganization with the mother → problems on every single measure","Low resistance toward both parents → more anxiety later"],"e":"Children highly ==resistant== with both parents were rated by teachers as especially high in externalizing problems, possibly reflecting later difficulty with emotion regulation.","n":[["k","Resistance with mom AND dad → teacher-rated externalizing (==dual risk==)."],["c","Resistant = ambivalent, angry reunion pattern"]],"rd":"Kochanska & Kim (2013)"},{"id":"s1q065","s":1,"t":"R","q":"What did Kochanska & Kim (2013) find about disorganized attachment?","a":"Disorganization with the father → mother-rated externalizing","d":["Disorganization with the mother predicted teacher-rated problems","Disorganization with either parent predicted every outcome","Disorganization was too rare to be analyzed at all","Disorganization with the father predicted fewer problems"],"e":"The only disorganization effect: children more ==disorganized== with their fathers were rated by mothers at age 8 as having more externalizing problems. Surprisingly, there were no findings for disorganization with the mother.","n":[["k","==Disorganized== with dad → mom-rated externalizing."],["x","No effect for disorganization with mom (needs replication)."]],"rd":"Kochanska & Kim (2013)"},{"id":"s1q066","s":1,"t":"R","q":"Which limitation did Kochanska & Kim (2013) acknowledge?","a":["A low-risk sample with limited ethnic diversity and modest size","Both Strange Situations ran within about 3 weeks in the same room"],"d":["Attachment was measured only with parent questionnaires, not observation","Only mothers reported on children’s behaviour problems","There was no follow-up of the children beyond infancy","Fathers were assessed several years after the mothers were"],"e":"Limitations: low-risk, normative sample with limited diversity and modest size, and the two Strange Situations ran close in time in the same room. Strengths: longitudinal design, four informants, both parents, gold-standard measures.","n":[["k","Limits: low-risk, low diversity, small; sessions close together."],["k","Strengths: longitudinal, 4 informants, both parents."]],"rd":"Kochanska & Kim (2013)"},{"id":"s1q067","s":1,"t":"LR","q":"In lecture, what critique was raised about Kochanska & Kim’s (2013) sample?","a":"It left out many family structures (only
