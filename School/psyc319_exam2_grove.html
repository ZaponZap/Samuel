 the home environment may lack."]],"v":"geoffroy","vp":"f"},{"id":"s4q036","s":4,"t":"L","q":"Why might high-quality childcare benefit cognitive skills more for children from low-SES families than for children from high-SES families?","a":"It may add learning opportunities that are harder to provide with limited home resources","d":["Low-SES children spend fewer hours in childcare each week, so each hour counts for more overall","High-SES children are usually placed in lower-quality centres than low-SES children in the same city","Low-SES parents are less sensitive, so attachment improves first and cognition follows later","Cognitive tests are biased in favour of children who have attended childcare","High-SES children are harmed by the structured learning activities used in centres"],"e":"A ==compensatory== account: high-quality care offers rich language, scaffolding, and activities. Children whose homes have fewer resources gain more from this added input, while well-resourced homes already provide much of it.","n":[["k","==Compensation==: care adds most where home resources are lowest."],["x","It isn’t that low-SES parents love their children less."]]},{"id":"s4q037","s":4,"t":"L","q":"Wren and Felix, both 3, have warm, sensitive parents. Wren’s caregivers scaffold play and respond to each child; Felix’s understaffed centre leaves children mostly unattended. Which prediction is MOST clearly supported?","a":"Wren will show stronger cognitive and language skills","d":["Wren will show more behaviour problems","Wren will be more likely to be securely attached to her parents","Felix will show stronger language skills because he plays independently","Felix will be more securely attached because he relies on his parents","Both children will have identical outcomes because parenting is the same"],"e":"Higher ==process quality== is linked to ==better cognitive/language skills== and fewer behaviour problems. Attachment shows no overall link to childcare, and NICHD-style risk only appeared with poor care plus poor parenting, which neither child has.","n":[["k","Quality → cognition (and fewer behaviour problems)."],["x","Attachment isn’t predicted by care quality when parenting is good."],["c","Twin of practice Q5 (Rasia & Raj)."]],"v":"ccEffects","vp":"f"},{"id":"s4q038","s":4,"t":"L","q":"Hana has been cared for at home by her father since birth. Ezra has attended a childcare centre full-time since 10 months. Which prediction about Ezra, compared with Hana, is NOT supported by research?","a":"Ezra will be less likely to be securely attached","d":["Ezra may show somewhat more behaviour problems","Ezra may show stronger cognitive skills","Ezra’s outcomes will depend partly on the quality of his centre","Ezra’s outcomes will depend partly on parenting at home","Ezra may show stronger school-readiness skills"],"e":"Childcare shows ==no overall link with attachment==, so “less likely to be securely attached” is the unsupported claim. Early, full-time centre care is linked to ==more behaviour-problem risk== and ==more cognitive benefit==, and quality and parenting shape all of it.","n":[["k","Centre since infancy: behaviour risk ↑ · cognition ↑ · attachment ≈."],["c","Twin of the Oct 21 Austin & Blake question."]],"v":"ccEffects","vp":"f"},{"id":"s4q039","s":4,"t":"L","q":"Which statement best captures the overall pattern of childcare effects from lecture?","a":"Centre care: more behaviour-problem risk, more cognitive benefit, no overall attachment link","d":["Centre care: less behaviour-problem risk, less cognitive benefit, and more insecure attachment","Centre care: more behaviour-problem risk, less cognitive benefit, and more insecure attachment","Home-based care: more behaviour problems, more cognitive benefit, and more secure attachment","All types of care have identical links with behaviour, cognition, and attachment security","Centre care: more secure attachment and fewer behaviour problems, with no cognitive link"],"e":"The trade-off pattern: ==centre-based care== → ==more behaviour-problem risk== (especially with many hours/early start) but ==more cognitive/language benefit==, while ==attachment shows no overall link==. Quality matters throughout.","n":[["k","Centre: behaviour risk ↑, cognition ↑, attachment ≈."],["m","A seesaw: social behaviour down, smarts up, attachment level."]],"v":"ccEffects","vp":"f"},{"id":"s4q040","s":4,"t":"L","q":"Across childcare outcomes, what did lecture call the most consistently important factor?","a":"Quality of care","d":["Type of care","Number of hours in care","Age at entry into care","Family income","Number of different arrangements"],"e":"Lecture’s policy slide: “==The most consistently important factor for childcare is quality==.” It matters for behaviour problems, cognition, and possibly attachment when combined with parenting.","n":[["k","#1 factor = ==QUALITY==."]],"v":"ccPolicy","vp":"f"},{"id":"s4q041","s":4,"t":"L","q":"According to lecture, why do many parents end up in non-optimal childcare arrangements?","a":"Demand for affordable high-quality childcare exceeds supply","d":["Most parents can’t tell the difference between centres and home daycares","Governments limit parents’ ability to choose high-quality centres","High-quality centres refuse to accept any children under 1 year","Parents prefer low-cost care even when high quality is affordable","Quality ratings for childcare are hidden from parents by law"],"e":"Lecture: “In almost every location, the ==demand for affordable high-quality childcare exceeds supply==,” which can lead parents to make ==non-optimal arrangements==.","n":[["k","Demand > supply → ==non-optimal arrangements==."],["c","Links back to economic circumstances in decisions."]],"v":"ccPolicy","vp":"f"},{"id":"s4q042","s":4,"t":"L","q":"A government wants to lower the behaviour-problem risk linked to starting long hours of centre care in the first year. Which policy most directly targets that risk?","a":"Longer paid parental leave, so infants can start care later","d":["A public campaign about the benefits of centre-based care","Higher subsidies for centres that accept infants under 6 months","Requiring all children to attend centre care by 12 months","Tax credits for parents who use relative care at any age","Longer school days for children aged 6 and up"],"e":"Behaviour-problem risk is linked to centre care that begins ==early (< 1 year)== with ==high hours==. ==Parental leave policies== (named in lecture) let families delay entry or reduce hours.","n":[["k","Early-start risk → ==parental leave== policy."],["c","Policy ideas: leave · high-quality programs · accreditation/education · rating systems · public education."]],"v":"ccPolicy","vp":"f"},{"id":"s4q043","s":4,"t":"L","q":"Parents in a city say they can’t tell which daycares are good. Which policy idea from lecture best addresses this problem?","a":"Quality rating systems plus public education on spotting good care","d":["Parental leave policies that let families delay their child’s entry into care","Banning home-based childcare so that all families must use licensed centres","Lowering the minimum training required to work in childcare","Capping childcare fees at one flat rate for every centre","Requiring a parent to stay home until each child turns 3"],"e":"Lecture listed ==quality rating systems== and ==public education on how to identify high-quality care== as ways research can inform policy, helping parents judge both structural and process quality.","n":[["k","“Can’t judge quality” → ==rating systems + public education==."]]},{"id":"s4q044","s":4,"t":"L","q":"A province wants to raise process quality across its centres. Which policy from lecture most directly targets process quality?","a":"Accreditation and education programs for providers","d":["Longer paid parental leave for parents of infants","Higher fees to fund new buildings and playgrounds","Tax credits for families who choose relative care","Shorter daily opening hours for all licensed centres","Allowing larger group sizes to shorten waitlists"],"e":"Process quality is about caregiver–child interactions. ==Accreditation and education for providers== builds caregivers’ skills in sensitive, responsive, scaffolded care. Larger groups would lower structural quality and likely process quality too.","n":[["k","Better caregivers → better interactions → ==process quality==."],["x","Larger groups hurt structural (and likely process) quality."]]},{"id":"s4q045","s":4,"t":"L","q":"Based on lecture’s childcare research, which policy would be LEAST supported?","a":"Banning centre-based care for all children under 3","d":["Funding government programs for high-quality childcare","Creating quality rating systems for childcare settings","Offering education and accreditation for childcare providers","Extending paid parental leave","Running public education on how to spot high-quality care"],"e":"Childcare shows ==no overall link to attachment== and is linked to ==cognitive benefits== (especially high-quality, centre-based care for low-SES children). The consistent message is to ==improve quality==, not to ban care.","n":[["k","Evidence → improve ==quality==, not ban care."],["x","Behaviour risk is small, correlational, and tied to quality and hours."]]},{"id":"s4q046","s":4,"t":"LR","q":"How could Bernier et al.’s (2024) findings inform childcare policy?","a":"Accessible care of at least acceptable quality might protect attachment in at-risk dyads","d":["Childcare should be restricted to families whose mothers are rated as highly sensitive","Universal childcare should be avoided because it weakens mother–child attachment bonds","Childcare hours should be capped at 20 hours a week for all children under age 3","Mothers with low sensitivity should be required to stay home with their infants","Childcare policy can ignore quality, since quality showed no effect in the study"],"e":"Bernier et al. found ==no harm on average== and a ==protective association== for children of less sensitive or less autonomy-supportive mothers, in a system where quality is mostly acceptable to good. That points to ==accessible care of at least acceptable quality== as possible early, population-based support.","n":[["k","Accessible, decent-quality care may protect ==at-risk dyads==."],["x","Bernier did NOT measure quality, so quality still matters."]],"rd":"Bernier et al. (2024)"},{"id":"s4q047","s":4,"t":"R","q":"How many mother–child dyads did Bernier et al. (2024) study, and how were families recruited?","a":"236 dyads, recruited from randomly generated birth lists","d":["About 1,150 dyads from 10 US research sites","236 dyads recruited through Quebec childcare centres","64 dyads recruited through Montreal elementary schools","About 500 dyads from a national online parenting survey","236 dyads recruited from rural paediatric clinics"],"e":"Bernier et al. studied ==236 mother–child dyads== recruited from ==birth lists randomly generated by the Quebec Ministry of Health and Social Services== for a large metropolitan area. The 1,150 figure is the NICHD SECCYD sample.","n":[["n","Bernier N = ==236==; NICHD N ≈ 1,150."],["x","Recruited from birth lists, NOT through childcare centres (avoids selection by care use)."]],"rd":"Bernier et al. (2024)"},{"id":"s4q048","s":4,"t":"R","q":"How did Bernier et al. (2024) measure mother–child attachment security?","a":"With the observer Attachment Q-Sort, after home visits at 15 and 25 months","d":["With the Strange Situation in the university lab at 12 and again at 18 months","With mothers’ own questionnaire ratings completed at both 15 and 25 months","With the Adult Attachment Interview given to each mother at intake","With teacher ratings collected once the children had entered school","With the Strange Situation at 15 months and the observer Q-Sort at 25 months"],"e":"Bernier et al. used the ==observer Attachment Q-Sort (AQS)==, scored by trained assistants after ==home visits at 15 and 25 months==. It appears to be the first childcare study to use the observer-AQS.","n":[["k","Bernier measure = ==observer AQS== at home, 15 & 25 mo."],["x","Most earlier childcare studies used the Strange Situation."]],"rd":"Bernier et al. (2024)"},{"id":"s4q049","s":4,"t":"R","q":"Why did Bernier et al. (2024) value the observer Attachment Q-Sort over the Strange Situation for this question?","a":"It predicts some outcomes about twice as well and reflects everyday home life","d":["It can be completed by mothers themselves, which saves researchers a great deal of time","It sorts children into the four standard attachment categories more reliably than other tools","It is the only measure validated for children who attend childcare","It measures attachment to fathers and mothers in the same session","It requires no rater training, so observers can’t introduce bias"],"e":"The observer-AQS shows ==about twice the predictive validity== of the Strange Situation for some outcomes. Because it’s based on ==home observations==, it adds a complementary, everyday window on the relationship. Its continuous scores also boost statistical power.","n":[["k","AQS: ~2× predictive validity, home-based, continuous scores."],["x","Observer-rated, not mother-reported."]],"rd":"Bernier et al. (2024)"},{"id":"s4q050","s":4,"t":"R","q":"In Bernier et al. (2024), a child cared for at home by a nanny was counted as…","a":"participating in childcare, because the concern is time away from parents","d":["receiving exclusive parental care, because the care took place in the child’s own home","a separate group that was analysed apart from all other children in the sample","excluded from the study because of mixed or unclear care arrangements","attending centre care, because the nanny was being paid for her care","missing data, because weekly hours couldn’t be measured reliably at home"],"e":"Since worries about childcare centre on ==separations and time away from parents==, all infants not under exclusive parental care, including those cared for at home by a nanny or relative, counted as ==participating in childcare==. Results were nearly identical when these children were reclassified or excluded.","n":[["k","Any non-parental care = childcare (concern = ==separation from parents==)."]],"rd":"Bernier et al. (2024)"},{"id":"s4q051","s":4,"t":"R","q":"About what share of children in Bernier et al.’s (2024) sample were under exclusive parental care at around 12 months?","a":"About 40%","d":["About 10%","About 25%","About 60%","About 85%","About 95%"],"e":"Of the 236 children, ==141 (59.7%)== had some childcare (122 outside the home, 19 at home), while ==95 (40.3%)== were under exclusive parental care.","n":[["n","~60% some childcare · ~40% exclusive parental care."]],"rd":"Bernier et al. (2024)"},{"id":"s4q052","s":4,"t":"R","q":"Bernier et al. (2024) deliberately ran many childcare comparisons without correcting for multiple tests. Why?","a":"Lenient tests raise chance findings, which works against their prediction of no effect","d":["They expected large childcare effects and wanted to be sure to detect every one of them","Corrections for multiple tests were not possible with a sample of only 236 mother–child dyads","Their journal required uncorrected tests for all studies of childcare and attachment","They wanted to conceal the fact that most of their childcare effects were significant","Corrections would have made their key interaction effects disappear from the results"],"e":"They predicted ==no childcare effects==. A permissive analysis plan increases ==Type I error== (false positives), which runs against that hypothesis. Finding nothing even under these lenient conditions argues strongly against childcare effects in the sample.","n":[["k","Lenient tests + still no effect = strong evidence of ==no main effect==."],["m","Stacking the deck against yourself, and still winning."]],"rd":"Bernier et al. (2024)"},{"id":"s4q053","s":4,"t":"R","q":"Which three ways of defining childcare exposure did Bernier et al. (2024) test?","a":"Any care vs none, at least 20 h/week vs less, and exact hours per week","d":["Centre vs home care, public vs private care, and full-time vs part-time care","Any care vs none, at least 10 h/week vs less, and the child’s age at entry","Number of arrangements, observed quality ratings, and caregiver-to-child ratios","Age at entry into care, total hours of care, and caregivers’ level of training","Exclusive maternal care, paternal care, and relative care"],"e":"They compared ==any childcare vs none==, a ==20-hour/week threshold== (only 14 children were under 10 hours, so the 10-hour threshold couldn’t be tested), and ==continuous hours per week==. All were null.","n":[["n","Any vs none · ≥ 20 h/week · hours per week → all ==null==."]],"rd":"Bernier et al. (2024)"},{"id":"s4q054","s":4,"t":"R","q":"In Bernier et al. (2024), the childcare × sensitivity interaction predicted attachment at one age, and the childcare × autonomy support interaction at the other. Which is correct?","a":"Sensitivity interacted at 15 months; autonomy support at 25 months","d":["Sensitivity interacted at 25 months; autonomy support at 15 months","Both interactions were significant at 15 months but not at 25","Both interactions were significant at 25 months but not at 15","Both interactions were significant at both 15 and 25 months","Neither interaction was significant at 15 or at 25 months"],"e":"Childcare × ==sensitivity== predicted ==15-month== attachment; childcare × ==autonomy support== predicted ==25-month== attachment. The authors suggest the autonomy-support process may need more time to unfold, since autonomy support was measured at 15 months.","n":[["n","Sensitivity → 15 mo · Autonomy support → 25 mo."],["m","S comes first (15), A arrives later (25)."]],"v":"bernierDesign","vp":"f","rd":"Bernier et al. (2024)"},{"id":"s4q055","s":4,"t":"R","q":"How did Bernier et al. (2024) measure maternal autonomy support?","a":"By coding a video of mothers helping with slightly-too-hard puzzles","d":["With a questionnaire mothers completed about their parenting goals","By observing mothers during Strange Situation reunion episodes","By interviewing childcare staff about each mother’s behaviour","With the Maternal Behavior Q-Sort scored after the 12-month visit","By coding mothers’ speech during recorded bedtime routines"],"e":"At 15 months, mothers helped children with two puzzles chosen to be ==slightly too difficult==. The 10-minute interaction was ==videotaped and coded== for adapting to the child’s needs, encouragement, perspective-taking, and letting the child make choices. Sensitivity was measured separately with the Maternal Behavior Q-Sort at 12 months.","n":[["k","Autonomy support = coded ==puzzle task== at 15 mo."],["x","Sensitivity = Maternal Behavior Q-Sort at 12 mo."]],"rd":"Bernier et al. (2024)"},{"id":"s4q056","s":4,"t":"R","q":"Baker et al. (2008) concluded that Quebec’s universal childcare led to more hostile parenting. Which critique do Bernier et al. (2024) make?","a":"They didn’t check whether families used care and relied on parents’ self-reports","d":["They studied only US families, so their results can’t apply to Quebec’s system","They used the observer Q-Sort, which is overly sensitive to small changes in behaviour","They studied only families who used centre care, ignoring every other type of care","They measured attachment security but never measured parenting itself","They relied on teacher reports that were collected years after the policy began"],"e":"Baker et al. compared provinces before and after the policy and included ==all families, whether or not they used childcare== (32–50% of the Quebec sample used none). They also relied on ==parents’ self-reports==, which correlate poorly with observed parenting and are biased by social desirability.","n":[["k","Baker flaws: didn’t measure ==actual use== + ==self-report== bias."],["c","Bernier used real participation + observation."]],"rd":"Bernier et al. (2024)"},{"id":"s4q057","s":4,"t":"R","q":"Which mechanism do Bernier et al. (2024) propose for why childcare might protect attachment in at-risk dyads?","a":"Trained caregivers may model sensitive care and build skills children carry home","d":["Childcare lets mothers work fewer hours, giving them more free time at home with children","Children in childcare gradually stop needing comfort from their mothers as they grow","Childcare staff replace the mother as the child’s primary attachment figure over time","Children forget early negative interactions once they begin childcare","Childcare raises family income, which directly increases attachment security"],"e":"Bernier et al. suggest several routes: ==less intensive exposure== to less sensitive care; caregivers who promote ==self-regulation and help-seeking== children carry home; secure relationships with caregivers shaping working models; caregivers ==modelling and informally guiding parents==; and ==relief from parenting stress==.","n":[["k","Routes: less exposure · child skills · caregiver models · parent guidance · stress relief."],["x","Caregivers add to the mother, they don’t replace her."]],"rd":"Bernier et al. (2024)"},{"id":"s4q058","s":4,"t":"R","q":"Which is a limitation Bernier et al. (2024) acknowledge?","a":["They had no measure of the childcare quality each child received","They did not assess father–child attachment","Each maternal behaviour was measured once, at a different age, so behaviour type is confounded with age"],"d":["They used only the Strange Situation, which has weak predictive validity","Their sample was drawn entirely from low-income families","They randomly assigned children to childcare, raising ethical concerns","They had no observational measures of parenting","They studied childcare in a country with no childcare regulations"],"e":"Limitations include ==no childcare-quality measure== (though Quebec quality is generally acceptable to good), ==no father–child attachment==, each maternal behaviour measured ==once at a different age==, a ==non-experimental== design, and limited power for small interactions.","n":[["k","Missing: quality measure · fathers · repeated parenting measures · causality."],["x","They DID use observation, not self-report."]],"rd":"Bernier et al. (2024)"},{"id":"s4q059","s":4,"t":"R","q":"What do Bernier et al. (2024) report about childcare quality in Quebec during their study period?","a":"Mostly acceptable to good, with under 5% of children in unsatisfactory care","d":["Mostly poor, with long waitlists and high staff turnover in most centres","Excellent everywhere, because all staff were required to hold graduate degrees","Unknown, because quality was never assessed in Quebec during that period","Mixed, with about half of all children placed in unsatisfactory care","High in home-based settings but consistently poor in childcare centres"],"e":"Government and independent investigations converged: ==most settings acceptable to good==, with ==under 5% of children== in unsatisfactory care, thanks to strict rules on ratios, infrastructure, and staff qualifications. So the findings apply to care of at least acceptable quality.","n":[["n","Quebec quality: mostly acceptable–good; < 5% unsatisfactory."],["c","So don’t generalize to low-quality care."]],"rd":"Bernier et al. (2024)"},{"id":"s4q060","s":4,"t":"R","q":"According to Bernier et al. (2024), why might earlier studies like Sagi et al. (2002) in Israel have found more insecure attachment among infants in centre care?","a":"Those centres were low quality, with high infant-to-adult ratios","d":["Israeli mothers were less sensitive than Quebec mothers","Those infants entered care after 3 years of age","The study used the observer-AQS, which over-detects insecurity","Those families used several arrangements at once","Those infants were cared for by relatives in the home"],"e":"Sagi et al. found more insecurity only for ==centre care==, which in their sample meant ==low-quality settings (high infant–adult ratios)==. Other care types showed security rates like exclusive maternal care. This supports quality as the key factor.","n":[["k","Negative centre findings ↔ ==low quality== (bad ratios)."],["c","Love et al. (2003): small link between centre quality and security."]],"rd":"Bernier et al. (2024)"},{"id":"s4q061","s":4,"t":"R","q":"Did Bernier et al. (2024) find that childcare participation was related to mothers’ sensitivity or autonomy support?","a":"No; childcare use was unrelated to either maternal behaviour","d":["Yes; mothers using childcare became less sensitive over time","Yes; mothers using childcare became more autonomy-supportive","Yes; only mothers using more than 20 hours became less sensitive","They did not examine this question","Yes; childcare raised sensitivity but lowered autonomy support"],"e":"There was ==no evidence of childcare effects on maternal sensitivity or autonomy support==, considered categorically or continuously, consistent with studies showing no link between childcare and observed parenting.","n":[["k","Childcare ≠ worse mothering."],["c","Contradicts Baker et al.’s self-report-based claim."]],"rd":"Bernier et al. (2024)"},{"id":"s4q062","s":4,"t":"R","q":"What is the main conclusion of Bernier et al. (2024)?","a":"Care of acceptable quality is unlikely to harm attachment and may help at-risk dyads","d":["Childcare harms mother–child attachment unless mothers are rated as highly sensitive","Childcare should begin before 12 months of age to maximize later secure attachment","The NICHD findings no longer apply, because childcare now harms attachment in most contexts","Attachment depends only on hours spent in childcare, not on any parenting at home","Childcare quality has no bearing on attachment security in any context"],"e":"Their conclusion: ==use of childcare of at least acceptable quality is unlikely to have a negative impact== on mother–child attachment and ==may have positive effects for dyads at risk== of insecure attachment.","n":[["k","Decent-quality care: no harm on average, possible help for ==at-risk dyads==."]],"rd":"Bernier et al. (2024)"},{"id":"s4q063","s":4,"t":"R","q":"Bernier et al. (2024) say the NICHD SECCYD findings apply specifically to which population?","a":"US children experiencing non-maternal care in the early 1990s","d":["Canadian children in government-subsidized care during the 2000s","Children of all nations who attend centre-based care full-time","US children from low-income families in the 1970s","European children in universal childcare systems today","US children who started childcare after age 3"],"e":"Quoting Friedman and Boyle (2008), Bernier et al. note that NICHD results apply to ==“US children experiencing nonmaternal care in the early 1990s,”== which is why new data from ==other countries and eras== were needed.","n":[["k","NICHD = US, early 1990s → need other contexts (like Quebec)."],["c","Same caution as lecture: research is mostly North American."]],"rd":"Bernier et al. (2024)"},{"id":"s4q064","s":4,"t":"L","q":"Researchers find that toddlers in centres with better ratios also have better vocabularies. A colleague says, “So improving ratios will raise vocabulary.” What is the best response based on lecture?","a":"Maybe, but it’s correlational; families choosing well-staffed centres may differ","d":["Yes, ratios are process quality, which directly causes vocabulary growth in toddlers","No, ratios have been found to be unrelated to any child outcome in childcare research","Yes, because childcare effects are larger than parenting effects","No, vocabulary is shaped only by parental care, never by childcare","Yes, because random assignment is standard in childcare research"],"e":"Ratios are ==structural quality==, which may work indirectly through interactions. But childcare research is ==correlational==: families who access well-staffed centres may also differ in income, education, or parenting.","n":[["k","Correlational + selection → be cautious about cause."],["x","Ratios are structural, not process."]]},{"id":"s4q065","s":4,"t":"L","q":"A study finds no difference in attachment between children in childcare and children at home. Which follow-up question best reflects lecture’s view of how childcare effects work?","a":"Does the link differ by care quality and by parenting at home?","d":["Did the researchers wait long enough for any harm to appear?","Were the mothers in childcare families working full-time hours?","Did any of the children have older siblings in the same centre?","Was attachment rated by teachers instead of by trained observers?","Did the children in childcare also watch more television at home?"],"e":"A null main effect can hide ==moderation==: NICHD hinted at risk when ==poor care met poor parenting==, and Bernier found ==protection when parenting was less ideal==. Lecture stressed many factors: quality, type, age, hours, arrangements, SES, child traits.","n":[["k","No main effect ≠ no effect for anyone → check ==moderators==."],["c","Bernier = classic moderation study."]],"v":"dualRisk","vp":"f"},{"id":"s4q066","s":4,"t":"L","q":"Which comparison best shows why “type of care” and “quality of care” must be considered separately?","a":"Two centres of very different quality can be linked to very different outcomes","d":["Centres are always higher quality than home daycares, so type sets quality","Home daycares are always higher quality than centres because groups are small","Type of care determines its quality, so the two can’t really be separated","Quality only matters for in-home care, while type matters for centres","Type of care matters for attachment, while quality matters only for cognition"],"e":"Type (centre, family home, in-home) and quality (process + structural) are different dimensions. Within any type, quality can range from poor to excellent, and lecture called ==quality the most consistently important factor==.","n":[["k","Type ≠ quality. Same type can be great or poor."]]},{"id":"s4q067","s":4,"t":"L","q":"A parent asks, “Should I worry that daycare will hurt my bond with my baby?” Which answer best reflects lecture and Bernier et al. (2024)?","a":"On average no; your sensitivity at home matters more, and good care may even help","d":["Yes, any childcare that starts before 12 months weakens the bond with parents for good","Yes, but only if your child spends more than 10 hours a week in any form of childcare","No, because babies don’t form any attachments until around age 2","No, because childcare staff will become your child’s main attachment figure","It depends only on whether you choose a centre or a home-based daycare"],"e":"Both NICHD and Bernier found ==no overall childcare effect on attachment==. ==Parenting at home== shapes attachment far more, and in Bernier’s data, decent-quality care was ==protective== when parenting was less ideal.","n":[["k","Attachment depends on ==parenting at home== more than on childcare."],["x","Attachments do form in the first year (over the first 2 years)."]]},{"id":"s4q068","s":4,"t":"L","q":"Which policy question would lecture say research is LEAST able to answer with confidence right now?","a":"Whether childcare causes long-term behaviour problems","d":["Whether childcare quality matters for children’s outcomes","Whether demand for affordable quality care exceeds supply","Whether childcare has an overall link with attachment","Whether families use different types of childcare arrangements","Whether economic circumstances shape childcare decisions"],"e":"Behaviour-problem findings are ==mixed== and ==correlational==, so causal, long-term claims are the weakest. Quality’s importance, supply shortages, and the lack of an overall attachment link are much more consistent.","n":[["k","Weakest evidence = causal claims about ==behaviour problems==."],["c","All childcare research is correlational."]]},{"id":"s5q001","s":5,"t":"L","q":"Lecture opened with a quote warning that children are “constantly exposed to sights and sounds… undreamed of in previous generations,” a powerful force for good or evil. What was the point of revealing it came from a 1955 US Senate hearing?","a":"Worries about new media aren’t new; each new medium draws similar fears","d":["Research from the 1950s settled the debate about media effects for good","Media concerns only began once smartphones and social media arrived","Governments have historically banned each new medium for children","Older media like TV was more harmful to children than today’s media","Senators in 1955 were mainly worried about early arcade video games"],"e":"The quote sounds modern, but it’s from a ==1955 Senate hearing== (the TV era). Lecture’s theme: media is ==constantly changing==, and each new medium brings a similar wave of hopes and fears.","n":[["k","1955 quote → media panics ==recur== with each new technology."],["m","Comics → TV → games → internet → phones → AI."]],"v":"panic","vp":"f"},{"id":"s5q002","s":5,"t":"L","q":"Earlier AAP guidance (2016) for young children was organized mainly around which idea?","a":"Age-based screen-time limits for individual families to follow","d":["Regulating media companies’ algorithms and advertising to children","Letting each family decide, with no age-based recommendations","Banning all screen media, including video chat, until age 6","Encouraging 3+ hours a day of educational media for preschoolers","Focusing only on adolescents’ use of social media platforms"],"e":"The 2016 AAP guidance centred on ==age-based screen-time limits==: avoid screen media other than video chatting for children under ~18 months, introduce high-quality content with a parent at 18–24 months, and limit ages 2–5 to ==about 1 hour/day== of high-quality programming, co-viewed.","n":[["k","Old guidance = ==time limits by age== for individual families."],["c","2026 AAP shifts to the whole ==digital ecosystem==."]],"v":"oldNew","vp":"f"},{"id":"s5q003","s":5,"t":"LR","q":"What is the biggest conceptual shift in the new AAP (2026) policy statement compared with earlier screen-time guidance?","a":"It treats media as a digital ecosystem within broader systems, not just family screen time","d":["It replaces all earlier advice with a strict zero-screens rule for every child under age 5","It places full responsibility on parents to set and enforce daily screen-time limits at home","It concludes that digital media has no measurable effect on child development","It recommends that schools give every child a personal tablet for learning","It removes all guidance about content quality and focuses only on hours"],"e":"Munzer et al. (2026) argue that today’s engagement-based ==digital ecosystem== “can no longer be thought of as ‘screen time’ for families to manage.” Using a ==socioecological model==, they give recommendations to families, providers, ==industry==, and ==policymakers==.","n":[["k","2026: from “screen time” → ==digital ecosystem== + systems."],["m","Zoom out: child → caregivers → ecosystem → systems."]],"v":"eco","vp":"f","rd":"Munzer et al. (2026)"},{"id":"s5q004","s":5,"t":"LR","q":"The AAP (2026) statement uses a socioecological model of nested “circles of care.” Which set of circles is correct, from innermost to outermost?","a":"Child → caregivers → digital ecosystem → systems and structures","d":["Child → peers → school and community → government and policy","Caregivers → child → digital ecosystem → peers and friends","Digital ecosystem → child → caregivers → culture and values","Child → digital ecosystem → caregivers → schools and teachers","Child → siblings → caregivers → media companies and industry"],"e":"The circles are the ==child== (individual characteristics), ==caregivers==, the ==digital ecosystem==, and ==larger systems and structures== (government, policy, schools, community).","n":[["k","==Child → Caregivers → Digital ecosystem → Systems==."],["c","Like Bronfenbrenner’s ecological model."]],"v":"eco","vp":"q","rd":"Munzer et al. (2026)"},{"id":"s5q005","s":5,"t":"L","q":"In class, which was listed as a PRO of the new AAP (2026) media recommendations?","a":"They share the burden with media companies and broader systems","d":["They give specific, step-by-step rules that are easy to implement","They return to strict screen-time limits for every age group","They rely only on evidence from randomized controlled trials","They focus solely on preventing cyberbullying among teens","They recommend banning smartphones for everyone under 18"],"e":"Lecture’s pros: ==more realistic for families== and ==places some of the burden on media companies and broader systems==. The main con: ==not enough specifics to implement==.","n":[["k","Pros: realistic · shares burden with ==industry/systems==."],["x","Con: ==not enough specifics== to implement."]]},{"id":"s5q006","s":5,"t":"L","q":"Which criticism of the AAP (2026) recommendations was raised in lecture?","a":"They may not give enough specifics for families to implement","d":["They place all of the burden on parents rather than companies","They ignore the role media companies play in children’s media","They are based only on research with adults, not children","They are too strict to be realistic for most busy families","They ignore content quality and focus only on total hours"],"e":"Lecture asked whether the new recommendations offer ==“not enough specifics to implement,”== even though they are more realistic and share responsibility with companies and systems.","n":[["k","Con = ==vague== → harder to put into practice."],["x","They actually shift burden AWAY from parents alone."]]},{"id":"s5q007","s":5,"t":"R","q":"What time boundaries does the AAP (2026) statement suggest when families want a specific number?","a":"Under 1 h/day for toddlers and preschoolers; 1–2+ h/day for school-age kids and teens","d":["No screens at all before age 5, then under 1 h/day for school-age children and teens","Under 2 h/day at every age, from infancy all the way through the teenage years","No time limits at all, as long as the content is labelled as educational","Under 30 min/day for all children under 12; 1 h/day for teens","Exactly 1 h/day for toddlers, rising by 1 hour with each year of age"],"e":"Limits “might range from ==<1 hour/day for toddlers and preschoolers== to ==1 to 2 hours/day or more== of entertainment (not school-related) media for school-aged children and teens.” The statement stresses that the ==most important considerations are high-quality content and prioritizing healthy activities==.","n":[["n","Toddlers/preschoolers < 1 h · school-age/teens 1–2 h+."],["k","Quality + healthy activities matter most."]],"v":"guide26","vp":"f","rd":"Munzer et al. (2026)"},{"id":"s5q008","s":5,"t":"R","q":"What does the AAP (2026) statement say about infants and digital media?","a":"Infants don’t learn from it, but occasional brief, high-quality videos aren’t harmful","d":["Infants learn language best from high-quality educational videos made for babies","Any screen exposure at all in infancy causes lasting language and attention delays","Infants should watch at least 30 minutes of educational video every day for language","Video chat is just as harmful for infants as background television","Infants begin learning well from screens once they are 6 months old"],"e":"Munzer et al.: “Infants do not learn from digital media, but ==occasionally viewing brief, high-quality videos (eg, Sesame Street) is not detrimental==.” Video chatting can offer bidirectional interaction.","n":[["k","Infants don’t learn from screens; brief high-quality viewing ≠ harm."],["c","Video deficit (DeLoache) + video chat exception (Roseberry)."]],"rd":"Munzer et al. (2026)"},{"id":"s5q009","s":5,"t":"R","q":"The AAP (2026) “5 C’s” help providers understand family media goals. Which list is correct?","a":"Child, Content, Calm, Crowding out, Communication","d":["Child, Content, Context, Control, Connection","Caregiver, Content, Calm, Cost, Communication","Child, Co-viewing, Calm, Curfew, Connection","Content, Context, Consistency, Control, Curiosity","Child, Content, Calm, Cyberbullying, Commerce"],"e":"The 5 C’s: ==Child== (strengths?), ==Content== (what are they interacting with?), ==Calm== (is media used for calming?), ==Crowding out== (what is media getting in the way of?), ==Communication== (how does the family talk about media?).","n":[["n","==Child · Content · Calm · Crowding out · Communication==."],["m","Who, what, why-soothe, what’s-lost, how-we-talk."]],"v":"fiveC","vp":"f","rd":"Munzer et al. (2026)"},{"id":"s5q010","s":5,"t":"R","q":"A provider asks a parent, “Does your son use the tablet to settle down when he’s upset?” Which of the AAP’s 5 C’s is this?","a":"Calm","d":["Child","Content","Crowding out","Communication","Context"],"e":"==Calm== asks whether children are using media for calming. For preschoolers, using devices to calm down is associated with ==weaker emotion regulation skills== and problematic media habits.","n":[["k","Media to soothe → ==Calm== C."],["c","Displaces chances to learn emotion regulation."]],"v":"fiveC","vp":"f","rd":"Munzer et al. (2026)"},{"id":"s5q011","s":5,"t":"R","q":"A provider asks, “What is screen time getting in the way of: sleep, play, homework?” Which of the 5 C’s is this?","a":"Crowding out","d":["Content","Calm","Communication","Child","Consistency"],"e":"==Crowding out== asks what digital media is displacing, such as sleep, movement, reading, play, or family time.","n":[["k","What’s displaced? → ==Crowding out==."],["c","Displacement also explains Weis & Cerankosky’s results."]],"rd":"Munzer et al. (2026)"},{"id":"s5q012","s":5,"t":"R","q":"Why does the AAP (2026) statement say its evidence base is mainly observational?","a":"Trials exposing kids to potentially harmful media aren’t ethical or feasible","d":["Media companies refuse to allow any experiments involving child users","Observational studies are always more valid than randomized experiments","Experiments on children’s media have consistently found no effects at all","The AAP is only permitted to review survey research by its own policy","Children’s screen use can’t be measured in any experimental setting"],"e":"Because ==randomized controlled trials aren’t ethically or practically feasible== for exposing children to potentially harmful media, the science is mostly ==observational and correlational==, which limits causal conclusions. They prioritize longitudinal and meta-analytic evidence.","n":[["k","No harmful-exposure RCTs → mostly ==correlational== evidence."],["c","Weis & Cerankosky is a rare randomized study."]],"rd":"Munzer et al. (2026)"},{"id":"s5q013","s":5,"t":"R","q":"Which recommendation for families appears in the AAP (2026) statement?","a":["Create phone-free zones at meals, in bedrooms, and before bed","Consider a shared family tablet over a personal one","Use a Family Media Plan to set family-wide boundaries"],"d":["Give each child a personal tablet by age 3 to support learning","Keep the TV on in the background for extra language exposure","Wait until exactly age 13 before allowing any smartphone use","Use devices to help toddlers calm down during tantrums","Let children watch videos in bed to help them fall asleep"],"e":"Family recommendations include a ==Family Media Plan==, ==screen-free zones== (meals, bedrooms, an hour before bed, homework), a ==shared family tablet==, protecting sleep, and choosing quality content. The statement says ==no specific age== points to phone readiness.","n":[["k","Family Media Plan · phone-free zones · shared tablet · protect sleep."],["x","No magic phone age; readiness varies."]],"rd":"Munzer et al. (2026)"},{"id":"s5q014","s":5,"t":"R","q":"According to the AAP (2026) statement, what does research say about the right age for a teen’s first smartphone?","a":"Research doesn’t point to a specific age; readiness varies by teen","d":["Research shows that phones are safe and beneficial for children from age 10","Research shows that teens should wait until age 16 for their first phone","Research shows the right age is exactly 13, when social media is allowed","Research shows earlier ownership benefits girls more than boys","Research shows first phones should be given at school entry"],"e":"“==Research does not point to a specific age== for teen smartphone readiness, and it varies by teen.” Considerations include digital literacy, truthfulness with caregivers, handling social conflict, and practical needs. Earlier ownership for girls may be linked to ==worse== behavioural adjustment.","n":[["k","Phone readiness = individual, not an age."],["x","Earlier ownership for girls → worse adjustment (not better)."]],"rd":"Munzer et al. (2026)"},{"id":"s5q015","s":5,"t":"R","q":"Which recommendation does the AAP (2026) statement direct at digital media COMPANIES?","a":["Make safety and privacy the default, e.g., autoplay and chat off","Avoid targeted advertising to minors","Provide algorithmic transparency about feeds"],"d":["Require parents to set every privacy and safety setting themselves","Add more badges and rewards to keep children engaged with apps","Use endless scroll so children don’t need to click for more content","Collect more data on children to personalize their content feeds","Leave all content moderation decisions entirely to families"],"e":"Industry recommendations: ==child-centred design==, recognizing child users, ==safety and privacy by default== (autoplay off, no targeted ads to minors, option to turn off algorithmic feeds, chat off), and ==transparency==.","n":[["k","Industry: ==safety by default== · no targeted ads · transparency."],["x","Badges, endless scroll, and data collection are the problems."]],"rd":"Munzer et al. (2026)"},{"id":"s5q016","s":5,"t":"R","q":"Which recommendation does the AAP (2026) statement direct at POLICYMAKERS?","a":["Fund “third spaces” like libraries, parks, and community centres","Enact universal erasure laws so teens can remove content","Apply product-safety rules like those for food and cars"],"d":["Require every family to submit a monthly screen-time log","Ban all video games for children under the age of 12","Fund ad-supported apps so that all media can be free","Remove school phone policies to support digital learning","Leave all online age checks up to the app users themselves"],"e":"Policy recommendations include funding ==third spaces==, funding child-centred nonprofit media, ==protecting learning== (school phone policies), effective privacy-preserving ==age assurance==, regulating harmful content, ==universal erasure== laws, funding research, and ==safety reporting/certification== like other consumer products.","n":[["k","Policy: third spaces · erasure laws · age assurance · product-safety rules."],["c","Fits lecture: broader systems shape children’s media."]],"rd":"Munzer et al. (2026)"},{"id":"s5q017","s":5,"t":"R","q":"Why do Munzer et al. (2026) recommend funding nonprofit child-centred media such as PBS Kids and Sesame Workshop?","a":"They have the strongest evidence of benefit and fewer distracting ads","d":["They are the only media that children can legally access in public schools","They are designed to maximize the time children spend engaged with screens","They remove the need for any caregiver co-viewing or discussion","They are required for school readiness in all US states","They teach children to recognize and resist algorithmic feeds"],"e":"Nonprofits like ==PBS Kids== and ==Sesame Workshop== use child-centred design and ==“have the strongest evidence base for benefitting users,”== with fewer ads that distract from learning.","n":[["k","Nonprofit, child-centred media = strongest evidence of benefit."],["c","Lecture: Sesame Street, Blue’s Clues, Dora, SuperWhy boost learning."]],"rd":"Munzer et al. (2026)"},{"id":"s5q018","s":5,"t":"R","q":"Munzer et al. (2026) define “engagement-based design” as…","a":"design that competes for attention, interaction, and data, often for revenue","d":["design that matches content to a child’s developmental needs and abilities","design that encourages families to use media together and talk about it","design that automatically limits how long children can use an app","design that teaches children critical thinking about online content","design that removes ads and in-app purchases from children’s apps"],"e":"==Engagement-based design== competes for attention, interaction, and data, often incentivized by revenue (also called persuasive, profit-driven, or manipulative design). ==Child-centred design== is developmentally appropriate and protects privacy, safety, learning, and well-being.","n":[["k","Engagement-based = ==attention + data → revenue==."],["x","Child-centred = developmentally appropriate, private, safe."]],"rd":"Munzer et al. (2026)"},{"id":"s5q019","s":5,"t":"L","q":"What did DeLoache et al. (2010) find when infants watched a popular word-learning DVD at home for a month?","a":"No more word learning than controls; parents teaching words worked best","d":["More word learning than infants who were taught the same words by their parents","Word learning only when infants watched alone, without a parent in the room","More nouns but fewer verbs learned than infants in the no-video control group","Strong word learning at first, but forgetting within about a week","Word learning only when the DVD showed real household objects"],"e":"Infants who watched the DVD ==learned no more words than a no-video control==. The most learning came when ==parents taught the words in everyday interaction==. Lecture’s point: infants (~18 months–3 years) have difficulty learning from screens compared with face-to-face interaction.","n":[["k","Video ≈ no learning; ==face-to-face teaching wins==."],["m","“Video deficit”: babies don’t learn much from TV."]],"v":"deloache","vp":"f"},{"id":"s5q020","s":5,"t":"L","q":"Roseberry et al. (2014) taught toddlers new verbs in three conditions. Which pattern did they find?","a":"Learning from live interaction and video chat, but not from pre-recorded video","d":["Learning only from live interaction, and not from either kind of video condition","Learning from both kinds of video, but surprisingly not from live interaction","Equal learning across all three conditions, including the pre-recorded video","Learning from pre-recorded video, but not from interactive video chat","Learning from video chat only when a parent was not in the room"],"e":"Learning happened with ==live interaction== and ==contingent video chat== (Zoom, Skype, FaceTime), but ==not with non-contingent (pre-recorded) video==. The key ingredient is ==social contingency==: a partner who responds to the child.","n":[["k","Learning needs ==contingency==, not just a face on a screen."],["m","Video chat talks BACK; TV doesn’t."]],"v":"roseberry","vp":"q"},{"id":"s5q021","s":5,"t":"L","q":"Ava (16 months) hears a new word from her dad at breakfast, Ben hears it from his grandma on FaceTime, and Cal hears it from a cartoon. Who is LEAST likely to learn the word?","a":"Cal, because pre-recorded video doesn’t respond to him","d":["Ben, because any screen blocks infant word learning","Ava, because breakfast routines are too distracting","Ben and Cal equally, because both of them used screens","All three equally, because they heard the same word","Ava and Ben, because both had to share attention"],"e":"Face-to-face and ==contingent video chat== both support toddler word learning. A cartoon is ==non-contingent==, so Cal is least likely to learn (Roseberry et al., 2014).","n":[["k","FaceTime ≈ live (contingent). Cartoon ≠ contingent."],["c","Twin of practice Q3: Tyler & Manuel > Connor."]],"v":"roseberry","vp":"f"},{"id":"s5q022","s":5,"t":"L","q":"Why might video chat support toddlers’ learning when pre-recorded video doesn’t?","a":"The adult responds to the child in real time, creating back-and-forth","d":["Video chat screens are usually larger and brighter than television screens at home","Video chat sessions are always much shorter than typical TV episodes for toddlers","Children trust real adults on video more than cartoon characters","Video chat partners use simpler words than television programs","Video chat removes all distractions from the child’s environment"],"e":"Video chat is ==contingent==: the partner sees, waits for, and responds to the child, much like live interaction. Pre-recorded video can’t respond, so toddlers struggle to learn from it.","n":[["k","The ingredient is ==responsiveness==, not the screen itself."]]},{"id":"s5q023","s":5,"t":"L","q":"In Weis and Cerankosky (2010), what was the design?","a":"Boys without a game system were randomly given one now or after 4 months","d":["Boys who already owned game systems were compared with boys who didn’t","Girls and boys were surveyed once about their gaming and school grades","Boys were randomly assigned to play action or puzzle games for 2 weeks","Teachers rated gaming habits and grades in a single cross-sectional survey","Boys were asked to stop gaming for 4 months and then allowed to resume"],"e":"6–9-year-old boys from families without a game system were ==randomly assigned== to receive a system ==at the start== or ==after 4 months==. Random assignment made this an ==experiment==, giving “some support for a causal relationship.”","n":[["k","Randomized → stronger causal evidence than correlational studies."],["n","6–9 y boys · system now vs in 4 months."]],"v":"weis","vp":"f"},{"id":"s5q024","s":5,"t":"L","q":"What did Weis and Cerankosky (2010) find at the 4-month follow-up?","a":"Boys given the system right away scored lower in reading and writing","d":["Boys given the system right away scored higher in math and reading","Both groups had nearly identical academic scores at follow-up","Boys given the system right away scored lower in math only","Boys still waiting scored lower because they felt frustrated","Boys given the system improved in writing but declined in math"],"e":"At follow-up, boys with the game system had ==lower reading and writing scores== (math didn’t differ), consistent with gaming ==displacing== after-school academic activities.","n":[["k","Game system now → ==reading & writing ↓== (not math)."],["m","Displacement: game time crowds out homework time."]],"v":"weis","vp":"q"},{"id":"s5q025","s":5,"t":"L","q":"Lecture asked, “Any concerns?” about Weis and Cerankosky (2010). Which is a legitimate limitation?","a":["Only boys aged 6–9 were studied, so results may not generalize","Four months is short; effects may reflect novelty and fade","Families who didn’t yet own a system may differ from typical families"],"d":["There was no random assignment, so causation is impossible","The study measured attachment instead of academic skills","The waiting group received a different, more violent game system","The study only included adults, not children","The researchers measured math but not reading"],"e":"The study ==was randomized==, so its main weakness isn’t causation. Concerns include a ==narrow sample (boys 6–9)==, a ==short 4-month window== (novelty effects), and ==families who didn’t own systems== being unusual.","n":[["k","Randomized ✓ · but narrow sample, short term, novelty."],["x","Don’t say “not randomized”: it was."]]},{"id":"s5q026","s":5,"t":"L","q":"Media use is correlated with poorer cognitive and language development, but lecture stressed “content matters!” Why?","a":"Educational content with learning goals is linked to benefits; other content isn’t","d":["Content only matters for adolescents; for young children, only total hours on screens matter","All content has the same effect on development, so only total time on screens matters","Fast-paced content is linked to better attention than slower content","Educational content is harmful because it replaces free play","Content matters only for video games, not for television programs"],"e":"Shows like ==Sesame Street, Blue’s Clues, Dora, and SuperWhy== are designed with learning goals and can ==boost learning==. Heavier ==non-educational== and solo use is linked to delays, and low-quality fast-paced content to hyperactivity symptoms.","n":[["k","==What== they watch matters, not only how much."],["c","Munzer: high-quality content + joint engagement → benefits."]]},{"id":"s5q027","s":5,"t":"L","q":"A parent reads that “screen time is linked to lower vocabulary” and concludes screens cause language delays. What is the best response from lecture?","a":"It’s mostly correlational; content, context, and family factors may explain it","d":["The parent is right; experiments show that all screen time causes language delays","The link is false; screen use has never been related to children’s language skills","The link only applies to video chat, not to television or apps","The link only appears in adolescents, not in young children","The link is caused by blue light from screens damaging development"],"e":"Media use is ==correlated== with poorer cognitive and language outcomes, but most evidence is observational. Content (educational vs not), co-viewing, and family factors (stress, lack of support) all matter, and only some studies (like Weis & Cerankosky) support causation.","n":[["k","Mostly ==correlational== → content and context matter."],["c","Munzer: lack of family support ↔ more media use."]]},{"id":"s5q028","s":5,"t":"L","q":"Which is part of Tokunaga’s (2010) definition of cyberbullying used in lecture?","a":"Repeated hostile digital messages intended to cause harm or discomfort","d":["Any single online comment that someone happens to find upsetting or offensive","Face-to-face aggression at school that peers later discuss together online","Ordinary disagreements between friends in a group chat","Online harm caused only by strangers, never by peers","Any online content that is inappropriate for children"],"e":"Cyberbullying: “any behaviour performed through ==electronic or digital media== by individuals or groups that ==repeatedly== communicates ==hostile or aggressive messages intended== to inflict harm or discomfort onto others.”","n":[["k","Digital · ==repeated== · hostile · ==intended== to harm."],["m","D-R-H-I: Digital, Repeated, Hostile, Intended."]],"v":"cyber","vp":"f"},{"id":"s5q029","s":5,"t":"L","q":"Which scenario best fits Tokunaga’s (2010) definition of cyberbullying?","a":"Classmates post mocking comments on Jordan’s photos every day","d":["A friend accidentally posts an unflattering photo of Jordan once","Jordan and a friend argue once in person about a video game","A stranger sends Jordan a single spam message with a fake prize","Jordan keeps seeing violent news stories in his social media feed","Jordan’s teacher posts his grades on a private class portal"],"e":"The daily mocking comments are ==digital==, ==repeated==, ==hostile==, and ==intended to cause harm==. A one-time accident lacks intent and repetition; an in-person argument isn’t digital.","n":[["k","Need repetition + hostility + intent + digital medium."],["x","One accidental post ≠ cyberbullying."]],"v":"cyber","vp":"f"},{"id":"s5q030","s":5,"t":"L","q":"According to lecture, which youth show negative outcomes linked to cyberbullying?","a":"Both perpetrators and victims","d":["Only victims, not perpetrators","Only perpetrators, not victims","Only bystanders who witness it","Only children under age 10","Only victims targeted by strangers"],"e":"==Both perpetrating and being victimized== are linked with negative outcomes: ==poorer physical health==, ==more externalizing problems==, and ==more internalizing problems==.","n":[["k","Perpetrators AND victims → health ↓, externalizing ↑, internalizing ↑."]]},{"id":"s5q031","s":5,"t":"L","q":"Which set of outcomes did lecture link to cyberbullying (perpetration and victimization)?","a":"Poorer physical health, more externalizing, more internalizing problems","d":["Better physical health overall, but more internalizing problems like anxiety","More externalizing problems, with no change in internalizing problems or health","Lower academic achievement, with no health or mental health effects","More internalizing problems but fewer externalizing problems","No measurable outcomes once age and gender are controlled"],"e":"Lecture listed ==poorer physical health==, ==increased externalizing problems==, and ==increased internalizing problems==. Munzer et al. (2026) add that cyberbullying is associated with worse psychological well-being.","n":[["k","Health ↓ · Externalizing ↑ · Internalizing ↑."]],"v":"cyber","vp":"f"},{"id":"s5q032","s":5,"t":"L","q":"What did Kirkorian et al. (2009) find about background television during parent–child play?","a":"When the TV was on, parents and children interacted less","d":["When the TV was on, parents talked more to explain the show","Background TV had no effect on parent–child interaction","Background TV improved toddlers’ attention during play","Only educational programs reduced interaction","Parents interacted more, but children played less"],"e":"With ==background TV on==, there was ==less parent–child interaction==. The presence of screen media can alter interactions even when nobody is “watching.”","n":[["k","TV on → ==less interaction==."],["c","Munzer: turn off the TV when not actively viewing."]],"v":"kirkorian","vp":"f"},{"id":"s5q033","s":5,"t":"L","q":"What did Linder et al. (2021) find about the AMOUNT of parents’ and children’s media use and attachment security?","a":"No relationship","d":["More parent media use predicted insecure attachment","More child media use predicted insecure attachment","More media use by either predicted secure attachment","Only fathers’ media use predicted attachment","Media use predicted disorganized attachment specifically"],"e":"Linder et al. (2021) found ==no relationship== between the amount of parents’ or children’s media use and attachment security. What mattered was the ==type== of media use.","n":[["k","Amount of use ≠ attachment."],["x","Don’t assume “more screens = insecure.”"]],"v":"linder","vp":"f"},{"id":"s5q034","s":5,"t":"L","q":"According to lecture’s summary of Linder et al. (2021), which aspect of media use relates to attachment security?","a":"Type of use: parent absorption vs active mediation","d":["Total hours of screen time per day in the home","Whether the family owns a television at all","Whether the child mostly uses a phone or a tablet","The age at which the child first watched TV","Whether the parent works from home or not"],"e":"“==Less about the amount of screen time==, but may be relationships with the ==type of media use== (parent ==absorption== vs ==active mediation==).” Absorption is linked to lower security; active mediation to higher.","n":[["k","Type > amount: ==absorption (−)== vs ==active mediation (+)==."],["m","Lost in the phone vs talking it through."]],"v":"linder","vp":"q"},{"id":"s5q035","s":5,"t":"L","q":"In which family would we be LEAST likely to expect a secure parent–child attachment, based on Linder et al. (2021)?","a":"Maya’s mom scrolls her phone through playtime and rarely notices Maya’s bids","d":["Leo watches about 2 hours of TV a day, often with his dad, who talks about the shows with him","Zara’s parents don’t allow any screen time at all at home, even on weekends","Kai’s dad uses his phone for work every evening, but only after Kai is asleep","Ines watches shows alone while her mom cooks dinner nearby","Omar’s mom pauses shows to explain confusing parts"],"e":"What matters is ==parent media absorption==, being so engrossed that the parent misses the child’s cues, not the ==amount== of use. Active mediation (Omar, Leo) is positive.","n":[["k","==Absorption== during time together is the risk."],["x","Hours of TV or a no-screens rule don’t predict attachment."],["c","Twin of practice Q4 (Joey & Jesse)."]],"v":"linder","vp":"f"},{"id":"s5q036","s":5,"t":"R","q":"What do Munzer et al. (2026) call frequent digital disruptions of caregiver–child interactions, and what are they linked to?","a":"“Technoference,” linked to child behavioural challenges","d":["“Co-viewing,” linked to better learning","“Active mediation,” linked to secure attachment","“Digital literacy,” linked to fewer behaviour problems","“Crowding in,” linked to better sleep","“Engagement design,” linked to stronger language"],"e":"==Technoference==, frequent device interruptions of caregiver–child interaction, is associated with ==child behavioural challenges==. Joint media engagement, in contrast, is linked to more learning.","n":[["k","==Technoference== → child behaviour challenges."],["c","Like Linder: parent absorption hurts the relationship."]],"rd":"Munzer et al. (2026)"},{"id":"s5q037","s":5,"t":"R","q":"According to Munzer et al. (2026), nearly half of caregivers report substantial stress. How is that stress related to media?","a":"It is associated with more caregiver mobile device use","d":["It is associated with less screen time for their children","It has no association with any kind of family media use","It is caused mainly by children’s use of video games","It is associated with more co-viewing with their children","It makes caregivers more likely to ban devices entirely"],"e":"==Nearly half of caregivers== report substantial stress, which is ==associated with greater caregiver mobile device use==. That’s one reason the AAP urges supporting caregivers rather than inducing guilt.","n":[["k","Stress → more parent device use → support parents, don’t shame them."]],"rd":"Munzer et al. (2026)"},{"id":"s5q038","s":5,"t":"R","q":"What do Munzer et al. (2026) say about joint media engagement (watching or playing together, teaching)?","a":"It strengthens the learning benefits of media","d":["It has no effect beyond what solo viewing provides","It is harmful because it increases total screen time","It only helps adolescents, not young children","It replaces the need for high-quality content","It reduces children’s independence and agency"],"e":"Learning effects of quality content are ==strengthened by joint media engagement== with a caregiver (e.g., viewing together, teaching). Connected relationships promote healthy development in digital contexts.","n":[["k","Watch together + talk = more learning."],["c","Active mediation is linked to more secure attachment (Linder)."]],"rd":"Munzer et al. (2026)"},{"id":"s5q039","s":5,"t":"L","q":"A video platform automatically starts the next episode and offers an endless feed. Which aspect of the digital ecosystem is this?","a":"Engagement-prolonging design","d":["Behavioural reinforcers","Harmful content exposure","Advertising and commercial content","Misinformation","Privacy and data collection","Low-quality content"],"e":"==Autoplay and endless scroll== are ==engagement-prolonging designs== that make it harder for children to disengage. The AAP recommends autoplay be off by default.","n":[["k","Autoplay + endless scroll = ==engagement-prolonging design==."],["x","Badges/trophies = behavioural reinforcers."]],"v":"ecoAspects","vp":"f"},{"id":"s5q040","s":5,"t":"L","q":"A kids’ game gives a new trophy every few minutes and makes it easy to level up, so children keep playing. Which ecosystem concern is this?","a":"Behavioural reinforcers","d":["Engagement-prolonging design","Algorithms","Low-quality content","Advertising","Misinformation"],"e":"Frequent badges, trophies, and easy advancement are ==behavioural reinforcers==; children find these digital lures hard to resist. (Autoplay and endless scroll are engagement-prolonging design.)","n":[["k","Rewards to keep playing = ==behavioural reinforcers==."],["m","Trophies = treats for clicks."]],"v":"ecoAspects","vp":"f"},{"id":"s5q041","s":5,"t":"L","q":"After watching one diet video, a 13-year-old’s feed fills with extreme dieting content. Which ecosystem concern does this mainly show?","a":"Algorithms","d":["Advertising","Behavioural reinforcers","Engagement-prolonging design","Misinformation","Privacy"],"e":"Recommender ==algorithms== can amplify risky content (self-harm, disordered eating, dangerous challenges) through user profiling. The AAP suggests algorithm resets and holding companies accountable.","n":[["k","Feed learns and amplifies → ==algorithms==."],["c","Munzer: algorithms shouldn’t infer teens’ interest in harmful content."]],"v":"ecoAspects","vp":"f"},{"id":"s5q042","s":5,"t":"L","q":"A child begs for a toy after watching a YouTuber unbox it, unaware it was a paid promotion. Which concern is this?","a":"Advertising","d":["Misinformation","Algorithms","Behavioural reinforcers","Harmful content","Low-quality content"],"e":"Influencer marketing is ==commercial content/advertising==. Children often ==can’t distinguish ads from videos==, and the AAP wants user-generated commercial content regulated like TV.","n":[["k","Paid promotion kids can’t spot = ==advertising==."]],"v":"ecoAspects","vp":"f"},{"id":"s5q043","s":5,"t":"L","q":"An app advertised as “educational” is mostly in-app purchases and flashy distractions with shallow learning goals. Which concern is this?","a":"Low-quality content","d":["Misinformation","Privacy","Algorithms","Engagement-prolonging design","Harmful content"],"e":"Apps with ==“educational” claims== but shallow goals, ads, and heavy gamification are ==low-quality content==. Low-income children may be more likely to be exposed to lower-quality content.","n":[["k","Fake-educational app = ==low-quality content==."]],"v":"ecoAspects","vp":"f"},{"id":"s5q044","s":5,"t":"L","q":"Shtulman et al. (2025), shown in lecture, asked people to judge which news stories were real. Which ecosystem concern does this illustrate?","a":"Misinformation","d":["Privacy","Advertising","Algorithms","Behavioural reinforcers","Low-quality content"],"e":"Shtulman et al. (2025) illustrate how hard it can be to tell ==real from fake news==. ==Misinformation== is unvetted information that shapes children’s and teens’ views; the AAP recommends teaching how to evaluate sources.","n":[["k","Real vs fake stories → ==misinformation==."],["c","Policy: kids’ algorithms should prioritize vetted sources."]],"v":"ecoAspects","vp":"f"},{"id":"s5q045","s":5,"t":"L","q":"A free game app quietly tracks a 9-year-old’s location and builds a profile for advertisers. Which concern is this?","a":"Privacy","d":["Misinformation","Behavioural reinforcers","Harmful content","Engagement-prolonging design","Low-quality content"],"e":"Tracking and collecting children’s data is a ==privacy== concern. Children have difficulty understanding how their data is collected and ==can’t meaningfully consent==.","n":[["k","Data tracking = ==privacy==."],["x","Advertising is the use; privacy is the data collection."]],"v":"ecoAspects","vp":"f"},{"id":"s5q046","s":5,"t":"L","q":"Beyond the digital ecosystem, lecture said media concerns are situated within broader structures. Which examples were given?","a":"School and government policies, and lack of support for families","d":["Children’s temperament, emotion regulation, and general intelligence","Parents’ own media habits, preferences, and daily stress levels","Video game ratings, screen sizes, and device types","Peer pressure, friendships, and sibling rivalry","Advertising, algorithms, and engagement-based design"],"e":"Lecture named ==school and government policies== and ==lack of support for families== as broader structures. Munzer et al. add that lack of childcare, few third spaces, poverty, and long work hours are associated with more child media use.","n":[["k","Outer circle = ==policies + family supports==."],["x","Ads and algorithms belong to the digital ecosystem circle."]],"v":"eco","vp":"f"},{"id":"s5q047","s":5,"t":"R","q":"According to Munzer et al. (2026), which family circumstances are associated with GREATER child digital media use?","a":"Lack of childcare, few “third spaces,” poverty, and long work hours","d":["High family income and many scheduled extracurricular activities each week","Living close to libraries, parks, and community centres in the neighbourhood","Having a shared family tablet instead of personal devices","Caregivers who create and follow a Family Media Plan","Attending schools with strict, consistent phone policies"],"e":"“==Lack of childcare, insufficient ‘third space’ opportunities, poverty, and long work hours== for caregivers are associated with greater duration of child digital media use.” This is why policy, not just parenting, matters.","n":[["k","Fewer family supports → more screen time."],["c","Policy fix: fund third spaces + childcare."]],"rd":"Munzer et al. (2026)"},{"id":"s5q048","s":5,"t":"R","q":"For which group do Munzer et al. (2026) note that digital media can foster connection AND amplify discrimination?","a":"Minoritized youth (e.g., racial, faith, neurodiverse, LGBTQ+)","d":["Infants and toddlers under 18 months of age in daycare settings","Children living in rural areas, but not children living in cities","Adolescents who don’t use any social media platforms at all","Children whose parents both work from home","Only teens who have been diagnosed with ADHD"],"e":"For many ==minoritized youth==, digital media can ==foster social connection and well-being==, but it can also ==amplify discrimination==, which is linked to worse mental health.","n":[["k","Minoritized youth: connection ↑ AND discrimination ↑."],["c","Like social compensation: online spaces can help."]],"rd":"Munzer et al. (2026)"},{"id":"s5q049","s":5,"t":"R","q":"According to Munzer et al. (2026), why do infants under 18 months struggle to learn from screens?","a":"Immature cognitive processing makes screen-to-real-world transfer hard","d":["Screens emit light that disrupts infants’ developing visual systems and focus","Infants can’t yet see the images on screens clearly enough to recognize objects","Infants learn only from music at this age, not from speech","Screens are physically too small for infants to attend to","Infants learn from screens only when content is fast-paced"],"e":"Infants under 18 months ==struggle to transfer information from a screen to the real world== because of ==immature cognitive processing==, consistent with the video deficit.","n":[["k","Transfer problem: screen → real world is hard for infants."]],"rd":"Munzer et al. (2026)"},{"id":"s5q050","s":5,"t":"R","q":"Which early-childhood finding is reported by Munzer et al. (2026)?","a":["Calming preschoolers with devices is linked to weaker emotion regulation","Heavier tablet use is linked to more anger outbursts over time","Quality educational content is linked to better preschool language"],"d":["Tablet use in toddlers is linked to fewer tantrums and smoother transitions over time","Solo, non-educational screen use is linked to faster language growth in toddlers","Using devices for calming helps children build emotion regulation","Educational content shows no association with preschoolers’ learning","Background TV is linked to more parent–child interaction at home"],"e":"Early childhood findings: ==high-quality educational content== → better prosocial behaviour and language; ==heavier non-educational, solo use== → delays; ==heavier tablet use== → more anger outbursts; ==devices for calming== → weaker emotion regulation.","n":[["k","Calming with devices → weaker ==emotion regulation==."],["k","Quality content → language + prosocial gains."]],"rd":"Munzer et al. (2026)"},{"id":"s5q051","s":5,"t":"R","q":"For school-aged children, which association do Munzer et al. (2026) report for EXCESSIVE digital media use?","a":"Lower achievement, weaker attention control, and weaker cognition","d":["Higher academic achievement and stronger attention control in class","No associations with any school, attention, or cognitive outcomes","Better sleep quality and longer sleep duration overall","Lower risk of myopia progression and better eyesight","More physical activity and less time spent sitting"],"e":"Excessive use is associated with ==lower academic achievement==, ==weaker attention control==, and ==weaker cognition==, plus myopia progression, more sedentary life, and disrupted sleep. High-quality media with learning goals, used in moderation, can support math and reading.","n":[["k","Excess → achievement ↓, attention ↓, cognition ↓, myopia ↑, sleep ↓."]],"rd":"Munzer et al. (2026)"},{"id":"s5q052","s":5,"t":"R","q":"Which reasons do Munzer et al. (2026) give for digital technology disrupting children’s sleep?","a":"Melatonin disruption, arousing content, and devices in bedrooms","d":["Too much physical activity and exercise right before going to bed","Reading printed books and comics in bed before going to sleep","Background music playing during evening homework","Shared family tablets kept in the living room overnight","Afternoon video chats with relatives in other time zones"],"e":"Screens disrupt sleep via ==melatonin suppression==, ==arousing content==, and ==devices in bedrooms==. The AAP suggests no screens an hour before bed and nighttime “do not disturb” settings.","n":[["k","Sleep: melatonin ↓ · arousing content · devices in bedrooms."]],"rd":"Munzer et al. (2026)"},{"id":"s5q053","s":5,"t":"R","q":"What do Munzer et al. (2026) report about teens’ digital media use and well-being?","a":"Small, highly variable links with poorer well-being; ages 11–14 may be more sensitive","d":["Large, uniform negative effects on well-being that apply equally to all teens","No associations at all between teens’ digital media use and their well-being","Uniformly positive effects on well-being for all teens, especially older ones","Negative effects only among older teens aged 16 and up","Effects only among boys who play violent video games"],"e":"There are ==small associations== between more use and poorer well-being, with ==heterogeneous effects==. ==Early adolescence (11–14)== may be a period of relative susceptibility. Positive associations appear with supportive caregivers, quality content, and positive peers.","n":[["k","Teens: small + ==heterogeneous== effects; 11–14 more susceptible."],["c","Bülow’s idea again: not uniform across individuals."]],"rd":"Munzer et al. (2026)"},{"id":"s5q054","s":5,"t":"L","q":"Which media did lecture give as examples that can boost children’s learning?","a":"Sesame Street, Blue’s Clues, Dora, and SuperWhy","d":["Fruit Ninja, Call of Duty, and Grand Theft Auto","Baby Einstein-style DVDs for infants under 1","Short-form video apps with autoplay turned on","Social media feeds with algorithmic recommendations","Background television left on during play"],"e":"Lecture listed ==Sesame Street, Blue’s Clues, Dora the Explorer, and SuperWhy== as media that can boost learning: child-centred educational content with learning goals.","n":[["k","Educational TV can ==boost learning==."],["x","Infant DVDs showed no word learning (DeLoache)."]]},{"id":"s5q055","s":5,"t":"L","q":"Przybylski and colleagues (2017, 2020) found that moderate amounts of media use are linked to…","a":"better well-being than very low or very high use","d":["worse well-being than no use at all","the same well-being as any amount of use","better well-being only among children under 5","better grades but worse well-being overall","steadily worse well-being with every added hour"],"e":"==Moderate amounts of media== may be linked with ==better well-being== (an inverted-U, sometimes called the “Goldilocks” pattern): not too little, not too much.","n":[["k","Inverted U: ==moderate use is best==."],["m","Goldilocks: not too much, not too little."]],"v":"goldilocks","vp":"q"},{"id":"s5q056","s":5,"t":"L","q":"Which hypothesis says online relationships lead to closer, higher-quality relationships and more social capital in general?","a":"The stimulation hypothesis","d":["The rich-get-richer hypothesis","The social compensation hypothesis","The displacement hypothesis","The Goldilocks hypothesis","The differential susceptibility hypothesis"],"e":"The ==stimulation hypothesis== says online connection stimulate
