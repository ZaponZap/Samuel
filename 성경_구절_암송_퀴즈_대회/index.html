<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성경 구절 암송 퀴즈 대회</title>
<meta name="description" content="뉴라이프 한인교회 · 2026년 10월 25일 성경 구절 암송 퀴즈 대회를 위한 연습">
<meta name="theme-color" content="#EDF4EF">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ================= Tokens ================= */
:root{
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --serif:'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',Georgia,serif;
  color-scheme:dark;
  --bg:#151C19; --bg-2:#101613; --surface:#1C2521; --surface-2:#242E29; --raise:#2B3631;
  --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.17);
  --text:#E7EEEA; --muted:#9BAEA4; --faint:rgba(231,238,234,.45);
  --primary:#E7EEEA; --on-primary:#0F2A1D;
  --gold:#D9BD79; --ink:#05301B; --bad:#F2998D; --focus:#D9BD79;
  --pane-off:rgba(255,255,255,.06);
  --mix:#ffffff; --mixamt:10%;
  --shadow:0 18px 40px -26px rgba(0,0,0,.75);
  --r-lg:20px; --r-md:14px; --r-sm:10px; --nav-h:62px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#EDF4EF; --bg-2:#E0EBE4; --surface:#FFFFFF; --surface-2:#F3F8F5; --raise:#E7F0EA;
  --line:#D3E2D9; --line-2:#B5CCBE;
  --text:#0D2A1C; --muted:#4A6758; --faint:rgba(13,42,28,.5);
  --primary:#013720; --on-primary:#FFFFFF;
  --gold:#A47718; --ink:#05301B; --bad:#C2372C; --focus:#013720;
  --pane-off:rgba(1,55,32,.07);
  --mix:#000000; --mixamt:46%;
  --shadow:0 16px 36px -26px rgba(1,55,32,.4);
}
*{ --ct:color-mix(in oklab, var(--c, #8FDBB4), var(--mix) var(--mixamt)); }

/* ================= Base ================= */
*,*::before,*::after{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
@media (max-width:899px){html{font-size:15.3px}}
body{margin:0;font-family:var(--font);font-weight:400;background:var(--bg);color:var(--text);line-height:1.55;letter-spacing:-.006em;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p,ol,ul{margin:0}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:10px}
.ic{width:1.25em;height:1.25em;flex:none;display:block}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ================= Shell ================= */
.side{display:none}
main{padding:0 1rem calc(var(--nav-h) + 2rem + env(safe-area-inset-bottom));max-width:880px;margin:0 auto;min-width:0}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:268px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;padding:22px 14px 18px;background:var(--bg-2);border-right:1px solid var(--line);overflow-y:auto}
  main{padding:0 40px 64px;width:100%}
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px;font-weight:700;font-size:.9rem;line-height:1.3;letter-spacing:-.025em;white-space:nowrap}
.brand .mark{width:44px;height:44px;flex:none}
.mark svg{width:100%;height:100%;display:block}
.brand small{display:block;font-weight:500;font-size:.74rem;color:var(--muted);letter-spacing:0}
.navgroup h4{font-size:.76rem;font-weight:600;color:var(--muted);margin:18px 12px 6px;letter-spacing:.01em}
.navi{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:12px;font-weight:500;font-size:.93rem;text-align:left;color:var(--muted);transition:background .2s,color .2s}
.navi .ic{width:1.15em;height:1.15em}
.navi:hover{background:var(--line);color:var(--text)}
.navi.on{background:var(--surface-2);color:var(--text);font-weight:600}
.navi.on .ic{color:var(--gold)}
.side-foot{margin-top:auto;padding:16px 10px 0;font-size:.72rem;color:var(--muted);line-height:1.55}

.topbar{display:flex;align-items:center;gap:8px;padding:12px 0 4px}
.brand-m{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.95rem;margin-right:auto;min-width:0;letter-spacing:-.02em}
.brand-m .mark{width:34px;height:34px;flex:none}
.brand-m span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:900px){.brand-m{visibility:hidden}}
@media (max-width:360px){.brand-m span{display:none}}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:.86rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill .ic{width:1.05em;height:1.05em;color:var(--gold)}
.pill.bump{animation:bump .5s cubic-bezier(.3,1.7,.5,1)}
@media (max-width:899px){.pill.pts{display:none}}
.tbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted);flex:none}
.tbtn .ic{width:1.1em;height:1.1em}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface);border:1px solid var(--line);flex:none}
.lang button{height:28px;padding:0 11px;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--muted);white-space:nowrap}
.lang button.on{background:var(--primary);color:var(--on-primary)}
.lang .l-short{display:none}
@media (max-width:899px){.lang .l-long{display:none}.lang .l-short{display:inline}}

.pagehead{padding:18px 0 14px}
.pagehead:empty{display:none}
.pagehead h1{font-size:clamp(1.45rem,1.2rem + 1vw,1.85rem);font-weight:700;letter-spacing:-.025em;line-height:1.2}
.pagehead p{color:var(--muted);margin-top:6px;max-width:58ch;font-size:.95rem}
.subtabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none;margin-inline:-1rem;padding-inline:1rem}
.subtabs::-webkit-scrollbar{display:none}
@media (min-width:900px){.subtabs{display:none}}
.subtab{display:inline-flex;align-items:center;gap:6px;padding:7px 13px 7px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.85rem;font-weight:500;white-space:nowrap;color:var(--muted)}
.subtab .ic{width:1.05em;height:1.05em}
.subtab.on{background:var(--primary);color:var(--on-primary);border-color:transparent;font-weight:600}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--bg-2) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
@media (min-width:900px){.bnav{display:none}}
body.kb .bnav{display:none}
.bn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;font-size:.72rem;font-weight:500;color:var(--muted)}
.bn .nic{width:48px;height:28px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.bn .ic{width:1.2em;height:1.2em}
.bn.on{color:var(--text);font-weight:600}
.bn.on .nic{background:var(--surface-2);color:var(--gold)}

/* ================= Verse chips ================= */
.vbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -1rem 14px;padding:2px 1rem 4px;scroll-snap-type:x proximity}
.vbar::-webkit-scrollbar{display:none}
@media (min-width:900px){.vbar{flex-wrap:wrap;margin:0 0 16px;padding:0;overflow:visible}}
.vchip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.83rem;font-weight:500;white-space:nowrap;scroll-snap-align:start;transition:background .2s,border-color .2s}
.vchip .mo{min-width:26px;height:24px;padding:0 6px;border-radius:999px;background:color-mix(in srgb,var(--c) 26%,transparent);color:var(--ct);display:grid;place-items:center;font-size:.72rem;font-weight:700}
.vchip .done{width:14px;height:14px;color:var(--ct)}
.vchip:hover{border-color:var(--line-2)}
.vchip.on{background:var(--c);color:var(--ink);border-color:transparent;font-weight:600}
.vchip.on .mo{background:rgba(255,255,255,.5);color:var(--ink)}
.vchip.on .done{color:var(--ink)}

/* ================= Building blocks ================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(1rem,2.6vw,1.9rem);box-shadow:var(--shadow);position:relative}
.vhead{display:flex;align-items:center;gap:12px}
.mbadge{width:44px;height:44px;border-radius:50%;background:var(--c);color:var(--ink);display:grid;place-items:center;flex:none}
.mbadge .ic{width:24px;height:24px;stroke-width:1.9}
.vhead-t{flex:1;min-width:0}
.vhead-t h2{font-size:1.12rem;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.vhead-t p{color:var(--muted);font-size:.84rem}
.vhead-t .mon{color:var(--ct);font-weight:600}
.verse{font-family:var(--serif);font-weight:500;font-size:clamp(1.22rem,1.04rem + .8vw,1.5rem);line-height:1.9;margin:20px 0 6px;letter-spacing:-.01em;word-break:keep-all}
:lang(en) .verse{letter-spacing:0;line-height:1.8}
.grp{white-space:nowrap}
.w{border-radius:.25em;transition:color .25s,background-color .25s,opacity .3s,filter .35s,text-shadow .3s}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.nowrap{flex-wrap:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:.92rem;background:var(--surface-2);border:1px solid var(--line);transition:transform .15s,background .2s,border-color .2s;white-space:nowrap}
.btn .ic{width:1.1em;height:1.1em}
.btn:hover{border-color:var(--line-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.accent{background:var(--c);color:var(--ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 13px;font-size:.84rem;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);flex:none;transition:transform .15s,border-color .2s}
.ibtn:hover{border-color:var(--line-2)}
.ibtn:active{transform:scale(.93)}
.ibtn.on{background:var(--c);color:var(--ink);border-color:transparent}
.ibtn[disabled]{opacity:.4;pointer-events:none}
.ibtn .ic{width:1.15em;height:1.15em}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg-b{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:9px;font-size:.84rem;font-weight:500;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s;flex:1}
.seg-b .ic{width:1.05em;height:1.05em}
.seg-b.on{background:var(--surface-2);color:var(--text);font-weight:600;box-shadow:0 1px 0 var(--line-2) inset}
:root[data-theme="light"] .seg-b.on{background:var(--surface);box-shadow:0 1px 4px rgba(1,55,32,.12)}
.seg.full{display:flex;width:100%}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:flex-start;padding:7px 13px;border-radius:12px;background:var(--bg-2);min-width:66px}
.stat b{font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted)}
.prog{height:6px;border-radius:99px;background:var(--pane-off);overflow:hidden;flex:1;min-width:60px}
.prog i{display:block;height:100%;width:0;border-radius:99px;background:var(--c,var(--gold));transition:width .15s linear}
.hint-line{font-size:.8rem;color:var(--muted)}
.divider{height:1px;background:var(--line);margin:18px 0}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:600;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold);white-space:nowrap}

/* ================= Typing ================= */
.slot{display:inline-block;min-width:calc(var(--len,3) * .55em);border-bottom:2px solid var(--line-2);line-height:1.3;border-radius:5px 5px 2px 2px;padding:0 .04em;transition:background .25s,border-color .25s,color .25s;vertical-align:baseline}
.ko .slot{min-width:calc(var(--len,2) * .98em)}
.slot .gh{color:var(--faint)}
.slot .gh.off{color:transparent}
.slot.cur{border-bottom-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.slot.ready{background:color-mix(in srgb,var(--c) 30%,transparent)}
.caret{display:inline-block;width:2px;height:1em;margin:0 1px -.12em;background:var(--c);animation:blink 1s steps(1) infinite;visibility:hidden}
.typing.focus .slot.cur .caret{visibility:visible}
.slot.done{border-bottom-color:transparent;color:var(--ct);min-width:0}
.slot.done.skipped{color:var(--muted);border-bottom:2px dotted var(--line-2)}
.slot.fresh{animation:pop .5s cubic-bezier(.3,1.7,.5,1),glowfill 1.3s ease-out}
.slot.bad{border-bottom-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.given{color:var(--muted)}
.typebar{display:flex;align-items:center;gap:8px;margin-top:18px}
.tinput{flex:1;min-width:0;font:inherit;font-size:1.05rem;height:52px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--bg-2);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.tinput::placeholder{color:var(--faint)}
.tinput:focus{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.tinput.bad{border-color:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 18%,transparent)}
.shake{animation:shake .38s}
@media (max-width:520px){.typebar{gap:6px}.typebar .ibtn{width:42px;height:42px}.tinput{padding:0 14px;height:48px}}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px}
.lv{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 11px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);text-align:left;min-width:0;transition:background .2s,border-color .2s}
.lv .n{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);font-weight:600}
.lv .n .ic{width:13px;height:13px;color:var(--ct)}
.lv b{font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lv.on{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:var(--c)}
.lv.on .n{color:var(--ct)}
.lv:hover{border-color:var(--line-2)}
.lv .short{display:none}
@media (max-width:560px){.lv .long{display:none}.lv .short{display:inline}.lv{padding:8px 9px}}
.lv-desc{margin-top:8px}

/* Build */
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{font-family:var(--serif);font-size:1.02rem;font-weight:500;padding:7px 14px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);box-shadow:0 2px 0 var(--line-2);transition:transform .12s,border-color .2s,opacity .25s}
.chip:hover{border-color:var(--c)}
.chip:active{transform:translateY(2px);box-shadow:none}
.chip.bad{border-color:var(--bad);animation:shake .38s}
.chip.gone{animation:chipout .28s forwards;pointer-events:none}
.chip.flash{animation:flash 1.1s ease-in-out 2}

/* ================= Listen ================= */
.vis{margin-bottom:14px}
.player{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:nowrap}
.bigplay{width:64px;height:64px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none;transition:transform .15s}
.bigplay .ic{width:26px;height:26px}
.bigplay:active{transform:scale(.94)}
.bigplay.on{box-shadow:0 0 0 6px color-mix(in srgb,var(--primary) 16%,transparent)}
.ptrack{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.time{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.karaoke.playing .w{opacity:.45}
.karaoke.playing .w.past,.karaoke.playing .w.now{opacity:1}
.karaoke .w.now{color:var(--ct);text-shadow:0 0 16px color-mix(in srgb,var(--c) 70%,transparent)}
.mode-reveal .w:not(.past):not(.now),.mode-hide .w{color:transparent!important;text-shadow:none!important;background:color-mix(in srgb,var(--c) 18%,transparent);opacity:1!important}
.mode-hide .w.now{background:color-mix(in srgb,var(--c) 62%,transparent)}
.mode-reveal .w.now{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.w.say{filter:blur(7px);opacity:.5!important}
.turn{display:flex;align-items:center;gap:10px;min-height:40px;color:var(--ct);font-weight:600;font-size:.92rem;opacity:0;transition:opacity .25s}
.turn.on{opacity:1}
.turn svg{width:34px;height:34px;transform:rotate(-90deg);flex:none}
.turn circle{fill:none;stroke-width:4}
.turn .bgc{stroke:color-mix(in srgb,var(--c) 22%,transparent)}
.turn .fgc{stroke:var(--c);stroke-linecap:round;stroke-dasharray:107;stroke-dashoffset:0}
.turn.on .fgc{animation:drain var(--d,3s) linear forwards}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn.toggle[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 22%,var(--surface));border-color:var(--c);color:var(--text)}

/* ================= Match / Ear / Order ================= */
.tray{position:sticky;top:8px;z-index:5;display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-radius:16px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);margin-bottom:14px}
@media (max-width:899px){
  .tray{position:fixed;top:auto;left:8px;right:8px;bottom:calc(var(--nav-h) + 8px + env(safe-area-inset-bottom));flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0;box-shadow:var(--shadow)}
  .tray::-webkit-scrollbar{display:none}
  .match-pad{height:80px}
}
.rchip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:.88rem;white-space:nowrap;transition:transform .15s,background .2s}
.rchip.sel{background:var(--primary);color:var(--on-primary);transform:translateY(-2px)}
.rchip.bad{border-color:var(--bad);animation:shake .38s}
.rchip.gone{animation:chipout .3s forwards}
.mgrid{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){.mgrid{grid-template-columns:1fr 1fr}}
.mcard{text-align:left;padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;transition:border-color .25s,background .3s,transform .15s}
.mcard .mtext{font-family:var(--serif);font-size:.98rem;line-height:1.7;font-weight:500}
.mcard:hover{border-color:var(--line-2)}
.mcard.sel{border-color:var(--primary);transform:translateY(-2px)}
.mcard.bad{border-color:var(--bad);animation:shake .38s}
.mcard.ok{background:color-mix(in srgb,var(--c) 13%,var(--surface));border-color:var(--c);cursor:default}
.okbadge{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;padding:4px 11px 4px 5px;border-radius:999px;background:var(--c);color:var(--ink);font-weight:700;font-size:.82rem;animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.okbadge .ic{width:18px;height:18px;padding:3px;border-radius:50%;background:rgba(255,255,255,.55)}
.mslot{height:26px;align-self:flex-start;min-width:110px;border-radius:999px;border:1.5px dashed var(--line-2)}
.disc{--sz:150px;width:var(--sz);height:var(--sz);border-radius:50%;position:relative;display:grid;place-items:center;margin:4px auto 2px;flex:none}
@media (max-height:720px){.disc{--sz:118px}}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#F4A79D,#F5BE82,#EBD47E,#C3DC84,#8FDBB4,#84D3DC,#92B6F2,#B3A8EF,#DCA6E4,#F2A6C8,#F4A79D)}
.disc.solved::before{background:var(--c)}
.disc.on::before{animation:spin 6s linear infinite}
.disc-in{position:relative;width:calc(100% - 14px);height:calc(100% - 14px);border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--text)}
.disc-in .ic{width:40px;height:40px}
.eq{display:flex;gap:5px;align-items:center;height:40px}
.eq i{width:5px;border-radius:9px;background:var(--text);height:30%;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.2s}.eq i:nth-child(3){animation-delay:-.45s}.eq i:nth-child(4){animation-delay:-.1s}.eq i:nth-child(5){animation-delay:-.6s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.opt{min-height:56px;padding:8px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:.95rem;transition:background .25s,border-color .25s,transform .12s}

.opt.ok{background:var(--c);color:var(--ink);border-color:transparent;animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.opt.no{border-color:var(--bad);color:var(--bad);animation:shake .38s}
.opt.dim{opacity:.4}
.reveal{margin-top:16px;padding:16px 18px;border-radius:16px;background:color-mix(in srgb,var(--c) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));animation:rise .35s ease-out}
.reveal .vt{font-family:var(--serif);font-weight:500;font-size:1.02rem;line-height:1.75;margin:10px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(5,1fr)}}
.tile{aspect-ratio:1/1.05;perspective:900px;position:relative}
.tile-in{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.tile.up .tile-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);font-weight:600;font-size:.8rem;line-height:1.3}
.face.back{background:var(--surface-2);color:var(--muted)}
.face.back .ic{width:28px;height:28px}
.face.back.snd{color:var(--gold)}
.face.back small{font-size:.7rem;font-weight:500}
.face.front{transform:rotateY(180deg);background:var(--raise)}
.face.front .ic{width:24px;height:24px}
.tile.done .face.front{background:var(--c);color:var(--ink);border-color:transparent}
.tile.done{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.tile button{position:absolute;inset:0;border-radius:14px;z-index:2}
.shelf{display:flex;align-items:flex-end;gap:2px;height:86px;padding:0 2px;border-bottom:2px solid var(--line-2)}
.spine{flex:1;min-width:2px;border-radius:2px 2px 0 0;background:var(--pane-off);transition:height .45s cubic-bezier(.3,1.5,.5,1),background .3s,box-shadow .3s}
.spine.nt{margin-left:6px}
.spine.lit{background:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 70%,transparent);height:82px!important}
.shelf-legend{display:grid;grid-template-columns:39fr 27fr;gap:6px;font-size:.74rem;color:var(--muted);margin-top:6px}
.shelf-legend span:last-child{text-align:right}
.placed{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:6px}
.placed li{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 7px;border-radius:12px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));animation:rise .35s ease-out}
.placed .n{width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:.82rem;flex:none}
.placed .bk{margin-left:auto;font-size:.74rem;color:var(--muted);white-space:nowrap}
.placed li.ghost{background:transparent;border:1.5px dashed var(--line);color:var(--muted);animation:none}
.placed li.ghost .n{background:transparent;border:1.5px dashed var(--line-2);color:var(--muted)}

/* ================= Home ================= */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:14px 0 22px}
.seal{width:112px;height:112px;flex:none;display:block;filter:drop-shadow(0 10px 22px rgba(0,0,0,.25))}
.hero h1{font-size:clamp(1.55rem,1.15rem + 1.6vw,2.2rem);font-weight:800;letter-spacing:-.035em;line-height:1.18}
.hero .sub-en{font-size:.9rem;color:var(--muted);font-weight:500;margin-top:2px}
.hero .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:.9rem;font-weight:500}
.hero .meta b{color:var(--text);font-weight:600}
.dday{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;background:#013720;color:#fff;font-weight:700;font-size:.8rem;white-space:nowrap}
:root[data-theme="dark"] .dday{background:var(--gold);color:var(--ink)}
.dday.past{background:var(--surface-2);color:var(--muted)}
@media (max-width:599px){
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center;gap:12px;padding:8px 0 18px}
  .seal{width:92px;height:92px}
  .hero .meta{justify-content:center}
}
.progress-card{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
@media (max-width:599px){.progress-card{grid-template-columns:1fr;justify-items:center;text-align:center;gap:16px}}
.crosswrap{width:250px;flex:none}
@media (max-width:599px){.crosswrap{width:228px}}
.crosswrap svg{width:100%;height:auto;display:block;overflow:visible}
.cross .pane{transition:fill .4s}
.cross .pane-off{fill:var(--pane-off);stroke:var(--line-2);stroke-width:1.5}
.cross .lbl{font:600 15px var(--font);fill:var(--muted);pointer-events:none}
.cross .lit .lbl{fill:#05301B}
.cross [data-i]{cursor:pointer}
.cross [data-i]:hover .pane-off{fill:color-mix(in srgb,var(--text) 14%,transparent)}
.cross [data-i]:focus-visible{outline:none}
.cross [data-i]:focus-visible .pane{stroke:var(--focus);stroke-width:3}
.cross .halo{fill:none;stroke:var(--gold);stroke-width:3;stroke-linejoin:round;filter:drop-shadow(0 0 8px var(--gold))}
.cross .lit .pane{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--c) 60%,transparent))}
.pinfo .big{font-size:2.6rem;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.pinfo .big small{font-size:1.1rem;color:var(--muted);font-weight:600;letter-spacing:0}
.pinfo .lbl-s{font-weight:700;font-size:1rem;margin-top:8px}
.pinfo .lbl{color:var(--muted);margin:4px 0 16px;font-size:.88rem;max-width:38ch}
.pinfo .acts{display:flex;flex-direction:column;gap:8px;align-items:stretch;max-width:340px}
@media (max-width:599px){.pinfo .acts{max-width:none;width:100%}.pinfo{width:100%}.pinfo .lbl{margin-inline:auto}}
.pinfo .cta{justify-content:flex-start;text-align:left;white-space:normal;padding:10px 16px;min-height:52px}
.pinfo .cta span{display:flex;flex-direction:column;line-height:1.3}
.pinfo .cta small{font-weight:500;opacity:.75;font-size:.78rem}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:30px 0 12px}
.sec-h h2{font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
.sec-h p{color:var(--muted);font-size:.82rem}
.vlist{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:52px 1fr;gap:14px;padding:14px 16px 14px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.vrow.now{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.vrow .mcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.vrow .mnum{width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--ct);display:grid;place-items:center;font-weight:800;font-size:.86rem;letter-spacing:-.02em}
.vrow.lit .mnum{background:var(--c);color:var(--ink)}
.vrow .vr-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vrow h3{font-size:1rem;font-weight:700;letter-spacing:-.015em}
.vrow .th{font-size:.8rem;color:var(--muted)}
.vrow .vr-text{font-family:var(--serif);font-weight:500;font-size:.98rem;line-height:1.75;margin:6px 0 10px;color:color-mix(in srgb,var(--text) 88%,transparent)}
.vrow .vr-acts{display:flex;gap:6px;flex-wrap:wrap}
.okmark{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;color:var(--ct)}
.okmark .ic{width:14px;height:14px}
.credits{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:.74rem;color:var(--muted);line-height:1.6;display:flex;flex-direction:column;gap:6px}
.credits button{text-decoration:underline;text-underline-offset:3px}

/* ================= Context ================= */
.ctx dl{display:grid;grid-template-columns:7.5em 1fr;gap:12px 16px;margin:18px 0 0}
.ctx dt{font-size:.8rem;font-weight:700;color:var(--ct);padding-top:2px}
.ctx dd{margin:0;line-height:1.7;font-size:.97rem}
.ctx dd.big{font-size:1rem}
@media (max-width:560px){.ctx dl{grid-template-columns:1fr;gap:2px}.ctx dd{margin-bottom:12px}}
.ctx .vt{font-family:var(--serif);font-weight:500;font-size:1.08rem;line-height:1.85;padding:14px 16px;border-radius:12px;background:var(--bg-2);margin-top:16px}

/* ================= Final challenge ================= */
.segbar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:4px 0 14px}
.segbar i{height:6px;border-radius:99px;background:var(--pane-off)}
.segbar i.done{background:var(--c)}
.segbar i.cur{background:color-mix(in srgb,var(--c) 45%,transparent);animation:breathe 1.6s ease-in-out infinite}
.intro{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
@media (max-width:599px){.intro{grid-template-columns:1fr;justify-items:center;text-align:center}}
.intro h2{font-size:1.25rem;font-weight:700;letter-spacing:-.02em}
.intro p{color:var(--muted);margin:6px 0 16px;max-width:42ch}

/* ================= Modal ================= */
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(6,14,10,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .25s}
.modal-back.in{opacity:1}
.modal{width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px 22px 20px;text-align:center;transform:translateY(16px) scale(.97);transition:transform .4s cubic-bezier(.2,1.4,.4,1)}
.modal-back.in .modal{transform:none}
.medal{width:118px;height:118px;margin:0 auto 12px;border-radius:50%;padding:8px;background:conic-gradient(from 210deg,var(--c),color-mix(in srgb,var(--c) 40%,white),var(--c),color-mix(in srgb,var(--c) 55%,black),var(--c));box-shadow:0 0 50px -8px color-mix(in srgb,var(--c) 70%,transparent);animation:medalin .8s cubic-bezier(.2,1.5,.4,1)}
.medal-in{width:100%;height:100%;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--ct)}
.medal-in .ic{width:52px;height:52px;stroke-width:1.5}
.modal h2{font-size:1.32rem;font-weight:700;letter-spacing:-.025em}
.modal .sub{color:var(--muted);margin-top:2px;font-size:.92rem}
.stars{display:flex;justify-content:center;gap:5px;margin:12px 0 2px}
.stars .ic{width:28px;height:28px;color:var(--pane-off)}
.stars .ic.on{color:var(--gold);animation:starin .5s cubic-bezier(.3,1.8,.5,1) both}
.stars .ic.on:nth-child(2){animation-delay:.12s}.stars .ic.on:nth-child(3){animation-delay:.24s}
.modal .stats{justify-content:center;margin:14px 0}
.modal .stat{align-items:center}
.modal .note{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ct);font-size:.84rem;font-weight:600;margin-bottom:6px}
.modal .note .ic{width:1.05em;height:1.05em}
.modal .vt{font-family:var(--serif);font-weight:500;font-size:1rem;line-height:1.75;margin:12px 2px 2px;text-align:left}
.modal .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.report{text-align:left}
.report .rhead{display:flex;align-items:center;gap:12px}
.report table{width:100%;border-collapse:collapse;margin-top:14px;font-size:.9rem}
.report td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:middle}
.report td:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

.report .status.lit{background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--ct)}

@keyframes chipout{to{opacity:0;transform:scale(.6) translateY(-14px)}}
@keyframes flash{50%{border-color:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 35%,transparent)}}
@keyframes breathe{50%{opacity:.45}}

@keyframes eq{0%,100%{height:22%}50%{height:100%}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  '1-peter-3-18': {
    ko:{ who:'사도 베드로', when:'주후 62–64년경, 로마에서 쓴 것으로 보입니다', to:'소아시아(지금의 튀르키예) 곳곳에 흩어져 믿음 때문에 고난받던 성도들',
      setting:'베드로는 선을 행하고도 억울하게 고난받는 성도들을 격려하며, 누구보다 억울한 고난을 받으신 예수님을 바라보게 합니다.',
      meaning:'의로우신 예수님께서 불의한 우리를 대신하여 죽으셨습니다. 그 죽음은 ‘한번’으로 완전하여 다시 반복할 필요가 없습니다. 그 목적은 우리를 하나님께로 인도하시는 것이며, 예수님은 다시 살아나셨습니다.' },
    en:{ who:'The apostle Peter', when:'About AD 62–64, probably from Rome', to:'Christians scattered across Asia Minor (today’s Turkey) who were suffering for their faith',
      setting:'Peter encourages believers who suffer unfairly for doing good. He points them to Jesus, who suffered more unfairly than anyone.',
      meaning:'Jesus, the righteous one, died in the place of the unrighteous: in our place. He died “once”; his sacrifice was complete and never needs repeating. Its purpose was to bring us to God, and he was raised to life.' } },
  'john-1-12': {
    ko:{ who:'예수님의 열두 제자 중 하나인 사도 요한', when:'1세기 후반, 주후 85–95년경', to:'읽는 모든 사람이 예수님이 하나님의 아들 그리스도이심을 믿게 하려고 썼습니다(요 20:31).',
      setting:'요한복음은 예수님을 ‘말씀’, 곧 사람이 되신 하나님으로 소개하며 시작합니다. 그러나 자기 백성 중 많은 이들이 그분을 영접하지 않았습니다(11절).',
      meaning:'예수님을 믿어 영접하는 모든 사람은 하나님의 자녀가 되는 권세를 받습니다. 13절은 그들이 “하나님께로부터 난 자들”이라고 말합니다. 이 새로운 출생은 혈통이나 사람의 노력이 아니라 하나님께로부터 옵니다.' },
    en:{ who:'The apostle John, one of Jesus’ twelve disciples', when:'Late first century, around AD 85–95', to:'Everyone who reads it, so that they may believe Jesus is the Messiah, the Son of God (John 20:31)',
      setting:'John begins by calling Jesus “the Word”: God himself, who became a man. Many of his own people did not receive him (v. 11).',
      meaning:'All who receive Jesus by believing in him are given the right to become God’s children. The next verse says they are “born of God”: this new birth comes from God, not from family line or human effort.' } },
  'matthew-18-20': {
    ko:{ who:'세리였다가 예수님의 열두 제자가 된 마태', when:'주후 50–60년대로 보입니다', to:'특히 유대인 독자들을 염두에 두고, 예수님이 약속된 왕이심을 보여 줍니다.',
      setting:'예수님은 죄를 지은 형제를 교회가 어떻게 도와야 하는지 가르치십니다. 먼저 개인적으로, 다음에는 한두 사람과 함께, 그다음에는 교회에 말하라고 하십니다(15–19절).',
      meaning:'교회가 예수님의 이름으로 모여 기도하고, 결정하고, 서로 바로잡아 회복시킬 때 예수님께서 성령으로 그 가운데 친히 함께하십니다. 모임이 작더라도, 함께 살아가는 교회에 주신 약속입니다.' },
    en:{ who:'Matthew, a tax collector who became one of Jesus’ twelve disciples', when:'Probably the AD 50s–60s', to:'Written with Jewish readers especially in mind, showing Jesus as the promised King',
      setting:'Jesus is teaching how the church should help a brother or sister who sins: go to them privately, then with one or two others, then to the church (vv. 15–19).',
      meaning:'When the church gathers in Jesus’ name to pray, decide, correct and restore, Jesus himself is present with them by his Spirit. The promise is for the church’s life together, however small the gathering.' } },
  '1-corinthians-3-16': {
    ko:{ who:'사도 바울', when:'주후 53–55년경, 에베소에서', to:'고린도 교회',
      setting:'교회가 “나는 바울에게”, “나는 아볼로에게” 하며 여러 무리로 나뉘고 있었습니다. 바울은 교회가 어떤 지도자가 아니라 하나님께 속했다고 일깨웁니다.',
      meaning:'여기서 ‘너희’는 복수입니다. 교회 공동체 전체가 하나님의 성전입니다. 예전에는 하나님이 예루살렘 성전에 계셨지만, 이제는 성령께서 하나님의 백성 가운데 계십니다. 그래서 교회의 하나 됨과 거룩함은 하나님께 매우 중요합니다(17절).' },
    en:{ who:'The apostle Paul', when:'About AD 53–55, from Ephesus', to:'The church in Corinth',
      setting:'The church was splitting into groups: “I follow Paul,” “I follow Apollos.” Paul reminds them that the church belongs to God, not to any leader.',
      meaning:'“You” here is plural: the church together is God’s temple. God once dwelt in the temple in Jerusalem; now his Spirit lives among his people. That is why the church’s unity and holiness matter so much to God (v. 17).' } },
  '1-corinthians-15-58': {
    ko:{ who:'사도 바울', when:'주후 53–55년경, 에베소에서', to:'고린도 교회',
      setting:'고린도 교회의 어떤 사람들은 죽은 자의 부활을 의심했습니다. 15장에서 바울은 그리스도께서 참으로 부활하셨고, 그분께 속한 모든 사람도 다시 살아날 것을 보여 줍니다. 이 구절은 15장의 결론입니다.',
      meaning:'그리스도께서 죽음을 이기셨기 때문에, 주님을 위한 수고는 하나도 헛되지 않습니다. 그러므로 굳게 서서 흔들리지 말고, 주의 일에 더욱 힘쓰십시오.' },
    en:{ who:'The apostle Paul', when:'About AD 53–55, from Ephesus', to:'The church in Corinth',
      setting:'Some in Corinth doubted that the dead would be raised. In chapter 15 Paul shows that Christ truly rose, and that all who belong to him will rise too. This verse closes the chapter.',
      meaning:'Because Christ has defeated death, nothing done for the Lord is wasted. So stand firm, don’t be shaken, and keep giving yourself fully to his work.' } },
  'lamentations-3-22': {
    ko:{ who:'전통적으로 선지자 예레미야로 봅니다', when:'주전 586년, 바벨론이 예루살렘과 성전을 무너뜨린 직후', to:'슬픔과 포로 생활 가운데 있던 하나님의 백성',
      setting:'예레미야애가는 예루살렘의 멸망을 슬퍼하는 시입니다. 그 멸망은 오랜 불순종에 대한 하나님의 심판이었습니다. 책의 한가운데에서 기록자는 소망으로 돌아섭니다.',
      meaning:'여기서 ‘자비’로 옮긴 히브리어(헤세드)는 언약을 끝까지 지키시는 하나님의 변함없는 사랑을 뜻합니다. 우리가 진멸되지 않은 것은 우리가 잘해서가 아니라 그 사랑 때문입니다. 그 긍휼은 아침마다 새롭고, 주의 성실하심은 끝이 없습니다.' },
    en:{ who:'Traditionally the prophet Jeremiah', when:'Soon after 586 BC, when Babylon destroyed Jerusalem and the temple', to:'God’s people, grieving and in exile',
      setting:'Lamentations is a book of sad poems over Jerusalem’s fall, which came as God’s judgment on his people’s long disobedience. In the middle of the book, the writer turns to hope.',
      meaning:'“Great love” translates a Hebrew word for God’s faithful, covenant love. We are not consumed because of that love, not because we deserve better. His mercies are new every morning, and his faithfulness never runs out.' } },
  'joshua-1-8': {
    ko:{ who:'하나님께서 여호수아에게 하신 말씀으로, 여호수아서에 기록되어 있습니다', when:'주전 1400년경', to:'모세가 죽은 뒤 이스라엘의 새 지도자가 된 여호수아',
      setting:'이스라엘은 요단강을 건너 하나님께서 약속하신 땅으로 들어가려 합니다. 하나님은 여호수아에게 강하고 담대하라고 말씀하십니다.',
      meaning:'‘율법책’은 모세를 통해 주신 하나님의 기록된 말씀입니다. 참된 형통은 재물이나 권력이 아니라 말씀대로 사는 데 있습니다. 말씀을 입에 두고, 밤낮으로 묵상하고, 그대로 행하는 것입니다. 여호수아의 힘은 하나님의 말씀과 함께하심에서 나왔습니다(9절).' },
    en:{ who:'God speaking to Joshua, recorded in the book of Joshua', when:'Around 1400 BC', to:'Joshua, Israel’s new leader after Moses died',
      setting:'Israel is about to cross the Jordan River into the land God promised. God tells Joshua to be strong and courageous.',
      meaning:'The Book of the Law is God’s written Word given through Moses. True success is not mainly wealth or power but living by God’s Word: speaking it, thinking on it day and night, and doing it. Joshua’s strength would come from God’s Word and God’s presence (v. 9).' } },
  'hebrews-11-6': {
    ko:{ who:'서신에 기록자의 이름이 나오지 않습니다', when:'주후 60년대로 보이며, 주후 70년 예루살렘 성전이 무너지기 전입니다', to:'박해 속에서 예수님을 떠나 옛 길로 돌아가고 싶은 유혹을 받던 유대인 그리스도인들',
      setting:'히브리서 11장은 믿음으로 살았던 구약의 성도들을 소개합니다. 5절은 에녹이 “하나님을 기쁘시게 하는 자”였다고 말하고, 6절은 그 이유가 믿음이었음을 설명합니다.',
      meaning:'믿음 없이는 아무도 하나님을 기쁘시게 할 수 없습니다. 믿음은 하나님을 신뢰하고 그분의 말씀을 그대로 받아들이는 것입니다. 하나님이 살아 계시고, 그분을 찾는 자에게 상 주신다는 것을 믿습니다. 가장 큰 상은 하나님 자신입니다.' },
    en:{ who:'The writer is not named in the letter', when:'Probably the AD 60s, before the temple was destroyed in AD 70', to:'Jewish Christians tempted under pressure to turn back from Jesus',
      setting:'Hebrews 11 remembers Old Testament believers who lived by faith. Verse 5 says Enoch “pleased God”; verse 6 explains how: by faith.',
      meaning:'No one can please God without faith: trusting him and taking him at his word. Faith believes that God is real and that he rewards those who seek him. The greatest reward is God himself.' } },
};

    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') { for (const [p, val] of Object.entries(v)) { if (p.startsWith('--')) el.style.setProperty(p, val); else el.style[p] = val; } }
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);

      sp.style.setProperty('--c', v.c); sp.classList.add('lit');
      caption.textContent = t('bookFact', L(v).book, v.bookNo, v.bookNo <= 39 ? t('ot') : t('nt'));
      earned += 10; addPoints(10, li); Chime.note(next);
      next++; sDone.val.textContent = `${next} / 10`;
      if (next === 10) setTimeout(finish, 500);
    } else {
      mistakes++; sMiss.val.textContent = mistakes; Chime.wrong();
      c.classList.remove('bad'); void c.offsetWidth; c.classList.add('bad');
    }
  }
  function finish() {
    const secs = Math.round((Date.now() - t0) / 1000), stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1, bonus = 20 * stars; addPoints(bonus);
    const B = S().best; if (mistakes === 0 && (!B.order || secs < B.order)) { B.order = secs; save(); }
    showMedal({ title: t('inOrder'), sub: t('orderSub'), stars,
      stats: [[`+${earned + bonus}`, t('points')], [fmtTime(secs), t('time')], [String(mistakes), t('slips')]],
      actions: [{ label: t('again'), icon: 'replay', primary: true, fn: () => render() }, { label: t('context'), icon: 'info', fn: () => go('context') }] });
  }
  root.append(h('div', { class: 'card' },
    h('div', { class: 'row between', style: { marginBottom: '14px' } }, h('div', { class: 'stats' }, sDone, sMiss), h('button', { class: 'btn sm', onclick: () => render() }, icon('shuffle'), t('shuffle'))),
    h('div', { class: 'shelf', 'aria-hidden': 'true' }, spines),
    h('div', { class: 'shelf-legend' }, h('span', {}, t('ot')), h('span', {}, t('nt'))),
    caption, pool, list));
}

const VIEWS = { home: viewHome, listen: viewListen, type: viewType, blanks: viewBlanks, build: viewBuild, match: viewMatch, ear: viewEar, final: viewFinal, context: viewContext, order: viewOrder };

/* ============ Boot ============ */
function applyTheme() {
  const dark = P.themeChoice === 'dark';   // light is the default
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const tb = $('#themeBtn'); tb.innerHTML = ''; tb.append(icon(dark ? 'sun' : 'moon')); tb.setAttribute('aria-label', dark ? t('toLight') : t('toDark')); tb.title = tb.getAttribute('aria-label');
  document.querySelector('meta[name="theme-color"]').content = dark ? '#151C19' : '#EDF4EF';
}
function applyChimes() { const b = $('#chimeBtn'); b.innerHTML = ''; b.append(icon(P.chimes ? 'note' : 'noteoff')); b.setAttribute('aria-pressed', String(!!P.chimes)); b.setAttribute('aria-label', P.chimes ? t('chimesOn') : t('chimesOff')); b.title = b.getAttribute('aria-label'); }
$('#themeBtn').onclick = () => { P.themeChoice = P.themeChoice === 'dark' ? 'light' : 'dark'; save(); applyTheme(); };
$('#chimeBtn').onclick = () => { P.chimes = !P.chimes; save(); applyChimes(); if (P.chimes) Chime.tap(); };
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { if (LANG === b.dataset.lang) return; LANG = P.lang = b.dataset.lang; save(); Player.stop(); render(); });
document.querySelectorAll('[data-ic]').forEach(s => s.replaceWith(icon(s.dataset.ic)));
document.querySelectorAll('[data-mark]').forEach(s => (s.innerHTML = markSVG()));
const fav = document.createElement('link'); fav.rel = 'icon'; fav.href = 'data:image/svg+xml,' + encodeURIComponent(markSVG().replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ')); document.head.append(fav);
$('#ptsN').textContent = P.points.toLocaleString();
Player.init();
document.addEventListener('focusin', e => { if (e.target.matches('input.tinput') && matchMedia('(max-width: 899px)').matches) document.body.classList.add('kb'); });
document.addEventListener('focusout', e => { if (e.target.matches('input.tinput')) document.body.classList.remove('kb'); });
const onNav = () => { if (location.hash !== shownHash) render(); };
window.addEventListener('hashchange', onNav);
window.addEventListener('popstate', onNav);
document.querySelectorAll('[data-home]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); go('home'); }));
render();
</script>
</body>
