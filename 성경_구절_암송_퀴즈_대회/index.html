<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hidden in My Heart</title>
<meta name="description" content="Memorize nine NIV verses by listening, fading, typing, building and matching.">
<meta name="theme-color" content="#121731">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root{
  color-scheme: dark;
  --bg:#121731; --bg-2:#161C3B; --surface:#1C2347; --surface-2:#262E59; --line:#363F72;
  --text:#EEF0FB; --muted:#A9AFD6; --soft:rgba(255,255,255,.06);
  --ink:#10142A; --mix:#ffffff; --mixamt:24%; --bad:#FF7A7A; --focus:#9DB8FF;
  --shadow:0 18px 40px -18px rgba(0,0,0,.55);
  --r-lg:28px; --r-md:18px; --r-sm:12px; --nav-h:68px;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#F2F3FA; --bg-2:#E8EAF6; --surface:#FFFFFF; --surface-2:#EEF0F8; --line:#D6DAEC;
  --text:#1B2042; --muted:#5A6089; --soft:rgba(20,30,90,.05);
  --mix:#000000; --mixamt:34%; --bad:#D93B3B; --focus:#3D63DD;
  --shadow:0 18px 40px -22px rgba(30,40,90,.35);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#F2F3FA; --bg-2:#E8EAF6; --surface:#FFFFFF; --surface-2:#EEF0F8; --line:#D6DAEC;
    --text:#1B2042; --muted:#5A6089; --soft:rgba(20,30,90,.05);
    --mix:#000000; --mixamt:34%; --bad:#D93B3B; --focus:#3D63DD;
    --shadow:0 18px 40px -22px rgba(30,40,90,.35);
  }
}
/* text-safe version of any accent color --c */
*{ --ct: color-mix(in oklab, var(--c, #8B6CF6), var(--mix) var(--mixamt)); }

/* ============ Base ============ */
*,*::before,*::after{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
@media (min-width:900px){html{font-size:18px}}
body{margin:0;font-family:'Lexend',system-ui,-apple-system,sans-serif;font-weight:400;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:12px}
.ic{width:1.3em;height:1.3em;flex:none;display:block}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ Shell ============ */
.app{min-height:100dvh}
.side{display:none}
main{padding:0 16px calc(var(--nav-h) + 34px + env(safe-area-inset-bottom));max-width:1000px;margin:0 auto;min-width:0}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:268px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;padding:26px 16px 18px;background:var(--bg-2);border-right:1px solid var(--line);overflow-y:auto}
  main{padding:0 44px 64px;width:100%}
}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:1.06rem;line-height:1.2;padding:0 10px 18px}
.brand .mark{width:42px;height:42px;flex:none}
.navgroup{margin-top:8px}
.navgroup h4{font-size:.8rem;font-weight:500;color:var(--muted);margin:16px 12px 6px}
.navi{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:16px;font-weight:500;font-size:.96rem;text-align:left;transition:background .2s}
.navi .nic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 17%,transparent);color:var(--at);transition:background .2s,color .2s}
.navi{--at:color-mix(in oklab,var(--a),var(--mix) var(--mixamt))}
.navi:hover{background:var(--soft)}
.navi.on{background:color-mix(in srgb,var(--a) 15%,transparent)}
.navi.on .nic{background:var(--a);color:var(--ink)}
.side-foot{margin-top:auto;padding:18px 10px 0;font-size:.74rem;color:var(--muted);line-height:1.5}

.topbar{display:flex;align-items:center;gap:8px;padding:14px 0 6px}
.brand-m{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1rem;margin-right:auto;min-width:0}
.brand-m .mark{width:32px;height:32px;flex:none}
.brand-m span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:900px){.brand-m{visibility:hidden}}
@media (max-width:520px){.pill.streak{display:none}.brand-m{font-size:.88rem;gap:8px}.brand-m .mark{width:28px;height:28px}.topbar{gap:6px}.tbtn{width:36px;height:36px}.pill{height:36px;padding:0 11px}}
@media (max-width:340px){.brand-m span{display:none}}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:.9rem;white-space:nowrap}
.pill .ic{width:1.1em;height:1.1em}
.pill.pts .ic{color:#F2C230}
.pill.streak .ic{color:#F5873A}
.pill.bump{animation:bump .5s cubic-bezier(.3,1.7,.5,1)}
.tbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.tbtn[aria-pressed="true"]{color:var(--text)}
.tbtn .ic{width:1.15em;height:1.15em}

.pagehead{padding:14px 0 14px}
.pagehead:empty{display:none}
.pagehead h1{font-size:clamp(1.55rem,1.2rem + 1.4vw,2.1rem);font-weight:600;letter-spacing:-.015em;line-height:1.15}
.pagehead p{color:var(--muted);margin-top:6px;max-width:60ch}
@media (max-width:899px){.pagehead{padding:8px 0 12px}.pagehead h1{font-size:1.5rem}.pagehead p{font-size:.88rem;margin-top:4px}.subtabs{margin-top:12px}}
.subtabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
@media (min-width:900px){.subtabs{display:none}}
.subtab{display:inline-flex;align-items:center;gap:7px;padding:8px 14px 8px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.88rem;font-weight:500;white-space:nowrap;--at:color-mix(in oklab,var(--a),var(--mix) var(--mixamt))}
.subtab .ic{color:var(--at);width:1.15em;height:1.15em}
.subtab.on{background:var(--a);color:var(--ink);border-color:transparent}
.subtab.on .ic{color:var(--ink)}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--bg-2) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
@media (min-width:900px){.bnav{display:none}}
body.kb .bnav{display:none}
.bn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:.74rem;font-weight:500;color:var(--muted);--at:color-mix(in oklab,var(--a),var(--mix) var(--mixamt))}
.bn .nic{width:52px;height:30px;border-radius:999px;display:grid;place-items:center;color:var(--at);transition:background .2s}
.bn.on{color:var(--text)}
.bn.on .nic{background:var(--a);color:var(--ink)}

/* ============ Verse bar ============ */
.vbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 16px;padding:4px 16px 6px;scroll-snap-type:x proximity}
.vbar::-webkit-scrollbar{display:none}
@media (min-width:900px){.vbar{flex-wrap:wrap;margin:0 0 18px;padding:0;overflow:visible}}
.vchip{flex:none;display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.86rem;font-weight:500;white-space:nowrap;scroll-snap-align:start;transition:background .2s,transform .2s}
.vchip .dot{width:22px;height:22px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:var(--ink)}
.vchip .dot .ic{width:14px;height:14px;stroke-width:2.2}
.vchip:hover{border-color:var(--c)}
.vchip.on{background:var(--c);color:var(--ink);border-color:transparent}
.vchip.on .dot{background:rgba(255,255,255,.55)}

/* ============ Building blocks ============ */
.stage{background:color-mix(in srgb,var(--c) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 34%,var(--line));border-radius:var(--r-lg);padding:clamp(18px,3.4vw,38px);position:relative;box-shadow:var(--shadow)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(16px,3vw,30px);box-shadow:var(--shadow)}
.vhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.medal-sm{width:52px;height:52px;border-radius:50%;background:var(--c);color:var(--ink);display:grid;place-items:center;flex:none;box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent)}
.medal-sm .ic{width:28px;height:28px;stroke-width:1.9}
.vhead-t{flex:1;min-width:150px}
.vhead-t h2{font-size:1.25rem;font-weight:600;letter-spacing:-.01em}
.vhead-t p{color:var(--muted);font-size:.9rem}
.verse{font-family:'Literata',Georgia,serif;font-optical-sizing:auto;font-size:clamp(1.3rem,1.06rem + 1vw,1.64rem);line-height:1.75;margin:22px 0 10px;text-wrap:pretty;overflow-wrap:break-word}
.grp{white-space:nowrap}
.w{border-radius:.3em;transition:color .25s,background-color .25s,opacity .3s,filter .35s,text-shadow .3s}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:500;font-size:.95rem;background:var(--surface);border:1px solid var(--line);transition:transform .15s,background .2s,border-color .2s;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--c,#8B6CF6) 60%,var(--line))}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--c,#8B6CF6);color:var(--ink);border-color:transparent;font-weight:600}
.btn.sm{min-height:38px;padding:0 14px;font-size:.86rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.ibtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none;transition:transform .15s,border-color .2s}
.ibtn:hover{border-color:var(--c,var(--line))}
.ibtn:active{transform:scale(.93)}
.ibtn.on{background:var(--c);color:var(--ink);border-color:transparent}

.seg{display:inline-flex;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--text) 7%,transparent);gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg-b{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-size:.86rem;font-weight:500;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.seg-b .ic{width:1.1em;height:1.1em}
.seg-b.on{background:var(--surface);color:var(--text);box-shadow:0 2px 8px -2px rgba(0,0,0,.25)}

.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:flex-start;padding:8px 14px;border-radius:14px;background:color-mix(in srgb,var(--text) 6%,transparent);min-width:74px}
.stat b{font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:.74rem;color:var(--muted)}
.prog{height:8px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent);overflow:hidden;flex:1;min-width:80px}
.prog i{display:block;height:100%;width:0;border-radius:99px;background:var(--c);transition:width .12s linear}
.hint-line{font-size:.82rem;color:var(--muted)}
.divider{height:1px;background:color-mix(in srgb,var(--c,#888) 22%,var(--line));margin:20px 0}

/* ============ Listen ============ */
.bigplay{width:76px;height:76px;border-radius:50%;background:var(--c);color:var(--ink);display:grid;place-items:center;flex:none;box-shadow:0 10px 30px -8px color-mix(in srgb,var(--c) 70%,transparent);transition:transform .15s}
.bigplay .ic{width:32px;height:32px}
.bigplay:active{transform:scale(.94)}
.bigplay.on{animation:breathe 2.4s ease-in-out infinite}
.karaoke .w{cursor:pointer}
.karaoke.playing .w{opacity:.48}
.karaoke.playing .w.past,.karaoke.playing .w.now{opacity:1}
.karaoke .w.now{color:var(--ct);text-shadow:0 0 18px color-mix(in srgb,var(--c) 80%,transparent)}
.mode-reveal .w:not(.past):not(.now),.mode-hide .w{color:transparent!important;text-shadow:none!important;background:color-mix(in srgb,var(--c) 20%,transparent);opacity:1!important}
.mode-hide .w.now{background:color-mix(in srgb,var(--c) 70%,transparent)}
.mode-reveal .w.now{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.w.say{filter:blur(7px);opacity:.55!important}
.turn{display:flex;align-items:center;gap:12px;min-height:44px;color:var(--ct);font-weight:500;opacity:0;transition:opacity .25s}
.turn.on{opacity:1}
.turn svg{width:40px;height:40px;transform:rotate(-90deg)}
.turn circle{fill:none;stroke-width:4}
.turn .bgc{stroke:color-mix(in srgb,var(--c) 22%,transparent)}
.turn .fgc{stroke:var(--c);stroke-linecap:round;stroke-dasharray:107;stroke-dashoffset:0}
.turn.on .fgc{animation:drain var(--d,3s) linear forwards}
@media (max-width:899px){
  .dock{position:sticky;z-index:6;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));margin-inline:-6px;padding:10px 12px;border-radius:26px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));box-shadow:var(--shadow)}
  .dock .bigplay{width:62px;height:62px}
  .dock{flex-wrap:nowrap}
  .dock>.btn{flex:1;padding:0 12px}
}
.time{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:74px;text-align:right}

/* ============ Fade ============ */
.fading .w.hid:not(.peek){color:transparent;text-shadow:none;background:color-mix(in srgb,var(--c) 26%,transparent);cursor:pointer}
.fading .w.hid.peek{color:var(--text);background:color-mix(in srgb,var(--c) 10%,transparent)}
.fading.letters .w.hid:not(.peek){position:relative}
.fading.letters .w.hid:not(.peek)::before{content:attr(data-f);position:absolute;left:.12em;color:var(--ct)}
.fading .w.hid.now:not(.peek){background:color-mix(in srgb,var(--c) 72%,transparent)}
.steps{display:flex;gap:6px;align-items:center}
.steps i{width:28px;height:8px;border-radius:99px;background:color-mix(in srgb,var(--c) 20%,transparent);transition:background .3s}
.steps i.on{background:var(--c)}
.donebox{margin-top:18px;padding:18px 20px;border-radius:20px;background:color-mix(in srgb,var(--c) 14%,transparent);border:1px dashed color-mix(in srgb,var(--c) 60%,transparent)}
.donebox h3{font-size:1.08rem;font-weight:600;margin-bottom:4px}
.donebox p{color:var(--muted);margin-bottom:14px;font-size:.92rem}

/* ============ Type & Build slots ============ */
.slot{display:inline-block;min-width:calc(var(--len,3) * .55em);border-bottom:2px solid color-mix(in srgb,var(--c) 34%,var(--line));line-height:1.28;border-radius:6px 6px 2px 2px;padding:0 .05em;transition:background .25s,border-color .25s,color .25s;vertical-align:baseline}
.slot .ghost{opacity:.34}
.slot.cur{border-bottom-color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.caret{display:inline-block;width:2px;height:1em;margin:0 1px -.12em;background:var(--c);animation:blink 1s steps(1) infinite;visibility:hidden}
.typing.focus .slot.cur .caret{visibility:visible}
.slot.done{border-bottom-color:transparent;color:var(--ct);min-width:0}
.slot.done.skipped{color:var(--muted);border-bottom:2px dotted var(--line)}
.slot.fresh{animation:pop .5s cubic-bezier(.3,1.7,.5,1),glowfill 1.3s ease-out}
.slot.bad{border-bottom-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.typebar{display:flex;align-items:center;gap:10px;margin-top:20px}
.tinput{flex:1;min-width:0;font:inherit;font-size:1.08rem;height:54px;padding:0 20px;border-radius:999px;border:2px solid color-mix(in srgb,var(--c) 42%,var(--line));background:var(--surface);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.tinput::placeholder{color:var(--muted)}
.tinput:focus{border-color:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent)}
.tinput.bad{border-color:var(--bad);box-shadow:0 0 0 5px color-mix(in srgb,var(--bad) 18%,transparent)}
.shake{animation:shake .38s}
@media (max-width:520px){.typebar .ibtn{width:44px;height:44px}.typebar{gap:7px}.tinput{padding:0 16px}}
.build .verse{font-size:clamp(1.1rem,.98rem + .7vw,1.4rem);line-height:1.8}
.pool{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
.chip{font-family:'Literata',Georgia,serif;font-size:1.06rem;padding:8px 15px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 30%,var(--line));transition:transform .12s,border-color .2s,opacity .25s}
.chip:hover{border-color:var(--c)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.chip.bad{border-color:var(--bad);animation:shake .38s}
.chip.gone{animation:chipout .28s forwards;pointer-events:none}
.chip.flash{animation:flash 1.1s ease-in-out 2}
@media (max-width:520px){.chip{font-size:.98rem;padding:7px 12px}}

/* ============ Match ============ */
.tray{position:sticky;top:8px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:22px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);margin-bottom:16px}
@media (max-width:899px){
  .tray{position:fixed;top:auto;left:10px;right:10px;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom));flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0;box-shadow:var(--shadow)}
  .tray::-webkit-scrollbar{display:none}
  .match-pad{height:86px}
}
.rchip{flex:none;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:.92rem;white-space:nowrap;transition:transform .15s,background .2s}
.rchip.sel{background:var(--text);color:var(--bg);transform:translateY(-2px)}
.rchip.bad{border-color:var(--bad);animation:shake .38s}
.rchip.gone{animation:chipout .3s forwards}
.mgrid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.mgrid{grid-template-columns:1fr 1fr}}
@media (min-width:1200px){.mgrid{grid-template-columns:1fr 1fr 1fr}}
.mcard{text-align:left;padding:18px 20px;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;transition:border-color .25s,background .3s,transform .15s}
.mcard .mtext{font-family:'Literata',Georgia,serif;font-size:1.02rem;line-height:1.6}
.mcard:hover{border-color:color-mix(in srgb,var(--text) 30%,var(--line))}
.mcard.sel{border-color:var(--text);transform:translateY(-2px)}
.mcard.bad{border-color:var(--bad);animation:shake .38s}
.mcard.ok{background:color-mix(in srgb,var(--c) 14%,var(--surface));border-color:var(--c);cursor:default}
.mbadge{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:5px 12px 5px 6px;border-radius:999px;background:var(--c);color:var(--ink);font-weight:600;font-size:.85rem;animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.mbadge .ic{width:20px;height:20px;padding:3px;border-radius:50%;background:rgba(255,255,255,.5)}
.mslot{height:30px;align-self:flex-start;min-width:120px;border-radius:999px;border:1.5px dashed var(--line)}

/* ============ By ear ============ */
.disc{--sz:168px;width:var(--sz);height:var(--sz);border-radius:50%;position:relative;display:grid;place-items:center;margin:8px auto 4px;flex:none}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#F0505A,#F5873A,#F2C230,#9BD14B,#34C28A,#26BCD0,#4C8DF6,#8B6CF6,#E055B5,#F0505A)}
@media (max-height:720px){.disc{--sz:128px}.disc-in .ic{width:36px;height:36px}}
.disc.solved::before{background:conic-gradient(from 30deg,var(--c),color-mix(in srgb,var(--c) 45%,white),var(--c))}
.disc.on::before{animation:spin 5s linear infinite}
.disc-in{position:relative;width:calc(100% - 18px);height:calc(100% - 18px);border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--text)}
.disc-in .ic{width:46px;height:46px}
.eq{display:flex;gap:5px;align-items:center;height:46px}
.eq i{width:6px;border-radius:9px;background:var(--text);height:30%;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.2s}.eq i:nth-child(3){animation-delay:-.45s}.eq i:nth-child(4){animation-delay:-.1s}.eq i:nth-child(5){animation-delay:-.6s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.opt{min-height:62px;padding:10px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:1rem;transition:background .25s,border-color .25s,transform .12s}
.opt:hover{border-color:color-mix(in srgb,var(--text) 35%,var(--line))}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--c);color:var(--ink);border-color:transparent;animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.opt.no{border-color:var(--bad);color:var(--bad);animation:shake .38s}
.opt.dim{opacity:.45}
.reveal{margin-top:18px;padding:18px 20px;border-radius:22px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));animation:rise .35s ease-out}
.reveal p.vt{font-family:'Literata',Georgia,serif;font-size:1.08rem;line-height:1.65;margin:10px 0 14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1100px){.tiles{grid-template-columns:repeat(6,1fr)}}
.tile{aspect-ratio:1/1.08;perspective:900px;position:relative}
.tile-in{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.tile.up .tile-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);font-weight:500;font-size:.88rem}
.face.back{background:var(--surface)}
.face.back .ic{width:34px;height:34px}
.face.back.snd{background:color-mix(in srgb,#26BCD0 16%,var(--surface));color:color-mix(in oklab,#26BCD0,var(--mix) var(--mixamt))}
.face.back.ref{background:color-mix(in srgb,#8B6CF6 16%,var(--surface));color:color-mix(in oklab,#8B6CF6,var(--mix) var(--mixamt))}
.face.back small{font-size:.72rem;color:var(--muted)}
.face.front{transform:rotateY(180deg);background:var(--surface-2)}
.face.front .ic{width:30px;height:30px}
.tile.done .face.front{background:var(--c);color:var(--ink);border-color:transparent}
.tile.done{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.tile button{position:absolute;inset:0;border-radius:18px;z-index:2}

/* ============ Order ============ */
.shelf{display:flex;align-items:flex-end;gap:2px;height:96px;padding:0 2px;border-bottom:3px solid var(--line)}
.spine{flex:1;min-width:2px;border-radius:3px 3px 0 0;background:color-mix(in srgb,var(--text) 14%,transparent);transition:height .45s cubic-bezier(.3,1.5,.5,1),background .3s,box-shadow .3s}
.spine.nt{margin-left:7px}
.spine.lit{background:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 75%,transparent);height:92px!important}
.shelf-legend{display:grid;grid-template-columns:39fr 27fr;gap:7px;font-size:.76rem;color:var(--muted);margin-top:6px}
.shelf-legend span{border-top:2px solid var(--line);padding-top:4px}
.shelf-legend span:last-child{text-align:right}
.placed{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.placed li{display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;border-radius:16px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));animation:rise .35s ease-out}
.placed .n{width:32px;height:32px;border-radius:50%;background:var(--c);color:var(--ink);display:grid;place-items:center;font-weight:600;font-size:.9rem;flex:none}
.placed .bk{margin-left:auto;font-size:.78rem;color:var(--muted);white-space:nowrap}
.placed li.ghost{background:transparent;border:1.5px dashed var(--line);color:var(--muted);animation:none}
.placed li.ghost .n{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}

/* ============ Home ============ */
.hero{display:grid;gap:22px;align-items:center;padding:6px 0 26px}
@media (min-width:760px){.hero{grid-template-columns:minmax(260px,380px) 1fr;gap:40px;padding:18px 0 34px}}
.rose-wrap{width:min(100%,380px);margin:0 auto}
.rose-wrap>svg{width:100%;height:auto;display:block;overflow:visible}
.rose .pane{opacity:.22;transition:opacity .4s}
.rose .pane.lit{opacity:1;filter:drop-shadow(0 0 6px var(--c))}
.rose .rim{fill:none;stroke:var(--line);stroke-width:2}
.rose .lead{fill:var(--bg)}
.rose .hub{fill:var(--surface);stroke:var(--line);stroke-width:2}
.rose .hub-n{font:600 30px Lexend,sans-serif;fill:var(--text)}
.rose .hub-l{font:400 11.5px Lexend,sans-serif;fill:var(--muted)}
.rose [data-v]{cursor:pointer}
.rose [data-v]:hover .pane{opacity:.4}
.rose [data-v]:hover .pane.lit{opacity:1}
.rose .badge-c{transition:transform .2s;transform-origin:center;transform-box:fill-box}
.rose [data-v]:hover .badge-c{transform:scale(1.12)}
.hero h1{font-size:clamp(1.8rem,1.3rem + 2vw,2.7rem);line-height:1.1;font-weight:600;letter-spacing:-.02em}
.hero .lede{color:var(--muted);margin:12px 0 18px;max-width:46ch;font-size:1.02rem}
.hero .stats{margin-bottom:20px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.sec-h h2{font-size:1.3rem;font-weight:600}
.sec-h p{color:var(--muted);font-size:.86rem}
.vgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:700px){.vgrid{grid-template-columns:1fr 1fr}}
.vcard{display:flex;flex-direction:column;gap:12px;padding:18px 18px 16px;border-radius:24px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.vcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.vc-top{display:flex;align-items:center;gap:12px}
.vc-top .medal-sm{width:44px;height:44px;box-shadow:none}
.vc-top .medal-sm .ic{width:24px;height:24px}
.vc-top h3{font-size:1.05rem;font-weight:600}
.vc-top p{font-size:.82rem;color:var(--muted)}
.vc-top .ibtn{margin-left:auto;width:44px;height:44px}
.vc-text .w{cursor:default}
.vc-text{font-family:'Literata',Georgia,serif;font-size:1.04rem;line-height:1.62}
.vc-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto}
.pip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px 0 8px;border-radius:999px;font-size:.78rem;font-weight:500;background:color-mix(in srgb,var(--text) 6%,transparent);color:var(--muted);transition:background .2s}
.pip .ic{width:1.15em;height:1.15em}
.pip:hover{background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--text)}
.pip.lit{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--ct)}
.credits{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:.76rem;color:var(--muted);line-height:1.6}
.credits button{text-decoration:underline;text-underline-offset:3px}

/* ============ Medal modal ============ */
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(8,10,26,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px;opacity:0;transition:opacity .25s}
.modal-back.in{opacity:1}
.modal{width:min(470px,100%);max-height:calc(100dvh - 36px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:32px;padding:30px 24px 22px;text-align:center;transform:translateY(18px) scale(.96);transition:transform .4s cubic-bezier(.2,1.4,.4,1)}
.modal-back.in .modal{transform:none}
.medal{width:136px;height:136px;margin:0 auto 14px;border-radius:50%;padding:9px;background:conic-gradient(from 210deg,var(--c),color-mix(in srgb,var(--c) 40%,white),var(--c),color-mix(in srgb,var(--c) 60%,black),var(--c));box-shadow:0 0 60px -6px color-mix(in srgb,var(--c) 70%,transparent);animation:medalin .8s cubic-bezier(.2,1.5,.4,1)}
.medal.rainbow{background:conic-gradient(#F0505A,#F5873A,#F2C230,#9BD14B,#34C28A,#26BCD0,#4C8DF6,#8B6CF6,#E055B5,#F0505A);box-shadow:0 0 60px -10px #8B6CF6}
.medal-in{width:100%;height:100%;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--ct)}
.medal.rainbow .medal-in{color:var(--text)}
.medal-in .ic{width:60px;height:60px;stroke-width:1.5}
.modal h2{font-size:1.45rem;font-weight:600;letter-spacing:-.01em}
.modal .sub{color:var(--muted);margin-top:2px}
.stars{display:flex;justify-content:center;gap:6px;margin:14px 0 4px}
.stars .ic{width:32px;height:32px;color:color-mix(in srgb,var(--text) 18%,transparent)}
.stars .ic.on{color:#F2C230;animation:starin .5s cubic-bezier(.3,1.8,.5,1) both}
.stars .ic.on:nth-child(2){animation-delay:.12s}.stars .ic.on:nth-child(3){animation-delay:.24s}
.modal .stats{justify-content:center;margin:16px 0}
.modal .stat{align-items:center}
.modal .note{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ct);font-size:.86rem;font-weight:500;margin-bottom:6px}
.modal .vt{font-family:'Literata',Georgia,serif;font-size:1.02rem;line-height:1.62;margin:12px 4px 4px;text-align:left}
.modal .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}

/* ============ Misc ============ */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:70;padding:12px 18px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:500;font-size:.9rem;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s,transform .3s;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){#toast{bottom:28px}}
.fpts{position:fixed;z-index:65;font-weight:700;font-size:1rem;color:var(--ct);pointer-events:none;animation:floatup .9s ease-out forwards;text-shadow:0 2px 10px color-mix(in srgb,var(--c) 60%,transparent)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80;width:100%;height:100%}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.24)}100%{transform:scale(1)}}
@keyframes glowfill{0%{background:color-mix(in srgb,var(--c) 45%,transparent);text-shadow:0 0 26px var(--c)}100%{background:transparent;text-shadow:0 0 0 transparent}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes blink{50%{opacity:0}}
@keyframes floatup{from{opacity:1;transform:translateY(0) scale(.9)}to{opacity:0;transform:translateY(-42px) scale(1.1)}}
@keyframes chipout{to{opacity:0;transform:scale(.6) translateY(-14px)}}
@keyframes flash{50%{border-color:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 35%,transparent)}}
@keyframes breathe{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--c) 18%,transparent),0 10px 30px -8px color-mix(in srgb,var(--c) 70%,transparent)}}
@keyframes drain{from{stroke-dashoffset:0}to{stroke-dashoffset:107}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes eq{0%,100%{height:22%}50%{height:100%}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes medalin{0%{transform:scale(.3) rotate(-60deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes starin{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}
@keyframes bump{40%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

    const stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1; const bonus = 20 * stars; addPoints(bonus);
    const prev = P.best.match; const newBest = mistakes === 0 && (!prev || secs < prev); if (newBest) { P.best.match = secs; save(); }
    showMedal({ title: 'All nine matched', sub: newBest ? 'A new best time' : 'Every verse found its reference', stars,
      stats: [[`+${earned + bonus}`, 'points'], [fmtTime(secs), 'time'], [String(mistakes), mistakes === 1 ? 'slip' : 'slips']].concat(P.best.match ? [[fmtTime(P.best.match), 'best clean time']] : []),
      actions: [{ label: 'Play again', icon: 'replay', primary: true, fn: () => render() }, { label: 'Try By ear', icon: 'ear', fn: () => go('ear') }] });
  }
  root.append(h('div', { class: 'row between', style: { marginBottom: '14px' } }, h('div', { class: 'stats' }, sDone, sTime, sMiss),
    h('button', { class: 'btn sm', onclick: () => render() }, icon('shuffle'), 'New round')));
  root.append(tray, grid, h('div', { class: 'match-pad' }));
}

/* ============ BY EAR ============ */
function viewEar(root) {
  Player.preloadAll();
  const mode = P.earMode || 'name';
  root.append(h('div', { style: { marginBottom: '16px' } }, seg([['name', 'Name that verse', 'target'], ['pairs', 'Sound pairs', 'cards']], mode, m => { P.earMode = m; save(); render(); }, 'Game')));
  const box = h('div'); root.append(box);
  (mode === 'pairs' ? earPairs : earName)(box);
}
function clipFor(v, kind) {
  const T = timings(v);
  if (kind === 'opening') { const k = Math.min(3, T.length - 1); return { from: 0, to: T[k][1] + 0.12, label: 'opening words' }; }
  if (kind === 'phrase') {
    const ok = v.phrases.filter(([a, b]) => b - a >= 2); const [a, b] = (ok.length ? ok : v.phrases)[Math.random() * (ok.length || v.phrases.length) | 0];
    return { from: Math.max(0, T[a][0] - 0.05), to: T[b][1] + 0.12, a, b, label: 'a phrase' };
  }
  return { from: 0, to: null, label: 'whole verse' };
}
function earName(root) {
  const kind = P.earClip || 'whole';
  const deck = shuffle(VERSES); let round = 0, score = 0, answered = false, clip = null, earned = 0, replays = 0;
  const panel = h('div', { class: 'panel', style: { '--c': '#26BCD0' } });
  const disc = h('span', { class: 'disc' }, h('span', { class: 'disc-in' }, icon('play')));
  const discBtn = h('button', { 'aria-label': 'Play the recording', style: { borderRadius: '50%', display: 'block', margin: '0 auto' } }, disc);
  const roundEl = h('p', { style: { textAlign: 'center', fontWeight: 600, marginTop: '8px' } });
  const sub = h('p', { class: 'hint-line', style: { textAlign: 'center' } });
  const opts = h('div', { class: 'opts' });
  const after = h('div');
  const sScore = stat('0', 'correct');
  function setPlaying(on, v) {
    disc.classList.toggle('on', on);
    const inner = disc.firstChild; inner.innerHTML = '';
    inner.append(on ? h('span', { class: 'eq' }, h('i'), h('i'), h('i'), h('i'), h('i')) : answered ? icon(v.icon) : icon('play'));
  }
  async function playClip() {
    const v = deck[round]; if (!clip) clip = clipFor(v, kind); else replays++;
    if (Player.isPlaying()) { Player.stop(); setPlaying(false, v); return; }
    setPlaying(true, v);
    await Player.play(v, { from: clip.from, to: clip.to });
    if (deck[round] === v) setPlaying(false, v);
  }
  discBtn.onclick = playClip;
  function setupRound() {
    answered = false; clip = null; replays = 0; after.innerHTML = '';
    const v = deck[round];
    disc.classList.remove('solved'); disc.style.removeProperty('--c'); setPlaying(false, v);
    roundEl.textContent = `Verse ${round + 1} of 9`;
    sub.textContent = `Press play to hear the ${({ whole: 'whole verse', opening: 'opening words', phrase: 'a random phrase' })[kind]}.`;
    opts.innerHTML = '';
    const choices = shuffle([v, ...shuffle(VERSES.filter(x => x !== v)).slice(0, 3)]);
    choices.forEach(x => { const b = h('button', { class: 'opt', style: { '--c': x.c } }, x.ref); b._v = x; b.onclick = () => answer(b); opts.append(b); });
  }
  function answer(b) {
    if (answered) return; const v = deck[round];
    if (!clip) { toast('Play the recording first'); return; }
    answered = true;
    const right = b._v === v;
    [...opts.children].forEach(o => { if (o._v === v) o.classList.add('ok'); else if (o === b) o.classList.add('no'); else o.classList.add('dim'); });
    disc.classList.add('solved'); disc.style.setProperty('--c', v.c);
    if (right) { score++; sScore.val.textContent = score; const pts = replays ? 8 : 15; earned += pts; addPoints(pts, b); Chime.note(score + 2); } else Chime.wrong();
    Player.stop(); setPlaying(false, v);
    const words = []; const vt = h('p', { class: 'vt karaoke' }); vt.append(verseNodes(v, k => (words[k] = h('span', { class: 'w' }, v.words[k]))));
    if (clip.a != null) for (let k = clip.a; k <= clip.b; k++) words[k].style.textDecoration = 'underline';
    const hearAll = h('button', { class: 'btn sm' }, icon('play'), 'Hear all of it');
    hearAll.onclick = () => { if (Player.isPlaying(v)) Player.stop(); else karaoke(v, words, vt, hearAll); };
    const last = round === 8;
    after.append(h('div', { class: 'reveal', style: { '--c': v.c } },
      h('div', { class: 'vhead' }, h('span', { class: 'medal-sm' }, icon(v.icon)), h('div', { class: 'vhead-t' }, h('h2', {}, right ? `Yes, ${v.ref}` : `That was ${v.ref}`), h('p', {}, v.theme))),
      vt,
      h('div', { class: 'row' }, hearAll, h('button', { class: 'btn primary', onclick: () => (last ? finish() : (round++, setupRound(), playClip())) }, icon('next'), last ? 'See results' : 'Next verse'))));
    after.querySelector('.btn.primary').focus({ preventScroll: true });
    after.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  function finish() {
    const stars = score === 9 ? 3 : score >= 7 ? 2 : 1; const bonus = 15 * stars; addPoints(bonus);
    const k = 'ear:' + kind; P.best[k] = Math.max(P.best[k] || 0, score); save();
    showMedal({ title: `${score} of 9 by ear`, sub: ({ whole: 'Whole verses', opening: 'Opening words only', phrase: 'Random phrases' })[kind], stars,
      stats: [[`+${earned + bonus}`, 'points'], [`${P.best[k]} / 9`, 'best']],
      actions: [{ label: 'Play again', icon: 'replay', primary: true, fn: () => render() }, kind !== 'phrase' ? { label: 'Make it harder', icon: 'next', fn: () => { P.earClip = kind === 'whole' ? 'opening' : 'phrase'; save(); render(); } } : { label: 'Sound pairs', icon: 'cards', fn: () => { P.earMode = 'pairs'; save(); render(); } }] });
  }
  panel.append(
    h('div', { class: 'row between', style: { marginBottom: '8px' } },
      seg([['whole', 'Whole verse'], ['opening', 'Opening'], ['phrase', 'One phrase']], kind, k => { P.earClip = k; save(); render(); }, 'Clip length'),
      h('div', { class: 'stats' }, sScore)),
    discBtn, roundEl, sub, opts, after);
  root.append(panel);
  setupRound();
}
function earPairs(root) {
  const size = P.pairsSize || 6;
  const sel = shuffle(VERSES).slice(0, size);
  const tiles = shuffle([...sel.map(v => ({ type: 'snd', v })), ...sel.map(v => ({ type: 'ref', v }))]);
  let open = [], lock = false, moves = 0, found = 0, earned = 0, t0 = 0;
  const sMoves = stat('0', 'flips'), sFound = stat(`0 / ${size}`, 'pairs');
  const grid = h('div', { class: 'tiles' + (size === 9 ? ' n18' : '') });
  tiles.forEach(t => {
    const front = t.type === 'snd' ? h('div', { class: 'face front' }, icon('ear'), h('span', {}, 'Tap to replay')) : h('div', { class: 'face front' }, icon('bookref'), h('span', {}, t.v.ref));
    const back = t.type === 'snd' ? h('div', { class: 'face back snd' }, icon('speaker'), h('small', {}, 'Sound')) : h('div', { class: 'face back ref' }, icon('bookref'), h('small', {}, 'Reference'));
    t.front = front;
    t.el = h('div', { class: 'tile', style: { '--c': t.v.c } }, h('div', { class: 'tile-in' }, back, front),
      h('button', { 'aria-label': t.type === 'snd' ? 'Sound card' : 'Reference card', onclick: () => flip(t) }));
    grid.append(t.el);
  });
  function playSnd(t) { const T = timings(t.v); return Player.play(t.v, { from: 0, to: T[Math.min(5, T.length - 1)][1] + 0.12 }); }
  function flip(t) {
    if (t.done) { if (t.type === 'snd') playSnd(t); return; }
    if (lock || open.includes(t)) { if (t.type === 'snd' && open.includes(t)) playSnd(t); return; }
    if (!t0) t0 = Date.now();
    t.el.classList.add('up'); open.push(t);
    if (t.type === 'snd') playSnd(t); else Chime.tap();
    if (open.length < 2) return;
    moves++; sMoves.val.textContent = moves;
    const [a, b] = open;
    if (a.v === b.v && a.type !== b.type) {
      open = []; found++; sFound.val.textContent = `${found} / ${size}`; a.done = b.done = true;
      setTimeout(() => {
        [a, b].forEach(x => { x.el.classList.add('done'); x.front.innerHTML = ''; x.front.append(icon(x.v.icon), h('span', {}, x.v.short)); });
        earned += 12; addPoints(12, b.el); Chime.note(found + 2);
        if (found === size) setTimeout(finish, 500);
      }, 350);
    } else {
      lock = true;
      setTimeout(() => { a.el.classList.remove('up'); b.el.classList.remove('up'); open = []; lock = false; }, 1500);
    }
  }
  function finish() {
    const secs = Math.round((Date.now() - t0) / 1000); const perfect = size; const stars = moves <= perfect + 2 ? 3 : moves <= perfect * 2 ? 2 : 1;
    const bonus = 15 * stars * (size === 9 ? 1.5 : 1) | 0; addPoints(bonus);
    const k = 'pairs:' + size; const newBest = !P.best[k] || moves < P.best[k]; if (newBest) { P.best[k] = moves; save(); }
    showMedal({ title: 'Every sound found its reference', sub: newBest ? 'Fewest flips so far' : `${size} pairs`, stars,
      stats: [[`+${earned + bonus}`, 'points'], [String(moves), 'flips'], [fmtTime(secs), 'time']],
      actions: [{ label: 'Play again', icon: 'replay', primary: true, fn: () => render() }, size === 6 ? { label: 'Try all nine', icon: 'next', fn: () => { P.pairsSize = 9; save(); render(); } } : { label: 'Name that verse', icon: 'target', fn: () => { P.earMode = 'name'; save(); render(); } }] });
  }
  root.append(h('div', { class: 'panel' },
    h('div', { class: 'row between', style: { marginBottom: '16px' } },
      seg([[6, '6 verses'], [9, 'All 9']], size, s => { P.pairsSize = s; save(); render(); }, 'Board size'),
      h('div', { class: 'stats' }, sFound, sMoves)),
    h('p', { class: 'hint-line', style: { marginBottom: '14px' } }, 'Flip a sound card to hear how a verse begins, then find the reference card that goes with it.'),
    grid));
}

/* ============ BIBLE ORDER ============ */
function viewOrder(root) {
  let next = 0, mistakes = 0, t0 = 0, earned = 0;
  const spines = BOOKS.map((b, i) => h('div', { class: 'spine' + (i === 39 ? ' nt' : ''), title: b, style: { height: (36 + ((i * 37) % 23)) + 'px' } }));
  const caption = h('p', { class: 'hint-line', style: { marginTop: '10px', minHeight: '1.4em' } }, 'Each placed verse lights up its book on the shelf.');
  const list = h('ol', { class: 'placed' });
  const ghosts = VERSES.map((_, i) => h('li', { class: 'ghost' }, h('span', { class: 'n' }, i + 1), h('span', {}, '')));
  ghosts.forEach(g => list.append(g));
  const pool = h('div', { class: 'pool' });
  const sMiss = stat('0', 'slips'), sDone = stat('0 / 9', 'placed');
  shuffleNew(VERSES).forEach(v => {
    const c = h('button', { class: 'rchip' }, v.ref); c._v = v;
    c.onclick = () => tap(c); pool.append(c);
  });
  function tap(c) {
    if (!t0) t0 = Date.now();
    const v = c._v;
    if (v.idx === next) {
      c.classList.add('gone'); setTimeout(() => c.remove(), 300);
      const li = h('li', { style: { '--c': v.c } }, h('span', { class: 'n' }, next + 1), h('span', { class: 'medal-sm', style: { width: '30px', height: '30px', boxShadow: 'none' } }, icon(v.icon)), h('b', { style: { fontWeight: 600 } }, v.ref), h('span', { class: 'bk' }, `Book ${v.bookNo} of 66`));
      ghosts[next].replaceWith(li);
      const sp = spines[v.bookNo - 1];
      sp.classList.add('lit'); sp.style.setProperty('--c', sp._c ? `${sp._c}` : v.c);
      if (sp._c) sp.style.background = `linear-gradient(${sp._c} 50%, ${v.c} 50%)`; sp._c = v.c;
      caption.textContent = `${v.book} is book ${v.bookNo} of 66, in the ${v.bookNo <= 39 ? 'Old' : 'New'} Testament.`;
      const pts = 10; earned += pts; addPoints(pts, li); Chime.note(next);
      next++; sDone.val.textContent = `${next} / 9`;
      if (next === 9) setTimeout(finish, 500);
    } else {
      mistakes++; sMiss.val.textContent = mistakes; Chime.wrong();
      c.classList.remove('bad'); void c.offsetWidth; c.classList.add('bad');
    }
  }
  function finish() {
    const secs = Math.round((Date.now() - t0) / 1000);
    const stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1; const bonus = 20 * stars; addPoints(bonus);
    if (mistakes === 0 && (!P.best.order || secs < P.best.order)) { P.best.order = secs; save(); }
    showMedal({ title: 'In Bible order', sub: 'Notice the colors: they run red to violet in the same order', stars,
      stats: [[`+${earned + bonus}`, 'points'], [fmtTime(secs), 'time'], [String(mistakes), mistakes === 1 ? 'slip' : 'slips']],
      actions: [{ label: 'Play again', icon: 'replay', primary: true, fn: () => render() }, { label: 'Match', icon: 'match', fn: () => go('match') }] });
  }
  root.append(h('div', { class: 'panel' },
    h('div', { class: 'row between', style: { marginBottom: '16px' } }, h('div', { class: 'stats' }, sDone, sMiss), h('button', { class: 'btn sm', onclick: () => render() }, icon('shuffle'), 'Shuffle')),
    h('div', { class: 'shelf', 'aria-hidden': 'true' }, spines),
    h('div', { class: 'shelf-legend' }, h('span', {}, 'Old Testament'), h('span', {}, 'New Testament')),
    caption,
    pool,
    list));
}

const VIEWS = { home: viewHome, listen: viewListen, fade: viewFade, type: viewType, build: viewBuild, match: viewMatch, ear: viewEar, order: viewOrder };

/* ============ Boot ============ */
function applyTheme() {
  if (P.theme) document.documentElement.dataset.theme = P.theme; else delete document.documentElement.dataset.theme;
  const dark = P.theme ? P.theme === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
  const tb = $('#themeBtn'); tb.innerHTML = ''; tb.append(icon(dark ? 'sun' : 'moon')); tb.setAttribute('aria-label', dark ? 'Switch to light' : 'Switch to dark');
  document.querySelector('meta[name="theme-color"]').content = dark ? '#121731' : '#F2F3FA';
}
function applyChimes() { const b = $('#chimeBtn'); b.innerHTML = ''; b.append(icon(P.chimes ? 'note' : 'noteoff')); b.setAttribute('aria-pressed', String(!!P.chimes)); b.setAttribute('aria-label', P.chimes ? 'Turn chimes off' : 'Turn chimes on'); }
$('#themeBtn').onclick = () => { const dark = P.theme ? P.theme === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches; P.theme = dark ? 'light' : 'dark'; save(); applyTheme(); };
$('#chimeBtn').onclick = () => { P.chimes = !P.chimes; save(); applyChimes(); if (P.chimes) Chime.tap(); };
document.querySelectorAll('[data-ic]').forEach(s => s.replaceWith(icon(s.dataset.ic === 'flame' ? 'flamesm' : s.dataset.ic)));
document.querySelectorAll('[data-mark]').forEach(s => (s.innerHTML = roseSVG({ mini: true })));
const fav = document.createElement('link'); fav.rel = 'icon'; fav.href = 'data:image/svg+xml,' + encodeURIComponent(roseSVG({ mini: true }).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ')); document.head.append(fav);
$('#ptsN').textContent = P.points.toLocaleString();
$('#streakN').textContent = P.streak.n;
applyTheme(); applyChimes();
document.addEventListener('focusin', e => { if (e.target.matches('input[type=text]') && matchMedia('(max-width: 899px)').matches) document.body.classList.add('kb'); });
document.addEventListener('focusout', e => { if (e.target.matches('input[type=text]')) document.body.classList.remove('kb'); });
window.addEventListener('hashchange', render);
render();
</script>
